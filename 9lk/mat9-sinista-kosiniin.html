<title>Sinistä kosiniin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">

<style>
:root{
  --paper:#EFF2F5; --surface:#FFFFFF; --surface-2:#F7F9FB;
  --grid:#DCE3EA; --line:#C9D3DC;
  --ink:#15222C; --ink-2:#4E626F; --ink-3:#7E8F9B;
  --core:#1B5A9E; --core-soft:#E4EDF6;
  --strong:#1F6E5C; --strong-soft:#E1F0EB;
  --chal:#9A6A16; --chal-soft:#F6EDDC;
  --alert:#A33A2B; --alert-soft:#F8E7E3;
  --shadow:0 1px 2px rgba(21,34,44,.06), 0 8px 24px -12px rgba(21,34,44,.18);
  --r:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0F161B; --surface:#18222A; --surface-2:#1D2830;
    --grid:#22303A; --line:#2E3E4A;
    --ink:#E8EFF4; --ink-2:#A3B4C0; --ink-3:#7A8B97;
    --core:#7FB2E4; --core-soft:#16303F;
    --strong:#77CDB4; --strong-soft:#123028;
    --chal:#E0B267; --chal-soft:#33270F;
    --alert:#E8907F; --alert-soft:#3A1E19;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -14px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --paper:#0F161B; --surface:#18222A; --surface-2:#1D2830;
  --grid:#22303A; --line:#2E3E4A;
  --ink:#E8EFF4; --ink-2:#A3B4C0; --ink-3:#7A8B97;
  --core:#7FB2E4; --core-soft:#16303F;
  --strong:#77CDB4; --strong-soft:#123028;
  --chal:#E0B267; --chal-soft:#33270F;
  --alert:#E8907F; --alert-soft:#3A1E19;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -14px rgba(0,0,0,.7);
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:16px; line-height:1.62;
  background-image:
    linear-gradient(to right, var(--grid) 1px, transparent 1px),
    linear-gradient(to bottom, var(--grid) 1px, transparent 1px);
  background-size:26px 26px;
}
.wrap{max-width:760px; margin:0 auto; padding:28px 20px 90px}
h1,h2,h3,h4{font-family:"Familjen Grotesk","IBM Plex Sans",system-ui,sans-serif; text-wrap:balance}

/* header */
header.top{background:var(--surface); border:1px solid var(--line); border-radius:var(--r);
  box-shadow:var(--shadow); padding:22px 24px; display:flex; gap:18px; align-items:flex-start}
.badge{flex:0 0 auto; width:54px; height:54px; border-radius:9px; display:grid; place-items:center;
  background:var(--core-soft); border:1px solid var(--core); color:var(--core)}
.badge svg{width:28px; height:28px; fill:none; stroke:currentColor; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round}
.eyebrow{font-family:"IBM Plex Mono",monospace; font-size:11px; letter-spacing:.14em;
  text-transform:uppercase; color:var(--ink-3); margin:0 0 5px}
header.top h1{margin:0; font-size:30px; font-weight:700; letter-spacing:-.015em}
header.top p{margin:5px 0 0; color:var(--ink-2); font-size:15px}
.tags{display:flex; flex-wrap:wrap; gap:5px; margin-top:11px}
.tag{font-family:"IBM Plex Mono",monospace; font-size:10.5px; letter-spacing:.05em; padding:2px 7px;
  border-radius:4px; background:var(--surface-2); border:1px solid var(--line); color:var(--ink-3)}
.tag.core{background:var(--core-soft); border-color:var(--core); color:var(--core)}

/* teksti */
article{margin-top:26px}
article h2{font-size:21px; font-weight:600; margin:32px 0 10px; letter-spacing:-.01em}
article p{margin:0 0 14px; max-width:64ch}
.lead{font-size:17.5px; color:var(--ink); border-left:3px solid var(--core); padding-left:16px; margin:0 0 8px}

.box{background:var(--surface); border:1px solid var(--line); border-radius:var(--r);
  padding:18px 22px; box-shadow:var(--shadow); margin:22px 0}
.box h3{margin:0 0 12px; font-size:16.5px; font-weight:600}
.box.warn{border-left:3px solid var(--alert)}
.box.note{border-left:3px solid var(--chal)}

ol.steps{margin:0; padding-left:0; list-style:none; counter-reset:s; display:grid; gap:12px}
ol.steps li{counter-increment:s; display:grid; grid-template-columns:auto 1fr; gap:13px; align-items:start}
ol.steps li::before{content:counter(s); font-family:"Familjen Grotesk",sans-serif; font-weight:700; font-size:14px;
  width:26px; height:26px; border-radius:50%; background:var(--core); color:#fff; display:grid; place-items:center; margin-top:2px}

ul.notes{margin:0; padding-left:19px}
ul.notes li{margin-bottom:7px}
ul.notes li:last-child{margin-bottom:0}

.tablewrap{overflow-x:auto}
table{border-collapse:collapse; width:100%; font-size:14.5px; min-width:460px}
th,td{text-align:left; padding:9px 13px; border-bottom:1px solid var(--line)}
th{font-family:"IBM Plex Mono",monospace; font-size:10.5px; letter-spacing:.1em; text-transform:uppercase;
  color:var(--ink-3); font-weight:400; background:var(--surface-2)}
tr:last-child td{border-bottom:0}
td b{color:var(--core); font-weight:600}
td:last-child{font-variant-numeric:tabular-nums; font-weight:600}

/* lukusuora */
.nl svg{width:100%; height:118px; display:block}
.nl .rail{stroke:var(--line); stroke-width:2}
.nl .tick{stroke:var(--line); stroke-width:1.5}
.nl .stop{fill:var(--ink-3); font-family:"IBM Plex Mono",monospace; font-size:11px}
.nl .stop.near{fill:var(--core); font-weight:600}
.nl .dot{fill:var(--chal)}
.nl .val{fill:var(--ink); font-family:"Familjen Grotesk",sans-serif; font-size:15px; font-weight:700}
.nl .halfway{stroke:var(--chal); stroke-dasharray:3 3; stroke-width:1.5}
.nl-controls{display:flex; align-items:center; gap:14px; margin-top:6px}
.nl-controls input{flex:1; accent-color:var(--core)}
.nl-out{font-family:"Familjen Grotesk",sans-serif; font-size:15px; font-weight:600; min-width:12.5em; text-align:right}

/* paikka-arvotaulu */
.box .ohje{margin:0 0 14px; font-size:14.5px; color:var(--ink-2)}
.nt-valinta{display:flex; flex-wrap:wrap; gap:7px; margin-bottom:16px}
.nt-valinta button{font:inherit; font-size:12.5px; font-family:"IBM Plex Mono",monospace; padding:5px 11px;
  border-radius:6px; border:1px solid var(--line); background:var(--surface-2); color:var(--ink-2); cursor:pointer}
.nt-valinta button[aria-pressed="true"]{background:var(--ink); color:var(--paper); border-color:var(--ink)}
.nt-valinta button:focus-visible{outline:2px solid var(--core); outline-offset:2px}
.nt-taulu{display:flex; flex-direction:column; gap:4px; align-items:flex-start; overflow-x:auto; padding-bottom:4px}
.nt-rivi{display:flex; gap:6px; align-items:center}
.nt-rivi .otsa{font-family:"IBM Plex Mono",monospace; font-size:9.5px; letter-spacing:.08em;
  text-transform:uppercase; color:var(--ink-3); width:52px; text-align:center}
.nt-ruutu{width:52px; height:52px; display:grid; place-items:center; border:1.5px solid var(--line);
  border-radius:7px; background:var(--surface-2); font-family:"IBM Plex Mono",monospace; font-size:24px}
.nt-ruutu.kohta{border-color:var(--core); background:var(--core-soft); color:var(--core); font-weight:500}
.nt-ruutu.ratkaiseva{border-color:var(--chal); background:var(--chal-soft); color:var(--chal); font-weight:500}
.nt-ruutu.nolla{color:var(--ink-3)}
.nt-rivi .nimi{font-size:12.5px; color:var(--ink-3); margin-left:12px; white-space:nowrap}
.nt-nuoli{font-size:17px; color:var(--chal); margin-left:6px}
.nt-selite{margin:14px 0 0; font-size:14.5px}
.nt-selite b{color:var(--core)}

/* vahvuusportaat */
.vp-tasot{display:grid; gap:9px; margin-bottom:18px}
.vp-taso{display:flex; gap:11px; align-items:flex-start; font-size:13.5px}
.vp-taso .vp-pallo{width:13px; height:13px; border-radius:4px; margin-top:5px; flex:0 0 auto}
.vp-taso[data-taso="sulkeet"] .vp-pallo{background:var(--core)}
.vp-taso[data-taso="kertojako"] .vp-pallo{background:var(--strong)}
.vp-taso[data-taso="yhteenvahennys"] .vp-pallo{background:var(--chal)}
.vp-taso strong{display:block; font-family:"Familjen Grotesk",sans-serif; font-weight:600; font-size:14.5px}
.vp-taso span{color:var(--ink-2)}
.vp-lauseke{display:flex; flex-wrap:wrap; gap:7px; align-items:flex-end; font-family:"IBM Plex Mono",monospace;
  font-size:25px; padding:10px 2px; min-height:64px}
.vp-lauseke .t{padding:2px 3px}
.vp-lauseke .op{position:relative; padding:2px 9px; border-radius:6px; font-weight:500}
.vp-lauseke .op[data-taso="sulkeet"]{background:var(--core-soft); color:var(--core)}
.vp-lauseke .op[data-taso="kertojako"]{background:var(--strong-soft); color:var(--strong)}
.vp-lauseke .op[data-taso="yhteenvahennys"]{background:var(--chal-soft); color:var(--chal)}
.vp-lauseke .op i{position:absolute; top:-9px; right:-6px; font-style:normal; font-family:"Familjen Grotesk",sans-serif;
  font-size:11px; font-weight:700; width:18px; height:18px; border-radius:50%; display:grid; place-items:center;
  background:currentColor}
.vp-lauseke .op i span{color:var(--surface)}
.vp-rivi{display:flex; align-items:center; gap:16px; margin-top:8px}
.vp-vastaus{font-family:"Familjen Grotesk",sans-serif; font-size:16px; font-weight:600; color:var(--strong)}

/* laskujärjestys-widget */
.lj-exp{display:flex; flex-wrap:wrap; gap:7px; align-items:center; font-family:"IBM Plex Mono",monospace;
  font-size:23px; padding:14px 4px; min-height:62px}
.lj-exp .tok{padding:2px 4px; color:var(--ink)}
.lj-exp button.op{font-family:"IBM Plex Mono",monospace; font-size:23px; padding:3px 12px; border-radius:7px;
  border:1.5px solid var(--line); background:var(--surface-2); color:var(--ink); line-height:1.2}
.lj-exp button.op:hover{border-color:var(--core); color:var(--core)}
.lj-exp button.op:focus-visible{outline:2px solid var(--core); outline-offset:2px}
.lj-exp .valmis{font-family:"Familjen Grotesk",sans-serif; font-size:23px; font-weight:700; color:var(--strong)}
.lj-fb{font-size:14.5px; min-height:1.5em; color:var(--ink-2)}
.lj-fb.no{color:var(--alert)}
.lj-fb.ok{color:var(--strong)}
.lj-row{display:flex; align-items:center; gap:14px; margin-top:10px}
.lj-step{font-family:"IBM Plex Mono",monospace; font-size:11.5px; letter-spacing:.1em;
  text-transform:uppercase; color:var(--ink-3)}

/* harjoitukset */
.progress{position:sticky; top:0; z-index:5; background:var(--surface); border:1px solid var(--line);
  border-radius:var(--r); padding:12px 18px; box-shadow:var(--shadow); display:flex; align-items:center;
  gap:14px; margin:34px 0 18px}
.progress .lbl{font-family:"IBM Plex Mono",monospace; font-size:11px; letter-spacing:.12em;
  text-transform:uppercase; color:var(--ink-3); white-space:nowrap}
.progress .meter{flex:1; height:7px; border-radius:4px; background:var(--surface-2); border:1px solid var(--line); overflow:hidden}
.progress .meter i{display:block; height:100%; background:var(--core); transition:width .25s ease}
.progress .cnt{font-family:"Familjen Grotesk",sans-serif; font-weight:700; font-variant-numeric:tabular-nums; white-space:nowrap}

.grp{margin-top:26px}
.grp-head{display:flex; align-items:baseline; gap:10px; border-bottom:1.5px solid var(--ink); padding-bottom:7px; margin-bottom:14px}
.grp-head h3{margin:0; font-size:17px; font-weight:600}
.grp-head span{font-size:12.5px; color:var(--ink-2)}

.ex{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:14px 16px; margin-bottom:10px}
.ex[data-tila="oikein"]{border-color:var(--strong); box-shadow:inset 3px 0 0 var(--strong)}
.ex[data-tila="vaarin"]{border-color:var(--alert); box-shadow:inset 3px 0 0 var(--alert)}
.ex .q{display:flex; gap:11px; align-items:baseline; flex-wrap:wrap}
.ex .num{font-family:"IBM Plex Mono",monospace; font-size:11.5px; color:var(--ink-3); min-width:2.4em}
.ex .txt{flex:1; min-width:190px; font-size:15.5px}
.ex .txt .aineisto{display:block; margin-bottom:9px; padding-left:12px;
  border-left:2px solid var(--line); color:var(--ink-2); line-height:1.6;
  /* Aineisto voi olla pieni taulukko, jonka rivit on erotettu rivinvaihdoilla.
     Ilman pre-lineä ne valuisivat yhdeksi kappaleeksi ja taulukko katoaisi. */
  white-space:pre-line}
.ex .txt .kysymysrivi{display:block; font-weight:600}
.ex .row{display:flex; gap:8px; align-items:center; margin-top:11px; flex-wrap:wrap}
.ex input[type=text]{font:inherit; font-family:"IBM Plex Mono",monospace; font-size:15px; width:8.5em;
  padding:7px 11px; border:1px solid var(--line); border-radius:7px; background:var(--surface-2);
  color:var(--ink); text-align:right}
.ex input:focus-visible{outline:2px solid var(--core); outline-offset:1px}
button{font:inherit; cursor:pointer}
.btn{font-size:13.5px; padding:7px 15px; border-radius:7px; border:1px solid var(--core);
  background:var(--core); color:#fff}
.btn.ghost{background:transparent; color:var(--ink-2); border-color:var(--line)}
.btn:focus-visible{outline:2px solid var(--core); outline-offset:2px}
.btn.mv-valinta{text-align:left}
/* kuuntelutehtävä: selaimen puhesynteesi lukee englanninkielisen tekstin */
.kuuntele{display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin:2px 0 10px}
.kuuntele .btn{display:inline-flex; gap:7px; align-items:center}
.kuuntele svg{width:16px; height:16px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round}
.kuuntele .varateksti{flex-basis:100%; font-size:14px; color:var(--ink-2); background:var(--surface-2);
  border-radius:7px; padding:8px 12px; margin:0}
.btn.mv-valinta:disabled{cursor:default; opacity:.65}
.btn.mv-oikein{background:var(--strong-soft); border-color:var(--strong); color:var(--strong); opacity:1}
.btn.mv-vaarin{background:var(--alert-soft); border-color:var(--alert); color:var(--alert); opacity:1}
.row.mv{gap:8px 10px}
.fb{margin-top:11px; font-size:14.5px; padding:10px 13px; border-radius:8px; line-height:1.5}
.fb.ok{background:var(--strong-soft); color:var(--strong)}
.fb.no{background:var(--alert-soft); color:var(--alert)}
.fb.hint{background:var(--chal-soft); color:var(--chal)}

.done{background:var(--strong-soft); border:1px solid var(--strong); color:var(--strong);
  border-radius:var(--r); padding:16px 20px; margin-top:20px; font-size:15.5px}
.done h3{margin:0 0 4px; font-size:17px; color:var(--strong)}

details.teacher{margin-top:34px; background:var(--surface); border:1px solid var(--line);
  border-left:3px solid var(--chal); border-radius:var(--r); padding:15px 20px; box-shadow:var(--shadow)}
details.teacher summary{cursor:pointer; font-family:"Familjen Grotesk",sans-serif; font-weight:600; font-size:15px}
details.teacher summary:focus-visible{outline:2px solid var(--core); outline-offset:3px}
details.teacher ul{margin:12px 0 0; padding-left:19px; color:var(--ink-2); font-size:14.5px}
details.teacher li{margin-bottom:8px}
details.teacher p{margin:12px 0 0; color:var(--ink-2); font-size:14.5px}

.back{display:inline-block; margin-top:30px; font-size:13.5px; color:var(--ink-2)}
.back a{color:var(--core)}

@media (prefers-reduced-motion: reduce){*{transition:none !important}}
@media (max-width:560px){
  .wrap{padding:16px 13px 70px}
  header.top h1{font-size:25px}
  .progress{flex-wrap:wrap}
}
</style>

<div class="wrap">

  <header class="top">
    <span class="badge"><svg viewBox="0 0 24 24" aria-hidden="true" id="ikoni"></svg></span>
    <div>
      <p class="eyebrow" id="eyebrow"></p>
      <h1 id="otsikko"></h1>
      <p id="kuvaus"></p>
      <div class="tags" id="tags"></div>
    </div>
  </header>

  <article id="teksti"></article>

  <div class="progress" aria-live="polite">
    <span class="lbl">Harjoitukset</span>
    <span class="meter"><i id="pbar" style="width:0%"></i></span>
    <span class="cnt" id="pcnt">0 / 20</span>
  </div>

  <div id="harjoitukset"></div>
  <div id="valmis"></div>

  <p class="back" id="back"></p>

</div>

<script>
const D = {"tavoite_id":"MAT9-GEO-03","oppiaine":"MAT","vuosiluokka":9,"otsikko":"Sinistä kosiniin","kuvaus":"Osaan valita sinin, kosinin tai tangentin ja ratkaista annetun suorakulmaisen kolmion kaikki sivut ja kulmat.","versio":"0.2","paivitetty":"2026-10-11","ops":{"T":["T6","T16","T17"],"S":["S5"]},"taso":"ydin","ikoni":"tyokalu","eyebrow":"Matematiikka · 9. luokka · Geometria","teksti":[{"tyyppi":"johdanto","sisalto":"Kesätyössä rakennetaan pihalle pyörätuoliluiskaa. Luiskan pituus on mitattu valmiiksi, ja säädösten mukaan sen kaltevuuskulma on tiedossa. Työnjohtaja kysyy, kuinka korkealle luiskan yläpää nousee, jotta tasanne voidaan rakentaa oikeaan korkeuteen. Luiska, maa ja yläpään kohdalta maahan pudotettu luotilanka muodostavat suorakulmaisen kolmion, jonka suora kulma on luotilangan alapäässä. Tangentista ei ole suoraan apua, koska tangentti yhdistää kaksi kateettia, mutta luiska on hypotenuusa. Tarvitaan kaksi uutta suhdetta, sini ja kosini. Niillä ja tangentilla ratkaiset suorakulmaisesta kolmiosta kaikki sivut ja kulmat, kun tunnet kaksi sivua tai yhden sivun ja yhden terävän kulman. Käytä laskinta astetilassa (DEG)."},{"tyyppi":"kappale","otsikko":"Sini ja kosini","sisalto":"Suorakulmaisessa kolmiossa terävällä kulmalla α on vastainen kateetti (kulmaa vastapäätä), viereinen kateetti (kulman kärjestä lähtevä kateetti) ja hypotenuusa (suoran kulman vastainen sivu). Tangentista tiedät, että tan α = vastainen kateetti : viereinen kateetti. Sini ja kosini ottavat mukaan hypotenuusan: sin α = vastainen kateetti : hypotenuusa ja cos α = viereinen kateetti : hypotenuusa. Kolmiossa ABC, jossa kulma C on suora, sin A = BC/AB, cos A = AC/AB ja tan A = BC/AC. Kulman B kannalta sama sivu BC on viereinen kateetti, joten cos B = BC/AB. Sivun nimi riippuu siis siitä, mistä kulmasta katsot. Miksi sin α on sama luku kolmion koosta riippumatta? Perustelu on sama kuin tangentilla: kaksi suorakulmaista kolmiota, joilla on yhtä suuri terävä kulma α, ovat yhdenmuotoiset, koska niiden kulmat ovat 90°, α ja 90° − α. Yhdenmuotoisissa kolmioissa saman kolmion kahden sivun suhde on sama kuin vastinsivujen suhde toisessa kolmiossa. Jos piirrät kaksi suorakulmaista kolmiota, joissa on 40°:n kulma, toisen hypotenuusaksi 5 cm ja toisen 10 cm, kulman vastaiset kateetit ovat noin 3,2 cm ja 6,4 cm. Suhde on molemmissa noin 0,64, ja laskin antaa sin 40° ≈ 0,643. Kateetti on lyhyempi kuin hypotenuusa, joten suorakulmaisen kolmion terävän kulman sini ja kosini ovat aina 0:n ja 1:n välissä. Tangentti voi olla myös yli 1. Nämä määritelmät koskevat vain suorakulmaista kolmiota: kolmiossa, jossa ei ole suoraa kulmaa, ei ole kateetteja eikä hypotenuusaa, joten sinillä, kosinilla ja tangentilla ei voi laskea sen sivuja tällä tavalla. Siksi tehtävässä kerrotaan aina, mikä kulma on suora. Jos kolmion kulmat ovat esimerkiksi 50°, 60° ja 70°, mikään niistä ei ole suora, eikä laskua 9 · sin 50° voi käyttää minkään sivun laskemiseen."},{"tyyppi":"taulukko","otsikko":"Valitse funktio sivuista","otsikkorivi":["Mukana olevat sivut (tunnettu ja kysytty)","Funktio","Kolmiossa ABC (kulma C suora), kulma A"],"rivit":[["kulman vastainen kateetti ja hypotenuusa","sini","sin A = BC/AB"],["kulman viereinen kateetti ja hypotenuusa","kosini","cos A = AC/AB"],["kulman vastainen ja viereinen kateetti","tangentti","tan A = BC/AC"],["kaksi sivua tunnetaan, kolmas kysytään (ei kulmaa)","Pythagoraan lause","AC² + BC² = AB²"]]},{"tyyppi":"saanto","otsikko":"Näin lasket sivun kulman avulla","askeleet":["Piirrä luonnos ja merkitse suora kulma, tunnettu kulma, tunnettu sivu ja kysytty sivu.","Nimeä tunnettu ja kysytty sivu tunnetun kulman kannalta: vastainen kateetti, viereinen kateetti vai hypotenuusa.","Valitse funktio, jossa juuri nämä kaksi sivua ovat mukana. Esimerkki: kolmiossa ABC kulma C on suora, AB = 12,0 cm ja kulma A = 40°, ja kysytään AC. AC on kulman A viereinen kateetti ja AB hypotenuusa, joten valitaan kosini: cos 40° = AC/12,0.","Ratkaise kysytty sivu. Kun kysytty sivu on osoittajassa, kerro: AC = 12,0 · cos 40° ≈ 9,2 cm. Kun kysytty sivu on nimittäjässä, kirjoita verranto ja ratkaise se. Esimerkiksi BC = 5,0 cm, kulma A = 40° ja kysytään AB: sin 40° = 5,0/AB. Kerro molemmat puolet AB:llä, AB · sin 40° = 5,0, ja jaa luvulla sin 40°: AB = 5,0 : sin 40° ≈ 7,8 cm.","Tarkista laskimen tila ennen laskua: astetilassa tan 45 = 1. Radiaanitilassa laskin antaa sin 40 ≈ 0,745, joka näyttää uskottavalta, vaikka se on väärä (astetilassa sin 40° ≈ 0,643). Siksi tilaa ei voi päätellä pelkästä tuloksesta.","Pidä välivaiheet laskimessa tarkkoina ja pyöristä vain vastaus pyydettyyn tarkkuuteen. Millimetrin tarkkuus senttimetreinä tarkoittaa yhtä desimaalia.","Arvioi tulos: kateetin pitää olla lyhyempi kuin hypotenuusa, ja pienemmän terävän kulman vastainen kateetti on lyhyempi kateetti."]},{"tyyppi":"ansa","otsikko":"Ansa 1: sini ja kosini vaihtuvat","sisalto":"Kolmiossa ABC kulma C on suora, AB = 15,0 cm ja kulma A = 28°, ja kysytään BC. Jos lasket BC = 15,0 · cos 28°, saat 13,2 cm, mutta se on väärin. BC on kulman A vastainen kateetti, joten oikea funktio on sini: BC = 15,0 · sin 28° ≈ 7,0 cm. Kosini antoi viereisen kateetin AC. Pythagoraan lause ei paljasta tätä virhettä: vaihdetut tulokset 13,2 cm ja 7,0 cm täyttävät lauseen täsmälleen yhtä hyvin kuin oikeat, koska ne ovat samat kaksi lukua väärissä paikoissa. Virheen paljastaa järjestys: pienempää terävää kulmaa vastaa lyhyempi kateetti, ja kulma A = 28° on pienempi kuin kulma B = 62°, joten BC on lyhyempi kateetti. Tämä johtuu tangentista: kun kulma on alle 45°, tan α on alle 1, joten vastainen kateetti on viereistä lyhyempi. Myös tangenttitarkistus paljastaa vaihdon: BC : AC pitää olla tan 28° ≈ 0,532, mutta väärillä tuloksilla 13,2 : 7,0 ≈ 1,9."},{"tyyppi":"ansa","otsikko":"Ansa 2: hypotenuusa jaetaan, ei kerrota","sisalto":"Kolmiossa ABC kulma C on suora, AC = 9,0 cm ja kulma A = 52°, ja kysytään hypotenuusaa AB. Kosini on oikea valinta, koska mukana ovat viereinen kateetti ja hypotenuusa. Houkutteleva lasku AB = 9,0 · cos 52° ≈ 5,5 cm on silti väärin: tulos on lyhyempi kuin kateetti 9,0 cm, eikä hypotenuusa voi olla kateettia lyhyempi. Kirjoita aina ensin yhtälö cos 52° = 9,0/AB. Kysytty sivu on nimittäjässä, joten ratkaisu on AB = 9,0 : cos 52° ≈ 14,6 cm. Jos sekoitat lisäksi funktiot ja lasket 9,0 : sin 52°, saat 11,4 cm. Se on hypotenuusaksi mahdollinen pituus, joten sen paljastaa vasta tarkistus: kulman A viereinen kateetti on cos 52° kertaa hypotenuusa, ja 11,4 · cos 52° ≈ 7,0 eikä 9,0."},{"tyyppi":"kappale","otsikko":"Kulma kahdesta sivusta","sisalto":"Kun tunnet kaksi sivua, valitse funktio samalla säännöllä: mitkä sivut ovat mukana kysytyn kulman kannalta. Laske ensin suhde ja sitten kulma käänteistoiminnolla: sin⁻¹, cos⁻¹ tai tan⁻¹ (laskimessa usein SHIFT tai 2nd ja sitten sin, cos tai tan). Esimerkki: kolmiossa ABC kulma C on suora, BC = 7,0 cm ja AB = 11,0 cm, ja kysytään kulmaa A. BC on kulman A vastainen kateetti ja AB hypotenuusa, joten sin A = 7,0/11,0 ≈ 0,636 ja A = sin⁻¹(7,0/11,0) ≈ 39,5°. Jos käytät vahingossa kosinia, saat 50,5°, joka on kulma B. Toinen esimerkki: AC = 6,0 cm ja AB = 10,0 cm. AC on kulman A viereinen kateetti, joten cos A = 6,0/10,0 = 0,6 ja A ≈ 53,1°. Suhde 0,6 ei ole kulma: jos unohdat käänteistoiminnon, saat vastaukseksi luvun, joka ei ole asteita. Sinin ja kosinin käänteistoiminto antaa virheilmoituksen, jos suhde on yli 1. Silloin olet jakanut hypotenuusalla väärin päin."},{"tyyppi":"ansa","otsikko":"Ansa 3: tangentti, vaikka mukana on hypotenuusa","sisalto":"Edellisen esimerkin kolmiossa BC = 7,0 cm ja AB = 11,0 cm. Jos lasket tan A = 7,0/11,0, saat A ≈ 32,5°, mutta se on väärin. Tangentti on kahden kateetin suhde, ja AB on hypotenuusa. Kun toinen tunnetuista sivuista on hypotenuusa, kyseeseen tulevat vain sini ja kosini. Etsi siksi ensin hypotenuusa: se on sivu, jonka nimessä ei ole suoran kulman kirjainta."},{"tyyppi":"kappale","otsikko":"Koko kolmio ja tarkistus toisella tavalla","sisalto":"Ratkaista kolmio tarkoittaa, että lasket kaikki puuttuvat sivut ja kulmat. Kun tunnet yhden terävän kulman, toinen saadaan kulmien summasta: suorakulmaisen kolmion terävät kulmat ovat yhteensä 90°, joten kulma B = 90° − kulma A. Kun tunnet kaksi sivua, kolmas saadaan Pythagoraan lauseella. Esimerkiksi ansan 1 kolmiosta, jossa AB = 15,0 cm ja kulma A = 28°, saadaan B = 90° − 28° = 62°, BC = 15,0 · sin 28° ≈ 7,0 cm ja AC = 15,0 · cos 28° ≈ 13,2 cm. Kahdesta sivusta, esimerkiksi AC = 8,0 cm ja AB = 17,0 cm, saadaan BC² + 8,0² = 17,0² eli BC = √(17,0² − 8,0²) = 15,0 cm, kulma A = cos⁻¹(8,0/17,0) ≈ 61,9° ja B ≈ 90° − 61,9° = 28,1°. Pythagoraan lauseessa hypotenuusa on aina yksin yhtälön toisella puolella. Jos kirjoitat BC = √(17,0² + 8,0²) ≈ 18,8 cm, kateetista tulee pidempi kuin hypotenuusa. Tarkista ainakin yksi tulos toisella tavalla. Pythagoraan lause ja kulmien summa paljastavat laskuvirheet: laske kolmas sivu myös toisella keinolla tai laske toinen kulma trigonometrialla sivuista ja katso, että kulmat ovat yhteensä 90°. Sinin ja kosinin vaihtumista eivät paljasta Pythagoraan lause eikä pelkkä 90° − A. Sen paljastavat tangenttitarkistus, sivujen järjestys tai toinen kulma laskettuna sivuista, koska silloin kulmien summa ei ole 90° (ks. ansa 1). Käytä tarkistuksessa laskimen tarkkoja välivaiheita. Pyöristetyillä arvoilla 7,0² + 13,2² = 223,24, vaikka hypotenuusan neliö on 225. Ero johtuu pyöristyksestä eikä virheestä: laskimen tarkoilla arvoilla 7,042…² + 13,244…² = 225,0."},{"tyyppi":"muistilappu","otsikko":"Muista nämä","kohdat":["sin α = vastainen kateetti : hypotenuusa, cos α = viereinen kateetti : hypotenuusa, tan α = vastainen : viereinen.","Suhteet riippuvat vain kulmasta, koska suorakulmaiset kolmiot, joilla on sama terävä kulma, ovat yhdenmuotoiset.","Valitse funktio sen mukaan, mitkä kaksi sivua ovat mukana: tunnettu ja kysytty.","Kysytty sivu osoittajassa: kerro. Kysytty sivu nimittäjässä: kirjoita verranto ja jaa. Hypotenuusa on aina pisin sivu.","Kulma lasketaan käänteistoiminnolla sin⁻¹, cos⁻¹ tai tan⁻¹. Laskin astetilassa: tan 45 = 1.","Toinen terävä kulma on 90° miinus tunnettu kulma. Kolmas sivu Pythagoraan lauseella, hypotenuusa yksin toisella puolella.","Pythagoras paljastaa laskuvirheen, samoin kulmien summa, kun toinen kulma on laskettu sivuista. Tangentti tai sivujen järjestys paljastaa sinin ja kosinin vaihtumisen. Tarkista laskimen tarkoilla arvoilla.","Sini, kosini ja tangentti määritellään näin vain suorakulmaisessa kolmiossa."]}],"harjoitusryhmat":[{"id":"sivu","nimi":"Sivu kulman avulla","info":"Laskin on sallittu, astetila (DEG). Nimeä ensin tunnettu ja kysytty sivu tunnetun kulman kannalta ja valitse funktio, jossa ne ovat mukana. Kysytty sivu nimittäjässä: jaa. Anna vastaus pyydetyllä tarkkuudella ilman yksikköä."},{"id":"kulma","nimi":"Kulma kahdesta sivusta","info":"Laskin on sallittu, astetila (DEG). Valitse funktio sen mukaan, mitkä sivut ovat mukana kysytyn kulman kannalta, ja laske kulma käänteistoiminnolla. Anna vastaus asteina ilman astemerkkiä."},{"id":"koko","nimi":"Koko kolmio ja tarkistus","info":"Laskin on sallittu, astetila (DEG). Toinen terävä kulma on 90° miinus tunnettu kulma, ja kolmas sivu saadaan Pythagoraan lauseella. Pidä välivaiheet laskimessa tarkkoina."}],"harjoitukset":[{"id":"H01","ryhma":"sivu","kysymys":"Kolmiossa ABC kulma C on suora. Tunnetaan AB ja kulma B, ja kysytään AC. Mikä funktio yhdistää ne?","vastaus":0,"vinkki":"Katso sivuja kulman B kannalta. Kumpi AC on: vastainen vai viereinen kateetti?","selitys":"AC on kulmaa B vastapäätä, joten se on kulman B vastainen kateetti, ja AB on hypotenuusa. Vastainen kateetti ja hypotenuusa ovat sinissä: sin B = AC/AB.","tyyppi":"monivalinta","vaihtoehdot":["sin B","cos B","tan B"]},{"id":"H02","ryhma":"sivu","kysymys":"Kolmiossa ABC kulma C on suora, AB = 20 cm, BC = 12 cm ja AC = 16 cm. Laske sin A. Anna vastaus desimaalilukuna.","vastaus":0.6,"vinkki":"Kulman A vastainen kateetti on sivu, jonka nimessä ei ole kirjainta A.","selitys":"BC on kulman A vastainen kateetti ja AB hypotenuusa: sin A = 12/20 = 0,6. Vastaus 0,8 syntyy, jos käytät viereistä kateettia AC: se on cos A."},{"id":"H03","ryhma":"sivu","kysymys":"Kolmiossa KLM kulma M on suora, KL = 25 cm, KM = 24 cm ja LM = 7 cm. Laske cos L. Anna vastaus desimaalilukuna.","vastaus":0.28,"vinkki":"Kulman L viereinen kateetti lähtee kärjestä L ja päättyy suoran kulman kärkeen M.","selitys":"Hypotenuusa on KL, koska sen nimessä ei ole suoran kulman kirjainta M. Kulman L viereinen kateetti on LM: cos L = 7/25 = 0,28. Vastaus 0,96 on sin L, eli siinä on käytetty vastaista kateettia KM."},{"id":"H04","ryhma":"sivu","kysymys":"Laske cos 63° kolmen desimaalin tarkkuudella.","vastaus":0.454,"vinkki":"Tarkista ensin, että laskin on astetilassa: tan 45 = 1.","selitys":"Astetilassa cos 63° = 0,45399…, joten kolmen desimaalin tarkkuudella cos 63° ≈ 0,454. Radiaanitilassa laskin näyttää 0,986."},{"id":"H05","ryhma":"sivu","kysymys":"Kolmiossa ABC kulma C on suora, AB = 13,0 cm ja kulma A = 27°. Laske BC millimetrin tarkkuudella. Anna vastaus senttimetreinä ilman yksikköä.","vastaus":5.9,"vinkki":"BC on kulman A vastainen kateetti ja AB hypotenuusa.","selitys":"Vastainen kateetti ja hypotenuusa: sin 27° = BC/13,0, joten BC = 13,0 · sin 27° ≈ 5,9 cm. Vastaus 11,6 syntyy kosinilla, joka antaa viereisen kateetin AC."},{"id":"H06","ryhma":"sivu","kysymys":"Kolmiossa ABC kulma C on suora, AB = 15,0 cm ja kulma B = 63°. Laske BC millimetrin tarkkuudella. Anna vastaus senttimetreinä ilman yksikköä.","vastaus":6.8,"vinkki":"Katso sivua BC kulman B kannalta.","selitys":"BC lähtee kärjestä B, joten se on kulman B viereinen kateetti: cos 63° = BC/15,0 ja BC = 15,0 · cos 63° ≈ 6,8 cm. Vastaus 13,4 syntyy sinillä."},{"id":"H07","ryhma":"sivu","kysymys":"Kolmiossa ABC kulma C on suora, AC = 10,5 cm ja kulma A = 25°. Laske hypotenuusa AB millimetrin tarkkuudella. Anna vastaus senttimetreinä ilman yksikköä.","vastaus":11.6,"vinkki":"Kirjoita ensin cos 25° = 10,5/AB. Kysytty sivu on nimittäjässä.","selitys":"AC on kulman A viereinen kateetti: cos 25° = 10,5/AB, joten AB · cos 25° = 10,5 ja AB = 10,5 : cos 25° ≈ 11,6 cm. Vastaus 9,5 syntyy kertomalla. Se on lyhyempi kuin kateetti 10,5 cm, joten se ei voi olla hypotenuusa."},{"id":"H08","ryhma":"kulma","kysymys":"Kolmiossa ABC kulma C on suora. Tunnetaan BC ja AB, ja kysytään kulma B. Millä funktiolla kulma lasketaan?","vastaus":1,"vinkki":"BC lähtee kärjestä B. AB on hypotenuusa.","selitys":"BC on kulman B viereinen kateetti ja AB hypotenuusa, joten cos B = BC/AB ja B = cos⁻¹(BC/AB). Kulman A kannalta sama sivu BC olisi vastainen kateetti.","tyyppi":"monivalinta","vaihtoehdot":["sin B","cos B","tan B"]},{"id":"H09","ryhma":"kulma","kysymys":"Kolmiossa ABC kulma C on suora, BC = 5,0 cm ja AB = 12,0 cm. Laske kulma A asteen kymmenesosan tarkkuudella. Anna vastaus asteina ilman astemerkkiä.","vastaus":24.6,"vinkki":"BC on kulman A vastainen kateetti ja AB hypotenuusa. Käytä käänteistoimintoa sin⁻¹.","selitys":"sin A = 5,0/12,0 ≈ 0,417, joten A = sin⁻¹(5,0/12,0) ≈ 24,6°. Vastaus 65,4 syntyy kosinilla ja 22,6 tangentilla. Vastaus 0,4 kertoo, että käänteistoiminto on unohtunut."},{"id":"H10","ryhma":"kulma","kysymys":"Kolmiossa ABC kulma C on suora, AC = 14,5 cm ja AB = 18,0 cm. Laske kulma A asteen tarkkuudella. Anna vastaus asteina ilman astemerkkiä.","vastaus":36.0,"vinkki":"AC on kulman A viereinen kateetti.","selitys":"cos A = 14,5/18,0 ≈ 0,806, joten A = cos⁻¹(14,5/18,0) ≈ 36°. Sinillä saisit 54°, joka on kulma B."},{"id":"H11","ryhma":"kulma","kysymys":"Kolmiossa ABC kulma C on suora, BC = 8,5 cm ja AC = 17,5 cm. Laske kulma A asteen kymmenesosan tarkkuudella. Anna vastaus asteina ilman astemerkkiä.","vastaus":25.9,"vinkki":"Kumpikin tunnettu sivu on kateetti. Kumpi on kulman A vastainen?","selitys":"Hypotenuusa ei ole mukana, joten käytetään tangenttia. BC on kulman A vastainen ja AC viereinen kateetti: tan A = 8,5/17,5 ≈ 0,486 ja A ≈ 25,9°. Vastaus 64,1 syntyy, jos kateetit vaihtuvat."},{"id":"H12","ryhma":"kulma","kysymys":"Kolmiossa ABC kulma C on suora, AC = 9,5 cm ja AB = 11,5 cm. Laske kulma B asteen tarkkuudella. Anna vastaus asteina ilman astemerkkiä.","vastaus":56.0,"vinkki":"Katso sivua AC kulman B kannalta.","selitys":"AC on kulmaa B vastapäätä, joten se on kulman B vastainen kateetti: sin B = 9,5/11,5 ≈ 0,826 ja B ≈ 56°. Vastaus 34 syntyy kosinilla, ja se on kulma A."},{"id":"H13","ryhma":"kulma","kysymys":"Kolmiossa ABC kulma C on suora, AC = 4,8 cm, BC = 6,4 cm ja AB = 8,0 cm. Laske kulma A sinin avulla ja kulma B kosinin avulla, kumpikin asteen kymmenesosan tarkkuudella, ja tarkista, että niiden summa on 90°. Mikä on kulma B? Anna vastaus asteina ilman astemerkkiä.","vastaus":36.9,"vinkki":"Kulman A vastainen kateetti on BC. Kulman B viereinen kateetti on myös BC.","selitys":"sin A = 6,4/8,0 = 0,8, joten A ≈ 53,1°. cos B = 6,4/8,0 = 0,8, joten B ≈ 36,9°. Summa on 53,1° + 36,9° = 90,0°, kuten suorakulmaisen kolmion terävillä kulmilla pitää olla. Tämä on tarkistus: jos summa ei ole 90°, jompikumpi kulma on laskettu väärällä sivulla. Esimerkiksi sin B = 6,4/8,0 antaisi B ≈ 53,1° ja summaksi noin 106°."},{"id":"H14","ryhma":"koko","kysymys":"Kolmiossa ABC kulma C on suora ja kulma A = 23,6°. Laske kulma B. Anna vastaus asteina ilman astemerkkiä.","vastaus":66.4,"vinkki":"Suorakulmaisen kolmion terävät kulmat ovat yhteensä 90°.","selitys":"Kolmion kulmien summa on 180° ja suora kulma on 90°, joten terävät kulmat ovat yhteensä 90°: B = 90° − 23,6° = 66,4°."},{"id":"H15","ryhma":"koko","kysymys":"Kolmiossa ABC kulma C on suora, AB = 10,0 cm ja AC = 8,0 cm. Laske BC Pythagoraan lauseella millimetrin tarkkuudella. Anna vastaus senttimetreinä ilman yksikköä.","vastaus":6.0,"vinkki":"AB on hypotenuusa, joten se on yksin yhtälön toisella puolella: BC² + 8,0² = 10,0².","selitys":"BC² = 10,0² − 8,0² = 100 − 64 = 36, joten BC = 6,0 cm. Vastaus 12,8 syntyy, jos neliöt lasketaan yhteen. Se on pidempi kuin hypotenuusa, joten se ei voi olla kateetti."},{"id":"H16","ryhma":"koko","kysymys":"Kolmiossa ABC kulma C on suora, AB = 14,0 cm ja kulma A = 31°. Laske ensin kulma B ja sitten AC kulman B avulla. Mikä on AC millimetrin tarkkuudella? Anna vastaus senttimetreinä ilman yksikköä.","vastaus":12.0,"vinkki":"Kulma B = 90° − 31°. AC on kulman B vastainen kateetti.","selitys":"B = 90° − 31° = 59°. AC on kulman B vastainen kateetti ja AB hypotenuusa: AC = 14,0 · sin 59° ≈ 12,0 cm. Sama tulos tulee kulman A kosinista: AC = 14,0 · cos 31° ≈ 12,0 cm. Vastaus 7,2 syntyy, jos kulman B kosinia käytetään sinin paikalla."},{"id":"H17","ryhma":"koko","kysymys":"Leijan naru on kiinnitetty maahan lyötyyn tappiin. Naru on 36,0 m pitkä, pingottunut suoraksi ja muodostaa vaakasuoran maan kanssa 42°:n kulman. Leija on suoraan maassa olevan pisteen P yläpuolella, joten tappi, leija ja piste P muodostavat suorakulmaisen kolmion, jonka suora kulma on pisteessä P. Kuinka korkealla leija on? Anna vastaus metreinä 0,1 m:n tarkkuudella ilman yksikköä.","vastaus":24.1,"vinkki":"Naru on hypotenuusa. Leijan korkeus on 42°:n kulman vastainen kateetti.","selitys":"Korkeus on 42°:n kulman vastainen kateetti ja naru hypotenuusa: korkeus = 36,0 · sin 42° ≈ 24,1 m. Vastaus 26,8 syntyy kosinilla. Se on tapin ja pisteen P välinen matka maata pitkin."},{"id":"H18","ryhma":"koko","kysymys":"Kolmiossa ABC kulma C on suora, AB = 20,0 cm ja kulma A = 35°. Niko laski BC = 20,0 · cos 35° ≈ 16,4 cm ja AC = 20,0 · sin 35° ≈ 11,5 cm, ja Pythagoraan lauseella hän sai hypotenuusaksi taas 20,0 cm. Mikä tarkistus paljastaa, että sini ja kosini ovat vaihtuneet?","vastaus":2,"vinkki":"Vaihdetut kateetit ovat samat kaksi lukua väärissä paikoissa. Mikä tarkistus huomaa, kumpi on kumpi?","selitys":"Pythagoraan lause ei huomaa vaihtoa, koska 16,4 ja 11,5 ovat samat luvut kuin oikeat kateetit väärin päin, ja kulmien summa ei käytä sivuja lainkaan. Tangentti huomaa: BC : AC pitää olla tan 35° ≈ 0,700, mutta Nikon luvuilla 16,4 : 11,5 ≈ 1,4. Myös järjestys paljastaa virheen: kulma A = 35° on pienempi kuin kulma B = 55°, joten sen vastainen kateetti BC on lyhyempi kateetti. Oikein BC ≈ 11,5 cm ja AC ≈ 16,4 cm.","tyyppi":"monivalinta","vaihtoehdot":["Pythagoraan lause laskettuna uudelleen tarkemmin","kulmien summa 35° + 55° + 90° = 180°","tangentti: BC : AC pitäisi olla tan 35° ≈ 0,700"]},{"id":"H19","ryhma":"koko","kysymys":"Kolmiossa ABC kulma C on suora, BC = 9,0 cm ja AB = 15,0 cm. Laske ensin kulma A asteen kymmenesosan tarkkuudella ja sitten AC. Mikä on AC millimetrin tarkkuudella? Anna vastaus senttimetreinä ilman yksikköä.","vastaus":12.0,"vinkki":"sin A = 9,0/15,0. Sivun AC saat kosinista tai Pythagoraan lauseesta.","selitys":"sin A = 9,0/15,0 = 0,6, joten A ≈ 36,9°. AC = 15,0 · cos 36,9° ≈ 12,0 cm. Tarkistus Pythagoraan lauseella: AC = √(15,0² − 9,0²) = √144 = 12,0 cm."},{"id":"H20","ryhma":"koko","kysymys":"Kolmiossa ABC kulma C on suora, AC = 11,0 cm ja BC = 6,0 cm. Laske kolmion suurempi terävä kulma asteen kymmenesosan tarkkuudella. Anna vastaus asteina ilman astemerkkiä.","vastaus":61.4,"vinkki":"Suurempi terävä kulma on pidemmän kateetin vastainen kulma.","selitys":"Pidempi kateetti on AC, ja sen vastainen kulma on B. tan B = 11,0/6,0 ≈ 1,833, joten B ≈ 61,4°. Kulma A = 90° − 61,4° = 28,6° on pienempi. Vastaus 28,6 on pienempi kulma."}],"valmis_teksti":"Valitset sinin, kosinin tai tangentin sen mukaan, mitkä kaksi sivua ovat mukana, ja lasket suorakulmaisen kolmion puuttuvat sivut ja terävät kulmat, kun tunnet kaksi sivua tai yhden sivun ja yhden terävän kulman. Ratkaiset hypotenuusan verrantomuodosta, lasket kulman käänteistoiminnolla ja täydennät kolmion kulmien summalla ja Pythagoraan lauseella. Tarkistat tuloksen toisella tavalla ja tiedät, että sini ja kosini voivat vaihtua huomaamatta, jos tarkistat vain Pythagoraan lauseella. Tiedät, että sini, kosini ja tangentti määritellään näin vain suorakulmaisessa kolmiossa. Tämä taito on nyt näytetty."};

const svg=document.getElementById("nlsvg"), rng=document.getElementById("nlrange"), out=document.getElementById("nlout");
const X0=34, X1=606, Y=62;
function piirraNL(v){
  const ala=Math.floor(v/10)*10, yla=ala+10, puoli=ala+5;
  const pyor = (v%10)>=5 ? yla : ala;
  const x = n => X0 + (n/100)*(X1-X0);
  let s=`<line class="rail" x1="${X0}" y1="${Y}" x2="${X1}" y2="${Y}"/>`;
  for(let n=0;n<=100;n+=10){
    const near = (n===ala||n===yla);
    s+=`<line class="tick" x1="${x(n)}" y1="${Y-7}" x2="${x(n)}" y2="${Y+7}"/>`;
    s+=`<text class="stop${near?" near":""}" x="${x(n)}" y="${Y+24}" text-anchor="middle">${n}</text>`;
  }
  s+=`<line class="halfway" x1="${x(puoli)}" y1="${Y-16}" x2="${x(puoli)}" y2="${Y+12}"/>`;
  s+=`<text class="stop" x="${x(puoli)}" y="${Y-22}" text-anchor="middle">puoliväli ${puoli}</text>`;
  s+=`<circle class="dot" cx="${x(v)}" cy="${Y}" r="6"/>`;
  s+=`<text class="val" x="${x(v)}" y="${Y-32}" text-anchor="middle">${v}</text>`;
  s+=`<path d="M ${x(v)} ${Y+38} L ${x(pyor)} ${Y+38}" stroke="var(--core)" stroke-width="2" fill="none"/>`;
  s+=`<path d="M ${x(pyor)} ${Y+38} l ${x(pyor)>x(v)?-7:7} -4 l 0 8 z" fill="var(--core)"/>`;
  svg.innerHTML=s;
  out.textContent = `${v} pyöristyy → ${pyor}`;
}

/* ---------- laskujärjestys-widget ---------- */
const ljExp=document.getElementById("ljExp");
if(ljExp && D.kokeilu){
  let ljI=0, ljTokens=[], ljStep=0;
  const laske=(a,op,b)=>{a=+a;b=+b;return op==="×"?a*b:op==="÷"?a/b:op==="+"?a+b:a-b;};
  function ljAlku(){
    const l=D.kokeilu[ljI];
    ljTokens=l.lauseke.replace(/\(/g,"( ").replace(/\)/g," )").split(/\s+/).filter(Boolean);
    ljStep=0; ljPiirra(); ljViesti("","");
  }
  function ljViesti(t,lk){const f=document.getElementById("ljFb"); f.textContent=t; f.className="lj-fb "+(lk||"");}
  function ljPiirra(){
    const l=D.kokeilu[ljI];
    document.getElementById("ljStep").textContent =
      ljStep>=l.askeleet.length ? "valmis" : `askel ${ljStep+1} / ${l.askeleet.length}`;
    if(ljStep>=l.askeleet.length){
      ljExp.innerHTML=`<span class="valmis">${l.lauseke} = ${l.vastaus}</span>`;
      return;
    }
    ljExp.innerHTML=ljTokens.map((t,i)=>
      "×÷+−".includes(t) ? `<button type="button" class="op" data-i="${i}">${t}</button>`
                         : `<span class="tok">${t}</span>`).join("");
    ljExp.querySelectorAll("button.op").forEach(b=>b.addEventListener("click",()=>ljKlikkaa(+b.dataset.i)));
  }
  function ljKlikkaa(i){
    const l=D.kokeilu[ljI], odotettu=l.askeleet[ljStep];
    const ehdotus=[ljTokens[i-1],ljTokens[i],ljTokens[i+1]].join(" ");
    if(ehdotus!==odotettu){
      ljViesti(ljStep===0
        ? "Ei vielä. Sulkeet ovat vahvimmat, sitten kerto ja jako. Yhtä vahvat vasemmalta oikealle."
        : "Ei vielä. Kumpi jäljellä olevista on vahvempi?", "no");
      return;
    }
    const arvo=laske(ljTokens[i-1],ljTokens[i],ljTokens[i+1]);
    let alku=i-1, loppu=i+1;
    if(ljTokens[i-2]==="(" && ljTokens[i+2]===")"){ alku=i-2; loppu=i+2; }
    ljTokens.splice(alku, loppu-alku+1, String(arvo));
    ljStep++;
    ljViesti(ljStep>=l.askeleet.length ? "Valmis. Vastaus on "+l.vastaus+"." : "Oikein. Jatka seuraavaan.", "ok");
    ljPiirra();
  }
  document.getElementById("ljSeuraava").addEventListener("click",()=>{
    ljI=(ljI+1)%D.kokeilu.length; ljAlku();
  });
  ljAlku();
}

/* Suomalainen lukumuoto: välilyönti on tuhaterotin, pilkku desimaalierotin.
   Piste voi olla kumpi tahansa. Se tulkitaan tuhaterottimeksi VAIN silloin, kun
   koko luku on aitoa tuhaterotinmuotoa: alkuosa 1–3 numeroa ilman etunollaa ja
   jokainen jatko-osa täsmälleen 3 numeroa (1.500, 12.345.678). Kaikissa muissa
   tapauksissa piste on desimaalipiste — myös 0.125, joka vanhalla säännöllä
   ("3 numeroa pisteen jäljessä = tuhaterotin") luettiin virheellisesti luvuksi 125. */
const TUHATEROTIN = /^[1-9]\d{0,2}(\.\d{3})+$/;
function lueLuku(teksti){
  // Murtoluku (3/4, -3/4) ja sekaluku (1 2/3, -1 2/3) hyväksytään sellaisinaan.
  const raaka = String(teksti).replace(/\u00a0/g, " ").trim();
  let m = raaka.match(/^(-?)(\d+)\s+(\d+)\s*\/\s*(\d+)$/);
  if(m){ const nim = Number(m[4]); if(nim === 0) return null;
    const v = Number(m[2]) + Number(m[3]) / nim; return m[1] ? -v : v; }
  m = raaka.match(/^(-?)\s*(\d+)\s*\/\s*(\d+)$/);
  if(m){ const nim = Number(m[3]); if(nim === 0) return null;
    const v = Number(m[2]) / nim; return m[1] ? -v : v; }
  let s = String(teksti).replace(/[\s\u00a0]/g, "");
  if(s === "") return null;
  if(s.indexOf(",") >= 0){
    s = s.replace(/\./g, "").replace(",", ".");
  } else if(TUHATEROTIN.test(s)){
    s = s.replace(/\./g, "");
  }
  const n = Number(s);
  return Number.isFinite(n) ? n : null;
}

function tarkista(id){
  const h=D.harjoitukset.find(x=>x.id===id);
  const kentta=document.getElementById("in-"+id);
  const fb=document.getElementById("fb-"+id);
  if(kentta.value.trim()===""){ fb.className="fb hint"; fb.textContent="Kirjoita vastaus ensin."; return; }
  const luku=lueLuku(kentta.value);
  if(luku===null){ fb.className="fb no"; fb.textContent="Vastauksen pitää olla luku tai murtoluku (esimerkiksi 3/4)."; return; }
  const oikein = Math.abs(luku - h.vastaus) < 1e-9;
  merkitseTulos(id, oikein, oikein ? "Oikein. "+h.selitys : `Ei vielä. ${h.vinkki} Kokeile uudelleen.`);
}

function tarkistaMonivalinta(id, valittuIndeksi, painike){
  const h=D.harjoitukset.find(x=>x.id===id);
  const rivi=painike.closest(".row");
  rivi.querySelectorAll(".mv-valinta").forEach(b=>b.disabled=true);
  const oikein = valittuIndeksi===h.vastaus;
  painike.classList.add(oikein?"mv-oikein":"mv-vaarin");
  if(!oikein){
    const oikeaBtn=rivi.querySelector(`[data-i="${h.vastaus}"]`);
    if(oikeaBtn) oikeaBtn.classList.add("mv-oikein");
  }
  merkitseTulos(id, oikein, oikein ? "Oikein. "+h.selitys : `Ei ihan. Oikea vastaus on korostettu. ${h.selitys||""}`);
}

/* Kuuntelu: selain lukee tekstin ääneen omalla puhesynteesillään (englanniksi, jos laitteessa on
   englanninkielinen ääni). Ei äänitiedostoja eikä verkkoyhteyttä. Jos laite ei osaa puhua,
   teksti näytetään luettavaksi — silloin tehtävä muuttuu luetun ymmärtämiseksi, mutta ei katkea. */
function puhu(id, nopeus){
  const h=D.harjoitukset.find(x=>x.id===id); if(!h || !h.kuuntele) return;
  const vara=document.getElementById("vara-"+id);
  const naytaTeksti=syy=>{ vara.hidden=false; vara.textContent=syy+" Teksti: "+h.kuuntele; };
  if(!("speechSynthesis" in window)){ naytaTeksti("Tämä laite ei osaa lukea ääneen."); return; }
  const s=window.speechSynthesis; s.cancel();
  const u=new SpeechSynthesisUtterance(h.kuuntele);
  u.lang=h.kieli||"en-GB"; u.rate=nopeus;
  const aanet=s.getVoices(), kieli=u.lang.slice(0,2);
  const aani=aanet.find(a=>a.lang===u.lang) || aanet.find(a=>a.lang && a.lang.startsWith(kieli));
  if(aani) u.voice=aani;
  else if(aanet.length) { naytaTeksti("Laitteessa ei ole englanninkielistä ääntä."); return; }
  u.onerror=()=>naytaTeksti("Ääneen lukeminen ei onnistunut.");
  s.speak(u);
}
