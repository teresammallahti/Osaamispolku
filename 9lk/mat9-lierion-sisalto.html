<title>Lieriön sisältö</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">

<style>
:root{
  --paper:#EFF2F5; --surface:#FFFFFF; --surface-2:#F7F9FB;
  --grid:#DCE3EA; --line:#C9D3DC;
  --ink:#15222C; --ink-2:#4E626F; --ink-3:#7E8F9B;
  --core:#1B5A9E; --core-soft:#E4EDF6;
  --strong:#1F6E5C; --strong-soft:#E1F0EB;
  --chal:#9A6A16; --chal-soft:#F6EDDC;
  --alert:#A33A2B; --alert-soft:#F8E7E3;
  --shadow:0 1px 2px rgba(21,34,44,.06), 0 8px 24px -12px rgba(21,34,44,.18);
  --r:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0F161B; --surface:#18222A; --surface-2:#1D2830;
    --grid:#22303A; --line:#2E3E4A;
    --ink:#E8EFF4; --ink-2:#A3B4C0; --ink-3:#7A8B97;
    --core:#7FB2E4; --core-soft:#16303F;
    --strong:#77CDB4; --strong-soft:#123028;
    --chal:#E0B267; --chal-soft:#33270F;
    --alert:#E8907F; --alert-soft:#3A1E19;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -14px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --paper:#0F161B; --surface:#18222A; --surface-2:#1D2830;
  --grid:#22303A; --line:#2E3E4A;
  --ink:#E8EFF4; --ink-2:#A3B4C0; --ink-3:#7A8B97;
  --core:#7FB2E4; --core-soft:#16303F;
  --strong:#77CDB4; --strong-soft:#123028;
  --chal:#E0B267; --chal-soft:#33270F;
  --alert:#E8907F; --alert-soft:#3A1E19;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -14px rgba(0,0,0,.7);
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:16px; line-height:1.62;
  background-image:
    linear-gradient(to right, var(--grid) 1px, transparent 1px),
    linear-gradient(to bottom, var(--grid) 1px, transparent 1px);
  background-size:26px 26px;
}
.wrap{max-width:760px; margin:0 auto; padding:28px 20px 90px}
h1,h2,h3,h4{font-family:"Familjen Grotesk","IBM Plex Sans",system-ui,sans-serif; text-wrap:balance}

/* header */
header.top{background:var(--surface); border:1px solid var(--line); border-radius:var(--r);
  box-shadow:var(--shadow); padding:22px 24px; display:flex; gap:18px; align-items:flex-start}
.badge{flex:0 0 auto; width:54px; height:54px; border-radius:9px; display:grid; place-items:center;
  background:var(--core-soft); border:1px solid var(--core); color:var(--core)}
.badge svg{width:28px; height:28px; fill:none; stroke:currentColor; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round}
.eyebrow{font-family:"IBM Plex Mono",monospace; font-size:11px; letter-spacing:.14em;
  text-transform:uppercase; color:var(--ink-3); margin:0 0 5px}
header.top h1{margin:0; font-size:30px; font-weight:700; letter-spacing:-.015em}
header.top p{margin:5px 0 0; color:var(--ink-2); font-size:15px}
.tags{display:flex; flex-wrap:wrap; gap:5px; margin-top:11px}
.tag{font-family:"IBM Plex Mono",monospace; font-size:10.5px; letter-spacing:.05em; padding:2px 7px;
  border-radius:4px; background:var(--surface-2); border:1px solid var(--line); color:var(--ink-3)}
.tag.core{background:var(--core-soft); border-color:var(--core); color:var(--core)}

/* teksti */
article{margin-top:26px}
article h2{font-size:21px; font-weight:600; margin:32px 0 10px; letter-spacing:-.01em}
article p{margin:0 0 14px; max-width:64ch}
.lead{font-size:17.5px; color:var(--ink); border-left:3px solid var(--core); padding-left:16px; margin:0 0 8px}

.box{background:var(--surface); border:1px solid var(--line); border-radius:var(--r);
  padding:18px 22px; box-shadow:var(--shadow); margin:22px 0}
.box h3{margin:0 0 12px; font-size:16.5px; font-weight:600}
.box.warn{border-left:3px solid var(--alert)}
.box.note{border-left:3px solid var(--chal)}

ol.steps{margin:0; padding-left:0; list-style:none; counter-reset:s; display:grid; gap:12px}
ol.steps li{counter-increment:s; display:grid; grid-template-columns:auto 1fr; gap:13px; align-items:start}
ol.steps li::before{content:counter(s); font-family:"Familjen Grotesk",sans-serif; font-weight:700; font-size:14px;
  width:26px; height:26px; border-radius:50%; background:var(--core); color:#fff; display:grid; place-items:center; margin-top:2px}

ul.notes{margin:0; padding-left:19px}
ul.notes li{margin-bottom:7px}
ul.notes li:last-child{margin-bottom:0}

.tablewrap{overflow-x:auto}
table{border-collapse:collapse; width:100%; font-size:14.5px; min-width:460px}
th,td{text-align:left; padding:9px 13px; border-bottom:1px solid var(--line)}
th{font-family:"IBM Plex Mono",monospace; font-size:10.5px; letter-spacing:.1em; text-transform:uppercase;
  color:var(--ink-3); font-weight:400; background:var(--surface-2)}
tr:last-child td{border-bottom:0}
td b{color:var(--core); font-weight:600}
td:last-child{font-variant-numeric:tabular-nums; font-weight:600}

/* lukusuora */
.nl svg{width:100%; height:118px; display:block}
.nl .rail{stroke:var(--line); stroke-width:2}
.nl .tick{stroke:var(--line); stroke-width:1.5}
.nl .stop{fill:var(--ink-3); font-family:"IBM Plex Mono",monospace; font-size:11px}
.nl .stop.near{fill:var(--core); font-weight:600}
.nl .dot{fill:var(--chal)}
.nl .val{fill:var(--ink); font-family:"Familjen Grotesk",sans-serif; font-size:15px; font-weight:700}
.nl .halfway{stroke:var(--chal); stroke-dasharray:3 3; stroke-width:1.5}
.nl-controls{display:flex; align-items:center; gap:14px; margin-top:6px}
.nl-controls input{flex:1; accent-color:var(--core)}
.nl-out{font-family:"Familjen Grotesk",sans-serif; font-size:15px; font-weight:600; min-width:12.5em; text-align:right}

/* paikka-arvotaulu */
.box .ohje{margin:0 0 14px; font-size:14.5px; color:var(--ink-2)}
.nt-valinta{display:flex; flex-wrap:wrap; gap:7px; margin-bottom:16px}
.nt-valinta button{font:inherit; font-size:12.5px; font-family:"IBM Plex Mono",monospace; padding:5px 11px;
  border-radius:6px; border:1px solid var(--line); background:var(--surface-2); color:var(--ink-2); cursor:pointer}
.nt-valinta button[aria-pressed="true"]{background:var(--ink); color:var(--paper); border-color:var(--ink)}
.nt-valinta button:focus-visible{outline:2px solid var(--core); outline-offset:2px}
.nt-taulu{display:flex; flex-direction:column; gap:4px; align-items:flex-start; overflow-x:auto; padding-bottom:4px}
.nt-rivi{display:flex; gap:6px; align-items:center}
.nt-rivi .otsa{font-family:"IBM Plex Mono",monospace; font-size:9.5px; letter-spacing:.08em;
  text-transform:uppercase; color:var(--ink-3); width:52px; text-align:center}
.nt-ruutu{width:52px; height:52px; display:grid; place-items:center; border:1.5px solid var(--line);
  border-radius:7px; background:var(--surface-2); font-family:"IBM Plex Mono",monospace; font-size:24px}
.nt-ruutu.kohta{border-color:var(--core); background:var(--core-soft); color:var(--core); font-weight:500}
.nt-ruutu.ratkaiseva{border-color:var(--chal); background:var(--chal-soft); color:var(--chal); font-weight:500}
.nt-ruutu.nolla{color:var(--ink-3)}
.nt-rivi .nimi{font-size:12.5px; color:var(--ink-3); margin-left:12px; white-space:nowrap}
.nt-nuoli{font-size:17px; color:var(--chal); margin-left:6px}
.nt-selite{margin:14px 0 0; font-size:14.5px}
.nt-selite b{color:var(--core)}

/* vahvuusportaat */
.vp-tasot{display:grid; gap:9px; margin-bottom:18px}
.vp-taso{display:flex; gap:11px; align-items:flex-start; font-size:13.5px}
.vp-taso .vp-pallo{width:13px; height:13px; border-radius:4px; margin-top:5px; flex:0 0 auto}
.vp-taso[data-taso="sulkeet"] .vp-pallo{background:var(--core)}
.vp-taso[data-taso="kertojako"] .vp-pallo{background:var(--strong)}
.vp-taso[data-taso="yhteenvahennys"] .vp-pallo{background:var(--chal)}
.vp-taso strong{display:block; font-family:"Familjen Grotesk",sans-serif; font-weight:600; font-size:14.5px}
.vp-taso span{color:var(--ink-2)}
.vp-lauseke{display:flex; flex-wrap:wrap; gap:7px; align-items:flex-end; font-family:"IBM Plex Mono",monospace;
  font-size:25px; padding:10px 2px; min-height:64px}
.vp-lauseke .t{padding:2px 3px}
.vp-lauseke .op{position:relative; padding:2px 9px; border-radius:6px; font-weight:500}
.vp-lauseke .op[data-taso="sulkeet"]{background:var(--core-soft); color:var(--core)}
.vp-lauseke .op[data-taso="kertojako"]{background:var(--strong-soft); color:var(--strong)}
.vp-lauseke .op[data-taso="yhteenvahennys"]{background:var(--chal-soft); color:var(--chal)}
.vp-lauseke .op i{position:absolute; top:-9px; right:-6px; font-style:normal; font-family:"Familjen Grotesk",sans-serif;
  font-size:11px; font-weight:700; width:18px; height:18px; border-radius:50%; display:grid; place-items:center;
  background:currentColor}
.vp-lauseke .op i span{color:var(--surface)}
.vp-rivi{display:flex; align-items:center; gap:16px; margin-top:8px}
.vp-vastaus{font-family:"Familjen Grotesk",sans-serif; font-size:16px; font-weight:600; color:var(--strong)}

/* laskujärjestys-widget */
.lj-exp{display:flex; flex-wrap:wrap; gap:7px; align-items:center; font-family:"IBM Plex Mono",monospace;
  font-size:23px; padding:14px 4px; min-height:62px}
.lj-exp .tok{padding:2px 4px; color:var(--ink)}
.lj-exp button.op{font-family:"IBM Plex Mono",monospace; font-size:23px; padding:3px 12px; border-radius:7px;
  border:1.5px solid var(--line); background:var(--surface-2); color:var(--ink); line-height:1.2}
.lj-exp button.op:hover{border-color:var(--core); color:var(--core)}
.lj-exp button.op:focus-visible{outline:2px solid var(--core); outline-offset:2px}
.lj-exp .valmis{font-family:"Familjen Grotesk",sans-serif; font-size:23px; font-weight:700; color:var(--strong)}
.lj-fb{font-size:14.5px; min-height:1.5em; color:var(--ink-2)}
.lj-fb.no{color:var(--alert)}
.lj-fb.ok{color:var(--strong)}
.lj-row{display:flex; align-items:center; gap:14px; margin-top:10px}
.lj-step{font-family:"IBM Plex Mono",monospace; font-size:11.5px; letter-spacing:.1em;
  text-transform:uppercase; color:var(--ink-3)}

/* harjoitukset */
.progress{position:sticky; top:0; z-index:5; background:var(--surface); border:1px solid var(--line);
  border-radius:var(--r); padding:12px 18px; box-shadow:var(--shadow); display:flex; align-items:center;
  gap:14px; margin:34px 0 18px}
.progress .lbl{font-family:"IBM Plex Mono",monospace; font-size:11px; letter-spacing:.12em;
  text-transform:uppercase; color:var(--ink-3); white-space:nowrap}
.progress .meter{flex:1; height:7px; border-radius:4px; background:var(--surface-2); border:1px solid var(--line); overflow:hidden}
.progress .meter i{display:block; height:100%; background:var(--core); transition:width .25s ease}
.progress .cnt{font-family:"Familjen Grotesk",sans-serif; font-weight:700; font-variant-numeric:tabular-nums; white-space:nowrap}

.grp{margin-top:26px}
.grp-head{display:flex; align-items:baseline; gap:10px; border-bottom:1.5px solid var(--ink); padding-bottom:7px; margin-bottom:14px}
.grp-head h3{margin:0; font-size:17px; font-weight:600}
.grp-head span{font-size:12.5px; color:var(--ink-2)}

.ex{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:14px 16px; margin-bottom:10px}
.ex[data-tila="oikein"]{border-color:var(--strong); box-shadow:inset 3px 0 0 var(--strong)}
.ex[data-tila="vaarin"]{border-color:var(--alert); box-shadow:inset 3px 0 0 var(--alert)}
.ex .q{display:flex; gap:11px; align-items:baseline; flex-wrap:wrap}
.ex .num{font-family:"IBM Plex Mono",monospace; font-size:11.5px; color:var(--ink-3); min-width:2.4em}
.ex .txt{flex:1; min-width:190px; font-size:15.5px}
.ex .txt .aineisto{display:block; margin-bottom:9px; padding-left:12px;
  border-left:2px solid var(--line); color:var(--ink-2); line-height:1.6;
  /* Aineisto voi olla pieni taulukko, jonka rivit on erotettu rivinvaihdoilla.
     Ilman pre-lineä ne valuisivat yhdeksi kappaleeksi ja taulukko katoaisi. */
  white-space:pre-line}
.ex .txt .kysymysrivi{display:block; font-weight:600}
.ex .row{display:flex; gap:8px; align-items:center; margin-top:11px; flex-wrap:wrap}
.ex input[type=text]{font:inherit; font-family:"IBM Plex Mono",monospace; font-size:15px; width:8.5em;
  padding:7px 11px; border:1px solid var(--line); border-radius:7px; background:var(--surface-2);
  color:var(--ink); text-align:right}
.ex input:focus-visible{outline:2px solid var(--core); outline-offset:1px}
button{font:inherit; cursor:pointer}
.btn{font-size:13.5px; padding:7px 15px; border-radius:7px; border:1px solid var(--core);
  background:var(--core); color:#fff}
.btn.ghost{background:transparent; color:var(--ink-2); border-color:var(--line)}
.btn:focus-visible{outline:2px solid var(--core); outline-offset:2px}
.btn.mv-valinta{text-align:left}
/* kuuntelutehtävä: selaimen puhesynteesi lukee englanninkielisen tekstin */
.kuuntele{display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin:2px 0 10px}
.kuuntele .btn{display:inline-flex; gap:7px; align-items:center}
.kuuntele svg{width:16px; height:16px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round}
.kuuntele .varateksti{flex-basis:100%; font-size:14px; color:var(--ink-2); background:var(--surface-2);
  border-radius:7px; padding:8px 12px; margin:0}
.btn.mv-valinta:disabled{cursor:default; opacity:.65}
.btn.mv-oikein{background:var(--strong-soft); border-color:var(--strong); color:var(--strong); opacity:1}
.btn.mv-vaarin{background:var(--alert-soft); border-color:var(--alert); color:var(--alert); opacity:1}
.row.mv{gap:8px 10px}
.fb{margin-top:11px; font-size:14.5px; padding:10px 13px; border-radius:8px; line-height:1.5}
.fb.ok{background:var(--strong-soft); color:var(--strong)}
.fb.no{background:var(--alert-soft); color:var(--alert)}
.fb.hint{background:var(--chal-soft); color:var(--chal)}

.done{background:var(--strong-soft); border:1px solid var(--strong); color:var(--strong);
  border-radius:var(--r); padding:16px 20px; margin-top:20px; font-size:15.5px}
.done h3{margin:0 0 4px; font-size:17px; color:var(--strong)}

details.teacher{margin-top:34px; background:var(--surface); border:1px solid var(--line);
  border-left:3px solid var(--chal); border-radius:var(--r); padding:15px 20px; box-shadow:var(--shadow)}
details.teacher summary{cursor:pointer; font-family:"Familjen Grotesk",sans-serif; font-weight:600; font-size:15px}
details.teacher summary:focus-visible{outline:2px solid var(--core); outline-offset:3px}
details.teacher ul{margin:12px 0 0; padding-left:19px; color:var(--ink-2); font-size:14.5px}
details.teacher li{margin-bottom:8px}
details.teacher p{margin:12px 0 0; color:var(--ink-2); font-size:14.5px}

.back{display:inline-block; margin-top:30px; font-size:13.5px; color:var(--ink-2)}
.back a{color:var(--core)}

@media (prefers-reduced-motion: reduce){*{transition:none !important}}
@media (max-width:560px){
  .wrap{padding:16px 13px 70px}
  header.top h1{font-size:25px}
  .progress{flex-wrap:wrap}
}
</style>

<div class="wrap">

  <header class="top">
    <span class="badge"><svg viewBox="0 0 24 24" aria-hidden="true" id="ikoni"></svg></span>
    <div>
      <p class="eyebrow" id="eyebrow"></p>
      <h1 id="otsikko"></h1>
      <p id="kuvaus"></p>
      <div class="tags" id="tags"></div>
    </div>
  </header>

  <article id="teksti"></article>

  <div class="progress" aria-live="polite">
    <span class="lbl">Harjoitukset</span>
    <span class="meter"><i id="pbar" style="width:0%"></i></span>
    <span class="cnt" id="pcnt">0 / 20</span>
  </div>

  <div id="harjoitukset"></div>
  <div id="valmis"></div>

  <p class="back" id="back"></p>

</div>

<script>
const D = {"tavoite_id":"MAT9-MIT-03","oppiaine":"MAT","vuosiluokka":9,"taso":"ydin","otsikko":"Lieriön sisältö","kuvaus":"Osaan laskea lieriön tilavuuden pohjan alan ja korkeuden avulla.","versio":"0.2","paivitetty":"2026-10-11","ops":{"T":["T7","T13","T18"],"S":["S2","S5"]},"ikoni":"mittari","eyebrow":"Matematiikka · 9. luokka · Mittaaminen","teksti":[{"tyyppi":"johdanto","sisalto":"Rakennustyömaalla valetaan pyöreä betonipilari. Muotti on pystyyn nostettu putki, jonka sisäsäde on 15 cm ja korkeus 2,8 m. Betoniauto tuo betonin kuutiometreinä, joten työnjohtajan on tiedettävä etukäteen, montako kuutiota muottiin mahtuu. Pilarin pohja on ympyrä, ja koko pilari on kuin pino samanlaisia ympyrän muotoisia kerroksia. Siksi tilavuus saadaan kertomalla pohjan ala korkeudella: V = π · (0,15 m)² · 2,8 m ≈ 0,198 m³ eli noin 198 litraa. Sama kaava toimii kolmiopohjaiselle teltalle, kuusikulmaiselle kynälle ja jopa kallelleen työnnetylle pinolle. Tässä taidossa lasket lieriön tilavuuden pohjan alan ja korkeuden avulla, ratkaiset puuttuvan korkeuden tai säteen, muunnat tuloksen litroiksi ja lasket, montako prosenttia laatikosta jää tyhjäksi, kun siihen pakataan purkki. Laskin on sallittu. Käytä π:n arvona laskimen π-näppäintä."},{"tyyppi":"kappale","otsikko":"Lieriö on pino pohjan muotoisia kerroksia","sisalto":"Lieriöllä on kaksi yhtenevää ja yhdensuuntaista pohjaa, ja vaippa yhdistää niiden reunat. Pohja voi olla ympyrä, kolmio, suorakulmio, kuusikulmio tai jokin muu monikulmio. Monikulmiopohjaista lieriötä kutsutaan särmiöksi. Kuutiosta litraan -taidossa laskit suorakulmaisen särmiön tilavuuden: pohjalle mahtuu pohjan alan verran yksikkökuutioita, ja kerroksia on korkeuden verran. Sama ajatus toimii jokaisessa lieriössä. Ajattele lieriö pinoksi 1 cm paksuja levyjä, jotka ovat pohjan muotoisia. Jos pohjan ala on 20 cm², yhden levyn tilavuus on 20 cm² · 1 cm = 20 cm³. Kun lieriön korkeus on 7 cm, levyjä on seitsemän, ja tilavuus on 7 · 20 cm³ = 140 cm³. Siksi kaikkien lieriöiden tilavuus on V = A_p · h, jossa A_p on pohjan ala ja h korkeus. Kaava ei riipu pohjan muodosta: muoto vaikuttaa vain siihen, miten A_p lasketaan. Yksikkö tulee samasta päättelystä: cm² · cm = cm³."},{"tyyppi":"kappale","otsikko":"Ympyrälieriö ja litrat","sisalto":"Ympyrälieriön pohja on ympyrä, jonka ala on πr² (Piin salaisuus, 8. luokka). Siksi ympyrälieriön tilavuus on V = πr²h. Säilykepurkin sisäsäde on 3,7 cm ja sisäkorkeus 11,0 cm. Pohjan ala on A_p = π · (3,7 cm)² ≈ 43,0 cm², ja tilavuus on V = π · (3,7 cm)² · 11,0 cm ≈ 473 cm³. Pidä pohjan ala laskimessa tarkkana ja pyöristä vasta tilavuus. Tarkka arvo jätetään π:n monikerraksi: kun säde on 5 cm ja korkeus 6 cm, V = π · 5² · 6 cm³ = 150π cm³. Litroiksi muunnat Kuutiosta litraan -taidon kytköksellä 1 l = 1 dm³ = 1 000 cm³. Litra on kuutio, jonka särmä on 10 cm, joten siihen mahtuu 10 · 10 · 10 = 1 000 kuutiosenttimetriä. Purkin tilavuus on siis 473 cm³ = 0,473 l eli noin 0,47 l. Toinen tapa on muuntaa mitat ensin desimetreiksi: π · (0,37 dm)² · 1,10 dm ≈ 0,47 dm³ = 0,47 l. Suuret tilavuudet ilmoitetaan kuutiometreinä, ja 1 m³ = 1 000 l."},{"tyyppi":"saanto","otsikko":"Näin lasket lieriön tilavuuden","askeleet":["Tunnista pohja: lieriön kaksi yhtenevää ja yhdensuuntaista tahkoa. Pohja ei aina ole alhaalla. Kyljellään olevan teltan pohja on sen kolmion muotoinen pääty.","Laske pohjan ala. Ympyrä: A_p = πr², ja jos annettu on halkaisija, jaa se ensin kahdella. Kolmio: A_p = kanta · korkeus : 2. Puolisuunnikas: yhdensuuntaisten sivujen keskiarvo kertaa niiden välinen etäisyys. Muun monikulmion ala annetaan, tai pohja on jaettu valmiiksi kolmioiksi, joiden alat lasketaan yhteen.","Valitse korkeus: pohjien välinen kohtisuora etäisyys. Vinossa lieriössä se on lyhyempi kuin vino sivusärmä tai vaipan vino jana.","Muunna kaikki mitat samaan yksikköön ennen kertomista.","Kirjoita kaava V = A_p · h ja sijoita luvut yksiköineen. Pidä välitulokset laskimessa.","Muunna tulos kysyttyyn yksikköön: 1 l = 1 dm³ = 1 000 cm³ ja 1 m³ = 1 000 l. Pyöristä vasta nyt pyydettyyn tarkkuuteen.","Tarkista suuruusluokka. Ympyrälieriö mahtuu suorakulmaiseen särmiöön, jonka pohja on neliö, sivuna halkaisija, joten sen tilavuus on pienempi kuin d · d · h. Litroissa tavallinen kattila on muutaman litran kokoinen, ei kymmenien."]},{"tyyppi":"kappale","otsikko":"Muu pohja ja vino lieriö","sisalto":"Kun pohja on kolmio, sen ala on kanta kertaa korkeus jaettuna kahdella (Kanta kertaa korkeus, 7. luokka), koska kolmio on puolet suunnikkaasta. Teltan pääty on kolmio, jonka kanta on 2,4 m ja korkeus 1,5 m, ja teltta on 3,0 m pitkä. Pohjan ala on 2,4 m · 1,5 m : 2 = 1,8 m², ja tilavuus on 1,8 m² · 3,0 m = 5,4 m³. Teltan pituus on tässä lieriön korkeus, vaikka teltta on vaakasuorassa. Samoin uima-allas, jonka pohja syvenee tasaisesti, on lieriö kyljellään: jos allas on 25 m pitkä ja 10 m leveä ja sen päädyt ovat 1,2 m ja 2,0 m syviä, lieriön pohja on altaan sivuseinän muotoinen puolisuunnikas, jonka ala on (1,2 m + 2,0 m) : 2 · 25 m = 40 m². Korkeutena on altaan leveys, joten V = 40 m² · 10 m = 400 m³. Säännöllisen kuusikulmion (esimerkiksi kynän tai mutterin pohjan) alaa et laske uudella kaavalla, vaan jaat sen kuudeksi yhteneväksi kolmioksi. Muun monikulmion kohdalla tehtävä kertoo pohjan alan tai sen, miten pohja jakautuu kolmioiksi. Jos kunkin kolmion kanta on 2 cm ja korkeus 1,7 cm, kuusikulmaisen kynttilän pohjan ala on 6 · 2 cm · 1,7 cm : 2 = 10,2 cm², ja 30 cm korkean kynttilän tilavuus on 10,2 cm² · 30 cm = 306 cm³. Vinossa lieriössä pohjat ovat yhdensuuntaiset, mutta vaippa on kallellaan. Ajattele korttipakkaa: kun työnnät pakan kallelleen, jokainen kortti vain siirtyy sivuun. Kortteja on yhtä monta ja jokainen on yhtä suuri, joten tilavuus ei muutu. Korkeus on pakan korkeus suoraan ylöspäin eli pohjien kohtisuora etäisyys, ei vinon reunan pituus. Esimerkiksi vinon särmiön pohja on suorakulmio 6 cm × 3 cm, sivusärmä on 11 cm ja pohjien kohtisuora etäisyys 7 cm. Tilavuus on 18 cm² · 7 cm = 126 cm³."},{"tyyppi":"kappale","otsikko":"Puuttuva mitta ja tyhjä osuus","sisalto":"Kun tilavuus tunnetaan, puuttuva korkeus tai säde ratkaistaan yhtälöstä. Sijoita ensin kaikki tunnetut luvut kaavaan, niin jäljelle jää tavallinen yhtälö. Lieriön muotoisen vesipullon tilavuus on 0,75 l = 750 cm³ ja pohjan säde 3,5 cm. Yhtälö on 750 = π · 3,5² · h eli 750 = 38,48… · h, josta h = 750 : 38,48… ≈ 19,5 cm. Säde ratkeaa samoin, mutta siinä on yksi askel enemmän. Jos tilavuus on 500 cm³ ja korkeus 12 cm, niin 500 = π · r² · 12, josta r² = 500 : (12π) ≈ 13,26 ja r = √13,26… ≈ 3,6 cm. Yhtälöllä r² = 13,26… on myös negatiivinen ratkaisu, mutta säde on pituus, joten se hylätään. Tarkista sijoittamalla: π · 3,6² · 12 ≈ 489, mikä on lähellä lukua 500. Kun purkki pakataan laatikkoon, laatikkoon jää tyhjää tilaa. Laske kaksi erillistä tilavuutta ja niiden erotus. Laatikon sisämitat ovat 9 cm × 8 cm × 10 cm, ja siihen pakataan pystyyn purkki, jonka säde on 4 cm ja korkeus 10 cm. Laatikon tilavuus on 720 cm³ ja purkin π · 4² · 10 cm³ ≈ 502,7 cm³. Tyhjää jää 720 cm³ − 502,7 cm³ ≈ 217,3 cm³. Prosenttiosuus lasketaan laatikon tilavuudesta, koska kysytään osuutta laatikosta: 217,3 : 720 ≈ 0,302 eli noin 30 %."},{"tyyppi":"ansa","otsikko":"Ansa 1: vino jana korkeutena","sisalto":"Vinon ympyrälieriön pohjan säde on 3 cm. Pohjien kohtisuora etäisyys on 8 cm, ja vaipan vino jana pohjalta toiselle on 10 cm. Jos korkeudeksi otetaan vino jana, tilavuudeksi tulee π · 3² · 10 cm³ = 90π cm³. Oikein on V = π · 3² · 8 cm³ = 72π cm³. Vino jana on aina pidempi kuin pohjien kohtisuora etäisyys, joten tämä virhe antaa liian suuren tilavuuden. Korttipakka paljastaa virheen: kallistettu pakka ei kasva, vaikka sen reuna pitenee. Kun tehtävässä on kaksi pituutta pohjasta toiseen, valitse se, joka on kohtisuorassa pohjaa vastaan."},{"tyyppi":"ansa","otsikko":"Ansa 2: pohjan ala väärin","sisalto":"Kattilan sisähalkaisija on 16 cm ja korkeus 12 cm. Jos halkaisija sijoitetaan säteen paikalle, saadaan π · 16² · 12 cm³ ≈ 9 651 cm³ ≈ 9,7 l. Oikea säde on 8 cm, ja V = π · 8² · 12 cm³ ≈ 2 413 cm³ ≈ 2,4 l. Väärä tulos on nelinkertainen, koska (2r)² = 4r². Jos sädettä ei korota toiseen potenssiin, tulos on π · 8 · 12 cm³ ≈ 302 cm³ ≈ 0,3 l, ja yksikkökin menee väärin: cm · cm on pinta-ala eikä tilavuus. Kolmiopohjassa yleisin virhe on unohtaa jakaa kahdella. Suoran särmiön pohja on kolmio, jonka kanta on 8 cm ja korkeus 3 cm, ja särmiön korkeus on 20 cm. Lasku 8 · 3 · 20 = 480 antaa suorakulmaisen särmiön tilavuuden, ja kolmiopohjainen särmiö on siitä puolet: V = 8 cm · 3 cm : 2 · 20 cm = 240 cm³. Kirjoita siksi pohjan ala omaksi välivaiheekseen ennen kuin kerrot sen korkeudella."},{"tyyppi":"ansa","otsikko":"Ansa 3: yksiköt sekaisin ja litrat sadalla","sisalto":"Lieriön muotoisen ämpärin pohjan säde on 0,15 m ja korkeus 40 cm. Lasku π · 0,15² · 40 ≈ 2,83 ei anna tilavuutta missään tutussa yksikössä: m · m · cm ei ole cm³, dm³ eikä m³, joten luvun 2,83 perään ei voi kirjoittaa mitään tavallista tilavuusyksikköä. Muunna ensin samaan yksikköön. Desimetreinä r = 1,5 dm ja h = 4,0 dm, joten V = π · (1,5 dm)² · 4,0 dm ≈ 28,3 dm³ = 28,3 l. Toinen virhe syntyy vasta lopussa. Edellisen kattilan tilavuus on 2 413 cm³. Jos jaat sadalla, saat 24,1 l, mikä on liikaa: tavallinen kattila on muutaman litran kokoinen. Litrassa on 1 000 cm³, koska litra on kuutio, jonka särmä on 10 cm ja tilavuus 10 · 10 · 10 cm³. Siksi 2 413 cm³ = 2,413 l ≈ 2,4 l. Luku 100 on pinta-alayksiköiden suhdeluku, ei tilavuuden."},{"tyyppi":"ansa","otsikko":"Ansa 4: tyhjä osuus vai purkin osuus","sisalto":"Edellä laatikon tilavuudesta 502,7 : 720 ≈ 70 % on purkkia ja 30 % tyhjää. Jos tehtävä kysyy, montako prosenttia jää tyhjäksi, vastaus 70 % on väärin, vaikka lasku on muuten oikein. Lue kysymys uudelleen ennen kuin vastaat, ja tarkista, että purkin ja tyhjän tilan osuudet ovat yhteensä 100 %. Toinen virhe on laskea prosenttiosuus purkin tilavuudesta: 217,3 : 502,7 ≈ 43 % ei kerro osuutta laatikosta. Perusarvo on se, mihin verrataan, eli laatikko."}],"harjoitusryhmat":[{"id":"ympyra","nimi":"Ympyrälieriö ja litrat","info":"Laskin on sallittu. Käytä π:n arvona laskimen π-näppäintä ja pyöristä vasta lopputulos pyydettyyn tarkkuuteen. Anna vastaus ilman yksikköä."},{"id":"muut","nimi":"Muu pohja ja vino lieriö","info":"Laskin on sallittu. Käytä π:n arvona laskimen π-näppäintä ja pyöristä vasta lopputulos pyydettyyn tarkkuuteen. Anna vastaus ilman yksikköä."},{"id":"sovellus","nimi":"Puuttuva mitta ja tyhjä osuus","info":"Laskin on sallittu. Käytä π:n arvona laskimen π-näppäintä ja pyöristä vasta lopputulos pyydettyyn tarkkuuteen. Anna vastaus ilman yksikköä."}],"harjoitukset":[{"id":"H01","ryhma":"ympyra","kysymys":"Ympyrälieriön pohjan säde on 8 cm ja korkeus 3 cm. Tilavuus on kπ cm³. Mikä on k?","vastaus":192,"vinkki":"V = πr²h. Laske ensin r² = 8 · 8.","selitys":"V = π · 8² · 3 cm³ = π · 64 · 3 cm³ = 192π cm³, joten k = 192. Vastaus 24 syntyy, jos säde jää korottamatta toiseen potenssiin (8 · 3), ja 48, jos 8² lasketaan 8 · 2."},{"id":"H02","ryhma":"ympyra","kysymys":"Ympyrälieriön pohjan halkaisija on 16 cm ja korkeus 5 cm. Tilavuus on kπ cm³. Mikä on k?","vastaus":320,"vinkki":"Kaavaan tarvitaan säde. Jaa halkaisija ensin kahdella.","selitys":"r = 16 cm : 2 = 8 cm, joten V = π · 8² · 5 cm³ = 320π cm³ ja k = 320. Vastaus 1 280 syntyy, jos halkaisija sijoitetaan säteen paikalle. Se on nelinkertainen, koska (2r)² = 4r²."},{"id":"H03","ryhma":"ympyra","kysymys":"Ympyrälieriön pohjan säde on 2,5 cm ja korkeus 11,0 cm. Laske lieriön tilavuus kuutiosenttimetreinä kuutiosenttimetrin tarkkuudella.","vastaus":216,"vinkki":"Laske ensin pohjan ala π · 2,5² ja kerro se korkeudella.","selitys":"A_p = π · (2,5 cm)² = 19,63… cm², ja V = 19,63… cm² · 11,0 cm = 215,98… cm³ ≈ 216 cm³. Vastaus 86 syntyy, jos sädettä ei korota toiseen potenssiin (π · 2,5 · 11), ja 173, jos 2,5² lasketaan 2,5 · 2."},{"id":"H04","ryhma":"ympyra","kysymys":"Kattilan sisämitat ovat: pohjan säde 10,0 cm ja korkeus 14,0 cm. Montako litraa kattilaan mahtuu? Anna vastaus 0,1 litran tarkkuudella.","vastaus":4.4,"vinkki":"Laske tilavuus kuutiosenttimetreinä ja muista, että 1 l = 1 000 cm³.","selitys":"V = π · (10,0 cm)² · 14,0 cm = 4 398,2… cm³. Koska 1 l = 1 000 cm³, V = 4,398… l ≈ 4,4 l. Vastaus 44,0 syntyy, jos kuutiosenttimetrit jaetaan sadalla."},{"id":"H05","ryhma":"ympyra","kysymys":"Lieriön muotoisen kukkaruukun sisähalkaisija on 24,0 cm ja sisäkorkeus 13,0 cm. Montako litraa multaa ruukkuun mahtuu? Anna vastaus 0,1 litran tarkkuudella.","vastaus":5.9,"vinkki":"Säde on puolet halkaisijasta. Muunna lopuksi litroiksi.","selitys":"r = 12,0 cm, joten V = π · (12,0 cm)² · 13,0 cm = 5 881,0… cm³ = 5,881… l ≈ 5,9 l. Vastaus 23,5 syntyy, jos halkaisija sijoitetaan säteen paikalle."},{"id":"H06","ryhma":"ympyra","kysymys":"Lieriön muotoisen sadevesitynnyrin pohjan säde on 0,20 m ja korkeus 95 cm. Montako litraa vettä tynnyriin mahtuu? Anna vastaus litran tarkkuudella.","vastaus":119,"vinkki":"Muunna molemmat mitat desimetreiksi, niin tulos on suoraan kuutiodesimetreinä eli litroina.","selitys":"r = 0,20 m = 2,0 dm ja h = 95 cm = 9,5 dm. V = π · (2,0 dm)² · 9,5 dm = 119,38… dm³ ≈ 119 l. Vastaus 12 syntyy, jos mitat kerrotaan muuntamatta (π · 0,20² · 95 ≈ 11,9)."},{"id":"H07","ryhma":"ympyra","kysymys":"Lieriön pohjan ala on 30 cm² ja korkeus 6 cm. Miksi lieriön tilavuus on 30 cm² · 6 cm = 180 cm³?","vastaus":0,"vinkki":"Ajattele lieriö pinoksi 1 cm paksuja levyjä.","selitys":"Lieriö koostuu kuudesta 1 cm paksusta kerroksesta, joista jokainen on pohjan muotoinen ja jonka tilavuus on 30 cm² · 1 cm = 30 cm³. Kuusi kerrosta on 6 · 30 cm³ = 180 cm³. Vaipan muoto ei ratkaise tilavuutta, ja kaava pätee kaikille lieriöille, ei vain niille, joiden pohja on suorakulmio.","tyyppi":"monivalinta","vaihtoehdot":["Lieriö koostuu kuudesta 1 cm paksusta pohjan muotoisesta kerroksesta, ja jokaisen kerroksen tilavuus on 30 cm³.","Lieriön vaippa on suorakulmio, jonka ala on 30 cm² · 6.","Kaava pätee vain lieriölle, jonka pohja on suorakulmio.","Tilavuus saadaan kertomalla mikä tahansa ala kuudella."]},{"id":"H08","ryhma":"muut","kysymys":"Suoran särmiön pohja on kolmio, jonka kanta on 5 cm ja korkeus 4 cm. Särmiön korkeus on 9 cm. Laske särmiön tilavuus kuutiosenttimetreinä.","vastaus":90,"vinkki":"Kolmion ala on kanta kertaa korkeus jaettuna kahdella.","selitys":"A_p = 5 cm · 4 cm : 2 = 10 cm², ja V = 10 cm² · 9 cm = 90 cm³. Vastaus 180 syntyy, jos kolmion alaa ei jaeta kahdella."},{"id":"H09","ryhma":"muut","kysymys":"Kuusikulmaisen lyijykynän pohja on kuusikulmio, jonka ala on 0,52 cm². Kynä on 17,5 cm pitkä. Laske kynän tilavuus kuutiosenttimetreinä kymmenesosan tarkkuudella.","vastaus":9.1,"vinkki":"Kynä on lieriö: pohja kertaa pituus.","selitys":"Kynä on kuusikulmainen särmiö, jonka korkeus on kynän pituus. V = 0,52 cm² · 17,5 cm = 9,1 cm³."},{"id":"H10","ryhma":"muut","kysymys":"Suoran särmiön pohja on kuusikulmio, jonka voi jakaa kuudeksi yhteneväksi kolmioksi. Kunkin kolmion kanta on 5 cm ja korkeus 4 cm. Särmiön korkeus on 10 cm. Laske särmiön tilavuus kuutiosenttimetreinä.","vastaus":600,"vinkki":"Laske ensin yhden kolmion ala ja kerro se kuudella.","selitys":"Yhden kolmion ala on 5 cm · 4 cm : 2 = 10 cm², joten A_p = 6 · 10 cm² = 60 cm² ja V = 60 cm² · 10 cm = 600 cm³. Vastaus 1 200 syntyy, jos kolmion alaa ei jaeta kahdella, ja 100, jos unohdetaan, että kolmioita on kuusi."},{"id":"H11","ryhma":"muut","kysymys":"Suoran särmiön pohja on puolisuunnikas, jonka yhdensuuntaiset sivut ovat 8 cm ja 4 cm ja niiden välinen etäisyys 5 cm. Särmiön korkeus on 12 cm. Laske särmiön tilavuus kuutiosenttimetreinä.","vastaus":360,"vinkki":"Puolisuunnikkaan ala on yhdensuuntaisten sivujen keskiarvo kertaa niiden välinen etäisyys.","selitys":"A_p = (8 cm + 4 cm) : 2 · 5 cm = 30 cm², ja V = 30 cm² · 12 cm = 360 cm³. Vastaus 720 syntyy, jos sivujen summaa ei jaeta kahdella."},{"id":"H12","ryhma":"muut","kysymys":"Vinon ympyrälieriön pohjan säde on 3 cm. Pohjien kohtisuora etäisyys on 16 cm, ja vaipan vino jana pohjalta toiselle on 20 cm. Tilavuus on kπ cm³. Mikä on k?","vastaus":144,"vinkki":"Korkeus on pohjien kohtisuora etäisyys.","selitys":"V = π · 3² · 16 cm³ = 144π cm³, joten k = 144. Vastaus 180 syntyy, jos korkeudeksi otetaan vino jana 20 cm."},{"id":"H13","ryhma":"muut","kysymys":"Vinon särmiön pohja on kolmio, jonka kanta on 9 cm ja korkeus 4 cm. Sivusärmä on 13 cm, ja pohjien kohtisuora etäisyys on 11 cm. Laske särmiön tilavuus kuutiosenttimetreinä.","vastaus":198,"vinkki":"Pohjan ala kertaa pohjien kohtisuora etäisyys. Sivusärmä on vino.","selitys":"A_p = 9 cm · 4 cm : 2 = 18 cm², ja V = 18 cm² · 11 cm = 198 cm³. Vastaus 234 syntyy, jos korkeudeksi otetaan vino sivusärmä, ja 396, jos kolmion alaa ei jaeta kahdella."},{"id":"H14","ryhma":"muut","kysymys":"Vinon ympyrälieriön pohjan säde on 4 cm, vaipan vino jana pohjalta toiselle on 10 cm ja pohjien kohtisuora etäisyys on 8 cm. Minkä pituuden sijoitat kaavaan V = A_p · h korkeudeksi?","vastaus":1,"vinkki":"Mieti kallistettua korttipakkaa: mikä pituus ei muutu kallistettaessa?","selitys":"Korkeus on pohjien kohtisuora etäisyys 8 cm. Vino jana 10 cm on pidempi, ja sen käyttäminen antaisi liian suuren tilavuuden. Säde 4 cm tarvitaan pohjan alaan.","tyyppi":"monivalinta","vaihtoehdot":["4 cm","8 cm","10 cm","18 cm"]},{"id":"H15","ryhma":"sovellus","kysymys":"Suoran särmiön pohja on kolmio, jonka kanta on 6 cm ja korkeus 5 cm. Särmiön tilavuus on 225 cm³. Laske särmiön korkeus senttimetreinä.","vastaus":15,"vinkki":"Laske ensin pohjan ala ja ratkaise korkeus yhtälöstä 225 = A_p · h.","selitys":"A_p = 6 cm · 5 cm : 2 = 15 cm², joten 225 = 15 · h ja h = 225 : 15 = 15 cm. Vastaus 7,5 syntyy, jos kolmion alaa ei jaeta kahdella."},{"id":"H16","ryhma":"sovellus","kysymys":"Lieriön muotoisen kannun tilavuus on 1,5 l ja pohjan säde 6,5 cm. Laske kannun korkeus senttimetreinä millimetrin tarkkuudella.","vastaus":11.3,"vinkki":"Muunna ensin 1,5 l kuutiosenttimetreiksi ja sijoita luvut kaavaan V = πr²h.","selitys":"1,5 l = 1 500 cm³. Yhtälö 1 500 = π · 6,5² · h eli 1 500 = 132,73… · h, joten h = 1 500 : 132,73… = 11,30… cm ≈ 11,3 cm."},{"id":"H17","ryhma":"sovellus","kysymys":"Ympyrälieriön tilavuus on 800 cm³ ja korkeus 15 cm. Laske pohjan säde senttimetreinä millimetrin tarkkuudella.","vastaus":4.1,"vinkki":"Sijoita luvut: 800 = π · r² · 15. Ratkaise ensin r² ja ota sitten neliöjuuri.","selitys":"800 = π · r² · 15, joten r² = 800 : (15π) = 16,97… ja r = √16,97… cm = 4,12… cm ≈ 4,1 cm. Negatiivinen ratkaisu hylätään, koska säde on pituus. Vastaus 17,0 on r² eikä r."},{"id":"H18","ryhma":"sovellus","kysymys":"Ympyrälieriön pohjan säde on 30 mm ja korkeus 2 dm. Tilavuus on kπ cm³. Mikä on k?","vastaus":180,"vinkki":"Muunna molemmat mitat senttimetreiksi ennen laskemista.","selitys":"r = 30 mm = 3 cm ja h = 2 dm = 20 cm. V = π · 3² · 20 cm³ = 180π cm³, joten k = 180. Vastaus 1 800 syntyy, jos säde jää millimetreiksi ja korkeus desimetreiksi (30² · 2)."},{"id":"H19","ryhma":"sovellus","kysymys":"Laatikon sisämitat ovat 12 cm × 10 cm × 14 cm. Siihen pakataan pystyyn lieriön muotoinen purkki, jonka säde on 4,5 cm ja korkeus 14 cm. Montako prosenttia laatikon tilavuudesta jää tyhjäksi? Anna vastaus kokonaisina prosentteina ilman %-merkkiä.","vastaus":47,"vinkki":"Laske laatikon ja purkin tilavuus erikseen. Vertaa tyhjää tilaa laatikon tilavuuteen.","selitys":"Laatikko: 12 cm · 10 cm · 14 cm = 1 680 cm³. Purkki: π · 4,5² · 14 cm³ = 890,6… cm³. Tyhjää jää 1 680 cm³ − 890,6… cm³ = 789,3… cm³, ja 789,3… : 1 680 = 0,469… ≈ 47 %. Vastaus 53 on purkin osuus laatikosta."},{"id":"H20","ryhma":"sovellus","kysymys":"Lieriön muotoisen kattilan tilavuus on 3,0 l ja korkeus 20 cm. Laske pohjan säde senttimetreinä millimetrin tarkkuudella.","vastaus":6.9,"vinkki":"3,0 l = 3 000 cm³. Sijoita luvut kaavaan ja ratkaise ensin r².","selitys":"3 000 = π · r² · 20, joten r² = 3 000 : (20π) = 47,74… ja r = √47,74… cm = 6,90… cm ≈ 6,9 cm. Vastaus 47,7 on r² eikä r."}],"valmis_teksti":"Lasket lieriön tilavuuden kaavalla V = A_p · h, olipa pohja ympyrä, kolmio, puolisuunnikas tai kuusikulmio, ja perustelet kaavan pohjan muotoisilla kerroksilla. Vinossa lieriössä käytät korkeutena pohjien kohtisuoraa etäisyyttä etkä vinoa janaa. Muunnat mitat samaan yksikköön ennen laskemista, annat tuloksen tarvittaessa litroina, ratkaiset puuttuvan korkeuden tai säteen ja lasket, montako prosenttia laatikosta jää tyhjäksi, kun siihen pakataan purkki. Tämä taito on nyt näytetty."};

const esc = s => s;
const osat = D.teksti.map(o=>{
  switch(o.tyyppi){
    case "johdanto":
      return `<p class="lead">${esc(o.sisalto)}</p>`;
    case "kappale":
      return `<h2>${esc(o.otsikko)}</h2><p>${esc(o.sisalto)}</p>`;
    case "saanto":
      return `<div class="box"><h3>${esc(o.otsikko)}</h3><ol class="steps">${
        o.askeleet.map(a=>`<li><span>${esc(a)}</span></li>`).join("")}</ol></div>`;
    case "taulukko":
      return `<div class="box"><h3>${esc(o.otsikko)}</h3><div class="tablewrap"><table><thead><tr>${
        o.otsikkorivi.map(h=>`<th>${h}</th>`).join("")}</tr></thead><tbody>${
        o.rivit.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join("")}</tr>`).join("")}</tbody></table></div></div>`;
    case "ansa":
      return `<div class="box warn"><h3>${esc(o.otsikko)}</h3><p style="margin:0">${esc(o.sisalto)}</p></div>`;
    case "muistilappu":
      return `<div class="box note"><h3>${esc(o.otsikko)}</h3><ul class="notes">${
        o.kohdat.map(k=>`<li>${esc(k)}</li>`).join("")}</ul></div>`;
    case "numerotaulu":
      return `<div class="box nt"><h3>${esc(o.otsikko)}</h3><p class="ohje">${esc(o.sisalto)}</p>
        <div class="nt-valinta" id="ntValinta"></div>
        <div class="nt-taulu" id="ntTaulu"></div>
        <p class="nt-selite" id="ntSelite"></p></div>`;
    case "vahvuusportaat":
      return `<div class="box vp"><h3>${esc(o.otsikko)}</h3><p class="ohje">${esc(o.sisalto)}</p>
        <div class="vp-tasot">${o.tasot.map(t=>
          `<div class="vp-taso" data-taso="${t.id}"><span class="vp-pallo"></span>
           <div><strong>${t.nimi}</strong><span>${t.selite}</span></div></div>`).join("")}</div>

        <div class="vp-rivi"><button type="button" class="btn ghost" id="vpSeuraava">Toinen lauseke</button>
        <span class="vp-vastaus" id="vpVastaus"></span></div></div>`;
    case "laskujarjestys":
      return `<div class="box lj"><h3>${esc(o.otsikko)}</h3><p style="margin:0 0 12px;font-size:14.5px;color:var(--ink-2)">${esc(o.sisalto)}</p>

        <div class="lj-row"><button type="button" class="btn ghost" id="ljSeuraava">Toinen lauseke</button>
        <span class="lj-step" id="ljStep"></span></div></div>`;
    case "lukusuora":
      return `<div class="box nl"><h3>${esc(o.otsikko)}</h3><p style="margin:0 0 8px;font-size:14.5px;color:var(--ink-2)">${esc(o.sisalto)}</p>

          <span class="nl-out" id="nlout"></span>
        </div></div>`;
    default: return "";
  }
}).join("");

const X0=34, X1=606, Y=62;
function piirraNL(v){
  const ala=Math.floor(v/10)*10, yla=ala+10, puoli=ala+5;
  const pyor = (v%10)>=5 ? yla : ala;
  const x = n => X0 + (n/100)*(X1-X0);
  let s=`<line class="rail" x1="${X0}" y1="${Y}" x2="${X1}" y2="${Y}"/>`;
  for(let n=0;n<=100;n+=10){
    const near = (n===ala||n===yla);
    s+=`<line class="tick" x1="${x(n)}" y1="${Y-7}" x2="${x(n)}" y2="${Y+7}"/>`;
    s+=`<text class="stop${near?" near":""}" x="${x(n)}" y="${Y+24}" text-anchor="middle">${n}</text>`;
  }
  s+=`<line class="halfway" x1="${x(puoli)}" y1="${Y-16}" x2="${x(puoli)}" y2="${Y+12}"/>`;
  s+=`<text class="stop" x="${x(puoli)}" y="${Y-22}" text-anchor="middle">puoliväli ${puoli}</text>`;
  s+=`<circle class="dot" cx="${x(v)}" cy="${Y}" r="6"/>`;
  s+=`<text class="val" x="${x(v)}" y="${Y-32}" text-anchor="middle">${v}</text>`;
  s+=`<path d="M ${x(v)} ${Y+38} L ${x(pyor)} ${Y+38}" stroke="var(--core)" stroke-width="2" fill="none"/>`;
  s+=`<path d="M ${x(pyor)} ${Y+38} l ${x(pyor)>x(v)?-7:7} -4 l 0 8 z" fill="var(--core)"/>`;
  svg.innerHTML=s;
  out.textContent = `${v} pyöristyy → ${pyor}`;
}

/* ---------- laskujärjestys-widget ---------- */
const ljExp=document.getElementById("ljExp");
if(ljExp && D.kokeilu){
  let ljI=0, ljTokens=[], ljStep=0;
  const laske=(a,op,b)=>{a=+a;b=+b;return op==="×"?a*b:op==="÷"?a/b:op==="+"?a+b:a-b;};
  function ljAlku(){
    const l=D.kokeilu[ljI];
    ljTokens=l.lauseke.replace(/\(/g,"( ").replace(/\)/g," )").split(/\s+/).filter(Boolean);
    ljStep=0; ljPiirra(); ljViesti("","");
  }
  function ljViesti(t,lk){const f=document.getElementById("ljFb"); f.textContent=t; f.className="lj-fb "+(lk||"");}
  function ljPiirra(){
    const l=D.kokeilu[ljI];
    document.getElementById("ljStep").textContent =
      ljStep>=l.askeleet.length ? "valmis" : `askel ${ljStep+1} / ${l.askeleet.length}`;
    if(ljStep>=l.askeleet.length){
      ljExp.innerHTML=`<span class="valmis">${l.lauseke} = ${l.vastaus}</span>`;
      return;
    }
    ljExp.innerHTML=ljTokens.map((t,i)=>
      "×÷+−".includes(t) ? `<button type="button" class="op" data-i="${i}">${t}</button>`
                         : `<span class="tok">${t}</span>`).join("");
    ljExp.querySelectorAll("button.op").forEach(b=>b.addEventListener("click",()=>ljKlikkaa(+b.dataset.i)));
  }
  function ljKlikkaa(i){
    const l=D.kokeilu[ljI], odotettu=l.askeleet[ljStep];
    const ehdotus=[ljTokens[i-1],ljTokens[i],ljTokens[i+1]].join(" ");
    if(ehdotus!==odotettu){
      ljViesti(ljStep===0
        ? "Ei vielä. Sulkeet ovat vahvimmat, sitten kerto ja jako. Yhtä vahvat vasemmalta oikealle."
        : "Ei vielä. Kumpi jäljellä olevista on vahvempi?", "no");
      return;
    }
    const arvo=laske(ljTokens[i-1],ljTokens[i],ljTokens[i+1]);
    let alku=i-1, loppu=i+1;
    if(ljTokens[i-2]==="(" && ljTokens[i+2]===")"){ alku=i-2; loppu=i+2; }
    ljTokens.splice(alku, loppu-alku+1, String(arvo));
    ljStep++;
    ljViesti(ljStep>=l.askeleet.length ? "Valmis. Vastaus on "+l.vastaus+"." : "Oikein. Jatka seuraavaan.", "ok");
    ljPiirra();
  }
  document.getElementById("ljSeuraava").addEventListener("click",()=>{
    ljI=(ljI+1)%D.kokeilu.length; ljAlku();
  });
  ljAlku();
}

};

/* Suomalainen lukumuoto: välilyönti on tuhaterotin, pilkku desimaalierotin.
   Piste voi olla kumpi tahansa. Se tulkitaan tuhaterottimeksi VAIN silloin, kun
   koko luku on aitoa tuhaterotinmuotoa: alkuosa 1–3 numeroa ilman etunollaa ja
   jokainen jatko-osa täsmälleen 3 numeroa (1.500, 12.345.678). Kaikissa muissa
   tapauksissa piste on desimaalipiste — myös 0.125, joka vanhalla säännöllä
   ("3 numeroa pisteen jäljessä = tuhaterotin") luettiin virheellisesti luvuksi 125. */
const TUHATEROTIN = /^[1-9]\d{0,2}(\.\d{3})+$/;
function lueLuku(teksti){
  // Murtoluku (3/4, -3/4) ja sekaluku (1 2/3, -1 2/3) hyväksytään sellaisinaan.
  const raaka = String(teksti).replace(/\u00a0/g, " ").trim();
  let m = raaka.match(/^(-?)(\d+)\s+(\d+)\s*\/\s*(\d+)$/);
  if(m){ const nim = Number(m[4]); if(nim === 0) return null;
    const v = Number(m[2]) + Number(m[3]) / nim; return m[1] ? -v : v; }
  m = raaka.match(/^(-?)\s*(\d+)\s*\/\s*(\d+)$/);
  if(m){ const nim = Number(m[3]); if(nim === 0) return null;
    const v = Number(m[2]) / nim; return m[1] ? -v : v; }
  let s = String(teksti).replace(/[\s\u00a0]/g, "");
  if(s === "") return null;
  if(s.indexOf(",") >= 0){
    s = s.replace(/\./g, "").replace(",", ".");
  } else if(TUHATEROTIN.test(s)){
    s = s.replace(/\./g, "");
  }
  const n = Number(s);
  return Number.isFinite(n) ? n : null;
}

function tarkista(id){
  const h=D.harjoitukset.find(x=>x.id===id);
  const kentta=document.getElementById("in-"+id);
  const fb=document.getElementById("fb-"+id);
  if(kentta.value.trim()===""){ fb.className="fb hint"; fb.textContent="Kirjoita vastaus ensin."; return; }
  const luku=lueLuku(kentta.value);
  if(luku===null){ fb.className="fb no"; fb.textContent="Vastauksen pitää olla luku tai murtoluku (esimerkiksi 3/4)."; return; }
  const oikein = Math.abs(luku - h.vastaus) < 1e-9;
  merkitseTulos(id, oikein, oikein ? "Oikein. "+h.selitys : `Ei vielä. ${h.vinkki} Kokeile uudelleen.`);
}

function tarkistaMonivalinta(id, valittuIndeksi, painike){
  const h=D.harjoitukset.find(x=>x.id===id);
  const rivi=painike.closest(".row");
  rivi.querySelectorAll(".mv-valinta").forEach(b=>b.disabled=true);
  const oikein = valittuIndeksi===h.vastaus;
  painike.classList.add(oikein?"mv-oikein":"mv-vaarin");
  if(!oikein){
    const oikeaBtn=rivi.querySelector(`[data-i="${h.vastaus}"]`);
    if(oikeaBtn) oikeaBtn.classList.add("mv-oikein");
  }
  merkitseTulos(id, oikein, oikein ? "Oikein. "+h.selitys : `Ei ihan. Oikea vastaus on korostettu. ${h.selitys||""}`);
}

/* Kuuntelu: selain lukee tekstin ääneen omalla puhesynteesillään (englanniksi, jos laitteessa on
   englanninkielinen ääni). Ei äänitiedostoja eikä verkkoyhteyttä. Jos laite ei osaa puhua,
   teksti näytetään luettavaksi — silloin tehtävä muuttuu luetun ymmärtämiseksi, mutta ei katkea. */
function puhu(id, nopeus){
  const h=D.harjoitukset.find(x=>x.id===id); if(!h || !h.kuuntele) return;
  const vara=document.getElementById("vara-"+id);
  const naytaTeksti=syy=>{ vara.hidden=false; vara.textContent=syy+" Teksti: "+h.kuuntele; };
  if(!("speechSynthesis" in window)){ naytaTeksti("Tämä laite ei osaa lukea ääneen."); return; }
  const s=window.speechSynthesis; s.cancel();
  const u=new SpeechSynthesisUtterance(h.kuuntele);
  u.lang=h.kieli||"en-GB"; u.rate=nopeus;
  const aanet=s.getVoices(), kieli=u.lang.slice(0,2);
  const aani=aanet.find(a=>a.lang===u.lang) || aanet.find(a=>a.lang && a.lang.startsWith(kieli));
  if(aani) u.voice=aani;
  else if(aanet.length) { naytaTeksti("Laitteessa ei ole englanninkielistä ääntä."); return; }
  u.onerror=()=>naytaTeksti("Ääneen lukeminen ei onnistunut.");
  s.speak(u);
}
