<title>Yhtälö ratkaisee</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">

<style>
:root{
  --paper:#EFF2F5; --surface:#FFFFFF; --surface-2:#F7F9FB;
  --grid:#DCE3EA; --line:#C9D3DC;
  --ink:#15222C; --ink-2:#4E626F; --ink-3:#7E8F9B;
  --core:#1B5A9E; --core-soft:#E4EDF6;
  --strong:#1F6E5C; --strong-soft:#E1F0EB;
  --chal:#9A6A16; --chal-soft:#F6EDDC;
  --alert:#A33A2B; --alert-soft:#F8E7E3;
  --shadow:0 1px 2px rgba(21,34,44,.06), 0 8px 24px -12px rgba(21,34,44,.18);
  --r:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0F161B; --surface:#18222A; --surface-2:#1D2830;
    --grid:#22303A; --line:#2E3E4A;
    --ink:#E8EFF4; --ink-2:#A3B4C0; --ink-3:#7A8B97;
    --core:#7FB2E4; --core-soft:#16303F;
    --strong:#77CDB4; --strong-soft:#123028;
    --chal:#E0B267; --chal-soft:#33270F;
    --alert:#E8907F; --alert-soft:#3A1E19;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -14px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --paper:#0F161B; --surface:#18222A; --surface-2:#1D2830;
  --grid:#22303A; --line:#2E3E4A;
  --ink:#E8EFF4; --ink-2:#A3B4C0; --ink-3:#7A8B97;
  --core:#7FB2E4; --core-soft:#16303F;
  --strong:#77CDB4; --strong-soft:#123028;
  --chal:#E0B267; --chal-soft:#33270F;
  --alert:#E8907F; --alert-soft:#3A1E19;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -14px rgba(0,0,0,.7);
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:16px; line-height:1.62;
  background-image:
    linear-gradient(to right, var(--grid) 1px, transparent 1px),
    linear-gradient(to bottom, var(--grid) 1px, transparent 1px);
  background-size:26px 26px;
}
.wrap{max-width:760px; margin:0 auto; padding:28px 20px 90px}
h1,h2,h3,h4{font-family:"Familjen Grotesk","IBM Plex Sans",system-ui,sans-serif; text-wrap:balance}

/* header */
header.top{background:var(--surface); border:1px solid var(--line); border-radius:var(--r);
  box-shadow:var(--shadow); padding:22px 24px; display:flex; gap:18px; align-items:flex-start}
.badge{flex:0 0 auto; width:54px; height:54px; border-radius:9px; display:grid; place-items:center;
  background:var(--core-soft); border:1px solid var(--core); color:var(--core)}
.badge svg{width:28px; height:28px; fill:none; stroke:currentColor; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round}
.eyebrow{font-family:"IBM Plex Mono",monospace; font-size:11px; letter-spacing:.14em;
  text-transform:uppercase; color:var(--ink-3); margin:0 0 5px}
header.top h1{margin:0; font-size:30px; font-weight:700; letter-spacing:-.015em}
header.top p{margin:5px 0 0; color:var(--ink-2); font-size:15px}
.tags{display:flex; flex-wrap:wrap; gap:5px; margin-top:11px}
.tag{font-family:"IBM Plex Mono",monospace; font-size:10.5px; letter-spacing:.05em; padding:2px 7px;
  border-radius:4px; background:var(--surface-2); border:1px solid var(--line); color:var(--ink-3)}
.tag.core{background:var(--core-soft); border-color:var(--core); color:var(--core)}

/* teksti */
article{margin-top:26px}
article h2{font-size:21px; font-weight:600; margin:32px 0 10px; letter-spacing:-.01em}
article p{margin:0 0 14px; max-width:64ch}
.lead{font-size:17.5px; color:var(--ink); border-left:3px solid var(--core); padding-left:16px; margin:0 0 8px}

.box{background:var(--surface); border:1px solid var(--line); border-radius:var(--r);
  padding:18px 22px; box-shadow:var(--shadow); margin:22px 0}
.box h3{margin:0 0 12px; font-size:16.5px; font-weight:600}
.box.warn{border-left:3px solid var(--alert)}
.box.note{border-left:3px solid var(--chal)}

ol.steps{margin:0; padding-left:0; list-style:none; counter-reset:s; display:grid; gap:12px}
ol.steps li{counter-increment:s; display:grid; grid-template-columns:auto 1fr; gap:13px; align-items:start}
ol.steps li::before{content:counter(s); font-family:"Familjen Grotesk",sans-serif; font-weight:700; font-size:14px;
  width:26px; height:26px; border-radius:50%; background:var(--core); color:#fff; display:grid; place-items:center; margin-top:2px}

ul.notes{margin:0; padding-left:19px}
ul.notes li{margin-bottom:7px}
ul.notes li:last-child{margin-bottom:0}

.tablewrap{overflow-x:auto}
table{border-collapse:collapse; width:100%; font-size:14.5px; min-width:460px}
th,td{text-align:left; padding:9px 13px; border-bottom:1px solid var(--line)}
th{font-family:"IBM Plex Mono",monospace; font-size:10.5px; letter-spacing:.1em; text-transform:uppercase;
  color:var(--ink-3); font-weight:400; background:var(--surface-2)}
tr:last-child td{border-bottom:0}
td b{color:var(--core); font-weight:600}
td:last-child{font-variant-numeric:tabular-nums; font-weight:600}

/* lukusuora */
.nl svg{width:100%; height:118px; display:block}
.nl .rail{stroke:var(--line); stroke-width:2}
.nl .tick{stroke:var(--line); stroke-width:1.5}
.nl .stop{fill:var(--ink-3); font-family:"IBM Plex Mono",monospace; font-size:11px}
.nl .stop.near{fill:var(--core); font-weight:600}
.nl .dot{fill:var(--chal)}
.nl .val{fill:var(--ink); font-family:"Familjen Grotesk",sans-serif; font-size:15px; font-weight:700}
.nl .halfway{stroke:var(--chal); stroke-dasharray:3 3; stroke-width:1.5}
.nl-controls{display:flex; align-items:center; gap:14px; margin-top:6px}
.nl-controls input{flex:1; accent-color:var(--core)}
.nl-out{font-family:"Familjen Grotesk",sans-serif; font-size:15px; font-weight:600; min-width:12.5em; text-align:right}

/* paikka-arvotaulu */
.box .ohje{margin:0 0 14px; font-size:14.5px; color:var(--ink-2)}
.nt-valinta{display:flex; flex-wrap:wrap; gap:7px; margin-bottom:16px}
.nt-valinta button{font:inherit; font-size:12.5px; font-family:"IBM Plex Mono",monospace; padding:5px 11px;
  border-radius:6px; border:1px solid var(--line); background:var(--surface-2); color:var(--ink-2); cursor:pointer}
.nt-valinta button[aria-pressed="true"]{background:var(--ink); color:var(--paper); border-color:var(--ink)}
.nt-valinta button:focus-visible{outline:2px solid var(--core); outline-offset:2px}
.nt-taulu{display:flex; flex-direction:column; gap:4px; align-items:flex-start; overflow-x:auto; padding-bottom:4px}
.nt-rivi{display:flex; gap:6px; align-items:center}
.nt-rivi .otsa{font-family:"IBM Plex Mono",monospace; font-size:9.5px; letter-spacing:.08em;
  text-transform:uppercase; color:var(--ink-3); width:52px; text-align:center}
.nt-ruutu{width:52px; height:52px; display:grid; place-items:center; border:1.5px solid var(--line);
  border-radius:7px; background:var(--surface-2); font-family:"IBM Plex Mono",monospace; font-size:24px}
.nt-ruutu.kohta{border-color:var(--core); background:var(--core-soft); color:var(--core); font-weight:500}
.nt-ruutu.ratkaiseva{border-color:var(--chal); background:var(--chal-soft); color:var(--chal); font-weight:500}
.nt-ruutu.nolla{color:var(--ink-3)}
.nt-rivi .nimi{font-size:12.5px; color:var(--ink-3); margin-left:12px; white-space:nowrap}
.nt-nuoli{font-size:17px; color:var(--chal); margin-left:6px}
.nt-selite{margin:14px 0 0; font-size:14.5px}
.nt-selite b{color:var(--core)}

/* vahvuusportaat */
.vp-tasot{display:grid; gap:9px; margin-bottom:18px}
.vp-taso{display:flex; gap:11px; align-items:flex-start; font-size:13.5px}
.vp-taso .vp-pallo{width:13px; height:13px; border-radius:4px; margin-top:5px; flex:0 0 auto}
.vp-taso[data-taso="sulkeet"] .vp-pallo{background:var(--core)}
.vp-taso[data-taso="kertojako"] .vp-pallo{background:var(--strong)}
.vp-taso[data-taso="yhteenvahennys"] .vp-pallo{background:var(--chal)}
.vp-taso strong{display:block; font-family:"Familjen Grotesk",sans-serif; font-weight:600; font-size:14.5px}
.vp-taso span{color:var(--ink-2)}
.vp-lauseke{display:flex; flex-wrap:wrap; gap:7px; align-items:flex-end; font-family:"IBM Plex Mono",monospace;
  font-size:25px; padding:10px 2px; min-height:64px}
.vp-lauseke .t{padding:2px 3px}
.vp-lauseke .op{position:relative; padding:2px 9px; border-radius:6px; font-weight:500}
.vp-lauseke .op[data-taso="sulkeet"]{background:var(--core-soft); color:var(--core)}
.vp-lauseke .op[data-taso="kertojako"]{background:var(--strong-soft); color:var(--strong)}
.vp-lauseke .op[data-taso="yhteenvahennys"]{background:var(--chal-soft); color:var(--chal)}
.vp-lauseke .op i{position:absolute; top:-9px; right:-6px; font-style:normal; font-family:"Familjen Grotesk",sans-serif;
  font-size:11px; font-weight:700; width:18px; height:18px; border-radius:50%; display:grid; place-items:center;
  background:currentColor}
.vp-lauseke .op i span{color:var(--surface)}
.vp-rivi{display:flex; align-items:center; gap:16px; margin-top:8px}
.vp-vastaus{font-family:"Familjen Grotesk",sans-serif; font-size:16px; font-weight:600; color:var(--strong)}

/* laskujärjestys-widget */
.lj-exp{display:flex; flex-wrap:wrap; gap:7px; align-items:center; font-family:"IBM Plex Mono",monospace;
  font-size:23px; padding:14px 4px; min-height:62px}
.lj-exp .tok{padding:2px 4px; color:var(--ink)}
.lj-exp button.op{font-family:"IBM Plex Mono",monospace; font-size:23px; padding:3px 12px; border-radius:7px;
  border:1.5px solid var(--line); background:var(--surface-2); color:var(--ink); line-height:1.2}
.lj-exp button.op:hover{border-color:var(--core); color:var(--core)}
.lj-exp button.op:focus-visible{outline:2px solid var(--core); outline-offset:2px}
.lj-exp .valmis{font-family:"Familjen Grotesk",sans-serif; font-size:23px; font-weight:700; color:var(--strong)}
.lj-fb{font-size:14.5px; min-height:1.5em; color:var(--ink-2)}
.lj-fb.no{color:var(--alert)}
.lj-fb.ok{color:var(--strong)}
.lj-row{display:flex; align-items:center; gap:14px; margin-top:10px}
.lj-step{font-family:"IBM Plex Mono",monospace; font-size:11.5px; letter-spacing:.1em;
  text-transform:uppercase; color:var(--ink-3)}

/* harjoitukset */
.progress{position:sticky; top:0; z-index:5; background:var(--surface); border:1px solid var(--line);
  border-radius:var(--r); padding:12px 18px; box-shadow:var(--shadow); display:flex; align-items:center;
  gap:14px; margin:34px 0 18px}
.progress .lbl{font-family:"IBM Plex Mono",monospace; font-size:11px; letter-spacing:.12em;
  text-transform:uppercase; color:var(--ink-3); white-space:nowrap}
.progress .meter{flex:1; height:7px; border-radius:4px; background:var(--surface-2); border:1px solid var(--line); overflow:hidden}
.progress .meter i{display:block; height:100%; background:var(--core); transition:width .25s ease}
.progress .cnt{font-family:"Familjen Grotesk",sans-serif; font-weight:700; font-variant-numeric:tabular-nums; white-space:nowrap}

.grp{margin-top:26px}
.grp-head{display:flex; align-items:baseline; gap:10px; border-bottom:1.5px solid var(--ink); padding-bottom:7px; margin-bottom:14px}
.grp-head h3{margin:0; font-size:17px; font-weight:600}
.grp-head span{font-size:12.5px; color:var(--ink-2)}

.ex{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:14px 16px; margin-bottom:10px}
.ex[data-tila="oikein"]{border-color:var(--strong); box-shadow:inset 3px 0 0 var(--strong)}
.ex[data-tila="vaarin"]{border-color:var(--alert); box-shadow:inset 3px 0 0 var(--alert)}
.ex .q{display:flex; gap:11px; align-items:baseline; flex-wrap:wrap}
.ex .num{font-family:"IBM Plex Mono",monospace; font-size:11.5px; color:var(--ink-3); min-width:2.4em}
.ex .txt{flex:1; min-width:190px; font-size:15.5px}
.ex .txt .aineisto{display:block; margin-bottom:9px; padding-left:12px;
  border-left:2px solid var(--line); color:var(--ink-2); line-height:1.6;
  /* Aineisto voi olla pieni taulukko, jonka rivit on erotettu rivinvaihdoilla.
     Ilman pre-lineä ne valuisivat yhdeksi kappaleeksi ja taulukko katoaisi. */
  white-space:pre-line}
.ex .txt .kysymysrivi{display:block; font-weight:600}
.ex .row{display:flex; gap:8px; align-items:center; margin-top:11px; flex-wrap:wrap}
.ex input[type=text]{font:inherit; font-family:"IBM Plex Mono",monospace; font-size:15px; width:8.5em;
  padding:7px 11px; border:1px solid var(--line); border-radius:7px; background:var(--surface-2);
  color:var(--ink); text-align:right}
.ex input:focus-visible{outline:2px solid var(--core); outline-offset:1px}
button{font:inherit; cursor:pointer}
.btn{font-size:13.5px; padding:7px 15px; border-radius:7px; border:1px solid var(--core);
  background:var(--core); color:#fff}
.btn.ghost{background:transparent; color:var(--ink-2); border-color:var(--line)}
.btn:focus-visible{outline:2px solid var(--core); outline-offset:2px}
.btn.mv-valinta{text-align:left}
/* kuuntelutehtävä: selaimen puhesynteesi lukee englanninkielisen tekstin */
.kuuntele{display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin:2px 0 10px}
.kuuntele .btn{display:inline-flex; gap:7px; align-items:center}
.kuuntele svg{width:16px; height:16px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round}
.kuuntele .varateksti{flex-basis:100%; font-size:14px; color:var(--ink-2); background:var(--surface-2);
  border-radius:7px; padding:8px 12px; margin:0}
.btn.mv-valinta:disabled{cursor:default; opacity:.65}
.btn.mv-oikein{background:var(--strong-soft); border-color:var(--strong); color:var(--strong); opacity:1}
.btn.mv-vaarin{background:var(--alert-soft); border-color:var(--alert); color:var(--alert); opacity:1}
.row.mv{gap:8px 10px}
.fb{margin-top:11px; font-size:14.5px; padding:10px 13px; border-radius:8px; line-height:1.5}
.fb.ok{background:var(--strong-soft); color:var(--strong)}
.fb.no{background:var(--alert-soft); color:var(--alert)}
.fb.hint{background:var(--chal-soft); color:var(--chal)}

.done{background:var(--strong-soft); border:1px solid var(--strong); color:var(--strong);
  border-radius:var(--r); padding:16px 20px; margin-top:20px; font-size:15.5px}
.done h3{margin:0 0 4px; font-size:17px; color:var(--strong)}

details.teacher{margin-top:34px; background:var(--surface); border:1px solid var(--line);
  border-left:3px solid var(--chal); border-radius:var(--r); padding:15px 20px; box-shadow:var(--shadow)}
details.teacher summary{cursor:pointer; font-family:"Familjen Grotesk",sans-serif; font-weight:600; font-size:15px}
details.teacher summary:focus-visible{outline:2px solid var(--core); outline-offset:3px}
details.teacher ul{margin:12px 0 0; padding-left:19px; color:var(--ink-2); font-size:14.5px}
details.teacher li{margin-bottom:8px}
details.teacher p{margin:12px 0 0; color:var(--ink-2); font-size:14.5px}

.back{display:inline-block; margin-top:30px; font-size:13.5px; color:var(--ink-2)}
.back a{color:var(--core)}

@media (prefers-reduced-motion: reduce){*{transition:none !important}}
@media (max-width:560px){
  .wrap{padding:16px 13px 70px}
  header.top h1{font-size:25px}
  .progress{flex-wrap:wrap}
}
</style>

<div class="wrap">

  <header class="top">
    <span class="badge"><svg viewBox="0 0 24 24" aria-hidden="true" id="ikoni"></svg></span>
    <div>
      <p class="eyebrow" id="eyebrow"></p>
      <h1 id="otsikko"></h1>
      <p id="kuvaus"></p>
      <div class="tags" id="tags"></div>
    </div>
  </header>

  <article id="teksti"></article>

  <div class="progress" aria-live="polite">
    <span class="lbl">Harjoitukset</span>
    <span class="meter"><i id="pbar" style="width:0%"></i></span>
    <span class="cnt" id="pcnt">0 / 20</span>
  </div>

  <div id="harjoitukset"></div>
  <div id="valmis"></div>

  <p class="back" id="back"></p>

</div>

<script>
const D = {"tavoite_id":"MAT9-YHT-01","oppiaine":"MAT","vuosiluokka":9,"otsikko":"Yhtälö ratkaisee","kuvaus":"Osaan valita ongelmaan sopivan mallin, kuten kaavan, prosenttiyhteyden tai kuvion mittojen välisen yhteyden, muodostaa siitä yhtälön ja arvioida ratkaisun mielekkyyttä.","versio":"0.2","paivitetty":"2026-10-11","ops":{"T":["T5","T6","T7","T13","T14"],"S":["S3"]},"taso":"ydin","ikoni":"ajattelu","eyebrow":"Matematiikka · 9. luokka · Yhtälöt ja epäyhtälöt","teksti":[{"tyyppi":"johdanto","sisalto":"Kaverisi asuu 21 kilometrin päässä. Sovitte, että lähdette samaan aikaan pyöräilemään toisianne kohti: sinä ajat 15 km/h ja kaveri 20 km/h. Kuinka monen minuutin kuluttua kohtaatte? Tehtävä ei kerro, mitä kaavaa tai yhtälöä pitää käyttää. Se on sinun päätöksesi. Tilanteessa on matkoja, nopeuksia ja aikaa, joten malli on kaava matka = nopeus · aika. Kun x on kohtaamiseen kuluva aika tunteina, sinä ajat 15x kilometriä ja kaveri 20x kilometriä, ja yhdessä ajatte koko välimatkan: 15x + 20x = 21. Siitä 35x = 21 ja x = 0,6. Vastaus ei ole 0,6 minuuttia eikä 6 minuuttia, koska x on tunteja: 0,6 h = 0,6 · 60 min = 36 min. Tarkistus tilanteesta: 0,6 tunnissa sinä ajat 9 km ja kaveri 12 km, yhteensä 21 km. Tässä taidossa ratkaiset monivaiheisia ongelmia, joissa mallia ei anneta valmiina. Valitset itse, syntyykö yhtälö kaavasta, prosenttiyhteydestä vai kuvion mitoista, kerrot, mitä x tarkoittaa ja missä yksikössä, ja arvioit, onko ratkaisu tilanteessa mahdollinen. Laskin on sallittu, mutta yhtälö kirjoitetaan aina näkyviin."},{"tyyppi":"taulukko","otsikko":"Mistä malli tunnistetaan","otsikkorivi":["Vihje tehtävässä","Malli","Yhteys, josta yhtälö syntyy"],"rivit":[["matkoja, nopeuksia ja aikoja (km, km/h, h, min)","kaava","matka = nopeus · aika"],["hinta koostuu kiinteästä maksusta ja määrästä (avausmaksu, minuuttihinta, kilometrihinta)","kaava","hinta = kiinteä maksu + yksikköhinta · määrä"],["alennus tai korotus prosentteina ja lisäksi euromäärä","prosenttiyhteys","muuttunut arvo = prosenttikerroin · alkuperäinen arvo"],["liuos tai seos ja pitoisuus prosentteina","prosenttiyhteys","aineen määrä = pitoisuus · koko seoksen määrä"],["kolmion tai nelikulmion kulmat","kuvion mitat","kulmien summa on kolmiossa 180° ja nelikulmiossa 360°"],["sivujen pituudet, piiri tai pinta-ala","kuvion mitat","piiri on sivujen summa, suorakulmion ala = pituus · leveys"],["suorakulmainen kolmio kuviossa, esimerkiksi lävistäjä tai kolmion korkeus","kuvion mitat","Pythagoraan lause a² + b² = c²"],["ympyrän säde, kehä tai ala","kuvion mitat","ala πr², kehä 2πr"]]},{"tyyppi":"saanto","otsikko":"Näin ratkaiset ongelman, jossa mallia ei kerrota","askeleet":["Lue tehtävä loppuun ja kirjoita ylös, mitä kysytään ja missä yksikössä.","Valitse malli taulukon vihjeiden avulla ja perustele se yhdellä lauseella, esimerkiksi: Yhtälö perustuu kolmion kulmien summaan 180°.","Kirjoita, mitä x tarkoittaa ja missä yksikössä: x = kohtaamiseen kuluva aika tunteina. Yksikkö kuuluu merkitykseen, koska 0,6 tuntia ja 0,6 minuuttia ovat eri asioita.","Ilmaise muut suureet x:n avulla ja muodosta yhtälö. Arvioi vastauksen suuruusluokka ennen laskemista.","Ratkaise yhtälö välivaihein. Käytä laskinta vain lukuarvojen laskemiseen, pidä välitulokset laskimessa pyöristämättä ja pyöristä vasta vastaus.","Laske kysytty suure. Jos x on kantakulma ja kysytään huippukulmaa, laske huippukulma x:n avulla.","Tarkista tulos alkuperäisestä tilanteesta, ei omasta yhtälöstäsi. Laske tekstin vaiheet järjestyksessä löytämästäsi luvusta. Sijoitus omaan yhtälöön paljastaa vain laskuvirheen, koska väärin muodostetun yhtälön ratkaisu toteuttaa juuri sen väärän yhtälön.","Hylkää ratkaisu, joka ei ole tilanteessa mahdollinen, ja kerro miksi: pituus, kulma, aika ja määrä eivät voi olla negatiivisia, ja henkilöiden määrä on kokonaisluku.","Kirjoita vastaus kysyttynä suureena ja oikeassa yksikössä."]},{"tyyppi":"kappale","otsikko":"Kaavat: matka, nopeus, aika ja hinnasto","sisalto":"Matka, nopeus ja aika liittyvät toisiinsa kaavalla s = v · t: matka on nopeus kertaa aika. Kun nopeus on kilometreinä tunnissa (km/h), ajan pitää olla tunteina ja matkan kilometreinä. Johdannon kohtaamisessa yhtälö syntyy siitä, että kaksi kulkijaa kulkee yhdessä koko välimatkan. Toinen tapa ajatella on, että välimatka lyhenee joka tunti 15 km + 20 km = 35 km, koska molemmat liikkuvat toisiaan kohti. Siksi nopeudet lasketaan yhteen. Kahden osamatkan tehtävässä matkat lasketaan yhteen samalla tavalla. Juna kulki ensin 1 h ja sitten 30 min nopeudella, joka oli 40 km/h pienempi, ja matkaa kertyi 160 km. Kun x = nopeus ensimmäisellä osalla kilometreinä tunnissa, toisen osan nopeus on x − 40 ja aika 30 min = 0,5 h. Yhtälö on x + 0,5(x − 40) = 160, josta 1,5x − 20 = 160, 1,5x = 180 ja x = 120. Jälkimmäisen osan nopeus oli 120 − 40 = 80 km/h. Tarkistus: 120 km + 0,5 · 80 km = 160 km. Kun sama matka kuljetaan kahdella tavalla, yhtälö syntyy siitä, että matkat ovat yhtä pitkät. Koulumatka kestää pyörällä (20 km/h) 18 minuuttia vähemmän kuin kävellen (5 km/h). Kun x = kävelyaika tunteina, pyöräilyaika on x − 0,3, koska 18 min = 18/60 h = 0,3 h. Yhtälö on 5x = 20(x − 0,3), josta 5x = 20x − 6, 15x = 6 ja x = 0,4. Koulumatka on 5 · 0,4 = 2 km. Tarkistus: kävellen matka kestää 0,4 h = 24 min ja pyörällä 0,1 h = 6 min, ja ero on 18 min. Hinnaston kaava on toinen tavallinen malli: hinta = kiinteä maksu + yksikköhinta · määrä. Sähköpotkulaudan avausmaksu on 1,00 € ja minuuttihinta 0,25 €. Kaupunkipyörän käyttö maksaa 2,00 € ja 0,15 € minuutilta. Kun x = ajoaika minuutteina, hinnat ovat 1,00 + 0,25x ja 2,00 + 0,15x. Kun hinnat ovat yhtä suuret, 1,00 + 0,25x = 2,00 + 0,15x, josta 0,10x = 1,00 ja x = 10. Kymmenen minuutin ajo maksaa molemmilla 3,50 €. Kun taksin hinta jaetaan, yhtälöön tulee koko hinta. Kaksi kaverusta maksoi kumpikin 12,40 €, aloitusmaksu oli 6,80 € ja kilometrihinta 1,80 €. Kun x = matkan pituus kilometreinä, 6,80 + 1,80x = 2 · 12,40, josta 1,80x = 18 ja x = 10. Matka oli 10 km."},{"tyyppi":"ansa","otsikko":"Ansa 1: tunnit eivät ole minuutteja, eikä nopeuksia vähennetä","sisalto":"Johdannon yhtälöstä saadaan x = 0,6, ja x on tunteja. Vastaus 6 min tai 60 min syntyy, kun desimaaliosa luetaan minuuteiksi. Tunnissa on 60 minuuttia, ei 100, joten 0,6 h = 0,6 · 60 min = 36 min. Samasta syystä 0,75 h on 45 min eikä 75 min, ja 45 min on 0,75 h eikä 0,45 h. Kun minuutit tulevat yhtälöön, jossa nopeus on km/h, jaa minuutit 60:llä. Kohtaamisessa toinen virhe on vähentää nopeudet: 20x − 15x = 21 antaa x = 4,2. Sijoitus tähän yhtälöön toimii, mutta tilanteeseen ratkaisu ei sovi: 4,2 tunnissa kaveri ajaisi 84 km ja sinä 63 km, yhteensä 147 km, vaikka välimatka on 21 km. Kun kuljetaan toisiaan kohti, välimatka lyhenee molempien kulkeman matkan verran, joten matkat ja nopeudet lasketaan yhteen."},{"tyyppi":"kappale","otsikko":"Prosenttiyhteys kahdessa vaiheessa","sisalto":"Prosenttikerroin kertoo, montako prosenttia alkuperäisestä arvosta muutoksen jälkeen on: 35 %:n alennuksen jälkeen hinnasta on jäljellä 65 %, joten alennettu hinta on 0,65x, ja 8 %:n korotuksen jälkeen maksu on 1,08x. Tässä taidossa prosenttimuutokseen liittyy toinen vaihe, yleensä kiinteä euromäärä. Takin hintaa alennettiin 35 %, ja tilaukseen lisättiin 5,90 € toimitusmaksu. Maksoit 64,40 €. Kun x = takin alkuperäinen hinta euroina, alennettu hinta on 0,65x, ja toimitusmaksu lisätään vasta sen jälkeen: 0,65x + 5,90 = 64,40. Siitä 0,65x = 58,50 ja x = 90. Takin alkuperäinen hinta oli 90 €. Tarkistus tekstistä: 35 % 90 eurosta on 31,50 €, joten takki maksoi alennettuna 58,50 €, ja toimitusmaksun kanssa 64,40 €. Vaiheiden järjestys ratkaisee yhtälön muodon: alennus koskee vain takkia eikä toimitusmaksua, joten kerroin 0,65 kertoo vain x:n. Sama rakenne toimii korotuksessa. Jos kuukausimaksua korotettiin 8 % ja ensimmäiseen laskuun lisättiin 4,50 € avausmaksu ja lasku oli 45,00 €, yhtälö on 1,08x + 4,50 = 45,00, josta 1,08x = 40,50 ja x = 37,50 €. Pitoisuus on aineen osuus koko seoksesta: aineen määrä = pitoisuus · seoksen määrä. Perusarvo on koko seos eli aine ja vesi yhdessä, ei pelkkä vesi. Sokeriliuoksessa on sokeria 6 %. Montako grammaa liuosta voi valmistaa 45 grammasta sokeria? Kun x = liuoksen massa grammoina, 0,06x = 45 ja x = 750. Liuosta tulee 750 g, ja vettä tarvitaan 750 g − 45 g = 705 g. Jos taas vettä on 470 g ja liuoksessa pitää olla 6 % suolaa, merkitse x = suolan massa grammoina. Liuoksen massa on 470 + x, joten 0,06(470 + x) = x. Siitä 28,2 + 0,06x = x, 28,2 = 0,94x ja x = 30. Suolaa tarvitaan 30 g. Tarkistus: liuosta on 500 g, ja 6 % siitä on 30 g. Lasku 0,06 · 470 = 28,2 g olisi väärin, koska siinä perusarvona on pelkkä vesi."},{"tyyppi":"ansa","otsikko":"Ansa 2: väärä prosenttimalli läpäisee sijoituksen","sisalto":"Takkitehtävästä on helppo kirjoittaa 0,65(x + 5,90) = 64,40. Siinä alennus on laskettu myös toimitusmaksusta. Ratkaisu on x ≈ 93,18, ja sijoitus samaan yhtälöön toimii: 0,65 · (93,18 + 5,90) ≈ 64,40. Tarkistus tekstistä paljastaa virheen: 93,18 eurosta jää 35 %:n alennuksella 60,57 €, ja toimitusmaksun kanssa tilaus maksaisi 66,47 €, ei 64,40 €. Toinen tavallinen virhe on kumota alennus lisäämällä alennettuun hintaan 35 %: 58,50 € · 1,35 = 78,975 € ≈ 78,98 €. Alennus laskettiin alkuperäisestä hinnasta, mutta lisäys lasketaan pienemmästä, alennetusta hinnasta, joten lisäys jää liian pieneksi. Tarkistus: 78,98 eurosta jää 35 %:n alennuksella 51,34 €, ja toimitusmaksun kanssa summa on 57,24 €. Tarkista siis alkuperäisestä tilanteesta: laske tekstin vaiheet järjestyksessä löytämästäsi luvusta ja vertaa tulosta tekstissä annettuun lukuun. Sijoitus omaan yhtälöön paljastaa vain laskuvirheen, ei väärää yhtälöä."},{"tyyppi":"kappale","otsikko":"Kuvion mitat: kulmat, pituudet ja alat","sisalto":"Kuvion mitoista yhtälö syntyy geometrian tiedosta, jota tehtävä ei mainitse. Tasakylkisen kolmion huippukulma on 30° suurempi kuin kumpikin kantakulma. Kantakulmat ovat yhtä suuret, joten kun x = kantakulma asteina, huippukulma on x + 30. Kolmion kulmien summa on 180°: x + x + (x + 30) = 180, josta 3x = 150 ja x = 50. Kysyttiin huippukulmaa, joten vastaus on 50° + 30° = 80°. Tarkistus: 50° + 50° + 80° = 180°, ja 80° on 30° suurempi kuin 50°. Nelikulmion kulmien summa on 360°. Jos nelikulmion kolme kulmaa ovat yhtä suuret ja neljäs on 40° suurempi kuin kukin niistä, 3x + (x + 40) = 360, joten x = 80 ja suurin kulma on 120°. Suorakulmion muotoisen tontin pituus on kolme kertaa sen leveys, ja pinta-ala on 1 200 m². Kun x = leveys metreinä, pituus on 3x ja ala 3x · x = 3x². Yhtälöstä 3x² = 1 200 saadaan x² = 400, joten x = 20 tai x = −20. Leveys ei voi olla negatiivinen, joten x = −20 hylätään, ja tontti on 20 m leveä ja 60 m pitkä. Pythagoraan lause antaa yhtälön, kun kuviossa on suorakulmainen kolmio. Suorakulmion pituus on kaksi kertaa sen leveys, ja lävistäjä on 15 cm. Lävistäjä jakaa suorakulmion kahdeksi suorakulmaiseksi kolmioksi, joiden kateetit ovat suorakulmion sivut. Kun x = leveys senttimetreinä, x² + (2x)² = 15², eli 5x² = 225 ja x² = 45. Ala on 2x · x = 2x² = 2 · 45 = 90 cm². Alan laskemiseen tarvitaan x², ei x:ää, joten pyöristystä ei tarvita. Jos lasket ensin x ≈ 6,708, pidä se laskimessa pyöristämättä. Tasakylkisen kolmion korkeus jakaa kannan kahtia, ja kolmion puolikas on suorakulmainen kolmio. Kun kylki on 3 cm pidempi kuin kanta ja piiri on 36 cm, x = kanta senttimetreinä: x + 2(x + 3) = 36, josta 3x = 30 ja x = 10. Kylki on 13 cm. Korkeuden kolmiossa kateetit ovat korkeus h ja puolikas kanta 5 cm, ja hypotenuusa on kylki 13 cm: h² + 5² = 13², h² = 144 ja h = 12 cm. Ympyrän säde saadaan alasta sijoittamalla luvut ensin. Pyöreän kukkapenkin ala on 28 m². Kun r = säde metreinä, πr² = 28, joten r² = 28/π ja r ≈ 2,985 m, kun negatiivinen ratkaisu hylätään. Reunakivetyksen pituus on kehä 2πr ≈ 18,8 m. Kenttätehtävässä yksikkö muunnetaan ensin. Suorakulmion muotoisen kentän pituus on 30 m suurempi kuin sen leveys, ja kun sen ympäri juostaan viisi kierrosta, matkaa kertyy 1,7 km = 1 700 m. Kun x = leveys metreinä, yksi kierros on 2x + 2(x + 30) = 4x + 60 metriä, ja 5(4x + 60) = 1 700. Siitä 4x + 60 = 340 ja x = 70, joten kentän ala on 70 m · 100 m = 7 000 m²."},{"tyyppi":"ansa","otsikko":"Ansa 3: vastaus x:llä ja ratkaisu, joka ei ole mahdollinen","sisalto":"Kolmiotehtävässä yhtälön ratkaisu on x = 50, mutta kysyttiin huippukulmaa. Vastaus 50° on kantakulma. Lue kysymys uudelleen ratkaisun jälkeen ja katso muuttujan merkityksestä, mikä suure x on. Tonttitehtävässä yhtälöllä x² = 400 on kaksi ratkaisua, mutta vastaus ±20 m tai −20 m on väärin, koska leveys ei voi olla negatiivinen. Kirjoita hylkäys näkyviin: x = −20 hylätään, koska leveys ei voi olla negatiivinen. Henkilöiden, lippujen ja esineiden määrä on kokonaisluku. Aikuisen lippu maksaa 14 € ja nuoren 9 €. Ryhmässä on 3 nuorta enemmän kuin aikuisia, ja liput maksoivat 120 €. Kun x = aikuisten määrä, nuoria on x + 3, ja 14x + 9(x + 3) = 120. Siitä 23x + 27 = 120, 23x = 93 ja x ≈ 4,04. Aikuisten määrä ei ole kokonaisluku, joten tieto ei voi pitää paikkansa. Vastaus 4 aikuista on väärin: neljällä aikuisella ja seitsemällä nuorella liput maksaisivat 56 € + 63 € = 119 €. Sama koskee kulmia. Jos kolmion kulma B olisi 70° suurempi kuin kulma A ja kulma C kaksi kertaa niin suuri kuin kulma B, yhtälöstä x + (x + 70) + 2(x + 70) = 180 tulisi 4x + 210 = 180 ja x = −7,5. Kulma ei voi olla negatiivinen, joten tällaista kolmiota ei ole olemassa."},{"tyyppi":"muistilappu","otsikko":"Muista nämä","kohdat":["Valitse malli ja perustele se yhdellä lauseella: kaava, prosenttiyhteys tai kuvion mitat.","Kirjoita x:n merkitys yksikköineen: x = kohtaamiseen kuluva aika tunteina.","Toisiaan kohti kuljettaessa nopeudet lasketaan yhteen. Tunnit minuuteiksi kertomalla 60:llä, minuutit tunneiksi jakamalla 60:llä.","Alennus ja maksu: kerroin kertoo vain sen, mistä prosentti otetaan, esimerkiksi 0,65x + 5,90.","Pitoisuus: aineen määrä = pitoisuus · koko seoksen määrä. Perusarvo on koko seos.","Tarkista tekstistä, älä omasta yhtälöstä. Hylkää negatiivinen pituus, kulma tai aika sekä henkilöiden, lippujen tai esineiden määrä, joka ei ole kokonaisluku.","Vastaa kysyttyyn suureeseen oikeassa yksikössä."]}],"harjoitusryhmat":[{"id":"malli","nimi":"Malli, muuttuja ja yksikkö","info":"Laskin on sallittu. Kirjoita yhtälö vihkoon ja käytä laskinta vain lukuarvojen laskemiseen. Päätä ensin, mihin yhteyteen yhtälö perustuu ja mitä x tarkoittaa yksikköineen."},{"id":"kysytty","nimi":"Monivaiheiset ongelmat","info":"Laskin on sallittu. Kirjoita yhtälö välivaiheineen vihkoon ja käytä laskinta vain lukuarvojen laskemiseen. Kysytty suure ei aina ole x, joten lue kysymys ratkaisun jälkeen uudelleen."},{"id":"tarkistus","nimi":"Mielekkyys ja tarkistus","info":"Laskin on sallittu. Kirjoita yhtälö vihkoon ja käytä laskinta vain lukuarvojen laskemiseen. Tarkista tulos tehtävän tekstistä ja hylkää ratkaisu, joka ei ole tilanteessa mahdollinen."}],"harjoitukset":[{"id":"H01","ryhma":"malli","kysymys":"Kaksi kaverusta lähtee samaan aikaan pyöräilemään toisiaan kohti 27 km:n päästä toisistaan. Toinen ajaa 12 km/h ja toinen 18 km/h. Merkitse x:llä kohtaamiseen kuluvaa aikaa tunteina. Mikä on x?","vastaus":0.9,"vinkki":"Kumpikin ajaa x tunnissa nopeus · x kilometriä, ja yhdessä he ajavat koko välimatkan.","selitys":"Yhtälö perustuu kaavaan matka = nopeus · aika: 12x + 18x = 27, joten 30x = 27 ja x = 0,9. Kaverukset kohtaavat 0,9 tunnin kuluttua. Tarkistus tekstistä: 12 · 0,9 = 10,8 km ja 18 · 0,9 = 16,2 km, yhteensä 27 km."},{"id":"H02","ryhma":"malli","kysymys":"Kaksi kaverusta lähtee samaan aikaan pyöräilemään toisiaan kohti 27 km:n päästä toisistaan. Toinen ajaa 12 km/h ja toinen 18 km/h. Kuinka monen minuutin kuluttua he kohtaavat? Anna vastaus minuutteina ilman yksikköä.","vastaus":54,"vinkki":"Ratkaise ensin aika tunteina. Tunnissa on 60 minuuttia.","selitys":"Yhtälöstä 12x + 18x = 27 saadaan x = 0,9 h, ja 0,9 · 60 min = 54 min. Vastaus 90 tai 9 syntyy, kun tunnin desimaaliosa luetaan minuuteiksi."},{"id":"H03","ryhma":"malli","kysymys":"Tasakylkisen kolmion kantakulma on 18° suurempi kuin huippukulma. Kuinka suuri on kantakulma?\n\nMihin yhteyteen tämän tehtävän yhtälö perustuu?","vastaus":1,"vinkki":"Mitä tehtävä kertoo: kulmia, pituuksia vai prosentteja?","selitys":"Tehtävässä on kolmion kulmia, joten yhtälö perustuu kolmion kulmien summaan 180°: kun x = huippukulma asteina, x + 2(x + 18) = 180. Pinta-alaa varten tarvittaisiin pituuksia, ja prosenttikerroin tarvitaan vain, kun tehtävässä on prosentteja.","tyyppi":"monivalinta","vaihtoehdot":["kolmion pinta-ala","kolmion kulmien summa","prosenttikerroin"]},{"id":"H04","ryhma":"malli","kysymys":"Sähköpotkulaudan avausmaksu on 0,80 € ja minuuttihinta 0,28 €. Kaupunkipyörän käyttö maksaa 2,00 € ja 0,20 € minuutilta. Kuinka monen minuutin ajo maksaa molemmilla saman verran? Anna vastaus minuutteina ilman yksikköä.","vastaus":15,"vinkki":"Kirjoita kummankin hinta lausekkeena: avausmaksu + minuuttihinta · x.","selitys":"Yhtälö perustuu hinnaston kaavaan hinta = avausmaksu + minuuttihinta · minuutit. Kun x = ajoaika minuutteina, 0,80 + 0,28x = 2,00 + 0,20x, joten 0,08x = 1,20 ja x = 15. Tarkistus: 0,80 + 0,28 · 15 = 5,00 € ja 2,00 + 0,20 · 15 = 5,00 €."},{"id":"H05","ryhma":"malli","kysymys":"Teet sokeriliuosta, jossa on oltava 8 % sokeria. Sokeria on 30 g. Montako grammaa vettä tarvitset? Anna vastaus grammoina ilman yksikköä.","vastaus":345,"vinkki":"Sokerin määrä = 0,08 · koko liuoksen massa. Laske ensin liuoksen massa.","selitys":"Yhtälö perustuu pitoisuuteen: kun x = liuoksen massa grammoina, 0,08x = 30 ja x = 375. Liuoksesta 30 g on sokeria, joten vettä tarvitaan 375 g − 30 g = 345 g. Vastaus 375 on koko liuoksen massa."},{"id":"H06","ryhma":"malli","kysymys":"Kenkien hintaa alennettiin 20 %, ja tilaukseen lisättiin 5,90 € toimitusmaksu. Maksoit 49,90 €. Mikä oli kenkien alkuperäinen hinta? Anna vastaus euroina ilman yksikköä.","vastaus":55,"vinkki":"Alennus koskee vain kenkiä. Alennettu hinta on 0,80x, ja toimitusmaksu lisätään sen jälkeen.","selitys":"Yhtälö perustuu prosenttikertoimeen: kun x = alkuperäinen hinta euroina, 0,80x + 5,90 = 49,90, joten 0,80x = 44 ja x = 55. Tarkistus tekstistä: 20 % 55 eurosta on 11 €, kengät maksoivat alennettuina 44 €, ja toimitusmaksun kanssa 49,90 €."},{"id":"H07","ryhma":"malli","kysymys":"Suoratoistopalvelun kuukausimaksua korotettiin 12 %, ja ensimmäiseen laskuun lisättiin 2,50 € käsittelymaksu. Ensimmäinen lasku oli 15,94 €. Mikä oli kuukausimaksu ennen korotusta? Anna vastaus euroina ilman yksikköä.","vastaus":12,"vinkki":"Korotettu maksu on 1,12x. Käsittelymaksua ei koroteta.","selitys":"Kun x = kuukausimaksu ennen korotusta euroina, 1,12x + 2,50 = 15,94, joten 1,12x = 13,44 ja x = 12. Tarkistus: 12 € · 1,12 = 13,44 € ja 13,44 € + 2,50 € = 15,94 €."},{"id":"H08","ryhma":"kysytty","kysymys":"Bussi ajoi ensin 1 h tasaisella nopeudella ja sitten 40 min nopeudella, joka oli 25 km/h pienempi. Bussi ajoi yhteensä 130 km. Mikä oli bussin nopeus jälkimmäisellä osalla? Anna vastaus kilometreinä tunnissa ilman yksikköä.","vastaus":63,"vinkki":"40 min = 40/60 h. Kun x on nopeus ensimmäisellä osalla, jälkimmäisen osan nopeus on x − 25.","selitys":"Kun x = nopeus ensimmäisellä osalla kilometreinä tunnissa, x + (40/60)(x − 25) = 130. Kerro molemmat puolet kolmella: 3x + 2(x − 25) = 390, joten 5x = 440 ja x = 88. Jälkimmäisen osan nopeus oli 88 − 25 = 63 km/h. Tarkistus: 88 km + 2/3 h · 63 km/h = 88 km + 42 km = 130 km. Vastaus 88 on ensimmäisen osan nopeus."},{"id":"H09","ryhma":"kysytty","kysymys":"Tasakylkisen kolmion kantakulma on 18° suurempi kuin huippukulma. Kuinka suuri on kantakulma? Anna vastaus asteina ilman astemerkkiä.","vastaus":66,"vinkki":"Kun x on huippukulma, kumpikin kantakulma on x + 18.","selitys":"Kolmion kulmien summa: x + 2(x + 18) = 180, joten 3x + 36 = 180, 3x = 144 ja x = 48. Huippukulma on 48°, ja kantakulma on 48° + 18° = 66°. Tarkistus: 48° + 66° + 66° = 180°. Vastaus 48 on huippukulma."},{"id":"H10","ryhma":"kysytty","kysymys":"Nelikulmion kaksi kulmaa ovat yhtä suuret. Kolmas kulma on 10° suurempi kuin kumpikin niistä, ja neljäs kulma on kaksi kertaa niin suuri kuin kumpikin kahdesta yhtä suuresta kulmasta. Kuinka suuri on nelikulmion suurin kulma? Anna vastaus asteina ilman astemerkkiä.","vastaus":140,"vinkki":"Nelikulmion kulmien summa on 360°.","selitys":"Kun x = kumpikin yhtä suurista kulmista asteina, x + x + (x + 10) + 2x = 360, joten 5x = 350 ja x = 70. Kulmat ovat 70°, 70°, 80° ja 140°, ja suurin on 140°. Tarkistus: 70 + 70 + 80 + 140 = 360."},{"id":"H11","ryhma":"kysytty","kysymys":"Koulumatka kestää pyörällä 27 minuuttia vähemmän kuin kävellen. Kävellen nopeus on 4 km/h ja pyörällä 10 km/h. Kuinka pitkä koulumatka on? Anna vastaus kilometreinä ilman yksikköä.","vastaus":3,"vinkki":"27 min = 27/60 h = 0,45 h. Matka on sama kummallakin tavalla.","selitys":"Kun x = kävelyaika tunteina, pyöräilyaika on x − 0,45, ja matkat ovat yhtä pitkät: 4x = 10(x − 0,45). Siitä 4x = 10x − 4,5, 6x = 4,5 ja x = 0,75. Matka on 4 · 0,75 = 3 km. Tarkistus: kävellen 3 km kestää 0,75 h = 45 min ja pyörällä 0,3 h = 18 min, ero 27 min."},{"id":"H12","ryhma":"kysytty","kysymys":"Suorakulmion pituus on kaksi kertaa sen leveys, ja lävistäjä on 10 cm. Laske suorakulmion ala tarkkana arvona. Anna vastaus neliösenttimetreinä ilman yksikköä.","vastaus":40,"vinkki":"Lävistäjä ja sivut muodostavat suorakulmaisen kolmion. Alaan tarvitaan x², ei x:ää.","selitys":"Kun x = leveys senttimetreinä, Pythagoraan lauseesta x² + (2x)² = 10², joten 5x² = 100 ja x² = 20. Ala on 2x · x = 2x² = 2 · 20 = 40 cm²."},{"id":"H13","ryhma":"kysytty","kysymys":"Tasakylkisen kolmion kanta on 5 cm lyhyempi kuin kumpikin kylki, ja piiri on 31 cm. Laske kolmion korkeus kannalle. Anna vastaus senttimetreinä kymmenesosan tarkkuudella ilman yksikköä.","vastaus":11.5,"vinkki":"Ratkaise ensin kylki piiristä. Korkeus jakaa kannan kahtia.","selitys":"Kun x = kylki senttimetreinä, kanta on x − 5 ja x + x + (x − 5) = 31, joten x = 12. Kanta on 7 cm. Korkeus, puolikas kanta 3,5 cm ja kylki muodostavat suorakulmaisen kolmion: h² + 3,5² = 12², h² = 131,75 ja h ≈ 11,5 cm. Negatiivinen ratkaisu hylätään, koska korkeus on pituus."},{"id":"H14","ryhma":"kysytty","kysymys":"Teet sokeriliuosta, jossa on oltava 15 % sokeria. Vettä on 340 g. Montako grammaa sokeria tarvitset? Anna vastaus grammoina ilman yksikköä.","vastaus":60,"vinkki":"Perusarvo on koko liuos eli vesi ja sokeri yhdessä: 340 + x.","selitys":"Kun x = sokerin massa grammoina, 0,15(340 + x) = x. Siitä 51 + 0,15x = x, 51 = 0,85x ja x = 60. Tarkistus: liuosta on 400 g, ja 15 % siitä on 60 g. Lasku 0,15 · 340 = 51 g on väärin, koska siinä perusarvona on pelkkä vesi."},{"id":"H15","ryhma":"tarkistus","kysymys":"Suorakulmion muotoisen tontin pituus on kolme kertaa sen leveys, ja pinta-ala on 1 083 m². Kuinka leveä tontti on? Anna vastaus metreinä ilman yksikköä.","vastaus":19,"vinkki":"Ala on pituus kertaa leveys eli 3x · x. Yhtälöllä x² = c on kaksi ratkaisua.","selitys":"Kun x = leveys metreinä, 3x² = 1 083, x² = 361 ja x = 19 tai x = −19. Leveys ei voi olla negatiivinen, joten x = −19 hylätään. Tontti on 19 m leveä ja 57 m pitkä. Tarkistus: 19 · 57 = 1 083."},{"id":"H16","ryhma":"tarkistus","kysymys":"Aikuisen lippu maksaa 11 € ja nuoren 7 €. Ryhmässä on 3 nuorta enemmän kuin aikuisia, ja liput maksoivat yhteensä 100 €. Merkitse aikuisten määrää x:llä. Mikä on yhtälön ratkaisu kahden desimaalin tarkkuudella?","vastaus":4.39,"vinkki":"Nuoria on x + 3. Kirjoita kummankin ryhmän liput yhteen.","selitys":"11x + 7(x + 3) = 100, joten 18x + 21 = 100, 18x = 79 ja x ≈ 4,39."},{"id":"H17","ryhma":"tarkistus","kysymys":"Aikuisen lippu maksaa 11 € ja nuoren 7 €. Ryhmässä on 3 nuorta enemmän kuin aikuisia, ja liput maksoivat yhteensä 100 €. Onko tilanne mahdollinen?","vastaus":2,"vinkki":"Ratkaise yhtälö 11x + 7(x + 3) = 100 ja mieti, mitä x tarkoittaa.","selitys":"Yhtälön ratkaisu on x ≈ 4,39, mutta x on aikuisten määrä, ja ihmisten määrä on kokonaisluku. Tilanne ei siis ole mahdollinen. Pyöristys ei auta: neljällä aikuisella ja seitsemällä nuorella liput maksaisivat 44 € + 49 € = 93 €, viidellä aikuisella ja kahdeksalla nuorella 55 € + 56 € = 111 €.","tyyppi":"monivalinta","vaihtoehdot":["On, kun aikuisia on 4 ja nuoria 7.","On, koska yhtälöllä on ratkaisu.","Ei ole, koska aikuisten määrä ei ole kokonaisluku."]},{"id":"H18","ryhma":"tarkistus","kysymys":"Tehtävä kuului: \"Kuntosalin kuukausimaksua korotettiin 25 %, ja ensimmäiseen laskuun lisättiin 4,00 € avainmaksu. Ensimmäinen lasku oli 40,00 €. Mikä oli kuukausimaksu ennen korotusta?\"\nSami merkitsi x = kuukausimaksu ennen korotusta euroina ja kirjoitti yhtälön 1,25(x + 4,00) = 40,00. Hän sai x = 28,00, ja sijoitus hänen yhtälöönsä toimii.\n\nTarkista Samin tulos tehtävän tekstistä. Paljonko ensimmäinen lasku olisi ollut, jos kuukausimaksu ennen korotusta olisi ollut 28,00 €? Anna vastaus euroina ilman yksikköä.","vastaus":39,"vinkki":"Laske tekstin vaiheet järjestyksessä: ensin korotus kuukausimaksuun, sitten avainmaksu.","selitys":"28,00 € korotettuna 25 % on 28,00 € · 1,25 = 35,00 €, ja avainmaksun kanssa lasku olisi 39,00 €, ei 40,00 €. Sami korotti myös avainmaksua. Oikea yhtälö on 1,25x + 4,00 = 40,00, josta x = 28,80 €."},{"id":"H19","ryhma":"tarkistus","kysymys":"Tehtävä kuului: \"Iida ja Leo lähtevät samaan aikaan toisiaan kohti 24 km:n päästä toisistaan. Iida pyöräilee 14 km/h ja Leo 18 km/h. Kuinka monen minuutin kuluttua he kohtaavat?\"\nLeo kirjoitti yhtälön 18x − 14x = 24 ja sai x = 6. Sijoitus yhtälöön toimii.\n\nMikä on tehtävän oikea vastaus minuutteina? Anna vastaus ilman yksikköä.","vastaus":45,"vinkki":"Tarkista Leon tulos: kuinka pitkälle kumpikin ajaisi 6 tunnissa? Kun kuljetaan toisiaan kohti, matkat lasketaan yhteen.","selitys":"Tarkistus tekstistä: 6 tunnissa Iida ajaisi 84 km ja Leo 108 km, yhteensä 192 km eikä 24 km. Oikea yhtälö on 14x + 18x = 24, josta 32x = 24 ja x = 0,75 h = 45 min. Tarkistus: 0,75 tunnissa Iida ajaa 10,5 km ja Leo 13,5 km, yhteensä 24 km."},{"id":"H20","ryhma":"tarkistus","kysymys":"Tehtävä kuului: \"Tuomas kulki 14 km:n matkan niin, että hän pyöräili ensin 12 km/h ja käveli loput 4 km/h. Koko matkaan kului 1,5 h. Kuinka monta minuuttia Tuomas käveli?\"\nVille merkitsi x = kävelyaika tunteina ja kirjoitti yhtälön 12(1,5 − x) + 4x = 14. Hän sai x = 0,5 ja vastasi 50 min.\n\nKuinka monta minuuttia Tuomas käveli? Anna vastaus minuutteina ilman yksikköä.","vastaus":30,"vinkki":"Villen yhtälö ja x = 0,5 ovat oikein. Mitä x tarkoittaa, ja montako minuuttia on 0,5 h?","selitys":"x on tunteja, ja 0,5 h = 0,5 · 60 min = 30 min. Tarkistus tekstistä: kävely 0,5 h · 4 km/h = 2 km ja pyöräily 1 h · 12 km/h = 12 km, yhteensä 14 km. Vastaus 50 min syntyy, kun tunnin desimaaliosa luetaan minuuteiksi."}],"valmis_teksti":"Osaat valita ongelmaan sopivan mallin, kaavan, prosenttiyhteyden tai kuvion mittojen yhteyden, ja perustella valintasi. Kerrot, mitä x tarkoittaa ja missä yksikössä, ratkaiset yhtälön, tarkistat tuloksen alkuperäisestä tilanteesta ja hylkäät ratkaisun, joka ei ole tilanteessa mahdollinen. Tämä taito on nyt näytetty."};

const svg=document.getElementById("nlsvg"), rng=document.getElementById("nlrange"), out=document.getElementById("nlout");
const X0=34, X1=606, Y=62;
function piirraNL(v){
  const ala=Math.floor(v/10)*10, yla=ala+10, puoli=ala+5;
  const pyor = (v%10)>=5 ? yla : ala;
  const x = n => X0 + (n/100)*(X1-X0);
  let s=`<line class="rail" x1="${X0}" y1="${Y}" x2="${X1}" y2="${Y}"/>`;
  for(let n=0;n<=100;n+=10){
    const near = (n===ala||n===yla);
    s+=`<line class="tick" x1="${x(n)}" y1="${Y-7}" x2="${x(n)}" y2="${Y+7}"/>`;
    s+=`<text class="stop${near?" near":""}" x="${x(n)}" y="${Y+24}" text-anchor="middle">${n}</text>`;
  }
  s+=`<line class="halfway" x1="${x(puoli)}" y1="${Y-16}" x2="${x(puoli)}" y2="${Y+12}"/>`;
  s+=`<text class="stop" x="${x(puoli)}" y="${Y-22}" text-anchor="middle">puoliväli ${puoli}</text>`;
  s+=`<circle class="dot" cx="${x(v)}" cy="${Y}" r="6"/>`;
  s+=`<text class="val" x="${x(v)}" y="${Y-32}" text-anchor="middle">${v}</text>`;
  s+=`<path d="M ${x(v)} ${Y+38} L ${x(pyor)} ${Y+38}" stroke="var(--core)" stroke-width="2" fill="none"/>`;
  s+=`<path d="M ${x(pyor)} ${Y+38} l ${x(pyor)>x(v)?-7:7} -4 l 0 8 z" fill="var(--core)"/>`;
  svg.innerHTML=s;
  out.textContent = `${v} pyöristyy → ${pyor}`;
}

const ljExp=document.getElementById("ljExp");
if(ljExp && D.kokeilu){
  let ljI=0, ljTokens=[], ljStep=0;
  const laske=(a,op,b)=>{a=+a;b=+b;return op==="×"?a*b:op==="÷"?a/b:op==="+"?a+b:a-b;};
  function ljAlku(){
    const l=D.kokeilu[ljI];
    ljTokens=l.lauseke.replace(/\(/g,"( ").replace(/\)/g," )").split(/\s+/).filter(Boolean);
    ljStep=0; ljPiirra(); ljViesti("","");
  }
  function ljViesti(t,lk){const f=document.getElementById("ljFb"); f.textContent=t; f.className="lj-fb "+(lk||"");}
  function ljPiirra(){
    const l=D.kokeilu[ljI];
    document.getElementById("ljStep").textContent =
      ljStep>=l.askeleet.length ? "valmis" : `askel ${ljStep+1} / ${l.askeleet.length}`;
    if(ljStep>=l.askeleet.length){
      ljExp.innerHTML=`<span class="valmis">${l.lauseke} = ${l.vastaus}</span>`;
      return;
    }
    ljExp.innerHTML=ljTokens.map((t,i)=>
      "×÷+−".includes(t) ? `<button type="button" class="op" data-i="${i}">${t}</button>`
                         : `<span class="tok">${t}</span>`).join("");
    ljExp.querySelectorAll("button.op").forEach(b=>b.addEventListener("click",()=>ljKlikkaa(+b.dataset.i)));
  }
  function ljKlikkaa(i){
    const l=D.kokeilu[ljI], odotettu=l.askeleet[ljStep];
    const ehdotus=[ljTokens[i-1],ljTokens[i],ljTokens[i+1]].join(" ");
    if(ehdotus!==odotettu){
      ljViesti(ljStep===0
        ? "Ei vielä. Sulkeet ovat vahvimmat, sitten kerto ja jako. Yhtä vahvat vasemmalta oikealle."
        : "Ei vielä. Kumpi jäljellä olevista on vahvempi?", "no");
      return;
    }
    const arvo=laske(ljTokens[i-1],ljTokens[i],ljTokens[i+1]);
    let alku=i-1, loppu=i+1;
    if(ljTokens[i-2]==="(" && ljTokens[i+2]===")"){ alku=i-2; loppu=i+2; }
    ljTokens.splice(alku, loppu-alku+1, String(arvo));
    ljStep++;
    ljViesti(ljStep>=l.askeleet.length ? "Valmis. Vastaus on "+l.vastaus+"." : "Oikein. Jatka seuraavaan.", "ok");
    ljPiirra();
  }
  document.getElementById("ljSeuraava").addEventListener("click",()=>{
    ljI=(ljI+1)%D.kokeilu.length; ljAlku();
  });
  ljAlku();
}

/* Suomalainen lukumuoto: välilyönti on tuhaterotin, pilkku desimaalierotin.
   Piste voi olla kumpi tahansa. Se tulkitaan tuhaterottimeksi VAIN silloin, kun
   koko luku on aitoa tuhaterotinmuotoa: alkuosa 1–3 numeroa ilman etunollaa ja
   jokainen jatko-osa täsmälleen 3 numeroa (1.500, 12.345.678). Kaikissa muissa
   tapauksissa piste on desimaalipiste — myös 0.125, joka vanhalla säännöllä
   ("3 numeroa pisteen jäljessä = tuhaterotin") luettiin virheellisesti luvuksi 125. */
const TUHATEROTIN = /^[1-9]\d{0,2}(\.\d{3})+$/;
function lueLuku(teksti){
  // Murtoluku (3/4, -3/4) ja sekaluku (1 2/3, -1 2/3) hyväksytään sellaisinaan.
  const raaka = String(teksti).replace(/\u00a0/g, " ").trim();
  let m = raaka.match(/^(-?)(\d+)\s+(\d+)\s*\/\s*(\d+)$/);
  if(m){ const nim = Number(m[4]); if(nim === 0) return null;
    const v = Number(m[2]) + Number(m[3]) / nim; return m[1] ? -v : v; }
  m = raaka.match(/^(-?)\s*(\d+)\s*\/\s*(\d+)$/);
  if(m){ const nim = Number(m[3]); if(nim === 0) return null;
    const v = Number(m[2]) / nim; return m[1] ? -v : v; }
  let s = String(teksti).replace(/[\s\u00a0]/g, "");
  if(s === "") return null;
  if(s.indexOf(",") >= 0){
    s = s.replace(/\./g, "").replace(",", ".");
  } else if(TUHATEROTIN.test(s)){
    s = s.replace(/\./g, "");
  }
  const n = Number(s);
  return Number.isFinite(n) ? n : null;
}

function tarkista(id){
  const h=D.harjoitukset.find(x=>x.id===id);
  const kentta=document.getElementById("in-"+id);
  const fb=document.getElementById("fb-"+id);
  if(kentta.value.trim()===""){ fb.className="fb hint"; fb.textContent="Kirjoita vastaus ensin."; return; }
  const luku=lueLuku(kentta.value);
  if(luku===null){ fb.className="fb no"; fb.textContent="Vastauksen pitää olla luku tai murtoluku (esimerkiksi 3/4)."; return; }
  const oikein = Math.abs(luku - h.vastaus) < 1e-9;
  merkitseTulos(id, oikein, oikein ? "Oikein. "+h.selitys : `Ei vielä. ${h.vinkki} Kokeile uudelleen.`);
}

function tarkistaMonivalinta(id, valittuIndeksi, painike){
  const h=D.harjoitukset.find(x=>x.id===id);
  const rivi=painike.closest(".row");
  rivi.querySelectorAll(".mv-valinta").forEach(b=>b.disabled=true);
  const oikein = valittuIndeksi===h.vastaus;
  painike.classList.add(oikein?"mv-oikein":"mv-vaarin");
  if(!oikein){
    const oikeaBtn=rivi.querySelector(`[data-i="${h.vastaus}"]`);
    if(oikeaBtn) oikeaBtn.classList.add("mv-oikein");
  }
  merkitseTulos(id, oikein, oikein ? "Oikein. "+h.selitys : `Ei ihan. Oikea vastaus on korostettu. ${h.selitys||""}`);
}

/* Kuuntelu: selain lukee tekstin ääneen omalla puhesynteesillään (englanniksi, jos laitteessa on
   englanninkielinen ääni). Ei äänitiedostoja eikä verkkoyhteyttä. Jos laite ei osaa puhua,
   teksti näytetään luettavaksi — silloin tehtävä muuttuu luetun ymmärtämiseksi, mutta ei katkea. */
function puhu(id, nopeus){
  const h=D.harjoitukset.find(x=>x.id===id); if(!h || !h.kuuntele) return;
  const vara=document.getElementById("vara-"+id);
  const naytaTeksti=syy=>{ vara.hidden=false; vara.textContent=syy+" Teksti: "+h.kuuntele; };
  if(!("speechSynthesis" in window)){ naytaTeksti("Tämä laite ei osaa lukea ääneen."); return; }
  const s=window.speechSynthesis; s.cancel();
  const u=new SpeechSynthesisUtterance(h.kuuntele);
  u.lang=h.kieli||"en-GB"; u.rate=nopeus;
  const aanet=s.getVoices(), kieli=u.lang.slice(0,2);
  const aani=aanet.find(a=>a.lang===u.lang) || aanet.find(a=>a.lang && a.lang.startsWith(kieli));
  if(aani) u.voice=aani;
  else if(aanet.length) { naytaTeksti("Laitteessa ei ole englanninkielistä ääntä."); return; }
  u.onerror=()=>naytaTeksti("Ääneen lukeminen ei onnistunut.");
  s.speak(u);
}

document.getElementById("harjoitukset").addEventListener("click",e=>{
  const k=e.target.closest("[data-kuuntele]"), hk=e.target.closest("[data-hitaasti]");
  if(k) puhu(k.dataset.kuuntele, 0.9);
  if(hk) puhu(hk.dataset.hitaasti, 0.6);
  const t=e.target.closest("[data-tarkista]"), v=e.target.closest("[data-vinkki]"), mv=e.target.closest("[data-mv]");
  if(t) tarkista(t.dataset.tarkista);
  if(mv) tarkistaMonivalinta(mv.dataset.mv, Number(mv.dataset.i), mv);
  if(v){
    const h=D.harjoitukset.find(x=>x.id===v.dataset.vinkki);
    const fb=document.getElementById("fb-"+h.id);
    fb.className="fb hint"; fb.textContent=h.vinkki;
  }
});
document.getElementById("harjoitukset").addEventListener("keydown",e=>{
  if(e.key==="Enter" && e.target.id.startsWith("in-")){ e.preventDefault(); tarkista(e.target.id.slice(3)); }
});
