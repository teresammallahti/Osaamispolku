<title>Kulma ja kateetit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">

<style>
:root{
  --paper:#EFF2F5; --surface:#FFFFFF; --surface-2:#F7F9FB;
  --grid:#DCE3EA; --line:#C9D3DC;
  --ink:#15222C; --ink-2:#4E626F; --ink-3:#7E8F9B;
  --core:#1B5A9E; --core-soft:#E4EDF6;
  --strong:#1F6E5C; --strong-soft:#E1F0EB;
  --chal:#9A6A16; --chal-soft:#F6EDDC;
  --alert:#A33A2B; --alert-soft:#F8E7E3;
  --shadow:0 1px 2px rgba(21,34,44,.06), 0 8px 24px -12px rgba(21,34,44,.18);
  --r:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0F161B; --surface:#18222A; --surface-2:#1D2830;
    --grid:#22303A; --line:#2E3E4A;
    --ink:#E8EFF4; --ink-2:#A3B4C0; --ink-3:#7A8B97;
    --core:#7FB2E4; --core-soft:#16303F;
    --strong:#77CDB4; --strong-soft:#123028;
    --chal:#E0B267; --chal-soft:#33270F;
    --alert:#E8907F; --alert-soft:#3A1E19;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -14px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --paper:#0F161B; --surface:#18222A; --surface-2:#1D2830;
  --grid:#22303A; --line:#2E3E4A;
  --ink:#E8EFF4; --ink-2:#A3B4C0; --ink-3:#7A8B97;
  --core:#7FB2E4; --core-soft:#16303F;
  --strong:#77CDB4; --strong-soft:#123028;
  --chal:#E0B267; --chal-soft:#33270F;
  --alert:#E8907F; --alert-soft:#3A1E19;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -14px rgba(0,0,0,.7);
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:16px; line-height:1.62;
  background-image:
    linear-gradient(to right, var(--grid) 1px, transparent 1px),
    linear-gradient(to bottom, var(--grid) 1px, transparent 1px);
  background-size:26px 26px;
}
.wrap{max-width:760px; margin:0 auto; padding:28px 20px 90px}
h1,h2,h3,h4{font-family:"Familjen Grotesk","IBM Plex Sans",system-ui,sans-serif; text-wrap:balance}

/* header */
header.top{background:var(--surface); border:1px solid var(--line); border-radius:var(--r);
  box-shadow:var(--shadow); padding:22px 24px; display:flex; gap:18px; align-items:flex-start}
.badge{flex:0 0 auto; width:54px; height:54px; border-radius:9px; display:grid; place-items:center;
  background:var(--core-soft); border:1px solid var(--core); color:var(--core)}
.badge svg{width:28px; height:28px; fill:none; stroke:currentColor; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round}
.eyebrow{font-family:"IBM Plex Mono",monospace; font-size:11px; letter-spacing:.14em;
  text-transform:uppercase; color:var(--ink-3); margin:0 0 5px}
header.top h1{margin:0; font-size:30px; font-weight:700; letter-spacing:-.015em}
header.top p{margin:5px 0 0; color:var(--ink-2); font-size:15px}
.tags{display:flex; flex-wrap:wrap; gap:5px; margin-top:11px}
.tag{font-family:"IBM Plex Mono",monospace; font-size:10.5px; letter-spacing:.05em; padding:2px 7px;
  border-radius:4px; background:var(--surface-2); border:1px solid var(--line); color:var(--ink-3)}
.tag.core{background:var(--core-soft); border-color:var(--core); color:var(--core)}

/* teksti */
article{margin-top:26px}
article h2{font-size:21px; font-weight:600; margin:32px 0 10px; letter-spacing:-.01em}
article p{margin:0 0 14px; max-width:64ch}
.lead{font-size:17.5px; color:var(--ink); border-left:3px solid var(--core); padding-left:16px; margin:0 0 8px}

.box{background:var(--surface); border:1px solid var(--line); border-radius:var(--r);
  padding:18px 22px; box-shadow:var(--shadow); margin:22px 0}
.box h3{margin:0 0 12px; font-size:16.5px; font-weight:600}
.box.warn{border-left:3px solid var(--alert)}
.box.note{border-left:3px solid var(--chal)}

ol.steps{margin:0; padding-left:0; list-style:none; counter-reset:s; display:grid; gap:12px}
ol.steps li{counter-increment:s; display:grid; grid-template-columns:auto 1fr; gap:13px; align-items:start}
ol.steps li::before{content:counter(s); font-family:"Familjen Grotesk",sans-serif; font-weight:700; font-size:14px;
  width:26px; height:26px; border-radius:50%; background:var(--core); color:#fff; display:grid; place-items:center; margin-top:2px}

ul.notes{margin:0; padding-left:19px}
ul.notes li{margin-bottom:7px}
ul.notes li:last-child{margin-bottom:0}

.tablewrap{overflow-x:auto}
table{border-collapse:collapse; width:100%; font-size:14.5px; min-width:460px}
th,td{text-align:left; padding:9px 13px; border-bottom:1px solid var(--line)}
th{font-family:"IBM Plex Mono",monospace; font-size:10.5px; letter-spacing:.1em; text-transform:uppercase;
  color:var(--ink-3); font-weight:400; background:var(--surface-2)}
tr:last-child td{border-bottom:0}
td b{color:var(--core); font-weight:600}
td:last-child{font-variant-numeric:tabular-nums; font-weight:600}

/* lukusuora */
.nl svg{width:100%; height:118px; display:block}
.nl .rail{stroke:var(--line); stroke-width:2}
.nl .tick{stroke:var(--line); stroke-width:1.5}
.nl .stop{fill:var(--ink-3); font-family:"IBM Plex Mono",monospace; font-size:11px}
.nl .stop.near{fill:var(--core); font-weight:600}
.nl .dot{fill:var(--chal)}
.nl .val{fill:var(--ink); font-family:"Familjen Grotesk",sans-serif; font-size:15px; font-weight:700}
.nl .halfway{stroke:var(--chal); stroke-dasharray:3 3; stroke-width:1.5}
.nl-controls{display:flex; align-items:center; gap:14px; margin-top:6px}
.nl-controls input{flex:1; accent-color:var(--core)}
.nl-out{font-family:"Familjen Grotesk",sans-serif; font-size:15px; font-weight:600; min-width:12.5em; text-align:right}

/* paikka-arvotaulu */
.box .ohje{margin:0 0 14px; font-size:14.5px; color:var(--ink-2)}
.nt-valinta{display:flex; flex-wrap:wrap; gap:7px; margin-bottom:16px}
.nt-valinta button{font:inherit; font-size:12.5px; font-family:"IBM Plex Mono",monospace; padding:5px 11px;
  border-radius:6px; border:1px solid var(--line); background:var(--surface-2); color:var(--ink-2); cursor:pointer}
.nt-valinta button[aria-pressed="true"]{background:var(--ink); color:var(--paper); border-color:var(--ink)}
.nt-valinta button:focus-visible{outline:2px solid var(--core); outline-offset:2px}
.nt-taulu{display:flex; flex-direction:column; gap:4px; align-items:flex-start; overflow-x:auto; padding-bottom:4px}
.nt-rivi{display:flex; gap:6px; align-items:center}
.nt-rivi .otsa{font-family:"IBM Plex Mono",monospace; font-size:9.5px; letter-spacing:.08em;
  text-transform:uppercase; color:var(--ink-3); width:52px; text-align:center}
.nt-ruutu{width:52px; height:52px; display:grid; place-items:center; border:1.5px solid var(--line);
  border-radius:7px; background:var(--surface-2); font-family:"IBM Plex Mono",monospace; font-size:24px}
.nt-ruutu.kohta{border-color:var(--core); background:var(--core-soft); color:var(--core); font-weight:500}
.nt-ruutu.ratkaiseva{border-color:var(--chal); background:var(--chal-soft); color:var(--chal); font-weight:500}
.nt-ruutu.nolla{color:var(--ink-3)}
.nt-rivi .nimi{font-size:12.5px; color:var(--ink-3); margin-left:12px; white-space:nowrap}
.nt-nuoli{font-size:17px; color:var(--chal); margin-left:6px}
.nt-selite{margin:14px 0 0; font-size:14.5px}
.nt-selite b{color:var(--core)}

/* vahvuusportaat */
.vp-tasot{display:grid; gap:9px; margin-bottom:18px}
.vp-taso{display:flex; gap:11px; align-items:flex-start; font-size:13.5px}
.vp-taso .vp-pallo{width:13px; height:13px; border-radius:4px; margin-top:5px; flex:0 0 auto}
.vp-taso[data-taso="sulkeet"] .vp-pallo{background:var(--core)}
.vp-taso[data-taso="kertojako"] .vp-pallo{background:var(--strong)}
.vp-taso[data-taso="yhteenvahennys"] .vp-pallo{background:var(--chal)}
.vp-taso strong{display:block; font-family:"Familjen Grotesk",sans-serif; font-weight:600; font-size:14.5px}
.vp-taso span{color:var(--ink-2)}
.vp-lauseke{display:flex; flex-wrap:wrap; gap:7px; align-items:flex-end; font-family:"IBM Plex Mono",monospace;
  font-size:25px; padding:10px 2px; min-height:64px}
.vp-lauseke .t{padding:2px 3px}
.vp-lauseke .op{position:relative; padding:2px 9px; border-radius:6px; font-weight:500}
.vp-lauseke .op[data-taso="sulkeet"]{background:var(--core-soft); color:var(--core)}
.vp-lauseke .op[data-taso="kertojako"]{background:var(--strong-soft); color:var(--strong)}
.vp-lauseke .op[data-taso="yhteenvahennys"]{background:var(--chal-soft); color:var(--chal)}
.vp-lauseke .op i{position:absolute; top:-9px; right:-6px; font-style:normal; font-family:"Familjen Grotesk",sans-serif;
  font-size:11px; font-weight:700; width:18px; height:18px; border-radius:50%; display:grid; place-items:center;
  background:currentColor}
.vp-lauseke .op i span{color:var(--surface)}
.vp-rivi{display:flex; align-items:center; gap:16px; margin-top:8px}
.vp-vastaus{font-family:"Familjen Grotesk",sans-serif; font-size:16px; font-weight:600; color:var(--strong)}

/* laskujärjestys-widget */
.lj-exp{display:flex; flex-wrap:wrap; gap:7px; align-items:center; font-family:"IBM Plex Mono",monospace;
  font-size:23px; padding:14px 4px; min-height:62px}
.lj-exp .tok{padding:2px 4px; color:var(--ink)}
.lj-exp button.op{font-family:"IBM Plex Mono",monospace; font-size:23px; padding:3px 12px; border-radius:7px;
  border:1.5px solid var(--line); background:var(--surface-2); color:var(--ink); line-height:1.2}
.lj-exp button.op:hover{border-color:var(--core); color:var(--core)}
.lj-exp button.op:focus-visible{outline:2px solid var(--core); outline-offset:2px}
.lj-exp .valmis{font-family:"Familjen Grotesk",sans-serif; font-size:23px; font-weight:700; color:var(--strong)}
.lj-fb{font-size:14.5px; min-height:1.5em; color:var(--ink-2)}
.lj-fb.no{color:var(--alert)}
.lj-fb.ok{color:var(--strong)}
.lj-row{display:flex; align-items:center; gap:14px; margin-top:10px}
.lj-step{font-family:"IBM Plex Mono",monospace; font-size:11.5px; letter-spacing:.1em;
  text-transform:uppercase; color:var(--ink-3)}

/* harjoitukset */
.progress{position:sticky; top:0; z-index:5; background:var(--surface); border:1px solid var(--line);
  border-radius:var(--r); padding:12px 18px; box-shadow:var(--shadow); display:flex; align-items:center;
  gap:14px; margin:34px 0 18px}
.progress .lbl{font-family:"IBM Plex Mono",monospace; font-size:11px; letter-spacing:.12em;
  text-transform:uppercase; color:var(--ink-3); white-space:nowrap}
.progress .meter{flex:1; height:7px; border-radius:4px; background:var(--surface-2); border:1px solid var(--line); overflow:hidden}
.progress .meter i{display:block; height:100%; background:var(--core); transition:width .25s ease}
.progress .cnt{font-family:"Familjen Grotesk",sans-serif; font-weight:700; font-variant-numeric:tabular-nums; white-space:nowrap}

.grp{margin-top:26px}
.grp-head{display:flex; align-items:baseline; gap:10px; border-bottom:1.5px solid var(--ink); padding-bottom:7px; margin-bottom:14px}
.grp-head h3{margin:0; font-size:17px; font-weight:600}
.grp-head span{font-size:12.5px; color:var(--ink-2)}

.ex{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:14px 16px; margin-bottom:10px}
.ex[data-tila="oikein"]{border-color:var(--strong); box-shadow:inset 3px 0 0 var(--strong)}
.ex[data-tila="vaarin"]{border-color:var(--alert); box-shadow:inset 3px 0 0 var(--alert)}
.ex .q{display:flex; gap:11px; align-items:baseline; flex-wrap:wrap}
.ex .num{font-family:"IBM Plex Mono",monospace; font-size:11.5px; color:var(--ink-3); min-width:2.4em}
.ex .txt{flex:1; min-width:190px; font-size:15.5px}
.ex .txt .aineisto{display:block; margin-bottom:9px; padding-left:12px;
  border-left:2px solid var(--line); color:var(--ink-2); line-height:1.6;
  /* Aineisto voi olla pieni taulukko, jonka rivit on erotettu rivinvaihdoilla.
     Ilman pre-lineä ne valuisivat yhdeksi kappaleeksi ja taulukko katoaisi. */
  white-space:pre-line}
.ex .txt .kysymysrivi{display:block; font-weight:600}
.ex .row{display:flex; gap:8px; align-items:center; margin-top:11px; flex-wrap:wrap}
.ex input[type=text]{font:inherit; font-family:"IBM Plex Mono",monospace; font-size:15px; width:8.5em;
  padding:7px 11px; border:1px solid var(--line); border-radius:7px; background:var(--surface-2);
  color:var(--ink); text-align:right}
.ex input:focus-visible{outline:2px solid var(--core); outline-offset:1px}
button{font:inherit; cursor:pointer}
.btn{font-size:13.5px; padding:7px 15px; border-radius:7px; border:1px solid var(--core);
  background:var(--core); color:#fff}
.btn.ghost{background:transparent; color:var(--ink-2); border-color:var(--line)}
.btn:focus-visible{outline:2px solid var(--core); outline-offset:2px}
.btn.mv-valinta{text-align:left}
/* kuuntelutehtävä: selaimen puhesynteesi lukee englanninkielisen tekstin */
.kuuntele{display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin:2px 0 10px}
.kuuntele .btn{display:inline-flex; gap:7px; align-items:center}
.kuuntele svg{width:16px; height:16px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round}
.kuuntele .varateksti{flex-basis:100%; font-size:14px; color:var(--ink-2); background:var(--surface-2);
  border-radius:7px; padding:8px 12px; margin:0}
.btn.mv-valinta:disabled{cursor:default; opacity:.65}
.btn.mv-oikein{background:var(--strong-soft); border-color:var(--strong); color:var(--strong); opacity:1}
.btn.mv-vaarin{background:var(--alert-soft); border-color:var(--alert); color:var(--alert); opacity:1}
.row.mv{gap:8px 10px}
.fb{margin-top:11px; font-size:14.5px; padding:10px 13px; border-radius:8px; line-height:1.5}
.fb.ok{background:var(--strong-soft); color:var(--strong)}
.fb.no{background:var(--alert-soft); color:var(--alert)}
.fb.hint{background:var(--chal-soft); color:var(--chal)}

.done{background:var(--strong-soft); border:1px solid var(--strong); color:var(--strong);
  border-radius:var(--r); padding:16px 20px; margin-top:20px; font-size:15.5px}
.done h3{margin:0 0 4px; font-size:17px; color:var(--strong)}

details.teacher{margin-top:34px; background:var(--surface); border:1px solid var(--line);
  border-left:3px solid var(--chal); border-radius:var(--r); padding:15px 20px; box-shadow:var(--shadow)}
details.teacher summary{cursor:pointer; font-family:"Familjen Grotesk",sans-serif; font-weight:600; font-size:15px}
details.teacher summary:focus-visible{outline:2px solid var(--core); outline-offset:3px}
details.teacher ul{margin:12px 0 0; padding-left:19px; color:var(--ink-2); font-size:14.5px}
details.teacher li{margin-bottom:8px}
details.teacher p{margin:12px 0 0; color:var(--ink-2); font-size:14.5px}

.back{display:inline-block; margin-top:30px; font-size:13.5px; color:var(--ink-2)}
.back a{color:var(--core)}

@media (prefers-reduced-motion: reduce){*{transition:none !important}}
@media (max-width:560px){
  .wrap{padding:16px 13px 70px}
  header.top h1{font-size:25px}
  .progress{flex-wrap:wrap}
}
</style>

<div class="wrap">

  <header class="top">
    <span class="badge"><svg viewBox="0 0 24 24" aria-hidden="true" id="ikoni"></svg></span>
    <div>
      <p class="eyebrow" id="eyebrow"></p>
      <h1 id="otsikko"></h1>
      <p id="kuvaus"></p>
      <div class="tags" id="tags"></div>
    </div>
  </header>

  <article id="teksti"></article>

  <div class="progress" aria-live="polite">
    <span class="lbl">Harjoitukset</span>
    <span class="meter"><i id="pbar" style="width:0%"></i></span>
    <span class="cnt" id="pcnt">0 / 20</span>
  </div>

  <div id="harjoitukset"></div>
  <div id="valmis"></div>

  <p class="back" id="back"></p>

</div>

<script>
const D = {"tavoite_id":"MAT9-GEO-02","oppiaine":"MAT","vuosiluokka":9,"otsikko":"Kulma ja kateetit","kuvaus":"Osaan laskea suorakulmaisen kolmion kulman tai kateetin tangentin avulla.","versio":"0.2","paivitetty":"2026-10-11","ops":{"T":["T9","T16","T17"],"S":["S5"]},"taso":"ydin","ikoni":"puu","eyebrow":"Matematiikka · 9. luokka · Geometria","harjoitusryhmat":[{"id":"nimeaminen","nimi":"Vastainen ja viereinen kateetti","info":"Laskin on sallittu, astetila (DEG). Nimeä kateetit aina kysytyn kulman mukaan. Hypotenuusa ei ole kumpikaan. Anna vastaus ilman yksikköä."},{"id":"kateetti","nimi":"Kateetti tangentilla","info":"Käytä laskinta astetilassa (DEG). Kirjoita ensin tangentin yhtälö. Kerro, kun tuntematon on vastainen kateetti, ja jaa, kun se on viereinen. Pyöristä vain lopputulos ja anna vastaus ilman yksikköä."},{"id":"kulma","nimi":"Kulma ja suuntakulma","info":"Käytä laskinta astetilassa (DEG). Laske kateettien suhde ja ota siitä tan⁻¹. Suoran suuntakulmalle tan α = k. Anna kulma asteina ilman astemerkkiä."}],"valmis_teksti":"Nimeät suorakulmaisen kolmion terävän kulman vastaisen ja viereisen kateetin. Lasket tangentin avulla laskimella tuntemattoman kateetin tai kulman ja ratkaiset tehtäviä, joissa kysytään esimerkiksi puun korkeutta varjon pituudesta tai suoran suuntakulmaa. Selität, miksi tangentti on sama kaikissa yhdenmuotoisissa suorakulmaisissa kolmioissa, tarkistat laskimen astetilan ja arvioit 45°:n avulla, onko tulos järkevä. Tämä taito on nyt näytetty.","teksti":[{"tyyppi":"johdanto","sisalto":"Metsuri haluaa tietää puun korkeuden ennen kaatamista, rakennustyömaan mittaaja nosturin puomin kaltevuuden ja skeittiparkin suunnittelija rampin jyrkkyyden. Kenenkään ei tarvitse kiivetä mittanauhan kanssa. Puun korkeuden voi laskea sen varjon pituudesta, kun tiedetään, missä kulmassa auringonsäteet tulevat maahan, ja rampin kulman voi laskea sen korkeudesta ja vaakasuorasta pituudesta. Laskeminen onnistuu, koska suorakulmaisessa kolmiossa terävä kulma määrää kateettien suhteen. Tätä suhdetta sanotaan kulman tangentiksi. Tässä taidossa opit nimeämään kulman vastaisen ja viereisen kateetin, laskemaan tangentin avulla tuntemattoman kateetin tai kulman ja arvioimaan, onko tulos järkevä. Käytä laskinta astetilassa (DEG)."},{"tyyppi":"kappale","otsikko":"Vastainen ja viereinen kateetti","sisalto":"Suorakulmaisen kolmion kateetit ovat suoran kulman muodostavat sivut, ja hypotenuusa on suoran kulman vastainen sivu. Kun tarkastellaan toista terävistä kulmista, kateetit nimetään lisäksi sen kulman mukaan. Kulman vastainen kateetti on se kateetti, joka on kulman kärkeä vastapäätä eikä kosketa kärkeä. Kulman viereinen kateetti on se kateetti, joka lähtee kulman kärjestä. Myös hypotenuusa lähtee kulman kärjestä, mutta se ei ole kumpikaan, koska se ei ole kateetti. Kolmiossa ABC, jossa kulma C on suora, kulman A vastainen kateetti on BC, jonka nimessä ei ole kirjainta A. Kulman A viereinen kateetti on AC, jonka päätepisteet ovat kulman kärki A ja suoran kulman kärki C. Hypotenuusa AB jää pois. Kun tarkastelet kulmaa B, nimet vaihtavat paikkaa: kulman B vastainen kateetti on AC ja viereinen kateetti BC. Sama sivu on siis toisen terävän kulman vastainen ja toisen viereinen kateetti. Nimeä kateetit aina sen kulman mukaan, josta tehtävässä kysytään, äläkä kirjaimen paikan tai sivun pituuden mukaan."},{"tyyppi":"kappale","otsikko":"Tangentti on yhdenmuotoisten kolmioiden vakiosuhde","sisalto":"Piirrä kaksi suorakulmaista kolmiota, joissa kummassakin on 35°:n kulma. Pienemmässä kolmiossa kulman viereinen kateetti on 10 cm, suuremmassa 30 cm. Mittaamalla saat vastaisiksi kateeteiksi noin 7,0 cm ja 21,0 cm. Kummassakin kolmiossa vastainen kateetti on noin 0,70 kertaa viereinen: 7,0 : 10 = 0,70 ja 21,0 : 30 = 0,70. Tämä ei ole sattumaa. Kummankin kolmion kolmas kulma on 180° − 90° − 35° = 55°, joten kolmioiden kulmat ovat pareittain yhtä suuret ja kolmiot ovat yhdenmuotoiset. Yhdenmuotoisessa kuviossa jokainen sivu on kerrottu samalla luvulla, tässä luvulla 3. Kun vastainen ja viereinen kateetti kerrotaan samalla luvulla, niiden suhde ei muutu. Kateettien suhde riippuu siis vain kulmasta, ei kolmion koosta. Tätä suhdetta sanotaan kulman tangentiksi: tan α = kulman α vastainen kateetti : kulman α viereinen kateetti. Laskimen tan-näppäin antaa tan 35° ≈ 0,700, joten kolmiota ei tarvitse piirtää ja mitata. Määritelmä koskee suorakulmaisen kolmion terävää kulmaa, koska vain suorakulmaisessa kolmiossa on kateetit. Huomaa, että sana tangentti tarkoittaa myös ympyrän tangenttia eli suoraa, joka sivuaa ympyrää yhdessä pisteessä. Kulman tangentti on eri asia: se on luku, kahden kateetin suhde."},{"tyyppi":"saanto","otsikko":"Näin lasket kateetin tangentin avulla","askeleet":["Tarkista laskimen tila: tan 45° pitää antaa tasan 1. Tasakylkisessä suorakulmaisessa kolmiossa molemmat terävät kulmat ovat 45° ja kateetit ovat yhtä pitkät, joten niiden suhde on 1. Jos laskin näyttää muuta, vaihda se astetilaan (DEG).","Nimeä kateetit annetun kulman mukaan ja merkitse, kumpi tunnetaan ja kumpi kysytään.","Kirjoita tangentin yhtälö ja sijoita luvut. Esimerkki: kolmiossa KLM kulma M on suora, kulma K = 25° ja KM = 18,0 m, ja kysytään sivua LM. Kulman K vastainen kateetti on LM ja viereinen KM, joten tan 25° = LM : 18,0 m.","Ratkaise tuntematon. Kun tuntematon on vastainen kateetti eli osoittajassa, kerro: LM = 18,0 m · tan 25° ≈ 8,4 m. Kun tuntematon on viereinen kateetti eli nimittäjässä, kirjoita tan α = a : x ja kerro ristiin: x · tan α = a, joten x = a : tan α.","Pidä välivaiheet laskimessa tarkkoina ja pyöristä vain lopputulos pyydettyyn tarkkuuteen. Kun tangentin arvo kysytään erikseen, anna se kolmen desimaalin tarkkuudella.","Tarkista järkevyys. Alle 45°:n kulman vastainen kateetti on lyhyempi kuin viereinen, yli 45°:n kulman pidempi. Esimerkissä 8,4 m on alle 18,0 m, kuten 25°:n kulmalla pitääkin."]},{"tyyppi":"kappale","otsikko":"Kulma kateeteista ja 45°:n arvio","sisalto":"Kun molemmat kateetit tunnetaan, laske ensin niiden suhde ja hae sitten kulma, jonka tangentti on tämä suhde. Laskimessa se tehdään tangentin käänteistoiminnolla tan⁻¹, joka on useimmiten näppäinyhdistelmä SHIFT tan tai 2nd tan. Esimerkiksi kolmiossa ABC, jossa kulma C on suora, BC = 6,0 cm ja AC = 11,0 cm, saadaan tan A = 6,0 : 11,0 = 0,5454… ja A = tan⁻¹(0,5454…) ≈ 28,6°. Suhde 0,545 ei ole kulma vaan luku, josta kulma lasketaan. Arvioi tulos 45°:n avulla. Kun terävä kulma on 45°, kateetit ovat yhtä pitkät ja tan 45° = 1. Kun kulma pienenee ja viereinen kateetti pysyy samana, vastainen kateetti lyhenee, ja kun kulma kasvaa, se pitenee. Suorakulmaisen kolmion terävä kulma on siis alle 45° täsmälleen silloin, kun sen vastainen kateetti on lyhyempi kuin viereinen eli tangentti on alle 1. Esimerkissä 6,0 cm on lyhyempi kuin 11,0 cm, joten kulman pitää olla alle 45°, ja 28,6° on. Kolmion toinen terävä kulma on 90° − 28,6° = 61,4°, ja sille kateetit vaihtavat roolit. Arkitilanteessa kateetit ovat usein pystysuora korkeus ja vaakasuora matka. Jos pyöräilyradan hyppyrin luiska nousee 0,90 m:n korkeuteen ja sen vaakasuora pituus on 2,0 m, luiskan ja maan välinen kulma saadaan yhtälöstä tan α = 0,90 : 2,0 = 0,45, joten α ≈ 24,2°. Samalla tavalla auringonsäteiden ja maan välinen kulma saadaan puun korkeudesta ja sen varjon pituudesta."},{"tyyppi":"kappale","otsikko":"Suoran suuntakulma","sisalto":"Nouseva suora muodostaa x-akselin kanssa kulman, jota sanotaan suoran suuntakulmaksi. Se lasketaan kulmakertoimesta. Kulmakerroin k kertoo, kuinka paljon y muuttuu, kun x kasvaa yhdellä. Kun suoran pisteestä P mennään yksi yksikkö oikealle ja sitten k yksikköä ylös, palataan suoralle, ja syntyy suorakulmainen kolmio, jonka vaakasuora kateetti on 1 ja pystysuora kateetti k. Vaakasuora kateetti on x-akselin suuntainen, joten kolmion kulma pisteessä P on samankohtaisena kulmana yhtä suuri kuin suuntakulma α. Kulman α viereinen kateetti on 1 ja vastainen k, joten tan α = k : 1 = k. Esimerkiksi suoralla y = 0,5x + 3 on tan α = 0,5 ja α ≈ 26,6°. Vakiotermi 3 siirtää suoraa ylöspäin mutta ei muuta sen suuntaa, joten se ei vaikuta suuntakulmaan. Kun suora annetaan kahden pisteen avulla, laske ensin kulmakerroin: y:n muutos jaettuna x:n muutoksella. Pisteiden (1, 2) ja (4, 7) kautta kulkevan suoran kulmakerroin on (7 − 2) : (4 − 1) = 5/3, joten tan α = 5/3 ja α ≈ 59,0°. Tässä taidossa lasketaan nousevien suorien (k > 0) suuntakulmia."},{"tyyppi":"ansa","otsikko":"Ansa 1: vastainen, viereinen ja hypotenuusa sekaisin","sisalto":"Kolmiossa ABC kulma C on suora, BC = 5,0 cm ja AC = 8,0 cm, ja kysytään kulmaa A. Jos kateetit vaihtuvat, saadaan tan A = 8,0 : 5,0 = 1,6 ja A ≈ 58,0°. Kulman A vastainen kateetti on kuitenkin BC, koska sen nimessä ei ole kirjainta A: tan A = 5,0 : 8,0 = 0,625 ja A ≈ 32,0°. Väärä tulos on kolmion toinen terävä kulma B, sillä 32,0° + 58,0° = 90°. 45°:n arvio paljastaa virheen: vastainen kateetti 5,0 cm on lyhyempi kuin viereinen 8,0 cm, joten kulman pitää olla alle 45°. Toinen virhe syntyy, kun myös hypotenuusa annetaan. Kolmiossa ABC kulma C on suora, AC = 12 cm, BC = 5 cm ja AB = 13 cm. Kulman A viereiseksi kateetiksi voi houkutella hypotenuusa AB, koska sekin lähtee kärjestä A. Silloin tulisi tan A = 5 : 13 ja A ≈ 21,0°. Hypotenuusa ei ole kateetti, joten se ei kuulu tangenttiin lainkaan: tan A = BC : AC = 5 : 12 ja A ≈ 22,6°."},{"tyyppi":"ansa","otsikko":"Ansa 2: laskin väärässä tilassa tai käänteistoiminto unohtuu","sisalto":"Kolmiossa ABC kulma C on suora, kulma A = 34° ja AC = 12,0 cm, ja kysytään sivua BC. Oikea lasku on BC = 12,0 cm · tan 34° ≈ 8,1 cm. Jos laskin on radiaanitilassa (RAD), se tulkitsee luvun 34 radiaaneiksi, ja tulokseksi tulee 12,0 · tan 34 ≈ −7,5 cm. Pituus ei voi olla negatiivinen, ja suorakulmaisen kolmion terävän kulman tangentti on positiivinen, koska se on kahden pituuden suhde. Tarkista siksi tila ennen laskemista: astetilassa tan 45° = 1. Toinen laskinvirhe on unohtaa käänteistoiminto. Kun tan A = 5,0 : 8,0 = 0,625, kulma ei ole 0,625° eikä 0,6°, vaan A = tan⁻¹(0,625) ≈ 32,0°. Kateettien suhde on luku ilman yksikköä, ja kulma saadaan siitä vasta käänteistoiminnolla."},{"tyyppi":"ansa","otsikko":"Ansa 3: kerro vai jaa","sisalto":"Kolmiossa ABC kulma C on suora, kulma A = 37° ja BC = 6,0 cm, ja kysytään sivua AC. Houkutteleva lasku on AC = 6,0 cm · tan 37° ≈ 4,5 cm, koska tangentilla kertominen tuntuu tutulta. Kirjoita kuitenkin ensin yhtälö. Kulman A vastainen kateetti on BC ja viereinen AC, joten tan 37° = 6,0 : AC. Tuntematon on nimittäjässä, joten AC · tan 37° = 6,0 ja AC = 6,0 : tan 37° ≈ 8,0 cm. Tarkista järkevyys: kulma on alle 45°, joten vastaisen kateetin BC pitää olla lyhyempi kuin viereisen kateetin AC. Tulos 8,0 cm täyttää ehdon, mutta 4,5 cm ei. Kun tuntematon on vastainen kateetti, kerro tangentilla. Kun tuntematon on viereinen kateetti, jaa tangentilla."},{"tyyppi":"muistilappu","otsikko":"Muista nämä","kohdat":["Vastainen kateetti on kulman kärkeä vastapäätä. Viereinen kateetti lähtee kulman kärjestä. Hypotenuusa ei ole kumpikaan.","tan α = kulman α vastainen kateetti : kulman α viereinen kateetti.","Tangentti riippuu vain kulmasta, koska suorakulmaiset kolmiot, joissa on yhtä suuri terävä kulma, ovat yhdenmuotoiset.","Laskin astetilaan (DEG). Testi: tan 45° = 1.","Tuntematon vastainen kateetti: kerro tangentilla. Tuntematon viereinen kateetti: jaa tangentilla.","Kulma kateeteista: laske suhde ja ota siitä tan⁻¹. Suhde ei ole kulma.","Suoran suuntakulma: tan α = k.","Terävä kulma on alle 45°, kun sen vastainen kateetti on lyhyempi kuin viereinen, ja yli 45°, kun pidempi.","Kulman tangentti on luku. Ympyrän tangentti on suora."]}],"harjoitukset":[{"id":"H01","ryhma":"nimeaminen","kysymys":"Kolmiossa KLM kulma L on suora. Mikä sivu on kulman K vastainen kateetti?","vastaus":1,"vinkki":"Vastainen kateetti ei kosketa kulman K kärkeä.","selitys":"Kateetit ovat KL ja LM, koska ne lähtevät suoran kulman kärjestä L. Sivu LM ei kosketa kärkeä K, joten se on kulman K vastainen kateetti. KL on kulman K viereinen kateetti ja KM hypotenuusa.","tyyppi":"monivalinta","vaihtoehdot":["KL","LM","KM"]},{"id":"H02","ryhma":"nimeaminen","kysymys":"Kolmiossa ABC kulma C on suora, AC = 9 cm, BC = 40 cm ja AB = 41 cm. Kuinka pitkä on kulman A vastainen kateetti? Anna vastaus senttimetreinä ilman yksikköä.","vastaus":40,"vinkki":"Etsi sivu, jonka nimessä ei ole kirjainta A.","selitys":"Kulman A vastainen kateetti on BC = 40 cm. AC = 9 cm on kulman A viereinen kateetti ja AB = 41 cm hypotenuusa."},{"id":"H03","ryhma":"nimeaminen","kysymys":"Kolmiossa PQR kulma P on suora, PQ = 20 cm, PR = 99 cm ja QR = 101 cm. Kuinka pitkä on kulman Q viereinen kateetti? Anna vastaus senttimetreinä ilman yksikköä.","vastaus":20,"vinkki":"Viereinen kateetti lähtee kärjestä Q ja päättyy suoran kulman kärkeen P.","selitys":"Kulman Q viereinen kateetti on PQ = 20 cm. QR lähtee myös kärjestä Q, mutta se on hypotenuusa, koska sen nimessä ei ole suoran kulman kirjainta P. PR = 99 cm on kulman Q vastainen kateetti."},{"id":"H04","ryhma":"nimeaminen","kysymys":"Kolmiossa KLM kulma M on suora, KM = 7 cm, LM = 24 cm ja KL = 25 cm. Laske tan L. Anna vastaus murtolukuna.","vastaus":0.2916666666666667,"vinkki":"Kulman L vastainen kateetti on KM ja viereinen LM.","selitys":"tan L = KM : LM = 7/24. Vastaus 24/7 syntyy, jos kateetit vaihtuvat, ja 7/25, jos viereiseksi otetaan hypotenuusa KL."},{"id":"H05","ryhma":"nimeaminen","kysymys":"Laske tan 61° kolmen desimaalin tarkkuudella.","vastaus":1.804,"vinkki":"Tarkista ensin, että laskin on astetilassa: tan 45° = 1.","selitys":"Laskin antaa tan 61° = 1,8040…, joten tan 61° ≈ 1,804. Arvo on yli 1, koska kulma on yli 45°."},{"id":"H06","ryhma":"nimeaminen","kysymys":"Suorakulmaisessa kolmiossa kulman α vastainen kateetti on 4 cm ja viereinen kateetti 10 cm. Toisessa suorakulmaisessa kolmiossa on yhtä suuri kulma α, ja sen viereinen kateetti on 25 cm. Laske toisen kolmion kulman α vastainen kateetti. Anna vastaus senttimetreinä ilman yksikköä.","vastaus":10,"vinkki":"Kolmiot ovat yhdenmuotoiset, joten tan α on molemmissa sama: 4 : 10.","selitys":"tan α = 4 : 10 = 0,4 kummassakin kolmiossa. Toisessa kolmiossa vastainen kateetti on 0,4 · 25 cm = 10 cm. Vastaus 19 syntyy, jos viereiseen kateettiin lisättyä pituutta lisätään myös vastaiseen kateettiin, mutta yhdenmuotoisessa kuviossa sivut kerrotaan samalla luvulla."},{"id":"H07","ryhma":"nimeaminen","kysymys":"Laskimesi näyttää tan 45 = 1,620. Mitä se tarkoittaa?","vastaus":0,"vinkki":"Mikä tan 45°:n arvon pitäisi olla?","selitys":"Astetilassa tan 45° = 1, koska 45°:n kulman kateetit ovat yhtä pitkät. Tulos 1,620 kertoo, että laskin on radiaanitilassa ja laski luvun 45 tangentin radiaaneina. Vaihda laskin astetilaan (DEG).","tyyppi":"monivalinta","vaihtoehdot":["Laskin on radiaanitilassa. Se pitää vaihtaa astetilaan.","Laskin toimii oikein, sillä tan 45° = 1,620.","Kulma on liian suuri, sillä tangentti on aina alle 1."]},{"id":"H08","ryhma":"kateetti","kysymys":"Kolmiossa ABC kulma C on suora, kulma A = 28° ja AC = 15,0 cm. Laske BC millimetrin tarkkuudella. Anna vastaus senttimetreinä ilman yksikköä.","vastaus":8.0,"vinkki":"BC on kulman A vastainen kateetti ja AC viereinen: tan 28° = BC : 15,0.","selitys":"tan 28° = BC : 15,0, joten BC = 15,0 · tan 28° = 7,976… ≈ 8,0 cm. Kulma on alle 45°, joten BC on lyhyempi kuin AC."},{"id":"H09","ryhma":"kateetti","kysymys":"Kolmiossa ABC kulma C on suora, kulma A = 36° ja BC = 5,5 cm. Laske AC millimetrin tarkkuudella. Anna vastaus senttimetreinä ilman yksikköä.","vastaus":7.6,"vinkki":"AC on kulman A viereinen kateetti eli nimittäjässä. Jaa, älä kerro.","selitys":"tan 36° = 5,5 : AC, joten AC · tan 36° = 5,5 ja AC = 5,5 : tan 36° = 7,570… ≈ 7,6 cm. Vastaus 4,0 syntyy, jos kerrotaan. Kulma on alle 45°, joten viereisen kateetin AC pitää olla pidempi kuin BC."},{"id":"H10","ryhma":"kateetti","kysymys":"Kolmiossa ABC kulma C on suora, kulma B = 57° ja BC = 4,2 cm. Laske AC millimetrin tarkkuudella. Anna vastaus senttimetreinä ilman yksikköä.","vastaus":6.5,"vinkki":"Nimeä kateetit kulman B mukaan. Kumpi sivu ei kosketa kärkeä B?","selitys":"Kulman B vastainen kateetti on AC ja viereinen BC. tan 57° = AC : 4,2, joten AC = 4,2 · tan 57° = 6,467… ≈ 6,5 cm. Kulma on yli 45°, joten AC on pidempi kuin BC."},{"id":"H11","ryhma":"kateetti","kysymys":"Pihakoivu kasvaa pystysuoraan vaakasuoralla maalla, joten runko ja maa ovat kohtisuorassa. Koivun varjo on 22,0 m pitkä, ja auringonsäteet tulevat maahan 31°:n kulmassa. Laske koivun korkeus 0,1 m:n tarkkuudella. Anna vastaus metreinä ilman yksikköä.","vastaus":13.2,"vinkki":"Runko, varjo ja auringonsäde muodostavat suorakulmaisen kolmion. Korkeus on 31°:n kulman vastainen kateetti.","selitys":"tan 31° = korkeus : 22,0 m, joten korkeus = 22,0 m · tan 31° = 13,219… m ≈ 13,2 m."},{"id":"H12","ryhma":"kateetti","kysymys":"Valaisinpylväs seisoo pystysuorassa vaakasuoralla maalla, ja se on 8,0 m korkea. Auringonsäteet tulevat maahan 51°:n kulmassa. Laske pylvään varjon pituus 0,1 m:n tarkkuudella. Anna vastaus metreinä ilman yksikköä.","vastaus":6.5,"vinkki":"Varjo on 51°:n kulman viereinen kateetti. Tuntematon on nimittäjässä.","selitys":"tan 51° = 8,0 : varjo, joten varjo = 8,0 m : tan 51° = 6,478… m ≈ 6,5 m. Kulma on yli 45°, joten varjo on lyhyempi kuin pylväs."},{"id":"H13","ryhma":"kateetti","kysymys":"Aino laski kolmiosta ABC, jossa kulma C on suora, kulma A = 58° ja BC = 7,0 cm, sivun AC näin: AC = 7,0 · tan 58° ≈ 11,2 cm. Laske AC oikein millimetrin tarkkuudella. Anna vastaus senttimetreinä ilman yksikköä.","vastaus":4.4,"vinkki":"BC on kulman A vastainen kateetti. Kumpi on tuntematon, osoittaja vai nimittäjä?","selitys":"tan 58° = 7,0 : AC, joten AC = 7,0 : tan 58° = 4,374… ≈ 4,4 cm. Aino kertoi, vaikka tuntematon on viereinen kateetti. Kulma on yli 45°, joten viereisen kateetin AC pitää olla lyhyempi kuin BC, mutta Ainon 11,2 cm on pidempi."},{"id":"H14","ryhma":"kateetti","kysymys":"Kolmiossa KLM kulma M on suora, kulma L = 24° ja KM = 3,8 cm. Laske LM millimetrin tarkkuudella. Anna vastaus senttimetreinä ilman yksikköä.","vastaus":8.5,"vinkki":"KM ei kosketa kärkeä L, joten se on kulman L vastainen kateetti.","selitys":"tan 24° = KM : LM = 3,8 : LM, joten LM = 3,8 : tan 24° = 8,535… ≈ 8,5 cm."},{"id":"H15","ryhma":"kulma","kysymys":"Kolmiossa ABC kulma C on suora, BC = 6,5 cm ja AC = 4,0 cm. Laske kulma A asteen kymmenesosan tarkkuudella. Anna vastaus asteina ilman astemerkkiä.","vastaus":58.4,"vinkki":"tan A = BC : AC. Ota suhteesta tan⁻¹.","selitys":"tan A = 6,5 : 4,0 = 1,625 ja A = tan⁻¹(1,625) ≈ 58,4°. Vastainen kateetti on pidempi kuin viereinen, joten kulma on yli 45°."},{"id":"H16","ryhma":"kulma","kysymys":"Suorakulmaisen kolmion terävälle kulmalle α pätee tan α = 0,9. Laske α asteen kymmenesosan tarkkuudella. Anna vastaus asteina ilman astemerkkiä.","vastaus":42.0,"vinkki":"Käytä käänteistoimintoa tan⁻¹. Kulma ei ole 0,9°.","selitys":"α = tan⁻¹(0,9) ≈ 41,987…° ≈ 42,0°. Tangentti on alle 1, joten kulma on alle 45°."},{"id":"H17","ryhma":"kulma","kysymys":"Kolmiossa ABC kulma C on suora, AB = 29 cm, AC = 20 cm ja BC = 21 cm. Laske kulma B asteen kymmenesosan tarkkuudella. Anna vastaus asteina ilman astemerkkiä.","vastaus":43.6,"vinkki":"Hypotenuusa AB ei kuulu tangenttiin. Kulman B vastainen kateetti on AC.","selitys":"tan B = AC : BC = 20 : 21 ja B = tan⁻¹(20/21) ≈ 43,6°. Vastaus 46,4 syntyy, jos kateetit vaihtuvat, ja 34,6, jos viereiseksi otetaan hypotenuusa AB."},{"id":"H18","ryhma":"kulma","kysymys":"Suora y = 0,4x + 1 muodostaa x-akselin kanssa kulman α. Laske α asteen kymmenesosan tarkkuudella. Anna vastaus asteina ilman astemerkkiä.","vastaus":21.8,"vinkki":"Suuntakulmalle pätee tan α = k. Vakiotermi ei vaikuta kulmaan.","selitys":"Kulmakerroin on 0,4, joten tan α = 0,4 ja α = tan⁻¹(0,4) ≈ 21,8°."},{"id":"H19","ryhma":"kulma","kysymys":"Suora kulkee pisteiden (−3, 1) ja (4, 6) kautta. Laske kulma, jonka suora muodostaa x-akselin kanssa, asteen kymmenesosan tarkkuudella. Anna vastaus asteina ilman astemerkkiä.","vastaus":35.5,"vinkki":"Laske ensin kulmakerroin: y:n muutos jaettuna x:n muutoksella.","selitys":"k = (6 − 1) : (4 − (−3)) = 5/7, joten tan α = 5/7 ja α ≈ 35,5°. Vastaus 54,5 syntyy, jos muutokset jaetaan väärin päin."},{"id":"H20","ryhma":"kulma","kysymys":"Kolmiossa ABC kulma C on suora. Kulman A vastainen kateetti on 7,0 cm ja viereinen kateetti 3,0 cm. Mitä voit sanoa kulmasta A laskematta?","vastaus":2,"vinkki":"Vertaa vastaista ja viereistä kateettia. Mikä on tan 45°?","selitys":"Vastainen kateetti on pidempi kuin viereinen, joten tan A = 7,0 : 3,0 on yli 1 = tan 45°. Siksi kulma A on yli 45°. Laskimella A ≈ 66,8°.","tyyppi":"monivalinta","vaihtoehdot":["Kulma A on alle 45°.","Kulma A on tasan 45°.","Kulma A on yli 45°."]}]};

  const x = n => X0 + (n/100)*(X1-X0);
  let s=`<line class="rail" x1="${X0}" y1="${Y}" x2="${X1}" y2="${Y}"/>`;
  for(let n=0;n<=100;n+=10){
    const near = (n===ala||n===yla);
    s+=`<line class="tick" x1="${x(n)}" y1="${Y-7}" x2="${x(n)}" y2="${Y+7}"/>`;
    s+=`<text class="stop${near?" near":""}" x="${x(n)}" y="${Y+24}" text-anchor="middle">${n}</text>`;
  }
  s+=`<line class="halfway" x1="${x(puoli)}" y1="${Y-16}" x2="${x(puoli)}" y2="${Y+12}"/>`;
  s+=`<text class="stop" x="${x(puoli)}" y="${Y-22}" text-anchor="middle">puoliväli ${puoli}</text>`;
  s+=`<circle class="dot" cx="${x(v)}" cy="${Y}" r="6"/>`;
  s+=`<text class="val" x="${x(v)}" y="${Y-32}" text-anchor="middle">${v}</text>`;
  s+=`<path d="M ${x(v)} ${Y+38} L ${x(pyor)} ${Y+38}" stroke="var(--core)" stroke-width="2" fill="none"/>`;
  s+=`<path d="M ${x(pyor)} ${Y+38} l ${x(pyor)>x(v)?-7:7} -4 l 0 8 z" fill="var(--core)"/>`;
  svg.innerHTML=s;
  out.textContent = `${v} pyöristyy → ${pyor}`;
}

/* ---------- laskujärjestys-widget ---------- */
const ljExp=document.getElementById("ljExp");
if(ljExp && D.kokeilu){
  let ljI=0, ljTokens=[], ljStep=0;
  const laske=(a,op,b)=>{a=+a;b=+b;return op==="×"?a*b:op==="÷"?a/b:op==="+"?a+b:a-b;};
  function ljAlku(){
    const l=D.kokeilu[ljI];
    ljTokens=l.lauseke.replace(/\(/g,"( ").replace(/\)/g," )").split(/\s+/).filter(Boolean);
    ljStep=0; ljPiirra(); ljViesti("","");
  }
  function ljViesti(t,lk){const f=document.getElementById("ljFb"); f.textContent=t; f.className="lj-fb "+(lk||"");}
  function ljPiirra(){
    const l=D.kokeilu[ljI];
    document.getElementById("ljStep").textContent =
      ljStep>=l.askeleet.length ? "valmis" : `askel ${ljStep+1} / ${l.askeleet.length}`;
    if(ljStep>=l.askeleet.length){
      ljExp.innerHTML=`<span class="valmis">${l.lauseke} = ${l.vastaus}</span>`;
      return;
    }
    ljExp.innerHTML=ljTokens.map((t,i)=>
      "×÷+−".includes(t) ? `<button type="button" class="op" data-i="${i}">${t}</button>`
                         : `<span class="tok">${t}</span>`).join("");
    ljExp.querySelectorAll("button.op").forEach(b=>b.addEventListener("click",()=>ljKlikkaa(+b.dataset.i)));
  }
  function ljKlikkaa(i){
    const l=D.kokeilu[ljI], odotettu=l.askeleet[ljStep];
    const ehdotus=[ljTokens[i-1],ljTokens[i],ljTokens[i+1]].join(" ");
    if(ehdotus!==odotettu){
      ljViesti(ljStep===0
        ? "Ei vielä. Sulkeet ovat vahvimmat, sitten kerto ja jako. Yhtä vahvat vasemmalta oikealle."
        : "Ei vielä. Kumpi jäljellä olevista on vahvempi?", "no");
      return;
    }
    const arvo=laske(ljTokens[i-1],ljTokens[i],ljTokens[i+1]);
    let alku=i-1, loppu=i+1;
    if(ljTokens[i-2]==="(" && ljTokens[i+2]===")"){ alku=i-2; loppu=i+2; }
    ljTokens.splice(alku, loppu-alku+1, String(arvo));
    ljStep++;
    ljViesti(ljStep>=l.askeleet.length ? "Valmis. Vastaus on "+l.vastaus+"." : "Oikein. Jatka seuraavaan.", "ok");
    ljPiirra();
  }
  document.getElementById("ljSeuraava").addEventListener("click",()=>{
    ljI=(ljI+1)%D.kokeilu.length; ljAlku();
  });
  ljAlku();
}

};

/* Suomalainen lukumuoto: välilyönti on tuhaterotin, pilkku desimaalierotin.
   Piste voi olla kumpi tahansa. Se tulkitaan tuhaterottimeksi VAIN silloin, kun
   koko luku on aitoa tuhaterotinmuotoa: alkuosa 1–3 numeroa ilman etunollaa ja
   jokainen jatko-osa täsmälleen 3 numeroa (1.500, 12.345.678). Kaikissa muissa
   tapauksissa piste on desimaalipiste — myös 0.125, joka vanhalla säännöllä
   ("3 numeroa pisteen jäljessä = tuhaterotin") luettiin virheellisesti luvuksi 125. */
const TUHATEROTIN = /^[1-9]\d{0,2}(\.\d{3})+$/;
function lueLuku(teksti){
  // Murtoluku (3/4, -3/4) ja sekaluku (1 2/3, -1 2/3) hyväksytään sellaisinaan.
  const raaka = String(teksti).replace(/\u00a0/g, " ").trim();
  let m = raaka.match(/^(-?)(\d+)\s+(\d+)\s*\/\s*(\d+)$/);
  if(m){ const nim = Number(m[4]); if(nim === 0) return null;
    const v = Number(m[2]) + Number(m[3]) / nim; return m[1] ? -v : v; }
  m = raaka.match(/^(-?)\s*(\d+)\s*\/\s*(\d+)$/);
  if(m){ const nim = Number(m[3]); if(nim === 0) return null;
    const v = Number(m[2]) / nim; return m[1] ? -v : v; }
  let s = String(teksti).replace(/[\s\u00a0]/g, "");
  if(s === "") return null;
  if(s.indexOf(",") >= 0){
    s = s.replace(/\./g, "").replace(",", ".");
  } else if(TUHATEROTIN.test(s)){
    s = s.replace(/\./g, "");
  }
  const n = Number(s);
  return Number.isFinite(n) ? n : null;
}

function tarkista(id){
  const h=D.harjoitukset.find(x=>x.id===id);
  const kentta=document.getElementById("in-"+id);
  const fb=document.getElementById("fb-"+id);
  if(kentta.value.trim()===""){ fb.className="fb hint"; fb.textContent="Kirjoita vastaus ensin."; return; }
  const luku=lueLuku(kentta.value);
  if(luku===null){ fb.className="fb no"; fb.textContent="Vastauksen pitää olla luku tai murtoluku (esimerkiksi 3/4)."; return; }
  const oikein = Math.abs(luku - h.vastaus) < 1e-9;
  merkitseTulos(id, oikein, oikein ? "Oikein. "+h.selitys : `Ei vielä. ${h.vinkki} Kokeile uudelleen.`);
}

function tarkistaMonivalinta(id, valittuIndeksi, painike){
  const h=D.harjoitukset.find(x=>x.id===id);
  const rivi=painike.closest(".row");
  rivi.querySelectorAll(".mv-valinta").forEach(b=>b.disabled=true);
  const oikein = valittuIndeksi===h.vastaus;
  painike.classList.add(oikein?"mv-oikein":"mv-vaarin");
  if(!oikein){
    const oikeaBtn=rivi.querySelector(`[data-i="${h.vastaus}"]`);
    if(oikeaBtn) oikeaBtn.classList.add("mv-oikein");
  }
  merkitseTulos(id, oikein, oikein ? "Oikein. "+h.selitys : `Ei ihan. Oikea vastaus on korostettu. ${h.selitys||""}`);
}

/* Kuuntelu: selain lukee tekstin ääneen omalla puhesynteesillään (englanniksi, jos laitteessa on
   englanninkielinen ääni). Ei äänitiedostoja eikä verkkoyhteyttä. Jos laite ei osaa puhua,
   teksti näytetään luettavaksi — silloin tehtävä muuttuu luetun ymmärtämiseksi, mutta ei katkea. */
function puhu(id, nopeus){
  const h=D.harjoitukset.find(x=>x.id===id); if(!h || !h.kuuntele) return;
  const vara=document.getElementById("vara-"+id);
  const naytaTeksti=syy=>{ vara.hidden=false; vara.textContent=syy+" Teksti: "+h.kuuntele; };
  if(!("speechSynthesis" in window)){ naytaTeksti("Tämä laite ei osaa lukea ääneen."); return; }
  const s=window.speechSynthesis; s.cancel();
  const u=new SpeechSynthesisUtterance(h.kuuntele);
  u.lang=h.kieli||"en-GB"; u.rate=nopeus;
  const aanet=s.getVoices(), kieli=u.lang.slice(0,2);
  const aani=aanet.find(a=>a.lang===u.lang) || aanet.find(a=>a.lang && a.lang.startsWith(kieli));
  if(aani) u.voice=aani;
  else if(aanet.length) { naytaTeksti("Laitteessa ei ole englanninkielistä ääntä."); return; }
  u.onerror=()=>naytaTeksti("Ääneen lukeminen ei onnistunut.");
  s.speak(u);
}
