<title>Perustelu ensin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">

<style>
:root{
  --paper:#EFF2F5; --surface:#FFFFFF; --surface-2:#F7F9FB;
  --grid:#DCE3EA; --line:#C9D3DC;
  --ink:#15222C; --ink-2:#4E626F; --ink-3:#7E8F9B;
  --core:#1B5A9E; --core-soft:#E4EDF6;
  --strong:#1F6E5C; --strong-soft:#E1F0EB;
  --chal:#9A6A16; --chal-soft:#F6EDDC;
  --alert:#A33A2B; --alert-soft:#F8E7E3;
  --shadow:0 1px 2px rgba(21,34,44,.06), 0 8px 24px -12px rgba(21,34,44,.18);
  --r:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0F161B; --surface:#18222A; --surface-2:#1D2830;
    --grid:#22303A; --line:#2E3E4A;
    --ink:#E8EFF4; --ink-2:#A3B4C0; --ink-3:#7A8B97;
    --core:#7FB2E4; --core-soft:#16303F;
    --strong:#77CDB4; --strong-soft:#123028;
    --chal:#E0B267; --chal-soft:#33270F;
    --alert:#E8907F; --alert-soft:#3A1E19;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -14px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --paper:#0F161B; --surface:#18222A; --surface-2:#1D2830;
  --grid:#22303A; --line:#2E3E4A;
  --ink:#E8EFF4; --ink-2:#A3B4C0; --ink-3:#7A8B97;
  --core:#7FB2E4; --core-soft:#16303F;
  --strong:#77CDB4; --strong-soft:#123028;
  --chal:#E0B267; --chal-soft:#33270F;
  --alert:#E8907F; --alert-soft:#3A1E19;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -14px rgba(0,0,0,.7);
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:16px; line-height:1.62;
  background-image:
    linear-gradient(to right, var(--grid) 1px, transparent 1px),
    linear-gradient(to bottom, var(--grid) 1px, transparent 1px);
  background-size:26px 26px;
}
.wrap{max-width:760px; margin:0 auto; padding:28px 20px 90px}
h1,h2,h3,h4{font-family:"Familjen Grotesk","IBM Plex Sans",system-ui,sans-serif; text-wrap:balance}

/* header */
header.top{background:var(--surface); border:1px solid var(--line); border-radius:var(--r);
  box-shadow:var(--shadow); padding:22px 24px; display:flex; gap:18px; align-items:flex-start}
.badge{flex:0 0 auto; width:54px; height:54px; border-radius:9px; display:grid; place-items:center;
  background:var(--core-soft); border:1px solid var(--core); color:var(--core)}
.badge svg{width:28px; height:28px; fill:none; stroke:currentColor; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round}
.eyebrow{font-family:"IBM Plex Mono",monospace; font-size:11px; letter-spacing:.14em;
  text-transform:uppercase; color:var(--ink-3); margin:0 0 5px}
header.top h1{margin:0; font-size:30px; font-weight:700; letter-spacing:-.015em}
header.top p{margin:5px 0 0; color:var(--ink-2); font-size:15px}
.tags{display:flex; flex-wrap:wrap; gap:5px; margin-top:11px}
.tag{font-family:"IBM Plex Mono",monospace; font-size:10.5px; letter-spacing:.05em; padding:2px 7px;
  border-radius:4px; background:var(--surface-2); border:1px solid var(--line); color:var(--ink-3)}
.tag.core{background:var(--core-soft); border-color:var(--core); color:var(--core)}

/* teksti */
article{margin-top:26px}
article h2{font-size:21px; font-weight:600; margin:32px 0 10px; letter-spacing:-.01em}
article p{margin:0 0 14px; max-width:64ch}
.lead{font-size:17.5px; color:var(--ink); border-left:3px solid var(--core); padding-left:16px; margin:0 0 8px}

.box{background:var(--surface); border:1px solid var(--line); border-radius:var(--r);
  padding:18px 22px; box-shadow:var(--shadow); margin:22px 0}
.box h3{margin:0 0 12px; font-size:16.5px; font-weight:600}
.box.warn{border-left:3px solid var(--alert)}
.box.note{border-left:3px solid var(--chal)}

ol.steps{margin:0; padding-left:0; list-style:none; counter-reset:s; display:grid; gap:12px}
ol.steps li{counter-increment:s; display:grid; grid-template-columns:auto 1fr; gap:13px; align-items:start}
ol.steps li::before{content:counter(s); font-family:"Familjen Grotesk",sans-serif; font-weight:700; font-size:14px;
  width:26px; height:26px; border-radius:50%; background:var(--core); color:#fff; display:grid; place-items:center; margin-top:2px}

ul.notes{margin:0; padding-left:19px}
ul.notes li{margin-bottom:7px}
ul.notes li:last-child{margin-bottom:0}

.tablewrap{overflow-x:auto}
table{border-collapse:collapse; width:100%; font-size:14.5px; min-width:460px}
th,td{text-align:left; padding:9px 13px; border-bottom:1px solid var(--line)}
th{font-family:"IBM Plex Mono",monospace; font-size:10.5px; letter-spacing:.1em; text-transform:uppercase;
  color:var(--ink-3); font-weight:400; background:var(--surface-2)}
tr:last-child td{border-bottom:0}
td b{color:var(--core); font-weight:600}
td:last-child{font-variant-numeric:tabular-nums; font-weight:600}

/* lukusuora */
.nl svg{width:100%; height:118px; display:block}
.nl .rail{stroke:var(--line); stroke-width:2}
.nl .tick{stroke:var(--line); stroke-width:1.5}
.nl .stop{fill:var(--ink-3); font-family:"IBM Plex Mono",monospace; font-size:11px}
.nl .stop.near{fill:var(--core); font-weight:600}
.nl .dot{fill:var(--chal)}
.nl .val{fill:var(--ink); font-family:"Familjen Grotesk",sans-serif; font-size:15px; font-weight:700}
.nl .halfway{stroke:var(--chal); stroke-dasharray:3 3; stroke-width:1.5}
.nl-controls{display:flex; align-items:center; gap:14px; margin-top:6px}
.nl-controls input{flex:1; accent-color:var(--core)}
.nl-out{font-family:"Familjen Grotesk",sans-serif; font-size:15px; font-weight:600; min-width:12.5em; text-align:right}

/* paikka-arvotaulu */
.box .ohje{margin:0 0 14px; font-size:14.5px; color:var(--ink-2)}
.nt-valinta{display:flex; flex-wrap:wrap; gap:7px; margin-bottom:16px}
.nt-valinta button{font:inherit; font-size:12.5px; font-family:"IBM Plex Mono",monospace; padding:5px 11px;
  border-radius:6px; border:1px solid var(--line); background:var(--surface-2); color:var(--ink-2); cursor:pointer}
.nt-valinta button[aria-pressed="true"]{background:var(--ink); color:var(--paper); border-color:var(--ink)}
.nt-valinta button:focus-visible{outline:2px solid var(--core); outline-offset:2px}
.nt-taulu{display:flex; flex-direction:column; gap:4px; align-items:flex-start; overflow-x:auto; padding-bottom:4px}
.nt-rivi{display:flex; gap:6px; align-items:center}
.nt-rivi .otsa{font-family:"IBM Plex Mono",monospace; font-size:9.5px; letter-spacing:.08em;
  text-transform:uppercase; color:var(--ink-3); width:52px; text-align:center}
.nt-ruutu{width:52px; height:52px; display:grid; place-items:center; border:1.5px solid var(--line);
  border-radius:7px; background:var(--surface-2); font-family:"IBM Plex Mono",monospace; font-size:24px}
.nt-ruutu.kohta{border-color:var(--core); background:var(--core-soft); color:var(--core); font-weight:500}
.nt-ruutu.ratkaiseva{border-color:var(--chal); background:var(--chal-soft); color:var(--chal); font-weight:500}
.nt-ruutu.nolla{color:var(--ink-3)}
.nt-rivi .nimi{font-size:12.5px; color:var(--ink-3); margin-left:12px; white-space:nowrap}
.nt-nuoli{font-size:17px; color:var(--chal); margin-left:6px}
.nt-selite{margin:14px 0 0; font-size:14.5px}
.nt-selite b{color:var(--core)}

/* vahvuusportaat */
.vp-tasot{display:grid; gap:9px; margin-bottom:18px}
.vp-taso{display:flex; gap:11px; align-items:flex-start; font-size:13.5px}
.vp-taso .vp-pallo{width:13px; height:13px; border-radius:4px; margin-top:5px; flex:0 0 auto}
.vp-taso[data-taso="sulkeet"] .vp-pallo{background:var(--core)}
.vp-taso[data-taso="kertojako"] .vp-pallo{background:var(--strong)}
.vp-taso[data-taso="yhteenvahennys"] .vp-pallo{background:var(--chal)}
.vp-taso strong{display:block; font-family:"Familjen Grotesk",sans-serif; font-weight:600; font-size:14.5px}
.vp-taso span{color:var(--ink-2)}
.vp-lauseke{display:flex; flex-wrap:wrap; gap:7px; align-items:flex-end; font-family:"IBM Plex Mono",monospace;
  font-size:25px; padding:10px 2px; min-height:64px}
.vp-lauseke .t{padding:2px 3px}
.vp-lauseke .op{position:relative; padding:2px 9px; border-radius:6px; font-weight:500}
.vp-lauseke .op[data-taso="sulkeet"]{background:var(--core-soft); color:var(--core)}
.vp-lauseke .op[data-taso="kertojako"]{background:var(--strong-soft); color:var(--strong)}
.vp-lauseke .op[data-taso="yhteenvahennys"]{background:var(--chal-soft); color:var(--chal)}
.vp-lauseke .op i{position:absolute; top:-9px; right:-6px; font-style:normal; font-family:"Familjen Grotesk",sans-serif;
  font-size:11px; font-weight:700; width:18px; height:18px; border-radius:50%; display:grid; place-items:center;
  background:currentColor}
.vp-lauseke .op i span{color:var(--surface)}
.vp-rivi{display:flex; align-items:center; gap:16px; margin-top:8px}
.vp-vastaus{font-family:"Familjen Grotesk",sans-serif; font-size:16px; font-weight:600; color:var(--strong)}

/* laskujärjestys-widget */
.lj-exp{display:flex; flex-wrap:wrap; gap:7px; align-items:center; font-family:"IBM Plex Mono",monospace;
  font-size:23px; padding:14px 4px; min-height:62px}
.lj-exp .tok{padding:2px 4px; color:var(--ink)}
.lj-exp button.op{font-family:"IBM Plex Mono",monospace; font-size:23px; padding:3px 12px; border-radius:7px;
  border:1.5px solid var(--line); background:var(--surface-2); color:var(--ink); line-height:1.2}
.lj-exp button.op:hover{border-color:var(--core); color:var(--core)}
.lj-exp button.op:focus-visible{outline:2px solid var(--core); outline-offset:2px}
.lj-exp .valmis{font-family:"Familjen Grotesk",sans-serif; font-size:23px; font-weight:700; color:var(--strong)}
.lj-fb{font-size:14.5px; min-height:1.5em; color:var(--ink-2)}
.lj-fb.no{color:var(--alert)}
.lj-fb.ok{color:var(--strong)}
.lj-row{display:flex; align-items:center; gap:14px; margin-top:10px}
.lj-step{font-family:"IBM Plex Mono",monospace; font-size:11.5px; letter-spacing:.1em;
  text-transform:uppercase; color:var(--ink-3)}

/* harjoitukset */
.progress{position:sticky; top:0; z-index:5; background:var(--surface); border:1px solid var(--line);
  border-radius:var(--r); padding:12px 18px; box-shadow:var(--shadow); display:flex; align-items:center;
  gap:14px; margin:34px 0 18px}
.progress .lbl{font-family:"IBM Plex Mono",monospace; font-size:11px; letter-spacing:.12em;
  text-transform:uppercase; color:var(--ink-3); white-space:nowrap}
.progress .meter{flex:1; height:7px; border-radius:4px; background:var(--surface-2); border:1px solid var(--line); overflow:hidden}
.progress .meter i{display:block; height:100%; background:var(--core); transition:width .25s ease}
.progress .cnt{font-family:"Familjen Grotesk",sans-serif; font-weight:700; font-variant-numeric:tabular-nums; white-space:nowrap}

.grp{margin-top:26px}
.grp-head{display:flex; align-items:baseline; gap:10px; border-bottom:1.5px solid var(--ink); padding-bottom:7px; margin-bottom:14px}
.grp-head h3{margin:0; font-size:17px; font-weight:600}
.grp-head span{font-size:12.5px; color:var(--ink-2)}

.ex{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:14px 16px; margin-bottom:10px}
.ex[data-tila="oikein"]{border-color:var(--strong); box-shadow:inset 3px 0 0 var(--strong)}
.ex[data-tila="vaarin"]{border-color:var(--alert); box-shadow:inset 3px 0 0 var(--alert)}
.ex .q{display:flex; gap:11px; align-items:baseline; flex-wrap:wrap}
.ex .num{font-family:"IBM Plex Mono",monospace; font-size:11.5px; color:var(--ink-3); min-width:2.4em}
.ex .txt{flex:1; min-width:190px; font-size:15.5px}
.ex .txt .aineisto{display:block; margin-bottom:9px; padding-left:12px;
  border-left:2px solid var(--line); color:var(--ink-2); line-height:1.6;
  /* Aineisto voi olla pieni taulukko, jonka rivit on erotettu rivinvaihdoilla.
     Ilman pre-lineä ne valuisivat yhdeksi kappaleeksi ja taulukko katoaisi. */
  white-space:pre-line}
.ex .txt .kysymysrivi{display:block; font-weight:600}
.ex .row{display:flex; gap:8px; align-items:center; margin-top:11px; flex-wrap:wrap}
.ex input[type=text]{font:inherit; font-family:"IBM Plex Mono",monospace; font-size:15px; width:8.5em;
  padding:7px 11px; border:1px solid var(--line); border-radius:7px; background:var(--surface-2);
  color:var(--ink); text-align:right}
.ex input:focus-visible{outline:2px solid var(--core); outline-offset:1px}
button{font:inherit; cursor:pointer}
.btn{font-size:13.5px; padding:7px 15px; border-radius:7px; border:1px solid var(--core);
  background:var(--core); color:#fff}
.btn.ghost{background:transparent; color:var(--ink-2); border-color:var(--line)}
.btn:focus-visible{outline:2px solid var(--core); outline-offset:2px}
.btn.mv-valinta{text-align:left}
/* kuuntelutehtävä: selaimen puhesynteesi lukee englanninkielisen tekstin */
.kuuntele{display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin:2px 0 10px}
.kuuntele .btn{display:inline-flex; gap:7px; align-items:center}
.kuuntele svg{width:16px; height:16px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round}
.kuuntele .varateksti{flex-basis:100%; font-size:14px; color:var(--ink-2); background:var(--surface-2);
  border-radius:7px; padding:8px 12px; margin:0}
.btn.mv-valinta:disabled{cursor:default; opacity:.65}
.btn.mv-oikein{background:var(--strong-soft); border-color:var(--strong); color:var(--strong); opacity:1}
.btn.mv-vaarin{background:var(--alert-soft); border-color:var(--alert); color:var(--alert); opacity:1}
.row.mv{gap:8px 10px}
.fb{margin-top:11px; font-size:14.5px; padding:10px 13px; border-radius:8px; line-height:1.5}
.fb.ok{background:var(--strong-soft); color:var(--strong)}
.fb.no{background:var(--alert-soft); color:var(--alert)}
.fb.hint{background:var(--chal-soft); color:var(--chal)}

.done{background:var(--strong-soft); border:1px solid var(--strong); color:var(--strong);
  border-radius:var(--r); padding:16px 20px; margin-top:20px; font-size:15.5px}
.done h3{margin:0 0 4px; font-size:17px; color:var(--strong)}

details.teacher{margin-top:34px; background:var(--surface); border:1px solid var(--line);
  border-left:3px solid var(--chal); border-radius:var(--r); padding:15px 20px; box-shadow:var(--shadow)}
details.teacher summary{cursor:pointer; font-family:"Familjen Grotesk",sans-serif; font-weight:600; font-size:15px}
details.teacher summary:focus-visible{outline:2px solid var(--core); outline-offset:3px}
details.teacher ul{margin:12px 0 0; padding-left:19px; color:var(--ink-2); font-size:14.5px}
details.teacher li{margin-bottom:8px}
details.teacher p{margin:12px 0 0; color:var(--ink-2); font-size:14.5px}

.back{display:inline-block; margin-top:30px; font-size:13.5px; color:var(--ink-2)}
.back a{color:var(--core)}

@media (prefers-reduced-motion: reduce){*{transition:none !important}}
@media (max-width:560px){
  .wrap{padding:16px 13px 70px}
  header.top h1{font-size:25px}
  .progress{flex-wrap:wrap}
}
</style>

<div class="wrap">

  <header class="top">
    <span class="badge"><svg viewBox="0 0 24 24" aria-hidden="true" id="ikoni"></svg></span>
    <div>
      <p class="eyebrow" id="eyebrow"></p>
      <h1 id="otsikko"></h1>
      <p id="kuvaus"></p>
      <div class="tags" id="tags"></div>
    </div>
  </header>

  <article id="teksti"></article>

  <div class="progress" aria-live="polite">
    <span class="lbl">Harjoitukset</span>
    <span class="meter"><i id="pbar" style="width:0%"></i></span>
    <span class="cnt" id="pcnt">0 / 20</span>
  </div>

  <div id="harjoitukset"></div>
  <div id="valmis"></div>

  <p class="back" id="back"></p>

</div>

<script>
const D = {"tavoite_id":"MAT9-GEO-01","oppiaine":"MAT","vuosiluokka":9,"taso":"ydin","otsikko":"Perustelu ensin","kuvaus":"Osaan ratkaista kulmia ja pituuksia geometrian peruskäsitteiden ja yhdenmuotoisuuden avulla ja perustella ratkaisuni.","versio":"0.2","paivitetty":"2026-10-11","ops":{"T":["T4","T10","T16"],"S":["S5"]},"ikoni":"kyna","eyebrow":"Matematiikka · 9. luokka · Geometria","teksti":[{"tyyppi":"johdanto","sisalto":"Rakennustyömaalla kattotuolien osat sahataan valmiiksi maassa ennen kuin ne nostetaan katolle. Kirvesmies ei voi mitata kulmia ilmassa, vaan hän laskee ne piirustuksesta. Jos kattotuolin vaakasuora vetopuu on yhdensuuntainen alapaarteen kanssa, vetopuun päihin tulevat samat kulmat kuin alapaarteen päihin, ja vetopuun pituus saadaan verrannolla. Jokainen laskettu kulma nojaa johonkin tietoon, ja jos yksikin peruste on väärä, osat eivät sovi yhteen. Tässä taidossa kokoat yhteen kulmatiedot, jotka osaat jo, opit samankohtaiset kulmat ja kolmioiden yhdenmuotoisuuden kulmien avulla ja lasket tuntemattoman sivun verrannolla. Uutta on myös se, että kirjoitat jokaisen vaiheen perään, mihin tietoon se perustuu. Kokeen mittaritehtävissä peruste kirjoitetaan jokaisen vaiheen perään, ja oikea luku ilman perusteita ei riitä. Laskin on sallittu verrannon lukujen laskemiseen, mutta se ei korvaa perustetta."},{"tyyppi":"kappale","otsikko":"Kulmat, jotka osaat jo, ja niiden perusteet","sisalto":"Kun kaksi suoraa leikkaa toisensa, syntyy neljä kulmaa. Vierekkäiset kulmat ovat vieruskulmia, ja niiden summa on 180°, koska ne muodostavat yhdessä oikokulman. Vastakkaiset kulmat ovat ristikulmia, ja ne ovat yhtä suuret, koska kumpikin on saman kulman vieruskulma. Kolmion kulmien summa on 180°. Monikulmion voi jakaa yhdestä kärjestä piirretyillä lävistäjillä n − 2 kolmioksi, joten n-kulmion kulmien summa on (n − 2) · 180°. Esimerkiksi viisikulmion kulmien summa on 3 · 180° = 540°. Kehäkulman kärki on ympyrän kehällä ja sen kyljet ovat jänteitä. Kehäkulma on puolet samaa kaarta vastaavasta keskuskulmasta, eli keskuskulma on kaksi kertaa niin suuri kuin kehäkulma. Tavallinen virhe on kääntää suunta: jos kovera keskuskulma AOB on 110° ja piste C on pidemmällä kaarella AB, kehäkulma ACB on 110° : 2 = 55° eikä 2 · 110° = 220°. Virheen huomaa, koska kolmion kulma ei voi olla yli 180°. Jos lisäksi kulma CAB on 70°, kolmion ABC kulma ABC on 180° − 55° − 70° = 55°. Thaleen lauseen mukaan halkaisijaa vastaava kehäkulma on suora. Kun käytät jotakin näistä tiedoista, kirjoita sen nimi vaiheen perään sulkeisiin: (vieruskulmat), (ristikulmat), (kolmion kulmien summa 180°), (monikulmion kulmien summa), (kehäkulma on puolet keskuskulmasta) tai (Thaleen lause). Nimi riittää perusteeksi, eikä tietoa tarvitse todistaa uudelleen."},{"tyyppi":"kappale","otsikko":"Samankohtaiset kulmat","sisalto":"Kun suora t leikkaa kaksi suoraa l ja m, kummankin leikkauspisteen ympärille syntyy neljä kulmaa. Kuvaa ei ole, joten kulma kerrotaan sen sijainnilla, esimerkiksi näin: pisteen P kohdalla suoran l yläpuolella ja suoran t oikealla puolella oleva kulma. Tämän taidon tehtävissä l ja m ovat vaakasuorat, ja t leikkaa ne vinosti. Kulmat, jotka ovat eri leikkauspisteissä mutta samassa asemassa, ovat samankohtaisia kulmia. Samassa asemassa tarkoittaa, että kulmat ovat vaakasuoran suoran samalla puolella (molemmat yläpuolella tai molemmat alapuolella) ja suoran t samalla puolella (molemmat oikealla tai molemmat vasemmalla). Jos l ja m ovat yhdensuuntaiset, samankohtaiset kulmat ovat yhtä suuret. Miksi? Siirrä suoraa l pitkin suoraa t niin, että se pysyy koko ajan yhdensuuntaisena alkuperäisen kanssa. Siirto ei käännä suoraa, joten sen ja suoran t välinen kulma ei muutu. Kun l on siirretty suoran m päälle, pisteen P kulmat osuvat pisteen Q kulmien päälle samoihin asemiin. Jos l ja m eivät ole yhdensuuntaiset, samankohtaiset kulmat eivät ole yhtä suuret, joten peruste kirjoitetaan muodossa (samankohtaiset kulmat, l ∥ m). Muut pisteen Q kulmat saat yhdistämällä samankohtaiset kulmat vierus- ja ristikulmiin. Jos esimerkiksi pisteen P kohdalla suoran l alapuolella ja suoran t oikealla puolella oleva kulma on 72°, niin pisteen Q kohdalla suoran m alapuolella ja suoran t oikealla puolella oleva kulma on 72° (samankohtaiset kulmat, l ∥ m), ja sen ristikulma eli pisteen Q kohdalla suoran m yläpuolella ja suoran t vasemmalla puolella oleva kulma on myös 72° (ristikulmat). Tällaisia kulmapareja sanotaan vuorokulmiksi, mutta nimeä ei tarvitse muistaa: kaksi perustetta peräkkäin riittää. Sama ajatus toimii kolmiossa. Jos kolmion ABC sivulla AB on piste D ja sivulla AC piste E niin, että DE ∥ BC, suora AB leikkaa yhdensuuntaiset suorat DE ja BC, joten ∠ADE = ∠ABC (samankohtaiset kulmat, DE ∥ BC). Samalla tavalla suora AC antaa ∠AED = ∠ACB."},{"tyyppi":"taulukko","otsikko":"Esimerkki: pisteen P kohdalla suoran l yläpuolella ja suoran t vasemmalla puolella oleva kulma on 132°. Lasketaan pisteen Q kohdalla suoran m alapuolella ja suoran t vasemmalla puolella oleva kulma.","otsikkorivi":["Vaihe","Lasku","Peruste"],"rivit":[["Tieto","P, yläpuolella ja vasemmalla: 132°","annettu, l ∥ m"],["1","Q, yläpuolella ja vasemmalla: 132°","samankohtaiset kulmat, l ∥ m"],["2","Q, alapuolella ja vasemmalla: 180° − 132° = 48°","vieruskulmat"],["Toinen reitti","P, alapuolella ja vasemmalla: 48°, sitten Q, alapuolella ja vasemmalla: 48°","ensin vieruskulmat, sitten samankohtaiset kulmat"],["Tarkistus","Kummallakin reitillä 48°","eri reitit antavat saman tuloksen, kun jokainen peruste on oikein"]]},{"tyyppi":"ansa","otsikko":"Ansa 1: samankohtaiset kulmat suoran t eri puolilta","sisalto":"Pisteen P kohdalla suoran l yläpuolella ja suoran t oikealla puolella oleva kulma on 64°. Kysytään pisteen Q kohdalla suoran m yläpuolella ja suoran t vasemmalla puolella olevaa kulmaa. Kumpikin kulma on vaakasuoran suoran yläpuolella, joten ne näyttävät samankohtaisilta, ja vastaukseksi tulee helposti 64°. Kulmat ovat kuitenkin suoran t eri puolilla. Pisteen P kulman samankohtainen kulma on pisteen Q kohdalla suoran m yläpuolella ja suoran t oikealla puolella, ja se on 64°. Kysytty kulma on sen vieruskulma: 180° − 64° = 116°. Sama virhe toimii myös toisin päin: jos kulmat ovat todella samankohtaiset, niitä ei vähennetä 180°:sta. Tarkista siksi kaksi asiaa: ylä- vai alapuolella ja oikealla vai vasemmalla. Jos molemmat täsmäävät, kulmat ovat samankohtaiset. Jos vain toinen täsmää, tarvitset lisäksi vieruskulman, ja jos kumpikaan ei täsmää, tarvitset ristikulman."},{"tyyppi":"kappale","otsikko":"Kolmiot yhdenmuotoisiksi kahdella kulmalla","sisalto":"Kahdeksannella luokalla totesit kuviot yhdenmuotoisiksi, kun vastinkulmat olivat yhtä suuret ja vastinsivut verrannolliset. Kolmioissa riittää vähemmän: kaksi kolmiota ovat yhdenmuotoiset, jos niissä on kaksi paria yhtä suuria kulmia. Miksi kaksi riittää? Kolmion kulmien summa on 180°, joten kolmas kulma on 180° miinus kaksi muuta. Jos kahdet kulmat ovat samat, myös kolmannet ovat samat. Kun kaikki kulmat ovat samat, kolmiot ovat saman muotoisia: toinen on toisen suurennos tai pienennös, ja niiden vastinsivut ovat verrannolliset. Esimerkki: kolmiossa ABC ∠A = 50° ja ∠B = 70°, joten ∠C = 60°. Kolmiossa DEF ∠D = 50° ja ∠F = 60°. Kolmioilla on kaksi paria yhtä suuria kulmia (A ja D sekä C ja F), joten ne ovat yhdenmuotoiset, ja kolmas pari B ja E on 70°. Vastinkärjet luetaan kulmista, ja vastinsivu on yhtä suurten kulmien vastainen sivu. Sivu BC on kulman A vastainen sivu, joten sen vastinsivu on kulman D vastainen sivu EF. Tässä taidossa on kaksi tyyppikuviota. Ensimmäisessä kolmion sisällä on jana, joka on yhdensuuntainen yhden sivun kanssa. Kun DE ∥ BC, kolmiot ADE ja ABC ovat yhdenmuotoiset, koska kulma A on yhteinen ja ∠ADE = ∠ABC (samankohtaiset kulmat, DE ∥ BC). Pieni kolmio voi olla myös käännetty: jos tehtävässä kerrotaan, että ∠ADE = ∠ACB, kärki D vastaa kärkeä C eikä kärkeä B, vaikka D on sivulla AB. Toisessa tyyppikuviossa on kaksi suorakulmaista kolmiota, joilla on yhtä suuri terävä kulma. Suorat kulmat ovat yksi pari ja terävät kulmat toinen. Näin on esimerkiksi, kun pystysuora keppi ja pystysuora puu luovat varjon samaan aikaan: kumpikin on kohtisuorassa vaakasuoraa maata vastaan, ja auringonsäteet osuvat maahan samassa kulmassa. Samoin, jos suorakulmaisen kolmion ABC (kulma C suora) sivulla AC on piste E ja sivulla AB piste D niin, että DE on kohtisuorassa sivua AC vastaan, kolmiot ADE ja ABC ovat yhdenmuotoiset: ∠AED = ∠ACB = 90° ja kulma A on yhteinen. Jos esimerkiksi AE = 2 m, AC = 5 m ja DE = 0,8 m, niin BC/0,8 = 5/2, josta BC = 2 m."},{"tyyppi":"taulukko","otsikko":"Esimerkki: kolmion ABC sivulla AB on piste D ja sivulla AC piste E niin, että DE ∥ BC. AD = 6 cm, DB = 9 cm ja DE = 4 cm. Lasketaan BC.","otsikkorivi":["Vaihe","Merkintä","Peruste"],"rivit":[["Yhdenmuotoisuus","∠A on yhteinen ja ∠ADE = ∠ABC","yhteinen kulma; samankohtaiset kulmat, DE ∥ BC; kaksi paria yhtä suuria kulmia"],["Vastinkärjet","A–A, D–B, E–C","yhtä suuret kulmat vastaavat toisiaan"],["Vastinsivut","AD ja AB, DE ja BC","A–A ja D–B antavat AD–AB, D–B ja E–C antavat DE–BC"],["Kokonainen sivu","AB = AD + DB = 6 cm + 9 cm = 15 cm","verrantoon tarvitaan ison kolmion sivu AB, ei osajanaa DB"],["Verranto","BC/DE = AB/AD eli x/4 = 15/6","ison kolmion sivut osoittajissa, pienen kolmion nimittäjissä"],["Ratkaisu","6x = 60, x = 10","BC = 10 cm"],["Tarkistus","15 : 6 = 2,5 ja 10 : 4 = 2,5","suhteet ovat samat, ja iso kolmio on suurempi"]]},{"tyyppi":"ansa","otsikko":"Ansa 2: yksi yhteinen kulma ei riitä","sisalto":"Kolmiossa ABC on 50°:n kulma, ja kolmiossa DEF on myös 50°:n kulma. Päätelmä \"molemmissa on 50°, siis kolmiot ovat yhdenmuotoiset\" on väärä. Yksi kulma jättää kaksi muuta vapaiksi: kolmion ABC muut kulmat voivat olla 60° ja 70° ja kolmion DEF muut kulmat 30° ja 100°, jolloin muodot ovat aivan erilaiset. Tarvitaan kaksi paria yhtä suuria kulmia. Kun tunnet kummastakin kolmiosta kaksi kulmaa, laske ensin kolmas kulma 180°:sta ja vertaa sitten kaikkia kolmea. Kulmat voivat olla eri järjestyksessä: kolmiot, joiden kulmat ovat 40°, 65° ja 75° sekä 75°, 40° ja 65°, ovat yhdenmuotoiset. Myös kuviossa, jossa DE ∥ BC, yhteinen kulma A on vasta ensimmäinen pari. Toinen pari tulee samankohtaisista kulmista, ja se pitää kirjoittaa perusteluun."},{"tyyppi":"ansa","otsikko":"Ansa 3: osajana kokonaisen sivun paikalla","sisalto":"Kolmion ABC sivulla AB on piste D ja sivulla AC piste E niin, että DE ∥ BC. AD = 4 cm, DB = 6 cm ja DE = 5 cm, ja kysytään BC:tä. Verranto AD/DB = DE/BC eli 4/6 = 5/x antaa x = 7,5 cm. Jana DB ei kuitenkaan ole kummankaan kolmion sivu: pienen kolmion sivut ovat AD, AE ja DE ja ison kolmion sivut AB, AC ja BC. Kun lasket sivun yhdenmuotoisista kolmioista, verrannossa saa olla vain näiden kolmioiden sivuja. Oikein on AB = 4 cm + 6 cm = 10 cm ja BC/5 = 10/4, josta BC = 12,5 cm. Väärä tulos 7,5 cm näyttää uskottavalta, koska se on suurempi kuin DE. Tarkista siksi aina, että verrannossa on kokonainen sivu AB eikä sen osa DB."},{"tyyppi":"ansa","otsikko":"Ansa 4: vastinsivut sijainnin mukaan eikä kulmien mukaan","sisalto":"Kolmion ABC sivulla AB on piste D ja sivulla AC piste E niin, että ∠ADE = ∠ACB. AB = 12 cm, AC = 9 cm ja AD = 6 cm, ja kysytään AE:tä. Koska D on sivulla AB, on houkuttelevaa parittaa AD sivun AB kanssa ja kirjoittaa AE/AC = AD/AB, josta AE = 4,5 cm. Tässä kuviossa pieni kolmio on kuitenkin käännetty. Vastinkärjet luetaan kulmista: kulma A on yhteinen ja ∠ADE = ∠ACB, joten D vastaa C:tä ja E vastaa B:tä. Siksi AD on sivun AC vastinsivu ja AE sivun AB vastinsivu. Oikea verranto on AE/AB = AD/AC eli x/12 = 6/9, josta AE = 8 cm. Kirjoita vastinkärjet aina ensin kulmista ja muodosta vastinsivut niistä, älä sen mukaan, millä sivulla piste on."}],"harjoitusryhmat":[{"id":"kulmat","nimi":"Kulmat perusteineen","info":"Kulman sijainti kerrotaan sanoin: vaakasuoran suoran ylä- tai alapuolella ja suoran t oikealla tai vasemmalla puolella. Kirjoita vihkoon jokaisen vaiheen perään peruste. Laskin on sallittu."},{"id":"yhdenmuotoisuus","nimi":"Yhdenmuotoisuus kulmista","info":"Kaksi paria yhtä suuria kulmia riittää. Laske tarvittaessa kolmas kulma 180°:sta ja lue vastinkärjet kulmista. Laskin on sallittu."},{"id":"verranto","nimi":"Sivu verrannolla","info":"Kirjoita vihkoon vastinkärjet, vastinsivut ja verranto. Käytä kolmioiden kokonaisia sivuja, älä osajanoja. Laskin on sallittu."}],"harjoitukset":[{"id":"H01","ryhma":"kulmat","kysymys":"Vaakasuorat suorat l ja m ovat yhdensuuntaiset. Suora t leikkaa suoran l pisteessä P ja suoran m pisteessä Q. Pisteen P kohdalla suoran l yläpuolella ja suoran t vasemmalla puolella oleva kulma on 71°. Kuinka suuri on pisteen Q kohdalla suoran m yläpuolella ja suoran t vasemmalla puolella oleva kulma? Anna vastaus asteina ilman astemerkkiä.","vastaus":71,"vinkki":"Vertaa kulmien asemaa: ovatko ne vaakasuoran suoran samalla puolella ja suoran t samalla puolella?","selitys":"Kulmat ovat samassa asemassa (yläpuolella ja vasemmalla), joten ne ovat samankohtaiset. Koska l ∥ m, ne ovat yhtä suuret: 71°."},{"id":"H02","ryhma":"kulmat","kysymys":"Vaakasuorat suorat l ja m ovat yhdensuuntaiset. Suora t leikkaa suoran l pisteessä P ja suoran m pisteessä Q. Pisteen P kohdalla suoran l alapuolella ja suoran t vasemmalla puolella oleva kulma on 58°. Kuinka suuri on pisteen Q kohdalla suoran m alapuolella ja suoran t oikealla puolella oleva kulma? Anna vastaus asteina ilman astemerkkiä.","vastaus":122,"vinkki":"Molemmat kulmat ovat vaakasuoran suoran alapuolella. Ovatko ne myös suoran t samalla puolella?","selitys":"Kulmat ovat kumpikin alapuolella, mutta suoran t eri puolilla, joten ne eivät ole samankohtaiset. Pisteen Q kohdalla suoran m alapuolella ja suoran t vasemmalla puolella oleva kulma on 58° (samankohtaiset kulmat, l ∥ m). Kysytty kulma on sen vieruskulma: 180° − 58° = 122° (vieruskulmat)."},{"id":"H03","ryhma":"kulmat","kysymys":"Vaakasuorat suorat l ja m ovat yhdensuuntaiset. Suora t leikkaa suoran l pisteessä P ja suoran m pisteessä Q. Pisteen P kohdalla suoran l yläpuolella ja suoran t vasemmalla puolella oleva kulma on 52°. Kuinka suuri on pisteen Q kohdalla suoran m alapuolella ja suoran t oikealla puolella oleva kulma? Anna vastaus asteina ilman astemerkkiä.","vastaus":52,"vinkki":"Kysytty kulma on eri asemassa kummankin suoran suhteen. Käytä kahta perustetta.","selitys":"Pisteen Q kohdalla suoran m yläpuolella ja suoran t vasemmalla puolella oleva kulma on 52° (samankohtaiset kulmat, l ∥ m). Kysytty kulma on sen ristikulma, joten se on myös 52° (ristikulmat)."},{"id":"H04","ryhma":"kulmat","kysymys":"Vaakasuorat suorat l ja m ovat yhdensuuntaiset. Suora t leikkaa suoran l pisteessä P ja suoran m pisteessä Q. Pisteen P kohdalla suoran l yläpuolella ja suoran t oikealla puolella oleva kulma on 73°. Eetu laski kuvion muita kulmia näin:\n1) Pisteen P kohdalla suoran l alapuolella ja suoran t oikealla puolella oleva kulma on 107°, koska se ja annettu kulma ovat vieruskulmat.\n2) Pisteen P kohdalla suoran l alapuolella ja suoran t vasemmalla puolella oleva kulma on 73°, koska se ja annettu kulma ovat ristikulmat.\n3) Pisteen Q kohdalla suoran m alapuolella ja suoran t vasemmalla puolella oleva kulma on 73°, koska se ja vaiheen 2 kulma ovat ristikulmat.\n4) Pisteen Q kohdalla suoran m yläpuolella ja suoran t vasemmalla puolella oleva kulma on 107°, koska se ja vaiheen 3 kulma ovat vieruskulmat.\n\nMonennessako vaiheessa on virheellinen peruste?","vastaus":3,"vinkki":"Ovatko vaiheen kulma ja kulma, johon se vedotaan, samassa pisteessä vai eri pisteissä?","selitys":"Vaiheessa 3 pisteen Q kulma verrataan pisteen P kulmaan. Ristikulmat ovat aina saman leikkauspisteen kulmia. Kulmat ovat samassa asemassa eri pisteissä, joten oikea peruste on samankohtaiset kulmat (l ∥ m). Muut perusteet ovat oikein."},{"id":"H05","ryhma":"kulmat","kysymys":"Viisikulmion ABCDE kulmat A, B ja C ovat 108°, 96° ja 130°. Kun sivua ED jatketaan kärjen D yli, jatkeen ja sivun CD väliin syntyy kulman D vieruskulma, joka on 75°. Kuinka suuri on kulma E? Anna vastaus asteina ilman astemerkkiä.","vastaus":101,"vinkki":"Laske ensin kulma D vieruskulmasta ja sitten viisikulmion kulmien summa.","selitys":"Kulma D = 180° − 75° = 105° (vieruskulmat). Viisikulmion kulmien summa on (5 − 2) · 180° = 540°, joten kulma E = 540° − 108° − 96° − 130° − 105° = 101° (monikulmion kulmien summa)."},{"id":"H06","ryhma":"kulmat","kysymys":"Pisteet A, B ja C ovat ympyrän kehällä, ja O on ympyrän keskipiste. Piste C on pidemmällä kaarella AB. Kovera keskuskulma AOB on 128° ja kulma ABC on 49°. Kuinka suuri on kulma BAC? Anna vastaus asteina ilman astemerkkiä.","vastaus":67,"vinkki":"Kulma ACB on kehäkulma. Onko se puolet vai kaksi kertaa keskuskulma?","selitys":"Kehäkulma ACB = 128° : 2 = 64° (kehäkulma on puolet keskuskulmasta). Kulma BAC = 180° − 64° − 49° = 67° (kolmion kulmien summa 180°)."},{"id":"H07","ryhma":"kulmat","kysymys":"Kolmiossa ABC kulma A on 48° ja kulma C on 64°. Sivulla AB on piste D ja sivulla AC piste E niin, että DE ∥ BC. Kuinka suuri on kulma ADE? Anna vastaus asteina ilman astemerkkiä.","vastaus":68,"vinkki":"Mikä kolmion ABC kulma on kulman ADE samankohtainen kulma?","selitys":"Kulma ABC = 180° − 48° − 64° = 68° (kolmion kulmien summa 180°). Suora AB leikkaa yhdensuuntaiset suorat DE ja BC, joten ∠ADE = ∠ABC = 68° (samankohtaiset kulmat, DE ∥ BC)."},{"id":"H08","ryhma":"yhdenmuotoisuus","kysymys":"Kolmiossa ABC ∠A = 40° ja ∠B = 75°. Kolmiossa DEF ∠D = 65° ja ∠E = 40°. Kolmiot ovat yhdenmuotoiset.\n\nMikä kolmion ABC kulma vastaa kulmaa F?","vastaus":1,"vinkki":"Laske kolmion ABC kolmas kulma. Yhtä suuret kulmat vastaavat toisiaan.","selitys":"∠C = 180° − 40° − 75° = 65°. Siis C vastaa D:tä (65°) ja A vastaa E:tä (40°), joten F vastaa B:tä, ja ∠F = 75°. Aakkosjärjestys (F ja C) ei ratkaise.","tyyppi":"monivalinta","vaihtoehdot":["kulma A","kulma B","kulma C"]},{"id":"H09","ryhma":"yhdenmuotoisuus","kysymys":"Kustakin kolmiosta tunnetaan kaksi kulmaa. Puolipisteen edellä ovat ensimmäisen kolmion kulmat ja sen jälkeen toisen kolmion kulmat.\nPari 1: 35° ja 80°; 80° ja 65°\nPari 2: 60° ja 40°; 60° ja 70°\nPari 3: 55° ja 45°; 45° ja 85°\nPari 4: 72° ja 51°; 51° ja 72°\n\nMontako kolmioparista on varmasti yhdenmuotoisia?","vastaus":2,"vinkki":"Laske jokaisesta kolmiosta kolmas kulma ja vertaa kaikkia kolmea kulmaa.","selitys":"Pari 1: kulmat 35°, 80°, 65° ja 80°, 65°, 35°, yhdenmuotoiset. Pari 2: 60°, 40°, 80° ja 60°, 70°, 50°, vain yksi yhteinen kulma, eivät ole. Pari 3: 55°, 45°, 80° ja 45°, 85°, 50°, eivät ole. Pari 4: samat kulmat eri järjestyksessä, yhdenmuotoiset. Yhteensä 2."},{"id":"H10","ryhma":"yhdenmuotoisuus","kysymys":"Kolmion ABC sivulla AB on piste D ja sivulla AC piste E niin, että DE ∥ BC.\n\nMikä perustelu osoittaa, että kolmiot ADE ja ABC ovat yhdenmuotoiset?","vastaus":1,"vinkki":"Montako paria yhtä suuria kulmia tarvitaan? Mikä tieto antaa toisen parin?","selitys":"Tarvitaan kaksi paria yhtä suuria kulmia. Kulma A on yhteinen, ja suora AB leikkaa yhdensuuntaiset suorat DE ja BC, joten ∠ADE = ∠ABC samankohtaisina kulmina. Yksi yhteinen kulma ei riitä, ja ristikulmat ovat saman leikkauspisteen kulmia.","tyyppi":"monivalinta","vaihtoehdot":["Kulma A on molempien kolmioiden kulma, ja yksi yhteinen kulma riittää.","Kulma A on yhteinen, ja ∠ADE = ∠ABC samankohtaisina kulmina, koska DE ∥ BC.","∠ADE = ∠ABC, koska ne ovat ristikulmia."]},{"id":"H11","ryhma":"yhdenmuotoisuus","kysymys":"Kolmion ABC sivulla AB on piste D ja sivulla AC piste E niin, että ∠ADE = ∠ACB. Kolmiossa ADE ja kolmiossa ABC on siis kaksi paria yhtä suuria kulmia.\n\nMikä kolmion ABC sivu on sivun AD vastinsivu?","vastaus":1,"vinkki":"Mitkä kärjet vastaavat toisiaan? Lue ne kulmista, älä siitä, millä sivulla D on.","selitys":"Kulma A vastaa kulmaa A, ja ∠ADE = ∠ACB, joten D vastaa C:tä. Sivun AD vastinsivu on siis AC. Sivu AB on sivun AE vastinsivu.","tyyppi":"monivalinta","vaihtoehdot":["AB","AC","BC"]},{"id":"H12","ryhma":"yhdenmuotoisuus","kysymys":"Lue väitteet.\n1) Jos kahdessa kolmiossa on kaksi paria yhtä suuria kulmia, kolmiot ovat yhdenmuotoiset.\n2) Kaksi suorakulmaista kolmiota ovat aina yhdenmuotoiset.\n3) Jos kahden tasakylkisen kolmion huippukulmat ovat yhtä suuret, kolmiot ovat yhdenmuotoiset.\n4) Jos kahdessa kolmiossa on yksi yhtä suuri kulma, kolmiot ovat yhdenmuotoiset.\n5) Jos kahdessa suorakulmaisessa kolmiossa on yhtä suuri terävä kulma, kolmiot ovat yhdenmuotoiset.\n\nMontako väitteistä on tosi?","vastaus":3,"vinkki":"Etsi jokaiselle väitteelle vastaesimerkki. Jos sellaista ei löydy, väite on tosi.","selitys":"Tosia ovat 1, 3 ja 5. Väitteessä 3 kantakulmat ovat (180° − huippukulma) : 2, joten kaikki kulmat ovat samat. Väitteessä 5 suorat kulmat ja terävät kulmat ovat kaksi paria. Väite 2 on epätosi (terävät kulmat 30° ja 60° tai 45° ja 45°), samoin väite 4 (kulmat 50°, 60°, 70° ja 50°, 30°, 100°)."},{"id":"H13","ryhma":"yhdenmuotoisuus","kysymys":"Kolmion ABC kulma C on suora, ja CH on kolmion korkeusjana sivulle AB, eli piste H on sivulla AB ja CH on kohtisuorassa sivua AB vastaan. Kulma A on 35°. Kuinka suuri on kulma BCH? Anna vastaus asteina ilman astemerkkiä.","vastaus":35,"vinkki":"Laske ensin kulma B. Kolmio BCH on suorakulmainen.","selitys":"Kulma B = 180° − 90° − 35° = 55° (kolmion kulmien summa). Kolmiossa BCH kulma H on suora, joten ∠BCH = 180° − 90° − 55° = 35°. Kolmiot ABC ja CBH ovat yhdenmuotoiset, koska niissä on suora kulma ja yhteinen kulma B."},{"id":"H14","ryhma":"verranto","kysymys":"Kolmion ABC sivulla AB on piste D ja sivulla AC piste E niin, että DE ∥ BC. AD = 6 cm, AB = 16 cm ja AC = 12 cm. Kuinka pitkä on AE? Anna vastaus senttimetreinä ilman yksikköä.","vastaus":4.5,"vinkki":"AE on pienen kolmion sivu. Mikä ison kolmion sivu on sen vastinsivu?","selitys":"Kolmiot ADE ja ABC ovat yhdenmuotoiset (kulma A yhteinen, ∠ADE = ∠ABC samankohtaisina kulmina). AE/AC = AD/AB eli x/12 = 6/16, josta 16x = 72 ja x = 4,5."},{"id":"H15","ryhma":"verranto","kysymys":"Kolmion ABC sivulla AB on piste D ja sivulla AC piste E niin, että DE ∥ BC. AD = 5 cm, DB = 2 cm ja DE = 7,5 cm. Kuinka pitkä on BC? Anna vastaus senttimetreinä ilman yksikköä.","vastaus":10.5,"vinkki":"Verrantoon tarvitaan ison kolmion kokonainen sivu AB, ei osajanaa DB.","selitys":"AB = 5 cm + 2 cm = 7 cm. BC/DE = AB/AD eli x/7,5 = 7/5, josta 5x = 52,5 ja x = 10,5. Osajanalla DB saisit väärin 3."},{"id":"H16","ryhma":"verranto","kysymys":"Kolmion ABC sivulla AB on piste D ja sivulla AC piste E niin, että DE ∥ BC. AB = 12 cm, BC = 15 cm ja DE = 10 cm. Kuinka pitkä on DB? Anna vastaus senttimetreinä ilman yksikköä.","vastaus":4,"vinkki":"Laske ensin AD verrannolla. DB on sivun AB loppuosa.","selitys":"AD/AB = DE/BC eli x/12 = 10/15, josta x = 8. DB = AB − AD = 12 cm − 8 cm = 4 cm."},{"id":"H17","ryhma":"verranto","kysymys":"Kolmion ABC sivulla AB on piste D ja sivulla AC piste E niin, että ∠AED = ∠ABC. AB = 10 cm, AC = 8 cm ja AE = 5 cm. Kuinka pitkä on AD? Anna vastaus senttimetreinä ilman yksikköä.","vastaus":4,"vinkki":"Lue vastinkärjet kulmista: mitä kärkeä E vastaa? Entä D?","selitys":"Kulma A on yhteinen ja ∠AED = ∠ABC, joten E vastaa B:tä ja D vastaa C:tä. AD on sivun AC vastinsivu ja AE sivun AB vastinsivu: AD/AC = AE/AB eli x/8 = 5/10, josta x = 4. Parittamalla AD sivun AB kanssa saisit väärin 6,25."},{"id":"H18","ryhma":"verranto","kysymys":"Pystysuora 2,0 m pitkä keppi luo vaakasuoralle maalle 1,6 m pitkän varjon. Samaan aikaan pystysuoran puun varjo on 9,2 m. Keppi ja puu ovat kohtisuorassa maata vastaan, ja auringonsäteet osuvat maahan samassa kulmassa. Kuinka korkea puu on? Anna vastaus metreinä ilman yksikköä.","vastaus":11.5,"vinkki":"Kepistä ja varjosta syntyy suorakulmainen kolmio, samoin puusta ja varjosta. Mitkä kulmat ovat yhtä suuret?","selitys":"Kolmioissa on suora kulma ja yhtä suuri säteiden kulma, joten ne ovat yhdenmuotoiset. Korkeus/varjo on sama: x/9,2 = 2,0/1,6, josta 1,6x = 18,4 ja x = 11,5."},{"id":"H19","ryhma":"verranto","kysymys":"Kolmion ABC sivulla AB on piste D ja sivulla AC piste E niin, että DE ∥ BC. AD = 8 cm, DB = 2 cm ja DE = 6 cm. Mira laski BC:n näin:\n1) Kulma A on kolmioiden ADE ja ABC yhteinen kulma.\n2) ∠ADE = ∠ABC, koska ne ovat samankohtaiset kulmat (DE ∥ BC).\n3) Verranto: AD/DB = DE/BC eli 8/2 = 6/x.\n4) 8x = 12, joten x = 1,5.\n\nMonennessako vaiheessa on ensimmäinen virhe?","vastaus":3,"vinkki":"Ovatko verrannon kaikki janat kolmioiden ADE ja ABC sivuja?","selitys":"Vaiheet 1 ja 2 ovat oikein. Vaiheessa 3 on osajana DB, joka ei ole kummankaan kolmion sivu. Oikein: AB = 10 cm ja BC/6 = 10/8, josta BC = 7,5 cm. Miran tulos 1,5 cm on pienempi kuin DE, vaikka BC on ison kolmion sivu."},{"id":"H20","ryhma":"verranto","kysymys":"Kolmioissa ABC ja DEF kulmat A ja F ovat suoria ja ∠B = ∠D. AB = 4 cm, AC = 6 cm ja DF = 10 cm. Kuinka pitkä on EF? Anna vastaus senttimetreinä ilman yksikköä.","vastaus":15,"vinkki":"Suorat kulmat vastaavat toisiaan, samoin yhtä suuret terävät kulmat. Mikä kärki vastaa kärkeä C?","selitys":"A vastaa F:ää, B vastaa D:tä ja C vastaa E:tä. AB on sivun FD vastinsivu ja AC sivun FE vastinsivu. EF/AC = DF/AB eli x/6 = 10/4, josta x = 15."}],"valmis_teksti":"Osaat laskea kuviosta tuntemattomia kulmia vierus-, risti- ja samankohtaisten kulmien, monikulmion kulmien summan sekä kehä- ja keskuskulman avulla ja kirjoitat jokaisen vaiheen perään, mihin tietoon se perustuu. Perustelet kahden kolmion yhdenmuotoisuuden kahdella yhtä suurten kulmien parilla, luet vastinsivut yhtä suurista kulmista ja lasket tuntemattoman sivun verrannolla, jossa ovat kolmioiden kokonaiset vastinsivut oikeassa järjestyksessä. Tämä taito on nyt näytetty."};

const svg=document.getElementById("nlsvg"), rng=document.getElementById("nlrange"), out=document.getElementById("nlout");
const X0=34, X1=606, Y=62;
function piirraNL(v){
  const ala=Math.floor(v/10)*10, yla=ala+10, puoli=ala+5;
  const pyor = (v%10)>=5 ? yla : ala;
  const x = n => X0 + (n/100)*(X1-X0);
  let s=`<line class="rail" x1="${X0}" y1="${Y}" x2="${X1}" y2="${Y}"/>`;
  for(let n=0;n<=100;n+=10){
    const near = (n===ala||n===yla);
    s+=`<line class="tick" x1="${x(n)}" y1="${Y-7}" x2="${x(n)}" y2="${Y+7}"/>`;
    s+=`<text class="stop${near?" near":""}" x="${x(n)}" y="${Y+24}" text-anchor="middle">${n}</text>`;
  }
  s+=`<line class="halfway" x1="${x(puoli)}" y1="${Y-16}" x2="${x(puoli)}" y2="${Y+12}"/>`;
  s+=`<text class="stop" x="${x(puoli)}" y="${Y-22}" text-anchor="middle">puoliväli ${puoli}</text>`;
  s+=`<circle class="dot" cx="${x(v)}" cy="${Y}" r="6"/>`;
  s+=`<text class="val" x="${x(v)}" y="${Y-32}" text-anchor="middle">${v}</text>`;
  s+=`<path d="M ${x(v)} ${Y+38} L ${x(pyor)} ${Y+38}" stroke="var(--core)" stroke-width="2" fill="none"/>`;
  s+=`<path d="M ${x(pyor)} ${Y+38} l ${x(pyor)>x(v)?-7:7} -4 l 0 8 z" fill="var(--core)"/>`;
  svg.innerHTML=s;
  out.textContent = `${v} pyöristyy → ${pyor}`;
}

const ljExp=document.getElementById("ljExp");
if(ljExp && D.kokeilu){
  let ljI=0, ljTokens=[], ljStep=0;
  const laske=(a,op,b)=>{a=+a;b=+b;return op==="×"?a*b:op==="÷"?a/b:op==="+"?a+b:a-b;};
  function ljAlku(){
    const l=D.kokeilu[ljI];
    ljTokens=l.lauseke.replace(/\(/g,"( ").replace(/\)/g," )").split(/\s+/).filter(Boolean);
    ljStep=0; ljPiirra(); ljViesti("","");
  }
  function ljViesti(t,lk){const f=document.getElementById("ljFb"); f.textContent=t; f.className="lj-fb "+(lk||"");}
  function ljPiirra(){
    const l=D.kokeilu[ljI];
    document.getElementById("ljStep").textContent =
      ljStep>=l.askeleet.length ? "valmis" : `askel ${ljStep+1} / ${l.askeleet.length}`;
    if(ljStep>=l.askeleet.length){
      ljExp.innerHTML=`<span class="valmis">${l.lauseke} = ${l.vastaus}</span>`;
      return;
    }
    ljExp.innerHTML=ljTokens.map((t,i)=>
      "×÷+−".includes(t) ? `<button type="button" class="op" data-i="${i}">${t}</button>`
                         : `<span class="tok">${t}</span>`).join("");
    ljExp.querySelectorAll("button.op").forEach(b=>b.addEventListener("click",()=>ljKlikkaa(+b.dataset.i)));
  }
  function ljKlikkaa(i){
    const l=D.kokeilu[ljI], odotettu=l.askeleet[ljStep];
    const ehdotus=[ljTokens[i-1],ljTokens[i],ljTokens[i+1]].join(" ");
    if(ehdotus!==odotettu){
      ljViesti(ljStep===0
        ? "Ei vielä. Sulkeet ovat vahvimmat, sitten kerto ja jako. Yhtä vahvat vasemmalta oikealle."
        : "Ei vielä. Kumpi jäljellä olevista on vahvempi?", "no");
      return;
    }
    const arvo=laske(ljTokens[i-1],ljTokens[i],ljTokens[i+1]);
    let alku=i-1, loppu=i+1;
    if(ljTokens[i-2]==="(" && ljTokens[i+2]===")"){ alku=i-2; loppu=i+2; }
    ljTokens.splice(alku, loppu-alku+1, String(arvo));
    ljStep++;
    ljViesti(ljStep>=l.askeleet.length ? "Valmis. Vastaus on "+l.vastaus+"." : "Oikein. Jatka seuraavaan.", "ok");
    ljPiirra();
  }
  document.getElementById("ljSeuraava").addEventListener("click",()=>{
    ljI=(ljI+1)%D.kokeilu.length; ljAlku();
  });
  ljAlku();
}

/* Suomalainen lukumuoto: välilyönti on tuhaterotin, pilkku desimaalierotin.
   Piste voi olla kumpi tahansa. Se tulkitaan tuhaterottimeksi VAIN silloin, kun
   koko luku on aitoa tuhaterotinmuotoa: alkuosa 1–3 numeroa ilman etunollaa ja
   jokainen jatko-osa täsmälleen 3 numeroa (1.500, 12.345.678). Kaikissa muissa
   tapauksissa piste on desimaalipiste — myös 0.125, joka vanhalla säännöllä
   ("3 numeroa pisteen jäljessä = tuhaterotin") luettiin virheellisesti luvuksi 125. */
const TUHATEROTIN = /^[1-9]\d{0,2}(\.\d{3})+$/;
function lueLuku(teksti){
  // Murtoluku (3/4, -3/4) ja sekaluku (1 2/3, -1 2/3) hyväksytään sellaisinaan.
  const raaka = String(teksti).replace(/\u00a0/g, " ").trim();
  let m = raaka.match(/^(-?)(\d+)\s+(\d+)\s*\/\s*(\d+)$/);
  if(m){ const nim = Number(m[4]); if(nim === 0) return null;
    const v = Number(m[2]) + Number(m[3]) / nim; return m[1] ? -v : v; }
  m = raaka.match(/^(-?)\s*(\d+)\s*\/\s*(\d+)$/);
  if(m){ const nim = Number(m[3]); if(nim === 0) return null;
    const v = Number(m[2]) / nim; return m[1] ? -v : v; }
  let s = String(teksti).replace(/[\s\u00a0]/g, "");
  if(s === "") return null;
  if(s.indexOf(",") >= 0){
    s = s.replace(/\./g, "").replace(",", ".");
  } else if(TUHATEROTIN.test(s)){
    s = s.replace(/\./g, "");
  }
  const n = Number(s);
  return Number.isFinite(n) ? n : null;
}

function tarkista(id){
  const h=D.harjoitukset.find(x=>x.id===id);
  const kentta=document.getElementById("in-"+id);
  const fb=document.getElementById("fb-"+id);
  if(kentta.value.trim()===""){ fb.className="fb hint"; fb.textContent="Kirjoita vastaus ensin."; return; }
  const luku=lueLuku(kentta.value);
  if(luku===null){ fb.className="fb no"; fb.textContent="Vastauksen pitää olla luku tai murtoluku (esimerkiksi 3/4)."; return; }
  const oikein = Math.abs(luku - h.vastaus) < 1e-9;
  merkitseTulos(id, oikein, oikein ? "Oikein. "+h.selitys : `Ei vielä. ${h.vinkki} Kokeile uudelleen.`);
}

function tarkistaMonivalinta(id, valittuIndeksi, painike){

  const rivi=painike.closest(".row");
  rivi.querySelectorAll(".mv-valinta").forEach(b=>b.disabled=true);
  const oikein = valittuIndeksi===h.vastaus;

    const oikeaBtn=rivi.querySelector(`[data-i="${h.vastaus}"]`);
    if(oikeaBtn) oikeaBtn.classList.add("mv-oikein");
  }
  merkitseTulos(id, oikein, oikein ? "Oikein. "+h.selitys : `Ei ihan. Oikea vastaus on korostettu. ${h.selitys||""}`);
}

/* Kuuntelu: selain lukee tekstin ääneen omalla puhesynteesillään (englanniksi, jos laitteessa on
   englanninkielinen ääni). Ei äänitiedostoja eikä verkkoyhteyttä. Jos laite ei osaa puhua,
   teksti näytetään luettavaksi — silloin tehtävä muuttuu luetun ymmärtämiseksi, mutta ei katkea. */
function puhu(id, nopeus){
  const h=D.harjoitukset.find(x=>x.id===id); if(!h || !h.kuuntele) return;
  const vara=document.getElementById("vara-"+id);
  const naytaTeksti=syy=>{ vara.hidden=false; vara.textContent=syy+" Teksti: "+h.kuuntele; };
  if(!("speechSynthesis" in window)){ naytaTeksti("Tämä laite ei osaa lukea ääneen."); return; }
  const s=window.speechSynthesis; s.cancel();
  const u=new SpeechSynthesisUtterance(h.kuuntele);
  u.lang=h.kieli||"en-GB"; u.rate=nopeus;
  const aanet=s.getVoices(), kieli=u.lang.slice(0,2);
  const aani=aanet.find(a=>a.lang===u.lang) || aanet.find(a=>a.lang && a.lang.startsWith(kieli));
  if(aani) u.voice=aani;
  else if(aanet.length) { naytaTeksti("Laitteessa ei ole englanninkielistä ääntä."); return; }
  u.onerror=()=>naytaTeksti("Ääneen lukeminen ei onnistunut.");
  s.speak(u);
}

document.getElementById("harjoitukset").addEventListener("click",e=>{
  const k=e.target.closest("[data-kuuntele]"), hk=e.target.closest("[data-hitaasti]");
  if(k) puhu(k.dataset.kuuntele, 0.9);
  if(hk) puhu(hk.dataset.hitaasti, 0.6);
  const t=e.target.closest("[data-tarkista]"), v=e.target.closest("[data-vinkki]"), mv=e.target.closest("[data-mv]");
  if(t) tarkista(t.dataset.tarkista);
  if(mv) tarkistaMonivalinta(mv.dataset.mv, Number(mv.dataset.i), mv);
  if(v){
    const h=D.harjoitukset.find(x=>x.id===v.dataset.vinkki);
    const fb=document.getElementById("fb-"+h.id);
    fb.className="fb hint"; fb.textContent=h.vinkki;
  }
});
document.getElementById("harjoitukset").addEventListener("keydown",e=>{
  if(e.key==="Enter" && e.target.id.startsWith("in-")){ e.preventDefault(); tarkista(e.target.id.slice(3)); }
});
