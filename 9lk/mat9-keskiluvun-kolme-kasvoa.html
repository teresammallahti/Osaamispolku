<title>Keskiluvun kolme kasvoa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">

<style>
:root{
  --paper:#EFF2F5; --surface:#FFFFFF; --surface-2:#F7F9FB;
  --grid:#DCE3EA; --line:#C9D3DC;
  --ink:#15222C; --ink-2:#4E626F; --ink-3:#7E8F9B;
  --core:#1B5A9E; --core-soft:#E4EDF6;
  --strong:#1F6E5C; --strong-soft:#E1F0EB;
  --chal:#9A6A16; --chal-soft:#F6EDDC;
  --alert:#A33A2B; --alert-soft:#F8E7E3;
  --shadow:0 1px 2px rgba(21,34,44,.06), 0 8px 24px -12px rgba(21,34,44,.18);
  --r:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0F161B; --surface:#18222A; --surface-2:#1D2830;
    --grid:#22303A; --line:#2E3E4A;
    --ink:#E8EFF4; --ink-2:#A3B4C0; --ink-3:#7A8B97;
    --core:#7FB2E4; --core-soft:#16303F;
    --strong:#77CDB4; --strong-soft:#123028;
    --chal:#E0B267; --chal-soft:#33270F;
    --alert:#E8907F; --alert-soft:#3A1E19;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -14px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --paper:#0F161B; --surface:#18222A; --surface-2:#1D2830;
  --grid:#22303A; --line:#2E3E4A;
  --ink:#E8EFF4; --ink-2:#A3B4C0; --ink-3:#7A8B97;
  --core:#7FB2E4; --core-soft:#16303F;
  --strong:#77CDB4; --strong-soft:#123028;
  --chal:#E0B267; --chal-soft:#33270F;
  --alert:#E8907F; --alert-soft:#3A1E19;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -14px rgba(0,0,0,.7);
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:16px; line-height:1.62;
  background-image:
    linear-gradient(to right, var(--grid) 1px, transparent 1px),
    linear-gradient(to bottom, var(--grid) 1px, transparent 1px);
  background-size:26px 26px;
}
.wrap{max-width:760px; margin:0 auto; padding:28px 20px 90px}
h1,h2,h3,h4{font-family:"Familjen Grotesk","IBM Plex Sans",system-ui,sans-serif; text-wrap:balance}

/* header */
header.top{background:var(--surface); border:1px solid var(--line); border-radius:var(--r);
  box-shadow:var(--shadow); padding:22px 24px; display:flex; gap:18px; align-items:flex-start}
.badge{flex:0 0 auto; width:54px; height:54px; border-radius:9px; display:grid; place-items:center;
  background:var(--core-soft); border:1px solid var(--core); color:var(--core)}
.badge svg{width:28px; height:28px; fill:none; stroke:currentColor; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round}
.eyebrow{font-family:"IBM Plex Mono",monospace; font-size:11px; letter-spacing:.14em;
  text-transform:uppercase; color:var(--ink-3); margin:0 0 5px}
header.top h1{margin:0; font-size:30px; font-weight:700; letter-spacing:-.015em}
header.top p{margin:5px 0 0; color:var(--ink-2); font-size:15px}
.tags{display:flex; flex-wrap:wrap; gap:5px; margin-top:11px}
.tag{font-family:"IBM Plex Mono",monospace; font-size:10.5px; letter-spacing:.05em; padding:2px 7px;
  border-radius:4px; background:var(--surface-2); border:1px solid var(--line); color:var(--ink-3)}
.tag.core{background:var(--core-soft); border-color:var(--core); color:var(--core)}

/* teksti */
article{margin-top:26px}
article h2{font-size:21px; font-weight:600; margin:32px 0 10px; letter-spacing:-.01em}
article p{margin:0 0 14px; max-width:64ch}
.lead{font-size:17.5px; color:var(--ink); border-left:3px solid var(--core); padding-left:16px; margin:0 0 8px}

.box{background:var(--surface); border:1px solid var(--line); border-radius:var(--r);
  padding:18px 22px; box-shadow:var(--shadow); margin:22px 0}
.box h3{margin:0 0 12px; font-size:16.5px; font-weight:600}
.box.warn{border-left:3px solid var(--alert)}
.box.note{border-left:3px solid var(--chal)}

ol.steps{margin:0; padding-left:0; list-style:none; counter-reset:s; display:grid; gap:12px}
ol.steps li{counter-increment:s; display:grid; grid-template-columns:auto 1fr; gap:13px; align-items:start}
ol.steps li::before{content:counter(s); font-family:"Familjen Grotesk",sans-serif; font-weight:700; font-size:14px;
  width:26px; height:26px; border-radius:50%; background:var(--core); color:#fff; display:grid; place-items:center; margin-top:2px}

ul.notes{margin:0; padding-left:19px}
ul.notes li{margin-bottom:7px}
ul.notes li:last-child{margin-bottom:0}

.tablewrap{overflow-x:auto}
table{border-collapse:collapse; width:100%; font-size:14.5px; min-width:460px}
th,td{text-align:left; padding:9px 13px; border-bottom:1px solid var(--line)}
th{font-family:"IBM Plex Mono",monospace; font-size:10.5px; letter-spacing:.1em; text-transform:uppercase;
  color:var(--ink-3); font-weight:400; background:var(--surface-2)}
tr:last-child td{border-bottom:0}
td b{color:var(--core); font-weight:600}
td:last-child{font-variant-numeric:tabular-nums; font-weight:600}

/* lukusuora */
.nl svg{width:100%; height:118px; display:block}
.nl .rail{stroke:var(--line); stroke-width:2}
.nl .tick{stroke:var(--line); stroke-width:1.5}
.nl .stop{fill:var(--ink-3); font-family:"IBM Plex Mono",monospace; font-size:11px}
.nl .stop.near{fill:var(--core); font-weight:600}
.nl .dot{fill:var(--chal)}
.nl .val{fill:var(--ink); font-family:"Familjen Grotesk",sans-serif; font-size:15px; font-weight:700}
.nl .halfway{stroke:var(--chal); stroke-dasharray:3 3; stroke-width:1.5}
.nl-controls{display:flex; align-items:center; gap:14px; margin-top:6px}
.nl-controls input{flex:1; accent-color:var(--core)}
.nl-out{font-family:"Familjen Grotesk",sans-serif; font-size:15px; font-weight:600; min-width:12.5em; text-align:right}

/* paikka-arvotaulu */
.box .ohje{margin:0 0 14px; font-size:14.5px; color:var(--ink-2)}
.nt-valinta{display:flex; flex-wrap:wrap; gap:7px; margin-bottom:16px}
.nt-valinta button{font:inherit; font-size:12.5px; font-family:"IBM Plex Mono",monospace; padding:5px 11px;
  border-radius:6px; border:1px solid var(--line); background:var(--surface-2); color:var(--ink-2); cursor:pointer}
.nt-valinta button[aria-pressed="true"]{background:var(--ink); color:var(--paper); border-color:var(--ink)}
.nt-valinta button:focus-visible{outline:2px solid var(--core); outline-offset:2px}
.nt-taulu{display:flex; flex-direction:column; gap:4px; align-items:flex-start; overflow-x:auto; padding-bottom:4px}
.nt-rivi{display:flex; gap:6px; align-items:center}
.nt-rivi .otsa{font-family:"IBM Plex Mono",monospace; font-size:9.5px; letter-spacing:.08em;
  text-transform:uppercase; color:var(--ink-3); width:52px; text-align:center}
.nt-ruutu{width:52px; height:52px; display:grid; place-items:center; border:1.5px solid var(--line);
  border-radius:7px; background:var(--surface-2); font-family:"IBM Plex Mono",monospace; font-size:24px}
.nt-ruutu.kohta{border-color:var(--core); background:var(--core-soft); color:var(--core); font-weight:500}
.nt-ruutu.ratkaiseva{border-color:var(--chal); background:var(--chal-soft); color:var(--chal); font-weight:500}
.nt-ruutu.nolla{color:var(--ink-3)}
.nt-rivi .nimi{font-size:12.5px; color:var(--ink-3); margin-left:12px; white-space:nowrap}
.nt-nuoli{font-size:17px; color:var(--chal); margin-left:6px}
.nt-selite{margin:14px 0 0; font-size:14.5px}
.nt-selite b{color:var(--core)}

/* vahvuusportaat */
.vp-tasot{display:grid; gap:9px; margin-bottom:18px}
.vp-taso{display:flex; gap:11px; align-items:flex-start; font-size:13.5px}
.vp-taso .vp-pallo{width:13px; height:13px; border-radius:4px; margin-top:5px; flex:0 0 auto}
.vp-taso[data-taso="sulkeet"] .vp-pallo{background:var(--core)}
.vp-taso[data-taso="kertojako"] .vp-pallo{background:var(--strong)}
.vp-taso[data-taso="yhteenvahennys"] .vp-pallo{background:var(--chal)}
.vp-taso strong{display:block; font-family:"Familjen Grotesk",sans-serif; font-weight:600; font-size:14.5px}
.vp-taso span{color:var(--ink-2)}
.vp-lauseke{display:flex; flex-wrap:wrap; gap:7px; align-items:flex-end; font-family:"IBM Plex Mono",monospace;
  font-size:25px; padding:10px 2px; min-height:64px}
.vp-lauseke .t{padding:2px 3px}
.vp-lauseke .op{position:relative; padding:2px 9px; border-radius:6px; font-weight:500}
.vp-lauseke .op[data-taso="sulkeet"]{background:var(--core-soft); color:var(--core)}
.vp-lauseke .op[data-taso="kertojako"]{background:var(--strong-soft); color:var(--strong)}
.vp-lauseke .op[data-taso="yhteenvahennys"]{background:var(--chal-soft); color:var(--chal)}
.vp-lauseke .op i{position:absolute; top:-9px; right:-6px; font-style:normal; font-family:"Familjen Grotesk",sans-serif;
  font-size:11px; font-weight:700; width:18px; height:18px; border-radius:50%; display:grid; place-items:center;
  background:currentColor}
.vp-lauseke .op i span{color:var(--surface)}
.vp-rivi{display:flex; align-items:center; gap:16px; margin-top:8px}
.vp-vastaus{font-family:"Familjen Grotesk",sans-serif; font-size:16px; font-weight:600; color:var(--strong)}

/* laskujärjestys-widget */
.lj-exp{display:flex; flex-wrap:wrap; gap:7px; align-items:center; font-family:"IBM Plex Mono",monospace;
  font-size:23px; padding:14px 4px; min-height:62px}
.lj-exp .tok{padding:2px 4px; color:var(--ink)}
.lj-exp button.op{font-family:"IBM Plex Mono",monospace; font-size:23px; padding:3px 12px; border-radius:7px;
  border:1.5px solid var(--line); background:var(--surface-2); color:var(--ink); line-height:1.2}
.lj-exp button.op:hover{border-color:var(--core); color:var(--core)}
.lj-exp button.op:focus-visible{outline:2px solid var(--core); outline-offset:2px}
.lj-exp .valmis{font-family:"Familjen Grotesk",sans-serif; font-size:23px; font-weight:700; color:var(--strong)}
.lj-fb{font-size:14.5px; min-height:1.5em; color:var(--ink-2)}
.lj-fb.no{color:var(--alert)}
.lj-fb.ok{color:var(--strong)}
.lj-row{display:flex; align-items:center; gap:14px; margin-top:10px}
.lj-step{font-family:"IBM Plex Mono",monospace; font-size:11.5px; letter-spacing:.1em;
  text-transform:uppercase; color:var(--ink-3)}

/* harjoitukset */
.progress{position:sticky; top:0; z-index:5; background:var(--surface); border:1px solid var(--line);
  border-radius:var(--r); padding:12px 18px; box-shadow:var(--shadow); display:flex; align-items:center;
  gap:14px; margin:34px 0 18px}
.progress .lbl{font-family:"IBM Plex Mono",monospace; font-size:11px; letter-spacing:.12em;
  text-transform:uppercase; color:var(--ink-3); white-space:nowrap}
.progress .meter{flex:1; height:7px; border-radius:4px; background:var(--surface-2); border:1px solid var(--line); overflow:hidden}
.progress .meter i{display:block; height:100%; background:var(--core); transition:width .25s ease}
.progress .cnt{font-family:"Familjen Grotesk",sans-serif; font-weight:700; font-variant-numeric:tabular-nums; white-space:nowrap}

.grp{margin-top:26px}
.grp-head{display:flex; align-items:baseline; gap:10px; border-bottom:1.5px solid var(--ink); padding-bottom:7px; margin-bottom:14px}
.grp-head h3{margin:0; font-size:17px; font-weight:600}
.grp-head span{font-size:12.5px; color:var(--ink-2)}

.ex{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:14px 16px; margin-bottom:10px}
.ex[data-tila="oikein"]{border-color:var(--strong); box-shadow:inset 3px 0 0 var(--strong)}
.ex[data-tila="vaarin"]{border-color:var(--alert); box-shadow:inset 3px 0 0 var(--alert)}
.ex .q{display:flex; gap:11px; align-items:baseline; flex-wrap:wrap}
.ex .num{font-family:"IBM Plex Mono",monospace; font-size:11.5px; color:var(--ink-3); min-width:2.4em}
.ex .txt{flex:1; min-width:190px; font-size:15.5px}
.ex .txt .aineisto{display:block; margin-bottom:9px; padding-left:12px;
  border-left:2px solid var(--line); color:var(--ink-2); line-height:1.6;
  /* Aineisto voi olla pieni taulukko, jonka rivit on erotettu rivinvaihdoilla.
     Ilman pre-lineä ne valuisivat yhdeksi kappaleeksi ja taulukko katoaisi. */
  white-space:pre-line}
.ex .txt .kysymysrivi{display:block; font-weight:600}
.ex .row{display:flex; gap:8px; align-items:center; margin-top:11px; flex-wrap:wrap}
.ex input[type=text]{font:inherit; font-family:"IBM Plex Mono",monospace; font-size:15px; width:8.5em;
  padding:7px 11px; border:1px solid var(--line); border-radius:7px; background:var(--surface-2);
  color:var(--ink); text-align:right}
.ex input:focus-visible{outline:2px solid var(--core); outline-offset:1px}
button{font:inherit; cursor:pointer}
.btn{font-size:13.5px; padding:7px 15px; border-radius:7px; border:1px solid var(--core);
  background:var(--core); color:#fff}
.btn.ghost{background:transparent; color:var(--ink-2); border-color:var(--line)}
.btn:focus-visible{outline:2px solid var(--core); outline-offset:2px}
.btn.mv-valinta{text-align:left}
/* kuuntelutehtävä: selaimen puhesynteesi lukee englanninkielisen tekstin */
.kuuntele{display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin:2px 0 10px}
.kuuntele .btn{display:inline-flex; gap:7px; align-items:center}
.kuuntele svg{width:16px; height:16px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round}
.kuuntele .varateksti{flex-basis:100%; font-size:14px; color:var(--ink-2); background:var(--surface-2);
  border-radius:7px; padding:8px 12px; margin:0}
.btn.mv-valinta:disabled{cursor:default; opacity:.65}
.btn.mv-oikein{background:var(--strong-soft); border-color:var(--strong); color:var(--strong); opacity:1}
.btn.mv-vaarin{background:var(--alert-soft); border-color:var(--alert); color:var(--alert); opacity:1}
.row.mv{gap:8px 10px}
.fb{margin-top:11px; font-size:14.5px; padding:10px 13px; border-radius:8px; line-height:1.5}
.fb.ok{background:var(--strong-soft); color:var(--strong)}
.fb.no{background:var(--alert-soft); color:var(--alert)}
.fb.hint{background:var(--chal-soft); color:var(--chal)}

.done{background:var(--strong-soft); border:1px solid var(--strong); color:var(--strong);
  border-radius:var(--r); padding:16px 20px; margin-top:20px; font-size:15.5px}
.done h3{margin:0 0 4px; font-size:17px; color:var(--strong)}

details.teacher{margin-top:34px; background:var(--surface); border:1px solid var(--line);
  border-left:3px solid var(--chal); border-radius:var(--r); padding:15px 20px; box-shadow:var(--shadow)}
details.teacher summary{cursor:pointer; font-family:"Familjen Grotesk",sans-serif; font-weight:600; font-size:15px}
details.teacher summary:focus-visible{outline:2px solid var(--core); outline-offset:3px}
details.teacher ul{margin:12px 0 0; padding-left:19px; color:var(--ink-2); font-size:14.5px}
details.teacher li{margin-bottom:8px}
details.teacher p{margin:12px 0 0; color:var(--ink-2); font-size:14.5px}

.back{display:inline-block; margin-top:30px; font-size:13.5px; color:var(--ink-2)}
.back a{color:var(--core)}

@media (prefers-reduced-motion: reduce){*{transition:none !important}}
@media (max-width:560px){
  .wrap{padding:16px 13px 70px}
  header.top h1{font-size:25px}
  .progress{flex-wrap:wrap}
}
</style>

<div class="wrap">

  <header class="top">
    <span class="badge"><svg viewBox="0 0 24 24" aria-hidden="true" id="ikoni"></svg></span>
    <div>
      <p class="eyebrow" id="eyebrow"></p>
      <h1 id="otsikko"></h1>
      <p id="kuvaus"></p>
      <div class="tags" id="tags"></div>
    </div>
  </header>

  <article id="teksti"></article>

  <div class="progress" aria-live="polite">
    <span class="lbl">Harjoitukset</span>
    <span class="meter"><i id="pbar" style="width:0%"></i></span>
    <span class="cnt" id="pcnt">0 / 20</span>
  </div>

  <div id="harjoitukset"></div>
  <div id="valmis"></div>

  <p class="back" id="back"></p>

</div>

<script>
const D = {"tavoite_id":"MAT9-TIL-03","oppiaine":"MAT","vuosiluokka":9,"taso":"ydin","otsikko":"Keskiluvun kolme kasvoa","kuvaus":"Osaan määrittää keskiluvut frekvenssitaulukosta ja luokitellusta aineistosta ja valita tilanteeseen sopivan keskiluvun.","versio":"0.2","paivitetty":"2026-10-11","ops":{"T":["T6","T8","T19"],"S":["S6"]},"ikoni":"tasapaino","eyebrow":"Matematiikka · 9. luokka · Tilastot ja todennäköisyys","teksti":[{"tyyppi":"johdanto","sisalto":"Teit kyselyn koulusi yhdeksäsluokkalaisille ja kysyit 20 oppilaalta, montako sisarusta heillä on. Vastaukset mahtuvat kahdelle riville: sisaruksia 0, 1, 2, 3 tai 4, ja frekvenssit eli vastaajien määrät 3, 8, 6, 2 ja 1. Kaveri laskee keskiarvoksi (0 + 1 + 2 + 3 + 4) : 5 = 2. Toinen jakaa vastaajien määrän 20 viidellä ja saa 4. Kumpikaan ei ole oikein: kahdeksan oppilasta vastasi 1, ja heidän vastauksensa painavat keskiarvossa kahdeksan kertaa. Oikea keskiarvo on 1,5. 7. luokalla laskit keskilukuja lyhyestä luettelosta. Nyt aineisto on frekvenssitaulukko tai luokiteltu taulukko, jollaisina tilastot yleensä julkaistaan. Opit laskemaan keskiarvon niin, että frekvenssit ovat mukana, löytämään mediaanin kertymästä ja tyyppiarvon suurimmasta frekvenssistä sekä valitsemaan keskiluvun, joka kuvaa aineistoa parhaiten."},{"tyyppi":"kappale","otsikko":"Frekvenssitaulukko on lyhennetty luettelo","sisalto":"Sisarustaulukko on lyhyt tapa kirjoittaa 20 vastauksen luettelo: nolla kolmesti, ykkönen kahdeksan kertaa, kakkonen kuusi kertaa ja niin edelleen. Jos kirjoittaisit kaikki vastaukset allekkain ja laskisit ne yhteen, kakkonen tulisi summaan kuusi kertaa eli 2 · 6 = 12. Siksi jokainen arvo kerrotaan frekvenssillään ennen yhteenlaskua: 0 · 3 + 1 · 8 + 2 · 6 + 3 · 2 + 4 · 1 = 0 + 8 + 12 + 6 + 4 = 30. Jakaja on havaintojen määrä n, joka on frekvenssien summa: n = 3 + 8 + 6 + 2 + 1 = 20, ei arvojen määrä 5. Keskiarvo on 30 : 20 = 1,5. Kirjoita lauseke näkyviin muodossa (x₁ · f₁ + x₂ · f₂ + …) : n, jossa x on arvo ja f sen frekvenssi. Laskin on sallittu, ja tilastotoiminnolla voit tarkistaa tuloksen, mutta pelkkä laskimen antama luku ei näytä, otitko frekvenssit huomioon. Arvioi tulos ennen laskemista: suurin osa vastaajista on arvojen 1 ja 2 kohdalla, joten keskiarvon pitää olla niiden lähellä, ei 4 eikä 6. Jos jakolasku ei mene tasan, pyöristä tehtävässä pyydettyyn tarkkuuteen."},{"tyyppi":"taulukko","otsikko":"Sisarustaulukko kertymäsarakkeen kanssa","otsikkorivi":["Sisaruksia x","Frekvenssi f","x · f","Kertymä","Havainnot järjestyksessä"],"rivit":[["0","3","0","3","1.–3."],["1","8","8","11","4.–11."],["2","6","12","17","12.–17."],["3","2","6","19","18.–19."],["4","1","4","20","20."],["Yhteensä","20","30","",""]]},{"tyyppi":"saanto","otsikko":"Mediaani kertymästä","askeleet":["Laske havaintojen määrä n frekvenssien summana. Kun arvot on kirjoitettu taulukkoon pienimmästä suurimpaan, havainnot ovat jo suuruusjärjestyksessä.","Selvitä keskimmäisten havaintojen järjestysnumerot. Jos n on pariton, keskimmäinen on havainto numero (n + 1) : 2, esimerkiksi kun n = 25, se on 13. havainto. Jos n on parillinen, keskimmäiset ovat havainnot n : 2 ja n : 2 + 1, esimerkiksi kun n = 20, ne ovat 10. ja 11. havainto.","Lisää taulukkoon kertymäsarake: kunkin rivin kertymä on sen rivin ja kaikkien edellisten rivien frekvenssien summa. Viimeisen rivin kertymä on n, mikä on samalla tarkistus.","Etsi ensimmäinen rivi, jonka kertymä on vähintään keskimmäisen havainnon järjestysnumero. Sisarustaulukossa kertymä on arvon 0 kohdalla 3 ja arvon 1 kohdalla 11, joten havainnot 4.–11. ovat ykkösiä. Sekä 10. että 11. havainto on 1, joten mediaani on 1.","Jos keskimmäiset havainnot ovat eri riveillä, mediaani on niiden arvojen keskiarvo. Esimerkki: maalimäärät 0, 1, 2 ja 3 frekvensseillä 4, 6, 7 ja 3 (n = 20). Kertymä on 4, 10, 17, 20, joten 10. havainto on 1 ja 11. havainto on 2. Mediaani on (1 + 2) : 2 = 1,5.","Miksi kertymä? Mediaani on järjestetyn aineiston keskimmäinen havainto, ja kertymä kertoo, monennestako havainnosta monenteenko kukin arvo ulottuu. Arvosarakkeen keskimmäinen arvo on keskellä vain arvojen listassa, ei havaintojen."]},{"tyyppi":"kappale","otsikko":"Tyyppiarvo ja frekvenssipylväät","sisalto":"Tyyppiarvo on arvo, jonka frekvenssi on suurin. Sisarustaulukossa suurin frekvenssi on 8, ja se on arvon 1 kohdalla, joten tyyppiarvo on 1. Vastaus on arvo eikä frekvenssi: luku 8 kertoo vain, montako kertaa tyyppiarvo esiintyy. Jos kaksi arvoa jakaa suurimman frekvenssin, tyyppiarvoja on kaksi, ja molemmat ilmoitetaan. 7. luokan sopimus pätee edelleen: jos kaikilla arvoilla on sama frekvenssi, aineistolla ei ole tyyppiarvoa. Frekvenssitaulukko piirretään usein pylväsdiagrammiksi, jonka vaaka-akselilla ovat arvot ja jossa pylvään korkeus on arvon frekvenssi. 7. luokan keskilukutehtävissä jokainen pylväs oli yksi havainto. Frekvenssipylväsdiagrammissa vaaka-akselilla ovat muuttujan arvot, ja pylväs kertoo, montako havaintoa arvolla on. Siksi tällaisessa frekvenssipylväsdiagrammissa tyyppiarvo on korkeimman pylvään kohdalla, ja keskiarvo lasketaan samalla lausekkeella kuin taulukosta: arvo kerrotaan pylvään korkeudella."},{"tyyppi":"kappale","otsikko":"Luokiteltu aineisto","sisalto":"Kun muuttujalla on paljon eri arvoja, kuten pituudella senttimetreinä, aineisto luokitellaan. Luokassa 160–164 ovat kaikki pituudet 160:stä 164 senttimetriin. Taulukosta näkyvät luokkien frekvenssit mutta eivät yksittäiset havainnot. Luokkakeskus on luokan ilmoitettujen rajojen keskiarvo: (160 + 164) : 2 = 162. Keskiarvo lasketaan luokkakeskusten avulla, eli jokaisen havainnon oletetaan olevan luokkansa keskellä. Pituudet 150–154, 155–159, 160–164, 165–169 ja 170–174 frekvensseillä 2, 5, 9, 6 ja 3 antavat keskiarvon (152 · 2 + 157 · 5 + 162 · 9 + 167 · 6 + 172 · 3) : 25 = 4 065 : 25 = 162,6 cm. Tulos on likiarvo, koska luokan havainnot voivat olla missä tahansa luokan sisällä, eikä todellista summaa voi laskea taulukosta. Tyyppiluokka on luokka, jonka frekvenssi on suurin, tässä 160–164 cm, ja oppikirjan tapaan tyyppiarvoksi ilmoitetaan sen luokkakeskus 162 cm. Mediaanista ilmoitetaan luokka, johon se kuuluu. Havaintoja on 25, joten keskimmäinen on 13. havainto. Kertymä on 2, 7, 16, 22, 25, joten havainnot 8.–16. ovat luokassa 160–164, ja mediaani kuuluu siihen. Tämän taidon tehtävissä parillisen aineiston kaksi keskimmäistä havaintoa ovat samassa luokassa. Tehtävä kertoo aina, kysytäänkö luokkaa (160–164 cm) vai luokkakeskusta (162 cm)."},{"tyyppi":"kappale","otsikko":"Mikä keskiluku kuvaa aineistoa parhaiten","sisalto":"Keskiarvo ottaa jokaisen havainnon mukaan summaan, joten yksi poikkeava arvo vetää sitä puoleensa. Pienen yrityksen kymmenen työntekijän kuukausipalkat ovat 2 500 € (6 henkilöä), 3 000 € (3 henkilöä) ja 9 000 € (1 henkilö). Keskiarvo on (2 500 · 6 + 3 000 · 3 + 9 000 · 1) : 10 = 33 000 : 10 = 3 300 €, mikä on enemmän kuin yhdeksän työntekijän palkka. Mediaani on 5. ja 6. havainnon keskiarvo, ja molemmat ovat 2 500 €, joten mediaani on 2 500 €. Mediaani ei muuttuisi, vaikka suurin palkka olisi 20 000 €. Kun aineistossa on poikkeava arvo, tavallista havaintoa kuvaa yleensä paremmin mediaani. Laadullisen muuttujan, kuten kulkutavan kouluun, lempivärin tai veriryhmän, arvot ovat nimiä eivätkä lukuja. Niitä ei voi laskea yhteen, joten keskiarvoa ei voi laskea. Kulkutapoja, värejä tai veriryhmiä ei voi myöskään järjestää suuruusjärjestykseen, joten mediaaniakaan ei ole. Keskiluvuista jää tyyppiarvo, esimerkiksi yleisin kulkutapa. Jos laadullisen muuttujan arvot voi järjestää, kuten vaatekoot XS, S, M, L ja XL, mediaanin voi etsiä kertymästä samalla tavalla kuin luvuista. Keskiarvoa ei silti voi laskea, koska koot eivät ole lukuja."},{"tyyppi":"ansa","otsikko":"Ansa 1 ja 2: väärä summa tai väärä jakaja","sisalto":"Sisarustaulukosta (arvot 0, 1, 2, 3, 4 ja frekvenssit 3, 8, 6, 2, 1) syntyy helposti kolme väärää keskiarvoa. Pelkkien arvojen keskiarvo (0 + 1 + 2 + 3 + 4) : 5 = 2 olettaa, että jokaista arvoa on yhtä monta. Frekvenssien keskiarvo 20 : 5 = 4 kertoo vain, montako vastaajaa yhdellä rivillä on keskimäärin. Kolmas virhe on laskea summa oikein mutta jakaa se rivien määrällä: 30 : 5 = 6, mikä on suurempi kuin suurin arvo 4. Oikea lauseke on (0 · 3 + 1 · 8 + 2 · 6 + 3 · 2 + 4 · 1) : 20 = 1,5: arvot kerrotaan frekvensseillä, ja jakaja on frekvenssien summa."},{"tyyppi":"ansa","otsikko":"Ansa 3 ja 4: arvosarake ei ole aineisto","sisalto":"Mediaani ei ole arvosarakkeen keskimmäinen luku. Sisarustaulukon arvoista 0, 1, 2, 3, 4 keskimmäinen on 2, mutta 20 havainnosta kahdeksan on ykkösiä, ja kertymä näyttää, että 10. ja 11. havainto ovat ykkösiä. Mediaani ei myöskään ole frekvenssien mediaani: frekvenssit järjestettyinä 1, 2, 3, 6, 8 antavat 3, joka on vastaajien määrä eikä sisarusten määrä. Samoin tyyppiarvo on arvo eikä frekvenssi: suurin frekvenssi 8 on ykkösen kohdalla, joten tyyppiarvo on 1 eikä 8. Kysy itseltäsi, onko vastauksesi sisarusten määrä vai vastaajien määrä."},{"tyyppi":"ansa","otsikko":"Ansa 5 ja 6: väärä luokkakeskus ja numeroiksi koodattu laatu","sisalto":"Luokan 160–164 luokkakeskus on (160 + 164) : 2 = 162. Jos sen laskee seuraavan luokan alarajasta, (160 + 165) : 2 = 162,5, jokainen luokkakeskus siirtyy puoli senttiä ylös, ja pituusesimerkin keskiarvoksi tulee 163,1 eikä 162,6. Jos keskiarvon laskee luokkien alarajoilla 150, 155, 160, 165 ja 170, tulos 160,6 on liian pieni. Käytä luokan omia rajoja. Laadullisen muuttujan koodaaminen numeroiksi ei tee siitä määrällistä. Jos veriryhmät koodataan A = 1, B = 2, AB = 3 ja O = 4 ja 20 vastaajasta 8 on A, 4 on B, 2 on AB ja 6 on O, koodien keskiarvo on (1 · 8 + 2 · 4 + 3 · 2 + 4 · 6) : 20 = 2,3. Veriryhmää 2,3 ei ole olemassa. Kun samat vastaukset koodataan toisin, O = 1, A = 2, B = 3 ja AB = 4, keskiarvoksi tulee 2,1: luku riippuu vain koodien valinnasta. Veriryhmän keskiluku on tyyppiarvo A."}],"harjoitusryhmat":[{"id":"frekvenssi","nimi":"Keskiluvut frekvenssitaulukosta","info":"Kerro arvot frekvensseillä ja jaa frekvenssien summalla. Mediaani löytyy kertymästä, tyyppiarvo suurimman frekvenssin kohdalta. Laskin on sallittu."},{"id":"luokiteltu","nimi":"Luokiteltu aineisto","info":"Luokkakeskus on luokan ilmoitettujen rajojen keskiarvo. Keskiarvo luokkakeskusten avulla on likiarvo. Lue, kysytäänkö luokkaa vai luokkakeskusta. Laskin on sallittu."},{"id":"valinta","nimi":"Sopivan keskiluvun valinta","info":"Poikkeava arvo vetää keskiarvoa mutta tuskin mediaania. Laadullisesta muuttujasta ei lasketa keskiarvoa. Laskin on sallittu."}],"harjoitukset":[{"id":"H01","ryhma":"frekvenssi","kysymys":"Kysyit 20 kaverilta, montako kertaa he kävivät kirjastossa syyskuussa.\nKäyntejä: 0, 1, 2, 3, 4\nFrekvenssi: 5, 8, 4, 2, 1\n\nMontako kirjastokäyntiä kavereilla oli yhteensä?","vastaus":26,"vinkki":"Kerro jokainen käyntimäärä sen frekvenssillä ja laske tulot yhteen.","selitys":"0 · 5 + 1 · 8 + 2 · 4 + 3 · 2 + 4 · 1 = 0 + 8 + 8 + 6 + 4 = 26. Neljä kaveria kävi kahdesti, joten heidän käyntejään on 2 · 4 = 8. Pelkkien arvojen summa 0 + 1 + 2 + 3 + 4 = 10 laskisi jokaisen käyntimäärän vain kerran.","tyyppi":"luku"},{"id":"H02","ryhma":"frekvenssi","kysymys":"Kysyit 20 kaverilta, montako kertaa he kävivät kirjastossa syyskuussa.\nKäyntejä: 0, 1, 2, 3, 4\nFrekvenssi: 5, 8, 4, 2, 1\n\nMikä on käyntien keskiarvo?","vastaus":1.3,"vinkki":"Jaa käyntien yhteismäärä havaintojen määrällä. Havaintoja on yhtä monta kuin kavereita eli frekvenssien summa.","selitys":"(0 · 5 + 1 · 8 + 2 · 4 + 3 · 2 + 4 · 1) : 20 = 26 : 20 = 1,3. Jakaja on 20 eikä rivien määrä 5. Pelkkien arvojen keskiarvo (0 + 1 + 2 + 3 + 4) : 5 = 2 olettaisi, että jokaista käyntimäärää on yhtä monta, vaikka nollia ja ykkösiä on paljon enemmän kuin kolmosia ja nelosia.","tyyppi":"luku"},{"id":"H03","ryhma":"frekvenssi","kysymys":"Pylväsdiagrammin vaaka-akselilla ovat lainattujen kirjojen määrät 1–5, ja pylvään korkeus kertoo, moniko oppilas lainasi niin monta kirjaa. Pylväiden korkeudet:\n1 → 4, 2 → 7, 3 → 6, 4 → 4, 5 → 1\n\nMikä on keskiarvo? Anna vastaus kymmenesosan tarkkuudella.","vastaus":2.6,"vinkki":"Pylvään korkeus on frekvenssi. Kerro jokainen kirjamäärä pylvään korkeudella ja jaa summa pylväiden korkeuksien summalla.","selitys":"(1 · 4 + 2 · 7 + 3 · 6 + 4 · 4 + 5 · 1) : 22 = 57 : 22 = 2,590… ≈ 2,6. Havaintoja on 4 + 7 + 6 + 4 + 1 = 22. Tulos on lähellä kirjamääriä 2 ja 3, joilla pylväät ovat korkeimmat.","tyyppi":"luku"},{"id":"H04","ryhma":"frekvenssi","kysymys":"Kyselyn kysymys: Montako henkeä kotitaloudessasi on?\nHenkilöitä: 1, 2, 3, 4, 5, 6\nFrekvenssi: 2, 5, 8, 6, 3, 1\n\nMikä on kertymä arvon 4 kohdalla?","vastaus":21,"vinkki":"Kertymä on sen rivin ja kaikkien edellisten rivien frekvenssien summa.","selitys":"Kertymät ovat 2, 2 + 5 = 7, 7 + 8 = 15 ja 15 + 6 = 21. Arvon 4 kohdalla kertymä on 21: havainnot 16.–21. ovat nelosia. Vastaus 6 olisi pelkkä arvon 4 frekvenssi.","tyyppi":"luku"},{"id":"H05","ryhma":"frekvenssi","kysymys":"Kyselyn kysymys: Montako tuntia viikossa harrastat liikuntaa (kokonaisina tunteina)?\nTunteja: 1, 2, 3, 4, 5, 6\nFrekvenssi: 3, 6, 8, 5, 2, 2\n\nMikä on mediaani?","vastaus":3,"vinkki":"Havaintoja on 26, joten keskimmäiset ovat 13. ja 14. havainto. Laske kertymää, kunnes se on vähintään 14.","selitys":"n = 3 + 6 + 8 + 5 + 2 + 2 = 26, joten keskimmäiset ovat 13. ja 14. havainto. Kertymä on 3, 9, 17, …, eli havainnot 10.–17. ovat kolmosia. Molemmat keskimmäiset ovat 3, joten mediaani on 3.","tyyppi":"luku"},{"id":"H06","ryhma":"frekvenssi","kysymys":"Kyselyn kysymys: Montako kertaa myöhästyit koulubussista syyskuussa?\nKertoja: 0, 1, 2, 3, 4, 5\nFrekvenssi: 6, 9, 5, 3, 1, 1\n\nMikä on mediaani?","vastaus":1,"vinkki":"Havaintoja on pariton määrä. Keskimmäinen on havainto numero (n + 1) : 2.","selitys":"n = 25, joten keskimmäinen on (25 + 1) : 2 = 13. havainto. Kertymä on 6, 15, …, eli havainnot 7.–15. ovat ykkösiä, ja 13. havainto on 1. Arvosarakkeen keskikohta 2,5 ei ole mediaani, koska nollia ja ykkösiä on yli puolet havainnoista.","tyyppi":"luku"},{"id":"H07","ryhma":"frekvenssi","kysymys":"Kyselyn kysymys: Montako viikkoa olit kesätöissä?\nViikkoja: 3, 4, 5, 6, 7, 8\nFrekvenssi: 5, 5, 4, 3, 2, 1\n\nMikä on mediaani?","vastaus":4.5,"vinkki":"Havaintoja on 20. Katso kertymästä, mikä on 10. ja mikä 11. havainto.","selitys":"n = 20, joten keskimmäiset ovat 10. ja 11. havainto. Kertymä on 5, 10, 14, …, joten 10. havainto on 4 ja 11. havainto on 5. Mediaani on (4 + 5) : 2 = 4,5.","tyyppi":"luku"},{"id":"H08","ryhma":"frekvenssi","kysymys":"Kyselyn kysymys: Montako polkupyörää kotitaloudessasi on?\nPyöriä: 0, 1, 2, 3, 4, 5\nFrekvenssi: 3, 6, 11, 7, 2, 1\n\nMikä on tyyppiarvo?","vastaus":2,"vinkki":"Etsi suurin frekvenssi. Tyyppiarvo on se pyörien määrä, jonka kohdalla suurin frekvenssi on.","selitys":"Suurin frekvenssi on 11, ja se on arvon 2 kohdalla. Tyyppiarvo on 2. Vastaus 11 kertoisi vain, monessako kotitaloudessa on kaksi pyörää.","tyyppi":"luku"},{"id":"H09","ryhma":"frekvenssi","kysymys":"Kyselyn kysymys: Montako kertaa viikossa käyt kaupassa?\nKertoja: 0, 1, 2, 3, 4, 5\nFrekvenssi: 4, 8, 8, 5, 2, 1\n\nMontako tyyppiarvoa aineistolla on? Jos jokainen arvo esiintyy yhtä monta kertaa, tyyppiarvoa ei ole: vastaa silloin 0.","vastaus":2,"vinkki":"Onko suurin frekvenssi useamman arvon kohdalla?","selitys":"Suurin frekvenssi 8 on sekä arvon 1 että arvon 2 kohdalla. Tyyppiarvoja on kaksi: 1 ja 2.","tyyppi":"luku"},{"id":"H10","ryhma":"luokiteltu","kysymys":"Pisteet on luokiteltu luokkiin 60–64, 65–69, 70–74, 75–79 ja 80–84.\n\nMikä on luokan 70–74 luokkakeskus?","vastaus":72,"vinkki":"Luokkakeskus on luokan omien rajojen keskiarvo.","selitys":"(70 + 74) : 2 = 72. Jos laskisit seuraavan luokan alarajasta, (70 + 75) : 2 = 72,5, luokkakeskus siirtyisi puoli pistettä liian ylös.","tyyppi":"luku"},{"id":"H11","ryhma":"luokiteltu","kysymys":"Kuntotestin pistemäärät luokiteltuna.\nPisteet: 20–24, 25–29, 30–34, 35–39, 40–44\nFrekvenssi: 3, 6, 8, 7, 2\n\nLaske keskiarvo luokkakeskusten avulla kymmenesosan tarkkuudella.","vastaus":31.8,"vinkki":"Laske ensin luokkakeskukset 22, 27, … Kerro jokainen luokkakeskus luokan frekvenssillä ja jaa summa havaintojen määrällä.","selitys":"(22 · 3 + 27 · 6 + 32 · 8 + 37 · 7 + 42 · 2) : 26 = 827 : 26 = 31,807… ≈ 31,8. Tulos on likiarvo, koska jokaisen havainnon oletetaan olevan luokkansa keskellä.","tyyppi":"luku"},{"id":"H12","ryhma":"luokiteltu","kysymys":"Mopoautolla päivässä ajettu matka luokiteltuna.\nMatka (km): 25–29, 30–34, 35–39, 40–44, 45–49\nFrekvenssi: 3, 9, 7, 4, 2\n\nMikä on tyyppiluokan luokkakeskus?","vastaus":32,"vinkki":"Tyyppiluokka on luokka, jonka frekvenssi on suurin. Laske sen luokkakeskus.","selitys":"Suurin frekvenssi 9 on luokassa 30–34, joten se on tyyppiluokka. Sen luokkakeskus on (30 + 34) : 2 = 32.","tyyppi":"luku"},{"id":"H13","ryhma":"luokiteltu","kysymys":"Mopoautolla päivässä ajettu matka luokiteltuna.\nMatka (km): 25–29, 30–34, 35–39, 40–44, 45–49\nFrekvenssi: 3, 9, 7, 4, 2\n\nMikä on sen luokan luokkakeskus, johon mediaani kuuluu?","vastaus":37,"vinkki":"Havaintoja on 25. Etsi kertymästä luokka, jossa 13. havainto on.","selitys":"n = 25, joten keskimmäinen on 13. havainto. Kertymä on 3, 12, 19, …, joten havainnot 13.–19. ovat luokassa 35–39. Sen luokkakeskus on 37. Mediaaniluokka ei ole sama kuin tyyppiluokka 30–34.","tyyppi":"luku"},{"id":"H14","ryhma":"luokiteltu","kysymys":"Pyöräilymatka kouluun luokiteltuna.\nMatka (km): 0–4, 5–9, 10–14, 15–19, 20–24\nFrekvenssi: 6, 9, 5, 3, 3\n\nLaske keskiarvo luokkakeskusten avulla kymmenesosan tarkkuudella.","vastaus":9.7,"vinkki":"Luokan 0–4 luokkakeskus on (0 + 4) : 2 = 2. Jakaja on frekvenssien summa.","selitys":"(2 · 6 + 7 · 9 + 12 · 5 + 17 · 3 + 22 · 3) : 26 = 252 : 26 = 9,6923… ≈ 9,7.","tyyppi":"luku"},{"id":"H15","ryhma":"luokiteltu","kysymys":"Miksi luokkakeskusten avulla laskettu keskiarvo on likiarvo?","vastaus":1,"vinkki":"Mieti, mitä luokitellusta taulukosta ei näe.","selitys":"Taulukosta näkyy vain, montako havaintoa luokassa on, ei havaintoja itse. Keskiarvossa jokaisen havainnon oletetaan olevan luokkansa keskellä. Jakaja on havaintojen määrä, ja luokkakeskus voi olla myös desimaaliluku, kuten 4,5 luokassa 0–9.","tyyppi":"monivalinta","vaihtoehdot":["Koska luokkakeskukset pyöristetään kokonaisluvuiksi.","Koska jokaisen havainnon oletetaan olevan luokkansa keskellä, vaikka todelliset arvot eivät näy taulukosta.","Koska summa jaetaan luokkien määrällä eikä havaintojen määrällä."]},{"id":"H16","ryhma":"valinta","kysymys":"Pienen kahvilan kahdeksan työntekijän kuukausipalkat.\nKuukausipalkka (€): 2 100, 2 600, 7 900\nFrekvenssi: 5, 2, 1\n\nMikä on palkkojen keskiarvo euroina? Anna vastaus ilman €-merkkiä.","vastaus":2950,"vinkki":"Kerro jokainen palkka frekvenssillään ja jaa summa työntekijöiden määrällä.","selitys":"(2 100 · 5 + 2 600 · 2 + 7 900 · 1) : 8 = 23 600 : 8 = 2 950. Keskiarvo on suurempi kuin seitsemän työntekijän palkka kahdeksasta.","tyyppi":"luku"},{"id":"H17","ryhma":"valinta","kysymys":"Pienen kahvilan kahdeksan työntekijän kuukausipalkat.\nKuukausipalkka (€): 2 100, 2 600, 7 900\nFrekvenssi: 5, 2, 1\n\nMikä on palkkojen mediaani euroina? Anna vastaus ilman €-merkkiä.","vastaus":2100,"vinkki":"Työntekijöitä on 8, joten keskimmäiset ovat 4. ja 5. havainto.","selitys":"Kertymä on 5, 7, 8, joten havainnot 1.–5. ovat 2 100 €. Sekä 4. että 5. havainto on 2 100 €, joten mediaani on 2 100 €.","tyyppi":"luku"},{"id":"H18","ryhma":"valinta","kysymys":"Tehtävien H16 ja H17 kahvilassa palkkojen keskiarvo on 2 950 € ja mediaani 2 100 €. Kumpi kuvaa tavallisen työntekijän palkkaa paremmin?","vastaus":1,"vinkki":"Mieti, mikä palkka nostaa keskiarvoa ja muuttaisiko se mediaania.","selitys":"Yksi 7 900 euron palkka tulee keskiarvon summaan kokonaan ja nostaa keskiarvon suuremmaksi kuin seitsemän työntekijän palkka. Mediaani riippuu vain järjestyksen keskikohdasta, joten se kertoo, mitä tavallinen työntekijä ansaitsee. Molemmat lasketaan samasta aineistosta, mutta ne kertovat eri asiaa.","tyyppi":"monivalinta","vaihtoehdot":["Keskiarvo, koska siinä ovat mukana kaikki palkat.","Mediaani, koska yksi suuri palkka nostaa keskiarvoa mutta ei muuta mediaania.","Kumpikin yhtä hyvin, koska ne lasketaan samasta aineistosta."]},{"id":"H19","ryhma":"valinta","kysymys":"Muuttujat: pituus, lempiväri, sisarusten määrä, kulkutapa kouluun, postinumero, koulumatkan pituus\n\nMontako näistä kuudesta muuttujasta on sellaisia, joista voi laskea keskiarvon?","vastaus":3,"vinkki":"Keskiarvo vaatii, että arvot ovat lukuja, joita voi laskea yhteen. Onko postinumero sellainen?","selitys":"Pituus, sisarusten määrä ja koulumatkan pituus ovat määrällisiä muuttujia. Lempiväri ja kulkutapa ovat laadullisia. Postinumero näyttää luvulta, mutta se on tunnus eli nimi: kahden postinumeron summa tai keskiarvo ei tarkoita mitään. Vastaus on 3.","tyyppi":"luku"},{"id":"H20","ryhma":"valinta","kysymys":"Koulun lippisten koot ja tilausmäärät.\nKoko: XS, S, M, L, XL\nFrekvenssi: 2, 6, 9, 7, 5\n\nMikä on koon mediaani?","vastaus":1,"vinkki":"Koot voi järjestää pienimmästä suurimpaan, joten mediaanin voi etsiä kertymästä kuten luvuista.","selitys":"n = 29, joten keskimmäinen on 15. havainto. Kertymä on 2, 8, 17, …, joten havainnot 9.–17. ovat kokoa M. Mediaani on M. Keskiarvoa koosta ei voi laskea, mutta mediaanin voi määrittää, koska koot ovat järjestyksessä.","tyyppi":"monivalinta","vaihtoehdot":["S","M","L","Mediaania ei voi määrittää, koska koot eivät ole lukuja."]}],"valmis_teksti":"Osaat laskea keskiarvon frekvenssitaulukosta niin, että frekvenssit ovat mukana, löytää mediaanin kertymästä ja tyyppiarvon suurimman frekvenssin kohdalta. Luokitellusta aineistosta osaat laskea keskiarvon luokkakeskusten avulla ja määrittää tyyppiluokan ja mediaaniluokan. Osaat perustella, miksi poikkeavan arvon kanssa mediaani kuvaa tavallista havaintoa paremmin ja miksi laadullisesta muuttujasta ei voi laskea keskiarvoa. Tämä taito on nyt näytetty."};

/* ---------- teksti ---------- */
const esc = s => s;
const osat = D.teksti.map(o=>{
  switch(o.tyyppi){
    case "johdanto":
      return `<p class="lead">${esc(o.sisalto)}</p>`;
    case "kappale":
      return `<h2>${esc(o.otsikko)}</h2><p>${esc(o.sisalto)}</p>`;
    case "saanto":
      return `<div class="box"><h3>${esc(o.otsikko)}</h3><ol class="steps">${
        o.askeleet.map(a=>`<li><span>${esc(a)}</span></li>`).join("")}</ol></div>`;
    case "taulukko":
      return `<div class="box"><h3>${esc(o.otsikko)}</h3><div class="tablewrap"><table><thead><tr>${
        o.otsikkorivi.map(h=>`<th>${h}</th>`).join("")}</tr></thead><tbody>${
        o.rivit.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join("")}</tr>`).join("")}</tbody></table></div></div>`;
    case "ansa":
      return `<div class="box warn"><h3>${esc(o.otsikko)}</h3><p style="margin:0">${esc(o.sisalto)}</p></div>`;
    case "muistilappu":
      return `<div class="box note"><h3>${esc(o.otsikko)}</h3><ul class="notes">${
        o.kohdat.map(k=>`<li>${esc(k)}</li>`).join("")}</ul></div>`;
    case "numerotaulu":
      return `<div class="box nt"><h3>${esc(o.otsikko)}</h3><p class="ohje">${esc(o.sisalto)}</p>
        <div class="nt-valinta" id="ntValinta"></div>
        <div class="nt-taulu" id="ntTaulu"></div>
        <p class="nt-selite" id="ntSelite"></p></div>`;
    case "vahvuusportaat":
      return `<div class="box vp"><h3>${esc(o.otsikko)}</h3><p class="ohje">${esc(o.sisalto)}</p>
        <div class="vp-tasot">${o.tasot.map(t=>
          `<div class="vp-taso" data-taso="${t.id}"><span class="vp-pallo"></span>
           <div><strong>${t.nimi}</strong><span>${t.selite}</span></div></div>`).join("")}</div>
        <div class="vp-lauseke" id="vpLauseke"></div>
        <div class="vp-rivi"><button type="button" class="btn ghost" id="vpSeuraava">Toinen lauseke</button>
        <span class="vp-vastaus" id="vpVastaus"></span></div></div>`;
    case "laskujarjestys":

const svg=document.getElementById("nlsvg"), rng=document.getElementById("nlrange"), out=document.getElementById("nlout");
const X0=34, X1=606, Y=62;
function piirraNL(v){
  const ala=Math.floor(v/10)*10, yla=ala+10, puoli=ala+5;
  const pyor = (v%10)>=5 ? yla : ala;
  const x = n => X0 + (n/100)*(X1-X0);
  let s=`<line class="rail" x1="${X0}" y1="${Y}" x2="${X1}" y2="${Y}"/>`;
  for(let n=0;n<=100;n+=10){
    const near = (n===ala||n===yla);
    s+=`<line class="tick" x1="${x(n)}" y1="${Y-7}" x2="${x(n)}" y2="${Y+7}"/>`;
    s+=`<text class="stop${near?" near":""}" x="${x(n)}" y="${Y+24}" text-anchor="middle">${n}</text>`;
  }
  s+=`<line class="halfway" x1="${x(puoli)}" y1="${Y-16}" x2="${x(puoli)}" y2="${Y+12}"/>`;
  s+=`<text class="stop" x="${x(puoli)}" y="${Y-22}" text-anchor="middle">puoliväli ${puoli}</text>`;
  s+=`<circle class="dot" cx="${x(v)}" cy="${Y}" r="6"/>`;
  s+=`<text class="val" x="${x(v)}" y="${Y-32}" text-anchor="middle">${v}</text>`;
  s+=`<path d="M ${x(v)} ${Y+38} L ${x(pyor)} ${Y+38}" stroke="var(--core)" stroke-width="2" fill="none"/>`;
  s+=`<path d="M ${x(pyor)} ${Y+38} l ${x(pyor)>x(v)?-7:7} -4 l 0 8 z" fill="var(--core)"/>`;
  svg.innerHTML=s;
  out.textContent = `${v} pyöristyy → ${pyor}`;
}

/* ---------- laskujärjestys-widget ---------- */
const ljExp=document.getElementById("ljExp");
if(ljExp && D.kokeilu){
  let ljI=0, ljTokens=[], ljStep=0;
  const laske=(a,op,b)=>{a=+a;b=+b;return op==="×"?a*b:op==="÷"?a/b:op==="+"?a+b:a-b;};
  function ljAlku(){
    const l=D.kokeilu[ljI];
    ljTokens=l.lauseke.replace(/\(/g,"( ").replace(/\)/g," )").split(/\s+/).filter(Boolean);
    ljStep=0; ljPiirra(); ljViesti("","");
  }
  function ljViesti(t,lk){const f=document.getElementById("ljFb"); f.textContent=t; f.className="lj-fb "+(lk||"");}
  function ljPiirra(){
    const l=D.kokeilu[ljI];
    document.getElementById("ljStep").textContent =
      ljStep>=l.askeleet.length ? "valmis" : `askel ${ljStep+1} / ${l.askeleet.length}`;
    if(ljStep>=l.askeleet.length){
      ljExp.innerHTML=`<span class="valmis">${l.lauseke} = ${l.vastaus}</span>`;
      return;
    }
    ljExp.innerHTML=ljTokens.map((t,i)=>
      "×÷+−".includes(t) ? `<button type="button" class="op" data-i="${i}">${t}</button>`
                         : `<span class="tok">${t}</span>`).join("");
    ljExp.querySelectorAll("button.op").forEach(b=>b.addEventListener("click",()=>ljKlikkaa(+b.dataset.i)));
  }
  function ljKlikkaa(i){
    const l=D.kokeilu[ljI], odotettu=l.askeleet[ljStep];
    const ehdotus=[ljTokens[i-1],ljTokens[i],ljTokens[i+1]].join(" ");
    if(ehdotus!==odotettu){
      ljViesti(ljStep===0
        ? "Ei vielä. Sulkeet ovat vahvimmat, sitten kerto ja jako. Yhtä vahvat vasemmalta oikealle."
        : "Ei vielä. Kumpi jäljellä olevista on vahvempi?", "no");
      return;
    }
    const arvo=laske(ljTokens[i-1],ljTokens[i],ljTokens[i+1]);
    let alku=i-1, loppu=i+1;
    if(ljTokens[i-2]==="(" && ljTokens[i+2]===")"){ alku=i-2; loppu=i+2; }
    ljTokens.splice(alku, loppu-alku+1, String(arvo));
    ljStep++;
    ljViesti(ljStep>=l.askeleet.length ? "Valmis. Vastaus on "+l.vastaus+"." : "Oikein. Jatka seuraavaan.", "ok");
    ljPiirra();
  }
  document.getElementById("ljSeuraava").addEventListener("click",()=>{
    ljI=(ljI+1)%D.kokeilu.length; ljAlku();
  });
  ljAlku();
}

/* Suomalainen lukumuoto: välilyönti on tuhaterotin, pilkku desimaalierotin.
   Piste voi olla kumpi tahansa. Se tulkitaan tuhaterottimeksi VAIN silloin, kun
   koko luku on aitoa tuhaterotinmuotoa: alkuosa 1–3 numeroa ilman etunollaa ja
   jokainen jatko-osa täsmälleen 3 numeroa (1.500, 12.345.678). Kaikissa muissa
   tapauksissa piste on desimaalipiste — myös 0.125, joka vanhalla säännöllä
   ("3 numeroa pisteen jäljessä = tuhaterotin") luettiin virheellisesti luvuksi 125. */
const TUHATEROTIN = /^[1-9]\d{0,2}(\.\d{3})+$/;
function lueLuku(teksti){
  // Murtoluku (3/4, -3/4) ja sekaluku (1 2/3, -1 2/3) hyväksytään sellaisinaan.
  const raaka = String(teksti).replace(/\u00a0/g, " ").trim();
  let m = raaka.match(/^(-?)(\d+)\s+(\d+)\s*\/\s*(\d+)$/);
  if(m){ const nim = Number(m[4]); if(nim === 0) return null;
    const v = Number(m[2]) + Number(m[3]) / nim; return m[1] ? -v : v; }
  m = raaka.match(/^(-?)\s*(\d+)\s*\/\s*(\d+)$/);
  if(m){ const nim = Number(m[3]); if(nim === 0) return null;
    const v = Number(m[2]) / nim; return m[1] ? -v : v; }
  let s = String(teksti).replace(/[\s\u00a0]/g, "");
  if(s === "") return null;
  if(s.indexOf(",") >= 0){
    s = s.replace(/\./g, "").replace(",", ".");
  } else if(TUHATEROTIN.test(s)){
    s = s.replace(/\./g, "");
  }
  const n = Number(s);
  return Number.isFinite(n) ? n : null;
}

function tarkista(id){
  const h=D.harjoitukset.find(x=>x.id===id);
  const kentta=document.getElementById("in-"+id);
  const fb=document.getElementById("fb-"+id);
  if(kentta.value.trim()===""){ fb.className="fb hint"; fb.textContent="Kirjoita vastaus ensin."; return; }
  const luku=lueLuku(kentta.value);
  if(luku===null){ fb.className="fb no"; fb.textContent="Vastauksen pitää olla luku tai murtoluku (esimerkiksi 3/4)."; return; }
  const oikein = Math.abs(luku - h.vastaus) < 1e-9;
  merkitseTulos(id, oikein, oikein ? "Oikein. "+h.selitys : `Ei vielä. ${h.vinkki} Kokeile uudelleen.`);
}

function tarkistaMonivalinta(id, valittuIndeksi, painike){
  const h=D.harjoitukset.find(x=>x.id===id);
  const rivi=painike.closest(".row");
  rivi.querySelectorAll(".mv-valinta").forEach(b=>b.disabled=true);
  const oikein = valittuIndeksi===h.vastaus;
  painike.classList.add(oikein?"mv-oikein":"mv-vaarin");
  if(!oikein){
    const oikeaBtn=rivi.querySelector(`[data-i="${h.vastaus}"]`);
    if(oikeaBtn) oikeaBtn.classList.add("mv-oikein");
  }
  merkitseTulos(id, oikein, oikein ? "Oikein. "+h.selitys : `Ei ihan. Oikea vastaus on korostettu. ${h.selitys||""}`);
}

/* Kuuntelu: selain lukee tekstin ääneen omalla puhesynteesillään (englanniksi, jos laitteessa on
   englanninkielinen ääni). Ei äänitiedostoja eikä verkkoyhteyttä. Jos laite ei osaa puhua,
   teksti näytetään luettavaksi — silloin tehtävä muuttuu luetun ymmärtämiseksi, mutta ei katkea. */
function puhu(id, nopeus){
  const h=D.harjoitukset.find(x=>x.id===id); if(!h || !h.kuuntele) return;
  const vara=document.getElementById("vara-"+id);
  const naytaTeksti=syy=>{ vara.hidden=false; vara.textContent=syy+" Teksti: "+h.kuuntele; };
  if(!("speechSynthesis" in window)){ naytaTeksti("Tämä laite ei osaa lukea ääneen."); return; }
  const s=window.speechSynthesis; s.cancel();
  const u=new SpeechSynthesisUtterance(h.kuuntele);
  u.lang=h.kieli||"en-GB"; u.rate=nopeus;
  const aanet=s.getVoices(), kieli=u.lang.slice(0,2);
  const aani=aanet.find(a=>a.lang===u.lang) || aanet.find(a=>a.lang && a.lang.startsWith(kieli));
  if(aani) u.voice=aani;
  else if(aanet.length) { naytaTeksti("Laitteessa ei ole englanninkielistä ääntä."); return; }
  u.onerror=()=>naytaTeksti("Ääneen lukeminen ei onnistunut.");
  s.speak(u);
}
