<title>Toinen tuntematon pois</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">

<style>
:root{
  --paper:#EFF2F5; --surface:#FFFFFF; --surface-2:#F7F9FB;
  --grid:#DCE3EA; --line:#C9D3DC;
  --ink:#15222C; --ink-2:#4E626F; --ink-3:#7E8F9B;
  --core:#1B5A9E; --core-soft:#E4EDF6;
  --strong:#1F6E5C; --strong-soft:#E1F0EB;
  --chal:#9A6A16; --chal-soft:#F6EDDC;
  --alert:#A33A2B; --alert-soft:#F8E7E3;
  --shadow:0 1px 2px rgba(21,34,44,.06), 0 8px 24px -12px rgba(21,34,44,.18);
  --r:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0F161B; --surface:#18222A; --surface-2:#1D2830;
    --grid:#22303A; --line:#2E3E4A;
    --ink:#E8EFF4; --ink-2:#A3B4C0; --ink-3:#7A8B97;
    --core:#7FB2E4; --core-soft:#16303F;
    --strong:#77CDB4; --strong-soft:#123028;
    --chal:#E0B267; --chal-soft:#33270F;
    --alert:#E8907F; --alert-soft:#3A1E19;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -14px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --paper:#0F161B; --surface:#18222A; --surface-2:#1D2830;
  --grid:#22303A; --line:#2E3E4A;
  --ink:#E8EFF4; --ink-2:#A3B4C0; --ink-3:#7A8B97;
  --core:#7FB2E4; --core-soft:#16303F;
  --strong:#77CDB4; --strong-soft:#123028;
  --chal:#E0B267; --chal-soft:#33270F;
  --alert:#E8907F; --alert-soft:#3A1E19;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -14px rgba(0,0,0,.7);
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:16px; line-height:1.62;
  background-image:
    linear-gradient(to right, var(--grid) 1px, transparent 1px),
    linear-gradient(to bottom, var(--grid) 1px, transparent 1px);
  background-size:26px 26px;
}
.wrap{max-width:760px; margin:0 auto; padding:28px 20px 90px}
h1,h2,h3,h4{font-family:"Familjen Grotesk","IBM Plex Sans",system-ui,sans-serif; text-wrap:balance}

/* header */
header.top{background:var(--surface); border:1px solid var(--line); border-radius:var(--r);
  box-shadow:var(--shadow); padding:22px 24px; display:flex; gap:18px; align-items:flex-start}
.badge{flex:0 0 auto; width:54px; height:54px; border-radius:9px; display:grid; place-items:center;
  background:var(--core-soft); border:1px solid var(--core); color:var(--core)}
.badge svg{width:28px; height:28px; fill:none; stroke:currentColor; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round}
.eyebrow{font-family:"IBM Plex Mono",monospace; font-size:11px; letter-spacing:.14em;
  text-transform:uppercase; color:var(--ink-3); margin:0 0 5px}
header.top h1{margin:0; font-size:30px; font-weight:700; letter-spacing:-.015em}
header.top p{margin:5px 0 0; color:var(--ink-2); font-size:15px}
.tags{display:flex; flex-wrap:wrap; gap:5px; margin-top:11px}
.tag{font-family:"IBM Plex Mono",monospace; font-size:10.5px; letter-spacing:.05em; padding:2px 7px;
  border-radius:4px; background:var(--surface-2); border:1px solid var(--line); color:var(--ink-3)}
.tag.core{background:var(--core-soft); border-color:var(--core); color:var(--core)}

/* teksti */
article{margin-top:26px}
article h2{font-size:21px; font-weight:600; margin:32px 0 10px; letter-spacing:-.01em}
article p{margin:0 0 14px; max-width:64ch}
.lead{font-size:17.5px; color:var(--ink); border-left:3px solid var(--core); padding-left:16px; margin:0 0 8px}

.box{background:var(--surface); border:1px solid var(--line); border-radius:var(--r);
  padding:18px 22px; box-shadow:var(--shadow); margin:22px 0}
.box h3{margin:0 0 12px; font-size:16.5px; font-weight:600}
.box.warn{border-left:3px solid var(--alert)}
.box.note{border-left:3px solid var(--chal)}

ol.steps{margin:0; padding-left:0; list-style:none; counter-reset:s; display:grid; gap:12px}
ol.steps li{counter-increment:s; display:grid; grid-template-columns:auto 1fr; gap:13px; align-items:start}
ol.steps li::before{content:counter(s); font-family:"Familjen Grotesk",sans-serif; font-weight:700; font-size:14px;
  width:26px; height:26px; border-radius:50%; background:var(--core); color:#fff; display:grid; place-items:center; margin-top:2px}

ul.notes{margin:0; padding-left:19px}
ul.notes li{margin-bottom:7px}
ul.notes li:last-child{margin-bottom:0}

.tablewrap{overflow-x:auto}
table{border-collapse:collapse; width:100%; font-size:14.5px; min-width:460px}
th,td{text-align:left; padding:9px 13px; border-bottom:1px solid var(--line)}
th{font-family:"IBM Plex Mono",monospace; font-size:10.5px; letter-spacing:.1em; text-transform:uppercase;
  color:var(--ink-3); font-weight:400; background:var(--surface-2)}
tr:last-child td{border-bottom:0}
td b{color:var(--core); font-weight:600}
td:last-child{font-variant-numeric:tabular-nums; font-weight:600}

/* lukusuora */
.nl svg{width:100%; height:118px; display:block}
.nl .rail{stroke:var(--line); stroke-width:2}
.nl .tick{stroke:var(--line); stroke-width:1.5}
.nl .stop{fill:var(--ink-3); font-family:"IBM Plex Mono",monospace; font-size:11px}
.nl .stop.near{fill:var(--core); font-weight:600}
.nl .dot{fill:var(--chal)}
.nl .val{fill:var(--ink); font-family:"Familjen Grotesk",sans-serif; font-size:15px; font-weight:700}
.nl .halfway{stroke:var(--chal); stroke-dasharray:3 3; stroke-width:1.5}
.nl-controls{display:flex; align-items:center; gap:14px; margin-top:6px}
.nl-controls input{flex:1; accent-color:var(--core)}
.nl-out{font-family:"Familjen Grotesk",sans-serif; font-size:15px; font-weight:600; min-width:12.5em; text-align:right}

/* paikka-arvotaulu */
.box .ohje{margin:0 0 14px; font-size:14.5px; color:var(--ink-2)}
.nt-valinta{display:flex; flex-wrap:wrap; gap:7px; margin-bottom:16px}
.nt-valinta button{font:inherit; font-size:12.5px; font-family:"IBM Plex Mono",monospace; padding:5px 11px;
  border-radius:6px; border:1px solid var(--line); background:var(--surface-2); color:var(--ink-2); cursor:pointer}
.nt-valinta button[aria-pressed="true"]{background:var(--ink); color:var(--paper); border-color:var(--ink)}
.nt-valinta button:focus-visible{outline:2px solid var(--core); outline-offset:2px}
.nt-taulu{display:flex; flex-direction:column; gap:4px; align-items:flex-start; overflow-x:auto; padding-bottom:4px}
.nt-rivi{display:flex; gap:6px; align-items:center}
.nt-rivi .otsa{font-family:"IBM Plex Mono",monospace; font-size:9.5px; letter-spacing:.08em;
  text-transform:uppercase; color:var(--ink-3); width:52px; text-align:center}
.nt-ruutu{width:52px; height:52px; display:grid; place-items:center; border:1.5px solid var(--line);
  border-radius:7px; background:var(--surface-2); font-family:"IBM Plex Mono",monospace; font-size:24px}
.nt-ruutu.kohta{border-color:var(--core); background:var(--core-soft); color:var(--core); font-weight:500}
.nt-ruutu.ratkaiseva{border-color:var(--chal); background:var(--chal-soft); color:var(--chal); font-weight:500}
.nt-ruutu.nolla{color:var(--ink-3)}
.nt-rivi .nimi{font-size:12.5px; color:var(--ink-3); margin-left:12px; white-space:nowrap}
.nt-nuoli{font-size:17px; color:var(--chal); margin-left:6px}
.nt-selite{margin:14px 0 0; font-size:14.5px}
.nt-selite b{color:var(--core)}

/* vahvuusportaat */
.vp-tasot{display:grid; gap:9px; margin-bottom:18px}
.vp-taso{display:flex; gap:11px; align-items:flex-start; font-size:13.5px}
.vp-taso .vp-pallo{width:13px; height:13px; border-radius:4px; margin-top:5px; flex:0 0 auto}
.vp-taso[data-taso="sulkeet"] .vp-pallo{background:var(--core)}
.vp-taso[data-taso="kertojako"] .vp-pallo{background:var(--strong)}
.vp-taso[data-taso="yhteenvahennys"] .vp-pallo{background:var(--chal)}
.vp-taso strong{display:block; font-family:"Familjen Grotesk",sans-serif; font-weight:600; font-size:14.5px}
.vp-taso span{color:var(--ink-2)}
.vp-lauseke{display:flex; flex-wrap:wrap; gap:7px; align-items:flex-end; font-family:"IBM Plex Mono",monospace;
  font-size:25px; padding:10px 2px; min-height:64px}
.vp-lauseke .t{padding:2px 3px}
.vp-lauseke .op{position:relative; padding:2px 9px; border-radius:6px; font-weight:500}
.vp-lauseke .op[data-taso="sulkeet"]{background:var(--core-soft); color:var(--core)}
.vp-lauseke .op[data-taso="kertojako"]{background:var(--strong-soft); color:var(--strong)}
.vp-lauseke .op[data-taso="yhteenvahennys"]{background:var(--chal-soft); color:var(--chal)}
.vp-lauseke .op i{position:absolute; top:-9px; right:-6px; font-style:normal; font-family:"Familjen Grotesk",sans-serif;
  font-size:11px; font-weight:700; width:18px; height:18px; border-radius:50%; display:grid; place-items:center;
  background:currentColor}
.vp-lauseke .op i span{color:var(--surface)}
.vp-rivi{display:flex; align-items:center; gap:16px; margin-top:8px}
.vp-vastaus{font-family:"Familjen Grotesk",sans-serif; font-size:16px; font-weight:600; color:var(--strong)}

/* laskujärjestys-widget */
.lj-exp{display:flex; flex-wrap:wrap; gap:7px; align-items:center; font-family:"IBM Plex Mono",monospace;
  font-size:23px; padding:14px 4px; min-height:62px}
.lj-exp .tok{padding:2px 4px; color:var(--ink)}
.lj-exp button.op{font-family:"IBM Plex Mono",monospace; font-size:23px; padding:3px 12px; border-radius:7px;
  border:1.5px solid var(--line); background:var(--surface-2); color:var(--ink); line-height:1.2}
.lj-exp button.op:hover{border-color:var(--core); color:var(--core)}
.lj-exp button.op:focus-visible{outline:2px solid var(--core); outline-offset:2px}
.lj-exp .valmis{font-family:"Familjen Grotesk",sans-serif; font-size:23px; font-weight:700; color:var(--strong)}
.lj-fb{font-size:14.5px; min-height:1.5em; color:var(--ink-2)}
.lj-fb.no{color:var(--alert)}
.lj-fb.ok{color:var(--strong)}
.lj-row{display:flex; align-items:center; gap:14px; margin-top:10px}
.lj-step{font-family:"IBM Plex Mono",monospace; font-size:11.5px; letter-spacing:.1em;
  text-transform:uppercase; color:var(--ink-3)}

/* harjoitukset */
.progress{position:sticky; top:0; z-index:5; background:var(--surface); border:1px solid var(--line);
  border-radius:var(--r); padding:12px 18px; box-shadow:var(--shadow); display:flex; align-items:center;
  gap:14px; margin:34px 0 18px}
.progress .lbl{font-family:"IBM Plex Mono",monospace; font-size:11px; letter-spacing:.12em;
  text-transform:uppercase; color:var(--ink-3); white-space:nowrap}
.progress .meter{flex:1; height:7px; border-radius:4px; background:var(--surface-2); border:1px solid var(--line); overflow:hidden}
.progress .meter i{display:block; height:100%; background:var(--core); transition:width .25s ease}
.progress .cnt{font-family:"Familjen Grotesk",sans-serif; font-weight:700; font-variant-numeric:tabular-nums; white-space:nowrap}

.grp{margin-top:26px}
.grp-head{display:flex; align-items:baseline; gap:10px; border-bottom:1.5px solid var(--ink); padding-bottom:7px; margin-bottom:14px}
.grp-head h3{margin:0; font-size:17px; font-weight:600}
.grp-head span{font-size:12.5px; color:var(--ink-2)}

.ex{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:14px 16px; margin-bottom:10px}
.ex[data-tila="oikein"]{border-color:var(--strong); box-shadow:inset 3px 0 0 var(--strong)}
.ex[data-tila="vaarin"]{border-color:var(--alert); box-shadow:inset 3px 0 0 var(--alert)}
.ex .q{display:flex; gap:11px; align-items:baseline; flex-wrap:wrap}
.ex .num{font-family:"IBM Plex Mono",monospace; font-size:11.5px; color:var(--ink-3); min-width:2.4em}
.ex .txt{flex:1; min-width:190px; font-size:15.5px}
.ex .txt .aineisto{display:block; margin-bottom:9px; padding-left:12px;
  border-left:2px solid var(--line); color:var(--ink-2); line-height:1.6;
  /* Aineisto voi olla pieni taulukko, jonka rivit on erotettu rivinvaihdoilla.
     Ilman pre-lineä ne valuisivat yhdeksi kappaleeksi ja taulukko katoaisi. */
  white-space:pre-line}
.ex .txt .kysymysrivi{display:block; font-weight:600}
.ex .row{display:flex; gap:8px; align-items:center; margin-top:11px; flex-wrap:wrap}
.ex input[type=text]{font:inherit; font-family:"IBM Plex Mono",monospace; font-size:15px; width:8.5em;
  padding:7px 11px; border:1px solid var(--line); border-radius:7px; background:var(--surface-2);
  color:var(--ink); text-align:right}
.ex input:focus-visible{outline:2px solid var(--core); outline-offset:1px}
button{font:inherit; cursor:pointer}
.btn{font-size:13.5px; padding:7px 15px; border-radius:7px; border:1px solid var(--core);
  background:var(--core); color:#fff}
.btn.ghost{background:transparent; color:var(--ink-2); border-color:var(--line)}
.btn:focus-visible{outline:2px solid var(--core); outline-offset:2px}
.btn.mv-valinta{text-align:left}
/* kuuntelutehtävä: selaimen puhesynteesi lukee englanninkielisen tekstin */
.kuuntele{display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin:2px 0 10px}
.kuuntele .btn{display:inline-flex; gap:7px; align-items:center}
.kuuntele svg{width:16px; height:16px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round}
.kuuntele .varateksti{flex-basis:100%; font-size:14px; color:var(--ink-2); background:var(--surface-2);
  border-radius:7px; padding:8px 12px; margin:0}
.btn.mv-valinta:disabled{cursor:default; opacity:.65}
.btn.mv-oikein{background:var(--strong-soft); border-color:var(--strong); color:var(--strong); opacity:1}
.btn.mv-vaarin{background:var(--alert-soft); border-color:var(--alert); color:var(--alert); opacity:1}
.row.mv{gap:8px 10px}
.fb{margin-top:11px; font-size:14.5px; padding:10px 13px; border-radius:8px; line-height:1.5}
.fb.ok{background:var(--strong-soft); color:var(--strong)}
.fb.no{background:var(--alert-soft); color:var(--alert)}
.fb.hint{background:var(--chal-soft); color:var(--chal)}

.done{background:var(--strong-soft); border:1px solid var(--strong); color:var(--strong);
  border-radius:var(--r); padding:16px 20px; margin-top:20px; font-size:15.5px}
.done h3{margin:0 0 4px; font-size:17px; color:var(--strong)}

details.teacher{margin-top:34px; background:var(--surface); border:1px solid var(--line);
  border-left:3px solid var(--chal); border-radius:var(--r); padding:15px 20px; box-shadow:var(--shadow)}
details.teacher summary{cursor:pointer; font-family:"Familjen Grotesk",sans-serif; font-weight:600; font-size:15px}
details.teacher summary:focus-visible{outline:2px solid var(--core); outline-offset:3px}
details.teacher ul{margin:12px 0 0; padding-left:19px; color:var(--ink-2); font-size:14.5px}
details.teacher li{margin-bottom:8px}
details.teacher p{margin:12px 0 0; color:var(--ink-2); font-size:14.5px}

.back{display:inline-block; margin-top:30px; font-size:13.5px; color:var(--ink-2)}
.back a{color:var(--core)}

@media (prefers-reduced-motion: reduce){*{transition:none !important}}
@media (max-width:560px){
  .wrap{padding:16px 13px 70px}
  header.top h1{font-size:25px}
  .progress{flex-wrap:wrap}
}
</style>

<div class="wrap">

  <header class="top">
    <span class="badge"><svg viewBox="0 0 24 24" aria-hidden="true" id="ikoni"></svg></span>
    <div>
      <p class="eyebrow" id="eyebrow"></p>
      <h1 id="otsikko"></h1>
      <p id="kuvaus"></p>
      <div class="tags" id="tags"></div>
    </div>
  </header>

  <article id="teksti"></article>

  <div class="progress" aria-live="polite">
    <span class="lbl">Harjoitukset</span>
    <span class="meter"><i id="pbar" style="width:0%"></i></span>
    <span class="cnt" id="pcnt">0 / 20</span>
  </div>

  <div id="harjoitukset"></div>
  <div id="valmis"></div>

  <p class="back" id="back"></p>

</div>

<script>
const D = {"tavoite_id":"MAT9-YHT-06","oppiaine":"MAT","vuosiluokka":9,"otsikko":"Toinen tuntematon pois","kuvaus":"Osaan ratkaista yhtälöparin laskemalla sijoitus- tai yhteenlaskumenetelmällä.","versio":"0.2","paivitetty":"2026-10-11","ops":{"T":["T14","T15"],"S":["S3"]},"taso":"ydin","ikoni":"tasapaino","eyebrow":"Matematiikka · 9. luokka · Yhtälöt ja epäyhtälöt","teksti":[{"tyyppi":"johdanto","sisalto":"Kahvilan tiskillä Aino maksaa kahdesta sämpylästä ja yhdestä smoothiesta 11 euroa, ja Eetu maksaa yhdestä sämpylästä ja kahdesta smoothiesta 13 euroa. Kun sämpylän hintaa merkitään x:llä ja smoothien hintaa y:llä, tilanteesta saadaan yhtälöpari 2x + y = 11 ja x + 2y = 13. Kumpaakaan hintaa ei saa selville yhdestä yhtälöstä, koska siinä on kaksi tuntematonta. Taidossa Suorien kohtaaminen ratkaisit tällaisen parin piirtämällä: kumpikin yhtälö on suora, ja ratkaisu on niiden leikkauspiste. Piirtämällä saat kuitenkin vain likiarvon: jos leikkauspiste on esimerkiksi (5/3, 7/3), sitä ei voi lukea ruutupaperilta tarkasti. Tässä taidossa ratkaiset yhtälöparin laskemalla. Kahdessa menetelmässä on sama ajatus: toinen tuntematon poistetaan, jolloin jää yksi yhtälö, jossa on yksi tuntematon. Sen ratkaiseminen on sinulle jo tuttua. Kahvilan yhtälöparin ratkaisu on x = 3, y = 5: sämpylä maksaa 3 euroa ja smoothie 5 euroa."},{"tyyppi":"kappale","otsikko":"Ratkaisu on lukupari, ja se tarkistetaan molemmista yhtälöistä","sisalto":"Yhtälöparin ratkaisu on lukupari: x:n arvo ja y:n arvo, jotka toteuttavat molemmat yhtälöt yhtä aikaa. Kahvilan yhtälöparissa lukupari x = 4, y = 3 toteuttaa ylemmän yhtälön, koska 2 · 4 + 3 = 11, mutta ei alempaa, koska 4 + 2 · 3 = 10 eikä 13. Se ei siis ole ratkaisu. Lukupari x = 3, y = 5 toteuttaa molemmat: 2 · 3 + 5 = 11 ja 3 + 2 · 5 = 13. Koordinaatistossa tämä tarkoittaa, että piste (3, 5) on kummallakin suoralla. Kirjoita vastaukseen aina molemmat tuntemattomat, esimerkiksi x = 3, y = 5. Pelkkä x = 3 on puolikas vastaus, koska se ei kerro, missä kohdassa suorat leikkaavat. Tarkista ratkaisu sijoittamalla se molempiin alkuperäisiin yhtälöihin. Yksi yhtälö ei riitä: jos laskit y:n sijoittamalla x:n ylempään yhtälöön, lukupari toteuttaa ylemmän yhtälön joka tapauksessa, myös silloin, kun x on laskettu väärin. Virhe näkyy vasta alemmasta yhtälöstä."},{"tyyppi":"kappale","otsikko":"Sijoitusmenetelmä","sisalto":"Sijoitusmenetelmässä ratkaistaan toisesta yhtälöstä toinen tuntematon ja sijoitetaan saatu lauseke toiseen yhtälöön. Yhtälöpari y = 4x − 7 ja 3x + 2y = 8 on valmiiksi tällainen: ylempi yhtälö kertoo, että y on sama luku kuin 4x − 7. Koska molemmat yhtälöt koskevat samoja lukuja x ja y, alemmassa yhtälössä y:n paikalle saa kirjoittaa sen, mitä y on. Lauseke kirjoitetaan sulkeisiin, koska kerroin 2 kertoo koko lausekkeen: 3x + 2(4x − 7) = 8. Sulkeiden poisto antaa 3x + 8x − 14 = 8, josta 11x = 22 ja x = 2. Toinen tuntematon saadaan sijoittamalla x = 2 yhtälöön, josta y on jo ratkaistu: y = 4 · 2 − 7 = 1. Tarkistus molempiin alkuperäisiin yhtälöihin: 4 · 2 − 7 = 1 ja 3 · 2 + 2 · 1 = 8. Ratkaisu on x = 2, y = 1. Jos kumpaakaan tuntematonta ei ole valmiiksi ratkaistu, ratkaise se, jonka kerroin on 1 tai −1, koska silloin et joudu jakamaan. Yhtälöparissa x + 2y = 7 ja 3x − y = 7 ylemmästä saadaan x = 7 − 2y. Sijoitus alempaan: 3(7 − 2y) − y = 7 eli 21 − 6y − y = 7, josta −7y = −14 ja y = 2. Silloin x = 7 − 2 · 2 = 3. Tarkistus: 3 + 2 · 2 = 7 ja 3 · 3 − 2 = 7."},{"tyyppi":"ansa","otsikko":"Ansa 1: sijoitus ilman sulkeita","sisalto":"Yhtälöparissa 3x − 2y = 4 ja y = 2x − 3 on houkuttelevaa kirjoittaa y:n paikalle pelkkä 2x − 3: 3x − 2 · 2x − 3 = 4. Siitä tulee 3x − 4x − 3 = 4, −x = 7 ja x = −7. Luku −2 kerrottiin kuitenkin vain termillä 2x, vaikka se kertoo koko y:n eli koko lausekkeen 2x − 3. Oikein: 3x − 2(2x − 3) = 4 eli 3x − 4x + 6 = 4, josta −x = −2 ja x = 2. Silloin y = 2 · 2 − 3 = 1. Tarkistus: 3 · 2 − 2 · 1 = 4 ja 2 · 2 − 3 = 1. Kirjoita sijoitettava lauseke aina sulkeisiin, myös silloin, kun kerroin on 1. Kun sulkeiden edessä on negatiivinen luku, sen etumerkki kulkee jokaiseen tuloon, kuten taidossa Sulkeiden takaa."},{"tyyppi":"kappale","otsikko":"Yhteenlaskumenetelmä","sisalto":"Jos a = b ja c = d, niin a + c = b + d: kun yhtä suuriin lukuihin lisätään yhtä suuret luvut, summat ovat yhtä suuret. Siksi yhtälöparin yhtälöt saa laskea puolittain yhteen: vasemmat puolet yhteen ja oikeat puolet yhteen. Siitä on hyötyä, kun jonkin tuntemattoman kertoimet ovat vastaluvut. Yhtälöparissa x + y = 9 ja 3x − y = 7 y-termit ovat y ja −y, joten summassa ne kumoutuvat: 4x = 16 ja x = 4. Toinen tuntematon saadaan sijoittamalla x = 4 jompaankumpaan yhtälöön: 4 + y = 9, joten y = 5. Kun kertoimet eivät ole valmiiksi vastaluvut, yhtälö kerrotaan ensin puolittain sopivalla luvulla. Se on sallittua, koska kun yhtä suuret luvut kerrotaan samalla luvulla, tulot ovat yhtä suuret. Siksi jokainen termi kerrotaan, myös oikea puoli. Yhtälöparissa 2x + 3y = 16 ja x − y = 3 alempi yhtälö kerrotaan kolmella: 3x − 3y = 9. Nyt y-termit ovat 3y ja −3y, ja summa antaa 5x = 25, x = 5 ja 5 − y = 3 eli y = 2. Jos kumpikaan kerroin ei ole toisen monikerta, kerro molemmat yhtälöt: kumpikin kerrotaan toisen yhtälön kertoimen itseisarvolla, kuten alla olevassa esimerkissä. Kun kertoimet ovat samanmerkkiset, esimerkiksi 3y ja 3y, kertojaksi valitaan negatiivinen luku, jotta kertoimista tulee vastaluvut."},{"tyyppi":"taulukko","otsikko":"Esimerkki: 3x + 4y = 2 ja 2x − 3y = 7","otsikkorivi":["Yhtälö","Toimitus","Mitä tapahtui"],"rivit":[["3x + 4y = 2","· 3","y-kertoimet ovat 4 ja −3, joten ylempi kerrotaan kolmella"],["2x − 3y = 7","· 4","ja alempi neljällä, jolloin y-termeistä tulee 12y ja −12y"],["9x + 12y = 6","","jokainen termi kerrottu kolmella, myös oikea puoli"],["8x − 12y = 28","","jokainen termi kerrottu neljällä, myös oikea puoli"],["17x = 34","yhteen","12y ja −12y kumoutuvat"],["x = 2","| : 17","jaetaan x:n kertoimella"],["3 · 2 + 4y = 2","sijoitus","x = 2 sijoitetaan ylempään alkuperäiseen yhtälöön"],["4y = −4, y = −1","| − 6, | : 4","ratkaistaan y"],["3 · 2 + 4 · (−1) = 2 ja 2 · 2 − 3 · (−1) = 7","tarkistus","molemmat alkuperäiset yhtälöt toteutuvat"],["x = 2, y = −1","vastaus","ratkaisu on lukupari"]]},{"tyyppi":"ansa","otsikko":"Ansa 2: kerroin ei kumoudu","sisalto":"Kun yhtälö 3x − 2y = 2 kerrotaan kahdella, on houkuttelevaa kirjoittaa 6x − 4y = 2. Oikea puoli jäi kertomatta, ja yhtälö muuttui toiseksi, koska puolet eivät ole enää yhtä suuret. Oikein: 6x − 4y = 4. Yhtälöparissa 3x − 2y = 2 ja x + 4y = 10 virhe antaa summaksi 7x = 12 ja x = 12/7, vaikka oikea summa 7x = 14 antaa x = 2 ja y = 2. Toinen virhe on laskea yhtälöt yhteen, vaikka kertoimet eivät ole vastaluvut. Yhtälöparissa 2x + 3y = 13 ja 4x + 3y = 17 summa on 6x + 6y = 30, eikä kumpikaan tuntematon hävinnyt. Kerro toinen yhtälö luvulla −1: −4x − 3y = −17. Nyt summa on −2x = −4, joten x = 2 ja 2 · 2 + 3y = 13 eli y = 3. Kertominen luvulla −1 ja yhteenlasku on sama asia kuin yhtälöiden vähentäminen, mutta se näyttää jokaisen etumerkin. Jos vähennät yhtälön suoraan, vähennä jokainen termi: miinus koskee koko yhtälöä, myös oikeaa puolta, eikä vain ensimmäistä termiä."},{"tyyppi":"kappale","otsikko":"Kun molemmat tuntemattomat häviävät","sisalto":"Joskus laskussa häviävät molemmat tuntemattomat. Yhtälöparissa x − 2y = 4 ja −3x + 6y = 2 ylempi kerrotaan kolmella: 3x − 6y = 12. Summa on 0 = 14. Yhtälö 0 = 14 on epätosi, eikä mikään lukupari voi tehdä siitä totta, koska siinä ei ole enää tuntemattomia. Yhtälöparilla ei siis ole ratkaisua. Koordinaatistossa suorat ovat yhdensuuntaiset: kun yhtälöt ratkaistaan y:n suhteen, saadaan y = 1/2 · x − 2 ja y = 1/2 · x + 1/3. Kulmakerroin on sama, vakiotermi eri. Yhtälöparissa 2x + y = 5 ja −6x − 3y = −15 ylempi kerrotaan kolmella: 6x + 3y = 15. Summa on 0 = 0, joka on tosi. Alempi yhtälö on ylempi kerrottuna luvulla −3, joten ne ovat saman yhtälön kaksi muotoa ja esittävät samaa suoraa. Yhtälöparilla on äärettömän monta ratkaisua: jokainen lukupari, joka toteuttaa yhtälön 2x + y = 5, kuten x = 0, y = 5 tai x = 1, y = 3. Sijoitusmenetelmässä käy samoin: sijoituksen jälkeen myös toinen tuntematon häviää, ja jäljelle jää epätosi tai tosi yhtälö, jonka kummallakin puolella on luku. Kun parista 2x + y = 5 ja −6x − 3y = −15 ratkaistaan ylemmästä y = 5 − 2x ja sijoitetaan alempaan, saadaan −6x − 3(5 − 2x) = −15 eli −6x − 15 + 6x = −15, josta −15 = −15. Yhtälö on tosi, joten ratkaisuja on äärettömän monta, aivan kuten yhtälöstä 0 = 0. Samoin epätosi yhtälö kuten −2 = 5 tarkoittaa, ettei ratkaisua ole. Koska yhtälöparin yhtälöt esittävät suoria, ratkaisuja on joko yksi (suorat leikkaavat), ei yhtään (suorat ovat yhdensuuntaiset) tai äärettömän monta (suorat ovat sama suora)."},{"tyyppi":"ansa","otsikko":"Ansa 3: 0 = 0 ei tarkoita, että x = 0","sisalto":"Kun laskusta tulee 0 = 0, vastaukseksi kirjoitetaan helposti x = 0 tai \"ei ratkaisua\". Kumpikin on väärin. Yhtälössä 0 = 0 ei ole x:ää, joten se ei kerro x:n arvoa. Se on tosi, joten jäljelle jää vain yksi ehto, alkuperäinen yhtälö, ja sen toteuttaa äärettömän moni lukupari. Samoin 0 = 14 ei tarkoita, että x = 14: yhtälö on epätosi, joten ratkaisua ei ole. Sama koskee sijoitusmenetelmän tosia ja epätosia yhtälöitä kuten −15 = −15 tai −2 = 5: niissä ei ole tuntemattomia, joten ne eivät kerro x:n arvoa. Kirjoita aina näkyviin syntynyt yhtälö ja sen perään, mitä se tarkoittaa: \"0 = 14 on epätosi, joten yhtälöparilla ei ole ratkaisua\" tai \"0 = 0 on tosi, joten yhtälöt esittävät samaa suoraa ja ratkaisuja on äärettömän monta\"."},{"tyyppi":"saanto","otsikko":"Näin valitset menetelmän ja ratkaiset yhtälöparin","askeleet":["Katso yhtälöparia ennen kuin aloitat. Sijoitusmenetelmä on yleensä suoraviivaisin, kun jokin tuntematon on jo ratkaistu (y = … tai x = …) tai sen kerroin on 1 tai −1. Yhteenlaskumenetelmä on yleensä suoraviivaisin, kun jonkin tuntemattoman kertoimet ovat vastaluvut tai muuttuvat vastaluvuiksi pienellä kertojalla.","Perustele valintasi tällä yhtälöparilla, esimerkiksi \"y on jo ratkaistu ylemmästä yhtälöstä\" tai \"y-termien kertoimet −2 ja 2 ovat vastaluvut\". Molemmat menetelmät antavat saman ratkaisun; valinta vaikuttaa siihen, kuinka paljon laskettavaa on. Jos tehtävä nimeää menetelmän, käytä sitä.","Sijoitus: kirjoita sijoitettava lauseke sulkeisiin. Yhteenlasku: kerro tarvittaessa jokainen termi, myös oikea puoli, ja laske yhtälöt puolittain yhteen.","Ratkaise syntynyt yhtälö, jossa on yksi tuntematon.","Laske toinen tuntematon sijoittamalla saamasi arvo johonkin alkuperäiseen yhtälöön.","Tarkista sijoittamalla lukupari molempiin alkuperäisiin yhtälöihin. Kirjoita vastaukseen molemmat tuntemattomat.","Jos molemmat tuntemattomat häviävät, kirjoita syntynyt yhtälö näkyviin: epätosi yhtälö (kuten 0 = 14 tai sijoituksessa −2 = 5) tarkoittaa, ettei ratkaisua ole, ja tosi yhtälö (kuten 0 = 0 tai sijoituksessa −15 = −15), että ratkaisuja on äärettömän monta."]}],"harjoitusryhmat":[{"id":"sijoitus","nimi":"Sijoitusmenetelmä","info":"Laske ilman laskinta. Kirjoita sijoitettava lauseke sulkeisiin ja välivaiheet vihkoon."},{"id":"yhteenlasku","nimi":"Yhteenlaskumenetelmä","info":"Laske ilman laskinta. Laske yhtälöt puolittain yhteen, kun jonkin tuntemattoman kertoimet ovat vastaluvut. Kerro tarvittaessa ensin jokainen termi, myös oikea puoli."},{"id":"valinta","nimi":"Menetelmän valinta, erikoistapaukset ja tarkistus","info":"Laske ilman laskinta. Kun molemmat tuntemattomat häviävät, katso, onko syntynyt yhtälö tosi vai epätosi. Tarkistus tehdään molempiin alkuperäisiin yhtälöihin."}],"harjoitukset":[{"id":"H01","ryhma":"sijoitus","kysymys":"Kun y = x − 4 sijoitetaan yhtälöön 5x − 3y = 2 ja sulkeet poistetaan, mikä on syntyvän yhtälön vakiotermi vasemmalla puolella?","vastaus":12,"vinkki":"Kirjoita 5x − 3(x − 4) = 2 ja laske (−3) · (−4).","selitys":"5x − 3(x − 4) = 5x − 3x + 12, joten vakiotermi on 12. Vastaus −4 kertoo, että lauseke sijoitettiin ilman sulkeita, ja vastaus −12, että (−3) · (−4) laskettiin negatiiviseksi."},{"id":"H02","ryhma":"sijoitus","kysymys":"Ratkaise yhtälöpari y = 2x + 1 ja 3x + y = 16 sijoitusmenetelmällä. Mikä on x?","vastaus":3,"vinkki":"Sijoita alempaan: 3x + (2x + 1) = 16.","selitys":"3x + (2x + 1) = 16, joten 5x + 1 = 16, 5x = 15 ja x = 3. Toinen tuntematon on y = 2 · 3 + 1 = 7. Tarkistus: 3 · 3 + 7 = 16."},{"id":"H03","ryhma":"sijoitus","kysymys":"Yhtälöparin y = 2x + 1 ja 3x + y = 16 ratkaisussa x = 3. Laske myös y. Mikä on y?","vastaus":7,"vinkki":"Sijoita x = 3 yhtälöön, josta y on jo ratkaistu.","selitys":"y = 2 · 3 + 1 = 7. Tarkistus molemmista: 2 · 3 + 1 = 7 ja 3 · 3 + 7 = 16. Yhtälöparin ratkaisu on x = 3, y = 7. Pelkkä x olisi puolikas vastaus."},{"id":"H04","ryhma":"sijoitus","kysymys":"Ratkaise yhtälöpari y = 5 − 2x ja 5x − 2y = 8 sijoitusmenetelmällä. Mikä on x?","vastaus":2,"vinkki":"Kerro −2 sekä luvulla 5 että termillä −2x.","selitys":"5x − 2(5 − 2x) = 8, joten 5x − 10 + 4x = 8, 9x = 18 ja x = 2. Silloin y = 5 − 4 = 1. Tarkistus: 5 · 2 − 2 · 1 = 8. Vastaus x = 6 syntyy, jos −2 kerrotaan vain luvulla 5, ja vastaus x = 18, jos (−2) · (−2x) lasketaan −4x:ksi."},{"id":"H05","ryhma":"sijoitus","kysymys":"Yhtälöpari x + 3y = 11 ja 2x − 5y = −11. Ratkaise ylemmästä yhtälöstä x ja sijoita se alempaan. Mikä on y?","vastaus":3,"vinkki":"Ylemmästä x = 11 − 3y. Kirjoita alempaan 2(11 − 3y).","selitys":"x = 11 − 3y. Sijoitus: 2(11 − 3y) − 5y = −11, joten 22 − 6y − 5y = −11, −11y = −33 ja y = 3. Silloin x = 11 − 9 = 2. Tarkistus: 2 + 9 = 11 ja 4 − 15 = −11."},{"id":"H06","ryhma":"sijoitus","kysymys":"Ratkaise yhtälöpari x = 3y − 2 ja 2x + y = 10 sijoitusmenetelmällä. Mikä on y?","vastaus":2,"vinkki":"Nyt x on valmiiksi ratkaistu. Sijoita 3y − 2 sulkeissa x:n paikalle.","selitys":"2(3y − 2) + y = 10, joten 6y − 4 + y = 10, 7y = 14 ja y = 2. Silloin x = 3 · 2 − 2 = 4. Tarkistus: 3 · 2 − 2 = 4 ja 2 · 4 + 2 = 10."},{"id":"H07","ryhma":"sijoitus","kysymys":"Ratkaise yhtälöpari y = x + 1 ja 2x + 4y = 1 sijoitusmenetelmällä. Mikä on y? Anna vastaus murtolukuna.","vastaus":0.5,"vinkki":"Sijoita x + 1 sulkeissa: 2x + 4(x + 1) = 1. Ratkaise ensin x.","selitys":"2x + 4(x + 1) = 1, joten 6x + 4 = 1, 6x = −3 ja x = −1/2. Silloin y = −1/2 + 1 = 1/2. Tarkistus: 2 · (−1/2) + 4 · 1/2 = −1 + 2 = 1."},{"id":"H08","ryhma":"yhteenlasku","kysymys":"Yhtälöpari 2x + y = 9 ja 3x − y = 11. Laske yhtälöt puolittain yhteen ja ratkaise. Mikä on x?","vastaus":4,"vinkki":"Termit y ja −y kumoutuvat summassa.","selitys":"Summa: 5x = 20, joten x = 4. Sijoitus ylempään: 8 + y = 9, joten y = 1. Tarkistus alempaan: 12 − 1 = 11."},{"id":"H09","ryhma":"yhteenlasku","kysymys":"Yhtälöpari 2x + 3y = 1 ja x − y = 3. Millä luvulla alempi yhtälö kerrotaan, jotta y-termit kumoutuvat yhteenlaskussa, kun ylempää yhtälöä ei muuteta?","vastaus":3,"vinkki":"Millä luvulla kerrottuna −y on −3y?","selitys":"Ylemmässä on 3y, alemmassa −y. Kun alempi kerrotaan kolmella, siitä tulee 3x − 3y = 9, ja 3y + (−3y) = 0. Summa 5x = 10 antaa x = 2, ja silloin y = −1."},{"id":"H10","ryhma":"yhteenlasku","kysymys":"Yhtälöpari 3x + 2y = 7 ja x + 4y = 9. Ylempi yhtälö kerrotaan luvulla −2, ja yhtälöt lasketaan puolittain yhteen. Mikä on syntyvän yhtälön oikea puoli?","vastaus":-5,"vinkki":"Kerro myös oikea puoli: (−2) · 7.","selitys":"Ylempi kerrottuna luvulla −2 on −6x − 4y = −14. Summa alemman kanssa on −5x = −5, joten oikea puoli on −5. Vastaus 16 kertoo, että ylemmän oikea puoli 7 jäi kertomatta."},{"id":"H11","ryhma":"yhteenlasku","kysymys":"Ratkaise yhtälöpari 3x + 2y = 7 ja x + 4y = 9 yhteenlaskumenetelmällä. Mikä on y?","vastaus":2,"vinkki":"Kerro ylempi luvulla −2, jolloin y-termit ovat −4y ja 4y.","selitys":"−6x − 4y = −14 ja x + 4y = 9 antavat summaksi −5x = −5, joten x = 1. Sijoitus alempaan: 1 + 4y = 9, 4y = 8 ja y = 2. Tarkistus: 3 + 4 = 7 ja 1 + 8 = 9."},{"id":"H12","ryhma":"yhteenlasku","kysymys":"Ratkaise yhtälöpari 5x + 2y = 16 ja 3x + 2y = 12 yhteenlaskumenetelmällä. Mikä on x?","vastaus":2,"vinkki":"y-termit ovat samanmerkkiset. Kerro toinen yhtälö luvulla −1.","selitys":"Alempi kerrottuna luvulla −1 on −3x − 2y = −12. Summa 2x = 4, joten x = 2. Sijoitus: 10 + 2y = 16, joten y = 3. Tarkistus: 6 + 6 = 12. Jos laskit yhtälöt suoraan yhteen, sait 8x + 4y = 28, eikä kumpikaan tuntematon hävinnyt."},{"id":"H13","ryhma":"yhteenlasku","kysymys":"Ratkaise yhtälöpari 2x + 3y = −1 ja 3x − 2y = 18 yhteenlaskumenetelmällä. Mikä on y?","vastaus":-3,"vinkki":"Kerro ylempi kahdella ja alempi kolmella, jolloin y-termit ovat 6y ja −6y.","selitys":"4x + 6y = −2 ja 9x − 6y = 54. Summa 13x = 52, joten x = 4. Sijoitus ylempään: 8 + 3y = −1, 3y = −9 ja y = −3. Tarkistus alempaan: 12 + 6 = 18."},{"id":"H14","ryhma":"yhteenlasku","kysymys":"Yhtälöpari x/2 + y/3 = 3 ja x − y = 1. Kerro ylempi yhtälö luvulla 6 ja ratkaise yhtälöpari. Mikä on x?","vastaus":4,"vinkki":"6 · x/2 = 3x ja 6 · y/3 = 2y. Kerro myös oikea puoli.","selitys":"Ylempi kerrottuna kuudella on 3x + 2y = 18. Alempi kerrottuna kahdella on 2x − 2y = 2. Summa 5x = 20, joten x = 4 ja y = 3. Tarkistus alkuperäisiin: 4/2 + 3/3 = 2 + 1 = 3 ja 4 − 3 = 1."},{"id":"H15","ryhma":"valinta","kysymys":"Kummalla menetelmällä yhtälöpari y = 7 − 2x ja 4x + 3y = 19 ratkeaa suoraviivaisimmin, ja miksi?","vastaus":0,"vinkki":"Katso, onko jokin tuntematon jo ratkaistu.","selitys":"y on jo ratkaistu ylemmästä yhtälöstä, joten sen voi sijoittaa sulkeissa alempaan: 4x + 3(7 − 2x) = 19, josta −2x = −2, x = 1 ja y = 5. Yhteenlaskua varten pitäisi ensin siirtää termejä, eivätkä y-kertoimet 1 ja 3 ole vastaluvut.","tyyppi":"monivalinta","vaihtoehdot":["Sijoitusmenetelmällä, koska y on jo ratkaistu ylemmästä yhtälöstä.","Yhteenlaskumenetelmällä, koska y-termien kertoimet ovat vastaluvut.","Yhteenlaskumenetelmällä, koska molemmissa yhtälöissä on x-termi."]},{"id":"H16","ryhma":"valinta","kysymys":"Kummalla menetelmällä yhtälöpari 5x − 2y = 3 ja 3x + 2y = 13 ratkeaa suoraviivaisimmin, ja miksi?","vastaus":1,"vinkki":"Katso y-termien kertoimia.","selitys":"Termit −2y ja 2y kumoutuvat suoraan: 8x = 16, x = 2 ja 3 · 2 + 2y = 13 eli y = 7/2. Sijoitusta varten pitäisi ensin ratkaista jokin tuntematon, ja jokaisen kerroin on muu kuin 1 tai −1, joten välivaiheisiin tulisi murtolukuja.","tyyppi":"monivalinta","vaihtoehdot":["Sijoitusmenetelmällä, koska y on jo ratkaistu.","Yhteenlaskumenetelmällä, koska y-termien kertoimet −2 ja 2 ovat vastaluvut.","Yhteenlaskumenetelmällä, koska x-termien kertoimet 5 ja 3 ovat vastaluvut."]},{"id":"H17","ryhma":"valinta","kysymys":"Kun yhtälö x − 3y = 3 kerrotaan kolmella ja lasketaan yhteen yhtälön −3x + 9y = 4 kanssa, saadaan yhtälö 0 = a. Mikä on a?","vastaus":13,"vinkki":"Kerro myös oikea puoli: 3 · 3.","selitys":"Ylempi kerrottuna kolmella on 3x − 9y = 9. Summa on 0 = 13. Yhtälö on epätosi, joten yhtälöparilla ei ole ratkaisua: suorat ovat yhdensuuntaiset. Vastaus 7 kertoo, että ylemmän oikea puoli jäi kertomatta."},{"id":"H18","ryhma":"valinta","kysymys":"Yhtälöparit:\n1) x + y = 3 ja 2x + 2y = 6\n2) x − y = 2 ja 3x − 3y = 5\n3) 2x + y = 4 ja x − y = 2\n4) 4x − y = 3 ja −8x + 2y = 1\n\nMontako näistä neljästä yhtälöparista on sellaisia, joilla ei ole ratkaisua?","vastaus":2,"vinkki":"Kerro toinen yhtälö niin, että x-termit kumoutuvat, ja katso, häviääkö myös y. Onko syntynyt yhtälö tosi vai epätosi?","selitys":"Pari 1: alempi on ylempi kerrottuna kahdella, ja lasku antaa 0 = 0, joten ratkaisuja on äärettömän monta. Pari 2: 0 = −1, ei ratkaisua. Pari 3: x = 2, y = 0, yksi ratkaisu. Pari 4: 0 = 7, ei ratkaisua. Ratkaisuttomia on kaksi. Vastaus 3 kertoo, että äärettömän monen ratkaisun pari laskettiin ratkaisuttomaksi."},{"id":"H19","ryhma":"valinta","kysymys":"Ratkaiset yhtälöparia, ja molemmat tuntemattomat häviävät. Saat yhtälön 0 = 0. Mitä se tarkoittaa?","vastaus":2,"vinkki":"Onko yhtälö 0 = 0 tosi vai epätosi? Onko siinä x:ää?","selitys":"Yhtälö 0 = 0 on tosi, eikä siinä ole x:ää eikä y:tä. Alkuperäiset yhtälöt ovat saman yhtälön kaksi muotoa ja esittävät samaa suoraa, joten jokainen suoran piste on ratkaisu. Vastaus x = 0, y = 0 on väärin, koska yhtälö ei kerro tuntemattomien arvoja.","tyyppi":"monivalinta","vaihtoehdot":["Yhtälöparin ratkaisu on x = 0, y = 0.","Yhtälöparilla ei ole ratkaisua.","Yhtälöparilla on äärettömän monta ratkaisua, koska yhtälöt esittävät samaa suoraa."]},{"id":"H20","ryhma":"valinta","kysymys":"Lukupari x = 3, y = −1 toteuttaa yhtälön 2x + 5y = 1. Sijoita se yhtälön 4x − 3y = 13 vasempaan puoleen. Mikä on vasemman puolen arvo?","vastaus":15,"vinkki":"Laske 4 · 3 − 3 · (−1).","selitys":"4 · 3 − 3 · (−1) = 12 + 3 = 15. Koska 15 ≠ 13, lukupari ei toteuta alempaa yhtälöä, eikä se siis ole yhtälöparin ratkaisu, vaikka se toteuttaa ylemmän. Siksi tarkistus tehdään molempiin yhtälöihin."}],"valmis_teksti":"Osaat ratkaista yhtälöparin laskemalla sekä sijoitusmenetelmällä että yhteenlaskumenetelmällä, myös silloin, kun yhtälöt pitää ensin kertoa sopivalla luvulla. Valitset menetelmän perustellen, tarkistat ratkaisun molemmista yhtälöistä ja tunnistat laskusta, milloin yhtälöparilla ei ole ratkaisua tai niitä on äärettömän monta. Tämä taito on nyt näytetty."};

/* ---------- lukusuora ---------- */
const svg=document.getElementById("nlsvg"), rng=document.getElementById("nlrange"), out=document.getElementById("nlout");
const X0=34, X1=606, Y=62;
function piirraNL(v){
  const ala=Math.floor(v/10)*10, yla=ala+10, puoli=ala+5;
  const pyor = (v%10)>=5 ? yla : ala;
  const x = n => X0 + (n/100)*(X1-X0);
  let s=`<line class="rail" x1="${X0}" y1="${Y}" x2="${X1}" y2="${Y}"/>`;
  for(let n=0;n<=100;n+=10){
    const near = (n===ala||n===yla);
    s+=`<line class="tick" x1="${x(n)}" y1="${Y-7}" x2="${x(n)}" y2="${Y+7}"/>`;
    s+=`<text class="stop${near?" near":""}" x="${x(n)}" y="${Y+24}" text-anchor="middle">${n}</text>`;
  }
  s+=`<line class="halfway" x1="${x(puoli)}" y1="${Y-16}" x2="${x(puoli)}" y2="${Y+12}"/>`;
  s+=`<text class="stop" x="${x(puoli)}" y="${Y-22}" text-anchor="middle">puoliväli ${puoli}</text>`;
  s+=`<circle class="dot" cx="${x(v)}" cy="${Y}" r="6"/>`;
  s+=`<text class="val" x="${x(v)}" y="${Y-32}" text-anchor="middle">${v}</text>`;
  s+=`<path d="M ${x(v)} ${Y+38} L ${x(pyor)} ${Y+38}" stroke="var(--core)" stroke-width="2" fill="none"/>`;
  s+=`<path d="M ${x(pyor)} ${Y+38} l ${x(pyor)>x(v)?-7:7} -4 l 0 8 z" fill="var(--core)"/>`;
  svg.innerHTML=s;
  out.textContent = `${v} pyöristyy → ${pyor}`;
}

/* ---------- laskujärjestys-widget ---------- */
const ljExp=document.getElementById("ljExp");
if(ljExp && D.kokeilu){
  let ljI=0, ljTokens=[], ljStep=0;
  const laske=(a,op,b)=>{a=+a;b=+b;return op==="×"?a*b:op==="÷"?a/b:op==="+"?a+b:a-b;};
  function ljAlku(){
    const l=D.kokeilu[ljI];
    ljTokens=l.lauseke.replace(/\(/g,"( ").replace(/\)/g," )").split(/\s+/).filter(Boolean);
    ljStep=0; ljPiirra(); ljViesti("","");
  }
  function ljViesti(t,lk){const f=document.getElementById("ljFb"); f.textContent=t; f.className="lj-fb "+(lk||"");}
  function ljPiirra(){
    const l=D.kokeilu[ljI];
    document.getElementById("ljStep").textContent =
      ljStep>=l.askeleet.length ? "valmis" : `askel ${ljStep+1} / ${l.askeleet.length}`;
    if(ljStep>=l.askeleet.length){
      ljExp.innerHTML=`<span class="valmis">${l.lauseke} = ${l.vastaus}</span>`;
      return;
    }
    ljExp.innerHTML=ljTokens.map((t,i)=>
      "×÷+−".includes(t) ? `<button type="button" class="op" data-i="${i}">${t}</button>`
                         : `<span class="tok">${t}</span>`).join("");
    ljExp.querySelectorAll("button.op").forEach(b=>b.addEventListener("click",()=>ljKlikkaa(+b.dataset.i)));
  }
  function ljKlikkaa(i){
    const l=D.kokeilu[ljI], odotettu=l.askeleet[ljStep];
    const ehdotus=[ljTokens[i-1],ljTokens[i],ljTokens[i+1]].join(" ");
    if(ehdotus!==odotettu){
      ljViesti(ljStep===0
        ? "Ei vielä. Sulkeet ovat vahvimmat, sitten kerto ja jako. Yhtä vahvat vasemmalta oikealle."
        : "Ei vielä. Kumpi jäljellä olevista on vahvempi?", "no");
      return;
    }
    const arvo=laske(ljTokens[i-1],ljTokens[i],ljTokens[i+1]);
    let alku=i-1, loppu=i+1;
    if(ljTokens[i-2]==="(" && ljTokens[i+2]===")"){ alku=i-2; loppu=i+2; }
    ljTokens.splice(alku, loppu-alku+1, String(arvo));
    ljStep++;
    ljViesti(ljStep>=l.askeleet.length ? "Valmis. Vastaus on "+l.vastaus+"." : "Oikein. Jatka seuraavaan.", "ok");
    ljPiirra();
  }
  document.getElementById("ljSeuraava").addEventListener("click",()=>{
    ljI=(ljI+1)%D.kokeilu.length; ljAlku();
  });
  ljAlku();
}

/* Suomalainen lukumuoto: välilyönti on tuhaterotin, pilkku desimaalierotin.
   Piste voi olla kumpi tahansa. Se tulkitaan tuhaterottimeksi VAIN silloin, kun
   koko luku on aitoa tuhaterotinmuotoa: alkuosa 1–3 numeroa ilman etunollaa ja
   jokainen jatko-osa täsmälleen 3 numeroa (1.500, 12.345.678). Kaikissa muissa
   tapauksissa piste on desimaalipiste — myös 0.125, joka vanhalla säännöllä
   ("3 numeroa pisteen jäljessä = tuhaterotin") luettiin virheellisesti luvuksi 125. */
const TUHATEROTIN = /^[1-9]\d{0,2}(\.\d{3})+$/;
function lueLuku(teksti){
  // Murtoluku (3/4, -3/4) ja sekaluku (1 2/3, -1 2/3) hyväksytään sellaisinaan.
  const raaka = String(teksti).replace(/\u00a0/g, " ").trim();
  let m = raaka.match(/^(-?)(\d+)\s+(\d+)\s*\/\s*(\d+)$/);
  if(m){ const nim = Number(m[4]); if(nim === 0) return null;
    const v = Number(m[2]) + Number(m[3]) / nim; return m[1] ? -v : v; }
  m = raaka.match(/^(-?)\s*(\d+)\s*\/\s*(\d+)$/);
  if(m){ const nim = Number(m[3]); if(nim === 0) return null;
    const v = Number(m[2]) / nim; return m[1] ? -v : v; }
  let s = String(teksti).replace(/[\s\u00a0]/g, "");
  if(s === "") return null;
  if(s.indexOf(",") >= 0){
    s = s.replace(/\./g, "").replace(",", ".");
  } else if(TUHATEROTIN.test(s)){
    s = s.replace(/\./g, "");
  }
  const n = Number(s);
  return Number.isFinite(n) ? n : null;
}

function tarkista(id){
  const h=D.harjoitukset.find(x=>x.id===id);
  const kentta=document.getElementById("in-"+id);
  const fb=document.getElementById("fb-"+id);
  if(kentta.value.trim()===""){ fb.className="fb hint"; fb.textContent="Kirjoita vastaus ensin."; return; }
  const luku=lueLuku(kentta.value);
  if(luku===null){ fb.className="fb no"; fb.textContent="Vastauksen pitää olla luku tai murtoluku (esimerkiksi 3/4)."; return; }
  const oikein = Math.abs(luku - h.vastaus) < 1e-9;
  merkitseTulos(id, oikein, oikein ? "Oikein. "+h.selitys : `Ei vielä. ${h.vinkki} Kokeile uudelleen.`);
}

function tarkistaMonivalinta(id, valittuIndeksi, painike){
  const h=D.harjoitukset.find(x=>x.id===id);
  const rivi=painike.closest(".row");
  rivi.querySelectorAll(".mv-valinta").forEach(b=>b.disabled=true);
  const oikein = valittuIndeksi===h.vastaus;
  painike.classList.add(oikein?"mv-oikein":"mv-vaarin");
  if(!oikein){
    const oikeaBtn=rivi.querySelector(`[data-i="${h.vastaus}"]`);
    if(oikeaBtn) oikeaBtn.classList.add("mv-oikein");
  }
  merkitseTulos(id, oikein, oikein ? "Oikein. "+h.selitys : `Ei ihan. Oikea vastaus on korostettu. ${h.selitys||""}`);
}

/* Kuuntelu: selain lukee tekstin ääneen omalla puhesynteesillään (englanniksi, jos laitteessa on
   englanninkielinen ääni). Ei äänitiedostoja eikä verkkoyhteyttä. Jos laite ei osaa puhua,
   teksti näytetään luettavaksi — silloin tehtävä muuttuu luetun ymmärtämiseksi, mutta ei katkea. */
function puhu(id, nopeus){
  const h=D.harjoitukset.find(x=>x.id===id); if(!h || !h.kuuntele) return;
  const vara=document.getElementById("vara-"+id);
  const naytaTeksti=syy=>{ vara.hidden=false; vara.textContent=syy+" Teksti: "+h.kuuntele; };
  if(!("speechSynthesis" in window)){ naytaTeksti("Tämä laite ei osaa lukea ääneen."); return; }
  const s=window.speechSynthesis; s.cancel();
  const u=new SpeechSynthesisUtterance(h.kuuntele);
  u.lang=h.kieli||"en-GB"; u.rate=nopeus;
  const aanet=s.getVoices(), kieli=u.lang.slice(0,2);
  const aani=aanet.find(a=>a.lang===u.lang) || aanet.find(a=>a.lang && a.lang.startsWith(kieli));
  if(aani) u.voice=aani;
  else if(aanet.length) { naytaTeksti("Laitteessa ei ole englanninkielistä ääntä."); return; }
  u.onerror=()=>naytaTeksti("Ääneen lukeminen ei onnistunut.");
  s.speak(u);
}
