<title>Hajallaan vai koolla</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">

<style>
:root{
  --paper:#EFF2F5; --surface:#FFFFFF; --surface-2:#F7F9FB;
  --grid:#DCE3EA; --line:#C9D3DC;
  --ink:#15222C; --ink-2:#4E626F; --ink-3:#7E8F9B;
  --core:#1B5A9E; --core-soft:#E4EDF6;
  --strong:#1F6E5C; --strong-soft:#E1F0EB;
  --chal:#9A6A16; --chal-soft:#F6EDDC;
  --alert:#A33A2B; --alert-soft:#F8E7E3;
  --shadow:0 1px 2px rgba(21,34,44,.06), 0 8px 24px -12px rgba(21,34,44,.18);
  --r:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0F161B; --surface:#18222A; --surface-2:#1D2830;
    --grid:#22303A; --line:#2E3E4A;
    --ink:#E8EFF4; --ink-2:#A3B4C0; --ink-3:#7A8B97;
    --core:#7FB2E4; --core-soft:#16303F;
    --strong:#77CDB4; --strong-soft:#123028;
    --chal:#E0B267; --chal-soft:#33270F;
    --alert:#E8907F; --alert-soft:#3A1E19;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -14px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --paper:#0F161B; --surface:#18222A; --surface-2:#1D2830;
  --grid:#22303A; --line:#2E3E4A;
  --ink:#E8EFF4; --ink-2:#A3B4C0; --ink-3:#7A8B97;
  --core:#7FB2E4; --core-soft:#16303F;
  --strong:#77CDB4; --strong-soft:#123028;
  --chal:#E0B267; --chal-soft:#33270F;
  --alert:#E8907F; --alert-soft:#3A1E19;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -14px rgba(0,0,0,.7);
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:16px; line-height:1.62;
  background-image:
    linear-gradient(to right, var(--grid) 1px, transparent 1px),
    linear-gradient(to bottom, var(--grid) 1px, transparent 1px);
  background-size:26px 26px;
}
.wrap{max-width:760px; margin:0 auto; padding:28px 20px 90px}
h1,h2,h3,h4{font-family:"Familjen Grotesk","IBM Plex Sans",system-ui,sans-serif; text-wrap:balance}

/* header */
header.top{background:var(--surface); border:1px solid var(--line); border-radius:var(--r);
  box-shadow:var(--shadow); padding:22px 24px; display:flex; gap:18px; align-items:flex-start}
.badge{flex:0 0 auto; width:54px; height:54px; border-radius:9px; display:grid; place-items:center;
  background:var(--core-soft); border:1px solid var(--core); color:var(--core)}
.badge svg{width:28px; height:28px; fill:none; stroke:currentColor; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round}
.eyebrow{font-family:"IBM Plex Mono",monospace; font-size:11px; letter-spacing:.14em;
  text-transform:uppercase; color:var(--ink-3); margin:0 0 5px}
header.top h1{margin:0; font-size:30px; font-weight:700; letter-spacing:-.015em}
header.top p{margin:5px 0 0; color:var(--ink-2); font-size:15px}
.tags{display:flex; flex-wrap:wrap; gap:5px; margin-top:11px}
.tag{font-family:"IBM Plex Mono",monospace; font-size:10.5px; letter-spacing:.05em; padding:2px 7px;
  border-radius:4px; background:var(--surface-2); border:1px solid var(--line); color:var(--ink-3)}
.tag.core{background:var(--core-soft); border-color:var(--core); color:var(--core)}

/* teksti */
article{margin-top:26px}
article h2{font-size:21px; font-weight:600; margin:32px 0 10px; letter-spacing:-.01em}
article p{margin:0 0 14px; max-width:64ch}
.lead{font-size:17.5px; color:var(--ink); border-left:3px solid var(--core); padding-left:16px; margin:0 0 8px}

.box{background:var(--surface); border:1px solid var(--line); border-radius:var(--r);
  padding:18px 22px; box-shadow:var(--shadow); margin:22px 0}
.box h3{margin:0 0 12px; font-size:16.5px; font-weight:600}
.box.warn{border-left:3px solid var(--alert)}
.box.note{border-left:3px solid var(--chal)}

ol.steps{margin:0; padding-left:0; list-style:none; counter-reset:s; display:grid; gap:12px}
ol.steps li{counter-increment:s; display:grid; grid-template-columns:auto 1fr; gap:13px; align-items:start}
ol.steps li::before{content:counter(s); font-family:"Familjen Grotesk",sans-serif; font-weight:700; font-size:14px;
  width:26px; height:26px; border-radius:50%; background:var(--core); color:#fff; display:grid; place-items:center; margin-top:2px}

ul.notes{margin:0; padding-left:19px}
ul.notes li{margin-bottom:7px}
ul.notes li:last-child{margin-bottom:0}

.tablewrap{overflow-x:auto}
table{border-collapse:collapse; width:100%; font-size:14.5px; min-width:460px}
th,td{text-align:left; padding:9px 13px; border-bottom:1px solid var(--line)}
th{font-family:"IBM Plex Mono",monospace; font-size:10.5px; letter-spacing:.1em; text-transform:uppercase;
  color:var(--ink-3); font-weight:400; background:var(--surface-2)}
tr:last-child td{border-bottom:0}
td b{color:var(--core); font-weight:600}
td:last-child{font-variant-numeric:tabular-nums; font-weight:600}

/* lukusuora */
.nl svg{width:100%; height:118px; display:block}
.nl .rail{stroke:var(--line); stroke-width:2}
.nl .tick{stroke:var(--line); stroke-width:1.5}
.nl .stop{fill:var(--ink-3); font-family:"IBM Plex Mono",monospace; font-size:11px}
.nl .stop.near{fill:var(--core); font-weight:600}
.nl .dot{fill:var(--chal)}
.nl .val{fill:var(--ink); font-family:"Familjen Grotesk",sans-serif; font-size:15px; font-weight:700}
.nl .halfway{stroke:var(--chal); stroke-dasharray:3 3; stroke-width:1.5}
.nl-controls{display:flex; align-items:center; gap:14px; margin-top:6px}
.nl-controls input{flex:1; accent-color:var(--core)}
.nl-out{font-family:"Familjen Grotesk",sans-serif; font-size:15px; font-weight:600; min-width:12.5em; text-align:right}

/* paikka-arvotaulu */
.box .ohje{margin:0 0 14px; font-size:14.5px; color:var(--ink-2)}
.nt-valinta{display:flex; flex-wrap:wrap; gap:7px; margin-bottom:16px}
.nt-valinta button{font:inherit; font-size:12.5px; font-family:"IBM Plex Mono",monospace; padding:5px 11px;
  border-radius:6px; border:1px solid var(--line); background:var(--surface-2); color:var(--ink-2); cursor:pointer}
.nt-valinta button[aria-pressed="true"]{background:var(--ink); color:var(--paper); border-color:var(--ink)}
.nt-valinta button:focus-visible{outline:2px solid var(--core); outline-offset:2px}
.nt-taulu{display:flex; flex-direction:column; gap:4px; align-items:flex-start; overflow-x:auto; padding-bottom:4px}
.nt-rivi{display:flex; gap:6px; align-items:center}
.nt-rivi .otsa{font-family:"IBM Plex Mono",monospace; font-size:9.5px; letter-spacing:.08em;
  text-transform:uppercase; color:var(--ink-3); width:52px; text-align:center}
.nt-ruutu{width:52px; height:52px; display:grid; place-items:center; border:1.5px solid var(--line);
  border-radius:7px; background:var(--surface-2); font-family:"IBM Plex Mono",monospace; font-size:24px}
.nt-ruutu.kohta{border-color:var(--core); background:var(--core-soft); color:var(--core); font-weight:500}
.nt-ruutu.ratkaiseva{border-color:var(--chal); background:var(--chal-soft); color:var(--chal); font-weight:500}
.nt-ruutu.nolla{color:var(--ink-3)}
.nt-rivi .nimi{font-size:12.5px; color:var(--ink-3); margin-left:12px; white-space:nowrap}
.nt-nuoli{font-size:17px; color:var(--chal); margin-left:6px}
.nt-selite{margin:14px 0 0; font-size:14.5px}
.nt-selite b{color:var(--core)}

/* vahvuusportaat */
.vp-tasot{display:grid; gap:9px; margin-bottom:18px}
.vp-taso{display:flex; gap:11px; align-items:flex-start; font-size:13.5px}
.vp-taso .vp-pallo{width:13px; height:13px; border-radius:4px; margin-top:5px; flex:0 0 auto}
.vp-taso[data-taso="sulkeet"] .vp-pallo{background:var(--core)}
.vp-taso[data-taso="kertojako"] .vp-pallo{background:var(--strong)}
.vp-taso[data-taso="yhteenvahennys"] .vp-pallo{background:var(--chal)}
.vp-taso strong{display:block; font-family:"Familjen Grotesk",sans-serif; font-weight:600; font-size:14.5px}
.vp-taso span{color:var(--ink-2)}
.vp-lauseke{display:flex; flex-wrap:wrap; gap:7px; align-items:flex-end; font-family:"IBM Plex Mono",monospace;
  font-size:25px; padding:10px 2px; min-height:64px}
.vp-lauseke .t{padding:2px 3px}
.vp-lauseke .op{position:relative; padding:2px 9px; border-radius:6px; font-weight:500}
.vp-lauseke .op[data-taso="sulkeet"]{background:var(--core-soft); color:var(--core)}
.vp-lauseke .op[data-taso="kertojako"]{background:var(--strong-soft); color:var(--strong)}
.vp-lauseke .op[data-taso="yhteenvahennys"]{background:var(--chal-soft); color:var(--chal)}
.vp-lauseke .op i{position:absolute; top:-9px; right:-6px; font-style:normal; font-family:"Familjen Grotesk",sans-serif;
  font-size:11px; font-weight:700; width:18px; height:18px; border-radius:50%; display:grid; place-items:center;
  background:currentColor}
.vp-lauseke .op i span{color:var(--surface)}
.vp-rivi{display:flex; align-items:center; gap:16px; margin-top:8px}
.vp-vastaus{font-family:"Familjen Grotesk",sans-serif; font-size:16px; font-weight:600; color:var(--strong)}

/* laskujärjestys-widget */
.lj-exp{display:flex; flex-wrap:wrap; gap:7px; align-items:center; font-family:"IBM Plex Mono",monospace;
  font-size:23px; padding:14px 4px; min-height:62px}
.lj-exp .tok{padding:2px 4px; color:var(--ink)}
.lj-exp button.op{font-family:"IBM Plex Mono",monospace; font-size:23px; padding:3px 12px; border-radius:7px;
  border:1.5px solid var(--line); background:var(--surface-2); color:var(--ink); line-height:1.2}
.lj-exp button.op:hover{border-color:var(--core); color:var(--core)}
.lj-exp button.op:focus-visible{outline:2px solid var(--core); outline-offset:2px}
.lj-exp .valmis{font-family:"Familjen Grotesk",sans-serif; font-size:23px; font-weight:700; color:var(--strong)}
.lj-fb{font-size:14.5px; min-height:1.5em; color:var(--ink-2)}
.lj-fb.no{color:var(--alert)}
.lj-fb.ok{color:var(--strong)}
.lj-row{display:flex; align-items:center; gap:14px; margin-top:10px}
.lj-step{font-family:"IBM Plex Mono",monospace; font-size:11.5px; letter-spacing:.1em;
  text-transform:uppercase; color:var(--ink-3)}

/* harjoitukset */
.progress{position:sticky; top:0; z-index:5; background:var(--surface); border:1px solid var(--line);
  border-radius:var(--r); padding:12px 18px; box-shadow:var(--shadow); display:flex; align-items:center;
  gap:14px; margin:34px 0 18px}
.progress .lbl{font-family:"IBM Plex Mono",monospace; font-size:11px; letter-spacing:.12em;
  text-transform:uppercase; color:var(--ink-3); white-space:nowrap}
.progress .meter{flex:1; height:7px; border-radius:4px; background:var(--surface-2); border:1px solid var(--line); overflow:hidden}
.progress .meter i{display:block; height:100%; background:var(--core); transition:width .25s ease}
.progress .cnt{font-family:"Familjen Grotesk",sans-serif; font-weight:700; font-variant-numeric:tabular-nums; white-space:nowrap}

.grp{margin-top:26px}
.grp-head{display:flex; align-items:baseline; gap:10px; border-bottom:1.5px solid var(--ink); padding-bottom:7px; margin-bottom:14px}
.grp-head h3{margin:0; font-size:17px; font-weight:600}
.grp-head span{font-size:12.5px; color:var(--ink-2)}

.ex{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:14px 16px; margin-bottom:10px}
.ex[data-tila="oikein"]{border-color:var(--strong); box-shadow:inset 3px 0 0 var(--strong)}
.ex[data-tila="vaarin"]{border-color:var(--alert); box-shadow:inset 3px 0 0 var(--alert)}
.ex .q{display:flex; gap:11px; align-items:baseline; flex-wrap:wrap}
.ex .num{font-family:"IBM Plex Mono",monospace; font-size:11.5px; color:var(--ink-3); min-width:2.4em}
.ex .txt{flex:1; min-width:190px; font-size:15.5px}
.ex .txt .aineisto{display:block; margin-bottom:9px; padding-left:12px;
  border-left:2px solid var(--line); color:var(--ink-2); line-height:1.6;
  /* Aineisto voi olla pieni taulukko, jonka rivit on erotettu rivinvaihdoilla.
     Ilman pre-lineä ne valuisivat yhdeksi kappaleeksi ja taulukko katoaisi. */
  white-space:pre-line}
.ex .txt .kysymysrivi{display:block; font-weight:600}
.ex .row{display:flex; gap:8px; align-items:center; margin-top:11px; flex-wrap:wrap}
.ex input[type=text]{font:inherit; font-family:"IBM Plex Mono",monospace; font-size:15px; width:8.5em;
  padding:7px 11px; border:1px solid var(--line); border-radius:7px; background:var(--surface-2);
  color:var(--ink); text-align:right}
.ex input:focus-visible{outline:2px solid var(--core); outline-offset:1px}
button{font:inherit; cursor:pointer}
.btn{font-size:13.5px; padding:7px 15px; border-radius:7px; border:1px solid var(--core);
  background:var(--core); color:#fff}
.btn.ghost{background:transparent; color:var(--ink-2); border-color:var(--line)}
.btn:focus-visible{outline:2px solid var(--core); outline-offset:2px}
.btn.mv-valinta{text-align:left}
/* kuuntelutehtävä: selaimen puhesynteesi lukee englanninkielisen tekstin */
.kuuntele{display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin:2px 0 10px}
.kuuntele .btn{display:inline-flex; gap:7px; align-items:center}
.kuuntele svg{width:16px; height:16px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round}
.kuuntele .varateksti{flex-basis:100%; font-size:14px; color:var(--ink-2); background:var(--surface-2);
  border-radius:7px; padding:8px 12px; margin:0}
.btn.mv-valinta:disabled{cursor:default; opacity:.65}
.btn.mv-oikein{background:var(--strong-soft); border-color:var(--strong); color:var(--strong); opacity:1}
.btn.mv-vaarin{background:var(--alert-soft); border-color:var(--alert); color:var(--alert); opacity:1}
.row.mv{gap:8px 10px}
.fb{margin-top:11px; font-size:14.5px; padding:10px 13px; border-radius:8px; line-height:1.5}
.fb.ok{background:var(--strong-soft); color:var(--strong)}
.fb.no{background:var(--alert-soft); color:var(--alert)}
.fb.hint{background:var(--chal-soft); color:var(--chal)}

.done{background:var(--strong-soft); border:1px solid var(--strong); color:var(--strong);
  border-radius:var(--r); padding:16px 20px; margin-top:20px; font-size:15.5px}
.done h3{margin:0 0 4px; font-size:17px; color:var(--strong)}

details.teacher{margin-top:34px; background:var(--surface); border:1px solid var(--line);
  border-left:3px solid var(--chal); border-radius:var(--r); padding:15px 20px; box-shadow:var(--shadow)}
details.teacher summary{cursor:pointer; font-family:"Familjen Grotesk",sans-serif; font-weight:600; font-size:15px}
details.teacher summary:focus-visible{outline:2px solid var(--core); outline-offset:3px}
details.teacher ul{margin:12px 0 0; padding-left:19px; color:var(--ink-2); font-size:14.5px}
details.teacher li{margin-bottom:8px}
details.teacher p{margin:12px 0 0; color:var(--ink-2); font-size:14.5px}

.back{display:inline-block; margin-top:30px; font-size:13.5px; color:var(--ink-2)}
.back a{color:var(--core)}

@media (prefers-reduced-motion: reduce){*{transition:none !important}}
@media (max-width:560px){
  .wrap{padding:16px 13px 70px}
  header.top h1{font-size:25px}
  .progress{flex-wrap:wrap}
}
</style>

<div class="wrap">

  <header class="top">
    <span class="badge"><svg viewBox="0 0 24 24" aria-hidden="true" id="ikoni"></svg></span>
    <div>
      <p class="eyebrow" id="eyebrow"></p>
      <h1 id="otsikko"></h1>
      <p id="kuvaus"></p>
      <div class="tags" id="tags"></div>
    </div>
  </header>

  <article id="teksti"></article>

  <div class="progress" aria-live="polite">
    <span class="lbl">Harjoitukset</span>
    <span class="meter"><i id="pbar" style="width:0%"></i></span>
    <span class="cnt" id="pcnt">0 / 20</span>
  </div>

  <div id="harjoitukset"></div>
  <div id="valmis"></div>

  <p class="back" id="back"></p>

</div>

<script>
const D = {"tavoite_id":"MAT9-TIL-04","oppiaine":"MAT","vuosiluokka":9,"taso":"ydin","otsikko":"Hajallaan vai koolla","kuvaus":"Osaan määrittää keskihajonnan laskimella tai taulukkolaskentaohjelmalla ja tulkita, mitä hajonta kertoo aineistosta.","versio":"0.2","paivitetty":"2026-10-11","ops":{"T":["T8","T9","T19"],"S":["S6"]},"ikoni":"mittari","eyebrow":"Matematiikka · 9. luokka · Tilastot ja todennäköisyys","teksti":[{"tyyppi":"johdanto","sisalto":"Kouluun pääsee kahdella bussilinjalla, ja kummallakin matka kestää keskimäärin 20 minuuttia. Kirjasit kahdeksan matkan ajat minuutteina. Linja 1: 19, 21, 20, 22, 18, 20, 21, 19. Linja 2: 12, 27, 16, 25, 20, 14, 28, 18. Keskiarvo on molemmilla 160 : 8 = 20, mutta jos koe alkaa tasan kahdeksalta, linjat eivät ole yhtä hyviä. Linjan 1 matkat ovat aina lähellä 20 minuuttia, linjan 2 matka voi kestää 12 minuuttia tai lähes puoli tuntia. Keskiarvo kertoo aineiston keskikohdan mutta ei sitä, kuinka hajallaan havainnot ovat sen ympärillä. Tässä taidossa opit keskihajonnan, joka kertoo juuri tämän yhdellä luvulla. Opit määrittämään sen laskimen tilastotoiminnolla, myös frekvenssitaulukosta, ja vertailemaan kahta aineistoa keskiarvon ja keskihajonnan avulla."},{"tyyppi":"kappale","otsikko":"Mitä keskihajonta kertoo","sisalto":"Keskihajonta kuvaa, kuinka paljon havainnot tyypillisesti poikkeavat keskiarvosta. Johdannon linjan 1 keskihajonta on noin 1,2 minuuttia ja linjan 2 noin 5,7 minuuttia. Linjan 1 matka-ajat poikkeavat keskiarvosta 20 minuuttia siis tyypillisesti noin minuutin, linjan 2 lähes kuusi minuuttia. Mitä suurempi keskihajonta, sitä hajallaan havainnot ovat; mitä pienempi, sitä koolla ne ovat keskiarvon ympärillä. Keskihajonta on aina vähintään 0. Se on 0 vain silloin, kun kaikki havainnot ovat samoja, koska silloin mikään havainto ei poikkea keskiarvosta. Keskihajonnalla on sama yksikkö kuin havainnoilla: minuuteista saadaan minuutteja, senttimetreistä senttimetrejä ja pisteistä pisteitä. Kokeessa kirjoita yksikkö luvun perään: 1,2 min. Tämän sivun harjoituksissa vastaus annetaan pelkkänä lukuna, koska sivu tarkistaa vain luvun; yksikkö on silti osa vastausta."},{"tyyppi":"kappale","otsikko":"Mistä luku tulee","sisalto":"Keskihajonta lasketaan poikkeamista keskiarvosta. Idean näkee pienestä aineistosta −2, −1, 0, 1, 2, jonka keskiarvo on 0. Poikkeamat keskiarvosta ovat samat luvut −2, −1, 0, 1 ja 2. Niiden summa on 0, ja niin käy jokaisessa aineistossa: keskiarvon yläpuolella olevat poikkeamat kumoavat alapuolella olevat. Siksi poikkeamat korotetaan ensin toiseen potenssiin, jolloin mikään niistä ei ole negatiivinen: 4, 1, 0, 1, 4. Neliöiden keskiarvo on 10 : 5 = 2, ja siitä otetaan neliöjuuri: √2 ≈ 1,4. Neliöjuuri palauttaa luvun havaintojen yksikköön, sillä senttimetrien neliöt olisivat neliösenttimetrejä. Tätä laskua sinun ei tarvitse tehdä, koska laskin tekee sen. Idea selittää kuitenkin, miksi keskihajonta ei voi olla negatiivinen ja miksi sen yksikkö on sama kuin havainnoilla. Se selittää myös sanan tyypillisesti: havaintojen etäisyydet keskiarvosta ovat 2, 1, 0, 1 ja 2, ja niiden keskiarvo on 1,2. Keskihajonta 1,4 on samaa suuruusluokkaa mutta vähän suurempi, koska suuret poikkeamat painavat neliöinä enemmän."},{"tyyppi":"saanto","otsikko":"Keskihajonta laskimen tilastotoiminnolla","askeleet":["Valitse laskimen tilastotila (usein STAT tai SD) ja tyhjennä vanhat luvut. Laskimet eroavat toisistaan, joten katso oman laskimesi ohjeesta, missä tila ja keskihajonta ovat.","Syötä havainnot yksi kerrallaan. Toistuva luku syötetään niin monta kertaa kuin se esiintyy: aineistossa 4, 7, 7, 8, 9, 13 luku 7 syötetään kahdesti, ja lukuja on kuusi.","Frekvenssitaulukosta syötät jokaisen arvon niin monta kertaa kuin frekvenssi kertoo, tai otat käyttöön laskimen frekvenssisarakkeen ja kirjoitat frekvenssin arvon viereen. Taulukosta, jossa pituudet 160, 161, 162 ja 163 cm esiintyvät 1, 3, 4 ja 2 kertaa, syötät kymmenen lukua.","Valitse populaatiokeskihajonta: σ- tai σn-näppäin (joissakin laskimissa σx). Samassa valikossa on usein myös s- tai σn−1-näppäin (sx), joka antaa otoskeskihajonnan. Se on eri luku, ja tässä taidossa se on väärä vastaus. Aineistolle 4, 7, 7, 8, 9, 13 oikea toiminto antaa 2,708… ≈ 2,7 ja väärä 2,966… ≈ 3,0.","Tarkista toiminto luvuilla −2, −1, 0, 1, 2. Oikea antaa 1,414…, sama kuin √2 edellä. Jos laskin näyttää 1,581…, olet valinnut otoskeskihajonnan.","Tarkista syöttö havaintojen määrästä. Laskin näyttää yleensä myös luvun n. Frekvenssitaulukossa sen pitää olla frekvenssien summa, edellä 1 + 3 + 4 + 2 = 10. Jos n on 4, syötit vain arvot.","Pyöristä vasta lopuksi pyydettyyn tarkkuuteen ja kirjoita yksikkö: pituuksien keskihajonta on 0,90 cm.","Taulukkolaskentaohjelmassa sama luku saadaan funktiolla KESKIHAJONTA.P. Pelkkä KESKIHAJONTA antaa otoskeskihajonnan, kuten laskimen s-näppäin."]},{"tyyppi":"kappale","otsikko":"Kun jokaiseen havaintoon lisätään sama luku","sisalto":"Linjan 1 reitillä alkaa tietyö, ja jokainen matka kestää viisi minuuttia aiempaa kauemmin: 24, 26, 25, 27, 23, 25, 26, 24. Keskiarvo kasvaa viidellä 25 minuuttiin, mutta keskihajonta on edelleen noin 1,2 min. Syy on se, että keskihajonta lasketaan poikkeamista keskiarvosta. Kun jokainen havainto ja keskiarvo siirtyvät saman verran, jokaisen havainnon etäisyys keskiarvosta pysyy samana. Havainnot ovat yhtä hajallaan kuin ennen, vain eri kohdassa lukusuoraa. Sama pätee vähentämiseen. Jos tiedät keskiarvon ja keskihajonnan ja jokaiseen havaintoon lisätään sama luku, uusi keskiarvo saadaan lisäämällä luku keskiarvoon, ja keskihajonta pysyy ennallaan."},{"tyyppi":"kappale","otsikko":"Kahden aineiston vertailu","sisalto":"Kun vertaat kahta aineistoa, määritä molempien keskiarvo ja keskihajonta ja kerro tilanteen sanoin, mitä ne tarkoittavat. Johdannon linjoista voi kirjoittaa näin: Kummankin linjan matka kestää keskimäärin 20 minuuttia. Linjan 1 keskihajonta on 1,2 min ja linjan 2 5,7 min. Linjan 2 matka-ajat poikkeavat keskiarvosta tyypillisesti lähes kuusi minuuttia, linjan 1 vain noin minuutin, joten linjan 1 matka-aika on paljon tasaisempi. Keskiarvo kuvaa tyypillistä havaintoa sitä paremmin, mitä pienempi keskihajonta on: linjan 1 tavallinen matka kestää todella noin 20 minuuttia, linjan 2 matka vain harvoin. Keskiarvo ja keskihajonta kertovat eri asioista. Keskiarvo kertoo, missä aineiston keskikohta on, ja keskihajonta, kuinka hajallaan havainnot ovat sen ympärillä. Toisesta ei voi päätellä toista: aineiston 50, 50, 50 keskiarvo on 50 ja keskihajonta 0, aineiston 1, 5, 9 keskiarvo 5 ja keskihajonta noin 3,3. Seitsemännellä luokalla opittu vaihteluvälin pituus kertoo vain suurimman ja pienimmän havainnon erotuksen, keskihajonnassa on mukana jokainen havainto."},{"tyyppi":"taulukko","otsikko":"Sama keskiarvo, eri hajonta","otsikkorivi":["Aineisto","Keskiarvo","Keskihajonta (σ)","Mitä se kertoo"],"rivit":[["10, 10, 10, 10","10","0","Kaikki havainnot ovat samoja."],["9, 10, 10, 11","10","0,7","Havainnot ovat koolla keskiarvon ympärillä."],["6, 8, 12, 14","10","3,2","Havainnot poikkeavat keskiarvosta tyypillisesti noin kolme."],["2, 6, 14, 18","10","6,3","Havainnot ovat hajallaan; keskiarvo kuvaa niitä huonosti."]]},{"tyyppi":"ansa","otsikko":"Ansa 1: väärä näppäin tai unohtuneet frekvenssit","sisalto":"Aineiston 4, 7, 7, 8, 9, 13 keskihajonta on 2,7. Jos laskin näyttää 3,0, olet painanut s- tai σn−1-näppäintä. Ero ei ole pyöristysvirhe vaan eri tunnusluku, joten vastaus on väärä. Toinen virhe syntyy frekvenssitaulukosta. Jos syötät pituuksista vain arvot 160, 161, 162 ja 163, laskin laskee neljän havainnon keskihajonnan, noin 1,12 cm, vaikka oikea on 0,90 cm. Frekvenssit kertovat, montako kertaa kukin arvo on aineistossa, ja jokainen kerta on oma havaintonsa. Tarkista siksi aina luku n."},{"tyyppi":"ansa","otsikko":"Ansa 2: keskihajonnan paikalla jokin muu luku","sisalto":"Aineiston 4, 7, 7, 8, 9, 13 keskihajonta ei ole 9, joka on vaihteluvälin pituus 13 − 4, eikä 8, joka on keskiarvo. Kumpikin on oikein laskettu luku väärään kysymykseen. Kolmas virhe koskee vakion lisäämistä. Jos keskihajonta on 2,7 ja jokaiseen havaintoon lisätään 5, uusi keskihajonta on edelleen 2,7, ei 7,7: havainnot siirtyvät, mutta eivät levity. Neljäs virhe on yksikkö. Pituuksien keskihajonta on senttimetrejä, ei neliösenttimetrejä, vaikka laskin käyttää neliöitä välivaiheena, ja pelkkä 2,7 ilman yksikköä ei kerro, mitä mitattiin."},{"tyyppi":"ansa","otsikko":"Ansa 3: sama keskiarvo ei tarkoita samanlaista aineistoa","sisalto":"Bussilinjoilla on sama keskiarvo 20 minuuttia, mutta toisella myöhästyt helposti ja toisella et. Päätelmä ”keskiarvot ovat samat, joten aineistot ovat samanlaiset” on väärä, koska keskiarvo ei kerro hajonnasta mitään. Yhtä väärä on päätelmä ”suurempi keskiarvo, siis suurempi hajonta”. Ryhmän, jonka pisteet ovat 29, 30, 30, 31, keskiarvo on suuri ja keskihajonta pieni, alle 1 piste, kun taas ryhmän 2, 10, 18 keskiarvo on pieni ja keskihajonta yli 6 pistettä. Vertaa siis aina kumpaakin tunnuslukua erikseen ja kerro, mitä kumpikin tarkoittaa."}],"harjoitusryhmat":[{"id":"laskin","nimi":"Keskihajonta laskimella","info":"Laskin on sallittu. Käytä tilastotoiminnon σ- tai σn-näppäintä (populaatiokeskihajonta); s- tai σn−1-näppäin antaa eri luvun. Syötä toistuvat luvut niin monta kertaa kuin ne esiintyvät ja frekvenssitaulukosta jokainen arvo frekvenssin verran. Kirjoita vastaukseen pelkkä luku ilman yksikköä."},{"id":"kasite","nimi":"Mitä keskihajonta kertoo","info":"Laskin on sallittu. Käytä tilastotoiminnon σ- tai σn-näppäintä (populaatiokeskihajonta); s- tai σn−1-näppäin antaa eri luvun. Osan tehtävistä voit ratkaista ilman laskinta: mieti, miten paljon havainnot poikkeavat keskiarvosta. Kirjoita vastaukseen pelkkä luku ilman yksikköä."},{"id":"vertailu","nimi":"Kahden aineiston vertailu","info":"Laskin on sallittu. Käytä tilastotoiminnon σ- tai σn-näppäintä (populaatiokeskihajonta); s- tai σn−1-näppäin antaa eri luvun. Vertaa keskiarvoa ja keskihajontaa erikseen: sama keskiarvo ei tarkoita samaa hajontaa. Kirjoita vastaukseen pelkkä luku ilman yksikköä."}],"harjoitukset":[{"id":"H01","ryhma":"laskin","kysymys":"Viiden kaverin lukemiseen käyttämät tunnit viikon aikana.\nLukutunnit (h): 9, 14, 5, 13, 9\n\nLaske lukutuntien keskihajonta kymmenesosan tarkkuudella.","vastaus":3.2,"vinkki":"Syötä kaikki viisi lukua, myös kahdesti esiintyvä 9. Valitse σ- tai σn-näppäin.","selitys":"Laskimen σ-toiminto antaa 3,224…, joten keskihajonta on noin 3,2 h. Lukutunnit poikkeavat keskiarvosta 10 h tyypillisesti noin kolme tuntia. Vastaus 3,6 tulee s-näppäimestä, joka antaa otoskeskihajonnan.","tyyppi":"luku"},{"id":"H02","ryhma":"laskin","kysymys":"Kuuden lentopalloilijan pituudet.\nPituudet (cm): 170, 153, 172, 164, 155, 173\n\nLaske pituuksien keskihajonta kymmenesosan tarkkuudella.","vastaus":8.0,"vinkki":"Syötä kuusi lukua ja valitse populaatiokeskihajonta. Pyöristä kymmenesosiin.","selitys":"Laskin antaa 7,973…, joten keskihajonta on noin 8,0 cm. Vastaukseksi kelpaa 8 tai 8,0. Otoskeskihajonta olisi noin 8,7 cm.","tyyppi":"luku"},{"id":"H03","ryhma":"laskin","kysymys":"Viiden melonin massat.\nMassat (kg): 1,9; 1,4; 2,2; 1,5; 2,0\n\nLaske massojen keskihajonta kahden desimaalin tarkkuudella.","vastaus":0.3,"vinkki":"Desimaaliluvut syötetään laskimeen pisteellä tai pilkulla laskimesi mukaan. Pyöristä vasta lopuksi.","selitys":"Laskin antaa 0,303…, joten keskihajonta on noin 0,30 kg. Melonien massat poikkeavat keskiarvosta 1,8 kg tyypillisesti noin 0,3 kg. Otoskeskihajonta olisi noin 0,34 kg.","tyyppi":"luku"},{"id":"H04","ryhma":"laskin","kysymys":"Aamun lämpötila kuutena helmikuun päivänä.\nLämpötilat (°C): −2, −11, 1, −5, −7, −1\n\nLaske lämpötilojen keskihajonta kymmenesosan tarkkuudella.","vastaus":4.0,"vinkki":"Syötä negatiiviset luvut laskimen etumerkkinäppäimellä (−) tai (+/−). Keskihajonta ei ole negatiivinen.","selitys":"Keskiarvo on noin −4,2 °C ja keskihajonta 4,017… ≈ 4,0 °C. Vaikka kaikki lämpötilat paitsi yksi ovat pakkasella, keskihajonta on positiivinen, koska se kuvaa etäisyyksiä keskiarvosta.","tyyppi":"luku"},{"id":"H05","ryhma":"laskin","kysymys":"Kesätyöpäivien määrä viikossa nuorten ryhmässä.\nPäiviä (pv): 1, 2, 3, 4, 5\nFrekvenssi: 3, 4, 3, 1, 4\n\nMontako lukua syötät laskimeen, jos syötät jokaisen havainnon erikseen?","vastaus":15,"vinkki":"Jokainen frekvenssi kertoo, montako nuorta teki sen määrän päiviä. Jokainen nuori on yksi havainto.","selitys":"Havaintoja on 3 + 4 + 3 + 1 + 4 = 15. Jos syötät vain viisi arvoa 1, 2, 3, 4 ja 5, laskin luulee, että aineistossa on viisi nuorta, joista jokainen teki eri määrän päiviä.","tyyppi":"luku"},{"id":"H06","ryhma":"laskin","kysymys":"Kesätyöpäivien määrä viikossa nuorten ryhmässä.\nPäiviä (pv): 1, 2, 3, 4, 5\nFrekvenssi: 3, 4, 3, 1, 4\n\nLaske päivien keskihajonta kahden desimaalin tarkkuudella.","vastaus":1.48,"vinkki":"Syötä arvo 1 kolmesti, 2 neljästi ja niin edelleen, tai käytä frekvenssisaraketta. Tarkista, että n = 15.","selitys":"Kun frekvenssit ovat mukana, laskin antaa 1,481… ≈ 1,48 pv. Pelkät arvot 1–5 antaisivat 1,41, ja se on väärä vastaus, koska aineistossa on 15 havaintoa eikä viisi.","tyyppi":"luku"},{"id":"H07","ryhma":"laskin","kysymys":"Ylin lämpötila kesäkuun päivinä.\nLämpötila (°C): 14, 16, 18, 20, 22, 24\nFrekvenssi: 4, 1, 1, 5, 4, 5\n\nLaske lämpötilojen keskihajonta kymmenesosan tarkkuudella.","vastaus":3.6,"vinkki":"Laske frekvenssien summa: laskimen n:n pitää olla sama luku.","selitys":"Laskin antaa 3,604… ≈ 3,6 °C. Jos syötät vain kuusi arvoa, saat noin 3,4, ja s-näppäimellä saat noin 3,7.","tyyppi":"luku"},{"id":"H08","ryhma":"laskin","kysymys":"Kymmenen kuljetuslaatikon massat.\nMassat (kg): 24, 31, 22, 28, 33, 24, 21, 30, 25, 23\n\nLaske massojen keskihajonta kymmenesosan tarkkuudella.","vastaus":3.9,"vinkki":"Laske syötetyt luvut ennen kuin luet tuloksen: niitä pitää olla kymmenen.","selitys":"Laskin antaa 3,910… ≈ 3,9 kg. Laatikoiden massat poikkeavat keskiarvosta 26,1 kg tyypillisesti noin 4 kg.","tyyppi":"luku"},{"id":"H09","ryhma":"kasite","kysymys":"Kaikki kuusi pakettia painavat täsmälleen 2,5 kg.\n\nMikä on pakettien massojen keskihajonta kilogrammoina?","vastaus":0,"vinkki":"Kuinka paljon yksikään paketti poikkeaa keskiarvosta?","selitys":"Keskiarvo on 2,5 kg, eikä yksikään paketti poikkea siitä. Kaikki poikkeamat ovat 0, joten keskihajonta on 0 kg. Vastaus 2,5 on keskiarvo, ei keskihajonta.","tyyppi":"luku"},{"id":"H10","ryhma":"kasite","kysymys":"Retkeläisten reppujen massojen keskihajonta on 3,4 kg. Jokaiseen reppuun pakataan lisäksi 2 kg ruokaa.\n\nMikä on reppujen massojen keskihajonta nyt kilogrammoina?","vastaus":3.4,"vinkki":"Muuttuuko reppujen välinen ero, kun jokaiseen lisätään yhtä paljon?","selitys":"Jokainen reppu ja keskiarvo kasvavat 2 kg, joten jokaisen repun etäisyys keskiarvosta pysyy samana. Keskihajonta on edelleen 3,4 kg. Vastaus 5,4 olisi lisännyt vakion keskihajontaan.","tyyppi":"luku"},{"id":"H11","ryhma":"kasite","kysymys":"Aineisto A: 2, 7, 8, 12\nAineisto B: 12, 17, 18, 22\n\nLaske kummankin aineiston keskihajonta. Kuinka paljon keskihajonnat eroavat toisistaan?","vastaus":0,"vinkki":"Vertaa aineistoja ensin keskenään: miten B:n luvut saadaan A:n luvuista?","selitys":"Molempien keskihajonta on 3,562… ≈ 3,6. Jokainen B:n luku on 10 suurempi kuin vastaava A:n luku, joten B:n keskiarvo on 10 suurempi, mutta poikkeamat keskiarvosta ovat samat. Ero on 0.","tyyppi":"luku"},{"id":"H12","ryhma":"kasite","kysymys":"Kesätyöpaikan tuntipalkkojen keskiarvo on 12,40 € ja keskihajonta 0,60 €.\n\nMitä keskihajonta kertoo tuntipalkoista?","vastaus":0,"vinkki":"Keskihajonta liittyy keskiarvoon. Mihin sitä verrataan?","selitys":"Keskihajonta kertoo, kuinka paljon tuntipalkat tyypillisesti poikkeavat keskiarvosta 12,40 €, tässä noin 60 senttiä. Suurimman ja pienimmän palkan erotus on vaihteluvälin pituus, ja keskihajonta ei kerro, että palkkoja olisi vain kahta suuruutta.","tyyppi":"monivalinta","vaihtoehdot":["Tuntipalkat poikkeavat keskiarvosta tyypillisesti noin 60 senttiä.","Suurimman ja pienimmän tuntipalkan erotus on 0,60 €.","Jokainen tuntipalkka on joko 11,80 € tai 13,00 €."]},{"id":"H13","ryhma":"kasite","kysymys":"Aineistossa on kuusi havaintoa. Havaintojen summa on 72 kg ja keskihajonta 0 kg.\n\nMikä on jokaisen havainnon arvo kilogrammoina?","vastaus":12,"vinkki":"Milloin keskihajonta on 0? Mitä se kertoo havainnoista?","selitys":"Keskihajonta on 0 vain, kun kaikki havainnot ovat samoja. Kuusi samaa lukua, joiden summa on 72, on jokainen 72 : 6 = 12. Jokainen havainto on siis 12 kg.","tyyppi":"luku"},{"id":"H14","ryhma":"kasite","kysymys":"Kolmen aineiston keskiarvo on 10.\nAineisto P: 10, 10, 10, 10, 10\nAineisto Q: 9, 14, 5, 10, 12\nAineisto R: 2, 18, 6, 14, 10\n\nJärjestä aineistot keskihajonnan mukaan pienimmästä suurimpaan. Mikä on järjestyksessä keskimmäisen aineiston keskihajonta kymmenesosan tarkkuudella?","vastaus":3.0,"vinkki":"Yhden aineiston keskihajonnan näet laskematta. Arvioi kahden muun hajontaa ennen kuin lasket.","selitys":"P:n keskihajonta on 0, koska kaikki luvut ovat samoja. Q:n luvut ovat 5–14 ja R:n 2–18, joten R on hajallaan eniten. Järjestys on P, Q, R, ja keskimmäisen Q:n keskihajonta on 3,033… ≈ 3,0. R:n keskihajonta on noin 5,7.","tyyppi":"luku"},{"id":"H15","ryhma":"vertailu","kysymys":"Kahden ryhmän pisteet 25 pisteen tehtäväsarjassa. Kummankin ryhmän keskiarvo on 16 pistettä.\nRyhmä A (pistettä): 16, 13, 17, 18, 15, 17\nRyhmä B (pistettä): 21, 9, 15, 23, 12, 16\n\nLaske ryhmän A pisteiden keskihajonta kymmenesosan tarkkuudella.","vastaus":1.6,"vinkki":"Syötä vain ryhmän A kuusi lukua.","selitys":"Laskin antaa 1,632… ≈ 1,6. Ryhmän A pisteet poikkeavat keskiarvosta 16 tyypillisesti alle kaksi pistettä.","tyyppi":"luku"},{"id":"H16","ryhma":"vertailu","kysymys":"Kahden ryhmän pisteet 25 pisteen tehtäväsarjassa. Kummankin ryhmän keskiarvo on 16 pistettä.\nRyhmä A (pistettä): 16, 13, 17, 18, 15, 17\nRyhmä B (pistettä): 21, 9, 15, 23, 12, 16\n\nLaske ryhmän B pisteiden keskihajonta kymmenesosan tarkkuudella.","vastaus":4.8,"vinkki":"Tyhjennä edellisen ryhmän luvut laskimesta ennen kuin syötät uudet.","selitys":"Laskin antaa 4,830… ≈ 4,8. Keskiarvot ovat samat, mutta B:n pisteet poikkeavat keskiarvosta tyypillisesti noin 5 pistettä, A:n alle 2. Ryhmä A on paljon tasaisempi.","tyyppi":"luku"},{"id":"H17","ryhma":"vertailu","kysymys":"Ryhmä A (pistettä): 22, 25, 23, 24, 26, 24\nRyhmä B (pistettä): 10, 18, 14, 6, 22, 14\n\nKumman ryhmän pisteiden keskihajonta on suurempi? Kirjoita 1, jos A, ja 2, jos B.","vastaus":2,"vinkki":"Suurempi keskiarvo ei tarkoita suurempaa hajontaa. Katso, kuinka kaukana luvut ovat oman ryhmänsä keskiarvosta.","selitys":"A:n keskiarvo on 24 ja B:n 14, mutta A:n pisteet ovat kaikki 22–26 eli lähellä keskiarvoa. B:n pisteet ovat 6–22. Keskihajonnat ovat noin 1,3 ja 5,2, joten B:n keskihajonta on suurempi.","tyyppi":"luku"},{"id":"H18","ryhma":"vertailu","kysymys":"Kaksi mehukonetta täyttää 250 ml:n pulloja. Kummankin koneen pullojen keskiarvo on 250 ml.\nKone 1, määrä (ml): 248, 249, 250, 251, 252\nKone 1, frekvenssi: 1, 6, 1, 4, 2\nKone 2, määrä (ml): 246, 248, 250, 252, 254\nKone 2, frekvenssi: 2, 2, 4, 2, 2\n\nKuinka paljon suurempi koneen 2 keskihajonta on kuin koneen 1? Anna vastaus kahden desimaalin tarkkuudella.","vastaus":1.33,"vinkki":"Laske kummankin koneen keskihajonta frekvenssit huomioiden ja vähennä. Tarkista n molemmista.","selitys":"Koneen 1 keskihajonta on 1,253… ≈ 1,25 ml (n = 14) ja koneen 2 2,581… ≈ 2,58 ml (n = 12). Erotus on noin 1,33 ml. Koneen 2 pullot poikkeavat keskiarvosta tyypillisesti kaksi kertaa niin paljon.","tyyppi":"luku"},{"id":"H19","ryhma":"vertailu","kysymys":"Kahden ryhmän pisteiden keskiarvo on molemmissa 15 pistettä. Ryhmän A keskihajonta on 1,2 pistettä ja ryhmän B 4,8 pistettä.\n\nMikä väite on oikein?","vastaus":1,"vinkki":"Mitä keskihajonta kertoo pisteiden etäisyydestä keskiarvoon?","selitys":"Keskiarvot ovat samat, mutta B:n pisteet poikkeavat keskiarvosta tyypillisesti noin neljä kertaa niin paljon kuin A:n. Siksi keskiarvo 15 kuvaa A:n tavallista tulosta paremmin. Suurempi keskihajonta ei tarkoita parempia tuloksia, eikä sama keskiarvo tarkoita samanlaisia ryhmiä.","tyyppi":"monivalinta","vaihtoehdot":["Ryhmät ovat samanlaiset, koska keskiarvot ovat samat.","B:n pisteet poikkeavat keskiarvosta tyypillisesti noin neljä kertaa niin paljon kuin A:n, joten keskiarvo 15 kuvaa A:n tavallista tulosta paremmin.","B:n pisteet ovat parempia, koska sen keskihajonta on suurempi."]},{"id":"H20","ryhma":"vertailu","kysymys":"Kanalan X kananmunien massat.\nMassat (g): 60, 52, 54, 62, 54, 61\nKanalan Y kananmunien massojen keskihajonta on 2,1 g.\n\nLaske kanalan X munien massojen keskihajonta kymmenesosan tarkkuudella.","vastaus":3.9,"vinkki":"Laske X:n keskihajonta. Vertaa sitä sitten Y:n keskihajontaan: kummassa massat vaihtelevat enemmän?","selitys":"Laskin antaa 3,933… ≈ 3,9 g. Se on lähes kaksinkertainen Y:n keskihajontaan 2,1 g verrattuna, joten kanalan X munien massat vaihtelevat enemmän.","tyyppi":"luku"}],"valmis_teksti":"Osaat määrittää keskihajonnan laskimen tilastotoiminnolla, myös frekvenssitaulukosta, ja tiedät, että keskihajonta kertoo, kuinka paljon havainnot tyypillisesti poikkeavat keskiarvosta. Tiedät, että saman luvun lisääminen jokaiseen havaintoon ei muuta keskihajontaa ja että keskihajonta on 0 vain, kun kaikki havainnot ovat samoja. Osaat vertailla kahta aineistoa keskiarvon ja keskihajonnan avulla ja perustella, miksi aineistot voivat olla erilaisia, vaikka niiden keskiarvo on sama. Tämä taito on nyt näytetty."};

/* ---------- teksti ---------- */
const esc = s => s;
const osat = D.teksti.map(o=>{
  switch(o.tyyppi){
    case "johdanto":
      return `<p class="lead">${esc(o.sisalto)}</p>`;
    case "kappale":
      return `<h2>${esc(o.otsikko)}</h2><p>${esc(o.sisalto)}</p>`;
    case "saanto":
      return `<div class="box"><h3>${esc(o.otsikko)}</h3><ol class="steps">${
        o.askeleet.map(a=>`<li><span>${esc(a)}</span></li>`).join("")}</ol></div>`;
    case "taulukko":
      return `<div class="box"><h3>${esc(o.otsikko)}</h3><div class="tablewrap"><table><thead><tr>${
        o.otsikkorivi.map(h=>`<th>${h}</th>`).join("")}</tr></thead><tbody>${
        o.rivit.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join("")}</tr>`).join("")}</tbody></table></div></div>`;
    case "ansa":
      return `<div class="box warn"><h3>${esc(o.otsikko)}</h3><p style="margin:0">${esc(o.sisalto)}</p></div>`;
    case "muistilappu":
      return `<div class="box note"><h3>${esc(o.otsikko)}</h3><ul class="notes">${
        o.kohdat.map(k=>`<li>${esc(k)}</li>`).join("")}</ul></div>`;
    case "numerotaulu":
      return `<div class="box nt"><h3>${esc(o.otsikko)}</h3><p class="ohje">${esc(o.sisalto)}</p>
        <div class="nt-valinta" id="ntValinta"></div>
        <div class="nt-taulu" id="ntTaulu"></div>
        <p class="nt-selite" id="ntSelite"></p></div>`;
    case "vahvuusportaat":
      return `<div class="box vp"><h3>${esc(o.otsikko)}</h3><p class="ohje">${esc(o.sisalto)}</p>
        <div class="vp-tasot">${o.tasot.map(t=>
          `<div class="vp-taso" data-taso="${t.id}"><span class="vp-pallo"></span>
           <div><strong>${t.nimi}</strong><span>${t.selite}</span></div></div>`).join("")}</div>
        <div class="vp-lauseke" id="vpLauseke"></div>
        <div class="vp-rivi"><button type="button" class="btn ghost" id="vpSeuraava">Toinen lauseke</button>
        <span class="vp-vastaus" id="vpVastaus"></span></div></div>`;
    case "laskujarjestys":
      return `<div class="box lj"><h3>${esc(o.otsikko)}</h3><p style="margin:0 0 12px;font-size:14.5px;color:var(--ink-2)">${esc(o.sisalto)}</p>
        <div class="lj-exp" id="ljExp"></div>
        <div class="lj-fb" id="ljFb"></div>
        <div class="lj-row"><button type="button" class="btn ghost" id="ljSeuraava">Toinen lauseke</button>

const svg=document.getElementById("nlsvg"), rng=document.getElementById("nlrange"), out=document.getElementById("nlout");
const X0=34, X1=606, Y=62;
function piirraNL(v){
  const ala=Math.floor(v/10)*10, yla=ala+10, puoli=ala+5;
  const pyor = (v%10)>=5 ? yla : ala;
  const x = n => X0 + (n/100)*(X1-X0);
  let s=`<line class="rail" x1="${X0}" y1="${Y}" x2="${X1}" y2="${Y}"/>`;
  for(let n=0;n<=100;n+=10){
    const near = (n===ala||n===yla);
    s+=`<line class="tick" x1="${x(n)}" y1="${Y-7}" x2="${x(n)}" y2="${Y+7}"/>`;
    s+=`<text class="stop${near?" near":""}" x="${x(n)}" y="${Y+24}" text-anchor="middle">${n}</text>`;
  }
  s+=`<line class="halfway" x1="${x(puoli)}" y1="${Y-16}" x2="${x(puoli)}" y2="${Y+12}"/>`;
  s+=`<text class="stop" x="${x(puoli)}" y="${Y-22}" text-anchor="middle">puoliväli ${puoli}</text>`;
  s+=`<circle class="dot" cx="${x(v)}" cy="${Y}" r="6"/>`;
  s+=`<text class="val" x="${x(v)}" y="${Y-32}" text-anchor="middle">${v}</text>`;
  s+=`<path d="M ${x(v)} ${Y+38} L ${x(pyor)} ${Y+38}" stroke="var(--core)" stroke-width="2" fill="none"/>`;
  s+=`<path d="M ${x(pyor)} ${Y+38} l ${x(pyor)>x(v)?-7:7} -4 l 0 8 z" fill="var(--core)"/>`;
  svg.innerHTML=s;
  out.textContent = `${v} pyöristyy → ${pyor}`;
}

/* ---------- laskujärjestys-widget ---------- */
const ljExp=document.getElementById("ljExp");
if(ljExp && D.kokeilu){
  let ljI=0, ljTokens=[], ljStep=0;
  const laske=(a,op,b)=>{a=+a;b=+b;return op==="×"?a*b:op==="÷"?a/b:op==="+"?a+b:a-b;};
  function ljAlku(){
    const l=D.kokeilu[ljI];
    ljTokens=l.lauseke.replace(/\(/g,"( ").replace(/\)/g," )").split(/\s+/).filter(Boolean);
    ljStep=0; ljPiirra(); ljViesti("","");
  }
  function ljViesti(t,lk){const f=document.getElementById("ljFb"); f.textContent=t; f.className="lj-fb "+(lk||"");}
  function ljPiirra(){
    const l=D.kokeilu[ljI];
    document.getElementById("ljStep").textContent =
      ljStep>=l.askeleet.length ? "valmis" : `askel ${ljStep+1} / ${l.askeleet.length}`;
    if(ljStep>=l.askeleet.length){
      ljExp.innerHTML=`<span class="valmis">${l.lauseke} = ${l.vastaus}</span>`;
      return;
    }
    ljExp.innerHTML=ljTokens.map((t,i)=>
      "×÷+−".includes(t) ? `<button type="button" class="op" data-i="${i}">${t}</button>`
                         : `<span class="tok">${t}</span>`).join("");
    ljExp.querySelectorAll("button.op").forEach(b=>b.addEventListener("click",()=>ljKlikkaa(+b.dataset.i)));
  }
  function ljKlikkaa(i){
    const l=D.kokeilu[ljI], odotettu=l.askeleet[ljStep];
    const ehdotus=[ljTokens[i-1],ljTokens[i],ljTokens[i+1]].join(" ");
    if(ehdotus!==odotettu){
      ljViesti(ljStep===0
        ? "Ei vielä. Sulkeet ovat vahvimmat, sitten kerto ja jako. Yhtä vahvat vasemmalta oikealle."
        : "Ei vielä. Kumpi jäljellä olevista on vahvempi?", "no");
      return;
    }
    const arvo=laske(ljTokens[i-1],ljTokens[i],ljTokens[i+1]);
    let alku=i-1, loppu=i+1;
    if(ljTokens[i-2]==="(" && ljTokens[i+2]===")"){ alku=i-2; loppu=i+2; }
    ljTokens.splice(alku, loppu-alku+1, String(arvo));
    ljStep++;
    ljViesti(ljStep>=l.askeleet.length ? "Valmis. Vastaus on "+l.vastaus+"." : "Oikein. Jatka seuraavaan.", "ok");
    ljPiirra();
  }
  document.getElementById("ljSeuraava").addEventListener("click",()=>{
    ljI=(ljI+1)%D.kokeilu.length; ljAlku();
  });
  ljAlku();
}

/* Suomalainen lukumuoto: välilyönti on tuhaterotin, pilkku desimaalierotin.
   Piste voi olla kumpi tahansa. Se tulkitaan tuhaterottimeksi VAIN silloin, kun
   koko luku on aitoa tuhaterotinmuotoa: alkuosa 1–3 numeroa ilman etunollaa ja
   jokainen jatko-osa täsmälleen 3 numeroa (1.500, 12.345.678). Kaikissa muissa
   tapauksissa piste on desimaalipiste — myös 0.125, joka vanhalla säännöllä
   ("3 numeroa pisteen jäljessä = tuhaterotin") luettiin virheellisesti luvuksi 125. */
const TUHATEROTIN = /^[1-9]\d{0,2}(\.\d{3})+$/;
function lueLuku(teksti){
  // Murtoluku (3/4, -3/4) ja sekaluku (1 2/3, -1 2/3) hyväksytään sellaisinaan.
  const raaka = String(teksti).replace(/\u00a0/g, " ").trim();
  let m = raaka.match(/^(-?)(\d+)\s+(\d+)\s*\/\s*(\d+)$/);
  if(m){ const nim = Number(m[4]); if(nim === 0) return null;
    const v = Number(m[2]) + Number(m[3]) / nim; return m[1] ? -v : v; }
  m = raaka.match(/^(-?)\s*(\d+)\s*\/\s*(\d+)$/);
  if(m){ const nim = Number(m[3]); if(nim === 0) return null;
    const v = Number(m[2]) / nim; return m[1] ? -v : v; }
  let s = String(teksti).replace(/[\s\u00a0]/g, "");
  if(s === "") return null;
  if(s.indexOf(",") >= 0){
    s = s.replace(/\./g, "").replace(",", ".");
  } else if(TUHATEROTIN.test(s)){
    s = s.replace(/\./g, "");
  }
  const n = Number(s);
  return Number.isFinite(n) ? n : null;
}

function tarkista(id){
  const h=D.harjoitukset.find(x=>x.id===id);
  const kentta=document.getElementById("in-"+id);
  const fb=document.getElementById("fb-"+id);
  if(kentta.value.trim()===""){ fb.className="fb hint"; fb.textContent="Kirjoita vastaus ensin."; return; }
  const luku=lueLuku(kentta.value);
  if(luku===null){ fb.className="fb no"; fb.textContent="Vastauksen pitää olla luku tai murtoluku (esimerkiksi 3/4)."; return; }
  const oikein = Math.abs(luku - h.vastaus) < 1e-9;
  merkitseTulos(id, oikein, oikein ? "Oikein. "+h.selitys : `Ei vielä. ${h.vinkki} Kokeile uudelleen.`);
}

function tarkistaMonivalinta(id, valittuIndeksi, painike){
  const h=D.harjoitukset.find(x=>x.id===id);
  const rivi=painike.closest(".row");
  rivi.querySelectorAll(".mv-valinta").forEach(b=>b.disabled=true);
  const oikein = valittuIndeksi===h.vastaus;
  painike.classList.add(oikein?"mv-oikein":"mv-vaarin");
  if(!oikein){
    const oikeaBtn=rivi.querySelector(`[data-i="${h.vastaus}"]`);
    if(oikeaBtn) oikeaBtn.classList.add("mv-oikein");
  }
  merkitseTulos(id, oikein, oikein ? "Oikein. "+h.selitys : `Ei ihan. Oikea vastaus on korostettu. ${h.selitys||""}`);
}

/* Kuuntelu: selain lukee tekstin ääneen omalla puhesynteesillään (englanniksi, jos laitteessa on
   englanninkielinen ääni). Ei äänitiedostoja eikä verkkoyhteyttä. Jos laite ei osaa puhua,
   teksti näytetään luettavaksi — silloin tehtävä muuttuu luetun ymmärtämiseksi, mutta ei katkea. */
function puhu(id, nopeus){
  const h=D.harjoitukset.find(x=>x.id===id); if(!h || !h.kuuntele) return;
  const vara=document.getElementById("vara-"+id);
  const naytaTeksti=syy=>{ vara.hidden=false; vara.textContent=syy+" Teksti: "+h.kuuntele; };
  if(!("speechSynthesis" in window)){ naytaTeksti("Tämä laite ei osaa lukea ääneen."); return; }
  const s=window.speechSynthesis; s.cancel();
  const u=new SpeechSynthesisUtterance(h.kuuntele);
  u.lang=h.kieli||"en-GB"; u.rate=nopeus;
  const aanet=s.getVoices(), kieli=u.lang.slice(0,2);
  const aani=aanet.find(a=>a.lang===u.lang) || aanet.find(a=>a.lang && a.lang.startsWith(kieli));
  if(aani) u.voice=aani;
  else if(aanet.length) { naytaTeksti("Laitteessa ei ole englanninkielistä ääntä."); return; }
  u.onerror=()=>naytaTeksti("Ääneen lukeminen ei onnistunut.");
  s.speak(u);
}
