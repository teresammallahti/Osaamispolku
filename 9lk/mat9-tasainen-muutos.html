<title>Tasainen muutos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">

<style>
:root{
  --paper:#EFF2F5; --surface:#FFFFFF; --surface-2:#F7F9FB;
  --grid:#DCE3EA; --line:#C9D3DC;
  --ink:#15222C; --ink-2:#4E626F; --ink-3:#7E8F9B;
  --core:#1B5A9E; --core-soft:#E4EDF6;
  --strong:#1F6E5C; --strong-soft:#E1F0EB;
  --chal:#9A6A16; --chal-soft:#F6EDDC;
  --alert:#A33A2B; --alert-soft:#F8E7E3;
  --shadow:0 1px 2px rgba(21,34,44,.06), 0 8px 24px -12px rgba(21,34,44,.18);
  --r:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0F161B; --surface:#18222A; --surface-2:#1D2830;
    --grid:#22303A; --line:#2E3E4A;
    --ink:#E8EFF4; --ink-2:#A3B4C0; --ink-3:#7A8B97;
    --core:#7FB2E4; --core-soft:#16303F;
    --strong:#77CDB4; --strong-soft:#123028;
    --chal:#E0B267; --chal-soft:#33270F;
    --alert:#E8907F; --alert-soft:#3A1E19;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -14px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --paper:#0F161B; --surface:#18222A; --surface-2:#1D2830;
  --grid:#22303A; --line:#2E3E4A;
  --ink:#E8EFF4; --ink-2:#A3B4C0; --ink-3:#7A8B97;
  --core:#7FB2E4; --core-soft:#16303F;
  --strong:#77CDB4; --strong-soft:#123028;
  --chal:#E0B267; --chal-soft:#33270F;
  --alert:#E8907F; --alert-soft:#3A1E19;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -14px rgba(0,0,0,.7);
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:16px; line-height:1.62;
  background-image:
    linear-gradient(to right, var(--grid) 1px, transparent 1px),
    linear-gradient(to bottom, var(--grid) 1px, transparent 1px);
  background-size:26px 26px;
}
.wrap{max-width:760px; margin:0 auto; padding:28px 20px 90px}
h1,h2,h3,h4{font-family:"Familjen Grotesk","IBM Plex Sans",system-ui,sans-serif; text-wrap:balance}

/* header */
header.top{background:var(--surface); border:1px solid var(--line); border-radius:var(--r);
  box-shadow:var(--shadow); padding:22px 24px; display:flex; gap:18px; align-items:flex-start}
.badge{flex:0 0 auto; width:54px; height:54px; border-radius:9px; display:grid; place-items:center;
  background:var(--core-soft); border:1px solid var(--core); color:var(--core)}
.badge svg{width:28px; height:28px; fill:none; stroke:currentColor; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round}
.eyebrow{font-family:"IBM Plex Mono",monospace; font-size:11px; letter-spacing:.14em;
  text-transform:uppercase; color:var(--ink-3); margin:0 0 5px}
header.top h1{margin:0; font-size:30px; font-weight:700; letter-spacing:-.015em}
header.top p{margin:5px 0 0; color:var(--ink-2); font-size:15px}
.tags{display:flex; flex-wrap:wrap; gap:5px; margin-top:11px}
.tag{font-family:"IBM Plex Mono",monospace; font-size:10.5px; letter-spacing:.05em; padding:2px 7px;
  border-radius:4px; background:var(--surface-2); border:1px solid var(--line); color:var(--ink-3)}
.tag.core{background:var(--core-soft); border-color:var(--core); color:var(--core)}

/* teksti */
article{margin-top:26px}
article h2{font-size:21px; font-weight:600; margin:32px 0 10px; letter-spacing:-.01em}
article p{margin:0 0 14px; max-width:64ch}
.lead{font-size:17.5px; color:var(--ink); border-left:3px solid var(--core); padding-left:16px; margin:0 0 8px}

.box{background:var(--surface); border:1px solid var(--line); border-radius:var(--r);
  padding:18px 22px; box-shadow:var(--shadow); margin:22px 0}
.box h3{margin:0 0 12px; font-size:16.5px; font-weight:600}
.box.warn{border-left:3px solid var(--alert)}
.box.note{border-left:3px solid var(--chal)}

ol.steps{margin:0; padding-left:0; list-style:none; counter-reset:s; display:grid; gap:12px}
ol.steps li{counter-increment:s; display:grid; grid-template-columns:auto 1fr; gap:13px; align-items:start}
ol.steps li::before{content:counter(s); font-family:"Familjen Grotesk",sans-serif; font-weight:700; font-size:14px;
  width:26px; height:26px; border-radius:50%; background:var(--core); color:#fff; display:grid; place-items:center; margin-top:2px}

ul.notes{margin:0; padding-left:19px}
ul.notes li{margin-bottom:7px}
ul.notes li:last-child{margin-bottom:0}

.tablewrap{overflow-x:auto}
table{border-collapse:collapse; width:100%; font-size:14.5px; min-width:460px}
th,td{text-align:left; padding:9px 13px; border-bottom:1px solid var(--line)}
th{font-family:"IBM Plex Mono",monospace; font-size:10.5px; letter-spacing:.1em; text-transform:uppercase;
  color:var(--ink-3); font-weight:400; background:var(--surface-2)}
tr:last-child td{border-bottom:0}
td b{color:var(--core); font-weight:600}
td:last-child{font-variant-numeric:tabular-nums; font-weight:600}

/* lukusuora */
.nl svg{width:100%; height:118px; display:block}
.nl .rail{stroke:var(--line); stroke-width:2}
.nl .tick{stroke:var(--line); stroke-width:1.5}
.nl .stop{fill:var(--ink-3); font-family:"IBM Plex Mono",monospace; font-size:11px}
.nl .stop.near{fill:var(--core); font-weight:600}
.nl .dot{fill:var(--chal)}
.nl .val{fill:var(--ink); font-family:"Familjen Grotesk",sans-serif; font-size:15px; font-weight:700}
.nl .halfway{stroke:var(--chal); stroke-dasharray:3 3; stroke-width:1.5}
.nl-controls{display:flex; align-items:center; gap:14px; margin-top:6px}
.nl-controls input{flex:1; accent-color:var(--core)}
.nl-out{font-family:"Familjen Grotesk",sans-serif; font-size:15px; font-weight:600; min-width:12.5em; text-align:right}

/* paikka-arvotaulu */
.box .ohje{margin:0 0 14px; font-size:14.5px; color:var(--ink-2)}
.nt-valinta{display:flex; flex-wrap:wrap; gap:7px; margin-bottom:16px}
.nt-valinta button{font:inherit; font-size:12.5px; font-family:"IBM Plex Mono",monospace; padding:5px 11px;
  border-radius:6px; border:1px solid var(--line); background:var(--surface-2); color:var(--ink-2); cursor:pointer}
.nt-valinta button[aria-pressed="true"]{background:var(--ink); color:var(--paper); border-color:var(--ink)}
.nt-valinta button:focus-visible{outline:2px solid var(--core); outline-offset:2px}
.nt-taulu{display:flex; flex-direction:column; gap:4px; align-items:flex-start; overflow-x:auto; padding-bottom:4px}
.nt-rivi{display:flex; gap:6px; align-items:center}
.nt-rivi .otsa{font-family:"IBM Plex Mono",monospace; font-size:9.5px; letter-spacing:.08em;
  text-transform:uppercase; color:var(--ink-3); width:52px; text-align:center}
.nt-ruutu{width:52px; height:52px; display:grid; place-items:center; border:1.5px solid var(--line);
  border-radius:7px; background:var(--surface-2); font-family:"IBM Plex Mono",monospace; font-size:24px}
.nt-ruutu.kohta{border-color:var(--core); background:var(--core-soft); color:var(--core); font-weight:500}
.nt-ruutu.ratkaiseva{border-color:var(--chal); background:var(--chal-soft); color:var(--chal); font-weight:500}
.nt-ruutu.nolla{color:var(--ink-3)}
.nt-rivi .nimi{font-size:12.5px; color:var(--ink-3); margin-left:12px; white-space:nowrap}
.nt-nuoli{font-size:17px; color:var(--chal); margin-left:6px}
.nt-selite{margin:14px 0 0; font-size:14.5px}
.nt-selite b{color:var(--core)}

/* vahvuusportaat */
.vp-tasot{display:grid; gap:9px; margin-bottom:18px}
.vp-taso{display:flex; gap:11px; align-items:flex-start; font-size:13.5px}
.vp-taso .vp-pallo{width:13px; height:13px; border-radius:4px; margin-top:5px; flex:0 0 auto}
.vp-taso[data-taso="sulkeet"] .vp-pallo{background:var(--core)}
.vp-taso[data-taso="kertojako"] .vp-pallo{background:var(--strong)}
.vp-taso[data-taso="yhteenvahennys"] .vp-pallo{background:var(--chal)}
.vp-taso strong{display:block; font-family:"Familjen Grotesk",sans-serif; font-weight:600; font-size:14.5px}
.vp-taso span{color:var(--ink-2)}
.vp-lauseke{display:flex; flex-wrap:wrap; gap:7px; align-items:flex-end; font-family:"IBM Plex Mono",monospace;
  font-size:25px; padding:10px 2px; min-height:64px}
.vp-lauseke .t{padding:2px 3px}
.vp-lauseke .op{position:relative; padding:2px 9px; border-radius:6px; font-weight:500}
.vp-lauseke .op[data-taso="sulkeet"]{background:var(--core-soft); color:var(--core)}
.vp-lauseke .op[data-taso="kertojako"]{background:var(--strong-soft); color:var(--strong)}
.vp-lauseke .op[data-taso="yhteenvahennys"]{background:var(--chal-soft); color:var(--chal)}
.vp-lauseke .op i{position:absolute; top:-9px; right:-6px; font-style:normal; font-family:"Familjen Grotesk",sans-serif;
  font-size:11px; font-weight:700; width:18px; height:18px; border-radius:50%; display:grid; place-items:center;
  background:currentColor}
.vp-lauseke .op i span{color:var(--surface)}
.vp-rivi{display:flex; align-items:center; gap:16px; margin-top:8px}
.vp-vastaus{font-family:"Familjen Grotesk",sans-serif; font-size:16px; font-weight:600; color:var(--strong)}

/* laskujärjestys-widget */
.lj-exp{display:flex; flex-wrap:wrap; gap:7px; align-items:center; font-family:"IBM Plex Mono",monospace;
  font-size:23px; padding:14px 4px; min-height:62px}
.lj-exp .tok{padding:2px 4px; color:var(--ink)}
.lj-exp button.op{font-family:"IBM Plex Mono",monospace; font-size:23px; padding:3px 12px; border-radius:7px;
  border:1.5px solid var(--line); background:var(--surface-2); color:var(--ink); line-height:1.2}
.lj-exp button.op:hover{border-color:var(--core); color:var(--core)}
.lj-exp button.op:focus-visible{outline:2px solid var(--core); outline-offset:2px}
.lj-exp .valmis{font-family:"Familjen Grotesk",sans-serif; font-size:23px; font-weight:700; color:var(--strong)}
.lj-fb{font-size:14.5px; min-height:1.5em; color:var(--ink-2)}
.lj-fb.no{color:var(--alert)}
.lj-fb.ok{color:var(--strong)}
.lj-row{display:flex; align-items:center; gap:14px; margin-top:10px}
.lj-step{font-family:"IBM Plex Mono",monospace; font-size:11.5px; letter-spacing:.1em;
  text-transform:uppercase; color:var(--ink-3)}

/* harjoitukset */
.progress{position:sticky; top:0; z-index:5; background:var(--surface); border:1px solid var(--line);
  border-radius:var(--r); padding:12px 18px; box-shadow:var(--shadow); display:flex; align-items:center;
  gap:14px; margin:34px 0 18px}
.progress .lbl{font-family:"IBM Plex Mono",monospace; font-size:11px; letter-spacing:.12em;
  text-transform:uppercase; color:var(--ink-3); white-space:nowrap}
.progress .meter{flex:1; height:7px; border-radius:4px; background:var(--surface-2); border:1px solid var(--line); overflow:hidden}
.progress .meter i{display:block; height:100%; background:var(--core); transition:width .25s ease}
.progress .cnt{font-family:"Familjen Grotesk",sans-serif; font-weight:700; font-variant-numeric:tabular-nums; white-space:nowrap}

.grp{margin-top:26px}
.grp-head{display:flex; align-items:baseline; gap:10px; border-bottom:1.5px solid var(--ink); padding-bottom:7px; margin-bottom:14px}
.grp-head h3{margin:0; font-size:17px; font-weight:600}
.grp-head span{font-size:12.5px; color:var(--ink-2)}

.ex{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:14px 16px; margin-bottom:10px}
.ex[data-tila="oikein"]{border-color:var(--strong); box-shadow:inset 3px 0 0 var(--strong)}
.ex[data-tila="vaarin"]{border-color:var(--alert); box-shadow:inset 3px 0 0 var(--alert)}
.ex .q{display:flex; gap:11px; align-items:baseline; flex-wrap:wrap}
.ex .num{font-family:"IBM Plex Mono",monospace; font-size:11.5px; color:var(--ink-3); min-width:2.4em}
.ex .txt{flex:1; min-width:190px; font-size:15.5px}
.ex .txt .aineisto{display:block; margin-bottom:9px; padding-left:12px;
  border-left:2px solid var(--line); color:var(--ink-2); line-height:1.6;
  /* Aineisto voi olla pieni taulukko, jonka rivit on erotettu rivinvaihdoilla.
     Ilman pre-lineä ne valuisivat yhdeksi kappaleeksi ja taulukko katoaisi. */
  white-space:pre-line}
.ex .txt .kysymysrivi{display:block; font-weight:600}
.ex .row{display:flex; gap:8px; align-items:center; margin-top:11px; flex-wrap:wrap}
.ex input[type=text]{font:inherit; font-family:"IBM Plex Mono",monospace; font-size:15px; width:8.5em;
  padding:7px 11px; border:1px solid var(--line); border-radius:7px; background:var(--surface-2);
  color:var(--ink); text-align:right}
.ex input:focus-visible{outline:2px solid var(--core); outline-offset:1px}
button{font:inherit; cursor:pointer}
.btn{font-size:13.5px; padding:7px 15px; border-radius:7px; border:1px solid var(--core);
  background:var(--core); color:#fff}
.btn.ghost{background:transparent; color:var(--ink-2); border-color:var(--line)}
.btn:focus-visible{outline:2px solid var(--core); outline-offset:2px}
.btn.mv-valinta{text-align:left}
/* kuuntelutehtävä: selaimen puhesynteesi lukee englanninkielisen tekstin */
.kuuntele{display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin:2px 0 10px}
.kuuntele .btn{display:inline-flex; gap:7px; align-items:center}
.kuuntele svg{width:16px; height:16px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round}
.kuuntele .varateksti{flex-basis:100%; font-size:14px; color:var(--ink-2); background:var(--surface-2);
  border-radius:7px; padding:8px 12px; margin:0}
.btn.mv-valinta:disabled{cursor:default; opacity:.65}
.btn.mv-oikein{background:var(--strong-soft); border-color:var(--strong); color:var(--strong); opacity:1}
.btn.mv-vaarin{background:var(--alert-soft); border-color:var(--alert); color:var(--alert); opacity:1}
.row.mv{gap:8px 10px}
.fb{margin-top:11px; font-size:14.5px; padding:10px 13px; border-radius:8px; line-height:1.5}
.fb.ok{background:var(--strong-soft); color:var(--strong)}
.fb.no{background:var(--alert-soft); color:var(--alert)}
.fb.hint{background:var(--chal-soft); color:var(--chal)}

.done{background:var(--strong-soft); border:1px solid var(--strong); color:var(--strong);
  border-radius:var(--r); padding:16px 20px; margin-top:20px; font-size:15.5px}
.done h3{margin:0 0 4px; font-size:17px; color:var(--strong)}

details.teacher{margin-top:34px; background:var(--surface); border:1px solid var(--line);
  border-left:3px solid var(--chal); border-radius:var(--r); padding:15px 20px; box-shadow:var(--shadow)}
details.teacher summary{cursor:pointer; font-family:"Familjen Grotesk",sans-serif; font-weight:600; font-size:15px}
details.teacher summary:focus-visible{outline:2px solid var(--core); outline-offset:3px}
details.teacher ul{margin:12px 0 0; padding-left:19px; color:var(--ink-2); font-size:14.5px}
details.teacher li{margin-bottom:8px}
details.teacher p{margin:12px 0 0; color:var(--ink-2); font-size:14.5px}

.back{display:inline-block; margin-top:30px; font-size:13.5px; color:var(--ink-2)}
.back a{color:var(--core)}

@media (prefers-reduced-motion: reduce){*{transition:none !important}}
@media (max-width:560px){
  .wrap{padding:16px 13px 70px}
  header.top h1{font-size:25px}
  .progress{flex-wrap:wrap}
}
</style>

<div class="wrap">

  <header class="top">
    <span class="badge"><svg viewBox="0 0 24 24" aria-hidden="true" id="ikoni"></svg></span>
    <div>
      <p class="eyebrow" id="eyebrow"></p>
      <h1 id="otsikko"></h1>
      <p id="kuvaus"></p>
      <div class="tags" id="tags"></div>
    </div>
  </header>

  <article id="teksti"></article>

  <div class="progress" aria-live="polite">
    <span class="lbl">Harjoitukset</span>
    <span class="meter"><i id="pbar" style="width:0%"></i></span>
    <span class="cnt" id="pcnt">0 / 20</span>
  </div>

  <div id="harjoitukset"></div>
  <div id="valmis"></div>

  <p class="back" id="back"></p>

</div>

<script>
const D = {"tavoite_id":"MAT9-FUN-05","oppiaine":"MAT","vuosiluokka":9,"otsikko":"Tasainen muutos","kuvaus":"Osaan muodostaa lineaarisen funktion arkitilanteesta ja käyttää sitä laskemiseen ja vertailuun.","versio":"0.2","paivitetty":"2026-10-11","ops":{"T":["T5","T7","T15"],"S":["S4"]},"taso":"ydin","ikoni":"liike","eyebrow":"Matematiikka · 9. luokka · Funktiot ja lukujonot","teksti":[{"tyyppi":"johdanto","sisalto":"Sähköpotkulaudan sovellus näyttää hinnan: avausmaksu 0,90 € ja 0,30 € jokaiselta ajominuutilta. Kahdeksannella luokalla näit, että tällainen hinta ei ole suoraan verrannollinen aikaan, koska avausmaksu maksetaan vain kerran. Hinta kuitenkin kasvaa tasaisesti: jokainen minuutti lisää siihen saman verran. Siksi sen voi kirjoittaa funktiona f(x) = 0,3x + 0,9, jossa x on ajetut minuutit ja f(x) hinta euroina. Funktiolla voi laskea, paljonko 20 minuutin ajo maksaa, ja myös toisin päin: montako minuuttia ajoit, kun kuitti näyttää 8,40 €. Samalla tavalla voi kuvata kynttilää, joka lyhenee tasaisesti, tai kesätyön palkkaa, jossa on tuntipalkka ja kiinteä lisä. Tässä taidossa opit muodostamaan tällaisen mallin perusmaksusta ja yksikköhinnasta sekä kahdesta mittaustuloksesta, tulkitsemaan sen luvut tilanteen yksiköissä, laskemaan sillä kumpaankin suuntaan ja vertailemaan vaihtoehtoja laskemalla."},{"tyyppi":"kappale","otsikko":"Kulmakerroin on muutosnopeus, vakiotermi alkuarvo","sisalto":"Suure muuttuu tasaisesti, kun sen muutos on yhtä suuri jokaista muuttujan yksikköä kohden: jokainen minuutti lisää hintaan 0,30 €, ja jokainen tunti lyhentää kynttilää yhtä monta senttimetriä. Silloin riippuvuus on lineaarinen, ja sitä kuvaa funktio f(x) = kx + b, jonka kuvaaja on suora. Taidossa Jyrkkyys ja lähtöpiste opit, että kulmakerroin k kertoo, paljonko y muuttuu, kun x kasvaa yhdellä, ja että vakiotermi b on suoran ja y-akselin leikkauspisteen y-koordinaatti. Tilanteessa samat luvut saavat merkityksen. Kulmakerroin on muutosnopeus: paljonko suure muuttuu yhtä muuttujan yksikköä kohden. Sen yksikkö on funktion arvon yksikkö jaettuna muuttujan yksiköllä, esimerkiksi €/min tai cm/h. Kun suure vähenee, kulmakerroin on negatiivinen. Vakiotermi on alkuarvo eli funktion arvo, kun x = 0, ja sen yksikkö on sama kuin funktion arvon: f(0) = 0,3 · 0 + 0,9 = 0,9, eli avausmaksu 0,90 € maksetaan, vaikka ajominuutteja ei kertyisi yhtään. Tulkinta kirjoitetaan tilanteen kielellä ja yksiköin. Jos kuntosalin kuukausihinta on f(x) = 4x + 19, jossa x on käyntikerrat ja f(x) hinta euroina, luku 4 tarkoittaa, että jokainen käynti lisää kuukausihintaa 4 € (4 €/käynti), ja luku 19 tarkoittaa 19 euron kuukausimaksua, joka maksetaan, vaikka käyntejä ei olisi. Vastaus \"4 tarkoittaa neljää\" tai \"19 on vakiotermi\" ei ole tulkinta, koska siitä ei selviä, mitä luku tilanteessa kertoo."},{"tyyppi":"saanto","otsikko":"Näin muodostat mallin perusmaksusta ja yksikköhinnasta","askeleet":["Päätä, mikä on muuttuja x ja mikä funktion arvo f(x), ja kirjoita niiden yksiköt (esimerkiksi x minuutteina ja f(x) euroina).","Etsi muutos yhtä x:n yksikköä kohden. Se on kulmakerroin k. Jos suure vähenee, k on negatiivinen.","Etsi arvo, kun x = 0: aloitusmaksu, kuukausimaksu, alkupituus tai alkumäärä. Se on vakiotermi b. Järjestyksellä, jossa luvut tehtävässä mainitaan, ei ole merkitystä.","Kirjoita f(x) = kx + b.","Tarkista yhdellä arvolla, jonka lasket suoraan tilanteesta. Esimerkiksi 10 minuuttia maksaa 0,90 € + 10 · 0,30 € = 3,90 €, ja f(10) = 0,3 · 10 + 0,9 = 3,9."]},{"tyyppi":"kappale","otsikko":"Laskeminen kumpaankin suuntaan","sisalto":"Kun x tunnetaan, sijoitat sen funktioon. 20 minuutin ajo maksaa f(20) = 0,3 · 20 + 0,9 = 6 + 0,9 = 6,90 €. Kun funktion arvo tunnetaan ja kysytään x:ää, kirjoitat yhtälön, jossa funktion lauseke on yhtä suuri kuin annettu arvo. Kuitti näyttää 8,40 €, joten 0,3x + 0,9 = 8,4. Vähennä molemmilta puolilta 0,9: 0,3x = 7,5. Jaa molemmat puolet luvulla 0,3: x = 7,5 : 0,3 = 75 : 3 = 25. Ajo kesti 25 minuuttia. Tarkista sijoittamalla: f(25) = 7,5 + 0,9 = 8,4. Jakolaskun 7,5 : 0,3 teet ilman laskinta kertomalla jaettavan ja jakajan kymmenellä, jolloin osamäärä ei muutu ja saat jakolaskun 75 : 3. Lue tehtävästä aina ensin, kumpi on annettu: muuttujan arvo (minuutit) vai funktion arvo (hinta)."},{"tyyppi":"ansa","otsikko":"Ansa: luvut väärissä paikoissa tai kysymys väärään suuntaan","sisalto":"Funktion f(x) = 0,3x + 0,9 sijaan on helppo kirjoittaa f(x) = 0,9x + 0,3, jos luvut poimitaan siinä järjestyksessä kuin ne tehtävässä mainitaan. Silloin 20 minuuttia maksaisi 0,9 · 20 + 0,3 = 18,30 €, ja avausmaksu olisi 0,30 €. Tarkistus paljastaa virheen: f(0) on se, mitä maksat ennen ensimmäistä minuuttia, eli avausmaksu 0,90 €. Kerroin, joka kerrotaan x:llä, on se luku, joka toistuu jokaisella minuutilla. Toinen virhe on vastata väärään kysymykseen. Kun ajo maksoi 8,40 €, luku 8,40 on hinta eli funktion arvo, ei minuutit. Jos sijoitat sen x:n paikalle, saat f(8,4) = 0,3 · 8,4 + 0,9 = 3,42, mikä on 8,4 minuutin ajon hinta eikä kysytty ajoaika. Katso ennen laskemista, onko annettu luku euroja vai minuutteja: minuutit sijoitetaan, hinnasta kirjoitetaan yhtälö."},{"tyyppi":"kappale","otsikko":"Malli kahdesta mittauksesta","sisalto":"Joskus alkuarvoa ja muutosnopeutta ei kerrota, vaan tiedossa on kaksi mittausta. Kynttilä on palanut 3 tuntia, ja se on 20 cm pitkä. Kun se on palanut 7 tuntia, se on 12 cm pitkä. Kynttilä lyhenee tasaisesti, joten sen pituus on ajan lineaarinen funktio, ja mittaukset ovat suoran pisteet (3, 20) ja (7, 12). Kulmakerroin lasketaan kahdesta pisteestä kuten taidossa Jyrkkyys ja lähtöpiste: k = (12 − 20) : (7 − 3) = −8 : 4 = −2. Neljässä tunnissa kynttilä lyheni 8 cm eli 2 cm tunnissa, ja koska pituus vähenee, kulmakerroin on −2 (yksikkö cm/h). Vakiotermi saadaan sijoittamalla jompikumpi piste yhtälöön y = kx + b ja ratkaisemalla b: 20 = −2 · 3 + b eli 20 = −6 + b, joten b = 26. Malli on f(x) = −2x + 26: kynttilä oli alussa 26 cm pitkä. Tarkista toisella pisteellä: f(7) = −14 + 26 = 12. Kun piirrät kuvaajan, kirjoita vaaka-akselille aika (h) ja pystyakselille pituus (cm). Malli pätee vain järkevillä muuttujan arvoilla: aika ei ole negatiivinen, ja kynttilä on palanut loppuun, kun pituus on 0 eli −2x + 26 = 0, josta x = 13. Kuvaaja on siis jana pisteestä (0, 26) pisteeseen (13, 0), ei koko suora."},{"tyyppi":"ansa","otsikko":"Ansa: yksi mittaus ei kerro kulmakerrointa eikä alkuarvoa","sisalto":"Suoraan verrannollisuudessa kerroin saatiin yhdestä lukuparista jakamalla, ja siksi on houkuttelevaa laskea 12 cm : 7 h ≈ 1,7 cm/h. Se on väärin, koska kynttilä ei ollut alussa 0 cm pitkä: suhteessa 12 : 7 on mukana myös alkupituus. Muutosnopeus saadaan vain muutoksista: pituuden muutos jaetaan ajan muutoksella. Toinen houkutus on pitää ensimmäistä mittausta alkuarvona ja kirjoittaa b = 20. Mittaus 20 cm on hetkeltä x = 3, ei hetkeltä x = 0. Ennen ensimmäistä mittausta kynttilä oli palanut jo kolme tuntia ja lyhentynyt 3 · 2 cm = 6 cm, joten alussa se oli 20 cm + 6 cm = 26 cm. Mittaus on alkuarvo vain silloin, kun se on tehty hetkellä x = 0."},{"tyyppi":"ansa","otsikko":"Ansa: väheneminen unohtuu kulmakertoimesta","sisalto":"Kun suure vähenee, kulmakerroin on negatiivinen. Jos kirjoitat kynttilälle f(x) = 2x + 26, malli väittää, että kynttilä pitenee 2 cm tunnissa: f(7) olisi 40 cm, vaikka mittaus oli 12 cm. Sama koskee säiliötä, josta vettä kuluu 20 litraa vuorokaudessa: kulmakerroin on −20, ja sen yksikkö on l/vrk. Tarkista mallin suunta yhdellä arvolla: kun x kasvaa, muuttuuko funktion arvo samaan suuntaan kuin tilanteessa?"},{"tyyppi":"kappale","otsikko":"Suoraan verrannollisuus on erikoistapaus, ja vertailu tehdään laskemalla","sisalto":"Suoratoistopalvelun elokuvavuokra maksaa 3,50 € elokuvalta, eikä kuukausimaksua ole. Hinta on f(x) = 3,5x eli f(x) = kx + b, jossa b = 0. Kun vakiotermi on nolla, nolla elokuvaa maksaa nolla euroa, kuvaaja kulkee origon kautta, ja hinnan ja elokuvien määrän suhde on sama, oli elokuvia yksi tai kymmenen: f(x) : x = 3,5, kun x ei ole nolla. Juuri tätä kahdeksannella luokalla kutsuttiin suoraan verrannollisuudeksi, ja silloinen verrannollisuuskerroin on sama luku kuin kulmakerroin. Suoraan verrannollisuus on siis lineaarisen riippuvuuden erikoistapaus: jokainen suoraan verrannollisuus on lineaarinen riippuvuus, mutta lineaarinen riippuvuus on suoraan verrannollisuutta vain, kun vakiotermi on nolla. Kuntosalin hinta f(x) = 4x + 19 ei ole suoraan verrannollinen käyntikertoihin, koska vakiotermi on 19: kaksi käyntiä maksaa 27 €, mutta neljä käyntiä 35 € eikä 54 €. Kun vertailet kahta vaihtoehtoa, laske molempien arvo samalla muuttujan arvolla. Liittymä A maksaa 9 € kuukaudessa ja 0,50 € gigatavulta, ja liittymä B 15 € kuukaudessa rajattomalla datalla. Kun dataa käytetään 6 Gt, A maksaa 9 € + 0,50 € · 6 = 12 € ja B 15 €, joten A on 3 € halvempi. Kun dataa käytetään 20 Gt, A maksaa 9 € + 10 € = 19 € ja on 4 € kalliimpi. Halvempi vaihtoehto riippuu käytöstä, ja siksi vertailun vastaukseen kuuluu se muuttujan arvo, jolla vertailu on laskettu."},{"tyyppi":"muistilappu","otsikko":"Muista nämä","kohdat":["Lineaarinen malli f(x) = kx + b: kulmakerroin k on muutos yhtä muuttujan yksikköä kohden (esimerkiksi €/min tai cm/h), vakiotermi b on funktion arvo, kun x = 0.","Vähenevän suureen kulmakerroin on negatiivinen.","Luku, joka toistuu jokaisella yksiköllä, kerrotaan x:llä. Kiinteä maksu on vakiotermi, vaikka se mainittaisiin tehtävässä viimeisenä.","Kahdesta mittauksesta: kulmakerroin on funktion arvon muutos jaettuna muuttujan muutoksella, ja vakiotermi saadaan sijoittamalla piste yhtälöön y = kx + b. Yhden mittauksen suhde ei ole kulmakerroin, eikä mittaus ole alkuarvo, ellei se ole hetkeltä x = 0.","Annettu muuttujan arvo sijoitetaan. Annetusta funktion arvosta kirjoitetaan yhtälö, josta ratkaistaan x. Tarkista sijoittamalla.","Tulkitse kulmakerroin ja vakiotermi tilanteen kielellä ja yksiköin.","Suoraan verrannollisuus on lineaarinen riippuvuus, jossa b = 0. Sen kuvaaja kulkee origon kautta.","Vertaile laskemalla molempien vaihtoehtojen arvot samalla muuttujan arvolla."]}],"harjoitusryhmat":[{"id":"malli","nimi":"Malli perusmaksusta ja yksikköhinnasta","info":"Ei laskinta. Kirjoita funktio vihkoon ennen kuin lasket. Anna vastaus ilman yksikköä."},{"id":"kaksi","nimi":"Malli kahdesta mittauksesta","info":"Ei laskinta. Laske ensin kulmakerroin muutoksista ja sitten vakiotermi sijoittamalla piste. Anna vastaus ilman yksikköä."},{"id":"vertailu","nimi":"Suoraan verrannollisuus ja vertailu","info":"Ei laskinta. Vertaile laskemalla molempien arvot samalla muuttujan arvolla. Anna vastaus ilman yksikköä."}],"harjoitukset":[{"id":"H01","ryhma":"malli","kysymys":"Sähköpotkulaudan vuokrassa on 1,10 €:n aloitusmaksu ja 0,20 € jokaiselta minuutilta. Hinta euroina on f(x) = kx + b, kun x on ajetut minuutit. Mikä on kulmakerroin k?","vastaus":0.2,"vinkki":"Mikä luku toistuu jokaisella minuutilla?","selitys":"Jokainen minuutti lisää hintaan 0,20 €, joten k = 0,2. Aloitusmaksu 1,10 € on vakiotermi, koska se maksetaan, vaikka minuutteja ei kertyisi. Funktio on f(x) = 0,2x + 1,1."},{"id":"H02","ryhma":"malli","kysymys":"Sähköpotkulaudan vuokrassa on 1,10 €:n aloitusmaksu ja 0,20 € jokaiselta minuutilta. Paljonko maksaa 18 minuutin ajo? Anna vastaus euroina ilman yksikköä.","vastaus":4.7,"vinkki":"Kirjoita f(x) = 0,2x + 1,1 ja laske f(18).","selitys":"f(18) = 0,2 · 18 + 1,1 = 3,6 + 1,1 = 4,70 €."},{"id":"H03","ryhma":"malli","kysymys":"Sähköpotkulaudan vuokra on f(x) = 0,2x + 1,1 euroa, kun x on ajetut minuutit. Ajo maksoi 6,10 €. Montako minuuttia ajo kesti?","vastaus":25,"vinkki":"6,10 € on hinta eli funktion arvo. Kirjoita yhtälö 0,2x + 1,1 = 6,1.","selitys":"0,2x + 1,1 = 6,1, joten 0,2x = 5 ja x = 5 : 0,2 = 50 : 2 = 25. Tarkistus: 0,2 · 25 + 1,1 = 6,1. Jos sait 2,32, sijoitit hinnan x:n paikalle ja laskit 6,1 minuutin ajon hinnan."},{"id":"H04","ryhma":"malli","kysymys":"Keilahallissa kenkien vuokra on 3 € kerralta, ja jokainen peli maksaa 7 €. Mikä funktio kertoo keilailukerran hinnan euroina, kun pelataan x peliä?","tyyppi":"monivalinta","vaihtoehdot":["f(x) = 3x + 7","f(x) = 7x + 3","f(x) = 10x","f(x) = 7x"],"vastaus":1,"vinkki":"Mikä maksu toistuu jokaisella pelillä, ja mikä maksetaan vain kerran?","selitys":"Jokainen peli lisää hintaan 7 €, joten kulmakerroin on 7. Kenkävuokra 3 € maksetaan kerran, joten se on vakiotermi: f(x) = 7x + 3. Vaihtoehdossa f(x) = 3x + 7 luvut ovat vaihtaneet paikkaa, ja vaihtoehdot f(x) = 10x ja f(x) = 7x unohtavat, että kenkävuokra maksetaan vain kerran."},{"id":"H05","ryhma":"malli","kysymys":"Kesätyössä Mikko saa 12 € jokaiselta työtunnilta, ja lisäksi jokaiselta työpäivältä maksetaan 10 €:n kiinteä lisä. Paljonko Mikko ansaitsee 7 tunnin työpäivänä? Anna vastaus euroina ilman yksikköä.","vastaus":94,"vinkki":"Päiväpalkka on f(x) = 12x + 10, kun x on työtunnit.","selitys":"f(7) = 12 · 7 + 10 = 84 + 10 = 94 €. Kiinteä lisä lasketaan kerran, vaikka tunteja on seitsemän."},{"id":"H06","ryhma":"malli","kysymys":"Mökin vesisäiliössä on 360 litraa vettä, ja vettä kuluu tasaisesti 15 litraa vuorokaudessa. Vesimäärä litroina on f(x) = kx + b, kun x on kuluneet vuorokaudet. Mikä on kulmakerroin k?","vastaus":-15,"vinkki":"Kasvaako vai väheneekö vesimäärä, kun vuorokausia kuluu?","selitys":"Vesimäärä vähenee 15 litraa jokaisena vuorokautena, joten k = −15. Vakiotermi on alkumäärä 360, ja funktio on f(x) = −15x + 360. Jos vastasit 15, malli väittäisi vesimäärän kasvavan."},{"id":"H07","ryhma":"malli","kysymys":"Mökin vesisäiliön vesimäärä on f(x) = −15x + 360 litraa, kun x on kuluneet vuorokaudet. Monenko vuorokauden kuluttua säiliössä on 135 litraa?","vastaus":15,"vinkki":"135 on funktion arvo. Ratkaise yhtälö −15x + 360 = 135.","selitys":"−15x + 360 = 135, joten −15x = −225 ja x = 15. Tarkistus: −15 · 15 + 360 = −225 + 360 = 135."},{"id":"H08","ryhma":"malli","kysymys":"Retkellä juomapullon vesimäärä millilitroina on f(x) = −50x + 400, kun x on retken alusta kuluneet tunnit. Mitä luku −50 tarkoittaa?","tyyppi":"monivalinta","vaihtoehdot":["Pullossa on retken alussa 50 ml vettä.","Vesimäärä vähenee 50 ml jokaisena tuntina.","Vesimäärä kasvaa 50 ml jokaisena tuntina.","Pullo on tyhjä 50 tunnin kuluttua."],"vastaus":1,"vinkki":"Laske f(0) ja f(1). Kuinka paljon ja mihin suuntaan vesimäärä muuttuu tunnissa?","selitys":"f(0) = 400 ja f(1) = 350, joten vesimäärä vähenee 50 ml jokaisena tuntina: kulmakerroin −50 on muutosnopeus −50 ml/h, ja miinusmerkki kertoo vähenemisestä. Luku 400 on vesimäärä retken alussa. Pullo on tyhjä, kun −50x + 400 = 0 eli 8 tunnin kuluttua, ei 50 tunnin kuluttua."},{"id":"H09","ryhma":"kaksi","kysymys":"Kynttilä palaa tasaisesti. Kun se on palanut 2 tuntia, se on 21 cm pitkä, ja kun se on palanut 5 tuntia, se on 15 cm pitkä. Mikä on pituuden funktion kulmakerroin senttimetreinä tuntia kohden?","vastaus":-2,"vinkki":"Jaa pituuden muutos ajan muutoksella: (15 − 21) : (5 − 2).","selitys":"k = (15 − 21) : (5 − 2) = −6 : 3 = −2. Kynttilä lyhenee 2 cm tunnissa, joten kulmakerroin on negatiivinen. Jos sait 3, jaoit yhden mittauksen 15 cm : 5 h. Se ei ole muutosnopeus, koska kynttilä ei ollut alussa 0 cm."},{"id":"H10","ryhma":"kaksi","kysymys":"Kynttilä palaa tasaisesti. Kun se on palanut 2 tuntia, se on 21 cm pitkä, ja kun se on palanut 5 tuntia, se on 15 cm pitkä. Kuinka pitkä kynttilä oli ennen sytyttämistä? Anna vastaus senttimetreinä ilman yksikköä.","vastaus":25,"vinkki":"Kulmakerroin on −2. Sijoita piste (2, 21) yhtälöön y = −2x + b.","selitys":"21 = −2 · 2 + b eli 21 = −4 + b, joten b = 25. Kynttilä oli alussa 25 cm. Mittaus 21 cm on hetkeltä x = 2, ei alusta: kahdessa tunnissa kynttilä oli jo lyhentynyt 4 cm."},{"id":"H11","ryhma":"kaksi","kysymys":"Kynttilä palaa tasaisesti. Kun se on palanut 1 tunnin, se on 22 cm pitkä, ja kun se on palanut 4 tuntia, se on 13 cm pitkä. Monenko tunnin palamisen jälkeen kynttilä on 10 cm pitkä?","vastaus":5,"vinkki":"Muodosta ensin malli: kulmakerroin muutoksista, vakiotermi sijoittamalla. Kirjoita sitten yhtälö, jossa pituus on 10.","selitys":"k = (13 − 22) : (4 − 1) = −9 : 3 = −3. 22 = −3 · 1 + b, joten b = 25. Malli on f(x) = −3x + 25. Yhtälöstä −3x + 25 = 10 saadaan −3x = −15 ja x = 5. Tarkistus: −15 + 25 = 10."},{"id":"H12","ryhma":"kaksi","kysymys":"Puhelinliittymän kuukausilasku koostuu kuukausimaksusta ja gigatavuhinnasta. Kun dataa käytetään 4 Gt, lasku on 17 €, ja kun dataa käytetään 10 Gt, lasku on 26 €. Mikä on gigatavuhinta euroina?","vastaus":1.5,"vinkki":"Paljonko lasku kasvaa, kun dataa käytetään 6 Gt enemmän?","selitys":"k = (26 − 17) : (10 − 4) = 9 : 6 = 1,5. Jokainen gigatavu lisää laskua 1,50 €."},{"id":"H13","ryhma":"kaksi","kysymys":"Puhelinliittymän kuukausilasku koostuu kuukausimaksusta ja gigatavuhinnasta. Kun dataa käytetään 4 Gt, lasku on 17 €, ja kun dataa käytetään 10 Gt, lasku on 26 €. Paljonko lasku on, kun dataa käytetään 7 Gt? Anna vastaus euroina ilman yksikköä.","vastaus":21.5,"vinkki":"Gigatavuhinta on 1,50 €. Ratkaise kuukausimaksu sijoittamalla piste (4, 17) yhtälöön y = 1,5x + b.","selitys":"17 = 1,5 · 4 + b eli 17 = 6 + b, joten b = 11, ja malli on f(x) = 1,5x + 11. f(7) = 10,5 + 11 = 21,50 €. Lasku ei ole suoraan verrannollinen datamäärään, joten laskua 17 € : 4 · 7 ei voi käyttää."},{"id":"H14","ryhma":"kaksi","kysymys":"Uima-allasta täytetään, ja vedenpinta nousee tasaisesti. Kun täyttö on kestänyt 2 tuntia, veden syvyys on 50 cm, ja kun täyttö on kestänyt 6 tuntia, syvyys on 110 cm. Sanni kirjoitti mallin f(x) = 15x + 50. Kulmakerroin on oikein. Mikä on oikea vakiotermi?","vastaus":20,"vinkki":"Onko 50 cm syvyys hetkellä x = 0?","selitys":"Sanni käytti ensimmäistä mittausta alkuarvona, vaikka se on hetkeltä x = 2. Sijoitus: 50 = 15 · 2 + b, joten b = 20. Oikea malli on f(x) = 15x + 20. Tarkistus: 15 · 6 + 20 = 110."},{"id":"H15","ryhma":"vertailu","kysymys":"Mikä näistä funktioista kuvaa suoraan verrannollisuutta?","tyyppi":"monivalinta","vaihtoehdot":["f(x) = 3,5x + 2","f(x) = 3,5x","f(x) = 3,5","f(x) = x + 3,5"],"vastaus":1,"vinkki":"Suoraan verrannollisuudessa nolla maksaa nolla: f(0) = 0.","selitys":"Funktiossa f(x) = 3,5x vakiotermi on 0, joten kuvaaja kulkee origon kautta ja f(x) : x = 3,5 jokaisella x:n arvolla, joka ei ole nolla. Funktioissa 3,5x + 2 ja x + 3,5 vakiotermi ei ole nolla. Vakiofunktio f(x) = 3,5 on muotoa f(x) = 0 · x + 3,5: sen vakiotermi on 3,5 eikä 0, joten f(0) = 3,5 eikä kuvaaja kulje origon kautta."},{"id":"H16","ryhma":"vertailu","kysymys":"Valokuvien teettämisen hinta euroina on lineaarinen funktio f(x) = kx + b, kun x on kuvien määrä. 4 kuvaa maksaa 10 € ja 10 kuvaa 25 €. Mikä on vakiotermi b?","vastaus":0,"vinkki":"Laske ensin kulmakerroin muutoksista ja sijoita sitten piste (4, 10) yhtälöön y = kx + b.","selitys":"k = (25 − 10) : (10 − 4) = 15 : 6 = 2,5. Sijoitus: 10 = 2,5 · 4 + b eli 10 = 10 + b, joten b = 0. Koska vakiotermi on 0, hinta on suoraan verrannollinen kuvien määrään: f(x) = 2,5x. Jos vastasit 10, pidit ensimmäistä mittausta vakiotermina."},{"id":"H17","ryhma":"vertailu","kysymys":"Suoratoistopalvelussa elokuvavuokrien hinta on suoraan verrannollinen elokuvien määrään, ja 6 elokuvaa maksaa 21 €. Hinta euroina on f(x) = kx, kun x on elokuvien määrä. Mikä on k?","vastaus":3.5,"vinkki":"Suoraan verrannollisuudessa k = f(x) : x.","selitys":"k = 21 : 6 = 3,5. Yksi elokuva maksaa 3,50 €, ja funktio on f(x) = 3,5x. Kahdeksannella luokalla tätä lukua kutsuttiin verrannollisuuskertoimeksi; se on myös kuvaajan kulmakerroin."},{"id":"H18","ryhma":"vertailu","kysymys":"Liittymä A maksaa 9 € kuukaudessa ja 0,50 € jokaiselta gigatavulta. Liittymä B maksaa 15 € kuukaudessa rajattomalla datalla. Dataa käytetään 10 Gt kuukaudessa. Montako euroa halvempi edullisempi liittymä on?","vastaus":1,"vinkki":"Laske molempien hinta, kun x = 10.","selitys":"A: 9 + 0,5 · 10 = 14 €. B: 15 €. A on 1 € halvempi. Jos dataa käytettäisiin enemmän, vertailun tulos voisi olla toinen, joten se lasketaan aina annetulla datamäärällä."},{"id":"H19","ryhma":"vertailu","kysymys":"Uimahallin kertalippu maksaa 6 €. Kuukausikortti maksaa 20 €, ja sillä jokainen käynti maksaa lisäksi 2 €. Uimahallissa käydään kuukauden aikana 8 kertaa. Montako euroa halvempi edullisempi vaihtoehto on?","vastaus":12,"vinkki":"Kertalipuilla hinta on 6x, kortilla 2x + 20.","selitys":"Kertaliput: 6 · 8 = 48 €. Kortti: 2 · 8 + 20 = 36 €. Kortti on 12 € halvempi. Jos sait 32, vertasit vain käyntihintoja (4 € · 8) ja unohdit kortin kuukausimaksun."},{"id":"H20","ryhma":"vertailu","kysymys":"Kahden kynttilän pituudet senttimetreinä ovat f(x) = −2x + 24 ja g(x) = −3x + 30, kun kynttilät ovat palaneet x tuntia. Montako senttimetriä pidempi pidempi kynttilä on 3 tunnin kuluttua?","vastaus":3,"vinkki":"Laske f(3) ja g(3).","selitys":"f(3) = −6 + 24 = 18 cm ja g(3) = −9 + 30 = 21 cm. Toinen kynttilä on 3 cm pidempi, vaikka se lyhenee nopeammin."}],"valmis_teksti":"Osaat muodostaa lineaarisen funktion f(x) = kx + b arkitilanteesta sekä perusmaksusta ja yksikköhinnasta että kahdesta mittaustuloksesta. Tulkitset kulmakertoimen muutosnopeutena ja vakiotermin alkuarvona tilanteen yksiköissä, lasket mallilla arvoja ja ratkaiset, millä muuttujan arvolla malli saa annetun arvon. Tiedät, että suoraan verrannollisuus on lineaarisen riippuvuuden erikoistapaus, jossa vakiotermi on nolla ja kuvaaja kulkee origon kautta, ja vertailet vaihtoehtoja laskemalla. Tämä taito on nyt näytetty."};

const esc = s => s;

      return `<div class="box note"><h3>${esc(o.otsikko)}</h3><ul class="notes">${
        o.kohdat.map(k=>`<li>${esc(k)}</li>`).join("")}</ul></div>`;
    case "numerotaulu":

      return `<div class="box nl"><h3>${esc(o.otsikko)}</h3><p style="margin:0 0 8px;font-size:14.5px;color:var(--ink-2)">${esc(o.sisalto)}</p>

/* ---------- lukusuora ---------- */
const svg=document.getElementById("nlsvg"), rng=document.getElementById("nlrange"), out=document.getElementById("nlout");
const X0=34, X1=606, Y=62;
function piirraNL(v){
  const ala=Math.floor(v/10)*10, yla=ala+10, puoli=ala+5;
  const pyor = (v%10)>=5 ? yla : ala;
  const x = n => X0 + (n/100)*(X1-X0);
  let s=`<line class="rail" x1="${X0}" y1="${Y}" x2="${X1}" y2="${Y}"/>`;
  for(let n=0;n<=100;n+=10){
    const near = (n===ala||n===yla);
    s+=`<line class="tick" x1="${x(n)}" y1="${Y-7}" x2="${x(n)}" y2="${Y+7}"/>`;
    s+=`<text class="stop${near?" near":""}" x="${x(n)}" y="${Y+24}" text-anchor="middle">${n}</text>`;
  }
  s+=`<line class="halfway" x1="${x(puoli)}" y1="${Y-16}" x2="${x(puoli)}" y2="${Y+12}"/>`;
  s+=`<text class="stop" x="${x(puoli)}" y="${Y-22}" text-anchor="middle">puoliväli ${puoli}</text>`;
  s+=`<circle class="dot" cx="${x(v)}" cy="${Y}" r="6"/>`;
  s+=`<text class="val" x="${x(v)}" y="${Y-32}" text-anchor="middle">${v}</text>`;
  s+=`<path d="M ${x(v)} ${Y+38} L ${x(pyor)} ${Y+38}" stroke="var(--core)" stroke-width="2" fill="none"/>`;
  s+=`<path d="M ${x(pyor)} ${Y+38} l ${x(pyor)>x(v)?-7:7} -4 l 0 8 z" fill="var(--core)"/>`;
  svg.innerHTML=s;
  out.textContent = `${v} pyöristyy → ${pyor}`;
}
if(svg){ piirraNL(+rng.value); rng.addEventListener("input",e=>piirraNL(+e.target.value)); }

/* ---------- laskujärjestys-widget ---------- */
const ljExp=document.getElementById("ljExp");
if(ljExp && D.kokeilu){
  let ljI=0, ljTokens=[], ljStep=0;
  const laske=(a,op,b)=>{a=+a;b=+b;return op==="×"?a*b:op==="÷"?a/b:op==="+"?a+b:a-b;};
  function ljAlku(){
    const l=D.kokeilu[ljI];
    ljTokens=l.lauseke.replace(/\(/g,"( ").replace(/\)/g," )").split(/\s+/).filter(Boolean);
    ljStep=0; ljPiirra(); ljViesti("","");
  }
  function ljViesti(t,lk){const f=document.getElementById("ljFb"); f.textContent=t; f.className="lj-fb "+(lk||"");}
  function ljPiirra(){
    const l=D.kokeilu[ljI];
    document.getElementById("ljStep").textContent =
      ljStep>=l.askeleet.length ? "valmis" : `askel ${ljStep+1} / ${l.askeleet.length}`;
    if(ljStep>=l.askeleet.length){
      ljExp.innerHTML=`<span class="valmis">${l.lauseke} = ${l.vastaus}</span>`;
      return;
    }
    ljExp.innerHTML=ljTokens.map((t,i)=>
      "×÷+−".includes(t) ? `<button type="button" class="op" data-i="${i}">${t}</button>`
                         : `<span class="tok">${t}</span>`).join("");
    ljExp.querySelectorAll("button.op").forEach(b=>b.addEventListener("click",()=>ljKlikkaa(+b.dataset.i)));
  }
  function ljKlikkaa(i){
    const l=D.kokeilu[ljI], odotettu=l.askeleet[ljStep];
    const ehdotus=[ljTokens[i-1],ljTokens[i],ljTokens[i+1]].join(" ");
    if(ehdotus!==odotettu){
      ljViesti(ljStep===0
        ? "Ei vielä. Sulkeet ovat vahvimmat, sitten kerto ja jako. Yhtä vahvat vasemmalta oikealle."
        : "Ei vielä. Kumpi jäljellä olevista on vahvempi?", "no");
      return;
    }
    const arvo=laske(ljTokens[i-1],ljTokens[i],ljTokens[i+1]);
    let alku=i-1, loppu=i+1;
    if(ljTokens[i-2]==="(" && ljTokens[i+2]===")"){ alku=i-2; loppu=i+2; }
    ljTokens.splice(alku, loppu-alku+1, String(arvo));
    ljStep++;
    ljViesti(ljStep>=l.askeleet.length ? "Valmis. Vastaus on "+l.vastaus+"." : "Oikein. Jatka seuraavaan.", "ok");
    ljPiirra();
  }
  document.getElementById("ljSeuraava").addEventListener("click",()=>{
    ljI=(ljI+1)%D.kokeilu.length; ljAlku();
  });
  ljAlku();
}

};

/* Suomalainen lukumuoto: välilyönti on tuhaterotin, pilkku desimaalierotin.
   Piste voi olla kumpi tahansa. Se tulkitaan tuhaterottimeksi VAIN silloin, kun
   koko luku on aitoa tuhaterotinmuotoa: alkuosa 1–3 numeroa ilman etunollaa ja
   jokainen jatko-osa täsmälleen 3 numeroa (1.500, 12.345.678). Kaikissa muissa
   tapauksissa piste on desimaalipiste — myös 0.125, joka vanhalla säännöllä
   ("3 numeroa pisteen jäljessä = tuhaterotin") luettiin virheellisesti luvuksi 125. */
const TUHATEROTIN = /^[1-9]\d{0,2}(\.\d{3})+$/;
function lueLuku(teksti){
  // Murtoluku (3/4, -3/4) ja sekaluku (1 2/3, -1 2/3) hyväksytään sellaisinaan.
  const raaka = String(teksti).replace(/\u00a0/g, " ").trim();
  let m = raaka.match(/^(-?)(\d+)\s+(\d+)\s*\/\s*(\d+)$/);
  if(m){ const nim = Number(m[4]); if(nim === 0) return null;
    const v = Number(m[2]) + Number(m[3]) / nim; return m[1] ? -v : v; }
  m = raaka.match(/^(-?)\s*(\d+)\s*\/\s*(\d+)$/);
  if(m){ const nim = Number(m[3]); if(nim === 0) return null;
    const v = Number(m[2]) / nim; return m[1] ? -v : v; }
  let s = String(teksti).replace(/[\s\u00a0]/g, "");
  if(s === "") return null;
  if(s.indexOf(",") >= 0){
    s = s.replace(/\./g, "").replace(",", ".");
  } else if(TUHATEROTIN.test(s)){
    s = s.replace(/\./g, "");
  }
  const n = Number(s);
  return Number.isFinite(n) ? n : null;
}

function tarkista(id){
  const h=D.harjoitukset.find(x=>x.id===id);
  const kentta=document.getElementById("in-"+id);
  const fb=document.getElementById("fb-"+id);
  if(kentta.value.trim()===""){ fb.className="fb hint"; fb.textContent="Kirjoita vastaus ensin."; return; }
  const luku=lueLuku(kentta.value);
  if(luku===null){ fb.className="fb no"; fb.textContent="Vastauksen pitää olla luku tai murtoluku (esimerkiksi 3/4)."; return; }
  const oikein = Math.abs(luku - h.vastaus) < 1e-9;
  merkitseTulos(id, oikein, oikein ? "Oikein. "+h.selitys : `Ei vielä. ${h.vinkki} Kokeile uudelleen.`);
}

function tarkistaMonivalinta(id, valittuIndeksi, painike){
  const h=D.harjoitukset.find(x=>x.id===id);
  const rivi=painike.closest(".row");
  rivi.querySelectorAll(".mv-valinta").forEach(b=>b.disabled=true);
  const oikein = valittuIndeksi===h.vastaus;
  painike.classList.add(oikein?"mv-oikein":"mv-vaarin");
  if(!oikein){
    const oikeaBtn=rivi.querySelector(`[data-i="${h.vastaus}"]`);
    if(oikeaBtn) oikeaBtn.classList.add("mv-oikein");
  }
  merkitseTulos(id, oikein, oikein ? "Oikein. "+h.selitys : `Ei ihan. Oikea vastaus on korostettu. ${h.selitys||""}`);
}

/* Kuuntelu: selain lukee tekstin ääneen omalla puhesynteesillään (englanniksi, jos laitteessa on
   englanninkielinen ääni). Ei äänitiedostoja eikä verkkoyhteyttä. Jos laite ei osaa puhua,
   teksti näytetään luettavaksi — silloin tehtävä muuttuu luetun ymmärtämiseksi, mutta ei katkea. */
function puhu(id, nopeus){
  const h=D.harjoitukset.find(x=>x.id===id); if(!h || !h.kuuntele) return;
  const vara=document.getElementById("vara-"+id);
  const naytaTeksti=syy=>{ vara.hidden=false; vara.textContent=syy+" Teksti: "+h.kuuntele; };
  if(!("speechSynthesis" in window)){ naytaTeksti("Tämä laite ei osaa lukea ääneen."); return; }
  const s=window.speechSynthesis; s.cancel();
  const u=new SpeechSynthesisUtterance(h.kuuntele);
  u.lang=h.kieli||"en-GB"; u.rate=nopeus;
  const aanet=s.getVoices(), kieli=u.lang.slice(0,2);
  const aani=aanet.find(a=>a.lang===u.lang) || aanet.find(a=>a.lang && a.lang.startsWith(kieli));
  if(aani) u.voice=aani;
  else if(aanet.length) { naytaTeksti("Laitteessa ei ole englanninkielistä ääntä."); return; }
  u.onerror=()=>naytaTeksti("Ääneen lukeminen ei onnistunut.");
  s.speak(u);
}
