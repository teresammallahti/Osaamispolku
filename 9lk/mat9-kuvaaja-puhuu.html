<title>Kuvaaja puhuu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">

<style>
:root{
  --paper:#EFF2F5; --surface:#FFFFFF; --surface-2:#F7F9FB;
  --grid:#DCE3EA; --line:#C9D3DC;
  --ink:#15222C; --ink-2:#4E626F; --ink-3:#7E8F9B;
  --core:#1B5A9E; --core-soft:#E4EDF6;
  --strong:#1F6E5C; --strong-soft:#E1F0EB;
  --chal:#9A6A16; --chal-soft:#F6EDDC;
  --alert:#A33A2B; --alert-soft:#F8E7E3;
  --shadow:0 1px 2px rgba(21,34,44,.06), 0 8px 24px -12px rgba(21,34,44,.18);
  --r:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0F161B; --surface:#18222A; --surface-2:#1D2830;
    --grid:#22303A; --line:#2E3E4A;
    --ink:#E8EFF4; --ink-2:#A3B4C0; --ink-3:#7A8B97;
    --core:#7FB2E4; --core-soft:#16303F;
    --strong:#77CDB4; --strong-soft:#123028;
    --chal:#E0B267; --chal-soft:#33270F;
    --alert:#E8907F; --alert-soft:#3A1E19;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -14px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --paper:#0F161B; --surface:#18222A; --surface-2:#1D2830;
  --grid:#22303A; --line:#2E3E4A;
  --ink:#E8EFF4; --ink-2:#A3B4C0; --ink-3:#7A8B97;
  --core:#7FB2E4; --core-soft:#16303F;
  --strong:#77CDB4; --strong-soft:#123028;
  --chal:#E0B267; --chal-soft:#33270F;
  --alert:#E8907F; --alert-soft:#3A1E19;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -14px rgba(0,0,0,.7);
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:16px; line-height:1.62;
  background-image:
    linear-gradient(to right, var(--grid) 1px, transparent 1px),
    linear-gradient(to bottom, var(--grid) 1px, transparent 1px);
  background-size:26px 26px;
}
.wrap{max-width:760px; margin:0 auto; padding:28px 20px 90px}
h1,h2,h3,h4{font-family:"Familjen Grotesk","IBM Plex Sans",system-ui,sans-serif; text-wrap:balance}

/* header */
header.top{background:var(--surface); border:1px solid var(--line); border-radius:var(--r);
  box-shadow:var(--shadow); padding:22px 24px; display:flex; gap:18px; align-items:flex-start}
.badge{flex:0 0 auto; width:54px; height:54px; border-radius:9px; display:grid; place-items:center;
  background:var(--core-soft); border:1px solid var(--core); color:var(--core)}
.badge svg{width:28px; height:28px; fill:none; stroke:currentColor; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round}
.eyebrow{font-family:"IBM Plex Mono",monospace; font-size:11px; letter-spacing:.14em;
  text-transform:uppercase; color:var(--ink-3); margin:0 0 5px}
header.top h1{margin:0; font-size:30px; font-weight:700; letter-spacing:-.015em}
header.top p{margin:5px 0 0; color:var(--ink-2); font-size:15px}
.tags{display:flex; flex-wrap:wrap; gap:5px; margin-top:11px}
.tag{font-family:"IBM Plex Mono",monospace; font-size:10.5px; letter-spacing:.05em; padding:2px 7px;
  border-radius:4px; background:var(--surface-2); border:1px solid var(--line); color:var(--ink-3)}
.tag.core{background:var(--core-soft); border-color:var(--core); color:var(--core)}

/* teksti */
article{margin-top:26px}
article h2{font-size:21px; font-weight:600; margin:32px 0 10px; letter-spacing:-.01em}
article p{margin:0 0 14px; max-width:64ch}
.lead{font-size:17.5px; color:var(--ink); border-left:3px solid var(--core); padding-left:16px; margin:0 0 8px}

.box{background:var(--surface); border:1px solid var(--line); border-radius:var(--r);
  padding:18px 22px; box-shadow:var(--shadow); margin:22px 0}
.box h3{margin:0 0 12px; font-size:16.5px; font-weight:600}
.box.warn{border-left:3px solid var(--alert)}
.box.note{border-left:3px solid var(--chal)}

ol.steps{margin:0; padding-left:0; list-style:none; counter-reset:s; display:grid; gap:12px}
ol.steps li{counter-increment:s; display:grid; grid-template-columns:auto 1fr; gap:13px; align-items:start}
ol.steps li::before{content:counter(s); font-family:"Familjen Grotesk",sans-serif; font-weight:700; font-size:14px;
  width:26px; height:26px; border-radius:50%; background:var(--core); color:#fff; display:grid; place-items:center; margin-top:2px}

ul.notes{margin:0; padding-left:19px}
ul.notes li{margin-bottom:7px}
ul.notes li:last-child{margin-bottom:0}

.tablewrap{overflow-x:auto}
table{border-collapse:collapse; width:100%; font-size:14.5px; min-width:460px}
th,td{text-align:left; padding:9px 13px; border-bottom:1px solid var(--line)}
th{font-family:"IBM Plex Mono",monospace; font-size:10.5px; letter-spacing:.1em; text-transform:uppercase;
  color:var(--ink-3); font-weight:400; background:var(--surface-2)}
tr:last-child td{border-bottom:0}
td b{color:var(--core); font-weight:600}
td:last-child{font-variant-numeric:tabular-nums; font-weight:600}

/* lukusuora */
.nl svg{width:100%; height:118px; display:block}
.nl .rail{stroke:var(--line); stroke-width:2}
.nl .tick{stroke:var(--line); stroke-width:1.5}
.nl .stop{fill:var(--ink-3); font-family:"IBM Plex Mono",monospace; font-size:11px}
.nl .stop.near{fill:var(--core); font-weight:600}
.nl .dot{fill:var(--chal)}
.nl .val{fill:var(--ink); font-family:"Familjen Grotesk",sans-serif; font-size:15px; font-weight:700}
.nl .halfway{stroke:var(--chal); stroke-dasharray:3 3; stroke-width:1.5}
.nl-controls{display:flex; align-items:center; gap:14px; margin-top:6px}
.nl-controls input{flex:1; accent-color:var(--core)}
.nl-out{font-family:"Familjen Grotesk",sans-serif; font-size:15px; font-weight:600; min-width:12.5em; text-align:right}

/* paikka-arvotaulu */
.box .ohje{margin:0 0 14px; font-size:14.5px; color:var(--ink-2)}
.nt-valinta{display:flex; flex-wrap:wrap; gap:7px; margin-bottom:16px}
.nt-valinta button{font:inherit; font-size:12.5px; font-family:"IBM Plex Mono",monospace; padding:5px 11px;
  border-radius:6px; border:1px solid var(--line); background:var(--surface-2); color:var(--ink-2); cursor:pointer}
.nt-valinta button[aria-pressed="true"]{background:var(--ink); color:var(--paper); border-color:var(--ink)}
.nt-valinta button:focus-visible{outline:2px solid var(--core); outline-offset:2px}
.nt-taulu{display:flex; flex-direction:column; gap:4px; align-items:flex-start; overflow-x:auto; padding-bottom:4px}
.nt-rivi{display:flex; gap:6px; align-items:center}
.nt-rivi .otsa{font-family:"IBM Plex Mono",monospace; font-size:9.5px; letter-spacing:.08em;
  text-transform:uppercase; color:var(--ink-3); width:52px; text-align:center}
.nt-ruutu{width:52px; height:52px; display:grid; place-items:center; border:1.5px solid var(--line);
  border-radius:7px; background:var(--surface-2); font-family:"IBM Plex Mono",monospace; font-size:24px}
.nt-ruutu.kohta{border-color:var(--core); background:var(--core-soft); color:var(--core); font-weight:500}
.nt-ruutu.ratkaiseva{border-color:var(--chal); background:var(--chal-soft); color:var(--chal); font-weight:500}
.nt-ruutu.nolla{color:var(--ink-3)}
.nt-rivi .nimi{font-size:12.5px; color:var(--ink-3); margin-left:12px; white-space:nowrap}
.nt-nuoli{font-size:17px; color:var(--chal); margin-left:6px}
.nt-selite{margin:14px 0 0; font-size:14.5px}
.nt-selite b{color:var(--core)}

/* vahvuusportaat */
.vp-tasot{display:grid; gap:9px; margin-bottom:18px}
.vp-taso{display:flex; gap:11px; align-items:flex-start; font-size:13.5px}
.vp-taso .vp-pallo{width:13px; height:13px; border-radius:4px; margin-top:5px; flex:0 0 auto}
.vp-taso[data-taso="sulkeet"] .vp-pallo{background:var(--core)}
.vp-taso[data-taso="kertojako"] .vp-pallo{background:var(--strong)}
.vp-taso[data-taso="yhteenvahennys"] .vp-pallo{background:var(--chal)}
.vp-taso strong{display:block; font-family:"Familjen Grotesk",sans-serif; font-weight:600; font-size:14.5px}
.vp-taso span{color:var(--ink-2)}
.vp-lauseke{display:flex; flex-wrap:wrap; gap:7px; align-items:flex-end; font-family:"IBM Plex Mono",monospace;
  font-size:25px; padding:10px 2px; min-height:64px}
.vp-lauseke .t{padding:2px 3px}
.vp-lauseke .op{position:relative; padding:2px 9px; border-radius:6px; font-weight:500}
.vp-lauseke .op[data-taso="sulkeet"]{background:var(--core-soft); color:var(--core)}
.vp-lauseke .op[data-taso="kertojako"]{background:var(--strong-soft); color:var(--strong)}
.vp-lauseke .op[data-taso="yhteenvahennys"]{background:var(--chal-soft); color:var(--chal)}
.vp-lauseke .op i{position:absolute; top:-9px; right:-6px; font-style:normal; font-family:"Familjen Grotesk",sans-serif;
  font-size:11px; font-weight:700; width:18px; height:18px; border-radius:50%; display:grid; place-items:center;
  background:currentColor}
.vp-lauseke .op i span{color:var(--surface)}
.vp-rivi{display:flex; align-items:center; gap:16px; margin-top:8px}
.vp-vastaus{font-family:"Familjen Grotesk",sans-serif; font-size:16px; font-weight:600; color:var(--strong)}

/* laskujärjestys-widget */
.lj-exp{display:flex; flex-wrap:wrap; gap:7px; align-items:center; font-family:"IBM Plex Mono",monospace;
  font-size:23px; padding:14px 4px; min-height:62px}
.lj-exp .tok{padding:2px 4px; color:var(--ink)}
.lj-exp button.op{font-family:"IBM Plex Mono",monospace; font-size:23px; padding:3px 12px; border-radius:7px;
  border:1.5px solid var(--line); background:var(--surface-2); color:var(--ink); line-height:1.2}
.lj-exp button.op:hover{border-color:var(--core); color:var(--core)}
.lj-exp button.op:focus-visible{outline:2px solid var(--core); outline-offset:2px}
.lj-exp .valmis{font-family:"Familjen Grotesk",sans-serif; font-size:23px; font-weight:700; color:var(--strong)}
.lj-fb{font-size:14.5px; min-height:1.5em; color:var(--ink-2)}
.lj-fb.no{color:var(--alert)}
.lj-fb.ok{color:var(--strong)}
.lj-row{display:flex; align-items:center; gap:14px; margin-top:10px}
.lj-step{font-family:"IBM Plex Mono",monospace; font-size:11.5px; letter-spacing:.1em;
  text-transform:uppercase; color:var(--ink-3)}

/* harjoitukset */
.progress{position:sticky; top:0; z-index:5; background:var(--surface); border:1px solid var(--line);
  border-radius:var(--r); padding:12px 18px; box-shadow:var(--shadow); display:flex; align-items:center;
  gap:14px; margin:34px 0 18px}
.progress .lbl{font-family:"IBM Plex Mono",monospace; font-size:11px; letter-spacing:.12em;
  text-transform:uppercase; color:var(--ink-3); white-space:nowrap}
.progress .meter{flex:1; height:7px; border-radius:4px; background:var(--surface-2); border:1px solid var(--line); overflow:hidden}
.progress .meter i{display:block; height:100%; background:var(--core); transition:width .25s ease}
.progress .cnt{font-family:"Familjen Grotesk",sans-serif; font-weight:700; font-variant-numeric:tabular-nums; white-space:nowrap}

.grp{margin-top:26px}
.grp-head{display:flex; align-items:baseline; gap:10px; border-bottom:1.5px solid var(--ink); padding-bottom:7px; margin-bottom:14px}
.grp-head h3{margin:0; font-size:17px; font-weight:600}
.grp-head span{font-size:12.5px; color:var(--ink-2)}

.ex{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:14px 16px; margin-bottom:10px}
.ex[data-tila="oikein"]{border-color:var(--strong); box-shadow:inset 3px 0 0 var(--strong)}
.ex[data-tila="vaarin"]{border-color:var(--alert); box-shadow:inset 3px 0 0 var(--alert)}
.ex .q{display:flex; gap:11px; align-items:baseline; flex-wrap:wrap}
.ex .num{font-family:"IBM Plex Mono",monospace; font-size:11.5px; color:var(--ink-3); min-width:2.4em}
.ex .txt{flex:1; min-width:190px; font-size:15.5px}
.ex .txt .aineisto{display:block; margin-bottom:9px; padding-left:12px;
  border-left:2px solid var(--line); color:var(--ink-2); line-height:1.6;
  /* Aineisto voi olla pieni taulukko, jonka rivit on erotettu rivinvaihdoilla.
     Ilman pre-lineä ne valuisivat yhdeksi kappaleeksi ja taulukko katoaisi. */
  white-space:pre-line}
.ex .txt .kysymysrivi{display:block; font-weight:600}
.ex .row{display:flex; gap:8px; align-items:center; margin-top:11px; flex-wrap:wrap}
.ex input[type=text]{font:inherit; font-family:"IBM Plex Mono",monospace; font-size:15px; width:8.5em;
  padding:7px 11px; border:1px solid var(--line); border-radius:7px; background:var(--surface-2);
  color:var(--ink); text-align:right}
.ex input:focus-visible{outline:2px solid var(--core); outline-offset:1px}
button{font:inherit; cursor:pointer}
.btn{font-size:13.5px; padding:7px 15px; border-radius:7px; border:1px solid var(--core);
  background:var(--core); color:#fff}
.btn.ghost{background:transparent; color:var(--ink-2); border-color:var(--line)}
.btn:focus-visible{outline:2px solid var(--core); outline-offset:2px}
.btn.mv-valinta{text-align:left}
/* kuuntelutehtävä: selaimen puhesynteesi lukee englanninkielisen tekstin */
.kuuntele{display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin:2px 0 10px}
.kuuntele .btn{display:inline-flex; gap:7px; align-items:center}
.kuuntele svg{width:16px; height:16px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round}
.kuuntele .varateksti{flex-basis:100%; font-size:14px; color:var(--ink-2); background:var(--surface-2);
  border-radius:7px; padding:8px 12px; margin:0}
.btn.mv-valinta:disabled{cursor:default; opacity:.65}
.btn.mv-oikein{background:var(--strong-soft); border-color:var(--strong); color:var(--strong); opacity:1}
.btn.mv-vaarin{background:var(--alert-soft); border-color:var(--alert); color:var(--alert); opacity:1}
.row.mv{gap:8px 10px}
.fb{margin-top:11px; font-size:14.5px; padding:10px 13px; border-radius:8px; line-height:1.5}
.fb.ok{background:var(--strong-soft); color:var(--strong)}
.fb.no{background:var(--alert-soft); color:var(--alert)}
.fb.hint{background:var(--chal-soft); color:var(--chal)}

.done{background:var(--strong-soft); border:1px solid var(--strong); color:var(--strong);
  border-radius:var(--r); padding:16px 20px; margin-top:20px; font-size:15.5px}
.done h3{margin:0 0 4px; font-size:17px; color:var(--strong)}

details.teacher{margin-top:34px; background:var(--surface); border:1px solid var(--line);
  border-left:3px solid var(--chal); border-radius:var(--r); padding:15px 20px; box-shadow:var(--shadow)}
details.teacher summary{cursor:pointer; font-family:"Familjen Grotesk",sans-serif; font-weight:600; font-size:15px}
details.teacher summary:focus-visible{outline:2px solid var(--core); outline-offset:3px}
details.teacher ul{margin:12px 0 0; padding-left:19px; color:var(--ink-2); font-size:14.5px}
details.teacher li{margin-bottom:8px}
details.teacher p{margin:12px 0 0; color:var(--ink-2); font-size:14.5px}

.back{display:inline-block; margin-top:30px; font-size:13.5px; color:var(--ink-2)}
.back a{color:var(--core)}

@media (prefers-reduced-motion: reduce){*{transition:none !important}}
@media (max-width:560px){
  .wrap{padding:16px 13px 70px}
  header.top h1{font-size:25px}
  .progress{flex-wrap:wrap}
}
</style>

<div class="wrap">

  <header class="top">
    <span class="badge"><svg viewBox="0 0 24 24" aria-hidden="true" id="ikoni"></svg></span>
    <div>
      <p class="eyebrow" id="eyebrow"></p>
      <h1 id="otsikko"></h1>
      <p id="kuvaus"></p>
      <div class="tags" id="tags"></div>
    </div>
  </header>

  <article id="teksti"></article>

  <div class="progress" aria-live="polite">
    <span class="lbl">Harjoitukset</span>
    <span class="meter"><i id="pbar" style="width:0%"></i></span>
    <span class="cnt" id="pcnt">0 / 20</span>
  </div>

  <div id="harjoitukset"></div>
  <div id="valmis"></div>

  <p class="back" id="back"></p>

</div>

<script>
const D = {"tavoite_id":"MAT9-FUN-02","oppiaine":"MAT","vuosiluokka":9,"otsikko":"Kuvaaja puhuu","kuvaus":"Osaan lukea kuvaajasta funktion arvoja ja tulkita, missä funktio kasvaa ja missä se vähenee.","versio":"0.2","paivitetty":"2026-10-11","ops":{"T":["T7","T8","T15"],"S":["S4"]},"taso":"ydin","ikoni":"syke","eyebrow":"Matematiikka · 9. luokka · Funktiot ja lukujonot","teksti":[{"tyyppi":"johdanto","sisalto":"Puhelimen akkuasetuksissa on kuvaaja, joka näyttää varauksen viimeisen vuorokauden ajalta. Siitä näkee yhdellä silmäyksellä, milloin puhelin oli laturissa, milloin sillä pelattiin ja milloin se vain lepäsi yöpöydällä. Urheilusovellus piirtää lenkistä samanlaisen kuvaajan: kuinka kaukana kotoa olit milloinkin ja missä kohdassa pysähdyit. Kuvaajasta voi lukea tapahtumat ilman yhtäkään laskua, kunhan tietää, mitä akseleilla on. Tässä taidossa opit lukemaan kuvaajasta funktion arvoja kumpaankin suuntaan, kertomaan tilanteen kielellä, millä väleillä funktio kasvaa, vähenee tai pysyy vakiona, ja päättelemään pystysuoran suoran avulla, voiko annettu käyrä olla funktion kuvaaja."},{"tyyppi":"saanto","otsikko":"Näin luet arvon kuvaajasta","askeleet":["Lue ensin akselit. Vaaka-akselilla on muuttuja ja pystyakselilla funktion arvo, ja kummallakin on suure ja yksikkö, esimerkiksi aika tunteina ja akun varaus prosentteina. Kuvaajan piste (x, f(x)) kertoo, että muuttujan arvolla x funktion arvo on f(x).","Tässä materiaalissa kuvaajat kerrotaan sanoin. Tehtävässä luetellaan pisteet, joissa kuvaaja muuttaa suuntaa, siinä järjestyksessä kuin kuvaaja kulkee, ja pisteiden välillä kuvaaja on jana. Esimerkki: vaaka-akselilla on aika tunteina (0–12), pystyakselilla puhelimen akun varaus prosentteina, ja kuvaaja kulkee pisteiden (0, 100), (6, 20), (7, 20), (9, 100) ja (12, 60) kautta. Voit piirtää kuvauksesta luonnoksen ruutupaperille.","Arvo muuttujan kohdalla: etsi kohta vaaka-akselilta, kulje pystysuoraan kuvaajalle ja lue arvo pystyakselilta. Kun kohta on lueteltu piste, arvo näkyy suoraan: 9 tunnin kohdalla varaus on 100 %.","Kun kohta on kahden luetellun pisteen välissä, arvo on janalla. Janalla arvo muuttuu tasaisesti, joten janan keskikohdassa arvo on päätepisteiden arvojen keskiarvo: 3 tunnin kohdalla varaus on (100 + 20) : 2 = 60 %.","Toiseen suuntaan: etsi arvo pystyakselilta, kulje vaakasuoraan koko kuvaajan yli ja lue jokaisen kohtaamisen kohdalta muuttujan arvo vaaka-akselilta. Varaus on 60 % kolme kertaa: 3 tunnin kohdalla varauksen laskiessa, 8 tunnin kohdalla laturissa ja 12 tunnin kohdalla. Ensimmäisen kerran se on 60 % kolmen tunnin kuluttua. Funktio voi saada saman arvon monta kertaa.","Vastaa siinä yksikössä, jota kysytään. Jos vaaka-akselilla on minuutit ja kysytään tunteja, jaa 60:llä: 90 min = 1,5 h. Puoli tuntia on 30 minuuttia, joten 1,5 h on 1 h 30 min eikä 1 h 50 min."]},{"tyyppi":"ansa","otsikko":"Ansa 1: väärä akseli tai väärä yksikkö","sisalto":"Lämpötilan kuvaaja kulkee pisteiden (0, 4), (6, 16) ja (10, 4) kautta, kun vaaka-akselilla on aika tunteina ja pystyakselilla lämpötila celsiusasteina. Kysymys ”milloin lämpötila on 10 °C?” kysyy aikaa, joten luku 10 etsitään pystyakselilta ja vastaus luetaan vaaka-akselilta: 3 h ja 8 h. Jos etsit luvun 10 vaaka-akselilta, luet lämpötilan 10 tunnin kohdalla, 4 °C, eikä se vastaa kysymykseen. Mieti ennen vastaamista, kumpaa suuretta kysytään, ja tarkista, että vastauksessa on sen yksikkö: ”milloin” vastataan ajalla, ”kuinka lämmin” lämpötilalla. Yksikössä on toinen ansa. Jos vaaka-akselilla on minuutit, kohta 90 tarkoittaa 90:tä minuuttia eikä 90:tä tuntia. Tunneiksi muutettuna 90 min = 1,5 h, ja takaisin minuuteiksi 1,5 h = 60 min + 30 min = 90 min. Desimaaliosa ,5 tarkoittaa puolta tuntia eli 30 minuuttia, ei 50:tä minuuttia."},{"tyyppi":"kappale","otsikko":"Kasvaa, vähenee vai pysyy vakiona","sisalto":"Funktio on kasvava välillä, jolla kuvaaja nousee vasemmalta oikealle: kun muuttujan arvo suurenee, myös funktion arvo suurenee. Funktio on vähenevä välillä, jolla kuvaaja laskee, ja vakio välillä, jolla kuvaaja on vaakasuora. Puhelimen akun kuvaajassa (pisteet (0, 100), (6, 20), (7, 20), (9, 100) ja (12, 60)) varaus vähenee välillä 0–6 h, pysyy vakiona välillä 6–7 h, kasvaa välillä 7–9 h ja vähenee välillä 9–12 h. Välit nimetään alku- ja loppukohdastaan. Lueteltujen pisteiden välissä kuvaaja on jana, joten suunta voi vaihtua vain lueteltuissa pisteissä. Siksi riittää verrata peräkkäisten pisteiden arvoja: jos jälkimmäinen arvo on suurempi, funktio kasvaa niiden välillä, jos pienempi, se vähenee, ja jos arvot ovat samat, se on vakio. Tilanteen kielellä samat asiat kerrotaan sanoin, jotka kuuluvat tilanteeseen. Välillä 6–7 h puhelin on sammutettuna, ja varaus pysyy 20 prosentissa. Välillä 7–9 h puhelin on laturissa, ja varaus nousee 20 prosentista 100 prosenttiin. Välillä 9–12 h puhelinta käytetään, ja varaus laskee 60 prosenttiin. Pelkkä ”funktio kasvaa” ei kerro, mitä tapahtui. Hyvä kuvaus kertoo välin, suunnan ja sen, mitä tilanteessa tapahtuu. Syytä kuvaaja ei kerro varmasti (varaus voi nousta myös varavirtalähteestä), mutta suunnan ja lukemat se kertoo."},{"tyyppi":"ansa","otsikko":"Ansa 2: pakkasella lämpötila voi nousta","sisalto":"Talvipäivän lämpötilan kuvaaja kulkee pisteiden (0, −12), (5, −4) ja (8, −10) kautta. Välillä 0–5 h lämpötila nousee −12 asteesta −4 asteeseen, vaikka koko ajan on pakkasta: kuvaaja nousee vasemmalta oikealle, ja −4 on suurempi luku kuin −12. Virhe syntyy, kun ajatellaan pakkasasteita: 12 pakkasastetta muuttuu neljäksi, ja luku tuntuu pienenevän. Pakkasasteiden väheneminen tarkoittaa, että lämpötila nousee. Kasvaminen ja väheneminen kertovat kuvaajan suunnasta, eivät arvojen etumerkistä: negatiivinen arvo ei tarkoita vähenemistä, eikä positiivinen arvo kasvamista. Välillä 5–8 h lämpötila laskee −4 asteesta −10 asteeseen. Jos olet epävarma, sijoita luvut lukusuoralle: oikealla oleva luku on suurempi."},{"tyyppi":"ansa","otsikko":"Ansa 3: kasvaminen tapahtuu välillä, ei kohdassa","sisalto":"Akun kuvaajassa varaus pysyy 20 prosentissa välillä 6–7 h ja nousee sitten 100 prosenttiin 9 tunnin kohdalla. Vastaukset ”varaus kasvaa kohdassa 9” ja ”varaus kasvaa kohdassa 7” ovat vääriä. Kasvaminen tarkoittaa, että myöhempi arvo on suurempi kuin aiempi, joten siihen tarvitaan kaksi hetkeä eli väli. Lueteltu piste on kohta, jossa kuvaaja kääntyy, ja se on välin raja. Oikea vastaus on: varaus kasvaa välillä 7–9 h. Toinen virhe on rajata väli väärin, esimerkiksi 6–9 h, vaikka välillä 6–7 h varaus pysyy samana. Kirjoita välin alku ja loppu ja tarkista, että kuvaaja nousee koko välin ajan."},{"tyyppi":"kappale","otsikko":"Kuljettu matka ja etäisyys kotoa","sisalto":"Kahdella kuvaajalla voi olla vaaka-akselilla aika ja pystyakselilla kilometrit, ja silti ne esittävät eri suureita. Kuljettu matka kertoo, kuinka paljon olet liikkunut lähdöstä lähtien. Jokainen kuljettu metri lisätään siihen, kuljitpa mihin suuntaan tahansa, joten kuljettu matka ei voi vähetä: kun liikut, se kasvaa, ja kun seisot paikallasi, se pysyy samana. Etäisyys kotoa kertoo, kuinka kaukana kotoa olet. Se kasvaa, kun menet poispäin, ja vähenee, kun palaat. Esimerkki: pyöräilet 3 km kauppaan, olet kaupassa vähän aikaa ja ajat saman tien takaisin. Etäisyyden kuvaaja nousee 3 kilometriin, on vaakasuora ja laskee takaisin nollaan. Kuljetun matkan kuvaaja nousee 3 kilometriin, on vaakasuora ja nousee vielä 6 kilometriin. Jos kuvaajan pystyakselilla on kuljettu matka ja kuvaaja laskee jollakin välillä, kuvaaja on väärin. Laskeva kuvaaja voi olla oikein, jos pystyakselilla on etäisyys. Lue siksi pystyakselin suure ennen kuin tulkitset nousua ja laskua."},{"tyyppi":"kappale","otsikko":"Voiko käyrä olla funktion kuvaaja?","sisalto":"Funktiossa jokaista muuttujan arvoa vastaa täsmälleen yksi funktion arvo. Kuvaaja on funktion pisteiden (x, f(x)) joukko, joten jokaisen vaaka-akselin kohdan kohdalla kuvaajalla on enintään yksi piste. Tämän voi tarkistaa pystysuoralla suoralla. Merkintä x = 1 tarkoittaa pystysuoraa suoraa, jonka jokaisen pisteen x-koordinaatti on 1, ja x = 0 on y-akseli. Kuvittele pystysuora suora, joka liukuu käyrän yli vasemmalta oikealle. Jos jokin pystysuora suora leikkaa käyrää kahdessa tai useammassa pisteessä, samaa muuttujan arvoa vastaisi kaksi arvoa, eikä käyrä voi olla funktion kuvaaja. Jos mikään pystysuora suora ei leikkaa käyrää useammin kuin kerran, käyrä voi olla funktion kuvaaja. Esimerkki: ympyrä, jonka keskipiste on origo ja säde 5. Pystysuora suora x = 0 leikkaa sitä pisteissä (0, 5) ja (0, −5), joten muuttujan arvoa 0 vastaisi kaksi arvoa, 5 ja −5. Ympyrä ei siis ole funktion kuvaaja. Kun ympyrän keskipiste ei ole origossa, valitse keskipisteen kautta kulkeva pystysuora suora. Jos keskipiste on (−1, 3) ja säde 2, suora x = −1 leikkaa ympyrää pisteissä (−1, 3 + 2) = (−1, 5) ja (−1, 3 − 2) = (−1, 1), koska leikkauspisteet ovat säteen verran keskipisteen ylä- ja alapuolella. Käyrä, joka kulkee pisteiden (−3, 2), (0, −1) ja (2, 4) kautta janoina, voi olla funktion kuvaaja: se etenee koko ajan oikealle, joten jokainen pystysuora suora kohtaa sen enintään kerran. Kun käyrän pisteet on lueteltu siinä järjestyksessä kuin käyrä kulkee, katso x-koordinaatteja. Jos x-koordinaattien suunta vaihtuu jossakin luetellussa pisteessä (kasvavasta pienenevään tai pienenevästä kasvavaan), käyrä kääntyy takaisin, ja jokin pystysuora suora leikkaa sitä kahdesti. Jos kahden peräkkäisen pisteen x-koordinaatti on sama, niiden välinen jana on pystysuora, ja kaikkia sen pisteitä vastaa sama muuttujan arvo. Kun perustelet, nimeä sekä pystysuora suora (esimerkiksi x = 0) että kaksi leikkauspistettä tai kaksi funktion arvoa."},{"tyyppi":"ansa","otsikko":"Ansa 4: vaakasuora suora kelpaa","sisalto":"Vaakasuora suora, joka kulkee pisteen (0, 3) kautta, on funktion kuvaaja: jokaisella muuttujan arvolla funktion arvo on 3. Väärä päättely kuuluu: ”vaakasuora suora leikkaa sitä äärettömän monessa pisteessä, joten se ei ole funktio.” Testi tehdään pystysuoralla suoralla, koska kysymys on siitä, montako arvoa yhtä muuttujan arvoa vastaa. Jokainen pystysuora suora leikkaa vaakasuoraa suoraa täsmälleen yhdessä pisteessä, esimerkiksi suora x = 4 pisteessä (4, 3). Funktio saa saada saman arvon monella muuttujan arvolla, kuten akun varaus oli 60 % kolmesti. Kiellettyä on vain se, että yksi muuttujan arvo saa kaksi arvoa. Pystysuora suora, esimerkiksi x = 2, ei sen sijaan ole funktion kuvaaja, koska muuttujan arvoa 2 vastaisi äärettömän monta arvoa."},{"tyyppi":"muistilappu","otsikko":"Muista nämä","kohdat":["Vaaka-akselilla on muuttuja, pystyakselilla funktion arvo. Lue ensin kummankin suure ja yksikkö.","”Mikä on arvo kohdassa x?” → lue arvo pystyakselilta. ”Milloin arvo on y?” → etsi y pystyakselilta, kulje koko kuvaajan yli ja lue jokainen kohta vaaka-akselilta.","Janan keskikohdassa arvo on päätepisteiden arvojen keskiarvo.","Vastaa pyydetyssä yksikössä: 90 min = 1,5 h = 1 h 30 min.","Kasvava, vähenevä ja vakio nimetään väleinä, esimerkiksi 7–9 h. Negatiivinen arvo ei tarkoita vähenemistä.","Kuljettu matka ei voi vähetä. Etäisyys kotoa voi.","Jos jokin pystysuora suora leikkaa käyrää kahdesti, käyrä ei ole funktion kuvaaja. Vaakasuora suora on funktion kuvaaja, pystysuora suora ei."]}],"harjoitusryhmat":[{"id":"arvot","nimi":"Arvot kuvaajasta","info":"Laske ilman laskinta. Kuvaaja kulkee lueteltujen pisteiden kautta, ja pisteiden välillä se on jana. Kirjoita vastaukseksi pelkkä luku siinä yksikössä, jota kysytään."},{"id":"muutos","nimi":"Kasvaa, vähenee, pysyy vakiona","info":"Laske ilman laskinta. Kun funktio kasvaa, kuvaaja nousee vasemmalta oikealle, kun funktio vähenee, kuvaaja laskee, ja kun funktio on vakio, kuvaaja on vaakasuora. Katso suuntaa, älä etumerkkiä. Kirjoita vastaukseksi pelkkä luku."},{"id":"oikein","nimi":"Voiko kuvaaja olla oikein?","info":"Laske ilman laskinta. Kuljettu matka ei voi vähetä, mutta etäisyys kotoa voi. Käyrän pisteet luetellaan siinä järjestyksessä kuin käyrä kulkee. Käyrä voi olla funktion kuvaaja vain, jos mikään pystysuora suora ei leikkaa sitä useammin kuin kerran."}],"harjoitukset":[{"id":"H01","ryhma":"arvot","kysymys":"Vaaka-akselilla on aika tunteina (0–8), pystyakselilla sähköpotkulaudan akun varaus prosentteina. Kuvaaja kulkee pisteiden (0, 100), (3, 40), (4, 40), (6, 80) ja (8, 50) kautta, ja pisteiden välillä se on jana.\n\nMikä on akun varaus 4 tunnin kohdalla? Anna vastaus prosentteina ilman %-merkkiä.","vastaus":40,"vinkki":"Etsi kohta 4 vaaka-akselilta. Se on yksi luetelluista pisteistä.","selitys":"Piste (4, 40) on kuvaajalla, joten 4 tunnin kohdalla varaus on 40 %."},{"id":"H02","ryhma":"arvot","kysymys":"Vaaka-akselilla on aika tunteina (0–8), pystyakselilla sähköpotkulaudan akun varaus prosentteina. Kuvaaja kulkee pisteiden (0, 100), (3, 40), (4, 40), (6, 80) ja (8, 50) kautta, ja pisteiden välillä se on jana.\n\nMikä on akun varaus 7 tunnin kohdalla? Anna vastaus prosentteina ilman %-merkkiä.","vastaus":65,"vinkki":"Kohta 7 h on kahden luetellun pisteen puolivälissä.","selitys":"Kohta 7 h on pisteiden (6, 80) ja (8, 50) välisen janan keskikohta, joten varaus on (80 + 50) : 2 = 65 %."},{"id":"H03","ryhma":"arvot","kysymys":"Vaaka-akselilla on aika tunteina (0–8), pystyakselilla sähköpotkulaudan akun varaus prosentteina. Kuvaaja kulkee pisteiden (0, 100), (3, 40), (4, 40), (6, 80) ja (8, 50) kautta, ja pisteiden välillä se on jana.\n\nMinkä ajan kuluttua varaus on ensimmäisen kerran 70 %? Anna vastaus minuutteina.","vastaus":90,"vinkki":"Varaus laskee alussa 100 prosentista 40 prosenttiin. Missä kohdassa se on puolivälissä? Muuta lopuksi tunnit minuuteiksi.","selitys":"70 on lukujen 100 ja 40 keskiarvo, joten varaus on 70 % ensimmäisen janan keskikohdassa 1,5 tunnin kohdalla. 1,5 h = 60 min + 30 min = 90 min. Vastaus 110 syntyisi, jos 1,5 h luettaisiin 1 h 50 min."},{"id":"H04","ryhma":"arvot","kysymys":"Vaaka-akselilla on aika tunteina (0–8), pystyakselilla sähköpotkulaudan akun varaus prosentteina. Kuvaaja kulkee pisteiden (0, 100), (3, 40), (4, 40), (6, 80) ja (8, 50) kautta, ja pisteiden välillä se on jana.\n\nMontako kertaa varaus on 45 %?","vastaus":2,"vinkki":"Kulje korkeudella 45 koko kuvaajan yli ja tarkista jokaisesta janasta, onko 45 sen päätepisteiden arvojen välissä.","selitys":"Varaus on 45 % laskiessa välillä 0–3 h ja noustessa välillä 4–6 h, koska 45 on näiden janojen päätepisteiden arvojen välissä. Välillä 6–8 h varaus laskee vain 50 prosenttiin asti, joten 45 % ei esiinny siellä. Vastaus 1 kertoo, että lopetit ensimmäiseen kohtaamiseen."},{"id":"H05","ryhma":"arvot","kysymys":"Vaaka-akselilla on aika minuutteina (0–120), pystyakselilla Joonan etäisyys kotoa kilometreinä. Kuvaaja kulkee pisteiden (0, 0), (20, 4), (50, 4), (70, 2) ja (120, 0) kautta, ja pisteiden välillä se on jana.\n\nKuinka monta tuntia Joonan etäisyys kotoa pysyy samana? Anna vastaus tunteina.","vastaus":0.5,"vinkki":"Vaaka-akselilla on minuutit. Katso, kuinka kauan kuvaaja on vaakasuora, ja muuta minuutit tunneiksi.","selitys":"Etäisyys pysyy 4 kilometrissä välillä 20–50 min eli 30 minuuttia. 30 min = 0,5 h. Vastaus 30 olisi minuutteina."},{"id":"H06","ryhma":"arvot","kysymys":"Vaaka-akselilla on aika minuutteina (0–120), pystyakselilla Joonan etäisyys kotoa kilometreinä. Kuvaaja kulkee pisteiden (0, 0), (20, 4), (50, 4), (70, 2) ja (120, 0) kautta, ja pisteiden välillä se on jana.\n\nKuinka kaukana kotoa Joona on, kun lähdöstä on kulunut 1 tunti? Anna vastaus kilometreinä.","vastaus":3,"vinkki":"Muuta ensin 1 tunti minuuteiksi, koska vaaka-akselilla on minuutit.","selitys":"1 h = 60 min. Kohta 60 min on pisteiden (50, 4) ja (70, 2) välisen janan keskikohta, joten etäisyys on (4 + 2) : 2 = 3 km. Jos lukisit kohdan 1 minuutti, saisit lähes nollan."},{"id":"H07","ryhma":"arvot","kysymys":"Vaaka-akselilla on aika minuutteina (0–120), pystyakselilla Joonan etäisyys kotoa kilometreinä. Kuvaaja kulkee pisteiden (0, 0), (20, 4), (50, 4), (70, 2) ja (120, 0) kautta, ja pisteiden välillä se on jana.\n\nMinkä ajan kuluttua lähdöstä Joona on ensimmäisen kerran 2 kilometrin päässä kotoa? Anna vastaus minuutteina.","vastaus":10,"vinkki":"Etsi 2 km pystyakselilta. Ensimmäisellä janalla etäisyys kasvaa 0 kilometristä 4 kilometriin.","selitys":"2 km on puolet 4 kilometristä, joten Joona on 2 kilometrin päässä ensimmäisen janan keskikohdassa 10 minuutin kohdalla."},{"id":"H08","ryhma":"arvot","kysymys":"Vaaka-akselilla on aika minuutteina (0–120), pystyakselilla Joonan etäisyys kotoa kilometreinä. Kuvaaja kulkee pisteiden (0, 0), (20, 4), (50, 4), (70, 2) ja (120, 0) kautta, ja pisteiden välillä se on jana.\n\nMontako kertaa Joona on 3 kilometrin päässä kotoa?","vastaus":2,"vinkki":"Kulje korkeudella 3 koko kuvaajan yli: sekä mennessä että palatessa.","selitys":"Joona on 3 kilometrin päässä mennessä välillä 0–20 min ja palatessa 60 minuutin kohdalla. Välillä 70–120 min etäisyys on enintään 2 km."},{"id":"H09","ryhma":"muutos","kysymys":"Vaaka-akselilla on aika tunteina (0–12), pystyakselilla ulkolämpötila celsiusasteina. Kuvaaja kulkee pisteiden (0, −3), (3, −9), (5, −9), (9, −1) ja (12, −4) kautta, ja pisteiden välillä se on jana.\n\nKuinka monta tuntia lämpötila pysyy samana?","vastaus":2,"vinkki":"Etsi kaksi peräkkäistä pistettä, joissa lämpötila on sama.","selitys":"Pisteissä (3, −9) ja (5, −9) lämpötila on sama, joten se pysyy samana välillä 3–5 h eli 2 tuntia."},{"id":"H10","ryhma":"muutos","kysymys":"Vaaka-akselilla on aika tunteina (0–12), pystyakselilla ulkolämpötila celsiusasteina. Kuvaaja kulkee pisteiden (0, −3), (3, −9), (5, −9), (9, −1) ja (12, −4) kautta, ja pisteiden välillä se on jana.\n\nMonenko tunnin kohdalla lämpötila alkaa nousta?","vastaus":5,"vinkki":"Lämpötila pysyy ensin hetken samana. Milloin kuvaaja alkaa nousta?","selitys":"Lämpötila pysyy −9 asteessa välillä 3–5 h ja alkaa nousta 5 tunnin kohdalla. Vastaus 3 on kohta, jossa lämpötila lakkaa laskemasta."},{"id":"H11","ryhma":"muutos","kysymys":"Vaaka-akselilla on aika tunteina (0–12), pystyakselilla ulkolämpötila celsiusasteina. Kuvaaja kulkee pisteiden (0, −3), (3, −9), (5, −9), (9, −1) ja (12, −4) kautta, ja pisteiden välillä se on jana.\n\nKuinka monta tuntia lämpötila nousee?","vastaus":4,"vinkki":"Vertaa peräkkäisiä lukuja lukusuoralla. −1 on suurempi kuin −9.","selitys":"Lämpötila nousee välillä 5–9 h −9 asteesta −1 asteeseen, vaikka on pakkasta. Nousu kestää 4 h. Vastaus 6 syntyy, jos suunta luetaan pakkasasteista."},{"id":"H12","ryhma":"muutos","kysymys":"Vaaka-akselilla on aika tunteina (0–12), pystyakselilla ulkolämpötila celsiusasteina. Kuvaaja kulkee pisteiden (0, −3), (3, −9), (5, −9), (9, −1) ja (12, −4) kautta, ja pisteiden välillä se on jana.\n\nKuinka monta tuntia yhteensä lämpötila laskee?","vastaus":6,"vinkki":"Laske yhteen kaikki välit, joilla kuvaaja laskee vasemmalta oikealle.","selitys":"Lämpötila laskee välillä 0–3 h ja välillä 9–12 h, yhteensä 3 h + 3 h = 6 h. Vastaus 4 syntyy, jos pakkasella nouseva lämpötila luetaan laskevaksi."},{"id":"H13","ryhma":"muutos","kysymys":"Vaaka-akselilla on aika tunteina (0–12), pystyakselilla ulkolämpötila celsiusasteina. Kuvaaja kulkee pisteiden (0, −3), (3, −9), (5, −9), (9, −1) ja (12, −4) kautta, ja pisteiden välillä se on jana.\n\nKuinka monta astetta lämpötila nousee koko nousun aikana?","vastaus":8,"vinkki":"Laske loppulukeman ja alkulukeman erotus: suurempi miinus pienempi.","selitys":"Lämpötila nousee −9 asteesta −1 asteeseen: −1 − (−9) = 8. Vastaus 10 syntyy, jos luvut 9 ja 1 lasketaan yhteen."},{"id":"H14","ryhma":"muutos","kysymys":"Vaaka-akselilla on aika tunteina (0–12), pystyakselilla ulkolämpötila celsiusasteina. Kuvaaja kulkee pisteiden (0, −3), (3, −9), (5, −9), (9, −1) ja (12, −4) kautta, ja pisteiden välillä se on jana.\n\nMitä lämpötilalle tapahtuu välillä 6–8 h?","vastaus":1,"vinkki":"Katso kuvaajan suuntaa, älä arvojen etumerkkiä.","selitys":"Välillä 6–8 h kuvaaja on janalla, joka nousee pisteestä (5, −9) pisteeseen (9, −1). Lämpötila nousee, vaikka se on koko ajan pakkasella.","tyyppi":"monivalinta","vaihtoehdot":["Lämpötila laskee, koska se on pakkasella.","Lämpötila nousee, vaikka on koko ajan pakkasta.","Lämpötila pysyy samana, koska on koko ajan pakkasta.","Lämpötila nousee vain 8 tunnin kohdalla."]},{"id":"H15","ryhma":"muutos","kysymys":"Vaaka-akselilla on aika tunteina (0–10), pystyakselilla sadevesitynnyrin vesimäärä litroina. Kuvaaja kulkee pisteiden (0, 40), (2, 100), (3, 100), (5, 60), (6, 60), (9, 150) ja (10, 120) kautta, ja pisteiden välillä se on jana.\n\nViimeinen väli, jolla vesimäärä kasvaa, päättyy 9 tunnin kohdalla. Monenko tunnin kohdalla tämä väli alkaa?","vastaus":6,"vinkki":"Kulje kuvaajaa taaksepäin kohdasta 9 h niin kauan kuin se nousee.","selitys":"Vesimäärä pysyy 60 litrassa välillä 5–6 h ja kasvaa välillä 6–9 h. Vastaus 5 rajaa välin väärin, koska välillä 5–6 h vesimäärä ei kasva."},{"id":"H16","ryhma":"oikein","kysymys":"Neljässä kuvaajassa vaaka-akselilla on aika minuutteina ja pystyakselilla matka kilometreinä, ja pisteiden välillä kuvaajat ovat janoja.\nKuvaaja 1 kulkee pisteiden (0, 0), (10, 3), (20, 3) ja (35, 6) kautta.\nKuvaaja 2 kulkee pisteiden (0, 0), (15, 4), (25, 4) ja (40, 1) kautta.\nKuvaaja 3 kulkee pisteiden (0, 0), (15, 6), (25, 5) ja (45, 10) kautta.\nKuvaaja 4 kulkee pisteiden (0, 0), (5, 1), (30, 1) ja (40, 4) kautta.\n\nMontako kuvaajista voi esittää kuljettua matkaa ajan funktiona?","vastaus":2,"vinkki":"Kuljettu matka ei voi vähetä. Tarkista, laskeeko kuvaaja jossakin kohdassa.","selitys":"Kuvaajat 1 ja 4 eivät laske missään kohdassa; vaakasuora osa tarkoittaa pysähdystä. Kuvaaja 2 laskee välillä 25–40 min 4 kilometristä 1 kilometriin, joten se voisi esittää etäisyyttä kotoa mutta ei kuljettua matkaa. Kuvaaja 3 laskee välillä 15–25 min 6 kilometristä 5 kilometriin. Pieni lasku riittää: kuljettu matka ei voi vähetä yhtään."},{"id":"H17","ryhma":"oikein","kysymys":"Vaaka-akselilla on aika minuutteina, pystyakselilla Lumin kuljettu matka kilometreinä. Kuvaaja kulkee pisteiden (0, 0), (10, 2), (20, 1) ja (35, 4) kautta, ja pisteiden välillä se on jana.\n\nMikä väite pitää paikkansa?","vastaus":1,"vinkki":"Lue pystyakselin suure tarkasti: kuljettu matka vai etäisyys?","selitys":"Välillä 10–20 min kuvaaja laskee 2 kilometristä 1 kilometriin. Kuljettu matka ei voi vähetä, vaikka Lumi kääntyisi takaisin, koska jokainen kuljettu metri lisätään matkaan. Kuvaaja ei siis voi olla oikein.","tyyppi":"monivalinta","vaihtoehdot":["Kuvaaja voi olla oikein: välillä 10–20 min Lumi kulki takaisin kotia kohti.","Kuvaaja ei voi olla oikein: kuljettu matka ei voi vähetä, mutta kuvaaja laskee välillä 10–20 min.","Kuvaaja voi olla oikein, jos Lumi pysähtyi välillä 10–20 min."]},{"id":"H18","ryhma":"oikein","kysymys":"Käyrä 1 kulkee pisteiden (−3, 0), (−1, 4), (2, 1) ja (5, 3) kautta janoina.\nKäyrä 2 on ympyrä, jonka keskipiste on (1, 1) ja säde 3.\nKäyrä 3 on vaakasuora suora, joka kulkee pisteen (0, −1) kautta.\nKäyrä 4 kulkee pisteiden (0, 0), (3, 2), (1, 4) ja (4, 5) kautta janoina.\nKäyrä 5 kulkee pisteiden (−2, −3), (0, 2) ja (4, −1) kautta janoina.\n\nMontako käyristä voi olla funktion kuvaaja?","vastaus":3,"vinkki":"Kuvittele pystysuora suora, joka liukuu jokaisen käyrän yli. Katso janoista koostuvien käyrien x-koordinaatteja.","selitys":"Käyrät 1, 3 ja 5 voivat olla funktion kuvaajia: pystysuora suora leikkaa jokaista enintään kerran. Ympyrää (käyrä 2) suora x = 1 leikkaa pisteissä (1, 4) ja (1, −2). Käyrän 4 x-koordinaatit ovat 0, 3, 1 ja 4, joten se kääntyy takaisin vasemmalle, ja esimerkiksi suora x = 2 leikkaa sitä kolmesti."},{"id":"H19","ryhma":"oikein","kysymys":"Käyrä kulkee pisteiden (0, 1), (6, 3), (2, 5), (7, 7) ja (9, 4) kautta janoina.\n\nMonessako pisteessä pystysuora suora x = 4 leikkaa käyrää?","vastaus":3,"vinkki":"Tarkista jokaisesta janasta erikseen, onko kohta x = 4 sen päätepisteiden x-koordinaattien välissä. Kaikki janat eivät välttämättä ulotu suoralle.","selitys":"Janojen x-koordinaatit kulkevat 0:sta 6:een, 6:sta 2:een, 2:sta 7:ään ja 7:stä 9:ään. Kohta 4 on kolmen ensimmäisen janan välissä, mutta viimeinen jana alkaa vasta kohdasta 7. Suora x = 4 leikkaa siis käyrää kolmessa pisteessä, ja käyrä ei voi olla funktion kuvaaja. Vastaus 4 kertoo, että janat laskettiin tarkistamatta niiden x-koordinaatteja."},{"id":"H20","ryhma":"oikein","kysymys":"Ympyrän keskipiste on (3, 2) ja säde 4. Pystysuora suora x = 3 leikkaa ympyrää kahdessa pisteessä.\n\nMikä on ylemmän leikkauspisteen y-koordinaatti?","vastaus":6,"vinkki":"Suora x = 3 kulkee keskipisteen kautta. Leikkauspisteet ovat säteen verran keskipisteen ylä- ja alapuolella.","selitys":"Leikkauspisteet ovat (3, 2 + 4) = (3, 6) ja (3, 2 − 4) = (3, −2). Ylemmän leikkauspisteen y-koordinaatti on 6. Koska muuttujan arvoa 3 vastaa kaksi arvoa, 6 ja −2, ympyrä ei voi olla funktion kuvaaja. Vastaus 4 kertoo, että säde luettiin y-koordinaatiksi, ja vastaus 2, että keskipisteen y-koordinaatti jäi ainoaksi vastaukseksi."}],"valmis_teksti":"Luet kuvaajasta funktion arvoja kumpaankin suuntaan ja vastaat pyydetyssä yksikössä, kerrot tilanteen kielellä, millä väleillä funktio kasvaa, vähenee tai pysyy vakiona, ja perustelet pystysuoran suoran avulla, voiko käyrä olla funktion kuvaaja. Tämä taito on nyt näytetty."};

const svg=document.getElementById("nlsvg"), rng=document.getElementById("nlrange"), out=document.getElementById("nlout");
const X0=34, X1=606, Y=62;
function piirraNL(v){
  const ala=Math.floor(v/10)*10, yla=ala+10, puoli=ala+5;
  const pyor = (v%10)>=5 ? yla : ala;
  const x = n => X0 + (n/100)*(X1-X0);
  let s=`<line class="rail" x1="${X0}" y1="${Y}" x2="${X1}" y2="${Y}"/>`;
  for(let n=0;n<=100;n+=10){
    const near = (n===ala||n===yla);
    s+=`<line class="tick" x1="${x(n)}" y1="${Y-7}" x2="${x(n)}" y2="${Y+7}"/>`;
    s+=`<text class="stop${near?" near":""}" x="${x(n)}" y="${Y+24}" text-anchor="middle">${n}</text>`;
  }
  s+=`<line class="halfway" x1="${x(puoli)}" y1="${Y-16}" x2="${x(puoli)}" y2="${Y+12}"/>`;
  s+=`<text class="stop" x="${x(puoli)}" y="${Y-22}" text-anchor="middle">puoliväli ${puoli}</text>`;
  s+=`<circle class="dot" cx="${x(v)}" cy="${Y}" r="6"/>`;
  s+=`<text class="val" x="${x(v)}" y="${Y-32}" text-anchor="middle">${v}</text>`;
  s+=`<path d="M ${x(v)} ${Y+38} L ${x(pyor)} ${Y+38}" stroke="var(--core)" stroke-width="2" fill="none"/>`;
  s+=`<path d="M ${x(pyor)} ${Y+38} l ${x(pyor)>x(v)?-7:7} -4 l 0 8 z" fill="var(--core)"/>`;
  svg.innerHTML=s;
  out.textContent = `${v} pyöristyy → ${pyor}`;
}

const ljExp=document.getElementById("ljExp");
if(ljExp && D.kokeilu){
  let ljI=0, ljTokens=[], ljStep=0;
  const laske=(a,op,b)=>{a=+a;b=+b;return op==="×"?a*b:op==="÷"?a/b:op==="+"?a+b:a-b;};
  function ljAlku(){
    const l=D.kokeilu[ljI];
    ljTokens=l.lauseke.replace(/\(/g,"( ").replace(/\)/g," )").split(/\s+/).filter(Boolean);
    ljStep=0; ljPiirra(); ljViesti("","");
  }
  function ljViesti(t,lk){const f=document.getElementById("ljFb"); f.textContent=t; f.className="lj-fb "+(lk||"");}
  function ljPiirra(){
    const l=D.kokeilu[ljI];
    document.getElementById("ljStep").textContent =
      ljStep>=l.askeleet.length ? "valmis" : `askel ${ljStep+1} / ${l.askeleet.length}`;
    if(ljStep>=l.askeleet.length){
      ljExp.innerHTML=`<span class="valmis">${l.lauseke} = ${l.vastaus}</span>`;
      return;
    }
    ljExp.innerHTML=ljTokens.map((t,i)=>
      "×÷+−".includes(t) ? `<button type="button" class="op" data-i="${i}">${t}</button>`
                         : `<span class="tok">${t}</span>`).join("");
    ljExp.querySelectorAll("button.op").forEach(b=>b.addEventListener("click",()=>ljKlikkaa(+b.dataset.i)));
  }
  function ljKlikkaa(i){
    const l=D.kokeilu[ljI], odotettu=l.askeleet[ljStep];
    const ehdotus=[ljTokens[i-1],ljTokens[i],ljTokens[i+1]].join(" ");
    if(ehdotus!==odotettu){
      ljViesti(ljStep===0
        ? "Ei vielä. Sulkeet ovat vahvimmat, sitten kerto ja jako. Yhtä vahvat vasemmalta oikealle."
        : "Ei vielä. Kumpi jäljellä olevista on vahvempi?", "no");
      return;
    }
    const arvo=laske(ljTokens[i-1],ljTokens[i],ljTokens[i+1]);
    let alku=i-1, loppu=i+1;
    if(ljTokens[i-2]==="(" && ljTokens[i+2]===")"){ alku=i-2; loppu=i+2; }
    ljTokens.splice(alku, loppu-alku+1, String(arvo));
    ljStep++;
    ljViesti(ljStep>=l.askeleet.length ? "Valmis. Vastaus on "+l.vastaus+"." : "Oikein. Jatka seuraavaan.", "ok");
    ljPiirra();
  }
  document.getElementById("ljSeuraava").addEventListener("click",()=>{
    ljI=(ljI+1)%D.kokeilu.length; ljAlku();
  });
  ljAlku();
}

/* Suomalainen lukumuoto: välilyönti on tuhaterotin, pilkku desimaalierotin.
   Piste voi olla kumpi tahansa. Se tulkitaan tuhaterottimeksi VAIN silloin, kun
   koko luku on aitoa tuhaterotinmuotoa: alkuosa 1–3 numeroa ilman etunollaa ja
   jokainen jatko-osa täsmälleen 3 numeroa (1.500, 12.345.678). Kaikissa muissa
   tapauksissa piste on desimaalipiste — myös 0.125, joka vanhalla säännöllä
   ("3 numeroa pisteen jäljessä = tuhaterotin") luettiin virheellisesti luvuksi 125. */
const TUHATEROTIN = /^[1-9]\d{0,2}(\.\d{3})+$/;
function lueLuku(teksti){
  // Murtoluku (3/4, -3/4) ja sekaluku (1 2/3, -1 2/3) hyväksytään sellaisinaan.
  const raaka = String(teksti).replace(/\u00a0/g, " ").trim();
  let m = raaka.match(/^(-?)(\d+)\s+(\d+)\s*\/\s*(\d+)$/);
  if(m){ const nim = Number(m[4]); if(nim === 0) return null;
    const v = Number(m[2]) + Number(m[3]) / nim; return m[1] ? -v : v; }
  m = raaka.match(/^(-?)\s*(\d+)\s*\/\s*(\d+)$/);
  if(m){ const nim = Number(m[3]); if(nim === 0) return null;
    const v = Number(m[2]) / nim; return m[1] ? -v : v; }
  let s = String(teksti).replace(/[\s\u00a0]/g, "");
  if(s === "") return null;
  if(s.indexOf(",") >= 0){
    s = s.replace(/\./g, "").replace(",", ".");
  } else if(TUHATEROTIN.test(s)){
    s = s.replace(/\./g, "");
  }
  const n = Number(s);
  return Number.isFinite(n) ? n : null;
}

function tarkista(id){
  const h=D.harjoitukset.find(x=>x.id===id);
  const kentta=document.getElementById("in-"+id);
  const fb=document.getElementById("fb-"+id);
  if(kentta.value.trim()===""){ fb.className="fb hint"; fb.textContent="Kirjoita vastaus ensin."; return; }
  const luku=lueLuku(kentta.value);
  if(luku===null){ fb.className="fb no"; fb.textContent="Vastauksen pitää olla luku tai murtoluku (esimerkiksi 3/4)."; return; }
  const oikein = Math.abs(luku - h.vastaus) < 1e-9;
  merkitseTulos(id, oikein, oikein ? "Oikein. "+h.selitys : `Ei vielä. ${h.vinkki} Kokeile uudelleen.`);
}

function tarkistaMonivalinta(id, valittuIndeksi, painike){

  const rivi=painike.closest(".row");
  rivi.querySelectorAll(".mv-valinta").forEach(b=>b.disabled=true);
  const oikein = valittuIndeksi===h.vastaus;

    const oikeaBtn=rivi.querySelector(`[data-i="${h.vastaus}"]`);
    if(oikeaBtn) oikeaBtn.classList.add("mv-oikein");
  }
  merkitseTulos(id, oikein, oikein ? "Oikein. "+h.selitys : `Ei ihan. Oikea vastaus on korostettu. ${h.selitys||""}`);
}

/* Kuuntelu: selain lukee tekstin ääneen omalla puhesynteesillään (englanniksi, jos laitteessa on
   englanninkielinen ääni). Ei äänitiedostoja eikä verkkoyhteyttä. Jos laite ei osaa puhua,
   teksti näytetään luettavaksi — silloin tehtävä muuttuu luetun ymmärtämiseksi, mutta ei katkea. */
function puhu(id, nopeus){
  const h=D.harjoitukset.find(x=>x.id===id); if(!h || !h.kuuntele) return;
  const vara=document.getElementById("vara-"+id);
  const naytaTeksti=syy=>{ vara.hidden=false; vara.textContent=syy+" Teksti: "+h.kuuntele; };
  if(!("speechSynthesis" in window)){ naytaTeksti("Tämä laite ei osaa lukea ääneen."); return; }
  const s=window.speechSynthesis; s.cancel();
  const u=new SpeechSynthesisUtterance(h.kuuntele);
  u.lang=h.kieli||"en-GB"; u.rate=nopeus;
  const aanet=s.getVoices(), kieli=u.lang.slice(0,2);
  const aani=aanet.find(a=>a.lang===u.lang) || aanet.find(a=>a.lang && a.lang.startsWith(kieli));
  if(aani) u.voice=aani;
  else if(aanet.length) { naytaTeksti("Laitteessa ei ole englanninkielistä ääntä."); return; }
  u.onerror=()=>naytaTeksti("Ääneen lukeminen ei onnistunut.");
  s.speak(u);
}

document.getElementById("harjoitukset").addEventListener("click",e=>{
  const k=e.target.closest("[data-kuuntele]"), hk=e.target.closest("[data-hitaasti]");
  if(k) puhu(k.dataset.kuuntele, 0.9);
  if(hk) puhu(hk.dataset.hitaasti, 0.6);
  const t=e.target.closest("[data-tarkista]"), v=e.target.closest("[data-vinkki]"), mv=e.target.closest("[data-mv]");
  if(t) tarkista(t.dataset.tarkista);
  if(mv) tarkistaMonivalinta(mv.dataset.mv, Number(mv.dataset.i), mv);
  if(v){
    const h=D.harjoitukset.find(x=>x.id===v.dataset.vinkki);
    const fb=document.getElementById("fb-"+h.id);
    fb.className="fb hint"; fb.textContent=h.vinkki;
  }
});
document.getElementById("harjoitukset").addEventListener("keydown",e=>{
  if(e.key==="Enter" && e.target.id.startsWith("in-")){ e.preventDefault(); tarkista(e.target.id.slice(3)); }
});
