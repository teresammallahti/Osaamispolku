<title>Vaippa ympärille</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">

<style>
:root{
  --paper:#EFF2F5; --surface:#FFFFFF; --surface-2:#F7F9FB;
  --grid:#DCE3EA; --line:#C9D3DC;
  --ink:#15222C; --ink-2:#4E626F; --ink-3:#7E8F9B;
  --core:#1B5A9E; --core-soft:#E4EDF6;
  --strong:#1F6E5C; --strong-soft:#E1F0EB;
  --chal:#9A6A16; --chal-soft:#F6EDDC;
  --alert:#A33A2B; --alert-soft:#F8E7E3;
  --shadow:0 1px 2px rgba(21,34,44,.06), 0 8px 24px -12px rgba(21,34,44,.18);
  --r:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0F161B; --surface:#18222A; --surface-2:#1D2830;
    --grid:#22303A; --line:#2E3E4A;
    --ink:#E8EFF4; --ink-2:#A3B4C0; --ink-3:#7A8B97;
    --core:#7FB2E4; --core-soft:#16303F;
    --strong:#77CDB4; --strong-soft:#123028;
    --chal:#E0B267; --chal-soft:#33270F;
    --alert:#E8907F; --alert-soft:#3A1E19;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -14px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --paper:#0F161B; --surface:#18222A; --surface-2:#1D2830;
  --grid:#22303A; --line:#2E3E4A;
  --ink:#E8EFF4; --ink-2:#A3B4C0; --ink-3:#7A8B97;
  --core:#7FB2E4; --core-soft:#16303F;
  --strong:#77CDB4; --strong-soft:#123028;
  --chal:#E0B267; --chal-soft:#33270F;
  --alert:#E8907F; --alert-soft:#3A1E19;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -14px rgba(0,0,0,.7);
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:16px; line-height:1.62;
  background-image:
    linear-gradient(to right, var(--grid) 1px, transparent 1px),
    linear-gradient(to bottom, var(--grid) 1px, transparent 1px);
  background-size:26px 26px;
}
.wrap{max-width:760px; margin:0 auto; padding:28px 20px 90px}
h1,h2,h3,h4{font-family:"Familjen Grotesk","IBM Plex Sans",system-ui,sans-serif; text-wrap:balance}

/* header */
header.top{background:var(--surface); border:1px solid var(--line); border-radius:var(--r);
  box-shadow:var(--shadow); padding:22px 24px; display:flex; gap:18px; align-items:flex-start}
.badge{flex:0 0 auto; width:54px; height:54px; border-radius:9px; display:grid; place-items:center;
  background:var(--core-soft); border:1px solid var(--core); color:var(--core)}
.badge svg{width:28px; height:28px; fill:none; stroke:currentColor; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round}
.eyebrow{font-family:"IBM Plex Mono",monospace; font-size:11px; letter-spacing:.14em;
  text-transform:uppercase; color:var(--ink-3); margin:0 0 5px}
header.top h1{margin:0; font-size:30px; font-weight:700; letter-spacing:-.015em}
header.top p{margin:5px 0 0; color:var(--ink-2); font-size:15px}
.tags{display:flex; flex-wrap:wrap; gap:5px; margin-top:11px}
.tag{font-family:"IBM Plex Mono",monospace; font-size:10.5px; letter-spacing:.05em; padding:2px 7px;
  border-radius:4px; background:var(--surface-2); border:1px solid var(--line); color:var(--ink-3)}
.tag.core{background:var(--core-soft); border-color:var(--core); color:var(--core)}

/* teksti */
article{margin-top:26px}
article h2{font-size:21px; font-weight:600; margin:32px 0 10px; letter-spacing:-.01em}
article p{margin:0 0 14px; max-width:64ch}
.lead{font-size:17.5px; color:var(--ink); border-left:3px solid var(--core); padding-left:16px; margin:0 0 8px}

.box{background:var(--surface); border:1px solid var(--line); border-radius:var(--r);
  padding:18px 22px; box-shadow:var(--shadow); margin:22px 0}
.box h3{margin:0 0 12px; font-size:16.5px; font-weight:600}
.box.warn{border-left:3px solid var(--alert)}
.box.note{border-left:3px solid var(--chal)}

ol.steps{margin:0; padding-left:0; list-style:none; counter-reset:s; display:grid; gap:12px}
ol.steps li{counter-increment:s; display:grid; grid-template-columns:auto 1fr; gap:13px; align-items:start}
ol.steps li::before{content:counter(s); font-family:"Familjen Grotesk",sans-serif; font-weight:700; font-size:14px;
  width:26px; height:26px; border-radius:50%; background:var(--core); color:#fff; display:grid; place-items:center; margin-top:2px}

ul.notes{margin:0; padding-left:19px}
ul.notes li{margin-bottom:7px}
ul.notes li:last-child{margin-bottom:0}

.tablewrap{overflow-x:auto}
table{border-collapse:collapse; width:100%; font-size:14.5px; min-width:460px}
th,td{text-align:left; padding:9px 13px; border-bottom:1px solid var(--line)}
th{font-family:"IBM Plex Mono",monospace; font-size:10.5px; letter-spacing:.1em; text-transform:uppercase;
  color:var(--ink-3); font-weight:400; background:var(--surface-2)}
tr:last-child td{border-bottom:0}
td b{color:var(--core); font-weight:600}
td:last-child{font-variant-numeric:tabular-nums; font-weight:600}

/* lukusuora */
.nl svg{width:100%; height:118px; display:block}
.nl .rail{stroke:var(--line); stroke-width:2}
.nl .tick{stroke:var(--line); stroke-width:1.5}
.nl .stop{fill:var(--ink-3); font-family:"IBM Plex Mono",monospace; font-size:11px}
.nl .stop.near{fill:var(--core); font-weight:600}
.nl .dot{fill:var(--chal)}
.nl .val{fill:var(--ink); font-family:"Familjen Grotesk",sans-serif; font-size:15px; font-weight:700}
.nl .halfway{stroke:var(--chal); stroke-dasharray:3 3; stroke-width:1.5}
.nl-controls{display:flex; align-items:center; gap:14px; margin-top:6px}
.nl-controls input{flex:1; accent-color:var(--core)}
.nl-out{font-family:"Familjen Grotesk",sans-serif; font-size:15px; font-weight:600; min-width:12.5em; text-align:right}

/* paikka-arvotaulu */
.box .ohje{margin:0 0 14px; font-size:14.5px; color:var(--ink-2)}
.nt-valinta{display:flex; flex-wrap:wrap; gap:7px; margin-bottom:16px}
.nt-valinta button{font:inherit; font-size:12.5px; font-family:"IBM Plex Mono",monospace; padding:5px 11px;
  border-radius:6px; border:1px solid var(--line); background:var(--surface-2); color:var(--ink-2); cursor:pointer}
.nt-valinta button[aria-pressed="true"]{background:var(--ink); color:var(--paper); border-color:var(--ink)}
.nt-valinta button:focus-visible{outline:2px solid var(--core); outline-offset:2px}
.nt-taulu{display:flex; flex-direction:column; gap:4px; align-items:flex-start; overflow-x:auto; padding-bottom:4px}
.nt-rivi{display:flex; gap:6px; align-items:center}
.nt-rivi .otsa{font-family:"IBM Plex Mono",monospace; font-size:9.5px; letter-spacing:.08em;
  text-transform:uppercase; color:var(--ink-3); width:52px; text-align:center}
.nt-ruutu{width:52px; height:52px; display:grid; place-items:center; border:1.5px solid var(--line);
  border-radius:7px; background:var(--surface-2); font-family:"IBM Plex Mono",monospace; font-size:24px}
.nt-ruutu.kohta{border-color:var(--core); background:var(--core-soft); color:var(--core); font-weight:500}
.nt-ruutu.ratkaiseva{border-color:var(--chal); background:var(--chal-soft); color:var(--chal); font-weight:500}
.nt-ruutu.nolla{color:var(--ink-3)}
.nt-rivi .nimi{font-size:12.5px; color:var(--ink-3); margin-left:12px; white-space:nowrap}
.nt-nuoli{font-size:17px; color:var(--chal); margin-left:6px}
.nt-selite{margin:14px 0 0; font-size:14.5px}
.nt-selite b{color:var(--core)}

/* vahvuusportaat */
.vp-tasot{display:grid; gap:9px; margin-bottom:18px}
.vp-taso{display:flex; gap:11px; align-items:flex-start; font-size:13.5px}
.vp-taso .vp-pallo{width:13px; height:13px; border-radius:4px; margin-top:5px; flex:0 0 auto}
.vp-taso[data-taso="sulkeet"] .vp-pallo{background:var(--core)}
.vp-taso[data-taso="kertojako"] .vp-pallo{background:var(--strong)}
.vp-taso[data-taso="yhteenvahennys"] .vp-pallo{background:var(--chal)}
.vp-taso strong{display:block; font-family:"Familjen Grotesk",sans-serif; font-weight:600; font-size:14.5px}
.vp-taso span{color:var(--ink-2)}
.vp-lauseke{display:flex; flex-wrap:wrap; gap:7px; align-items:flex-end; font-family:"IBM Plex Mono",monospace;
  font-size:25px; padding:10px 2px; min-height:64px}
.vp-lauseke .t{padding:2px 3px}
.vp-lauseke .op{position:relative; padding:2px 9px; border-radius:6px; font-weight:500}
.vp-lauseke .op[data-taso="sulkeet"]{background:var(--core-soft); color:var(--core)}
.vp-lauseke .op[data-taso="kertojako"]{background:var(--strong-soft); color:var(--strong)}
.vp-lauseke .op[data-taso="yhteenvahennys"]{background:var(--chal-soft); color:var(--chal)}
.vp-lauseke .op i{position:absolute; top:-9px; right:-6px; font-style:normal; font-family:"Familjen Grotesk",sans-serif;
  font-size:11px; font-weight:700; width:18px; height:18px; border-radius:50%; display:grid; place-items:center;
  background:currentColor}
.vp-lauseke .op i span{color:var(--surface)}
.vp-rivi{display:flex; align-items:center; gap:16px; margin-top:8px}
.vp-vastaus{font-family:"Familjen Grotesk",sans-serif; font-size:16px; font-weight:600; color:var(--strong)}

/* laskujärjestys-widget */
.lj-exp{display:flex; flex-wrap:wrap; gap:7px; align-items:center; font-family:"IBM Plex Mono",monospace;
  font-size:23px; padding:14px 4px; min-height:62px}
.lj-exp .tok{padding:2px 4px; color:var(--ink)}
.lj-exp button.op{font-family:"IBM Plex Mono",monospace; font-size:23px; padding:3px 12px; border-radius:7px;
  border:1.5px solid var(--line); background:var(--surface-2); color:var(--ink); line-height:1.2}
.lj-exp button.op:hover{border-color:var(--core); color:var(--core)}
.lj-exp button.op:focus-visible{outline:2px solid var(--core); outline-offset:2px}
.lj-exp .valmis{font-family:"Familjen Grotesk",sans-serif; font-size:23px; font-weight:700; color:var(--strong)}
.lj-fb{font-size:14.5px; min-height:1.5em; color:var(--ink-2)}
.lj-fb.no{color:var(--alert)}
.lj-fb.ok{color:var(--strong)}
.lj-row{display:flex; align-items:center; gap:14px; margin-top:10px}
.lj-step{font-family:"IBM Plex Mono",monospace; font-size:11.5px; letter-spacing:.1em;
  text-transform:uppercase; color:var(--ink-3)}

/* harjoitukset */
.progress{position:sticky; top:0; z-index:5; background:var(--surface); border:1px solid var(--line);
  border-radius:var(--r); padding:12px 18px; box-shadow:var(--shadow); display:flex; align-items:center;
  gap:14px; margin:34px 0 18px}
.progress .lbl{font-family:"IBM Plex Mono",monospace; font-size:11px; letter-spacing:.12em;
  text-transform:uppercase; color:var(--ink-3); white-space:nowrap}
.progress .meter{flex:1; height:7px; border-radius:4px; background:var(--surface-2); border:1px solid var(--line); overflow:hidden}
.progress .meter i{display:block; height:100%; background:var(--core); transition:width .25s ease}
.progress .cnt{font-family:"Familjen Grotesk",sans-serif; font-weight:700; font-variant-numeric:tabular-nums; white-space:nowrap}

.grp{margin-top:26px}
.grp-head{display:flex; align-items:baseline; gap:10px; border-bottom:1.5px solid var(--ink); padding-bottom:7px; margin-bottom:14px}
.grp-head h3{margin:0; font-size:17px; font-weight:600}
.grp-head span{font-size:12.5px; color:var(--ink-2)}

.ex{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:14px 16px; margin-bottom:10px}
.ex[data-tila="oikein"]{border-color:var(--strong); box-shadow:inset 3px 0 0 var(--strong)}
.ex[data-tila="vaarin"]{border-color:var(--alert); box-shadow:inset 3px 0 0 var(--alert)}
.ex .q{display:flex; gap:11px; align-items:baseline; flex-wrap:wrap}
.ex .num{font-family:"IBM Plex Mono",monospace; font-size:11.5px; color:var(--ink-3); min-width:2.4em}
.ex .txt{flex:1; min-width:190px; font-size:15.5px}
.ex .txt .aineisto{display:block; margin-bottom:9px; padding-left:12px;
  border-left:2px solid var(--line); color:var(--ink-2); line-height:1.6;
  /* Aineisto voi olla pieni taulukko, jonka rivit on erotettu rivinvaihdoilla.
     Ilman pre-lineä ne valuisivat yhdeksi kappaleeksi ja taulukko katoaisi. */
  white-space:pre-line}
.ex .txt .kysymysrivi{display:block; font-weight:600}
.ex .row{display:flex; gap:8px; align-items:center; margin-top:11px; flex-wrap:wrap}
.ex input[type=text]{font:inherit; font-family:"IBM Plex Mono",monospace; font-size:15px; width:8.5em;
  padding:7px 11px; border:1px solid var(--line); border-radius:7px; background:var(--surface-2);
  color:var(--ink); text-align:right}
.ex input:focus-visible{outline:2px solid var(--core); outline-offset:1px}
button{font:inherit; cursor:pointer}
.btn{font-size:13.5px; padding:7px 15px; border-radius:7px; border:1px solid var(--core);
  background:var(--core); color:#fff}
.btn.ghost{background:transparent; color:var(--ink-2); border-color:var(--line)}
.btn:focus-visible{outline:2px solid var(--core); outline-offset:2px}
.btn.mv-valinta{text-align:left}
/* kuuntelutehtävä: selaimen puhesynteesi lukee englanninkielisen tekstin */
.kuuntele{display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin:2px 0 10px}
.kuuntele .btn{display:inline-flex; gap:7px; align-items:center}
.kuuntele svg{width:16px; height:16px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round}
.kuuntele .varateksti{flex-basis:100%; font-size:14px; color:var(--ink-2); background:var(--surface-2);
  border-radius:7px; padding:8px 12px; margin:0}
.btn.mv-valinta:disabled{cursor:default; opacity:.65}
.btn.mv-oikein{background:var(--strong-soft); border-color:var(--strong); color:var(--strong); opacity:1}
.btn.mv-vaarin{background:var(--alert-soft); border-color:var(--alert); color:var(--alert); opacity:1}
.row.mv{gap:8px 10px}
.fb{margin-top:11px; font-size:14.5px; padding:10px 13px; border-radius:8px; line-height:1.5}
.fb.ok{background:var(--strong-soft); color:var(--strong)}
.fb.no{background:var(--alert-soft); color:var(--alert)}
.fb.hint{background:var(--chal-soft); color:var(--chal)}

.done{background:var(--strong-soft); border:1px solid var(--strong); color:var(--strong);
  border-radius:var(--r); padding:16px 20px; margin-top:20px; font-size:15.5px}
.done h3{margin:0 0 4px; font-size:17px; color:var(--strong)}

details.teacher{margin-top:34px; background:var(--surface); border:1px solid var(--line);
  border-left:3px solid var(--chal); border-radius:var(--r); padding:15px 20px; box-shadow:var(--shadow)}
details.teacher summary{cursor:pointer; font-family:"Familjen Grotesk",sans-serif; font-weight:600; font-size:15px}
details.teacher summary:focus-visible{outline:2px solid var(--core); outline-offset:3px}
details.teacher ul{margin:12px 0 0; padding-left:19px; color:var(--ink-2); font-size:14.5px}
details.teacher li{margin-bottom:8px}
details.teacher p{margin:12px 0 0; color:var(--ink-2); font-size:14.5px}

.back{display:inline-block; margin-top:30px; font-size:13.5px; color:var(--ink-2)}
.back a{color:var(--core)}

@media (prefers-reduced-motion: reduce){*{transition:none !important}}
@media (max-width:560px){
  .wrap{padding:16px 13px 70px}
  header.top h1{font-size:25px}
  .progress{flex-wrap:wrap}
}
</style>

<div class="wrap">

  <header class="top">
    <span class="badge"><svg viewBox="0 0 24 24" aria-hidden="true" id="ikoni"></svg></span>
    <div>
      <p class="eyebrow" id="eyebrow"></p>
      <h1 id="otsikko"></h1>
      <p id="kuvaus"></p>
      <div class="tags" id="tags"></div>
    </div>
  </header>

  <article id="teksti"></article>

  <div class="progress" aria-live="polite">
    <span class="lbl">Harjoitukset</span>
    <span class="meter"><i id="pbar" style="width:0%"></i></span>
    <span class="cnt" id="pcnt">0 / 20</span>
  </div>

  <div id="harjoitukset"></div>
  <div id="valmis"></div>

  <p class="back" id="back"></p>

</div>

<script>
const D = {"tavoite_id":"MAT9-MIT-02","oppiaine":"MAT","vuosiluokka":9,"taso":"ydin","otsikko":"Vaippa ympärille","kuvaus":"Osaan laskea särmiön, lieriön ja kartion vaipan alan ja kokonaispinta-alan.","versio":"0.2","paivitetty":"2026-10-11","ops":{"T":["T7","T18"],"S":["S5"]},"ikoni":"kadet","eyebrow":"Matematiikka · 9. luokka · Mittaaminen","teksti":[{"tyyppi":"johdanto","sisalto":"Juomatölkin kyljessä on etiketti, joka kiertää tölkin ympäri. Etiketin painattamiseen tarvitaan vain tölkin kyljen pinta-ala, mutta tölkkitehdas tilaa metallin koko tölkkiin: kylkeen, pohjaan ja kanteen. Kun tölkkejä tehdään miljardi, yksi ylimääräinen neliösenttimetri tölkkiä kohden tarkoittaa 100 000 neliömetriä metallia. Nämä kaksi pinta-alaa ovat eri asioita. Kylki on kappaleen vaippa, ja koko pinta on kokonaispinta-ala. Kokonaispinta-ala on vaippa ja pohjat yhteensä. Tässä taidossa opit laskemaan suorakulmaisen särmiön, ympyrälieriön ja ympyräkartion vaipan alan ja kokonaispinta-alan. Avaat kappaleen tasoverkoksi, jotta näet, mistä osista pinta koostuu ja mitkä ovat osien mitat. Opit myös, miksi kartion vaipassa käytetään sivujanaa eikä korkeutta, ja annat jokaisen vastauksen neliöyksikössä."},{"tyyppi":"kappale","otsikko":"Vaippa, pohjat ja suorakulmainen särmiö","sisalto":"Lieriöllä on kaksi pohjaa, ja kartiolla yksi pohja ja huippu (taito Kappaleiden kavalkadi). Vaippa on se osa pinnasta, joka jää pohjien ulkopuolelle. Lieriön kansi on sen toinen pohja, joten kokonaispinta-alaan lasketaan lieriöllä vaippa ja kaksi pohjaa ja kartiolla vaippa ja yksi pohja. Kun astiassa ei ole kantta, siihen tarvittava materiaali on vaippa ja yksi pohja, ei koko pinta. Suorakulmaisen särmiön pinta koostuu kuudesta suorakulmiosta, jotka ovat pareittain samanlaisia: vastakkaiset tahkot ovat yhtä suuret. Jokaisen tahkon ala on kanta kertaa korkeus (taito Kanta kertaa korkeus). Särmiön vaipan alaa ei voi laskea ennen kuin tiedetään, mitkä kaksi vastakkaista tahkoa ovat pohjia, koska vaippa on loput neljä tahkoa. Ajattele laatikkoa, jonka pohja on 9 cm × 4 cm ja korkeus 5 cm. Vaipan neljä seinää ovat kaksi suorakulmiota 9 cm × 5 cm ja kaksi suorakulmiota 4 cm × 5 cm. Kun seinät avataan riviin, ne muodostavat yhden suorakulmion, jonka pituus on pohjan piiri 9 cm + 4 cm + 9 cm + 4 cm = 26 cm ja korkeus 5 cm. Vaipan ala on siis 26 cm · 5 cm = 130 cm². Pohjien ala on 2 · 9 cm · 4 cm = 72 cm², joten kokonaispinta-ala on 130 cm² + 72 cm² = 202 cm². Jos sama laatikko käännetään pystyyn niin, että pohjana on tahko 4 cm × 5 cm, korkeus on 9 cm ja vaipan ala on 2 · (4 cm + 5 cm) · 9 cm = 162 cm². Kokonaispinta-ala on edelleen 202 cm², koska tahkot ovat samat, mutta vaippa muuttui. Siksi tehtävässä kerrotaan aina, mikä tahko on pohja. Jos mitat on annettu eri yksiköissä, muunna ne ensin samaan yksikköön (taito Metristä hehtaariin)."},{"tyyppi":"kappale","otsikko":"Ympyrälieriön vaippa avautuu suorakulmioksi","sisalto":"Leikkaa paperinen putki auki suoraan pohjasta pohjaan ja levitä se pöydälle. Syntyy suorakulmio. Sen toinen sivu on lieriön korkeus h. Toinen sivu kiersi pohjaympyrän ympäri, joten sen pituus on pohjan kehä 2πr (taito Piin salaisuus). Vaipan ala on suorakulmion ala eli A_v = 2πr · h = 2πrh. Ympyrälieriön tasoverkossa on tämä suorakulmio ja kaksi ympyrää, joiden säde on r, kiinni suorakulmion niillä sivuilla, joiden pituus on kehä 2πr. Kokonaispinta-ala on vaippa ja kaksi pohjaa: A = 2πrh + 2πr². Esimerkki: lieriön pohjan säde on 3 cm ja korkeus 8 cm. Tasoverkon suorakulmion sivut ovat 2π · 3 cm = 6π cm ≈ 18,8 cm ja 8 cm, joten vaipan ala on 6π cm · 8 cm = 48π cm² ≈ 151 cm². Kaksi pohjaa ovat yhteensä 2 · π · 3² cm² = 18π cm², joten kokonaispinta-ala on 48π cm² + 18π cm² = 66π cm² ≈ 207 cm². Tarkka arvo kirjoitetaan muotoon kπ, kun termit lasketaan yhteen π:n kertoimina, kuten 48 + 18 = 66. Huomaa, että vaipan kaavassa on pohjan kehä, joka on pituus, eikä pohjan ala."},{"tyyppi":"kappale","otsikko":"Ympyräkartion vaippa on sektori","sisalto":"Leikkaa paperinen kartio auki huipusta pohjan reunaan pitkin vaippaa ja levitä se. Syntyy ympyräsektori, eli pala ympyrästä (taito Pizzan pala). Leikkausviiva kulki huipusta pohjan reunalle, joten sektorin säde on kartion sivujana s. Sektorin kaari kiersi pohjaympyrän ympäri, joten kaaren pituus on pohjan kehä 2πr. Kartion korkeus ei näy tasoverkossa missään, koska se kulkee kartion sisällä huipusta pohjan keskipisteeseen. Sektorin ala saadaan samalla ajatuksella kuin 8. luokalla: sektori on yhtä suuri osa koko ympyrästä kuin sen kaari on koko kehästä. Koko ympyrän säde on s, joten sen kehä on 2πs ja ala πs². Sektori on 2πr/(2πs) = r/s koko ympyrästä, ja sen ala on r/s · πs² = πrs. Kartion vaipan ala on siis A_v = πrs, ja kokonaispinta-ala on vaippa ja yksi pohja: A = πrs + πr². Tässä taidossa sivujana annetaan aina tehtävässä. Esimerkki: kartion pohjan säde on 5 cm, sivujana 12 cm ja korkeus noin 10,9 cm. Sektorin kaari on 2π · 5 cm = 10π cm ja koko ympyrän kehä 2π · 12 cm = 24π cm, joten sektori on 10π/24π = 5/12 ympyrästä. Vaipan ala on 5/12 · π · 12² cm² = 60π cm². Sama tulee suoraan kaavasta π · 5 · 12 = 60π. Korkeutta 10,9 cm ei tarvita. Laskimen π-näppäimellä 60π cm² ≈ 188,5 cm², mutta likiarvolla 3,14 tulee 188,4 cm². Siksi tällainen tulos pyydetään kokonaisina neliösenttimetreinä: kumpikin antaa 188 cm². Kokonaispinta-ala on 60π cm² + 25π cm² = 85π cm² ≈ 267 cm²."},{"tyyppi":"saanto","otsikko":"Näin lasket vaipan alan ja kokonaispinta-alan","askeleet":["Tunnista kappale ja sen pohjat. Särmiössä tarkista, mikä tahko on pohja. Lue, kysytäänkö vaippaa, koko pintaa vai pintaa ilman kantta.","Hahmottele tasoverkko ja kirjoita osien mitat näkyviin. Lieriö: kaksi ympyrää ja suorakulmio, jonka sivut ovat 2πr ja h. Kartio: yksi ympyrä ja sektori, jonka säde on s ja kaari 2πr. Särmiö: kuusi suorakulmiota.","Muunna mitat samaan yksikköön ennen laskemista. Puolita halkaisija säteeksi.","Laske osien alat: särmiön vaippa = pohjan piiri · korkeus, lieriön vaippa A_v = 2πrh, kartion vaippa A_v = πrs, ympyräpohja πr². Kartiossa käytetään sivujanaa s, vaikka korkeus olisi annettu.","Laske yhteen ne osat, jotka tehtävä kysyy. Kokonaispinta-ala on lieriöllä 2πrh + 2πr², kartiolla πrs + πr² ja särmiöllä kuuden tahkon summa.","Jos tehtävä kysyy tarkkaa arvoa muodossa kπ, jätä π kirjaimeksi ja laske kertoimet yhteen. Muuten käytä laskimen π-näppäintä ja pyöristä vasta lopuksi pyydettyyn tarkkuuteen.","Anna vastaus neliöyksikössä, esimerkiksi cm² tai m². Jos tehtävä pyytää eri yksikköä kuin mitoissa, muunna: 1 dm² = 10 cm · 10 cm = 100 cm² ja 1 m² = 100 dm² = 10 000 cm²."]},{"tyyppi":"ansa","otsikko":"Ansa 1: kartion vaippa korkeudella","sisalto":"Kartion pohjan säde on 5 cm, sivujana 12 cm ja korkeus noin 10,9 cm. Lasku π · 5 cm · 10,9 cm ≈ 171 cm² on väärin, koska vaipan sektorin säde on sivujana, ei korkeus. Oikea vaipan ala on π · 5 cm · 12 cm ≈ 188 cm². Korkeus on aina sivujanaa lyhyempi, joten korkeudella laskettu tulos jää liian pieneksi. Kun tehtävässä on annettu sekä korkeus että sivujana, korkeus on vaipan laskussa ylimääräinen tieto. Hahmottele sektori ja kirjoita sen säteeksi s ennen kuin lasket."},{"tyyppi":"ansa","otsikko":"Ansa 2: pohja puuttuu tai kansi on liikaa","sisalto":"Lieriön kokonaispinta-alassa on kaksi pohjaa. Kun pohjan säde on 3 cm ja korkeus 8 cm, lasku 48π cm² + π · 3² cm² = 57π cm² ≈ 179 cm² jättää toisen pohjan pois. Oikein on 48π cm² + 2 · 9π cm² = 66π cm² ≈ 207 cm². Toisin päin käy, kun astiassa ei ole kantta. Laatikon pohja on 30 cm × 20 cm ja korkeus 15 cm, eikä siinä ole kantta. Kokonaispinta-ala on 2 700 cm², mutta pahvia tarvitaan vain vaippaan ja yhteen pohjaan: 2 · (30 cm + 20 cm) · 15 cm + 30 cm · 20 cm = 1 500 cm² + 600 cm² = 2 100 cm². Luettele ennen laskemista, mitkä pinnat kuuluvat mukaan."},{"tyyppi":"ansa","otsikko":"Ansa 3: halkaisija säteenä","sisalto":"Säilykepurkin pohjan halkaisija on 7,0 cm ja korkeus 11,0 cm. Jos halkaisija sijoitetaan säteen paikalle, tulee 2π · 7,0 cm · 11,0 cm + 2π · (7,0 cm)² ≈ 792 cm². Säde on puolet halkaisijasta eli 3,5 cm, ja oikea peltimäärä on 2π · 3,5 cm · 11,0 cm + 2π · (3,5 cm)² ≈ 319 cm². Virheellinen tulos on yli kaksinkertainen, koska vaippa kaksinkertaistuu ja pohjat nelinkertaistuvat. Kirjoita aina ensin r = … ja vasta sitten kaava."},{"tyyppi":"ansa","otsikko":"Ansa 4: ympyrän ala kehän paikalla","sisalto":"Lieriön pohjan säde on 4 cm ja korkeus 9 cm. Vaipan suorakulmion sivu on pohjan kehä 2π · 4 cm = 8π cm, joten vaipan ala on 8π cm · 9 cm = 72π cm². Jos kehän paikalle kirjoitetaan pohjan ala π · 4² cm² = 16π cm², tulee 16π · 9 = 144π. Tämä luku on lieriön tilavuus kuutiosenttimetreinä, ei pinta-ala: pohjan ala kertaa korkeus on kolmen pituuden tulo. Vaippa on suorakulmio, jonka sivut ovat kaksi pituutta, kehä ja korkeus, joten sen ala on neliöyksikköä."},{"tyyppi":"ansa","otsikko":"Ansa 5: väärä yksikkö","sisalto":"Pinta-ala on kahden pituuden tulo, joten sen yksikkö on neliöyksikkö: cm · cm = cm². Vastaus 188 cm³ on väärin, vaikka luku olisi oikea, koska cm³ on tilavuuden yksikkö. Myös pelkkä 188 ilman yksikköä on väärin, kun tehtävä pyytää yksikköä. Kun vastaus pyydetään eri yksikössä kuin mitat, muunna neliöyksiköiden kertoimella 100. Esimerkiksi 2 450 cm² = 24,5 dm², koska 1 dm² = 100 cm². Jakaminen kymmenellä antaisi 245 dm², mikä on kymmenen kertaa liikaa: 245 dm² on jo 2,45 m², vaikka 2 450 cm² on vain noin neljäsosa neliömetristä (0,245 m²)."}],"harjoitusryhmat":[{"id":"sarmio","nimi":"Suorakulmaisen särmiön pinta","info":"Särmiön vaippa on neljä tahkoa pohjien välissä, ja kokonaispinta-ala on kaikki kuusi tahkoa. Laskin on sallittu. Anna vastaus pyydetyssä neliöyksikössä ilman yksikön merkkiä."},{"id":"lierio","nimi":"Ympyrälieriön pinta","info":"Vaippa A_v = 2πrh ja kokonaispinta-ala A = 2πrh + 2πr². Laskin on sallittu: käytä π:n arvona laskimen π-näppäintä ja pyöristä vasta lopuksi."},{"id":"kartio","nimi":"Ympyräkartion pinta","info":"Vaippa A_v = πrs, jossa s on sivujana, ja kokonaispinta-ala A = πrs + πr². Laskin on sallittu: käytä π:n arvona laskimen π-näppäintä ja pyöristä vasta lopuksi."}],"harjoitukset":[{"id":"H01","ryhma":"sarmio","kysymys":"Suorakulmaisen särmiön pohja on 8 cm × 5 cm ja korkeus 6 cm. Montako neliösenttimetriä on särmiön vaipan ala?","vastaus":156,"vinkki":"Vaippa on pohjan ympäri kiertävät neljä tahkoa. Avattuna ne ovat suorakulmio, jonka pituus on pohjan piiri.","selitys":"Pohjan piiri on 8 cm + 5 cm + 8 cm + 5 cm = 26 cm, joten vaipan ala on 26 cm · 6 cm = 156 cm². Vastaus 236 on kokonaispinta-ala, jossa pohjat 2 · 40 cm² ovat mukana, ja 78 syntyy, jos seiniä lasketaan vain kaksi."},{"id":"H02","ryhma":"sarmio","kysymys":"Suorakulmaisen särmiön särmät ovat 7 cm, 4 cm ja 3 cm. Montako neliösenttimetriä on särmiön kokonaispinta-ala?","vastaus":122,"vinkki":"Tahkoja on kolme paria. Laske yhden parin tahko kerrallaan.","selitys":"Tahkojen alat ovat 7 cm · 4 cm = 28 cm², 7 cm · 3 cm = 21 cm² ja 4 cm · 3 cm = 12 cm², ja jokaista on kaksi: 2 · (28 + 21 + 12) cm² = 122 cm². Vastaus 61 syntyy, jos jokainen tahko lasketaan vain kerran, ja 84 on tilavuus kuutiosenttimetreinä."},{"id":"H03","ryhma":"sarmio","kysymys":"Kuution särmä on 9 cm. Kuutio on pöydällä niin, että yksi tahko on pohja. Montako neliösenttimetriä on kuution vaipan ala?","vastaus":324,"vinkki":"Kuution kaikki tahkot ovat neliöitä, joiden sivu on 9 cm. Montako niistä kuuluu vaippaan?","selitys":"Vaippaan kuuluu neljä tahkoa, ja kunkin ala on 9 cm · 9 cm = 81 cm². Vaipan ala on 4 · 81 cm² = 324 cm². Vastaus 486 on kokonaispinta-ala (kuusi tahkoa), ja 729 on tilavuus."},{"id":"H04","ryhma":"sarmio","kysymys":"Suorakulmaisen särmiön mitat ovat 12 cm, 5 cm ja 4 cm. Särmiö asetetaan pöydälle niin, että sen pohjana on tahko, jonka mitat ovat 5 cm × 4 cm. Montako neliösenttimetriä on särmiön vaipan ala?","vastaus":216,"vinkki":"Kun pohja on 5 cm × 4 cm, mikä mitta on korkeus?","selitys":"Korkeus on 12 cm ja pohjan piiri 2 · (5 cm + 4 cm) = 18 cm, joten vaipan ala on 18 cm · 12 cm = 216 cm². Vastaus 136 syntyy, jos pohjaksi otetaan tahko 12 cm × 5 cm, ja 160, jos pohjaksi otetaan 12 cm × 4 cm."},{"id":"H05","ryhma":"sarmio","kysymys":"Pahvilaatikon pohja on 30 cm × 25 cm ja korkeus 12 cm. Laatikossa ei ole kantta. Montako neliösenttimetriä pahvia laatikkoon tarvitaan, kun taitteita ja liimauksia ei oteta huomioon?","vastaus":2070,"vinkki":"Mitkä pinnat laatikossa on? Vaippa ja montako pohjaa?","selitys":"Vaippa on 2 · (30 cm + 25 cm) · 12 cm = 1 320 cm² ja pohja 30 cm · 25 cm = 750 cm², yhteensä 2 070 cm². Vastaus 2 820 on kokonaispinta-ala, jossa kansikin on mukana, ja 1 320 on pelkkä vaippa."},{"id":"H06","ryhma":"sarmio","kysymys":"Laatikon pohja on 0,6 m × 30 cm ja korkeus 20 cm. Montako neliösenttimetriä on laatikon kokonaispinta-ala?","vastaus":7200,"vinkki":"Muunna ensin kaikki mitat senttimetreiksi.","selitys":"0,6 m = 60 cm. Tahkot: 60 cm · 30 cm = 1 800 cm², 60 cm · 20 cm = 1 200 cm² ja 30 cm · 20 cm = 600 cm². Kokonaispinta-ala on 2 · (1 800 + 1 200 + 600) cm² = 7 200 cm². Jos 0,6 lasketaan senttimetreinä, tulos on aivan liian pieni (1 260)."},{"id":"H07","ryhma":"sarmio","kysymys":"Varaston lattia on suorakulmio, jonka mitat ovat 3,0 m ja 2,5 m, ja varaston korkeus on 2,2 m. Varaston seinät maalataan. Montako neliömetriä seinäpintaa on, kun ovia ja ikkunoita ei oteta huomioon? Anna vastaus kymmenesosan tarkkuudella.","vastaus":24.2,"vinkki":"Seinät ovat särmiön vaippa, kun lattia on pohja.","selitys":"Lattian piiri on 2 · (3,0 m + 2,5 m) = 11,0 m, joten seinien ala on 11,0 m · 2,2 m = 24,2 m². Jos katto otetaan mukaan, tulee 31,7 m², ja jos myös lattia, 39,2 m², mutta tehtävä kysyy vain seiniä."},{"id":"H08","ryhma":"lierio","kysymys":"Ympyrälieriön pohjan säde on 3 cm ja korkeus 7 cm. Vaipan ala on kπ cm². Mikä on k?","vastaus":42,"vinkki":"Vaippa on suorakulmio, jonka sivut ovat pohjan kehä 2πr ja korkeus.","selitys":"A_v = 2π · 3 cm · 7 cm = 42π cm², joten k = 42. Vastaus 63 syntyy, jos kehän paikalla on pohjan ala π · 3² = 9π (ansa 4), ja 21, jos kehänä käytetään πr."},{"id":"H09","ryhma":"lierio","kysymys":"Ympyrälieriön pohjan säde on 5 cm ja korkeus 4 cm. Kokonaispinta-ala on kπ cm². Mikä on k?","vastaus":90,"vinkki":"Kokonaispinta-ala on vaippa ja kaksi pohjaa.","selitys":"Vaippa on 2π · 5 · 4 = 40π ja kaksi pohjaa 2 · π · 5² = 50π, yhteensä 90π cm², joten k = 90. Vastaus 65 syntyy, jos pohjia on vain yksi (ansa 2), ja 40, jos lasketaan pelkkä vaippa."},{"id":"H10","ryhma":"lierio","kysymys":"Ympyrälieriön pohjan säde on 6 cm ja korkeus 9 cm. Lieriön tasoverkossa vaippa on suorakulmio, jonka toinen sivu on 9 cm. Toisen sivun pituus on kπ cm. Mikä on k?","vastaus":12,"vinkki":"Suorakulmion toinen sivu kiersi pohjaympyrän ympäri.","selitys":"Sivu on pohjan kehä 2π · 6 cm = 12π cm, joten k = 12. Vastaus 36 on pohjan ala kertoimena (π · 6² = 36π), ja 6 syntyy, jos kehäksi luetaan πr."},{"id":"H11","ryhma":"lierio","kysymys":"Ympyrälieriön pohjan säde on 2,5 cm ja korkeus 10,0 cm. Laske lieriön vaipan ala neliösenttimetrin tarkkuudella. Anna vastaus neliösenttimetreinä ilman yksikköä.","vastaus":157,"vinkki":"A_v = 2πrh. Pyöristä vasta lopuksi.","selitys":"A_v = 2π · 2,5 cm · 10,0 cm = 50π cm² ≈ 157,08 cm² ≈ 157 cm². Likiarvolla 3,14 saat 157,0 cm², joka pyöristyy samaan."},{"id":"H12","ryhma":"lierio","kysymys":"Säilykepurkin pohjan halkaisija on 8,0 cm ja korkeus 12,0 cm. Montako neliösenttimetriä peltiä purkkiin tarvitaan, kun saumoja ei oteta huomioon? Anna vastaus neliösenttimetrin tarkkuudella ilman yksikköä.","vastaus":402,"vinkki":"Purkissa on kylki, pohja ja kansi. Mikä on säde?","selitys":"Säde on 4,0 cm. Vaippa on 2π · 4,0 · 12,0 = 96π ja kaksi pohjaa 2 · π · 4,0² = 32π, yhteensä 128π cm² ≈ 402,1 cm² ≈ 402 cm². Vastaus 1 005 syntyy, jos halkaisija sijoitetaan säteen paikalle (ansa 3), ja 352, jos kansi unohtuu."},{"id":"H13","ryhma":"lierio","kysymys":"Ympyrälieriön pohjan säde on 5 cm ja korkeus 8 cm. Mikä kuvaus sopii lieriön tasoverkkoon?","vastaus":1,"vinkki":"Mikä suorakulmion sivu kiertää pohjaympyrän ympäri? Montako pohjaa lieriöllä on?","selitys":"Tasoverkossa on kaksi ympyrää, joiden säde on 5 cm, ja suorakulmio, jonka sivut ovat pohjan kehä 2π · 5 cm ≈ 31,4 cm ja korkeus 8 cm. Suorakulmion sivu ei ole säde, koska sen pitää ulottua pohjaympyrän ympäri, ja yksi ympyrä riittäisi vain, jos astiassa ei olisi kantta.","tyyppi":"monivalinta","vaihtoehdot":["Kaksi ympyrää, joiden säde on 5 cm, ja suorakulmio, jonka sivut ovat 5 cm ja 8 cm.","Kaksi ympyrää, joiden säde on 5 cm, ja suorakulmio, jonka sivut ovat noin 31,4 cm ja 8 cm.","Yksi ympyrä, jonka säde on 5 cm, ja suorakulmio, jonka sivut ovat noin 31,4 cm ja 8 cm."]},{"id":"H14","ryhma":"lierio","kysymys":"Ympyrälieriön pohjan säde on 5 cm ja korkeus 30 cm. Laske lieriön vaipan ala neliödesimetreinä 0,1 dm²:n tarkkuudella. Anna vastaus neliödesimetreinä ilman yksikköä.","vastaus":9.4,"vinkki":"Laske ensin neliösenttimetreinä. 1 dm² = 100 cm².","selitys":"A_v = 2π · 5 cm · 30 cm = 300π cm² ≈ 942,5 cm². Koska 1 dm² = 100 cm², ala on 942,5 : 100 ≈ 9,4 dm². Vastaus 94,2 syntyy, jos jaetaan kymmenellä niin kuin pituuksissa, ja 942,5 on oikea ala väärässä yksikössä."},{"id":"H15","ryhma":"kartio","kysymys":"Ympyräkartion pohjan säde on 4 cm ja sivujana 9 cm. Vaipan ala on kπ cm². Mikä on k?","vastaus":36,"vinkki":"A_v = πrs.","selitys":"A_v = π · 4 cm · 9 cm = 36π cm², joten k = 36. Vastaus 72 syntyy, jos kaavaan kirjoitetaan 2πrs kuten lieriöön, ja 52, jos vaippaan lisätään pohja π · 4² = 16π."},{"id":"H16","ryhma":"kartio","kysymys":"Ympyräkartion pohjan säde on 3 cm, sivujana 9 cm ja korkeus noin 8,5 cm. Laske kartion vaipan ala neliösenttimetrin tarkkuudella. Anna vastaus neliösenttimetreinä ilman yksikköä.","vastaus":85,"vinkki":"Kumpi janoista on vaipan sektorin säde: sivujana vai korkeus?","selitys":"Vaipan sektorin säde on sivujana, joten A_v = π · 3 cm · 9 cm = 27π cm² ≈ 84,8 cm² ≈ 85 cm². Korkeutta ei tarvita. Vastaus 80 syntyy, jos käytetään korkeutta 8,5 cm (ansa 1)."},{"id":"H17","ryhma":"kartio","kysymys":"Ympyräkartion pohjan säde on 3 cm ja sivujana 8 cm. Kartion kokonaispinta-ala on kπ cm². Mikä on k?","vastaus":33,"vinkki":"Kartiolla on vaippa ja yksi pohja.","selitys":"Vaippa on π · 3 · 8 = 24π ja pohja π · 3² = 9π, yhteensä 33π cm², joten k = 33. Vastaus 42 syntyy, jos pohjia lasketaan kaksi kuten lieriöllä, ja 24 on pelkkä vaippa."},{"id":"H18","ryhma":"kartio","kysymys":"Ympyräkartion pohjan säde on 3 cm ja sivujana 12 cm. Kartion tasoverkossa vaippa on sektori ympyrästä, jonka säde on 12 cm. Mikä osa tämän ympyrän alasta sektori on? Anna vastaus supistettuna murtolukuna.","vastaus":0.25,"vinkki":"Sektorin kaari on pohjan kehä. Mikä osa koko ympyrän kehästä se on?","selitys":"Sektorin kaari on pohjan kehä 2π · 3 cm = 6π cm ja koko ympyrän kehä 2π · 12 cm = 24π cm. Sektori on 6π/24π = 1/4 ympyrästä. Siksi vaipan ala on 1/4 · π · 12² cm² = 36π cm² = π · 3 · 12 cm², kuten kaava πrs antaa."},{"id":"H19","ryhma":"kartio","kysymys":"Jäätelötötterö on ympyräkartion vaippa. Tötterön suun halkaisija on 5,0 cm ja sivujana 12,0 cm. Montako neliösenttimetriä on tötterön ulkopinnan ala? Anna vastaus neliösenttimetrin tarkkuudella ilman yksikköä.","vastaus":94,"vinkki":"Tötterössä ei ole pohjaa. Mikä on säde?","selitys":"Säde on 2,5 cm, joten A_v = π · 2,5 cm · 12,0 cm = 30π cm² ≈ 94,2 cm² ≈ 94 cm². Vastaus 188 syntyy, jos halkaisija sijoitetaan säteen paikalle (ansa 3), ja 114, jos mukaan lasketaan pohja, jota tötterössä ei ole."},{"id":"H20","ryhma":"kartio","kysymys":"Miksi ympyräkartion vaipan ala lasketaan sivujanalla eikä korkeudella?","vastaus":2,"vinkki":"Leikkaa kartio auki ajatuksissa ja levitä vaippa pöydälle. Mikä jana on syntyvän sektorin säde?","selitys":"Vaippa avautuu sektoriksi, jonka säde on sivujana ja kaari pohjan kehä. Sektorin ala on r/s · πs² = πrs. Korkeus kulkee kartion sisällä, eikä se ole minkään tasoverkon osan mitta. Korkeus ei ole sivujanan likiarvo, vaan aina sitä lyhyempi.","tyyppi":"monivalinta","vaihtoehdot":["Koska korkeutta ei voi koskaan mitata kartiosta.","Koska korkeus ja sivujana ovat lähes yhtä pitkät, joten kumpi tahansa käy.","Koska vaippa avautuu sektoriksi, jonka säde on sivujana. Korkeus ei ole minkään tasoverkon osan mitta."]}],"valmis_teksti":"Osaat laskea suorakulmaisen särmiön, ympyrälieriön ja ympyräkartion vaipan alan ja kokonaispinta-alan sekä tarkkana arvona että likiarvona. Erotat vaipan koko pinnasta myös silloin, kun astiasta puuttuu kansi, hahmottelet kappaleen tasoverkon ja kerrot osien mitat. Käytät kartion vaipassa sivujanaa, koska vaippa avautuu sektoriksi, jonka säde on sivujana, ja annat vastauksen neliöyksikössä. Tämä taito on nyt näytetty."};

const esc = s => s;

  const ala=Math.floor(v/10)*10, yla=ala+10, puoli=ala+5;
  const pyor = (v%10)>=5 ? yla : ala;
  const x = n => X0 + (n/100)*(X1-X0);
  let s=`<line class="rail" x1="${X0}" y1="${Y}" x2="${X1}" y2="${Y}"/>`;
  for(let n=0;n<=100;n+=10){
    const near = (n===ala||n===yla);
    s+=`<line class="tick" x1="${x(n)}" y1="${Y-7}" x2="${x(n)}" y2="${Y+7}"/>`;
    s+=`<text class="stop${near?" near":""}" x="${x(n)}" y="${Y+24}" text-anchor="middle">${n}</text>`;
  }
  s+=`<line class="halfway" x1="${x(puoli)}" y1="${Y-16}" x2="${x(puoli)}" y2="${Y+12}"/>`;
  s+=`<text class="stop" x="${x(puoli)}" y="${Y-22}" text-anchor="middle">puoliväli ${puoli}</text>`;
  s+=`<circle class="dot" cx="${x(v)}" cy="${Y}" r="6"/>`;
  s+=`<text class="val" x="${x(v)}" y="${Y-32}" text-anchor="middle">${v}</text>`;
  s+=`<path d="M ${x(v)} ${Y+38} L ${x(pyor)} ${Y+38}" stroke="var(--core)" stroke-width="2" fill="none"/>`;
  s+=`<path d="M ${x(pyor)} ${Y+38} l ${x(pyor)>x(v)?-7:7} -4 l 0 8 z" fill="var(--core)"/>`;
  svg.innerHTML=s;
  out.textContent = `${v} pyöristyy → ${pyor}`;
}

/* ---------- laskujärjestys-widget ---------- */
const ljExp=document.getElementById("ljExp");
if(ljExp && D.kokeilu){
  let ljI=0, ljTokens=[], ljStep=0;
  const laske=(a,op,b)=>{a=+a;b=+b;return op==="×"?a*b:op==="÷"?a/b:op==="+"?a+b:a-b;};
  function ljAlku(){
    const l=D.kokeilu[ljI];
    ljTokens=l.lauseke.replace(/\(/g,"( ").replace(/\)/g," )").split(/\s+/).filter(Boolean);
    ljStep=0; ljPiirra(); ljViesti("","");
  }
  function ljViesti(t,lk){const f=document.getElementById("ljFb"); f.textContent=t; f.className="lj-fb "+(lk||"");}
  function ljPiirra(){
    const l=D.kokeilu[ljI];
    document.getElementById("ljStep").textContent =
      ljStep>=l.askeleet.length ? "valmis" : `askel ${ljStep+1} / ${l.askeleet.length}`;
    if(ljStep>=l.askeleet.length){
      ljExp.innerHTML=`<span class="valmis">${l.lauseke} = ${l.vastaus}</span>`;
      return;
    }
    ljExp.innerHTML=ljTokens.map((t,i)=>
      "×÷+−".includes(t) ? `<button type="button" class="op" data-i="${i}">${t}</button>`
                         : `<span class="tok">${t}</span>`).join("");
    ljExp.querySelectorAll("button.op").forEach(b=>b.addEventListener("click",()=>ljKlikkaa(+b.dataset.i)));
  }
  function ljKlikkaa(i){
    const l=D.kokeilu[ljI], odotettu=l.askeleet[ljStep];
    const ehdotus=[ljTokens[i-1],ljTokens[i],ljTokens[i+1]].join(" ");
    if(ehdotus!==odotettu){
      ljViesti(ljStep===0
        ? "Ei vielä. Sulkeet ovat vahvimmat, sitten kerto ja jako. Yhtä vahvat vasemmalta oikealle."
        : "Ei vielä. Kumpi jäljellä olevista on vahvempi?", "no");
      return;
    }
    const arvo=laske(ljTokens[i-1],ljTokens[i],ljTokens[i+1]);
    let alku=i-1, loppu=i+1;
    if(ljTokens[i-2]==="(" && ljTokens[i+2]===")"){ alku=i-2; loppu=i+2; }
    ljTokens.splice(alku, loppu-alku+1, String(arvo));
    ljStep++;
    ljViesti(ljStep>=l.askeleet.length ? "Valmis. Vastaus on "+l.vastaus+"." : "Oikein. Jatka seuraavaan.", "ok");
    ljPiirra();
  }
  document.getElementById("ljSeuraava").addEventListener("click",()=>{
    ljI=(ljI+1)%D.kokeilu.length; ljAlku();
  });
  ljAlku();
}

};

/* Suomalainen lukumuoto: välilyönti on tuhaterotin, pilkku desimaalierotin.
   Piste voi olla kumpi tahansa. Se tulkitaan tuhaterottimeksi VAIN silloin, kun
   koko luku on aitoa tuhaterotinmuotoa: alkuosa 1–3 numeroa ilman etunollaa ja
   jokainen jatko-osa täsmälleen 3 numeroa (1.500, 12.345.678). Kaikissa muissa
   tapauksissa piste on desimaalipiste — myös 0.125, joka vanhalla säännöllä
   ("3 numeroa pisteen jäljessä = tuhaterotin") luettiin virheellisesti luvuksi 125. */
const TUHATEROTIN = /^[1-9]\d{0,2}(\.\d{3})+$/;
function lueLuku(teksti){
  // Murtoluku (3/4, -3/4) ja sekaluku (1 2/3, -1 2/3) hyväksytään sellaisinaan.
  const raaka = String(teksti).replace(/\u00a0/g, " ").trim();
  let m = raaka.match(/^(-?)(\d+)\s+(\d+)\s*\/\s*(\d+)$/);
  if(m){ const nim = Number(m[4]); if(nim === 0) return null;
    const v = Number(m[2]) + Number(m[3]) / nim; return m[1] ? -v : v; }
  m = raaka.match(/^(-?)\s*(\d+)\s*\/\s*(\d+)$/);
  if(m){ const nim = Number(m[3]); if(nim === 0) return null;
    const v = Number(m[2]) / nim; return m[1] ? -v : v; }
  let s = String(teksti).replace(/[\s\u00a0]/g, "");
  if(s === "") return null;
  if(s.indexOf(",") >= 0){
    s = s.replace(/\./g, "").replace(",", ".");
  } else if(TUHATEROTIN.test(s)){
    s = s.replace(/\./g, "");
  }
  const n = Number(s);
  return Number.isFinite(n) ? n : null;
}

function tarkista(id){
  const h=D.harjoitukset.find(x=>x.id===id);
  const kentta=document.getElementById("in-"+id);
  const fb=document.getElementById("fb-"+id);
  if(kentta.value.trim()===""){ fb.className="fb hint"; fb.textContent="Kirjoita vastaus ensin."; return; }
  const luku=lueLuku(kentta.value);
  if(luku===null){ fb.className="fb no"; fb.textContent="Vastauksen pitää olla luku tai murtoluku (esimerkiksi 3/4)."; return; }
  const oikein = Math.abs(luku - h.vastaus) < 1e-9;
  merkitseTulos(id, oikein, oikein ? "Oikein. "+h.selitys : `Ei vielä. ${h.vinkki} Kokeile uudelleen.`);
}

function tarkistaMonivalinta(id, valittuIndeksi, painike){
  const h=D.harjoitukset.find(x=>x.id===id);
  const rivi=painike.closest(".row");
  rivi.querySelectorAll(".mv-valinta").forEach(b=>b.disabled=true);
  const oikein = valittuIndeksi===h.vastaus;
  painike.classList.add(oikein?"mv-oikein":"mv-vaarin");
  if(!oikein){
    const oikeaBtn=rivi.querySelector(`[data-i="${h.vastaus}"]`);
    if(oikeaBtn) oikeaBtn.classList.add("mv-oikein");
  }
  merkitseTulos(id, oikein, oikein ? "Oikein. "+h.selitys : `Ei ihan. Oikea vastaus on korostettu. ${h.selitys||""}`);
}

/* Kuuntelu: selain lukee tekstin ääneen omalla puhesynteesillään (englanniksi, jos laitteessa on
   englanninkielinen ääni). Ei äänitiedostoja eikä verkkoyhteyttä. Jos laite ei osaa puhua,
   teksti näytetään luettavaksi — silloin tehtävä muuttuu luetun ymmärtämiseksi, mutta ei katkea. */
function puhu(id, nopeus){
  const h=D.harjoitukset.find(x=>x.id===id); if(!h || !h.kuuntele) return;
  const vara=document.getElementById("vara-"+id);
  const naytaTeksti=syy=>{ vara.hidden=false; vara.textContent=syy+" Teksti: "+h.kuuntele; };
  if(!("speechSynthesis" in window)){ naytaTeksti("Tämä laite ei osaa lukea ääneen."); return; }
  const s=window.speechSynthesis; s.cancel();
  const u=new SpeechSynthesisUtterance(h.kuuntele);
  u.lang=h.kieli||"en-GB"; u.rate=nopeus;
  const aanet=s.getVoices(), kieli=u.lang.slice(0,2);
  const aani=aanet.find(a=>a.lang===u.lang) || aanet.find(a=>a.lang && a.lang.startsWith(kieli));
  if(aani) u.voice=aani;
  else if(aanet.length) { naytaTeksti("Laitteessa ei ole englanninkielistä ääntä."); return; }
  u.onerror=()=>naytaTeksti("Ääneen lukeminen ei onnistunut.");
  s.speak(u);
}
