<title>Kuinka usein</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">

<style>
:root{
  --paper:#EFF2F5; --surface:#FFFFFF; --surface-2:#F7F9FB;
  --grid:#DCE3EA; --line:#C9D3DC;
  --ink:#15222C; --ink-2:#4E626F; --ink-3:#7E8F9B;
  --core:#1B5A9E; --core-soft:#E4EDF6;
  --strong:#1F6E5C; --strong-soft:#E1F0EB;
  --chal:#9A6A16; --chal-soft:#F6EDDC;
  --alert:#A33A2B; --alert-soft:#F8E7E3;
  --shadow:0 1px 2px rgba(21,34,44,.06), 0 8px 24px -12px rgba(21,34,44,.18);
  --r:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0F161B; --surface:#18222A; --surface-2:#1D2830;
    --grid:#22303A; --line:#2E3E4A;
    --ink:#E8EFF4; --ink-2:#A3B4C0; --ink-3:#7A8B97;
    --core:#7FB2E4; --core-soft:#16303F;
    --strong:#77CDB4; --strong-soft:#123028;
    --chal:#E0B267; --chal-soft:#33270F;
    --alert:#E8907F; --alert-soft:#3A1E19;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -14px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --paper:#0F161B; --surface:#18222A; --surface-2:#1D2830;
  --grid:#22303A; --line:#2E3E4A;
  --ink:#E8EFF4; --ink-2:#A3B4C0; --ink-3:#7A8B97;
  --core:#7FB2E4; --core-soft:#16303F;
  --strong:#77CDB4; --strong-soft:#123028;
  --chal:#E0B267; --chal-soft:#33270F;
  --alert:#E8907F; --alert-soft:#3A1E19;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -14px rgba(0,0,0,.7);
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:16px; line-height:1.62;
  background-image:
    linear-gradient(to right, var(--grid) 1px, transparent 1px),
    linear-gradient(to bottom, var(--grid) 1px, transparent 1px);
  background-size:26px 26px;
}
.wrap{max-width:760px; margin:0 auto; padding:28px 20px 90px}
h1,h2,h3,h4{font-family:"Familjen Grotesk","IBM Plex Sans",system-ui,sans-serif; text-wrap:balance}

/* header */
header.top{background:var(--surface); border:1px solid var(--line); border-radius:var(--r);
  box-shadow:var(--shadow); padding:22px 24px; display:flex; gap:18px; align-items:flex-start}
.badge{flex:0 0 auto; width:54px; height:54px; border-radius:9px; display:grid; place-items:center;
  background:var(--core-soft); border:1px solid var(--core); color:var(--core)}
.badge svg{width:28px; height:28px; fill:none; stroke:currentColor; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round}
.eyebrow{font-family:"IBM Plex Mono",monospace; font-size:11px; letter-spacing:.14em;
  text-transform:uppercase; color:var(--ink-3); margin:0 0 5px}
header.top h1{margin:0; font-size:30px; font-weight:700; letter-spacing:-.015em}
header.top p{margin:5px 0 0; color:var(--ink-2); font-size:15px}
.tags{display:flex; flex-wrap:wrap; gap:5px; margin-top:11px}
.tag{font-family:"IBM Plex Mono",monospace; font-size:10.5px; letter-spacing:.05em; padding:2px 7px;
  border-radius:4px; background:var(--surface-2); border:1px solid var(--line); color:var(--ink-3)}
.tag.core{background:var(--core-soft); border-color:var(--core); color:var(--core)}

/* teksti */
article{margin-top:26px}
article h2{font-size:21px; font-weight:600; margin:32px 0 10px; letter-spacing:-.01em}
article p{margin:0 0 14px; max-width:64ch}
.lead{font-size:17.5px; color:var(--ink); border-left:3px solid var(--core); padding-left:16px; margin:0 0 8px}

.box{background:var(--surface); border:1px solid var(--line); border-radius:var(--r);
  padding:18px 22px; box-shadow:var(--shadow); margin:22px 0}
.box h3{margin:0 0 12px; font-size:16.5px; font-weight:600}
.box.warn{border-left:3px solid var(--alert)}
.box.note{border-left:3px solid var(--chal)}

ol.steps{margin:0; padding-left:0; list-style:none; counter-reset:s; display:grid; gap:12px}
ol.steps li{counter-increment:s; display:grid; grid-template-columns:auto 1fr; gap:13px; align-items:start}
ol.steps li::before{content:counter(s); font-family:"Familjen Grotesk",sans-serif; font-weight:700; font-size:14px;
  width:26px; height:26px; border-radius:50%; background:var(--core); color:#fff; display:grid; place-items:center; margin-top:2px}

ul.notes{margin:0; padding-left:19px}
ul.notes li{margin-bottom:7px}
ul.notes li:last-child{margin-bottom:0}

.tablewrap{overflow-x:auto}
table{border-collapse:collapse; width:100%; font-size:14.5px; min-width:460px}
th,td{text-align:left; padding:9px 13px; border-bottom:1px solid var(--line)}
th{font-family:"IBM Plex Mono",monospace; font-size:10.5px; letter-spacing:.1em; text-transform:uppercase;
  color:var(--ink-3); font-weight:400; background:var(--surface-2)}
tr:last-child td{border-bottom:0}
td b{color:var(--core); font-weight:600}
td:last-child{font-variant-numeric:tabular-nums; font-weight:600}

/* lukusuora */
.nl svg{width:100%; height:118px; display:block}
.nl .rail{stroke:var(--line); stroke-width:2}
.nl .tick{stroke:var(--line); stroke-width:1.5}
.nl .stop{fill:var(--ink-3); font-family:"IBM Plex Mono",monospace; font-size:11px}
.nl .stop.near{fill:var(--core); font-weight:600}
.nl .dot{fill:var(--chal)}
.nl .val{fill:var(--ink); font-family:"Familjen Grotesk",sans-serif; font-size:15px; font-weight:700}
.nl .halfway{stroke:var(--chal); stroke-dasharray:3 3; stroke-width:1.5}
.nl-controls{display:flex; align-items:center; gap:14px; margin-top:6px}
.nl-controls input{flex:1; accent-color:var(--core)}
.nl-out{font-family:"Familjen Grotesk",sans-serif; font-size:15px; font-weight:600; min-width:12.5em; text-align:right}

/* paikka-arvotaulu */
.box .ohje{margin:0 0 14px; font-size:14.5px; color:var(--ink-2)}
.nt-valinta{display:flex; flex-wrap:wrap; gap:7px; margin-bottom:16px}
.nt-valinta button{font:inherit; font-size:12.5px; font-family:"IBM Plex Mono",monospace; padding:5px 11px;
  border-radius:6px; border:1px solid var(--line); background:var(--surface-2); color:var(--ink-2); cursor:pointer}
.nt-valinta button[aria-pressed="true"]{background:var(--ink); color:var(--paper); border-color:var(--ink)}
.nt-valinta button:focus-visible{outline:2px solid var(--core); outline-offset:2px}
.nt-taulu{display:flex; flex-direction:column; gap:4px; align-items:flex-start; overflow-x:auto; padding-bottom:4px}
.nt-rivi{display:flex; gap:6px; align-items:center}
.nt-rivi .otsa{font-family:"IBM Plex Mono",monospace; font-size:9.5px; letter-spacing:.08em;
  text-transform:uppercase; color:var(--ink-3); width:52px; text-align:center}
.nt-ruutu{width:52px; height:52px; display:grid; place-items:center; border:1.5px solid var(--line);
  border-radius:7px; background:var(--surface-2); font-family:"IBM Plex Mono",monospace; font-size:24px}
.nt-ruutu.kohta{border-color:var(--core); background:var(--core-soft); color:var(--core); font-weight:500}
.nt-ruutu.ratkaiseva{border-color:var(--chal); background:var(--chal-soft); color:var(--chal); font-weight:500}
.nt-ruutu.nolla{color:var(--ink-3)}
.nt-rivi .nimi{font-size:12.5px; color:var(--ink-3); margin-left:12px; white-space:nowrap}
.nt-nuoli{font-size:17px; color:var(--chal); margin-left:6px}
.nt-selite{margin:14px 0 0; font-size:14.5px}
.nt-selite b{color:var(--core)}

/* vahvuusportaat */
.vp-tasot{display:grid; gap:9px; margin-bottom:18px}
.vp-taso{display:flex; gap:11px; align-items:flex-start; font-size:13.5px}
.vp-taso .vp-pallo{width:13px; height:13px; border-radius:4px; margin-top:5px; flex:0 0 auto}
.vp-taso[data-taso="sulkeet"] .vp-pallo{background:var(--core)}
.vp-taso[data-taso="kertojako"] .vp-pallo{background:var(--strong)}
.vp-taso[data-taso="yhteenvahennys"] .vp-pallo{background:var(--chal)}
.vp-taso strong{display:block; font-family:"Familjen Grotesk",sans-serif; font-weight:600; font-size:14.5px}
.vp-taso span{color:var(--ink-2)}
.vp-lauseke{display:flex; flex-wrap:wrap; gap:7px; align-items:flex-end; font-family:"IBM Plex Mono",monospace;
  font-size:25px; padding:10px 2px; min-height:64px}
.vp-lauseke .t{padding:2px 3px}
.vp-lauseke .op{position:relative; padding:2px 9px; border-radius:6px; font-weight:500}
.vp-lauseke .op[data-taso="sulkeet"]{background:var(--core-soft); color:var(--core)}
.vp-lauseke .op[data-taso="kertojako"]{background:var(--strong-soft); color:var(--strong)}
.vp-lauseke .op[data-taso="yhteenvahennys"]{background:var(--chal-soft); color:var(--chal)}
.vp-lauseke .op i{position:absolute; top:-9px; right:-6px; font-style:normal; font-family:"Familjen Grotesk",sans-serif;
  font-size:11px; font-weight:700; width:18px; height:18px; border-radius:50%; display:grid; place-items:center;
  background:currentColor}
.vp-lauseke .op i span{color:var(--surface)}
.vp-rivi{display:flex; align-items:center; gap:16px; margin-top:8px}
.vp-vastaus{font-family:"Familjen Grotesk",sans-serif; font-size:16px; font-weight:600; color:var(--strong)}

/* laskujärjestys-widget */
.lj-exp{display:flex; flex-wrap:wrap; gap:7px; align-items:center; font-family:"IBM Plex Mono",monospace;
  font-size:23px; padding:14px 4px; min-height:62px}
.lj-exp .tok{padding:2px 4px; color:var(--ink)}
.lj-exp button.op{font-family:"IBM Plex Mono",monospace; font-size:23px; padding:3px 12px; border-radius:7px;
  border:1.5px solid var(--line); background:var(--surface-2); color:var(--ink); line-height:1.2}
.lj-exp button.op:hover{border-color:var(--core); color:var(--core)}
.lj-exp button.op:focus-visible{outline:2px solid var(--core); outline-offset:2px}
.lj-exp .valmis{font-family:"Familjen Grotesk",sans-serif; font-size:23px; font-weight:700; color:var(--strong)}
.lj-fb{font-size:14.5px; min-height:1.5em; color:var(--ink-2)}
.lj-fb.no{color:var(--alert)}
.lj-fb.ok{color:var(--strong)}
.lj-row{display:flex; align-items:center; gap:14px; margin-top:10px}
.lj-step{font-family:"IBM Plex Mono",monospace; font-size:11.5px; letter-spacing:.1em;
  text-transform:uppercase; color:var(--ink-3)}

/* harjoitukset */
.progress{position:sticky; top:0; z-index:5; background:var(--surface); border:1px solid var(--line);
  border-radius:var(--r); padding:12px 18px; box-shadow:var(--shadow); display:flex; align-items:center;
  gap:14px; margin:34px 0 18px}
.progress .lbl{font-family:"IBM Plex Mono",monospace; font-size:11px; letter-spacing:.12em;
  text-transform:uppercase; color:var(--ink-3); white-space:nowrap}
.progress .meter{flex:1; height:7px; border-radius:4px; background:var(--surface-2); border:1px solid var(--line); overflow:hidden}
.progress .meter i{display:block; height:100%; background:var(--core); transition:width .25s ease}
.progress .cnt{font-family:"Familjen Grotesk",sans-serif; font-weight:700; font-variant-numeric:tabular-nums; white-space:nowrap}

.grp{margin-top:26px}
.grp-head{display:flex; align-items:baseline; gap:10px; border-bottom:1.5px solid var(--ink); padding-bottom:7px; margin-bottom:14px}
.grp-head h3{margin:0; font-size:17px; font-weight:600}
.grp-head span{font-size:12.5px; color:var(--ink-2)}

.ex{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:14px 16px; margin-bottom:10px}
.ex[data-tila="oikein"]{border-color:var(--strong); box-shadow:inset 3px 0 0 var(--strong)}
.ex[data-tila="vaarin"]{border-color:var(--alert); box-shadow:inset 3px 0 0 var(--alert)}
.ex .q{display:flex; gap:11px; align-items:baseline; flex-wrap:wrap}
.ex .num{font-family:"IBM Plex Mono",monospace; font-size:11.5px; color:var(--ink-3); min-width:2.4em}
.ex .txt{flex:1; min-width:190px; font-size:15.5px}
.ex .txt .aineisto{display:block; margin-bottom:9px; padding-left:12px;
  border-left:2px solid var(--line); color:var(--ink-2); line-height:1.6;
  /* Aineisto voi olla pieni taulukko, jonka rivit on erotettu rivinvaihdoilla.
     Ilman pre-lineä ne valuisivat yhdeksi kappaleeksi ja taulukko katoaisi. */
  white-space:pre-line}
.ex .txt .kysymysrivi{display:block; font-weight:600}
.ex .row{display:flex; gap:8px; align-items:center; margin-top:11px; flex-wrap:wrap}
.ex input[type=text]{font:inherit; font-family:"IBM Plex Mono",monospace; font-size:15px; width:8.5em;
  padding:7px 11px; border:1px solid var(--line); border-radius:7px; background:var(--surface-2);
  color:var(--ink); text-align:right}
.ex input:focus-visible{outline:2px solid var(--core); outline-offset:1px}
button{font:inherit; cursor:pointer}
.btn{font-size:13.5px; padding:7px 15px; border-radius:7px; border:1px solid var(--core);
  background:var(--core); color:#fff}
.btn.ghost{background:transparent; color:var(--ink-2); border-color:var(--line)}
.btn:focus-visible{outline:2px solid var(--core); outline-offset:2px}
.btn.mv-valinta{text-align:left}
/* kuuntelutehtävä: selaimen puhesynteesi lukee englanninkielisen tekstin */
.kuuntele{display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin:2px 0 10px}
.kuuntele .btn{display:inline-flex; gap:7px; align-items:center}
.kuuntele svg{width:16px; height:16px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round}
.kuuntele .varateksti{flex-basis:100%; font-size:14px; color:var(--ink-2); background:var(--surface-2);
  border-radius:7px; padding:8px 12px; margin:0}
.btn.mv-valinta:disabled{cursor:default; opacity:.65}
.btn.mv-oikein{background:var(--strong-soft); border-color:var(--strong); color:var(--strong); opacity:1}
.btn.mv-vaarin{background:var(--alert-soft); border-color:var(--alert); color:var(--alert); opacity:1}
.row.mv{gap:8px 10px}
.fb{margin-top:11px; font-size:14.5px; padding:10px 13px; border-radius:8px; line-height:1.5}
.fb.ok{background:var(--strong-soft); color:var(--strong)}
.fb.no{background:var(--alert-soft); color:var(--alert)}
.fb.hint{background:var(--chal-soft); color:var(--chal)}

.done{background:var(--strong-soft); border:1px solid var(--strong); color:var(--strong);
  border-radius:var(--r); padding:16px 20px; margin-top:20px; font-size:15.5px}
.done h3{margin:0 0 4px; font-size:17px; color:var(--strong)}

details.teacher{margin-top:34px; background:var(--surface); border:1px solid var(--line);
  border-left:3px solid var(--chal); border-radius:var(--r); padding:15px 20px; box-shadow:var(--shadow)}
details.teacher summary{cursor:pointer; font-family:"Familjen Grotesk",sans-serif; font-weight:600; font-size:15px}
details.teacher summary:focus-visible{outline:2px solid var(--core); outline-offset:3px}
details.teacher ul{margin:12px 0 0; padding-left:19px; color:var(--ink-2); font-size:14.5px}
details.teacher li{margin-bottom:8px}
details.teacher p{margin:12px 0 0; color:var(--ink-2); font-size:14.5px}

.back{display:inline-block; margin-top:30px; font-size:13.5px; color:var(--ink-2)}
.back a{color:var(--core)}

@media (prefers-reduced-motion: reduce){*{transition:none !important}}
@media (max-width:560px){
  .wrap{padding:16px 13px 70px}
  header.top h1{font-size:25px}
  .progress{flex-wrap:wrap}
}
</style>

<div class="wrap">

  <header class="top">
    <span class="badge"><svg viewBox="0 0 24 24" aria-hidden="true" id="ikoni"></svg></span>
    <div>
      <p class="eyebrow" id="eyebrow"></p>
      <h1 id="otsikko"></h1>
      <p id="kuvaus"></p>
      <div class="tags" id="tags"></div>
    </div>
  </header>

  <article id="teksti"></article>

  <div class="progress" aria-live="polite">
    <span class="lbl">Harjoitukset</span>
    <span class="meter"><i id="pbar" style="width:0%"></i></span>
    <span class="cnt" id="pcnt">0 / 20</span>
  </div>

  <div id="harjoitukset"></div>
  <div id="valmis"></div>

  <p class="back" id="back"></p>

</div>

<script>
const D = {"tavoite_id":"MAT9-TIL-02","oppiaine":"MAT","vuosiluokka":9,"taso":"ydin","otsikko":"Kuinka usein","kuvaus":"Osaan laatia aineistosta frekvenssitaulukon ja laskea suhteelliset frekvenssit.","versio":"0.2","paivitetty":"2026-10-11","ops":{"T":["T8","T13","T19"],"S":["S6"]},"ikoni":"jarjestys","eyebrow":"Matematiikka · 9. luokka · Tilastot ja todennäköisyys","teksti":[{"tyyppi":"johdanto","sisalto":"Oppilaskunta kysyi koulun kaikilta yhdeksäsluokkalaisilta, kuinka monta minuuttia heidän koulumatkansa kestää, ja sai 180 vastausta. Pitkä luettelo lukuja ei vielä kerro paljon: siitä ei näe yhdellä silmäyksellä, onko tavallinen matka viisi vai neljäkymmentä minuuttia. Kun vastaukset ryhmitellään ja lasketaan, montako vastausta osuu kuhunkin ryhmään, luettelosta tulee taulukko, josta jakauma näkyy. Kun taulukkoon lisätään vielä, kuinka suuri osa kaikista vastaajista kuuluu kuhunkin ryhmään, tuloksia voi verrata toisen koulun kyselyyn, vaikka siellä vastaajia olisi eri määrä. Tässä taidossa opit laatimaan aineistosta frekvenssitaulukon, luokittelemaan aineiston annettuihin luokkiin, laskemaan suhteelliset frekvenssit ja tarkistamaan taulukon summista. Opit myös erottamaan diskreetin ja jatkuvan muuttujan ja kuvaamaan jakauman niiden mukaan pylväsdiagrammina tai histogrammina. Laskin on sallittu. Tällä sivulla ei ole kuvia, joten aineistot on kirjoitettu tehtäviin lukuina ja diagrammit kuvataan sanoin."},{"tyyppi":"kappale","otsikko":"Muuttuja, arvo ja frekvenssi","sisalto":"Tilastossa kerätään tietoa jostakin ominaisuudesta, jota sanotaan tilastomuuttujaksi, esimerkiksi koulumatkan kestosta tai siitä, montako kertaa viikossa käy kaupassa. Jokainen vastaus on havainto, ja luku, jonka havainto saa, on muuttujan arvo. Frekvenssi kertoo, montako kertaa sama arvo esiintyy aineistossa. Kaksikymmentä oppilasta kertoi, montako kertaa he kävivät viime viikolla kaupassa: 2, 0, 3, 1, 2, 4, 1, 2, 0, 3, 2, 1, 5, 2, 3, 1, 2, 0, 4, 2. Arvo 2 esiintyy seitsemän kertaa, joten sen frekvenssi on 7. Kun lasket jokaisen arvon frekvenssin ja kirjoitat ne arvojen viereen pienimmästä suurimpaan, saat frekvenssitaulukon: arvon 0 frekvenssi on 3, arvon 1 frekvenssi 4, arvon 2 frekvenssi 7, arvon 3 frekvenssi 3, arvon 4 frekvenssi 2 ja arvon 5 frekvenssi 1. Laskemisessa auttaa tukkimiehen kirjanpito: käy luettelo läpi kerran alusta loppuun ja vedä jokaisesta havainnosta viiva oikean arvon kohdalle, niin yksikään havainto ei jää laskematta eikä tule lasketuksi kahdesti. Kun jokainen havainto on laskettu täsmälleen kerran, frekvenssien summa on havaintojen määrä: 3 + 4 + 7 + 3 + 2 + 1 = 20. Jos summa ei ole 20, jokin havainto puuttuu tai on laskettu kahdesti, ja virhe etsitään ennen kuin taulukkoa käytetään. Frekvenssitaulukosta voi piirtää pylväsdiagrammin. Seitsemännellä luokalla keskilukujen pylväsdiagrammissa oli oma pylväs jokaiselle havainnolle, esimerkiksi jokaisen viikonpäivän myynnille. Nyt vaaka-akselilla ovat muuttujan arvot, ja pylvään korkeus on arvon frekvenssi eli se, montako havaintoa sai juuri sen arvon."},{"tyyppi":"ansa","otsikko":"Ansa 1: arvo vai frekvenssi","sisalto":"Kysymykseen ”Montako oppilasta kävi kaupassa tasan 2 kertaa?” vastaus ei ole 2. Luku 2 on kysymyksessä annettu arvo, ja kysymys on, montako havaintoa sai tämän arvon. Vastaus on arvon 2 frekvenssi 7. Sama sekaannus syntyy pylväsdiagrammissa, jos pylvään korkeudeksi piirretään arvo: arvon 4 pylväästä tulisi korkeus 4, vaikka arvo 4 esiintyy aineistossa vain kahdesti. Kun luet kysymystä, etsi ensin arvo ja kysy sitten, montako havaintoa sai sen. Vaaka-akselilla ovat arvot ja pystyakselilla frekvenssit."},{"tyyppi":"kappale","otsikko":"Diskreetti ja jatkuva muuttuja","sisalto":"Määrällinen muuttuja on joko diskreetti tai jatkuva. Diskreetin muuttujan arvot saadaan laskemalla, ja se voi saada vain erillisiä arvoja: kaupassakäyntejä voi olla 2 tai 3 mutta ei 2,4. Lukumäärät, kuten maalien, viestien tai huoneiden määrä, ovat diskreettejä. Jatkuvan muuttujan arvot saadaan mittaamalla, ja se voi saada minkä tahansa arvon joltakin väliltä: koulumatka voi kestää 12 minuuttia, 12,5 minuuttia tai mitä tahansa siltä väliltä. Pituus, aika, massa ja lämpötila ovat jatkuvia. Jatkuvan muuttujan arvot kirjataan yleensä pyöristettyinä, esimerkiksi kokonaisina senttimetreinä tai minuutteina. Muuttuja on silti jatkuva, koska pyöristys johtuu mittauksesta eikä itse suureesta. Muuttujan tyyppi ratkaisee, miten jakauma kuvataan. Tämän taidon tehtävissä diskreetillä muuttujalla on vain muutama eri arvo, ja sen frekvenssit kuvataan pylväsdiagrammilla, jossa pylväät ovat erillään, koska arvojen välissä ei ole muita arvoja. Jatkuvan muuttujan aineisto luokitellaan ensin, ja luokkien frekvenssit kuvataan histogrammilla. Histogrammin pylväät ovat kiinni toisissaan, koska jatkuvalla muuttujalla luokkien välissä ei ole aukkoa: koulumatkan luokka 10–19 minuuttia jatkuu suoraan luokkaan 20–29 minuuttia. Diskreetti–jatkuva-jako koskee määrällisiä muuttujia. Laadullisesta muuttujasta, kuten lempiväristä tai kulkutavasta, voi laskea frekvenssit ja suhteelliset frekvenssit, mutta sitä ei luokitella diskreetiksi tai jatkuvaksi."},{"tyyppi":"kappale","otsikko":"Luokittelu","sisalto":"Kun muuttujalla on paljon eri arvoja, esimerkiksi 50 pelaajan pituudet senttimetreinä, lähes jokainen arvo esiintyy vain kerran tai kahdesti, eikä arvoittainen frekvenssitaulukko näytä jakaumaa. Silloin arvot ryhmitellään luokkiin, ja frekvenssi lasketaan jokaiselle luokalle: montako havaintoa osuu luokan rajojen väliin. Luokittelussa menetetään osa tiedosta, koska taulukosta ei enää näe yksittäisiä arvoja, mutta jakauman muoto tulee näkyviin. Hyvällä luokittelulla on kolme ehtoa. Luokat ovat yhtä leveitä, jotta pylväiden korkeuksia voi verrata. Luokat eivät mene päällekkäin, jotta jokainen havainto kuuluu täsmälleen yhteen luokkaan. Luokat kattavat koko aineiston pienimmästä havainnosta suurimpaan, jotta mikään havainto ei jää ulkopuolelle. Kun havainnot ovat kokonaislukuja, luokan rajat ilmoitetaan kokonaislukuina, kuten oppikirjassa: 160–164, 165–169, 170–174. Luokkaan 160–164 kuuluvat havainnot 160, 161, 162, 163 ja 164, ja seuraava luokka alkaa luvusta 165. Luokan leveys on kahden peräkkäisen luokan alarajojen erotus, tässä 165 − 160 = 5. Se ei ole 164 − 160 = 4, sillä luokassa on viisi eri kokonaislukua. Luokkia tarvitaan niin monta, että ensimmäinen luokka sisältää pienimmän havainnon ja viimeinen suurimman: jos pituudet ovat välillä 158–183 cm ja luokat alkavat luokasta 155–159, tarvitaan luokat 155–159, 160–164, 165–169, 170–174, 175–179 ja 180–184 eli kuusi luokkaa. Luokat voi valita monella oikealla tavalla, joten tehtävissä luokat annetaan valmiina, kun vastaus tarkistetaan. Kun luokittelet omaa aineistoa, valitse leveys, jolla luokkia tulee viidestä kahdeksaan, ja aloita ensimmäinen luokka sopivasta tasaluvusta pienimmän havainnon kohdalta tai sen alapuolelta."},{"tyyppi":"ansa","otsikko":"Ansa 2: rajahavainto väärään luokkaan","sisalto":"Luokat ovat 0–9, 10–19 ja 20–29 minuuttia, ja aineistossa on havainnot 19 ja 20. Havainto 20 kuuluu luokkaan 20–29, koska luokan alaraja on 20. Jos sen laskee luokkaan 10–19 siksi, että ”kymmenestä kahteenkymmeneen” kuulostaa oikealta, kummankin luokan frekvenssi muuttuu. Jos sen laskee molempiin luokkiin, frekvenssien summa on yhtä suurempi kuin havaintojen määrä. Katso ennen aloittamista jokaisen luokan ala- ja yläraja ja etsi aineistosta luvut, jotka ovat tasan rajoilla. Kun taulukko on valmis, laske frekvenssien summa ja vertaa sitä havaintojen määrään. Summa paljastaa havainnon, joka on laskettu kahdesti tai jäänyt pois. Se ei paljasta havaintoa, joka on viety väärään luokkaan, joten rajahavainnot katsotaan erikseen."},{"tyyppi":"saanto","otsikko":"Näin laadit luokitellun frekvenssitaulukon ja histogrammin","askeleet":["Kirjoita annetut luokat taulukon ensimmäiseen sarakkeeseen pienimmästä suurimpaan. Tarkista, että pienin ja suurin havainto mahtuvat luokkiin.","Etsi aineistosta luvut, jotka ovat tasan jonkin luokan ala- tai ylärajalla, ja päätä niiden luokka rajojen mukaan.","Käy aineisto läpi kerran alusta loppuun ja vedä jokaisesta havainnosta viiva oikean luokan kohdalle. Yliviivaa havainto luettelosta, kun olet merkinnyt sen.","Laske viivat luokan frekvenssiksi ja kirjoita frekvenssien summa taulukon viimeiselle riville. Summan pitää olla havaintojen määrä.","Laske tarvittaessa suhteelliset frekvenssit: frekvenssi : havaintojen määrä. Kirjoita niidenkin summa näkyviin.","Piirrä histogrammi: luokat vaaka-akselille järjestyksessä ja yhtä leveinä, frekvenssi pystyakselille tasavälisellä asteikolla nollasta alkaen. Nimeä akselit, esimerkiksi ”koulumatka (min)” ja ”frekvenssi (oppilasta)”, ja kirjoita otsikko.","Piirrä jokaiselle luokalle pylväs, jonka korkeus on luokan frekvenssi. Pylväät ovat kiinni toisissaan. Älä jätä pylväiden väliin rakoa: rako väittäisi, että luokkien välissä on arvoja, joita aineisto ei voi saada, vaikka jatkuvalla muuttujalla aukkoa ei ole.","Pylvään keskikohta on luokkakeskus eli luokan rajojen keskiarvo: luokan 160–164 luokkakeskus on (160 + 164) : 2 = 162. Luokkakeskusta tarvitset, kun lasket luokitellusta aineistosta keskiarvon."]},{"tyyppi":"kappale","otsikko":"Suhteellinen frekvenssi","sisalto":"Frekvenssi kertoo määrän mutta ei osuutta. Seitsemän oppilasta on suuri osa kahdenkymmenen oppilaan ryhmästä mutta pieni osa koko koulusta. Suhteellinen frekvenssi kertoo, kuinka suuri osa kaikista havainnoista sai tietyn arvon tai kuuluu tiettyyn luokkaan: suhteellinen frekvenssi = frekvenssi : havaintojen määrä. Jakajana on havaintojen määrä, koska osuus lasketaan koko aineistosta, ja koko aineisto on kaikki havainnot. Kaupassakäyntien aineistossa arvon 2 suhteellinen frekvenssi on 7/20 = 0,35 = 35 %. Saman osuuden voi ilmoittaa murtolukuna, desimaalilukuna tai prosentteina, ja prosentit lasket samoin kuin kahdeksannella luokalla. Suhteellisen frekvenssin avulla eri kokoisia aineistoja voi verrata: jos toisessa ryhmässä 9 oppilasta 30:stä kävi kaupassa kahdesti, osuus on 30 %, joten se on pienempi kuin 35 %, vaikka oppilaita on enemmän. Kaikkien suhteellisten frekvenssien summa on 1 eli 100 %, koska kaikki osat yhdessä ovat koko aineisto. Kun suhteelliset frekvenssit pyöristetään, summa voi olla vähän yli tai alle 100 %, esimerkiksi 99 % tai 101 %. Jokainen pyöristys siirtää lukua enintään puoli prosenttiyksikköä ylös tai alas, ja kun siirrot eivät kumoa toisiaan, ne näkyvät summassa. Viiden luokan taulukossa summa voi siksi poiketa sadasta enintään kaksi prosenttiyksikköä. Tarkista aina kaksi asiaa: frekvenssien summa on tasan havaintojen määrä, ja pyöristettyjen suhteellisten frekvenssien summa on noin 100 %."},{"tyyppi":"ansa","otsikko":"Ansa 3: väärä jakaja tai prosenttimerkki desimaaliluvussa","sisalto":"Taulukossa on neljä luokkaa ja 36 havaintoa, ja yhden luokan frekvenssi on 9. Suhteellinen frekvenssi ei ole 9 : 4 = 2,25, sillä luokkien määrä ei ole koko aineisto. Se ei myöskään ole 9 jaettuna suurimmalla frekvenssillä. Oikea lasku on 9 : 36 = 0,25. Osuus ei voi olla yli 1 eli yli 100 %, joten tulos 2,25 paljastaa väärän jakajan heti. Suurimmalla frekvenssillä jakaminen ei paljastu näin, joten katso aina, että jakaja on havaintojen määrä. Toinen virhe syntyy muunnoksessa: 0,25 ei ole 0,25 %, vaan 0,25 = 25/100 = 25 %. Desimaaliluvusta saat prosentit kertomalla sadalla. Tarkista vielä järkevyys: 9 havaintoa 36:sta on neljäsosa, ja neljäsosa on 25 %, ei neljäsosa prosentista."},{"tyyppi":"ansa","otsikko":"Ansa 4: 101 % ei ole virhe","sisalto":"Kerhon 36 jäsenen jakaumassa luokkien frekvenssit ovat 6, 15, 10 ja 5. Suhteelliset frekvenssit kokonaisiksi prosenteiksi pyöristettyinä ovat 17 %, 42 %, 28 % ja 14 %, ja niiden summa on 101 %. Taulukossa ei ole virhettä: tarkat arvot 16,7 %, 41,7 %, 27,8 % ja 13,9 % on kaikki pyöristetty ylöspäin, ja pienet siirrot ylös kasvattavat summaa. Jos muutat jonkin luvun, esimerkiksi 42 %:n luvuksi 41 %, jotta summa olisi 100 %, muuttamasi luku on väärin pyöristetty. Etsi virhettä siis frekvensseistä: jos frekvenssien summa on havaintojen määrä ja jokainen prosentti on oikein pyöristetty, summa 99 % tai 101 % on kunnossa. Jos summa poikkeaa sadasta enemmän kuin pyöristykset voivat selittää, esimerkiksi 90 % tai 110 %, jokin luku on laskettu väärin."}],"harjoitusryhmat":[{"id":"taulukko","nimi":"Frekvenssitaulukko ja muuttujan tyyppi","info":"Frekvenssi on se, montako kertaa arvo esiintyy. Frekvenssien summa on havaintojen määrä. Diskreetin muuttujan arvot lasketaan, jatkuvan mitataan. Laskin on sallittu."},{"id":"luokat","nimi":"Luokittelu ja histogrammi","info":"Havainto kuuluu luokkaan, jonka ala- ja ylärajan väliin se osuu; molemmat rajat kuuluvat luokkaan. Luokan leveys on peräkkäisten alarajojen erotus. Laskin on sallittu."},{"id":"osuus","nimi":"Suhteellinen frekvenssi ja summien tarkistus","info":"Suhteellinen frekvenssi = frekvenssi : havaintojen määrä. Anna prosentit ilman %-merkkiä ja pyöristä vasta lopuksi, kun tehtävä pyytää. Laskin on sallittu."}],"harjoitukset":[{"id":"H01","ryhma":"taulukko","kysymys":"Montako kertaa 24 oppilasta kävi kirjastossa syyskuussa (arvot 0–5).\n0, 1, 4, 0, 2, 1, 0, 2, 0, 2, 3, 2\n1, 2, 0, 4, 2, 3, 1, 1, 1, 5, 1, 3\n\nMontako oppilasta kävi kirjastossa tasan 2 kertaa?","vastaus":6,"vinkki":"Etsi luettelosta kaikki luvut 2 ja laske ne. Kysytty arvo on 2, mutta vastaus on se, montako kertaa luku 2 esiintyy.","selitys":"Luku 2 esiintyy luettelossa kuusi kertaa, joten arvon 2 frekvenssi on 6. Vastaus 2 olisi kysymyksen arvo, ei frekvenssi.","tyyppi":"luku"},{"id":"H02","ryhma":"taulukko","kysymys":"Kahvilan asiakkaiden ostamat pullat (pullien määrä: asiakkaiden määrä)\n0: 4\n1: 12\n2: 7\n3: 2\n\nMontako asiakasta aineistossa on?","vastaus":25,"vinkki":"Jokainen asiakas on yksi havainto. Laske frekvenssit yhteen.","selitys":"Havaintojen määrä on frekvenssien summa: 4 + 12 + 7 + 2 = 25. Vastaus 4 olisi rivien määrä ja 6 arvojen 0, 1, 2 ja 3 summa.","tyyppi":"luku"},{"id":"H03","ryhma":"taulukko","kysymys":"Perheiden polkupyörät (polkupyörien määrä: perheiden määrä)\n0: 3\n1: 6\n2: 9\n3: 7\n4: 4\n5: 2\n\nMontako perhettä omistaa vähintään 3 polkupyörää?","vastaus":13,"vinkki":"Vähintään 3 tarkoittaa arvoja 3, 4 ja 5. Laske niiden frekvenssit yhteen.","selitys":"Arvojen 3, 4 ja 5 frekvenssit ovat 7, 4 ja 2, ja 7 + 4 + 2 = 13. Vastaus 7 olisi pelkän arvon 3 frekvenssi.","tyyppi":"luku"},{"id":"H04","ryhma":"taulukko","kysymys":"Frekvenssitaulukossa on viisi luokkaa, ja niiden frekvenssit ovat 7, 9, 12, 6 ja 4. Aineistossa on 36 havaintoa.\n\nKuinka monta havaintoa taulukossa on liikaa?","vastaus":2,"vinkki":"Laske frekvenssien summa ja vertaa sitä havaintojen määrään.","selitys":"Frekvenssien summa on 7 + 9 + 12 + 6 + 4 = 38, mutta havaintoja on 36. Taulukossa on 38 − 36 = 2 havaintoa liikaa: jokin havainto on laskettu kahteen luokkaan tai kahdesti.","tyyppi":"luku"},{"id":"H05","ryhma":"taulukko","kysymys":"Muuttujat:\n– jääkiekko-ottelun maalien määrä\n– suklaalevyn massa\n– puhelimeen tallennettujen kuvien määrä\n– uimahallin veden lämpötila\n– bussimatkan kesto\n– kurpitsan massa\n\nMontako näistä kuudesta muuttujasta on jatkuvia?","vastaus":4,"vinkki":"Kysy jokaisesta: lasketaanko arvo vai mitataanko se?","selitys":"Massa, lämpötila ja kesto mitataan, joten suklaalevyn massa, veden lämpötila, bussimatkan kesto ja kurpitsan massa ovat jatkuvia: 4 muuttujaa. Maalien ja kuvien määrät lasketaan, joten ne ovat diskreettejä.","tyyppi":"luku"},{"id":"H06","ryhma":"taulukko","kysymys":"Kesäleirin 40 osallistujan pituudet mitattiin ja kirjattiin kokonaisina senttimetreinä.\n\nMillainen muuttuja pituus on, ja millä diagrammilla sen jakauma kuvataan?","vastaus":1,"vinkki":"Saadaanko pituus laskemalla vai mittaamalla? Muuttaako pyöristys suureen luonnetta?","selitys":"Pituus mitataan, ja se voi saada minkä tahansa arvon väliltä, joten se on jatkuva. Kokonaisiksi senttimetreiksi pyöristäminen johtuu mittauksesta, ei suureesta. Jatkuva aineisto luokitellaan ja kuvataan histogrammilla, jonka pylväät ovat kiinni toisissaan.","tyyppi":"monivalinta","vaihtoehdot":["Diskreetti, koska pituudet on pyöristetty kokonaisiksi senttimetreiksi; pylväsdiagrammi","Jatkuva, koska pituus mitataan ja voi saada minkä tahansa arvon väliltä; histogrammi luokittelun jälkeen","Jatkuva, koska havaintoja on paljon; pylväsdiagrammi, jonka pylväät ovat erillään"]},{"id":"H07","ryhma":"luokat","kysymys":"30 kuusentaimen pituus senttimetreinä. Luokat: 20–29, 30–39, 40–49, 50–59, 60–69.\n34, 36, 56, 30, 44, 57, 44, 67, 46, 40\n32, 43, 23, 65, 41, 38, 43, 56, 38, 48\n58, 42, 66, 29, 57, 39, 28, 30, 64, 55\n\nMikä on luokan 30–39 frekvenssi?","vastaus":8,"vinkki":"Luokkaan 30–39 kuuluvat havainnot 30, 31, …, 39. Katso erikseen luvut 29, 30, 39 ja 40.","selitys":"Luokkaan 30–39 kuuluu kahdeksan havaintoa, ja niiden joukossa ovat molemmat 30:t ja 39. Havainto 29 kuuluu luokkaan 20–29 ja havainto 40 luokkaan 40–49.","tyyppi":"luku"},{"id":"H08","ryhma":"luokat","kysymys":"28 kananmunan massa grammoina. Luokat: 50–54, 55–59, 60–64, 65–69, 70–74.\n68, 61, 67, 53, 57, 63, 72, 68, 57, 56\n62, 63, 63, 65, 73, 54, 56, 55, 62, 57\n60, 59, 68, 60, 64, 68, 63, 53\n\nMikä on luokan 60–64 frekvenssi?","vastaus":10,"vinkki":"Luokan alaraja 60 ja yläraja 64 kuuluvat luokkaan. Luku 59 kuuluu edelliseen ja luku 65 seuraavaan luokkaan.","selitys":"Luokkaan 60–64 kuuluu kymmenen havaintoa, ja niiden joukossa ovat molemmat 60:t ja 64. Laske lopuksi kaikkien luokkien frekvenssit 3 + 7 + 10 + 6 + 2 = 28, niin näet, ettei mitään jäänyt pois.","tyyppi":"luku"},{"id":"H09","ryhma":"luokat","kysymys":"Aineiston pienin havainto on 23 cm ja suurin 68 cm. Havainnot luokitellaan luokkiin 20–24, 25–29 ja niin edelleen.\n\nMontako luokkaa tarvitaan, jotta kaikki havainnot mahtuvat luokkiin?","vastaus":10,"vinkki":"Kirjoita luokkia, kunnes luokka sisältää luvun 68. Ensimmäinen luokka on 20–24.","selitys":"Luokat ovat 20–24, 25–29, 30–34, 35–39, 40–44, 45–49, 50–54, 55–59, 60–64 ja 65–69. Luokkia on kymmenen. Lasku (68 − 23) : 5 = 9 ei riitä, koska ensimmäinen luokka alkaa luvusta 20 eikä luvusta 23.","tyyppi":"luku"},{"id":"H10","ryhma":"luokat","kysymys":"Aineisto on luokiteltu luokkiin 30–34, 35–39, 40–44 ja niin edelleen.\n\nMikä on luokan leveys?","vastaus":5,"vinkki":"Laske kahden peräkkäisen luokan alarajojen erotus.","selitys":"Alarajojen erotus on 35 − 30 = 5. Luokkaan 30–34 kuuluvat luvut 30, 31, 32, 33 ja 34, eli viisi lukua. Vastaus 4 syntyisi laskusta 34 − 30.","tyyppi":"luku"},{"id":"H11","ryhma":"luokat","kysymys":"Bussimatkan kesto 40 matkustajalla (min: frekvenssi)\n0–9 min: 6\n10–19 min: 13\n20–29 min: 11\n30–39 min: 7\n40–49 min: 3\n\nMontako matkustajaa matkusti vähintään 20 minuuttia?","vastaus":21,"vinkki":"Vähintään 20 minuuttia tarkoittaa luokkia 20–29, 30–39 ja 40–49.","selitys":"Luokkien 20–29, 30–39 ja 40–49 frekvenssit ovat 11, 7 ja 3, ja 11 + 7 + 3 = 21.","tyyppi":"luku"},{"id":"H12","ryhma":"luokat","kysymys":"Aineisto: 12, 20, 7, 30, 18, 25, 10, 33, 20, 15, 28, 36\nLuokat: 0–10, 10–20, 20–30, 30–40\n\nMontako aineiston havainnoista sopii kahteen luokkaan?","vastaus":4,"vinkki":"Etsi havainnot, jotka ovat tasan jonkin kahden luokan yhteisellä rajalla.","selitys":"Luvut 10, 20 ja 30 ovat kahden luokan rajalla: 10 sopii luokkiin 0–10 ja 10–20, ja niin edelleen. Aineistossa on yksi 10, kaksi 20:tä ja yksi 30, yhteensä 4 havaintoa. Luokat menevät päällekkäin, joten luokittelu on huono. Korjatut luokat olisivat esimerkiksi 0–9, 10–19, 20–29 ja 30–39.","tyyppi":"luku"},{"id":"H13","ryhma":"luokat","kysymys":"30 oppilaan koulumatkaan kuluva aika on luokiteltu luokkiin 0–9, 10–19, 20–29, 30–39 ja 40–49 minuuttia.\n\nMillainen on oikein piirretty histogrammi?","vastaus":1,"vinkki":"Histogrammi kuvaa jatkuvaa muuttujaa. Mitä pylvään korkeus esittää?","selitys":"Pylvään korkeus on luokan frekvenssi eli se, montako oppilasta kuuluu luokkaan. Pylväät ovat kiinni toisissaan, koska aika on jatkuva eikä luokkien välissä ole aukkoa.","tyyppi":"monivalinta","vaihtoehdot":["Pylväät ovat erillään, ja pylvään korkeus on luokan frekvenssi","Pylväät ovat kiinni toisissaan, ja pylvään korkeus on luokan frekvenssi","Pylväät ovat kiinni toisissaan, ja pylvään korkeus on luokan yläraja"]},{"id":"H14","ryhma":"osuus","kysymys":"Aamupalan syöminen, 20 vastaajaa\njoka päivä: 13\njoskus: 5\nei koskaan: 2\n\nMikä on vaihtoehdon ”joskus” suhteellinen frekvenssi prosentteina? Anna vastaus ilman %-merkkiä.","vastaus":25,"vinkki":"Jaa frekvenssi havaintojen määrällä 20 ja muuta tulos prosenteiksi.","selitys":"5 : 20 = 0,25 = 25 %. Jakaja on havaintojen määrä 20, ei vaihtoehtojen määrä 3.","tyyppi":"luku"},{"id":"H15","ryhma":"osuus","kysymys":"Lempilaji, 45 vastaajaa\njalkapallo: 17\nuinti: 12\ntanssi: 9\nkiipeily: 7\n\nMikä on vaihtoehdon ”jalkapallo” suhteellinen frekvenssi prosentteina kokonaislukuun pyöristettynä? Anna vastaus ilman %-merkkiä.","vastaus":38,"vinkki":"Laske 17 : 45 ja kerro sadalla. Pyöristä vasta lopuksi.","selitys":"17 : 45 = 0,3777… ≈ 37,8 %, kokonaislukuun pyöristettynä 38 %. Katkaisu antaisi väärän vastauksen 37.","tyyppi":"luku"},{"id":"H16","ryhma":"osuus","kysymys":"Kyselyyn vastasi 45 oppilasta, ja heistä 12 soittaa jotakin soitinta.\n\nMikä on soittajien suhteellinen frekvenssi? Anna vastaus supistettuna murtolukuna.","vastaus":0.26666666666666666,"vinkki":"Kirjoita ensin frekvenssi : havaintojen määrä murtolukuna ja supista.","selitys":"Suhteellinen frekvenssi on 12/45. Osoittaja ja nimittäjä ovat jaollisia kolmella: 12/45 = 4/15.","tyyppi":"luku"},{"id":"H17","ryhma":"osuus","kysymys":"Taulukossa on 30 havaintoa viidessä luokassa, ja luokkien frekvenssit ovat 4, 7, 5, 13 ja 1.\n\nLaske jokaisen luokan suhteellinen frekvenssi prosentteina kokonaislukuun pyöristettynä. Mikä on pyöristettyjen prosenttien summa? Anna vastaus ilman %-merkkiä.","vastaus":99,"vinkki":"Laske jokaisen luokan frekvenssi : 30 prosentteina, pyöristä kukin kokonaislukuun ja laske pyöristetyt luvut yhteen.","selitys":"4/30 ≈ 13,3 % ≈ 13 %, 7/30 ≈ 23,3 % ≈ 23 %, 5/30 ≈ 16,7 % ≈ 17 %, 13/30 ≈ 43,3 % ≈ 43 % ja 1/30 ≈ 3,3 % ≈ 3 %. Summa on 13 + 23 + 17 + 43 + 3 = 99. Taulukko on kunnossa: neljä lukua pyöristettiin alaspäin ja vain yksi ylöspäin, joten summa jää sadan alle. Jos katkaiset luvut pyöristämättä, saat summaksi 98.","tyyppi":"luku"},{"id":"H18","ryhma":"osuus","kysymys":"Frekvenssitaulukossa on viisi luokkaa. Neljän luokan suhteelliset frekvenssit ovat 21 %, 33 %, 17 % ja 14 %. Prosentit on laskettu tarkasti, eikä niitä ole pyöristetty.\n\nMikä on viidennen luokan suhteellinen frekvenssi prosentteina? Anna vastaus ilman %-merkkiä.","vastaus":15,"vinkki":"Kaikkien luokkien suhteellisten frekvenssien summa on 100 %.","selitys":"21 + 33 + 17 + 14 = 85, joten viidennen luokan osuus on 100 − 85 = 15 %.","tyyppi":"luku"},{"id":"H19","ryhma":"osuus","kysymys":"Kyselyyn vastasi 60 oppilasta. Vastausvaihtoehdon ”kerran kuussa” suhteellinen frekvenssi oli 45 %.\n\nMontako oppilasta valitsi vaihtoehdon ”kerran kuussa”?","vastaus":27,"vinkki":"Frekvenssi = suhteellinen frekvenssi · havaintojen määrä.","selitys":"45 % = 0,45, ja 0,45 · 60 = 27 oppilasta. Tarkistus: 27 : 60 = 0,45 = 45 %.","tyyppi":"luku"},{"id":"H20","ryhma":"osuus","kysymys":"Kerhon X 30 jäsenestä 12 ja kerhon Y 25 jäsenestä 11 osallistui syysretkelle.\n\nLaske kummankin kerhon osallistujien suhteellinen frekvenssi prosentteina. Mikä on näistä kahdesta suurempi? Anna vastaus ilman %-merkkiä.","vastaus":44,"vinkki":"Jaa kummassakin kerhossa osallistujien määrä kerhon jäsenmäärällä.","selitys":"Kerho X: 12 : 30 = 0,40 = 40 %. Kerho Y: 11 : 25 = 0,44 = 44 %. Kerhossa Y osuus on suurempi, vaikka osallistujia on vähemmän: 11 jäsentä 25:stä on suurempi osa kerhosta kuin 12 jäsentä 30:stä. Siksi eri kokoisia ryhmiä verrataan suhteellisilla frekvensseillä eikä lukumäärillä.","tyyppi":"luku"}],"valmis_teksti":"Osaat laatia aineistosta frekvenssitaulukon arvoittain ja luokitella jatkuvan muuttujan aineiston annettuihin luokkiin niin, että rajalla olevat havainnot menevät oikeaan luokkaan. Lasket suhteelliset frekvenssit jakamalla havaintojen määrällä ja annat ne prosentteina, tarkistat, että frekvenssien summa on havaintojen määrä ja pyöristettyjen prosenttien summa noin 100 %, ja erotat diskreetin ja jatkuvan muuttujan sekä pylväsdiagrammin ja histogrammin. Tämä taito on nyt näytetty."};

/* ---------- lukusuora ---------- */
const svg=document.getElementById("nlsvg"), rng=document.getElementById("nlrange"), out=document.getElementById("nlout");
const X0=34, X1=606, Y=62;
function piirraNL(v){
  const ala=Math.floor(v/10)*10, yla=ala+10, puoli=ala+5;
  const pyor = (v%10)>=5 ? yla : ala;
  const x = n => X0 + (n/100)*(X1-X0);
  let s=`<line class="rail" x1="${X0}" y1="${Y}" x2="${X1}" y2="${Y}"/>`;
  for(let n=0;n<=100;n+=10){
    const near = (n===ala||n===yla);
    s+=`<line class="tick" x1="${x(n)}" y1="${Y-7}" x2="${x(n)}" y2="${Y+7}"/>`;
    s+=`<text class="stop${near?" near":""}" x="${x(n)}" y="${Y+24}" text-anchor="middle">${n}</text>`;
  }
  s+=`<line class="halfway" x1="${x(puoli)}" y1="${Y-16}" x2="${x(puoli)}" y2="${Y+12}"/>`;
  s+=`<text class="stop" x="${x(puoli)}" y="${Y-22}" text-anchor="middle">puoliväli ${puoli}</text>`;
  s+=`<circle class="dot" cx="${x(v)}" cy="${Y}" r="6"/>`;
  s+=`<text class="val" x="${x(v)}" y="${Y-32}" text-anchor="middle">${v}</text>`;
  s+=`<path d="M ${x(v)} ${Y+38} L ${x(pyor)} ${Y+38}" stroke="var(--core)" stroke-width="2" fill="none"/>`;
  s+=`<path d="M ${x(pyor)} ${Y+38} l ${x(pyor)>x(v)?-7:7} -4 l 0 8 z" fill="var(--core)"/>`;
  svg.innerHTML=s;
  out.textContent = `${v} pyöristyy → ${pyor}`;
}

/* ---------- laskujärjestys-widget ---------- */
const ljExp=document.getElementById("ljExp");
if(ljExp && D.kokeilu){
  let ljI=0, ljTokens=[], ljStep=0;
  const laske=(a,op,b)=>{a=+a;b=+b;return op==="×"?a*b:op==="÷"?a/b:op==="+"?a+b:a-b;};
  function ljAlku(){
    const l=D.kokeilu[ljI];
    ljTokens=l.lauseke.replace(/\(/g,"( ").replace(/\)/g," )").split(/\s+/).filter(Boolean);
    ljStep=0; ljPiirra(); ljViesti("","");
  }
  function ljViesti(t,lk){const f=document.getElementById("ljFb"); f.textContent=t; f.className="lj-fb "+(lk||"");}
  function ljPiirra(){
    const l=D.kokeilu[ljI];
    document.getElementById("ljStep").textContent =
      ljStep>=l.askeleet.length ? "valmis" : `askel ${ljStep+1} / ${l.askeleet.length}`;
    if(ljStep>=l.askeleet.length){
      ljExp.innerHTML=`<span class="valmis">${l.lauseke} = ${l.vastaus}</span>`;
      return;
    }
    ljExp.innerHTML=ljTokens.map((t,i)=>
      "×÷+−".includes(t) ? `<button type="button" class="op" data-i="${i}">${t}</button>`
                         : `<span class="tok">${t}</span>`).join("");
    ljExp.querySelectorAll("button.op").forEach(b=>b.addEventListener("click",()=>ljKlikkaa(+b.dataset.i)));
  }
  function ljKlikkaa(i){
    const l=D.kokeilu[ljI], odotettu=l.askeleet[ljStep];
    const ehdotus=[ljTokens[i-1],ljTokens[i],ljTokens[i+1]].join(" ");
    if(ehdotus!==odotettu){
      ljViesti(ljStep===0
        ? "Ei vielä. Sulkeet ovat vahvimmat, sitten kerto ja jako. Yhtä vahvat vasemmalta oikealle."
        : "Ei vielä. Kumpi jäljellä olevista on vahvempi?", "no");
      return;
    }
    const arvo=laske(ljTokens[i-1],ljTokens[i],ljTokens[i+1]);
    let alku=i-1, loppu=i+1;
    if(ljTokens[i-2]==="(" && ljTokens[i+2]===")"){ alku=i-2; loppu=i+2; }
    ljTokens.splice(alku, loppu-alku+1, String(arvo));
    ljStep++;
    ljViesti(ljStep>=l.askeleet.length ? "Valmis. Vastaus on "+l.vastaus+"." : "Oikein. Jatka seuraavaan.", "ok");
    ljPiirra();
  }
  document.getElementById("ljSeuraava").addEventListener("click",()=>{
    ljI=(ljI+1)%D.kokeilu.length; ljAlku();
  });
  ljAlku();
}

};

/* Suomalainen lukumuoto: välilyönti on tuhaterotin, pilkku desimaalierotin.
   Piste voi olla kumpi tahansa. Se tulkitaan tuhaterottimeksi VAIN silloin, kun
   koko luku on aitoa tuhaterotinmuotoa: alkuosa 1–3 numeroa ilman etunollaa ja
   jokainen jatko-osa täsmälleen 3 numeroa (1.500, 12.345.678). Kaikissa muissa
   tapauksissa piste on desimaalipiste — myös 0.125, joka vanhalla säännöllä
   ("3 numeroa pisteen jäljessä = tuhaterotin") luettiin virheellisesti luvuksi 125. */
const TUHATEROTIN = /^[1-9]\d{0,2}(\.\d{3})+$/;
function lueLuku(teksti){
  // Murtoluku (3/4, -3/4) ja sekaluku (1 2/3, -1 2/3) hyväksytään sellaisinaan.
  const raaka = String(teksti).replace(/\u00a0/g, " ").trim();
  let m = raaka.match(/^(-?)(\d+)\s+(\d+)\s*\/\s*(\d+)$/);
  if(m){ const nim = Number(m[4]); if(nim === 0) return null;
    const v = Number(m[2]) + Number(m[3]) / nim; return m[1] ? -v : v; }
  m = raaka.match(/^(-?)\s*(\d+)\s*\/\s*(\d+)$/);
  if(m){ const nim = Number(m[3]); if(nim === 0) return null;
    const v = Number(m[2]) / nim; return m[1] ? -v : v; }
  let s = String(teksti).replace(/[\s\u00a0]/g, "");
  if(s === "") return null;
  if(s.indexOf(",") >= 0){
    s = s.replace(/\./g, "").replace(",", ".");
  } else if(TUHATEROTIN.test(s)){
    s = s.replace(/\./g, "");
  }
  const n = Number(s);
  return Number.isFinite(n) ? n : null;
}

function tarkista(id){
  const h=D.harjoitukset.find(x=>x.id===id);
  const kentta=document.getElementById("in-"+id);
  const fb=document.getElementById("fb-"+id);
  if(kentta.value.trim()===""){ fb.className="fb hint"; fb.textContent="Kirjoita vastaus ensin."; return; }
  const luku=lueLuku(kentta.value);
  if(luku===null){ fb.className="fb no"; fb.textContent="Vastauksen pitää olla luku tai murtoluku (esimerkiksi 3/4)."; return; }
  const oikein = Math.abs(luku - h.vastaus) < 1e-9;
  merkitseTulos(id, oikein, oikein ? "Oikein. "+h.selitys : `Ei vielä. ${h.vinkki} Kokeile uudelleen.`);
}

function tarkistaMonivalinta(id, valittuIndeksi, painike){
  const h=D.harjoitukset.find(x=>x.id===id);
  const rivi=painike.closest(".row");
  rivi.querySelectorAll(".mv-valinta").forEach(b=>b.disabled=true);
  const oikein = valittuIndeksi===h.vastaus;
  painike.classList.add(oikein?"mv-oikein":"mv-vaarin");
  if(!oikein){
    const oikeaBtn=rivi.querySelector(`[data-i="${h.vastaus}"]`);
    if(oikeaBtn) oikeaBtn.classList.add("mv-oikein");
  }
  merkitseTulos(id, oikein, oikein ? "Oikein. "+h.selitys : `Ei ihan. Oikea vastaus on korostettu. ${h.selitys||""}`);
}

/* Kuuntelu: selain lukee tekstin ääneen omalla puhesynteesillään (englanniksi, jos laitteessa on
   englanninkielinen ääni). Ei äänitiedostoja eikä verkkoyhteyttä. Jos laite ei osaa puhua,
   teksti näytetään luettavaksi — silloin tehtävä muuttuu luetun ymmärtämiseksi, mutta ei katkea. */
function puhu(id, nopeus){
  const h=D.harjoitukset.find(x=>x.id===id); if(!h || !h.kuuntele) return;
  const vara=document.getElementById("vara-"+id);
  const naytaTeksti=syy=>{ vara.hidden=false; vara.textContent=syy+" Teksti: "+h.kuuntele; };
  if(!("speechSynthesis" in window)){ naytaTeksti("Tämä laite ei osaa lukea ääneen."); return; }
  const s=window.speechSynthesis; s.cancel();
  const u=new SpeechSynthesisUtterance(h.kuuntele);
  u.lang=h.kieli||"en-GB"; u.rate=nopeus;
  const aanet=s.getVoices(), kieli=u.lang.slice(0,2);
  const aani=aanet.find(a=>a.lang===u.lang) || aanet.find(a=>a.lang && a.lang.startsWith(kieli));
  if(aani) u.voice=aani;
  else if(aanet.length) { naytaTeksti("Laitteessa ei ole englanninkielistä ääntä."); return; }
  u.onerror=()=>naytaTeksti("Ääneen lukeminen ei onnistunut.");
  s.speak(u);
}
