<title>Pallon mitat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">

<style>
:root{
  --paper:#EFF2F5; --surface:#FFFFFF; --surface-2:#F7F9FB;
  --grid:#DCE3EA; --line:#C9D3DC;
  --ink:#15222C; --ink-2:#4E626F; --ink-3:#7E8F9B;
  --core:#1B5A9E; --core-soft:#E4EDF6;
  --strong:#1F6E5C; --strong-soft:#E1F0EB;
  --chal:#9A6A16; --chal-soft:#F6EDDC;
  --alert:#A33A2B; --alert-soft:#F8E7E3;
  --shadow:0 1px 2px rgba(21,34,44,.06), 0 8px 24px -12px rgba(21,34,44,.18);
  --r:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0F161B; --surface:#18222A; --surface-2:#1D2830;
    --grid:#22303A; --line:#2E3E4A;
    --ink:#E8EFF4; --ink-2:#A3B4C0; --ink-3:#7A8B97;
    --core:#7FB2E4; --core-soft:#16303F;
    --strong:#77CDB4; --strong-soft:#123028;
    --chal:#E0B267; --chal-soft:#33270F;
    --alert:#E8907F; --alert-soft:#3A1E19;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -14px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --paper:#0F161B; --surface:#18222A; --surface-2:#1D2830;
  --grid:#22303A; --line:#2E3E4A;
  --ink:#E8EFF4; --ink-2:#A3B4C0; --ink-3:#7A8B97;
  --core:#7FB2E4; --core-soft:#16303F;
  --strong:#77CDB4; --strong-soft:#123028;
  --chal:#E0B267; --chal-soft:#33270F;
  --alert:#E8907F; --alert-soft:#3A1E19;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -14px rgba(0,0,0,.7);
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:16px; line-height:1.62;
  background-image:
    linear-gradient(to right, var(--grid) 1px, transparent 1px),
    linear-gradient(to bottom, var(--grid) 1px, transparent 1px);
  background-size:26px 26px;
}
.wrap{max-width:760px; margin:0 auto; padding:28px 20px 90px}
h1,h2,h3,h4{font-family:"Familjen Grotesk","IBM Plex Sans",system-ui,sans-serif; text-wrap:balance}

/* header */
header.top{background:var(--surface); border:1px solid var(--line); border-radius:var(--r);
  box-shadow:var(--shadow); padding:22px 24px; display:flex; gap:18px; align-items:flex-start}
.badge{flex:0 0 auto; width:54px; height:54px; border-radius:9px; display:grid; place-items:center;
  background:var(--core-soft); border:1px solid var(--core); color:var(--core)}
.badge svg{width:28px; height:28px; fill:none; stroke:currentColor; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round}
.eyebrow{font-family:"IBM Plex Mono",monospace; font-size:11px; letter-spacing:.14em;
  text-transform:uppercase; color:var(--ink-3); margin:0 0 5px}
header.top h1{margin:0; font-size:30px; font-weight:700; letter-spacing:-.015em}
header.top p{margin:5px 0 0; color:var(--ink-2); font-size:15px}
.tags{display:flex; flex-wrap:wrap; gap:5px; margin-top:11px}
.tag{font-family:"IBM Plex Mono",monospace; font-size:10.5px; letter-spacing:.05em; padding:2px 7px;
  border-radius:4px; background:var(--surface-2); border:1px solid var(--line); color:var(--ink-3)}
.tag.core{background:var(--core-soft); border-color:var(--core); color:var(--core)}

/* teksti */
article{margin-top:26px}
article h2{font-size:21px; font-weight:600; margin:32px 0 10px; letter-spacing:-.01em}
article p{margin:0 0 14px; max-width:64ch}
.lead{font-size:17.5px; color:var(--ink); border-left:3px solid var(--core); padding-left:16px; margin:0 0 8px}

.box{background:var(--surface); border:1px solid var(--line); border-radius:var(--r);
  padding:18px 22px; box-shadow:var(--shadow); margin:22px 0}
.box h3{margin:0 0 12px; font-size:16.5px; font-weight:600}
.box.warn{border-left:3px solid var(--alert)}
.box.note{border-left:3px solid var(--chal)}

ol.steps{margin:0; padding-left:0; list-style:none; counter-reset:s; display:grid; gap:12px}
ol.steps li{counter-increment:s; display:grid; grid-template-columns:auto 1fr; gap:13px; align-items:start}
ol.steps li::before{content:counter(s); font-family:"Familjen Grotesk",sans-serif; font-weight:700; font-size:14px;
  width:26px; height:26px; border-radius:50%; background:var(--core); color:#fff; display:grid; place-items:center; margin-top:2px}

ul.notes{margin:0; padding-left:19px}
ul.notes li{margin-bottom:7px}
ul.notes li:last-child{margin-bottom:0}

.tablewrap{overflow-x:auto}
table{border-collapse:collapse; width:100%; font-size:14.5px; min-width:460px}
th,td{text-align:left; padding:9px 13px; border-bottom:1px solid var(--line)}
th{font-family:"IBM Plex Mono",monospace; font-size:10.5px; letter-spacing:.1em; text-transform:uppercase;
  color:var(--ink-3); font-weight:400; background:var(--surface-2)}
tr:last-child td{border-bottom:0}
td b{color:var(--core); font-weight:600}
td:last-child{font-variant-numeric:tabular-nums; font-weight:600}

/* lukusuora */
.nl svg{width:100%; height:118px; display:block}
.nl .rail{stroke:var(--line); stroke-width:2}
.nl .tick{stroke:var(--line); stroke-width:1.5}
.nl .stop{fill:var(--ink-3); font-family:"IBM Plex Mono",monospace; font-size:11px}
.nl .stop.near{fill:var(--core); font-weight:600}
.nl .dot{fill:var(--chal)}
.nl .val{fill:var(--ink); font-family:"Familjen Grotesk",sans-serif; font-size:15px; font-weight:700}
.nl .halfway{stroke:var(--chal); stroke-dasharray:3 3; stroke-width:1.5}
.nl-controls{display:flex; align-items:center; gap:14px; margin-top:6px}
.nl-controls input{flex:1; accent-color:var(--core)}
.nl-out{font-family:"Familjen Grotesk",sans-serif; font-size:15px; font-weight:600; min-width:12.5em; text-align:right}

/* paikka-arvotaulu */
.box .ohje{margin:0 0 14px; font-size:14.5px; color:var(--ink-2)}
.nt-valinta{display:flex; flex-wrap:wrap; gap:7px; margin-bottom:16px}
.nt-valinta button{font:inherit; font-size:12.5px; font-family:"IBM Plex Mono",monospace; padding:5px 11px;
  border-radius:6px; border:1px solid var(--line); background:var(--surface-2); color:var(--ink-2); cursor:pointer}
.nt-valinta button[aria-pressed="true"]{background:var(--ink); color:var(--paper); border-color:var(--ink)}
.nt-valinta button:focus-visible{outline:2px solid var(--core); outline-offset:2px}
.nt-taulu{display:flex; flex-direction:column; gap:4px; align-items:flex-start; overflow-x:auto; padding-bottom:4px}
.nt-rivi{display:flex; gap:6px; align-items:center}
.nt-rivi .otsa{font-family:"IBM Plex Mono",monospace; font-size:9.5px; letter-spacing:.08em;
  text-transform:uppercase; color:var(--ink-3); width:52px; text-align:center}
.nt-ruutu{width:52px; height:52px; display:grid; place-items:center; border:1.5px solid var(--line);
  border-radius:7px; background:var(--surface-2); font-family:"IBM Plex Mono",monospace; font-size:24px}
.nt-ruutu.kohta{border-color:var(--core); background:var(--core-soft); color:var(--core); font-weight:500}
.nt-ruutu.ratkaiseva{border-color:var(--chal); background:var(--chal-soft); color:var(--chal); font-weight:500}
.nt-ruutu.nolla{color:var(--ink-3)}
.nt-rivi .nimi{font-size:12.5px; color:var(--ink-3); margin-left:12px; white-space:nowrap}
.nt-nuoli{font-size:17px; color:var(--chal); margin-left:6px}
.nt-selite{margin:14px 0 0; font-size:14.5px}
.nt-selite b{color:var(--core)}

/* vahvuusportaat */
.vp-tasot{display:grid; gap:9px; margin-bottom:18px}
.vp-taso{display:flex; gap:11px; align-items:flex-start; font-size:13.5px}
.vp-taso .vp-pallo{width:13px; height:13px; border-radius:4px; margin-top:5px; flex:0 0 auto}
.vp-taso[data-taso="sulkeet"] .vp-pallo{background:var(--core)}
.vp-taso[data-taso="kertojako"] .vp-pallo{background:var(--strong)}
.vp-taso[data-taso="yhteenvahennys"] .vp-pallo{background:var(--chal)}
.vp-taso strong{display:block; font-family:"Familjen Grotesk",sans-serif; font-weight:600; font-size:14.5px}
.vp-taso span{color:var(--ink-2)}
.vp-lauseke{display:flex; flex-wrap:wrap; gap:7px; align-items:flex-end; font-family:"IBM Plex Mono",monospace;
  font-size:25px; padding:10px 2px; min-height:64px}
.vp-lauseke .t{padding:2px 3px}
.vp-lauseke .op{position:relative; padding:2px 9px; border-radius:6px; font-weight:500}
.vp-lauseke .op[data-taso="sulkeet"]{background:var(--core-soft); color:var(--core)}
.vp-lauseke .op[data-taso="kertojako"]{background:var(--strong-soft); color:var(--strong)}
.vp-lauseke .op[data-taso="yhteenvahennys"]{background:var(--chal-soft); color:var(--chal)}
.vp-lauseke .op i{position:absolute; top:-9px; right:-6px; font-style:normal; font-family:"Familjen Grotesk",sans-serif;
  font-size:11px; font-weight:700; width:18px; height:18px; border-radius:50%; display:grid; place-items:center;
  background:currentColor}
.vp-lauseke .op i span{color:var(--surface)}
.vp-rivi{display:flex; align-items:center; gap:16px; margin-top:8px}
.vp-vastaus{font-family:"Familjen Grotesk",sans-serif; font-size:16px; font-weight:600; color:var(--strong)}

/* laskujärjestys-widget */
.lj-exp{display:flex; flex-wrap:wrap; gap:7px; align-items:center; font-family:"IBM Plex Mono",monospace;
  font-size:23px; padding:14px 4px; min-height:62px}
.lj-exp .tok{padding:2px 4px; color:var(--ink)}
.lj-exp button.op{font-family:"IBM Plex Mono",monospace; font-size:23px; padding:3px 12px; border-radius:7px;
  border:1.5px solid var(--line); background:var(--surface-2); color:var(--ink); line-height:1.2}
.lj-exp button.op:hover{border-color:var(--core); color:var(--core)}
.lj-exp button.op:focus-visible{outline:2px solid var(--core); outline-offset:2px}
.lj-exp .valmis{font-family:"Familjen Grotesk",sans-serif; font-size:23px; font-weight:700; color:var(--strong)}
.lj-fb{font-size:14.5px; min-height:1.5em; color:var(--ink-2)}
.lj-fb.no{color:var(--alert)}
.lj-fb.ok{color:var(--strong)}
.lj-row{display:flex; align-items:center; gap:14px; margin-top:10px}
.lj-step{font-family:"IBM Plex Mono",monospace; font-size:11.5px; letter-spacing:.1em;
  text-transform:uppercase; color:var(--ink-3)}

/* harjoitukset */
.progress{position:sticky; top:0; z-index:5; background:var(--surface); border:1px solid var(--line);
  border-radius:var(--r); padding:12px 18px; box-shadow:var(--shadow); display:flex; align-items:center;
  gap:14px; margin:34px 0 18px}
.progress .lbl{font-family:"IBM Plex Mono",monospace; font-size:11px; letter-spacing:.12em;
  text-transform:uppercase; color:var(--ink-3); white-space:nowrap}
.progress .meter{flex:1; height:7px; border-radius:4px; background:var(--surface-2); border:1px solid var(--line); overflow:hidden}
.progress .meter i{display:block; height:100%; background:var(--core); transition:width .25s ease}
.progress .cnt{font-family:"Familjen Grotesk",sans-serif; font-weight:700; font-variant-numeric:tabular-nums; white-space:nowrap}

.grp{margin-top:26px}
.grp-head{display:flex; align-items:baseline; gap:10px; border-bottom:1.5px solid var(--ink); padding-bottom:7px; margin-bottom:14px}
.grp-head h3{margin:0; font-size:17px; font-weight:600}
.grp-head span{font-size:12.5px; color:var(--ink-2)}

.ex{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:14px 16px; margin-bottom:10px}
.ex[data-tila="oikein"]{border-color:var(--strong); box-shadow:inset 3px 0 0 var(--strong)}
.ex[data-tila="vaarin"]{border-color:var(--alert); box-shadow:inset 3px 0 0 var(--alert)}
.ex .q{display:flex; gap:11px; align-items:baseline; flex-wrap:wrap}
.ex .num{font-family:"IBM Plex Mono",monospace; font-size:11.5px; color:var(--ink-3); min-width:2.4em}
.ex .txt{flex:1; min-width:190px; font-size:15.5px}
.ex .txt .aineisto{display:block; margin-bottom:9px; padding-left:12px;
  border-left:2px solid var(--line); color:var(--ink-2); line-height:1.6;
  /* Aineisto voi olla pieni taulukko, jonka rivit on erotettu rivinvaihdoilla.
     Ilman pre-lineä ne valuisivat yhdeksi kappaleeksi ja taulukko katoaisi. */
  white-space:pre-line}
.ex .txt .kysymysrivi{display:block; font-weight:600}
.ex .row{display:flex; gap:8px; align-items:center; margin-top:11px; flex-wrap:wrap}
.ex input[type=text]{font:inherit; font-family:"IBM Plex Mono",monospace; font-size:15px; width:8.5em;
  padding:7px 11px; border:1px solid var(--line); border-radius:7px; background:var(--surface-2);
  color:var(--ink); text-align:right}
.ex input:focus-visible{outline:2px solid var(--core); outline-offset:1px}
button{font:inherit; cursor:pointer}
.btn{font-size:13.5px; padding:7px 15px; border-radius:7px; border:1px solid var(--core);
  background:var(--core); color:#fff}
.btn.ghost{background:transparent; color:var(--ink-2); border-color:var(--line)}
.btn:focus-visible{outline:2px solid var(--core); outline-offset:2px}
.btn.mv-valinta{text-align:left}
/* kuuntelutehtävä: selaimen puhesynteesi lukee englanninkielisen tekstin */
.kuuntele{display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin:2px 0 10px}
.kuuntele .btn{display:inline-flex; gap:7px; align-items:center}
.kuuntele svg{width:16px; height:16px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round}
.kuuntele .varateksti{flex-basis:100%; font-size:14px; color:var(--ink-2); background:var(--surface-2);
  border-radius:7px; padding:8px 12px; margin:0}
.btn.mv-valinta:disabled{cursor:default; opacity:.65}
.btn.mv-oikein{background:var(--strong-soft); border-color:var(--strong); color:var(--strong); opacity:1}
.btn.mv-vaarin{background:var(--alert-soft); border-color:var(--alert); color:var(--alert); opacity:1}
.row.mv{gap:8px 10px}
.fb{margin-top:11px; font-size:14.5px; padding:10px 13px; border-radius:8px; line-height:1.5}
.fb.ok{background:var(--strong-soft); color:var(--strong)}
.fb.no{background:var(--alert-soft); color:var(--alert)}
.fb.hint{background:var(--chal-soft); color:var(--chal)}

.done{background:var(--strong-soft); border:1px solid var(--strong); color:var(--strong);
  border-radius:var(--r); padding:16px 20px; margin-top:20px; font-size:15.5px}
.done h3{margin:0 0 4px; font-size:17px; color:var(--strong)}

details.teacher{margin-top:34px; background:var(--surface); border:1px solid var(--line);
  border-left:3px solid var(--chal); border-radius:var(--r); padding:15px 20px; box-shadow:var(--shadow)}
details.teacher summary{cursor:pointer; font-family:"Familjen Grotesk",sans-serif; font-weight:600; font-size:15px}
details.teacher summary:focus-visible{outline:2px solid var(--core); outline-offset:3px}
details.teacher ul{margin:12px 0 0; padding-left:19px; color:var(--ink-2); font-size:14.5px}
details.teacher li{margin-bottom:8px}
details.teacher p{margin:12px 0 0; color:var(--ink-2); font-size:14.5px}

.back{display:inline-block; margin-top:30px; font-size:13.5px; color:var(--ink-2)}
.back a{color:var(--core)}

@media (prefers-reduced-motion: reduce){*{transition:none !important}}
@media (max-width:560px){
  .wrap{padding:16px 13px 70px}
  header.top h1{font-size:25px}
  .progress{flex-wrap:wrap}
}
</style>

<div class="wrap">

  <header class="top">
    <span class="badge"><svg viewBox="0 0 24 24" aria-hidden="true" id="ikoni"></svg></span>
    <div>
      <p class="eyebrow" id="eyebrow"></p>
      <h1 id="otsikko"></h1>
      <p id="kuvaus"></p>
      <div class="tags" id="tags"></div>
    </div>
  </header>

  <article id="teksti"></article>

  <div class="progress" aria-live="polite">
    <span class="lbl">Harjoitukset</span>
    <span class="meter"><i id="pbar" style="width:0%"></i></span>
    <span class="cnt" id="pcnt">0 / 20</span>
  </div>

  <div id="harjoitukset"></div>
  <div id="valmis"></div>

  <p class="back" id="back"></p>

</div>

<script>
const D = {"tavoite_id":"MAT9-MIT-05","oppiaine":"MAT","vuosiluokka":9,"otsikko":"Pallon mitat","kuvaus":"Osaan laskea pallon tilavuuden ja pinta-alan.","versio":"0.2","paivitetty":"2026-10-11","ops":{"T":["T7","T18"],"S":["S5"]},"taso":"ydin","ikoni":"pallo","eyebrow":"Matematiikka · 9. luokka · Mittaaminen","teksti":[{"tyyppi":"johdanto","sisalto":"Urheiluliikkeen kesätyöntekijänä täytät jumppapalloja kompressorilla. Pakkauksessa lukee halkaisija 65 cm, ja asiakas kysyy, montako litraa ilmaa palloon menee. Työkaveri laskee pallon tilavuuden kaavalla V = 4/3 · πr³ ja sijoittaa säteen paikalle luvun 65. Tulokseksi tulee noin 1 150 000 cm³ eli yli tuhat litraa, enemmän kuin kuutiometri. Nopea arvio paljastaa virheen: pallo mahtuu laatikkoon, jonka jokainen särmä on 65 cm, ja laatikon tilavuus on 65 · 65 · 65 cm³ ≈ 275 000 cm³ eli noin 275 litraa. Pallossa ei siis voi olla yli tuhatta litraa ilmaa. Työkaveri sijoitti halkaisijan, vaikka kaava tarvitsee säteen 32,5 cm. Oikea tilavuus on 4/3 · π · 32,5³ cm³ ≈ 144 000 cm³ eli noin 144 litraa, hieman yli puolet laatikosta. Tässä taidossa lasket pallon pinta-alan ja tilavuuden säteestä tai halkaisijasta, ratkaiset säteen pallon ympärysmitasta ja annat tilavuuden tarvittaessa litroina. Opit erottamaan pinta-alan ja tilavuuden kaavat ja yksiköt toisistaan ja tarkistamaan tuloksen suuruusluokan pallon ympärille piirretyn kuution avulla."},{"tyyppi":"kappale","otsikko":"Pallo, säde ja isoympyrä","sisalto":"Pallo muodostuu kaikista avaruuden pisteistä, jotka ovat yhtä kaukana yhdestä pisteestä, pallon keskipisteestä. Tämä etäisyys on pallon säde r. Halkaisija d on jana, joka kulkee pallon pinnalta keskipisteen kautta pinnan vastakkaiselle puolelle, joten se on kaksi sädettä: d = 2r ja r = d : 2. Sana pallo voi tarkoittaa pelkkää pintaa, kuten ilmapallon kuorta, tai koko kappaletta, jonka pinta rajaa. Pinta-ala kertoo, kuinka paljon pintaa on, ja tilavuus, kuinka paljon tilaa pinnan sisällä on. Kun pallo leikataan tasolla, joka kulkee keskipisteen kautta, leikkauskuvio on ympyrä, jonka keskipiste ja säde ovat samat kuin pallon. Sitä sanotaan isoympyräksi. Maapallon päiväntasaaja on likimain isoympyrä. Jos taso ei kulje keskipisteen kautta, leikkauskuvio on ympyrä, jonka säde on pallon sädettä lyhyempi. Pallon ympärysmitta on isoympyrän kehän pituus: mittanauha kiedotaan pallon ympäri sen leveimmältä kohdalta. Siksi ympärysmitalle pätee sama kaava kuin ympyrän kehälle 8. luokalla: p = 2πr = πd."},{"tyyppi":"saanto","otsikko":"Näin lasket pallon pinta-alan ja tilavuuden","askeleet":["Katso, onko annettu säde vai halkaisija. Molemmat kaavat tarvitsevat säteen, joten puolita halkaisija ennen sijoittamista: halkaisija 50 cm antaa säteen 25 cm.","Päätä, kysytäänkö pintaa vai tilaa. Pinta-ala A = 4πr² kertoo, paljonko pintaa on, esimerkiksi maalattavaa tai päällystettävää. Tilavuus V = 4/3 · πr³ kertoo, paljonko sisään mahtuu, esimerkiksi ilmaa tai vettä.","Laske ensin potenssi ja sitten kertoimet: r² = r · r ja r³ = r · r · r. Tilavuuden kerroin 4/3 tarkoittaa, että kerrot neljällä ja jaat kolmella.","Kirjoita yksikkö. Pinta-ala on neliöyksiköissä (cm², m²), koska r² on pituus kertaa pituus. Tilavuus on kuutioyksiköissä (cm³, m³), koska r³ on kolmen pituuden tulo.","Tarkka arvo jätetään π:n kerrannaiseksi, esimerkiksi 16π cm². Likiarvo lasketaan laskimen π-näppäimellä, ja vain lopputulos pyöristetään.","Kun tilavuus pyydetään litroina, muunna: 1 l = 1 dm³ = 1 000 cm³, joten kuutiosenttimetrit jaetaan tuhannella."]},{"tyyppi":"kappale","otsikko":"Miksi kaavoihin voi luottaa","sisalto":"Kaavojen johtaminen vaatii lukion matematiikkaa, joten ne annetaan valmiina. Niiden järkevyyden voi silti tarkistaa. Ajattele pallon ympärille kuutio, jonka jokainen tahko koskettaa palloa. Kuution särmä on yhtä pitkä kuin pallon halkaisija eli 2r, joten kuution tilavuus on 2r · 2r · 2r = 8r³. Pallo mahtuu kuution sisään, joten sen tilavuuden täytyy olla pienempi kuin 8r³. Kaavan mukaan pallon tilavuus on 4/3 · π · r³ ≈ 4,19 · r³, mikä on hieman yli puolet kuution tilavuudesta, koska 4,19 : 8 ≈ 0,52. Tämä sopii siihen, mitä silmä näkee: kuution kulmiin jää paljon tyhjää, mutta pallo täyttää keskiosan. Pinta-alalle on oma tarkistus. Pallon pinta-ala on täsmälleen neljä isoympyrän alaa, koska 4πr² = 4 · πr². Jos kuorit appelsiinin ja piirrät paperille ympyröitä, joiden säde on appelsiinin säde, kuoren palat peittävät likimain neljä ympyrää. Kaavoista näkyvät myös yksiköt. Pinta-alan kaavassa säde on toisessa potenssissa, joten tulos on neliöyksiköissä, ja tilavuuden kaavassa kolmannessa, joten tulos on kuutioyksiköissä. Eksponentti ja yksikkö kulkevat yhdessä: r² ja cm², r³ ja cm³."},{"tyyppi":"taulukko","otsikko":"Pallo ja sen ympärille piirretty kuutio","otsikkorivi":["Säde","Pinta-ala 4πr²","Tilavuus 4/3 · πr³","Kuution tilavuus 8r³"],"rivit":[["1 cm","4π cm² ≈ 12,6 cm²","4π/3 cm³ ≈ 4,2 cm³","8 cm³"],["2 cm","16π cm² ≈ 50,3 cm²","32π/3 cm³ ≈ 33,5 cm³","64 cm³"],["3 cm","36π cm² ≈ 113,1 cm²","36π cm³ ≈ 113,1 cm³","216 cm³"],["10 cm","400π cm² ≈ 1 256,6 cm²","4 000π/3 cm³ ≈ 4 188,8 cm³","8 000 cm³"]]},{"tyyppi":"kappale","otsikko":"Säde ympärysmitasta, pinta-alasta tai tilavuudesta","sisalto":"Kun pallon ympärysmitta tunnetaan, ratkaise ensin säde samoin kuin 8. luokalla ympyrän kehästä: p = 2πr, joten r = p : (2π). Pallon, jonka ympärysmitta on 50,0 cm, säde on 50,0 cm : (2π) ≈ 7,958 cm. Pidä säde laskimessa tarkkana ja laske sitten tilavuus: V = 4/3 · π · r³ ≈ 2 111 cm³. Litroiksi muunnetaan jakamalla tuhannella, koska 1 l = 1 dm³ = 1 000 cm³ (1 dm = 10 cm ja 10 · 10 · 10 = 1 000). Pallon tilavuus on siis noin 2,1 l. Joskus tunnetaan pinta-ala tai tilavuus ja kysytään sädettä. Silloin kaava ratkaistaan säteen suhteen kuten taidossa Juuri ja potenssi: pinta-alasta r = √(A/(4π)) ja tilavuudesta r = ∛(3V/(4π)). Jos pallon pinta-ala on 64π cm², saadaan r² = 64π : (4π) = 16 ja r = 4 cm. Tarkka arvo voi olla myös juuri: pinta-alasta 40π cm² saadaan r² = 10 ja r = √10 cm ≈ 3,2 cm. Puolipallo syntyy, kun pallo puolitetaan isoympyrää pitkin, joten sen tilavuus on puolet pallon tilavuudesta: 1/2 · 4/3 · πr³ = 2/3 · πr³. Puolipallon muotoisen kulhon tilavuus lasketaan kulhon sisäsäteestä."},{"tyyppi":"ansa","otsikko":"Ansa 1: halkaisija säteen paikalla","sisalto":"Pallon halkaisija on 14 cm. Jos halkaisija sijoitetaan säteen paikalle, tilavuudeksi tulee 4/3 · π · 14³ cm³ ≈ 11 494 cm³. Oikea säde on 14 cm : 2 = 7 cm, ja tilavuus on 4/3 · π · 7³ cm³ ≈ 1 437 cm³. Väärä tulos on kahdeksankertainen, koska (2r)³ = 2r · 2r · 2r = 8r³. Pinta-ala nelinkertaistuu samasta syystä, koska (2r)² = 4r²: 4π · 14² cm² ≈ 2 463 cm², vaikka oikein on 4π · 7² cm² ≈ 616 cm². Sama virhe syntyy ympärysmitasta, jos säde lasketaan jakamalla pelkällä π:llä. Kun ympärysmitta on 44,0 cm, 44,0 cm : π ≈ 14,0 cm on halkaisija, koska p = πd. Säde on 44,0 cm : (2π) ≈ 7,0 cm. Kuutio paljastaa virheen: halkaisijaltaan 14 cm:n pallon ympärille piirretyn kuution tilavuus on 14 · 14 · 14 cm³ = 2 744 cm³, joten pallon tilavuus ei voi olla 11 494 cm³."},{"tyyppi":"ansa","otsikko":"Ansa 2: kaavat tai kerroin sekaisin","sisalto":"Pallon säde on 5 cm. Oikein A = 4π · 5² cm² = 100π cm² ≈ 314 cm² ja V = 4/3 · π · 5³ cm³ = 500π/3 cm³ ≈ 524 cm³. Kaavat menevät sekaisin, jos tilavuuteen kirjoitetaan r² tai pinta-alaan r³: 4/3 · π · 5² ≈ 105 ja 4π · 5³ ≈ 1 571. Toinen virhe on kerroin. Kerroin 4/3 kääntyy helposti muotoon 3/4, jolloin tilavuudeksi tulee 3/4 · π · 5³ cm³ ≈ 295 cm³, tai kerroin unohtuu kokonaan: π · 5³ cm³ ≈ 393 cm³. Kuutio auttaa tässäkin. Pallon ympärille piirretyn kuution särmä on 10 cm ja tilavuus 10 · 10 · 10 cm³ = 1 000 cm³, ja pallon tilavuuden pitää olla hieman yli puolet siitä. Oikea 524 cm³ on hieman yli puolet kuution tilavuudesta, mutta 105 cm³, 295 cm³ ja 393 cm³ ovat selvästi alle puolet. Kun säteen lukuarvo on lähellä yhtä (esimerkiksi 1 cm tai 1 m), luvut r² ja r³ ovat lähes samat, eikä arvio silloin erota niitä. Siksi kaava kannattaa tarkistaa myös yksiköstä: pinta-alassa on r² ja neliöyksikkö, tilavuudessa r³ ja kuutioyksikkö."},{"tyyppi":"ansa","otsikko":"Ansa 3: väärä yksikkö tai väärä muunto litroiksi","sisalto":"Pinta-ala on neliöyksiköissä ja tilavuus kuutioyksiköissä. Vastaus 64π cm³ pallon pinta-alaksi on väärin, vaikka luku olisi oikea. Kun säde on 3 cm, pinta-ala on 4π · 3² cm² = 36π cm² ja tilavuus 4/3 · π · 3³ cm³ = 4/3 · π · 27 cm³ = 36π cm³. Luvut ovat samat, mutta suureet eivät: toinen kertoo pinnan määrän ja toinen tilan määrän, eikä niitä voi verrata keskenään. Yksikkö kertoo, kumpi on kumpi. Litramuunnoksessa tyypillinen virhe on jakaa sadalla. Edellä laskettu tilavuus 2 111 cm³ ei ole 21,1 l, koska 1 l = 1 000 cm³. Oikein 2 111 cm³ = 2,111 l ≈ 2,1 l. Litra on kuutio, jonka särmä on 10 cm, ja 10 · 10 · 10 = 1 000. Mieti lopuksi, onko tulos järkevä: halkaisijaltaan noin 16 cm:n pallo on vähän käsipalloa pienempi, eikä siihen mahdu yli 20 litraa vettä."},{"tyyppi":"muistilappu","otsikko":"Muista nämä","kohdat":["Pallon pinnan pisteet ovat etäisyydellä r keskipisteestä. Halkaisija d = 2r.","Pinta-ala A = 4πr² neliöyksiköissä (cm², m²). Se on neljä isoympyrän alaa.","Tilavuus V = 4/3 · πr³ kuutioyksiköissä (cm³, m³).","Puolita halkaisija ennen sijoittamista.","Säde ympärysmitasta: r = p : (2π). Pelkällä π:llä jakaminen antaa halkaisijan.","Arvio: pallon tilavuus on hieman yli puolet ympärille piirretyn kuution tilavuudesta 8r³.","Puolipallon tilavuus on puolet pallon tilavuudesta.","1 l = 1 dm³ = 1 000 cm³. Kuutiosenttimetrit litroiksi jakamalla tuhannella."]}],"harjoitusryhmat":[{"id":"kaavat","nimi":"Kaavat ja tarkka arvo","info":"Laskin on sallittu. Pinta-ala A = 4πr² ja tilavuus V = 4/3 · πr³. Puolita halkaisija ennen sijoittamista. Tarkka arvo jätetään π:n kerrannaiseksi, ja kysymys pyytää π:n kertoimen k. Anna vastaus ilman yksikköä."},{"id":"likiarvo","nimi":"Likiarvot ja litrat","info":"Laskin on sallittu. Käytä π:n arvona laskimen π-näppäintä ja pyöristä vasta lopputulos pyydettyyn tarkkuuteen. Säde ympärysmitasta r = p : (2π). Litroiksi jaetaan tuhannella, koska 1 l = 1 000 cm³. Anna vastaus ilman yksikköä."},{"id":"sade","nimi":"Säde ja arvio","info":"Laskin on sallittu. Ratkaise säde pinta-alasta tai tilavuudesta ja tarkista tulos vertaamalla palloa sen ympärille piirrettyyn kuutioon. Anna vastaus ilman yksikköä."}],"harjoitukset":[{"id":"H01","ryhma":"kaavat","kysymys":"Pallon säde on 6 cm. Pallon pinta-ala on kπ cm². Mikä on k?","vastaus":144,"vinkki":"Pinta-ala A = 4πr². Laske ensin r².","selitys":"A = 4π · 6² cm² = 4π · 36 cm² = 144π cm², joten k = 144. Vastaus 864 syntyy, jos pinta-alaan kirjoitetaan r³, ja 288, jos käytetään tilavuuden kaavaa."},{"id":"H02","ryhma":"kaavat","kysymys":"Pallon säde on 6 cm. Pallon tilavuus on kπ cm³. Mikä on k?","vastaus":288,"vinkki":"Tilavuus V = 4/3 · πr³. Laske ensin r³ = 6 · 6 · 6.","selitys":"V = 4/3 · π · 6³ cm³ = 4/3 · π · 216 cm³ = 288π cm³, joten k = 288. Vastaus 48 syntyy, jos tilavuuteen kirjoitetaan r², ja 216, jos kerroin 4/3 unohtuu."},{"id":"H03","ryhma":"kaavat","kysymys":"Pallon halkaisija on 10 cm. Pallon pinta-ala on kπ cm². Mikä on k?","vastaus":100,"vinkki":"Puolita halkaisija ensin. Säde on 10 cm : 2.","selitys":"r = 10 cm : 2 = 5 cm, joten A = 4π · 5² cm² = 100π cm² ja k = 100. Vastaus 400 syntyy, jos halkaisija sijoitetaan säteen paikalle: pinta-ala nelinkertaistuu."},{"id":"H04","ryhma":"kaavat","kysymys":"Pallon halkaisija on 54 cm. Pallon tilavuus on kπ cm³. Mikä on k?","vastaus":26244,"vinkki":"Puolita halkaisija ja laske sitten 4/3 · r³.","selitys":"r = 54 cm : 2 = 27 cm. V = 4/3 · π · 27³ cm³ = 4/3 · π · 19 683 cm³ = 26 244π cm³, joten k = 26 244. Vastaus 209 952 on kahdeksankertainen: se syntyy, kun halkaisija sijoitetaan säteen paikalle."},{"id":"H05","ryhma":"kaavat","kysymys":"Pallon pinta-ala on 1 600π cm². Kuinka pitkä on pallon säde? Anna vastaus senttimetreinä ilman yksikköä.","vastaus":20,"vinkki":"Kirjoita 4πr² = 1 600π ja jaa molemmat puolet luvulla 4π.","selitys":"4πr² = 1 600π, joten r² = 1 600π : (4π) = 400 ja r = √400 = 20 cm. Negatiivinen ratkaisu −20 ei kelpaa pituudeksi. Vastaus 400 kertoo, että neliöjuuri unohtui."},{"id":"H06","ryhma":"kaavat","kysymys":"Pallon säde on 3 cm. Joku laskee sen pinta-alaksi 36π cm² ja tilavuudeksi 36π cm³.\n\nMikä väite pitää paikkansa?","vastaus":0,"vinkki":"Laske molemmat itse. Mitä yksiköt kertovat?","selitys":"4π · 3² = 36π ja 4/3 · π · 3³ = 4/3 · π · 27 = 36π, joten molemmat laskut ovat oikein. Luvut ovat samat vain tällä säteellä, mutta suureet ovat eri: pinta-ala on neliösenttimetrejä ja tilavuus kuutiosenttimetrejä, eikä niitä voi verrata keskenään.","tyyppi":"monivalinta","vaihtoehdot":["Molemmat laskut ovat oikein. Luvut ovat samat, mutta toinen on pinta-ala neliösenttimetreinä ja toinen tilavuus kuutiosenttimetreinä.","Pallon pinta-ala ja tilavuus ovat yhtä suuret.","Toinen laskuista on väärin, koska pinta-alalla ja tilavuudella ei voi olla samaa lukuarvoa."]},{"id":"H07","ryhma":"kaavat","kysymys":"Pallon isoympyrän ala on 30 cm². Kuinka suuri on pallon pinta-ala? Anna vastaus neliösenttimetreinä ilman yksikköä.","vastaus":120,"vinkki":"Pallon pinta-ala on 4πr² ja isoympyrän ala πr².","selitys":"Isoympyrän säde on pallon säde, joten isoympyrän ala on πr² = 30 cm². Pallon pinta-ala on 4πr² = 4 · 30 cm² = 120 cm²."},{"id":"H08","ryhma":"likiarvo","kysymys":"Pallon säde on 6,6 cm. Laske pallon tilavuus kokonaisina kuutiosenttimetreinä. Anna vastaus ilman yksikköä.","vastaus":1204.0,"vinkki":"V = 4/3 · π · 6,6³. Näppäile koko lauseke kerralla.","selitys":"V = 4/3 · π · 6,6³ cm³ = 4/3 · π · 287,496 cm³ ≈ 1 204 cm³. Ympärille piirretyn kuution tilavuus on 13,2³ cm³ ≈ 2 300 cm³, ja tulos on hieman yli puolet siitä."},{"id":"H09","ryhma":"likiarvo","kysymys":"Rantapallon halkaisija on 1,8 m. Laske pallon pinta-ala 0,1 m²:n tarkkuudella. Anna vastaus neliömetreinä ilman yksikköä.","vastaus":10.2,"vinkki":"Puolita halkaisija ensin. Pinta-ala A = 4πr².","selitys":"r = 1,8 m : 2 = 0,9 m. A = 4π · 0,9² m² = 4π · 0,81 m² ≈ 10,2 m². Vastaus 40,7 syntyy, jos halkaisija sijoitetaan säteen paikalle."},{"id":"H10","ryhma":"likiarvo","kysymys":"Pallon muotoisen kalamaljan sisäsäde on 14,0 cm. Montako litraa vettä maljaan mahtuu? Anna vastaus 0,1 l:n tarkkuudella ilman yksikköä.","vastaus":11.5,"vinkki":"Laske tilavuus kuutiosenttimetreinä ja muunna: 1 l = 1 000 cm³.","selitys":"V = 4/3 · π · 14,0³ cm³ ≈ 11 494 cm³ = 11,494 l ≈ 11,5 l. Vastaus 114,9 syntyy, jos kuutiosenttimetrit jaetaan sadalla."},{"id":"H11","ryhma":"likiarvo","kysymys":"Koripallon ympärysmitta on 75,0 cm. Laske pallon säde 0,1 cm:n tarkkuudella. Anna vastaus senttimetreinä ilman yksikköä.","vastaus":11.9,"vinkki":"Ympärysmitta on isoympyrän kehä: p = 2πr.","selitys":"2πr = 75,0 cm, joten r = 75,0 cm : (2π) ≈ 11,9 cm. Vastaus 23,9 syntyy, jos jaetaan pelkällä π:llä: se on halkaisija."},{"id":"H12","ryhma":"likiarvo","kysymys":"Pallon ympärysmitta on 84,0 cm. Laske pallon tilavuus litroina 0,1 l:n tarkkuudella. Anna vastaus ilman yksikköä.","vastaus":10.0,"vinkki":"Laske ensin säde r = p : (2π) ja pidä se laskimessa tarkkana.","selitys":"r = 84,0 cm : (2π) ≈ 13,369 cm. V = 4/3 · π · r³ ≈ 10 009 cm³ ≈ 10,0 l. Jos säde lasketaan jakamalla pelkällä π:llä, tilavuudeksi tulee kahdeksankertainen 80,1 l."},{"id":"H13","ryhma":"likiarvo","kysymys":"Puolipallon muotoisen kulhon sisäsäde on 17 cm. Montako litraa kulhoon mahtuu? Anna vastaus 0,1 l:n tarkkuudella ilman yksikköä.","vastaus":10.3,"vinkki":"Puolipallon tilavuus on puolet pallon tilavuudesta.","selitys":"Pallon tilavuus olisi 4/3 · π · 17³ cm³ ≈ 20 580 cm³, joten kulhon tilavuus on puolet siitä, noin 10 290 cm³ ≈ 10,3 l. Vastaus 20,6 on koko pallon tilavuus."},{"id":"H14","ryhma":"likiarvo","kysymys":"Tiia laski halkaisijaltaan 50 cm:n pallon tilavuudeksi noin 523 600 cm³.\n\nMikä päättely osoittaa ilman uutta laskua, että tulos on väärin?","vastaus":0,"vinkki":"Mieti, minkä kokoiseen laatikkoon pallo mahtuu.","selitys":"Pallo mahtuu kuution sisään, jonka särmä on pallon halkaisija 50 cm. Kuution tilavuus on 50 · 50 · 50 cm³ = 125 000 cm³, joten pallon tilavuus on alle 125 000 cm³, noin puolet siitä. Tiia käytti halkaisijaa säteenä. Pinta-alaa ja tilavuutta ei voi verrata keskenään, koska niillä on eri yksiköt, ja tilavuuden saa ilmoittaa kuutiosenttimetreinä.","tyyppi":"monivalinta","vaihtoehdot":["Pallo mahtuu kuution sisään, jonka särmä on 50 cm. Kuution tilavuus on 125 000 cm³, joten pallon tilavuus on alle 125 000 cm³.","Pallon tilavuuden pitää olla pienempi kuin sen pinta-ala, ja tulos on liian suuri siihen verrattuna.","Tulos on väärin, koska pallon tilavuus pitää ilmoittaa litroina eikä kuutiosenttimetreinä."]},{"id":"H15","ryhma":"sade","kysymys":"Pallon muotoisen säiliön tilavuus on 4,4 l. Laske säiliön säde 0,1 cm:n tarkkuudella. Anna vastaus senttimetreinä ilman yksikköä.","vastaus":10.2,"vinkki":"Muunna ensin litrat kuutiosenttimetreiksi. Säde r = ∛(3V/(4π)).","selitys":"4,4 l = 4 400 cm³. r = ∛(3 · 4 400/(4π)) cm = ∛1 050,42 cm ≈ 10,2 cm. Tarkistus: 4/3 · π · 10,2³ cm³ ≈ 4 445 cm³ ≈ 4,4 l."},{"id":"H16","ryhma":"sade","kysymys":"Pallon pinta-ala on 250 cm². Laske pallon säde 0,1 cm:n tarkkuudella. Anna vastaus senttimetreinä ilman yksikköä.","vastaus":4.5,"vinkki":"4πr² = 250. Jaa luvulla 4π ja ota neliöjuuri.","selitys":"r² = 250 : (4π) ≈ 19,894, joten r = √19,894 cm ≈ 4,5 cm. Vastaus 8,9 syntyy, jos neljällä jakaminen unohtuu, ja 19,9, jos neliöjuuri unohtuu."},{"id":"H17","ryhma":"sade","kysymys":"Pallon pinta-ala on 84π cm². Säteen tarkka arvo on √n cm. Mikä on n?","vastaus":21,"vinkki":"4πr² = 84π. Jaa molemmat puolet luvulla 4π.","selitys":"4πr² = 84π, joten r² = 84π : (4π) = 21 ja r = √21 cm ≈ 4,6 cm."},{"id":"H18","ryhma":"sade","kysymys":"Pallon tilavuus on 4,5π cm³. Laske pallon säde. Anna vastaus senttimetreinä ilman yksikköä.","vastaus":1.5,"vinkki":"Kirjoita 4/3 · πr³ = 4,5π, jaa π:llä ja kerro luvulla 3/4.","selitys":"4/3 · πr³ = 4,5π, joten r³ = 3/4 · 4,5 = 3,375 ja r = ∛3,375 = 1,5 cm, koska 1,5 · 1,5 · 1,5 = 3,375."},{"id":"H19","ryhma":"sade","kysymys":"Eemil laski halkaisijaltaan 38 cm:n pallon tilavuudeksi noin 229 800 cm³. Pallon ympärille piirretyn kuution tilavuus on 38 · 38 · 38 cm³ = 54 872 cm³, joten tulos ei voi olla oikein.\n\nLaske pallon oikea tilavuus 100 cm³:n tarkkuudella. Anna vastaus kuutiosenttimetreinä ilman yksikköä.","vastaus":28700.0,"vinkki":"Eemil käytti halkaisijaa säteenä. Puolita halkaisija.","selitys":"r = 38 cm : 2 = 19 cm. V = 4/3 · π · 19³ cm³ ≈ 28 731 cm³ ≈ 28 700 cm³. Tulos on hieman yli puolet kuution tilavuudesta 54 872 cm³, kuten pitääkin."},{"id":"H20","ryhma":"sade","kysymys":"Keittiössä tehdään 1,2 litrasta taikinaa pallon muotoisia lihapullia, joiden halkaisija on 4,0 cm. Montako kokonaista lihapullaa taikinasta saadaan? Vajaata lihapullaa ei lasketa. Anna vastaus ilman yksikköä.","vastaus":35,"vinkki":"Laske yhden lihapullan tilavuus kuutiosenttimetreinä ja jaa sillä 1 200 cm³.","selitys":"r = 2,0 cm, joten yhden lihapullan tilavuus on 4/3 · π · 2,0³ cm³ ≈ 33,51 cm³. 1 200 cm³ : 33,51 cm³ ≈ 35,81, joten kokonaisia lihapullia tulee 35. Vastaus 36 syntyy pyöristämällä ylöspäin, mutta viimeinen pulla jäisi vajaaksi."}],"valmis_teksti":"Osaat laskea pallon pinta-alan ja tilavuuden säteestä tai halkaisijasta, ratkaista säteen ympärysmitasta ja antaa tilavuuden litroina. Erotat pinta-alan ja tilavuuden kaavat ja yksiköt, puolitat halkaisijan ennen sijoittamista ja arvioit tuloksen suuruusluokan pallon ympärille piirretyn kuution avulla. Tämä taito on nyt näytetty."};

const esc = s => s;
const osat = D.teksti.map(o=>{

    case "johdanto":
      return `<p class="lead">${esc(o.sisalto)}</p>`;

      return `<div class="box"><h3>${esc(o.otsikko)}</h3><ol class="steps">${

      return `<div class="box"><h3>${esc(o.otsikko)}</h3><div class="tablewrap"><table><thead><tr>${

      return `<div class="box warn"><h3>${esc(o.otsikko)}</h3><p style="margin:0">${esc(o.sisalto)}</p></div>`;

    case "numerotaulu":

/* ---------- lukusuora ---------- */
const svg=document.getElementById("nlsvg"), rng=document.getElementById("nlrange"), out=document.getElementById("nlout");
const X0=34, X1=606, Y=62;
function piirraNL(v){
  const ala=Math.floor(v/10)*10, yla=ala+10, puoli=ala+5;
  const pyor = (v%10)>=5 ? yla : ala;
  const x = n => X0 + (n/100)*(X1-X0);
  let s=`<line class="rail" x1="${X0}" y1="${Y}" x2="${X1}" y2="${Y}"/>`;
  for(let n=0;n<=100;n+=10){
    const near = (n===ala||n===yla);
    s+=`<line class="tick" x1="${x(n)}" y1="${Y-7}" x2="${x(n)}" y2="${Y+7}"/>`;
    s+=`<text class="stop${near?" near":""}" x="${x(n)}" y="${Y+24}" text-anchor="middle">${n}</text>`;
  }
  s+=`<line class="halfway" x1="${x(puoli)}" y1="${Y-16}" x2="${x(puoli)}" y2="${Y+12}"/>`;
  s+=`<text class="stop" x="${x(puoli)}" y="${Y-22}" text-anchor="middle">puoliväli ${puoli}</text>`;
  s+=`<circle class="dot" cx="${x(v)}" cy="${Y}" r="6"/>`;
  s+=`<text class="val" x="${x(v)}" y="${Y-32}" text-anchor="middle">${v}</text>`;
  s+=`<path d="M ${x(v)} ${Y+38} L ${x(pyor)} ${Y+38}" stroke="var(--core)" stroke-width="2" fill="none"/>`;
  s+=`<path d="M ${x(pyor)} ${Y+38} l ${x(pyor)>x(v)?-7:7} -4 l 0 8 z" fill="var(--core)"/>`;
  svg.innerHTML=s;
  out.textContent = `${v} pyöristyy → ${pyor}`;
}

/* ---------- laskujärjestys-widget ---------- */
const ljExp=document.getElementById("ljExp");
if(ljExp && D.kokeilu){
  let ljI=0, ljTokens=[], ljStep=0;
  const laske=(a,op,b)=>{a=+a;b=+b;return op==="×"?a*b:op==="÷"?a/b:op==="+"?a+b:a-b;};
  function ljAlku(){
    const l=D.kokeilu[ljI];
    ljTokens=l.lauseke.replace(/\(/g,"( ").replace(/\)/g," )").split(/\s+/).filter(Boolean);
    ljStep=0; ljPiirra(); ljViesti("","");
  }
  function ljViesti(t,lk){const f=document.getElementById("ljFb"); f.textContent=t; f.className="lj-fb "+(lk||"");}
  function ljPiirra(){
    const l=D.kokeilu[ljI];
    document.getElementById("ljStep").textContent =
      ljStep>=l.askeleet.length ? "valmis" : `askel ${ljStep+1} / ${l.askeleet.length}`;
    if(ljStep>=l.askeleet.length){
      ljExp.innerHTML=`<span class="valmis">${l.lauseke} = ${l.vastaus}</span>`;
      return;
    }
    ljExp.innerHTML=ljTokens.map((t,i)=>
      "×÷+−".includes(t) ? `<button type="button" class="op" data-i="${i}">${t}</button>`
                         : `<span class="tok">${t}</span>`).join("");
    ljExp.querySelectorAll("button.op").forEach(b=>b.addEventListener("click",()=>ljKlikkaa(+b.dataset.i)));
  }
  function ljKlikkaa(i){
    const l=D.kokeilu[ljI], odotettu=l.askeleet[ljStep];
    const ehdotus=[ljTokens[i-1],ljTokens[i],ljTokens[i+1]].join(" ");
    if(ehdotus!==odotettu){
      ljViesti(ljStep===0
        ? "Ei vielä. Sulkeet ovat vahvimmat, sitten kerto ja jako. Yhtä vahvat vasemmalta oikealle."
        : "Ei vielä. Kumpi jäljellä olevista on vahvempi?", "no");
      return;
    }
    const arvo=laske(ljTokens[i-1],ljTokens[i],ljTokens[i+1]);
    let alku=i-1, loppu=i+1;
    if(ljTokens[i-2]==="(" && ljTokens[i+2]===")"){ alku=i-2; loppu=i+2; }
    ljTokens.splice(alku, loppu-alku+1, String(arvo));
    ljStep++;
    ljViesti(ljStep>=l.askeleet.length ? "Valmis. Vastaus on "+l.vastaus+"." : "Oikein. Jatka seuraavaan.", "ok");
    ljPiirra();
  }
  document.getElementById("ljSeuraava").addEventListener("click",()=>{
    ljI=(ljI+1)%D.kokeilu.length; ljAlku();
  });
  ljAlku();
}

   Kaksi vastaustyyppiä: "numero" (oletus, tekstikenttä + Number()-vertailu) ja

   erotettuna tyhjällä rivillä. Viimeinen osa on kysymys, sitä edeltävät aineistoa. */
const kysymysHtml = t => {
  const osat = String(t).split(/\n\s*\n/).map(x=>x.trim()).filter(Boolean);
  if(osat.length < 2) return osat[0] || "";
  const kysymys = osat.pop();
  return osat.map(p=>`<span class="aineisto">${p}</span>`).join("")
       + `<span class="kysymysrivi">${kysymys}</span>`;
};

/* Suomalainen lukumuoto: välilyönti on tuhaterotin, pilkku desimaalierotin.
   Piste voi olla kumpi tahansa. Se tulkitaan tuhaterottimeksi VAIN silloin, kun
   koko luku on aitoa tuhaterotinmuotoa: alkuosa 1–3 numeroa ilman etunollaa ja
   jokainen jatko-osa täsmälleen 3 numeroa (1.500, 12.345.678). Kaikissa muissa
   tapauksissa piste on desimaalipiste — myös 0.125, joka vanhalla säännöllä
   ("3 numeroa pisteen jäljessä = tuhaterotin") luettiin virheellisesti luvuksi 125. */
const TUHATEROTIN = /^[1-9]\d{0,2}(\.\d{3})+$/;
function lueLuku(teksti){
  // Murtoluku (3/4, -3/4) ja sekaluku (1 2/3, -1 2/3) hyväksytään sellaisinaan.
  const raaka = String(teksti).replace(/\u00a0/g, " ").trim();
  let m = raaka.match(/^(-?)(\d+)\s+(\d+)\s*\/\s*(\d+)$/);
  if(m){ const nim = Number(m[4]); if(nim === 0) return null;
    const v = Number(m[2]) + Number(m[3]) / nim; return m[1] ? -v : v; }
  m = raaka.match(/^(-?)\s*(\d+)\s*\/\s*(\d+)$/);
  if(m){ const nim = Number(m[3]); if(nim === 0) return null;
    const v = Number(m[2]) / nim; return m[1] ? -v : v; }
  let s = String(teksti).replace(/[\s\u00a0]/g, "");
  if(s === "") return null;
  if(s.indexOf(",") >= 0){
    s = s.replace(/\./g, "").replace(",", ".");
  } else if(TUHATEROTIN.test(s)){
    s = s.replace(/\./g, "");
  }
  const n = Number(s);
  return Number.isFinite(n) ? n : null;
}

function tarkista(id){
  const h=D.harjoitukset.find(x=>x.id===id);
  const kentta=document.getElementById("in-"+id);
  const fb=document.getElementById("fb-"+id);
  if(kentta.value.trim()===""){ fb.className="fb hint"; fb.textContent="Kirjoita vastaus ensin."; return; }
  const luku=lueLuku(kentta.value);
  if(luku===null){ fb.className="fb no"; fb.textContent="Vastauksen pitää olla luku tai murtoluku (esimerkiksi 3/4)."; return; }
  const oikein = Math.abs(luku - h.vastaus) < 1e-9;
  merkitseTulos(id, oikein, oikein ? "Oikein. "+h.selitys : `Ei vielä. ${h.vinkki} Kokeile uudelleen.`);
}

function tarkistaMonivalinta(id, valittuIndeksi, painike){
  const h=D.harjoitukset.find(x=>x.id===id);
  const rivi=painike.closest(".row");
  rivi.querySelectorAll(".mv-valinta").forEach(b=>b.disabled=true);
  const oikein = valittuIndeksi===h.vastaus;
  painike.classList.add(oikein?"mv-oikein":"mv-vaarin");
  if(!oikein){
    const oikeaBtn=rivi.querySelector(`[data-i="${h.vastaus}"]`);
    if(oikeaBtn) oikeaBtn.classList.add("mv-oikein");
  }
  merkitseTulos(id, oikein, oikein ? "Oikein. "+h.selitys : `Ei ihan. Oikea vastaus on korostettu. ${h.selitys||""}`);
}

/* Kuuntelu: selain lukee tekstin ääneen omalla puhesynteesillään (englanniksi, jos laitteessa on
   englanninkielinen ääni). Ei äänitiedostoja eikä verkkoyhteyttä. Jos laite ei osaa puhua,
   teksti näytetään luettavaksi — silloin tehtävä muuttuu luetun ymmärtämiseksi, mutta ei katkea. */
function puhu(id, nopeus){
  const h=D.harjoitukset.find(x=>x.id===id); if(!h || !h.kuuntele) return;
  const vara=document.getElementById("vara-"+id);
  const naytaTeksti=syy=>{ vara.hidden=false; vara.textContent=syy+" Teksti: "+h.kuuntele; };
  if(!("speechSynthesis" in window)){ naytaTeksti("Tämä laite ei osaa lukea ääneen."); return; }
  const s=window.speechSynthesis; s.cancel();
  const u=new SpeechSynthesisUtterance(h.kuuntele);
  u.lang=h.kieli||"en-GB"; u.rate=nopeus;
  const aanet=s.getVoices(), kieli=u.lang.slice(0,2);
  const aani=aanet.find(a=>a.lang===u.lang) || aanet.find(a=>a.lang && a.lang.startsWith(kieli));
  if(aani) u.voice=aani;
  else if(aanet.length) { naytaTeksti("Laitteessa ei ole englanninkielistä ääntä."); return; }
  u.onerror=()=>naytaTeksti("Ääneen lukeminen ei onnistunut.");
  s.speak(u);
}
