<title>Suorien kohtaaminen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">

<style>
:root{
  --paper:#EFF2F5; --surface:#FFFFFF; --surface-2:#F7F9FB;
  --grid:#DCE3EA; --line:#C9D3DC;
  --ink:#15222C; --ink-2:#4E626F; --ink-3:#7E8F9B;
  --core:#1B5A9E; --core-soft:#E4EDF6;
  --strong:#1F6E5C; --strong-soft:#E1F0EB;
  --chal:#9A6A16; --chal-soft:#F6EDDC;
  --alert:#A33A2B; --alert-soft:#F8E7E3;
  --shadow:0 1px 2px rgba(21,34,44,.06), 0 8px 24px -12px rgba(21,34,44,.18);
  --r:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0F161B; --surface:#18222A; --surface-2:#1D2830;
    --grid:#22303A; --line:#2E3E4A;
    --ink:#E8EFF4; --ink-2:#A3B4C0; --ink-3:#7A8B97;
    --core:#7FB2E4; --core-soft:#16303F;
    --strong:#77CDB4; --strong-soft:#123028;
    --chal:#E0B267; --chal-soft:#33270F;
    --alert:#E8907F; --alert-soft:#3A1E19;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -14px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --paper:#0F161B; --surface:#18222A; --surface-2:#1D2830;
  --grid:#22303A; --line:#2E3E4A;
  --ink:#E8EFF4; --ink-2:#A3B4C0; --ink-3:#7A8B97;
  --core:#7FB2E4; --core-soft:#16303F;
  --strong:#77CDB4; --strong-soft:#123028;
  --chal:#E0B267; --chal-soft:#33270F;
  --alert:#E8907F; --alert-soft:#3A1E19;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -14px rgba(0,0,0,.7);
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:16px; line-height:1.62;
  background-image:
    linear-gradient(to right, var(--grid) 1px, transparent 1px),
    linear-gradient(to bottom, var(--grid) 1px, transparent 1px);
  background-size:26px 26px;
}
.wrap{max-width:760px; margin:0 auto; padding:28px 20px 90px}
h1,h2,h3,h4{font-family:"Familjen Grotesk","IBM Plex Sans",system-ui,sans-serif; text-wrap:balance}

/* header */
header.top{background:var(--surface); border:1px solid var(--line); border-radius:var(--r);
  box-shadow:var(--shadow); padding:22px 24px; display:flex; gap:18px; align-items:flex-start}
.badge{flex:0 0 auto; width:54px; height:54px; border-radius:9px; display:grid; place-items:center;
  background:var(--core-soft); border:1px solid var(--core); color:var(--core)}
.badge svg{width:28px; height:28px; fill:none; stroke:currentColor; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round}
.eyebrow{font-family:"IBM Plex Mono",monospace; font-size:11px; letter-spacing:.14em;
  text-transform:uppercase; color:var(--ink-3); margin:0 0 5px}
header.top h1{margin:0; font-size:30px; font-weight:700; letter-spacing:-.015em}
header.top p{margin:5px 0 0; color:var(--ink-2); font-size:15px}
.tags{display:flex; flex-wrap:wrap; gap:5px; margin-top:11px}
.tag{font-family:"IBM Plex Mono",monospace; font-size:10.5px; letter-spacing:.05em; padding:2px 7px;
  border-radius:4px; background:var(--surface-2); border:1px solid var(--line); color:var(--ink-3)}
.tag.core{background:var(--core-soft); border-color:var(--core); color:var(--core)}

/* teksti */
article{margin-top:26px}
article h2{font-size:21px; font-weight:600; margin:32px 0 10px; letter-spacing:-.01em}
article p{margin:0 0 14px; max-width:64ch}
.lead{font-size:17.5px; color:var(--ink); border-left:3px solid var(--core); padding-left:16px; margin:0 0 8px}

.box{background:var(--surface); border:1px solid var(--line); border-radius:var(--r);
  padding:18px 22px; box-shadow:var(--shadow); margin:22px 0}
.box h3{margin:0 0 12px; font-size:16.5px; font-weight:600}
.box.warn{border-left:3px solid var(--alert)}
.box.note{border-left:3px solid var(--chal)}

ol.steps{margin:0; padding-left:0; list-style:none; counter-reset:s; display:grid; gap:12px}
ol.steps li{counter-increment:s; display:grid; grid-template-columns:auto 1fr; gap:13px; align-items:start}
ol.steps li::before{content:counter(s); font-family:"Familjen Grotesk",sans-serif; font-weight:700; font-size:14px;
  width:26px; height:26px; border-radius:50%; background:var(--core); color:#fff; display:grid; place-items:center; margin-top:2px}

ul.notes{margin:0; padding-left:19px}
ul.notes li{margin-bottom:7px}
ul.notes li:last-child{margin-bottom:0}

.tablewrap{overflow-x:auto}
table{border-collapse:collapse; width:100%; font-size:14.5px; min-width:460px}
th,td{text-align:left; padding:9px 13px; border-bottom:1px solid var(--line)}
th{font-family:"IBM Plex Mono",monospace; font-size:10.5px; letter-spacing:.1em; text-transform:uppercase;
  color:var(--ink-3); font-weight:400; background:var(--surface-2)}
tr:last-child td{border-bottom:0}
td b{color:var(--core); font-weight:600}
td:last-child{font-variant-numeric:tabular-nums; font-weight:600}

/* lukusuora */
.nl svg{width:100%; height:118px; display:block}
.nl .rail{stroke:var(--line); stroke-width:2}
.nl .tick{stroke:var(--line); stroke-width:1.5}
.nl .stop{fill:var(--ink-3); font-family:"IBM Plex Mono",monospace; font-size:11px}
.nl .stop.near{fill:var(--core); font-weight:600}
.nl .dot{fill:var(--chal)}
.nl .val{fill:var(--ink); font-family:"Familjen Grotesk",sans-serif; font-size:15px; font-weight:700}
.nl .halfway{stroke:var(--chal); stroke-dasharray:3 3; stroke-width:1.5}
.nl-controls{display:flex; align-items:center; gap:14px; margin-top:6px}
.nl-controls input{flex:1; accent-color:var(--core)}
.nl-out{font-family:"Familjen Grotesk",sans-serif; font-size:15px; font-weight:600; min-width:12.5em; text-align:right}

/* paikka-arvotaulu */
.box .ohje{margin:0 0 14px; font-size:14.5px; color:var(--ink-2)}
.nt-valinta{display:flex; flex-wrap:wrap; gap:7px; margin-bottom:16px}
.nt-valinta button{font:inherit; font-size:12.5px; font-family:"IBM Plex Mono",monospace; padding:5px 11px;
  border-radius:6px; border:1px solid var(--line); background:var(--surface-2); color:var(--ink-2); cursor:pointer}
.nt-valinta button[aria-pressed="true"]{background:var(--ink); color:var(--paper); border-color:var(--ink)}
.nt-valinta button:focus-visible{outline:2px solid var(--core); outline-offset:2px}
.nt-taulu{display:flex; flex-direction:column; gap:4px; align-items:flex-start; overflow-x:auto; padding-bottom:4px}
.nt-rivi{display:flex; gap:6px; align-items:center}
.nt-rivi .otsa{font-family:"IBM Plex Mono",monospace; font-size:9.5px; letter-spacing:.08em;
  text-transform:uppercase; color:var(--ink-3); width:52px; text-align:center}
.nt-ruutu{width:52px; height:52px; display:grid; place-items:center; border:1.5px solid var(--line);
  border-radius:7px; background:var(--surface-2); font-family:"IBM Plex Mono",monospace; font-size:24px}
.nt-ruutu.kohta{border-color:var(--core); background:var(--core-soft); color:var(--core); font-weight:500}
.nt-ruutu.ratkaiseva{border-color:var(--chal); background:var(--chal-soft); color:var(--chal); font-weight:500}
.nt-ruutu.nolla{color:var(--ink-3)}
.nt-rivi .nimi{font-size:12.5px; color:var(--ink-3); margin-left:12px; white-space:nowrap}
.nt-nuoli{font-size:17px; color:var(--chal); margin-left:6px}
.nt-selite{margin:14px 0 0; font-size:14.5px}
.nt-selite b{color:var(--core)}

/* vahvuusportaat */
.vp-tasot{display:grid; gap:9px; margin-bottom:18px}
.vp-taso{display:flex; gap:11px; align-items:flex-start; font-size:13.5px}
.vp-taso .vp-pallo{width:13px; height:13px; border-radius:4px; margin-top:5px; flex:0 0 auto}
.vp-taso[data-taso="sulkeet"] .vp-pallo{background:var(--core)}
.vp-taso[data-taso="kertojako"] .vp-pallo{background:var(--strong)}
.vp-taso[data-taso="yhteenvahennys"] .vp-pallo{background:var(--chal)}
.vp-taso strong{display:block; font-family:"Familjen Grotesk",sans-serif; font-weight:600; font-size:14.5px}
.vp-taso span{color:var(--ink-2)}
.vp-lauseke{display:flex; flex-wrap:wrap; gap:7px; align-items:flex-end; font-family:"IBM Plex Mono",monospace;
  font-size:25px; padding:10px 2px; min-height:64px}
.vp-lauseke .t{padding:2px 3px}
.vp-lauseke .op{position:relative; padding:2px 9px; border-radius:6px; font-weight:500}
.vp-lauseke .op[data-taso="sulkeet"]{background:var(--core-soft); color:var(--core)}
.vp-lauseke .op[data-taso="kertojako"]{background:var(--strong-soft); color:var(--strong)}
.vp-lauseke .op[data-taso="yhteenvahennys"]{background:var(--chal-soft); color:var(--chal)}
.vp-lauseke .op i{position:absolute; top:-9px; right:-6px; font-style:normal; font-family:"Familjen Grotesk",sans-serif;
  font-size:11px; font-weight:700; width:18px; height:18px; border-radius:50%; display:grid; place-items:center;
  background:currentColor}
.vp-lauseke .op i span{color:var(--surface)}
.vp-rivi{display:flex; align-items:center; gap:16px; margin-top:8px}
.vp-vastaus{font-family:"Familjen Grotesk",sans-serif; font-size:16px; font-weight:600; color:var(--strong)}

/* laskujärjestys-widget */
.lj-exp{display:flex; flex-wrap:wrap; gap:7px; align-items:center; font-family:"IBM Plex Mono",monospace;
  font-size:23px; padding:14px 4px; min-height:62px}
.lj-exp .tok{padding:2px 4px; color:var(--ink)}
.lj-exp button.op{font-family:"IBM Plex Mono",monospace; font-size:23px; padding:3px 12px; border-radius:7px;
  border:1.5px solid var(--line); background:var(--surface-2); color:var(--ink); line-height:1.2}
.lj-exp button.op:hover{border-color:var(--core); color:var(--core)}
.lj-exp button.op:focus-visible{outline:2px solid var(--core); outline-offset:2px}
.lj-exp .valmis{font-family:"Familjen Grotesk",sans-serif; font-size:23px; font-weight:700; color:var(--strong)}
.lj-fb{font-size:14.5px; min-height:1.5em; color:var(--ink-2)}
.lj-fb.no{color:var(--alert)}
.lj-fb.ok{color:var(--strong)}
.lj-row{display:flex; align-items:center; gap:14px; margin-top:10px}
.lj-step{font-family:"IBM Plex Mono",monospace; font-size:11.5px; letter-spacing:.1em;
  text-transform:uppercase; color:var(--ink-3)}

/* harjoitukset */
.progress{position:sticky; top:0; z-index:5; background:var(--surface); border:1px solid var(--line);
  border-radius:var(--r); padding:12px 18px; box-shadow:var(--shadow); display:flex; align-items:center;
  gap:14px; margin:34px 0 18px}
.progress .lbl{font-family:"IBM Plex Mono",monospace; font-size:11px; letter-spacing:.12em;
  text-transform:uppercase; color:var(--ink-3); white-space:nowrap}
.progress .meter{flex:1; height:7px; border-radius:4px; background:var(--surface-2); border:1px solid var(--line); overflow:hidden}
.progress .meter i{display:block; height:100%; background:var(--core); transition:width .25s ease}
.progress .cnt{font-family:"Familjen Grotesk",sans-serif; font-weight:700; font-variant-numeric:tabular-nums; white-space:nowrap}

.grp{margin-top:26px}
.grp-head{display:flex; align-items:baseline; gap:10px; border-bottom:1.5px solid var(--ink); padding-bottom:7px; margin-bottom:14px}
.grp-head h3{margin:0; font-size:17px; font-weight:600}
.grp-head span{font-size:12.5px; color:var(--ink-2)}

.ex{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:14px 16px; margin-bottom:10px}
.ex[data-tila="oikein"]{border-color:var(--strong); box-shadow:inset 3px 0 0 var(--strong)}
.ex[data-tila="vaarin"]{border-color:var(--alert); box-shadow:inset 3px 0 0 var(--alert)}
.ex .q{display:flex; gap:11px; align-items:baseline; flex-wrap:wrap}
.ex .num{font-family:"IBM Plex Mono",monospace; font-size:11.5px; color:var(--ink-3); min-width:2.4em}
.ex .txt{flex:1; min-width:190px; font-size:15.5px}
.ex .txt .aineisto{display:block; margin-bottom:9px; padding-left:12px;
  border-left:2px solid var(--line); color:var(--ink-2); line-height:1.6;
  /* Aineisto voi olla pieni taulukko, jonka rivit on erotettu rivinvaihdoilla.
     Ilman pre-lineä ne valuisivat yhdeksi kappaleeksi ja taulukko katoaisi. */
  white-space:pre-line}
.ex .txt .kysymysrivi{display:block; font-weight:600}
.ex .row{display:flex; gap:8px; align-items:center; margin-top:11px; flex-wrap:wrap}
.ex input[type=text]{font:inherit; font-family:"IBM Plex Mono",monospace; font-size:15px; width:8.5em;
  padding:7px 11px; border:1px solid var(--line); border-radius:7px; background:var(--surface-2);
  color:var(--ink); text-align:right}
.ex input:focus-visible{outline:2px solid var(--core); outline-offset:1px}
button{font:inherit; cursor:pointer}
.btn{font-size:13.5px; padding:7px 15px; border-radius:7px; border:1px solid var(--core);
  background:var(--core); color:#fff}
.btn.ghost{background:transparent; color:var(--ink-2); border-color:var(--line)}
.btn:focus-visible{outline:2px solid var(--core); outline-offset:2px}
.btn.mv-valinta{text-align:left}
/* kuuntelutehtävä: selaimen puhesynteesi lukee englanninkielisen tekstin */
.kuuntele{display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin:2px 0 10px}
.kuuntele .btn{display:inline-flex; gap:7px; align-items:center}
.kuuntele svg{width:16px; height:16px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round}
.kuuntele .varateksti{flex-basis:100%; font-size:14px; color:var(--ink-2); background:var(--surface-2);
  border-radius:7px; padding:8px 12px; margin:0}
.btn.mv-valinta:disabled{cursor:default; opacity:.65}
.btn.mv-oikein{background:var(--strong-soft); border-color:var(--strong); color:var(--strong); opacity:1}
.btn.mv-vaarin{background:var(--alert-soft); border-color:var(--alert); color:var(--alert); opacity:1}
.row.mv{gap:8px 10px}
.fb{margin-top:11px; font-size:14.5px; padding:10px 13px; border-radius:8px; line-height:1.5}
.fb.ok{background:var(--strong-soft); color:var(--strong)}
.fb.no{background:var(--alert-soft); color:var(--alert)}
.fb.hint{background:var(--chal-soft); color:var(--chal)}

.done{background:var(--strong-soft); border:1px solid var(--strong); color:var(--strong);
  border-radius:var(--r); padding:16px 20px; margin-top:20px; font-size:15.5px}
.done h3{margin:0 0 4px; font-size:17px; color:var(--strong)}

details.teacher{margin-top:34px; background:var(--surface); border:1px solid var(--line);
  border-left:3px solid var(--chal); border-radius:var(--r); padding:15px 20px; box-shadow:var(--shadow)}
details.teacher summary{cursor:pointer; font-family:"Familjen Grotesk",sans-serif; font-weight:600; font-size:15px}
details.teacher summary:focus-visible{outline:2px solid var(--core); outline-offset:3px}
details.teacher ul{margin:12px 0 0; padding-left:19px; color:var(--ink-2); font-size:14.5px}
details.teacher li{margin-bottom:8px}
details.teacher p{margin:12px 0 0; color:var(--ink-2); font-size:14.5px}

.back{display:inline-block; margin-top:30px; font-size:13.5px; color:var(--ink-2)}
.back a{color:var(--core)}

@media (prefers-reduced-motion: reduce){*{transition:none !important}}
@media (max-width:560px){
  .wrap{padding:16px 13px 70px}
  header.top h1{font-size:25px}
  .progress{flex-wrap:wrap}
}
</style>

<div class="wrap">

  <header class="top">
    <span class="badge"><svg viewBox="0 0 24 24" aria-hidden="true" id="ikoni"></svg></span>
    <div>
      <p class="eyebrow" id="eyebrow"></p>
      <h1 id="otsikko"></h1>
      <p id="kuvaus"></p>
      <div class="tags" id="tags"></div>
    </div>
  </header>

  <article id="teksti"></article>

  <div class="progress" aria-live="polite">
    <span class="lbl">Harjoitukset</span>
    <span class="meter"><i id="pbar" style="width:0%"></i></span>
    <span class="cnt" id="pcnt">0 / 20</span>
  </div>

  <div id="harjoitukset"></div>
  <div id="valmis"></div>

  <p class="back" id="back"></p>

</div>

<script>
const D = {"tavoite_id":"MAT9-YHT-05","oppiaine":"MAT","vuosiluokka":9,"otsikko":"Suorien kohtaaminen","kuvaus":"Osaan ratkaista yhtälöparin graafisesti ja selittää, mitä ratkaisu tarkoittaa koordinaatistossa.","versio":"0.2","paivitetty":"2026-10-11","ops":{"T":["T3","T14","T15"],"S":["S3","S4"]},"taso":"ydin","ikoni":"kartta","eyebrow":"Matematiikka · 9. luokka · Yhtälöt ja epäyhtälöt","teksti":[{"tyyppi":"johdanto","sisalto":"Kaksi sähköpotkulautayhtiötä hinnoittelee eri tavalla. Yhtiö A ottaa 1 euron aloitusmaksun ja 20 senttiä minuutilta. Yhtiö B ei ota aloitusmaksua, mutta minuutti maksaa 30 senttiä. Kun ajat x minuuttia, matka maksaa yhtiöllä A y = 0,2x + 1 euroa ja yhtiöllä B y = 0,3x euroa. Kun piirrät molemmat suorat samaan koordinaatistoon, ne kohtaavat pisteessä (10, 3): kymmenen minuutin matka maksaa kummallakin 3 euroa. Lyhyemmällä matkalla B on halvempi ja pidemmällä A. Leikkauspiste on ainoa kohta, jossa hinnat ovat yhtä suuret, koska se on ainoa piste, joka on kummallakin suoralla. Tässä taidossa opit ratkaisemaan tällaisen yhtälöparin piirtämällä, tarkistamaan ratkaisun sijoittamalla ja päättelemään kulmakertoimista ja vakiotermeistä, onko ratkaisuja yksi, ei yhtään vai äärettömän monta."},{"tyyppi":"kappale","otsikko":"Yhtälöpari ja sen ratkaisu","sisalto":"Kaksi yhtälöä, joiden pitää olla voimassa yhtä aikaa, muodostaa yhtälöparin. Yhtälöpari y = x + 3 ja y = −x + 5 kysyy, millä x:n ja y:n arvoilla molemmat yhtälöt toteutuvat. Ratkaisu on lukupari x = 1, y = 4, koska 1 + 3 = 4 ja −1 + 5 = 4. Miksi ratkaisun löytää piirtämällä? Suoran y = x + 3 pisteet ovat täsmälleen ne pisteet, joiden koordinaatit toteuttavat yhtälön y = x + 3, ja samoin toisen suoran pisteet toteuttavat toisen yhtälön. Piste, joka on kummallakin suoralla, toteuttaa siis molemmat yhtälöt, ja se on yhtälöparin ratkaisu. Piste, joka puuttuu toiselta suoralta, ei kelpaa. Esimerkiksi (2, 5) on suoralla y = x + 3, koska 2 + 3 = 5, mutta toinen yhtälö antaa −2 + 5 = 3 eikä 5, joten (2, 5) ei ole ratkaisu. Ratkaisu kirjoitetaan muodossa x = 1, y = 4 tai pisteenä (1, 4), jossa x on aina ensin. Yhtälöpari voi olla myös y = 4x − 8 ja y = 0. Suora y = 0 on x-akseli, joten ratkaisu on suoran ja x-akselin leikkauspiste (2, 0), ja sen x-koordinaatti 2 on funktion nollakohta. Piirtämällä luettu ratkaisu on likiarvo, koska viiva on leveä ja lukema on arvio. Sijoittaminen kertoo, osuiko lukema tarkalleen."},{"tyyppi":"saanto","otsikko":"Näin ratkaiset yhtälöparin piirtämällä","askeleet":["Kirjoita kumpikin yhtälö muotoon y = kx + b, jos se ei jo ole siinä. Ratkaise y kuten kaavasta: siirrä x-termi toiselle puolelle ja jaa koko puoli y:n kertoimella, jokainen termi.","Piirrä ensimmäinen suora. Merkitse y-akselille piste (0, b) ja etene siitä kulmakertoimen verran ylös tai alas jokaista x:n askelta kohden. Merkitse vielä kolmas piste tarkistukseksi ja vedä suora viivaimella.","Jos yhtälö on muotoa ax + by = c, voit myös sijoittaa x = 0 ja y = 0. Saat suoran ja akselien leikkauspisteet, joiden kautta suora piirretään.","Piirrä toinen suora samaan koordinaatistoon ja kirjoita kummankin suoran viereen sen yhtälö.","Etsi suorien leikkauspiste ja lue sen koordinaatit: ensin x vaaka-akselilta, sitten y pystyakselilta.","Kirjoita ratkaisu muodossa x = …, y = ….","Tarkista sijoittamalla x ja y kumpaankin alkuperäiseen yhtälöön. Jos molemmat toteutuvat, ratkaisu on tarkka. Jos jompikumpi ei toteudu, lukema on väärin tai leikkauspiste ei ole ruudukon pisteessä."]},{"tyyppi":"taulukko","otsikko":"Esimerkki: yhtälöpari y = x + 1 ja 6x + 2y = 18","otsikkorivi":["Vaihe","y = x + 1","6x + 2y = 18"],"rivit":[["Muoto y = kx + b","valmiina: k = 1, b = 1","2y = −6x + 18, joten y = −3x + 9: k = −3, b = 9"],["Pisteet suoralta","(0, 1), (1, 2), (3, 4)","(0, 9), (1, 6), (3, 0)"],["Leikkauspiste kuvasta","(2, 3)","(2, 3)"],["Tarkistus","2 + 1 = 3, toteutuu","6 · 2 + 2 · 3 = 12 + 6 = 18, toteutuu"],["Ratkaisu","x = 2, y = 3","x = 2, y = 3"]]},{"tyyppi":"kappale","otsikko":"Yksi, ei yhtään vai äärettömän monta ratkaisua","sisalto":"Kun molemmat yhtälöt on kirjoitettu muotoon y = kx + b, kulmakertoimet ja vakiotermit kertovat ilman piirtämistä, montako ratkaisua on. Kaikki tämän taidon suorat voi kirjoittaa tähän muotoon, koska pystysuoria suoria ei käsitellä, ja kahdelle suoralle on kolme mahdollisuutta. (1) Kulmakertoimet ovat eri: suorat leikkaavat täsmälleen yhdessä pisteessä. Syy: kun x kasvaa yhdellä, suorien y-arvojen erotus muuttuu kulmakertoimien erotuksen verran. Erotus siis kasvaa tai pienenee tasaisesti ja on nolla täsmälleen yhdessä kohdassa. Esimerkiksi y = 2x − 1 ja y = −x + 2 leikkaavat pisteessä (1, 1). Vakiotermit saavat olla samat: y = 4x + 1 ja y = −x + 1 leikkaavat y-akselilla pisteessä (0, 1). (2) Kulmakertoimet ovat samat ja vakiotermit eri: suorat ovat yhdensuuntaiset. Suorilla y = x + 2 ja y = x − 3 y-arvojen erotus on jokaisella x:llä 5, joten suorat eivät kohtaa koskaan eikä yhtälöparilla ole ratkaisua. (3) Kulmakertoimet ja vakiotermit ovat samat: yhtälöt esittävät samaa suoraa. Silloin jokainen suoran piste on ratkaisu, ja ratkaisuja on äärettömän monta. Sama suora voi näyttää eri yhtälöltä: yhtälöstä 6x − 2y = 2 saadaan −2y = −6x + 2 eli y = 3x − 1, ja y = 4 − 2x on sama kuin y = −2x + 4, koska termien järjestys ei muuta lauseketta. Kun suora on annettu kahtena pisteenä, laske kulmakerroin pisteiden avulla ja jatka pisteitä tasaisin askelin y-akselille asti, niin saat vakiotermin."},{"tyyppi":"ansa","otsikko":"Ansa 1: koordinaatit väärin päin ja vain toinen yhtälö tarkistettu","sisalto":"Suorat y = x − 3 ja y = −x + 5 leikkaavat pisteessä (4, 1). Jos kirjoitat ratkaisuksi x = 1, y = 4, olet lukenut koordinaatit väärin päin. Pisteessä x on aina ensin, ja se luetaan vaaka-akselilta. Sijoitus paljastaa virheen: kun x = 1, ensimmäinen yhtälö antaa y = 1 − 3 = −2 eikä 4. Toinen virhe on tarkistaa vain toinen yhtälö. Piste (1, −2) toteuttaa yhtälön y = x − 3, koska 1 − 3 = −2, mutta toinen yhtälö antaa −1 + 5 = 4 eikä −2. Piste on siis vain ensimmäisellä suoralla, eikä se ole yhtälöparin ratkaisu. Ratkaisu on vasta piste, joka toteuttaa molemmat yhtälöt, joten sijoita aina kumpaankin."},{"tyyppi":"ansa","otsikko":"Ansa 2: etumerkki tai jako unohtuu muunnoksessa","sisalto":"Kun yhtälöstä 2x − y = 3 ratkaistaan y, x-termi siirretään toiselle puolelle: −y = −2x + 3. Sitten molemmat puolet kerrotaan luvulla −1, ja jokainen termi vaihtaa etumerkkiä: y = 2x − 3. Yleinen virhe on y = 2x + 3, jossa vakiotermin etumerkki on jäänyt vaihtamatta. Toinen virhe syntyy jaossa. Yhtälöstä 3x + 3y = 6 saadaan 3y = −3x + 6, ja koko oikea puoli jaetaan luvulla 3: y = −x + 2. Jos jaat vain toisen termin, saat y = −3x + 2 tai y = −x + 6 eli väärän suoran, joka antaa väärän leikkauspisteen. Tarkista muunnos sijoittamalla jokin piste alkuperäiseen yhtälöön. Suoralla y = 2x − 3 on piste (2, 1), ja 2 · 2 − 1 = 3, joten muunnos on oikein. Väärän suoran y = 2x + 3 piste (0, 3) antaisi 2 · 0 − 3 = −3 eikä 3."},{"tyyppi":"ansa","otsikko":"Ansa 3: pelkkä kulmakerroin ei ratkaise","sisalto":"Kun kulmakertoimet ovat samat, moni päättelee heti, että ratkaisuja on äärettömän monta, tai heti, ettei niitä ole. Kumpikaan ei ole varmaa ennen kuin katsot vakiotermit. Yhtälöparissa y = x + 5 ja 3x − 3y = 3 toinen yhtälö muuttuu muotoon −3y = −3x + 3 eli y = x − 1. Kulmakertoimet ovat samat, mutta vakiotermit 5 ja −1 eroavat, joten suorat ovat yhdensuuntaiset eikä ratkaisua ole. Yhtälöparissa y = 3x + 2 ja 9x − 3y = −6 toinen yhtälö muuttuu muotoon −3y = −9x − 6 eli y = 3x + 2. Nyt myös vakiotermit ovat samat, joten kyseessä on sama suora kahdesti kirjoitettuna, ja ratkaisuja on äärettömän monta. Eri näköiset yhtälöt voivat siis esittää samaa suoraa, ja suorat, joilla on sama kulmakerroin, voivat olla eri suoria. Kirjoita molemmat muotoon y = kx + b ja vertaa sekä k:ta että b:tä."},{"tyyppi":"ansa","otsikko":"Ansa 4: kuvasta luettu piste ei ole aina tarkka","sisalto":"Suorat y = 2x ja y = −x + 2 leikkaavat kohdassa, joka ei ole ruudukon pisteessä. Kuvasta luet ehkä pisteen (0,7; 1,3). Kun koordinaateissa on desimaalipilkku, ne erotetaan puolipisteellä. Sijoitus yhtälöön y = 2x antaa 2 · 0,7 = 1,4 eikä 1,3. Se ei tarkoita, että yhtälöparilla ei olisi ratkaisua. Kulmakertoimet 2 ja −1 ovat eri, joten suorat leikkaavat ja ratkaisu on olemassa. Luettu piste on vain likiarvo, koska piirros ja lukeminen ovat epätarkkoja. Tarkan ratkaisun saa laskemalla, ja se opetellaan seuraavassa taidossa. Kun leikkauspiste osuu ruudukon pisteeseen ja sijoitus toteuttaa molemmat yhtälöt, tiedät, että lukema on tarkka. Tämän taidon tehtävissä leikkauspisteet ovat kokonaislukupisteitä, ellei tehtävässä kerrota toisin."},{"tyyppi":"muistilappu","otsikko":"Muista nämä","kohdat":["Yhtälöparin ratkaisu on piste, joka toteuttaa molemmat yhtälöt, eli suorien leikkauspiste.","Kirjoita yhtälöt ensin muotoon y = kx + b. Kun kerrot tai jaat, käsittele jokainen termi.","Ratkaisu muodossa x = …, y = …: x luetaan vaaka-akselilta ja kirjoitetaan ensin.","Tarkista sijoittamalla kumpaankin yhtälöön, ei vain toiseen.","Eri kulmakertoimet: yksi ratkaisu.","Sama kulmakerroin, eri vakiotermi: yhdensuuntaiset suorat, ei ratkaisua.","Sama kulmakerroin ja sama vakiotermi: sama suora, äärettömän monta ratkaisua.","Kuvasta luettu ratkaisu on likiarvo. Jos sijoitus ei toteudu, ratkaisu ei katoa: joko lukema on väärin (tarkista koordinaattien järjestys ja piirros) tai leikkauspiste ei ole ruudukon pisteessä, jolloin tarkka arvo saadaan laskemalla."]}],"harjoitusryhmat":[{"id":"piirra","nimi":"Leikkauspiste koordinaatistossa","info":"Ilman laskinta. Piirrä suorat omalle ruutupaperillesi samaan koordinaatistoon ja lue leikkauspiste. Tarkista se sijoittamalla molempiin yhtälöihin."},{"id":"tarkista","nimi":"Muoto y = kx + b ja tarkistus","info":"Ilman laskinta. Kun ratkaiset y:n, jaa tai kerro jokainen termi. Piste on ratkaisu vain, jos se toteuttaa molemmat yhtälöt."},{"id":"maara","nimi":"Ratkaisujen määrä","info":"Ilman laskinta. Kirjoita yhtälöt muotoon y = kx + b ja vertaa ensin kulmakertoimia, sitten vakiotermejä."}],"harjoitukset":[{"id":"H01","ryhma":"piirra","kysymys":"Piirrä omalle ruutupaperillesi suorat y = x + 2 ja y = −x + 4 samaan koordinaatistoon. Mikä on leikkauspisteen y-koordinaatti?","vastaus":3,"vinkki":"Suora y = x + 2 kulkee pisteen (0, 2) kautta ja nousee yhden, kun x kasvaa yhdellä. Suora y = −x + 4 kulkee pisteen (0, 4) kautta ja laskee yhden jokaisella askeleella.","selitys":"Suorat leikkaavat pisteessä (1, 3). Tarkistus: 1 + 2 = 3 ja −1 + 4 = 3. Leikkauspisteen y-koordinaatti on 3."},{"id":"H02","ryhma":"piirra","kysymys":"Piirrä omalle ruutupaperillesi suorat y = 2x − 3 ja y = −x + 3 samaan koordinaatistoon. Mikä on leikkauspisteen x-koordinaatti?","vastaus":2,"vinkki":"Aloita y-akselin pisteistä (0, −3) ja (0, 3). Ensimmäinen suora nousee kaksi ja toinen laskee yhden, kun x kasvaa yhdellä.","selitys":"Suorat leikkaavat pisteessä (2, 1). Tarkistus: 2 · 2 − 3 = 1 ja −2 + 3 = 1. Leikkauspisteen x-koordinaatti on 2."},{"id":"H03","ryhma":"piirra","kysymys":"Piirrä omalle ruutupaperillesi suorat y = 3x + 1 ja y = x − 3 samaan koordinaatistoon. Mikä on leikkauspisteen y-koordinaatti?","vastaus":-5,"vinkki":"Leikkauspiste on y-akselin vasemmalla puolella ja x-akselin alapuolella. Jatka suoria vasemmalle ja alas.","selitys":"Suorat leikkaavat pisteessä (−2, −5). Tarkistus: 3 · (−2) + 1 = −5 ja −2 − 3 = −5. Leikkauspisteen y-koordinaatti on −5."},{"id":"H04","ryhma":"piirra","kysymys":"Piirrä omalle ruutupaperillesi suorat y = −2x − 1 ja y = 3 samaan koordinaatistoon. Mikä on leikkauspisteen x-koordinaatti?","vastaus":-2,"vinkki":"y = 3 on vaakasuora suora: sen jokaisen pisteen y-koordinaatti on 3. Etsi suoralta y = −2x − 1 kohta, jossa y = 3.","selitys":"Suorat leikkaavat pisteessä (−2, 3). Tarkistus: −2 · (−2) − 1 = 4 − 1 = 3, ja suoralla y = 3 jokaisen pisteen y-koordinaatti on 3. Leikkauspisteen x-koordinaatti on −2."},{"id":"H05","ryhma":"piirra","kysymys":"Yhtälöparin y = 3x − 6 ja y = 0 ratkaisu on suoran ja x-akselin leikkauspiste. Mikä on sen x-koordinaatti?","vastaus":2,"vinkki":"Suora y = 0 on x-akseli. Etsi kohta, jossa suora y = 3x − 6 leikkaa x-akselin.","selitys":"Leikkauspiste on (2, 0), koska 3 · 2 − 6 = 0. Luku 2 on funktion nollakohta. Vastaus −6 olisi suoran ja y-akselin leikkauspisteen y-koordinaatti."},{"id":"H06","ryhma":"piirra","kysymys":"Suorat y = x − 1 ja y = −2x + 8 leikkaavat. Kirjoita yhtälöparin ratkaisu muodossa x = …, y = …. Mikä on y?","vastaus":2,"vinkki":"Piirrä suorat ja lue leikkauspisteen koordinaatit: x vaaka-akselilta, y pystyakselilta.","selitys":"Leikkauspiste on (3, 2). Tarkistus: 3 − 1 = 2 ja −2 · 3 + 8 = 2. Ratkaisu on x = 3, y = 2. Vastaus 3 syntyy, jos koordinaatit luetaan väärin päin."},{"id":"H07","ryhma":"piirra","kysymys":"Kaksi suoraa on kuvattu sanoin. Suora 1 kulkee pisteiden (0, −2) ja (1, −1) kautta. Suora 2 kulkee pisteiden (0, 7) ja (1, 5) kautta. Mikä on suorien leikkauspisteen y-koordinaatti?","vastaus":1,"vinkki":"Suora 1 nousee yhden ja suora 2 laskee kaksi, kun x kasvaa yhdellä. Jatka kummankin suoran pisteitä samoin askelin.","selitys":"Suora 1: (2, 0), (3, 1). Suora 2: (2, 3), (3, 1). Yhteinen piste on (3, 1), joten leikkauspisteen y-koordinaatti on 1."},{"id":"H08","ryhma":"tarkista","kysymys":"Kirjoita yhtälö 3x − y = 4 muotoon y = kx + b. Mikä on b?","vastaus":-4,"vinkki":"Siirrä 3x toiselle puolelle ja kerro sitten molemmat puolet luvulla −1. Jokainen termi vaihtaa etumerkkiä.","selitys":"−y = −3x + 4, ja kun kerrotaan luvulla −1, saadaan y = 3x − 4. Siis b = −4. Vastaus 4 syntyy, jos vakiotermin etumerkki jää vaihtamatta."},{"id":"H09","ryhma":"tarkista","kysymys":"Kirjoita yhtälö x + 3y = 12 muotoon y = kx + b. Mikä on b?","vastaus":4,"vinkki":"Siirrä x toiselle puolelle ja jaa koko oikea puoli luvulla 3, myös vakiotermi.","selitys":"3y = −x + 12, ja kun jaetaan luvulla 3, saadaan y = −(1/3)x + 4. Siis b = 4. Vastaus 12 syntyy, jos vakiotermiä ei jaeta."},{"id":"H10","ryhma":"tarkista","kysymys":"Kirjoita yhtälö 4x + 2y = 6 muotoon y = kx + b. Mikä on k?","vastaus":-2,"vinkki":"Siirrä 4x toiselle puolelle ja jaa molemmat termit luvulla 2.","selitys":"2y = −4x + 6, ja kun jaetaan luvulla 2, saadaan y = −2x + 3. Siis k = −2. Vastaus −4 syntyy, jos x-termiä ei jaeta."},{"id":"H11","ryhma":"tarkista","kysymys":"Yhtälöpari x + y = 5 ja 2x − y = 1. Kirjoita yhtälöt muotoon y = kx + b ja piirrä suorat omalle paperillesi. Mikä on leikkauspisteen x-koordinaatti?","vastaus":2,"vinkki":"x + y = 5 on sama kuin y = −x + 5. Yhtälöstä 2x − y = 1 saat −y = −2x + 1 eli y = 2x − 1.","selitys":"Suorat y = −x + 5 ja y = 2x − 1 leikkaavat pisteessä (2, 3). Tarkistus alkuperäisiin yhtälöihin: 2 + 3 = 5 ja 2 · 2 − 3 = 1. Leikkauspisteen x-koordinaatti on 2."},{"id":"H12","ryhma":"tarkista","kysymys":"Yhtälöpari y = 2x + 1 ja x + y = −5. Kirjoita toinen yhtälö muotoon y = kx + b ja piirrä suorat omalle paperillesi. Mikä on leikkauspisteen y-koordinaatti?","vastaus":-3,"vinkki":"x + y = −5 on sama kuin y = −x − 5.","selitys":"Suorat y = 2x + 1 ja y = −x − 5 leikkaavat pisteessä (−2, −3). Tarkistus: 2 · (−2) + 1 = −3 ja −2 + (−3) = −5. Leikkauspisteen y-koordinaatti on −3."},{"id":"H13","ryhma":"tarkista","kysymys":"Piste (2, −1) on luettu kuvasta yhtälöparin y = −3x + 5 ja y = x − 3 ratkaisuksi. Montako yhtälöparin yhtälöistä piste toteuttaa?","vastaus":2,"vinkki":"Sijoita x = 2 kumpaankin yhtälöön ja vertaa tulosta lukuun −1.","selitys":"−3 · 2 + 5 = −1 ja 2 − 3 = −1. Piste toteuttaa molemmat yhtälöt, joten se on yhtälöparin ratkaisu."},{"id":"H14","ryhma":"tarkista","kysymys":"Piste (1, 2) on luettu kuvasta yhtälöparin y = 3x − 1 ja y = −x + 4 ratkaisuksi. Montako yhtälöparin yhtälöistä piste toteuttaa?","vastaus":1,"vinkki":"Sijoita x = 1 kumpaankin yhtälöön. Älä lopeta ensimmäiseen.","selitys":"3 · 1 − 1 = 2 toteutuu, mutta −1 + 4 = 3 eikä 2. Piste on vain ensimmäisellä suoralla, joten se ei ole ratkaisu, ja lukema on väärin."},{"id":"H15","ryhma":"maara","kysymys":"Montako ratkaisua yhtälöparilla y = 2x + 3 ja y = −x + 3 on?","vastaus":1,"vinkki":"Vertaa ensin kulmakertoimia. Vakiotermeihin katsotaan vasta, jos kulmakertoimet ovat samat.","selitys":"Kulmakertoimet 2 ja −1 ovat eri, joten suorat leikkaavat täsmälleen yhdessä pisteessä, (0, 3). Sama vakiotermi tarkoittaa vain, että leikkauspiste on y-akselilla."},{"id":"H16","ryhma":"maara","kysymys":"Kaksi suoraa on kuvattu sanoin. Suora 1 kulkee pisteiden (0, −1) ja (1, 1) kautta. Suora 2 kulkee pisteiden (1, 5) ja (2, 7) kautta. Montako yhteistä pistettä suorilla on?","vastaus":1,"vinkki":"Laske kummankin suoran kulmakerroin: kuinka paljon y muuttuu, kun x kasvaa yhdellä? Jatka suoran 2 pisteitä y-akselille asti.","selitys":"Molempien kulmakerroin on 2. Suora 2 kulkee pisteen (0, 3) kautta, joten vakiotermit −1 ja 3 ovat eri. Suorat ovat yhdensuuntaiset, eikä yhtälöparilla ole ratkaisua. Yhteisten pisteiden määrä on suorien yhtälöparin ratkaisujen määrä. Vaihtoehto ”äärettömän monta” kertoo, että vakiotermit jäivät vertaamatta.","tyyppi":"monivalinta","vaihtoehdot":["Yksi","Ei yhtään","Äärettömän monta"]},{"id":"H17","ryhma":"maara","kysymys":"1) y = 2x + 3 ja y = 2x − 1\n2) y = −x + 1 ja 2x + 2y = 2\n3) y = 3x ja y = −3x\n4) y = x − 2 ja 3x − 3y = 3\n5) y = −2x + 4 ja 2x + y = 4\n\nMontako näistä yhtälöpareista on sellaisia, joilla ei ole ratkaisua?","vastaus":2,"vinkki":"Kirjoita jokainen yhtälö muotoon y = kx + b. Ratkaisua ei ole, kun kulmakertoimet ovat samat ja vakiotermit eri.","selitys":"1) sama k = 2, vakiotermit 3 ja −1: ei ratkaisua. 2) 2y = −2x + 2 eli y = −x + 1: sama suora. 3) kulmakertoimet 3 ja −3: yksi ratkaisu. 4) −3y = −3x + 3 eli y = x − 1, vakiotermit −2 ja −1: ei ratkaisua. 5) y = −2x + 4: sama suora. Ratkaisuttomia pareja on 2."},{"id":"H18","ryhma":"maara","kysymys":"1) y = x − 3 ja 2x − 2y = 6\n2) y = 5x + 2 ja y = 2x + 5\n3) y = −3x + 1 ja 3x + y = 4\n4) y = 4 − x ja y = −x + 4\n5) y = 2x + 4 ja 6x − 3y = −12\n\nMontako näistä yhtälöpareista on sellaisia, joilla on äärettömän monta ratkaisua?","vastaus":3,"vinkki":"Kirjoita jokainen yhtälö muotoon y = kx + b. Ratkaisuja on äärettömän monta, kun kulmakerroin ja vakiotermi ovat molemmat samat.","selitys":"1) −2y = −2x + 6 eli y = x − 3: sama suora. 2) kulmakertoimet 5 ja 2: yksi ratkaisu. 3) y = −3x + 4, vakiotermit 1 ja 4: ei ratkaisua. 4) y = 4 − x on sama kuin y = −x + 4: sama suora. 5) −3y = −6x − 12 eli y = 2x + 4: sama suora. Äärettömän monta ratkaisua on 3 parilla."},{"id":"H19","ryhma":"maara","tyyppi":"monivalinta","kysymys":"Sara luki suorien y = x + 2 ja y = −2x + 4 leikkauspisteeksi (0,7; 2,7). Kun hän sijoitti pisteen yhtälöön y = −2x + 4, hän sai −2 · 0,7 + 4 = 2,6 eikä 2,7.\n\nMitä tämä tarkoittaa?","vastaus":1,"vinkki":"Ovatko kulmakertoimet samat? Entä kuinka tarkasti ruutujen välistä voi lukea?","selitys":"Yhtälöparin ratkaisu on piste, joka toteuttaa molemmat yhtälöt. Kulmakertoimet 1 ja −2 ovat eri, joten suorat leikkaavat ja ratkaisu on olemassa. Kuvasta luettu piste on likiarvo, joten se ei toteuta yhtälöitä tarkasti. Tarkka ratkaisu saadaan laskemalla.","vaihtoehdot":["Yhtälöparilla ei ole ratkaisua.","Luettu piste on likiarvo. Ratkaisu on sen lähellä, ja tarkka arvo saadaan laskemalla.","Piste on silti tarkka ratkaisu, koska se toteuttaa yhtälön y = x + 2.","Suorat ovat yhdensuuntaiset."]},{"id":"H20","ryhma":"maara","kysymys":"Montako ratkaisua yhtälöparilla y = −2x + 1 ja 4x + 2y = 6 on?","vastaus":1,"vinkki":"Kirjoita toinen yhtälö muotoon y = kx + b ja vertaa kulmakertoimia ja vakiotermejä.","selitys":"2y = −4x + 6 eli y = −2x + 3. Kulmakertoimet ovat samat (−2), mutta vakiotermit 1 ja 3 eroavat. Suorat ovat yhdensuuntaiset, eikä ratkaisua ole. Vaihtoehto ”äärettömän monta ratkaisua” kertoo, että vain kulmakertoimia verrattiin.","tyyppi":"monivalinta","vaihtoehdot":["Yksi ratkaisu","Ei yhtään ratkaisua","Äärettömän monta ratkaisua"]}],"valmis_teksti":"Ratkaiset yhtälöparin piirtämällä suorat samaan koordinaatistoon, luet leikkauspisteen ja tarkistat sen sijoittamalla molempiin yhtälöihin. Kirjoitat yhtälön tarvittaessa muotoon y = kx + b ja päättelet kulmakertoimista ja vakiotermeistä, onko ratkaisuja yksi, ei yhtään vai äärettömän monta. Tiedät, että kuvasta luettu ratkaisu on likiarvo. Tämä taito on nyt näytetty."};

  const ala=Math.floor(v/10)*10, yla=ala+10, puoli=ala+5;
  const pyor = (v%10)>=5 ? yla : ala;
  const x = n => X0 + (n/100)*(X1-X0);
  let s=`<line class="rail" x1="${X0}" y1="${Y}" x2="${X1}" y2="${Y}"/>`;
  for(let n=0;n<=100;n+=10){
    const near = (n===ala||n===yla);
    s+=`<line class="tick" x1="${x(n)}" y1="${Y-7}" x2="${x(n)}" y2="${Y+7}"/>`;
    s+=`<text class="stop${near?" near":""}" x="${x(n)}" y="${Y+24}" text-anchor="middle">${n}</text>`;
  }
  s+=`<line class="halfway" x1="${x(puoli)}" y1="${Y-16}" x2="${x(puoli)}" y2="${Y+12}"/>`;
  s+=`<text class="stop" x="${x(puoli)}" y="${Y-22}" text-anchor="middle">puoliväli ${puoli}</text>`;
  s+=`<circle class="dot" cx="${x(v)}" cy="${Y}" r="6"/>`;
  s+=`<text class="val" x="${x(v)}" y="${Y-32}" text-anchor="middle">${v}</text>`;
  s+=`<path d="M ${x(v)} ${Y+38} L ${x(pyor)} ${Y+38}" stroke="var(--core)" stroke-width="2" fill="none"/>`;
  s+=`<path d="M ${x(pyor)} ${Y+38} l ${x(pyor)>x(v)?-7:7} -4 l 0 8 z" fill="var(--core)"/>`;
  svg.innerHTML=s;
  out.textContent = `${v} pyöristyy → ${pyor}`;
}

/* ---------- laskujärjestys-widget ---------- */
const ljExp=document.getElementById("ljExp");
if(ljExp && D.kokeilu){
  let ljI=0, ljTokens=[], ljStep=0;
  const laske=(a,op,b)=>{a=+a;b=+b;return op==="×"?a*b:op==="÷"?a/b:op==="+"?a+b:a-b;};
  function ljAlku(){
    const l=D.kokeilu[ljI];
    ljTokens=l.lauseke.replace(/\(/g,"( ").replace(/\)/g," )").split(/\s+/).filter(Boolean);
    ljStep=0; ljPiirra(); ljViesti("","");
  }
  function ljViesti(t,lk){const f=document.getElementById("ljFb"); f.textContent=t; f.className="lj-fb "+(lk||"");}
  function ljPiirra(){
    const l=D.kokeilu[ljI];
    document.getElementById("ljStep").textContent =
      ljStep>=l.askeleet.length ? "valmis" : `askel ${ljStep+1} / ${l.askeleet.length}`;
    if(ljStep>=l.askeleet.length){
      ljExp.innerHTML=`<span class="valmis">${l.lauseke} = ${l.vastaus}</span>`;
      return;
    }
    ljExp.innerHTML=ljTokens.map((t,i)=>
      "×÷+−".includes(t) ? `<button type="button" class="op" data-i="${i}">${t}</button>`
                         : `<span class="tok">${t}</span>`).join("");
    ljExp.querySelectorAll("button.op").forEach(b=>b.addEventListener("click",()=>ljKlikkaa(+b.dataset.i)));
  }
  function ljKlikkaa(i){
    const l=D.kokeilu[ljI], odotettu=l.askeleet[ljStep];
    const ehdotus=[ljTokens[i-1],ljTokens[i],ljTokens[i+1]].join(" ");
    if(ehdotus!==odotettu){
      ljViesti(ljStep===0
        ? "Ei vielä. Sulkeet ovat vahvimmat, sitten kerto ja jako. Yhtä vahvat vasemmalta oikealle."
        : "Ei vielä. Kumpi jäljellä olevista on vahvempi?", "no");
      return;
    }
    const arvo=laske(ljTokens[i-1],ljTokens[i],ljTokens[i+1]);
    let alku=i-1, loppu=i+1;
    if(ljTokens[i-2]==="(" && ljTokens[i+2]===")"){ alku=i-2; loppu=i+2; }
    ljTokens.splice(alku, loppu-alku+1, String(arvo));
    ljStep++;
    ljViesti(ljStep>=l.askeleet.length ? "Valmis. Vastaus on "+l.vastaus+"." : "Oikein. Jatka seuraavaan.", "ok");
    ljPiirra();
  }
  document.getElementById("ljSeuraava").addEventListener("click",()=>{
    ljI=(ljI+1)%D.kokeilu.length; ljAlku();
  });
  ljAlku();
}

};

/* Suomalainen lukumuoto: välilyönti on tuhaterotin, pilkku desimaalierotin.
   Piste voi olla kumpi tahansa. Se tulkitaan tuhaterottimeksi VAIN silloin, kun
   koko luku on aitoa tuhaterotinmuotoa: alkuosa 1–3 numeroa ilman etunollaa ja
   jokainen jatko-osa täsmälleen 3 numeroa (1.500, 12.345.678). Kaikissa muissa
   tapauksissa piste on desimaalipiste — myös 0.125, joka vanhalla säännöllä
   ("3 numeroa pisteen jäljessä = tuhaterotin") luettiin virheellisesti luvuksi 125. */
const TUHATEROTIN = /^[1-9]\d{0,2}(\.\d{3})+$/;
function lueLuku(teksti){
  // Murtoluku (3/4, -3/4) ja sekaluku (1 2/3, -1 2/3) hyväksytään sellaisinaan.
  const raaka = String(teksti).replace(/\u00a0/g, " ").trim();
  let m = raaka.match(/^(-?)(\d+)\s+(\d+)\s*\/\s*(\d+)$/);
  if(m){ const nim = Number(m[4]); if(nim === 0) return null;
    const v = Number(m[2]) + Number(m[3]) / nim; return m[1] ? -v : v; }
  m = raaka.match(/^(-?)\s*(\d+)\s*\/\s*(\d+)$/);
  if(m){ const nim = Number(m[3]); if(nim === 0) return null;
    const v = Number(m[2]) / nim; return m[1] ? -v : v; }
  let s = String(teksti).replace(/[\s\u00a0]/g, "");
  if(s === "") return null;
  if(s.indexOf(",") >= 0){
    s = s.replace(/\./g, "").replace(",", ".");
  } else if(TUHATEROTIN.test(s)){
    s = s.replace(/\./g, "");
  }
  const n = Number(s);
  return Number.isFinite(n) ? n : null;
}

function tarkista(id){
  const h=D.harjoitukset.find(x=>x.id===id);
  const kentta=document.getElementById("in-"+id);
  const fb=document.getElementById("fb-"+id);
  if(kentta.value.trim()===""){ fb.className="fb hint"; fb.textContent="Kirjoita vastaus ensin."; return; }
  const luku=lueLuku(kentta.value);
  if(luku===null){ fb.className="fb no"; fb.textContent="Vastauksen pitää olla luku tai murtoluku (esimerkiksi 3/4)."; return; }
  const oikein = Math.abs(luku - h.vastaus) < 1e-9;
  merkitseTulos(id, oikein, oikein ? "Oikein. "+h.selitys : `Ei vielä. ${h.vinkki} Kokeile uudelleen.`);
}

function tarkistaMonivalinta(id, valittuIndeksi, painike){
  const h=D.harjoitukset.find(x=>x.id===id);
  const rivi=painike.closest(".row");
  rivi.querySelectorAll(".mv-valinta").forEach(b=>b.disabled=true);
  const oikein = valittuIndeksi===h.vastaus;
  painike.classList.add(oikein?"mv-oikein":"mv-vaarin");
  if(!oikein){
    const oikeaBtn=rivi.querySelector(`[data-i="${h.vastaus}"]`);
    if(oikeaBtn) oikeaBtn.classList.add("mv-oikein");
  }
  merkitseTulos(id, oikein, oikein ? "Oikein. "+h.selitys : `Ei ihan. Oikea vastaus on korostettu. ${h.selitys||""}`);
}

/* Kuuntelu: selain lukee tekstin ääneen omalla puhesynteesillään (englanniksi, jos laitteessa on
   englanninkielinen ääni). Ei äänitiedostoja eikä verkkoyhteyttä. Jos laite ei osaa puhua,
   teksti näytetään luettavaksi — silloin tehtävä muuttuu luetun ymmärtämiseksi, mutta ei katkea. */
function puhu(id, nopeus){
  const h=D.harjoitukset.find(x=>x.id===id); if(!h || !h.kuuntele) return;
  const vara=document.getElementById("vara-"+id);
  const naytaTeksti=syy=>{ vara.hidden=false; vara.textContent=syy+" Teksti: "+h.kuuntele; };
  if(!("speechSynthesis" in window)){ naytaTeksti("Tämä laite ei osaa lukea ääneen."); return; }
  const s=window.speechSynthesis; s.cancel();
  const u=new SpeechSynthesisUtterance(h.kuuntele);
  u.lang=h.kieli||"en-GB"; u.rate=nopeus;
  const aanet=s.getVoices(), kieli=u.lang.slice(0,2);
  const aani=aanet.find(a=>a.lang===u.lang) || aanet.find(a=>a.lang && a.lang.startsWith(kieli));
  if(aani) u.voice=aani;
  else if(aanet.length) { naytaTeksti("Laitteessa ei ole englanninkielistä ääntä."); return; }
  u.onerror=()=>naytaTeksti("Ääneen lukeminen ei onnistunut.");
  s.speak(u);
}
