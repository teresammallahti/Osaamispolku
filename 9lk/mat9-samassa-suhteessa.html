<title>Samassa suhteessa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">

<style>
:root{
  --paper:#EFF2F5; --surface:#FFFFFF; --surface-2:#F7F9FB;
  --grid:#DCE3EA; --line:#C9D3DC;
  --ink:#15222C; --ink-2:#4E626F; --ink-3:#7E8F9B;
  --core:#1B5A9E; --core-soft:#E4EDF6;
  --strong:#1F6E5C; --strong-soft:#E1F0EB;
  --chal:#9A6A16; --chal-soft:#F6EDDC;
  --alert:#A33A2B; --alert-soft:#F8E7E3;
  --shadow:0 1px 2px rgba(21,34,44,.06), 0 8px 24px -12px rgba(21,34,44,.18);
  --r:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0F161B; --surface:#18222A; --surface-2:#1D2830;
    --grid:#22303A; --line:#2E3E4A;
    --ink:#E8EFF4; --ink-2:#A3B4C0; --ink-3:#7A8B97;
    --core:#7FB2E4; --core-soft:#16303F;
    --strong:#77CDB4; --strong-soft:#123028;
    --chal:#E0B267; --chal-soft:#33270F;
    --alert:#E8907F; --alert-soft:#3A1E19;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -14px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --paper:#0F161B; --surface:#18222A; --surface-2:#1D2830;
  --grid:#22303A; --line:#2E3E4A;
  --ink:#E8EFF4; --ink-2:#A3B4C0; --ink-3:#7A8B97;
  --core:#7FB2E4; --core-soft:#16303F;
  --strong:#77CDB4; --strong-soft:#123028;
  --chal:#E0B267; --chal-soft:#33270F;
  --alert:#E8907F; --alert-soft:#3A1E19;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -14px rgba(0,0,0,.7);
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:16px; line-height:1.62;
  background-image:
    linear-gradient(to right, var(--grid) 1px, transparent 1px),
    linear-gradient(to bottom, var(--grid) 1px, transparent 1px);
  background-size:26px 26px;
}
.wrap{max-width:760px; margin:0 auto; padding:28px 20px 90px}
h1,h2,h3,h4{font-family:"Familjen Grotesk","IBM Plex Sans",system-ui,sans-serif; text-wrap:balance}

/* header */
header.top{background:var(--surface); border:1px solid var(--line); border-radius:var(--r);
  box-shadow:var(--shadow); padding:22px 24px; display:flex; gap:18px; align-items:flex-start}
.badge{flex:0 0 auto; width:54px; height:54px; border-radius:9px; display:grid; place-items:center;
  background:var(--core-soft); border:1px solid var(--core); color:var(--core)}
.badge svg{width:28px; height:28px; fill:none; stroke:currentColor; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round}
.eyebrow{font-family:"IBM Plex Mono",monospace; font-size:11px; letter-spacing:.14em;
  text-transform:uppercase; color:var(--ink-3); margin:0 0 5px}
header.top h1{margin:0; font-size:30px; font-weight:700; letter-spacing:-.015em}
header.top p{margin:5px 0 0; color:var(--ink-2); font-size:15px}
.tags{display:flex; flex-wrap:wrap; gap:5px; margin-top:11px}
.tag{font-family:"IBM Plex Mono",monospace; font-size:10.5px; letter-spacing:.05em; padding:2px 7px;
  border-radius:4px; background:var(--surface-2); border:1px solid var(--line); color:var(--ink-3)}
.tag.core{background:var(--core-soft); border-color:var(--core); color:var(--core)}

/* teksti */
article{margin-top:26px}
article h2{font-size:21px; font-weight:600; margin:32px 0 10px; letter-spacing:-.01em}
article p{margin:0 0 14px; max-width:64ch}
.lead{font-size:17.5px; color:var(--ink); border-left:3px solid var(--core); padding-left:16px; margin:0 0 8px}

.box{background:var(--surface); border:1px solid var(--line); border-radius:var(--r);
  padding:18px 22px; box-shadow:var(--shadow); margin:22px 0}
.box h3{margin:0 0 12px; font-size:16.5px; font-weight:600}
.box.warn{border-left:3px solid var(--alert)}
.box.note{border-left:3px solid var(--chal)}

ol.steps{margin:0; padding-left:0; list-style:none; counter-reset:s; display:grid; gap:12px}
ol.steps li{counter-increment:s; display:grid; grid-template-columns:auto 1fr; gap:13px; align-items:start}
ol.steps li::before{content:counter(s); font-family:"Familjen Grotesk",sans-serif; font-weight:700; font-size:14px;
  width:26px; height:26px; border-radius:50%; background:var(--core); color:#fff; display:grid; place-items:center; margin-top:2px}

ul.notes{margin:0; padding-left:19px}
ul.notes li{margin-bottom:7px}
ul.notes li:last-child{margin-bottom:0}

.tablewrap{overflow-x:auto}
table{border-collapse:collapse; width:100%; font-size:14.5px; min-width:460px}
th,td{text-align:left; padding:9px 13px; border-bottom:1px solid var(--line)}
th{font-family:"IBM Plex Mono",monospace; font-size:10.5px; letter-spacing:.1em; text-transform:uppercase;
  color:var(--ink-3); font-weight:400; background:var(--surface-2)}
tr:last-child td{border-bottom:0}
td b{color:var(--core); font-weight:600}
td:last-child{font-variant-numeric:tabular-nums; font-weight:600}

/* lukusuora */
.nl svg{width:100%; height:118px; display:block}
.nl .rail{stroke:var(--line); stroke-width:2}
.nl .tick{stroke:var(--line); stroke-width:1.5}
.nl .stop{fill:var(--ink-3); font-family:"IBM Plex Mono",monospace; font-size:11px}
.nl .stop.near{fill:var(--core); font-weight:600}
.nl .dot{fill:var(--chal)}
.nl .val{fill:var(--ink); font-family:"Familjen Grotesk",sans-serif; font-size:15px; font-weight:700}
.nl .halfway{stroke:var(--chal); stroke-dasharray:3 3; stroke-width:1.5}
.nl-controls{display:flex; align-items:center; gap:14px; margin-top:6px}
.nl-controls input{flex:1; accent-color:var(--core)}
.nl-out{font-family:"Familjen Grotesk",sans-serif; font-size:15px; font-weight:600; min-width:12.5em; text-align:right}

/* paikka-arvotaulu */
.box .ohje{margin:0 0 14px; font-size:14.5px; color:var(--ink-2)}
.nt-valinta{display:flex; flex-wrap:wrap; gap:7px; margin-bottom:16px}
.nt-valinta button{font:inherit; font-size:12.5px; font-family:"IBM Plex Mono",monospace; padding:5px 11px;
  border-radius:6px; border:1px solid var(--line); background:var(--surface-2); color:var(--ink-2); cursor:pointer}
.nt-valinta button[aria-pressed="true"]{background:var(--ink); color:var(--paper); border-color:var(--ink)}
.nt-valinta button:focus-visible{outline:2px solid var(--core); outline-offset:2px}
.nt-taulu{display:flex; flex-direction:column; gap:4px; align-items:flex-start; overflow-x:auto; padding-bottom:4px}
.nt-rivi{display:flex; gap:6px; align-items:center}
.nt-rivi .otsa{font-family:"IBM Plex Mono",monospace; font-size:9.5px; letter-spacing:.08em;
  text-transform:uppercase; color:var(--ink-3); width:52px; text-align:center}
.nt-ruutu{width:52px; height:52px; display:grid; place-items:center; border:1.5px solid var(--line);
  border-radius:7px; background:var(--surface-2); font-family:"IBM Plex Mono",monospace; font-size:24px}
.nt-ruutu.kohta{border-color:var(--core); background:var(--core-soft); color:var(--core); font-weight:500}
.nt-ruutu.ratkaiseva{border-color:var(--chal); background:var(--chal-soft); color:var(--chal); font-weight:500}
.nt-ruutu.nolla{color:var(--ink-3)}
.nt-rivi .nimi{font-size:12.5px; color:var(--ink-3); margin-left:12px; white-space:nowrap}
.nt-nuoli{font-size:17px; color:var(--chal); margin-left:6px}
.nt-selite{margin:14px 0 0; font-size:14.5px}
.nt-selite b{color:var(--core)}

/* vahvuusportaat */
.vp-tasot{display:grid; gap:9px; margin-bottom:18px}
.vp-taso{display:flex; gap:11px; align-items:flex-start; font-size:13.5px}
.vp-taso .vp-pallo{width:13px; height:13px; border-radius:4px; margin-top:5px; flex:0 0 auto}
.vp-taso[data-taso="sulkeet"] .vp-pallo{background:var(--core)}
.vp-taso[data-taso="kertojako"] .vp-pallo{background:var(--strong)}
.vp-taso[data-taso="yhteenvahennys"] .vp-pallo{background:var(--chal)}
.vp-taso strong{display:block; font-family:"Familjen Grotesk",sans-serif; font-weight:600; font-size:14.5px}
.vp-taso span{color:var(--ink-2)}
.vp-lauseke{display:flex; flex-wrap:wrap; gap:7px; align-items:flex-end; font-family:"IBM Plex Mono",monospace;
  font-size:25px; padding:10px 2px; min-height:64px}
.vp-lauseke .t{padding:2px 3px}
.vp-lauseke .op{position:relative; padding:2px 9px; border-radius:6px; font-weight:500}
.vp-lauseke .op[data-taso="sulkeet"]{background:var(--core-soft); color:var(--core)}
.vp-lauseke .op[data-taso="kertojako"]{background:var(--strong-soft); color:var(--strong)}
.vp-lauseke .op[data-taso="yhteenvahennys"]{background:var(--chal-soft); color:var(--chal)}
.vp-lauseke .op i{position:absolute; top:-9px; right:-6px; font-style:normal; font-family:"Familjen Grotesk",sans-serif;
  font-size:11px; font-weight:700; width:18px; height:18px; border-radius:50%; display:grid; place-items:center;
  background:currentColor}
.vp-lauseke .op i span{color:var(--surface)}
.vp-rivi{display:flex; align-items:center; gap:16px; margin-top:8px}
.vp-vastaus{font-family:"Familjen Grotesk",sans-serif; font-size:16px; font-weight:600; color:var(--strong)}

/* laskujärjestys-widget */
.lj-exp{display:flex; flex-wrap:wrap; gap:7px; align-items:center; font-family:"IBM Plex Mono",monospace;
  font-size:23px; padding:14px 4px; min-height:62px}
.lj-exp .tok{padding:2px 4px; color:var(--ink)}
.lj-exp button.op{font-family:"IBM Plex Mono",monospace; font-size:23px; padding:3px 12px; border-radius:7px;
  border:1.5px solid var(--line); background:var(--surface-2); color:var(--ink); line-height:1.2}
.lj-exp button.op:hover{border-color:var(--core); color:var(--core)}
.lj-exp button.op:focus-visible{outline:2px solid var(--core); outline-offset:2px}
.lj-exp .valmis{font-family:"Familjen Grotesk",sans-serif; font-size:23px; font-weight:700; color:var(--strong)}
.lj-fb{font-size:14.5px; min-height:1.5em; color:var(--ink-2)}
.lj-fb.no{color:var(--alert)}
.lj-fb.ok{color:var(--strong)}
.lj-row{display:flex; align-items:center; gap:14px; margin-top:10px}
.lj-step{font-family:"IBM Plex Mono",monospace; font-size:11.5px; letter-spacing:.1em;
  text-transform:uppercase; color:var(--ink-3)}

/* harjoitukset */
.progress{position:sticky; top:0; z-index:5; background:var(--surface); border:1px solid var(--line);
  border-radius:var(--r); padding:12px 18px; box-shadow:var(--shadow); display:flex; align-items:center;
  gap:14px; margin:34px 0 18px}
.progress .lbl{font-family:"IBM Plex Mono",monospace; font-size:11px; letter-spacing:.12em;
  text-transform:uppercase; color:var(--ink-3); white-space:nowrap}
.progress .meter{flex:1; height:7px; border-radius:4px; background:var(--surface-2); border:1px solid var(--line); overflow:hidden}
.progress .meter i{display:block; height:100%; background:var(--core); transition:width .25s ease}
.progress .cnt{font-family:"Familjen Grotesk",sans-serif; font-weight:700; font-variant-numeric:tabular-nums; white-space:nowrap}

.grp{margin-top:26px}
.grp-head{display:flex; align-items:baseline; gap:10px; border-bottom:1.5px solid var(--ink); padding-bottom:7px; margin-bottom:14px}
.grp-head h3{margin:0; font-size:17px; font-weight:600}
.grp-head span{font-size:12.5px; color:var(--ink-2)}

.ex{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:14px 16px; margin-bottom:10px}
.ex[data-tila="oikein"]{border-color:var(--strong); box-shadow:inset 3px 0 0 var(--strong)}
.ex[data-tila="vaarin"]{border-color:var(--alert); box-shadow:inset 3px 0 0 var(--alert)}
.ex .q{display:flex; gap:11px; align-items:baseline; flex-wrap:wrap}
.ex .num{font-family:"IBM Plex Mono",monospace; font-size:11.5px; color:var(--ink-3); min-width:2.4em}
.ex .txt{flex:1; min-width:190px; font-size:15.5px}
.ex .txt .aineisto{display:block; margin-bottom:9px; padding-left:12px;
  border-left:2px solid var(--line); color:var(--ink-2); line-height:1.6;
  /* Aineisto voi olla pieni taulukko, jonka rivit on erotettu rivinvaihdoilla.
     Ilman pre-lineä ne valuisivat yhdeksi kappaleeksi ja taulukko katoaisi. */
  white-space:pre-line}
.ex .txt .kysymysrivi{display:block; font-weight:600}
.ex .row{display:flex; gap:8px; align-items:center; margin-top:11px; flex-wrap:wrap}
.ex input[type=text]{font:inherit; font-family:"IBM Plex Mono",monospace; font-size:15px; width:8.5em;
  padding:7px 11px; border:1px solid var(--line); border-radius:7px; background:var(--surface-2);
  color:var(--ink); text-align:right}
.ex input:focus-visible{outline:2px solid var(--core); outline-offset:1px}
button{font:inherit; cursor:pointer}
.btn{font-size:13.5px; padding:7px 15px; border-radius:7px; border:1px solid var(--core);
  background:var(--core); color:#fff}
.btn.ghost{background:transparent; color:var(--ink-2); border-color:var(--line)}
.btn:focus-visible{outline:2px solid var(--core); outline-offset:2px}
.btn.mv-valinta{text-align:left}
/* kuuntelutehtävä: selaimen puhesynteesi lukee englanninkielisen tekstin */
.kuuntele{display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin:2px 0 10px}
.kuuntele .btn{display:inline-flex; gap:7px; align-items:center}
.kuuntele svg{width:16px; height:16px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round}
.kuuntele .varateksti{flex-basis:100%; font-size:14px; color:var(--ink-2); background:var(--surface-2);
  border-radius:7px; padding:8px 12px; margin:0}
.btn.mv-valinta:disabled{cursor:default; opacity:.65}
.btn.mv-oikein{background:var(--strong-soft); border-color:var(--strong); color:var(--strong); opacity:1}
.btn.mv-vaarin{background:var(--alert-soft); border-color:var(--alert); color:var(--alert); opacity:1}
.row.mv{gap:8px 10px}
.fb{margin-top:11px; font-size:14.5px; padding:10px 13px; border-radius:8px; line-height:1.5}
.fb.ok{background:var(--strong-soft); color:var(--strong)}
.fb.no{background:var(--alert-soft); color:var(--alert)}
.fb.hint{background:var(--chal-soft); color:var(--chal)}

.done{background:var(--strong-soft); border:1px solid var(--strong); color:var(--strong);
  border-radius:var(--r); padding:16px 20px; margin-top:20px; font-size:15.5px}
.done h3{margin:0 0 4px; font-size:17px; color:var(--strong)}

details.teacher{margin-top:34px; background:var(--surface); border:1px solid var(--line);
  border-left:3px solid var(--chal); border-radius:var(--r); padding:15px 20px; box-shadow:var(--shadow)}
details.teacher summary{cursor:pointer; font-family:"Familjen Grotesk",sans-serif; font-weight:600; font-size:15px}
details.teacher summary:focus-visible{outline:2px solid var(--core); outline-offset:3px}
details.teacher ul{margin:12px 0 0; padding-left:19px; color:var(--ink-2); font-size:14.5px}
details.teacher li{margin-bottom:8px}
details.teacher p{margin:12px 0 0; color:var(--ink-2); font-size:14.5px}

.back{display:inline-block; margin-top:30px; font-size:13.5px; color:var(--ink-2)}
.back a{color:var(--core)}

@media (prefers-reduced-motion: reduce){*{transition:none !important}}
@media (max-width:560px){
  .wrap{padding:16px 13px 70px}
  header.top h1{font-size:25px}
  .progress{flex-wrap:wrap}
}
</style>

<div class="wrap">

  <header class="top">
    <span class="badge"><svg viewBox="0 0 24 24" aria-hidden="true" id="ikoni"></svg></span>
    <div>
      <p class="eyebrow" id="eyebrow"></p>
      <h1 id="otsikko"></h1>
      <p id="kuvaus"></p>
      <div class="tags" id="tags"></div>
    </div>
  </header>

  <article id="teksti"></article>

  <div class="progress" aria-live="polite">
    <span class="lbl">Harjoitukset</span>
    <span class="meter"><i id="pbar" style="width:0%"></i></span>
    <span class="cnt" id="pcnt">0 / 20</span>
  </div>

  <div id="harjoitukset"></div>
  <div id="valmis"></div>

  <p class="back" id="back"></p>

</div>

<script>
const D = {"tavoite_id":"MAT9-VER-01","oppiaine":"MAT","vuosiluokka":9,"otsikko":"Samassa suhteessa","kuvaus":"Osaan käyttää verrantoa monivaiheisen ongelman välivaiheena esimerkiksi mittakaavassa, seossuhteessa tai yksikkömuunnoksessa.","versio":"0.2","paivitetty":"2026-10-11","ops":{"T":["T5","T7","T14"],"S":["S3"]},"taso":"ydin","ikoni":"vertailu","eyebrow":"Matematiikka · 9. luokka · Suhde ja verrannollisuus","teksti":[{"tyyppi":"johdanto","sisalto":"Kaveriporukka lähtee pyörillä uimarannalle. Reitti on kartalla 11 cm pitkä, kartan mittakaava on 1 : 50 000, ja porukka ajaa keskimäärin 15 km/h. Kuinka kauan matka kestää? Yhdellä laskulla vastaukseen ei pääse. Ensin tarvitaan todellinen matka: 11 cm · 50 000 = 550 000 cm = 5,5 km. Sitten aika: 5,5 km : 15 km/h = 0,3666… h. Lopuksi minuutit: 0,3666… · 60 min = 22 min. Kahdeksannella luokalla ratkaisit verrannon, kun tehtävä kertoi, mitkä luvut kuuluvat yhteen. Tässä taidossa verranto on yksi vaihe pidemmässä ongelmassa: suunnittelet vaiheet itse, päätät jokaisessa vaiheessa, onko verrannollisuus suora vai kääntäen, kirjoitat suureet yksiköineen verrantoon ja tarkistat lopuksi, onko tulos järkevä. Tehtävät tulevat kartoista, seoksista, polttoaineen kulutuksesta, hinnoista ja työn jakamisesta. Laskin on sallittu, mutta verranto kirjoitetaan näkyviin."},{"tyyppi":"kappale","otsikko":"Suunnitelma ennen laskemista","sisalto":"Monivaiheisessa ongelmassa vaikeinta ei ole laskeminen vaan se, mitä lasketaan ja missä järjestyksessä. Kysy ennen laskinta kolme asiaa: mitä tiedetään, mitä kysytään ja mikä välisuure puuttuu niiden väliltä. Esimerkki: ikkunanpesuun tehdään ämpärillinen, jossa on 4 litraa liuosta, ja tiivistettä ja vettä sekoitetaan suhteessa 1 : 20. Pullossa on 500 ml tiivistettä. Montako täyttä ämpärillistä pullosta riittää? Tiedetään suhde, ämpärillisen määrä ja pullon tilavuus. Kysytään ämpärillisten määrää. Välisuure on yhteen ämpärilliseen tarvittava tiivistemäärä. Suunnitelma: 1. tiivisteen määrä yhteen ämpärilliseen, 2. montako tällaista määrää pullossa on, 3. vastaus täysinä ämpärillisinä. Arvioi ennen laskemista: tiivistettä on vähän alle kahdeskymmenesosa 4 litrasta eli vajaat 200 ml, joten pullosta riittää kahteen tai kolmeen ämpärilliseen. Laskut: 4 000 ml : 21 = 190,47… ml ja 500 ml : 190,47… ml = 2,62…, joten täysiä ämpärillisiä on 2. Kolmanteen ämpärilliseen tiiviste ei riitä, joten tulosta ei pyöristetä ylöspäin. Toisessa tilanteessa suunta on päinvastainen: jos laastiin tarvitaan 36 kg sementtiä ja sitä myydään 25 kg:n säkeissä, 36 kg : 25 kg = 1,44, mutta yksi säkki ei riitä, joten ostetaan 2 säkkiä. Tilanne ratkaisee pyöristyksen suunnan. Suunnitelma kannattaa kirjoittaa, koska siitä näkee, mikä välisuure on jo laskettu ja mikä puuttuu. Ilman sitä laskimeen tulee helposti luku, joka on oikein laskettu mutta ei vastaa kysymykseen."},{"tyyppi":"kappale","otsikko":"Suora vai kääntäen: päätä joka vaiheessa","sisalto":"Jokaisessa verrannossa on kaksi suuretta, ja ennen verrannon kirjoittamista päätät, miten ne riippuvat toisistaan. Kysy: jos toinen suure kaksinkertaistuu, kaksinkertaistuuko toinenkin vai puolittuuko se? Suoraan verrannollisilla suureilla suhde pysyy samana, esimerkiksi kilohinta, kulutus sataa kilometriä kohden, mittakaava tai nopeus. Kääntäen verrannollisilla suureilla tulo pysyy samana, esimerkiksi työn määrä, kuljettava matka tai kuljetettava kokonaismassa. Samat suureet voivat olla eri tilanteessa eri tavalla verrannollisia: matka ja aika ovat suoraan verrannolliset, kun nopeus pysyy samana, mutta nopeus ja aika ovat kääntäen verrannolliset, kun matka pysyy samana. Siksi päätös tehdään jokaisessa vaiheessa erikseen. Esimerkki: kävelet harrastukseen keskinopeudella 4,5 km/h, ja matka kestää 36 minuuttia. Sähköpotkulaudalla keskinopeus on 18 km/h, ja vuokra on 0,20 € minuutilta. Paljonko matka maksaa potkulaudalla? Vaihe 1: matka pysyy samana, joten nopeus ja aika ovat kääntäen verrannolliset. Nopeus nelinkertaistuu (18 : 4,5 = 4), joten aika on neljäsosa: x / 36 min = 4,5 km/h / 18 km/h, josta x = 9 min. Vaihe 2: minuuttihinta pysyy samana, joten aika ja hinta ovat suoraan verrannolliset: x / 9 min = 0,20 € / 1 min, josta x = 1,80 €. Kääntäen verrannollisessa verrannossa toinen suhde on käännetty, ja sen voi tarkistaa tulosta: 4,5 km/h · 36 min ja 18 km/h · 9 min ovat yhtä suuret. Jos aika olisi pidentynyt, kun nopeus kasvoi, verranto olisi kirjoitettu suorana."},{"tyyppi":"taulukko","otsikko":"Tilanteita, joissa verranto on välivaihe","otsikkorivi":["Tilanne","Mikä pysyy samana","Verranto yksiköineen","Suora vai kääntäen"],"rivit":[["Mittakaava 1 : 25 000, matka kartalla 8 cm","kartan ja maaston pituuksien suhde","x / 8 cm = 25 000 / 1, x = 200 000 cm = 2 km","suora"],["Nopeus 4 km/h, matka 3 km","matkan ja ajan suhde eli nopeus","x / 3 km = 1 h / 4 km, x = 0,75 h = 45 min","suora"],["Seossuhde 1 : 30, liuosta 6,2 l","tiivisteen ja koko liuoksen suhde 1 : 31","x / 6 200 ml = 1 / 31, x = 200 ml","suora"],["Kulutus 6 l / 100 km, matka 250 km","polttoaineen ja matkan suhde","x / 250 km = 6 l / 100 km, x = 15 l","suora"],["Hinta 2,40 € / 300 g, kysytään 100 g:n hinta","hinnan ja massan suhde","x / 100 g = 2,40 € / 300 g, x = 0,80 €","suora"],["2 kantajaa 6 tunnissa, kantajia 3","työn määrä, 2 · 6 h = 12 kantajatuntia","x / 6 h = 2 / 3, x = 4 h","kääntäen"],["Matka kestää 40 min nopeudella 12 km/h, uusi nopeus 16 km/h","matka eli nopeuden ja ajan tulo","x / 40 min = 12 km/h / 16 km/h, x = 30 min","kääntäen"],["Kärryyn mahtuu 500 kg, kuormia 12, isompaan kärryyn 750 kg","kokonaismassa eli kuorman koko · kuormien määrä","x / 12 = 500 kg / 750 kg, x = 8 kuormaa","kääntäen"],["Polku on 9 cm kartalla 1 : 20 000, uusi kartta 1 : 30 000","maaston matka eli mittakaavaluku · kartan pituus","x / 9 cm = 20 000 / 30 000, x = 6 cm","kääntäen"]]},{"tyyppi":"saanto","otsikko":"Näin ratkaiset monivaiheisen ongelman","askeleet":["Kirjoita suunnitelma ja arvio. Esimerkki: retkikartan mittakaava on 1 : 20 000, polku laavulle on kartalla 23 cm, kävelet keskinopeudella 5 km/h ja lähdet kello 14.35. Laavun vierestä lähtee bussi kello 15.40. Ehditkö bussiin? Suunnitelma: 1. todellinen matka mittakaavasta, 2. kävelyaika nopeudesta, 3. saapumisaika laavulle ja sen vertaaminen bussin lähtöaikaan. Arvio: 1 cm kartalla on 200 m maastossa, joten matka on vähän alle 5 km, ja kävely kestää vajaan tunnin.","Päätä, onko verrannollisuus suora vai kääntäen, ja kirjoita verranto yksiköineen. Kartan ja maaston pituuksien suhde pysyy samana, joten verrannollisuus on suora: x / 23 cm = 20 000 / 1, josta x = 460 000 cm. Muunna: 460 000 cm = 4 600 m = 4,6 km. Senttimetreistä metreihin jaetaan 100:lla ja metreistä kilometreihin 1 000:lla.","Tee seuraava vaihe samoin. Nopeus pysyy samana, joten matka ja aika ovat suoraan verrannolliset: x / 4,6 km = 1 h / 5 km, josta x = 0,92 h. Saman voi kirjoittaa niin, että tuntematon on nimittäjässä: 4,6 km / x = 5 km / 1 h. Kumpikin verranto antaa ristiin kertomalla saman yhtälön 5x = 4,6.","Muunna yksiköt kysymyksen mukaan. Tunnissa on 60 minuuttia, joten 0,92 h = 0,92 · 60 min = 55,2 min. Vastaus ei ole 92 min, koska tunnin desimaalit eivät ole minuutteja.","Pyöristä vasta lopuksi. Pidä välitulos laskimessa tarkkana ja pyöristä vain vastaus pyydettyyn tarkkuuteen: 55,2 min ≈ 55 min, ja 14.35 + 55 min = 15.30. Olet laavulla kello 15.30, joten ehdit kello 15.40 lähtevään bussiin. Jos kysytään, mihin aikaan on viimeistään lähdettävä, jotta olet perillä tiettyyn kellonaikaan, kävelyaika vähennetään siitä kellonajasta: jotta olisit laavulla jo kello 15.20, sinun pitäisi lähteä viimeistään kello 15.20 − 55 min = 14.25.","Tarkista järkevyys alkuperäisestä tilanteesta. Arvio oli vähän alle 5 km ja vajaa tunti, ja tulos 4,6 km ja 55 min sopii siihen. Jos tulokseksi tulisi 9 tuntia tai 5 minuuttia, jokin vaihe olisi väärin, todennäköisesti yksikkömuunnos. Kirjoita järkevyydestä yksi lause."]},{"tyyppi":"ansa","otsikko":"Ansa 1: kääntäen verrannollinen laskettiin suorana","sisalto":"Neljä kantajaa tyhjentää muuttoauton 3 tunnissa, ja auton vuokra on 25 € tunnilta. Paljonko vuokraa maksetaan, jos kantajia on kuusi? Houkutteleva verranto x / 3 h = 6 / 4 antaa ajaksi 4,5 h ja vuokraksi 4,5 · 25 € = 112,50 €. Kuusi kantajaa ei voi tarvita enemmän aikaa kuin neljä, joten tulos on väärä. Työn määrä pysyy samana: 4 · 3 h = 12 kantajatuntia, joten kuudelta kantajalta aikaa kuluu 12 kantajatuntia : 6 kantajaa = 2 h, ja vuokra on 2 · 25 € = 50 €. Oikea verranto, jossa toinen suhde on käännetty, on x / 3 h = 4 / 6. Kantajien määrä ja aika ovat kääntäen verrannolliset, aika ja vuokra suoraan verrannolliset. Virhe ensimmäisessä vaiheessa kulkeutuu kaikkiin seuraaviin. Sano siksi kummankin vaiheen verrannollisuus ääneen ennen kuin kirjoitat verrannon."},{"tyyppi":"ansa","otsikko":"Ansa 2: yksikkömuunnos väärin tai unohtui","sisalto":"Kartalla, jonka mittakaava on 1 : 15 000, reitti on 24 cm. Lasku 24 cm · 15 000 = 360 000 cm on oikein. Jos tästä tulee 36 km, senttimetrit on jaettu 10 000:lla eikä 100 000:lla. Senttimetreistä metreihin jaetaan 100:lla ja metreistä kilometreihin 1 000:lla: 360 000 cm = 3 600 m = 3,6 km. Kun 3,6 km kävellään keskinopeudella 5 km/h, laskin näyttää 0,72 h. Vastaus 72 min on väärä, koska tunnissa on 60 minuuttia eikä 100: 0,72 h = 0,72 · 60 min = 43,2 min. Kun kirjoitat yksikön jokaisen luvun perään, näet, missä yksikössä tulos on. Suuruusluokka paljastaa loput: 24 cm:n reitti suunnistuskartalla on muutamia kilometrejä, ei kymmeniä, ja alle 4 km:n kävely kestää alle tunnin."},{"tyyppi":"ansa","otsikko":"Ansa 3: seossuhde luettiin osuudeksi","sisalto":"Pesuainetiivistettä ja vettä sekoitetaan suhteessa 1 : 40, ja ämpäriin tehdään 5 litraa valmista liuosta. Lasku 5 000 ml : 40 = 125 ml on väärä. Suhde 1 : 40 tarkoittaa, että yhtä osaa tiivistettä kohden on 40 osaa vettä, joten valmiissa liuoksessa on 1 + 40 = 41 osaa. Yksi osa on 5 000 ml : 41 = 121,95… ml ≈ 122 ml, ja se on tiivisteen määrä. Verranto yksiköineen: x / 5 000 ml = 1 / 41. Tarkista: 122 ml tiivistettä ja 40 · 122 ml = 4 880 ml vettä ovat yhteensä 5 002 ml, mikä on pyöristyksen tarkkuudella 5 litraa. Jos tiivistettä olisi 125 ml ja vettä 40 kertaa enemmän, liuosta olisi 5 125 ml. Sama koskee muitakin seoksia, esimerkiksi laastia, jossa sementtiä ja hiekkaa on massojen suhteessa 1 : 4: sementtiä on kuivaseoksesta 1/5, ei 1/4."},{"tyyppi":"ansa","otsikko":"Ansa 4: kulutuksesta unohtui 100 km","sisalto":"Auto kuluttaa 6,4 litraa 100 kilometrillä. Paljonko polttoainetta kuluu 350 km:n matkalla? Lasku 6,4 · 350 = 2 240 litraa ei voi olla oikein, koska henkilöauton tankkiin mahtuu noin 50 litraa. Merkintä 6,4 l / 100 km tarkoittaa, että 6,4 litraa kuluu sataa kilometriä kohden, ei yhtä kilometriä kohden. Verranto yksiköineen: x / 350 km = 6,4 l / 100 km, josta x = 22,4 l. Kun kirjoitat verrantoon myös 100 km, sata ei unohdu. Tarkista suuruusluokka: 350 km on 3,5 kertaa 100 km, joten polttoainetta kuluu 3,5 kertaa 6,4 litraa eli vähän yli 20 litraa."},{"tyyppi":"ansa","otsikko":"Ansa 5: välitulos pyöristettiin liian aikaisin","sisalto":"Kahvia myydään 600 g:n pakkauksessa hintaan 4,60 € ja 250 g:n pakkauksessa hintaan 2,36 €. Kuinka monta senttiä kalliimpi 100 grammaa on pienemmässä pakkauksessa? Isossa pakkauksessa 100 g maksaa 4,60 € : 6 = 0,7666… € ja pienessä 2,36 € : 2,5 = 0,944 €. Ero on 0,1773… € eli 18 snt. Jos pyöristät yksikköhinnat ensin sentteihin (0,77 € ja 0,94 €), eroksi tulee 17 snt, mikä on väärin. Pyöristysvirheet kasautuvat, kun pyöristetyillä luvuilla lasketaan eteenpäin. Samoin johdannon pyöräretkellä 0,3666… h pyöristettynä 0,4 tuntiin antaisi 24 min eikä 22 min. Pidä välitulokset laskimen muistissa tai kirjoita niistä riittävästi desimaaleja, ja pyöristä vain lopputulos."}],"harjoitusryhmat":[{"id":"matka","nimi":"Kartalta matka-aikaan","info":"Laskin on sallittu. Kirjoita vihkoon verranto yksiköineen. Senttimetreistä kilometreihin jaetaan 100 000:lla, ja tunnit muunnetaan minuuteiksi kertomalla 60:llä. Anna vastaus ilman yksikköä."},{"id":"maara","nimi":"Seos, kulutus ja hinta","info":"Laskin on sallittu. Seossuhteessa 1 : n osia on yhteensä n + 1. Älä pyöristä välituloksia. Mieti lukumäärissä, pyöristetäänkö ylös vai alas. Anna vastaus ilman yksikköä."},{"id":"suunta","nimi":"Suora vai kääntäen ja järkevyys","info":"Laskin on sallittu. Päätä jokaisessa vaiheessa, onko verrannollisuus suora vai kääntäen, ja tarkista, muuttuiko tulos järkevään suuntaan. Anna vastaus ilman yksikköä."}],"harjoitukset":[{"id":"H01","ryhma":"matka","kysymys":"Suunnistuskartan mittakaava on 1 : 10 000. Reitin pituus kartalla on 34 cm. Kuinka pitkä reitti on maastossa? Anna vastaus kilometreinä ilman yksikköä.","vastaus":3.4,"vinkki":"Kerro 34 cm luvulla 10 000 ja muunna senttimetrit kilometreiksi jakamalla 100 000:lla.","selitys":"x / 34 cm = 10 000 / 1, josta x = 340 000 cm. 340 000 cm = 3 400 m = 3,4 km. Tämä on välivaihe: seuraavassa tehtävässä samasta reitistä lasketaan kävelyaika."},{"id":"H02","ryhma":"matka","kysymys":"Kävelet edellisen tehtävän reitin (34 cm kartalla, jonka mittakaava on 1 : 10 000) keskinopeudella 5 km/h. Kuinka monta minuuttia kävely kestää? Anna vastaus minuutin tarkkuudella ilman yksikköä.","vastaus":41,"vinkki":"Reitti on 3,4 km. Laske aika tunteina ja kerro se 60:llä.","selitys":"x / 3,4 km = 1 h / 5 km, josta x = 0,68 h. 0,68 · 60 min = 40,8 min ≈ 41 min. Vastaus 68 syntyy, jos tunnin desimaalit luetaan minuuteiksi."},{"id":"H03","ryhma":"matka","kysymys":"Tiekartan mittakaava on 1 : 1 000 000. Kahden kaupungin välinen tie on kartalla 19,5 cm pitkä. Bussi ajaa välin keskinopeudella 78 km/h. Kuinka monta minuuttia matka kestää? Anna vastaus ilman yksikköä.","vastaus":150,"vinkki":"Muunna ensin karttamatka kilometreiksi. Kartalla 1 cm on 10 km maastossa.","selitys":"19,5 cm · 1 000 000 = 19 500 000 cm = 195 km. x / 195 km = 1 h / 78 km, josta x = 2,5 h = 2,5 · 60 min = 150 min eli 2 h 30 min. Vastaus 170 syntyy, jos 2,5 h luetaan 2 tunniksi ja 50 minuutiksi."},{"id":"H04","ryhma":"matka","kysymys":"Suunnistuskartan mittakaava on 1 : 15 000. Reitti on kartalla 18 cm pitkä. Yhteen kilometriin kuluu sinulta keskimäärin 13 minuuttia. Kuinka monta minuuttia reitin kulkeminen kestää? Anna vastaus minuutin tarkkuudella ilman yksikköä.","vastaus":35,"vinkki":"Laske reitin pituus kilometreinä. Kun vauhti pysyy samana, aika ja matka ovat suoraan verrannolliset.","selitys":"18 cm · 15 000 = 270 000 cm = 2,7 km. x / 2,7 km = 13 min / 1 km, josta x = 35,1 min ≈ 35 min."},{"id":"H05","ryhma":"matka","kysymys":"Kävelet keskinopeudella 4,4 km/h, ja kävely kestää 45 minuuttia. Kuinka pitkä kävelty matka on kartalla, jonka mittakaava on 1 : 30 000? Anna vastaus senttimetreinä ilman yksikköä.","vastaus":11,"vinkki":"45 min on 0,75 h, ei 0,45 h. Laske matka kilometreinä ja muunna se senttimetreiksi.","selitys":"x / 0,75 h = 4,4 km / 1 h, josta x = 3,3 km = 330 000 cm. Kartalla matka on 330 000 cm : 30 000 = 11 cm. Vastaus 6,6 syntyy, jos 45 min kirjoitetaan 0,45 tunniksi."},{"id":"H06","ryhma":"matka","kysymys":"Juoksulenkin pituus on 23 cm kartalla, jonka mittakaava on 1 : 20 000. Lenkkiin kului 26 minuuttia. Mikä oli keskinopeutesi kilometreinä tunnissa? Anna vastaus kymmenesosan tarkkuudella ilman yksikköä.","vastaus":10.6,"vinkki":"Laske lenkin pituus kilometreinä. Keskinopeus on matka tuntia kohden, joten vertaa 26 minuuttia 60 minuuttiin.","selitys":"23 cm · 20 000 = 460 000 cm = 4,6 km. x / 60 min = 4,6 km / 26 min, josta x = 10,61… km ≈ 10,6 km. Keskinopeus on 10,6 km/h."},{"id":"H07","ryhma":"matka","kysymys":"Polku on 14 cm pitkä kartalla, jonka mittakaava on 1 : 20 000. Kuinka pitkä sama polku on kartalla, jonka mittakaava on 1 : 50 000? Anna vastaus senttimetreinä ilman yksikköä.","vastaus":5.6,"vinkki":"Laske ensin polun todellinen pituus. Mittakaavan 1 : 50 000 kartalla sama polku näkyy lyhyempänä.","selitys":"14 cm · 20 000 = 280 000 cm = 2,8 km. Uudella kartalla 280 000 cm : 50 000 = 5,6 cm. Mittakaavaluku ja kartalla näkyvä pituus ovat kääntäen verrannolliset: x / 14 cm = 20 000 / 50 000. Vastaus 35 syntyy, jos verranto kirjoitetaan suorana."},{"id":"H08","ryhma":"maara","kysymys":"Lattianpesuainetta ja vettä sekoitetaan suhteessa 1 : 25. Valmista liuosta tehdään 3 litraa. Montako millilitraa tiivistettä tarvitaan? Anna vastaus millilitran tarkkuudella ilman yksikköä.","vastaus":115,"vinkki":"Osia on 1 + 25 = 26. Muunna litrat millilitroiksi.","selitys":"x / 3 000 ml = 1 / 26, josta x = 115,38… ml ≈ 115 ml. Vastaus 120 syntyy, jos 3 000 ml jaetaan 25:llä."},{"id":"H09","ryhma":"maara","kysymys":"Edellisen tehtävän liuosta (suhde 1 : 25) tehdään sankoon 3 litraa kerrallaan. Tiivistepullossa on 1 litra tiivistettä. Montako täyttä sangollista liuosta pullosta riittää?","vastaus":8,"vinkki":"Laske ensin yhteen sangolliseen tarvittava tiivistemäärä. Montako sellaista määrää mahtuu 1 000 ml:aan?","selitys":"Yhteen sangolliseen tarvitaan 3 000 ml : 26 = 115,38… ml tiivistettä. 1 000 ml : 115,38… ml = 8,66…, joten täysiä sangollisia on 8. Yhdeksänteen tiiviste ei riitä, joten tulosta ei pyöristetä ylöspäin."},{"id":"H10","ryhma":"maara","kysymys":"Laastin kuivaseos tehdään sementistä ja hiekasta massojen suhteessa 1 : 4. Kuivaseosta tarvitaan 270 kg. Sementtiä myydään 25 kg:n säkeissä. Montako säkkiä sementtiä on ostettava?","vastaus":3,"vinkki":"Osia on 5. Laske sementin massa ja mieti, riittääkö kaksi säkkiä.","selitys":"Sementtiä tarvitaan 270 kg : 5 = 54 kg. 54 kg : 25 kg = 2,16, joten kaksi säkkiä (50 kg) ei riitä, ja säkkejä on ostettava 3. Vastaus 2 syntyy, jos tulos pyöristetään tavalliseen tapaan, vaikka tilanne vaatii pyöristämään ylöspäin."},{"id":"H11","ryhma":"maara","kysymys":"Auto kuluttaa 7,5 litraa polttoainetta 100 kilometrillä, ja polttoaine maksaa 1,84 € litralta. Paljonko 260 km:n matkan polttoaine maksaa? Anna vastaus euroina senttien tarkkuudella ilman yksikköä.","vastaus":35.88,"vinkki":"Laske ensin litrat verrannolla x / 260 km = 7,5 l / 100 km.","selitys":"Polttoainetta kuluu 7,5 l · 2,6 = 19,5 l, ja se maksaa 19,5 · 1,84 € = 35,88 €. Vastaus 3 588 syntyy, jos 100 km unohtuu."},{"id":"H12","ryhma":"maara","kysymys":"Mopoauton tankissa on 11 litraa polttoainetta. Mopoauto kuluttaa 3,8 litraa 100 kilometrillä. Ajat 160 km. Montako litraa polttoainetta tankkiin jää? Anna vastaus kymmenesosalitran tarkkuudella ilman yksikköä.","vastaus":4.9,"vinkki":"Laske ensin kulunut polttoaine ja vähennä se tankin määrästä.","selitys":"x / 160 km = 3,8 l / 100 km, josta x = 6,08 l. Tankkiin jää 11 l − 6,08 l = 4,92 l ≈ 4,9 l."},{"id":"H13","ryhma":"maara","kysymys":"Sinulla on 15 € polttoaineeseen. Polttoaine maksaa 1,90 € litralta, ja mopoauto kuluttaa 3,6 litraa 100 kilometrillä. Kuinka monta kilometriä voit ajaa tällä polttoaineella? Anna vastaus kilometrin tarkkuudella ilman yksikköä.","vastaus":219,"vinkki":"Laske ensin, montako litraa 15 eurolla saa. Kirjoita sitten verranto, jossa on 100 km ja 3,6 l.","selitys":"15 € : 1,90 € = 7,89… l. x / 7,89… l = 100 km / 3,6 l, josta x = 219,2… km ≈ 219 km. Pidä 7,89… laskimessa tarkkana."},{"id":"H14","ryhma":"maara","kysymys":"Juustoa myydään 750 g:n pakkauksessa hintaan 6,65 € ja 300 g:n pakkauksessa hintaan 3,16 €. Kuinka monta senttiä kalliimpi 100 grammaa on pienemmässä pakkauksessa? Anna vastaus sentin tarkkuudella ilman yksikköä.","vastaus":17,"vinkki":"Laske kummankin pakkauksen 100 gramman hinta. Älä pyöristä niitä ennen vähennyslaskua.","selitys":"Isossa pakkauksessa 100 g maksaa 6,65 € : 7,5 = 0,8866… € ja pienessä 3,16 € : 3 = 1,0533… €. Ero on 0,1666… € ≈ 17 snt. Jos yksikköhinnat pyöristetään ensin (0,89 € ja 1,05 €), eroksi tulee väärin 16 snt."},{"id":"H15","ryhma":"suunta","tyyppi":"monivalinta","vaihtoehdot":["Suoraan verrannollisuus, koska kantajien määrän ja ajan suhde pysyy samana.","Kääntäen verrannollisuus, koska kantajien määrän ja ajan tulo pysyy samana.","Ei kumpikaan, koska aika lyhenee yhtä paljon jokaista uutta kantajaa kohden."],"kysymys":"Viisi kantajaa tyhjentää muuttoauton 2 tunnissa. Kaikki kantavat yhtä nopeasti. Mikä on verrannollisuus kantajien määrän ja tyhjentämiseen kuluvan ajan välillä?","vastaus":1,"vinkki":"Jos kantajia on kaksi kertaa enemmän, kuinka pitkä aika kuluu?","selitys":"Työn määrä pysyy samana: 5 · 2 h = 10 kantajatuntia. Kun kantajien määrä kaksinkertaistuu, aika puolittuu. Tulo pysyy samana, joten verrannollisuus on kääntäen."},{"id":"H16","ryhma":"suunta","kysymys":"Edellisen tehtävän muuttoauton (viisi kantajaa, 2 tuntia) vuokra on 24 € tunnilta, ja vuokraa maksetaan tyhjentämiseen kuluvalta ajalta. Paljonko vuokra on, jos kantajia on neljä? Anna vastaus euroina ilman yksikköä.","vastaus":60,"vinkki":"Kantajia on vähemmän, joten aika pitenee. Laske ensin aika ja sitten vuokra.","selitys":"Työn määrä on 5 · 2 h = 10 kantajatuntia, joten neljältä kantajalta aikaa kuluu 10 : 4 = 2,5 h. Aika ja vuokra ovat suoraan verrannolliset: 2,5 · 24 € = 60 €. Vastaus 38,4 syntyy, jos aika lasketaan suorana (1,6 h)."},{"id":"H17","ryhma":"suunta","kysymys":"Kolme kesätyöntekijää haravoi puiston 8 tunnissa. Kaikki haravoivat yhtä nopeasti, ja jokaiselle maksetaan 10,50 € tunnilta. Paljonko yksi työntekijä ansaitsee haravoinnista, jos työntekijöitä on neljä? Anna vastaus euroina ilman yksikköä.","vastaus":63,"vinkki":"Ensin kääntäen verrannollinen vaihe: kuinka kauan neljältä kestää? Sitten suora vaihe: aika kertaa tuntipalkka.","selitys":"Työn määrä on 3 · 8 h = 24 työtuntia, joten neljältä aikaa kuluu 24 : 4 = 6 h. Yksi työntekijä ansaitsee 6 · 10,50 € = 63 €. Kun työntekijöitä on enemmän, kukin tekee lyhyemmän ajan ja ansaitsee vähemmän kuin kolmen hengen porukassa (84 €)."},{"id":"H18","ryhma":"suunta","kysymys":"Juna ajaa kahden kaupungin välin keskinopeudella 120 km/h, ja matka kestää 1 h 30 min. Kuinka monta minuuttia matka-aika lyhenee, jos keskinopeus on 150 km/h? Anna vastaus ilman yksikköä.","vastaus":18,"vinkki":"Matka pysyy samana, joten nopeus ja aika ovat kääntäen verrannolliset. Muunna aika minuuteiksi: 90 min.","selitys":"x / 90 min = 120 km/h / 150 km/h, josta x = 72 min. Matka-aika lyhenee 90 min − 72 min = 18 min. Vastaus 22,5 syntyy, jos aika lasketaan suorana (112,5 min). Silloin matka-aika pitenisi, mikä ei ole mahdollista suuremmalla nopeudella."},{"id":"H19","ryhma":"suunta","kysymys":"1. Kartalla, jonka mittakaava on 1 : 50 000, 6 cm:n matka on maastossa 30 km.\n2. Kun tiivistettä ja vettä sekoitetaan suhteessa 1 : 9, 2 litraan valmista liuosta tarvitaan 200 ml tiivistettä.\n3. Kun auto kuluttaa 8 litraa 100 kilometrillä, 250 km:n matkalla kuluu 20 litraa.\n4. Kun 3 kantajaa tyhjentää muuttoauton 4 tunnissa, 6 yhtä nopeaa kantajaa tyhjentää sen 8 tunnissa.\n\nMontako näistä neljästä väitteestä on oikein?","vastaus":2,"vinkki":"Laske jokainen väite itse. Tarkista erityisesti yksikkömuunnos, seoksen osien määrä ja muutoksen suunta.","selitys":"Väite 1 on väärä: 6 cm · 50 000 = 300 000 cm = 3 km. Väite 2 on oikein: osia on 10, ja 2 000 ml : 10 = 200 ml. Väite 3 on oikein: 8 l · 2,5 = 20 l. Väite 4 on väärä: useampi kantaja tarvitsee vähemmän aikaa, ja 3 · 4 h : 6 = 2 h."},{"id":"H20","ryhma":"suunta","kysymys":"Aleksi mittasi koulumatkansa kartalta, jonka mittakaava on 1 : 40 000. Matka on kartalla 7,5 cm. Aleksi laski, että koulumatka on 30 km ja että hän pyöräilee sen keskinopeudella 18 km/h ajassa 1 h 40 min. Mikä on oikea pyöräilyaika minuutteina? Anna vastaus ilman yksikköä.","vastaus":10,"vinkki":"Kartalla 1 cm on 40 000 cm eli 400 m maastossa. Voiko 7,5 cm olla 30 km?","selitys":"7,5 cm · 40 000 = 300 000 cm = 3 km, ei 30 km. x / 3 km = 1 h / 18 km, josta x = 0,1666… h = 10 min. Aleksi jakoi senttimetrit 10 000:lla eikä 100 000:lla."}],"valmis_teksti":"Osaat ratkaista monivaiheisen ongelman, jossa verranto on yksi välivaihe: lasket kartalta mitatusta matkasta matka-ajan, seossuhteesta tarvittavan määrän ja kulutuksesta tai yksikköhinnasta kustannuksen. Suunnittelet vaiheet ennen laskemista, kirjoitat suureet yksiköineen verrantoon, päättelet, onko verrannollisuus suora vai kääntäen, ja tarkistat lopuksi, että tulos on järkevä. Tämä taito on nyt näytetty."};

const esc = s => s;
const osat = D.teksti.map(o=>{

    case "johdanto":
      return `<p class="lead">${esc(o.sisalto)}</p>`;

      return `<div class="box warn"><h3>${esc(o.otsikko)}</h3><p style="margin:0">${esc(o.sisalto)}</p></div>`;
    case "muistilappu":
      return `<div class="box note"><h3>${esc(o.otsikko)}</h3><ul class="notes">${
        o.kohdat.map(k=>`<li>${esc(k)}</li>`).join("")}</ul></div>`;
    case "numerotaulu":
      return `<div class="box nt"><h3>${esc(o.otsikko)}</h3><p class="ohje">${esc(o.sisalto)}</p>

        <div class="nt-taulu" id="ntTaulu"></div>
        <p class="nt-selite" id="ntSelite"></p></div>`;

        <div class="vp-tasot">${o.tasot.map(t=>
          `<div class="vp-taso" data-taso="${t.id}"><span class="vp-pallo"></span>

        <div class="vp-rivi"><button type="button" class="btn ghost" id="vpSeuraava">Toinen lauseke</button>
        <span class="vp-vastaus" id="vpVastaus"></span></div></div>`;
    case "laskujarjestys":
      return `<div class="box lj"><h3>${esc(o.otsikko)}</h3><p style="margin:0 0 12px;font-size:14.5px;color:var(--ink-2)">${esc(o.sisalto)}</p>
        <div class="lj-exp" id="ljExp"></div>

        <div class="lj-row"><button type="button" class="btn ghost" id="ljSeuraava">Toinen lauseke</button>

const svg=document.getElementById("nlsvg"), rng=document.getElementById("nlrange"), out=document.getElementById("nlout");
const X0=34, X1=606, Y=62;
function piirraNL(v){
  const ala=Math.floor(v/10)*10, yla=ala+10, puoli=ala+5;
  const pyor = (v%10)>=5 ? yla : ala;
  const x = n => X0 + (n/100)*(X1-X0);
  let s=`<line class="rail" x1="${X0}" y1="${Y}" x2="${X1}" y2="${Y}"/>`;
  for(let n=0;n<=100;n+=10){
    const near = (n===ala||n===yla);
    s+=`<line class="tick" x1="${x(n)}" y1="${Y-7}" x2="${x(n)}" y2="${Y+7}"/>`;
    s+=`<text class="stop${near?" near":""}" x="${x(n)}" y="${Y+24}" text-anchor="middle">${n}</text>`;
  }
  s+=`<line class="halfway" x1="${x(puoli)}" y1="${Y-16}" x2="${x(puoli)}" y2="${Y+12}"/>`;
  s+=`<text class="stop" x="${x(puoli)}" y="${Y-22}" text-anchor="middle">puoliväli ${puoli}</text>`;
  s+=`<circle class="dot" cx="${x(v)}" cy="${Y}" r="6"/>`;
  s+=`<text class="val" x="${x(v)}" y="${Y-32}" text-anchor="middle">${v}</text>`;
  s+=`<path d="M ${x(v)} ${Y+38} L ${x(pyor)} ${Y+38}" stroke="var(--core)" stroke-width="2" fill="none"/>`;
  s+=`<path d="M ${x(pyor)} ${Y+38} l ${x(pyor)>x(v)?-7:7} -4 l 0 8 z" fill="var(--core)"/>`;
  svg.innerHTML=s;
  out.textContent = `${v} pyöristyy → ${pyor}`;
}

/* ---------- laskujärjestys-widget ---------- */
const ljExp=document.getElementById("ljExp");
if(ljExp && D.kokeilu){
  let ljI=0, ljTokens=[], ljStep=0;
  const laske=(a,op,b)=>{a=+a;b=+b;return op==="×"?a*b:op==="÷"?a/b:op==="+"?a+b:a-b;};
  function ljAlku(){
    const l=D.kokeilu[ljI];
    ljTokens=l.lauseke.replace(/\(/g,"( ").replace(/\)/g," )").split(/\s+/).filter(Boolean);
    ljStep=0; ljPiirra(); ljViesti("","");
  }
  function ljViesti(t,lk){const f=document.getElementById("ljFb"); f.textContent=t; f.className="lj-fb "+(lk||"");}
  function ljPiirra(){
    const l=D.kokeilu[ljI];
    document.getElementById("ljStep").textContent =
      ljStep>=l.askeleet.length ? "valmis" : `askel ${ljStep+1} / ${l.askeleet.length}`;
    if(ljStep>=l.askeleet.length){
      ljExp.innerHTML=`<span class="valmis">${l.lauseke} = ${l.vastaus}</span>`;
      return;
    }
    ljExp.innerHTML=ljTokens.map((t,i)=>
      "×÷+−".includes(t) ? `<button type="button" class="op" data-i="${i}">${t}</button>`
                         : `<span class="tok">${t}</span>`).join("");
    ljExp.querySelectorAll("button.op").forEach(b=>b.addEventListener("click",()=>ljKlikkaa(+b.dataset.i)));
  }
  function ljKlikkaa(i){
    const l=D.kokeilu[ljI], odotettu=l.askeleet[ljStep];
    const ehdotus=[ljTokens[i-1],ljTokens[i],ljTokens[i+1]].join(" ");
    if(ehdotus!==odotettu){
      ljViesti(ljStep===0
        ? "Ei vielä. Sulkeet ovat vahvimmat, sitten kerto ja jako. Yhtä vahvat vasemmalta oikealle."
        : "Ei vielä. Kumpi jäljellä olevista on vahvempi?", "no");
      return;
    }
    const arvo=laske(ljTokens[i-1],ljTokens[i],ljTokens[i+1]);
    let alku=i-1, loppu=i+1;
    if(ljTokens[i-2]==="(" && ljTokens[i+2]===")"){ alku=i-2; loppu=i+2; }
    ljTokens.splice(alku, loppu-alku+1, String(arvo));
    ljStep++;
    ljViesti(ljStep>=l.askeleet.length ? "Valmis. Vastaus on "+l.vastaus+"." : "Oikein. Jatka seuraavaan.", "ok");
    ljPiirra();
  }
  document.getElementById("ljSeuraava").addEventListener("click",()=>{
    ljI=(ljI+1)%D.kokeilu.length; ljAlku();
  });
  ljAlku();
}

/* Suomalainen lukumuoto: välilyönti on tuhaterotin, pilkku desimaalierotin.
   Piste voi olla kumpi tahansa. Se tulkitaan tuhaterottimeksi VAIN silloin, kun
   koko luku on aitoa tuhaterotinmuotoa: alkuosa 1–3 numeroa ilman etunollaa ja
   jokainen jatko-osa täsmälleen 3 numeroa (1.500, 12.345.678). Kaikissa muissa
   tapauksissa piste on desimaalipiste — myös 0.125, joka vanhalla säännöllä
   ("3 numeroa pisteen jäljessä = tuhaterotin") luettiin virheellisesti luvuksi 125. */
const TUHATEROTIN = /^[1-9]\d{0,2}(\.\d{3})+$/;
function lueLuku(teksti){
  // Murtoluku (3/4, -3/4) ja sekaluku (1 2/3, -1 2/3) hyväksytään sellaisinaan.
  const raaka = String(teksti).replace(/\u00a0/g, " ").trim();
  let m = raaka.match(/^(-?)(\d+)\s+(\d+)\s*\/\s*(\d+)$/);
  if(m){ const nim = Number(m[4]); if(nim === 0) return null;
    const v = Number(m[2]) + Number(m[3]) / nim; return m[1] ? -v : v; }
  m = raaka.match(/^(-?)\s*(\d+)\s*\/\s*(\d+)$/);
  if(m){ const nim = Number(m[3]); if(nim === 0) return null;
    const v = Number(m[2]) / nim; return m[1] ? -v : v; }
  let s = String(teksti).replace(/[\s\u00a0]/g, "");
  if(s === "") return null;
  if(s.indexOf(",") >= 0){
    s = s.replace(/\./g, "").replace(",", ".");
  } else if(TUHATEROTIN.test(s)){
    s = s.replace(/\./g, "");
  }
  const n = Number(s);
  return Number.isFinite(n) ? n : null;
}

function tarkista(id){
  const h=D.harjoitukset.find(x=>x.id===id);
  const kentta=document.getElementById("in-"+id);
  const fb=document.getElementById("fb-"+id);
  if(kentta.value.trim()===""){ fb.className="fb hint"; fb.textContent="Kirjoita vastaus ensin."; return; }
  const luku=lueLuku(kentta.value);
  if(luku===null){ fb.className="fb no"; fb.textContent="Vastauksen pitää olla luku tai murtoluku (esimerkiksi 3/4)."; return; }
  const oikein = Math.abs(luku - h.vastaus) < 1e-9;
  merkitseTulos(id, oikein, oikein ? "Oikein. "+h.selitys : `Ei vielä. ${h.vinkki} Kokeile uudelleen.`);
}

function tarkistaMonivalinta(id, valittuIndeksi, painike){
  const h=D.harjoitukset.find(x=>x.id===id);
  const rivi=painike.closest(".row");
  rivi.querySelectorAll(".mv-valinta").forEach(b=>b.disabled=true);
  const oikein = valittuIndeksi===h.vastaus;
  painike.classList.add(oikein?"mv-oikein":"mv-vaarin");
  if(!oikein){
    const oikeaBtn=rivi.querySelector(`[data-i="${h.vastaus}"]`);
    if(oikeaBtn) oikeaBtn.classList.add("mv-oikein");
  }
  merkitseTulos(id, oikein, oikein ? "Oikein. "+h.selitys : `Ei ihan. Oikea vastaus on korostettu. ${h.selitys||""}`);
}

/* Kuuntelu: selain lukee tekstin ääneen omalla puhesynteesillään (englanniksi, jos laitteessa on
   englanninkielinen ääni). Ei äänitiedostoja eikä verkkoyhteyttä. Jos laite ei osaa puhua,
   teksti näytetään luettavaksi — silloin tehtävä muuttuu luetun ymmärtämiseksi, mutta ei katkea. */
function puhu(id, nopeus){
  const h=D.harjoitukset.find(x=>x.id===id); if(!h || !h.kuuntele) return;
  const vara=document.getElementById("vara-"+id);
  const naytaTeksti=syy=>{ vara.hidden=false; vara.textContent=syy+" Teksti: "+h.kuuntele; };
  if(!("speechSynthesis" in window)){ naytaTeksti("Tämä laite ei osaa lukea ääneen."); return; }
  const s=window.speechSynthesis; s.cancel();
  const u=new SpeechSynthesisUtterance(h.kuuntele);
  u.lang=h.kieli||"en-GB"; u.rate=nopeus;
  const aanet=s.getVoices(), kieli=u.lang.slice(0,2);
  const aani=aanet.find(a=>a.lang===u.lang) || aanet.find(a=>a.lang && a.lang.startsWith(kieli));
  if(aani) u.voice=aani;
  else if(aanet.length) { naytaTeksti("Laitteessa ei ole englanninkielistä ääntä."); return; }
  u.onerror=()=>naytaTeksti("Ääneen lukeminen ei onnistunut.");
  s.speak(u);
}
