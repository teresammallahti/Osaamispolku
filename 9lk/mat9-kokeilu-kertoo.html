<title>Kokeilu kertoo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">

<style>
:root{
  --paper:#EFF2F5; --surface:#FFFFFF; --surface-2:#F7F9FB;
  --grid:#DCE3EA; --line:#C9D3DC;
  --ink:#15222C; --ink-2:#4E626F; --ink-3:#7E8F9B;
  --core:#1B5A9E; --core-soft:#E4EDF6;
  --strong:#1F6E5C; --strong-soft:#E1F0EB;
  --chal:#9A6A16; --chal-soft:#F6EDDC;
  --alert:#A33A2B; --alert-soft:#F8E7E3;
  --shadow:0 1px 2px rgba(21,34,44,.06), 0 8px 24px -12px rgba(21,34,44,.18);
  --r:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0F161B; --surface:#18222A; --surface-2:#1D2830;
    --grid:#22303A; --line:#2E3E4A;
    --ink:#E8EFF4; --ink-2:#A3B4C0; --ink-3:#7A8B97;
    --core:#7FB2E4; --core-soft:#16303F;
    --strong:#77CDB4; --strong-soft:#123028;
    --chal:#E0B267; --chal-soft:#33270F;
    --alert:#E8907F; --alert-soft:#3A1E19;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -14px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --paper:#0F161B; --surface:#18222A; --surface-2:#1D2830;
  --grid:#22303A; --line:#2E3E4A;
  --ink:#E8EFF4; --ink-2:#A3B4C0; --ink-3:#7A8B97;
  --core:#7FB2E4; --core-soft:#16303F;
  --strong:#77CDB4; --strong-soft:#123028;
  --chal:#E0B267; --chal-soft:#33270F;
  --alert:#E8907F; --alert-soft:#3A1E19;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -14px rgba(0,0,0,.7);
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:16px; line-height:1.62;
  background-image:
    linear-gradient(to right, var(--grid) 1px, transparent 1px),
    linear-gradient(to bottom, var(--grid) 1px, transparent 1px);
  background-size:26px 26px;
}
.wrap{max-width:760px; margin:0 auto; padding:28px 20px 90px}
h1,h2,h3,h4{font-family:"Familjen Grotesk","IBM Plex Sans",system-ui,sans-serif; text-wrap:balance}

/* header */
header.top{background:var(--surface); border:1px solid var(--line); border-radius:var(--r);
  box-shadow:var(--shadow); padding:22px 24px; display:flex; gap:18px; align-items:flex-start}
.badge{flex:0 0 auto; width:54px; height:54px; border-radius:9px; display:grid; place-items:center;
  background:var(--core-soft); border:1px solid var(--core); color:var(--core)}
.badge svg{width:28px; height:28px; fill:none; stroke:currentColor; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round}
.eyebrow{font-family:"IBM Plex Mono",monospace; font-size:11px; letter-spacing:.14em;
  text-transform:uppercase; color:var(--ink-3); margin:0 0 5px}
header.top h1{margin:0; font-size:30px; font-weight:700; letter-spacing:-.015em}
header.top p{margin:5px 0 0; color:var(--ink-2); font-size:15px}
.tags{display:flex; flex-wrap:wrap; gap:5px; margin-top:11px}
.tag{font-family:"IBM Plex Mono",monospace; font-size:10.5px; letter-spacing:.05em; padding:2px 7px;
  border-radius:4px; background:var(--surface-2); border:1px solid var(--line); color:var(--ink-3)}
.tag.core{background:var(--core-soft); border-color:var(--core); color:var(--core)}

/* teksti */
article{margin-top:26px}
article h2{font-size:21px; font-weight:600; margin:32px 0 10px; letter-spacing:-.01em}
article p{margin:0 0 14px; max-width:64ch}
.lead{font-size:17.5px; color:var(--ink); border-left:3px solid var(--core); padding-left:16px; margin:0 0 8px}

.box{background:var(--surface); border:1px solid var(--line); border-radius:var(--r);
  padding:18px 22px; box-shadow:var(--shadow); margin:22px 0}
.box h3{margin:0 0 12px; font-size:16.5px; font-weight:600}
.box.warn{border-left:3px solid var(--alert)}
.box.note{border-left:3px solid var(--chal)}

ol.steps{margin:0; padding-left:0; list-style:none; counter-reset:s; display:grid; gap:12px}
ol.steps li{counter-increment:s; display:grid; grid-template-columns:auto 1fr; gap:13px; align-items:start}
ol.steps li::before{content:counter(s); font-family:"Familjen Grotesk",sans-serif; font-weight:700; font-size:14px;
  width:26px; height:26px; border-radius:50%; background:var(--core); color:#fff; display:grid; place-items:center; margin-top:2px}

ul.notes{margin:0; padding-left:19px}
ul.notes li{margin-bottom:7px}
ul.notes li:last-child{margin-bottom:0}

.tablewrap{overflow-x:auto}
table{border-collapse:collapse; width:100%; font-size:14.5px; min-width:460px}
th,td{text-align:left; padding:9px 13px; border-bottom:1px solid var(--line)}
th{font-family:"IBM Plex Mono",monospace; font-size:10.5px; letter-spacing:.1em; text-transform:uppercase;
  color:var(--ink-3); font-weight:400; background:var(--surface-2)}
tr:last-child td{border-bottom:0}
td b{color:var(--core); font-weight:600}
td:last-child{font-variant-numeric:tabular-nums; font-weight:600}

/* lukusuora */
.nl svg{width:100%; height:118px; display:block}
.nl .rail{stroke:var(--line); stroke-width:2}
.nl .tick{stroke:var(--line); stroke-width:1.5}
.nl .stop{fill:var(--ink-3); font-family:"IBM Plex Mono",monospace; font-size:11px}
.nl .stop.near{fill:var(--core); font-weight:600}
.nl .dot{fill:var(--chal)}
.nl .val{fill:var(--ink); font-family:"Familjen Grotesk",sans-serif; font-size:15px; font-weight:700}
.nl .halfway{stroke:var(--chal); stroke-dasharray:3 3; stroke-width:1.5}
.nl-controls{display:flex; align-items:center; gap:14px; margin-top:6px}
.nl-controls input{flex:1; accent-color:var(--core)}
.nl-out{font-family:"Familjen Grotesk",sans-serif; font-size:15px; font-weight:600; min-width:12.5em; text-align:right}

/* paikka-arvotaulu */
.box .ohje{margin:0 0 14px; font-size:14.5px; color:var(--ink-2)}
.nt-valinta{display:flex; flex-wrap:wrap; gap:7px; margin-bottom:16px}
.nt-valinta button{font:inherit; font-size:12.5px; font-family:"IBM Plex Mono",monospace; padding:5px 11px;
  border-radius:6px; border:1px solid var(--line); background:var(--surface-2); color:var(--ink-2); cursor:pointer}
.nt-valinta button[aria-pressed="true"]{background:var(--ink); color:var(--paper); border-color:var(--ink)}
.nt-valinta button:focus-visible{outline:2px solid var(--core); outline-offset:2px}
.nt-taulu{display:flex; flex-direction:column; gap:4px; align-items:flex-start; overflow-x:auto; padding-bottom:4px}
.nt-rivi{display:flex; gap:6px; align-items:center}
.nt-rivi .otsa{font-family:"IBM Plex Mono",monospace; font-size:9.5px; letter-spacing:.08em;
  text-transform:uppercase; color:var(--ink-3); width:52px; text-align:center}
.nt-ruutu{width:52px; height:52px; display:grid; place-items:center; border:1.5px solid var(--line);
  border-radius:7px; background:var(--surface-2); font-family:"IBM Plex Mono",monospace; font-size:24px}
.nt-ruutu.kohta{border-color:var(--core); background:var(--core-soft); color:var(--core); font-weight:500}
.nt-ruutu.ratkaiseva{border-color:var(--chal); background:var(--chal-soft); color:var(--chal); font-weight:500}
.nt-ruutu.nolla{color:var(--ink-3)}
.nt-rivi .nimi{font-size:12.5px; color:var(--ink-3); margin-left:12px; white-space:nowrap}
.nt-nuoli{font-size:17px; color:var(--chal); margin-left:6px}
.nt-selite{margin:14px 0 0; font-size:14.5px}
.nt-selite b{color:var(--core)}

/* vahvuusportaat */
.vp-tasot{display:grid; gap:9px; margin-bottom:18px}
.vp-taso{display:flex; gap:11px; align-items:flex-start; font-size:13.5px}
.vp-taso .vp-pallo{width:13px; height:13px; border-radius:4px; margin-top:5px; flex:0 0 auto}
.vp-taso[data-taso="sulkeet"] .vp-pallo{background:var(--core)}
.vp-taso[data-taso="kertojako"] .vp-pallo{background:var(--strong)}
.vp-taso[data-taso="yhteenvahennys"] .vp-pallo{background:var(--chal)}
.vp-taso strong{display:block; font-family:"Familjen Grotesk",sans-serif; font-weight:600; font-size:14.5px}
.vp-taso span{color:var(--ink-2)}
.vp-lauseke{display:flex; flex-wrap:wrap; gap:7px; align-items:flex-end; font-family:"IBM Plex Mono",monospace;
  font-size:25px; padding:10px 2px; min-height:64px}
.vp-lauseke .t{padding:2px 3px}
.vp-lauseke .op{position:relative; padding:2px 9px; border-radius:6px; font-weight:500}
.vp-lauseke .op[data-taso="sulkeet"]{background:var(--core-soft); color:var(--core)}
.vp-lauseke .op[data-taso="kertojako"]{background:var(--strong-soft); color:var(--strong)}
.vp-lauseke .op[data-taso="yhteenvahennys"]{background:var(--chal-soft); color:var(--chal)}
.vp-lauseke .op i{position:absolute; top:-9px; right:-6px; font-style:normal; font-family:"Familjen Grotesk",sans-serif;
  font-size:11px; font-weight:700; width:18px; height:18px; border-radius:50%; display:grid; place-items:center;
  background:currentColor}
.vp-lauseke .op i span{color:var(--surface)}
.vp-rivi{display:flex; align-items:center; gap:16px; margin-top:8px}
.vp-vastaus{font-family:"Familjen Grotesk",sans-serif; font-size:16px; font-weight:600; color:var(--strong)}

/* laskujärjestys-widget */
.lj-exp{display:flex; flex-wrap:wrap; gap:7px; align-items:center; font-family:"IBM Plex Mono",monospace;
  font-size:23px; padding:14px 4px; min-height:62px}
.lj-exp .tok{padding:2px 4px; color:var(--ink)}
.lj-exp button.op{font-family:"IBM Plex Mono",monospace; font-size:23px; padding:3px 12px; border-radius:7px;
  border:1.5px solid var(--line); background:var(--surface-2); color:var(--ink); line-height:1.2}
.lj-exp button.op:hover{border-color:var(--core); color:var(--core)}
.lj-exp button.op:focus-visible{outline:2px solid var(--core); outline-offset:2px}
.lj-exp .valmis{font-family:"Familjen Grotesk",sans-serif; font-size:23px; font-weight:700; color:var(--strong)}
.lj-fb{font-size:14.5px; min-height:1.5em; color:var(--ink-2)}
.lj-fb.no{color:var(--alert)}
.lj-fb.ok{color:var(--strong)}
.lj-row{display:flex; align-items:center; gap:14px; margin-top:10px}
.lj-step{font-family:"IBM Plex Mono",monospace; font-size:11.5px; letter-spacing:.1em;
  text-transform:uppercase; color:var(--ink-3)}

/* harjoitukset */
.progress{position:sticky; top:0; z-index:5; background:var(--surface); border:1px solid var(--line);
  border-radius:var(--r); padding:12px 18px; box-shadow:var(--shadow); display:flex; align-items:center;
  gap:14px; margin:34px 0 18px}
.progress .lbl{font-family:"IBM Plex Mono",monospace; font-size:11px; letter-spacing:.12em;
  text-transform:uppercase; color:var(--ink-3); white-space:nowrap}
.progress .meter{flex:1; height:7px; border-radius:4px; background:var(--surface-2); border:1px solid var(--line); overflow:hidden}
.progress .meter i{display:block; height:100%; background:var(--core); transition:width .25s ease}
.progress .cnt{font-family:"Familjen Grotesk",sans-serif; font-weight:700; font-variant-numeric:tabular-nums; white-space:nowrap}

.grp{margin-top:26px}
.grp-head{display:flex; align-items:baseline; gap:10px; border-bottom:1.5px solid var(--ink); padding-bottom:7px; margin-bottom:14px}
.grp-head h3{margin:0; font-size:17px; font-weight:600}
.grp-head span{font-size:12.5px; color:var(--ink-2)}

.ex{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:14px 16px; margin-bottom:10px}
.ex[data-tila="oikein"]{border-color:var(--strong); box-shadow:inset 3px 0 0 var(--strong)}
.ex[data-tila="vaarin"]{border-color:var(--alert); box-shadow:inset 3px 0 0 var(--alert)}
.ex .q{display:flex; gap:11px; align-items:baseline; flex-wrap:wrap}
.ex .num{font-family:"IBM Plex Mono",monospace; font-size:11.5px; color:var(--ink-3); min-width:2.4em}
.ex .txt{flex:1; min-width:190px; font-size:15.5px}
.ex .txt .aineisto{display:block; margin-bottom:9px; padding-left:12px;
  border-left:2px solid var(--line); color:var(--ink-2); line-height:1.6;
  /* Aineisto voi olla pieni taulukko, jonka rivit on erotettu rivinvaihdoilla.
     Ilman pre-lineä ne valuisivat yhdeksi kappaleeksi ja taulukko katoaisi. */
  white-space:pre-line}
.ex .txt .kysymysrivi{display:block; font-weight:600}
.ex .row{display:flex; gap:8px; align-items:center; margin-top:11px; flex-wrap:wrap}
.ex input[type=text]{font:inherit; font-family:"IBM Plex Mono",monospace; font-size:15px; width:8.5em;
  padding:7px 11px; border:1px solid var(--line); border-radius:7px; background:var(--surface-2);
  color:var(--ink); text-align:right}
.ex input:focus-visible{outline:2px solid var(--core); outline-offset:1px}
button{font:inherit; cursor:pointer}
.btn{font-size:13.5px; padding:7px 15px; border-radius:7px; border:1px solid var(--core);
  background:var(--core); color:#fff}
.btn.ghost{background:transparent; color:var(--ink-2); border-color:var(--line)}
.btn:focus-visible{outline:2px solid var(--core); outline-offset:2px}
.btn.mv-valinta{text-align:left}
/* kuuntelutehtävä: selaimen puhesynteesi lukee englanninkielisen tekstin */
.kuuntele{display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin:2px 0 10px}
.kuuntele .btn{display:inline-flex; gap:7px; align-items:center}
.kuuntele svg{width:16px; height:16px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round}
.kuuntele .varateksti{flex-basis:100%; font-size:14px; color:var(--ink-2); background:var(--surface-2);
  border-radius:7px; padding:8px 12px; margin:0}
.btn.mv-valinta:disabled{cursor:default; opacity:.65}
.btn.mv-oikein{background:var(--strong-soft); border-color:var(--strong); color:var(--strong); opacity:1}
.btn.mv-vaarin{background:var(--alert-soft); border-color:var(--alert); color:var(--alert); opacity:1}
.row.mv{gap:8px 10px}
.fb{margin-top:11px; font-size:14.5px; padding:10px 13px; border-radius:8px; line-height:1.5}
.fb.ok{background:var(--strong-soft); color:var(--strong)}
.fb.no{background:var(--alert-soft); color:var(--alert)}
.fb.hint{background:var(--chal-soft); color:var(--chal)}

.done{background:var(--strong-soft); border:1px solid var(--strong); color:var(--strong);
  border-radius:var(--r); padding:16px 20px; margin-top:20px; font-size:15.5px}
.done h3{margin:0 0 4px; font-size:17px; color:var(--strong)}

details.teacher{margin-top:34px; background:var(--surface); border:1px solid var(--line);
  border-left:3px solid var(--chal); border-radius:var(--r); padding:15px 20px; box-shadow:var(--shadow)}
details.teacher summary{cursor:pointer; font-family:"Familjen Grotesk",sans-serif; font-weight:600; font-size:15px}
details.teacher summary:focus-visible{outline:2px solid var(--core); outline-offset:3px}
details.teacher ul{margin:12px 0 0; padding-left:19px; color:var(--ink-2); font-size:14.5px}
details.teacher li{margin-bottom:8px}
details.teacher p{margin:12px 0 0; color:var(--ink-2); font-size:14.5px}

.back{display:inline-block; margin-top:30px; font-size:13.5px; color:var(--ink-2)}
.back a{color:var(--core)}

@media (prefers-reduced-motion: reduce){*{transition:none !important}}
@media (max-width:560px){
  .wrap{padding:16px 13px 70px}
  header.top h1{font-size:25px}
  .progress{flex-wrap:wrap}
}
</style>

<div class="wrap">

  <header class="top">
    <span class="badge"><svg viewBox="0 0 24 24" aria-hidden="true" id="ikoni"></svg></span>
    <div>
      <p class="eyebrow" id="eyebrow"></p>
      <h1 id="otsikko"></h1>
      <p id="kuvaus"></p>
      <div class="tags" id="tags"></div>
    </div>
  </header>

  <article id="teksti"></article>

  <div class="progress" aria-live="polite">
    <span class="lbl">Harjoitukset</span>
    <span class="meter"><i id="pbar" style="width:0%"></i></span>
    <span class="cnt" id="pcnt">0 / 20</span>
  </div>

  <div id="harjoitukset"></div>
  <div id="valmis"></div>

  <p class="back" id="back"></p>

</div>

<script>
const D = {"tavoite_id":"MAT9-TIL-07","oppiaine":"MAT","vuosiluokka":9,"taso":"ydin","otsikko":"Kokeilu kertoo","kuvaus":"Osaan määrittää tilastollisen todennäköisyyden havainnoista ja verrata sitä klassiseen todennäköisyyteen.","versio":"0.2","paivitetty":"2026-10-11","ops":{"T":["T6","T8","T19"],"S":["S6"]},"ikoni":"kadet","eyebrow":"Matematiikka · 9. luokka · Tilastot ja todennäköisyys","teksti":[{"tyyppi":"johdanto","sisalto":"Lautapeli-illan jälkeen kaverisi väittää, että hänen noppansa antaa liikaa kuutosia. Toinen kaveri heittää nastaa pöydälle ja kysyy, jääkö se yhtä usein kärki ylöspäin kuin kyljelleen. Nopan kuutosen todennäköisyyden osaat laskea klassisesti: nopassa on kuusi yhtä todennäköistä tahkoa, ja niistä yksi on suotuisa, joten todennäköisyys on 1/6. Nastalle samaa laskua ei ole, koska sen kaksi asentoa eivät ole yhtä todennäköisiä. Silloin todennäköisyys selvitetään kokeilemalla: nastaa heitetään monta kertaa ja lasketaan, kuinka suuressa osassa heitoista kärki jäi ylöspäin. Samalla tavalla saat arvion siitä, kuinka usein bussi on myöhässä, kun katsot menneiden päivien tilastoa. Tässä taidossa lasket tilastollisen todennäköisyyden, vertaat sitä klassiseen todennäköisyyteen ja opit, miksi muutamasta heitosta ei voi vielä päätellä mitään varmaa."},{"tyyppi":"kappale","otsikko":"Tilastollinen todennäköisyys on suhteellinen frekvenssi","sisalto":"Kun sama satunnaiskoe tehdään monta kertaa samalla tavalla, puhutaan toistokokeesta. Jos tapahtuma A sattui f kertaa n toistossa, sen suhteellinen frekvenssi on f : n. Suhteellisen frekvenssin tunnet jo frekvenssitaulukosta: frekvenssi jaetaan havaintojen määrällä. Kun toistoja on paljon, suhteellista frekvenssiä käytetään tapahtuman todennäköisyyden arviona, ja sitä kutsutaan tilastolliseksi todennäköisyydeksi: P(A) ≈ f : n. Nastaa heitettiin 500 kertaa, ja kärki jäi ylöspäin 310 kertaa. Kärki ylöspäin -asennon tilastollinen todennäköisyys on 310 : 500 = 0,62 eli 62 %. Jakaja on kaikkien heittojen määrä, koska todennäköisyys kertoo, kuinka suuressa osassa kaikista heitoista tapahtuma sattuu. Siksi tulos on välillä 0–1: f ei voi olla suurempi kuin n. Aineisto voi olla myös tilasto. Jos koulubussi oli syksyllä myöhässä 12 koulupäivänä 80:stä, myöhästymisen tilastollinen todennäköisyys on 12 : 80 = 0,15 eli 15 %. Merkki ≈ muistuttaa, että tulos on arvio: uusi 500 heiton sarja antaisi hieman eri luvun.\nTilastollista todennäköisyyttä tarvitset kahdessa tilanteessa. Ensimmäinen on se, että alkeistapaukset eivät ole yhtä todennäköisiä tai niitä ei voi luetella. Nastan asento, voileivän putoaminen voipuoli alaspäin, bussin myöhästyminen ja syntyvän lapsen sukupuoli kuuluvat tähän. Poikia syntyy hieman enemmän kuin tyttöjä, joten tilastojen mukaan syntyvä lapsi on tyttö noin 49 %:n todennäköisyydellä eikä tasan 50 %:n. Toinen on klassisen todennäköisyyden tarkistaminen. Kolikko ja noppa ovat symmetrisiä, joten niiden alkeistapaukset ovat yhtä todennäköisiä, jos kappale on reilu. Jos epäilet, ettei noppa ole reilu, heität sitä satoja kertoja ja vertaat tilastollista todennäköisyyttä klassiseen."},{"tyyppi":"saanto","otsikko":"Näin lasket tilastollisen todennäköisyyden ja vertaat sitä klassiseen","askeleet":["Etsi tapahtuman esiintymiskertojen määrä f ja kaikkien toistojen tai havaintojen määrä n. Jos aineistossa on eri tulosten määrät erikseen, n on niiden summa. Kyselyssä 90 vastasi kyllä ja 60 ei, joten kyllä-vastauksille f = 90 ja n = 90 + 60 = 150.","Laske f : n ja tarkista, että tulos on välillä 0–1: 90 : 150 = 0,6. Jos tulos on yli 1, jakaja on väärä.","Muunna tulos siihen muotoon ja tarkkuuteen, jota tehtävä pyytää: 0,6 = 60 % = 3/5.","Laske klassinen todennäköisyys vain, kun alkeistapaukset ovat yhtä todennäköisiä. Luettele ne: nopalla silmäluvut 1, 2, 3, 4, 5 ja 6. Tapahtumalle ”silmäluku on 5 tai 6” suotuisia alkeistapauksia on kaksi, joten klassinen todennäköisyys on 2/6 = 1/3.","Vertaa kirjoittamalla molemmat samassa muodossa ja vähentämällä. Noppaa heitettiin 600 kertaa, ja kuutosia tuli 112. Tilastollinen todennäköisyys on 112 : 600 ≈ 0,187 eli 18,7 %, ja klassinen 1/6 ≈ 0,167 eli 16,7 %. Ero on 18,7 % − 16,7 % = 2,0 prosenttiyksikköä. Prosenttilukujen erotus on prosenttiyksikköjä, kuten kahdeksannella luokalla opit.","Katso lopuksi toistojen määrä. Jos toistoja on vain muutama, suhteellinen frekvenssi voi olla kaukana todellisesta todennäköisyydestä, eikä siitä voi tehdä johtopäätöksiä."]},{"tyyppi":"kappale","otsikko":"Miksi tulos tarkentuu, kun toistoja on enemmän","sisalto":"Ajattele yhtä heittoa. Viiden heiton sarjassa yksi heitto on 1/5 eli 20 % kaikista heitoista. Jos yksi heitoista, joka ei ollut kuutonen, olisikin ollut kuutonen, kuutosten suhteellinen frekvenssi muuttuisi 20 prosenttiyksikköä. 500 heiton sarjassa yksi heitto on 1/500 eli 0,2 % heitoista, ja sama muutos siirtäisi suhteellista frekvenssiä vain 0,2 prosenttiyksikköä. Sattuma tuottaa välillä poikkeavia tuloksia, mutta mitä suurempi n on, sitä vähemmän yksittäinen poikkeava tulos painaa. Siksi suhteellisen frekvenssin vaihtelu pienenee, kun toistoja tulee lisää, ja suurella toistomäärällä tulos on tyypillisesti lähellä klassista todennäköisyyttä. Myös alun poikkeama laimenee: uudet heitot noudattavat samaa todennäköisyyttä kuin alussakin, joten kun niitä tulee satoja, alun muutaman heiton osuus koko sarjasta on pieni, vaikka yksikään heitto ei korjaa aiempia. Tyypillisesti ei tarkoita tasan eikä joka heitolla lähemmäs. Seuraavassa taulukossa suhteellinen frekvenssi on 50 heiton kohdalla kauempana luvusta 0,5 kuin 20 heiton kohdalla, ja 1000 heitosta tuli 491 kruunaa eikä 500.\nKolikko ei muista aiempia heittoja. Seuraavan heiton todennäköisyys on sama 1/2 riippumatta siitä, mitä aiemmin tuli. Suhteellinen frekvenssi tasoittuu siksi, että uusia heittoja tulee paljon ja yksittäisten heittojen paino pienenee, ei siksi, että kolikko korjaisi aiempia tuloksiaan. Todennäköisyydestä voit myös arvioida, montako kertaa tapahtuma sattuu: kun noppaa heitetään 600 kertaa, kuutosia voi odottaa noin 1/6 · 600 = 100. Todellinen määrä vaihtelee, kuten edellisen säännön 112 kuutosta näyttävät."},{"tyyppi":"taulukko","otsikko":"Kolikon kruunat kertyvät heitto heitolta","otsikkorivi":["Heittoja yhteensä","Kruunia yhteensä","Suhteellinen frekvenssi","Ero klassiseen todennäköisyyteen 0,5"],"rivit":[["10","4","4 : 10 = 0,40","0,10"],["20","11","11 : 20 = 0,55","0,05"],["50","22","22 : 50 = 0,44","0,06"],["200","104","104 : 200 = 0,52","0,02"],["1 000","491","491 : 1 000 = 0,491","0,009"]]},{"tyyppi":"ansa","otsikko":"Ansa 1: jakajana muut tulokset","sisalto":"Nastaa heitettiin 500 kertaa: kärki jäi ylöspäin 310 kertaa ja kyljelleen 190 kertaa. Lasku 310 : 190 ≈ 1,63 on väärin, koska kärki ylöspäin -asentoa verrataan kaikkiin heittoihin eikä toiseen asentoon. Tulos yli 1 paljastaa virheen, sillä todennäköisyys on välillä 0–1. Väärin päin jakaminen 500 : 310 ≈ 1,61 paljastuu samalla tavalla. Oikein on 310 : 500 = 0,62. Kun aineistossa on tulosten määrät erikseen, laske ensin niiden summa: se on n."},{"tyyppi":"ansa","otsikko":"Ansa 2: kolikko ei muista","sisalto":"Kolikolla on tullut kuusi kruunaa peräkkäin. Houkuttaa ajatella, että nyt on klaavan vuoro. Se on väärin: kolikko ei muista aiempia heittoja, ja klaavan todennäköisyys seuraavalla heitolla on edelleen 1/2. Kuuden kruunan sarja on harvinainen, mutta se on jo tapahtunut, eikä se muuta seuraavaa heittoa. Sama koskee noppaa: vaikka kuutosta ei olisi tullut pitkään aikaan, kuutosen todennäköisyys seuraavalla heitolla on 1/6. Tätä virhepäätelmää kutsutaan pelurin harhaksi."},{"tyyppi":"ansa","otsikko":"Ansa 3: sattuman vaihtelu luetaan todisteeksi","sisalto":"Heität noppaa kuusi kertaa ja saat kaksi kuutosta. Suhteellinen frekvenssi 2 : 6 ≈ 0,33 on kaksinkertainen klassiseen todennäköisyyteen 1/6 ≈ 0,17 verrattuna, mutta siitä ei voi päätellä, että noppa suosii kuutosta. Kuuden heiton sarjassa yksi heitto muuttaa suhteellista frekvenssiä noin 17 prosenttiyksikköä, joten sattuma heiluttaa tulosta paljon. Johtopäätökseen tarvitaan satoja heittoja. Sama virhe tehdään myös toiseen suuntaan: kun 1000 heitosta tuli 491 kruunaa, kolikko ei ole sen takia vino. Satunnaisessa kokeessa ei odoteta tasan 500 kruunaa, ja ero 0,5 − 0,491 = 0,009 on pieni."},{"tyyppi":"ansa","otsikko":"Ansa 4: klassinen todennäköisyys väärässä tilanteessa","sisalto":"Nastalla on kaksi asentoa, kärki ylöspäin ja kyljellään. Päätelmä ”todennäköisyys on 1/2, koska vaihtoehtoja on kaksi” on väärin, koska asennot eivät ole yhtä todennäköisiä: nasta ei ole symmetrinen kuten kolikko. Toistokokeen mukaan kärki ylöspäin -asennon todennäköisyys on noin 0,62. Ennen kuin lasket suotuisat per kaikki, kysy itseltäsi, onko jokainen alkeistapaus yhtä todennäköinen. Jos ei ole tai et tiedä, tarvitset toistokokeen tai tilaston."},{"tyyppi":"ansa","otsikko":"Ansa 5: väli kertyvästä taulukosta","sisalto":"Taulukon kruunat ovat kertyviä: 200 heiton kohdalla luku 104 sisältää myös 50 ensimmäisen heiton 22 kruunaa. Jos haluat suhteellisen frekvenssin pelkästään heitoille 51–200, laske sekä kruunat että heitot tältä väliltä: kruunia tuli 104 − 22 = 82 ja heittoja oli 200 − 50 = 150, joten suhteellinen frekvenssi on 82 : 150 ≈ 0,547. Lasku 82 : 200 = 0,41 on väärin, koska siinä välin kruunat jaetaan kaikkien heittojen määrällä. Kun kysytään suhteellista frekvenssiä 200 heiton jälkeen, käytä molempia kertyviä lukuja: 104 : 200 = 0,52."}],"harjoitusryhmat":[{"id":"laskeminen","nimi":"Tilastollinen todennäköisyys","info":"Tilastollinen todennäköisyys on suhteellinen frekvenssi f : n. f on tapahtuman esiintymiskertojen määrä ja n kaikkien toistojen tai havaintojen määrä. Tarkista, että tulos on välillä 0–1. Laskin on sallittu."},{"id":"vertailu","nimi":"Vertailu klassiseen todennäköisyyteen","info":"Klassinen todennäköisyys on suotuisten alkeistapausten määrä jaettuna kaikkien määrällä, kun alkeistapaukset ovat yhtä todennäköisiä. Prosenttilukujen erotus on prosenttiyksikköjä. Laskin on sallittu."},{"id":"toistot","nimi":"Toistojen määrä","info":"Mitä enemmän toistoja, sitä vähemmän yksi heitto muuttaa suhteellista frekvenssiä. Kertyvässä taulukossa välin tulokset ja heitot lasketaan erotuksina. Laskin on sallittu."}],"harjoitukset":[{"id":"H01","ryhma":"laskeminen","kysymys":"Pyyhekumia heitettiin 240 kertaa, ja se jäi lappeelleen 160 kertaa.\n\nMikä on lappeelleen jäämisen tilastollinen todennäköisyys? Anna vastaus desimaalilukuna kahden desimaalin tarkkuudella.","vastaus":0.67,"vinkki":"Jaa lappeelleen jääntien määrä kaikkien heittojen määrällä.","selitys":"160 : 240 ≈ 0,667 ≈ 0,67. Jakaja on kaikkien heittojen määrä 240. Vastaus 2 syntyy, jos jaetaan muiden asentojen määrällä 80 (ansa 1)."},{"id":"H02","ryhma":"laskeminen","kysymys":"Koulun kyselyssä kysyttiin, montako kertaa viikossa vastaaja pelaa lautapelejä. Jokainen vastaaja valitsi yhden vaihtoehdon.\n0 kertaa: 64 vastaajaa\n1–2 kertaa: 80 vastaajaa\n3–4 kertaa: 38 vastaajaa\n5 kertaa tai enemmän: 18 vastaajaa\n\nMikä on tilastollinen todennäköisyys, että satunnaisesti valittu vastaaja pelaa lautapelejä vähintään 3 kertaa viikossa? Anna vastaus desimaalilukuna kahden desimaalin tarkkuudella.","vastaus":0.28,"vinkki":"Laske ensin vastaajien määrä frekvenssien summana. Vähintään 3 kertaa tarkoittaa kahta viimeistä luokkaa.","selitys":"Vastaajia oli 64 + 80 + 38 + 18 = 200, ja vähintään 3 kertaa pelaa 38 + 18 = 56. 56 : 200 = 0,28. Vastaus 0,19 syntyy, jos otetaan vain luokka 3–4 kertaa."},{"id":"H03","ryhma":"laskeminen","kysymys":"Sääaseman tilaston mukaan 200 syysaamusta 35 oli sumuisia.\n\nMikä on tämän tilaston perusteella tilastollinen todennäköisyys, että syysaamu on sumuinen? Anna vastaus supistettuna murtolukuna.","vastaus":0.175,"vinkki":"Kirjoita ensin murtoluku 35/200 ja supista se.","selitys":"35/200 = 7/40, kun osoittaja ja nimittäjä jaetaan viidellä. Desimaalilukuna se on 0,175."},{"id":"H04","ryhma":"laskeminen","kysymys":"Nastaa heitettiin 300 kertaa. Kärki jäi ylöspäin 186 kertaa ja kyljelleen 114 kertaa.\n\nMillä laskulla saat kärki ylöspäin -asennon tilastollisen todennäköisyyden?","tyyppi":"monivalinta","vaihtoehdot":["186 : 114","186 : 300","114 : 300"],"vastaus":1,"vinkki":"Todennäköisyys kertoo, kuinka suuressa osassa kaikista heitoista tapahtuma sattui.","selitys":"186 : 300 = 0,62. Lasku 186 : 114 ≈ 1,63 antaa yli 1, joten jakaja on väärä (ansa 1). Lasku 114 : 300 on kyljelleen jäämisen todennäköisyys."},{"id":"H05","ryhma":"laskeminen","kysymys":"Koulun kyselyssä kysyttiin, pitäisikö koulupäivän alkaa myöhemmin. Kyllä vastasi 126 ja ei 74. Jokainen vastasi joko kyllä tai ei.\n\nMikä on tilastollinen todennäköisyys, että satunnaisesti valittu vastaaja vastasi kyllä? Anna vastaus desimaalilukuna.","vastaus":0.63,"vinkki":"Laske ensin, montako vastaajaa oli yhteensä.","selitys":"Vastaajia oli 126 + 74 = 200, joten 126 : 200 = 0,63. Vastaus noin 1,70 syntyy jakamalla ei-vastausten määrällä (126 : 74), ja se on yli 1."},{"id":"H06","ryhma":"laskeminen","kysymys":"Noppaa heitettiin, ja tulokset kirjattiin.\nSilmäluku 1: 47 kertaa\nSilmäluku 2: 56 kertaa\nSilmäluku 3: 49 kertaa\nSilmäluku 4: 52 kertaa\nSilmäluku 5: 46 kertaa\nSilmäluku 6: 50 kertaa\n\nMikä on tilastollinen todennäköisyys, että silmäluku on enintään 2? Anna vastaus prosentteina ilman %-merkkiä kymmenesosan tarkkuudella.","vastaus":34.3,"vinkki":"Laske heittojen kokonaismäärä frekvenssien summana. Enintään 2 tarkoittaa silmälukuja 1 ja 2.","selitys":"Heittoja oli 47 + 56 + 49 + 52 + 46 + 50 = 300. Silmäluku 1 tai 2 tuli 47 + 56 = 103 kertaa. 103 : 300 ≈ 0,3433 eli 34,3 %."},{"id":"H07","ryhma":"laskeminen","kysymys":"Neljä oppilasta heitti kukin omaa samanlaista pahvimukia ja laski, millä todennäköisyydellä muki jää suulleen. Todennäköisyydet on pyöristetty kahden desimaalin tarkkuudella.\nRivi 1: 40 heittoa, joista 10 suulleen, todennäköisyys 0,25\nRivi 2: 120 heittoa, joista 32 suulleen, todennäköisyys 0,27\nRivi 3: 300 heittoa, joista 69 suulleen, todennäköisyys 0,30\nRivi 4: 250 heittoa, joista 61 suulleen, todennäköisyys 0,24\n\nMonennellako rivillä on laskuvirhe?","vastaus":3,"vinkki":"Laske jokaiselta riviltä suulleen jääntien määrä jaettuna heittojen määrällä.","selitys":"69 : 300 = 0,23, ei 0,30. Luku 0,30 syntyy laskulla 69 : 231 ≈ 0,299, jossa jakajana on muiden asentojen määrä 300 − 69 = 231 (ansa 1). Muut rivit: 10 : 40 = 0,25, 32 : 120 ≈ 0,27 ja 61 : 250 ≈ 0,24."},{"id":"H08","ryhma":"vertailu","kysymys":"Noppaa heitettiin 420 kertaa, ja kolmosia tuli 81.\n\nKuinka monta prosenttiyksikköä silmäluvun 3 tilastollinen todennäköisyys poikkeaa klassisesta todennäköisyydestä? Anna vastaus kymmenesosan tarkkuudella.","vastaus":2.6,"vinkki":"Laske molemmat todennäköisyydet prosentteina ja vähennä pienempi suuremmasta.","selitys":"Tilastollinen 81 : 420 ≈ 0,1929 eli 19,29 % ja klassinen 1/6 ≈ 0,1667 eli 16,67 %. Ero on noin 2,6 prosenttiyksikköä. Pidä välitulokset laskimessa tarkkoina ja pyöristä vasta ero."},{"id":"H09","ryhma":"vertailu","kysymys":"Noppaa heitettiin 360 kertaa, ja silmäluku oli 1 tai 2 yhteensä 133 kertaa.\n\nKuinka monta prosenttiyksikköä tapahtuman ”silmäluku on 1 tai 2” tilastollinen todennäköisyys poikkeaa klassisesta todennäköisyydestä? Anna vastaus kymmenesosan tarkkuudella.","vastaus":3.6,"vinkki":"Suotuisia alkeistapauksia on kaksi, joten klassinen todennäköisyys on 2/6.","selitys":"Tilastollinen 133 : 360 ≈ 0,3694 eli 36,94 % ja klassinen 2/6 = 1/3 ≈ 0,3333 eli 33,33 %. Ero on noin 3,6 prosenttiyksikköä. Jos klassiseksi todennäköisyydeksi ottaa 1/6, saa väärän vastauksen noin 20,3."},{"id":"H10","ryhma":"vertailu","kysymys":"Nopalla heitetään 1 200 kertaa.\n\nMontako kertaa voi odottaa saavansa silmäluvun 6?","vastaus":200.0,"vinkki":"Kerro heittojen määrä klassisella todennäköisyydellä.","selitys":"1/6 · 1 200 = 200. Todellinen määrä vaihtelee, eikä tasan 200 kuutosta tarvitse tulla."},{"id":"H11","ryhma":"vertailu","kysymys":"Voileipä putosi pöydältä voipuoli alaspäin 62 kertaa 100 pudotuksesta.\n\nMontako kertaa voileivän voi odottaa putoavan voipuoli alaspäin 450 pudotuksessa?","vastaus":279.0,"vinkki":"Laske ensin tilastollinen todennäköisyys ja kerro sillä pudotusten määrä.","selitys":"62 : 100 = 0,62 ja 0,62 · 450 = 279. Klassista todennäköisyyttä 1/2 ei voi käyttää, koska voipuoli tekee voileivästä epäsymmetrisen (ansa 4)."},{"id":"H12","ryhma":"vertailu","kysymys":"Missä tilanteessa voit laskea todennäköisyyden klassisesti jakamalla suotuisten alkeistapausten määrän kaikkien alkeistapausten määrällä?","tyyppi":"monivalinta","vaihtoehdot":["Nasta jää kärki ylöspäin.","Nopan silmäluku on 4.","Bussi on huomenna myöhässä."],"vastaus":1,"vinkki":"Klassinen todennäköisyys vaatii, että alkeistapaukset ovat yhtä todennäköisiä.","selitys":"Nopan tahkot ovat yhtä todennäköisiä, joten silmäluvun 4 todennäköisyys on 1/6. Nastan asennot eivät ole yhtä todennäköisiä, eikä bussin myöhästymisellä ole yhtä todennäköisiä alkeistapauksia, joten niihin tarvitaan toistokoe tai tilasto."},{"id":"H13","ryhma":"vertailu","kysymys":"Kolikolla on tullut neljä klaavaa peräkkäin.\n\nMikä on todennäköisyys, että viides heitto on kruuna? Anna vastaus desimaalilukuna.","vastaus":0.5,"vinkki":"Muistaako kolikko, mitä aiemmin tuli?","selitys":"Todennäköisyys on 1/2 = 0,5. Kolikko ei muista aiempia heittoja, joten kruuna ei ole yhtään todennäköisempi kuin tavallisesti (ansa 2)."},{"id":"H14","ryhma":"toistot","kysymys":"Kolikkoa heitettiin, ja kruunien määrä kirjattiin yhteensä aina tietyn heittomäärän jälkeen.\n10 heittoa: 6 kruunaa\n40 heittoa: 19 kruunaa\n100 heittoa: 53 kruunaa\n400 heittoa: 206 kruunaa\n\nMikä on kruunan suhteellinen frekvenssi 400 heiton jälkeen? Anna vastaus desimaalilukuna.","vastaus":0.515,"vinkki":"Kruunat ovat kertyviä, joten 400 heiton kohdalla on kaikkien heittojen kruunat.","selitys":"206 : 400 = 0,515. Luku on lähellä klassista todennäköisyyttä 0,5, mutta ei tasan sama."},{"id":"H15","ryhma":"toistot","kysymys":"Kolikkoa heitettiin, ja kruunien määrä kirjattiin yhteensä aina tietyn heittomäärän jälkeen.\n10 heittoa: 6 kruunaa\n40 heittoa: 19 kruunaa\n100 heittoa: 53 kruunaa\n400 heittoa: 206 kruunaa\n\nMikä on kruunan suhteellinen frekvenssi heitoissa 101–400 eli pelkästään näiden heittojen joukossa? Anna vastaus desimaalilukuna.","vastaus":0.51,"vinkki":"Laske välin kruunat ja välin heitot erotuksina.","selitys":"Välillä tuli 206 − 53 = 153 kruunaa ja heittoja oli 400 − 100 = 300. 153 : 300 = 0,51. Vastaus 0,3825 syntyy jakamalla 153 kaikkien heittojen määrällä 400 (ansa 5)."},{"id":"H16","ryhma":"toistot","kysymys":"Noppaa on heitetty 4 kertaa. Ajattele, että yksi heitoista, joka ei ollut kuutonen, olisikin ollut kuutonen.\n\nKuinka monta prosenttiyksikköä kuutosten suhteellinen frekvenssi silloin kasvaisi?","vastaus":25.0,"vinkki":"Kuinka suuri osa kaikista heitoista yksi heitto on?","selitys":"Yksi heitto on 1/4 = 25 % neljästä heitosta, joten kuutosten osuus kasvaisi 25 prosenttiyksikköä. Näin pienessä sarjassa yksi heitto heiluttaa tulosta paljon."},{"id":"H17","ryhma":"toistot","kysymys":"Noppaa on heitetty 250 kertaa. Ajattele, että yksi heitoista, joka ei ollut kuutonen, olisikin ollut kuutonen.\n\nKuinka monta prosenttiyksikköä kuutosten suhteellinen frekvenssi silloin kasvaisi?","vastaus":0.4,"vinkki":"Kuinka suuri osa kaikista heitoista yksi heitto on?","selitys":"Yksi heitto on 1/250 = 0,004 = 0,4 % heitoista, joten muutos on 0,4 prosenttiyksikköä. Vertaa edelliseen tehtävään: mitä enemmän heittoja, sitä vähemmän yksi heitto painaa."},{"id":"H18","ryhma":"toistot","kysymys":"Iida heitti kolikkoa 12 kertaa ja sai 9 kruunaa.\n\nKuinka monta prosenttiyksikköä kruunan tilastollinen todennäköisyys poikkeaa klassisesta todennäköisyydestä?","vastaus":25.0,"vinkki":"Laske 9 : 12 prosentteina ja vertaa lukuun 50 %.","selitys":"9 : 12 = 0,75 = 75 % ja klassinen todennäköisyys on 50 %. Ero on 25 prosenttiyksikköä. Ero on suuri, mutta 12 heitosta ei voi päätellä, että kolikko on vino."},{"id":"H19","ryhma":"toistot","kysymys":"Ville heitti noppaa 6 kertaa ja sai 3 kuutosta.\n\nMikä päätelmä on perusteltu?","tyyppi":"monivalinta","vaihtoehdot":["Noppa suosii kuutosta, koska 3/6 on paljon enemmän kuin 1/6.","Kuudesta heitosta ei voi päätellä, suosiiko noppa kuutosta, koska yksi heitto muuttaa osuutta noin 17 prosenttiyksikköä.","Noppa on varmasti reilu, koska kaikki nopat ovat reiluja."],"vastaus":1,"vinkki":"Kuinka paljon yksi heitto muuttaa osuutta kuuden heiton sarjassa?","selitys":"3 : 6 = 0,5 on paljon enemmän kuin 1/6 ≈ 0,17, mutta kuuden heiton sarjassa yksi heitto muuttaa osuutta noin 17 prosenttiyksikköä. Johtopäätökseen tarvitaan satoja heittoja (ansa 3). Väite ”kaikki nopat ovat reiluja” ei perustu lukuihin."},{"id":"H20","ryhma":"toistot","kysymys":"Kolikkoa heitettiin 1 000 kertaa, ja kruunia tuli 512.\n\nKuinka monta prosenttiyksikköä kruunan tilastollinen todennäköisyys poikkeaa klassisesta todennäköisyydestä?","vastaus":1.2,"vinkki":"Laske 512 : 1 000 prosentteina ja vertaa lukuun 50 %.","selitys":"512 : 1 000 = 0,512 = 51,2 %, joten ero on 1,2 prosenttiyksikköä. Tuhannesta heitosta ei tarvitse tulla tasan 500 kruunaa, ja näin pieni ero on tavallinen reilullakin kolikolla (ansa 3)."}],"valmis_teksti":"Osaat laskea tilastollisen todennäköisyyden toistokokeen tuloksista tai tilastosta suhteellisena frekvenssinä f : n ja verrata sitä klassiseen todennäköisyyteen prosenttiyksikköinä. Tiedät, milloin klassista todennäköisyyttä ei voi käyttää, ja osaat selittää, miksi tulos tarkentuu toistojen kasvaessa ja miksi muutamasta toistosta ei voi tehdä johtopäätöksiä. Tämä taito on nyt näytetty."};

const svg=document.getElementById("nlsvg"), rng=document.getElementById("nlrange"), out=document.getElementById("nlout");
const X0=34, X1=606, Y=62;
function piirraNL(v){
  const ala=Math.floor(v/10)*10, yla=ala+10, puoli=ala+5;
  const pyor = (v%10)>=5 ? yla : ala;
  const x = n => X0 + (n/100)*(X1-X0);
  let s=`<line class="rail" x1="${X0}" y1="${Y}" x2="${X1}" y2="${Y}"/>`;
  for(let n=0;n<=100;n+=10){
    const near = (n===ala||n===yla);
    s+=`<line class="tick" x1="${x(n)}" y1="${Y-7}" x2="${x(n)}" y2="${Y+7}"/>`;
    s+=`<text class="stop${near?" near":""}" x="${x(n)}" y="${Y+24}" text-anchor="middle">${n}</text>`;
  }
  s+=`<line class="halfway" x1="${x(puoli)}" y1="${Y-16}" x2="${x(puoli)}" y2="${Y+12}"/>`;
  s+=`<text class="stop" x="${x(puoli)}" y="${Y-22}" text-anchor="middle">puoliväli ${puoli}</text>`;
  s+=`<circle class="dot" cx="${x(v)}" cy="${Y}" r="6"/>`;
  s+=`<text class="val" x="${x(v)}" y="${Y-32}" text-anchor="middle">${v}</text>`;
  s+=`<path d="M ${x(v)} ${Y+38} L ${x(pyor)} ${Y+38}" stroke="var(--core)" stroke-width="2" fill="none"/>`;
  s+=`<path d="M ${x(pyor)} ${Y+38} l ${x(pyor)>x(v)?-7:7} -4 l 0 8 z" fill="var(--core)"/>`;
  svg.innerHTML=s;
  out.textContent = `${v} pyöristyy → ${pyor}`;
}

/* ---------- laskujärjestys-widget ---------- */
const ljExp=document.getElementById("ljExp");
if(ljExp && D.kokeilu){
  let ljI=0, ljTokens=[], ljStep=0;
  const laske=(a,op,b)=>{a=+a;b=+b;return op==="×"?a*b:op==="÷"?a/b:op==="+"?a+b:a-b;};
  function ljAlku(){
    const l=D.kokeilu[ljI];
    ljTokens=l.lauseke.replace(/\(/g,"( ").replace(/\)/g," )").split(/\s+/).filter(Boolean);
    ljStep=0; ljPiirra(); ljViesti("","");
  }
  function ljViesti(t,lk){const f=document.getElementById("ljFb"); f.textContent=t; f.className="lj-fb "+(lk||"");}
  function ljPiirra(){
    const l=D.kokeilu[ljI];
    document.getElementById("ljStep").textContent =
      ljStep>=l.askeleet.length ? "valmis" : `askel ${ljStep+1} / ${l.askeleet.length}`;
    if(ljStep>=l.askeleet.length){
      ljExp.innerHTML=`<span class="valmis">${l.lauseke} = ${l.vastaus}</span>`;
      return;
    }
    ljExp.innerHTML=ljTokens.map((t,i)=>
      "×÷+−".includes(t) ? `<button type="button" class="op" data-i="${i}">${t}</button>`
                         : `<span class="tok">${t}</span>`).join("");
    ljExp.querySelectorAll("button.op").forEach(b=>b.addEventListener("click",()=>ljKlikkaa(+b.dataset.i)));
  }
  function ljKlikkaa(i){
    const l=D.kokeilu[ljI], odotettu=l.askeleet[ljStep];
    const ehdotus=[ljTokens[i-1],ljTokens[i],ljTokens[i+1]].join(" ");
    if(ehdotus!==odotettu){
      ljViesti(ljStep===0
        ? "Ei vielä. Sulkeet ovat vahvimmat, sitten kerto ja jako. Yhtä vahvat vasemmalta oikealle."
        : "Ei vielä. Kumpi jäljellä olevista on vahvempi?", "no");
      return;
    }
    const arvo=laske(ljTokens[i-1],ljTokens[i],ljTokens[i+1]);
    let alku=i-1, loppu=i+1;
    if(ljTokens[i-2]==="(" && ljTokens[i+2]===")"){ alku=i-2; loppu=i+2; }
    ljTokens.splice(alku, loppu-alku+1, String(arvo));
    ljStep++;
    ljViesti(ljStep>=l.askeleet.length ? "Valmis. Vastaus on "+l.vastaus+"." : "Oikein. Jatka seuraavaan.", "ok");
    ljPiirra();
  }
  document.getElementById("ljSeuraava").addEventListener("click",()=>{
    ljI=(ljI+1)%D.kokeilu.length; ljAlku();
  });
  ljAlku();
}

/* Suomalainen lukumuoto: välilyönti on tuhaterotin, pilkku desimaalierotin.
   Piste voi olla kumpi tahansa. Se tulkitaan tuhaterottimeksi VAIN silloin, kun
   koko luku on aitoa tuhaterotinmuotoa: alkuosa 1–3 numeroa ilman etunollaa ja
   jokainen jatko-osa täsmälleen 3 numeroa (1.500, 12.345.678). Kaikissa muissa
   tapauksissa piste on desimaalipiste — myös 0.125, joka vanhalla säännöllä
   ("3 numeroa pisteen jäljessä = tuhaterotin") luettiin virheellisesti luvuksi 125. */
const TUHATEROTIN = /^[1-9]\d{0,2}(\.\d{3})+$/;
function lueLuku(teksti){
  // Murtoluku (3/4, -3/4) ja sekaluku (1 2/3, -1 2/3) hyväksytään sellaisinaan.
  const raaka = String(teksti).replace(/\u00a0/g, " ").trim();
  let m = raaka.match(/^(-?)(\d+)\s+(\d+)\s*\/\s*(\d+)$/);
  if(m){ const nim = Number(m[4]); if(nim === 0) return null;
    const v = Number(m[2]) + Number(m[3]) / nim; return m[1] ? -v : v; }
  m = raaka.match(/^(-?)\s*(\d+)\s*\/\s*(\d+)$/);
  if(m){ const nim = Number(m[3]); if(nim === 0) return null;
    const v = Number(m[2]) / nim; return m[1] ? -v : v; }
  let s = String(teksti).replace(/[\s\u00a0]/g, "");
  if(s === "") return null;
  if(s.indexOf(",") >= 0){
    s = s.replace(/\./g, "").replace(",", ".");
  } else if(TUHATEROTIN.test(s)){
    s = s.replace(/\./g, "");
  }
  const n = Number(s);
  return Number.isFinite(n) ? n : null;
}

function tarkista(id){
  const h=D.harjoitukset.find(x=>x.id===id);
  const kentta=document.getElementById("in-"+id);
  const fb=document.getElementById("fb-"+id);
  if(kentta.value.trim()===""){ fb.className="fb hint"; fb.textContent="Kirjoita vastaus ensin."; return; }
  const luku=lueLuku(kentta.value);
  if(luku===null){ fb.className="fb no"; fb.textContent="Vastauksen pitää olla luku tai murtoluku (esimerkiksi 3/4)."; return; }
  const oikein = Math.abs(luku - h.vastaus) < 1e-9;
  merkitseTulos(id, oikein, oikein ? "Oikein. "+h.selitys : `Ei vielä. ${h.vinkki} Kokeile uudelleen.`);
}

function tarkistaMonivalinta(id, valittuIndeksi, painike){
  const h=D.harjoitukset.find(x=>x.id===id);
  const rivi=painike.closest(".row");
  rivi.querySelectorAll(".mv-valinta").forEach(b=>b.disabled=true);
  const oikein = valittuIndeksi===h.vastaus;
  painike.classList.add(oikein?"mv-oikein":"mv-vaarin");
  if(!oikein){
    const oikeaBtn=rivi.querySelector(`[data-i="${h.vastaus}"]`);
    if(oikeaBtn) oikeaBtn.classList.add("mv-oikein");
  }
  merkitseTulos(id, oikein, oikein ? "Oikein. "+h.selitys : `Ei ihan. Oikea vastaus on korostettu. ${h.selitys||""}`);
}

/* Kuuntelu: selain lukee tekstin ääneen omalla puhesynteesillään (englanniksi, jos laitteessa on
   englanninkielinen ääni). Ei äänitiedostoja eikä verkkoyhteyttä. Jos laite ei osaa puhua,
   teksti näytetään luettavaksi — silloin tehtävä muuttuu luetun ymmärtämiseksi, mutta ei katkea. */
function puhu(id, nopeus){
  const h=D.harjoitukset.find(x=>x.id===id); if(!h || !h.kuuntele) return;
  const vara=document.getElementById("vara-"+id);
  const naytaTeksti=syy=>{ vara.hidden=false; vara.textContent=syy+" Teksti: "+h.kuuntele; };
  if(!("speechSynthesis" in window)){ naytaTeksti("Tämä laite ei osaa lukea ääneen."); return; }
  const s=window.speechSynthesis; s.cancel();
  const u=new SpeechSynthesisUtterance(h.kuuntele);
  u.lang=h.kieli||"en-GB"; u.rate=nopeus;
  const aanet=s.getVoices(), kieli=u.lang.slice(0,2);
  const aani=aanet.find(a=>a.lang===u.lang) || aanet.find(a=>a.lang && a.lang.startsWith(kieli));
  if(aani) u.voice=aani;
  else if(aanet.length) { naytaTeksti("Laitteessa ei ole englanninkielistä ääntä."); return; }
  u.onerror=()=>naytaTeksti("Ääneen lukeminen ei onnistunut.");
  s.speak(u);
}
