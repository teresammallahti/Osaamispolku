<title>Suotuisat per kaikki</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">

<style>
:root{
  --paper:#EFF2F5; --surface:#FFFFFF; --surface-2:#F7F9FB;
  --grid:#DCE3EA; --line:#C9D3DC;
  --ink:#15222C; --ink-2:#4E626F; --ink-3:#7E8F9B;
  --core:#1B5A9E; --core-soft:#E4EDF6;
  --strong:#1F6E5C; --strong-soft:#E1F0EB;
  --chal:#9A6A16; --chal-soft:#F6EDDC;
  --alert:#A33A2B; --alert-soft:#F8E7E3;
  --shadow:0 1px 2px rgba(21,34,44,.06), 0 8px 24px -12px rgba(21,34,44,.18);
  --r:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0F161B; --surface:#18222A; --surface-2:#1D2830;
    --grid:#22303A; --line:#2E3E4A;
    --ink:#E8EFF4; --ink-2:#A3B4C0; --ink-3:#7A8B97;
    --core:#7FB2E4; --core-soft:#16303F;
    --strong:#77CDB4; --strong-soft:#123028;
    --chal:#E0B267; --chal-soft:#33270F;
    --alert:#E8907F; --alert-soft:#3A1E19;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -14px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --paper:#0F161B; --surface:#18222A; --surface-2:#1D2830;
  --grid:#22303A; --line:#2E3E4A;
  --ink:#E8EFF4; --ink-2:#A3B4C0; --ink-3:#7A8B97;
  --core:#7FB2E4; --core-soft:#16303F;
  --strong:#77CDB4; --strong-soft:#123028;
  --chal:#E0B267; --chal-soft:#33270F;
  --alert:#E8907F; --alert-soft:#3A1E19;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -14px rgba(0,0,0,.7);
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:16px; line-height:1.62;
  background-image:
    linear-gradient(to right, var(--grid) 1px, transparent 1px),
    linear-gradient(to bottom, var(--grid) 1px, transparent 1px);
  background-size:26px 26px;
}
.wrap{max-width:760px; margin:0 auto; padding:28px 20px 90px}
h1,h2,h3,h4{font-family:"Familjen Grotesk","IBM Plex Sans",system-ui,sans-serif; text-wrap:balance}

/* header */
header.top{background:var(--surface); border:1px solid var(--line); border-radius:var(--r);
  box-shadow:var(--shadow); padding:22px 24px; display:flex; gap:18px; align-items:flex-start}
.badge{flex:0 0 auto; width:54px; height:54px; border-radius:9px; display:grid; place-items:center;
  background:var(--core-soft); border:1px solid var(--core); color:var(--core)}
.badge svg{width:28px; height:28px; fill:none; stroke:currentColor; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round}
.eyebrow{font-family:"IBM Plex Mono",monospace; font-size:11px; letter-spacing:.14em;
  text-transform:uppercase; color:var(--ink-3); margin:0 0 5px}
header.top h1{margin:0; font-size:30px; font-weight:700; letter-spacing:-.015em}
header.top p{margin:5px 0 0; color:var(--ink-2); font-size:15px}
.tags{display:flex; flex-wrap:wrap; gap:5px; margin-top:11px}
.tag{font-family:"IBM Plex Mono",monospace; font-size:10.5px; letter-spacing:.05em; padding:2px 7px;
  border-radius:4px; background:var(--surface-2); border:1px solid var(--line); color:var(--ink-3)}
.tag.core{background:var(--core-soft); border-color:var(--core); color:var(--core)}

/* teksti */
article{margin-top:26px}
article h2{font-size:21px; font-weight:600; margin:32px 0 10px; letter-spacing:-.01em}
article p{margin:0 0 14px; max-width:64ch}
.lead{font-size:17.5px; color:var(--ink); border-left:3px solid var(--core); padding-left:16px; margin:0 0 8px}

.box{background:var(--surface); border:1px solid var(--line); border-radius:var(--r);
  padding:18px 22px; box-shadow:var(--shadow); margin:22px 0}
.box h3{margin:0 0 12px; font-size:16.5px; font-weight:600}
.box.warn{border-left:3px solid var(--alert)}
.box.note{border-left:3px solid var(--chal)}

ol.steps{margin:0; padding-left:0; list-style:none; counter-reset:s; display:grid; gap:12px}
ol.steps li{counter-increment:s; display:grid; grid-template-columns:auto 1fr; gap:13px; align-items:start}
ol.steps li::before{content:counter(s); font-family:"Familjen Grotesk",sans-serif; font-weight:700; font-size:14px;
  width:26px; height:26px; border-radius:50%; background:var(--core); color:#fff; display:grid; place-items:center; margin-top:2px}

ul.notes{margin:0; padding-left:19px}
ul.notes li{margin-bottom:7px}
ul.notes li:last-child{margin-bottom:0}

.tablewrap{overflow-x:auto}
table{border-collapse:collapse; width:100%; font-size:14.5px; min-width:460px}
th,td{text-align:left; padding:9px 13px; border-bottom:1px solid var(--line)}
th{font-family:"IBM Plex Mono",monospace; font-size:10.5px; letter-spacing:.1em; text-transform:uppercase;
  color:var(--ink-3); font-weight:400; background:var(--surface-2)}
tr:last-child td{border-bottom:0}
td b{color:var(--core); font-weight:600}
td:last-child{font-variant-numeric:tabular-nums; font-weight:600}

/* lukusuora */
.nl svg{width:100%; height:118px; display:block}
.nl .rail{stroke:var(--line); stroke-width:2}
.nl .tick{stroke:var(--line); stroke-width:1.5}
.nl .stop{fill:var(--ink-3); font-family:"IBM Plex Mono",monospace; font-size:11px}
.nl .stop.near{fill:var(--core); font-weight:600}
.nl .dot{fill:var(--chal)}
.nl .val{fill:var(--ink); font-family:"Familjen Grotesk",sans-serif; font-size:15px; font-weight:700}
.nl .halfway{stroke:var(--chal); stroke-dasharray:3 3; stroke-width:1.5}
.nl-controls{display:flex; align-items:center; gap:14px; margin-top:6px}
.nl-controls input{flex:1; accent-color:var(--core)}
.nl-out{font-family:"Familjen Grotesk",sans-serif; font-size:15px; font-weight:600; min-width:12.5em; text-align:right}

/* paikka-arvotaulu */
.box .ohje{margin:0 0 14px; font-size:14.5px; color:var(--ink-2)}
.nt-valinta{display:flex; flex-wrap:wrap; gap:7px; margin-bottom:16px}
.nt-valinta button{font:inherit; font-size:12.5px; font-family:"IBM Plex Mono",monospace; padding:5px 11px;
  border-radius:6px; border:1px solid var(--line); background:var(--surface-2); color:var(--ink-2); cursor:pointer}
.nt-valinta button[aria-pressed="true"]{background:var(--ink); color:var(--paper); border-color:var(--ink)}
.nt-valinta button:focus-visible{outline:2px solid var(--core); outline-offset:2px}
.nt-taulu{display:flex; flex-direction:column; gap:4px; align-items:flex-start; overflow-x:auto; padding-bottom:4px}
.nt-rivi{display:flex; gap:6px; align-items:center}
.nt-rivi .otsa{font-family:"IBM Plex Mono",monospace; font-size:9.5px; letter-spacing:.08em;
  text-transform:uppercase; color:var(--ink-3); width:52px; text-align:center}
.nt-ruutu{width:52px; height:52px; display:grid; place-items:center; border:1.5px solid var(--line);
  border-radius:7px; background:var(--surface-2); font-family:"IBM Plex Mono",monospace; font-size:24px}
.nt-ruutu.kohta{border-color:var(--core); background:var(--core-soft); color:var(--core); font-weight:500}
.nt-ruutu.ratkaiseva{border-color:var(--chal); background:var(--chal-soft); color:var(--chal); font-weight:500}
.nt-ruutu.nolla{color:var(--ink-3)}
.nt-rivi .nimi{font-size:12.5px; color:var(--ink-3); margin-left:12px; white-space:nowrap}
.nt-nuoli{font-size:17px; color:var(--chal); margin-left:6px}
.nt-selite{margin:14px 0 0; font-size:14.5px}
.nt-selite b{color:var(--core)}

/* vahvuusportaat */
.vp-tasot{display:grid; gap:9px; margin-bottom:18px}
.vp-taso{display:flex; gap:11px; align-items:flex-start; font-size:13.5px}
.vp-taso .vp-pallo{width:13px; height:13px; border-radius:4px; margin-top:5px; flex:0 0 auto}
.vp-taso[data-taso="sulkeet"] .vp-pallo{background:var(--core)}
.vp-taso[data-taso="kertojako"] .vp-pallo{background:var(--strong)}
.vp-taso[data-taso="yhteenvahennys"] .vp-pallo{background:var(--chal)}
.vp-taso strong{display:block; font-family:"Familjen Grotesk",sans-serif; font-weight:600; font-size:14.5px}
.vp-taso span{color:var(--ink-2)}
.vp-lauseke{display:flex; flex-wrap:wrap; gap:7px; align-items:flex-end; font-family:"IBM Plex Mono",monospace;
  font-size:25px; padding:10px 2px; min-height:64px}
.vp-lauseke .t{padding:2px 3px}
.vp-lauseke .op{position:relative; padding:2px 9px; border-radius:6px; font-weight:500}
.vp-lauseke .op[data-taso="sulkeet"]{background:var(--core-soft); color:var(--core)}
.vp-lauseke .op[data-taso="kertojako"]{background:var(--strong-soft); color:var(--strong)}
.vp-lauseke .op[data-taso="yhteenvahennys"]{background:var(--chal-soft); color:var(--chal)}
.vp-lauseke .op i{position:absolute; top:-9px; right:-6px; font-style:normal; font-family:"Familjen Grotesk",sans-serif;
  font-size:11px; font-weight:700; width:18px; height:18px; border-radius:50%; display:grid; place-items:center;
  background:currentColor}
.vp-lauseke .op i span{color:var(--surface)}
.vp-rivi{display:flex; align-items:center; gap:16px; margin-top:8px}
.vp-vastaus{font-family:"Familjen Grotesk",sans-serif; font-size:16px; font-weight:600; color:var(--strong)}

/* laskujärjestys-widget */
.lj-exp{display:flex; flex-wrap:wrap; gap:7px; align-items:center; font-family:"IBM Plex Mono",monospace;
  font-size:23px; padding:14px 4px; min-height:62px}
.lj-exp .tok{padding:2px 4px; color:var(--ink)}
.lj-exp button.op{font-family:"IBM Plex Mono",monospace; font-size:23px; padding:3px 12px; border-radius:7px;
  border:1.5px solid var(--line); background:var(--surface-2); color:var(--ink); line-height:1.2}
.lj-exp button.op:hover{border-color:var(--core); color:var(--core)}
.lj-exp button.op:focus-visible{outline:2px solid var(--core); outline-offset:2px}
.lj-exp .valmis{font-family:"Familjen Grotesk",sans-serif; font-size:23px; font-weight:700; color:var(--strong)}
.lj-fb{font-size:14.5px; min-height:1.5em; color:var(--ink-2)}
.lj-fb.no{color:var(--alert)}
.lj-fb.ok{color:var(--strong)}
.lj-row{display:flex; align-items:center; gap:14px; margin-top:10px}
.lj-step{font-family:"IBM Plex Mono",monospace; font-size:11.5px; letter-spacing:.1em;
  text-transform:uppercase; color:var(--ink-3)}

/* harjoitukset */
.progress{position:sticky; top:0; z-index:5; background:var(--surface); border:1px solid var(--line);
  border-radius:var(--r); padding:12px 18px; box-shadow:var(--shadow); display:flex; align-items:center;
  gap:14px; margin:34px 0 18px}
.progress .lbl{font-family:"IBM Plex Mono",monospace; font-size:11px; letter-spacing:.12em;
  text-transform:uppercase; color:var(--ink-3); white-space:nowrap}
.progress .meter{flex:1; height:7px; border-radius:4px; background:var(--surface-2); border:1px solid var(--line); overflow:hidden}
.progress .meter i{display:block; height:100%; background:var(--core); transition:width .25s ease}
.progress .cnt{font-family:"Familjen Grotesk",sans-serif; font-weight:700; font-variant-numeric:tabular-nums; white-space:nowrap}

.grp{margin-top:26px}
.grp-head{display:flex; align-items:baseline; gap:10px; border-bottom:1.5px solid var(--ink); padding-bottom:7px; margin-bottom:14px}
.grp-head h3{margin:0; font-size:17px; font-weight:600}
.grp-head span{font-size:12.5px; color:var(--ink-2)}

.ex{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:14px 16px; margin-bottom:10px}
.ex[data-tila="oikein"]{border-color:var(--strong); box-shadow:inset 3px 0 0 var(--strong)}
.ex[data-tila="vaarin"]{border-color:var(--alert); box-shadow:inset 3px 0 0 var(--alert)}
.ex .q{display:flex; gap:11px; align-items:baseline; flex-wrap:wrap}
.ex .num{font-family:"IBM Plex Mono",monospace; font-size:11.5px; color:var(--ink-3); min-width:2.4em}
.ex .txt{flex:1; min-width:190px; font-size:15.5px}
.ex .txt .aineisto{display:block; margin-bottom:9px; padding-left:12px;
  border-left:2px solid var(--line); color:var(--ink-2); line-height:1.6;
  /* Aineisto voi olla pieni taulukko, jonka rivit on erotettu rivinvaihdoilla.
     Ilman pre-lineä ne valuisivat yhdeksi kappaleeksi ja taulukko katoaisi. */
  white-space:pre-line}
.ex .txt .kysymysrivi{display:block; font-weight:600}
.ex .row{display:flex; gap:8px; align-items:center; margin-top:11px; flex-wrap:wrap}
.ex input[type=text]{font:inherit; font-family:"IBM Plex Mono",monospace; font-size:15px; width:8.5em;
  padding:7px 11px; border:1px solid var(--line); border-radius:7px; background:var(--surface-2);
  color:var(--ink); text-align:right}
.ex input:focus-visible{outline:2px solid var(--core); outline-offset:1px}
button{font:inherit; cursor:pointer}
.btn{font-size:13.5px; padding:7px 15px; border-radius:7px; border:1px solid var(--core);
  background:var(--core); color:#fff}
.btn.ghost{background:transparent; color:var(--ink-2); border-color:var(--line)}
.btn:focus-visible{outline:2px solid var(--core); outline-offset:2px}
.btn.mv-valinta{text-align:left}
/* kuuntelutehtävä: selaimen puhesynteesi lukee englanninkielisen tekstin */
.kuuntele{display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin:2px 0 10px}
.kuuntele .btn{display:inline-flex; gap:7px; align-items:center}
.kuuntele svg{width:16px; height:16px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round}
.kuuntele .varateksti{flex-basis:100%; font-size:14px; color:var(--ink-2); background:var(--surface-2);
  border-radius:7px; padding:8px 12px; margin:0}
.btn.mv-valinta:disabled{cursor:default; opacity:.65}
.btn.mv-oikein{background:var(--strong-soft); border-color:var(--strong); color:var(--strong); opacity:1}
.btn.mv-vaarin{background:var(--alert-soft); border-color:var(--alert); color:var(--alert); opacity:1}
.row.mv{gap:8px 10px}
.fb{margin-top:11px; font-size:14.5px; padding:10px 13px; border-radius:8px; line-height:1.5}
.fb.ok{background:var(--strong-soft); color:var(--strong)}
.fb.no{background:var(--alert-soft); color:var(--alert)}
.fb.hint{background:var(--chal-soft); color:var(--chal)}

.done{background:var(--strong-soft); border:1px solid var(--strong); color:var(--strong);
  border-radius:var(--r); padding:16px 20px; margin-top:20px; font-size:15.5px}
.done h3{margin:0 0 4px; font-size:17px; color:var(--strong)}

details.teacher{margin-top:34px; background:var(--surface); border:1px solid var(--line);
  border-left:3px solid var(--chal); border-radius:var(--r); padding:15px 20px; box-shadow:var(--shadow)}
details.teacher summary{cursor:pointer; font-family:"Familjen Grotesk",sans-serif; font-weight:600; font-size:15px}
details.teacher summary:focus-visible{outline:2px solid var(--core); outline-offset:3px}
details.teacher ul{margin:12px 0 0; padding-left:19px; color:var(--ink-2); font-size:14.5px}
details.teacher li{margin-bottom:8px}
details.teacher p{margin:12px 0 0; color:var(--ink-2); font-size:14.5px}

.back{display:inline-block; margin-top:30px; font-size:13.5px; color:var(--ink-2)}
.back a{color:var(--core)}

@media (prefers-reduced-motion: reduce){*{transition:none !important}}
@media (max-width:560px){
  .wrap{padding:16px 13px 70px}
  header.top h1{font-size:25px}
  .progress{flex-wrap:wrap}
}
</style>

<div class="wrap">

  <header class="top">
    <span class="badge"><svg viewBox="0 0 24 24" aria-hidden="true" id="ikoni"></svg></span>
    <div>
      <p class="eyebrow" id="eyebrow"></p>
      <h1 id="otsikko"></h1>
      <p id="kuvaus"></p>
      <div class="tags" id="tags"></div>
    </div>
  </header>

  <article id="teksti"></article>

  <div class="progress" aria-live="polite">
    <span class="lbl">Harjoitukset</span>
    <span class="meter"><i id="pbar" style="width:0%"></i></span>
    <span class="cnt" id="pcnt">0 / 20</span>
  </div>

  <div id="harjoitukset"></div>
  <div id="valmis"></div>

  <p class="back" id="back"></p>

</div>

<script>
const D = {"tavoite_id":"MAT9-TIL-06","oppiaine":"MAT","vuosiluokka":9,"taso":"ydin","otsikko":"Suotuisat per kaikki","kuvaus":"Osaan laskea klassisen todennäköisyyden suotuisten ja kaikkien alkeistapausten avulla.","versio":"0.2","paivitetty":"2026-10-11","ops":{"T":["T10","T19"],"S":["S6"]},"ikoni":"murtoluku","eyebrow":"Matematiikka · 9. luokka · Tilastot ja todennäköisyys","teksti":[{"tyyppi":"johdanto","sisalto":"Lautapelissä pääset pois vankilaruudusta vasta, kun heität nopalla vähintään viitosen. Kaverisi lohduttaa, että mahdollisuus on puolet, koska joko onnistut tai et. Onko hän oikeassa? Nopassa on kuusi tahkoa, ja onnistumiseen kelpaavat niistä vain viisi ja kuusi. Kaksi kuudesta on kolmasosa, ei puolet. Kaverin päättely menee pieleen, koska ”onnistut” ja ”et onnistu” eivät ole yhtä todennäköisiä: epäonnistumiseen johtaa neljä tahkoa ja onnistumiseen kaksi. Tässä taidossa opit laskemaan klassisen todennäköisyyden. Luettelet satunnaisilmiön kaikki mahdolliset lopputulokset, tarkistat, että ne ovat yhtä todennäköisiä, ja lasket, kuinka suuri osa niistä on suotuisia. Opit myös ilmoittamaan todennäköisyyden murtolukuna, desimaalilukuna ja prosentteina sekä tunnistamaan mahdottoman ja varman tapahtuman."},{"tyyppi":"kappale","otsikko":"Satunnaisilmiö, alkeistapaus ja tapahtuma","sisalto":"Satunnaisilmiön tulosta ei voi tietää etukäteen, vaikka kaikki mahdolliset tulokset tunnetaan. Esimerkkejä ovat nopanheitto, kortin nostaminen sekoitetusta pakasta, helmen nostaminen pussista katsomatta ja nimen arpominen. Alkeistapaus on yksi mahdollinen lopputulos. Nopanheitossa alkeistapaukset ovat silmäluvut 1, 2, 3, 4, 5 ja 6. Kun kulhossa ovat luokan 27 oppilaan nimilaput ja niistä nostetaan esitelmävuoron ensimmäinen, alkeistapauksia on 27, yksi jokaista oppilasta kohden. Tapahtuma on joukko alkeistapauksia, ja se kuvataan sanoin: tapahtuma ”silmäluku on parillinen” koostuu alkeistapauksista 2, 4 ja 6. Ne ovat tämän tapahtuman suotuisat alkeistapaukset. Luettele alkeistapaukset järjestelmällisesti pienimmästä suurimpaan, niin yksikään ei jää pois eikä tule mukaan kahdesti. Kun luku arvotaan väliltä 10–24, lukuja on 24 − 10 + 1 = 15, koska molemmat päätepisteet kuuluvat mukaan. Tavallisessa 52 kortin pakassa on neljä maata: hertta ja ruutu ovat punaisia, risti ja pata mustia. Kussakin maassa on 13 korttia: 2–10, jätkä, kuningatar, kuningas ja ässä. Tässä taidossa satunnaiskoe tehdään aina kerran: yksi heitto, yksi kortti, yksi nosto tai yksi arvonta."},{"tyyppi":"saanto","otsikko":"Suotuisat per kaikki","askeleet":["Luettele alkeistapaukset tai laske niiden määrä. Merkitse kaikkien alkeistapausten määrää kirjaimella n.","Tarkista, että alkeistapaukset ovat yhtä todennäköisiä. Jos eivät ole, valitse alkeistapauksiksi pienemmät osat, esimerkiksi yksittäiset helmet värien sijaan.","Luettele tapahtuman A suotuisat alkeistapaukset ja laske niiden määrä k.","Laske P(A) = k/n eli suotuisten alkeistapausten määrä jaettuna kaikkien alkeistapausten määrällä, ja supista. Luvuista 1–12 arvotaan yksi. Tapahtumalle ”luku on jaollinen neljällä” suotuisat ovat 4, 8 ja 12, joten P = 3/12 = 1/4.","Desimaaliluvuksi ja prosenteiksi: supista ensin ja lavenna sitten nimittäjä 10:ksi, 100:ksi tai 1000:ksi. 17/20 = 85/100 = 0,85 = 85 %. Prosenttiluku kertoo sadasosien määrän, joten 0,85 on 85 %, ei 0,85 %. Merkintä 0,85 % tarkoittaa lukua 0,0085.","Jos supistetun murtoluvun nimittäjää ei saa laventamalla miksikään kymmenen potenssiksi (10, 100, 1000 ja niin edelleen), kuten murtoluvuissa 1/3 ja 5/6, desimaaliesitys ei pääty. Anna silloin todennäköisyys murtolukuna. Likiarvon voi laskea jakolaskulla (1/6 ≈ 0,17 ≈ 17 %), mutta tässä taidossa todennäköisyys annetaan tarkkana murtolukuna.","Miksi jakolasku? Kun n alkeistapausta ovat yhtä todennäköisiä, jokaisen osuus on 1/n. Tapahtuman todennäköisyys on sen suotuisten alkeistapausten osuuksien summa, ja k kappaletta osuutta 1/n on k/n."]},{"tyyppi":"kappale","otsikko":"Ovatko alkeistapaukset yhtä todennäköisiä","sisalto":"Sääntö suotuisat per kaikki toimii vain, kun jokainen alkeistapaus on yhtä todennäköinen. Reilussa nopassa jokainen tahko tulee yhtä todennäköisesti, ja hyvin sekoitetusta pakasta jokainen kortti nousee yhtä todennäköisesti. Pussista nostettaessa alkeistapaus on yksittäinen helmi tai kuula, ei väri. Jos pussissa on 4 vihreää kuulaa ja 1 musta, jokainen viidestä kuulasta tulee yhtä todennäköisesti, mutta vihreä tulee neljä kertaa todennäköisemmin kuin musta. Siksi P(musta) = 1/5, ei 1/2. Onnenpyörän sektorit ovat yhtä todennäköisiä vain, jos ne ovat yhtä suuria. Samasta syystä ”onnistuu” ja ”ei onnistu” eivät yleensä ole kaksi yhtä todennäköistä alkeistapausta, kuten johdannon nopassa näkyi. Kun tehtävä kertoo, että noppa on reilu, pakka sekoitettu tai kuula nostetaan katsomatta, voit olettaa alkeistapaukset yhtä todennäköisiksi. Kaikkia todennäköisyyksiä ei voi laskea suotuisista ja kaikista. Sitä, voittaako Suomi seuraavat jääkiekon MM-kisat, voi vain arvioida aiempien otteluiden perusteella, koska yhtä todennäköisiä alkeistapauksia ei ole."},{"tyyppi":"ansa","otsikko":"Ansa 1: värit tai muut luokat alkeistapauksina","sisalto":"Pussissa on 3 keltaista, 6 sinistä ja 1 punainen helmi. Värejä on kolme, joten houkuttelee vastata P(punainen) = 1/3. Värit eivät kuitenkaan ole yhtä todennäköisiä, koska kutakin väriä on eri määrä helmiä. Alkeistapaukset ovat yksittäiset helmet. Niitä on 3 + 6 + 1 = 10, ja punaisia on 1, joten P(punainen) = 1/10. Sama virhe syntyy, kun koulun 12 kahdeksasluokkalaisesta ja 18 yhdeksäsluokkalaisesta arvotaan edustaja ja todetaan, että kahdeksasluokkalaisen todennäköisyys on 1/2, koska vaihtoehtoja on kaksi. Oikein on 12/30 = 2/5. Kysy aina: onko jokainen luettelemani vaihtoehto yhtä todennäköinen?"},{"tyyppi":"kappale","otsikko":"Mahdoton, varma ja väli 0–1","sisalto":"Jos tapahtumalla ei ole yhtään suotuisaa alkeistapausta, se on mahdoton, ja sen todennäköisyys on 0/n = 0. Nopanheitossa tapahtuma ”silmäluku on 8” on mahdoton. Jos kaikki alkeistapaukset ovat suotuisia, tapahtuma on varma, ja sen todennäköisyys on n/n = 1. Nopanheitossa tapahtuma ”silmäluku on enintään 6” on varma. Muut tapahtumat ovat mahdollisia, ja niiden todennäköisyys on nollan ja yhden välissä. Jokaisen tapahtuman todennäköisyys on siis välillä 0–1, ja nolla ja yksi kuuluvat mukaan: 0 ≤ P(A) ≤ 1. Prosentteina väli on 0–100 %. Miksi? Suotuisia alkeistapauksia on vähintään 0 ja enintään kaikki, joten murtoluvun k/n osoittaja on vähintään 0 ja enintään yhtä suuri kuin nimittäjä. Tästä saat tarkistuksen jokaiseen laskuun: negatiivinen todennäköisyys tai yli yhden oleva todennäköisyys, kuten 6/5 tai 130 %, on aina laskuvirhe. Mitä lähempänä todennäköisyys on yhtä, sitä todennäköisempi tapahtuma on."},{"tyyppi":"ansa","otsikko":"Ansa 2: väärä jakaja","sisalto":"Pussissa on 4 punaista ja 12 muuta kuulaa. P(punainen) ei ole 4/12 = 1/3, koska silloin jakajana on vain muiden kuulien määrä. Kaikkia kuulia on 4 + 12 = 16, joten P(punainen) = 4/16 = 1/4. Toinen virhe on jakaa väärin päin: 16/4 = 4. Tulos on yli 1, joten se ei voi olla todennäköisyys. Nimittäjään tulee aina kaikkien alkeistapausten määrä, ja osoittajaan suotuisten määrä. Siksi osoittaja on enintään yhtä suuri kuin nimittäjä."},{"tyyppi":"taulukko","otsikko":"Sama todennäköisyys kolmessa muodossa","otsikkorivi":["Tilanne","Murtolukuna","Lavennettuna","Desimaalilukuna","Prosentteina"],"rivit":[["Noppa: silmäluku on pariton","3/6 = 1/2","5/10","0,5","50 %"],["Luvut 1–20: luku on jaollinen viidellä","4/20 = 1/5","20/100","0,2","20 %"],["Pakka: kortti on pata","13/52 = 1/4","25/100","0,25","25 %"],["Pussissa 3 punaista ja 5 sinistä helmeä: helmi on punainen","3/8","375/1000","0,375","37,5 %"],["Noppa: silmäluku on 5","1/6","ei onnistu","≈ 0,17 (ei pääty)","≈ 17 % (likiarvo)"]]},{"tyyppi":"ansa","otsikko":"Ansa 3: sanat ja määritelmät","sisalto":"Tapahtuman sanat ratkaisevat, mitkä alkeistapaukset ovat suotuisia. ”Vähintään 5” tarkoittaa silmälukuja 5 ja 6, mutta ”yli 5” vain silmälukua 6. Jos luet ”vähintään 5” kuin ”yli 5”, saat 1/6, vaikka oikein on 2/6 = 1/3. Samoin ”enintään” sisältää rajan, mutta ”alle” ja ”pienempi kuin” eivät. Tapahtuma ”silmäluku ei ole 1” lasketaan samalla tavalla kuin muutkin: suotuisat ovat 2, 3, 4, 5 ja 6, joten todennäköisyys on 5/6. Kun tapahtumassa on sana ”tai”, luettele suotuisat ja laske jokainen vain kerran. Luvuista 1–10 tapahtumalle ”luku on parillinen tai suurempi kuin 7” suotuisat ovat 2, 4, 6, 8, 9 ja 10. Luvut 8 ja 10 täyttävät molemmat ehdot, mutta ne ovat silti yksi alkeistapaus kumpikin, joten P = 6/10 = 3/5. Myös määritelmät ratkaisevat. Alkuluvulla on täsmälleen kaksi tekijää, 1 ja luku itse, joten luku 1 ei ole alkuluku. Luvuista 1–10 alkulukuja ovat 2, 3, 5 ja 7, joten alkuluvun todennäköisyys on 4/10 = 2/5, ei 5/10. Kuvakortteja ovat jätkä, kuningatar ja kuningas, mutta ässä ei ole kuvakortti. Kuvakortteja on 3 · 4 = 12, joten P(kuvakortti) = 12/52 = 3/13. Jos ässät lasketaan mukaan, saadaan väärin 16/52 = 4/13."},{"tyyppi":"muistilappu","otsikko":"Muista nämä","kohdat":["Alkeistapaus on yksi mahdollinen lopputulos. Tapahtuma on joukko alkeistapauksia.","P(A) = suotuisten alkeistapausten määrä : kaikkien alkeistapausten määrä, kun alkeistapaukset ovat yhtä todennäköisiä.","Pussissa alkeistapaus on yksittäinen helmi, ei väri. Nimittäjään tulevat kaikki alkeistapaukset, ei vain ne, jotka eivät ole suotuisia.","Mahdottoman tapahtuman todennäköisyys on 0 ja varman 1. Aina 0 ≤ P(A) ≤ 1 eli 0–100 %. Negatiivinen tai yli 1 oleva tulos on laskuvirhe.","Vähintään ja enintään sisältävät rajan, yli, alle ja pienempi kuin eivät. Luettele tai-tapahtuman suotuisat ja laske jokainen kerran.","Supista ensin. Kun nimittäjän saa laventamalla 10:ksi, 100:ksi tai 1000:ksi, saat desimaali- ja prosenttimuodon: 0,85 = 85 %."]}],"harjoitusryhmat":[{"id":"alkeis","nimi":"Alkeistapaukset ja suotuisat","info":"Tee ilman laskinta. Luettele järjestelmällisesti pienimmästä suurimpaan. Pussissa jokainen helmi on oma alkeistapauksensa."},{"id":"muodot","nimi":"Todennäköisyys kolmessa muodossa","info":"Tee ilman laskinta. Supista murtoluku. Desimaali- ja prosenttimuoto onnistuvat, kun nimittäjän saa laventamalla 10:ksi, 100:ksi tai 1000:ksi."},{"id":"tarkistus","nimi":"Yhtä todennäköiset alkeistapaukset ja väli 0–1","info":"Tee ilman laskinta. Tarkista, että alkeistapaukset ovat yhtä todennäköisiä ja että tulos on välillä 0–1."}],"harjoitukset":[{"id":"H01","ryhma":"alkeis","kysymys":"Pussissa on 5 punaista, 6 vihreää ja 4 valkoista kuulaa. Yksi kuula nostetaan katsomatta.\n\nMontako alkeistapausta on?","vastaus":15,"vinkki":"Alkeistapaus on yksi kuula, ei yksi väri.","selitys":"Jokainen kuula on oma alkeistapauksensa, koska jokainen tulee yhtä todennäköisesti. Kuulia on 5 + 6 + 4 = 15. Vastaus 3 laskisi värit, jotka eivät ole yhtä todennäköisiä.","tyyppi":"luku"},{"id":"H02","ryhma":"alkeis","kysymys":"Luvuista 1–30 arvotaan yksi.\n\nMontako alkeistapausta on suotuisia tapahtumalle ”luku on jaollinen seitsemällä”?","vastaus":4,"vinkki":"Luettele seitsemän monikerrat, kunnes ylität 30.","selitys":"Suotuisat ovat 7, 14, 21 ja 28. Seuraava monikerta 35 on jo yli 30. Suotuisia on 4.","tyyppi":"luku"},{"id":"H03","ryhma":"alkeis","kysymys":"Tavallista reilua noppaa heitetään kerran.\n\nMontako alkeistapausta on suotuisia tapahtumalle ”silmäluku on pienempi kuin 4”?","vastaus":3,"vinkki":"Kuuluuko 4 itse mukaan, kun luvun pitää olla pienempi kuin 4?","selitys":"Suotuisat ovat 1, 2 ja 3. Luku 4 ei ole pienempi kuin 4, joten se ei kuulu mukaan. Vastaus 4 kertoo, että raja luettiin kuin ”enintään 4”.","tyyppi":"luku"},{"id":"H04","ryhma":"alkeis","kysymys":"Luvuista 1–12 arvotaan yksi.\n\nMontako alkeistapausta on suotuisia tapahtumalle ”luku on alkuluku”?","vastaus":5,"vinkki":"Alkuluvulla on täsmälleen kaksi tekijää. Onko luku 1 alkuluku?","selitys":"Alkuluvut väliltä 1–12 ovat 2, 3, 5, 7 ja 11. Luku 1 ei ole alkuluku, koska sillä on vain yksi tekijä. Luku 9 = 3 · 3 ei ole alkuluku. Suotuisia on 5.","tyyppi":"luku"},{"id":"H05","ryhma":"alkeis","kysymys":"Luvuista 1–15 arvotaan yksi. Luettele tapahtuman ”luku on parillinen tai suurempi kuin 11” suotuisat alkeistapaukset.\n\nMontako niitä on?","vastaus":9,"vinkki":"Kirjoita ensin parilliset, sitten ne yli 11:n luvut, joita listassa ei vielä ole.","selitys":"Parilliset ovat 2, 4, 6, 8, 10, 12 ja 14. Suuremmat kuin 11 ovat 12, 13, 14 ja 15, joista 12 ja 14 ovat jo listassa. Suotuisat ovat 2, 4, 6, 8, 10, 12, 13, 14 ja 15, eli niitä on 9. Vastaus 11 laskee luvut 12 ja 14 kahdesti.","tyyppi":"luku"},{"id":"H06","ryhma":"alkeis","kysymys":"Luvuista 20–45 arvotaan yksi.\n\nMontako alkeistapausta on?","vastaus":26,"vinkki":"Kuuluvatko sekä 20 että 45 mukaan? Erotus 45 − 20 ei vielä riitä.","selitys":"Luvut 20, 21, …, 45 ovat kaikki mukana. Niitä on 45 − 20 + 1 = 26. Erotus 25 jättää toisen päätepisteen pois.","tyyppi":"luku"},{"id":"H07","ryhma":"alkeis","kysymys":"Pussissa on 4 punaista ja 7 sinistä helmeä. Yksi helmi nostetaan katsomatta.\n\nMitkä ovat tämän satunnaisilmiön yhtä todennäköiset alkeistapaukset?","vastaus":0,"vinkki":"Mikä tulee yhtä todennäköisesti: yksittäinen helmi vai väri?","selitys":"Jokainen yksittäinen helmi tulee yhtä todennäköisesti, joten alkeistapauksia on 11. Värit eivät ole yhtä todennäköisiä, koska sinisiä helmiä on enemmän. Onnistuminen ja epäonnistuminen eivät myöskään ole yhtä todennäköisiä.","tyyppi":"monivalinta","vaihtoehdot":["Jokainen pussin 11 helmestä.","Kaksi väriä, punainen ja sininen.","Kaksi tulosta: onnistuu tai ei onnistu."]},{"id":"H08","ryhma":"muodot","kysymys":"Tavallista reilua noppaa heitetään kerran.\n\nMikä on todennäköisyys, että silmäluku on enintään 5? Anna vastaus supistettuna murtolukuna.","vastaus":0.8333333333333334,"vinkki":"Enintään 5 tarkoittaa, että myös 5 kelpaa.","selitys":"Suotuisat ovat 1, 2, 3, 4 ja 5, kaikkia on 6. P = 5/6. Vastaus 4/6 = 2/3 kertoo, että luku 5 jäi pois.","tyyppi":"luku"},{"id":"H09","ryhma":"muodot","kysymys":"Luvuista 1–24 arvotaan yksi.\n\nMikä on todennäköisyys, että luku on jaollinen kuudella? Anna vastaus supistettuna murtolukuna.","vastaus":0.16666666666666666,"vinkki":"Luettele kuuden monikerrat väliltä 1–24 ja jaa niiden määrä 24:llä.","selitys":"Suotuisat ovat 6, 12, 18 ja 24, eli niitä on 4. P = 4/24 = 1/6.","tyyppi":"luku"},{"id":"H10","ryhma":"muodot","kysymys":"52 kortin pakassa on neljä maata: hertta ja ruutu ovat punaisia, risti ja pata mustia. Kussakin maassa ovat kortit 2–10, jätkä, kuningatar, kuningas ja ässä. Kuvakortteja ovat jätkä, kuningatar ja kuningas. Pakka sekoitetaan, ja siitä nostetaan yksi kortti.\n\nMikä on todennäköisyys, että kortti on kuvakortti, jonka maa on jokin muu kuin pata? Anna vastaus supistettuna murtolukuna.","vastaus":0.17307692307692307,"vinkki":"Kussakin maassa on kolme kuvakorttia. Montako maata kelpaa?","selitys":"Kelpaavat maat ovat hertta, ruutu ja risti, ja kussakin on kolme kuvakorttia, joten suotuisia on 3 · 3 = 9. P = 9/52, eikä se supistu, koska 9 = 3 · 3 ja 52 = 2 · 2 · 13. Vastaus 12/52 = 3/13 kertoo, että ässät laskettiin kuvakorteiksi.","tyyppi":"luku"},{"id":"H11","ryhma":"muodot","kysymys":"Pussissa on 7 punaista, 9 sinistä ja 4 keltaista helmeä. Yksi helmi nostetaan katsomatta.\n\nMikä on todennäköisyys, että helmi on sininen? Anna vastaus desimaalilukuna.","vastaus":0.45,"vinkki":"Laske ensin murtoluku ja lavenna nimittäjä sadaksi.","selitys":"Helmiä on 7 + 9 + 4 = 20, ja sinisiä on 9. P = 9/20 = 45/100 = 0,45.","tyyppi":"luku"},{"id":"H12","ryhma":"muodot","kysymys":"Luokan 25 oppilaasta 14 on ollut kesätöissä. Luokasta arvotaan yksi haastateltava koulun lehteen.\n\nMikä on todennäköisyys, että arvottu on ollut kesätöissä? Anna vastaus prosentteina ilman %-merkkiä.","vastaus":56,"vinkki":"Lavenna murtoluvun nimittäjä sadaksi.","selitys":"P = 14/25 = 56/100 = 0,56 = 56 %.","tyyppi":"luku"},{"id":"H13","ryhma":"muodot","kysymys":"Onnenpyörässä on 20 yhtä suurta sektoria, jotka on numeroitu 1–20. Pyörää pyöritetään kerran.\n\nMikä on todennäköisyys, että osoitin pysähtyy sektoriin, jonka numero ei ole jaollinen neljällä? Anna vastaus desimaalilukuna.","vastaus":0.75,"vinkki":"Laske ensin, montako neljällä jaollista numeroa on. Muut ovat suotuisia.","selitys":"Neljällä jaollisia ovat 4, 8, 12, 16 ja 20, eli niitä on 5. Suotuisia on 20 − 5 = 15. P = 15/20 = 75/100 = 0,75.","tyyppi":"luku"},{"id":"H14","ryhma":"tarkistus","kysymys":"Kuorossa on 11 seitsemäsluokkalaista ja 13 kahdeksasluokkalaista. Kuorosta arvotaan yksi laulaja esittelemään kuoroa.\n\nMikä on todennäköisyys, että arvottu on seitsemäsluokkalainen? Anna vastaus supistettuna murtolukuna.","vastaus":0.4583333333333333,"vinkki":"Alkeistapaus on yksi laulaja, ei luokka-aste.","selitys":"Laulajia on 11 + 13 = 24, ja jokainen on yhtä todennäköinen. Suotuisia on 11, joten P = 11/24. Vastaus 1/2 käsittelee luokka-asteita alkeistapauksina, vaikka niissä on eri määrä laulajia.","tyyppi":"luku"},{"id":"H15","ryhma":"tarkistus","kysymys":"Pussissa on 4 keltaista, 1 punainen ja 7 sinistä helmeä. Yksi helmi nostetaan katsomatta.\n\nMikä on todennäköisyys, että helmi on punainen? Anna vastaus supistettuna murtolukuna.","vastaus":0.08333333333333333,"vinkki":"Värejä on kolme, mutta ovatko ne yhtä todennäköisiä?","selitys":"Helmiä on 4 + 1 + 7 = 12, ja punaisia on 1. P = 1/12. Vastaus 1/3 laskisi värit alkeistapauksiksi.","tyyppi":"luku"},{"id":"H16","ryhma":"tarkistus","kysymys":"Pussissa on 6 punaista ja 2 sinistä helmeä. Elli sanoo: ”Sinisen helmen todennäköisyys on 1/2, koska helmi on joko punainen tai sininen.”\n\nMikä Ellin päättelyssä on väärin?","vastaus":0,"vinkki":"Ovatko punainen ja sininen yhtä todennäköisiä?","selitys":"Värit eivät ole yhtä todennäköisiä, koska punaisia helmiä on kolme kertaa enemmän kuin sinisiä. Alkeistapaukset ovat yksittäiset helmet, joita on 8, ja sinisiä on 2, joten P(sininen) = 2/8 = 1/4. Väärin päin jaettu 2/1 = 2 on yli 1, joten se ei voi olla todennäköisyys.","tyyppi":"monivalinta","vaihtoehdot":["Värit eivät ole yhtä todennäköisiä, koska punaisia helmiä on enemmän. Alkeistapaukset ovat yksittäiset helmet, joten P(sininen) = 2/8 = 1/4.","Päättelyssä ei ole virhettä, koska värejä on kaksi.","Elli jakoi väärin päin. Oikein on 2/1 = 2."]},{"id":"H17","ryhma":"tarkistus","kysymys":"0,4   9/7   −0,1   1   150 %   0   3/10\n\nMontako näistä luvuista voi olla jonkin tapahtuman todennäköisyys?","vastaus":4,"vinkki":"Todennäköisyys on välillä 0–1, ja rajat kuuluvat mukaan. Muuta prosentti desimaaliluvuksi.","selitys":"Kelpaavat 0,4, 1, 0 ja 3/10. Luku 9/7 on yli 1, 150 % = 1,5 on yli 1 ja −0,1 on negatiivinen. Mahdottoman tapahtuman todennäköisyys on 0 ja varman 1, joten ne kelpaavat.","tyyppi":"luku"},{"id":"H18","ryhma":"tarkistus","kysymys":"Pussissa on 8 kuulaa: 5 valkoista ja 3 mustaa. Juuso laski, että valkoisen kuulan todennäköisyys on 8/5.\n\nMikä on oikea todennäköisyys? Anna vastaus desimaalilukuna.","vastaus":0.625,"vinkki":"Juuson tulos on yli 1. Kumpi luku kuuluu nimittäjään?","selitys":"Nimittäjään tulee kaikkien kuulien määrä 8 ja osoittajaan suotuisten määrä 5. P = 5/8 = 625/1000 = 0,625. Juuso jakoi väärin päin, ja tulos 8/5 = 1,6 paljastaa virheen, koska todennäköisyys ei voi olla yli 1.","tyyppi":"luku"},{"id":"H19","ryhma":"tarkistus","kysymys":"Tavallista reilua noppaa heitetään kerran. Tapahtumat:\n1) silmäluku on 9\n2) silmäluku on parillinen\n3) silmäluku on pienempi kuin 1\n4) silmäluku on kokonaisluku\n5) silmäluku on suurempi kuin 6\n\nMontako tapahtumista on mahdottomia?","vastaus":3,"vinkki":"Mahdottomalla tapahtumalla ei ole yhtään suotuisaa alkeistapausta.","selitys":"Tapahtumilla 1, 3 ja 5 ei ole yhtään suotuisaa silmälukua, joten ne ovat mahdottomia. Tapahtuma 4 on varma, ja tapahtuma 2 on mahdollinen (todennäköisyys 1/2).","tyyppi":"luku"},{"id":"H20","ryhma":"tarkistus","kysymys":"Luvuista 1–10 arvotaan yksi. Tapahtumat:\n1) luku on pienempi kuin 11\n2) luku on 0\n3) luku on parillinen tai pariton\n4) luku on suurempi kuin 9\n5) luku on alkuluku\n\nMontako tapahtumista on varmoja?","vastaus":2,"vinkki":"Varmassa tapahtumassa jokainen alkeistapaus 1–10 on suotuisa.","selitys":"Tapahtumat 1 ja 3 ovat varmoja, koska jokainen luku 1–10 on pienempi kuin 11 ja jokainen on joko parillinen tai pariton. Tapahtuma 2 on mahdoton. Tapahtumalle 4 suotuisa on vain 10, ja alkulukuja on neljä.","tyyppi":"luku"}],"valmis_teksti":"Osaat luetella satunnaisilmiön alkeistapaukset ja laskea tapahtuman todennäköisyyden suotuisten ja kaikkien alkeistapausten avulla murtolukuna, desimaalilukuna ja prosentteina. Tarkistat, että alkeistapaukset ovat yhtä todennäköisiä, tunnistat mahdottoman ja varman tapahtuman ja tiedät, miksi todennäköisyys on aina välillä 0–1. Tämä taito on nyt näytetty."};

/* ---------- teksti ---------- */
const esc = s => s;
const osat = D.teksti.map(o=>{
  switch(o.tyyppi){
    case "johdanto":
      return `<p class="lead">${esc(o.sisalto)}</p>`;
    case "kappale":
      return `<h2>${esc(o.otsikko)}</h2><p>${esc(o.sisalto)}</p>`;
    case "saanto":
      return `<div class="box"><h3>${esc(o.otsikko)}</h3><ol class="steps">${
        o.askeleet.map(a=>`<li><span>${esc(a)}</span></li>`).join("")}</ol></div>`;
    case "taulukko":
      return `<div class="box"><h3>${esc(o.otsikko)}</h3><div class="tablewrap"><table><thead><tr>${
        o.otsikkorivi.map(h=>`<th>${h}</th>`).join("")}</tr></thead><tbody>${
        o.rivit.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join("")}</tr>`).join("")}</tbody></table></div></div>`;
    case "ansa":
      return `<div class="box warn"><h3>${esc(o.otsikko)}</h3><p style="margin:0">${esc(o.sisalto)}</p></div>`;
    case "muistilappu":
      return `<div class="box note"><h3>${esc(o.otsikko)}</h3><ul class="notes">${
        o.kohdat.map(k=>`<li>${esc(k)}</li>`).join("")}</ul></div>`;
    case "numerotaulu":
      return `<div class="box nt"><h3>${esc(o.otsikko)}</h3><p class="ohje">${esc(o.sisalto)}</p>
        <div class="nt-valinta" id="ntValinta"></div>
        <div class="nt-taulu" id="ntTaulu"></div>
        <p class="nt-selite" id="ntSelite"></p></div>`;
    case "vahvuusportaat":
      return `<div class="box vp"><h3>${esc(o.otsikko)}</h3><p class="ohje">${esc(o.sisalto)}</p>
        <div class="vp-tasot">${o.tasot.map(t=>
          `<div class="vp-taso" data-taso="${t.id}"><span class="vp-pallo"></span>
           <div><strong>${t.nimi}</strong><span>${t.selite}</span></div></div>`).join("")}</div>
        <div class="vp-lauseke" id="vpLauseke"></div>
        <div class="vp-rivi"><button type="button" class="btn ghost" id="vpSeuraava">Toinen lauseke</button>
        <span class="vp-vastaus" id="vpVastaus"></span></div></div>`;
    case "laskujarjestys":
      return `<div class="box lj"><h3>${esc(o.otsikko)}</h3><p style="margin:0 0 12px;font-size:14.5px;color:var(--ink-2)">${esc(o.sisalto)}</p>
        <div class="lj-exp" id="ljExp"></div>
        <div class="lj-fb" id="ljFb"></div>
        <div class="lj-row"><button type="button" class="btn ghost" id="ljSeuraava">Toinen lauseke</button>
        <span class="lj-step" id="ljStep"></span></div></div>`;
    case "lukusuora":
      return `<div class="box nl"><h3>${esc(o.otsikko)}</h3><p style="margin:0 0 8px;font-size:14.5px;color:var(--ink-2)">${esc(o.sisalto)}</p>
        <svg id="nlsvg" viewBox="0 0 640 118" role="img" aria-labelledby="nldesc"><desc id="nldesc">Lukusuora, jolla näkyy valittu luku ja lähin kymmenluku.</desc></svg>
        <div class="nl-controls">
          <label for="nlrange" style="font-size:13px;color:var(--ink-2)">Luku</label>
          <input type="range" id="nlrange" min="0" max="100" value="47" aria-describedby="nlout">
          <span class="nl-out" id="nlout"></span>
        </div></div>`;
    default: return "";
  }
}).join("");

  const ala=Math.floor(v/10)*10, yla=ala+10, puoli=ala+5;
  const pyor = (v%10)>=5 ? yla : ala;
  const x = n => X0 + (n/100)*(X1-X0);
  let s=`<line class="rail" x1="${X0}" y1="${Y}" x2="${X1}" y2="${Y}"/>`;

/* ---------- laskujärjestys-widget ---------- */
const ljExp=document.getElementById("ljExp");
if(ljExp && D.kokeilu){
  let ljI=0, ljTokens=[], ljStep=0;
  const laske=(a,op,b)=>{a=+a;b=+b;return op==="×"?a*b:op==="÷"?a/b:op==="+"?a+b:a-b;};
  function ljAlku(){
    const l=D.kokeilu[ljI];
    ljTokens=l.lauseke.replace(/\(/g,"( ").replace(/\)/g," )").split(/\s+/).filter(Boolean);
    ljStep=0; ljPiirra(); ljViesti("","");
  }
  function ljViesti(t,lk){const f=document.getElementById("ljFb"); f.textContent=t; f.className="lj-fb "+(lk||"");}
  function ljPiirra(){
    const l=D.kokeilu[ljI];
    document.getElementById("ljStep").textContent =
      ljStep>=l.askeleet.length ? "valmis" : `askel ${ljStep+1} / ${l.askeleet.length}`;
    if(ljStep>=l.askeleet.length){
      ljExp.innerHTML=`<span class="valmis">${l.lauseke} = ${l.vastaus}</span>`;
      return;
    }
    ljExp.innerHTML=ljTokens.map((t,i)=>
      "×÷+−".includes(t) ? `<button type="button" class="op" data-i="${i}">${t}</button>`
                         : `<span class="tok">${t}</span>`).join("");
    ljExp.querySelectorAll("button.op").forEach(b=>b.addEventListener("click",()=>ljKlikkaa(+b.dataset.i)));
  }
  function ljKlikkaa(i){
    const l=D.kokeilu[ljI], odotettu=l.askeleet[ljStep];
    const ehdotus=[ljTokens[i-1],ljTokens[i],ljTokens[i+1]].join(" ");
    if(ehdotus!==odotettu){
      ljViesti(ljStep===0
        ? "Ei vielä. Sulkeet ovat vahvimmat, sitten kerto ja jako. Yhtä vahvat vasemmalta oikealle."
        : "Ei vielä. Kumpi jäljellä olevista on vahvempi?", "no");
      return;
    }
    const arvo=laske(ljTokens[i-1],ljTokens[i],ljTokens[i+1]);
    let alku=i-1, loppu=i+1;
    if(ljTokens[i-2]==="(" && ljTokens[i+2]===")"){ alku=i-2; loppu=i+2; }
    ljTokens.splice(alku, loppu-alku+1, String(arvo));
    ljStep++;
    ljViesti(ljStep>=l.askeleet.length ? "Valmis. Vastaus on "+l.vastaus+"." : "Oikein. Jatka seuraavaan.", "ok");
    ljPiirra();
  }
  document.getElementById("ljSeuraava").addEventListener("click",()=>{
    ljI=(ljI+1)%D.kokeilu.length; ljAlku();
  });
  ljAlku();
}

};

/* Suomalainen lukumuoto: välilyönti on tuhaterotin, pilkku desimaalierotin.
   Piste voi olla kumpi tahansa. Se tulkitaan tuhaterottimeksi VAIN silloin, kun
   koko luku on aitoa tuhaterotinmuotoa: alkuosa 1–3 numeroa ilman etunollaa ja
   jokainen jatko-osa täsmälleen 3 numeroa (1.500, 12.345.678). Kaikissa muissa
   tapauksissa piste on desimaalipiste — myös 0.125, joka vanhalla säännöllä
   ("3 numeroa pisteen jäljessä = tuhaterotin") luettiin virheellisesti luvuksi 125. */
const TUHATEROTIN = /^[1-9]\d{0,2}(\.\d{3})+$/;
function lueLuku(teksti){
  // Murtoluku (3/4, -3/4) ja sekaluku (1 2/3, -1 2/3) hyväksytään sellaisinaan.
  const raaka = String(teksti).replace(/\u00a0/g, " ").trim();
  let m = raaka.match(/^(-?)(\d+)\s+(\d+)\s*\/\s*(\d+)$/);
  if(m){ const nim = Number(m[4]); if(nim === 0) return null;
    const v = Number(m[2]) + Number(m[3]) / nim; return m[1] ? -v : v; }
  m = raaka.match(/^(-?)\s*(\d+)\s*\/\s*(\d+)$/);
  if(m){ const nim = Number(m[3]); if(nim === 0) return null;
    const v = Number(m[2]) / nim; return m[1] ? -v : v; }
  let s = String(teksti).replace(/[\s\u00a0]/g, "");
  if(s === "") return null;
  if(s.indexOf(",") >= 0){
    s = s.replace(/\./g, "").replace(",", ".");
  } else if(TUHATEROTIN.test(s)){
    s = s.replace(/\./g, "");
  }
  const n = Number(s);
  return Number.isFinite(n) ? n : null;
}

function tarkista(id){
  const h=D.harjoitukset.find(x=>x.id===id);
  const kentta=document.getElementById("in-"+id);
  const fb=document.getElementById("fb-"+id);
  if(kentta.value.trim()===""){ fb.className="fb hint"; fb.textContent="Kirjoita vastaus ensin."; return; }
  const luku=lueLuku(kentta.value);
  if(luku===null){ fb.className="fb no"; fb.textContent="Vastauksen pitää olla luku tai murtoluku (esimerkiksi 3/4)."; return; }
  const oikein = Math.abs(luku - h.vastaus) < 1e-9;
  merkitseTulos(id, oikein, oikein ? "Oikein. "+h.selitys : `Ei vielä. ${h.vinkki} Kokeile uudelleen.`);
}

function tarkistaMonivalinta(id, valittuIndeksi, painike){
  const h=D.harjoitukset.find(x=>x.id===id);
  const rivi=painike.closest(".row");
  rivi.querySelectorAll(".mv-valinta").forEach(b=>b.disabled=true);
  const oikein = valittuIndeksi===h.vastaus;
  painike.classList.add(oikein?"mv-oikein":"mv-vaarin");
  if(!oikein){
    const oikeaBtn=rivi.querySelector(`[data-i="${h.vastaus}"]`);
    if(oikeaBtn) oikeaBtn.classList.add("mv-oikein");
  }
  merkitseTulos(id, oikein, oikein ? "Oikein. "+h.selitys : `Ei ihan. Oikea vastaus on korostettu. ${h.selitys||""}`);
}

/* Kuuntelu: selain lukee tekstin ääneen omalla puhesynteesillään (englanniksi, jos laitteessa on
   englanninkielinen ääni). Ei äänitiedostoja eikä verkkoyhteyttä. Jos laite ei osaa puhua,
   teksti näytetään luettavaksi — silloin tehtävä muuttuu luetun ymmärtämiseksi, mutta ei katkea. */
function puhu(id, nopeus){
  const h=D.harjoitukset.find(x=>x.id===id); if(!h || !h.kuuntele) return;
  const vara=document.getElementById("vara-"+id);
  const naytaTeksti=syy=>{ vara.hidden=false; vara.textContent=syy+" Teksti: "+h.kuuntele; };
  if(!("speechSynthesis" in window)){ naytaTeksti("Tämä laite ei osaa lukea ääneen."); return; }
  const s=window.speechSynthesis; s.cancel();
  const u=new SpeechSynthesisUtterance(h.kuuntele);
  u.lang=h.kieli||"en-GB"; u.rate=nopeus;
  const aanet=s.getVoices(), kieli=u.lang.slice(0,2);
  const aani=aanet.find(a=>a.lang===u.lang) || aanet.find(a=>a.lang && a.lang.startsWith(kieli));
  if(aani) u.voice=aani;
  else if(aanet.length) { naytaTeksti("Laitteessa ei ole englanninkielistä ääntä."); return; }
  u.onerror=()=>naytaTeksti("Ääneen lukeminen ei onnistunut.");
  s.speak(u);
}
