<title>Pyhä paikka</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">

<style>
:root{
  --paper:#EFF2F5; --surface:#FFFFFF; --surface-2:#F7F9FB;
  --grid:#DCE3EA; --line:#C9D3DC;
  --ink:#15222C; --ink-2:#4E626F; --ink-3:#7E8F9B;
  --core:#1B5A9E; --core-soft:#E4EDF6;
  --strong:#1F6E5C; --strong-soft:#E1F0EB;
  --chal:#9A6A16; --chal-soft:#F6EDDC;
  --alert:#A33A2B; --alert-soft:#F8E7E3;
  --shadow:0 1px 2px rgba(21,34,44,.06), 0 8px 24px -12px rgba(21,34,44,.18);
  --r:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0F161B; --surface:#18222A; --surface-2:#1D2830;
    --grid:#22303A; --line:#2E3E4A;
    --ink:#E8EFF4; --ink-2:#A3B4C0; --ink-3:#7A8B97;
    --core:#7FB2E4; --core-soft:#16303F;
    --strong:#77CDB4; --strong-soft:#123028;
    --chal:#E0B267; --chal-soft:#33270F;
    --alert:#E8907F; --alert-soft:#3A1E19;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -14px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --paper:#0F161B; --surface:#18222A; --surface-2:#1D2830;
  --grid:#22303A; --line:#2E3E4A;
  --ink:#E8EFF4; --ink-2:#A3B4C0; --ink-3:#7A8B97;
  --core:#7FB2E4; --core-soft:#16303F;
  --strong:#77CDB4; --strong-soft:#123028;
  --chal:#E0B267; --chal-soft:#33270F;
  --alert:#E8907F; --alert-soft:#3A1E19;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -14px rgba(0,0,0,.7);
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:16px; line-height:1.62;
  background-image:
    linear-gradient(to right, var(--grid) 1px, transparent 1px),
    linear-gradient(to bottom, var(--grid) 1px, transparent 1px);
  background-size:26px 26px;
}
.wrap{max-width:760px; margin:0 auto; padding:28px 20px 90px}
h1,h2,h3,h4{font-family:"Familjen Grotesk","IBM Plex Sans",system-ui,sans-serif; text-wrap:balance}

/* header */
header.top{background:var(--surface); border:1px solid var(--line); border-radius:var(--r);
  box-shadow:var(--shadow); padding:22px 24px; display:flex; gap:18px; align-items:flex-start}
.badge{flex:0 0 auto; width:54px; height:54px; border-radius:9px; display:grid; place-items:center;
  background:var(--core-soft); border:1px solid var(--core); color:var(--core)}
.badge svg{width:28px; height:28px; fill:none; stroke:currentColor; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round}
.eyebrow{font-family:"IBM Plex Mono",monospace; font-size:11px; letter-spacing:.14em;
  text-transform:uppercase; color:var(--ink-3); margin:0 0 5px}
header.top h1{margin:0; font-size:30px; font-weight:700; letter-spacing:-.015em}
header.top p{margin:5px 0 0; color:var(--ink-2); font-size:15px}
.tags{display:flex; flex-wrap:wrap; gap:5px; margin-top:11px}
.tag{font-family:"IBM Plex Mono",monospace; font-size:10.5px; letter-spacing:.05em; padding:2px 7px;
  border-radius:4px; background:var(--surface-2); border:1px solid var(--line); color:var(--ink-3)}
.tag.core{background:var(--core-soft); border-color:var(--core); color:var(--core)}

/* teksti */
article{margin-top:26px}
article h2{font-size:21px; font-weight:600; margin:32px 0 10px; letter-spacing:-.01em}
article p{margin:0 0 14px; max-width:64ch}
.lead{font-size:17.5px; color:var(--ink); border-left:3px solid var(--core); padding-left:16px; margin:0 0 8px}

.box{background:var(--surface); border:1px solid var(--line); border-radius:var(--r);
  padding:18px 22px; box-shadow:var(--shadow); margin:22px 0}
.box h3{margin:0 0 12px; font-size:16.5px; font-weight:600}
.box.warn{border-left:3px solid var(--alert)}
.box.note{border-left:3px solid var(--chal)}

ol.steps{margin:0; padding-left:0; list-style:none; counter-reset:s; display:grid; gap:12px}
ol.steps li{counter-increment:s; display:grid; grid-template-columns:auto 1fr; gap:13px; align-items:start}
ol.steps li::before{content:counter(s); font-family:"Familjen Grotesk",sans-serif; font-weight:700; font-size:14px;
  width:26px; height:26px; border-radius:50%; background:var(--core); color:#fff; display:grid; place-items:center; margin-top:2px}

ul.notes{margin:0; padding-left:19px}
ul.notes li{margin-bottom:7px}
ul.notes li:last-child{margin-bottom:0}

.tablewrap{overflow-x:auto}
table{border-collapse:collapse; width:100%; font-size:14.5px; min-width:460px}
th,td{text-align:left; padding:9px 13px; border-bottom:1px solid var(--line)}
th{font-family:"IBM Plex Mono",monospace; font-size:10.5px; letter-spacing:.1em; text-transform:uppercase;
  color:var(--ink-3); font-weight:400; background:var(--surface-2)}
tr:last-child td{border-bottom:0}
td b{color:var(--core); font-weight:600}
td:last-child{font-variant-numeric:tabular-nums; font-weight:600}

/* lukusuora */
.nl svg{width:100%; height:118px; display:block}
.nl .rail{stroke:var(--line); stroke-width:2}
.nl .tick{stroke:var(--line); stroke-width:1.5}
.nl .stop{fill:var(--ink-3); font-family:"IBM Plex Mono",monospace; font-size:11px}
.nl .stop.near{fill:var(--core); font-weight:600}
.nl .dot{fill:var(--chal)}
.nl .val{fill:var(--ink); font-family:"Familjen Grotesk",sans-serif; font-size:15px; font-weight:700}
.nl .halfway{stroke:var(--chal); stroke-dasharray:3 3; stroke-width:1.5}
.nl-controls{display:flex; align-items:center; gap:14px; margin-top:6px}
.nl-controls input{flex:1; accent-color:var(--core)}
.nl-out{font-family:"Familjen Grotesk",sans-serif; font-size:15px; font-weight:600; min-width:12.5em; text-align:right}

/* paikka-arvotaulu */
.box .ohje{margin:0 0 14px; font-size:14.5px; color:var(--ink-2)}
.nt-valinta{display:flex; flex-wrap:wrap; gap:7px; margin-bottom:16px}
.nt-valinta button{font:inherit; font-size:12.5px; font-family:"IBM Plex Mono",monospace; padding:5px 11px;
  border-radius:6px; border:1px solid var(--line); background:var(--surface-2); color:var(--ink-2); cursor:pointer}
.nt-valinta button[aria-pressed="true"]{background:var(--ink); color:var(--paper); border-color:var(--ink)}
.nt-valinta button:focus-visible{outline:2px solid var(--core); outline-offset:2px}
.nt-taulu{display:flex; flex-direction:column; gap:4px; align-items:flex-start; overflow-x:auto; padding-bottom:4px}
.nt-rivi{display:flex; gap:6px; align-items:center}
.nt-rivi .otsa{font-family:"IBM Plex Mono",monospace; font-size:9.5px; letter-spacing:.08em;
  text-transform:uppercase; color:var(--ink-3); width:52px; text-align:center}
.nt-ruutu{width:52px; height:52px; display:grid; place-items:center; border:1.5px solid var(--line);
  border-radius:7px; background:var(--surface-2); font-family:"IBM Plex Mono",monospace; font-size:24px}
.nt-ruutu.kohta{border-color:var(--core); background:var(--core-soft); color:var(--core); font-weight:500}
.nt-ruutu.ratkaiseva{border-color:var(--chal); background:var(--chal-soft); color:var(--chal); font-weight:500}
.nt-ruutu.nolla{color:var(--ink-3)}
.nt-rivi .nimi{font-size:12.5px; color:var(--ink-3); margin-left:12px; white-space:nowrap}
.nt-nuoli{font-size:17px; color:var(--chal); margin-left:6px}
.nt-selite{margin:14px 0 0; font-size:14.5px}
.nt-selite b{color:var(--core)}

/* vahvuusportaat */
.vp-tasot{display:grid; gap:9px; margin-bottom:18px}
.vp-taso{display:flex; gap:11px; align-items:flex-start; font-size:13.5px}
.vp-taso .vp-pallo{width:13px; height:13px; border-radius:4px; margin-top:5px; flex:0 0 auto}
.vp-taso[data-taso="sulkeet"] .vp-pallo{background:var(--core)}
.vp-taso[data-taso="kertojako"] .vp-pallo{background:var(--strong)}
.vp-taso[data-taso="yhteenvahennys"] .vp-pallo{background:var(--chal)}
.vp-taso strong{display:block; font-family:"Familjen Grotesk",sans-serif; font-weight:600; font-size:14.5px}
.vp-taso span{color:var(--ink-2)}
.vp-lauseke{display:flex; flex-wrap:wrap; gap:7px; align-items:flex-end; font-family:"IBM Plex Mono",monospace;
  font-size:25px; padding:10px 2px; min-height:64px}
.vp-lauseke .t{padding:2px 3px}
.vp-lauseke .op{position:relative; padding:2px 9px; border-radius:6px; font-weight:500}
.vp-lauseke .op[data-taso="sulkeet"]{background:var(--core-soft); color:var(--core)}
.vp-lauseke .op[data-taso="kertojako"]{background:var(--strong-soft); color:var(--strong)}
.vp-lauseke .op[data-taso="yhteenvahennys"]{background:var(--chal-soft); color:var(--chal)}
.vp-lauseke .op i{position:absolute; top:-9px; right:-6px; font-style:normal; font-family:"Familjen Grotesk",sans-serif;
  font-size:11px; font-weight:700; width:18px; height:18px; border-radius:50%; display:grid; place-items:center;
  background:currentColor}
.vp-lauseke .op i span{color:var(--surface)}
.vp-rivi{display:flex; align-items:center; gap:16px; margin-top:8px}
.vp-vastaus{font-family:"Familjen Grotesk",sans-serif; font-size:16px; font-weight:600; color:var(--strong)}

/* laskujärjestys-widget */
.lj-exp{display:flex; flex-wrap:wrap; gap:7px; align-items:center; font-family:"IBM Plex Mono",monospace;
  font-size:23px; padding:14px 4px; min-height:62px}
.lj-exp .tok{padding:2px 4px; color:var(--ink)}
.lj-exp button.op{font-family:"IBM Plex Mono",monospace; font-size:23px; padding:3px 12px; border-radius:7px;
  border:1.5px solid var(--line); background:var(--surface-2); color:var(--ink); line-height:1.2}
.lj-exp button.op:hover{border-color:var(--core); color:var(--core)}
.lj-exp button.op:focus-visible{outline:2px solid var(--core); outline-offset:2px}
.lj-exp .valmis{font-family:"Familjen Grotesk",sans-serif; font-size:23px; font-weight:700; color:var(--strong)}
.lj-fb{font-size:14.5px; min-height:1.5em; color:var(--ink-2)}
.lj-fb.no{color:var(--alert)}
.lj-fb.ok{color:var(--strong)}
.lj-row{display:flex; align-items:center; gap:14px; margin-top:10px}
.lj-step{font-family:"IBM Plex Mono",monospace; font-size:11.5px; letter-spacing:.1em;
  text-transform:uppercase; color:var(--ink-3)}

/* harjoitukset */
.progress{position:sticky; top:0; z-index:5; background:var(--surface); border:1px solid var(--line);
  border-radius:var(--r); padding:12px 18px; box-shadow:var(--shadow); display:flex; align-items:center;
  gap:14px; margin:34px 0 18px}
.progress .lbl{font-family:"IBM Plex Mono",monospace; font-size:11px; letter-spacing:.12em;
  text-transform:uppercase; color:var(--ink-3); white-space:nowrap}
.progress .meter{flex:1; height:7px; border-radius:4px; background:var(--surface-2); border:1px solid var(--line); overflow:hidden}
.progress .meter i{display:block; height:100%; background:var(--core); transition:width .25s ease}
.progress .cnt{font-family:"Familjen Grotesk",sans-serif; font-weight:700; font-variant-numeric:tabular-nums; white-space:nowrap}

.grp{margin-top:26px}
.grp-head{display:flex; align-items:baseline; gap:10px; border-bottom:1.5px solid var(--ink); padding-bottom:7px; margin-bottom:14px}
.grp-head h3{margin:0; font-size:17px; font-weight:600}
.grp-head span{font-size:12.5px; color:var(--ink-2)}

.ex{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:14px 16px; margin-bottom:10px}
.ex[data-tila="oikein"]{border-color:var(--strong); box-shadow:inset 3px 0 0 var(--strong)}
.ex[data-tila="vaarin"]{border-color:var(--alert); box-shadow:inset 3px 0 0 var(--alert)}
.ex .q{display:flex; gap:11px; align-items:baseline; flex-wrap:wrap}
.ex .num{font-family:"IBM Plex Mono",monospace; font-size:11.5px; color:var(--ink-3); min-width:2.4em}
.ex .txt{flex:1; min-width:190px; font-size:15.5px}
.ex .txt .aineisto{display:block; margin-bottom:9px; padding-left:12px;
  border-left:2px solid var(--line); color:var(--ink-2); line-height:1.6;
  /* Aineisto voi olla pieni taulukko, jonka rivit on erotettu rivinvaihdoilla.
     Ilman pre-lineä ne valuisivat yhdeksi kappaleeksi ja taulukko katoaisi. */
  white-space:pre-line}
.ex .txt .kysymysrivi{display:block; font-weight:600}
.ex .row{display:flex; gap:8px; align-items:center; margin-top:11px; flex-wrap:wrap}
.ex input[type=text]{font:inherit; font-family:"IBM Plex Mono",monospace; font-size:15px; width:8.5em;
  padding:7px 11px; border:1px solid var(--line); border-radius:7px; background:var(--surface-2);
  color:var(--ink); text-align:right}
.ex input:focus-visible{outline:2px solid var(--core); outline-offset:1px}
button{font:inherit; cursor:pointer}
.btn{font-size:13.5px; padding:7px 15px; border-radius:7px; border:1px solid var(--core);
  background:var(--core); color:#fff}
.btn.ghost{background:transparent; color:var(--ink-2); border-color:var(--line)}
.btn:focus-visible{outline:2px solid var(--core); outline-offset:2px}
.btn.mv-valinta{text-align:left}
/* kuuntelutehtävä: selaimen puhesynteesi lukee englanninkielisen tekstin */
.kuuntele{display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin:2px 0 10px}
.kuuntele .btn{display:inline-flex; gap:7px; align-items:center}
.kuuntele svg{width:16px; height:16px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round}
.kuuntele .varateksti{flex-basis:100%; font-size:14px; color:var(--ink-2); background:var(--surface-2);
  border-radius:7px; padding:8px 12px; margin:0}
.btn.mv-valinta:disabled{cursor:default; opacity:.65}
.btn.mv-oikein{background:var(--strong-soft); border-color:var(--strong); color:var(--strong); opacity:1}
.btn.mv-vaarin{background:var(--alert-soft); border-color:var(--alert); color:var(--alert); opacity:1}
.row.mv{gap:8px 10px}
.fb{margin-top:11px; font-size:14.5px; padding:10px 13px; border-radius:8px; line-height:1.5}
.fb.ok{background:var(--strong-soft); color:var(--strong)}
.fb.no{background:var(--alert-soft); color:var(--alert)}
.fb.hint{background:var(--chal-soft); color:var(--chal)}

.done{background:var(--strong-soft); border:1px solid var(--strong); color:var(--strong);
  border-radius:var(--r); padding:16px 20px; margin-top:20px; font-size:15.5px}
.done h3{margin:0 0 4px; font-size:17px; color:var(--strong)}

details.teacher{margin-top:34px; background:var(--surface); border:1px solid var(--line);
  border-left:3px solid var(--chal); border-radius:var(--r); padding:15px 20px; box-shadow:var(--shadow)}
details.teacher summary{cursor:pointer; font-family:"Familjen Grotesk",sans-serif; font-weight:600; font-size:15px}
details.teacher summary:focus-visible{outline:2px solid var(--core); outline-offset:3px}
details.teacher ul{margin:12px 0 0; padding-left:19px; color:var(--ink-2); font-size:14.5px}
details.teacher li{margin-bottom:8px}
details.teacher p{margin:12px 0 0; color:var(--ink-2); font-size:14.5px}

.back{display:inline-block; margin-top:30px; font-size:13.5px; color:var(--ink-2)}
.back a{color:var(--core)}

@media (prefers-reduced-motion: reduce){*{transition:none !important}}
@media (max-width:560px){
  .wrap{padding:16px 13px 70px}
  header.top h1{font-size:25px}
  .progress{flex-wrap:wrap}
}
</style>

<div class="wrap">

  <header class="top">
    <span class="badge"><svg viewBox="0 0 24 24" aria-hidden="true" id="ikoni"></svg></span>
    <div>
      <p class="eyebrow" id="eyebrow"></p>
      <h1 id="otsikko"></h1>
      <p id="kuvaus"></p>
      <div class="tags" id="tags"></div>
    </div>
  </header>

  <article id="teksti"></article>

  <div class="progress" aria-live="polite">
    <span class="lbl">Harjoitukset</span>
    <span class="meter"><i id="pbar" style="width:0%"></i></span>
    <span class="cnt" id="pcnt">0 / 20</span>
  </div>

  <div id="harjoitukset"></div>
  <div id="valmis"></div>

  <p class="back" id="back"></p>

</div>

<script>
const D = {"tavoite_id":"UE4-TAP-03","oppiaine":"UE","vuosiluokka":4,"taso":"vahvistava","otsikko":"Pyhä paikka","kuvaus":"Tiedän, millainen paikka kirkko on ja miten siellä käyttäydytään vierailulla.","versio":"0.3","paivitetty":"2026-09-26","ops":{"T":["T2","T7"],"S":["S1"],"ET":["T4"]},"eyebrow":"Uskonto · 4. luokka · Kirkkovuosi ja tavat","ikoni":"pyha","teksti":[{"tyyppi":"johdanto","sisalto":"Kun kävelet sunnuntaiaamuna kirkon ohi, kuulet kellojen soivan. Ne kertovat, että jumalanpalvelus alkaa pian. Kirkko on rakennus, jossa kristityt kokoontuvat jumalanpalvelukseen ja jossa kastetaan lapsia, vihitään pareja ja pidetään hautajaisia. Jokaisella kirkon osalla on oma tehtävänsä. Kun tiedät, mitä missäkin tehdään, tunnistat osat myös kirkossa, jossa et ole ennen käynyt. Monelle ihmiselle kirkko on pyhä paikka. Siksi siellä käyttäydytään toisin kuin kaupassa tai välitunnilla, ja tässä taidossa opit myös, miksi."},{"tyyppi":"kappale","otsikko":"Kirkon etuosa: kuori, alttari ja alttaritaulu","sisalto":"Kirkon etuosaa kutsutaan kuoriksi. Sen lattia on usein vähän muuta lattiaa korkeammalla. Kuorissa on alttari: pöytä, jonka päällä on tavallisesti risti ja kynttilät. Alttarin ääressä vietetään ehtoollista, jossa leipä ja viini siunataan, ja siellä rukoillaan. Alttarin edessä on usein puoliympyrän muotoinen alttarikaide, jonka ääreen tullaan ehtoolliselle. Monessa kirkossa alttarin yläpuolella tai takana on alttaritaulu. Se on maalaus, jonka aihe on yleensä Raamatun kertomuksista, esimerkiksi Jeesuksen elämästä. Kaikissa kirkoissa alttaritaulua ei ole: sen paikalla voi olla esimerkiksi iso risti tai ikkuna. Tässä taidossa kuvataan evankelisluterilaista kirkkoa, joita Suomessa on eniten. Ortodoksinen kirkko näyttää sisältä erilaiselta: siellä alttarin edessä on ikonostaasi eli kuvaseinä."},{"tyyppi":"kappale","otsikko":"Kastemalja, saarnatuoli, urut ja penkit","sisalto":"Kastemalja on malja kastevettä varten. Se on usein jalustan päällä kuorissa tai sen lähellä, ja sen äärellä kastetaan. Saarnatuoli, jota sanotaan myös saarnastuoliksi, on korotettu puhujapaikka. Sinne noustaan portaita, ja sen yläpuolella on usein katos, joka auttaa ääntä kuulumaan kirkkosaliin. Saarnatuolista pappi pitää saarnan eli puheen, jossa hän selittää päivän Raamatun tekstiä. Monessa kirkossa saarna pidetään myös lukupulpetista, joka on kuorissa oleva puhujan teline. Urut ovat kirkon soitin. Niissä on satoja tai jopa tuhansia putkia, joista osa näkyy ulospäin, ja kanttori soittaa niitä koskettimilla. Monessa kirkossa urut ovat takaparvella sisäänkäynnin yläpuolella, joissakin kirkoissa edessä. Penkit ovat kirkkosalissa riveissä, ja niiden välissä kulkee usein keskikäytävä kohti alttaria."},{"tyyppi":"kappale","otsikko":"Torni, kellot ja sakaristo","sisalto":"Kirkonkellot soivat esimerkiksi ennen jumalanpalvelusta ja hautajaisissa. Monessa kirkossa kellot ovat kirkkotornissa, joka on osa kirkkorakennusta. Monen vanhan suomalaisen kirkon vieressä on kuitenkin erillinen tapuli. Tapuli on oma rakennuksensa kirkon pihalla, ja kellot riippuvat sen yläosassa. Sakaristo on kirkon sisällä oleva huone, yleensä kuorin vieressä. Siellä pappi ja muut jumalanpalveluksen toimittajat valmistautuvat ja pukeutuvat, ja siellä säilytetään ehtoollisastioita ja kirkon tekstiilejä. Kirkkoa ympäröivä alue on kirkkomaa, ja monen kirkon ympärillä on hautausmaa. Tapuli, kirkkomaa ja hautausmaa ovat kirkkorakennuksen ulkopuolella."},{"tyyppi":"taulukko","otsikko":"Kirkon osat","otsikkorivi":["Osa","Mistä sen tunnistaa","Mitä siellä tehdään"],"rivit":[["Alttari","Pöytä kuorissa, päällä yleensä risti ja kynttilät","Ehtoollinen ja rukous"],["Alttaritaulu","Maalaus alttarin yläpuolella tai takana","Kertoo kuvana Raamatun kertomuksesta"],["Kastemalja","Malja jalustalla kuorissa tai sen lähellä","Kaste"],["Saarnatuoli","Korotettu puhujapaikka, portaat ja usein katos","Saarna"],["Urut","Soitin, jossa on paljon putkia ja koskettimet","Virsien säestys ja musiikki"],["Penkit","Istuinrivit kirkkosalissa","Seurakunta istuu"],["Kirkkotorni tai tapuli","Torni osana kirkkoa tai erillinen rakennus pihalla","Kellot soivat"],["Sakaristo","Huone kuorin vieressä","Pappi valmistautuu, ehtoollisastiat säilytetään"]]},{"tyyppi":"ansa","otsikko":"Ansa 1: alttari ja saarnatuoli sekaisin","sisalto":"Alttari ja saarnatuoli ovat kumpikin kirkon etuosassa, ja kummankin luona pappi puhuu. Siksi ne menevät helposti sekaisin. Ero on muodossa ja tehtävässä. Alttari on pöytä kuorin lattialla, ja sen ääressä vietetään ehtoollista ja rukoillaan. Saarnatuoli on korkealla, sinne noustaan portaita, ja siellä pidetään saarna. Tämän taidon kuvauksissa portaat ylös puhujapaikkaan ja katos kertovat saarnatuolista, ja pöytä, jolla on risti, kynttilät tai ehtoollisastiat, kertoo alttarista."},{"tyyppi":"ansa","otsikko":"Ansa 2: kastemalja ja ehtoollisastiat","sisalto":"Sana malja on kahden eri esineen nimessä. Kastemalja on leveä ja matala malja, jossa on vettä, ja sitä käytetään kasteessa. Ehtoollisella käytetään ehtoollisastioita: kalkki eli ehtoollismalja on jalallinen malja viinille, pateeni on lautanen leivälle, öylättirasiassa on ehtoollisleipää eli öylättejä ja viinikannussa on viiniä. Kun kysymys koskee kastetta, etsi vettä ja kastemaljaa. Kun kysymys koskee ehtoollista, etsi leipää, viiniä ja niiden astioita. Myös kastekynttilä kuuluu kasteeseen eikä ehtoolliseen, vaikka alttarillakin on kynttilöitä."},{"tyyppi":"kappale","otsikko":"Miksi kirkossa ollaan hiljaa","sisalto":"Kirkossa ollaan hiljaa, koska monelle ihmiselle se on pyhä paikka. Kristityt kokoontuvat kirkkoon jumalanpalvelukseen ja rukoilemaan. Kirkossa myös kastetaan lapsia ja hyvästellään kuollut läheinen hautajaisissa. Joku voi istua kirkossa suremassa tai rukoilemassa silloinkin, kun jumalanpalvelusta ei ole. Kunnioitus ei siksi riipu siitä, mitä sinä itse uskot. Kirkossa saa käydä, vaikka ei itse uskoisi, eikä vierailijan tarvitse rukoilla tai laulaa mukana. Kunnioitus tarkoittaa, että annat tilaa niille, joille paikka on tärkeä. Samasta syystä käyttäydytään kunnioittavasti myös muiden uskontojen pyhissä paikoissa, kuten moskeijassa ja synagogassa."},{"tyyppi":"saanto","otsikko":"Näin vierailet kirkossa","askeleet":["Ennen sisäänmenoa: laita puhelin äänettömälle. Ota pipo tai lippis pois päästä. Se on Suomessa tapa sisätiloissa ja myös kirkossa. Uskonnollisista syistä käytettyä huivia tai muuta päähinettä ei tarvitse riisua.","Sisällä: puhu hiljaa ja kävele rauhallisesti. Kirkossa ääni kantaa kauas. Eväät pysyvät laukussa.","Katso, mutta älä koske: alttarille, saarnatuoliin ja sakaristoon mennään vain luvalla, eikä urkuja tai esineitä kokeilla kysymättä. Kysy lupa myös ennen kuin kuvaat.","Jos kirkossa on meneillään kaste, vihkiminen tai hautajaiset, joihin et ole tullut, älä mene sisään kesken. Odota hiljaa ulkona tai sovi käynti toiseen kertaan.","Toisen uskonnon pyhässä paikassa tavat voivat olla erilaiset. Moskeijassa kengät riisutaan ennen rukoussaliin menoa. Synagogassa miesten ja poikien on tapana peittää päänsä, ja vierailijaa pyydetään usein tekemään samoin. Kysy oppaalta, jos et tiedä, ja noudata paikan tapaa."]},{"tyyppi":"muistilappu","otsikko":"Muista nämä","kohdat":["Alttari on pöytä kuorissa: ehtoollinen ja rukous.","Saarnatuoli on korkealla portaiden päässä: saarna.","Kastemalja on kastevettä varten. Kalkki ja pateeni ovat ehtoollista varten.","Kellot ovat kirkkotornissa tai erillisessä tapulissa. Sakaristo on huone, jossa pappi valmistautuu.","Hiljaisuus ja kunnioitus antavat tilaa niille, joille paikka on pyhä. Se ei vaadi omaa uskoa.","Eri pyhissä paikoissa kunnioitus näkyy eri tavoin: kysy ja noudata paikan tapaa."]}],"harjoitusryhmat":[{"id":"osat","nimi":"Kirkon osat","info":"Tunnista osa sen muodosta ja paikasta: pöytä, portaat, putket, malja vai huone. Mieti myös, onko se kirkon sisällä vai pihalla."},{"id":"kaytto","nimi":"Mitä missäkin tehdään","info":"Mieti ensin, mitä tapahtuu: kaste, ehtoollinen, saarna vai valmistautuminen. Etsi sitten osa tai esine, joka kuuluu juuri siihen."},{"id":"vierailu","nimi":"Vierailu pyhässä paikassa","info":"Kysy jokaisesta teosta: antaako se tilaa niille, joille paikka on pyhä?"}],"harjoitukset":[{"id":"H01","ryhma":"osat","kysymys":"Kirkon kuvaus:\n1. Pitkät puiset istuimet riveissä keskikäytävän molemmin puolin.\n2. Korotettu puhujapaikka kirkkosalin seinällä. Sinne noustaan portaita, ja sen yläpuolella on katos.\n3. Pöytä kirkon etuosassa. Sen päällä on risti ja kaksi kynttilää.\n4. Soitin takaparvella. Siinä on paljon metalliputkia.\n\nMonesko kohta on saarnatuoli?","vastaus":2,"vinkki":"Saarnatuoli on korkealla, ja sinne noustaan portaita.","selitys":"Kohta 2 on korotettu puhujapaikka, jonne noustaan portaita ja jonka yläpuolella on katos. Se on saarnatuoli. Kohta 3 on pöytä, jolla on risti ja kynttilät, eli alttari."},{"id":"H02","ryhma":"osat","kysymys":"Kirkon kuvaus:\n1. Matala malja jalustalla kirkon etuosan sivussa.\n2. Pieni huone kuorin vieressä. Sinne johtaa ovi, ja siellä on vaatekaappi.\n3. Maalaus etuseinällä pöydän yläpuolella. Siinä Jeesus ja opetuslapset ovat veneessä.\n4. Istuinrivit keskikäytävän molemmin puolin.\n5. Erillinen rakennus kirkon pihalla. Sen yläosassa riippuu kaksi kelloa.\n\nMonesko kohta on alttaritaulu?","vastaus":3,"vinkki":"Alttaritaulu on maalaus. Missä kohdassa puhutaan maalauksesta?","selitys":"Kohta 3 on maalaus alttarin eli pöydän yläpuolella. Se on alttaritaulu. Kohta 1 on kastemalja, kohta 2 sakaristo, kohta 4 penkit ja kohta 5 tapuli."},{"id":"H03","ryhma":"osat","kysymys":"Luettelo:\nalttari\nhautausmaa\npenkit\ntapuli\nurut\nkastemalja\n\nMontako näistä on kirkkorakennuksen sisällä olevia esineitä tai paikkoja?","vastaus":4,"vinkki":"Kaksi luettelon kohdista on kirkon pihalla.","selitys":"Alttari, penkit, urut ja kastemalja ovat kirkon sisällä. Hautausmaa ja erillinen tapuli ovat kirkkorakennuksen ulkopuolella. Sisällä on 4."},{"id":"H04","ryhma":"osat","kysymys":"Kirkon kuvaus:\n1. Pöytä kuorissa. Sen päällä on kalkki ja kaksi kynttilää.\n2. Erillinen puinen rakennus kirkon pihalla. Sen yläosassa riippuu kolme kelloa.\n3. Istuinrivit kirkkosalissa.\n4. Kiviaidan ympäröimä alue kirkon ympärillä. Siellä on hautakiviä.\n5. Korotettu puhujapaikka, jonne noustaan portaita.\n6. Katettu puuportti kirkkomaan aidassa.\n\nMontako kohdista on kirkon ulkopuolella?","vastaus":3,"vinkki":"Etsi kohdat, joissa puhutaan pihasta, aidasta tai kirkon ympäristöstä.","selitys":"Tapuli (2), hautausmaa (4) ja portti (6) ovat kirkon ulkopuolella. Alttari, penkit ja saarnatuoli ovat sisällä. Ulkopuolella on 3."},{"id":"H05","ryhma":"osat","tyyppi":"monivalinta","kysymys":"Kuvaus: \"Pöytä kirkon etuosassa. Se on tehty tammesta. Sen päällä on risti ja kaksi kynttilää, ja sen edessä on puoliympyrän muotoinen kaide. Pöydän vieressä on ikkuna.\"\n\nMikä kuvauksen osa kertoo parhaiten, että kyse on alttarista?","vaihtoehdot":["Pöytä on tehty tammesta.","Pöydän päällä on risti ja kynttilät, ja sen edessä on kaide.","Pöydän vieressä on ikkuna."],"vastaus":1,"vinkki":"Mikä kuvauksen tiedoista sopisi vain alttariin eikä mihin tahansa pöytään?","selitys":"Risti, kynttilät ja kaide, jonka ääreen tullaan ehtoolliselle, kuuluvat alttariin. Puinen pöytä tai ikkuna voisi olla missä tahansa huoneessa, joten ne eivät kerro, mikä osa on kyseessä."},{"id":"H06","ryhma":"osat","kysymys":"Kuori on kirkon etuosa.\n\nKirkon kuvaus:\n1. Alttari kirkon etuosan keskellä.\n2. Urut takaparvella sisäänkäynnin yläpuolella.\n3. Kastemalja kirkon etuosassa alttarin vasemmalla puolella.\n4. Penkit kirkkosalissa keskikäytävän molemmin puolin.\n5. Alttaritaulu kirkon etuosassa alttarin yläpuolella.\n\nMontako kohdista on kuorissa?","vastaus":3,"vinkki":"Kuori on etuosa. Mitkä kohdat ovat kirkon etuosassa?","selitys":"Alttari (1), kastemalja (3) ja alttaritaulu (5) ovat etuosassa eli kuorissa. Urut ovat tässä kirkossa takaparvella, ja penkit ovat kirkkosalissa. Kuorissa on 3."},{"id":"H07","ryhma":"osat","kysymys":"Kirkon kuvaus:\n1. Torni, joka on rakennettu kiinni kirkon länsipäätyyn. Sen yläosassa riippuu kaksi kelloa.\n2. Hautausmaa kirkon ympärillä.\n3. Alttari kuorissa.\n4. Penkit kirkkosalissa.\n\nMontako kohdista on kirkkorakennuksen osia tai kirkon sisällä?","vastaus":3,"vinkki":"Kirkkotorni on osa kirkkorakennusta. Tapuli olisi erillinen rakennus.","selitys":"Torni (1) on rakennettu kiinni kirkkoon, joten se on osa kirkkorakennusta. Alttari (3) ja penkit (4) ovat sisällä. Vain hautausmaa (2) on ulkopuolella. Vastaus on 3."},{"id":"H08","ryhma":"kaytto","kysymys":"Kirkon kuvaus:\n1. Pöytä kirkon etuosassa. Sen päällä on kalkki ja pateeni.\n2. Matala malja puisella jalustalla kuorin reunassa.\n3. Puhujakoroke, jonne noustaan portaita.\n4. Soitin parvella.\n\nKirkossa kastetaan vauva. Monesko kohta on se, jonka äärellä kaste tapahtuu?","vastaus":2,"vinkki":"Kasteessa tarvitaan vettä. Kalkki on eri malja kuin kastemalja.","selitys":"Kaste tapahtuu kastemaljan äärellä, ja kastemalja on matala malja jalustalla (2). Kohdan 1 kalkki ja pateeni ovat ehtoollisastioita, joten kohta 1 on alttari."},{"id":"H09","ryhma":"kaytto","kysymys":"Kirkon kuvaus:\n1. Puhujapaikka korkealla seinällä. Sen yläpuolella on katos.\n2. Hopeinen malja jalustalla kuorin sivussa.\n3. Pöytä kuorissa. Sen päällä on risti ja kynttilät, ja sen edessä on kaide.\n4. Huone kuorin vieressä.\n\nEhtoollisella leipä ja viini siunataan. Monesko kohta on se, jonka ääressä se tapahtuu?","vastaus":3,"vinkki":"Ehtoollista vietetään alttarin ääressä. Mikä kohta on alttari?","selitys":"Alttari on pöytä, jolla on risti ja kynttilät ja jonka edessä on alttarikaide (3). Ehtoollinen vietetään sen ääressä. Kohdan 2 malja on kastemalja, ja kohta 1 on saarnatuoli."},{"id":"H10","ryhma":"kaytto","kysymys":"Esineet:\nkalkki\nkastemalja\npateeni\nviinikannu\nkastekynttilä\n\nMontako näistä esineistä käytetään ehtoollisella?","vastaus":3,"vinkki":"Ehtoollisella tarvitaan astiat leivälle ja viinille. Sana kaste kertoo, mihin esine kuuluu.","selitys":"Kalkki, pateeni ja viinikannu ovat ehtoollisastioita. Kastemalja ja kastekynttilä kuuluvat kasteeseen. Ehtoollisella käytetään 3."},{"id":"H11","ryhma":"kaytto","kysymys":"Esineet:\nkastemalja\nöylättirasia\nkastekynttilä\nkalkki\n\nMontako näistä esineistä kuuluu kasteeseen?","vastaus":2,"vinkki":"Öylätti on ehtoollisleipä, ja kalkki on ehtoollismalja.","selitys":"Kastemalja ja kastekynttilä kuuluvat kasteeseen. Öylättirasia ja kalkki ovat ehtoollisastioita. Kasteeseen kuuluu 2."},{"id":"H12","ryhma":"kaytto","tyyppi":"monivalinta","kysymys":"Pappi pitää puheen, jossa hän selittää päivän Raamatun tekstiä. Puhetta sanotaan saarnaksi.\n\nMistä saarna perinteisesti pidetään?","vaihtoehdot":["Alttarin ääreltä.","Saarnatuolista.","Sakaristosta."],"vastaus":1,"vinkki":"Puheen nimi ja paikan nimi alkavat samalla tavalla.","selitys":"Saarna pidetään perinteisesti saarnatuolista, jonne noustaan portaita. Alttarin ääressä vietetään ehtoollista ja rukoillaan, ja sakaristossa pappi valmistautuu. Monessa kirkossa saarna pidetään myös lukupulpetista."},{"id":"H13","ryhma":"kaytto","kysymys":"Kirkon kuvaus:\n1. Istuinrivit kirkkosalissa.\n2. Pieni huone kuorin sivulla. Sinne johtaa ovi, ja siellä on vaatekaappi.\n3. Pöytä kirkon etuosassa.\n4. Soitin takaparvella.\n\nEnnen jumalanpalvelusta pappi pukee jumalanpalvelusasunsa. Monesko kohta on se, jossa hän pukeutuu?","vastaus":2,"vinkki":"Pappi valmistautuu huoneessa, jonka nimi on sakaristo.","selitys":"Sakaristo on kuorin vieressä oleva huone (2). Siellä pappi pukeutuu ja valmistautuu, ja siellä säilytetään myös ehtoollisastioita."},{"id":"H14","ryhma":"kaytto","kysymys":"Jumalanpalveluksen tapahtumia:\n1. Kellot soivat.\n2. Kanttori soittaa, ja seurakunta laulaa virren.\n3. Pappi pitää puheen päivän Raamatun tekstistä.\n4. Leipä ja viini siunataan.\n\nMonesko tapahtuma tapahtuu alttarin ääressä?","vastaus":4,"vinkki":"Mitä alttarin ääressä vietetään? Saarna ei ole se.","selitys":"Leipä ja viini siunataan ehtoollisella alttarin ääressä (4). Kellot soivat tornissa tai tapulissa, virren säestys tulee uruista, ja saarna pidetään saarnatuolista tai lukupulpetista."},{"id":"H15","ryhma":"vierailu","kysymys":"Ohjeet:\n1. Laita puhelin äänettömälle.\n2. Juokse keskikäytävää, jotta ehdit nähdä kaiken.\n3. Puhu hiljaa.\n4. Kokeile urkujen koskettimia kysymättä.\n5. Ota pipo pois päästä.\n6. Kysy lupa ennen kuin kuvaat.\n\nMontako näistä ohjeista kuuluu kirkkovierailuun?","vastaus":4,"vinkki":"Kaksi ohjetta häiritsisi muita tai koskisi kirkon esineisiin ilman lupaa.","selitys":"Ohjeet 1, 3, 5 ja 6 kuuluvat kirkkovierailuun. Juokseminen (2) ja urkujen kokeileminen kysymättä (4) eivät kuulu. Vastaus on 4."},{"id":"H16","ryhma":"vierailu","kysymys":"Miksi kirkossa puhutaan hiljaa?\n1. Joku voi olla kirkossa rukoilemassa.\n2. Kirkossa on korkea katto.\n3. Kirkossa voi olla menossa hautajaiset, ja surevat tarvitsevat rauhaa.\n4. Jokaisen kirkossa kävijän pitää uskoa Jumalaan.\n5. Monelle ihmiselle kirkko on pyhä paikka.\n\nMontako näistä on hyviä perusteluja?","vastaus":3,"vinkki":"Hyvä perustelu kertoo, mitä paikka merkitsee muille. Kirkossa saa käydä, vaikka ei itse uskoisi.","selitys":"Perustelut 1, 3 ja 5 kertovat, mitä kirkko merkitsee ihmisille, joille paikka on tärkeä. Korkea katto (2) ei ole syy olla hiljaa, ja perustelu 4 on väärä: kirkossa saa käydä, vaikka ei itse uskoisi. Vastaus on 3."},{"id":"H17","ryhma":"vierailu","tyyppi":"monivalinta","kysymys":"Vilma ei itse käy kirkossa. Luokka on menossa kirkkoon tutustumaan.\n\nMiksi Vilmankin kannattaa olla kirkossa hiljaa?","vaihtoehdot":["Koska kirkossa saa käydä vain, jos uskoo Jumalaan.","Koska kirkko on monelle ihmiselle pyhä paikka, ja siellä voi olla joku rukoilemassa tai suremassa.","Koska hiljaisuus on joka paikassa paras tapa käyttäytyä."],"vastaus":1,"vinkki":"Kunnioitus ei riipu omasta uskosta. Kenen vuoksi hiljaisuutta pidetään?","selitys":"Hiljaisuus antaa tilaa niille, joille kirkko on pyhä paikka, esimerkiksi rukoilijalle tai surevalle. Kirkossa saa käydä, vaikka ei itse uskoisi. Hiljaisuus ei myöskään ole kaikkialla paras tapa: välitunnilla saa pitää ääntä."},{"id":"H18","ryhma":"vierailu","kysymys":"Luokka saapuu kirkolle, ja kirkossa on meneillään kastetilaisuus.\n1. Mennään sisään ja istutaan eturiviin juttelemaan.\n2. Odotetaan hiljaa pihalla.\n3. Kysytään oppaalta, milloin kirkkoon voi tulla.\n4. Kuvataan kastettavaa ovelta.\n\nMontako näistä toimista sopii tilanteeseen?","vastaus":2,"vinkki":"Kaste on perheelle tärkeä hetki. Mitkä toimet antavat sille rauhan?","selitys":"Odottaminen hiljaa pihalla (2) ja kysyminen oppaalta (3) antavat perheelle rauhan. Sisään meneminen juttelemaan (1) ja kuvaaminen (4) häiritsisivät kastetta. Sopivia on 2."},{"id":"H19","ryhma":"vierailu","kysymys":"Luokka vierailee synagogassa.\n1. Pojat peittävät päänsä, kun heitä siihen pyydetään.\n2. Puhutaan hiljaa.\n3. Pojat jättävät pään paljaaksi, vaikka heitä pyydetään peittämään se, koska kirkossakin pipo otetaan pois.\n4. Kysytään oppaalta, jos ei tiedä, mitä saa tehdä.\n\nMontako näistä tavoista osoittaa kunnioitusta synagogassa?","vastaus":3,"vinkki":"Kunnioitus näkyy eri paikoissa eri tavoin. Kirkon tapa ei ole synagogan tapa.","selitys":"Pään peittäminen pyydettäessä (1), hiljaisuus (2) ja kysyminen (4) osoittavat kunnioitusta. Synagogassa miesten ja poikien on tapana peittää päänsä, joten kirkon pipotapa ei sovi sinne (3). Vastaus on 3."},{"id":"H20","ryhma":"vierailu","kysymys":"Siiri vieraili luokan kanssa kirkossa.\n1. Hän laittoi puhelimen äänettömälle jo ovella.\n2. Hän kiipesi penkin selkänojalle nähdäkseen alttaritaulun paremmin.\n3. Hän kuunteli opasta penkillä istuen.\n4. Hän kysyi oppaalta, saako urkuja katsoa läheltä.\n5. Hän kiitti opasta lähtiessään.\n\nMonesko teko ei sovi kirkkovierailulle?","vastaus":2,"vinkki":"Etsi teko, jossa kirkon kalusteita käytetään väärin.","selitys":"Penkin selkänojalle kiipeäminen (2) ei sovi kirkkoon, koska penkit ovat istumista varten ja kiipeily häiritsee muita. Muissa teoissa Siiri kunnioittaa paikkaa ja kysyy luvan."}],"valmis_teksti":"Tunnistat kirkon keskeiset osat ja tiedät, mitä missäkin tehdään, ja osaat perustella, miksi pyhässä paikassa ollaan hiljaa ja käyttäydytään kunnioittavasti. Tämä taito on nyt näytetty."};

/* ---------- teksti ---------- */
const esc = s => s;
const osat = D.teksti.map(o=>{
  switch(o.tyyppi){
    case "johdanto":
      return `<p class="lead">${esc(o.sisalto)}</p>`;
    case "kappale":
      return `<h2>${esc(o.otsikko)}</h2><p>${esc(o.sisalto)}</p>`;
    case "saanto":
      return `<div class="box"><h3>${esc(o.otsikko)}</h3><ol class="steps">${
        o.askeleet.map(a=>`<li><span>${esc(a)}</span></li>`).join("")}</ol></div>`;
    case "taulukko":
      return `<div class="box"><h3>${esc(o.otsikko)}</h3><div class="tablewrap"><table><thead><tr>${
        o.otsikkorivi.map(h=>`<th>${h}</th>`).join("")}</tr></thead><tbody>${
        o.rivit.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join("")}</tr>`).join("")}</tbody></table></div></div>`;
    case "ansa":
      return `<div class="box warn"><h3>${esc(o.otsikko)}</h3><p style="margin:0">${esc(o.sisalto)}</p></div>`;
    case "muistilappu":
      return `<div class="box note"><h3>${esc(o.otsikko)}</h3><ul class="notes">${
        o.kohdat.map(k=>`<li>${esc(k)}</li>`).join("")}</ul></div>`;
    case "numerotaulu":
      return `<div class="box nt"><h3>${esc(o.otsikko)}</h3><p class="ohje">${esc(o.sisalto)}</p>
        <div class="nt-valinta" id="ntValinta"></div>
        <div class="nt-taulu" id="ntTaulu"></div>
        <p class="nt-selite" id="ntSelite"></p></div>`;
    case "vahvuusportaat":
      return `<div class="box vp"><h3>${esc(o.otsikko)}</h3><p class="ohje">${esc(o.sisalto)}</p>
        <div class="vp-tasot">${o.tasot.map(t=>
          `<div class="vp-taso" data-taso="${t.id}"><span class="vp-pallo"></span>
           <div><strong>${t.nimi}</strong><span>${t.selite}</span></div></div>`).join("")}</div>
        <div class="vp-lauseke" id="vpLauseke"></div>
        <div class="vp-rivi"><button type="button" class="btn ghost" id="vpSeuraava">Toinen lauseke</button>
        <span class="vp-vastaus" id="vpVastaus"></span></div></div>`;
    case "laskujarjestys":
      return `<div class="box lj"><h3>${esc(o.otsikko)}</h3><p style="margin:0 0 12px;font-size:14.5px;color:var(--ink-2)">${esc(o.sisalto)}</p>
        <div class="lj-exp" id="ljExp"></div>
        <div class="lj-fb" id="ljFb"></div>
        <div class="lj-row"><button type="button" class="btn ghost" id="ljSeuraava">Toinen lauseke</button>
        <span class="lj-step" id="ljStep"></span></div></div>`;
    case "lukusuora":
      return `<div class="box nl"><h3>${esc(o.otsikko)}</h3><p style="margin:0 0 8px;font-size:14.5px;color:var(--ink-2)">${esc(o.sisalto)}</p>
        <svg id="nlsvg" viewBox="0 0 640 118" role="img" aria-labelledby="nldesc"><desc id="nldesc">Lukusuora, jolla näkyy valittu luku ja lähin kymmenluku.</desc></svg>
        <div class="nl-controls">
          <label for="nlrange" style="font-size:13px;color:var(--ink-2)">Luku</label>
          <input type="range" id="nlrange" min="0" max="100" value="47" aria-describedby="nlout">
          <span class="nl-out" id="nlout"></span>
        </div></div>`;
    default: return "";
  }
}).join("");

const svg=document.getElementById("nlsvg"), rng=document.getElementById("nlrange"), out=document.getElementById("nlout");
const X0=34, X1=606, Y=62;
function piirraNL(v){
  const ala=Math.floor(v/10)*10, yla=ala+10, puoli=ala+5;
  const pyor = (v%10)>=5 ? yla : ala;
  const x = n => X0 + (n/100)*(X1-X0);
  let s=`<line class="rail" x1="${X0}" y1="${Y}" x2="${X1}" y2="${Y}"/>`;
  for(let n=0;n<=100;n+=10){
    const near = (n===ala||n===yla);
    s+=`<line class="tick" x1="${x(n)}" y1="${Y-7}" x2="${x(n)}" y2="${Y+7}"/>`;
    s+=`<text class="stop${near?" near":""}" x="${x(n)}" y="${Y+24}" text-anchor="middle">${n}</text>`;
  }
  s+=`<line class="halfway" x1="${x(puoli)}" y1="${Y-16}" x2="${x(puoli)}" y2="${Y+12}"/>`;
  s+=`<text class="stop" x="${x(puoli)}" y="${Y-22}" text-anchor="middle">puoliväli ${puoli}</text>`;
  s+=`<circle class="dot" cx="${x(v)}" cy="${Y}" r="6"/>`;

}

/* ---------- laskujärjestys-widget ---------- */
const ljExp=document.getElementById("ljExp");
if(ljExp && D.kokeilu){
  let ljI=0, ljTokens=[], ljStep=0;
  const laske=(a,op,b)=>{a=+a;b=+b;return op==="×"?a*b:op==="÷"?a/b:op==="+"?a+b:a-b;};
  function ljAlku(){
    const l=D.kokeilu[ljI];
    ljTokens=l.lauseke.replace(/\(/g,"( ").replace(/\)/g," )").split(/\s+/).filter(Boolean);
    ljStep=0; ljPiirra(); ljViesti("","");
  }
  function ljViesti(t,lk){const f=document.getElementById("ljFb"); f.textContent=t; f.className="lj-fb "+(lk||"");}
  function ljPiirra(){
    const l=D.kokeilu[ljI];
    document.getElementById("ljStep").textContent =
      ljStep>=l.askeleet.length ? "valmis" : `askel ${ljStep+1} / ${l.askeleet.length}`;
    if(ljStep>=l.askeleet.length){
      ljExp.innerHTML=`<span class="valmis">${l.lauseke} = ${l.vastaus}</span>`;
      return;
    }
    ljExp.innerHTML=ljTokens.map((t,i)=>
      "×÷+−".includes(t) ? `<button type="button" class="op" data-i="${i}">${t}</button>`
                         : `<span class="tok">${t}</span>`).join("");
    ljExp.querySelectorAll("button.op").forEach(b=>b.addEventListener("click",()=>ljKlikkaa(+b.dataset.i)));
  }
  function ljKlikkaa(i){
    const l=D.kokeilu[ljI], odotettu=l.askeleet[ljStep];
    const ehdotus=[ljTokens[i-1],ljTokens[i],ljTokens[i+1]].join(" ");
    if(ehdotus!==odotettu){
      ljViesti(ljStep===0
        ? "Ei vielä. Sulkeet ovat vahvimmat, sitten kerto ja jako. Yhtä vahvat vasemmalta oikealle."
        : "Ei vielä. Kumpi jäljellä olevista on vahvempi?", "no");
      return;
    }
    const arvo=laske(ljTokens[i-1],ljTokens[i],ljTokens[i+1]);
    let alku=i-1, loppu=i+1;
    if(ljTokens[i-2]==="(" && ljTokens[i+2]===")"){ alku=i-2; loppu=i+2; }
    ljTokens.splice(alku, loppu-alku+1, String(arvo));
    ljStep++;
    ljViesti(ljStep>=l.askeleet.length ? "Valmis. Vastaus on "+l.vastaus+"." : "Oikein. Jatka seuraavaan.", "ok");
    ljPiirra();
  }
  document.getElementById("ljSeuraava").addEventListener("click",()=>{
    ljI=(ljI+1)%D.kokeilu.length; ljAlku();
  });
  ljAlku();
}

};

/* Suomalainen lukumuoto: välilyönti on tuhaterotin, pilkku desimaalierotin.
   Piste voi olla kumpi tahansa. Se tulkitaan tuhaterottimeksi VAIN silloin, kun
   koko luku on aitoa tuhaterotinmuotoa: alkuosa 1–3 numeroa ilman etunollaa ja
   jokainen jatko-osa täsmälleen 3 numeroa (1.500, 12.345.678). Kaikissa muissa
   tapauksissa piste on desimaalipiste — myös 0.125, joka vanhalla säännöllä
   ("3 numeroa pisteen jäljessä = tuhaterotin") luettiin virheellisesti luvuksi 125. */
const TUHATEROTIN = /^[1-9]\d{0,2}(\.\d{3})+$/;
function lueLuku(teksti){
  // Murtoluku (3/4, -3/4) ja sekaluku (1 2/3, -1 2/3) hyväksytään sellaisinaan.
  const raaka = String(teksti).replace(/\u00a0/g, " ").trim();
  let m = raaka.match(/^(-?)(\d+)\s+(\d+)\s*\/\s*(\d+)$/);
  if(m){ const nim = Number(m[4]); if(nim === 0) return null;
    const v = Number(m[2]) + Number(m[3]) / nim; return m[1] ? -v : v; }
  m = raaka.match(/^(-?)\s*(\d+)\s*\/\s*(\d+)$/);
  if(m){ const nim = Number(m[3]); if(nim === 0) return null;
    const v = Number(m[2]) / nim; return m[1] ? -v : v; }
  let s = String(teksti).replace(/[\s\u00a0]/g, "");
  if(s === "") return null;
  if(s.indexOf(",") >= 0){
    s = s.replace(/\./g, "").replace(",", ".");
  } else if(TUHATEROTIN.test(s)){
    s = s.replace(/\./g, "");
  }
  const n = Number(s);
  return Number.isFinite(n) ? n : null;
}

function tarkista(id){
  const h=D.harjoitukset.find(x=>x.id===id);
  const kentta=document.getElementById("in-"+id);
  const fb=document.getElementById("fb-"+id);
  if(kentta.value.trim()===""){ fb.className="fb hint"; fb.textContent="Kirjoita vastaus ensin."; return; }
  const luku=lueLuku(kentta.value);
  if(luku===null){ fb.className="fb no"; fb.textContent="Vastauksen pitää olla luku tai murtoluku (esimerkiksi 3/4)."; return; }
  const oikein = Math.abs(luku - h.vastaus) < 1e-9;
  merkitseTulos(id, oikein, oikein ? "Oikein. "+h.selitys : `Ei vielä. ${h.vinkki} Kokeile uudelleen.`);
}

function tarkistaMonivalinta(id, valittuIndeksi, painike){
  const h=D.harjoitukset.find(x=>x.id===id);
  const rivi=painike.closest(".row");
  rivi.querySelectorAll(".mv-valinta").forEach(b=>b.disabled=true);
  const oikein = valittuIndeksi===h.vastaus;
  painike.classList.add(oikein?"mv-oikein":"mv-vaarin");
  if(!oikein){
    const oikeaBtn=rivi.querySelector(`[data-i="${h.vastaus}"]`);
    if(oikeaBtn) oikeaBtn.classList.add("mv-oikein");
  }
  merkitseTulos(id, oikein, oikein ? "Oikein. "+h.selitys : `Ei ihan. Oikea vastaus on korostettu. ${h.selitys||""}`);
}

/* Kuuntelu: selain lukee tekstin ääneen omalla puhesynteesillään (englanniksi, jos laitteessa on
   englanninkielinen ääni). Ei äänitiedostoja eikä verkkoyhteyttä. Jos laite ei osaa puhua,
   teksti näytetään luettavaksi — silloin tehtävä muuttuu luetun ymmärtämiseksi, mutta ei katkea. */
function puhu(id, nopeus){
  const h=D.harjoitukset.find(x=>x.id===id); if(!h || !h.kuuntele) return;
  const vara=document.getElementById("vara-"+id);
  const naytaTeksti=syy=>{ vara.hidden=false; vara.textContent=syy+" Teksti: "+h.kuuntele; };
  if(!("speechSynthesis" in window)){ naytaTeksti("Tämä laite ei osaa lukea ääneen."); return; }
  const s=window.speechSynthesis; s.cancel();
  const u=new SpeechSynthesisUtterance(h.kuuntele);
  u.lang=h.kieli||"en-GB"; u.rate=nopeus;
  const aanet=s.getVoices(), kieli=u.lang.slice(0,2);
  const aani=aanet.find(a=>a.lang===u.lang) || aanet.find(a=>a.lang && a.lang.startsWith(kieli));
  if(aani) u.voice=aani;
  else if(aanet.length) { naytaTeksti("Laitteessa ei ole englanninkielistä ääntä."); return; }
  u.onerror=()=>naytaTeksti("Ääneen lukeminen ei onnistunut.");
  s.speak(u);
}
