<title>Sama sääntö kaikille</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">

<style>
:root{
  --paper:#EFF2F5; --surface:#FFFFFF; --surface-2:#F7F9FB;
  --grid:#DCE3EA; --line:#C9D3DC;
  --ink:#15222C; --ink-2:#4E626F; --ink-3:#7E8F9B;
  --core:#1B5A9E; --core-soft:#E4EDF6;
  --strong:#1F6E5C; --strong-soft:#E1F0EB;
  --chal:#9A6A16; --chal-soft:#F6EDDC;
  --alert:#A33A2B; --alert-soft:#F8E7E3;
  --shadow:0 1px 2px rgba(21,34,44,.06), 0 8px 24px -12px rgba(21,34,44,.18);
  --r:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0F161B; --surface:#18222A; --surface-2:#1D2830;
    --grid:#22303A; --line:#2E3E4A;
    --ink:#E8EFF4; --ink-2:#A3B4C0; --ink-3:#7A8B97;
    --core:#7FB2E4; --core-soft:#16303F;
    --strong:#77CDB4; --strong-soft:#123028;
    --chal:#E0B267; --chal-soft:#33270F;
    --alert:#E8907F; --alert-soft:#3A1E19;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -14px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --paper:#0F161B; --surface:#18222A; --surface-2:#1D2830;
  --grid:#22303A; --line:#2E3E4A;
  --ink:#E8EFF4; --ink-2:#A3B4C0; --ink-3:#7A8B97;
  --core:#7FB2E4; --core-soft:#16303F;
  --strong:#77CDB4; --strong-soft:#123028;
  --chal:#E0B267; --chal-soft:#33270F;
  --alert:#E8907F; --alert-soft:#3A1E19;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -14px rgba(0,0,0,.7);
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:16px; line-height:1.62;
  background-image:
    linear-gradient(to right, var(--grid) 1px, transparent 1px),
    linear-gradient(to bottom, var(--grid) 1px, transparent 1px);
  background-size:26px 26px;
}
.wrap{max-width:760px; margin:0 auto; padding:28px 20px 90px}
h1,h2,h3,h4{font-family:"Familjen Grotesk","IBM Plex Sans",system-ui,sans-serif; text-wrap:balance}

/* header */
header.top{background:var(--surface); border:1px solid var(--line); border-radius:var(--r);
  box-shadow:var(--shadow); padding:22px 24px; display:flex; gap:18px; align-items:flex-start}
.badge{flex:0 0 auto; width:54px; height:54px; border-radius:9px; display:grid; place-items:center;
  background:var(--core-soft); border:1px solid var(--core); color:var(--core)}
.badge svg{width:28px; height:28px; fill:none; stroke:currentColor; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round}
.eyebrow{font-family:"IBM Plex Mono",monospace; font-size:11px; letter-spacing:.14em;
  text-transform:uppercase; color:var(--ink-3); margin:0 0 5px}
header.top h1{margin:0; font-size:30px; font-weight:700; letter-spacing:-.015em}
header.top p{margin:5px 0 0; color:var(--ink-2); font-size:15px}
.tags{display:flex; flex-wrap:wrap; gap:5px; margin-top:11px}
.tag{font-family:"IBM Plex Mono",monospace; font-size:10.5px; letter-spacing:.05em; padding:2px 7px;
  border-radius:4px; background:var(--surface-2); border:1px solid var(--line); color:var(--ink-3)}
.tag.core{background:var(--core-soft); border-color:var(--core); color:var(--core)}

/* teksti */
article{margin-top:26px}
article h2{font-size:21px; font-weight:600; margin:32px 0 10px; letter-spacing:-.01em}
article p{margin:0 0 14px; max-width:64ch}
.lead{font-size:17.5px; color:var(--ink); border-left:3px solid var(--core); padding-left:16px; margin:0 0 8px}

.box{background:var(--surface); border:1px solid var(--line); border-radius:var(--r);
  padding:18px 22px; box-shadow:var(--shadow); margin:22px 0}
.box h3{margin:0 0 12px; font-size:16.5px; font-weight:600}
.box.warn{border-left:3px solid var(--alert)}
.box.note{border-left:3px solid var(--chal)}

ol.steps{margin:0; padding-left:0; list-style:none; counter-reset:s; display:grid; gap:12px}
ol.steps li{counter-increment:s; display:grid; grid-template-columns:auto 1fr; gap:13px; align-items:start}
ol.steps li::before{content:counter(s); font-family:"Familjen Grotesk",sans-serif; font-weight:700; font-size:14px;
  width:26px; height:26px; border-radius:50%; background:var(--core); color:#fff; display:grid; place-items:center; margin-top:2px}

ul.notes{margin:0; padding-left:19px}
ul.notes li{margin-bottom:7px}
ul.notes li:last-child{margin-bottom:0}

.tablewrap{overflow-x:auto}
table{border-collapse:collapse; width:100%; font-size:14.5px; min-width:460px}
th,td{text-align:left; padding:9px 13px; border-bottom:1px solid var(--line)}
th{font-family:"IBM Plex Mono",monospace; font-size:10.5px; letter-spacing:.1em; text-transform:uppercase;
  color:var(--ink-3); font-weight:400; background:var(--surface-2)}
tr:last-child td{border-bottom:0}
td b{color:var(--core); font-weight:600}
td:last-child{font-variant-numeric:tabular-nums; font-weight:600}

/* lukusuora */
.nl svg{width:100%; height:118px; display:block}
.nl .rail{stroke:var(--line); stroke-width:2}
.nl .tick{stroke:var(--line); stroke-width:1.5}
.nl .stop{fill:var(--ink-3); font-family:"IBM Plex Mono",monospace; font-size:11px}
.nl .stop.near{fill:var(--core); font-weight:600}
.nl .dot{fill:var(--chal)}
.nl .val{fill:var(--ink); font-family:"Familjen Grotesk",sans-serif; font-size:15px; font-weight:700}
.nl .halfway{stroke:var(--chal); stroke-dasharray:3 3; stroke-width:1.5}
.nl-controls{display:flex; align-items:center; gap:14px; margin-top:6px}
.nl-controls input{flex:1; accent-color:var(--core)}
.nl-out{font-family:"Familjen Grotesk",sans-serif; font-size:15px; font-weight:600; min-width:12.5em; text-align:right}

/* paikka-arvotaulu */
.box .ohje{margin:0 0 14px; font-size:14.5px; color:var(--ink-2)}
.nt-valinta{display:flex; flex-wrap:wrap; gap:7px; margin-bottom:16px}
.nt-valinta button{font:inherit; font-size:12.5px; font-family:"IBM Plex Mono",monospace; padding:5px 11px;
  border-radius:6px; border:1px solid var(--line); background:var(--surface-2); color:var(--ink-2); cursor:pointer}
.nt-valinta button[aria-pressed="true"]{background:var(--ink); color:var(--paper); border-color:var(--ink)}
.nt-valinta button:focus-visible{outline:2px solid var(--core); outline-offset:2px}
.nt-taulu{display:flex; flex-direction:column; gap:4px; align-items:flex-start; overflow-x:auto; padding-bottom:4px}
.nt-rivi{display:flex; gap:6px; align-items:center}
.nt-rivi .otsa{font-family:"IBM Plex Mono",monospace; font-size:9.5px; letter-spacing:.08em;
  text-transform:uppercase; color:var(--ink-3); width:52px; text-align:center}
.nt-ruutu{width:52px; height:52px; display:grid; place-items:center; border:1.5px solid var(--line);
  border-radius:7px; background:var(--surface-2); font-family:"IBM Plex Mono",monospace; font-size:24px}
.nt-ruutu.kohta{border-color:var(--core); background:var(--core-soft); color:var(--core); font-weight:500}
.nt-ruutu.ratkaiseva{border-color:var(--chal); background:var(--chal-soft); color:var(--chal); font-weight:500}
.nt-ruutu.nolla{color:var(--ink-3)}
.nt-rivi .nimi{font-size:12.5px; color:var(--ink-3); margin-left:12px; white-space:nowrap}
.nt-nuoli{font-size:17px; color:var(--chal); margin-left:6px}
.nt-selite{margin:14px 0 0; font-size:14.5px}
.nt-selite b{color:var(--core)}

/* vahvuusportaat */
.vp-tasot{display:grid; gap:9px; margin-bottom:18px}
.vp-taso{display:flex; gap:11px; align-items:flex-start; font-size:13.5px}
.vp-taso .vp-pallo{width:13px; height:13px; border-radius:4px; margin-top:5px; flex:0 0 auto}
.vp-taso[data-taso="sulkeet"] .vp-pallo{background:var(--core)}
.vp-taso[data-taso="kertojako"] .vp-pallo{background:var(--strong)}
.vp-taso[data-taso="yhteenvahennys"] .vp-pallo{background:var(--chal)}
.vp-taso strong{display:block; font-family:"Familjen Grotesk",sans-serif; font-weight:600; font-size:14.5px}
.vp-taso span{color:var(--ink-2)}
.vp-lauseke{display:flex; flex-wrap:wrap; gap:7px; align-items:flex-end; font-family:"IBM Plex Mono",monospace;
  font-size:25px; padding:10px 2px; min-height:64px}
.vp-lauseke .t{padding:2px 3px}
.vp-lauseke .op{position:relative; padding:2px 9px; border-radius:6px; font-weight:500}
.vp-lauseke .op[data-taso="sulkeet"]{background:var(--core-soft); color:var(--core)}
.vp-lauseke .op[data-taso="kertojako"]{background:var(--strong-soft); color:var(--strong)}
.vp-lauseke .op[data-taso="yhteenvahennys"]{background:var(--chal-soft); color:var(--chal)}
.vp-lauseke .op i{position:absolute; top:-9px; right:-6px; font-style:normal; font-family:"Familjen Grotesk",sans-serif;
  font-size:11px; font-weight:700; width:18px; height:18px; border-radius:50%; display:grid; place-items:center;
  background:currentColor}
.vp-lauseke .op i span{color:var(--surface)}
.vp-rivi{display:flex; align-items:center; gap:16px; margin-top:8px}
.vp-vastaus{font-family:"Familjen Grotesk",sans-serif; font-size:16px; font-weight:600; color:var(--strong)}

/* laskujärjestys-widget */
.lj-exp{display:flex; flex-wrap:wrap; gap:7px; align-items:center; font-family:"IBM Plex Mono",monospace;
  font-size:23px; padding:14px 4px; min-height:62px}
.lj-exp .tok{padding:2px 4px; color:var(--ink)}
.lj-exp button.op{font-family:"IBM Plex Mono",monospace; font-size:23px; padding:3px 12px; border-radius:7px;
  border:1.5px solid var(--line); background:var(--surface-2); color:var(--ink); line-height:1.2}
.lj-exp button.op:hover{border-color:var(--core); color:var(--core)}
.lj-exp button.op:focus-visible{outline:2px solid var(--core); outline-offset:2px}
.lj-exp .valmis{font-family:"Familjen Grotesk",sans-serif; font-size:23px; font-weight:700; color:var(--strong)}
.lj-fb{font-size:14.5px; min-height:1.5em; color:var(--ink-2)}
.lj-fb.no{color:var(--alert)}
.lj-fb.ok{color:var(--strong)}
.lj-row{display:flex; align-items:center; gap:14px; margin-top:10px}
.lj-step{font-family:"IBM Plex Mono",monospace; font-size:11.5px; letter-spacing:.1em;
  text-transform:uppercase; color:var(--ink-3)}

/* harjoitukset */
.progress{position:sticky; top:0; z-index:5; background:var(--surface); border:1px solid var(--line);
  border-radius:var(--r); padding:12px 18px; box-shadow:var(--shadow); display:flex; align-items:center;
  gap:14px; margin:34px 0 18px}
.progress .lbl{font-family:"IBM Plex Mono",monospace; font-size:11px; letter-spacing:.12em;
  text-transform:uppercase; color:var(--ink-3); white-space:nowrap}
.progress .meter{flex:1; height:7px; border-radius:4px; background:var(--surface-2); border:1px solid var(--line); overflow:hidden}
.progress .meter i{display:block; height:100%; background:var(--core); transition:width .25s ease}
.progress .cnt{font-family:"Familjen Grotesk",sans-serif; font-weight:700; font-variant-numeric:tabular-nums; white-space:nowrap}

.grp{margin-top:26px}
.grp-head{display:flex; align-items:baseline; gap:10px; border-bottom:1.5px solid var(--ink); padding-bottom:7px; margin-bottom:14px}
.grp-head h3{margin:0; font-size:17px; font-weight:600}
.grp-head span{font-size:12.5px; color:var(--ink-2)}

.ex{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:14px 16px; margin-bottom:10px}
.ex[data-tila="oikein"]{border-color:var(--strong); box-shadow:inset 3px 0 0 var(--strong)}
.ex[data-tila="vaarin"]{border-color:var(--alert); box-shadow:inset 3px 0 0 var(--alert)}
.ex .q{display:flex; gap:11px; align-items:baseline; flex-wrap:wrap}
.ex .num{font-family:"IBM Plex Mono",monospace; font-size:11.5px; color:var(--ink-3); min-width:2.4em}
.ex .txt{flex:1; min-width:190px; font-size:15.5px}
.ex .txt .aineisto{display:block; margin-bottom:9px; padding-left:12px;
  border-left:2px solid var(--line); color:var(--ink-2); line-height:1.6;
  /* Aineisto voi olla pieni taulukko, jonka rivit on erotettu rivinvaihdoilla.
     Ilman pre-lineä ne valuisivat yhdeksi kappaleeksi ja taulukko katoaisi. */
  white-space:pre-line}
.ex .txt .kysymysrivi{display:block; font-weight:600}
.ex .row{display:flex; gap:8px; align-items:center; margin-top:11px; flex-wrap:wrap}
.ex input[type=text]{font:inherit; font-family:"IBM Plex Mono",monospace; font-size:15px; width:8.5em;
  padding:7px 11px; border:1px solid var(--line); border-radius:7px; background:var(--surface-2);
  color:var(--ink); text-align:right}
.ex input:focus-visible{outline:2px solid var(--core); outline-offset:1px}
button{font:inherit; cursor:pointer}
.btn{font-size:13.5px; padding:7px 15px; border-radius:7px; border:1px solid var(--core);
  background:var(--core); color:#fff}
.btn.ghost{background:transparent; color:var(--ink-2); border-color:var(--line)}
.btn:focus-visible{outline:2px solid var(--core); outline-offset:2px}
.btn.mv-valinta{text-align:left}
/* kuuntelutehtävä: selaimen puhesynteesi lukee englanninkielisen tekstin */
.kuuntele{display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin:2px 0 10px}
.kuuntele .btn{display:inline-flex; gap:7px; align-items:center}
.kuuntele svg{width:16px; height:16px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round}
.kuuntele .varateksti{flex-basis:100%; font-size:14px; color:var(--ink-2); background:var(--surface-2);
  border-radius:7px; padding:8px 12px; margin:0}
.btn.mv-valinta:disabled{cursor:default; opacity:.65}
.btn.mv-oikein{background:var(--strong-soft); border-color:var(--strong); color:var(--strong); opacity:1}
.btn.mv-vaarin{background:var(--alert-soft); border-color:var(--alert); color:var(--alert); opacity:1}
.row.mv{gap:8px 10px}
.fb{margin-top:11px; font-size:14.5px; padding:10px 13px; border-radius:8px; line-height:1.5}
.fb.ok{background:var(--strong-soft); color:var(--strong)}
.fb.no{background:var(--alert-soft); color:var(--alert)}
.fb.hint{background:var(--chal-soft); color:var(--chal)}

.done{background:var(--strong-soft); border:1px solid var(--strong); color:var(--strong);
  border-radius:var(--r); padding:16px 20px; margin-top:20px; font-size:15.5px}
.done h3{margin:0 0 4px; font-size:17px; color:var(--strong)}

details.teacher{margin-top:34px; background:var(--surface); border:1px solid var(--line);
  border-left:3px solid var(--chal); border-radius:var(--r); padding:15px 20px; box-shadow:var(--shadow)}
details.teacher summary{cursor:pointer; font-family:"Familjen Grotesk",sans-serif; font-weight:600; font-size:15px}
details.teacher summary:focus-visible{outline:2px solid var(--core); outline-offset:3px}
details.teacher ul{margin:12px 0 0; padding-left:19px; color:var(--ink-2); font-size:14.5px}
details.teacher li{margin-bottom:8px}
details.teacher p{margin:12px 0 0; color:var(--ink-2); font-size:14.5px}

.back{display:inline-block; margin-top:30px; font-size:13.5px; color:var(--ink-2)}
.back a{color:var(--core)}

@media (prefers-reduced-motion: reduce){*{transition:none !important}}
@media (max-width:560px){
  .wrap{padding:16px 13px 70px}
  header.top h1{font-size:25px}
  .progress{flex-wrap:wrap}
}
</style>

<div class="wrap">

  <header class="top">
    <span class="badge"><svg viewBox="0 0 24 24" aria-hidden="true" id="ikoni"></svg></span>
    <div>
      <p class="eyebrow" id="eyebrow"></p>
      <h1 id="otsikko"></h1>
      <p id="kuvaus"></p>
      <div class="tags" id="tags"></div>
    </div>
  </header>

  <article id="teksti"></article>

  <div class="progress" aria-live="polite">
    <span class="lbl">Harjoitukset</span>
    <span class="meter"><i id="pbar" style="width:0%"></i></span>
    <span class="cnt" id="pcnt">0 / 20</span>
  </div>

  <div id="harjoitukset"></div>
  <div id="valmis"></div>

  <p class="back" id="back"></p>

</div>

<script>
const D = {"tavoite_id":"ET4-YHD-02","oppiaine":"ET","vuosiluokka":4,"taso":"ydin","otsikko":"Sama sääntö kaikille","kuvaus":"Osaan kertoa mitä yhdenvertaisuus tarkoittaa ja huomata esimerkistä, milloin jotakuta kohdellaan eri tavalla ilman kunnollista syytä.","versio":"0.2","paivitetty":"2026-09-26","ops":{"T":["T4","T9","T10"],"S":["S3"]},"eyebrow":"Elämänkatsomustieto · 4. luokka · Ihmisoikeudet ja yhdenvertaisuus","ikoni":"vertailu","teksti":[{"tyyppi":"johdanto","sisalto":"Luokka lähtee syysretkelle metsään. Lähin polku on kapea ja täynnä juurakoita, eikä Veeti pääse sitä pitkin, koska hän käyttää pyörätuolia. Jos sääntö olisi \"kaikki kulkevat lähintä polkua\", Veeti jäisi koululle. Siksi retkelle valitaan leveä sorapolku, jota pitkin kaikki pääsevät. Tätä kutsutaan yhdenvertaisuudeksi: jokainen on yhtä arvokas, ja jokaisella on yhtä hyvä mahdollisuus olla mukana. Se ei kuitenkaan tarkoita, että kaikille tehdään aina täsmälleen samoin. Tässä taidossa opit erottamaan kaksi asiaa: milloin joku saa jotain muuta kuin muut hyvästä syystä ja milloin häntä kohdellaan huonommin ilman kunnollista syytä."},{"tyyppi":"kappale","otsikko":"Yhdenvertainen ei tarkoita samanlaista","sisalto":"Yhdenvertaisuus tarkoittaa, että jokaisella on samat oikeudet ja yhtä hyvä mahdollisuus olla mukana, oppia ja tulla kuulluksi. Suomen perustuslaissa sanotaan: \"Ihmiset ovat yhdenvertaisia lain edessä.\" Samassa pykälässä sanotaan, että ketään ei saa ilman hyväksyttävää perustetta asettaa eri asemaan esimerkiksi sukupuolen, iän, alkuperän, kielen, uskonnon tai vammaisuuden vuoksi. Myös YK:n lapsen oikeuksien sopimus sanoo, että oikeudet kuuluvat jokaiselle lapselle eikä ketään saa syrjiä. Yhdenvertaisuus ei silti tarkoita, että kaikki saavat täsmälleen saman. Ajattele silmälaseja: jos kaikkien pitäisi lukea ilman laseja, jotta kaikkia kohdeltaisiin samalla tavalla, osa ei näkisi tekstiä lainkaan. Silmälasien, kuulolaitteen, pyörätuolin, luiskan tai ääneen luettujen tehtävien tarkoitus ei ole antaa etua. Ne poistavat esteen, jotta jokainen voi tehdä saman asian kuin muut."},{"tyyppi":"kappale","otsikko":"Perusteltu ero johtuu tarpeesta tai turvallisuudesta","sisalto":"Joskus on reilua, että joku saa jotain muuta kuin muut. Ero on perusteltu, kun sen syy on se, mitä ihminen tilanteessa tarvitsee, tai turvallisuus. Tarve: Matias kuulee huonosti ja istuu eturivissä, jotta hän kuulee saman kuin muut. Kummiluokan ekaluokkalaiset saavat enemmän aikaa lukea sivunsa, koska he ovat vasta oppimassa lukemaan. Turvallisuus: uimahallissa syvään altaaseen saavat mennä ne, jotka osaavat uida, ja kipsatulla kädellä ei kiivetä kiipeilytelineeseen. Turvallisuuden vuoksi joku voi joutua jättämään jonkin asian väliin, mutta hän pääsee silti mukaan muulla tavalla: uimataidoton ui matalassa altaassa. Perusteltu ero auttaa jotakuta pääsemään mukaan tai pitää hänet turvassa. Se ei tee kenestäkään muita parempaa."},{"tyyppi":"kappale","otsikko":"Perusteeton ero johtuu siitä, millainen joku on","sisalto":"Ero on perusteeton, kun jotakuta kohdellaan huonommin sen vuoksi, millainen hän on, eikä sen vuoksi, mitä hän tilanteessa tarvitsee. Tavallisia perusteettomia syitä ovat ulkonäkö (silmälasit, hiukset, vaatteet, pituus), tausta (mistä perhe on kotoisin), kieli, perhe (kenen kanssa asuu, millainen koti on), sukupuoli (\"tytöt eivät saa pelata\") ja apuväline (\"et voi tulla, koska käytät pyörätuolia\"). Perusteetonta eri kohtelua kutsutaan syrjinnäksi. Suomen laki kieltää syrjinnän, ja koulussa aikuisten tehtävä on puuttua siihen. Huomaa, että sama asia voi olla kummankin eron taustalla. Jos vasta Suomeen muuttanut Daniel saa ohjeet myös omalla kielellään, ero johtuu siitä, mitä hän tarvitsee oppiakseen. Jos hänet jätetään leikistä pois, koska hän puhuu kotona toista kieltä, ero johtuu siitä, kuka hän on. Siksi pelkkä sana kieli, perhe tai pyörätuoli ei ratkaise. Ratkaisevaa on, mitä varten ero tehdään."},{"tyyppi":"saanto","otsikko":"Kolme kysymystä jokaiseen tilanteeseen","askeleet":["Kohdellaanko jotakuta eri tavalla kuin muita? Vai kohdellaanko kaikkia samalla tavalla niin, että joku ei silti pääse mukaan? Kumpikin voi olla epäreilua.","Mistä ero johtuu? Jos syy on tarve tai turvallisuus, ero on perusteltu. Jos syy on se, millainen joku on (ulkonäkö, tausta, kieli, perhe, sukupuoli), eikä hän tarvitse tilanteessa mitään muuta kuin muut, ero on perusteeton.","Liittyykö syy siihen, mitä ollaan tekemässä? Silmälasit eivät vaikuta siihen, voiko leikkiä hippaa, mutta uimataito vaikuttaa siihen, voiko syvässä altaassa olla turvassa."]},{"tyyppi":"taulukko","otsikko":"Esimerkkejä","otsikkorivi":["Tilanne","Onko reilua?","Miksi"],"rivit":[["Kuulolaitetta käyttävä Matias istuu eturivissä.","Perusteltu ero","Tarve: hän kuulee siellä saman kuin muut."],["Aleksia ei oteta pihapeliin, koska hän on muita lyhyempi.","Perusteeton ero","Pituus ei estä pelaamista."],["Uimataidoton Onni ei saa mennä syvään altaaseen.","Perusteltu ero","Turvallisuus: syvässä vedessä hän voisi joutua vaaraan."],["Tyttöjä ei päästetä välitunnin jalkapallopeliin.","Perusteeton ero","Sukupuoli ei vaikuta siihen, voiko pelata."],["Kaikki lukevat tehtävät pienellä tekstillä, vaikka heikkonäköinen Anni ei näe niitä.","Sama kaikille, mutta epäreilua","Sama kohtelu jättää Annin ulkopuolelle."]]},{"tyyppi":"ansa","otsikko":"Ansa 1: kaikki erot ovat syrjintää","sisalto":"Kun Selma saa kuunnella kokeen tehtävät ääneen luettuina, joku sanoo heti: \"Epäreilua, miksi hän saa?\" Ero ei ole syrjintää, koska se johtuu siitä, mitä Selma tarvitsee. Hänellä on lukivaikeus, ja ilman ääneen lukemista koe kertoisi vain sen, miten hän lukee, eikä sitä, mitä hän osaa. Kuunteleminen ei kerro hänelle vastauksia. Ennen kuin sanot jotain epäreiluksi, kysy: tarvitseeko hän tätä, jotta hän voi tehdä saman kuin muut?"},{"tyyppi":"ansa","otsikko":"Ansa 2: sama kohtelu on aina reilua","sisalto":"\"Sama sääntö kaikille\" kuulostaa reilulta, ja usein se onkin: kaikki odottavat vuoroaan, ja jokainen saa valita vuorollaan. Mutta jos sääntö on \"kaikki kulkevat portaita\", pyörätuolia käyttävä ei pääse luokkaan, vaikka häntä kohdellaan täsmälleen samoin kuin muita. Sama kohtelu on silloin epäreilua, koska se jättää jonkun ulkopuolelle. Katso siis säännön lisäksi lopputulosta: pääseekö jokainen mukaan?"},{"tyyppi":"kappale","otsikko":"Mitä voit itse tehdä","sisalto":"Kun huomaat, että jotakuta kohdellaan perusteettomasti, voit tehdä jotain, vaikka et pystyisi korjaamaan kaikkea. Voit ottaa hänet mukaan omaan leikkiisi tai ryhmääsi. Voit kysyä häneltä, mitä hän haluaisi. Voit sanoa porukalle rauhallisesti: \"Hänkin saa olla mukana.\" Ja voit kertoa aikuiselle: opettajalle, välituntivalvojalle tai kotona. Kertominen ei ole kantelua. Kantelussa yritetään saada joku pulaan, kertomisessa yritetään auttaa jotakuta, jota kohdellaan väärin. Jos et uskalla sanoa mitään porukan edessä, aikuiselle kertominen riittää. Älä vastaa epäreiluun olemalla itse epäreilu: jos jätät sen, joka jätti toisen ulkopuolelle, itse pois leikistä kostoksi, teet saman virheen kuin hän."},{"tyyppi":"muistilappu","otsikko":"Muista nämä","kohdat":["Yhdenvertaisuus: jokainen on yhtä arvokas ja pääsee mukaan.","Sama kohtelu ei ole aina reilua. Katso, pääseekö jokainen mukaan.","Perusteltu ero johtuu tarpeesta tai turvallisuudesta.","Perusteeton ero johtuu siitä, millainen joku on, esimerkiksi ulkonäöstä, taustasta, kielestä, perheestä tai sukupuolesta.","Kysy: liittyykö syy siihen, mitä ollaan tekemässä?","Voit ottaa mukaan, kysyä, sanoa ääneen tai kertoa aikuiselle. Kertominen ei ole kantelua."]}],"harjoitusryhmat":[{"id":"sama","nimi":"Sama vai yhdenvertainen","info":"Katso lopputulosta: pääseekö jokainen mukaan? Eri keino voi olla yhdenvertainen, ja sama sääntö voi jättää jonkun ulkopuolelle."},{"id":"ero","nimi":"Perusteltu vai perusteeton ero","info":"Etsi eron syy. Tarve ja turvallisuus ovat perusteltuja syitä. Ulkonäkö, tausta, kieli, perhe ja sukupuoli eivät ole, jos hän ei tarvitse tilanteessa mitään muuta kuin muut."},{"id":"toimi","nimi":"Mitä voit tehdä","info":"Auttava teko ottaa mukaan, kysyy, sanoo ääneen tai vie asian aikuiselle. Kosto ei auta, vaikka se kohdistuisi siihen, joka aloitti."}],"harjoitukset":[{"id":"H01","ryhma":"sama","kysymys":"Järjestelyt:\n1. Kaikki saavat vuorollaan olla luokan kukkien kastelija.\n2. Emma näkee heikosti, ja hän saa tabletin, jolla hän voi suurentaa kirjan tekstin. Muut lukevat tavallista kirjaa.\n3. Kaikki uivat uimahallissa samassa altaassa, ja jokainen osaa uida.\n4. Kaikki saavat saman kirjallisen ohjeen. Mikael on vasta muuttanut Suomeen eikä ymmärrä ohjetta, eikä sitä selitetä hänelle.\n\nMontako näistä neljästä järjestelystä on yhdenvertaisia?","vastaus":3,"vinkki":"Yhdenvertaisessa järjestelyssä jokainen pääsee mukaan. Tarkista jokaisesta, jääkö joku ulkopuolelle.","selitys":"Järjestelyissä 1 ja 3 kaikkia kohdellaan samalla tavalla, eikä kukaan jää ulkopuolelle. Järjestelyssä 2 Emma saa eri välineen, jotta hän voi lukea saman kirjan kuin muut, ja sekin on yhdenvertaista. Järjestelyssä 4 kaikki saavat saman ohjeen, mutta Mikael ei ymmärrä sitä. Yhdenvertaisia on 3."},{"id":"H02","ryhma":"sama","kysymys":"Järjestelyt:\n1. Kaikki syövät ruokalassa samaa ruokaa, ja ruoka sopii jokaiselle.\n2. Oiva käyttää kuulolaitetta, ja hän saa istua lähellä puhujaa. Muut istuvat vapaasti.\n3. Kaikki kiipeävät köysitikkaita pitkin leikkimökkiin. Kyynärsauvoja käyttävä Miro ei pääse ylös.\n4. Välitunnilla Riina ei päästä Hennaa hiekkalaatikolle, koska Hennalla on pisamia.\n5. Jokainen saa lainata kirjastosta kaksi kirjaa.\n\nMontako näistä järjestelyistä kohtelee kaikkia täsmälleen samalla tavalla?","vastaus":3,"vinkki":"Älä vielä mieti, onko järjestely reilu. Katso vain, saavatko kaikki saman säännön.","selitys":"Järjestelyissä 1, 3 ja 5 kaikilla on sama sääntö. Järjestely 3 kohtelee kaikkia samoin, vaikka Miro jää ulkopuolelle: sama kohtelu ei tee siitä reilua. Järjestelyssä 2 Oiva saa eri paikan, ja järjestelyssä 4 Henna jätetään pois. Samalla tavalla kohtelevia on 3."},{"id":"H03","ryhma":"sama","kysymys":"Järjestelyt:\n1. Viljami lukee hitaasti lukivaikeuden vuoksi, ja hän saa kuunnella läksytekstin äänitteenä. Muut lukevat tekstin itse.\n2. Ronjaa ei oteta mukaan kuoroon, koska hänellä on erilaiset kengät kuin muilla.\n3. Jiri käyttää pyörätuolia, ja hänelle on varattu luokasta paikka, johon tuoli mahtuu.\n4. Kaikki saavat vuorollaan valita tarinan, joka luetaan ääneen.\n5. Kaikki kopioivat ohjeen seinältä kaukaa. Heikkonäköinen Anni ei näe tekstiä, eikä hänelle anneta omaa paperia.\n\nMontako näistä järjestelyistä kohtelee jotakuta eri tavalla, jotta hän pääsee mukaan samalla tavalla kuin muut?","vastaus":2,"vinkki":"Etsi järjestelyt, joissa joku saa jotain muuta kuin muut. Tarkista sitten, auttaako se häntä pääsemään mukaan.","selitys":"Viljami saa äänitteen ja Jiri oman paikan, jotta he voivat tehdä saman kuin muut. Ronjaakin kohdellaan eri tavalla, mutta se jättää hänet ulkopuolelle eikä auta häntä mukaan. Järjestelyissä 4 ja 5 kaikkia kohdellaan samoin. Vastaus on 2."},{"id":"H04","ryhma":"sama","tyyppi":"monivalinta","kysymys":"Lumi käyttää kuulolaitetta, ja hän saa istua luokassa eturivissä. Muut istuvat omilla paikoillaan.\n\nMiksi tämä ei ole epäreilua muita kohtaan?","vaihtoehdot":["Eturivissä Lumi kuulee saman, minkä muut kuulevat kauempaakin.","Lumi on luokan paras kuuntelija.","Eturivi on paras paikka, ja joku saa sen aina."],"vastaus":0,"vinkki":"Mieti, mitä Lumi saa eturivistä. Saako hän jotain enemmän kuin muut?","selitys":"Eturivissä Lumi kuulee saman, minkä muut kuulevat kauempaakin. Paikka poistaa esteen, se ei anna etua. Se, onko Lumi hyvä kuuntelija, ei liity asiaan, eikä eturivi ole palkinto."},{"id":"H05","ryhma":"sama","kysymys":"Järjestelyt:\n1. Kaikki saavat vuorollaan valita välituntileikin.\n2. Jaakko on murtanut jalkansa, ja hän saa käyttää hissiä. Muut kulkevat portaita.\n3. Luokkaretki tehdään kanoottiretkenä, ja jokaisen pitää meloa itse. Sara ei pysty melomaan kipeän olkapäänsä vuoksi, eikä hänelle keksitä muuta tehtävää, joten hän jää koululle.\n4. Kaikki saavat saman kirjan luettavaksi, ja jokainen pystyy lukemaan sen.\n5. Välituntipelistä jätetään pois Tuomas, koska hänellä on vanha takki.\n\nMonennessako järjestelyssä kaikkia kohdellaan samalla tavalla, mutta joku ei silti pääse mukaan?","vastaus":3,"vinkki":"Etsi ensin järjestelyt, joissa kaikilla on sama sääntö. Katso sitten, jääkö niissä joku ulkopuolelle.","selitys":"Järjestelyissä 1, 3 ja 4 kaikilla on sama sääntö. Vain järjestelyssä 3 joku jää ulkopuolelle: Sara ei pysty melomaan. Järjestelyissä 2 ja 5 joku saa eri kohtelun, joten ne eivät ole samaa kohtelua."},{"id":"H06","ryhma":"sama","kysymys":"Luokka lähtee museoon. Lapset kertovat, mitä he tarvitsevat:\n- Aapo: \"Kuljen portaita ja kuulen hyvin.\"\n- Bea: \"Käytän pyörätuolia. Tarvitsen hissin tai luiskan.\"\n- Kasimir: \"Kuulen huonosti. Tarvitsen oppaan lähelleni tai ohjeet paperilla.\"\n- Doris: \"Minulla ei ole mitään erityistä tarvetta.\"\n- Elmeri: \"Ymmärrän vasta vähän suomea. Tarvitsen kuvia tai jonkun selittämään.\"\n- Fanni: \"Pärjään tavallisilla ohjeilla.\"\n\nMontako lasta tarvitsee jotain muuta kuin muut, jotta pääsee museoretkellä mukaan samalla tavalla kuin muut?","vastaus":3,"vinkki":"Lue jokaisen lapsen lause. Kertooko hän tarvitsevansa jotain?","selitys":"Bea tarvitsee hissin tai luiskan, Kasimir oppaan lähelle tai paperiohjeet ja Elmeri kuvia tai selittäjän. Aapo, Doris ja Fanni pärjäävät tavallisella järjestelyllä. Jos kaikkia kohdeltaisiin täsmälleen samoin, Bea, Kasimir ja Elmeri jäisivät osittain ulkopuolelle."},{"id":"H07","ryhma":"sama","kysymys":"Luokan säännöt:\n1. Kaikki pitävät välitunnilla ulkovaatteet päällä.\n2. Kaikki lukevat kirjat ilman silmälaseja.\n3. Kaikki odottavat vuoroaan ruokajonossa.\n4. Kaikki siivoavat oman pulpettinsa perjantaina.\n\nMonennessako säännössä sama sääntö kaikille estäisi jotakuta näkemästä tai olemasta mukana?","vastaus":2,"vinkki":"Mieti jokaisesta säännöstä: onko joku, joka ei pystyisi toimimaan sen mukaan?","selitys":"Silmälaseja käyttävä ei näe tekstiä ilman laseja. Sääntö kohtelee kaikkia samoin, mutta se jättää osan ulkopuolelle. Muut säännöt eivät estä ketään olemasta mukana."},{"id":"H08","ryhma":"ero","kysymys":"Erot:\n1. Heikki on ekaluokalla ja vasta oppimassa lukemaan, ja hän saa kummitunnilla lukea lyhyemmän tekstin kuin neloset.\n2. Tyttöjä ei päästetä välitunnilla pelaamaan koripalloa, koska pojat sanovat koripallon olevan poikien laji.\n3. Aurora saa käyttää kokeessa kuulosuojaimia, koska melu vie häneltä keskittymisen.\n4. Pyöräretkellä Nooa ajaa aikuisen vieressä, koska hän on vasta oppinut ajamaan pyörällä eikä vielä tunne liikennesääntöjä.\n5. Välituntileikkiin ei oteta Juliaa, koska hän on kotoisin toiselta paikkakunnalta.\n\nMontako näistä viidestä erosta on perusteltuja?","vastaus":3,"vinkki":"Etsi jokaisesta syy. Onko se tarve tai turvallisuus, vai se, millainen joku on?","selitys":"Heikki tarvitsee lyhyemmän tekstin, Aurora tarvitsee kuulosuojaimet, ja Nooan ero johtuu turvallisuudesta. Tyttöjen ero johtuu sukupuolesta ja Julian ero taustasta, eivätkä ne liity peliin. Perusteltuja on 3."},{"id":"H09","ryhma":"ero","kysymys":"Erot:\n1. Kerttu ei pääse leikkiin, koska hän käyttää silmälaseja.\n2. Luokkakuvassa Kalle laitetaan piiloon takariviin, koska muut sanovat hänen näyttävän hassulta.\n3. Ruokalassa Vilja saa gluteenittoman leivän, koska hänellä on keliakia.\n4. Pihapelistä jätetään pois Rasmus, koska hänen perheensä on muuttanut Suomeen toisesta maasta.\n5. Kerhossa Eetua ei päästetä leipomaan, koska kerhon vetäjä sanoo, että leipominen ei ole poikien juttu.\n\nMontako näistä viidestä erosta on perusteettomia?","vastaus":4,"vinkki":"Kysy jokaisesta: tarvitseeko hän tilanteessa jotain muuta kuin muut?","selitys":"Vilja tarvitsee gluteenittoman leivän, koska tavallinen leipä tekee hänet sairaaksi, joten ero on perusteltu. Muissa neljässä syy on ulkonäkö (silmälasit, \"hassu\"), tausta tai sukupuoli, eikä kukaan heistä tarvitse tilanteessa mitään muuta kuin muut. Perusteettomia on 4."},{"id":"H10","ryhma":"ero","kysymys":"Erot:\n1. Joonatan saa lukivaikeuden vuoksi kuunnella kirjan äänikirjana.\n2. Välitunnilla Aliisaa ei päästetä pallopeliin, koska hän puhuu kotona toista kieltä kuin suomea.\n3. Luisteluretkellä Inka, joka ei ole koskaan luistellut, ei saa mennä jäälle ilman aikuista. Muut luistelevat alueella, jonka aikuinen on näyttänyt.\n4. Nella väsyy sairautensa vuoksi, ja hän saa lepotauon kesken koulupäivän.\n\nMonennessako tilanteessa ero on perusteltu turvallisuuden vuoksi?","vastaus":3,"vinkki":"Turvallisuus tarkoittaa, että ero suojaa jotakuta vaaralta.","selitys":"Inka voisi kaatua ja loukkaantua, koska hän ei osaa luistella, joten aikuinen on hänen turvanaan. Joonatanin ja Nellan erot ovat perusteltuja, mutta ne johtuvat tarpeesta eivätkä turvallisuudesta. Aliisan ero on perusteeton."},{"id":"H11","ryhma":"ero","kysymys":"Erot:\n1. Välitunnilla Patrik ei ota Noraa leikkiin, koska Nora puhuu kotona ruotsia.\n2. Rafael on vasta muuttanut Suomeen, ja hän käy suomen kielen lisäopetuksessa, jossa harjoitellaan koulun sanoja.\n3. Matilda saa istua lähellä opettajaa, koska hän kuulee huonosti.\n4. Linnea ei pääse ryhmätyöhön, koska hänen vaatteensa on ostettu kirpputorilta.\n\nMonennessako tilanteessa kieleen liittyvä ero on perusteltu?","vastaus":2,"vinkki":"Kieli mainitaan kahdessa tilanteessa. Kysy kummastakin: mitä varten ero tehdään?","selitys":"Rafael tarvitsee lisäopetusta oppiakseen suomea, joten ero auttaa häntä. Noran ero johtuu vain siitä, mitä kieltä hän puhuu kotona, eikä se liity leikkiin. Matildan ero on perusteltu, mutta se ei liity kieleen."},{"id":"H12","ryhma":"ero","tyyppi":"monivalinta","kysymys":"Välitunnilla Vilho ei pääse pihapeliin, koska hänen hiuksensa ovat pitkät. Muut sanovat, että pitkätukkaiset pojat eivät osaa pelata.\n\nMiksi ero on perusteeton?","vaihtoehdot":["Hiukset eivät vaikuta siihen, miten Vilho pelaa, joten syy ei liity peliin.","Peliin mahtuu vain tietty määrä pelaajia.","Vilho ei itse halunnut pelata."],"vastaus":0,"vinkki":"Mieti, vaikuttaako syy siihen, mitä ollaan tekemässä.","selitys":"Hiukset eivät vaikuta siihen, miten Vilho pelaa. Syy on hänen ulkonäkönsä, ei mikään, mikä liittyisi peliin. Tekstissä ei sanota, että peli olisi täynnä tai että Vilho ei haluaisi pelata."},{"id":"H13","ryhma":"ero","kysymys":"Tilanne: Eelis käyttää pyörätuolia, ja hän saa käyttää koulun hissiä. Muut kulkevat portaita.\n\nPuheenvuorot:\n1. Saana: \"Eelis tarvitsee hissin, koska pyörätuolilla ei pääse portaita.\"\n2. Otto: \"Jos yksi saa jotain, mitä muut eivät saa, se on aina väärin.\"\n3. Iines: \"Hissi ei anna Eelikselle etua. Hän tarvitsee sen päästäkseen samaan luokkaan kuin muut.\"\n4. Veikka: \"Eelis saa käyttää hissiä, koska hän on kiva.\"\n\nMonennessako puheenvuorossa sanotaan, että jokainen ero on väärin?","vastaus":2,"vinkki":"Etsi puheenvuoro, joka ei katso tilannetta lainkaan vaan sanoo, että kaikki erot ovat vääriä.","selitys":"Otto sanoo, että jos yksi saa jotain, mitä muut eivät saa, se on aina väärin. Se on ansa 1: hän ei kysy, tarvitseeko Eelis hissiä. Saana ja Iines perustelevat eron tarpeella. Veikka hyväksyy eron, mutta väärästä syystä."},{"id":"H14","ryhma":"ero","kysymys":"Tilanne: Liikuntatunnilla ekaluokkalaiset saavat heittää palloa koriin lähempää kuin neloset.\n\nPuheenvuorot:\n1. Aarni: \"Kaikkien pitää heittää samasta kohdasta. Sama sääntö kaikille on aina reilu.\"\n2. Minea: \"Ekaluokkalaiset ovat pienempiä ja tarvitsevat lyhyemmän matkan, jotta hekin voivat osua.\"\n3. Paavo: \"Se on väärin. Kaikki erot ovat epäreiluja.\"\n4. Hilla: \"Pienet tarvitsevat lyhyemmän heittomatkan, koska he eivät vielä jaksa heittää yhtä kauas.\"\n5. Konsta: \"Ekaluokkalaiset saavat heittää lähempää, koska heillä on hienommat paidat.\"\n\nMontako puheenvuoroa perustelee eron sillä, mitä ekaluokkalaiset tarvitsevat?","vastaus":2,"vinkki":"Laske vain puheenvuorot, joissa syy on se, mitä pienemmät tarvitsevat. Hyväksyvä puheenvuoro ei riitä, jos syy on väärä.","selitys":"Minea ja Hilla perustelevat eron sillä, että pienemmät tarvitsevat lyhyemmän matkan. Konsta hyväksyy eron, mutta paidat eivät liity heittämiseen. Aarni ja Paavo vastustavat eroa: Aarni ansan 2 ja Paavo ansan 1 mukaisesti."},{"id":"H15","ryhma":"toimi","kysymys":"Tilanne: Välitunnilla Mikaela ja Aaro eivät päästä Ollia leikkiin, koska Ollilla on silmälasit. Olli seisoo sivussa.\n\nTeot:\n1. Pyydät Ollia leikkimään kanssasi.\n2. Et sano mitään ja jatkat omaa leikkiäsi.\n3. Kerrot välituntivalvojalle, mitä tapahtui.\n4. Sanot Mikaelalle ja Aarolle, että silmälasit eivät estä leikkimistä.\n5. Katsot muualle.\n6. Kerrot illalla kotona aikuiselle.\n\nMontako näistä teoista auttaa Ollia?","vastaus":4,"vinkki":"Auttava teko ottaa mukaan, sanoo asian ääneen tai vie sen aikuisen tietoon.","selitys":"Teot 1 ja 4 teet itse, ja teoissa 3 ja 6 asia menee aikuiselle, joka voi puuttua siihen. Aikuiselle kertominen auttaa, se ei ole kantelua. Teoissa 2 ja 5 Olli jää edelleen yksin. Auttavia on 4."},{"id":"H16","ryhma":"toimi","kysymys":"Tilanne: Ryhmätyössä Iisakki ja Elli eivät anna Sofian osallistua, koska Sofian perhe on muuttanut toiselta paikkakunnalta.\n\nTeot:\n1. Kysyt Sofialta, mitä hän haluaisi tehdä.\n2. Sanot, että seuraavalla kerralla Iisakki ei saa tulla teidän ryhmäänne.\n3. Kerrot opettajalle, että Sofia ei pääse osallistumaan.\n4. Jatkat omaa osuuttasi etkä sano mitään.\n\nMonennessako teossa kohtelet itse jotakuta epäreilusti?","vastaus":2,"vinkki":"Etsi teko, jossa joku jätetään ulkopuolelle.","selitys":"Teossa 2 jätät Iisakin pois kostoksi. Syy ei liity ryhmätyöhön, eikä toisen jättäminen ulkopuolelle ole reilua silloinkaan, kun hän on itse tehnyt väärin. Teot 1 ja 3 auttavat Sofiaa, ja teko 4 ei auta ketään."},{"id":"H17","ryhma":"toimi","kysymys":"Tilanne: Joka välitunti sama porukka sanoo Veetille, että hän ei saa tulla kiipeilytelineelle, koska hän puhuu kotona toista kieltä. Näin on jatkunut jo kaksi viikkoa.\n\nTeot:\n1. Leikit itse Veetin kanssa.\n2. Kerrot välituntivalvojalle.\n3. Sanot porukalle, että teline on kaikkien.\n4. Kerrot opettajalle, että sama on jatkunut kaksi viikkoa.\n5. Kerrot kotona aikuiselle.\n\nMontako näistä teoista on sellaisia, joissa kerrot asiasta aikuiselle?","vastaus":3,"vinkki":"Välituntivalvoja, opettaja ja kotona oleva aikuinen ovat kaikki aikuisia.","selitys":"Teoissa 2, 4 ja 5 asia menee aikuiselle. Kun sama toistuu päivästä toiseen, aikuisen apu on erityisen tärkeää: tilanne ei ole yhden lapsen ratkaistavissa. Teot 1 ja 3 auttavat myös, mutta ne teet itse."},{"id":"H18","ryhma":"toimi","tyyppi":"monivalinta","kysymys":"Aada kertoo opettajalle, että välitunnilla Pekka jätettiin leikistä pois hänen vaatteidensa vuoksi. Joku sanoo Aadalle: \"Kantelit.\"\n\nMiksi Aada ei kannellut?","vaihtoehdot":["Hän kertoi, jotta Pekka saisi apua, eikä siksi, että joku joutuisi pulaan.","Opettajalle pitää kertoa kaikesta, mitä muut tekevät.","Aada ei itse ollut mukana leikissä."],"vastaus":0,"vinkki":"Mieti, miksi Aada kertoi. Mitä hän yritti saada aikaan?","selitys":"Kantelussa yritetään saada joku pulaan. Aada kertoi, jotta Pekka saisi apua, ja se on kertomista. Opettajalle ei tarvitse kertoa kaikesta, mitä muut tekevät, eikä ratkaisevaa ole, oliko Aada itse mukana leikissä."},{"id":"H19","ryhma":"toimi","kysymys":"Tilanne: Kerhossa Nelli sanoo, että Artturi ei saa istua sohvalla muiden kanssa, koska Artturin vaatteet ovat vanhoja.\n\nTeot:\n1. Istut Artturin viereen.\n2. Kerrot kerhon ohjaajalle, mitä Nelli sanoi.\n3. Sanot Nellille, että vaatteet eivät ratkaise, kuka saa istua sohvalla.\n4. Kerrot kotona aikuiselle.\n5. Kysyt Artturilta, haluaako hän pelata kanssasi.\n\nMontako näistä teoista voit tehdä itse heti, kertomatta asiasta aikuiselle?","vastaus":3,"vinkki":"Kaikki teot auttavat. Laske ne, joissa aikuista ei tarvita.","selitys":"Teot 1, 3 ja 5 voit tehdä heti itse. Teoissa 2 ja 4 kerrot aikuiselle. Kumpikin tapa auttaa: jos et uskalla sanoa mitään Nellille, aikuiselle kertominen riittää."},{"id":"H20","ryhma":"toimi","kysymys":"Tilanne: Luokkaretken bussissa kukaan ei halua istua Mirjan viereen, koska Mirjalla on erilainen reppu kuin muilla. Lapset kertovat jälkeenpäin, mitä he tekivät:\n1. Eino: \"Istuin Mirjan viereen.\"\n2. Kaisla: \"Katsoin ikkunasta ulos.\"\n3. Lassi: \"Kerroin opettajalle bussissa, mitä tapahtui.\"\n4. Riikka: \"Naurahdin, kun muut puhuivat repusta.\"\n5. Joel: \"Sanoin muille, että reppu ei ratkaise mitään.\"\n6. Veera: \"En sanonut mitään.\"\n\nMontako lapsista teki jotain, mikä auttoi Mirjaa?","vastaus":3,"vinkki":"Auttoiko teko Mirjaa pääsemään mukaan tai saamaan apua?","selitys":"Eino otti Mirjan mukaan, Lassi vei asian aikuiselle ja Joel sanoi asian ääneen. Kaislan ja Veeran hiljaisuus ei auttanut, ja Riikan naurahdus teki tilanteesta Mirjalle vielä pahemman. Auttoi 3."}],"valmis_teksti":"Erotat perustellun eron perusteettomasta ja tiedät, mitä voit itse tehdä, kun jotakuta kohdellaan epäreilusti. Tämä taito on nyt näytetty."};

const svg=document.getElementById("nlsvg"), rng=document.getElementById("nlrange"), out=document.getElementById("nlout");
const X0=34, X1=606, Y=62;
function piirraNL(v){
  const ala=Math.floor(v/10)*10, yla=ala+10, puoli=ala+5;
  const pyor = (v%10)>=5 ? yla : ala;
  const x = n => X0 + (n/100)*(X1-X0);
  let s=`<line class="rail" x1="${X0}" y1="${Y}" x2="${X1}" y2="${Y}"/>`;
  for(let n=0;n<=100;n+=10){
    const near = (n===ala||n===yla);
    s+=`<line class="tick" x1="${x(n)}" y1="${Y-7}" x2="${x(n)}" y2="${Y+7}"/>`;
    s+=`<text class="stop${near?" near":""}" x="${x(n)}" y="${Y+24}" text-anchor="middle">${n}</text>`;
  }
  s+=`<line class="halfway" x1="${x(puoli)}" y1="${Y-16}" x2="${x(puoli)}" y2="${Y+12}"/>`;
  s+=`<text class="stop" x="${x(puoli)}" y="${Y-22}" text-anchor="middle">puoliväli ${puoli}</text>`;
  s+=`<circle class="dot" cx="${x(v)}" cy="${Y}" r="6"/>`;
  s+=`<text class="val" x="${x(v)}" y="${Y-32}" text-anchor="middle">${v}</text>`;
  s+=`<path d="M ${x(v)} ${Y+38} L ${x(pyor)} ${Y+38}" stroke="var(--core)" stroke-width="2" fill="none"/>`;
  s+=`<path d="M ${x(pyor)} ${Y+38} l ${x(pyor)>x(v)?-7:7} -4 l 0 8 z" fill="var(--core)"/>`;
  svg.innerHTML=s;
  out.textContent = `${v} pyöristyy → ${pyor}`;
}

const ljExp=document.getElementById("ljExp");
if(ljExp && D.kokeilu){
  let ljI=0, ljTokens=[], ljStep=0;
  const laske=(a,op,b)=>{a=+a;b=+b;return op==="×"?a*b:op==="÷"?a/b:op==="+"?a+b:a-b;};
  function ljAlku(){
    const l=D.kokeilu[ljI];
    ljTokens=l.lauseke.replace(/\(/g,"( ").replace(/\)/g," )").split(/\s+/).filter(Boolean);
    ljStep=0; ljPiirra(); ljViesti("","");
  }
  function ljViesti(t,lk){const f=document.getElementById("ljFb"); f.textContent=t; f.className="lj-fb "+(lk||"");}
  function ljPiirra(){
    const l=D.kokeilu[ljI];
    document.getElementById("ljStep").textContent =
      ljStep>=l.askeleet.length ? "valmis" : `askel ${ljStep+1} / ${l.askeleet.length}`;
    if(ljStep>=l.askeleet.length){
      ljExp.innerHTML=`<span class="valmis">${l.lauseke} = ${l.vastaus}</span>`;
      return;
    }
    ljExp.innerHTML=ljTokens.map((t,i)=>
      "×÷+−".includes(t) ? `<button type="button" class="op" data-i="${i}">${t}</button>`
                         : `<span class="tok">${t}</span>`).join("");
    ljExp.querySelectorAll("button.op").forEach(b=>b.addEventListener("click",()=>ljKlikkaa(+b.dataset.i)));
  }
  function ljKlikkaa(i){
    const l=D.kokeilu[ljI], odotettu=l.askeleet[ljStep];
    const ehdotus=[ljTokens[i-1],ljTokens[i],ljTokens[i+1]].join(" ");
    if(ehdotus!==odotettu){
      ljViesti(ljStep===0
        ? "Ei vielä. Sulkeet ovat vahvimmat, sitten kerto ja jako. Yhtä vahvat vasemmalta oikealle."
        : "Ei vielä. Kumpi jäljellä olevista on vahvempi?", "no");
      return;
    }
    const arvo=laske(ljTokens[i-1],ljTokens[i],ljTokens[i+1]);
    let alku=i-1, loppu=i+1;
    if(ljTokens[i-2]==="(" && ljTokens[i+2]===")"){ alku=i-2; loppu=i+2; }
    ljTokens.splice(alku, loppu-alku+1, String(arvo));
    ljStep++;
    ljViesti(ljStep>=l.askeleet.length ? "Valmis. Vastaus on "+l.vastaus+"." : "Oikein. Jatka seuraavaan.", "ok");
    ljPiirra();
  }
  document.getElementById("ljSeuraava").addEventListener("click",()=>{
    ljI=(ljI+1)%D.kokeilu.length; ljAlku();
  });
  ljAlku();
}

/* Suomalainen lukumuoto: välilyönti on tuhaterotin, pilkku desimaalierotin.
   Piste voi olla kumpi tahansa. Se tulkitaan tuhaterottimeksi VAIN silloin, kun
   koko luku on aitoa tuhaterotinmuotoa: alkuosa 1–3 numeroa ilman etunollaa ja
   jokainen jatko-osa täsmälleen 3 numeroa (1.500, 12.345.678). Kaikissa muissa
   tapauksissa piste on desimaalipiste — myös 0.125, joka vanhalla säännöllä
   ("3 numeroa pisteen jäljessä = tuhaterotin") luettiin virheellisesti luvuksi 125. */
const TUHATEROTIN = /^[1-9]\d{0,2}(\.\d{3})+$/;
function lueLuku(teksti){
  // Murtoluku (3/4, -3/4) ja sekaluku (1 2/3, -1 2/3) hyväksytään sellaisinaan.
  const raaka = String(teksti).replace(/\u00a0/g, " ").trim();
  let m = raaka.match(/^(-?)(\d+)\s+(\d+)\s*\/\s*(\d+)$/);
  if(m){ const nim = Number(m[4]); if(nim === 0) return null;
    const v = Number(m[2]) + Number(m[3]) / nim; return m[1] ? -v : v; }
  m = raaka.match(/^(-?)\s*(\d+)\s*\/\s*(\d+)$/);
  if(m){ const nim = Number(m[3]); if(nim === 0) return null;
    const v = Number(m[2]) / nim; return m[1] ? -v : v; }
  let s = String(teksti).replace(/[\s\u00a0]/g, "");
  if(s === "") return null;
  if(s.indexOf(",") >= 0){
    s = s.replace(/\./g, "").replace(",", ".");
  } else if(TUHATEROTIN.test(s)){
    s = s.replace(/\./g, "");
  }
  const n = Number(s);
  return Number.isFinite(n) ? n : null;
}

function tarkista(id){
  const h=D.harjoitukset.find(x=>x.id===id);
  const kentta=document.getElementById("in-"+id);
  const fb=document.getElementById("fb-"+id);
  if(kentta.value.trim()===""){ fb.className="fb hint"; fb.textContent="Kirjoita vastaus ensin."; return; }
  const luku=lueLuku(kentta.value);
  if(luku===null){ fb.className="fb no"; fb.textContent="Vastauksen pitää olla luku tai murtoluku (esimerkiksi 3/4)."; return; }
  const oikein = Math.abs(luku - h.vastaus) < 1e-9;
  merkitseTulos(id, oikein, oikein ? "Oikein. "+h.selitys : `Ei vielä. ${h.vinkki} Kokeile uudelleen.`);
}

function tarkistaMonivalinta(id, valittuIndeksi, painike){
  const h=D.harjoitukset.find(x=>x.id===id);
  const rivi=painike.closest(".row");
  rivi.querySelectorAll(".mv-valinta").forEach(b=>b.disabled=true);
  const oikein = valittuIndeksi===h.vastaus;
  painike.classList.add(oikein?"mv-oikein":"mv-vaarin");
  if(!oikein){
    const oikeaBtn=rivi.querySelector(`[data-i="${h.vastaus}"]`);
    if(oikeaBtn) oikeaBtn.classList.add("mv-oikein");
  }
  merkitseTulos(id, oikein, oikein ? "Oikein. "+h.selitys : `Ei ihan. Oikea vastaus on korostettu. ${h.selitys||""}`);
}

/* Kuuntelu: selain lukee tekstin ääneen omalla puhesynteesillään (englanniksi, jos laitteessa on
   englanninkielinen ääni). Ei äänitiedostoja eikä verkkoyhteyttä. Jos laite ei osaa puhua,
   teksti näytetään luettavaksi — silloin tehtävä muuttuu luetun ymmärtämiseksi, mutta ei katkea. */
function puhu(id, nopeus){
  const h=D.harjoitukset.find(x=>x.id===id); if(!h || !h.kuuntele) return;
  const vara=document.getElementById("vara-"+id);
  const naytaTeksti=syy=>{ vara.hidden=false; vara.textContent=syy+" Teksti: "+h.kuuntele; };
  if(!("speechSynthesis" in window)){ naytaTeksti("Tämä laite ei osaa lukea ääneen."); return; }
  const s=window.speechSynthesis; s.cancel();
  const u=new SpeechSynthesisUtterance(h.kuuntele);
  u.lang=h.kieli||"en-GB"; u.rate=nopeus;
  const aanet=s.getVoices(), kieli=u.lang.slice(0,2);
  const aani=aanet.find(a=>a.lang===u.lang) || aanet.find(a=>a.lang && a.lang.startsWith(kieli));
  if(aani) u.voice=aani;
  else if(aanet.length) { naytaTeksti("Laitteessa ei ole englanninkielistä ääntä."); return; }
  u.onerror=()=>naytaTeksti("Ääneen lukeminen ei onnistunut.");
  s.speak(u);
}

document.getElementById("harjoitukset").addEventListener("click",e=>{
  const k=e.target.closest("[data-kuuntele]"), hk=e.target.closest("[data-hitaasti]");
  if(k) puhu(k.dataset.kuuntele, 0.9);
  if(hk) puhu(hk.dataset.hitaasti, 0.6);
  const t=e.target.closest("[data-tarkista]"), v=e.target.closest("[data-vinkki]"), mv=e.target.closest("[data-mv]");
  if(t) tarkista(t.dataset.tarkista);
  if(mv) tarkistaMonivalinta(mv.dataset.mv, Number(mv.dataset.i), mv);
  if(v){
    const h=D.harjoitukset.find(x=>x.id===v.dataset.vinkki);
    const fb=document.getElementById("fb-"+h.id);
    fb.className="fb hint"; fb.textContent=h.vinkki;
  }
});
document.getElementById("harjoitukset").addEventListener("keydown",e=>{
  if(e.key==="Enter" && e.target.id.startsWith("in-")){ e.preventDefault(); tarkista(e.target.id.slice(3)); }
});

} // ONKO_HARJOITUKSIA

if(ONKO_HARJOITUKSIA) paivitaEdistyminen();

document.getElementById("back").innerHTML =
  `Tämä sivu on yhden osaamistavoitteen sisältö <strong>Osaamispolku ${D.vuosiluokka||4}</strong> -mallissa. Taito: <span class="tag" style="display:inline-block">${D.tavoite_id}</span>`;
</script>
