<title>Jäljet menneestä</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">

<style>
:root{
  --paper:#EFF2F5; --surface:#FFFFFF; --surface-2:#F7F9FB;
  --grid:#DCE3EA; --line:#C9D3DC;
  --ink:#15222C; --ink-2:#4E626F; --ink-3:#7E8F9B;
  --core:#1B5A9E; --core-soft:#E4EDF6;
  --strong:#1F6E5C; --strong-soft:#E1F0EB;
  --chal:#9A6A16; --chal-soft:#F6EDDC;
  --alert:#A33A2B; --alert-soft:#F8E7E3;
  --shadow:0 1px 2px rgba(21,34,44,.06), 0 8px 24px -12px rgba(21,34,44,.18);
  --r:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0F161B; --surface:#18222A; --surface-2:#1D2830;
    --grid:#22303A; --line:#2E3E4A;
    --ink:#E8EFF4; --ink-2:#A3B4C0; --ink-3:#7A8B97;
    --core:#7FB2E4; --core-soft:#16303F;
    --strong:#77CDB4; --strong-soft:#123028;
    --chal:#E0B267; --chal-soft:#33270F;
    --alert:#E8907F; --alert-soft:#3A1E19;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -14px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --paper:#0F161B; --surface:#18222A; --surface-2:#1D2830;
  --grid:#22303A; --line:#2E3E4A;
  --ink:#E8EFF4; --ink-2:#A3B4C0; --ink-3:#7A8B97;
  --core:#7FB2E4; --core-soft:#16303F;
  --strong:#77CDB4; --strong-soft:#123028;
  --chal:#E0B267; --chal-soft:#33270F;
  --alert:#E8907F; --alert-soft:#3A1E19;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -14px rgba(0,0,0,.7);
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:16px; line-height:1.62;
  background-image:
    linear-gradient(to right, var(--grid) 1px, transparent 1px),
    linear-gradient(to bottom, var(--grid) 1px, transparent 1px);
  background-size:26px 26px;
}
.wrap{max-width:760px; margin:0 auto; padding:28px 20px 90px}
h1,h2,h3,h4{font-family:"Familjen Grotesk","IBM Plex Sans",system-ui,sans-serif; text-wrap:balance}

/* header */
header.top{background:var(--surface); border:1px solid var(--line); border-radius:var(--r);
  box-shadow:var(--shadow); padding:22px 24px; display:flex; gap:18px; align-items:flex-start}
.badge{flex:0 0 auto; width:54px; height:54px; border-radius:9px; display:grid; place-items:center;
  background:var(--core-soft); border:1px solid var(--core); color:var(--core)}
.badge svg{width:28px; height:28px; fill:none; stroke:currentColor; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round}
.eyebrow{font-family:"IBM Plex Mono",monospace; font-size:11px; letter-spacing:.14em;
  text-transform:uppercase; color:var(--ink-3); margin:0 0 5px}
header.top h1{margin:0; font-size:30px; font-weight:700; letter-spacing:-.015em}
header.top p{margin:5px 0 0; color:var(--ink-2); font-size:15px}
.tags{display:flex; flex-wrap:wrap; gap:5px; margin-top:11px}
.tag{font-family:"IBM Plex Mono",monospace; font-size:10.5px; letter-spacing:.05em; padding:2px 7px;
  border-radius:4px; background:var(--surface-2); border:1px solid var(--line); color:var(--ink-3)}
.tag.core{background:var(--core-soft); border-color:var(--core); color:var(--core)}

/* teksti */
article{margin-top:26px}
article h2{font-size:21px; font-weight:600; margin:32px 0 10px; letter-spacing:-.01em}
article p{margin:0 0 14px; max-width:64ch}
.lead{font-size:17.5px; color:var(--ink); border-left:3px solid var(--core); padding-left:16px; margin:0 0 8px}

.box{background:var(--surface); border:1px solid var(--line); border-radius:var(--r);
  padding:18px 22px; box-shadow:var(--shadow); margin:22px 0}
.box h3{margin:0 0 12px; font-size:16.5px; font-weight:600}
.box.warn{border-left:3px solid var(--alert)}
.box.note{border-left:3px solid var(--chal)}

ol.steps{margin:0; padding-left:0; list-style:none; counter-reset:s; display:grid; gap:12px}
ol.steps li{counter-increment:s; display:grid; grid-template-columns:auto 1fr; gap:13px; align-items:start}
ol.steps li::before{content:counter(s); font-family:"Familjen Grotesk",sans-serif; font-weight:700; font-size:14px;
  width:26px; height:26px; border-radius:50%; background:var(--core); color:#fff; display:grid; place-items:center; margin-top:2px}

ul.notes{margin:0; padding-left:19px}
ul.notes li{margin-bottom:7px}
ul.notes li:last-child{margin-bottom:0}

.tablewrap{overflow-x:auto}
table{border-collapse:collapse; width:100%; font-size:14.5px; min-width:460px}
th,td{text-align:left; padding:9px 13px; border-bottom:1px solid var(--line)}
th{font-family:"IBM Plex Mono",monospace; font-size:10.5px; letter-spacing:.1em; text-transform:uppercase;
  color:var(--ink-3); font-weight:400; background:var(--surface-2)}
tr:last-child td{border-bottom:0}
td b{color:var(--core); font-weight:600}
td:last-child{font-variant-numeric:tabular-nums; font-weight:600}

/* lukusuora */
.nl svg{width:100%; height:118px; display:block}
.nl .rail{stroke:var(--line); stroke-width:2}
.nl .tick{stroke:var(--line); stroke-width:1.5}
.nl .stop{fill:var(--ink-3); font-family:"IBM Plex Mono",monospace; font-size:11px}
.nl .stop.near{fill:var(--core); font-weight:600}
.nl .dot{fill:var(--chal)}
.nl .val{fill:var(--ink); font-family:"Familjen Grotesk",sans-serif; font-size:15px; font-weight:700}
.nl .halfway{stroke:var(--chal); stroke-dasharray:3 3; stroke-width:1.5}
.nl-controls{display:flex; align-items:center; gap:14px; margin-top:6px}
.nl-controls input{flex:1; accent-color:var(--core)}
.nl-out{font-family:"Familjen Grotesk",sans-serif; font-size:15px; font-weight:600; min-width:12.5em; text-align:right}

/* paikka-arvotaulu */
.box .ohje{margin:0 0 14px; font-size:14.5px; color:var(--ink-2)}
.nt-valinta{display:flex; flex-wrap:wrap; gap:7px; margin-bottom:16px}
.nt-valinta button{font:inherit; font-size:12.5px; font-family:"IBM Plex Mono",monospace; padding:5px 11px;
  border-radius:6px; border:1px solid var(--line); background:var(--surface-2); color:var(--ink-2); cursor:pointer}
.nt-valinta button[aria-pressed="true"]{background:var(--ink); color:var(--paper); border-color:var(--ink)}
.nt-valinta button:focus-visible{outline:2px solid var(--core); outline-offset:2px}
.nt-taulu{display:flex; flex-direction:column; gap:4px; align-items:flex-start; overflow-x:auto; padding-bottom:4px}
.nt-rivi{display:flex; gap:6px; align-items:center}
.nt-rivi .otsa{font-family:"IBM Plex Mono",monospace; font-size:9.5px; letter-spacing:.08em;
  text-transform:uppercase; color:var(--ink-3); width:52px; text-align:center}
.nt-ruutu{width:52px; height:52px; display:grid; place-items:center; border:1.5px solid var(--line);
  border-radius:7px; background:var(--surface-2); font-family:"IBM Plex Mono",monospace; font-size:24px}
.nt-ruutu.kohta{border-color:var(--core); background:var(--core-soft); color:var(--core); font-weight:500}
.nt-ruutu.ratkaiseva{border-color:var(--chal); background:var(--chal-soft); color:var(--chal); font-weight:500}
.nt-ruutu.nolla{color:var(--ink-3)}
.nt-rivi .nimi{font-size:12.5px; color:var(--ink-3); margin-left:12px; white-space:nowrap}
.nt-nuoli{font-size:17px; color:var(--chal); margin-left:6px}
.nt-selite{margin:14px 0 0; font-size:14.5px}
.nt-selite b{color:var(--core)}

/* vahvuusportaat */
.vp-tasot{display:grid; gap:9px; margin-bottom:18px}
.vp-taso{display:flex; gap:11px; align-items:flex-start; font-size:13.5px}
.vp-taso .vp-pallo{width:13px; height:13px; border-radius:4px; margin-top:5px; flex:0 0 auto}
.vp-taso[data-taso="sulkeet"] .vp-pallo{background:var(--core)}
.vp-taso[data-taso="kertojako"] .vp-pallo{background:var(--strong)}
.vp-taso[data-taso="yhteenvahennys"] .vp-pallo{background:var(--chal)}
.vp-taso strong{display:block; font-family:"Familjen Grotesk",sans-serif; font-weight:600; font-size:14.5px}
.vp-taso span{color:var(--ink-2)}
.vp-lauseke{display:flex; flex-wrap:wrap; gap:7px; align-items:flex-end; font-family:"IBM Plex Mono",monospace;
  font-size:25px; padding:10px 2px; min-height:64px}
.vp-lauseke .t{padding:2px 3px}
.vp-lauseke .op{position:relative; padding:2px 9px; border-radius:6px; font-weight:500}
.vp-lauseke .op[data-taso="sulkeet"]{background:var(--core-soft); color:var(--core)}
.vp-lauseke .op[data-taso="kertojako"]{background:var(--strong-soft); color:var(--strong)}
.vp-lauseke .op[data-taso="yhteenvahennys"]{background:var(--chal-soft); color:var(--chal)}
.vp-lauseke .op i{position:absolute; top:-9px; right:-6px; font-style:normal; font-family:"Familjen Grotesk",sans-serif;
  font-size:11px; font-weight:700; width:18px; height:18px; border-radius:50%; display:grid; place-items:center;
  background:currentColor}
.vp-lauseke .op i span{color:var(--surface)}
.vp-rivi{display:flex; align-items:center; gap:16px; margin-top:8px}
.vp-vastaus{font-family:"Familjen Grotesk",sans-serif; font-size:16px; font-weight:600; color:var(--strong)}

/* laskujärjestys-widget */
.lj-exp{display:flex; flex-wrap:wrap; gap:7px; align-items:center; font-family:"IBM Plex Mono",monospace;
  font-size:23px; padding:14px 4px; min-height:62px}
.lj-exp .tok{padding:2px 4px; color:var(--ink)}
.lj-exp button.op{font-family:"IBM Plex Mono",monospace; font-size:23px; padding:3px 12px; border-radius:7px;
  border:1.5px solid var(--line); background:var(--surface-2); color:var(--ink); line-height:1.2}
.lj-exp button.op:hover{border-color:var(--core); color:var(--core)}
.lj-exp button.op:focus-visible{outline:2px solid var(--core); outline-offset:2px}
.lj-exp .valmis{font-family:"Familjen Grotesk",sans-serif; font-size:23px; font-weight:700; color:var(--strong)}
.lj-fb{font-size:14.5px; min-height:1.5em; color:var(--ink-2)}
.lj-fb.no{color:var(--alert)}
.lj-fb.ok{color:var(--strong)}
.lj-row{display:flex; align-items:center; gap:14px; margin-top:10px}
.lj-step{font-family:"IBM Plex Mono",monospace; font-size:11.5px; letter-spacing:.1em;
  text-transform:uppercase; color:var(--ink-3)}

/* harjoitukset */
.progress{position:sticky; top:0; z-index:5; background:var(--surface); border:1px solid var(--line);
  border-radius:var(--r); padding:12px 18px; box-shadow:var(--shadow); display:flex; align-items:center;
  gap:14px; margin:34px 0 18px}
.progress .lbl{font-family:"IBM Plex Mono",monospace; font-size:11px; letter-spacing:.12em;
  text-transform:uppercase; color:var(--ink-3); white-space:nowrap}
.progress .meter{flex:1; height:7px; border-radius:4px; background:var(--surface-2); border:1px solid var(--line); overflow:hidden}
.progress .meter i{display:block; height:100%; background:var(--core); transition:width .25s ease}
.progress .cnt{font-family:"Familjen Grotesk",sans-serif; font-weight:700; font-variant-numeric:tabular-nums; white-space:nowrap}

.grp{margin-top:26px}
.grp-head{display:flex; align-items:baseline; gap:10px; border-bottom:1.5px solid var(--ink); padding-bottom:7px; margin-bottom:14px}
.grp-head h3{margin:0; font-size:17px; font-weight:600}
.grp-head span{font-size:12.5px; color:var(--ink-2)}

.ex{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:14px 16px; margin-bottom:10px}
.ex[data-tila="oikein"]{border-color:var(--strong); box-shadow:inset 3px 0 0 var(--strong)}
.ex[data-tila="vaarin"]{border-color:var(--alert); box-shadow:inset 3px 0 0 var(--alert)}
.ex .q{display:flex; gap:11px; align-items:baseline; flex-wrap:wrap}
.ex .num{font-family:"IBM Plex Mono",monospace; font-size:11.5px; color:var(--ink-3); min-width:2.4em}
.ex .txt{flex:1; min-width:190px; font-size:15.5px}
.ex .txt .aineisto{display:block; margin-bottom:9px; padding-left:12px;
  border-left:2px solid var(--line); color:var(--ink-2); line-height:1.6;
  /* Aineisto voi olla pieni taulukko, jonka rivit on erotettu rivinvaihdoilla.
     Ilman pre-lineä ne valuisivat yhdeksi kappaleeksi ja taulukko katoaisi. */
  white-space:pre-line}
.ex .txt .kysymysrivi{display:block; font-weight:600}
.ex .row{display:flex; gap:8px; align-items:center; margin-top:11px; flex-wrap:wrap}
.ex input[type=text]{font:inherit; font-family:"IBM Plex Mono",monospace; font-size:15px; width:8.5em;
  padding:7px 11px; border:1px solid var(--line); border-radius:7px; background:var(--surface-2);
  color:var(--ink); text-align:right}
.ex input:focus-visible{outline:2px solid var(--core); outline-offset:1px}
button{font:inherit; cursor:pointer}
.btn{font-size:13.5px; padding:7px 15px; border-radius:7px; border:1px solid var(--core);
  background:var(--core); color:#fff}
.btn.ghost{background:transparent; color:var(--ink-2); border-color:var(--line)}
.btn:focus-visible{outline:2px solid var(--core); outline-offset:2px}
.btn.mv-valinta{text-align:left}
/* kuuntelutehtävä: selaimen puhesynteesi lukee englanninkielisen tekstin */
.kuuntele{display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin:2px 0 10px}
.kuuntele .btn{display:inline-flex; gap:7px; align-items:center}
.kuuntele svg{width:16px; height:16px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round}
.kuuntele .varateksti{flex-basis:100%; font-size:14px; color:var(--ink-2); background:var(--surface-2);
  border-radius:7px; padding:8px 12px; margin:0}
.btn.mv-valinta:disabled{cursor:default; opacity:.65}
.btn.mv-oikein{background:var(--strong-soft); border-color:var(--strong); color:var(--strong); opacity:1}
.btn.mv-vaarin{background:var(--alert-soft); border-color:var(--alert); color:var(--alert); opacity:1}
.row.mv{gap:8px 10px}
.fb{margin-top:11px; font-size:14.5px; padding:10px 13px; border-radius:8px; line-height:1.5}
.fb.ok{background:var(--strong-soft); color:var(--strong)}
.fb.no{background:var(--alert-soft); color:var(--alert)}
.fb.hint{background:var(--chal-soft); color:var(--chal)}

.done{background:var(--strong-soft); border:1px solid var(--strong); color:var(--strong);
  border-radius:var(--r); padding:16px 20px; margin-top:20px; font-size:15.5px}
.done h3{margin:0 0 4px; font-size:17px; color:var(--strong)}

details.teacher{margin-top:34px; background:var(--surface); border:1px solid var(--line);
  border-left:3px solid var(--chal); border-radius:var(--r); padding:15px 20px; box-shadow:var(--shadow)}
details.teacher summary{cursor:pointer; font-family:"Familjen Grotesk",sans-serif; font-weight:600; font-size:15px}
details.teacher summary:focus-visible{outline:2px solid var(--core); outline-offset:3px}
details.teacher ul{margin:12px 0 0; padding-left:19px; color:var(--ink-2); font-size:14.5px}
details.teacher li{margin-bottom:8px}
details.teacher p{margin:12px 0 0; color:var(--ink-2); font-size:14.5px}

.back{display:inline-block; margin-top:30px; font-size:13.5px; color:var(--ink-2)}
.back a{color:var(--core)}

@media (prefers-reduced-motion: reduce){*{transition:none !important}}
@media (max-width:560px){
  .wrap{padding:16px 13px 70px}
  header.top h1{font-size:25px}
  .progress{flex-wrap:wrap}
}
</style>

<div class="wrap">

  <header class="top">
    <span class="badge"><svg viewBox="0 0 24 24" aria-hidden="true" id="ikoni"></svg></span>
    <div>
      <p class="eyebrow" id="eyebrow"></p>
      <h1 id="otsikko"></h1>
      <p id="kuvaus"></p>
      <div class="tags" id="tags"></div>
    </div>
  </header>

  <article id="teksti"></article>

  <div class="progress" aria-live="polite">
    <span class="lbl">Harjoitukset</span>
    <span class="meter"><i id="pbar" style="width:0%"></i></span>
    <span class="cnt" id="pcnt">0 / 20</span>
  </div>

  <div id="harjoitukset"></div>
  <div id="valmis"></div>

  <p class="back" id="back"></p>

</div>

<script>
const D = {"tavoite_id":"HI4-LAH-01","oppiaine":"HI","vuosiluokka":4,"taso":"ydin","otsikko":"Jäljet menneestä","kuvaus":"Tunnistan, mikä on historiallinen lähde.","versio":"0.2","paivitetty":"2026-09-26","ops":{"T":["T2"],"S":["S1"]},"eyebrow":"Historia · 4. luokka · Lähteiden käyttö","ikoni":"tutkimus","teksti":[{"tyyppi":"johdanto","sisalto":"Mummolan vintiltä löytyy pahvilaatikko. Siinä on kellastunut kirje, mustavalkoinen valokuva pojasta polkupyörän vieressä ja puinen leikkihevonen, josta on maali kulunut. Kukaan ei ole kirjoittanut niistä kirjaa, mutta ne kertovat silti, millaista talossa oli joskus elää. Ne ovat jälkiä menneisyydestä. Historiassa tällaista jälkeä sanotaan lähteeksi. Kaikki, mitä menneisyydestä tiedetään, on päätelty lähteistä, koska menneisyyteen ei pääse katsomaan. Siksi historian ensimmäinen taito on tunnistaa, mikä on lähde."},{"tyyppi":"kappale","otsikko":"Lähde on jälki menneisyydestä","sisalto":"Historiallinen lähde on jotakin, minkä ihmiset ovat tehneet, rakentaneet, kirjoittaneet, kuvanneet tai kertoneet ja mikä on säilynyt meidän aikaamme. Lähes mikä tahansa ihmisen jälki voi olla lähde: tavallinen lusikka yhtä hyvin kuin kuninkaan kirje. Lähteen ei tarvitse olla arvokas eikä kaunis. Siksi hyödyllisin kysymys ei ole \"onko tämä lähde\", vaan \"kertooko tämä siitä ajasta, jota tutkin\". Sama valokuva voi olla hyvä lähde yhteen tutkimukseen ja täysin hyödytön toiseen."},{"tyyppi":"saanto","otsikko":"Onko tämä lähde tähän tutkimukseen","askeleet":["Sano ensin, mitä aikaa tai asiaa tutkit, esimerkiksi \"koulu 1960-luvulla\".","Kysy: tehtiinkö, kirjoitettiinko, kuvattiinko tai käytettiinkö tätä silloin? Jos kyllä, se on lähde. Vuonna 1930 rakennettu koulutalo on lähde myös 1960-luvun koulusta, jos siinä opiskeltiin 1960-luvulla.","Jos asia kerrotaan vasta myöhemmin, kysy: oliko kertoja itse mukana? Isoisän kertomus omasta koulustaan on lähde, koska hän oli siellä. Isoisän kertomus kivikaudesta ei ole, koska hän ei ollut siellä.","Jos asia on tehty myöhemmin eikä tekijä ollut itse mukana, se ei ole lähde siitä ajasta. Se on myöhemmin tehty kertomus, tutkimus tai kuvitelma."]},{"tyyppi":"taulukko","otsikko":"Viisi lähdetyyppiä","otsikkorivi":["Lähdetyyppi","Esimerkkejä","Mitä siitä voi päätellä"],"rivit":[["Esine","kivikirves, lusikka, lelu, työkalu, pulpetti","Millaisia välineitä ihmisillä oli ja miten he tekivät työnsä."],["Rakennus","vanha koulutalo, kirkko, aitta, navetta, sauna","Miten ihmiset asuivat, tekivät työtä ja kokoontuivat."],["Kuva","valokuva, maalaus, piirros, kalliomaalaus","Miltä ihmiset, vaatteet ja paikat näyttivät."],["Kirjoitettu lähde","kirje, päiväkirja, asiakirja, sanomalehti, koulutodistus","Mitä ihmiset ajattelivat, sopivat ja kirjasivat muistiin."],["Suullinen lähde","muistelu, haastattelu","Miten itse mukana ollut ihminen koki asian ja mitä ei kirjoitettu ylös."]]},{"tyyppi":"kappale","otsikko":"Tyyppi kertoo, missä tieto on","sisalto":"Lähdetyyppi päätetään sen mukaan, missä tieto on. Vanha koulutodistus on paperia, mutta tieto on kirjoituksessa: arvosanoissa, nimessä ja vuosiluvussa. Siksi todistus on kirjoitettu lähde eikä esine. Haastattelu on suullinen lähde silloinkin, kun se on nauhoitettu, koska tieto on puheessa. Rakennus on oma tyyppinsä, koska siitä voi päätellä asioita, joita esineestä ei näe: huoneiden määrästä ja koosta näkee, miten siinä elettiin. Joissakin lähteissä on kaksi tyyppiä yhtä aikaa. Postikortissa on sekä kuva että kirjoitus, ja sanomalehdessä on usein valokuvia tekstin lisäksi. Silloin kumpikin osa luetaan omalla tavallaan."},{"tyyppi":"kappale","otsikko":"Lähteestä tutkimukseksi ja oppikirjaksi","sisalto":"Historian oppikirja kertoo kivikaudesta, mutta sen kirjoittaja ei ole nähnyt kivikautta. Tieto on kulkenut monen käden kautta. Ensin arkeologit ovat kaivaneet maasta kivikirveitä ja saviastian paloja ja päätelleet niistä, miten ihmiset elivät. He ovat kirjoittaneet päätelmänsä tutkimuksiksi. Oppikirjan kirjoittaja on lukenut tutkimuksia ja kertonut niiden tiedon lyhyesti. Lähde on siis ketjun alussa: kivikirves. Tutkimus ja oppikirja ovat myöhemmin kirjoitettuja tekstejä lähteistä. Tiedonhaussa kirjaa, josta tieto on otettu, sanotaan myös lähteeksi. Historiassa historiallinen lähde tarkoittaa kuitenkin jälkeä itse menneisyydestä."},{"tyyppi":"ansa","otsikko":"Ansa 1: vain vanha on lähde","sisalto":"Moni ajattelee, että lähteen pitää olla satoja vuosia vanha. Mutta eilinenkin on jo menneisyyttä. Eilinen kauppakuitti kertoo, mitä ostettiin ja mitä se maksoi. Vuonna 2126 joku historiantutkija voi haluta tietää, mitä suomalaiset söivät vuonna 2026, ja silloin juuri tämän päivän kuitit, ruokalistat ja valokuvat ovat hänen lähteitään. Ratkaisevaa ei ole ikä vaan se, syntyikö asia sinä aikana, jota tutkitaan. Siksi myös vanha voi olla väärä lähde: vuonna 1965 otettu luokkakuva ei kerro mitään sinun luokastasi tänä syksynä."},{"tyyppi":"ansa","otsikko":"Ansa 2: kuvitelma näyttää lähteeltä","sisalto":"Vuonna 2019 tehdyssä piirretyssä elokuvassa kivikauden perhe asuu kodassa, pukeutuu nahkoihin ja kalastaa verkolla. Kaikki näyttää uskottavalta, ja tekijät ovat ehkä lukeneet tutkimuksia huolellisesti. Elokuva ei silti ole lähde kivikaudesta, koska sen tekijät eivät eläneet kivikaudella. He kuvittelivat sen. Sama koskee romaaneja, sarjakuvia, pelejä ja televisiosarjoja, jotka on tehty paljon myöhemmin kuin se aika, josta ne kertovat. Tarkka ulkonäkö ei tee kuvitelmasta lähdettä. Kuvitelma on kuitenkin lähde omasta tekoajastaan: vuonna 2021 kirjoitetusta romaanista 1700-luvun kylästä voi päätellä, miten vuonna 2021 kuviteltiin 1700-lukua. Samoin 1950-luvulla kirjoitettu satukirja on lähde 1950-luvusta, vaikka siinä puhuisivat eläimet, koska siitä näkee, mitä lapset silloin lukivat. Kysy siis tarinastakin: minkä ajan jälki tämä on?"},{"tyyppi":"ansa","otsikko":"Ansa 3: oppikirja on lähde siitä, mistä se kertoo","sisalto":"Nykyinen historian oppikirja ei ole lähde kivikaudesta eikä 1800-luvusta, vaikka siinä on niistä paljon oikeaa tietoa. Se on kirjoitettu nykyaikana lähteiden ja tutkimusten avulla. Vanha oppikirja on eri asia: vuonna 1955 koulussa käytetty lukukirja on lähde 1950-luvun koulusta, koska sitä käytettiin silloin. Siitä näkee, mitä lapset silloin lukivat. Kysy siis kirjastakin sama kuin kaikesta muusta: tehtiinkö tai käytettiinkö sitä sinä aikana, jota tutkit?"},{"tyyppi":"muistilappu","otsikko":"Muista nämä","kohdat":["Lähde on jälki siitä ajasta, jota tutkit: tehty, kirjoitettu, kuvattu tai käytetty silloin.","Myöhemmin kerrottu muistelu on lähde, jos kertoja oli itse mukana.","Myöhemmin tehty oppikirja, tutkimus, elokuva tai romaani ei ole lähde siitä ajasta, josta se kertoo, jos tekijä ei ollut itse mukana.","Eilinenkin on menneisyyttä. Lähteen ei tarvitse olla vanha.","Viisi lähdetyyppiä: esine, rakennus, kuva, kirjoitettu ja suullinen.","Tyyppi päätetään sen mukaan, missä tieto on."]}],"harjoitusryhmat":[{"id":"jalki","nimi":"Jälki siltä ajalta","info":"Sano ensin, mitä aikaa tutkit. Tehtiinkö tai käytettiinkö asiaa silloin, tai oliko kertoja itse mukana?"},{"id":"tyypit","nimi":"Viisi lähdetyyppiä","info":"Esine, rakennus, kuva, kirjoitettu ja suullinen. Tyyppi kertoo, missä tieto on."},{"id":"myohemmin","nimi":"Lähde vai myöhemmin tehty","info":"Myöhemmin tehty oppikirja, tutkimus, elokuva tai romaani ei ole lähde siitä ajasta, josta se kertoo, jos tekijä ei ollut itse mukana."}],"harjoitukset":[{"id":"H01","ryhma":"jalki","kysymys":"Tutkit, millaista oli käydä koulua vuonna 1962.\n1. Luokan oppilasluettelo vuodelta 1962\n2. Luokasta syksyllä 1962 otettu valokuva\n3. Vuonna 2022 ilmestynyt tietokirja 1960-luvun kouluista, koottu tutkimuksista\n4. Pulpetti, jolla istuttiin koulussa vuonna 1962\n5. Vuonna 2023 piirretty sarjakuva 1960-luvun koulusta; piirtäjä syntyi vuonna 1998\n6. Kirje, jonka opettaja kirjoitti kodeille vuonna 1962\n\nMontako näistä voisi olla lähde tähän tutkimukseen?","vastaus":4,"vinkki":"Katso jokaisesta asiasta vuosiluku. Tehtiinkö tai käytettiinkö sitä vuonna 1962?","selitys":"Oppilasluettelo, valokuva, pulpetti ja kirje ovat vuodelta 1962 tai niitä käytettiin silloin. Tietokirja ja sarjakuva on tehty 2020-luvulla, eivätkä niiden tekijät olleet koulussa vuonna 1962. Lähteitä on 4."},{"id":"H02","ryhma":"jalki","kysymys":"Tutkit, millaista oli olla lapsena maatalossa 1950-luvulla.\n1. Vuonna 2024 tehty haastattelu, jossa Eino kertoo omasta lapsuudestaan maatalossa 1950-luvulla\n2. Vuonna 2024 tehty haastattelu, jossa Einon lapsenlapsi kertoo, mitä on lukenut 1950-luvun maataloista\n3. Maatalon navetta, jossa lypsettiin lehmiä 1950-luvulla\n4. Einon äidin päiväkirja vuodelta 1953\n5. Valokuva heinätöistä kesältä 1955\n\nMonesko asia ei ole lähde tähän tutkimukseen?","vastaus":2,"vinkki":"Kaksi haastattelua tehtiin samana vuonna. Kumpi kertoja oli itse mukana 1950-luvulla?","selitys":"Eino kertoo omasta lapsuudestaan, joten hänen haastattelunsa on lähde, vaikka se tehtiin vasta 2024. Lapsenlapsi kertoo, mitä on lukenut. Hän ei ollut mukana, joten asia 2 ei ole lähde."},{"id":"H03","ryhma":"jalki","kysymys":"Vuonna 2126 historiantutkija haluaa tietää, mitä suomalaiset söivät vuonna 2026.\n1. Kauppakuitti ruokaostoksista vuodelta 2026\n2. Koulun ruokalista syksyltä 2026\n3. Vuonna 2120 tehty elokuva 2020-luvun perheistä; sen tekijät syntyivät 2090-luvulla\n4. Valokuva perheen sunnuntailounaasta vuodelta 2026\n5. Vuonna 2125 kirjoitettu oppikirja 2000-luvun ruokatavoista\n\nMontako näistä voisi olla lähde tälle tutkijalle?","vastaus":3,"vinkki":"Tutkija elää sadan vuoden päästä. Mitkä asiat syntyivät vuonna 2026?","selitys":"Kuitti, ruokalista ja valokuva syntyivät vuonna 2026. Ne ovat tämän päivän tavallisia asioita, mutta sadan vuoden päästä ne ovat lähteitä. Elokuva ja oppikirja on tehty myöhemmin. Lähteitä on 3."},{"id":"H04","ryhma":"jalki","kysymys":"Tutkit, miten ihmiset elivät Suomessa kivikaudella.\n1. Kivikirves, joka löytyi kivikautiselta asuinpaikalta\n2. Vuonna 2019 tehty piirretty elokuva kivikauden ihmisistä\n3. Isoisän kertomus siitä, miten kivikaudella metsästettiin\n4. Saviastian palanen kivikautiselta asuinpaikalta\n5. Kivikaudella maalattu kalliomaalaus\n6. Museon opastaulu, joka kirjoitettiin vuonna 2015\n\nMontako näistä voisi olla lähde tähän tutkimukseen?","vastaus":3,"vinkki":"Kukaan nyt elävä ei ollut kivikaudella. Mitkä asiat ovat kivikaudelta itseltään?","selitys":"Kivikirves, saviastian palanen ja kalliomaalaus tehtiin kivikaudella. Isoisä ei ollut kivikaudella, joten hänen kertomuksensa ei ole lähde. Elokuva ja opastaulu on tehty nykyaikana. Lähteitä on 3."},{"id":"H05","ryhma":"jalki","kysymys":"Tutkit, millaista oli kylän kaupassa 1930-luvulla.\n1. Kauppiaan kirjanpitovihko vuodelta 1934\n2. Kaupan rakennus, jossa kauppaa pidettiin 1930-luvulla\n3. Kaupan ilmoitus sanomalehdessä vuodelta 1936\n4. Haastattelu, jossa 1930-luvulla lapsena kaupassa käynyt Helmi kertoo muistojaan\n5. Vaaka, jolla punnittiin jauhoja kaupassa 1930-luvulla\n\nMontako näistä voisi olla lähde tähän tutkimukseen?","vastaus":5,"vinkki":"Käy asiat läpi yksi kerrallaan. Onko joukossa yhtäkään myöhemmin tehtyä?","selitys":"Kaikki viisi ovat 1930-luvulta tai niitä käytettiin silloin, ja Helmi kävi kaupassa itse. Lähteitä on 5. Aina ei ole mukana väärää vaihtoehtoa, joten tarkista jokainen."},{"id":"H06","ryhma":"jalki","tyyppi":"monivalinta","kysymys":"Aili on syntynyt vuonna 1952. Vuonna 2025 hän kertoo haastattelussa, millaista oli käydä kyläkoulua 1960-luvulla.\n\nMiksi Ailin kertomus on lähde 1960-luvun koulusta, vaikka se kerrottiin vasta vuonna 2025?","vaihtoehdot":["Koska Aili kävi itse koulua 1960-luvulla.","Koska kaikki vanhojen ihmisten kertomukset ovat lähteitä.","Koska kertomus on puhuttu eikä kirjoitettu."],"vastaus":0,"vinkki":"Mieti, kenen kertomus kivikaudesta ei olisi lähde.","selitys":"Aili kävi itse koulua 1960-luvulla, joten hän kertoo omista kokemuksistaan. Kaikki vanhojen ihmisten kertomukset eivät ole lähteitä: kertomus kivikaudesta ei olisi. Se, että kertomus on puhuttu, kertoo lähdetyypin, ei sitä, onko se lähde."},{"id":"H07","ryhma":"jalki","kysymys":"Tutkit, millaista oli sinun luokallasi viime viikolla.\n1. Luokan lukujärjestys tältä syksyltä\n2. Viime viikon ruokalista\n3. Luokan retkellä viime viikolla otettu valokuva\n4. Vuonna 1965 otettu luokkakuva\n5. Luokkakaverin päiväkirja viime viikolta\n\nMonesko asia ei ole lähde tähän tutkimukseen?","vastaus":4,"vinkki":"Tuoreetkin asiat voivat olla lähteitä. Mikä asia ei ole viime viikolta?","selitys":"Lukujärjestys, ruokalista, retkikuva ja päiväkirja ovat tältä syksyltä. Vuonna 1965 otettu luokkakuva on vanha, mutta se ei kerro mitään sinun luokastasi viime viikolla. Vanha ei ole aina oikea lähde."},{"id":"H08","ryhma":"tyypit","kysymys":"Nämä kaikki ovat lähteitä 1940-luvun kodista:\n1. Kirje, jonka äiti kirjoitti sisarelleen vuonna 1944\n2. Perheen valokuva vuodelta 1946\n3. Päiväkirja vuodelta 1945\n4. Puinen leikkihevonen, jolla lapset leikkivät 1940-luvulla\n5. Sanomalehti vuodelta 1947\n\nMontako eri lähdetyyppiä luettelossa on?","vastaus":3,"vinkki":"Merkitse jokaisen viereen tyyppi. Laske sitten, montako eri tyyppiä merkitsit.","selitys":"Kirje, päiväkirja ja sanomalehti ovat kirjoitettuja lähteitä, valokuva on kuva ja leikkihevonen esine. Eri tyyppejä on 3: kirjoitettu, kuva ja esine."},{"id":"H09","ryhma":"tyypit","kysymys":"Nämä kaikki ovat lähteitä 1800-luvun kylästä:\n1. Vuonna 1850 rakennettu aitta\n2. Maalaus kylän kirkosta vuodelta 1870\n3. Kylän asukkaiden luettelo vuodelta 1860\n4. Sirppi, jolla leikattiin viljaa 1800-luvulla\n5. Vuonna 1820 rakennettu kirkko\n6. Piirros kylän raitista vuodelta 1880\n\nMontako eri lähdetyyppiä luettelossa on?","vastaus":4,"vinkki":"Sama tyyppi voi esiintyä luettelossa monta kertaa. Laske vain erilaiset.","selitys":"Aitta ja kirkko ovat rakennuksia, maalaus ja piirros kuvia, asukasluettelo kirjoitettu lähde ja sirppi esine. Eri tyyppejä on 4."},{"id":"H10","ryhma":"tyypit","kysymys":"Nämä kaikki ovat lähteitä 1970-luvun koulusta:\n1. Koulutodistus vuodelta 1974\n2. Luokkakuva vuodelta 1975\n3. Opettajan kirjoittama tiedote kodeille vuodelta 1973\n4. Koulureppu, jota käytettiin 1970-luvulla\n5. Koululaisen vihko, johon hän kirjoitti aineen vuonna 1976\n6. Haastattelu, jossa 1970-luvulla koulua käynyt Pekka kertoo välitunneista\n\nMontako näistä on kirjoitettuja lähteitä?","vastaus":3,"vinkki":"Missä tieto on? Todistus ja vihko ovat paperia, mutta tieto on kirjoituksessa.","selitys":"Todistus, tiedote ja vihko ovat kirjoitettuja lähteitä. Luokkakuva on kuva, reppu esine ja haastattelu suullinen lähde. Kirjoitettuja on 3."},{"id":"H11","ryhma":"tyypit","tyyppi":"monivalinta","kysymys":"Tutkit 1920-luvun elämää. Löydät vanhan kauppakirjan, johon on kirjoitettu, kuka myi talon kenelle ja millä hinnalla vuonna 1925.\n\nMikä lähdetyyppi kauppakirja on?","vaihtoehdot":["esine","kirjoitettu lähde","kuva"],"vastaus":1,"vinkki":"Mieti, missä kauppakirjan tieto on: paperissa vai siinä, mitä paperiin on kirjoitettu?","selitys":"Kauppakirja on kirjoitettu lähde, koska sen tieto on kirjoituksessa: myyjä, ostaja ja hinta. Paperi itsessään ei kerro kaupasta mitään. Kuvaa siinä ei ole."},{"id":"H12","ryhma":"tyypit","kysymys":"Nämä kaikki ovat lähteitä 1990-luvun lapsuudesta:\n1. Lelu, jolla leikittiin 1990-luvulla\n2. Valokuva syntymäpäiväjuhlista vuodelta 1994\n3. Lastenlehti vuodelta 1996\n4. Haastattelu, jossa äiti kertoo omasta lapsuudestaan 1990-luvulla\n5. Piirustus, jonka äiti piirsi lapsena vuonna 1993\n\nMonesko asia on suullinen lähde?","vastaus":4,"vinkki":"Suullisessa lähteessä tieto on puheessa.","selitys":"Haastattelussa äiti kertoo lapsuudestaan puhumalla, joten asia 4 on suullinen lähde. Piirustus on kuva, vaikka äiti teki sen itse."},{"id":"H13","ryhma":"tyypit","kysymys":"Nämä kaikki ovat lähteitä 1910-luvun kaupungista:\n1. Vuonna 1912 rakennettu rautatieasema\n2. Valokuva torilta vuodelta 1914\n3. Vuonna 1908 rakennettu kauppahalli\n4. Vuonna 1910 rakennettu koulutalo\n5. Sanomalehti vuodelta 1917\n6. Vuonna 1911 rakennettu kirkko\n\nMontako näistä on rakennuksia?","vastaus":4,"vinkki":"Etsi sana rakennettu.","selitys":"Rautatieasema, kauppahalli, koulutalo ja kirkko ovat rakennuksia. Kauppahalli rakennettiin jo 1908, mutta sitä käytettiin 1910-luvulla, joten se on lähde siitäkin ajasta. Rakennuksia on 4."},{"id":"H14","ryhma":"tyypit","kysymys":"Nämä kaikki ovat lähteitä kivikaudelta:\n1. Keihäänkärki\n2. Kalliomaalaus hirvestä\n3. Kivikirves\n4. Saviastian palanen\n5. Kalliomaalaus veneestä\n\nMontako eri lähdetyyppiä luettelossa on?","vastaus":2,"vinkki":"Kalliomaalaus on kuva. Mitä muuta luettelossa on?","selitys":"Keihäänkärki, kivikirves ja saviastian palanen ovat esineitä, ja kalliomaalaukset ovat kuvia. Eri tyyppejä on 2. Kivikaudelta Suomesta ei ole kirjoitettuja lähteitä, koska täällä ei silloin osattu kirjoittaa."},{"id":"H15","ryhma":"myohemmin","kysymys":"Tutkit, millaista oli matkustaa höyrylaivalla 1890-luvulla.\n1. Höyrylaivan matkalippu vuodelta 1893\n2. Historian oppikirja vuodelta 2020, jossa kerrotaan höyrylaivoista\n3. Valokuva laivan kannelta vuodelta 1896\n4. Vuonna 2018 tehty televisiosarja 1890-luvun laivamatkasta\n5. Tutkijan kirja höyrylaivojen historiasta vuodelta 2005\n\nMontako näistä ei ole lähde tähän tutkimukseen?","vastaus":3,"vinkki":"Oppikirja, tutkimus ja televisiosarja kertovat 1890-luvusta. Milloin ne on tehty?","selitys":"Oppikirja, televisiosarja ja tutkijan kirja on tehty paljon myöhemmin kuin 1890-luvulla. Ne kertovat laivamatkoista, mutta eivät ole jälkiä siltä ajalta. Matkalippu ja valokuva ovat. Ei-lähteitä on 3."},{"id":"H16","ryhma":"myohemmin","kysymys":"Tutkit, miten 1880-luvulla pyykättiin.\n1. Pyykkilauta, jota käytettiin 1880-luvulla\n2. Valokuva pyykkirannalta vuodelta 1885\n3. Emännän kirje sisarelleen vuodelta 1883, jossa hän kertoo pyykkipäivästä\n4. Pesutupa, jossa pyykkiä pestiin 1880-luvulla\n5. Oppikirja vuodelta 2019, jossa on luku 1800-luvun kotitöistä\n\nMonesko asia ei ole lähde tähän tutkimukseen?","vastaus":5,"vinkki":"Oppikirjan tieto voi olla oikeaa. Onko se silti jälki 1880-luvulta?","selitys":"Oppikirja on kirjoitettu vuonna 2019 lähteiden ja tutkimusten avulla. Se ei ole lähde 1880-luvusta, vaikka se kertoo siitä. Pyykkilauta, valokuva, kirje ja pesutupa ovat 1880-luvulta."},{"id":"H17","ryhma":"myohemmin","tyyppi":"monivalinta","kysymys":"Vuonna 2019 tehtiin piirretty elokuva kivikauden perheestä. Elokuvassa on tarkkoja kuvia asumuksista, vaatteista ja työkaluista.\n\nMiksi elokuva ei ole lähde kivikaudesta?","vaihtoehdot":["Se on piirretty eikä kuvattu kameralla.","Sen tekijät eivät eläneet kivikaudella, vaan kuvittelivat sen tutkimusten avulla.","Se on liian uusi ollakseen lähde mistään."],"vastaus":1,"vinkki":"Piirros voi olla lähde, jos se on tehty tutkittavana aikana. Mikä tässä on ratkaisevaa?","selitys":"Elokuvan tekijät eivät eläneet kivikaudella, joten elokuva on kuvitelma, vaikka se olisi tehty huolellisesti. Piirtäminen ei ratkaise: kivikaudella maalattu kalliomaalaus on lähde. Uusikin asia voi olla lähde, mutta vain omasta ajastaan."},{"id":"H18","ryhma":"myohemmin","kysymys":"Tutkit, millaista oli elää kylässä 1700-luvulla.\n1. Vuonna 1760 rakennettu kirkko\n2. Vuonna 2021 kirjoitettu romaani 1700-luvun kylästä\n3. Vuonna 1750 maalattu muotokuva kylän papista\n4. Seurakunnan kirja, johon kylän asukkaat kirjattiin vuonna 1755\n5. Vuonna 2015 tehty televisiosarja 1700-luvun elämästä\n6. Puuarkku, jossa säilytettiin vaatteita 1700-luvulla\n\nMontako näistä voisi olla lähde tähän tutkimukseen?","vastaus":4,"vinkki":"Romaani ja televisiosarja kertovat 1700-luvusta. Milloin ne tehtiin?","selitys":"Kirkko, muotokuva, seurakunnan kirja ja puuarkku ovat 1700-luvulta. Romaani ja televisiosarja on tehty 2000-luvulla, joten ne ovat kuvitelmia 1700-luvusta. Lähteitä on 4."},{"id":"H19","ryhma":"myohemmin","kysymys":"Vuonna 2126 historiantutkija haluaa tietää, millaista oli käydä koulua vuonna 2026.\n1. Lukujärjestys vuodelta 2026\n2. Vuonna 2026 otettu luokkakuva\n3. Vuonna 2110 kirjoitettu oppikirja 2000-luvun kouluista\n4. Matematiikan kirja, jota käytettiin koulussa vuonna 2026\n5. Vuonna 2100 tehty elokuva 2020-luvun koulusta; sen tekijät syntyivät 2070-luvulla\n6. Koulurakennus, jossa opiskeltiin vuonna 2026\n\nMontako näistä ei ole lähde tälle tutkijalle?","vastaus":2,"vinkki":"Kaksi kirjaa: toista käytettiin vuonna 2026, toinen kirjoitettiin myöhemmin.","selitys":"Vuoden 2110 oppikirja ja vuoden 2100 elokuva on tehty myöhemmin, joten ne eivät ole lähteitä. Matematiikan kirja on lähde, koska sitä käytettiin koulussa vuonna 2026: siitä näkee, mitä silloin opiskeltiin. Ei-lähteitä on 2."},{"id":"H20","ryhma":"myohemmin","kysymys":"Tutkit, millaista oli käydä koulua 1960-luvulla. Neljä ihmistä kertoo siitä vuonna 2025:\n1. Mummo, joka kävi koulua 1960-luvulla, kertoo omista koulupäivistään.\n2. Opettaja, joka syntyi vuonna 1990, kertoo, mitä on lukenut 1960-luvun kouluista.\n3. Mummon serkku, joka kävi samaa koulua 1960-luvulla, kertoo välitunneista.\n4. Serkku, joka syntyi vuonna 2010, kertoo 1960-luvun koulusta kertovasta elokuvasta, jonka hän näki.\n\nMontako näistä kertomuksista on lähteitä 1960-luvun koulusta?","vastaus":2,"vinkki":"Kaikki kertovat vuonna 2025. Kuka heistä oli itse koulussa 1960-luvulla?","selitys":"Mummo ja hänen serkkunsa kävivät itse koulua 1960-luvulla, joten heidän kertomuksensa ovat lähteitä. Opettaja kertoo lukemastaan ja serkku elokuvasta. He eivät olleet mukana. Lähteitä on 2."}],"valmis_teksti":"Tunnistat historiallisen lähteen, erotat sen myöhemmin tehdystä oppikirjasta tai kuvitelmasta ja osaat nimetä erilaisia lähdetyyppejä. Tämä taito on nyt näytetty."};

const esc = s => s;

      return `<p class="lead">${esc(o.sisalto)}</p>`;

      return `<div class="box warn"><h3>${esc(o.otsikko)}</h3><p style="margin:0">${esc(o.sisalto)}</p></div>`;

      return `<div class="box note"><h3>${esc(o.otsikko)}</h3><ul class="notes">${

const svg=document.getElementById("nlsvg"), rng=document.getElementById("nlrange"), out=document.getElementById("nlout");
const X0=34, X1=606, Y=62;
function piirraNL(v){
  const ala=Math.floor(v/10)*10, yla=ala+10, puoli=ala+5;
  const pyor = (v%10)>=5 ? yla : ala;
  const x = n => X0 + (n/100)*(X1-X0);
  let s=`<line class="rail" x1="${X0}" y1="${Y}" x2="${X1}" y2="${Y}"/>`;
  for(let n=0;n<=100;n+=10){
    const near = (n===ala||n===yla);
    s+=`<line class="tick" x1="${x(n)}" y1="${Y-7}" x2="${x(n)}" y2="${Y+7}"/>`;
    s+=`<text class="stop${near?" near":""}" x="${x(n)}" y="${Y+24}" text-anchor="middle">${n}</text>`;
  }
  s+=`<line class="halfway" x1="${x(puoli)}" y1="${Y-16}" x2="${x(puoli)}" y2="${Y+12}"/>`;
  s+=`<text class="stop" x="${x(puoli)}" y="${Y-22}" text-anchor="middle">puoliväli ${puoli}</text>`;
  s+=`<circle class="dot" cx="${x(v)}" cy="${Y}" r="6"/>`;
  s+=`<text class="val" x="${x(v)}" y="${Y-32}" text-anchor="middle">${v}</text>`;
  s+=`<path d="M ${x(v)} ${Y+38} L ${x(pyor)} ${Y+38}" stroke="var(--core)" stroke-width="2" fill="none"/>`;
  s+=`<path d="M ${x(pyor)} ${Y+38} l ${x(pyor)>x(v)?-7:7} -4 l 0 8 z" fill="var(--core)"/>`;
  svg.innerHTML=s;
  out.textContent = `${v} pyöristyy → ${pyor}`;
}

/* ---------- laskujärjestys-widget ---------- */
const ljExp=document.getElementById("ljExp");
if(ljExp && D.kokeilu){
  let ljI=0, ljTokens=[], ljStep=0;
  const laske=(a,op,b)=>{a=+a;b=+b;return op==="×"?a*b:op==="÷"?a/b:op==="+"?a+b:a-b;};
  function ljAlku(){
    const l=D.kokeilu[ljI];
    ljTokens=l.lauseke.replace(/\(/g,"( ").replace(/\)/g," )").split(/\s+/).filter(Boolean);
    ljStep=0; ljPiirra(); ljViesti("","");
  }
  function ljViesti(t,lk){const f=document.getElementById("ljFb"); f.textContent=t; f.className="lj-fb "+(lk||"");}
  function ljPiirra(){
    const l=D.kokeilu[ljI];
    document.getElementById("ljStep").textContent =
      ljStep>=l.askeleet.length ? "valmis" : `askel ${ljStep+1} / ${l.askeleet.length}`;
    if(ljStep>=l.askeleet.length){
      ljExp.innerHTML=`<span class="valmis">${l.lauseke} = ${l.vastaus}</span>`;
      return;
    }
    ljExp.innerHTML=ljTokens.map((t,i)=>
      "×÷+−".includes(t) ? `<button type="button" class="op" data-i="${i}">${t}</button>`
                         : `<span class="tok">${t}</span>`).join("");
    ljExp.querySelectorAll("button.op").forEach(b=>b.addEventListener("click",()=>ljKlikkaa(+b.dataset.i)));
  }
  function ljKlikkaa(i){
    const l=D.kokeilu[ljI], odotettu=l.askeleet[ljStep];
    const ehdotus=[ljTokens[i-1],ljTokens[i],ljTokens[i+1]].join(" ");
    if(ehdotus!==odotettu){
      ljViesti(ljStep===0
        ? "Ei vielä. Sulkeet ovat vahvimmat, sitten kerto ja jako. Yhtä vahvat vasemmalta oikealle."
        : "Ei vielä. Kumpi jäljellä olevista on vahvempi?", "no");
      return;
    }
    const arvo=laske(ljTokens[i-1],ljTokens[i],ljTokens[i+1]);
    let alku=i-1, loppu=i+1;
    if(ljTokens[i-2]==="(" && ljTokens[i+2]===")"){ alku=i-2; loppu=i+2; }
    ljTokens.splice(alku, loppu-alku+1, String(arvo));
    ljStep++;
    ljViesti(ljStep>=l.askeleet.length ? "Valmis. Vastaus on "+l.vastaus+"." : "Oikein. Jatka seuraavaan.", "ok");
    ljPiirra();
  }
  document.getElementById("ljSeuraava").addEventListener("click",()=>{
    ljI=(ljI+1)%D.kokeilu.length; ljAlku();
  });
  ljAlku();
}

/* Suomalainen lukumuoto: välilyönti on tuhaterotin, pilkku desimaalierotin.
   Piste voi olla kumpi tahansa. Se tulkitaan tuhaterottimeksi VAIN silloin, kun
   koko luku on aitoa tuhaterotinmuotoa: alkuosa 1–3 numeroa ilman etunollaa ja
   jokainen jatko-osa täsmälleen 3 numeroa (1.500, 12.345.678). Kaikissa muissa
   tapauksissa piste on desimaalipiste — myös 0.125, joka vanhalla säännöllä
   ("3 numeroa pisteen jäljessä = tuhaterotin") luettiin virheellisesti luvuksi 125. */
const TUHATEROTIN = /^[1-9]\d{0,2}(\.\d{3})+$/;
function lueLuku(teksti){
  // Murtoluku (3/4, -3/4) ja sekaluku (1 2/3, -1 2/3) hyväksytään sellaisinaan.
  const raaka = String(teksti).replace(/\u00a0/g, " ").trim();
  let m = raaka.match(/^(-?)(\d+)\s+(\d+)\s*\/\s*(\d+)$/);
  if(m){ const nim = Number(m[4]); if(nim === 0) return null;
    const v = Number(m[2]) + Number(m[3]) / nim; return m[1] ? -v : v; }
  m = raaka.match(/^(-?)\s*(\d+)\s*\/\s*(\d+)$/);
  if(m){ const nim = Number(m[3]); if(nim === 0) return null;
    const v = Number(m[2]) / nim; return m[1] ? -v : v; }
  let s = String(teksti).replace(/[\s\u00a0]/g, "");
  if(s === "") return null;
  if(s.indexOf(",") >= 0){
    s = s.replace(/\./g, "").replace(",", ".");
  } else if(TUHATEROTIN.test(s)){
    s = s.replace(/\./g, "");
  }
  const n = Number(s);
  return Number.isFinite(n) ? n : null;
}

function tarkista(id){
  const h=D.harjoitukset.find(x=>x.id===id);
  const kentta=document.getElementById("in-"+id);
  const fb=document.getElementById("fb-"+id);
  if(kentta.value.trim()===""){ fb.className="fb hint"; fb.textContent="Kirjoita vastaus ensin."; return; }
  const luku=lueLuku(kentta.value);
  if(luku===null){ fb.className="fb no"; fb.textContent="Vastauksen pitää olla luku tai murtoluku (esimerkiksi 3/4)."; return; }
  const oikein = Math.abs(luku - h.vastaus) < 1e-9;
  merkitseTulos(id, oikein, oikein ? "Oikein. "+h.selitys : `Ei vielä. ${h.vinkki} Kokeile uudelleen.`);
}

function tarkistaMonivalinta(id, valittuIndeksi, painike){
  const h=D.harjoitukset.find(x=>x.id===id);
  const rivi=painike.closest(".row");
  rivi.querySelectorAll(".mv-valinta").forEach(b=>b.disabled=true);
  const oikein = valittuIndeksi===h.vastaus;
  painike.classList.add(oikein?"mv-oikein":"mv-vaarin");
  if(!oikein){
    const oikeaBtn=rivi.querySelector(`[data-i="${h.vastaus}"]`);
    if(oikeaBtn) oikeaBtn.classList.add("mv-oikein");
  }
  merkitseTulos(id, oikein, oikein ? "Oikein. "+h.selitys : `Ei ihan. Oikea vastaus on korostettu. ${h.selitys||""}`);
}

/* Kuuntelu: selain lukee tekstin ääneen omalla puhesynteesillään (englanniksi, jos laitteessa on
   englanninkielinen ääni). Ei äänitiedostoja eikä verkkoyhteyttä. Jos laite ei osaa puhua,
   teksti näytetään luettavaksi — silloin tehtävä muuttuu luetun ymmärtämiseksi, mutta ei katkea. */
function puhu(id, nopeus){
  const h=D.harjoitukset.find(x=>x.id===id); if(!h || !h.kuuntele) return;
  const vara=document.getElementById("vara-"+id);
  const naytaTeksti=syy=>{ vara.hidden=false; vara.textContent=syy+" Teksti: "+h.kuuntele; };
  if(!("speechSynthesis" in window)){ naytaTeksti("Tämä laite ei osaa lukea ääneen."); return; }
  const s=window.speechSynthesis; s.cancel();
  const u=new SpeechSynthesisUtterance(h.kuuntele);
  u.lang=h.kieli||"en-GB"; u.rate=nopeus;
  const aanet=s.getVoices(), kieli=u.lang.slice(0,2);
  const aani=aanet.find(a=>a.lang===u.lang) || aanet.find(a=>a.lang && a.lang.startsWith(kieli));
  if(aani) u.voice=aani;
  else if(aanet.length) { naytaTeksti("Laitteessa ei ole englanninkielistä ääntä."); return; }
  u.onerror=()=>naytaTeksti("Ääneen lukeminen ei onnistunut.");
  s.speak(u);
}
