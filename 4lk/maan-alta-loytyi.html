<title>Maan alta löytyi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">

<style>
:root{
  --paper:#EFF2F5; --surface:#FFFFFF; --surface-2:#F7F9FB;
  --grid:#DCE3EA; --line:#C9D3DC;
  --ink:#15222C; --ink-2:#4E626F; --ink-3:#7E8F9B;
  --core:#1B5A9E; --core-soft:#E4EDF6;
  --strong:#1F6E5C; --strong-soft:#E1F0EB;
  --chal:#9A6A16; --chal-soft:#F6EDDC;
  --alert:#A33A2B; --alert-soft:#F8E7E3;
  --shadow:0 1px 2px rgba(21,34,44,.06), 0 8px 24px -12px rgba(21,34,44,.18);
  --r:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0F161B; --surface:#18222A; --surface-2:#1D2830;
    --grid:#22303A; --line:#2E3E4A;
    --ink:#E8EFF4; --ink-2:#A3B4C0; --ink-3:#7A8B97;
    --core:#7FB2E4; --core-soft:#16303F;
    --strong:#77CDB4; --strong-soft:#123028;
    --chal:#E0B267; --chal-soft:#33270F;
    --alert:#E8907F; --alert-soft:#3A1E19;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -14px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --paper:#0F161B; --surface:#18222A; --surface-2:#1D2830;
  --grid:#22303A; --line:#2E3E4A;
  --ink:#E8EFF4; --ink-2:#A3B4C0; --ink-3:#7A8B97;
  --core:#7FB2E4; --core-soft:#16303F;
  --strong:#77CDB4; --strong-soft:#123028;
  --chal:#E0B267; --chal-soft:#33270F;
  --alert:#E8907F; --alert-soft:#3A1E19;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -14px rgba(0,0,0,.7);
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:16px; line-height:1.62;
  background-image:
    linear-gradient(to right, var(--grid) 1px, transparent 1px),
    linear-gradient(to bottom, var(--grid) 1px, transparent 1px);
  background-size:26px 26px;
}
.wrap{max-width:760px; margin:0 auto; padding:28px 20px 90px}
h1,h2,h3,h4{font-family:"Familjen Grotesk","IBM Plex Sans",system-ui,sans-serif; text-wrap:balance}

/* header */
header.top{background:var(--surface); border:1px solid var(--line); border-radius:var(--r);
  box-shadow:var(--shadow); padding:22px 24px; display:flex; gap:18px; align-items:flex-start}
.badge{flex:0 0 auto; width:54px; height:54px; border-radius:9px; display:grid; place-items:center;
  background:var(--core-soft); border:1px solid var(--core); color:var(--core)}
.badge svg{width:28px; height:28px; fill:none; stroke:currentColor; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round}
.eyebrow{font-family:"IBM Plex Mono",monospace; font-size:11px; letter-spacing:.14em;
  text-transform:uppercase; color:var(--ink-3); margin:0 0 5px}
header.top h1{margin:0; font-size:30px; font-weight:700; letter-spacing:-.015em}
header.top p{margin:5px 0 0; color:var(--ink-2); font-size:15px}
.tags{display:flex; flex-wrap:wrap; gap:5px; margin-top:11px}
.tag{font-family:"IBM Plex Mono",monospace; font-size:10.5px; letter-spacing:.05em; padding:2px 7px;
  border-radius:4px; background:var(--surface-2); border:1px solid var(--line); color:var(--ink-3)}
.tag.core{background:var(--core-soft); border-color:var(--core); color:var(--core)}

/* teksti */
article{margin-top:26px}
article h2{font-size:21px; font-weight:600; margin:32px 0 10px; letter-spacing:-.01em}
article p{margin:0 0 14px; max-width:64ch}
.lead{font-size:17.5px; color:var(--ink); border-left:3px solid var(--core); padding-left:16px; margin:0 0 8px}

.box{background:var(--surface); border:1px solid var(--line); border-radius:var(--r);
  padding:18px 22px; box-shadow:var(--shadow); margin:22px 0}
.box h3{margin:0 0 12px; font-size:16.5px; font-weight:600}
.box.warn{border-left:3px solid var(--alert)}
.box.note{border-left:3px solid var(--chal)}

ol.steps{margin:0; padding-left:0; list-style:none; counter-reset:s; display:grid; gap:12px}
ol.steps li{counter-increment:s; display:grid; grid-template-columns:auto 1fr; gap:13px; align-items:start}
ol.steps li::before{content:counter(s); font-family:"Familjen Grotesk",sans-serif; font-weight:700; font-size:14px;
  width:26px; height:26px; border-radius:50%; background:var(--core); color:#fff; display:grid; place-items:center; margin-top:2px}

ul.notes{margin:0; padding-left:19px}
ul.notes li{margin-bottom:7px}
ul.notes li:last-child{margin-bottom:0}

.tablewrap{overflow-x:auto}
table{border-collapse:collapse; width:100%; font-size:14.5px; min-width:460px}
th,td{text-align:left; padding:9px 13px; border-bottom:1px solid var(--line)}
th{font-family:"IBM Plex Mono",monospace; font-size:10.5px; letter-spacing:.1em; text-transform:uppercase;
  color:var(--ink-3); font-weight:400; background:var(--surface-2)}
tr:last-child td{border-bottom:0}
td b{color:var(--core); font-weight:600}
td:last-child{font-variant-numeric:tabular-nums; font-weight:600}

/* lukusuora */
.nl svg{width:100%; height:118px; display:block}
.nl .rail{stroke:var(--line); stroke-width:2}
.nl .tick{stroke:var(--line); stroke-width:1.5}
.nl .stop{fill:var(--ink-3); font-family:"IBM Plex Mono",monospace; font-size:11px}
.nl .stop.near{fill:var(--core); font-weight:600}
.nl .dot{fill:var(--chal)}
.nl .val{fill:var(--ink); font-family:"Familjen Grotesk",sans-serif; font-size:15px; font-weight:700}
.nl .halfway{stroke:var(--chal); stroke-dasharray:3 3; stroke-width:1.5}
.nl-controls{display:flex; align-items:center; gap:14px; margin-top:6px}
.nl-controls input{flex:1; accent-color:var(--core)}
.nl-out{font-family:"Familjen Grotesk",sans-serif; font-size:15px; font-weight:600; min-width:12.5em; text-align:right}

/* paikka-arvotaulu */
.box .ohje{margin:0 0 14px; font-size:14.5px; color:var(--ink-2)}
.nt-valinta{display:flex; flex-wrap:wrap; gap:7px; margin-bottom:16px}
.nt-valinta button{font:inherit; font-size:12.5px; font-family:"IBM Plex Mono",monospace; padding:5px 11px;
  border-radius:6px; border:1px solid var(--line); background:var(--surface-2); color:var(--ink-2); cursor:pointer}
.nt-valinta button[aria-pressed="true"]{background:var(--ink); color:var(--paper); border-color:var(--ink)}
.nt-valinta button:focus-visible{outline:2px solid var(--core); outline-offset:2px}
.nt-taulu{display:flex; flex-direction:column; gap:4px; align-items:flex-start; overflow-x:auto; padding-bottom:4px}
.nt-rivi{display:flex; gap:6px; align-items:center}
.nt-rivi .otsa{font-family:"IBM Plex Mono",monospace; font-size:9.5px; letter-spacing:.08em;
  text-transform:uppercase; color:var(--ink-3); width:52px; text-align:center}
.nt-ruutu{width:52px; height:52px; display:grid; place-items:center; border:1.5px solid var(--line);
  border-radius:7px; background:var(--surface-2); font-family:"IBM Plex Mono",monospace; font-size:24px}
.nt-ruutu.kohta{border-color:var(--core); background:var(--core-soft); color:var(--core); font-weight:500}
.nt-ruutu.ratkaiseva{border-color:var(--chal); background:var(--chal-soft); color:var(--chal); font-weight:500}
.nt-ruutu.nolla{color:var(--ink-3)}
.nt-rivi .nimi{font-size:12.5px; color:var(--ink-3); margin-left:12px; white-space:nowrap}
.nt-nuoli{font-size:17px; color:var(--chal); margin-left:6px}
.nt-selite{margin:14px 0 0; font-size:14.5px}
.nt-selite b{color:var(--core)}

/* vahvuusportaat */
.vp-tasot{display:grid; gap:9px; margin-bottom:18px}
.vp-taso{display:flex; gap:11px; align-items:flex-start; font-size:13.5px}
.vp-taso .vp-pallo{width:13px; height:13px; border-radius:4px; margin-top:5px; flex:0 0 auto}
.vp-taso[data-taso="sulkeet"] .vp-pallo{background:var(--core)}
.vp-taso[data-taso="kertojako"] .vp-pallo{background:var(--strong)}
.vp-taso[data-taso="yhteenvahennys"] .vp-pallo{background:var(--chal)}
.vp-taso strong{display:block; font-family:"Familjen Grotesk",sans-serif; font-weight:600; font-size:14.5px}
.vp-taso span{color:var(--ink-2)}
.vp-lauseke{display:flex; flex-wrap:wrap; gap:7px; align-items:flex-end; font-family:"IBM Plex Mono",monospace;
  font-size:25px; padding:10px 2px; min-height:64px}
.vp-lauseke .t{padding:2px 3px}
.vp-lauseke .op{position:relative; padding:2px 9px; border-radius:6px; font-weight:500}
.vp-lauseke .op[data-taso="sulkeet"]{background:var(--core-soft); color:var(--core)}
.vp-lauseke .op[data-taso="kertojako"]{background:var(--strong-soft); color:var(--strong)}
.vp-lauseke .op[data-taso="yhteenvahennys"]{background:var(--chal-soft); color:var(--chal)}
.vp-lauseke .op i{position:absolute; top:-9px; right:-6px; font-style:normal; font-family:"Familjen Grotesk",sans-serif;
  font-size:11px; font-weight:700; width:18px; height:18px; border-radius:50%; display:grid; place-items:center;
  background:currentColor}
.vp-lauseke .op i span{color:var(--surface)}
.vp-rivi{display:flex; align-items:center; gap:16px; margin-top:8px}
.vp-vastaus{font-family:"Familjen Grotesk",sans-serif; font-size:16px; font-weight:600; color:var(--strong)}

/* laskujärjestys-widget */
.lj-exp{display:flex; flex-wrap:wrap; gap:7px; align-items:center; font-family:"IBM Plex Mono",monospace;
  font-size:23px; padding:14px 4px; min-height:62px}
.lj-exp .tok{padding:2px 4px; color:var(--ink)}
.lj-exp button.op{font-family:"IBM Plex Mono",monospace; font-size:23px; padding:3px 12px; border-radius:7px;
  border:1.5px solid var(--line); background:var(--surface-2); color:var(--ink); line-height:1.2}
.lj-exp button.op:hover{border-color:var(--core); color:var(--core)}
.lj-exp button.op:focus-visible{outline:2px solid var(--core); outline-offset:2px}
.lj-exp .valmis{font-family:"Familjen Grotesk",sans-serif; font-size:23px; font-weight:700; color:var(--strong)}
.lj-fb{font-size:14.5px; min-height:1.5em; color:var(--ink-2)}
.lj-fb.no{color:var(--alert)}
.lj-fb.ok{color:var(--strong)}
.lj-row{display:flex; align-items:center; gap:14px; margin-top:10px}
.lj-step{font-family:"IBM Plex Mono",monospace; font-size:11.5px; letter-spacing:.1em;
  text-transform:uppercase; color:var(--ink-3)}

/* harjoitukset */
.progress{position:sticky; top:0; z-index:5; background:var(--surface); border:1px solid var(--line);
  border-radius:var(--r); padding:12px 18px; box-shadow:var(--shadow); display:flex; align-items:center;
  gap:14px; margin:34px 0 18px}
.progress .lbl{font-family:"IBM Plex Mono",monospace; font-size:11px; letter-spacing:.12em;
  text-transform:uppercase; color:var(--ink-3); white-space:nowrap}
.progress .meter{flex:1; height:7px; border-radius:4px; background:var(--surface-2); border:1px solid var(--line); overflow:hidden}
.progress .meter i{display:block; height:100%; background:var(--core); transition:width .25s ease}
.progress .cnt{font-family:"Familjen Grotesk",sans-serif; font-weight:700; font-variant-numeric:tabular-nums; white-space:nowrap}

.grp{margin-top:26px}
.grp-head{display:flex; align-items:baseline; gap:10px; border-bottom:1.5px solid var(--ink); padding-bottom:7px; margin-bottom:14px}
.grp-head h3{margin:0; font-size:17px; font-weight:600}
.grp-head span{font-size:12.5px; color:var(--ink-2)}

.ex{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:14px 16px; margin-bottom:10px}
.ex[data-tila="oikein"]{border-color:var(--strong); box-shadow:inset 3px 0 0 var(--strong)}
.ex[data-tila="vaarin"]{border-color:var(--alert); box-shadow:inset 3px 0 0 var(--alert)}
.ex .q{display:flex; gap:11px; align-items:baseline; flex-wrap:wrap}
.ex .num{font-family:"IBM Plex Mono",monospace; font-size:11.5px; color:var(--ink-3); min-width:2.4em}
.ex .txt{flex:1; min-width:190px; font-size:15.5px}
.ex .txt .aineisto{display:block; margin-bottom:9px; padding-left:12px;
  border-left:2px solid var(--line); color:var(--ink-2); line-height:1.6;
  /* Aineisto voi olla pieni taulukko, jonka rivit on erotettu rivinvaihdoilla.
     Ilman pre-lineä ne valuisivat yhdeksi kappaleeksi ja taulukko katoaisi. */
  white-space:pre-line}
.ex .txt .kysymysrivi{display:block; font-weight:600}
.ex .row{display:flex; gap:8px; align-items:center; margin-top:11px; flex-wrap:wrap}
.ex input[type=text]{font:inherit; font-family:"IBM Plex Mono",monospace; font-size:15px; width:8.5em;
  padding:7px 11px; border:1px solid var(--line); border-radius:7px; background:var(--surface-2);
  color:var(--ink); text-align:right}
.ex input:focus-visible{outline:2px solid var(--core); outline-offset:1px}
button{font:inherit; cursor:pointer}
.btn{font-size:13.5px; padding:7px 15px; border-radius:7px; border:1px solid var(--core);
  background:var(--core); color:#fff}
.btn.ghost{background:transparent; color:var(--ink-2); border-color:var(--line)}
.btn:focus-visible{outline:2px solid var(--core); outline-offset:2px}
.btn.mv-valinta{text-align:left}
/* kuuntelutehtävä: selaimen puhesynteesi lukee englanninkielisen tekstin */
.kuuntele{display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin:2px 0 10px}
.kuuntele .btn{display:inline-flex; gap:7px; align-items:center}
.kuuntele svg{width:16px; height:16px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round}
.kuuntele .varateksti{flex-basis:100%; font-size:14px; color:var(--ink-2); background:var(--surface-2);
  border-radius:7px; padding:8px 12px; margin:0}
.btn.mv-valinta:disabled{cursor:default; opacity:.65}
.btn.mv-oikein{background:var(--strong-soft); border-color:var(--strong); color:var(--strong); opacity:1}
.btn.mv-vaarin{background:var(--alert-soft); border-color:var(--alert); color:var(--alert); opacity:1}
.row.mv{gap:8px 10px}
.fb{margin-top:11px; font-size:14.5px; padding:10px 13px; border-radius:8px; line-height:1.5}
.fb.ok{background:var(--strong-soft); color:var(--strong)}
.fb.no{background:var(--alert-soft); color:var(--alert)}
.fb.hint{background:var(--chal-soft); color:var(--chal)}

.done{background:var(--strong-soft); border:1px solid var(--strong); color:var(--strong);
  border-radius:var(--r); padding:16px 20px; margin-top:20px; font-size:15.5px}
.done h3{margin:0 0 4px; font-size:17px; color:var(--strong)}

details.teacher{margin-top:34px; background:var(--surface); border:1px solid var(--line);
  border-left:3px solid var(--chal); border-radius:var(--r); padding:15px 20px; box-shadow:var(--shadow)}
details.teacher summary{cursor:pointer; font-family:"Familjen Grotesk",sans-serif; font-weight:600; font-size:15px}
details.teacher summary:focus-visible{outline:2px solid var(--core); outline-offset:3px}
details.teacher ul{margin:12px 0 0; padding-left:19px; color:var(--ink-2); font-size:14.5px}
details.teacher li{margin-bottom:8px}
details.teacher p{margin:12px 0 0; color:var(--ink-2); font-size:14.5px}

.back{display:inline-block; margin-top:30px; font-size:13.5px; color:var(--ink-2)}
.back a{color:var(--core)}

@media (prefers-reduced-motion: reduce){*{transition:none !important}}
@media (max-width:560px){
  .wrap{padding:16px 13px 70px}
  header.top h1{font-size:25px}
  .progress{flex-wrap:wrap}
}
</style>

<div class="wrap">

  <header class="top">
    <span class="badge"><svg viewBox="0 0 24 24" aria-hidden="true" id="ikoni"></svg></span>
    <div>
      <p class="eyebrow" id="eyebrow"></p>
      <h1 id="otsikko"></h1>
      <p id="kuvaus"></p>
      <div class="tags" id="tags"></div>
    </div>
  </header>

  <article id="teksti"></article>

  <div class="progress" aria-live="polite">
    <span class="lbl">Harjoitukset</span>
    <span class="meter"><i id="pbar" style="width:0%"></i></span>
    <span class="cnt" id="pcnt">0 / 20</span>
  </div>

  <div id="harjoitukset"></div>
  <div id="valmis"></div>

  <p class="back" id="back"></p>

</div>

<script>
const D = {"tavoite_id":"HI4-LAH-02","oppiaine":"HI","vuosiluokka":4,"taso":"vahvistava","otsikko":"Maan alta löytyi","kuvaus":"Ymmärrän, että esihistoriasta tiedetään pääasiassa arkeologisten löytöjen, ei kirjoitusten, avulla.","versio":"0.2","paivitetty":"2026-09-26","ops":{"T":["T2","T3"],"S":["S1"]},"eyebrow":"Historia · 4. luokka · Lähteiden käyttö","ikoni":"tutkimus","teksti":[{"tyyppi":"johdanto","sisalto":"Kaivat kesällä pihalle kuoppaa, ja lapio kolahtaa kiveen, joka on liian sileä ollakseen tavallinen kivi. Se on hiottu kirves. Kukaan ei ole kirjoittanut muistiin, kuka kirveen teki, milloin tai mihin sitä käytettiin. Silti kirves kertoo jotain: joku on joskus hionut sen, käyttänyt sitä ja jättänyt sen tähän. Tällaista maasta tulevaa esinettä tai muuta jälkeä sanotaan löydöksi, ja löytöjä tutkivaa tutkijaa arkeologiksi. Esihistoria on aikaa, jolta ei ole kirjoitettuja lähteitä. Suurin osa siitä, mitä esihistoriasta tiedetään, on saatu selville löydöistä."},{"tyyppi":"kappale","otsikko":"Miksi esihistoriasta tiedetään vähemmän","sisalto":"Kun menneeltä ajalta on kirjeitä, kirjoja tai asiakirjoja, niistä voi lukea ihmisten nimiä, sopimuksia, lakeja ja ajatuksia. Esineestä niitä ei voi lukea: kirves ei kerro omistajansa nimeä eikä sitä, mitä hän ajatteli. Lisäksi maahan säilyy vain osa esineistä, ja vain osa säilyneistä on löydetty. Siksi esihistoriasta tiedetään vähemmän kuin ajoista, joilta on kirjoituksia. Esihistoria ei päättynyt kaikkialla samaan aikaan. Mesopotamiassa kirjoitus keksittiin noin 3200 eaa., mutta Suomesta kirjoitettuja lähteitä alkaa olla vasta keskiajalla, tuhansia vuosia myöhemmin. Suomen esihistoria jaetaan kivikauteen (noin 9000–1500 eaa.), pronssikauteen (noin 1500–500 eaa.) ja rautakauteen (noin 500 eaa.–1150 jaa.). Vuosiluvut ovat likimääräisiä, ja muualla maailmassa kaudet alkoivat eri aikaan."},{"tyyppi":"kappale","otsikko":"Kaivaus etenee kerros kerrallaan","sisalto":"Kaivaus on tutkimus, jossa maata poistetaan hitaasti ja huolellisesti. Maa on kerrostunut vähitellen: lehdet maatuvat, tuuli ja vesi tuovat hiekkaa, ja asuinpaikoille kertyy likamaata, hiiltä ja rikkoutuneita esineitä. Uusi kerros syntyy vanhan päälle, joten syvemmällä oleva kerros on yleensä vanhempi kuin sen päällä oleva. Kerrosta, josta löytyy jotakin, sanotaan löytökerrokseksi. Sana yleensä on tärkeä. Jos joku on myöhemmin kaivanut kuopan, esimerkiksi haudan tai kaivon, sen pohjalle on voinut joutua uutta tavaraa vanhojen kerrosten tasolle. Myös eläinten kolot sekoittavat kerroksia. Kaivaus tuhoaa sen, mitä se tutkii: kaivettua kerrosta ei saa takaisin. Siksi jokaisen löydön paikka ja syvyys mitataan ennen kuin löytö nostetaan. Paikka kertoo usein yhtä paljon kuin itse esine."},{"tyyppi":"taulukko","otsikko":"Kaivauksen vaiheet","otsikkorivi":["Vaihe","Mitä tehdään","Miksi juuri tässä kohdassa"],"rivit":[["1","Maastosta etsitään merkkejä vanhasta asuinpaikasta.","Ensin pitää tietää, mistä kannattaa kaivaa."],["2","Alue jaetaan mitattuihin ruutuihin.","Ruutujen avulla jokaisen löydön paikka voidaan myöhemmin kirjata tarkasti."],["3","Maata poistetaan ohut kerros kerrallaan, ja maa seulotaan.","Ylempi kerros on poistettava ennen alempaa. Seulasta löytyvät pienetkin palat."],["4","Löydön paikka ja syvyys mitataan ja kirjataan.","Kun löytö on nostettu, sen paikkaa ei voi enää mitata."],["5","Löytö nostetaan pussiin, ja pussiin kirjoitetaan numero.","Numero yhdistää esineen muistiinpanoihin, joihin sen paikka on kirjattu."],["6","Löydöt puhdistetaan ja luetteloidaan museossa, ja kaivauksesta kirjoitetaan raportti.","Tutkimus jatkuu vielä kauan kaivauksen jälkeen."]]},{"tyyppi":"taulukko","otsikko":"Mitä tavallinen maa säilyttää","otsikkorivi":["Aine","Säilyykö tavallisessa maassa","Miksi"],"rivit":[["Kivi: kirveet, nuolenkärjet, kvartsi-iskokset","Säilyy","Kivi ei maadu."],["Poltettu savi: saviastian palat","Säilyy","Poltettu savi on kovaa eikä maadu."],["Palanut luu","Säilyy usein","Tulessa luun aines muuttuu niin, että hapan maavesi liuottaa sitä paljon huonommin kuin palamatonta luuta."],["Palamaton luu","Katoaa yleensä","Suomen maa on hapanta, ja happamassa maassa luu hajoaa."],["Puu, nahka, niini, turkis, villa ja kangas","Maatuvat","Pieneliöt ja sienet hajottavat ne, kun maassa on happea."]]},{"tyyppi":"kappale","otsikko":"Suo ja vesi säilyttävät puuta ja nahkaa","sisalto":"Tavallinen maa tarkoittaa tässä kuivaa maata, kuten hiekkakangasta, peltoa tai mäenrinnettä. Märässä suossa ja järven pohjamudassa on hyvin vähän happea. Ilman happea puuta ja nahkaa hajottavat pieneliöt toimivat hyvin hitaasti, ja siksi suosta ja vedestä voi löytyä puisia suksia, veneitä, nahkakenkiä ja punottuja verkkoja. Tunnettu esimerkki on Antrean verkko. Se löytyi vuonna 1913, kun Antrean pitäjässä Karjalankannaksella, nykyisen Venäjän puolella, syvennettiin ojaa. Verkko oli punottu pajun niinestä, sen kohot oli tehty männyn kaarnasta, ja painoina oli kiviä. Verkko on noin 10 000 vuotta vanha. Se säilyi, koska se oli hautautunut märkään saveen ja suomutaan. Kuivassa maassa painokivet olisivat säilyneet, mutta verkosta ja kohoista ei olisi jäänyt mitään."},{"tyyppi":"saanto","otsikko":"Näin päättelet löydöstä","askeleet":["Katso, mitä löydössä näkyy: aine, muoto, kuluminen, koristeet, reiät ja paikka, josta se löytyi.","Päättele vain siitä, minkä voit osoittaa. Muoto ja kuluminen kertovat käytöstä: terävästä kärjestä voi päätellä, että sillä on voinut pistää, ja kuluneesta terästä, että kirvestä on käytetty. Hionta, koristeet ja porattu reikä kertovat tekijän taidosta. Kvartsi-iskokset eli kiven sirut, joita syntyy, kun kivestä isketään työkalu, kertovat, että paikalla on tehty kivityökaluja. Aine, jota ei ole löytöpaikan lähellä, kertoo, että se on tuotu tai haettu muualta, eli vaihdosta, kaupasta tai matkoista.","Tarkista lopuksi, ettei päätelmä mene pidemmälle kuin löytö. Päätelmää ei voi tehdä, jos löydöstä ei voi osoittaa mitään, mihin se nojaa. Tavallisimmat tapaukset ovat nämä: päätelmä puhuu kaikista ihmisistä tai koko ajasta; päätelmä kertoo jotakin, mikä ei jätä jälkeä esineeseen, kuten nimen, kielen, ajatukset tai tunteet; päätelmä kertoo osasta, jota ei löytynyt, kuten puuttuvan varren puulajista."]},{"tyyppi":"ansa","otsikko":"Ansa 1: arkeologi löytää kaiken","sisalto":"Jos kuivalta kankaalta kaivetulta kivikauden asuinpaikalta löytyy vain kiviesineitä ja saviastian paloja, on helppo ajatella, että ihmisillä oli vain kiviä ja saviastioita. Heillä oli lähes varmasti myös puisia esineitä, nahkavaatteita, turkiksia ja punottuja koreja, mutta ne ovat maatuneet. Löydöt ovat se osa, joka sattui säilymään ja joka sattui löytymään. Se, ettei jotakin löytynyt, ei todista, ettei sitä ollut."},{"tyyppi":"ansa","otsikko":"Ansa 2: päätelmä menee pidemmälle kuin löytö","sisalto":"Suolta löytyi kivinen keihäänkärki. Siitä voi päätellä, että joku osasi tehdä kivestä terävän kärjen ja että keihäällä on voinut metsästää. Siitä ei voi päätellä, että kaikki kylän ihmiset olivat metsästäjiä. Yksi keihäänkärki kertoo yhdestä keihäästä, ei kaikista ihmisistä: samassa kylässä on voinut asua kalastajia, saviastioiden tekijöitä ja lapsia, jotka eivät metsästäneet lainkaan. Varovainen sana ei pelasta liian isoa päätelmää. \"Luultavasti kaikki olivat metsästäjiä\" puhuu yhä kaikista."},{"tyyppi":"muistilappu","otsikko":"Muista nämä","kohdat":["Esihistoria on aikaa ennen kirjoitettuja lähteitä. Siitä tiedetään pääasiassa löytöjen avulla.","Esineet eivät kerro nimiä, sopimuksia eivätkä ajatuksia, ja maahan säilyy vain osa esineistä.","Löydön paikka mitataan ja kirjataan ennen kuin löytö nostetaan.","Syvemmällä oleva kerros on yleensä vanhempi, ellei maata ole kaivettu tai sekoitettu.","Kivi ja saviastian palat säilyvät. Puu, nahka ja niini säilyvät yleensä vain suossa tai vedessä.","Päättele vain siitä, minkä voit osoittaa löydöstä. Se, ettei jotakin löytynyt, ei todista, ettei sitä ollut.","Suomessa muinaisjäännöstä saa kaivaa vain luvan kanssa. Jos löydät vanhan esineen, älä kaiva lisää, vaan kerro löydöstä ja sen paikasta Museovirastolle."]}],"harjoitusryhmat":[{"id":"kaivaus","nimi":"Kaivaus ja löytökerros","info":"Kaivauksen vaiheilla on järjestys, jota ei voi perua. Syvemmällä oleva kerros on yleensä vanhempi."},{"id":"sailyminen","nimi":"Mitä maa säilyttää","info":"Kivi ja poltettu savi säilyvät. Puu, nahka, niini ja kangas maatuvat kuivassa maassa, mutta voivat säilyä suossa tai vedessä."},{"id":"paattely","nimi":"Mitä löydöstä voi päätellä","info":"Osoita löydöstä se kohta, johon päätelmä nojaa. Jos sellaista ei ole, päätelmä menee liian pitkälle."}],"harjoitukset":[{"id":"H01","ryhma":"kaivaus","kysymys":"Nämä kaivauksen vaiheet ovat sekaisin. Ajattele yhtä löytöä alusta loppuun.\nA. Löytö nostetaan pussiin, ja pussiin kirjoitetaan numero.\nB. Alue jaetaan mitattuihin ruutuihin.\nC. Löydön paikka ja syvyys mitataan ja kirjataan.\nD. Maata poistetaan ohut kerros kerrallaan, ja maa seulotaan.\n\nMonesko vaihe C on oikeassa järjestyksessä?","vastaus":3,"vinkki":"Mitä pitää tehdä ennen kuin löydön paikan voi mitata? Entä mitä ei voi enää tehdä, kun löytö on nostettu?","selitys":"Oikea järjestys on B, D, C, A: ruudut, kaivaminen, löydön paikan mittaaminen, nostaminen. C on kolmas. Paikka mitataan ennen nostamista, koska nostetun löydön paikkaa ei voi enää mitata."},{"id":"H02","ryhma":"kaivaus","kysymys":"Nämä kaivauksen vaiheet ovat sekaisin. Ajattele yhtä löytöä alusta loppuun.\nA. Löydöt puhdistetaan ja luetteloidaan museossa.\nB. Maastosta etsitään merkkejä vanhasta asuinpaikasta.\nC. Löytö nostetaan pussiin, ja pussiin kirjoitetaan numero.\nD. Löydön paikka ja syvyys mitataan ja kirjataan.\nE. Maata poistetaan ohut kerros kerrallaan, ja maa seulotaan.\n\nMonesko vaihe C on oikeassa järjestyksessä?","vastaus":4,"vinkki":"Kaivaus alkaa maastosta ja päättyy museoon. Etsi ensin ensimmäinen ja viimeinen vaihe.","selitys":"Oikea järjestys on B, E, D, C, A: paikka etsitään, maata kaivetaan, löydön paikka kirjataan, löytö nostetaan ja lopuksi löydöt luetteloidaan museossa. C eli nostaminen on neljäs."},{"id":"H03","ryhma":"kaivaus","kysymys":"Järven rannalle kaivettiin koekuoppa, jonka seinässä näkyi neljä maakerrosta päällekkäin. Maata ei ole myöhemmin kaivettu eikä sekoitettu.\nKerros 1 (ylin): turvetta, ei löytöjä\nKerros 2: ruskeaa hiekkaa, rautaisen veitsen terä\nKerros 3: tummaa likamaata, saviastian paloja\nKerros 4 (alin): vaaleaa hiekkaa, kvartsi-iskoksia\n\nMonesko kerros ylhäältä lukien sisältää vanhimmat löydöt?","vastaus":4,"vinkki":"Uusi kerros syntyy vanhan päälle. Missä kerroksessa on vanhinta maata, josta löytyi jotain?","selitys":"Kerrokset ovat syntyneet alhaalta ylöspäin, joten alin kerros on vanhin. Kerroksesta 4 löytyi kvartsi-iskoksia, joten ne ovat vanhimmat löydöt. Järjestys sopii myös kausiin: kivi alimpana, rauta ylimpänä."},{"id":"H04","ryhma":"kaivaus","kysymys":"Kaivauksella löytyi viisi maakerrosta päällekkäin. Maata ei ole myöhemmin kaivettu eikä sekoitettu.\nKerros 1 (ylin): turvetta, ei löytöjä\nKerros 2: hiekkaa, rautainen kirves\nKerros 3: likamaata, pronssinen neula\nKerros 4: hiekkaa, saviastian paloja\nKerros 5 (alin): savea, kvartsi-iskoksia\n\nMontako löytökerrosta on vanhempia kuin se kerros, josta löytyi pronssinen neula?","vastaus":2,"vinkki":"Etsi neulan kerros. Laske sen alapuolelta ne kerrokset, joista löytyi jotain.","selitys":"Neula on kerroksessa 3. Sen alapuolella ovat kerrokset 4 ja 5, ja kummastakin löytyi jotain. Vanhempia löytökerroksia on siis 2."},{"id":"H05","ryhma":"kaivaus","kysymys":"Suon reunalla kaivettiin neljä kerrosta. Maata ei ole myöhemmin kaivettu eikä sekoitettu.\nKerros 1 (ylin): nurmea ja multaa, ei löytöjä\nKerros 2: turvetta, ei löytöjä\nKerros 3: hiekkaa, palaneen luun siruja\nKerros 4 (alin): likamaata, saviastian paloja ja kivikirves\n\nMonennestako kerroksesta ylhäältä lukien löytyivät nuorimmat löydöt?","vastaus":3,"vinkki":"Nuorin löytö on ylimmässä kerroksessa, josta löytyi jotain. Tarkista, onko ylimmissä kerroksissa löytöjä.","selitys":"Kerroksista 1 ja 2 ei löytynyt mitään. Ylin löytökerros on kerros 3, joten palaneen luun sirut ovat nuorimmat löydöt."},{"id":"H06","ryhma":"kaivaus","tyyppi":"monivalinta","vaihtoehdot":["Rauta painuu maassa vuosien mittaan alaspäin.","Kuoppa on kaivettu myöhemmin ylhäältä käsin, joten sen pohjalle päätyi nuorempaa tavaraa.","Syvimmällä oleva löytö on aina nuorin."],"kysymys":"Kaivauksella on kolme kerrosta päällekkäin. Keskimmäisestä kerroksesta löytyi kivikirves. Ylimmästä kerroksesta on myöhemmin kaivettu kuoppa, joka ulottuu alimpaan kerrokseen asti, ja kuopan pohjalta löytyi rautanaula.\n\nMiksi rautanaula ei ole vanhin löytö, vaikka se on syvimmällä?","vastaus":1,"vinkki":"Kuka kaivoi kuopan, ja milloin? Mistä kerroksesta käsin?","selitys":"Kuoppa on kaivettu ylhäältä käsin paljon myöhemmin kuin alemmat kerrokset syntyivät. Naula putosi tai haudattiin kuopan pohjalle, vaikka se on nuorempi kuin kerrosten löydöt. Siksi sääntö on: syvemmällä on yleensä vanhempaa, ellei maata ole kaivettu tai sekoitettu."},{"id":"H07","ryhma":"kaivaus","kysymys":"Kaivauksen vaiheita:\n1. Maastosta etsitään merkkejä vanhasta asuinpaikasta.\n2. Alue jaetaan mitattuihin ruutuihin.\n3. Maata poistetaan ohut kerros kerrallaan, ja maa seulotaan.\n4. Löydön paikka ja syvyys mitataan ja kirjataan.\n5. Löydöt puhdistetaan ja luetteloidaan museossa.\n\nMontako näistä vaiheista tehdään ennen kuin löytö nostetaan maasta?","vastaus":4,"vinkki":"Löytö nostetaan vasta, kun sen paikka on kirjattu. Mitkä vaiheet tulevat vasta nostamisen jälkeen?","selitys":"Paikan etsiminen, ruudut, kaivaminen ja löydön paikan kirjaaminen tehdään ennen nostamista. Museotyö tehdään vasta, kun löytö on nostettu. Vastaus on 4."},{"id":"H08","ryhma":"sailyminen","kysymys":"Asuinpaikka on kuivalla hiekkakankaalla, ja siellä asuttiin tuhansia vuosia sitten. Asukkailla oli ainakin nämä esineet:\nkivikirves\npuinen lusikka\nsaviastia\nnahkainen laukku\nkvartsista tehty kaavin\nniinestä punottu kori\n\nMontako näistä esineistä arkeologi voi vielä löytää?","vastaus":3,"vinkki":"Kivi ja poltettu savi säilyvät. Puu, nahka ja niini maatuvat kuivassa maassa.","selitys":"Kivikirves, saviastia ja kvartsikaavin säilyvät kuivassa maassa. Lusikka, laukku ja kori maatuvat, koska ne ovat puuta, nahkaa ja niintä. Saviastiasta löytyvät yleensä palat, mutta ne löytyvät."},{"id":"H09","ryhma":"sailyminen","kysymys":"Suolta löytyi nämä esineet:\npuinen suksi\nnahkakengän pohja\nkivinen verkonpaino\nniinestä punotun köyden pätkä\nsaviastian pala\n\nMontako näistä olisi maatunut, jos ne olisivat olleet tavallisessa kuivassa maassa?","vastaus":3,"vinkki":"Suossa säilyy myös sellaista, mikä kuivassa maassa maatuu. Mitkä esineet ovat puuta, nahkaa tai niintä?","selitys":"Suksi, kengän pohja ja köysi ovat puuta, nahkaa ja niintä. Ne säilyivät vain siksi, että suossa on hyvin vähän happea. Kivi ja saviastian pala olisivat säilyneet kuivassakin maassa."},{"id":"H10","ryhma":"sailyminen","kysymys":"Asuinpaikka on kuivalla hiekkakankaalla. Siellä asui perhe, jolla oli puinen vene, nahkaiset vaatteet, kivikirves, saviastioita ja villainen peite. Kaivauksella löytyi vain kivikirves ja saviastian paloja.\n\nMontako perheen esineistä oli olemassa, vaikka niitä ei löytynyt?","vastaus":3,"vinkki":"Laske perheen esineet, joita ei löytynyt. Ne olivat olemassa, vaikka maa ei säilyttänyt niitä.","selitys":"Vene, vaatteet ja peite puuttuvat löydöistä, koska ne maatuivat. Perheellä oli ne silti. Se, ettei jotakin löytynyt, ei todista, ettei sitä ollut."},{"id":"H11","ryhma":"sailyminen","tyyppi":"monivalinta","vaihtoehdot":["Märässä turpeessa on hyvin vähän happea, ja ilman happea puuta hajottavat pieneliöt toimivat hyvin hitaasti.","Suon vesi muuttaa puun vähitellen kiveksi.","Suo on jäässä ympäri vuoden, joten puu pysyy pakastettuna."],"kysymys":"Miksi puinen suksi voi säilyä suossa tuhansia vuosia, vaikka kuivassa maassa puu maatuu?","vastaus":0,"vinkki":"Mitä puuta hajottavat pieneliöt tarvitsevat?","selitys":"Märässä turpeessa on hyvin vähän happea. Ilman happea puuta hajottavat pieneliöt toimivat hyvin hitaasti, ja puu säilyy. Suon vesi ei muuta puuta kiveksi, eikä suo ole jäässä ympäri vuoden."},{"id":"H12","ryhma":"sailyminen","kysymys":"Asuinpaikka on kuivalla hiekkakankaalla, ja siellä asuttiin tuhansia vuosia sitten. Asukkailla oli ainakin nämä esineet:\npiikivinen nuolenkärki\nturkisviitta\nsaviastian pala\npuinen jousi\nkivikirves\nvillainen lapanen\n\nMontako näistä esineistä arkeologi voi vielä löytää?","vastaus":3,"vinkki":"Käy esineet läpi yksi kerrallaan: mistä aineesta se on tehty?","selitys":"Nuolenkärki, saviastian pala ja kivikirves ovat kiveä tai poltettua savea, ja ne säilyvät. Viitta, jousi ja lapanen ovat turkista, puuta ja villaa, ja ne maatuvat kuivassa maassa."},{"id":"H13","ryhma":"sailyminen","kysymys":"Kaksi samanlaista puista kulhoa hautautui 5000 vuotta sitten. Toinen joutui kuivaan hiekkaan, toinen järven pohjamutaan.\n\nMontako kulhoa arkeologi voi vielä löytää?","vastaus":1,"vinkki":"Kummassa paikassa on vähän happea?","selitys":"Järven pohjamudassa on hyvin vähän happea, ja siellä puu voi säilyä. Kuivassa hiekassa kulho on maatunut. Vain yksi kulho voi löytyä."},{"id":"H14","ryhma":"paattely","kysymys":"Suolta löytyi keihäänkärki. Se on hiottu kivestä, jota ei ole löytöpaikan lähistöllä. Reunat ovat terävät ja kärki on suippo. Tyvessä on lovi, johon on voinut sitoa varren. Vartta ei löytynyt.\n\nPäätelmät:\n1. Joku osasi hioa kivestä terävän kärjen.\n2. Kivi on tuotu tai haettu muualta.\n3. Kaikki kylän ihmiset olivat metsästäjiä.\n4. Keihään varsi oli tehty koivusta.\n5. Kärjen tekijä piti metsästyksestä.\n\nMontako päätelmistä voi tehdä pelkästä keihäänkärjestä?","vastaus":2,"vinkki":"Osoita jokaisesta päätelmästä se kohta kuvauksessa, johon päätelmä nojaa. Jos sellaista ei ole, päätelmää ei voi tehdä.","selitys":"Päätelmä 1 nojaa hiontaan ja 2 siihen, ettei kiveä ole lähistöllä. Päätelmä 3 puhuu kaikista ihmisistä, 4 puhuu varresta, jota ei löytynyt, ja 5 tekijän ajatuksista, jotka eivät jätä jälkeä kiveen. Vastaus on 2."},{"id":"H15","ryhma":"paattely","kysymys":"Pellolta löytyi saviastian pala. Sen pinnassa on painettuja kuoppia riveissä. Palan sisäpinnalla on mustunutta, palaneen ruoan jäämää.\n\nPäätelmät:\n1. Astiassa on kuumennettu ruokaa.\n2. Astian tekijä osasi koristella savea.\n3. Kaikki kivikauden ihmiset keittivät ruokansa saviastioissa.\n4. Astiassa keitettiin juhlaruokaa häihin.\n\nMontako päätelmistä voi tehdä pelkästä palasta?","vastaus":2,"vinkki":"Mustunut jäämä ja kuopparivit ovat ne kaksi asiaa, jotka palassa näkyvät. Mitä niistä voi päätellä?","selitys":"Ruoan jäämä kertoo kuumentamisesta ja kuopparivit koristelutaidosta. Päätelmä 3 puhuu kaikista kivikauden ihmisistä, ja päätelmä 4 kertoo juhlasta, josta palassa ei ole mitään jälkeä. Vastaus on 2."},{"id":"H16","ryhma":"paattely","kysymys":"Järven rannalta löytyi kivinen verkonpaino: litteä kivi, jonka ympäri on hiottu ura narua varten.\n\nPäätelmät:\n1. Joku on hionut kiveen uran tarkoituksella.\n2. Uraan on voinut sitoa narun.\n3. Rannalla asuneet ihmiset söivät pelkkää kalaa.\n4. Painoa on luultavasti käytetty kalastuksessa.\n\nMonesko päätelmä menee pidemmälle kuin löytö?","vastaus":3,"vinkki":"Etsi päätelmä, jolle ei löydy perustetta kivestä. Puhuuko se yhdestä kivestä vai kaikesta, mitä ihmiset söivät?","selitys":"Päätelmä 3 väittää, että ihmiset söivät pelkkää kalaa. Verkonpaino kertoo, että kalaa on voitu pyytää, mutta ei sitä, mitä muuta syötiin. Marjoja, lihaa ja kasveja ei näy verkonpainossa."},{"id":"H17","ryhma":"paattely","kysymys":"Asuinpaikalta löytyi tulisijan kiviä, palaneita hylkeen luita, kvartsi-iskoksia ja saviastian paloja.\n\nKysymyksiä:\n1. Missä kohdassa asuinpaikkaa tuli paloi?\n2. Mitä eläintä asukkaat söivät?\n3. Mitä kieltä asukkaat puhuivat?\n4. Mistä kivestä työkaluja tehtiin?\n5. Mitkä olivat asukkaiden lasten nimet?\n\nMontako näistä kysymyksistä löydöt auttavat ratkaisemaan?","vastaus":3,"vinkki":"Kielestä ja nimistä ei jää jälkeä esineisiin. Mihin kysymyksiin jokin löydöistä antaa vihjeen?","selitys":"Tulisijan kivet näyttävät tulen paikan, hylkeen luut ruoan ja kvartsi-iskokset työkalujen kiven. Kieli ja nimet eivät näy esineissä, ja niistä tiedettäisiin vain kirjoitetusta lähteestä. Vastaus on 3."},{"id":"H18","ryhma":"paattely","kysymys":"Kankaalta löytyi kivinen keihäänkärki ja kivikirves. Kirveen terä on kulunut ja lohkeillut.\n\nPäätelmät:\n1. Kaikki sen ajan ihmiset elivät metsästämällä.\n2. Joku osasi valmistaa kivestä teräviä työkaluja.\n3. Keihäänkärjellä on voinut pistää tai heittää.\n4. Kirvestä on käytetty, koska sen terä on kulunut.\n\nMonesko päätelmä menee pidemmälle kuin löytö?","vastaus":1,"vinkki":"Yksi päätelmä puhuu paljon suuremmasta joukosta kuin kahdesta esineestä.","selitys":"Päätelmä 1 puhuu kaikista sen ajan ihmisistä, vaikka löytöjä on kaksi. Muut päätelmät nojaavat esineisiin: taitoon, muotoon ja kulumiseen."},{"id":"H19","ryhma":"paattely","tyyppi":"monivalinta","vaihtoehdot":["Esihistorian ihmiset eivät tehneet mitään tärkeää.","Esihistorialta ei ole kirjoitettuja lähteitä, ja maahan säilyy vain osa esineistä.","Esihistoriallisia löytöjä ei saa tutkia."],"kysymys":"Miksi Suomen esihistoriasta tiedetään vähemmän kuin Suomen keskiajasta?","vastaus":1,"vinkki":"Mitä keskiajalta on säilynyt, mitä kivikaudelta ei?","selitys":"Keskiajalta on säilynyt kirjoitettuja lähteitä, kuten kirjeitä ja asiakirjoja. Esihistoriasta tiedetään vain se, mitä maasta löytyy, ja maahan säilyy vain osa esineistä. Esihistorian ihmiset tekivät paljon, ja löytöjä saa tutkia."},{"id":"H20","ryhma":"paattely","kysymys":"Kuvittele kylä, jonka asuinpaikka on kaivettu. Tässä on asioita, joita kylästä voisi kysyä:\n1. Mitä kauppias lupasi sopimuksessa?\n2. Mistä kivestä kylän kirveet on tehty?\n3. Mikä oli kylän päällikön nimi?\n4. Mitä eläimiä tulisijalla paistettiin?\n5. Mitä kuningas määräsi veroista?\n\nMontako näistä asioista esineet eivät voi kertoa, mutta kirjoitettu lähde voisi?","vastaus":3,"vinkki":"Esineistä voi tutkia ainetta, muotoa ja jäämiä. Mitkä asiat ovat sanoja, joista ei jää jälkeä esineeseen?","selitys":"Lupaus, nimi ja kuninkaan määräys ovat sanoja. Ne tiedettäisiin vain, jos joku olisi kirjoittanut ne muistiin. Kirveen kivi ja palaneet luut kertovat itse, mistä ne on tehty ja mitä syötiin. Vastaus on 3."}],"valmis_teksti":"Osaat selittää, mitä arkeologi voi päätellä esineestä ja mitä ei, ja perustella, miksi esihistoriasta tiedetään vähemmän kuin ajoista, joilta on kirjoituksia. Tämä taito on nyt näytetty."};

        o.kohdat.map(k=>`<li>${esc(k)}</li>`).join("")}</ul></div>`;
    case "numerotaulu":
      return `<div class="box nt"><h3>${esc(o.otsikko)}</h3><p class="ohje">${esc(o.sisalto)}</p>

        <div class="nt-taulu" id="ntTaulu"></div>
        <p class="nt-selite" id="ntSelite"></p></div>`;

const svg=document.getElementById("nlsvg"), rng=document.getElementById("nlrange"), out=document.getElementById("nlout");
const X0=34, X1=606, Y=62;
function piirraNL(v){
  const ala=Math.floor(v/10)*10, yla=ala+10, puoli=ala+5;
  const pyor = (v%10)>=5 ? yla : ala;
  const x = n => X0 + (n/100)*(X1-X0);
  let s=`<line class="rail" x1="${X0}" y1="${Y}" x2="${X1}" y2="${Y}"/>`;
  for(let n=0;n<=100;n+=10){
    const near = (n===ala||n===yla);
    s+=`<line class="tick" x1="${x(n)}" y1="${Y-7}" x2="${x(n)}" y2="${Y+7}"/>`;
    s+=`<text class="stop${near?" near":""}" x="${x(n)}" y="${Y+24}" text-anchor="middle">${n}</text>`;
  }
  s+=`<line class="halfway" x1="${x(puoli)}" y1="${Y-16}" x2="${x(puoli)}" y2="${Y+12}"/>`;
  s+=`<text class="stop" x="${x(puoli)}" y="${Y-22}" text-anchor="middle">puoliväli ${puoli}</text>`;
  s+=`<circle class="dot" cx="${x(v)}" cy="${Y}" r="6"/>`;
  s+=`<text class="val" x="${x(v)}" y="${Y-32}" text-anchor="middle">${v}</text>`;
  s+=`<path d="M ${x(v)} ${Y+38} L ${x(pyor)} ${Y+38}" stroke="var(--core)" stroke-width="2" fill="none"/>`;
  s+=`<path d="M ${x(pyor)} ${Y+38} l ${x(pyor)>x(v)?-7:7} -4 l 0 8 z" fill="var(--core)"/>`;
  svg.innerHTML=s;
  out.textContent = `${v} pyöristyy → ${pyor}`;
}

/* ---------- laskujärjestys-widget ---------- */
const ljExp=document.getElementById("ljExp");
if(ljExp && D.kokeilu){
  let ljI=0, ljTokens=[], ljStep=0;
  const laske=(a,op,b)=>{a=+a;b=+b;return op==="×"?a*b:op==="÷"?a/b:op==="+"?a+b:a-b;};
  function ljAlku(){
    const l=D.kokeilu[ljI];
    ljTokens=l.lauseke.replace(/\(/g,"( ").replace(/\)/g," )").split(/\s+/).filter(Boolean);
    ljStep=0; ljPiirra(); ljViesti("","");
  }
  function ljViesti(t,lk){const f=document.getElementById("ljFb"); f.textContent=t; f.className="lj-fb "+(lk||"");}
  function ljPiirra(){
    const l=D.kokeilu[ljI];
    document.getElementById("ljStep").textContent =
      ljStep>=l.askeleet.length ? "valmis" : `askel ${ljStep+1} / ${l.askeleet.length}`;
    if(ljStep>=l.askeleet.length){
      ljExp.innerHTML=`<span class="valmis">${l.lauseke} = ${l.vastaus}</span>`;
      return;
    }
    ljExp.innerHTML=ljTokens.map((t,i)=>
      "×÷+−".includes(t) ? `<button type="button" class="op" data-i="${i}">${t}</button>`
                         : `<span class="tok">${t}</span>`).join("");
    ljExp.querySelectorAll("button.op").forEach(b=>b.addEventListener("click",()=>ljKlikkaa(+b.dataset.i)));
  }
  function ljKlikkaa(i){
    const l=D.kokeilu[ljI], odotettu=l.askeleet[ljStep];
    const ehdotus=[ljTokens[i-1],ljTokens[i],ljTokens[i+1]].join(" ");
    if(ehdotus!==odotettu){
      ljViesti(ljStep===0
        ? "Ei vielä. Sulkeet ovat vahvimmat, sitten kerto ja jako. Yhtä vahvat vasemmalta oikealle."
        : "Ei vielä. Kumpi jäljellä olevista on vahvempi?", "no");
      return;
    }
    const arvo=laske(ljTokens[i-1],ljTokens[i],ljTokens[i+1]);
    let alku=i-1, loppu=i+1;
    if(ljTokens[i-2]==="(" && ljTokens[i+2]===")"){ alku=i-2; loppu=i+2; }
    ljTokens.splice(alku, loppu-alku+1, String(arvo));
    ljStep++;
    ljViesti(ljStep>=l.askeleet.length ? "Valmis. Vastaus on "+l.vastaus+"." : "Oikein. Jatka seuraavaan.", "ok");
    ljPiirra();
  }
  document.getElementById("ljSeuraava").addEventListener("click",()=>{
    ljI=(ljI+1)%D.kokeilu.length; ljAlku();
  });
  ljAlku();
}

/* Suomalainen lukumuoto: välilyönti on tuhaterotin, pilkku desimaalierotin.
   Piste voi olla kumpi tahansa. Se tulkitaan tuhaterottimeksi VAIN silloin, kun
   koko luku on aitoa tuhaterotinmuotoa: alkuosa 1–3 numeroa ilman etunollaa ja
   jokainen jatko-osa täsmälleen 3 numeroa (1.500, 12.345.678). Kaikissa muissa
   tapauksissa piste on desimaalipiste — myös 0.125, joka vanhalla säännöllä
   ("3 numeroa pisteen jäljessä = tuhaterotin") luettiin virheellisesti luvuksi 125. */
const TUHATEROTIN = /^[1-9]\d{0,2}(\.\d{3})+$/;
function lueLuku(teksti){
  // Murtoluku (3/4, -3/4) ja sekaluku (1 2/3, -1 2/3) hyväksytään sellaisinaan.
  const raaka = String(teksti).replace(/\u00a0/g, " ").trim();
  let m = raaka.match(/^(-?)(\d+)\s+(\d+)\s*\/\s*(\d+)$/);
  if(m){ const nim = Number(m[4]); if(nim === 0) return null;
    const v = Number(m[2]) + Number(m[3]) / nim; return m[1] ? -v : v; }
  m = raaka.match(/^(-?)\s*(\d+)\s*\/\s*(\d+)$/);
  if(m){ const nim = Number(m[3]); if(nim === 0) return null;
    const v = Number(m[2]) / nim; return m[1] ? -v : v; }
  let s = String(teksti).replace(/[\s\u00a0]/g, "");
  if(s === "") return null;
  if(s.indexOf(",") >= 0){
    s = s.replace(/\./g, "").replace(",", ".");
  } else if(TUHATEROTIN.test(s)){
    s = s.replace(/\./g, "");
  }
  const n = Number(s);
  return Number.isFinite(n) ? n : null;
}

function tarkista(id){
  const h=D.harjoitukset.find(x=>x.id===id);
  const kentta=document.getElementById("in-"+id);
  const fb=document.getElementById("fb-"+id);
  if(kentta.value.trim()===""){ fb.className="fb hint"; fb.textContent="Kirjoita vastaus ensin."; return; }
  const luku=lueLuku(kentta.value);
  if(luku===null){ fb.className="fb no"; fb.textContent="Vastauksen pitää olla luku tai murtoluku (esimerkiksi 3/4)."; return; }
  const oikein = Math.abs(luku - h.vastaus) < 1e-9;
  merkitseTulos(id, oikein, oikein ? "Oikein. "+h.selitys : `Ei vielä. ${h.vinkki} Kokeile uudelleen.`);
}

function tarkistaMonivalinta(id, valittuIndeksi, painike){
  const h=D.harjoitukset.find(x=>x.id===id);
  const rivi=painike.closest(".row");
  rivi.querySelectorAll(".mv-valinta").forEach(b=>b.disabled=true);
  const oikein = valittuIndeksi===h.vastaus;
  painike.classList.add(oikein?"mv-oikein":"mv-vaarin");
  if(!oikein){
    const oikeaBtn=rivi.querySelector(`[data-i="${h.vastaus}"]`);
    if(oikeaBtn) oikeaBtn.classList.add("mv-oikein");
  }
  merkitseTulos(id, oikein, oikein ? "Oikein. "+h.selitys : `Ei ihan. Oikea vastaus on korostettu. ${h.selitys||""}`);
}

/* Kuuntelu: selain lukee tekstin ääneen omalla puhesynteesillään (englanniksi, jos laitteessa on
   englanninkielinen ääni). Ei äänitiedostoja eikä verkkoyhteyttä. Jos laite ei osaa puhua,
   teksti näytetään luettavaksi — silloin tehtävä muuttuu luetun ymmärtämiseksi, mutta ei katkea. */
function puhu(id, nopeus){
  const h=D.harjoitukset.find(x=>x.id===id); if(!h || !h.kuuntele) return;
  const vara=document.getElementById("vara-"+id);
  const naytaTeksti=syy=>{ vara.hidden=false; vara.textContent=syy+" Teksti: "+h.kuuntele; };
  if(!("speechSynthesis" in window)){ naytaTeksti("Tämä laite ei osaa lukea ääneen."); return; }
  const s=window.speechSynthesis; s.cancel();
  const u=new SpeechSynthesisUtterance(h.kuuntele);
  u.lang=h.kieli||"en-GB"; u.rate=nopeus;
  const aanet=s.getVoices(), kieli=u.lang.slice(0,2);
  const aani=aanet.find(a=>a.lang===u.lang) || aanet.find(a=>a.lang && a.lang.startsWith(kieli));
  if(aani) u.voice=aani;
  else if(aanet.length) { naytaTeksti("Laitteessa ei ole englanninkielistä ääntä."); return; }
  u.onerror=()=>naytaTeksti("Ääneen lukeminen ei onnistunut.");
  s.speak(u);
}
