<title>Ilmaston asialla</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">

<style>
:root{
  --paper:#EFF2F5; --surface:#FFFFFF; --surface-2:#F7F9FB;
  --grid:#DCE3EA; --line:#C9D3DC;
  --ink:#15222C; --ink-2:#4E626F; --ink-3:#7E8F9B;
  --core:#1B5A9E; --core-soft:#E4EDF6;
  --strong:#1F6E5C; --strong-soft:#E1F0EB;
  --chal:#9A6A16; --chal-soft:#F6EDDC;
  --alert:#A33A2B; --alert-soft:#F8E7E3;
  --shadow:0 1px 2px rgba(21,34,44,.06), 0 8px 24px -12px rgba(21,34,44,.18);
  --r:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0F161B; --surface:#18222A; --surface-2:#1D2830;
    --grid:#22303A; --line:#2E3E4A;
    --ink:#E8EFF4; --ink-2:#A3B4C0; --ink-3:#7A8B97;
    --core:#7FB2E4; --core-soft:#16303F;
    --strong:#77CDB4; --strong-soft:#123028;
    --chal:#E0B267; --chal-soft:#33270F;
    --alert:#E8907F; --alert-soft:#3A1E19;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -14px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --paper:#0F161B; --surface:#18222A; --surface-2:#1D2830;
  --grid:#22303A; --line:#2E3E4A;
  --ink:#E8EFF4; --ink-2:#A3B4C0; --ink-3:#7A8B97;
  --core:#7FB2E4; --core-soft:#16303F;
  --strong:#77CDB4; --strong-soft:#123028;
  --chal:#E0B267; --chal-soft:#33270F;
  --alert:#E8907F; --alert-soft:#3A1E19;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -14px rgba(0,0,0,.7);
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:16px; line-height:1.62;
  background-image:
    linear-gradient(to right, var(--grid) 1px, transparent 1px),
    linear-gradient(to bottom, var(--grid) 1px, transparent 1px);
  background-size:26px 26px;
}
.wrap{max-width:760px; margin:0 auto; padding:28px 20px 90px}
h1,h2,h3,h4{font-family:"Familjen Grotesk","IBM Plex Sans",system-ui,sans-serif; text-wrap:balance}

/* header */
header.top{background:var(--surface); border:1px solid var(--line); border-radius:var(--r);
  box-shadow:var(--shadow); padding:22px 24px; display:flex; gap:18px; align-items:flex-start}
.badge{flex:0 0 auto; width:54px; height:54px; border-radius:9px; display:grid; place-items:center;
  background:var(--core-soft); border:1px solid var(--core); color:var(--core)}
.badge svg{width:28px; height:28px; fill:none; stroke:currentColor; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round}
.eyebrow{font-family:"IBM Plex Mono",monospace; font-size:11px; letter-spacing:.14em;
  text-transform:uppercase; color:var(--ink-3); margin:0 0 5px}
header.top h1{margin:0; font-size:30px; font-weight:700; letter-spacing:-.015em}
header.top p{margin:5px 0 0; color:var(--ink-2); font-size:15px}
.tags{display:flex; flex-wrap:wrap; gap:5px; margin-top:11px}
.tag{font-family:"IBM Plex Mono",monospace; font-size:10.5px; letter-spacing:.05em; padding:2px 7px;
  border-radius:4px; background:var(--surface-2); border:1px solid var(--line); color:var(--ink-3)}
.tag.core{background:var(--core-soft); border-color:var(--core); color:var(--core)}

/* teksti */
article{margin-top:26px}
article h2{font-size:21px; font-weight:600; margin:32px 0 10px; letter-spacing:-.01em}
article p{margin:0 0 14px; max-width:64ch}
.lead{font-size:17.5px; color:var(--ink); border-left:3px solid var(--core); padding-left:16px; margin:0 0 8px}

.box{background:var(--surface); border:1px solid var(--line); border-radius:var(--r);
  padding:18px 22px; box-shadow:var(--shadow); margin:22px 0}
.box h3{margin:0 0 12px; font-size:16.5px; font-weight:600}
.box.warn{border-left:3px solid var(--alert)}
.box.note{border-left:3px solid var(--chal)}

ol.steps{margin:0; padding-left:0; list-style:none; counter-reset:s; display:grid; gap:12px}
ol.steps li{counter-increment:s; display:grid; grid-template-columns:auto 1fr; gap:13px; align-items:start}
ol.steps li::before{content:counter(s); font-family:"Familjen Grotesk",sans-serif; font-weight:700; font-size:14px;
  width:26px; height:26px; border-radius:50%; background:var(--core); color:#fff; display:grid; place-items:center; margin-top:2px}

ul.notes{margin:0; padding-left:19px}
ul.notes li{margin-bottom:7px}
ul.notes li:last-child{margin-bottom:0}

.tablewrap{overflow-x:auto}
table{border-collapse:collapse; width:100%; font-size:14.5px; min-width:460px}
th,td{text-align:left; padding:9px 13px; border-bottom:1px solid var(--line)}
th{font-family:"IBM Plex Mono",monospace; font-size:10.5px; letter-spacing:.1em; text-transform:uppercase;
  color:var(--ink-3); font-weight:400; background:var(--surface-2)}
tr:last-child td{border-bottom:0}
td b{color:var(--core); font-weight:600}
td:last-child{font-variant-numeric:tabular-nums; font-weight:600}

/* lukusuora */
.nl svg{width:100%; height:118px; display:block}
.nl .rail{stroke:var(--line); stroke-width:2}
.nl .tick{stroke:var(--line); stroke-width:1.5}
.nl .stop{fill:var(--ink-3); font-family:"IBM Plex Mono",monospace; font-size:11px}
.nl .stop.near{fill:var(--core); font-weight:600}
.nl .dot{fill:var(--chal)}
.nl .val{fill:var(--ink); font-family:"Familjen Grotesk",sans-serif; font-size:15px; font-weight:700}
.nl .halfway{stroke:var(--chal); stroke-dasharray:3 3; stroke-width:1.5}
.nl-controls{display:flex; align-items:center; gap:14px; margin-top:6px}
.nl-controls input{flex:1; accent-color:var(--core)}
.nl-out{font-family:"Familjen Grotesk",sans-serif; font-size:15px; font-weight:600; min-width:12.5em; text-align:right}

/* paikka-arvotaulu */
.box .ohje{margin:0 0 14px; font-size:14.5px; color:var(--ink-2)}
.nt-valinta{display:flex; flex-wrap:wrap; gap:7px; margin-bottom:16px}
.nt-valinta button{font:inherit; font-size:12.5px; font-family:"IBM Plex Mono",monospace; padding:5px 11px;
  border-radius:6px; border:1px solid var(--line); background:var(--surface-2); color:var(--ink-2); cursor:pointer}
.nt-valinta button[aria-pressed="true"]{background:var(--ink); color:var(--paper); border-color:var(--ink)}
.nt-valinta button:focus-visible{outline:2px solid var(--core); outline-offset:2px}
.nt-taulu{display:flex; flex-direction:column; gap:4px; align-items:flex-start; overflow-x:auto; padding-bottom:4px}
.nt-rivi{display:flex; gap:6px; align-items:center}
.nt-rivi .otsa{font-family:"IBM Plex Mono",monospace; font-size:9.5px; letter-spacing:.08em;
  text-transform:uppercase; color:var(--ink-3); width:52px; text-align:center}
.nt-ruutu{width:52px; height:52px; display:grid; place-items:center; border:1.5px solid var(--line);
  border-radius:7px; background:var(--surface-2); font-family:"IBM Plex Mono",monospace; font-size:24px}
.nt-ruutu.kohta{border-color:var(--core); background:var(--core-soft); color:var(--core); font-weight:500}
.nt-ruutu.ratkaiseva{border-color:var(--chal); background:var(--chal-soft); color:var(--chal); font-weight:500}
.nt-ruutu.nolla{color:var(--ink-3)}
.nt-rivi .nimi{font-size:12.5px; color:var(--ink-3); margin-left:12px; white-space:nowrap}
.nt-nuoli{font-size:17px; color:var(--chal); margin-left:6px}
.nt-selite{margin:14px 0 0; font-size:14.5px}
.nt-selite b{color:var(--core)}

/* vahvuusportaat */
.vp-tasot{display:grid; gap:9px; margin-bottom:18px}
.vp-taso{display:flex; gap:11px; align-items:flex-start; font-size:13.5px}
.vp-taso .vp-pallo{width:13px; height:13px; border-radius:4px; margin-top:5px; flex:0 0 auto}
.vp-taso[data-taso="sulkeet"] .vp-pallo{background:var(--core)}
.vp-taso[data-taso="kertojako"] .vp-pallo{background:var(--strong)}
.vp-taso[data-taso="yhteenvahennys"] .vp-pallo{background:var(--chal)}
.vp-taso strong{display:block; font-family:"Familjen Grotesk",sans-serif; font-weight:600; font-size:14.5px}
.vp-taso span{color:var(--ink-2)}
.vp-lauseke{display:flex; flex-wrap:wrap; gap:7px; align-items:flex-end; font-family:"IBM Plex Mono",monospace;
  font-size:25px; padding:10px 2px; min-height:64px}
.vp-lauseke .t{padding:2px 3px}
.vp-lauseke .op{position:relative; padding:2px 9px; border-radius:6px; font-weight:500}
.vp-lauseke .op[data-taso="sulkeet"]{background:var(--core-soft); color:var(--core)}
.vp-lauseke .op[data-taso="kertojako"]{background:var(--strong-soft); color:var(--strong)}
.vp-lauseke .op[data-taso="yhteenvahennys"]{background:var(--chal-soft); color:var(--chal)}
.vp-lauseke .op i{position:absolute; top:-9px; right:-6px; font-style:normal; font-family:"Familjen Grotesk",sans-serif;
  font-size:11px; font-weight:700; width:18px; height:18px; border-radius:50%; display:grid; place-items:center;
  background:currentColor}
.vp-lauseke .op i span{color:var(--surface)}
.vp-rivi{display:flex; align-items:center; gap:16px; margin-top:8px}
.vp-vastaus{font-family:"Familjen Grotesk",sans-serif; font-size:16px; font-weight:600; color:var(--strong)}

/* laskujärjestys-widget */
.lj-exp{display:flex; flex-wrap:wrap; gap:7px; align-items:center; font-family:"IBM Plex Mono",monospace;
  font-size:23px; padding:14px 4px; min-height:62px}
.lj-exp .tok{padding:2px 4px; color:var(--ink)}
.lj-exp button.op{font-family:"IBM Plex Mono",monospace; font-size:23px; padding:3px 12px; border-radius:7px;
  border:1.5px solid var(--line); background:var(--surface-2); color:var(--ink); line-height:1.2}
.lj-exp button.op:hover{border-color:var(--core); color:var(--core)}
.lj-exp button.op:focus-visible{outline:2px solid var(--core); outline-offset:2px}
.lj-exp .valmis{font-family:"Familjen Grotesk",sans-serif; font-size:23px; font-weight:700; color:var(--strong)}
.lj-fb{font-size:14.5px; min-height:1.5em; color:var(--ink-2)}
.lj-fb.no{color:var(--alert)}
.lj-fb.ok{color:var(--strong)}
.lj-row{display:flex; align-items:center; gap:14px; margin-top:10px}
.lj-step{font-family:"IBM Plex Mono",monospace; font-size:11.5px; letter-spacing:.1em;
  text-transform:uppercase; color:var(--ink-3)}

/* harjoitukset */
.progress{position:sticky; top:0; z-index:5; background:var(--surface); border:1px solid var(--line);
  border-radius:var(--r); padding:12px 18px; box-shadow:var(--shadow); display:flex; align-items:center;
  gap:14px; margin:34px 0 18px}
.progress .lbl{font-family:"IBM Plex Mono",monospace; font-size:11px; letter-spacing:.12em;
  text-transform:uppercase; color:var(--ink-3); white-space:nowrap}
.progress .meter{flex:1; height:7px; border-radius:4px; background:var(--surface-2); border:1px solid var(--line); overflow:hidden}
.progress .meter i{display:block; height:100%; background:var(--core); transition:width .25s ease}
.progress .cnt{font-family:"Familjen Grotesk",sans-serif; font-weight:700; font-variant-numeric:tabular-nums; white-space:nowrap}

.grp{margin-top:26px}
.grp-head{display:flex; align-items:baseline; gap:10px; border-bottom:1.5px solid var(--ink); padding-bottom:7px; margin-bottom:14px}
.grp-head h3{margin:0; font-size:17px; font-weight:600}
.grp-head span{font-size:12.5px; color:var(--ink-2)}

.ex{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:14px 16px; margin-bottom:10px}
.ex[data-tila="oikein"]{border-color:var(--strong); box-shadow:inset 3px 0 0 var(--strong)}
.ex[data-tila="vaarin"]{border-color:var(--alert); box-shadow:inset 3px 0 0 var(--alert)}
.ex .q{display:flex; gap:11px; align-items:baseline; flex-wrap:wrap}
.ex .num{font-family:"IBM Plex Mono",monospace; font-size:11.5px; color:var(--ink-3); min-width:2.4em}
.ex .txt{flex:1; min-width:190px; font-size:15.5px}
.ex .txt .aineisto{display:block; margin-bottom:9px; padding-left:12px;
  border-left:2px solid var(--line); color:var(--ink-2); line-height:1.6;
  /* Aineisto voi olla pieni taulukko, jonka rivit on erotettu rivinvaihdoilla.
     Ilman pre-lineä ne valuisivat yhdeksi kappaleeksi ja taulukko katoaisi. */
  white-space:pre-line}
.ex .txt .kysymysrivi{display:block; font-weight:600}
.ex .row{display:flex; gap:8px; align-items:center; margin-top:11px; flex-wrap:wrap}
.ex input[type=text]{font:inherit; font-family:"IBM Plex Mono",monospace; font-size:15px; width:8.5em;
  padding:7px 11px; border:1px solid var(--line); border-radius:7px; background:var(--surface-2);
  color:var(--ink); text-align:right}
.ex input:focus-visible{outline:2px solid var(--core); outline-offset:1px}
button{font:inherit; cursor:pointer}
.btn{font-size:13.5px; padding:7px 15px; border-radius:7px; border:1px solid var(--core);
  background:var(--core); color:#fff}
.btn.ghost{background:transparent; color:var(--ink-2); border-color:var(--line)}
.btn:focus-visible{outline:2px solid var(--core); outline-offset:2px}
.btn.mv-valinta{text-align:left}
/* kuuntelutehtävä: selaimen puhesynteesi lukee englanninkielisen tekstin */
.kuuntele{display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin:2px 0 10px}
.kuuntele .btn{display:inline-flex; gap:7px; align-items:center}
.kuuntele svg{width:16px; height:16px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round}
.kuuntele .varateksti{flex-basis:100%; font-size:14px; color:var(--ink-2); background:var(--surface-2);
  border-radius:7px; padding:8px 12px; margin:0}
.btn.mv-valinta:disabled{cursor:default; opacity:.65}
.btn.mv-oikein{background:var(--strong-soft); border-color:var(--strong); color:var(--strong); opacity:1}
.btn.mv-vaarin{background:var(--alert-soft); border-color:var(--alert); color:var(--alert); opacity:1}
.row.mv{gap:8px 10px}
.fb{margin-top:11px; font-size:14.5px; padding:10px 13px; border-radius:8px; line-height:1.5}
.fb.ok{background:var(--strong-soft); color:var(--strong)}
.fb.no{background:var(--alert-soft); color:var(--alert)}
.fb.hint{background:var(--chal-soft); color:var(--chal)}

.done{background:var(--strong-soft); border:1px solid var(--strong); color:var(--strong);
  border-radius:var(--r); padding:16px 20px; margin-top:20px; font-size:15.5px}
.done h3{margin:0 0 4px; font-size:17px; color:var(--strong)}

details.teacher{margin-top:34px; background:var(--surface); border:1px solid var(--line);
  border-left:3px solid var(--chal); border-radius:var(--r); padding:15px 20px; box-shadow:var(--shadow)}
details.teacher summary{cursor:pointer; font-family:"Familjen Grotesk",sans-serif; font-weight:600; font-size:15px}
details.teacher summary:focus-visible{outline:2px solid var(--core); outline-offset:3px}
details.teacher ul{margin:12px 0 0; padding-left:19px; color:var(--ink-2); font-size:14.5px}
details.teacher li{margin-bottom:8px}
details.teacher p{margin:12px 0 0; color:var(--ink-2); font-size:14.5px}

.back{display:inline-block; margin-top:30px; font-size:13.5px; color:var(--ink-2)}
.back a{color:var(--core)}

@media (prefers-reduced-motion: reduce){*{transition:none !important}}
@media (max-width:560px){
  .wrap{padding:16px 13px 70px}
  header.top h1{font-size:25px}
  .progress{flex-wrap:wrap}
}
</style>

<div class="wrap">

  <header class="top">
    <span class="badge"><svg viewBox="0 0 24 24" aria-hidden="true" id="ikoni"></svg></span>
    <div>
      <p class="eyebrow" id="eyebrow"></p>
      <h1 id="otsikko"></h1>
      <p id="kuvaus"></p>
      <div class="tags" id="tags"></div>
    </div>
  </header>

  <article id="teksti"></article>

  <div class="progress" aria-live="polite">
    <span class="lbl">Harjoitukset</span>
    <span class="meter"><i id="pbar" style="width:0%"></i></span>
    <span class="cnt" id="pcnt">0 / 20</span>
  </div>

  <div id="harjoitukset"></div>
  <div id="valmis"></div>

  <p class="back" id="back"></p>

</div>

<script>
const D = {"tavoite_id":"YMP4-KES-02","oppiaine":"YMP","vuosiluokka":4,"taso":"haaste","otsikko":"Ilmaston asialla","kuvaus":"Ymmärrän, mistä ilmastonmuutos johtuu ja millä keinoilla sitä voidaan hillitä.","versio":"0.2","paivitetty":"2026-09-26","ops":{"T":["T3","T6","T14"],"S":["S6"]},"eyebrow":"Ympäristöoppi · 4. luokka · Kestävä elämäntapa","ikoni":"maapallo","teksti":[{"tyyppi":"johdanto","sisalto":"Tammikuun aamuna mittari näyttää 25 astetta pakkasta, ja joku bussipysäkillä sanoo: \"Mikä ilmastonmuutos? Tämähän on kylmempää kuin koskaan.\" Hän sekoittaa kaksi eri asiaa: sään ja ilmaston. Tässä taidossa opit erottamaan ne toisistaan, ymmärrät, miksi maapallon ilmasto lämpenee, ja tiedät, mitä sille voidaan tehdä. Ilmastonmuutos on iso asia, mutta se ei ole arvoitus. Sen syy tunnetaan, ja siksi tiedetään myös, mikä auttaa."},{"tyyppi":"kappale","otsikko":"Sää on nyt, ilmasto on keskiarvo","sisalto":"Sää on ilmakehän tila tiettynä hetkenä: sataako, paistaako, tuuleeko, onko kylmä vai lämmin. Sää voi vaihtua tunnissa, ja sääennuste kertoo, millainen sää on lähipäivinä. Ilmasto on sään keskiarvo pitkältä ajalta. Ilmatieteen laitos laskee ilmaston keskiarvot 30 vuoden jaksoista, esimerkiksi vuosista 1991–2020. Kun sanotaan \"illalla alkaa sataa\", puhutaan säästä. Kun sanotaan \"Rovaniemellä on keskimäärin kylmempää kuin Helsingissä\", puhutaan ilmastosta. Sanat nyt, tänään, huomenna, eilen ja tällä viikolla vihjaavat sääpuheesta. Sanat keskimäärin, tavallisesti, vuodesta toiseen ja vuosikymmenten aikana vihjaavat ilmastopuheesta. Vihjesana auttaa, mutta ratkaisee kysymys: puhutaanko yhdestä hetkestä vai monen vuoden keskiarvosta?"},{"tyyppi":"kappale","otsikko":"Kasvihuoneilmiö pitää maapallon lämpimänä","sisalto":"Auringon valo tulee ilmakehän läpi maahan ja lämmittää maan pintaa. Lämmin maanpinta lähettää lämpöä takaisin ylöspäin näkymättömänä lämpösäteilynä. Osa ilmakehän kaasuista pidättää tätä lämpösäteilyä, eikä lämpö pääse kokonaan avaruuteen. Näitä kaasuja kutsutaan kasvihuonekaasuiksi. Tärkeimmät ovat vesihöyry, hiilidioksidi ja metaani. Ilman suurimmat osat, typpi ja happi, eivät ole kasvihuonekaasuja, eikä myöskään argon. Ilmasto-oppaan mukaan maapallon keskilämpötila olisi ilman kasvihuoneilmiötä noin 18 astetta pakkasta, mutta nyt se on noin 14 astetta lämmintä. Kasvihuoneilmiö on siis luonnollinen ja tarpeellinen. Ongelma syntyy, kun kasvihuonekaasuja tulee ilmakehään lisää: silloin lämpöä pidättyy enemmän ja ilmasto lämpenee."},{"tyyppi":"kappale","otsikko":"Miksi ilmasto lämpenee nyt","sisalto":"Suurin osa ihmisen tuottamasta hiilidioksidista syntyy, kun poltetaan fossiilisia polttoaineita: kivihiiltä, öljyä ja maakaasua. Ne ovat syntyneet maan alla muinaisten kasvien ja pieneliöiden jäänteistä miljoonien vuosien aikana, ja niissä on hiiltä. Kun niitä poltetaan, hiili yhtyy ilman happeen ja syntyy hiilidioksidia. Bensiini ja dieselöljy valmistetaan öljystä, joten nekin ovat fossiilisia polttoaineita. Tuulivoima, aurinkovoima ja vesivoima eivät polta mitään, joten niistä ei synny hiilidioksidia palamisesta. Lisäksi naudat tuottavat ruoansulatuksessaan metaania, ja kun metsiä hävitetään, ilmasta sitoutuu vähemmän hiilidioksidia, koska kasvavat puut sitovat sitä. Ilmatieteen laitoksen mukaan Suomen keskilämpötila on noussut yli kaksi astetta 1800-luvun puolivälistä, lähes kaksi kertaa niin nopeasti kuin maapallon keskilämpötila."},{"tyyppi":"ansa","otsikko":"Ansa 1: yksi kylmä talvi ei kumoa ilmastonmuutosta","sisalto":"Kova pakkasviikko tai luminen talvi ei tarkoita, että ilmastonmuutos olisi loppunut. Se on sään vaihtelua. Ilmatieteen laitoksen mukaan kylmät talvet muuttuvat ilmaston lämmetessä vähitellen harvinaisemmiksi, mutta ne eivät katoa. Sama pätee toisin päin: yksi helteinen päivä ei yksinään todista ilmastonmuutosta. Yksi kylmä talvi tai kuuma kesä on sään vaihtelua, ei ilmaston muutos. Ilmastoa katsotaan 30 vuoden keskiarvoista. Ilmastonmuutos näkyy siinä, että keskiarvot muuttuvat vuosikymmenestä toiseen."},{"tyyppi":"ansa","otsikko":"Ansa 2: otsonikato ei ole ilmastonmuutos","sisalto":"Otsonikerros on ilmakehän yläosassa, ja se suojaa maapalloa auringon haitalliselta UV-säteilyltä. Otsonikerrosta ohensivat freonit, joita käytettiin ennen esimerkiksi jääkaapeissa ja suihkepulloissa. Freonien käyttöä rajoitettiin kansainvälisellä sopimuksella vuonna 1987, ja nyt otsonikerros on hiljalleen palautumassa. Otsonikato ja ilmastonmuutos ovat kaksi eri ilmiötä. Ilmastonmuutos ei johdu siitä, että lämpö pääsisi sisään otsoniaukosta, vaan kasvihuonekaasuista, jotka pidättävät lämpöä. Siksi otsonikerroksen korjaantuminen ei pysäytä ilmastonmuutosta, eikä aurinkorasva hillitse sitä."},{"tyyppi":"kappale","otsikko":"Mitä voidaan tehdä","sisalto":"Koska syy tunnetaan, tiedetään myös keino: kasvihuonekaasuja päästetään ilmaan vähemmän. Tätä kutsutaan ilmastonmuutoksen hillinnäksi. Sitä tehdään jo: esimerkiksi Suomessa tehdään sähköä yhä enemmän tuulella. Isot päätökset, kuten sen, miten sähkö tehdään, tekevät aikuiset, yritykset ja valtiot. Myös arjen valinnoilla on merkitystä, ja ne ovat sellaisia, joihin voit itse vaikuttaa. Otsonikato on hyvä esimerkki siitä, että maailmanlaajuinen ympäristöongelma voidaan ratkaista, kun tiedetään syy ja toimitaan yhdessä. Hillinnän keinot jaetaan tässä neljään alueeseen: energia, liikkuminen, ruoka ja kulutus. Kun vertaat kahta vaihtoehtoa, kysy: kummasta syntyy vähemmän päästöjä?"},{"tyyppi":"taulukko","otsikko":"Neljä hillinnän aluetta","otsikkorivi":["Alue","Esimerkkejä","Miksi se auttaa"],"rivit":[["Energia (lämmitys ja sähkö)","lämmitetään ilman öljyä, lasketaan sisälämpöä, pidetään ikkunat kiinni lämmityskaudella, tehdään sähköä tuulella ja auringolla","fossiilisia polttoaineita poltetaan vähemmän"],["Liikkuminen","kävely, pyöräily, bussi tai juna auton tai lentokoneen sijaan","bensiiniä, dieselöljyä ja lentopolttoainetta kuluu matkustajaa kohden vähemmän"],["Ruoka","kasvisruokaa naudanlihan sijaan, tähteet syödään eikä ruokaa heitetä pois","naudoista syntyy metaania, ja pois heitetyn ruoan tuottamisen päästöt menevät hukkaan"],["Kulutus (tavarat)","korjataan, lainataan, ostetaan käytettynä, käytetään pitkään","uuden tavaran valmistaminen vaatii energiaa ja raaka-aineita"]]},{"tyyppi":"saanto","otsikko":"Kolme kysymystä ilmastotiedon lähteelle","askeleet":["Kuka tiedon kertoo? Luotettava lähde on asiantuntija tai asiantuntijaorganisaatio, joka kertoo, kuka on ja mistä tieto on peräisin, kuten Ilmatieteen laitos, Suomen ympäristökeskus tai ilmasto-opas.fi, jota ylläpitävät muun muassa Ilmatieteen laitos, Suomen ympäristökeskus ja Luonnonvarakeskus. Nimetön kirjoittaja ei kerro, kuka hän on.","Mihin tieto perustuu? Luotettava lähde kertoo, mistä mittauksista tai tutkimuksista tieto on. Kuulopuhe ja kommentti ilman lähteitä eivät kerro.","Yrittääkö lähde myydä jotain? Mainoksen tehtävä on saada sinut ostamaan, ei kertoa koko totuutta. Tarkista väite silloin toisesta lähteestä."]},{"tyyppi":"muistilappu","otsikko":"Muista nämä","kohdat":["Sää on nyt ja lähipäivinä. Ilmasto on sään keskiarvo 30 vuodelta.","Kasvihuonekaasut, kuten hiilidioksidi, metaani ja vesihöyry, pidättävät lämpöä ilmakehässä.","Kivihiilen, öljyn ja maakaasun polttaminen lisää hiilidioksidia ja lämmittää ilmastoa.","Hillinnän alueet: energia, liikkuminen, ruoka ja kulutus.","Yksi kylmä talvi on sään vaihtelua, eikä otsonikato ole ilmastonmuutos.","Kysy lähteeltä: kuka kertoo, mihin tieto perustuu ja myykö se jotain."]}],"harjoitusryhmat":[{"id":"saa","nimi":"Sää vai ilmasto","info":"Sää on yksi hetki tai lähipäivät, ilmasto on monen vuosikymmenen keskiarvo. Kysy jokaisesta väitteestä, kumpaa se koskee."},{"id":"syy","nimi":"Miksi ilmasto lämpenee","info":"Mieti, mistä lisää hiilidioksidia ja metaania tulee ja miten kasvihuoneilmiö pidättää lämpöä."},{"id":"hillinta","nimi":"Mitä voidaan tehdä","info":"Vertaa kahta vaihtoehtoa: kummasta syntyy vähemmän päästöjä? Tarkista myös, kuka tiedon kertoo."}],"harjoitukset":[{"id":"H01","ryhma":"saa","kysymys":"Viisi väitettä:\n- Huomenna Espoossa sataa lunta.\n- Lapissa on talvella keskimäärin kylmempää kuin Uudellamaalla.\n- Tänä aamuna pihalla oli 12 astetta pakkasta.\n- Heinäkuu on Suomessa keskimäärin vuoden lämpimin kuukausi.\n- Ensi viikonloppuna Lapissa tuulee kovaa.\n\nMontako näistä väitteistä koskee säätä?","vastaus":3,"vinkki":"Sää on yksi hetki tai lähipäivät. Etsi sanoja kuten huomenna, tänä aamuna, ensi viikonloppuna.","selitys":"Vastaus 3. Huomisen lumisade, tämän aamun pakkanen ja ensi viikonlopun tuuli ovat säätä, koska ne koskevat yhtä hetkeä tai lähipäiviä. Lapin talvi ja heinäkuun lämpö ovat keskiarvoja monelta vuodelta, eli ilmastoa. Pakkaslukema 12 astetta on säätä, vaikka siinä on luku: se mitattiin yhtenä aamuna."},{"id":"H02","ryhma":"saa","kysymys":"Samat viisi väitettä:\n- Huomenna Espoossa sataa lunta.\n- Lapissa on talvella keskimäärin kylmempää kuin Uudellamaalla.\n- Tänä aamuna pihalla oli 12 astetta pakkasta.\n- Heinäkuu on Suomessa keskimäärin vuoden lämpimin kuukausi.\n- Ensi viikonloppuna Lapissa tuulee kovaa.\n\nMontako näistä väitteistä koskee ilmastoa?","vastaus":2,"vinkki":"Ilmasto on keskiarvo pitkältä ajalta. Etsi sana keskimäärin.","selitys":"Vastaus 2. Lapin kylmemmät talvet ja heinäkuu vuoden lämpimimpänä kuukautena ovat monen vuoden keskiarvoja. Kolme muuta väitettä koskee yhtä päivää tai viikonloppua, joten ne ovat säätä."},{"id":"H03","ryhma":"saa","kysymys":"Kuusi väitettä:\n- Saharassa sataa hyvin vähän vuodesta toiseen.\n- Iltapäivällä lämpötila nousee 20 asteeseen.\n- Sademetsässä on lämmintä ja kosteaa ympäri vuoden.\n- Eilen illalla satoi rakeita.\n- Suomessa sataa keskimäärin vähiten keväällä.\n- Juuri nyt Oulussa on pilvistä.\n\nMontako näistä väitteistä koskee ilmastoa?","vastaus":3,"vinkki":"Kysy jokaisesta väitteestä: puhutaanko yhdestä hetkestä vai siitä, millaista paikassa on vuodesta toiseen?","selitys":"Vastaus 3. Saharan kuivuus, sademetsän lämpö ja kosteus sekä Suomen kevään vähäiset sateet ovat pitkän ajan piirteitä, eli ilmastoa. Iltapäivän lämpötila, eilisillan rakeet ja Oulun pilvet juuri nyt ovat säätä."},{"id":"H04","ryhma":"saa","kysymys":"Uutinen (keksitty):\n1. Järvelässä satoi eilen lunta 15 senttiä.\n2. Aamulla tiet olivat liukkaita.\n3. Huomenna pakkanen kiristyy.\n4. Järvelän talvet ovat viime vuosikymmeninä olleet keskimäärin leudompia kuin ennen.\n5. Viikonloppuna sää lauhtuu.\n\nMonennessako virkkeessä puhutaan ilmastosta?","vastaus":4,"vinkki":"Neljä virkettä kertoo eilisestä, tästä aamusta tai lähipäivistä. Yksi virke katsoo paljon pidemmälle.","selitys":"Vastaus 4. Virke 4 vertaa talvia monen vuosikymmenen ajalta ja käyttää sanaa keskimäärin, joten se koskee ilmastoa. Eilinen lumi, aamun liukkaus, huominen pakkanen ja viikonlopun lauha sää ovat säätä."},{"id":"H05","ryhma":"saa","kysymys":"Kuvitteellisen Järvelän tammikuun keskilämpötila oli vuosina 1961–1990 keskimäärin −8 astetta ja vuosina 1991–2020 keskimäärin −6 astetta.\n\nMontako astetta lämpimämpi uudempi keskiarvo on?","vastaus":2,"vinkki":"Lähde luvusta −8 ja laske, montako askelta pitää nousta, että päästään lukuun −6.","selitys":"Vastaus 2. Luvusta −8 noustaan lukuun −6 kahdella asteella. Kumpikin luku on 30 vuoden keskiarvo, joten vertailu kertoo ilmaston muuttumisesta eikä yhden talven säästä."},{"id":"H06","ryhma":"saa","kysymys":"Viisi väitettä:\n- Ilmasto on sään keskiarvo pitkältä ajalta, tavallisesti 30 vuodelta.\n- Yksi kylmä talvi osoittaa, että ilmastonmuutos on loppunut.\n- Vaikka ilmasto lämpenee, Suomessa voi yhä olla kovia pakkasia.\n- Sääennuste kertoo, millainen Suomen ilmasto on.\n- Ilmasto voi muuttua yhdessä viikossa.\n\nMontako näistä väitteistä on totta?","vastaus":2,"vinkki":"Muista ero: yksi talvi tai viikko on sään vaihtelua, ilmasto on 30 vuoden keskiarvo.","selitys":"Vastaus 2. Totta ovat ilmaston määritelmä ja se, että kovia pakkasia voi yhä tulla. Yksi kylmä talvi on sään vaihtelua eikä kerro ilmastosta mitään yksinään. Sääennuste kertoo lähipäivistä, ei ilmastosta. Ilmasto ei muutu viikossa, koska se on monen vuosikymmenen keskiarvo."},{"id":"H07","ryhma":"saa","kysymys":"Viime talvi oli Suomessa kylmä ja luminen.\n\nMitä se kertoo ilmastonmuutoksesta?","vastaus":1,"vinkki":"Onko yksi talvi säätä vai ilmastoa?","selitys":"Yksi talvi on sään vaihtelua. Ilmastonmuutos näkyy vasta, kun verrataan monen vuosikymmenen keskiarvoja. Kylmiä talvia tulee lämpenevässäkin ilmastossa, mutta niitä tulee vähitellen harvemmin kuin ennen.","tyyppi":"monivalinta","vaihtoehdot":["Ilmastonmuutos on loppunut.","Ei yksinään mitään, koska yksi talvi on sään vaihtelua. Ilmastoa katsotaan monen vuosikymmenen keskiarvoista.","Suomen ilmasto on alkanut kylmetä."]},{"id":"H08","ryhma":"syy","kysymys":"Energianlähteet:\n- kivihiili\n- tuulivoima\n- maakaasu\n- aurinkovoima\n- öljy\n- vesivoima\n\nMontako näistä energianlähteistä on fossiilisia polttoaineita?","vastaus":3,"vinkki":"Fossiilinen polttoaine on syntynyt maan alla muinaisten eliöiden jäänteistä, ja sitä poltetaan.","selitys":"Vastaus 3. Kivihiili, maakaasu ja öljy ovat fossiilisia polttoaineita. Tuuli, aurinko ja virtaava vesi eivät ole polttoaineita: niistä tehdään sähköä polttamatta mitään."},{"id":"H09","ryhma":"syy","kysymys":"Ilmakehän kaasuja:\n- hiilidioksidi\n- happi\n- metaani\n- typpi\n- vesihöyry\n\nMontako näistä kaasuista on kasvihuonekaasuja?","vastaus":3,"vinkki":"Kasvihuonekaasu pidättää lämpösäteilyä. Ilman suurimmat osat, typpi ja happi, eivät pidätä.","selitys":"Vastaus 3. Hiilidioksidi, metaani ja vesihöyry ovat kasvihuonekaasuja. Typpi ja happi muodostavat suurimman osan ilmasta, mutta ne päästävät lämpösäteilyn läpi."},{"id":"H10","ryhma":"syy","kysymys":"Kasvihuoneilmiön vaiheet ovat sekaisin:\n- Lämmin maanpinta lähettää lämpösäteilyä ylöspäin.\n- Auringon valo tulee ilmakehän läpi maahan.\n- Kasvihuonekaasut pidättävät osan lämpösäteilystä ilmakehässä.\n- Maan pinta lämpenee.\n\nMonentenako oikeassa järjestyksessä tulee vaihe \"Maan pinta lämpenee.\"?","vastaus":2,"vinkki":"Aloita siitä, mistä kaikki lämpö tulee: auringosta.","selitys":"Vastaus 2. Järjestys on: auringon valo tulee maahan, maan pinta lämpenee, lämmin maanpinta lähettää lämpösäteilyä ylöspäin, ja kasvihuonekaasut pidättävät osan siitä. Maanpinnan lämpeneminen on toinen vaihe, koska pinta ei voi lämmetä ennen kuin valo on tullut perille."},{"id":"H11","ryhma":"syy","kysymys":"Ilmasto-oppaan mukaan maapallon keskilämpötila olisi ilman kasvihuoneilmiötä noin 18 astetta pakkasta. Nyt se on noin 14 astetta lämmintä.\n\nMontako astetta kasvihuoneilmiö lämmittää maapalloa?","vastaus":32,"vinkki":"Laske ensin, montako astetta on pakkasesta nollaan, ja sitten nollasta nykyiseen lämpötilaan.","selitys":"Vastaus 32. Pakkasesta 18 astetta noustaan nollaan 18 asteella ja siitä 14 astetta lämpimään vielä 14 asteella: 18 + 14 = 32. Kasvihuoneilmiö itsessään on siis tarpeellinen. Ongelma on se, että ihminen on voimistanut sitä."},{"id":"H12","ryhma":"syy","kysymys":"Viisi asiaa:\n- bensiiniauto ajaa kauppaan\n- tuulivoimala tuottaa sähköä\n- naudat märehtivät laitumella\n- aurinkopaneeli tuottaa sähköä\n- kivihiilivoimala tuottaa sähköä\n\nMontako näistä päästää kasvihuonekaasuja ilmaan?","vastaus":3,"vinkki":"Mieti, poltetaanko jotain fossiilista vai syntyykö metaania.","selitys":"Vastaus 3. Bensiiniauto ja kivihiilivoimala polttavat fossiilisia polttoaineita, joista syntyy hiilidioksidia. Naudan ruoansulatuksessa syntyy metaania. Tuulivoimala ja aurinkopaneeli eivät polta mitään."},{"id":"H13","ryhma":"syy","kysymys":"Miksi bensiiniauton ajaminen lämmittää ilmastoa?","vastaus":0,"vinkki":"Bensiini on tehty öljystä. Mitä syntyy, kun sitä poltetaan?","selitys":"Moottori polttaa bensiiniä, ja palamisessa syntyy hiilidioksidia. Hiilidioksidi on kasvihuonekaasu, joka pidättää lämpöä ilmakehässä. Moottorin oma kuumuus on ilmaston kannalta pieni asia, eikä pakokaasu ole otsonikadon syy.","tyyppi":"monivalinta","vaihtoehdot":["Palamisessa syntyy hiilidioksidia, joka pidättää lämpöä ilmakehässä.","Kuuma moottori lämmittää ulkoilmaa suoraan.","Pakokaasu tekee aukon otsonikerrokseen."]},{"id":"H14","ryhma":"syy","kysymys":"Viisi väitettä:\n- Otsonikerros suojaa maapalloa auringon UV-säteilyltä.\n- Ilmastonmuutos johtuu siitä, että otsonikerroksessa on aukko.\n- Otsonikatoa aiheuttivat freonit, joita käytettiin ennen esimerkiksi jääkaapeissa ja suihkepulloissa.\n- Kun otsonikerros korjaantuu, ilmastonmuutos loppuu.\n- Otsonikato ja ilmastonmuutos ovat kaksi eri ilmiötä.\n\nMontako näistä väitteistä on totta?","vastaus":3,"vinkki":"Otsonikerros liittyy UV-säteilyyn, ilmastonmuutos kasvihuonekaasuihin.","selitys":"Vastaus 3. Totta ovat otsonikerroksen tehtävä, freonit otsonikadon syynä ja se, että ilmiöt ovat eri asioita. Ilmastonmuutos johtuu kasvihuonekaasuista, ei otsoniaukosta, joten otsonikerroksen korjaantuminen ei pysäytä ilmastonmuutosta."},{"id":"H15","ryhma":"hillinta","kysymys":"Viisi valintaa:\n- pyöräilet kouluun sen sijaan, että sinut viedään autolla\n- ostat uuden puhelimen, vaikka vanha toimii hyvin\n- syöt kasvispyöryköitä naudanlihapullien sijaan\n- lennätte lomalle, vaikka sinne pääsisi junalla\n- korjautat rikkinäisen takin uuden ostamisen sijaan\n\nMontako näistä valinnoista vähentää päästöjä?","vastaus":3,"vinkki":"Katso kummassakin valinnassa kahta vaihtoehtoa. Valitaanko se, josta syntyy vähemmän päästöjä?","selitys":"Vastaus 3. Pyöräily auton sijaan, kasvisruoka naudanlihan sijaan ja takin korjaaminen vähentävät päästöjä. Uusi puhelin ehjän tilalle ja lentäminen junan sijaan lisäävät niitä."},{"id":"H16","ryhma":"hillinta","kysymys":"Kuusi valintaa:\n- jätät tietokoneen ja valot päälle yöksi\n- matkustatte lomalle junalla lentämisen sijaan\n- nostatte huoneen lämpötilaa kahdella asteella\n- valitset linssikeiton naudanlihakeiton sijaan\n- ostat joka viikko uuden lelun, joka unohtuu pian\n- heität syömättä jääneen ruoan roskiin\n\nMontako näistä valinnoista vähentää päästöjä?","vastaus":2,"vinkki":"Osa valinnoista kuluttaa turhaa energiaa tai tavaraa. Ne eivät vähennä päästöjä.","selitys":"Vastaus 2. Juna lentämisen sijaan ja linssikeitto naudanlihan sijaan vähentävät päästöjä. Päälle jätetyt laitteet ja lisälämpö kuluttavat energiaa turhaan, uusi lelu joka viikko vaatii tavaran valmistamista, ja pois heitetyn ruoan tuottamisen päästöt menevät hukkaan."},{"id":"H17","ryhma":"hillinta","kysymys":"Kuusi hillintäkeinoa:\n- syötte eilisen ruoan tähteet eikä niitä heitetä pois\n- menet harrastukseen bussilla etkä omalla autokyydillä\n- valitset linssikeiton naudanlihakeiton sijaan\n- laskette sisälämpöä asteella\n- korjaat rikkinäiset kengät uusien ostamisen sijaan\n- kävelet kilometrin päässä olevaan kauppaan autolla ajamisen sijaan\n\nMontako näistä hillintäkeinoista liittyy ruokaan?","vastaus":2,"vinkki":"Hillinnän neljä aluetta ovat energia, liikkuminen, ruoka ja kulutus. Etsi ne, joissa puhutaan syömisestä.","selitys":"Vastaus 2. Tähteiden syöminen ja linssikeitto liittyvät ruokaan. Bussi ja kävely ovat liikkumista, sisälämmön laskeminen on energiaa ja kenkien korjaaminen on kulutusta."},{"id":"H18","ryhma":"hillinta","kysymys":"Viisi lähdettä:\n- Ilmatieteen laitoksen verkkosivu\n- nimetön video, jossa ei kerrota, mistä tieto on peräisin\n- ilmasto-opas.fi\n- yrityksen mainos\n- keskustelupalstan kommentti ilman lähteitä\n\nHaluat tietää, paljonko Suomen ilmasto on lämmennyt. Montako näistä on luotettavia lähteitä?","vastaus":2,"vinkki":"Kysy jokaisesta: kuka kertoo, mihin tieto perustuu, ja yrittääkö lähde myydä jotain?","selitys":"Vastaus 2. Ilmatieteen laitos mittaa Suomen säätä ja ilmastoa, ja ilmasto-opas.fi on muun muassa Ilmatieteen laitoksen, Suomen ympäristökeskuksen ja Luonnonvarakeskuksen ylläpitämä. Nimetön video ja kommentti eivät kerro, mistä tieto tulee, ja mainoksen tehtävä on myydä."},{"id":"H19","ryhma":"hillinta","kysymys":"Kaverisi sanoo: \"Ilmasto ei lämpene, koska tänä talvena on ollut paljon lunta.\"\n\nMikä näistä on paras tapa tarkistaa väite?","vastaus":1,"vinkki":"Väite koskee ilmastoa. Millainen tieto kertoo ilmastosta?","selitys":"Ilmastoa tarkistetaan monen vuosikymmenen mittauksista, ja niitä julkaisee Ilmatieteen laitos. Huomisen sääennuste kertoo vain lähipäivistä, ja toisen kaverin mielipide ei perustu mittauksiin.","tyyppi":"monivalinta","vaihtoehdot":["Kysyt toiselta kaverilta, mitä hän ajattelee.","Katsot Ilmatieteen laitoksen tietoa Suomen lämpötiloista monen vuosikymmenen ajalta.","Katsot huomisen sääennusteen."]},{"id":"H20","ryhma":"hillinta","kysymys":"Luokan 4B kulkutavat kouluun (henkilöä):\nKävellen: 9\nPyörällä: 6\nBussilla: 5\nAutokyydillä: 4\n\nAutokyydillä kulkevista puolet alkaa pyöräillä. Montako pyöräilee sen jälkeen?","vastaus":8,"vinkki":"Laske ensin, montako on puolet autokyydillä kulkevista. Lisää se pyöräilijöihin.","selitys":"Vastaus 8. Autokyydillä kulkee 4, ja puolet siitä on 2. Pyöräilijöitä oli 6, joten nyt heitä on 6 + 2 = 8. Neljän automatkan sijaan jää kaksi, ja pois jäävät automatkat säästävät polttoainetta."}],"valmis_teksti":"Erotat sään ja ilmaston toisistaan, tiedät, miksi ilmasto lämpenee, ja osaat nimetä keinoja hillitä ilmastonmuutosta. Tämä taito on nyt näytetty."};

const X0=34, X1=606, Y=62;
function piirraNL(v){
  const ala=Math.floor(v/10)*10, yla=ala+10, puoli=ala+5;
  const pyor = (v%10)>=5 ? yla : ala;
  const x = n => X0 + (n/100)*(X1-X0);
  let s=`<line class="rail" x1="${X0}" y1="${Y}" x2="${X1}" y2="${Y}"/>`;
  for(let n=0;n<=100;n+=10){
    const near = (n===ala||n===yla);
    s+=`<line class="tick" x1="${x(n)}" y1="${Y-7}" x2="${x(n)}" y2="${Y+7}"/>`;
    s+=`<text class="stop${near?" near":""}" x="${x(n)}" y="${Y+24}" text-anchor="middle">${n}</text>`;
  }
  s+=`<line class="halfway" x1="${x(puoli)}" y1="${Y-16}" x2="${x(puoli)}" y2="${Y+12}"/>`;
  s+=`<text class="stop" x="${x(puoli)}" y="${Y-22}" text-anchor="middle">puoliväli ${puoli}</text>`;
  s+=`<circle class="dot" cx="${x(v)}" cy="${Y}" r="6"/>`;
  s+=`<text class="val" x="${x(v)}" y="${Y-32}" text-anchor="middle">${v}</text>`;
  s+=`<path d="M ${x(v)} ${Y+38} L ${x(pyor)} ${Y+38}" stroke="var(--core)" stroke-width="2" fill="none"/>`;
  s+=`<path d="M ${x(pyor)} ${Y+38} l ${x(pyor)>x(v)?-7:7} -4 l 0 8 z" fill="var(--core)"/>`;
  svg.innerHTML=s;
  out.textContent = `${v} pyöristyy → ${pyor}`;
}

/* ---------- paikka-arvotaulu ---------- */
const ntTaulu=document.getElementById("ntTaulu");
if(ntTaulu){
  const O=D.teksti.find(x=>x.tyyppi==="numerotaulu");
  const PAIKAT=["ykköset","kymmenet","sadat","tuhannet","kymmenettuhannet"];
  const LYH=["Y","K","S","T","KT"];
  const IDX={kymmenet:1, sadat:2, tuhannet:3};
  let ntI=0;
  document.getElementById("ntValinta").innerHTML=O.esimerkit.map((e,i)=>
    `<button type="button" data-i="${i}" aria-pressed="${i===0}">${e.luku.toLocaleString("fi-FI",{maximumFractionDigits:10})} → ${e.tarkkuus}</button>`).join("");
  function ntPiirra(){
    const e=O.esimerkit[ntI], t=IDX[e.tarkkuus], kerroin=Math.pow(10,t);
    const tulos=Math.floor((e.luku+kerroin/2)/kerroin)*kerroin;
    const lev=Math.max(String(e.luku).length, String(tulos).length);
    const num=String(e.luku).padStart(lev,"0").split("");
    const res=String(tulos).padStart(lev,"0").split("");
    const luokka=(i,arr,vain0)=>{
      const p=arr.length-1-i;
      if(vain0) return p<t ? "nt-ruutu nolla" : "nt-ruutu";
      if(p===t) return "nt-ruutu kohta";
      if(p===t-1) return "nt-ruutu ratkaiseva";
      return "nt-ruutu";
    };
    const otsat=num.map((_,i)=>`<span class="otsa">${LYH[num.length-1-i]||""}</span>`).join("");
    const rivi1=num.map((n,i)=>`<span class="${luokka(i,num,false)}">${n}</span>`).join("");
    const rivi2=res.map((n,i)=>`<span class="${luokka(i,res,true)}">${n}</span>`).join("");
    const ratk=+num[num.length-t];
    const ylos=ratk>=5;
    ntTaulu.innerHTML=
      `<div class="nt-rivi">${otsat}</div>
       <div class="nt-rivi">${rivi1}<span class="nimi">luku</span></div>
       <div class="nt-rivi"><span class="nt-nuoli" style="margin-left:${(num.length-1-t)*58+18}px">${ylos?"▲ ylös":"▼ alas"}</span></div>
       <div class="nt-rivi">${rivi2}<span class="nimi">pyöristettynä</span></div>`;
    document.getElementById("ntSelite").innerHTML =
      `Pyöristetään <b>${PAIKAT[t]}</b> (sininen ruutu). Ratkaiseva numero on <b>${ratk}</b> (keltainen ruutu). ` +
      (ylos ? `Se on 5 tai suurempi, joten sininen ruutu kasvaa yhdellä.` : `Se on pienempi kuin 5, joten sininen ruutu pysyy ennallaan.`) +
      ` Kaikki keltaisen oikealla puolella muuttuu nolliksi. Vastaus on <b>${tulos.toLocaleString("fi-FI",{maximumFractionDigits:10})}</b>.`;
    document.querySelectorAll("#ntValinta button").forEach((b,i)=>b.setAttribute("aria-pressed",String(i===ntI)));
  }
  document.getElementById("ntValinta").addEventListener("click",e=>{
    const b=e.target.closest("button"); if(!b) return; ntI=+b.dataset.i; ntPiirra();
  });
  ntPiirra();
}

/* ---------- laskujärjestys-widget ---------- */
const ljExp=document.getElementById("ljExp");
if(ljExp && D.kokeilu){
  let ljI=0, ljTokens=[], ljStep=0;
  const laske=(a,op,b)=>{a=+a;b=+b;return op==="×"?a*b:op==="÷"?a/b:op==="+"?a+b:a-b;};
  function ljAlku(){
    const l=D.kokeilu[ljI];
    ljTokens=l.lauseke.replace(/\(/g,"( ").replace(/\)/g," )").split(/\s+/).filter(Boolean);
    ljStep=0; ljPiirra(); ljViesti("","");
  }
  function ljViesti(t,lk){const f=document.getElementById("ljFb"); f.textContent=t; f.className="lj-fb "+(lk||"");}
  function ljPiirra(){
    const l=D.kokeilu[ljI];
    document.getElementById("ljStep").textContent =
      ljStep>=l.askeleet.length ? "valmis" : `askel ${ljStep+1} / ${l.askeleet.length}`;
    if(ljStep>=l.askeleet.length){
      ljExp.innerHTML=`<span class="valmis">${l.lauseke} = ${l.vastaus}</span>`;
      return;
    }
    ljExp.innerHTML=ljTokens.map((t,i)=>
      "×÷+−".includes(t) ? `<button type="button" class="op" data-i="${i}">${t}</button>`
                         : `<span class="tok">${t}</span>`).join("");
    ljExp.querySelectorAll("button.op").forEach(b=>b.addEventListener("click",()=>ljKlikkaa(+b.dataset.i)));
  }
  function ljKlikkaa(i){
    const l=D.kokeilu[ljI], odotettu=l.askeleet[ljStep];
    const ehdotus=[ljTokens[i-1],ljTokens[i],ljTokens[i+1]].join(" ");
    if(ehdotus!==odotettu){
      ljViesti(ljStep===0
        ? "Ei vielä. Sulkeet ovat vahvimmat, sitten kerto ja jako. Yhtä vahvat vasemmalta oikealle."
        : "Ei vielä. Kumpi jäljellä olevista on vahvempi?", "no");
      return;
    }
    const arvo=laske(ljTokens[i-1],ljTokens[i],ljTokens[i+1]);
    let alku=i-1, loppu=i+1;
    if(ljTokens[i-2]==="(" && ljTokens[i+2]===")"){ alku=i-2; loppu=i+2; }
    ljTokens.splice(alku, loppu-alku+1, String(arvo));
    ljStep++;
    ljViesti(ljStep>=l.askeleet.length ? "Valmis. Vastaus on "+l.vastaus+"." : "Oikein. Jatka seuraavaan.", "ok");
    ljPiirra();
  }
  document.getElementById("ljSeuraava").addEventListener("click",()=>{
    ljI=(ljI+1)%D.kokeilu.length; ljAlku();
  });
  ljAlku();
}

/* ---------- harjoitukset ----------
   Kaksi vastaustyyppiä: "numero" (oletus, tekstikenttä + Number()-vertailu) ja
   "monivalinta" (valintapainikkeet, h.vaihtoehdot[] + h.vastaus = oikean vaihtoehdon indeksi).
   Jos D.harjoitukset puuttuu tai on tyhjä, koko osio piilotetaan (näyttötaidot, ei kirjallista
   harjoitusta: liikunta, kuvataide). */
/* Kysymyksessä voi olla luettavaa aineistoa ja sen jälkeen varsinainen kysymys,
   erotettuna tyhjällä rivillä. Viimeinen osa on kysymys, sitä edeltävät aineistoa. */
const kysymysHtml = t => {
  const osat = String(t).split(/\n\s*\n/).map(x=>x.trim()).filter(Boolean);
  if(osat.length < 2) return osat[0] || "";
  const kysymys = osat.pop();
  return osat.map(p=>`<span class="aineisto">${p}</span>`).join("")
       + `<span class="kysymysrivi">${kysymys}</span>`;
};

function merkitseTulos(id, oikein, viesti){
  const fb=document.getElementById("fb-"+id), kortti=document.getElementById("ex-"+id);
  tila[id].yritetty=true;
  if(oikein){
    tila[id].ratkaistu=true;
    kortti.dataset.tila="oikein";
    fb.className="fb ok"; fb.textContent=viesti;
  } else {
    kortti.dataset.tila="vaarin";
    fb.className="fb no"; fb.textContent=viesti;
  }
  paivitaEdistyminen();
}

/* Suomalainen lukumuoto: välilyönti on tuhaterotin, pilkku desimaalierotin.
   Piste voi olla kumpi tahansa. Se tulkitaan tuhaterottimeksi VAIN silloin, kun
   koko luku on aitoa tuhaterotinmuotoa: alkuosa 1–3 numeroa ilman etunollaa ja
   jokainen jatko-osa täsmälleen 3 numeroa (1.500, 12.345.678). Kaikissa muissa
   tapauksissa piste on desimaalipiste — myös 0.125, joka vanhalla säännöllä
   ("3 numeroa pisteen jäljessä = tuhaterotin") luettiin virheellisesti luvuksi 125. */
const TUHATEROTIN = /^[1-9]\d{0,2}(\.\d{3})+$/;
function lueLuku(teksti){
  // Murtoluku (3/4, -3/4) ja sekaluku (1 2/3, -1 2/3) hyväksytään sellaisinaan.
  const raaka = String(teksti).replace(/\u00a0/g, " ").trim();
  let m = raaka.match(/^(-?)(\d+)\s+(\d+)\s*\/\s*(\d+)$/);
  if(m){ const nim = Number(m[4]); if(nim === 0) return null;
    const v = Number(m[2]) + Number(m[3]) / nim; return m[1] ? -v : v; }
  m = raaka.match(/^(-?)\s*(\d+)\s*\/\s*(\d+)$/);
  if(m){ const nim = Number(m[3]); if(nim === 0) return null;
    const v = Number(m[2]) / nim; return m[1] ? -v : v; }
  let s = String(teksti).replace(/[\s\u00a0]/g, "");
  if(s === "") return null;
  if(s.indexOf(",") >= 0){
    s = s.replace(/\./g, "").replace(",", ".");
  } else if(TUHATEROTIN.test(s)){
    s = s.replace(/\./g, "");
  }
  const n = Number(s);
  return Number.isFinite(n) ? n : null;
}

function tarkista(id){
  const h=D.harjoitukset.find(x=>x.id===id);
  const kentta=document.getElementById("in-"+id);
  const fb=document.getElementById("fb-"+id);
  if(kentta.value.trim()===""){ fb.className="fb hint"; fb.textContent="Kirjoita vastaus ensin."; return; }
  const luku=lueLuku(kentta.value);
  if(luku===null){ fb.className="fb no"; fb.textContent="Vastauksen pitää olla luku tai murtoluku (esimerkiksi 3/4)."; return; }
  const oikein = Math.abs(luku - h.vastaus) < 1e-9;
  merkitseTulos(id, oikein, oikein ? "Oikein. "+h.selitys : `Ei vielä. ${h.vinkki} Kokeile uudelleen.`);
}

function tarkistaMonivalinta(id, valittuIndeksi, painike){
  const h=D.harjoitukset.find(x=>x.id===id);
  const rivi=painike.closest(".row");
  rivi.querySelectorAll(".mv-valinta").forEach(b=>b.disabled=true);
  const oikein = valittuIndeksi===h.vastaus;
  painike.classList.add(oikein?"mv-oikein":"mv-vaarin");
  if(!oikein){
    const oikeaBtn=rivi.querySelector(`[data-i="${h.vastaus}"]`);
    if(oikeaBtn) oikeaBtn.classList.add("mv-oikein");
  }
  merkitseTulos(id, oikein, oikein ? "Oikein. "+h.selitys : `Ei ihan. Oikea vastaus on korostettu. ${h.selitys||""}`);
}

/* Kuuntelu: selain lukee tekstin ääneen omalla puhesynteesillään (englanniksi, jos laitteessa on
   englanninkielinen ääni). Ei äänitiedostoja eikä verkkoyhteyttä. Jos laite ei osaa puhua,
   teksti näytetään luettavaksi — silloin tehtävä muuttuu luetun ymmärtämiseksi, mutta ei katkea. */
function puhu(id, nopeus){
  const h=D.harjoitukset.find(x=>x.id===id); if(!h || !h.kuuntele) return;
  const vara=document.getElementById("vara-"+id);
  const naytaTeksti=syy=>{ vara.hidden=false; vara.textContent=syy+" Teksti: "+h.kuuntele; };
  if(!("speechSynthesis" in window)){ naytaTeksti("Tämä laite ei osaa lukea ääneen."); return; }
  const s=window.speechSynthesis; s.cancel();
  const u=new SpeechSynthesisUtterance(h.kuuntele);
  u.lang=h.kieli||"en-GB"; u.rate=nopeus;
  const aanet=s.getVoices(), kieli=u.lang.slice(0,2);
  const aani=aanet.find(a=>a.lang===u.lang) || aanet.find(a=>a.lang && a.lang.startsWith(kieli));
  if(aani) u.voice=aani;
  else if(aanet.length) { naytaTeksti("Laitteessa ei ole englanninkielistä ääntä."); return; }
  u.onerror=()=>naytaTeksti("Ääneen lukeminen ei onnistunut.");
  s.speak(u);
}

  if(t) tarkista(t.dataset.tarkista);

    const fb=document.getElementById("fb-"+h.id);

  }
});

});
