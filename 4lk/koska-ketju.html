<title>Koska-ketju</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">

<style>
:root{
  --paper:#EFF2F5; --surface:#FFFFFF; --surface-2:#F7F9FB;
  --grid:#DCE3EA; --line:#C9D3DC;
  --ink:#15222C; --ink-2:#4E626F; --ink-3:#7E8F9B;
  --core:#1B5A9E; --core-soft:#E4EDF6;
  --strong:#1F6E5C; --strong-soft:#E1F0EB;
  --chal:#9A6A16; --chal-soft:#F6EDDC;
  --alert:#A33A2B; --alert-soft:#F8E7E3;
  --shadow:0 1px 2px rgba(21,34,44,.06), 0 8px 24px -12px rgba(21,34,44,.18);
  --r:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0F161B; --surface:#18222A; --surface-2:#1D2830;
    --grid:#22303A; --line:#2E3E4A;
    --ink:#E8EFF4; --ink-2:#A3B4C0; --ink-3:#7A8B97;
    --core:#7FB2E4; --core-soft:#16303F;
    --strong:#77CDB4; --strong-soft:#123028;
    --chal:#E0B267; --chal-soft:#33270F;
    --alert:#E8907F; --alert-soft:#3A1E19;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -14px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --paper:#0F161B; --surface:#18222A; --surface-2:#1D2830;
  --grid:#22303A; --line:#2E3E4A;
  --ink:#E8EFF4; --ink-2:#A3B4C0; --ink-3:#7A8B97;
  --core:#7FB2E4; --core-soft:#16303F;
  --strong:#77CDB4; --strong-soft:#123028;
  --chal:#E0B267; --chal-soft:#33270F;
  --alert:#E8907F; --alert-soft:#3A1E19;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -14px rgba(0,0,0,.7);
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:16px; line-height:1.62;
  background-image:
    linear-gradient(to right, var(--grid) 1px, transparent 1px),
    linear-gradient(to bottom, var(--grid) 1px, transparent 1px);
  background-size:26px 26px;
}
.wrap{max-width:760px; margin:0 auto; padding:28px 20px 90px}
h1,h2,h3,h4{font-family:"Familjen Grotesk","IBM Plex Sans",system-ui,sans-serif; text-wrap:balance}

/* header */
header.top{background:var(--surface); border:1px solid var(--line); border-radius:var(--r);
  box-shadow:var(--shadow); padding:22px 24px; display:flex; gap:18px; align-items:flex-start}
.badge{flex:0 0 auto; width:54px; height:54px; border-radius:9px; display:grid; place-items:center;
  background:var(--core-soft); border:1px solid var(--core); color:var(--core)}
.badge svg{width:28px; height:28px; fill:none; stroke:currentColor; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round}
.eyebrow{font-family:"IBM Plex Mono",monospace; font-size:11px; letter-spacing:.14em;
  text-transform:uppercase; color:var(--ink-3); margin:0 0 5px}
header.top h1{margin:0; font-size:30px; font-weight:700; letter-spacing:-.015em}
header.top p{margin:5px 0 0; color:var(--ink-2); font-size:15px}
.tags{display:flex; flex-wrap:wrap; gap:5px; margin-top:11px}
.tag{font-family:"IBM Plex Mono",monospace; font-size:10.5px; letter-spacing:.05em; padding:2px 7px;
  border-radius:4px; background:var(--surface-2); border:1px solid var(--line); color:var(--ink-3)}
.tag.core{background:var(--core-soft); border-color:var(--core); color:var(--core)}

/* teksti */
article{margin-top:26px}
article h2{font-size:21px; font-weight:600; margin:32px 0 10px; letter-spacing:-.01em}
article p{margin:0 0 14px; max-width:64ch}
.lead{font-size:17.5px; color:var(--ink); border-left:3px solid var(--core); padding-left:16px; margin:0 0 8px}

.box{background:var(--surface); border:1px solid var(--line); border-radius:var(--r);
  padding:18px 22px; box-shadow:var(--shadow); margin:22px 0}
.box h3{margin:0 0 12px; font-size:16.5px; font-weight:600}
.box.warn{border-left:3px solid var(--alert)}
.box.note{border-left:3px solid var(--chal)}

ol.steps{margin:0; padding-left:0; list-style:none; counter-reset:s; display:grid; gap:12px}
ol.steps li{counter-increment:s; display:grid; grid-template-columns:auto 1fr; gap:13px; align-items:start}
ol.steps li::before{content:counter(s); font-family:"Familjen Grotesk",sans-serif; font-weight:700; font-size:14px;
  width:26px; height:26px; border-radius:50%; background:var(--core); color:#fff; display:grid; place-items:center; margin-top:2px}

ul.notes{margin:0; padding-left:19px}
ul.notes li{margin-bottom:7px}
ul.notes li:last-child{margin-bottom:0}

.tablewrap{overflow-x:auto}
table{border-collapse:collapse; width:100%; font-size:14.5px; min-width:460px}
th,td{text-align:left; padding:9px 13px; border-bottom:1px solid var(--line)}
th{font-family:"IBM Plex Mono",monospace; font-size:10.5px; letter-spacing:.1em; text-transform:uppercase;
  color:var(--ink-3); font-weight:400; background:var(--surface-2)}
tr:last-child td{border-bottom:0}
td b{color:var(--core); font-weight:600}
td:last-child{font-variant-numeric:tabular-nums; font-weight:600}

/* lukusuora */
.nl svg{width:100%; height:118px; display:block}
.nl .rail{stroke:var(--line); stroke-width:2}
.nl .tick{stroke:var(--line); stroke-width:1.5}
.nl .stop{fill:var(--ink-3); font-family:"IBM Plex Mono",monospace; font-size:11px}
.nl .stop.near{fill:var(--core); font-weight:600}
.nl .dot{fill:var(--chal)}
.nl .val{fill:var(--ink); font-family:"Familjen Grotesk",sans-serif; font-size:15px; font-weight:700}
.nl .halfway{stroke:var(--chal); stroke-dasharray:3 3; stroke-width:1.5}
.nl-controls{display:flex; align-items:center; gap:14px; margin-top:6px}
.nl-controls input{flex:1; accent-color:var(--core)}
.nl-out{font-family:"Familjen Grotesk",sans-serif; font-size:15px; font-weight:600; min-width:12.5em; text-align:right}

/* paikka-arvotaulu */
.box .ohje{margin:0 0 14px; font-size:14.5px; color:var(--ink-2)}
.nt-valinta{display:flex; flex-wrap:wrap; gap:7px; margin-bottom:16px}
.nt-valinta button{font:inherit; font-size:12.5px; font-family:"IBM Plex Mono",monospace; padding:5px 11px;
  border-radius:6px; border:1px solid var(--line); background:var(--surface-2); color:var(--ink-2); cursor:pointer}
.nt-valinta button[aria-pressed="true"]{background:var(--ink); color:var(--paper); border-color:var(--ink)}
.nt-valinta button:focus-visible{outline:2px solid var(--core); outline-offset:2px}
.nt-taulu{display:flex; flex-direction:column; gap:4px; align-items:flex-start; overflow-x:auto; padding-bottom:4px}
.nt-rivi{display:flex; gap:6px; align-items:center}
.nt-rivi .otsa{font-family:"IBM Plex Mono",monospace; font-size:9.5px; letter-spacing:.08em;
  text-transform:uppercase; color:var(--ink-3); width:52px; text-align:center}
.nt-ruutu{width:52px; height:52px; display:grid; place-items:center; border:1.5px solid var(--line);
  border-radius:7px; background:var(--surface-2); font-family:"IBM Plex Mono",monospace; font-size:24px}
.nt-ruutu.kohta{border-color:var(--core); background:var(--core-soft); color:var(--core); font-weight:500}
.nt-ruutu.ratkaiseva{border-color:var(--chal); background:var(--chal-soft); color:var(--chal); font-weight:500}
.nt-ruutu.nolla{color:var(--ink-3)}
.nt-rivi .nimi{font-size:12.5px; color:var(--ink-3); margin-left:12px; white-space:nowrap}
.nt-nuoli{font-size:17px; color:var(--chal); margin-left:6px}
.nt-selite{margin:14px 0 0; font-size:14.5px}
.nt-selite b{color:var(--core)}

/* vahvuusportaat */
.vp-tasot{display:grid; gap:9px; margin-bottom:18px}
.vp-taso{display:flex; gap:11px; align-items:flex-start; font-size:13.5px}
.vp-taso .vp-pallo{width:13px; height:13px; border-radius:4px; margin-top:5px; flex:0 0 auto}
.vp-taso[data-taso="sulkeet"] .vp-pallo{background:var(--core)}
.vp-taso[data-taso="kertojako"] .vp-pallo{background:var(--strong)}
.vp-taso[data-taso="yhteenvahennys"] .vp-pallo{background:var(--chal)}
.vp-taso strong{display:block; font-family:"Familjen Grotesk",sans-serif; font-weight:600; font-size:14.5px}
.vp-taso span{color:var(--ink-2)}
.vp-lauseke{display:flex; flex-wrap:wrap; gap:7px; align-items:flex-end; font-family:"IBM Plex Mono",monospace;
  font-size:25px; padding:10px 2px; min-height:64px}
.vp-lauseke .t{padding:2px 3px}
.vp-lauseke .op{position:relative; padding:2px 9px; border-radius:6px; font-weight:500}
.vp-lauseke .op[data-taso="sulkeet"]{background:var(--core-soft); color:var(--core)}
.vp-lauseke .op[data-taso="kertojako"]{background:var(--strong-soft); color:var(--strong)}
.vp-lauseke .op[data-taso="yhteenvahennys"]{background:var(--chal-soft); color:var(--chal)}
.vp-lauseke .op i{position:absolute; top:-9px; right:-6px; font-style:normal; font-family:"Familjen Grotesk",sans-serif;
  font-size:11px; font-weight:700; width:18px; height:18px; border-radius:50%; display:grid; place-items:center;
  background:currentColor}
.vp-lauseke .op i span{color:var(--surface)}
.vp-rivi{display:flex; align-items:center; gap:16px; margin-top:8px}
.vp-vastaus{font-family:"Familjen Grotesk",sans-serif; font-size:16px; font-weight:600; color:var(--strong)}

/* laskujärjestys-widget */
.lj-exp{display:flex; flex-wrap:wrap; gap:7px; align-items:center; font-family:"IBM Plex Mono",monospace;
  font-size:23px; padding:14px 4px; min-height:62px}
.lj-exp .tok{padding:2px 4px; color:var(--ink)}
.lj-exp button.op{font-family:"IBM Plex Mono",monospace; font-size:23px; padding:3px 12px; border-radius:7px;
  border:1.5px solid var(--line); background:var(--surface-2); color:var(--ink); line-height:1.2}
.lj-exp button.op:hover{border-color:var(--core); color:var(--core)}
.lj-exp button.op:focus-visible{outline:2px solid var(--core); outline-offset:2px}
.lj-exp .valmis{font-family:"Familjen Grotesk",sans-serif; font-size:23px; font-weight:700; color:var(--strong)}
.lj-fb{font-size:14.5px; min-height:1.5em; color:var(--ink-2)}
.lj-fb.no{color:var(--alert)}
.lj-fb.ok{color:var(--strong)}
.lj-row{display:flex; align-items:center; gap:14px; margin-top:10px}
.lj-step{font-family:"IBM Plex Mono",monospace; font-size:11.5px; letter-spacing:.1em;
  text-transform:uppercase; color:var(--ink-3)}

/* harjoitukset */
.progress{position:sticky; top:0; z-index:5; background:var(--surface); border:1px solid var(--line);
  border-radius:var(--r); padding:12px 18px; box-shadow:var(--shadow); display:flex; align-items:center;
  gap:14px; margin:34px 0 18px}
.progress .lbl{font-family:"IBM Plex Mono",monospace; font-size:11px; letter-spacing:.12em;
  text-transform:uppercase; color:var(--ink-3); white-space:nowrap}
.progress .meter{flex:1; height:7px; border-radius:4px; background:var(--surface-2); border:1px solid var(--line); overflow:hidden}
.progress .meter i{display:block; height:100%; background:var(--core); transition:width .25s ease}
.progress .cnt{font-family:"Familjen Grotesk",sans-serif; font-weight:700; font-variant-numeric:tabular-nums; white-space:nowrap}

.grp{margin-top:26px}
.grp-head{display:flex; align-items:baseline; gap:10px; border-bottom:1.5px solid var(--ink); padding-bottom:7px; margin-bottom:14px}
.grp-head h3{margin:0; font-size:17px; font-weight:600}
.grp-head span{font-size:12.5px; color:var(--ink-2)}

.ex{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:14px 16px; margin-bottom:10px}
.ex[data-tila="oikein"]{border-color:var(--strong); box-shadow:inset 3px 0 0 var(--strong)}
.ex[data-tila="vaarin"]{border-color:var(--alert); box-shadow:inset 3px 0 0 var(--alert)}
.ex .q{display:flex; gap:11px; align-items:baseline; flex-wrap:wrap}
.ex .num{font-family:"IBM Plex Mono",monospace; font-size:11.5px; color:var(--ink-3); min-width:2.4em}
.ex .txt{flex:1; min-width:190px; font-size:15.5px}
.ex .txt .aineisto{display:block; margin-bottom:9px; padding-left:12px;
  border-left:2px solid var(--line); color:var(--ink-2); line-height:1.6;
  /* Aineisto voi olla pieni taulukko, jonka rivit on erotettu rivinvaihdoilla.
     Ilman pre-lineä ne valuisivat yhdeksi kappaleeksi ja taulukko katoaisi. */
  white-space:pre-line}
.ex .txt .kysymysrivi{display:block; font-weight:600}
.ex .row{display:flex; gap:8px; align-items:center; margin-top:11px; flex-wrap:wrap}
.ex input[type=text]{font:inherit; font-family:"IBM Plex Mono",monospace; font-size:15px; width:8.5em;
  padding:7px 11px; border:1px solid var(--line); border-radius:7px; background:var(--surface-2);
  color:var(--ink); text-align:right}
.ex input:focus-visible{outline:2px solid var(--core); outline-offset:1px}
button{font:inherit; cursor:pointer}
.btn{font-size:13.5px; padding:7px 15px; border-radius:7px; border:1px solid var(--core);
  background:var(--core); color:#fff}
.btn.ghost{background:transparent; color:var(--ink-2); border-color:var(--line)}
.btn:focus-visible{outline:2px solid var(--core); outline-offset:2px}
.btn.mv-valinta{text-align:left}
/* kuuntelutehtävä: selaimen puhesynteesi lukee englanninkielisen tekstin */
.kuuntele{display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin:2px 0 10px}
.kuuntele .btn{display:inline-flex; gap:7px; align-items:center}
.kuuntele svg{width:16px; height:16px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round}
.kuuntele .varateksti{flex-basis:100%; font-size:14px; color:var(--ink-2); background:var(--surface-2);
  border-radius:7px; padding:8px 12px; margin:0}
.btn.mv-valinta:disabled{cursor:default; opacity:.65}
.btn.mv-oikein{background:var(--strong-soft); border-color:var(--strong); color:var(--strong); opacity:1}
.btn.mv-vaarin{background:var(--alert-soft); border-color:var(--alert); color:var(--alert); opacity:1}
.row.mv{gap:8px 10px}
.fb{margin-top:11px; font-size:14.5px; padding:10px 13px; border-radius:8px; line-height:1.5}
.fb.ok{background:var(--strong-soft); color:var(--strong)}
.fb.no{background:var(--alert-soft); color:var(--alert)}
.fb.hint{background:var(--chal-soft); color:var(--chal)}

.done{background:var(--strong-soft); border:1px solid var(--strong); color:var(--strong);
  border-radius:var(--r); padding:16px 20px; margin-top:20px; font-size:15.5px}
.done h3{margin:0 0 4px; font-size:17px; color:var(--strong)}

details.teacher{margin-top:34px; background:var(--surface); border:1px solid var(--line);
  border-left:3px solid var(--chal); border-radius:var(--r); padding:15px 20px; box-shadow:var(--shadow)}
details.teacher summary{cursor:pointer; font-family:"Familjen Grotesk",sans-serif; font-weight:600; font-size:15px}
details.teacher summary:focus-visible{outline:2px solid var(--core); outline-offset:3px}
details.teacher ul{margin:12px 0 0; padding-left:19px; color:var(--ink-2); font-size:14.5px}
details.teacher li{margin-bottom:8px}
details.teacher p{margin:12px 0 0; color:var(--ink-2); font-size:14.5px}

.back{display:inline-block; margin-top:30px; font-size:13.5px; color:var(--ink-2)}
.back a{color:var(--core)}

@media (prefers-reduced-motion: reduce){*{transition:none !important}}
@media (max-width:560px){
  .wrap{padding:16px 13px 70px}
  header.top h1{font-size:25px}
  .progress{flex-wrap:wrap}
}
</style>

<div class="wrap">

  <header class="top">
    <span class="badge"><svg viewBox="0 0 24 24" aria-hidden="true" id="ikoni"></svg></span>
    <div>
      <p class="eyebrow" id="eyebrow"></p>
      <h1 id="otsikko"></h1>
      <p id="kuvaus"></p>
      <div class="tags" id="tags"></div>
    </div>
  </header>

  <article id="teksti"></article>

  <div class="progress" aria-live="polite">
    <span class="lbl">Harjoitukset</span>
    <span class="meter"><i id="pbar" style="width:0%"></i></span>
    <span class="cnt" id="pcnt">0 / 20</span>
  </div>

  <div id="harjoitukset"></div>
  <div id="valmis"></div>

  <p class="back" id="back"></p>

</div>

<script>
const D = {"tavoite_id":"ET4-LOG-02","oppiaine":"ET","vuosiluokka":4,"taso":"ydin","otsikko":"Koska-ketju","kuvaus":"Osaan perustella kantani niin, että perustelu liittyy juuri siihen asiaan josta puhutaan.","versio":"0.2","paivitetty":"2026-09-26","ops":{"T":["T2"],"S":["S1"]},"eyebrow":"Elämänkatsomustieto · 4. luokka · Looginen ajattelu","ikoni":"ajattelu","teksti":[{"tyyppi":"johdanto","sisalto":"Luokassa keskustellaan siitä, pitäisikö välitunnin olla pidempi. Mira sanoo: \"Olen sitä mieltä, että välitunnin pitäisi olla pidempi, koska se on liian lyhyt.\" Moni nyökkää, mutta kukaan ei oikeastaan kuullut mitään uutta: \"liian lyhyt\" ja \"pitäisi olla pidempi\" tarkoittavat samaa. Sitten Eetu sanoo: \"Olen sitä mieltä, että välitunnin pitäisi olla pidempi, koska nyt jalkapallopeli jää usein kesken, kun kello soi.\" Nyt muilla on jotain mietittävää. Joku on samaa mieltä, joku vastaa, että peliä voi lyhentää. Eetun lause toi keskusteluun syyn, johon voi vastata. Tässä taidossa opit perustelemaan kantasi niin, että perustelu kertoo syyn ja liittyy juuri siihen asiaan, josta puhutaan."},{"tyyppi":"kappale","otsikko":"Väite, kanta ja perustelu","sisalto":"Väite on lause, josta keskustellaan, esimerkiksi \"Koulun pihalle pitäisi istuttaa lisää puita\". Kanta on se, mitä mieltä sinä olet väitteestä: samaa mieltä vai eri mieltä. Perustelu kertoo, miksi olet sitä mieltä, ja se alkaa usein sanalla koska. Sano kanta ja perustelu yhdessä muodossa \"Olen sitä mieltä, että…, koska…\". Pelkästä kannasta toinen kuulee vain, mitä ajattelet. Perustelusta hän kuulee, miksi, ja silloin hän voi miettiä syytäsi ja vastata siihen. Samaan väitteeseen voi ottaa kumman kannan tahansa, ja kummankin voi perustella hyvin. Taidossa Väite vai mielipide sana väite tarkoitti lausetta, jonka voi tarkistaa. Tässä taidossa väite on lause, johon otetaan kanta. Lausetta \"Välitunnin pitäisi olla pidempi\" ei voi tarkistaa kalenterista eikä mittaamalla. Juuri siksi sitä pitää perustella."},{"tyyppi":"kappale","otsikko":"Liittyykö perustelu juuri tähän väitteeseen","sisalto":"Perustelu liittyy väitteeseen, kun se puhuu samasta asiasta ja kertoo syyn olla väitteen kanssa samaa tai eri mieltä. Hyvä apu on siksi-testi: sano ensin perustelu, sitten sana siksi ja sitten kanta. \"Puut antavat varjoa helteellä, siksi pihalle pitäisi istuttaa lisää puita\" kuulostaa järkevältä, joten perustelu liittyy väitteeseen. \"Koulun kirjastossa on uusia sarjakuvia, siksi pihalle pitäisi istuttaa lisää puita\" ei kuulosta järkevältä, koska sarjakuvat eivät liity puihin. Jos perustelu on väitettä vastaan, tee testi kielteisellä kannalla: \"Lehtiä pitää haravoida syksyllä, siksi pihalle ei pitäisi istuttaa lisää puita.\" Testi kertoo vain, liittyvätkö asiat toisiinsa. Se ei kerro, onko perustelu totta, eikä sitä, muuttaako se kenenkään mieltä. Testi ei myöskään paljasta toistoa: \"Välitunti on liian lyhyt, siksi sen pitäisi olla pidempi\" kuulostaa järkevältä, vaikka siinä ei ole uutta syytä. Siksi tarvitset kolme kysymystä."},{"tyyppi":"saanto","otsikko":"Kolme kysymystä jokaiselle koska-lauseelle","askeleet":["Kertooko koska-lause jotain uutta? Jos se sanoo kannan uudelleen toisin sanoin (\"koska niin pitää olla\", \"koska se on niin\"), se on toisto eikä perustelu.","Puhuuko se samasta asiasta kuin väite? Tee siksi-testi. Jos lause puhuu jostakin muusta, perustelu liittyy toiseen asiaan.","Kertooko se syyn, jota muutkin voivat miettiä? \"Koska minä haluan niin\" kertoo vain puhujasta. Kerro, miksi haluat, niin halusta tulee perustelu.","Jos koska-lause selviää kaikista kolmesta kysymyksestä, se on perustelu, joka liittyy väitteeseen. Se voi olla väitteen puolesta tai sitä vastaan."]},{"tyyppi":"taulukko","otsikko":"Väite: Koulun pihalle pitäisi istuttaa lisää puita","otsikkorivi":["Koska-lause","Mikä se on","Mistä sen tietää"],"rivit":[["koska puut antavat varjoa helteellä","Perustelu väitteen puolesta","Puhuu puista ja kertoo syyn olla samaa mieltä."],["koska puiden lehtiä pitää haravoida syksyllä","Perustelu väitettä vastaan","Puhuu puista ja kertoo syyn olla eri mieltä."],["koska pihalla pitäisi olla enemmän puita","Toisto","Sanoo kannan uudelleen. Uutta syytä ei tule."],["koska koulun kirjastossa on uusia sarjakuvia","Perustelu toiseen asiaan","Puhuu kirjastosta, ei puista."],["koska minä haluan niin","Pelkkä halu","Kertoo puhujasta, ei puista."]]},{"tyyppi":"ansa","otsikko":"Ansa 1: perustelu toistaa väitteen","sisalto":"\"Olen sitä mieltä, että välitunnin pitäisi olla pidempi, koska lyhyt välitunti on liian lyhyt.\" Lause näyttää perustelulta, sillä siinä on sana koska. Koska-sanan jälkeen tulee kuitenkin sama asia toisin sanoin. Kuulija ei saa tietää, miksi välitunnin pitäisi olla pidempi, vaan kuulee kannan kahdesti. Sama ansa piiloutuu lyhyisiin muotoihin: \"koska se on niin\" ja \"koska niin pitää olla\". Lähellä toistoa on myös \"koska se on kivaa\" tai \"koska se on hyvä juttu\": se sanoo vain, että kanta on hyvä, mutta ei kerro, mikä siinä on hyvää. Tunnistat toiston kysymällä: jos poistan kannan, jääkö koska-lauseeseen mitään uutta? Jos ei jää, etsi syy kysymällä, mitä tapahtuisi, jos välitunti olisi pidempi."},{"tyyppi":"ansa","otsikko":"Ansa 2: perustelu puhuu toisesta asiasta","sisalto":"\"Olen sitä mieltä, että koulun pihalle pitäisi saada koripallokori, koska jalkapallo on hauska laji.\" Perustelu kuulostaa melkein sopivalta, koska molemmat ovat pallopelejä. Se puhuu kuitenkin jalkapallosta, ei koripallosta eikä korista. Tällainen perustelu syntyy helposti, kun mieleen tulee jotain samasta aihepiiristä. Siksi-testi paljastaa sen: \"Jalkapallo on hauska laji, siksi pihalle pitäisi saada koripallokori\" ei kuulosta järkevältä. Kun huomaat perustelun lähteneen harhailemaan, palaa väitteeseen ja kysy: mitä juuri tästä asiasta seuraisi?"},{"tyyppi":"ansa","otsikko":"Ansa 3: koska minä haluan","sisalto":"\"Olen sitä mieltä, että koulun pihalle pitäisi hankkia keinulauta, koska minä haluan niin.\" Lause kertoo rehellisesti, mitä puhuja haluaa, mutta muille se ei anna syytä, jota miettiä. Kun väite koskee muitakin, kuten koulun pihaa tai luokan sääntöjä, jokainen voi sanoa haluavansa jotain muuta, eikä keskustelu etene. Korjaus on helppo: kerro, miksi haluat. \"…, koska keinulaudalla kaksi leikkii yhdessä ja harjoittelee samalla tasapainoa\" on perustelu, jota toinenkin voi miettiä. Kun päätät jostakin vain itseäsi koskevasta, esimerkiksi mitä kirjaa luet seuraavaksi, \"koska haluan\" riittää hyvin. Perusteluja tarvitaan, kun kanta koskee muitakin."},{"tyyppi":"kappale","otsikko":"Toinen koska-lause ja koska-ketju","sisalto":"Kun kantasi on perusteltu, lisää vielä yksi koska-lause. Toinen koska-lause tuo uuden syyn samalle kannalle: \"Olen sitä mieltä, että koulun pihalle pitäisi istuttaa lisää puita, koska puut antavat varjoa helteellä, ja koska puiden oksilla linnut voivat tehdä pesiä.\" Syy olla eri mieltä ei sovi toiseksi koska-lauseeksi, koska se kääntyisi omaa kantaasi vastaan. Toinen tapa vahvistaa perustelua on ketju, joka kertoo, mitä syystä seuraa: \"…, koska puut antavat varjoa helteellä, ja siksi pihalla jaksaa leikkiä kuumanakin päivänä.\" Ketju on ehjä, kun jokainen osa jatkaa edellisestä ja koko ketju tukee kantaa. Ketju katkeaa, jos uusi osa lähtee toiseen asiaan: \"…, koska puut antavat varjoa, ja siksi ruokalaan pitäisi saada uudet tuolit.\" Sama rakenne toimii kummallekin kannalle: \"Olen sitä mieltä, että pihalle ei pitäisi istuttaa lisää puita, koska puiden juuret nostaisivat pihan asfalttia, ja siksi pyörällä ajaminen olisi pihalla vaikeampaa.\""},{"tyyppi":"muistilappu","otsikko":"Muista nämä","kohdat":["Olen sitä mieltä, että…, koska…","Perustelu kertoo syyn ja puhuu samasta asiasta kuin väite.","Siksi-testi: perustelu, siksi kanta. Kuulostaako järkevältä?","Toisto sanoo kannan uudelleen. Etsi syy.","Koska minä haluan: kerro, miksi haluat.","Toinen koska-lause tuo uuden syyn samalle kannalle. Ketjussa jokainen osa jatkaa edellisestä.","Kumman tahansa kannan voi perustella hyvin."]}],"harjoitusryhmat":[{"id":"liittyy","nimi":"Liittyykö perustelu väitteeseen","info":"Tee siksi-testi: perustelu, siksi kanta. Perustelu voi olla väitteen puolesta tai sitä vastaan."},{"id":"ansat","nimi":"Kolme ansaa","info":"Toisto, pelkkä halu vai toinen asia? Käy jokainen koska-lause läpi kolmella kysymyksellä."},{"id":"ketju","nimi":"Koska-ketju","info":"Jatkaako jokainen osa edellisestä, ja tukeeko koko ketju samaa kantaa?"}],"harjoitukset":[{"id":"H01","ryhma":"liittyy","kysymys":"Väite: Luokkaan pitäisi hankkia lisää kasveja.\n\nPerustelut:\n1. koska kasvit tekevät luokasta viihtyisämmän\n2. koska koulun pihalla on uusi kiipeilyteline\n3. koska kasvien hoitamisesta oppii huolehtimaan jostakin\n4. koska kasvien kasvua voi seurata viikko viikolta\n5. koska matematiikan tunnilla lasketaan kertolaskuja\n\nMontako näistä perusteluista liittyy juuri tähän väitteeseen?","vastaus":3,"vinkki":"Tee jokaiselle siksi-testi: perustelu, siksi luokkaan pitäisi hankkia lisää kasveja.","selitys":"Perustelut 1, 3 ja 4 puhuvat kasveista ja kertovat syyn. Kiipeilyteline ja kertolaskut eivät liity kasveihin, vaikka ne ovatkin koulun asioita. Väitteeseen liittyy 3 perustelua."},{"id":"H02","ryhma":"liittyy","kysymys":"Väite: Koulun kirjaston pitäisi olla auki myös välitunneilla.\n\nPerustelut:\n1. koska välitunnilla ehtisi vaihtaa luetun kirjan uuteen\n2. koska sadepäivinä välitunnilla voisi lukea sisällä kirjastossa\n3. koska liikuntatunnilla pelataan tänään sählyä\n4. koska välitunnilla joku voi kaivata hiljaista paikkaa\n\nMonesko perustelu ei liity asiaan?","vastaus":3,"vinkki":"Kolme perustelua puhuu kirjastosta tai välitunnista. Mikä puhuu jostain aivan muusta?","selitys":"Perustelu 3 puhuu liikuntatunnin sählystä. Se ei kerro mitään siitä, pitäisikö kirjaston olla auki välitunneilla. Muut kolme kertovat syyn, joka liittyy juuri kirjastoon välitunnilla."},{"id":"H03","ryhma":"liittyy","kysymys":"Perustelu: \"koska silloin ehtii lukea paksunkin kirjan loppuun ennen kuin se pitää palauttaa\"\n\nVäitteet:\n1. Koulun pihalle pitäisi saada koripallokori.\n2. Kirjaston laina-ajan pitäisi olla pidempi.\n3. Luokan istumapaikat pitäisi arpoa joka kuukausi.\n\nMonenteenko väitteeseen perustelu liittyy?","vastaus":2,"vinkki":"Kokeile siksi-testiä jokaisen väitteen kanssa.","selitys":"Kirjan palauttaminen liittyy lainaamiseen. \"Paksunkin kirjan ehtii lukea loppuun, siksi laina-ajan pitäisi olla pidempi\" kuulostaa järkevältä. Koripallokoriin ja istumapaikkoihin perustelu ei liity."},{"id":"H04","ryhma":"liittyy","tyyppi":"monivalinta","kysymys":"Väite: Koulun pihalle pitäisi tehdä lintulauta.\n\nMikä näistä perusteluista liittyy juuri tähän väitteeseen?","vaihtoehdot":["koska talvella linnuilla on vähän ruokaa","koska koulun pihalla on uusi keinu","koska lentokoneet lentävät korkealla"],"vastaus":0,"vinkki":"Yksi vaihtoehdoista on houkutteleva, koska siinä on lentämiseen liittyvä sana. Puhuuko se silti lintulaudasta?","selitys":"Lintulauta antaa linnuille ruokaa, joten talven ruokapula liittyy juuri siihen. Uusi keinu on eri asia, ja lentokoneet liittyvät lintuihin vain siinä, että nekin lentävät."},{"id":"H05","ryhma":"liittyy","kysymys":"Väite: Koulun pihalle pitäisi saada koripallokori.\n\nLuokassa esitettiin nämä perustelut:\n1. Koripalloa voi pelata pienelläkin alueella.\n2. Pallo voi osua ikkunaan ja rikkoa sen.\n3. Koripalloa voi pelata yksinkin heittelemällä.\n4. Kori veisi tilaa, jolla nyt leikitään hippaa.\n5. Koripallossa harjoittelee heittämistä ja tarkkuutta.\n\nMontako näistä perusteluista on väitteen puolesta?","vastaus":3,"vinkki":"Kysy jokaisesta: haluaisiko korin kannattaja vai vastustaja sanoa tämän?","selitys":"Perustelut 1, 3 ja 5 kertovat, mitä hyvää korista olisi. Perustelut 2 ja 4 kertovat haitan, joten ne ovat väitettä vastaan. Kaikki viisi liittyvät väitteeseen, sillä vastaan esitetty perustelu on myös perustelu."},{"id":"H06","ryhma":"liittyy","kysymys":"Väite: Koulun pitäisi alkaa aamulla tuntia myöhemmin.\n\nLuokassa esitettiin nämä perustelut:\n1. Aamulla ehtisi nukkua pidempään.\n2. Koulupäivä loppuisi myöhemmin, ja harrastuksiin jäisi vähemmän aikaa.\n3. Talvella koulumatkalla olisi hieman valoisampaa.\n4. Iltapäivällä olisi vähemmän aikaa leikkiä ulkona valoisaan aikaan.\n5. Väsyneenä on vaikea keskittyä ensimmäisellä tunnilla.\n\nMontako näistä perusteluista on väitettä vastaan?","vastaus":2,"vinkki":"Etsi perustelut, jotka kertovat, mitä huonoa myöhemmästä alkamisesta seuraisi.","selitys":"Perustelut 2 ja 4 kertovat haitan: päivä venyisi ja iltapäivän valoisa aika lyhenisi. Perustelut 1, 3 ja 5 ovat väitteen puolesta. Väitettä vastaan on 2 perustelua."},{"id":"H07","ryhma":"liittyy","kysymys":"Perustelu: \"koska silloin kukaan ei joudu istumaan koko vuotta saman ihmisen vieressä\"\n\nVäitteet:\n1. Kirjaston pitäisi olla auki välitunneilla.\n2. Koulun pihalle pitäisi istuttaa lisää puita.\n3. Luokan istumapaikat pitäisi arpoa joka kuukausi.\n\nMonenteenko väitteeseen perustelu liittyy?","vastaus":3,"vinkki":"Missä väitteessä puhutaan siitä, kuka istuu kenenkin vieressä?","selitys":"Istumapaikkojen arpominen vaihtaa vieruskaverin. \"Kukaan ei joudu istumaan koko vuotta saman ihmisen vieressä, siksi paikat pitäisi arpoa\" kuulostaa järkevältä. Kirjastoon ja puihin perustelu ei liity."},{"id":"H08","ryhma":"ansat","kysymys":"Väite: Luokassa pitäisi olla lautapelipäivä kerran kuukaudessa.\n\nPerustelut:\n1. koska lautapeleissä harjoittelee vuorottelua\n2. koska lautapelipäivä kuuluu pitää kerran kuukaudessa\n3. koska peleissä pitää laskea pisteitä ja siirtoja\n4. koska pelatessa oppii häviämään ja voittamaan reilusti\n\nMonesko perustelu vain toistaa väitteen?","vastaus":2,"vinkki":"Poista kanta mielessäsi. Missä koska-lauseessa ei jää jäljelle mitään uutta?","selitys":"Perustelu 2 sanoo, että lautapelipäivä kuuluu pitää, eli saman asian kuin väite. Se ei kerro, miksi. Muut kertovat, mitä pelipäivästä seuraisi."},{"id":"H09","ryhma":"ansat","kysymys":"Väite: Koulun pihalle pitäisi tehdä kasvimaa.\n\nPerustelut:\n1. koska kasvimaalla näkee, miten siemenestä kasvaa kasvi\n2. koska kasvien hoitaminen opettaa huolehtimaan jostakin\n3. koska minä haluan niin\n4. koska kasvimaalla voi tutkia, mitä kasvit tarvitsevat kasvaakseen\n\nMonesko perustelu kertoo vain puhujan halusta?","vastaus":3,"vinkki":"Mikä koska-lause kertoo puhujasta eikä kasvimaasta?","selitys":"Perustelu 3 kertoo vain, mitä puhuja haluaa. Se ei anna muille syytä miettiä kasvimaata. Muut perustelut kertovat, mitä kasvimaalla oppisi."},{"id":"H10","ryhma":"ansat","kysymys":"Väite: Luokkaan pitäisi hankkia sohva lukunurkkaukseen.\n\nKeskustelu:\n1. Aino: Olen sitä mieltä, että sohva pitäisi hankkia, koska sohvalla on mukavampi lukea pitkään kuin tuolilla.\n2. Leo: Olen sitä mieltä, että sohvaa ei pitäisi hankkia, koska se veisi luokasta paljon tilaa.\n3. Mira: Olen sitä mieltä, että sohva pitäisi hankkia, koska liikuntasalissa on uudet pallot.\n4. Eetu: Olen sitä mieltä, että sohvaa ei pitäisi hankkia, koska sohvasta syntyisi riitaa siitä, kuka saa istua siinä.\n\nMonennessako puheenvuorossa perustelu liittyy toiseen asiaan?","vastaus":3,"vinkki":"Kolme puhujaa puhuu sohvasta. Kuka puhuu jostain muusta?","selitys":"Mira puhuu liikuntasalin palloista, jotka eivät liity sohvaan. Leo ja Eetu ovat eri mieltä kuin Aino, mutta heidän perustelunsa liittyvät sohvaan yhtä lailla."},{"id":"H11","ryhma":"ansat","tyyppi":"monivalinta","kysymys":"Väite: Välitunnin pitäisi olla pidempi.\nSanni perustelee: \"koska minä haluan niin.\"\n\nMiksi tämä ei riitä perusteluksi?","vaihtoehdot":["Koska Sanni puhuu liian lyhyesti.","Koska se kertoo vain Sannin halusta eikä anna muille syytä, jota miettiä.","Koska välitunnin pituudesta ei saa olla mitään mieltä."],"vastaus":1,"vinkki":"Mieti, mitä muut voivat tehdä Sannin lauseella. Voivatko he vastata siihen muuten kuin kertomalla omat halunsa?","selitys":"Sannin lause kertoo vain hänen halustaan. Joku toinen voi haluta toisin, eikä kummallakaan ole syytä, jota voisi miettiä. Välitunnin pituudesta saa olla mitä mieltä tahansa, ja lyhytkin perustelu kelpaa, kun se kertoo syyn."},{"id":"H12","ryhma":"ansat","kysymys":"Väite: Koulun pihalle pitäisi rakentaa katos sadepäiviä varten.\n\nKeskustelu:\n1. Onni: Olen sitä mieltä, että katos pitäisi rakentaa, koska sen alla voisi leikkiä kuivana sateellakin.\n2. Iida: Olen sitä mieltä, että katosta ei pitäisi rakentaa, koska sen alle mahtuisi kerralla vain muutama.\n3. Veeti: Olen sitä mieltä, että katos pitäisi rakentaa, koska pihalla pitäisi olla katos.\n4. Ella: Olen sitä mieltä, että katos pitäisi rakentaa, koska silloin vaatteet eivät kastuisi joka sadepäivä läpimäriksi.\n\nMonennessako puheenvuorossa perustelu vain toistaa kannan?","vastaus":3,"vinkki":"Missä puheenvuorossa koska-sanan jälkeen tulee sama asia kuin ennen sitä?","selitys":"Veeti sanoo, että katos pitäisi rakentaa, koska pihalla pitäisi olla katos. Se on sama asia kahdesti. Onni, Iida ja Ella kertovat syyn, vaikka Iida onkin eri mieltä kuin muut."},{"id":"H13","ryhma":"ansat","kysymys":"Väite: Koulun pihalle pitäisi saada vesipiste, josta voi juoda.\n\nPerustelut:\n1. koska helteellä tulee jano kesken välitunnin\n2. koska minä haluan niin\n3. koska vesipisteestä voi täyttää juomapullon ennen liikuntatuntia\n4. koska pihalla pitäisi olla vesipiste\n5. koska koulun bussi tulee aamulla puoli kahdeksalta\n6. koska sisälle ei tarvitsisi juosta juomaan kesken leikin\n\nMontako näistä koska-lauseista on perusteluja, jotka liittyvät juuri tähän väitteeseen?","vastaus":3,"vinkki":"Käy jokainen koska-lause läpi kolmella kysymyksellä: uutta, samasta asiasta, syy eikä pelkkä halu.","selitys":"Perustelut 1, 3 ja 6 kertovat syyn, joka liittyy vesipisteeseen. Lause 2 on pelkkä halu, lause 4 toistaa väitteen ja lause 5 puhuu bussista. Perusteluja on 3."},{"id":"H14","ryhma":"ansat","kysymys":"Väite: Jokaisen pitäisi vuorollaan hoitaa luokan kasveja.\n\nPerustelut:\n1. koska silloin jokainen oppii kastelemaan kasveja\n2. koska niin se vain on\n3. koska yksin hoitaja voi unohtaa kastelun tai olla sairaana\n4. koska minä tahdon niin\n5. koska koulun pihalla sataa usein syksyllä\n\nMontako näistä koska-lauseista on ansoja: toistoja, pelkkiä haluja tai perusteluja toiseen asiaan?","vastaus":3,"vinkki":"Etsi toisto, pelkkä halu ja lause, joka puhuu jostain muusta kuin kasvien hoitamisesta.","selitys":"Lause 2 ei kerro syytä, lause 4 kertoo vain puhujan tahdon, ja lause 5 puhuu sateesta pihalla. Lauseet 1 ja 3 ovat perusteluja. Ansoja on 3."},{"id":"H15","ryhma":"ketju","kysymys":"Alku: \"Olen sitä mieltä, että koulun eteen pitäisi maalata suojatie, koska silloin autoilijat näkevät, mistä kohtaa lapset ylittävät kadun, ja siksi …\"\n\nJatkot:\n1. välitunnilla pitäisi saada pelata jalkapalloa\n2. kadun ylittäminen koulumatkalla olisi turvallisempaa\n3. koulun ruokalaan pitäisi saada uudet tuolit\n\nMonesko jatko tekee ketjusta ehjän?","vastaus":2,"vinkki":"Jatkon pitää kertoa, mitä seuraa siitä, että autoilijat näkevät ylityskohdan.","selitys":"Kun autoilijat tietävät, mistä lapset ylittävät kadun, ylittäminen on turvallisempaa. Jatko 2 jatkaa edellisestä ja tukee kantaa. Jalkapallo ja ruokalan tuolit eivät seuraa suojatiestä."},{"id":"H16","ryhma":"ketju","kysymys":"Ketjut:\n1. Olen sitä mieltä, että koulun ovien eteen pitäisi laittaa isot kuramatot, koska kengistä irtoaa kuraa matolle, ja siksi luokkien lattiat pysyisivät puhtaampina.\n2. Olen sitä mieltä, että kirjaston laina-ajan pitäisi olla pidempi, koska paksun kirjan lukemiseen menee aikaa, ja siksi koulun pihalle tarvitaan uusi keinu.\n3. Olen sitä mieltä, että luokkaan pitäisi hankkia akvaario, koska kalat tarvitsevat ruokaa joka päivä, ja siksi jokainen pääsisi vuorollaan harjoittelemaan eläimen hoitamista.\n4. Olen sitä mieltä, että koulun käytävillä ei pitäisi saada juosta, koska juoksija voi törmätä nurkan takaa tulevaan, ja siksi käytävillä pitäisi olla enemmän tauluja.\n\nMontako näistä ketjuista on ehjiä?","vastaus":2,"vinkki":"Lue jokaisesta ketjusta siksi-osa. Seuraako se koska-osasta?","selitys":"Ketjut 1 ja 3 ovat ehjiä: kura jää matolle, joten lattiat pysyvät puhtaampina, ja päivittäinen ruokinta antaa jokaiselle hoitovuoron. Ketjussa 2 keinu ei seuraa kirjan lukemisesta, ja ketjussa 4 taulut eivät seuraa törmäämisestä."},{"id":"H17","ryhma":"ketju","tyyppi":"monivalinta","kysymys":"Alku: \"Olen sitä mieltä, että luokan istumapaikat pitäisi arpoa joka kuukausi, koska silloin tutustuu uusiin ihmisiin, ja koska …\"\n\nMikä näistä sopii toiseksi koska-lauseeksi?","vaihtoehdot":["istumapaikat pitäisi arpoa","kukaan ei jää pysyvästi paikalle, josta ei näe hyvin eteen","arpajaisissa voi voittaa palkintoja"],"vastaus":1,"vinkki":"Toisen koska-lauseen pitää tuoda uusi syy samalle kannalle.","selitys":"Vaihtoehto 2 tuo uuden syyn: arpominen vaihtaa myös huonon paikan. Ensimmäinen toistaa kannan, ja arpajaisten palkinnot liittyvät istumapaikkoihin vain sanan arpa kautta."},{"id":"H18","ryhma":"ketju","kysymys":"Alku: \"Olen sitä mieltä, että koulun pihalle pitäisi tehdä luistelukenttä talveksi, koska luistelu on talvella hyvää liikuntaa, ja koska …\"\n\nEhdotukset toiseksi koska-lauseeksi:\n1. jäällä voi leikkiä hippaa luistimilla\n2. minä haluan niin\n3. kesällä pihalla on kuuma\n4. kentällä voi harjoitella luistelua ilman pitkää matkaa jäähalliin\n5. kentän jäädyttäminen vaatii paljon vettä ja työtä\n\nMontako ehdotuksista sopii toiseksi koska-lauseeksi?","vastaus":2,"vinkki":"Sopiva lause tuo uuden syyn ja tukee samaa kantaa. Syy olla eri mieltä ei sovi.","selitys":"Ehdotukset 1 ja 4 tuovat uuden syyn kentän puolesta. Ehdotus 2 on pelkkä halu, 3 puhuu kesästä, ja 5 on syy olla eri mieltä, joten se kääntyisi kantaa vastaan."},{"id":"H19","ryhma":"ketju","kysymys":"Ketju osina:\n1. Olen sitä mieltä, että koulukirjaston pitäisi olla auki myös välitunneilla,\n2. koska silloin kirjan voisi vaihtaa uuteen heti, kun edellinen on luettu,\n3. ja siksi lukemista ei tarvitsisi keskeyttää monen päivän ajaksi,\n4. ja siksi koulun pihalle pitäisi hankkia lisää penkkejä.\n\nMonesko osa ei liity edelliseen osaan?","vastaus":4,"vinkki":"Lue osat pareittain: 1 ja 2, 2 ja 3, 3 ja 4. Missä kohdassa ketju hyppää toiseen asiaan?","selitys":"Osa 2 perustelee kantaa, ja osa 3 kertoo, mitä osasta 2 seuraa. Osa 4 puhuu pihan penkeistä, jotka eivät seuraa lukemisesta. Ketju katkeaa osassa 4."},{"id":"H20","ryhma":"ketju","kysymys":"Ketjut:\n1. Olen sitä mieltä, että koulun pihalle pitäisi tehdä kasvimaa, koska kasvit tarvitsevat hoitoa joka viikko, ja siksi luokan pitäisi mennä retkelle museoon.\n2. Olen sitä mieltä, että pyöräillessä pitäisi käyttää kypärää, koska kypärä suojaa päätä kaatuessa, ja siksi pyöräilijä selviää kaatumisesta useammin ilman pahaa päävammaa.\n3. Olen sitä mieltä, että luokassa pitäisi olla hiljainen nurkka, koska väsynyt voi levätä siellä hetken, ja siksi hän jaksaa taas jatkaa tehtäviä.\n4. Olen sitä mieltä, että pihalle pitäisi hankkia lisää roska-astioita, koska silloin roskat päätyisivät useammin astiaan, ja siksi piha pysyisi siistimpänä.\n5. Olen sitä mieltä, että pihalle ei pitäisi tehdä luistelukenttää, koska kentän jäädyttäminen vaatii paljon työtä, ja siksi talonmieheltä jäisi muita töitä tekemättä.\n\nMontako näistä ketjuista on ehjiä?","vastaus":4,"vinkki":"Ketju voi olla ehjä kummankin kannan puolesta. Katso vain, jatkaako siksi-osa koska-osasta.","selitys":"Ketjut 2, 3, 4 ja 5 ovat ehjiä. Ketjussa 1 museoretki ei seuraa kasvien hoidosta. Ketju 5 on eri kannalla kuin muut, mutta se on silti ehjä: jäädyttämisen työ vie talonmiehen aikaa muilta töiltä."}],"valmis_teksti":"Osaat perustella kantasi niin, että perustelu kertoo syyn ja liittyy juuri siihen asiaan, josta puhutaan, ja osaat lisätä toisen koska-lauseen samalle kannalle. Tämä taito on nyt näytetty."};

const svg=document.getElementById("nlsvg"), rng=document.getElementById("nlrange"), out=document.getElementById("nlout");
const X0=34, X1=606, Y=62;
function piirraNL(v){
  const ala=Math.floor(v/10)*10, yla=ala+10, puoli=ala+5;
  const pyor = (v%10)>=5 ? yla : ala;
  const x = n => X0 + (n/100)*(X1-X0);
  let s=`<line class="rail" x1="${X0}" y1="${Y}" x2="${X1}" y2="${Y}"/>`;
  for(let n=0;n<=100;n+=10){
    const near = (n===ala||n===yla);
    s+=`<line class="tick" x1="${x(n)}" y1="${Y-7}" x2="${x(n)}" y2="${Y+7}"/>`;
    s+=`<text class="stop${near?" near":""}" x="${x(n)}" y="${Y+24}" text-anchor="middle">${n}</text>`;
  }
  s+=`<line class="halfway" x1="${x(puoli)}" y1="${Y-16}" x2="${x(puoli)}" y2="${Y+12}"/>`;
  s+=`<text class="stop" x="${x(puoli)}" y="${Y-22}" text-anchor="middle">puoliväli ${puoli}</text>`;
  s+=`<circle class="dot" cx="${x(v)}" cy="${Y}" r="6"/>`;
  s+=`<text class="val" x="${x(v)}" y="${Y-32}" text-anchor="middle">${v}</text>`;
  s+=`<path d="M ${x(v)} ${Y+38} L ${x(pyor)} ${Y+38}" stroke="var(--core)" stroke-width="2" fill="none"/>`;
  s+=`<path d="M ${x(pyor)} ${Y+38} l ${x(pyor)>x(v)?-7:7} -4 l 0 8 z" fill="var(--core)"/>`;
  svg.innerHTML=s;
  out.textContent = `${v} pyöristyy → ${pyor}`;
}

/* ---------- laskujärjestys-widget ---------- */
const ljExp=document.getElementById("ljExp");
if(ljExp && D.kokeilu){
  let ljI=0, ljTokens=[], ljStep=0;
  const laske=(a,op,b)=>{a=+a;b=+b;return op==="×"?a*b:op==="÷"?a/b:op==="+"?a+b:a-b;};
  function ljAlku(){
    const l=D.kokeilu[ljI];
    ljTokens=l.lauseke.replace(/\(/g,"( ").replace(/\)/g," )").split(/\s+/).filter(Boolean);
    ljStep=0; ljPiirra(); ljViesti("","");
  }
  function ljViesti(t,lk){const f=document.getElementById("ljFb"); f.textContent=t; f.className="lj-fb "+(lk||"");}
  function ljPiirra(){
    const l=D.kokeilu[ljI];
    document.getElementById("ljStep").textContent =
      ljStep>=l.askeleet.length ? "valmis" : `askel ${ljStep+1} / ${l.askeleet.length}`;
    if(ljStep>=l.askeleet.length){
      ljExp.innerHTML=`<span class="valmis">${l.lauseke} = ${l.vastaus}</span>`;
      return;
    }
    ljExp.innerHTML=ljTokens.map((t,i)=>
      "×÷+−".includes(t) ? `<button type="button" class="op" data-i="${i}">${t}</button>`
                         : `<span class="tok">${t}</span>`).join("");
    ljExp.querySelectorAll("button.op").forEach(b=>b.addEventListener("click",()=>ljKlikkaa(+b.dataset.i)));
  }
  function ljKlikkaa(i){
    const l=D.kokeilu[ljI], odotettu=l.askeleet[ljStep];
    const ehdotus=[ljTokens[i-1],ljTokens[i],ljTokens[i+1]].join(" ");
    if(ehdotus!==odotettu){
      ljViesti(ljStep===0
        ? "Ei vielä. Sulkeet ovat vahvimmat, sitten kerto ja jako. Yhtä vahvat vasemmalta oikealle."
        : "Ei vielä. Kumpi jäljellä olevista on vahvempi?", "no");
      return;
    }
    const arvo=laske(ljTokens[i-1],ljTokens[i],ljTokens[i+1]);
    let alku=i-1, loppu=i+1;
    if(ljTokens[i-2]==="(" && ljTokens[i+2]===")"){ alku=i-2; loppu=i+2; }
    ljTokens.splice(alku, loppu-alku+1, String(arvo));
    ljStep++;
    ljViesti(ljStep>=l.askeleet.length ? "Valmis. Vastaus on "+l.vastaus+"." : "Oikein. Jatka seuraavaan.", "ok");
    ljPiirra();
  }
  document.getElementById("ljSeuraava").addEventListener("click",()=>{
    ljI=(ljI+1)%D.kokeilu.length; ljAlku();
  });
  ljAlku();
}

/* Suomalainen lukumuoto: välilyönti on tuhaterotin, pilkku desimaalierotin.
   Piste voi olla kumpi tahansa. Se tulkitaan tuhaterottimeksi VAIN silloin, kun
   koko luku on aitoa tuhaterotinmuotoa: alkuosa 1–3 numeroa ilman etunollaa ja
   jokainen jatko-osa täsmälleen 3 numeroa (1.500, 12.345.678). Kaikissa muissa
   tapauksissa piste on desimaalipiste — myös 0.125, joka vanhalla säännöllä
   ("3 numeroa pisteen jäljessä = tuhaterotin") luettiin virheellisesti luvuksi 125. */
const TUHATEROTIN = /^[1-9]\d{0,2}(\.\d{3})+$/;
function lueLuku(teksti){
  // Murtoluku (3/4, -3/4) ja sekaluku (1 2/3, -1 2/3) hyväksytään sellaisinaan.
  const raaka = String(teksti).replace(/\u00a0/g, " ").trim();
  let m = raaka.match(/^(-?)(\d+)\s+(\d+)\s*\/\s*(\d+)$/);
  if(m){ const nim = Number(m[4]); if(nim === 0) return null;
    const v = Number(m[2]) + Number(m[3]) / nim; return m[1] ? -v : v; }
  m = raaka.match(/^(-?)\s*(\d+)\s*\/\s*(\d+)$/);
  if(m){ const nim = Number(m[3]); if(nim === 0) return null;
    const v = Number(m[2]) / nim; return m[1] ? -v : v; }
  let s = String(teksti).replace(/[\s\u00a0]/g, "");
  if(s === "") return null;
  if(s.indexOf(",") >= 0){
    s = s.replace(/\./g, "").replace(",", ".");
  } else if(TUHATEROTIN.test(s)){
    s = s.replace(/\./g, "");
  }
  const n = Number(s);
  return Number.isFinite(n) ? n : null;
}

function tarkista(id){
  const h=D.harjoitukset.find(x=>x.id===id);
  const kentta=document.getElementById("in-"+id);
  const fb=document.getElementById("fb-"+id);
  if(kentta.value.trim()===""){ fb.className="fb hint"; fb.textContent="Kirjoita vastaus ensin."; return; }
  const luku=lueLuku(kentta.value);
  if(luku===null){ fb.className="fb no"; fb.textContent="Vastauksen pitää olla luku tai murtoluku (esimerkiksi 3/4)."; return; }
  const oikein = Math.abs(luku - h.vastaus) < 1e-9;
  merkitseTulos(id, oikein, oikein ? "Oikein. "+h.selitys : `Ei vielä. ${h.vinkki} Kokeile uudelleen.`);
}

function tarkistaMonivalinta(id, valittuIndeksi, painike){
  const h=D.harjoitukset.find(x=>x.id===id);
  const rivi=painike.closest(".row");
  rivi.querySelectorAll(".mv-valinta").forEach(b=>b.disabled=true);
  const oikein = valittuIndeksi===h.vastaus;
  painike.classList.add(oikein?"mv-oikein":"mv-vaarin");
  if(!oikein){
    const oikeaBtn=rivi.querySelector(`[data-i="${h.vastaus}"]`);
    if(oikeaBtn) oikeaBtn.classList.add("mv-oikein");
  }
  merkitseTulos(id, oikein, oikein ? "Oikein. "+h.selitys : `Ei ihan. Oikea vastaus on korostettu. ${h.selitys||""}`);
}

/* Kuuntelu: selain lukee tekstin ääneen omalla puhesynteesillään (englanniksi, jos laitteessa on
   englanninkielinen ääni). Ei äänitiedostoja eikä verkkoyhteyttä. Jos laite ei osaa puhua,
   teksti näytetään luettavaksi — silloin tehtävä muuttuu luetun ymmärtämiseksi, mutta ei katkea. */
function puhu(id, nopeus){
  const h=D.harjoitukset.find(x=>x.id===id); if(!h || !h.kuuntele) return;
  const vara=document.getElementById("vara-"+id);
  const naytaTeksti=syy=>{ vara.hidden=false; vara.textContent=syy+" Teksti: "+h.kuuntele; };
  if(!("speechSynthesis" in window)){ naytaTeksti("Tämä laite ei osaa lukea ääneen."); return; }
  const s=window.speechSynthesis; s.cancel();
  const u=new SpeechSynthesisUtterance(h.kuuntele);
  u.lang=h.kieli||"en-GB"; u.rate=nopeus;
  const aanet=s.getVoices(), kieli=u.lang.slice(0,2);
  const aani=aanet.find(a=>a.lang===u.lang) || aanet.find(a=>a.lang && a.lang.startsWith(kieli));
  if(aani) u.voice=aani;
  else if(aanet.length) { naytaTeksti("Laitteessa ei ole englanninkielistä ääntä."); return; }
  u.onerror=()=>naytaTeksti("Ääneen lukeminen ei onnistunut.");
  s.speak(u);
}
