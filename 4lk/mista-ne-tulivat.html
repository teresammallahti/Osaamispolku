<title>Mistä ne tulivat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">

<style>
:root{
  --paper:#EFF2F5; --surface:#FFFFFF; --surface-2:#F7F9FB;
  --grid:#DCE3EA; --line:#C9D3DC;
  --ink:#15222C; --ink-2:#4E626F; --ink-3:#7E8F9B;
  --core:#1B5A9E; --core-soft:#E4EDF6;
  --strong:#1F6E5C; --strong-soft:#E1F0EB;
  --chal:#9A6A16; --chal-soft:#F6EDDC;
  --alert:#A33A2B; --alert-soft:#F8E7E3;
  --shadow:0 1px 2px rgba(21,34,44,.06), 0 8px 24px -12px rgba(21,34,44,.18);
  --r:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0F161B; --surface:#18222A; --surface-2:#1D2830;
    --grid:#22303A; --line:#2E3E4A;
    --ink:#E8EFF4; --ink-2:#A3B4C0; --ink-3:#7A8B97;
    --core:#7FB2E4; --core-soft:#16303F;
    --strong:#77CDB4; --strong-soft:#123028;
    --chal:#E0B267; --chal-soft:#33270F;
    --alert:#E8907F; --alert-soft:#3A1E19;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -14px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --paper:#0F161B; --surface:#18222A; --surface-2:#1D2830;
  --grid:#22303A; --line:#2E3E4A;
  --ink:#E8EFF4; --ink-2:#A3B4C0; --ink-3:#7A8B97;
  --core:#7FB2E4; --core-soft:#16303F;
  --strong:#77CDB4; --strong-soft:#123028;
  --chal:#E0B267; --chal-soft:#33270F;
  --alert:#E8907F; --alert-soft:#3A1E19;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -14px rgba(0,0,0,.7);
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:16px; line-height:1.62;
  background-image:
    linear-gradient(to right, var(--grid) 1px, transparent 1px),
    linear-gradient(to bottom, var(--grid) 1px, transparent 1px);
  background-size:26px 26px;
}
.wrap{max-width:760px; margin:0 auto; padding:28px 20px 90px}
h1,h2,h3,h4{font-family:"Familjen Grotesk","IBM Plex Sans",system-ui,sans-serif; text-wrap:balance}

/* header */
header.top{background:var(--surface); border:1px solid var(--line); border-radius:var(--r);
  box-shadow:var(--shadow); padding:22px 24px; display:flex; gap:18px; align-items:flex-start}
.badge{flex:0 0 auto; width:54px; height:54px; border-radius:9px; display:grid; place-items:center;
  background:var(--core-soft); border:1px solid var(--core); color:var(--core)}
.badge svg{width:28px; height:28px; fill:none; stroke:currentColor; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round}
.eyebrow{font-family:"IBM Plex Mono",monospace; font-size:11px; letter-spacing:.14em;
  text-transform:uppercase; color:var(--ink-3); margin:0 0 5px}
header.top h1{margin:0; font-size:30px; font-weight:700; letter-spacing:-.015em}
header.top p{margin:5px 0 0; color:var(--ink-2); font-size:15px}
.tags{display:flex; flex-wrap:wrap; gap:5px; margin-top:11px}
.tag{font-family:"IBM Plex Mono",monospace; font-size:10.5px; letter-spacing:.05em; padding:2px 7px;
  border-radius:4px; background:var(--surface-2); border:1px solid var(--line); color:var(--ink-3)}
.tag.core{background:var(--core-soft); border-color:var(--core); color:var(--core)}

/* teksti */
article{margin-top:26px}
article h2{font-size:21px; font-weight:600; margin:32px 0 10px; letter-spacing:-.01em}
article p{margin:0 0 14px; max-width:64ch}
.lead{font-size:17.5px; color:var(--ink); border-left:3px solid var(--core); padding-left:16px; margin:0 0 8px}

.box{background:var(--surface); border:1px solid var(--line); border-radius:var(--r);
  padding:18px 22px; box-shadow:var(--shadow); margin:22px 0}
.box h3{margin:0 0 12px; font-size:16.5px; font-weight:600}
.box.warn{border-left:3px solid var(--alert)}
.box.note{border-left:3px solid var(--chal)}

ol.steps{margin:0; padding-left:0; list-style:none; counter-reset:s; display:grid; gap:12px}
ol.steps li{counter-increment:s; display:grid; grid-template-columns:auto 1fr; gap:13px; align-items:start}
ol.steps li::before{content:counter(s); font-family:"Familjen Grotesk",sans-serif; font-weight:700; font-size:14px;
  width:26px; height:26px; border-radius:50%; background:var(--core); color:#fff; display:grid; place-items:center; margin-top:2px}

ul.notes{margin:0; padding-left:19px}
ul.notes li{margin-bottom:7px}
ul.notes li:last-child{margin-bottom:0}

.tablewrap{overflow-x:auto}
table{border-collapse:collapse; width:100%; font-size:14.5px; min-width:460px}
th,td{text-align:left; padding:9px 13px; border-bottom:1px solid var(--line)}
th{font-family:"IBM Plex Mono",monospace; font-size:10.5px; letter-spacing:.1em; text-transform:uppercase;
  color:var(--ink-3); font-weight:400; background:var(--surface-2)}
tr:last-child td{border-bottom:0}
td b{color:var(--core); font-weight:600}
td:last-child{font-variant-numeric:tabular-nums; font-weight:600}

/* lukusuora */
.nl svg{width:100%; height:118px; display:block}
.nl .rail{stroke:var(--line); stroke-width:2}
.nl .tick{stroke:var(--line); stroke-width:1.5}
.nl .stop{fill:var(--ink-3); font-family:"IBM Plex Mono",monospace; font-size:11px}
.nl .stop.near{fill:var(--core); font-weight:600}
.nl .dot{fill:var(--chal)}
.nl .val{fill:var(--ink); font-family:"Familjen Grotesk",sans-serif; font-size:15px; font-weight:700}
.nl .halfway{stroke:var(--chal); stroke-dasharray:3 3; stroke-width:1.5}
.nl-controls{display:flex; align-items:center; gap:14px; margin-top:6px}
.nl-controls input{flex:1; accent-color:var(--core)}
.nl-out{font-family:"Familjen Grotesk",sans-serif; font-size:15px; font-weight:600; min-width:12.5em; text-align:right}

/* paikka-arvotaulu */
.box .ohje{margin:0 0 14px; font-size:14.5px; color:var(--ink-2)}
.nt-valinta{display:flex; flex-wrap:wrap; gap:7px; margin-bottom:16px}
.nt-valinta button{font:inherit; font-size:12.5px; font-family:"IBM Plex Mono",monospace; padding:5px 11px;
  border-radius:6px; border:1px solid var(--line); background:var(--surface-2); color:var(--ink-2); cursor:pointer}
.nt-valinta button[aria-pressed="true"]{background:var(--ink); color:var(--paper); border-color:var(--ink)}
.nt-valinta button:focus-visible{outline:2px solid var(--core); outline-offset:2px}
.nt-taulu{display:flex; flex-direction:column; gap:4px; align-items:flex-start; overflow-x:auto; padding-bottom:4px}
.nt-rivi{display:flex; gap:6px; align-items:center}
.nt-rivi .otsa{font-family:"IBM Plex Mono",monospace; font-size:9.5px; letter-spacing:.08em;
  text-transform:uppercase; color:var(--ink-3); width:52px; text-align:center}
.nt-ruutu{width:52px; height:52px; display:grid; place-items:center; border:1.5px solid var(--line);
  border-radius:7px; background:var(--surface-2); font-family:"IBM Plex Mono",monospace; font-size:24px}
.nt-ruutu.kohta{border-color:var(--core); background:var(--core-soft); color:var(--core); font-weight:500}
.nt-ruutu.ratkaiseva{border-color:var(--chal); background:var(--chal-soft); color:var(--chal); font-weight:500}
.nt-ruutu.nolla{color:var(--ink-3)}
.nt-rivi .nimi{font-size:12.5px; color:var(--ink-3); margin-left:12px; white-space:nowrap}
.nt-nuoli{font-size:17px; color:var(--chal); margin-left:6px}
.nt-selite{margin:14px 0 0; font-size:14.5px}
.nt-selite b{color:var(--core)}

/* vahvuusportaat */
.vp-tasot{display:grid; gap:9px; margin-bottom:18px}
.vp-taso{display:flex; gap:11px; align-items:flex-start; font-size:13.5px}
.vp-taso .vp-pallo{width:13px; height:13px; border-radius:4px; margin-top:5px; flex:0 0 auto}
.vp-taso[data-taso="sulkeet"] .vp-pallo{background:var(--core)}
.vp-taso[data-taso="kertojako"] .vp-pallo{background:var(--strong)}
.vp-taso[data-taso="yhteenvahennys"] .vp-pallo{background:var(--chal)}
.vp-taso strong{display:block; font-family:"Familjen Grotesk",sans-serif; font-weight:600; font-size:14.5px}
.vp-taso span{color:var(--ink-2)}
.vp-lauseke{display:flex; flex-wrap:wrap; gap:7px; align-items:flex-end; font-family:"IBM Plex Mono",monospace;
  font-size:25px; padding:10px 2px; min-height:64px}
.vp-lauseke .t{padding:2px 3px}
.vp-lauseke .op{position:relative; padding:2px 9px; border-radius:6px; font-weight:500}
.vp-lauseke .op[data-taso="sulkeet"]{background:var(--core-soft); color:var(--core)}
.vp-lauseke .op[data-taso="kertojako"]{background:var(--strong-soft); color:var(--strong)}
.vp-lauseke .op[data-taso="yhteenvahennys"]{background:var(--chal-soft); color:var(--chal)}
.vp-lauseke .op i{position:absolute; top:-9px; right:-6px; font-style:normal; font-family:"Familjen Grotesk",sans-serif;
  font-size:11px; font-weight:700; width:18px; height:18px; border-radius:50%; display:grid; place-items:center;
  background:currentColor}
.vp-lauseke .op i span{color:var(--surface)}
.vp-rivi{display:flex; align-items:center; gap:16px; margin-top:8px}
.vp-vastaus{font-family:"Familjen Grotesk",sans-serif; font-size:16px; font-weight:600; color:var(--strong)}

/* laskujärjestys-widget */
.lj-exp{display:flex; flex-wrap:wrap; gap:7px; align-items:center; font-family:"IBM Plex Mono",monospace;
  font-size:23px; padding:14px 4px; min-height:62px}
.lj-exp .tok{padding:2px 4px; color:var(--ink)}
.lj-exp button.op{font-family:"IBM Plex Mono",monospace; font-size:23px; padding:3px 12px; border-radius:7px;
  border:1.5px solid var(--line); background:var(--surface-2); color:var(--ink); line-height:1.2}
.lj-exp button.op:hover{border-color:var(--core); color:var(--core)}
.lj-exp button.op:focus-visible{outline:2px solid var(--core); outline-offset:2px}
.lj-exp .valmis{font-family:"Familjen Grotesk",sans-serif; font-size:23px; font-weight:700; color:var(--strong)}
.lj-fb{font-size:14.5px; min-height:1.5em; color:var(--ink-2)}
.lj-fb.no{color:var(--alert)}
.lj-fb.ok{color:var(--strong)}
.lj-row{display:flex; align-items:center; gap:14px; margin-top:10px}
.lj-step{font-family:"IBM Plex Mono",monospace; font-size:11.5px; letter-spacing:.1em;
  text-transform:uppercase; color:var(--ink-3)}

/* harjoitukset */
.progress{position:sticky; top:0; z-index:5; background:var(--surface); border:1px solid var(--line);
  border-radius:var(--r); padding:12px 18px; box-shadow:var(--shadow); display:flex; align-items:center;
  gap:14px; margin:34px 0 18px}
.progress .lbl{font-family:"IBM Plex Mono",monospace; font-size:11px; letter-spacing:.12em;
  text-transform:uppercase; color:var(--ink-3); white-space:nowrap}
.progress .meter{flex:1; height:7px; border-radius:4px; background:var(--surface-2); border:1px solid var(--line); overflow:hidden}
.progress .meter i{display:block; height:100%; background:var(--core); transition:width .25s ease}
.progress .cnt{font-family:"Familjen Grotesk",sans-serif; font-weight:700; font-variant-numeric:tabular-nums; white-space:nowrap}

.grp{margin-top:26px}
.grp-head{display:flex; align-items:baseline; gap:10px; border-bottom:1.5px solid var(--ink); padding-bottom:7px; margin-bottom:14px}
.grp-head h3{margin:0; font-size:17px; font-weight:600}
.grp-head span{font-size:12.5px; color:var(--ink-2)}

.ex{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:14px 16px; margin-bottom:10px}
.ex[data-tila="oikein"]{border-color:var(--strong); box-shadow:inset 3px 0 0 var(--strong)}
.ex[data-tila="vaarin"]{border-color:var(--alert); box-shadow:inset 3px 0 0 var(--alert)}
.ex .q{display:flex; gap:11px; align-items:baseline; flex-wrap:wrap}
.ex .num{font-family:"IBM Plex Mono",monospace; font-size:11.5px; color:var(--ink-3); min-width:2.4em}
.ex .txt{flex:1; min-width:190px; font-size:15.5px}
.ex .txt .aineisto{display:block; margin-bottom:9px; padding-left:12px;
  border-left:2px solid var(--line); color:var(--ink-2); line-height:1.6;
  /* Aineisto voi olla pieni taulukko, jonka rivit on erotettu rivinvaihdoilla.
     Ilman pre-lineä ne valuisivat yhdeksi kappaleeksi ja taulukko katoaisi. */
  white-space:pre-line}
.ex .txt .kysymysrivi{display:block; font-weight:600}
.ex .row{display:flex; gap:8px; align-items:center; margin-top:11px; flex-wrap:wrap}
.ex input[type=text]{font:inherit; font-family:"IBM Plex Mono",monospace; font-size:15px; width:8.5em;
  padding:7px 11px; border:1px solid var(--line); border-radius:7px; background:var(--surface-2);
  color:var(--ink); text-align:right}
.ex input:focus-visible{outline:2px solid var(--core); outline-offset:1px}
button{font:inherit; cursor:pointer}
.btn{font-size:13.5px; padding:7px 15px; border-radius:7px; border:1px solid var(--core);
  background:var(--core); color:#fff}
.btn.ghost{background:transparent; color:var(--ink-2); border-color:var(--line)}
.btn:focus-visible{outline:2px solid var(--core); outline-offset:2px}
.btn.mv-valinta{text-align:left}
/* kuuntelutehtävä: selaimen puhesynteesi lukee englanninkielisen tekstin */
.kuuntele{display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin:2px 0 10px}
.kuuntele .btn{display:inline-flex; gap:7px; align-items:center}
.kuuntele svg{width:16px; height:16px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round}
.kuuntele .varateksti{flex-basis:100%; font-size:14px; color:var(--ink-2); background:var(--surface-2);
  border-radius:7px; padding:8px 12px; margin:0}
.btn.mv-valinta:disabled{cursor:default; opacity:.65}
.btn.mv-oikein{background:var(--strong-soft); border-color:var(--strong); color:var(--strong); opacity:1}
.btn.mv-vaarin{background:var(--alert-soft); border-color:var(--alert); color:var(--alert); opacity:1}
.row.mv{gap:8px 10px}
.fb{margin-top:11px; font-size:14.5px; padding:10px 13px; border-radius:8px; line-height:1.5}
.fb.ok{background:var(--strong-soft); color:var(--strong)}
.fb.no{background:var(--alert-soft); color:var(--alert)}
.fb.hint{background:var(--chal-soft); color:var(--chal)}

.done{background:var(--strong-soft); border:1px solid var(--strong); color:var(--strong);
  border-radius:var(--r); padding:16px 20px; margin-top:20px; font-size:15.5px}
.done h3{margin:0 0 4px; font-size:17px; color:var(--strong)}

details.teacher{margin-top:34px; background:var(--surface); border:1px solid var(--line);
  border-left:3px solid var(--chal); border-radius:var(--r); padding:15px 20px; box-shadow:var(--shadow)}
details.teacher summary{cursor:pointer; font-family:"Familjen Grotesk",sans-serif; font-weight:600; font-size:15px}
details.teacher summary:focus-visible{outline:2px solid var(--core); outline-offset:3px}
details.teacher ul{margin:12px 0 0; padding-left:19px; color:var(--ink-2); font-size:14.5px}
details.teacher li{margin-bottom:8px}
details.teacher p{margin:12px 0 0; color:var(--ink-2); font-size:14.5px}

.back{display:inline-block; margin-top:30px; font-size:13.5px; color:var(--ink-2)}
.back a{color:var(--core)}

@media (prefers-reduced-motion: reduce){*{transition:none !important}}
@media (max-width:560px){
  .wrap{padding:16px 13px 70px}
  header.top h1{font-size:25px}
  .progress{flex-wrap:wrap}
}
</style>

<div class="wrap">

  <header class="top">
    <span class="badge"><svg viewBox="0 0 24 24" aria-hidden="true" id="ikoni"></svg></span>
    <div>
      <p class="eyebrow" id="eyebrow"></p>
      <h1 id="otsikko"></h1>
      <p id="kuvaus"></p>
      <div class="tags" id="tags"></div>
    </div>
  </header>

  <article id="teksti"></article>

  <div class="progress" aria-live="polite">
    <span class="lbl">Harjoitukset</span>
    <span class="meter"><i id="pbar" style="width:0%"></i></span>
    <span class="cnt" id="pcnt">0 / 20</span>
  </div>

  <div id="harjoitukset"></div>
  <div id="valmis"></div>

  <p class="back" id="back"></p>

</div>

<script>
const D = {"tavoite_id":"ET4-KAT-02","oppiaine":"ET","vuosiluokka":4,"taso":"ydin","otsikko":"Mistä ne tulivat","kuvaus":"Osaan kertoa, missä päin maailmaa ja missä järjestyksessä juutalaisuus, kristinusko ja islam syntyivät.","versio":"0.2","paivitetty":"2026-09-26","ops":{"T":["T5","T6"],"S":["S2"]},"eyebrow":"Elämänkatsomustieto · 4. luokka · Katsomukset ja niiden historia","ikoni":"kartta","teksti":[{"tyyppi":"johdanto","sisalto":"Illalla televisiossa on matkaohjelma Jerusalemista. Juontaja kävelee vanhan kaupungin kujilla ja näyttää alle kilometrin säteellä kolme paikkaa: juutalaisten pyhän Länsimuurin, kristittyjen Pyhän haudan kirkon ja muslimien al-Aqsan moskeijan. Miksi kolmen eri uskonnon pyhät paikat ovat samassa kaupungissa? Syy löytyy historiasta. Juutalaisuus, kristinusko ja islam syntyivät samalla alueella, Lähi-idässä, mutta eri aikoina: ensin juutalaisuus, sitten kristinusko ja viimeisenä islam. Nuorempi uskonto syntyi ihmisten keskuudessa, jotka tunsivat vanhemman uskonnon kertomukset. Siksi näissä kolmessa uskonnossa on paljon samoja henkilöitä ja kertomuksia. Kun tiedät, missä ja missä järjestyksessä ne syntyivät, ymmärrät, miksi niillä on niin paljon yhteistä."},{"tyyppi":"kappale","otsikko":"Juutalaisuus on näistä kolmesta vanhin","sisalto":"Juutalaisuus on Israelin kansan uskonto. Juutalaisten pyhä kirja on Tanak. Sen kertomusten mukaan Abraham on kansan kantaisä, ja Mooses johdatti kansan pois Egyptistä ja sai Jumalalta lain. Juutalaisuuden keskus oli Jerusalem, jossa sijaitsi juutalaisten temppeli. Juutalaisuudella ei ole yhtä syntyvuotta. Se muotoutui hyvin pitkän ajan kuluessa, ja tutkijat ajoittavat sen alun eri tavoin. Siksi tässä taidossa ei opetella juutalaisuuden syntyvuotta vaan järjestys: juutalaisuus oli olemassa jo kauan ennen kristinuskoa ja islamia. Sen voi päätellä siitäkin, että Jeesus oli juutalainen."},{"tyyppi":"kappale","otsikko":"Kristinusko syntyi juutalaisten keskuudessa","sisalto":"Kristinusko syntyi noin 2 000 vuotta sitten, ajanlaskumme ensimmäisellä vuosisadalla. Evankeliumien mukaan Jeesus syntyi Betlehemissä juutalaiseen perheeseen ja kasvoi Nasaretissa, Galilean alueella. Hän opetti Galileassa ja kuoli Jerusalemissa noin vuonna 30. Kaikki nämä paikat ovat Lähi-idässä, Välimeren itärannan lähellä, Jordanjoen länsipuolella. Jeesuksen ensimmäiset seuraajat olivat juutalaisia. Hänen kuolemansa jälkeen he kertoivat, että Jeesus oli noussut kuolleista, ja kristityt uskovat, että hän on Jumalan Poika. Sana kristitty otettiin käyttöön vasta Jeesuksen kuoleman jälkeen: Apostolien tekojen mukaan seuraajia alettiin kutsua kristityiksi Antiokian kaupungissa. Uusi testamentti kirjoitettiin Jeesuksen kuoleman jälkeen. Vähitellen kristinusko levisi Välimeren ympäri, ja vuonna 380 siitä tuli Rooman valtakunnan virallinen uskonto."},{"tyyppi":"kappale","otsikko":"Islam syntyi 600-luvulla Arabian niemimaalla","sisalto":"Islam syntyi noin 600 vuotta kristinuskon jälkeen, 600-luvulla eli noin 1 400 vuotta sitten. Muhammad syntyi Mekan kaupungissa Arabian niemimaalla noin vuonna 570. Muslimit uskovat, että noin vuonna 610 Jumala alkoi ilmoittaa hänelle Koraania enkeli Gabrielin välityksellä. Vuonna 622 Muhammad muutti seuraajineen Mekasta Medinaan, ja muslimien ajanlasku alkaa tästä muutosta. Hän kuoli Medinassa vuonna 632. Mekka ja Medina ovat Lähi-idässä, Arabian niemimaan länsiosassa, Punaisen meren puolella. Muslimit pitävät Muhammadia viimeisenä profeettana samassa profeettojen jonossa, johon kuuluvat heidän uskonsa mukaan myös Abraham, Mooses ja Jeesus. Nimi kirjoitetaan suomeksi nykyään Muhammad; vanhemmissa kirjoissa näet muodon Muhammed."},{"tyyppi":"saanto","otsikko":"Näin luet sanoin kuvattua karttaa ja rakennat aikajanan","askeleet":["Lähi-idällä tarkoitetaan tässä taidossa aluetta, joka ulottuu Välimeren itärannalta Arabian niemimaalle ja Persianlahdelle. Sen rajat vaihtelevat lähteestä toiseen, esimerkiksi Egypti luetaan joskus mukaan ja joskus ei. Tämän taidon tehtävissä ei kysytä rajalla olevia paikkoja.","Kun kartan kuvauksessa lukee Välimeren itäranta tai Jordanjoki, olet Jerusalemin, Betlehemin, Nasaretin ja Galilean seudulla. Siellä muotoutui juutalaisuus, ja siellä Jeesus eli ja opetti.","Kun kuvauksessa lukee Arabian niemimaa tai Punainen meri, olet Mekan ja Medinan seudulla. Siellä islam syntyi. Jerusalem, Betlehem ja Nasaret eivät ole Arabian niemimaalla.","Italian niemimaa, Brittein saaret, Skandinavian niemimaa, Itämeri ja Suomenlahti ovat Euroopassa, eivät Lähi-idässä. Esimerkiksi Rooma, Pariisi, Lontoo, Tukholma ja Helsinki ovat Euroopassa.","Aikajanalla vanhin on vasemmalla. Laita juutalaisuus vasempaan reunaan ilman vuosilukua, kristinusko noin vuoteen 30 ja islam 600-luvulle. 600-luku tarkoittaa vuosia 600–699, joten vuodet 610, 622 ja 632 ovat kaikki 600-luvulla.","Tarkista järjestys päättelemällä: Jeesus oli juutalainen, joten juutalaisuus oli olemassa ennen kristinuskoa. Koraani kertoo Jeesuksesta, joten islam syntyi Jeesuksen jälkeen."]},{"tyyppi":"taulukko","otsikko":"Samat henkilöt kolmen uskonnon pyhissä kirjoissa","otsikkorivi":["Henkilö","Tanak (juutalaisuus)","Raamattu (kristinusko)","Koraani (islam)"],"rivit":[["Aadam","mainitaan","mainitaan","mainitaan (Adam)"],["Nooa","mainitaan","mainitaan","mainitaan (Nuh)"],["Abraham","mainitaan","mainitaan","mainitaan (Ibrahim)"],["Mooses","mainitaan","mainitaan","mainitaan (Musa)"],["Daavid","mainitaan","mainitaan","mainitaan (Dawud)"],["Joona","mainitaan","mainitaan","mainitaan (Yunus)"],["Jeesus","ei","mainitaan","mainitaan (Isa)"],["Maria, Jeesuksen äiti","ei","mainitaan","mainitaan (Maryam)"],["Johannes Kastaja","ei","mainitaan","mainitaan (Yahya)"],["Pietari","ei","mainitaan","ei"],["Paavali","ei","mainitaan","ei"],["Muhammad","ei","ei","mainitaan"]]},{"tyyppi":"kappale","otsikko":"Mitä nuorempi uskonto otti vanhemmalta","sisalto":"Kristinusko otti juutalaisuudesta uskon yhteen Jumalaan, profeetat, kuten Jesajan, kymmenen käskyä ja kertomukset. Juutalaisten pyhät kirjoitukset ovat kristittyjen Raamatussa Vanhana testamenttina, joten kaikki Tanakin henkilöt mainitaan myös Raamatussa. Uutta kristinuskossa olivat usko siihen, että Jeesus on Jumalan Poika ja nousi kuolleista, sekä Uusi testamentti. Islam syntyi alueella, jossa juutalaisten ja kristittyjen kertomukset tunnettiin. Koraanissa on usko yhteen Jumalaan ja monia samoja henkilöitä, mutta kertomukset on kerrottu omin sanoin ja osin eri tavalla: esimerkiksi Koraanissa Jeesus on profeetta, ei Jumalan Poika. Kaikkien kolmen pyhissä kirjoissa kerrotaan, miten Jumala luo Aadamin, miten Nooa rakentaa arkin ennen suurta tulvaa, miten Mooses johdattaa kansansa pois Egyptistä, miten Daavid voittaa Goljatin ja miten Joona joutuu suuren kalan vatsaan. Jeesuksen syntymästä Marialle kerrotaan Raamatussa ja Koraanissa, mutta ei Tanakissa. Vertaus tuhlaajapojasta ja Paavalin matkat ovat näistä kolmesta kirjasta vain Raamatussa. Jerusalem on pyhä kaupunki kaikille kolmelle. Uutta islamissa olivat Koraani, usko Muhammadiin viimeisenä profeettana ja rukoileminen Mekkaa kohti. Uskonnot itse selittävät yhteiset piirteet omalla tavallaan: kristityt ajattelevat, että Jeesus täytti juutalaisten pyhien kirjoitusten lupaukset, ja muslimit ajattelevat, että sama Jumala on puhunut kaikille profeetoille. Kun tässä taidossa sanotaan otti, tarkoitetaan historiaa: mitä oli jo olemassa, kun nuorempi uskonto syntyi. Syntyvaiheessaan uskonto saattoi ottaa vain siitä, mitä jo oli. Myöhemmin uskonnot ovat vaikuttaneet toisiinsa monella tavalla, mutta siitä ei puhuta tässä taidossa."},{"tyyppi":"ansa","otsikko":"Ansa 1: islam ei ole kristinuskoa vanhempi","sisalto":"Koraanissa kerrotaan Abrahamista, Nooasta ja Mooseksesta, jotka elivät kertomusten mukaan kauan ennen Jeesusta. Siksi islamia on helppo luulla ikivanhaksi. Kertomus vanhasta henkilöstä voi kuitenkin olla kirjoitettu paljon myöhemmin kuin henkilö eli. Sama koskee Raamattua: se kertoo Aadamista, mutta kristinusko ei ole Aadamin aikainen. Ratkaisevaa on, milloin uskonto syntyi. Koraani kertoo myös Jeesuksesta ja Mariasta, joten se syntyi Jeesuksen jälkeen. Islam syntyi 600-luvulla, noin 600 vuotta kristinuskon jälkeen, ja on näistä kolmesta nuorin."},{"tyyppi":"ansa","otsikko":"Ansa 2: Jeesus ei ollut kristitty vaan juutalainen","sisalto":"Koska kristinusko on nimetty Kristuksen eli Jeesuksen mukaan, moni luulee, että Jeesus oli kristitty ja kasvoi kristityssä perheessä. Jeesus syntyi kuitenkin juutalaiseen perheeseen, kävi evankeliumien mukaan Jerusalemin temppelissä ja luki juutalaisten pyhiä kirjoituksia. Myös hänen äitinsä Maria ja ensimmäiset seuraajansa, kuten Pietari, olivat juutalaisia. Kristinuskoa ei vielä ollut olemassa Jeesuksen eläessä: se muotoutui hänen seuraajiensa keskuudessa hänen kuolemansa jälkeen, ja Uusi testamentti kirjoitettiin vasta silloin. Juuri siksi kristinusko ja juutalaisuus jakavat niin paljon."},{"tyyppi":"muistilappu","otsikko":"Muista nämä","kohdat":["Kaikki kolme syntyivät Lähi-idässä: juutalaisuus ja kristinusko Välimeren itärannan lähellä, islam Arabian niemimaalla Mekassa ja Medinassa.","Järjestys vanhimmasta: juutalaisuus, kristinusko, islam.","Kristinusko syntyi ensimmäisellä vuosisadalla, islam 600-luvulla, noin 600 vuotta myöhemmin. Juutalaisuudelle ei ole yhtä syntyvuotta.","Jeesus oli juutalainen. Koraani kertoo Jeesuksesta, joten islam on kristinuskoa nuorempi.","Aadam, Nooa, Abraham, Mooses, Daavid ja Joona mainitaan kaikkien kolmen pyhissä kirjoissa.","Nuorempi otti vanhemmalta uskon yhteen Jumalaan, profeetat ja kertomukset. Uskonnot itse selittävät tämän omalla tavallaan."]}],"harjoitusryhmat":[{"id":"missa","nimi":"Missä ne syntyivät","info":"Välimeren itäranta ja Arabian niemimaa ovat Lähi-itää. Italia, Brittein saaret, Skandinavia ja Suomi ovat Euroopassa."},{"id":"jarjestys","nimi":"Syntyjärjestys ja aikajana","info":"Juutalaisuus, kristinusko, islam. Kristinusko noin vuonna 30, islam 600-luvulla."},{"id":"yhteiset","nimi":"Yhteiset henkilöt ja mitä nuorempi otti","info":"Tarkista, missä pyhissä kirjoissa henkilö mainitaan. Nuorempi uskonto otti siitä, mitä jo oli olemassa."}],"harjoitukset":[{"id":"H01","ryhma":"missa","kysymys":"Paikat: Jerusalem, Tukholma, Medina, Nasaret, Rooma.\n\nMontako näistä paikoista on Lähi-idässä?","vastaus":3,"vinkki":"Rooma ja Tukholma ovat Euroopassa. Mitkä jäävät jäljelle?","selitys":"Jerusalem ja Nasaret ovat Välimeren itärannan lähellä ja Medina Arabian niemimaalla, eli kaikki kolme Lähi-idässä. Rooma on Italiassa ja Tukholma Ruotsissa, Euroopassa. Lähi-idässä on 3 paikkaa."},{"id":"H02","ryhma":"missa","kysymys":"Paikat: Mekka, Betlehem, Medina, Jerusalem.\n\nMontako näistä paikoista on Arabian niemimaalla?","vastaus":2,"vinkki":"Kaikki neljä ovat Lähi-idässä, mutta vain islamin syntykaupungit ovat Arabian niemimaalla.","selitys":"Mekka ja Medina ovat Arabian niemimaan länsiosassa. Betlehem ja Jerusalem ovat Välimeren itärannan lähellä, eivät Arabian niemimaalla. Vastaus on 2."},{"id":"H03","ryhma":"missa","kysymys":"Kartan kuvaus: kartalla on neljä numeroitua pistettä.\n1. Piste on Suomenlahden pohjoisrannalla, Itämeren itäosassa.\n2. Piste on Arabian niemimaan länsiosassa, Punaisen meren puolella.\n3. Piste on Italian niemimaalla, Välimeren keskiosassa.\n4. Piste on Välimeren itärannan lähellä, Jordanjoen länsipuolella.\n\nMontako pisteistä on Lähi-idässä?","vastaus":2,"vinkki":"Etsi kuvauksista sanat Välimeren itäranta, Jordanjoki, Arabian niemimaa ja Punainen meri.","selitys":"Piste 2 on Arabian niemimaalla ja piste 4 Välimeren itärannan lähellä, joten ne ovat Lähi-idässä. Piste 1 on Suomenlahden rannalla ja piste 3 Italiassa, eli Euroopassa. Lähi-idässä on 2 pistettä."},{"id":"H04","ryhma":"missa","kysymys":"Kartan kuvaus: kartalla on kolme numeroitua pistettä.\n1. Piste on Välimeren itärannan lähellä, Jordanjoen länsipuolella.\n2. Piste on Skandinavian niemimaan itärannalla, Itämeren länsipuolella.\n3. Piste on Arabian niemimaan länsiosassa, Punaisen meren puolella.\n\nMonesko piste on alueella, jossa Muhammad syntyi?","vastaus":3,"vinkki":"Muhammad syntyi Mekassa. Millä niemimaalla Mekka on?","selitys":"Mekka on Arabian niemimaan länsiosassa, Punaisen meren puolella. Se on piste 3. Piste 1 on Jerusalemin seutu ja piste 2 Tukholman seutu Euroopassa."},{"id":"H05","ryhma":"missa","kysymys":"Juutalaisuus, kristinusko ja islam.\n\nMonessako näistä uskonnoista syntyalue on Arabian niemimaalla?","vastaus":1,"vinkki":"Kaikki kolme syntyivät Lähi-idässä. Kaksi niistä syntyi Välimeren itärannan lähellä.","selitys":"Juutalaisuus ja kristinusko syntyivät Välimeren itärannan lähellä, Jerusalemin seudulla. Vain islam syntyi Arabian niemimaalla, Mekassa ja Medinassa. Vastaus on 1."},{"id":"H06","ryhma":"missa","tyyppi":"monivalinta","kysymys":"Evankeliumien mukaan Jeesus kasvoi Nasaretissa ja kuoli Jerusalemissa.\n\nMillä alueella kristinusko syntyi?","vaihtoehdot":["Arabian niemimaalla, Mekassa","Lähi-idässä, Välimeren itärannan lähellä","Euroopassa, Roomassa"],"vastaus":1,"vinkki":"Kristinuskon nykyinen tunnettu keskus ei ole sama asia kuin sen syntypaikka.","selitys":"Kristinusko syntyi Lähi-idässä Välimeren itärannan lähellä, siellä missä Jeesus eli ja opetti. Rooma tuli kristinuskolle tärkeäksi vasta satoja vuosia myöhemmin, ja Mekka on islamin syntykaupunki."},{"id":"H07","ryhma":"jarjestys","kysymys":"Uskonnot: kristinusko, islam, juutalaisuus.\n\nMonesko syntyjärjestyksessä islam on, kun aloitetaan vanhimmasta?","vastaus":3,"vinkki":"Järjestä ensin kaikki kolme vanhimmasta nuorimpaan. Luettelon järjestys ei ole syntyjärjestys.","selitys":"Syntyjärjestys vanhimmasta: juutalaisuus, kristinusko, islam. Islam on kolmas. Se syntyi 600-luvulla, noin 600 vuotta kristinuskon jälkeen."},{"id":"H08","ryhma":"jarjestys","kysymys":"Uskonnot: islam, juutalaisuus, kristinusko.\n\nMonesko syntyjärjestyksessä juutalaisuus on, kun aloitetaan nuorimmasta?","vastaus":3,"vinkki":"Nyt aloitetaan nuorimmasta. Kumpi on nuorin, ja kumpi vanhin?","selitys":"Nuorimmasta alkaen järjestys on islam, kristinusko, juutalaisuus. Juutalaisuus on vanhin, joten nuorimmasta laskien se on kolmas."},{"id":"H09","ryhma":"jarjestys","kysymys":"Aikajana alkaa vuodesta 1, ja siihen on merkitty viiva 100 vuoden välein: 100, 200, 300 ja niin edelleen.\n\nMuhammad muutti Mekasta Medinaan vuonna 622. Minkä kahden viivan välissä vuosi 622 on? Kirjoita pienempi luku.","vastaus":600,"vinkki":"Vuosi 622 on 600-luvulla. Mikä viiva on juuri ennen sitä?","selitys":"Vuosi 622 on viivojen 600 ja 700 välissä. Pienempi luku on 600. 600-luku tarkoittaa vuosia 600–699."},{"id":"H10","ryhma":"jarjestys","kysymys":"Jeesus opetti Galileassa noin vuonna 30. Muhammad sai muslimien uskon mukaan ensimmäisen ilmoituksensa noin vuonna 610.\n\nNoin montako vuotta näiden välillä kului? Pyöristä lähimpään sataan.","vastaus":600,"vinkki":"Laske ensin 610 − 30 ja pyöristä sitten.","selitys":"610 − 30 = 580. Luku 580 on lähempänä lukua 600 kuin lukua 500, joten pyöristettynä noin 600 vuotta. Siksi sanotaan, että islam syntyi noin 600 vuotta kristinuskon jälkeen."},{"id":"H11","ryhma":"jarjestys","tyyppi":"monivalinta","kysymys":"Onni sanoo: \"Islam on varmaan kristinuskoa vanhempi, koska Koraanissa kerrotaan Abrahamista ja Mooseksesta, jotka elivät kauan ennen Jeesusta.\"\n\nMikä Onnin päättelyssä menee vikaan?","vaihtoehdot":["Koraanissa ei kerrota Abrahamista eikä Mooseksesta.","Kertomus vanhasta henkilöstä voi olla kirjoitettu paljon myöhemmin. Koraani kertoo myös Jeesuksesta, joten islam syntyi Jeesuksen jälkeen.","Abraham ja Mooses elivät vasta Jeesuksen jälkeen."],"vastaus":1,"vinkki":"Mieti, milloin kertomus on kirjoitettu ja milloin sen henkilö eli. Kenestä muusta Koraani kertoo?","selitys":"Kertomus vanhasta henkilöstä voi olla kirjoitettu paljon myöhemmin kuin henkilö eli. Koraani kertoo myös Jeesuksesta, joten islam syntyi Jeesuksen jälkeen. Koraani kertoo Abrahamista ja Mooseksesta, ja he elivät kertomusten mukaan ennen Jeesusta, joten kaksi muuta vaihtoehtoa ovat vääriä."},{"id":"H12","ryhma":"jarjestys","kysymys":"Tapahtumat:\n1. Muhammad muuttaa Mekasta Medinaan (vuosi 622).\n2. Jeesus opettaa Galileassa (noin vuosi 30).\n3. Kristinuskosta tulee Rooman valtakunnan virallinen uskonto (vuosi 380).\n\nMonesko tapahtuma on aikajanalla keskimmäisenä?","vastaus":3,"vinkki":"Järjestä vuodet pienimmästä suurimpaan: kumpi on 30:n ja 622:n välissä?","selitys":"Aikajanalla järjestys on 30, 380, 622 eli tapahtumat 2, 3 ja 1. Keskimmäisenä on tapahtuma 3."},{"id":"H13","ryhma":"jarjestys","kysymys":"Väitteet juutalaisuudesta, kristinuskosta ja islamista:\n1. Islam on näistä kolmesta nuorin.\n2. Kristinusko syntyi ennen juutalaisuutta.\n3. Islam syntyi 600-luvulla.\n4. Kristinusko syntyi noin 2 000 vuotta sitten.\n5. Islam syntyi ennen kristinuskoa.\n\nMontako väitteistä pitää paikkansa?","vastaus":3,"vinkki":"Tarkista jokainen väite järjestyksestä juutalaisuus, kristinusko, islam.","selitys":"Väitteet 1, 3 ja 4 pitävät paikkansa. Väite 2 on väärin, koska Jeesus oli juutalainen ja juutalaisuus oli olemassa ennen kristinuskoa. Väite 5 on väärin, koska islam syntyi noin 600 vuotta kristinuskon jälkeen. Oikeita on 3."},{"id":"H14","ryhma":"yhteiset","kysymys":"Henkilöt: Nooa, Paavali, Mooses, Muhammad, Abraham.\n\nMontako näistä henkilöistä mainitaan kaikkien kolmen uskonnon pyhissä kirjoissa?","vastaus":3,"vinkki":"Paavali mainitaan vain Uudessa testamentissa. Kuka muu mainitaan vain yhdessä kirjassa?","selitys":"Nooa, Mooses ja Abraham mainitaan Tanakissa, Raamatussa ja Koraanissa. Paavali mainitaan vain Raamatussa ja Muhammad vain Koraanissa. Vastaus on 3."},{"id":"H15","ryhma":"yhteiset","kysymys":"Pyhät kirjat: Tanak, Raamattu, Koraani.\n\nMonessako näistä kirjoista Jeesus mainitaan?","vastaus":2,"vinkki":"Tanak oli olemassa jo ennen Jeesusta.","selitys":"Jeesus mainitaan Raamatussa ja Koraanissa, jossa hänen nimensä on Isa. Tanakissa häntä ei mainita nimeltä. Tanakin kirjat kirjoitettiin ennen Jeesuksen elinaikaa. Vastaus on 2."},{"id":"H16","ryhma":"yhteiset","kysymys":"Kertomukset:\n1. Nooa rakentaa arkin ennen suurta tulvaa.\n2. Mooses johdattaa kansansa pois Egyptistä.\n3. Muhammad muuttaa Mekasta Medinaan.\n4. Joona joutuu suuren kalan vatsaan.\n\nMontako näistä kertomuksista löytyy sekä Tanakista että Koraanista?","vastaus":3,"vinkki":"Tanakin kirjat kirjoitettiin kauan ennen Muhammadin elinaikaa. Katso henkilötaulukosta, missä kirjoissa Muhammad mainitaan.","selitys":"Kertomukset Nooasta, Mooseksesta ja Joonasta ovat sekä Tanakissa että Koraanissa. Muhammad eli satoja vuosia Tanakin kirjoittamisen jälkeen, eikä häntä mainita Tanakissa. Vastaus on 3."},{"id":"H17","ryhma":"yhteiset","kysymys":"Asiat:\n1. usko yhteen Jumalaan\n2. juutalaisten pyhät kirjoitukset, joista tuli Vanha testamentti\n3. usko, että Jeesus on Jumalan Poika\n4. kertomus Abrahamista\n\nMontako näistä asioista oli jo juutalaisuudessa ennen kristinuskon syntyä?","vastaus":3,"vinkki":"Mikä näistä liittyy Jeesukseen ja voi siksi olla vasta kristinuskossa?","selitys":"Usko yhteen Jumalaan, juutalaisten pyhät kirjoitukset ja kertomus Abrahamista olivat juutalaisuudessa jo ennen kristinuskoa, ja kristinusko otti ne. Usko Jeesukseen Jumalan Poikana on kristinuskon oma. Vastaus on 3."},{"id":"H18","ryhma":"yhteiset","tyyppi":"monivalinta","kysymys":"Jeesus syntyi juutalaiseen perheeseen, ja hänen ensimmäiset seuraajansa olivat juutalaisia.\n\nMihin uskontoon Jeesus itse kuului?","vaihtoehdot":["kristinuskoon","juutalaisuuteen","islamiin"],"vastaus":1,"vinkki":"Oliko kristinuskoa vielä olemassa, kun Jeesus eli?","selitys":"Jeesus oli juutalainen. Kristinusko muotoutui hänen seuraajiensa keskuudessa hänen kuolemansa jälkeen, ja islam syntyi vasta 600-luvulla."},{"id":"H19","ryhma":"yhteiset","kysymys":"Asiat:\n1. usko yhteen Jumalaan\n2. usko Muhammadiin viimeisenä profeettana\n3. kertomus Mooseksesta\n4. Jerusalem pyhänä kaupunkina\n5. Koraani\n\nMontako näistä asioista oli jo juutalaisuudessa tai kristinuskossa ennen islamin syntyä?","vastaus":3,"vinkki":"Mitkä kaksi asiaa liittyvät Muhammadiin eivätkä siksi voineet olla olemassa ennen häntä?","selitys":"Usko yhteen Jumalaan, kertomus Mooseksesta ja Jerusalem pyhänä kaupunkina olivat jo juutalaisuudessa ja kristinuskossa. Usko Muhammadiin viimeisenä profeettana ja Koraani ovat islamin omia. Vastaus on 3."},{"id":"H20","ryhma":"yhteiset","kysymys":"Henkilöt: Jeesus, Jeesuksen äiti Maria, Pietari, Muhammad.\n\nMontako näistä henkilöistä oli juutalaisia?","vastaus":3,"vinkki":"Jeesus, hänen äitinsä ja hänen ensimmäiset seuraajansa kuuluivat samaan kansaan.","selitys":"Jeesus, Maria ja Jeesuksen seuraaja Pietari olivat juutalaisia. Muhammad eli satoja vuosia myöhemmin Arabian niemimaalla eikä ollut juutalainen. Vastaus on 3."}],"valmis_teksti":"Osaat kertoa, että juutalaisuus, kristinusko ja islam syntyivät Lähi-idässä tässä järjestyksessä, ja nimetä henkilöitä ja kertomuksia, jotka esiintyvät useammassa kuin yhdessä niistä. Tämä taito on nyt näytetty."};

/* ---------- lukusuora ---------- */
const svg=document.getElementById("nlsvg"), rng=document.getElementById("nlrange"), out=document.getElementById("nlout");
const X0=34, X1=606, Y=62;
function piirraNL(v){
  const ala=Math.floor(v/10)*10, yla=ala+10, puoli=ala+5;
  const pyor = (v%10)>=5 ? yla : ala;
  const x = n => X0 + (n/100)*(X1-X0);
  let s=`<line class="rail" x1="${X0}" y1="${Y}" x2="${X1}" y2="${Y}"/>`;
  for(let n=0;n<=100;n+=10){
    const near = (n===ala||n===yla);
    s+=`<line class="tick" x1="${x(n)}" y1="${Y-7}" x2="${x(n)}" y2="${Y+7}"/>`;
    s+=`<text class="stop${near?" near":""}" x="${x(n)}" y="${Y+24}" text-anchor="middle">${n}</text>`;
  }
  s+=`<line class="halfway" x1="${x(puoli)}" y1="${Y-16}" x2="${x(puoli)}" y2="${Y+12}"/>`;
  s+=`<text class="stop" x="${x(puoli)}" y="${Y-22}" text-anchor="middle">puoliväli ${puoli}</text>`;
  s+=`<circle class="dot" cx="${x(v)}" cy="${Y}" r="6"/>`;
  s+=`<text class="val" x="${x(v)}" y="${Y-32}" text-anchor="middle">${v}</text>`;
  s+=`<path d="M ${x(v)} ${Y+38} L ${x(pyor)} ${Y+38}" stroke="var(--core)" stroke-width="2" fill="none"/>`;
  s+=`<path d="M ${x(pyor)} ${Y+38} l ${x(pyor)>x(v)?-7:7} -4 l 0 8 z" fill="var(--core)"/>`;
  svg.innerHTML=s;
  out.textContent = `${v} pyöristyy → ${pyor}`;
}
if(svg){ piirraNL(+rng.value); rng.addEventListener("input",e=>piirraNL(+e.target.value)); }

/* ---------- paikka-arvotaulu ---------- */
const ntTaulu=document.getElementById("ntTaulu");
if(ntTaulu){
  const O=D.teksti.find(x=>x.tyyppi==="numerotaulu");
  const PAIKAT=["ykköset","kymmenet","sadat","tuhannet","kymmenettuhannet"];
  const LYH=["Y","K","S","T","KT"];
  const IDX={kymmenet:1, sadat:2, tuhannet:3};
  let ntI=0;
  document.getElementById("ntValinta").innerHTML=O.esimerkit.map((e,i)=>
    `<button type="button" data-i="${i}" aria-pressed="${i===0}">${e.luku.toLocaleString("fi-FI",{maximumFractionDigits:10})} → ${e.tarkkuus}</button>`).join("");
  function ntPiirra(){
    const e=O.esimerkit[ntI], t=IDX[e.tarkkuus], kerroin=Math.pow(10,t);
    const tulos=Math.floor((e.luku+kerroin/2)/kerroin)*kerroin;
    const lev=Math.max(String(e.luku).length, String(tulos).length);
    const num=String(e.luku).padStart(lev,"0").split("");
    const res=String(tulos).padStart(lev,"0").split("");
    const luokka=(i,arr,vain0)=>{
      const p=arr.length-1-i;
      if(vain0) return p<t ? "nt-ruutu nolla" : "nt-ruutu";
      if(p===t) return "nt-ruutu kohta";
      if(p===t-1) return "nt-ruutu ratkaiseva";
      return "nt-ruutu";
    };
    const otsat=num.map((_,i)=>`<span class="otsa">${LYH[num.length-1-i]||""}</span>`).join("");
    const rivi1=num.map((n,i)=>`<span class="${luokka(i,num,false)}">${n}</span>`).join("");
    const rivi2=res.map((n,i)=>`<span class="${luokka(i,res,true)}">${n}</span>`).join("");
    const ratk=+num[num.length-t];
    const ylos=ratk>=5;
    ntTaulu.innerHTML=
      `<div class="nt-rivi">${otsat}</div>
       <div class="nt-rivi">${rivi1}<span class="nimi">luku</span></div>
       <div class="nt-rivi"><span class="nt-nuoli" style="margin-left:${(num.length-1-t)*58+18}px">${ylos?"▲ ylös":"▼ alas"}</span></div>
       <div class="nt-rivi">${rivi2}<span class="nimi">pyöristettynä</span></div>`;
    document.getElementById("ntSelite").innerHTML =
      `Pyöristetään <b>${PAIKAT[t]}</b> (sininen ruutu). Ratkaiseva numero on <b>${ratk}</b> (keltainen ruutu). ` +
      (ylos ? `Se on 5 tai suurempi, joten sininen ruutu kasvaa yhdellä.` : `Se on pienempi kuin 5, joten sininen ruutu pysyy ennallaan.`) +
      ` Kaikki keltaisen oikealla puolella muuttuu nolliksi. Vastaus on <b>${tulos.toLocaleString("fi-FI",{maximumFractionDigits:10})}</b>.`;
    document.querySelectorAll("#ntValinta button").forEach((b,i)=>b.setAttribute("aria-pressed",String(i===ntI)));
  }
  document.getElementById("ntValinta").addEventListener("click",e=>{
    const b=e.target.closest("button"); if(!b) return; ntI=+b.dataset.i; ntPiirra();
  });
  ntPiirra();
}

  function vpPiirra(){
    const e=O.esimerkit[vpI];
    const tokens=e.lauseke.split(/\s+/);
    const kartta=Object.fromEntries(e.jarjestys.map(j=>[j.i,j]));
    vpEl.innerHTML=tokens.map((t,i)=>{
      const j=kartta[i];
      return j ? `<span class="op" data-taso="${j.taso}">${t}<i><span>${j.n}</span></i></span>`
               : `<span class="t">${t}</span>`;
    }).join("");
    document.getElementById("vpVastaus").textContent = "= " + e.vastaus;
  }
  document.getElementById("vpSeuraava").addEventListener("click",()=>{
    vpI=(vpI+1)%O.esimerkit.length; vpPiirra();
  });
  vpPiirra();
}

/* ---------- laskujärjestys-widget ---------- */
const ljExp=document.getElementById("ljExp");
if(ljExp && D.kokeilu){
  let ljI=0, ljTokens=[], ljStep=0;
  const laske=(a,op,b)=>{a=+a;b=+b;return op==="×"?a*b:op==="÷"?a/b:op==="+"?a+b:a-b;};
  function ljAlku(){
    const l=D.kokeilu[ljI];
    ljTokens=l.lauseke.replace(/\(/g,"( ").replace(/\)/g," )").split(/\s+/).filter(Boolean);
    ljStep=0; ljPiirra(); ljViesti("","");
  }
  function ljViesti(t,lk){const f=document.getElementById("ljFb"); f.textContent=t; f.className="lj-fb "+(lk||"");}
  function ljPiirra(){
    const l=D.kokeilu[ljI];
    document.getElementById("ljStep").textContent =
      ljStep>=l.askeleet.length ? "valmis" : `askel ${ljStep+1} / ${l.askeleet.length}`;
    if(ljStep>=l.askeleet.length){
      ljExp.innerHTML=`<span class="valmis">${l.lauseke} = ${l.vastaus}</span>`;
      return;
    }
    ljExp.innerHTML=ljTokens.map((t,i)=>
      "×÷+−".includes(t) ? `<button type="button" class="op" data-i="${i}">${t}</button>`
                         : `<span class="tok">${t}</span>`).join("");
    ljExp.querySelectorAll("button.op").forEach(b=>b.addEventListener("click",()=>ljKlikkaa(+b.dataset.i)));
  }
  function ljKlikkaa(i){
    const l=D.kokeilu[ljI], odotettu=l.askeleet[ljStep];
    const ehdotus=[ljTokens[i-1],ljTokens[i],ljTokens[i+1]].join(" ");
    if(ehdotus!==odotettu){
      ljViesti(ljStep===0
        ? "Ei vielä. Sulkeet ovat vahvimmat, sitten kerto ja jako. Yhtä vahvat vasemmalta oikealle."
        : "Ei vielä. Kumpi jäljellä olevista on vahvempi?", "no");
      return;
    }
    const arvo=laske(ljTokens[i-1],ljTokens[i],ljTokens[i+1]);
    let alku=i-1, loppu=i+1;
    if(ljTokens[i-2]==="(" && ljTokens[i+2]===")"){ alku=i-2; loppu=i+2; }
    ljTokens.splice(alku, loppu-alku+1, String(arvo));
    ljStep++;
    ljViesti(ljStep>=l.askeleet.length ? "Valmis. Vastaus on "+l.vastaus+"." : "Oikein. Jatka seuraavaan.", "ok");
    ljPiirra();
  }
  document.getElementById("ljSeuraava").addEventListener("click",()=>{
    ljI=(ljI+1)%D.kokeilu.length; ljAlku();
  });
  ljAlku();
}

/* ---------- harjoitukset ----------
   Kaksi vastaustyyppiä: "numero" (oletus, tekstikenttä + Number()-vertailu) ja
   "monivalinta" (valintapainikkeet, h.vaihtoehdot[] + h.vastaus = oikean vaihtoehdon indeksi).
   Jos D.harjoitukset puuttuu tai on tyhjä, koko osio piilotetaan (näyttötaidot, ei kirjallista
   harjoitusta: liikunta, kuvataide). */
/* Kysymyksessä voi olla luettavaa aineistoa ja sen jälkeen varsinainen kysymys,
   erotettuna tyhjällä rivillä. Viimeinen osa on kysymys, sitä edeltävät aineistoa. */
const kysymysHtml = t => {
  const osat = String(t).split(/\n\s*\n/).map(x=>x.trim()).filter(Boolean);
  if(osat.length < 2) return osat[0] || "";
  const kysymys = osat.pop();
  return osat.map(p=>`<span class="aineisto">${p}</span>`).join("")
       + `<span class="kysymysrivi">${kysymys}</span>`;
};

function paivitaEdistyminen(){

function merkitseTulos(id, oikein, viesti){
  const fb=document.getElementById("fb-"+id), kortti=document.getElementById("ex-"+id);

}

/* Suomalainen lukumuoto: välilyönti on tuhaterotin, pilkku desimaalierotin.
   Piste voi olla kumpi tahansa. Se tulkitaan tuhaterottimeksi VAIN silloin, kun
   koko luku on aitoa tuhaterotinmuotoa: alkuosa 1–3 numeroa ilman etunollaa ja
   jokainen jatko-osa täsmälleen 3 numeroa (1.500, 12.345.678). Kaikissa muissa
   tapauksissa piste on desimaalipiste — myös 0.125, joka vanhalla säännöllä
   ("3 numeroa pisteen jäljessä = tuhaterotin") luettiin virheellisesti luvuksi 125. */
const TUHATEROTIN = /^[1-9]\d{0,2}(\.\d{3})+$/;
function lueLuku(teksti){
  // Murtoluku (3/4, -3/4) ja sekaluku (1 2/3, -1 2/3) hyväksytään sellaisinaan.
  const raaka = String(teksti).replace(/\u00a0/g, " ").trim();
  let m = raaka.match(/^(-?)(\d+)\s+(\d+)\s*\/\s*(\d+)$/);
  if(m){ const nim = Number(m[4]); if(nim === 0) return null;
    const v = Number(m[2]) + Number(m[3]) / nim; return m[1] ? -v : v; }
  m = raaka.match(/^(-?)\s*(\d+)\s*\/\s*(\d+)$/);
  if(m){ const nim = Number(m[3]); if(nim === 0) return null;
    const v = Number(m[2]) / nim; return m[1] ? -v : v; }
  let s = String(teksti).replace(/[\s\u00a0]/g, "");
  if(s === "") return null;
  if(s.indexOf(",") >= 0){
    s = s.replace(/\./g, "").replace(",", ".");
  } else if(TUHATEROTIN.test(s)){
    s = s.replace(/\./g, "");
  }
  const n = Number(s);
  return Number.isFinite(n) ? n : null;
}

function tarkista(id){
  const h=D.harjoitukset.find(x=>x.id===id);
  const kentta=document.getElementById("in-"+id);
  const fb=document.getElementById("fb-"+id);
  if(kentta.value.trim()===""){ fb.className="fb hint"; fb.textContent="Kirjoita vastaus ensin."; return; }
  const luku=lueLuku(kentta.value);
  if(luku===null){ fb.className="fb no"; fb.textContent="Vastauksen pitää olla luku tai murtoluku (esimerkiksi 3/4)."; return; }
  const oikein = Math.abs(luku - h.vastaus) < 1e-9;
  merkitseTulos(id, oikein, oikein ? "Oikein. "+h.selitys : `Ei vielä. ${h.vinkki} Kokeile uudelleen.`);
}

function tarkistaMonivalinta(id, valittuIndeksi, painike){
  const h=D.harjoitukset.find(x=>x.id===id);
  const rivi=painike.closest(".row");
  rivi.querySelectorAll(".mv-valinta").forEach(b=>b.disabled=true);
  const oikein = valittuIndeksi===h.vastaus;
  painike.classList.add(oikein?"mv-oikein":"mv-vaarin");
  if(!oikein){
    const oikeaBtn=rivi.querySelector(`[data-i="${h.vastaus}"]`);
    if(oikeaBtn) oikeaBtn.classList.add("mv-oikein");
  }
  merkitseTulos(id, oikein, oikein ? "Oikein. "+h.selitys : `Ei ihan. Oikea vastaus on korostettu. ${h.selitys||""}`);
}

/* Kuuntelu: selain lukee tekstin ääneen omalla puhesynteesillään (englanniksi, jos laitteessa on
   englanninkielinen ääni). Ei äänitiedostoja eikä verkkoyhteyttä. Jos laite ei osaa puhua,
   teksti näytetään luettavaksi — silloin tehtävä muuttuu luetun ymmärtämiseksi, mutta ei katkea. */
function puhu(id, nopeus){
  const h=D.harjoitukset.find(x=>x.id===id); if(!h || !h.kuuntele) return;
  const vara=document.getElementById("vara-"+id);
  const naytaTeksti=syy=>{ vara.hidden=false; vara.textContent=syy+" Teksti: "+h.kuuntele; };
  if(!("speechSynthesis" in window)){ naytaTeksti("Tämä laite ei osaa lukea ääneen."); return; }
  const s=window.speechSynthesis; s.cancel();
  const u=new SpeechSynthesisUtterance(h.kuuntele);
  u.lang=h.kieli||"en-GB"; u.rate=nopeus;
  const aanet=s.getVoices(), kieli=u.lang.slice(0,2);
  const aani=aanet.find(a=>a.lang===u.lang) || aanet.find(a=>a.lang && a.lang.startsWith(kieli));
  if(aani) u.voice=aani;
  else if(aanet.length) { naytaTeksti("Laitteessa ei ole englanninkielistä ääntä."); return; }
  u.onerror=()=>naytaTeksti("Ääneen lukeminen ei onnistunut.");
  s.speak(u);
}

  if(k) puhu(k.dataset.kuuntele, 0.9);

  if(t) tarkista(t.dataset.tarkista);

  }
});
