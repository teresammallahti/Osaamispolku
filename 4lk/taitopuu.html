<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Taitopuu · 4. luokka</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="puut.css">
<style>
html,body{height:100%;overflow:hidden}
body{display:flex;flex-direction:column}
.kehys{position:relative;flex:1;min-height:0;overflow:hidden;touch-action:none;
  background:radial-gradient(circle at 50% 48%,#1b2333 0%,#10151f 45%,#0a0d13 100%)}
svg#puu{width:100%;height:100%;display:block;cursor:grab;user-select:none}
svg#puu.vedetaan{cursor:grabbing}
.ohjaimet{position:absolute;left:16px;bottom:16px;display:flex;flex-direction:column;gap:6px;z-index:5}
.ohjaimet button{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:rgba(24,32,44,.92);font-size:18px;cursor:pointer;color:var(--ink)}
.ala{position:absolute;left:72px;bottom:16px;right:16px;z-index:4;pointer-events:none}
.ala .pl-selite{pointer-events:auto;display:inline-flex;background:rgba(13,17,24,.85);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
/* solmut */
.rengas{fill:none;stroke:#263043;stroke-width:1}
.rengas.lk{stroke:#2d3a52;stroke-dasharray:3 6}
.sektori{stroke:none}
.alueteksti{font:600 13px var(--mono);letter-spacing:.12em;text-transform:uppercase}
.kaari{fill:none;stroke:#3a465b;stroke-width:1.6;transition:opacity .15s}
.kaari.k-osattu{stroke:var(--osattu);stroke-width:2.6}
.kaari.k-seuraava{stroke:var(--avoin);stroke-width:2}
.kaari.k-lk{stroke-dasharray:4 5;stroke-width:1.2;opacity:.45}
.solmu{cursor:pointer;transition:opacity .15s}
.solmu .reuna{fill:#121925;stroke:#556078;stroke-width:2}
.solmu .ikoni{fill:none;stroke:#7d889c;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.solmu.t-avoin .reuna{stroke:var(--avoin);stroke-width:2.6}
.solmu.t-avoin .ikoni{stroke:#cfe9d5}
.solmu.t-osattu .reuna{fill:var(--c);stroke:var(--osattu);stroke-width:3}
.solmu.t-osattu .ikoni{stroke:#14100a}
.solmu.t-osattu .hehku{opacity:.55}
.solmu .hehku{fill:var(--c);opacity:0;filter:blur(6px)}
.solmu.lk3 .reuna{fill:#1b2433;stroke:#6c7a93;stroke-dasharray:2 3}
.solmu.lk5 .reuna{fill:#0e131c;stroke:#6c7a93;stroke-dasharray:3 3}
.solmu.lk5.t-avoin .reuna{stroke:var(--avoin)}
.solmu .haaste{fill:none;stroke:#b48ae0;stroke-width:1.6}
.solmu .nimi{font:500 12px var(--font);fill:var(--ink-2);paint-order:stroke;stroke:#0b0f16;stroke-width:4px;stroke-linejoin:round;pointer-events:none;opacity:0}
.nayta-nimet .solmu.lk4 .nimi,.solmu.korostus .nimi,.solmu.valittu .nimi{opacity:1}
.solmu.valittu .reuna{stroke:#fff;stroke-width:3.4}
.himmea .solmu:not(.korostus),.himmea .kaari:not(.korostus){opacity:.13}
.kaari.korostus.ylos{stroke:var(--kulta);stroke-width:2.8;opacity:1!important}
.kaari.korostus.alas{stroke:var(--syaani);stroke-width:2.4;opacity:1!important}
.keskus circle{fill:#121925;stroke:var(--kulta);stroke-width:2}
.keskus text{fill:var(--ink);text-anchor:middle}
@media (max-width:720px){.ala{display:none}}
</style>
</head>
<body>
<header class="pl-palkki" id="palkki">
  <div class="pl-otsikko"><small>Osaamispolku · 4. luokka</small><b>Taitopuu</b></div>
  <div class="pl-ryhma">
    <select id="aine" aria-label="Oppiaine"></select>
    <input type="search" id="haku" placeholder="Etsi taitoa…" aria-label="Etsi taitoa">
    <label class="pl-kytkin" id="k3w"><input type="checkbox" id="k3" checked> 3. lk pohja</label>
    <label class="pl-kytkin" id="k5w"><input type="checkbox" id="k5" checked> 5. lk jatko</label>
    <label class="pl-kytkin"><input type="checkbox" id="knimet"> Nimet</label>
  </div>
  <div class="pl-ryhma"><span class="pl-tilasto" id="tilasto"></span><button type="button" class="pl-pieni" id="nollaa">Tyhjennä merkinnät</button></div>
  <nav class="pl-nav"><a href="../index.html">Etusivu</a><a href="index.html">Taulu</a><a href="taitopuu.html" aria-current="page">Taitopuu</a><a href="taitopolku.html">Taitopolku</a></nav>
</header>
<p class="pl-ilmoitus" id="ilmoitus" hidden></p>
<div class="kehys" id="kehys">
  <svg id="puu" role="img" aria-label="Ympyrän muotoinen taitopuu"><g id="kamera"></g></svg>
  <div class="ohjaimet"><button type="button" id="zplus" aria-label="Lähennä">+</button><button type="button" id="zmiinus" aria-label="Loitonna">−</button><button type="button" id="zsovita" aria-label="Sovita näkymään">⤢</button></div>
  <div class="ala"><div class="pl-selite">
    <span><i class="osattu"></i>osattu</span><span><i class="avoin"></i>avoin: pohja koossa</span><span><i class="lukittu"></i>lukittu</span>
    <span><i class="lk"></i>3. ja 5. luokka</span><span>iso = ydintaito · violetti kehä = haaste</span>
    <span>Keskeltä ulospäin: pohja → 4. luokka → 5. luokka</span>
  </div></div>
</div>
<aside class="pl-paneeli" id="paneeli" hidden aria-live="polite"></aside>

<script src="puut-data.js"></script>
<script src="puut-yhteinen.js"></script>
<script>
"use strict";
const svg = document.getElementById("puu"), kamera = document.getElementById("kamera"), kehys = document.getElementById("kehys");
const NS = "http://www.w3.org/2000/svg";
const nayta = {3: true, 5: true};
let kam = {x: 0, y: 0, s: 1};

PUU.rakennaValitsin(document.getElementById("aine"));
PUU.kiinnitaPaneeli(document.getElementById("paneeli"));
function palkkiKorkeus() { document.documentElement.style.setProperty("--palkki", document.getElementById("palkki").offsetHeight + (document.getElementById("ilmoitus").hidden ? 0 : document.getElementById("ilmoitus").offsetHeight) + "px"); }

function koko(s) { return s.lk !== 4 ? 12 : s.taso === "ydin" ? 22 : s.taso === "haaste" ? 18 : 15; }
function napa(s) { return {x: s.rx, y: s.ry}; }
function polaari(a, b) {
  /* Kaari kahden solmun välillä: kulma ja säde interpoloidaan, jolloin viiva kiertyy renkaiden mukaan. */
  const ra = Math.hypot(a.rx, a.ry), rb = Math.hypot(b.rx, b.ry);
  let aa = Math.atan2(a.ry, a.rx), ab = Math.atan2(b.ry, b.rx), d = ab - aa;
  while (d > Math.PI) d -= 2 * Math.PI; while (d < -Math.PI) d += 2 * Math.PI;
  let p = "";
  // pitkät kaaret taipuvat keskustaa kohti, jotta ne eivät seuraa renkaita ja sekoitu niihin
  const dip = Math.min(0.42, Math.abs(d) / Math.PI * 0.55) * Math.min(ra, rb);
  for (let i = 0; i <= 18; i++) {
    const t = i / 18, r = ra + (rb - ra) * t - dip * Math.sin(Math.PI * t), k = aa + d * t;
    p += (i ? "L" : "M") + (r * Math.cos(k)).toFixed(1) + " " + (r * Math.sin(k)).toFixed(1);
  }
  return p;
}
function el(tag, attrs, parent) { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; }

let solmuEl = {}, kaariEl = [];
function piirra() {
  const A = PUU.aine, Y = A.ympyra;
  kamera.innerHTML = ""; solmuEl = {}; kaariEl = [];
  const on3 = A.solmut.some(s => s.lk === 3), on5 = A.solmut.some(s => s.lk === 5);
  document.getElementById("k3w").style.display = on3 ? "" : "none";
  document.getElementById("k5w").style.display = on5 ? "" : "none";
  const ilm = document.getElementById("ilmoitus");
  ilm.hidden = on3 || on5;
  ilm.textContent = "Tässä oppiaineessa näkyvät 4. luokan sisäiset riippuvuudet. 3. ja 5. luokan kartat on toistaiseksi tehty vain matematiikkaan.";
  palkkiKorkeus();
  const R = Y.sateet, rmax = R[R.length - 1] + 70;
  const g0 = el("g", {}, kamera);
  // sektorit ja alueiden nimet
  Y.sektorit.forEach(sk => {
    const a = PUU.alue(sk.id), r0 = 110, r1 = rmax;
    const p = `M${r0*Math.cos(sk.a0)} ${r0*Math.sin(sk.a0)} L${r1*Math.cos(sk.a0)} ${r1*Math.sin(sk.a0)} A${r1} ${r1} 0 ${sk.a1-sk.a0>Math.PI?1:0} 1 ${r1*Math.cos(sk.a1)} ${r1*Math.sin(sk.a1)} L${r0*Math.cos(sk.a1)} ${r0*Math.sin(sk.a1)} A${r0} ${r0} 0 ${sk.a1-sk.a0>Math.PI?1:0} 0 ${r0*Math.cos(sk.a0)} ${r0*Math.sin(sk.a0)}Z`;
    el("path", {d: p, class: "sektori", fill: a.vari, "fill-opacity": .045}, g0);
    const id = "kaari-" + sk.id, rt = rmax + 22, mid = (sk.a0 + sk.a1) / 2;
    const ylos = Math.sin(mid) > 0.15; // alapuolella teksti luetaan oikein päin kiertämällä toiseen suuntaan
    const a0 = ylos ? sk.a1 : sk.a0, a1 = ylos ? sk.a0 : sk.a1;
    el("path", {id, d: `M${rt*Math.cos(a0)} ${rt*Math.sin(a0)} A${rt} ${rt} 0 0 ${ylos?0:1} ${rt*Math.cos(a1)} ${rt*Math.sin(a1)}`, fill: "none"}, g0);
    const t = el("text", {class: "alueteksti", fill: a.vari, dy: ylos ? 12 : 0}, g0);
    const tp = el("textPath", {href: "#" + id, startOffset: "50%", "text-anchor": "middle"}, t);
    const pit = rt * (sk.a1 - sk.a0), nimi = a.nimi.length * 8.5 > pit ? sk.id : a.nimi;
    tp.textContent = nimi;
  });
  R.forEach((r, i) => el("circle", {r, class: "rengas" + ((i === 0 && on3) || (i === R.length - 1 && on5) ? " lk" : "")}, g0));
  // keskus
  const kg = el("g", {class: "keskus"}, kamera);
  el("circle", {r: 78}, kg);
  el("text", {y: -6, "font-size": 15, "font-weight": 600}, kg).textContent = A.nimi.length > 16 ? A.koodi : A.nimi;
  el("text", {y: 16, "font-size": 12, fill: "#a8b3c3"}, kg).textContent = "4. luokka";
  // kaaret
  const gk = el("g", {}, kamera);
  A.kaaret.forEach(([a, b]) => {
    const sa = PUU.solmu[a], sb = PUU.solmu[b];
    const p = el("path", {d: polaari(sa, sb), class: "kaari" + (sa.lk !== 4 || sb.lk !== 4 ? " k-lk" : "")}, gk);
    kaariEl.push({a, b, el: p});
  });
  // solmut
  const gs = el("g", {}, kamera);
  A.solmut.forEach(s => {
    const r = koko(s), a = PUU.alue(s.alue);
    const g = el("g", {class: `solmu lk${s.lk}`, transform: `translate(${s.rx} ${s.ry})`, tabindex: 0, role: "button",
      "aria-label": `${s.nimi}, ${s.lk}. luokka, ${a.nimi}`, style: `--c:${a.vari}`}, gs);
    el("circle", {r: r + 6, class: "hehku"}, g);
    if (s.taso === "haaste" && s.lk === 4) el("circle", {r: r + 5, class: "haaste"}, g);
    el("circle", {r, class: "reuna"}, g);
    if (s.lk === 4) {
      const sc = (r * 1.15) / 24;
      el("g", {class: "ikoni", transform: `scale(${sc}) translate(-12 -12)`}, g).innerHTML = PUU.ikoni(s);
    }
    const ul = s.rx / Math.max(1, Math.hypot(s.rx, s.ry)), vl = s.ry / Math.max(1, Math.hypot(s.rx, s.ry));
    const tx = el("text", {class: "nimi", x: ul * (r + 8), y: vl * (r + 8) + 4, "text-anchor": ul > 0.3 ? "start" : ul < -0.3 ? "end" : "middle"}, g);
    tx.textContent = s.nimi;
    solmuEl[s.id] = g;
    g.addEventListener("pointerenter", () => korosta(s.id));
    g.addEventListener("pointerleave", () => korosta(PUU.valittu));
    g.addEventListener("click", e => { if (!liikkui) { PUU.avaa(s.id); naytaJosPiilossa(s.id); } });
    g.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); PUU.avaa(s.id); } });
  });
  paivitaTila(); suodata(); sovita();
}

function paivitaTila() {
  const A = PUU.aine;
  A.solmut.forEach(s => {
    const g = solmuEl[s.id]; if (!g) return;
    g.classList.remove("t-osattu", "t-avoin", "t-lukittu"); g.classList.add("t-" + PUU.tila(s.id));
    g.classList.toggle("valittu", PUU.valittu === s.id);
  });
  kaariEl.forEach(k => {
    const ta = PUU.tila(k.a), tb = PUU.tila(k.b);
    k.el.classList.toggle("k-osattu", ta === "osattu" && tb === "osattu");
    k.el.classList.toggle("k-seuraava", ta === "osattu" && tb === "avoin");
  });
  const y = PUU.yhteenveto();
  document.getElementById("tilasto").innerHTML = `osattu <b>${y.osattu}/${y.kaikki}</b> · ydin <b>${y.ydinOsattu}/${y.ydin}</b> · avoimia <b>${y.avoimia}</b>`;
}
function suodata() {
  PUU.aine.solmut.forEach(s => { if (s.lk !== 4) solmuEl[s.id].style.display = nayta[s.lk] ? "" : "none"; });
  kaariEl.forEach(k => { const a = PUU.solmu[k.a], b = PUU.solmu[k.b]; k.el.style.display = (a.lk === 4 || nayta[a.lk]) && (b.lk === 4 || nayta[b.lk]) ? "" : "none"; });
}
function korosta(id) {
  kamera.classList.toggle("himmea", !!id);
  Object.values(solmuEl).forEach(g => g.classList.remove("korostus"));
  kaariEl.forEach(k => k.el.classList.remove("korostus", "ylos", "alas"));
  if (!id) return;
  const ylos = PUU.ketju(id, "ylos"), alas = PUU.ketju(id, "alas");
  [id, ...ylos, ...alas].forEach(i => solmuEl[i] && solmuEl[i].classList.add("korostus"));
  kaariEl.forEach(k => {
    if ((ylos.has(k.a) || k.a === id) && (ylos.has(k.b) || k.b === id)) k.el.classList.add("korostus", "ylos");
    else if ((alas.has(k.b)) && (alas.has(k.a) || k.a === id)) k.el.classList.add("korostus", "alas");
  });
}

/* ---------- kamera: vedä, rulla, nipistä ---------- */
function asetaKamera() { kamera.setAttribute("transform", `translate(${kam.x} ${kam.y}) scale(${kam.s})`); svg.classList.toggle("nayta-nimet", kam.s > 1.05 || document.getElementById("knimet").checked); }
function sovita() {
  const b = kehys.getBoundingClientRect(), R = PUU.aine.ympyra.sateet, rmax = R[R.length - 1] + 125;
  const ala = b.width > 720 ? 58 : 0, h = b.height - ala;
  kam.s = Math.min(b.width, h) / (2 * rmax); kam.x = b.width / 2; kam.y = h / 2; asetaKamera();
}
function zoomaa(k, cx, cy) {
  const b = kehys.getBoundingClientRect(); cx ??= b.width / 2; cy ??= b.height / 2;
  const s2 = Math.max(0.15, Math.min(4, kam.s * k)); const f = s2 / kam.s;
  kam.x = cx - (cx - kam.x) * f; kam.y = cy - (cy - kam.y) * f; kam.s = s2; asetaKamera();
}
const osoittimet = new Map(); let liikkui = false, alku = null, alkuEtaisyys = 0;
svg.addEventListener("pointerdown", e => { osoittimet.set(e.pointerId, {x: e.clientX, y: e.clientY}); liikkui = false; alku = {x: e.clientX, y: e.clientY, kx: kam.x, ky: kam.y};
  if (osoittimet.size === 2) { const [p, q] = [...osoittimet.values()]; alkuEtaisyys = Math.hypot(p.x - q.x, p.y - q.y); } });
svg.addEventListener("pointermove", e => {
  if (!osoittimet.has(e.pointerId)) return;
  osoittimet.set(e.pointerId, {x: e.clientX, y: e.clientY});
  if (osoittimet.size === 2) {
    const [p, q] = [...osoittimet.values()], d = Math.hypot(p.x - q.x, p.y - q.y), b = kehys.getBoundingClientRect();
    if (alkuEtaisyys) { zoomaa(d / alkuEtaisyys, (p.x + q.x) / 2 - b.left, (p.y + q.y) / 2 - b.top); alkuEtaisyys = d; }
    liikkui = true; return;
  }
  const dx = e.clientX - alku.x, dy = e.clientY - alku.y;
  if (Math.abs(dx) + Math.abs(dy) > 4) { liikkui = true; svg.classList.add("vedetaan"); if (!svg.hasPointerCapture(e.pointerId)) svg.setPointerCapture(e.pointerId); }
  if (liikkui) { kam.x = alku.kx + dx; kam.y = alku.ky + dy; asetaKamera(); }
});
function loppu(e) { osoittimet.delete(e.pointerId); svg.classList.remove("vedetaan"); if (osoittimet.size < 2) alkuEtaisyys = 0;
  if (osoittimet.size === 1) { const p = [...osoittimet.values()][0]; alku = {x: p.x, y: p.y, kx: kam.x, ky: kam.y}; } }
svg.addEventListener("pointerup", loppu); svg.addEventListener("pointercancel", loppu);
svg.addEventListener("click", e => { if (!liikkui && !e.target.closest(".solmu")) PUU.sulje(); });
svg.addEventListener("wheel", e => { e.preventDefault(); const b = kehys.getBoundingClientRect(); zoomaa(Math.exp(-e.deltaY * 0.0015), e.clientX - b.left, e.clientY - b.top); }, {passive: false});
document.getElementById("zplus").onclick = () => zoomaa(1.3);
document.getElementById("zmiinus").onclick = () => zoomaa(1 / 1.3);
document.getElementById("zsovita").onclick = sovita;
window.addEventListener("resize", () => { palkkiKorkeus(); sovita(); });

function naytaJosPiilossa(id) {
  const g = solmuEl[id].getBoundingClientRect(), pan = document.getElementById("paneeli");
  if (pan.hidden) return; const p = pan.getBoundingClientRect();
  if (g.right > p.left - 10 && g.bottom > p.top && g.top < p.bottom) keskita(id);
}
function keskita(id) {
  const s = PUU.solmu[id], b = kehys.getBoundingClientRect(), pan = document.getElementById("paneeli");
  const vapaa = !pan.hidden && b.width > 720 ? b.width - pan.offsetWidth - 32 : b.width;
  kam.s = Math.max(kam.s, 1.1); kam.x = vapaa / 2 - s.rx * kam.s; kam.y = b.height / 2 - s.ry * kam.s; asetaKamera();
}
document.getElementById("k3").onchange = e => { nayta[3] = e.target.checked; suodata(); };
document.getElementById("k5").onchange = e => { nayta[5] = e.target.checked; suodata(); };
document.getElementById("knimet").onchange = asetaKamera;
document.getElementById("nollaa").onclick = () => PUU.nollaa();
document.getElementById("haku").addEventListener("change", e => {
  const q = e.target.value.trim().toLowerCase(); if (!q) return;
  const s = PUU.aine.solmut.find(s => s.nimi.toLowerCase().includes(q) && (s.lk === 4 || nayta[s.lk]));
  if (s) { keskita(s.id); PUU.avaa(s.id); }
});
PUU.kuuntele(syy => {
  if (syy === "aine") { document.getElementById("aine").value = PUU.aine.koodi; PUU.sulje(); piirra(); }
  if (syy === "tila") { paivitaTila(); PUU.piirraPaneeli(); }
  if (syy === "valinta") { paivitaTila(); korosta(PUU.valittu); }
  if (syy === "hyppy" && PUU.valittu) keskita(PUU.valittu);
});
piirra();
</script>
</body>
</html>
