<title>Vuoden juhlat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">

<style>
:root{
  --paper:#EFF2F5; --surface:#FFFFFF; --surface-2:#F7F9FB;
  --grid:#DCE3EA; --line:#C9D3DC;
  --ink:#15222C; --ink-2:#4E626F; --ink-3:#7E8F9B;
  --core:#1B5A9E; --core-soft:#E4EDF6;
  --strong:#1F6E5C; --strong-soft:#E1F0EB;
  --chal:#9A6A16; --chal-soft:#F6EDDC;
  --alert:#A33A2B; --alert-soft:#F8E7E3;
  --shadow:0 1px 2px rgba(21,34,44,.06), 0 8px 24px -12px rgba(21,34,44,.18);
  --r:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0F161B; --surface:#18222A; --surface-2:#1D2830;
    --grid:#22303A; --line:#2E3E4A;
    --ink:#E8EFF4; --ink-2:#A3B4C0; --ink-3:#7A8B97;
    --core:#7FB2E4; --core-soft:#16303F;
    --strong:#77CDB4; --strong-soft:#123028;
    --chal:#E0B267; --chal-soft:#33270F;
    --alert:#E8907F; --alert-soft:#3A1E19;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -14px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --paper:#0F161B; --surface:#18222A; --surface-2:#1D2830;
  --grid:#22303A; --line:#2E3E4A;
  --ink:#E8EFF4; --ink-2:#A3B4C0; --ink-3:#7A8B97;
  --core:#7FB2E4; --core-soft:#16303F;
  --strong:#77CDB4; --strong-soft:#123028;
  --chal:#E0B267; --chal-soft:#33270F;
  --alert:#E8907F; --alert-soft:#3A1E19;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -14px rgba(0,0,0,.7);
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:16px; line-height:1.62;
  background-image:
    linear-gradient(to right, var(--grid) 1px, transparent 1px),
    linear-gradient(to bottom, var(--grid) 1px, transparent 1px);
  background-size:26px 26px;
}
.wrap{max-width:760px; margin:0 auto; padding:28px 20px 90px}
h1,h2,h3,h4{font-family:"Familjen Grotesk","IBM Plex Sans",system-ui,sans-serif; text-wrap:balance}

/* header */
header.top{background:var(--surface); border:1px solid var(--line); border-radius:var(--r);
  box-shadow:var(--shadow); padding:22px 24px; display:flex; gap:18px; align-items:flex-start}
.badge{flex:0 0 auto; width:54px; height:54px; border-radius:9px; display:grid; place-items:center;
  background:var(--core-soft); border:1px solid var(--core); color:var(--core)}
.badge svg{width:28px; height:28px; fill:none; stroke:currentColor; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round}
.eyebrow{font-family:"IBM Plex Mono",monospace; font-size:11px; letter-spacing:.14em;
  text-transform:uppercase; color:var(--ink-3); margin:0 0 5px}
header.top h1{margin:0; font-size:30px; font-weight:700; letter-spacing:-.015em}
header.top p{margin:5px 0 0; color:var(--ink-2); font-size:15px}
.tags{display:flex; flex-wrap:wrap; gap:5px; margin-top:11px}
.tag{font-family:"IBM Plex Mono",monospace; font-size:10.5px; letter-spacing:.05em; padding:2px 7px;
  border-radius:4px; background:var(--surface-2); border:1px solid var(--line); color:var(--ink-3)}
.tag.core{background:var(--core-soft); border-color:var(--core); color:var(--core)}

/* teksti */
article{margin-top:26px}
article h2{font-size:21px; font-weight:600; margin:32px 0 10px; letter-spacing:-.01em}
article p{margin:0 0 14px; max-width:64ch}
.lead{font-size:17.5px; color:var(--ink); border-left:3px solid var(--core); padding-left:16px; margin:0 0 8px}

.box{background:var(--surface); border:1px solid var(--line); border-radius:var(--r);
  padding:18px 22px; box-shadow:var(--shadow); margin:22px 0}
.box h3{margin:0 0 12px; font-size:16.5px; font-weight:600}
.box.warn{border-left:3px solid var(--alert)}
.box.note{border-left:3px solid var(--chal)}

ol.steps{margin:0; padding-left:0; list-style:none; counter-reset:s; display:grid; gap:12px}
ol.steps li{counter-increment:s; display:grid; grid-template-columns:auto 1fr; gap:13px; align-items:start}
ol.steps li::before{content:counter(s); font-family:"Familjen Grotesk",sans-serif; font-weight:700; font-size:14px;
  width:26px; height:26px; border-radius:50%; background:var(--core); color:#fff; display:grid; place-items:center; margin-top:2px}

ul.notes{margin:0; padding-left:19px}
ul.notes li{margin-bottom:7px}
ul.notes li:last-child{margin-bottom:0}

.tablewrap{overflow-x:auto}
table{border-collapse:collapse; width:100%; font-size:14.5px; min-width:460px}
th,td{text-align:left; padding:9px 13px; border-bottom:1px solid var(--line)}
th{font-family:"IBM Plex Mono",monospace; font-size:10.5px; letter-spacing:.1em; text-transform:uppercase;
  color:var(--ink-3); font-weight:400; background:var(--surface-2)}
tr:last-child td{border-bottom:0}
td b{color:var(--core); font-weight:600}
td:last-child{font-variant-numeric:tabular-nums; font-weight:600}

/* lukusuora */
.nl svg{width:100%; height:118px; display:block}
.nl .rail{stroke:var(--line); stroke-width:2}
.nl .tick{stroke:var(--line); stroke-width:1.5}
.nl .stop{fill:var(--ink-3); font-family:"IBM Plex Mono",monospace; font-size:11px}
.nl .stop.near{fill:var(--core); font-weight:600}
.nl .dot{fill:var(--chal)}
.nl .val{fill:var(--ink); font-family:"Familjen Grotesk",sans-serif; font-size:15px; font-weight:700}
.nl .halfway{stroke:var(--chal); stroke-dasharray:3 3; stroke-width:1.5}
.nl-controls{display:flex; align-items:center; gap:14px; margin-top:6px}
.nl-controls input{flex:1; accent-color:var(--core)}
.nl-out{font-family:"Familjen Grotesk",sans-serif; font-size:15px; font-weight:600; min-width:12.5em; text-align:right}

/* paikka-arvotaulu */
.box .ohje{margin:0 0 14px; font-size:14.5px; color:var(--ink-2)}
.nt-valinta{display:flex; flex-wrap:wrap; gap:7px; margin-bottom:16px}
.nt-valinta button{font:inherit; font-size:12.5px; font-family:"IBM Plex Mono",monospace; padding:5px 11px;
  border-radius:6px; border:1px solid var(--line); background:var(--surface-2); color:var(--ink-2); cursor:pointer}
.nt-valinta button[aria-pressed="true"]{background:var(--ink); color:var(--paper); border-color:var(--ink)}
.nt-valinta button:focus-visible{outline:2px solid var(--core); outline-offset:2px}
.nt-taulu{display:flex; flex-direction:column; gap:4px; align-items:flex-start; overflow-x:auto; padding-bottom:4px}
.nt-rivi{display:flex; gap:6px; align-items:center}
.nt-rivi .otsa{font-family:"IBM Plex Mono",monospace; font-size:9.5px; letter-spacing:.08em;
  text-transform:uppercase; color:var(--ink-3); width:52px; text-align:center}
.nt-ruutu{width:52px; height:52px; display:grid; place-items:center; border:1.5px solid var(--line);
  border-radius:7px; background:var(--surface-2); font-family:"IBM Plex Mono",monospace; font-size:24px}
.nt-ruutu.kohta{border-color:var(--core); background:var(--core-soft); color:var(--core); font-weight:500}
.nt-ruutu.ratkaiseva{border-color:var(--chal); background:var(--chal-soft); color:var(--chal); font-weight:500}
.nt-ruutu.nolla{color:var(--ink-3)}
.nt-rivi .nimi{font-size:12.5px; color:var(--ink-3); margin-left:12px; white-space:nowrap}
.nt-nuoli{font-size:17px; color:var(--chal); margin-left:6px}
.nt-selite{margin:14px 0 0; font-size:14.5px}
.nt-selite b{color:var(--core)}

/* vahvuusportaat */
.vp-tasot{display:grid; gap:9px; margin-bottom:18px}
.vp-taso{display:flex; gap:11px; align-items:flex-start; font-size:13.5px}
.vp-taso .vp-pallo{width:13px; height:13px; border-radius:4px; margin-top:5px; flex:0 0 auto}
.vp-taso[data-taso="sulkeet"] .vp-pallo{background:var(--core)}
.vp-taso[data-taso="kertojako"] .vp-pallo{background:var(--strong)}
.vp-taso[data-taso="yhteenvahennys"] .vp-pallo{background:var(--chal)}
.vp-taso strong{display:block; font-family:"Familjen Grotesk",sans-serif; font-weight:600; font-size:14.5px}
.vp-taso span{color:var(--ink-2)}
.vp-lauseke{display:flex; flex-wrap:wrap; gap:7px; align-items:flex-end; font-family:"IBM Plex Mono",monospace;
  font-size:25px; padding:10px 2px; min-height:64px}
.vp-lauseke .t{padding:2px 3px}
.vp-lauseke .op{position:relative; padding:2px 9px; border-radius:6px; font-weight:500}
.vp-lauseke .op[data-taso="sulkeet"]{background:var(--core-soft); color:var(--core)}
.vp-lauseke .op[data-taso="kertojako"]{background:var(--strong-soft); color:var(--strong)}
.vp-lauseke .op[data-taso="yhteenvahennys"]{background:var(--chal-soft); color:var(--chal)}
.vp-lauseke .op i{position:absolute; top:-9px; right:-6px; font-style:normal; font-family:"Familjen Grotesk",sans-serif;
  font-size:11px; font-weight:700; width:18px; height:18px; border-radius:50%; display:grid; place-items:center;
  background:currentColor}
.vp-lauseke .op i span{color:var(--surface)}
.vp-rivi{display:flex; align-items:center; gap:16px; margin-top:8px}
.vp-vastaus{font-family:"Familjen Grotesk",sans-serif; font-size:16px; font-weight:600; color:var(--strong)}

/* laskujärjestys-widget */
.lj-exp{display:flex; flex-wrap:wrap; gap:7px; align-items:center; font-family:"IBM Plex Mono",monospace;
  font-size:23px; padding:14px 4px; min-height:62px}
.lj-exp .tok{padding:2px 4px; color:var(--ink)}
.lj-exp button.op{font-family:"IBM Plex Mono",monospace; font-size:23px; padding:3px 12px; border-radius:7px;
  border:1.5px solid var(--line); background:var(--surface-2); color:var(--ink); line-height:1.2}
.lj-exp button.op:hover{border-color:var(--core); color:var(--core)}
.lj-exp button.op:focus-visible{outline:2px solid var(--core); outline-offset:2px}
.lj-exp .valmis{font-family:"Familjen Grotesk",sans-serif; font-size:23px; font-weight:700; color:var(--strong)}
.lj-fb{font-size:14.5px; min-height:1.5em; color:var(--ink-2)}
.lj-fb.no{color:var(--alert)}
.lj-fb.ok{color:var(--strong)}
.lj-row{display:flex; align-items:center; gap:14px; margin-top:10px}
.lj-step{font-family:"IBM Plex Mono",monospace; font-size:11.5px; letter-spacing:.1em;
  text-transform:uppercase; color:var(--ink-3)}

/* harjoitukset */
.progress{position:sticky; top:0; z-index:5; background:var(--surface); border:1px solid var(--line);
  border-radius:var(--r); padding:12px 18px; box-shadow:var(--shadow); display:flex; align-items:center;
  gap:14px; margin:34px 0 18px}
.progress .lbl{font-family:"IBM Plex Mono",monospace; font-size:11px; letter-spacing:.12em;
  text-transform:uppercase; color:var(--ink-3); white-space:nowrap}
.progress .meter{flex:1; height:7px; border-radius:4px; background:var(--surface-2); border:1px solid var(--line); overflow:hidden}
.progress .meter i{display:block; height:100%; background:var(--core); transition:width .25s ease}
.progress .cnt{font-family:"Familjen Grotesk",sans-serif; font-weight:700; font-variant-numeric:tabular-nums; white-space:nowrap}

.grp{margin-top:26px}
.grp-head{display:flex; align-items:baseline; gap:10px; border-bottom:1.5px solid var(--ink); padding-bottom:7px; margin-bottom:14px}
.grp-head h3{margin:0; font-size:17px; font-weight:600}
.grp-head span{font-size:12.5px; color:var(--ink-2)}

.ex{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:14px 16px; margin-bottom:10px}
.ex[data-tila="oikein"]{border-color:var(--strong); box-shadow:inset 3px 0 0 var(--strong)}
.ex[data-tila="vaarin"]{border-color:var(--alert); box-shadow:inset 3px 0 0 var(--alert)}
.ex .q{display:flex; gap:11px; align-items:baseline; flex-wrap:wrap}
.ex .num{font-family:"IBM Plex Mono",monospace; font-size:11.5px; color:var(--ink-3); min-width:2.4em}
.ex .txt{flex:1; min-width:190px; font-size:15.5px}
.ex .txt .aineisto{display:block; margin-bottom:9px; padding-left:12px;
  border-left:2px solid var(--line); color:var(--ink-2); line-height:1.6;
  /* Aineisto voi olla pieni taulukko, jonka rivit on erotettu rivinvaihdoilla.
     Ilman pre-lineä ne valuisivat yhdeksi kappaleeksi ja taulukko katoaisi. */
  white-space:pre-line}
.ex .txt .kysymysrivi{display:block; font-weight:600}
.ex .row{display:flex; gap:8px; align-items:center; margin-top:11px; flex-wrap:wrap}
.ex input[type=text]{font:inherit; font-family:"IBM Plex Mono",monospace; font-size:15px; width:8.5em;
  padding:7px 11px; border:1px solid var(--line); border-radius:7px; background:var(--surface-2);
  color:var(--ink); text-align:right}
.ex input:focus-visible{outline:2px solid var(--core); outline-offset:1px}
button{font:inherit; cursor:pointer}
.btn{font-size:13.5px; padding:7px 15px; border-radius:7px; border:1px solid var(--core);
  background:var(--core); color:#fff}
.btn.ghost{background:transparent; color:var(--ink-2); border-color:var(--line)}
.btn:focus-visible{outline:2px solid var(--core); outline-offset:2px}
.btn.mv-valinta{text-align:left}
/* kuuntelutehtävä: selaimen puhesynteesi lukee englanninkielisen tekstin */
.kuuntele{display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin:2px 0 10px}
.kuuntele .btn{display:inline-flex; gap:7px; align-items:center}
.kuuntele svg{width:16px; height:16px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round}
.kuuntele .varateksti{flex-basis:100%; font-size:14px; color:var(--ink-2); background:var(--surface-2);
  border-radius:7px; padding:8px 12px; margin:0}
.btn.mv-valinta:disabled{cursor:default; opacity:.65}
.btn.mv-oikein{background:var(--strong-soft); border-color:var(--strong); color:var(--strong); opacity:1}
.btn.mv-vaarin{background:var(--alert-soft); border-color:var(--alert); color:var(--alert); opacity:1}
.row.mv{gap:8px 10px}
.fb{margin-top:11px; font-size:14.5px; padding:10px 13px; border-radius:8px; line-height:1.5}
.fb.ok{background:var(--strong-soft); color:var(--strong)}
.fb.no{background:var(--alert-soft); color:var(--alert)}
.fb.hint{background:var(--chal-soft); color:var(--chal)}

.done{background:var(--strong-soft); border:1px solid var(--strong); color:var(--strong);
  border-radius:var(--r); padding:16px 20px; margin-top:20px; font-size:15.5px}
.done h3{margin:0 0 4px; font-size:17px; color:var(--strong)}

details.teacher{margin-top:34px; background:var(--surface); border:1px solid var(--line);
  border-left:3px solid var(--chal); border-radius:var(--r); padding:15px 20px; box-shadow:var(--shadow)}
details.teacher summary{cursor:pointer; font-family:"Familjen Grotesk",sans-serif; font-weight:600; font-size:15px}
details.teacher summary:focus-visible{outline:2px solid var(--core); outline-offset:3px}
details.teacher ul{margin:12px 0 0; padding-left:19px; color:var(--ink-2); font-size:14.5px}
details.teacher li{margin-bottom:8px}
details.teacher p{margin:12px 0 0; color:var(--ink-2); font-size:14.5px}

.back{display:inline-block; margin-top:30px; font-size:13.5px; color:var(--ink-2)}
.back a{color:var(--core)}

@media (prefers-reduced-motion: reduce){*{transition:none !important}}
@media (max-width:560px){
  .wrap{padding:16px 13px 70px}
  header.top h1{font-size:25px}
  .progress{flex-wrap:wrap}
}
</style>

<div class="wrap">

  <header class="top">
    <span class="badge"><svg viewBox="0 0 24 24" aria-hidden="true" id="ikoni"></svg></span>
    <div>
      <p class="eyebrow" id="eyebrow"></p>
      <h1 id="otsikko"></h1>
      <p id="kuvaus"></p>
      <div class="tags" id="tags"></div>
    </div>
  </header>

  <article id="teksti"></article>

  <div class="progress" aria-live="polite">
    <span class="lbl">Harjoitukset</span>
    <span class="meter"><i id="pbar" style="width:0%"></i></span>
    <span class="cnt" id="pcnt">0 / 20</span>
  </div>

  <div id="harjoitukset"></div>
  <div id="valmis"></div>

  <p class="back" id="back"></p>

</div>

<script>
const D = {"tavoite_id":"UE4-TAP-01","oppiaine":"UE","vuosiluokka":4,"taso":"ydin","otsikko":"Vuoden juhlat","kuvaus":"Tunnistan kirkkovuoden juhlapyhät ja osaan kertoa, mitä kukin juhla muistaa.","versio":"0.3","paivitetty":"2026-09-26","ops":{"T":["T2"],"S":["S1"]},"eyebrow":"Uskonto · 4. luokka · Kirkkovuosi ja tavat","ikoni":"kadet","teksti":[{"tyyppi":"johdanto","sisalto":"Kalenterissa on tavallisesti toukokuussa punainen torstai, helatorstai, ja koulu on kiinni. Useimmat tietävät, että päivä on vapaa, mutta harva osaa sanoa, mitä sinä päivänä muistetaan. Moni suomalainen vapaapäivä on kirkon juhla: joulu, loppiainen, pitkäperjantai, pääsiäinen, helatorstai, juhannus ja pyhäinpäivä. Kun tiedät, mitä kukin juhla muistaa ja missä kohtaa vuotta se on, ymmärrät, miksi kalenteri on sellainen kuin on ja mistä monet tavat ovat peräisin. Tämä tieto on hyödyllistä riippumatta siitä, mitä itse ajattelet uskonnosta."},{"tyyppi":"kappale","otsikko":"Kirkkovuosi alkaa adventista","sisalto":"Kalenterivuosi alkaa 1. tammikuuta, mutta kirkkovuosi alkaa ensimmäisestä adventtisunnuntaista marraskuun lopussa tai joulukuun alussa. Kirkkovuosi on kirkon oma vuosi. Sen alkupuoli kulkee samassa järjestyksessä kuin Raamatun kertomus Jeesuksen elämästä: ensin odotetaan hänen syntymäänsä, sitten muistetaan syntymä, kärsimys, kuolema ja ylösnousemus ja lopuksi se, mitä tapahtui sen jälkeen. Adventtisunnuntaita on neljä, ja neljännen jälkeen tulee joulu. Kesän ja syksyn juhlat, juhannus ja pyhäinpäivä, eivät jatka kertomusta Jeesuksesta. Pyhäinpäivä on kirkkovuoden lopussa, ja kirkkovuoden viimeinen sunnuntai on tuomiosunnuntai viikkoa ennen adventtia. Sen jälkeen alkaa uusi kirkkovuosi."},{"tyyppi":"kappale","otsikko":"Vuodenaika katsotaan kuukaudesta","sisalto":"Tässä taidossa vuodenajat sovitaan kuukausien mukaan: talvi on joulu-, tammi- ja helmikuu, kevät maalis-, huhti- ja toukokuu, kesä kesä-, heinä- ja elokuu ja syksy syys-, loka- ja marraskuu. Osa juhlista on joka vuosi samana päivänä: joulupäivä 25. joulukuuta ja loppiainen 6. tammikuuta. Juhannuspäivä ja pyhäinpäivä ovat aina lauantaita, mutta päivämäärä vaihtelee muutaman päivän sisällä. Pääsiäispäivän päivämäärä vaihtelee vuodesta toiseen enemmän, maaliskuun loppupuolelta huhtikuun loppuun, ja sen mukana liikkuvat laskiainen, palmusunnuntai, kiirastorstai, pitkäperjantai, helatorstai ja helluntai. Pääsiäinen ja hiljaisen viikon päivät (palmusunnuntai, kiirastorstai ja pitkäperjantai) ovat silti joka vuosi keväällä. Adventin, laskiaisen, helatorstain ja helluntain kohdalla taulukko kertoo, minkä vuodenaikojen vaihteeseen ne osuvat, koska ne voivat olla eri vuosina eri kuukaudessa."},{"tyyppi":"taulukko","otsikko":"Kirkkovuoden juhlat adventista alkaen","otsikkorivi":["Juhla","Milloin","Vuodenaika","Mitä muistetaan"],"rivit":[["Adventti","Neljä sunnuntaita ennen joulua. Alkaa marraskuun lopussa tai joulukuun alussa.","Syksyn ja talven vaihde","Joulun odotusta. Kirkkovuosi alkaa."],["Joulu","Joulupäivä 25.12.","Talvi","Jeesuksen syntymää"],["Loppiainen","6.1.","Talvi","Itämaan tietäjiä, jotka tulivat Jeesus-lapsen luo. Joulun aika päättyy."],["Laskiainen","Sunnuntai seitsemän viikkoa ennen pääsiäistä, helmikuussa tai maaliskuun alussa","Talven ja kevään vaihde","Paastonajan alkua. Pääsiäistä aletaan odottaa."],["Palmusunnuntai","Viikko ennen pääsiäistä","Kevät","Jeesuksen saapumista Jerusalemiin. Hiljainen viikko alkaa."],["Kiirastorstai","Pääsiäistä edeltävä torstai","Kevät","Jeesuksen viimeistä ateriaa opetuslasten kanssa"],["Pitkäperjantai","Pääsiäistä edeltävä perjantai","Kevät","Jeesuksen ristiinnaulitsemista ja kuolemaa"],["Pääsiäispäivä","Sunnuntai 22.3.–25.4.","Kevät","Jeesuksen ylösnousemusta"],["Helatorstai","Torstai vajaat kuusi viikkoa pääsiäisen jälkeen, yleensä toukokuussa","Kevät, joskus kesäkuun alku","Jeesuksen nousemista taivaaseen"],["Helluntai","Sunnuntai seitsemän viikkoa pääsiäispäivän jälkeen, touko- tai kesäkuussa","Kevään ja kesän vaihde","Pyhän Hengen tuloa opetuslapsiin"],["Juhannus","Juhannuspäivä on lauantai 20.–26.6.","Kesä","Johannes Kastajan syntymää"],["Pyhäinpäivä","Lauantai 31.10.–6.11.","Syksy","Kuolleita läheisiä ja kaikkia pyhiä eli kristittyjä, jotka ovat kuolleet"]]},{"tyyppi":"kappale","otsikko":"Joulun aika: adventti, joulu ja loppiainen","sisalto":"Adventti tarkoittaa tulemista. Adventtiaikana kirkossa odotetaan joulua ja valmistaudutaan siihen. Ensimmäisenä adventtisunnuntaina kirkoissa lauletaan Hoosianna-laulua, joka kertoo, kuinka ihmiset tervehtivät Jeesusta, kun hän saapui Jerusalemiin. Jouluna muistetaan Jeesuksen syntymää. Luukkaan evankeliumin mukaan Jeesus syntyi Betlehemissä, ja paimenet tulivat katsomaan häntä (Luuk. 2:1–20). Loppiaisena muistetaan itämaan tietäjiä, jotka Matteuksen evankeliumin mukaan seurasivat tähteä Jeesus-lapsen luo ja toivat lahjaksi kultaa, suitsuketta ja mirhaa (Matt. 2:1–12). Raamattu ei kerro, montako tietäjää oli. Ajatus kolmesta tietäjästä tulee kolmesta lahjasta. Loppiaisen nimi kertoo, että joulun aika loppuu."},{"tyyppi":"kappale","otsikko":"Pääsiäinen ja hiljainen viikko","sisalto":"Laskiainen on sunnuntai seitsemän viikkoa ennen pääsiäistä. Sen jälkeen alkaa paastonaika, jolloin kirkossa valmistaudutaan pääsiäiseen. Pääsiäistä edeltävä viikko on hiljainen viikko. Se alkaa palmusunnuntaista, jolloin muistetaan, kuinka Jeesus ratsasti aasilla Jerusalemiin ja ihmiset levittivät tielle vaatteitaan ja oksia (Matt. 21:1–11). Kiirastorstaina muistetaan Jeesuksen viimeistä ateriaa opetuslastensa kanssa. Kirkon opetuksen mukaan Jeesus asetti silloin ehtoollisen (Matt. 26:26–29). Pitkäperjantaina muistetaan, että Jeesus ristiinnaulittiin ja hän kuoli. Pääsiäispäivänä muistetaan ylösnousemusta: evankeliumien mukaan naiset löysivät haudan tyhjänä, ja kristityt uskovat, että Jeesus nousi kuolleista (Mark. 16:1–8). Pääsiäinen on kirkkovuoden suurin juhla. Pääsiäispäivä on aina sunnuntai ja aina keväällä, mutta sen päivämäärä vaihtelee."},{"tyyppi":"ansa","otsikko":"Ansa 1: helatorstai ja helluntai sekaisin","sisalto":"Helatorstai ja helluntai alkavat samalla tavalla ja ovat molemmat pääsiäisen jälkeen, joten ne menevät helposti sekaisin. Helatorstaina muistetaan Jeesuksen nousemista taivaaseen. Apostolien tekojen mukaan Jeesus näyttäytyi opetuslapsilleen pääsiäisen jälkeen neljänkymmenen päivän ajan (Apt. 1:3), ja sitten pilvi otti hänet heidän näkyvistään (Apt. 1:9). Helatorstai on aina torstai, yleensä toukokuussa. Helluntaina muistetaan Pyhän Hengen tuloa opetuslapsiin (Apt. 2:1–4), ja siksi helluntaita kutsutaan kirkon syntymäpäiväksi. Helluntai on aina sunnuntai, tasan seitsemän viikkoa pääsiäispäivän jälkeen. Järjestys ratkaisee: kertomuksessa Jeesus nousee ensin taivaaseen, ja sitten Pyhä Henki tulee. Helatorstain nimessä on viikonpäivä: se on aina torstai. Helluntai tulee kymmenen päivää myöhemmin, sunnuntaina."},{"tyyppi":"kappale","otsikko":"Kesän ja syksyn juhlat: juhannus ja pyhäinpäivä","sisalto":"Juhannus on kirkossa Johannes Kastajan päivä, ja juhannuksen nimikin tulee Johanneksen nimestä. Juhannuksena muistetaan Johannes Kastajan syntymää (Luuk. 1:57–66). Raamatun mukaan Johannes valmisti ihmisiä Jeesuksen tuloon ja kastoi Jeesuksen Jordanjoessa (Matt. 3:13–17). Juhannus on myös keskikesän juhla, ja esimerkiksi juhannuskokko on vanhaa kansanperinnettä, joka ei tule Raamatusta. Pyhäinpäivänä muistetaan kuolleita läheisiä ja kaikkia pyhiä eli kristittyjä, jotka ovat kuolleet. Monet vievät silloin kynttilän haudalle. Pyhäinpäivä on syksyllä, lauantaina 31. lokakuuta ja 6. marraskuuta välillä, ja se kuuluu kirkkovuoden loppuun."},{"tyyppi":"ansa","otsikko":"Ansa 2: kirkkovuosi ei ala tammikuussa","sisalto":"Kalenterissa vuosi alkaa tammikuussa, ja siksi moni luulee, että kirkkovuoden ensimmäinen juhla on loppiainen. Kirkkovuosi alkaa kuitenkin ensimmäisestä adventtisunnuntaista. Joulu ei ole kirkkovuoden lopussa vaan sen alussa, heti adventin jälkeen. Samasta syystä pyhäinpäivä, joka on kalenterissa ennen joulua, on kirkkovuoden lopussa. Kun järjestät juhlia kirkkovuoden järjestykseen, aloita adventista ja kulje talven, kevään ja kesän kautta syksyyn."},{"tyyppi":"muistilappu","otsikko":"Muista nämä","kohdat":["Kirkkovuosi alkaa ensimmäisestä adventtisunnuntaista, ei tammikuusta.","Adventtisunnuntaita on neljä. Sitten tulevat joulu (Jeesuksen syntymä) ja loppiainen (itämaan tietäjät).","Hiljainen viikko: palmusunnuntai, kiirastorstai (viimeinen ateria), pitkäperjantai (kuolema), pääsiäispäivä (ylösnousemus).","Ensin helatorstai (muistetaan Jeesuksen nousemista taivaaseen), sitten helluntai (muistetaan Pyhän Hengen tuloa).","Juhannus muistaa Johannes Kastajan syntymää, pyhäinpäivä kuolleita läheisiä ja kaikkia pyhiä.","Pyhäinpäivä on kirkkovuoden lopussa, vaikka se on kalenterissa ennen joulua."]}],"harjoitusryhmat":[{"id":"jarjestys","nimi":"Kirkkovuoden järjestys","info":"Aloita adventista. Kirkkovuosi kulkee talven, kevään ja kesän kautta syksyyn ja päättyy pyhäinpäivän jälkeen."},{"id":"ajankohta","nimi":"Milloin juhlaa vietetään","info":"Katso kuukausi ja muuta se vuodenajaksi. Juhlan nimessä oleva viikonpäivä kertoo, minä päivänä sitä vietetään."},{"id":"muisto","nimi":"Mitä juhla muistaa","info":"Helatorstai tulee ensin: silloin muistetaan Jeesuksen nousemista taivaaseen. Helluntai tulee perässä: silloin muistetaan Pyhän Hengen tuloa."}],"harjoitukset":[{"id":"H01","ryhma":"jarjestys","kysymys":"Juhlat: pääsiäispäivä, joulu, adventti, juhannus.\n\nJärjestä juhlat kirkkovuoden järjestykseen adventista alkaen. Monenneksi tulee pääsiäispäivä?","vastaus":3,"vinkki":"Adventti on ensimmäinen. Mikä juhla tulee heti sen jälkeen talvella?","selitys":"Järjestys on adventti, joulu, pääsiäispäivä, juhannus. Talven juhlat tulevat ensin, pääsiäinen keväällä ja juhannus kesällä. Pääsiäispäivä on kolmas."},{"id":"H02","ryhma":"jarjestys","kysymys":"Juhlat: helluntai, loppiainen, helatorstai, adventti, joulu.\n\nJärjestä juhlat kirkkovuoden järjestykseen adventista alkaen. Monenneksi tulee helluntai?","vastaus":5,"vinkki":"Helatorstai ja helluntai ovat molemmat pääsiäisen jälkeen. Kumpi tulee ensin?","selitys":"Järjestys on adventti, joulu, loppiainen, helatorstai, helluntai. Helatorstaina muistetaan Jeesuksen nousemista taivaaseen, ja vasta sen jälkeen helluntaina Pyhän Hengen tuloa. Helluntai on viides."},{"id":"H03","ryhma":"jarjestys","kysymys":"Juhlat: pyhäinpäivä, joulu, adventti, pääsiäispäivä, loppiainen.\n\nJärjestä juhlat kirkkovuoden järjestykseen adventista alkaen. Monenneksi tulee pyhäinpäivä?","vastaus":5,"vinkki":"Pyhäinpäivä on syksyllä juuri ennen adventtia. Kirkkovuosi alkaa adventista, joten mihin kohtaan pyhäinpäivä jää?","selitys":"Järjestys on adventti, joulu, loppiainen, pääsiäispäivä, pyhäinpäivä. Pyhäinpäivä on kalenterissa ennen adventtia, mutta kirkkovuosi alkaa adventista. Siksi pyhäinpäivä on kirkkovuoden lopussa, viidentenä."},{"id":"H04","ryhma":"jarjestys","kysymys":"Päivät: pitkäperjantai, palmusunnuntai, pääsiäispäivä, kiirastorstai.\n\nJärjestä päivät siihen järjestykseen, jossa niitä vietetään. Monenneksi tulee kiirastorstai?","vastaus":2,"vinkki":"Hiljainen viikko alkaa palmusunnuntaista ja päättyy pääsiäiseen. Torstai tulee ennen perjantaita.","selitys":"Järjestys on palmusunnuntai, kiirastorstai, pitkäperjantai, pääsiäispäivä. Kiirastorstaina muistetaan viimeistä ateriaa ja seuraavana päivänä, pitkäperjantaina, Jeesuksen kuolemaa. Kiirastorstai on toinen."},{"id":"H05","ryhma":"jarjestys","kysymys":"Kirkkovuosi alkaa ensimmäisestä adventtisunnuntaista. Montako adventtisunnuntaita on ennen joulua?","vastaus":4,"vinkki":"Adventtiaika alkaa marraskuun lopussa tai joulukuun alussa ja päättyy jouluun. Montako sunnuntaita siihen mahtuu?","selitys":"Adventtisunnuntaita on neljä. Neljännen adventtisunnuntain jälkeen tulee joulu."},{"id":"H06","ryhma":"jarjestys","kysymys":"Juhlat: juhannus, loppiainen, helatorstai, joulu, laskiainen, helluntai.\n\nMontako näistä juhlista on kirkkovuodessa ennen pääsiäispäivää?","vastaus":3,"vinkki":"Etsi juhlat, jotka ovat talvella tai pääsiäistä odotettaessa.","selitys":"Joulu, loppiainen ja laskiainen ovat ennen pääsiäistä. Helatorstai, helluntai ja juhannus tulevat pääsiäisen jälkeen. Ennen pääsiäispäivää on 3 juhlaa."},{"id":"H07","ryhma":"jarjestys","tyyppi":"monivalinta","vaihtoehdot":["Uudenvuodenpäivästä 1. tammikuuta","Ensimmäisestä adventtisunnuntaista","Pääsiäispäivästä"],"kysymys":"Mistä kirkkovuosi alkaa?","vastaus":1,"vinkki":"Kirkkovuosi ja kalenterivuosi alkavat eri aikaan.","selitys":"Kirkkovuosi alkaa ensimmäisestä adventtisunnuntaista marraskuun lopussa tai joulukuun alussa. Uudenvuodenpäivänä alkaa kalenterivuosi, ja pääsiäinen on kirkkovuoden keskellä."},{"id":"H08","ryhma":"ajankohta","kysymys":"Vuodenajat kuukausina: talvi on joulu-, tammi- ja helmikuu, kevät maalis-, huhti- ja toukokuu, kesä kesä-, heinä- ja elokuu ja syksy syys-, loka- ja marraskuu.\nJuhlat: pitkäperjantai, juhannus, joulu, pääsiäispäivä, pyhäinpäivä.\n\nMontako näistä juhlista on keväällä?","vastaus":2,"vinkki":"Pääsiäinen ja hiljaisen viikon päivät ovat maalis- tai huhtikuussa.","selitys":"Pitkäperjantai ja pääsiäispäivä ovat keväällä. Joulu on talvella, juhannus kesällä ja pyhäinpäivä syksyllä. Keväällä on 2 juhlaa."},{"id":"H09","ryhma":"ajankohta","kysymys":"Vuodenajat kuukausina: talvi on joulu-, tammi- ja helmikuu, kevät maalis-, huhti- ja toukokuu, kesä kesä-, heinä- ja elokuu ja syksy syys-, loka- ja marraskuu.\nJuhlat: loppiainen, juhannus, joulu, kiirastorstai, pyhäinpäivä.\n\nMontako näistä juhlista on talvella?","vastaus":2,"vinkki":"Talvi on joulu-, tammi- ja helmikuu. Pyhäinpäivä on loka- tai marraskuussa.","selitys":"Joulu (25.12.) ja loppiainen (6.1.) ovat talvella. Kiirastorstai on keväällä, juhannus kesällä ja pyhäinpäivä syksyllä. Talvella on 2 juhlaa."},{"id":"H10","ryhma":"ajankohta","kysymys":"Vuodenajat kuukausina: talvi on joulu-, tammi- ja helmikuu, kevät maalis-, huhti- ja toukokuu, kesä kesä-, heinä- ja elokuu ja syksy syys-, loka- ja marraskuu.\nJuhlat: pyhäinpäivä, palmusunnuntai, juhannus, loppiainen, pääsiäispäivä, kiirastorstai.\n\nMontako näistä juhlista on keväällä?","vastaus":3,"vinkki":"Hiljainen viikko ja pääsiäinen ovat kaikki keväällä. Montako niistä on luettelossa?","selitys":"Palmusunnuntai, kiirastorstai ja pääsiäispäivä ovat keväällä. Pyhäinpäivä on syksyllä, juhannus kesällä ja loppiainen talvella. Keväällä on 3 juhlaa."},{"id":"H11","ryhma":"ajankohta","kysymys":"Juhlat: helatorstai, kiirastorstai, pitkäperjantai, joulupäivä, helluntai.\n\nMontako näistä juhlista vietetään joka vuosi torstaina?","vastaus":2,"vinkki":"Kahden juhlan nimessä on viikonpäivä. Joulupäivä on aina 25. joulukuuta, joten sen viikonpäivä vaihtelee.","selitys":"Helatorstai ja kiirastorstai ovat aina torstaita. Pitkäperjantai on perjantai, helluntai sunnuntai, ja joulupäivän viikonpäivä vaihtelee vuosittain. Torstaina vietetään 2 juhlaa."},{"id":"H12","ryhma":"ajankohta","kysymys":"Pääsiäispäivä ja helluntai ovat aina sunnuntaita. Montako viikkoa pääsiäispäivästä on helluntaihin?","vastaus":7,"vinkki":"Helluntai on seitsemäs sunnuntai pääsiäispäivän jälkeen.","selitys":"Helluntai on tasan seitsemän viikkoa pääsiäispäivän jälkeen. Siksi helluntai on touko- tai kesäkuussa, vaikka pääsiäinen on maalis- tai huhtikuussa."},{"id":"H13","ryhma":"ajankohta","kysymys":"Vuodenajat kuukausina: talvi on joulu-, tammi- ja helmikuu, kevät maalis-, huhti- ja toukokuu, kesä kesä-, heinä- ja elokuu ja syksy syys-, loka- ja marraskuu.\n1. juhannus\n2. loppiainen\n3. pyhäinpäivä\n4. pitkäperjantai\n\nMonesko luettelon juhla on syksyllä?","vastaus":3,"vinkki":"Syksy on syys-, loka- ja marraskuu. Mikä juhla on lokakuun lopun ja marraskuun alun välillä?","selitys":"Pyhäinpäivä on lauantai lokakuun lopun ja marraskuun alun välillä, siis syksyllä. Juhannus on kesällä, loppiainen talvella ja pitkäperjantai keväällä. Vastaus on 3."},{"id":"H14","ryhma":"muisto","kysymys":"1. joulu\n2. pitkäperjantai\n3. helatorstai\n4. helluntai\n5. juhannus\n\nMonesko juhla muistaa Jeesuksen nousemista taivaaseen?","vastaus":3,"vinkki":"Raamatun kertomuksessa taivaaseen nouseminen on ennen Pyhän Hengen tuloa. Kumpi juhla on torstai?","selitys":"Helatorstaina muistetaan Jeesuksen nousemista taivaaseen. Helluntaina muistetaan Pyhän Hengen tuloa, joka Raamatussa kerrotaan vasta sen jälkeen. Vastaus on 3."},{"id":"H15","ryhma":"muisto","kysymys":"1. loppiainen\n2. helluntai\n3. kiirastorstai\n4. pääsiäispäivä\n5. helatorstai\n\nMonesko juhla muistaa Pyhän Hengen tuloa opetuslapsiin?","vastaus":2,"vinkki":"Apostolien tekojen mukaan Pyhä Henki tuli Jeesuksen taivaaseen nousemisen jälkeen. Kumpi juhla on myöhemmin?","selitys":"Helluntaina muistetaan Pyhän Hengen tuloa opetuslapsiin, ja siksi sitä kutsutaan kirkon syntymäpäiväksi. Helatorstai muistaa taivaaseen nousemista. Vastaus on 2."},{"id":"H16","ryhma":"muisto","tyyppi":"monivalinta","vaihtoehdot":["Johannes Kastajan syntymää","Jeesuksen kastetta Jordanjoessa","Pyhän Hengen tuloa"],"kysymys":"Juhannusta kutsutaan kirkossa Johannes Kastajan päiväksi.\n\nMitä juhannuksena kirkossa muistetaan?","vastaus":0,"vinkki":"Juhannus on kesäkuun lopussa. Kirkon perinteen mukaan Johannes syntyi puoli vuotta ennen Jeesusta.","selitys":"Juhannuksena muistetaan Johannes Kastajan syntymää. Raamatun mukaan Johannes kastoi myöhemmin Jeesuksen, mutta juhannus muistaa Johanneksen syntymää, ei kastetta. Pyhän Hengen tuloa muistetaan helluntaina."},{"id":"H17","ryhma":"muisto","kysymys":"Virkkeet:\n1. Jouluna muistetaan Jeesuksen syntymää.\n2. Pitkäperjantaina muistetaan Jeesuksen ylösnousemusta.\n3. Loppiaisena muistetaan itämaan tietäjiä.\n4. Helatorstaina muistetaan Pyhän Hengen tuloa.\n5. Kiirastorstaina muistetaan Jeesuksen viimeistä ateriaa.\n\nMontako virkkeistä pitää paikkansa?","vastaus":3,"vinkki":"Tarkista erityisesti pitkäperjantai ja helatorstai. Ne sekoittuvat helposti naapuriinsa.","selitys":"Virkkeet 1, 3 ja 5 pitävät paikkansa. Pitkäperjantaina muistetaan Jeesuksen kuolemaa; ylösnousemusta muistetaan pääsiäispäivänä. Helatorstaina muistetaan taivaaseen nousemista; Pyhän Hengen tuloa muistetaan helluntaina. Oikeita virkkeitä on 3."},{"id":"H18","ryhma":"muisto","kysymys":"Virkkeet:\n1. Pääsiäispäivänä muistetaan, että Raamatun mukaan Jeesus nousi kuolleista.\n2. Adventtina odotetaan joulua.\n3. Pyhäinpäivänä muistetaan Johannes Kastajaa.\n4. Helluntaina muistetaan Jeesuksen syntymää.\n\nMontako virkkeistä on virheellisiä?","vastaus":2,"vinkki":"Kaksi virkettä on oikein. Kenen muistopäivä juhannus on?","selitys":"Virke 3 on väärin: Johannes Kastajan syntymää muistetaan juhannuksena, pyhäinpäivänä muistetaan kuolleita läheisiä ja kaikkia pyhiä. Virke 4 on väärin: Jeesuksen syntymää muistetaan jouluna, helluntaina Pyhän Hengen tuloa. Virheellisiä on 2."},{"id":"H19","ryhma":"muisto","kysymys":"1. palmusunnuntai\n2. pitkäperjantai\n3. kiirastorstai\n4. pääsiäispäivä\n\nMonesko päivä muistaa Jeesuksen ristiinnaulitsemista ja kuolemaa?","vastaus":2,"vinkki":"Päivä on hiljaisen viikon perjantai.","selitys":"Pitkäperjantaina muistetaan Jeesuksen ristiinnaulitsemista ja kuolemaa. Kiirastorstai on edellinen päivä (viimeinen ateria), ja pääsiäispäivä on kaksi päivää myöhemmin (ylösnousemus). Vastaus on 2."},{"id":"H20","ryhma":"muisto","tyyppi":"monivalinta","vaihtoehdot":["Jeesuksen syntymää","Kuolleita läheisiä ja kaikkia pyhiä","Pyhän Hengen tuloa"],"kysymys":"Pyhäinpäivänä monet vievät kynttilän haudalle.\n\nMitä pyhäinpäivänä muistetaan?","vastaus":1,"vinkki":"Kynttilä haudalla kertoo, keitä muistetaan.","selitys":"Pyhäinpäivänä muistetaan kuolleita läheisiä ja kaikkia pyhiä. Jeesuksen syntymää muistetaan jouluna ja Pyhän Hengen tuloa helluntaina."}],"valmis_teksti":"Osaat sijoittaa kirkkovuoden juhlat oikeaan järjestykseen adventista alkaen, yhdistää ne vuodenaikaan ja kertoa omin sanoin, mitä kussakin juhlassa muistetaan. Tämä taito on nyt näytetty."};

const esc = s => s;
const osat = D.teksti.map(o=>{

    case "johdanto":
      return `<p class="lead">${esc(o.sisalto)}</p>`;

      return `<h2>${esc(o.otsikko)}</h2><p>${esc(o.sisalto)}</p>`;

      return `<div class="box"><h3>${esc(o.otsikko)}</h3><ol class="steps">${
        o.askeleet.map(a=>`<li><span>${esc(a)}</span></li>`).join("")}</ol></div>`;

      return `<div class="box"><h3>${esc(o.otsikko)}</h3><div class="tablewrap"><table><thead><tr>${

        o.rivit.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join("")}</tr>`).join("")}</tbody></table></div></div>`;
    case "ansa":
      return `<div class="box warn"><h3>${esc(o.otsikko)}</h3><p style="margin:0">${esc(o.sisalto)}</p></div>`;
    case "muistilappu":
      return `<div class="box note"><h3>${esc(o.otsikko)}</h3><ul class="notes">${
        o.kohdat.map(k=>`<li>${esc(k)}</li>`).join("")}</ul></div>`;

      return `<div class="box nt"><h3>${esc(o.otsikko)}</h3><p class="ohje">${esc(o.sisalto)}</p>

        <div class="nt-taulu" id="ntTaulu"></div>
        <p class="nt-selite" id="ntSelite"></p></div>`;

const svg=document.getElementById("nlsvg"), rng=document.getElementById("nlrange"), out=document.getElementById("nlout");
const X0=34, X1=606, Y=62;
function piirraNL(v){
  const ala=Math.floor(v/10)*10, yla=ala+10, puoli=ala+5;
  const pyor = (v%10)>=5 ? yla : ala;
  const x = n => X0 + (n/100)*(X1-X0);
  let s=`<line class="rail" x1="${X0}" y1="${Y}" x2="${X1}" y2="${Y}"/>`;
  for(let n=0;n<=100;n+=10){
    const near = (n===ala||n===yla);
    s+=`<line class="tick" x1="${x(n)}" y1="${Y-7}" x2="${x(n)}" y2="${Y+7}"/>`;
    s+=`<text class="stop${near?" near":""}" x="${x(n)}" y="${Y+24}" text-anchor="middle">${n}</text>`;
  }
  s+=`<line class="halfway" x1="${x(puoli)}" y1="${Y-16}" x2="${x(puoli)}" y2="${Y+12}"/>`;
  s+=`<text class="stop" x="${x(puoli)}" y="${Y-22}" text-anchor="middle">puoliväli ${puoli}</text>`;
  s+=`<circle class="dot" cx="${x(v)}" cy="${Y}" r="6"/>`;
  s+=`<text class="val" x="${x(v)}" y="${Y-32}" text-anchor="middle">${v}</text>`;
  s+=`<path d="M ${x(v)} ${Y+38} L ${x(pyor)} ${Y+38}" stroke="var(--core)" stroke-width="2" fill="none"/>`;
  s+=`<path d="M ${x(pyor)} ${Y+38} l ${x(pyor)>x(v)?-7:7} -4 l 0 8 z" fill="var(--core)"/>`;
  svg.innerHTML=s;
  out.textContent = `${v} pyöristyy → ${pyor}`;
}

/* ---------- laskujärjestys-widget ---------- */
const ljExp=document.getElementById("ljExp");
if(ljExp && D.kokeilu){
  let ljI=0, ljTokens=[], ljStep=0;
  const laske=(a,op,b)=>{a=+a;b=+b;return op==="×"?a*b:op==="÷"?a/b:op==="+"?a+b:a-b;};
  function ljAlku(){
    const l=D.kokeilu[ljI];
    ljTokens=l.lauseke.replace(/\(/g,"( ").replace(/\)/g," )").split(/\s+/).filter(Boolean);
    ljStep=0; ljPiirra(); ljViesti("","");
  }
  function ljViesti(t,lk){const f=document.getElementById("ljFb"); f.textContent=t; f.className="lj-fb "+(lk||"");}
  function ljPiirra(){
    const l=D.kokeilu[ljI];
    document.getElementById("ljStep").textContent =
      ljStep>=l.askeleet.length ? "valmis" : `askel ${ljStep+1} / ${l.askeleet.length}`;
    if(ljStep>=l.askeleet.length){
      ljExp.innerHTML=`<span class="valmis">${l.lauseke} = ${l.vastaus}</span>`;
      return;
    }
    ljExp.innerHTML=ljTokens.map((t,i)=>
      "×÷+−".includes(t) ? `<button type="button" class="op" data-i="${i}">${t}</button>`
                         : `<span class="tok">${t}</span>`).join("");
    ljExp.querySelectorAll("button.op").forEach(b=>b.addEventListener("click",()=>ljKlikkaa(+b.dataset.i)));
  }
  function ljKlikkaa(i){
    const l=D.kokeilu[ljI], odotettu=l.askeleet[ljStep];
    const ehdotus=[ljTokens[i-1],ljTokens[i],ljTokens[i+1]].join(" ");
    if(ehdotus!==odotettu){
      ljViesti(ljStep===0
        ? "Ei vielä. Sulkeet ovat vahvimmat, sitten kerto ja jako. Yhtä vahvat vasemmalta oikealle."
        : "Ei vielä. Kumpi jäljellä olevista on vahvempi?", "no");
      return;
    }
    const arvo=laske(ljTokens[i-1],ljTokens[i],ljTokens[i+1]);
    let alku=i-1, loppu=i+1;
    if(ljTokens[i-2]==="(" && ljTokens[i+2]===")"){ alku=i-2; loppu=i+2; }
    ljTokens.splice(alku, loppu-alku+1, String(arvo));
    ljStep++;
    ljViesti(ljStep>=l.askeleet.length ? "Valmis. Vastaus on "+l.vastaus+"." : "Oikein. Jatka seuraavaan.", "ok");
    ljPiirra();
  }
  document.getElementById("ljSeuraava").addEventListener("click",()=>{
    ljI=(ljI+1)%D.kokeilu.length; ljAlku();
  });
  ljAlku();
}

  const kysymys = osat.pop();
  return osat.map(p=>`<span class="aineisto">${p}</span>`).join("")
       + `<span class="kysymysrivi">${kysymys}</span>`;
};

/* Suomalainen lukumuoto: välilyönti on tuhaterotin, pilkku desimaalierotin.
   Piste voi olla kumpi tahansa. Se tulkitaan tuhaterottimeksi VAIN silloin, kun
   koko luku on aitoa tuhaterotinmuotoa: alkuosa 1–3 numeroa ilman etunollaa ja
   jokainen jatko-osa täsmälleen 3 numeroa (1.500, 12.345.678). Kaikissa muissa
   tapauksissa piste on desimaalipiste — myös 0.125, joka vanhalla säännöllä
   ("3 numeroa pisteen jäljessä = tuhaterotin") luettiin virheellisesti luvuksi 125. */
const TUHATEROTIN = /^[1-9]\d{0,2}(\.\d{3})+$/;
function lueLuku(teksti){
  // Murtoluku (3/4, -3/4) ja sekaluku (1 2/3, -1 2/3) hyväksytään sellaisinaan.
  const raaka = String(teksti).replace(/\u00a0/g, " ").trim();
  let m = raaka.match(/^(-?)(\d+)\s+(\d+)\s*\/\s*(\d+)$/);
  if(m){ const nim = Number(m[4]); if(nim === 0) return null;
    const v = Number(m[2]) + Number(m[3]) / nim; return m[1] ? -v : v; }
  m = raaka.match(/^(-?)\s*(\d+)\s*\/\s*(\d+)$/);
  if(m){ const nim = Number(m[3]); if(nim === 0) return null;
    const v = Number(m[2]) / nim; return m[1] ? -v : v; }
  let s = String(teksti).replace(/[\s\u00a0]/g, "");
  if(s === "") return null;
  if(s.indexOf(",") >= 0){
    s = s.replace(/\./g, "").replace(",", ".");
  } else if(TUHATEROTIN.test(s)){
    s = s.replace(/\./g, "");
  }
  const n = Number(s);
  return Number.isFinite(n) ? n : null;
}

function tarkista(id){
  const h=D.harjoitukset.find(x=>x.id===id);
  const kentta=document.getElementById("in-"+id);
  const fb=document.getElementById("fb-"+id);
  if(kentta.value.trim()===""){ fb.className="fb hint"; fb.textContent="Kirjoita vastaus ensin."; return; }
  const luku=lueLuku(kentta.value);
  if(luku===null){ fb.className="fb no"; fb.textContent="Vastauksen pitää olla luku tai murtoluku (esimerkiksi 3/4)."; return; }
  const oikein = Math.abs(luku - h.vastaus) < 1e-9;
  merkitseTulos(id, oikein, oikein ? "Oikein. "+h.selitys : `Ei vielä. ${h.vinkki} Kokeile uudelleen.`);
}

function tarkistaMonivalinta(id, valittuIndeksi, painike){
  const h=D.harjoitukset.find(x=>x.id===id);
  const rivi=painike.closest(".row");
  rivi.querySelectorAll(".mv-valinta").forEach(b=>b.disabled=true);
  const oikein = valittuIndeksi===h.vastaus;
  painike.classList.add(oikein?"mv-oikein":"mv-vaarin");
  if(!oikein){
    const oikeaBtn=rivi.querySelector(`[data-i="${h.vastaus}"]`);
    if(oikeaBtn) oikeaBtn.classList.add("mv-oikein");
  }
  merkitseTulos(id, oikein, oikein ? "Oikein. "+h.selitys : `Ei ihan. Oikea vastaus on korostettu. ${h.selitys||""}`);
}

/* Kuuntelu: selain lukee tekstin ääneen omalla puhesynteesillään (englanniksi, jos laitteessa on
   englanninkielinen ääni). Ei äänitiedostoja eikä verkkoyhteyttä. Jos laite ei osaa puhua,
   teksti näytetään luettavaksi — silloin tehtävä muuttuu luetun ymmärtämiseksi, mutta ei katkea. */
function puhu(id, nopeus){
  const h=D.harjoitukset.find(x=>x.id===id); if(!h || !h.kuuntele) return;
  const vara=document.getElementById("vara-"+id);
  const naytaTeksti=syy=>{ vara.hidden=false; vara.textContent=syy+" Teksti: "+h.kuuntele; };
  if(!("speechSynthesis" in window)){ naytaTeksti("Tämä laite ei osaa lukea ääneen."); return; }
  const s=window.speechSynthesis; s.cancel();
  const u=new SpeechSynthesisUtterance(h.kuuntele);
  u.lang=h.kieli||"en-GB"; u.rate=nopeus;
  const aanet=s.getVoices(), kieli=u.lang.slice(0,2);
  const aani=aanet.find(a=>a.lang===u.lang) || aanet.find(a=>a.lang && a.lang.startsWith(kieli));
  if(aani) u.voice=aani;
  else if(aanet.length) { naytaTeksti("Laitteessa ei ole englanninkielistä ääntä."); return; }
  u.onerror=()=>naytaTeksti("Ääneen lukeminen ei onnistunut.");
  s.speak(u);
}
