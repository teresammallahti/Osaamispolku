<title>Kahdenlaista kysymystä</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">

<style>
:root{
  --paper:#EFF2F5; --surface:#FFFFFF; --surface-2:#F7F9FB;
  --grid:#DCE3EA; --line:#C9D3DC;
  --ink:#15222C; --ink-2:#4E626F; --ink-3:#7E8F9B;
  --core:#1B5A9E; --core-soft:#E4EDF6;
  --strong:#1F6E5C; --strong-soft:#E1F0EB;
  --chal:#9A6A16; --chal-soft:#F6EDDC;
  --alert:#A33A2B; --alert-soft:#F8E7E3;
  --shadow:0 1px 2px rgba(21,34,44,.06), 0 8px 24px -12px rgba(21,34,44,.18);
  --r:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0F161B; --surface:#18222A; --surface-2:#1D2830;
    --grid:#22303A; --line:#2E3E4A;
    --ink:#E8EFF4; --ink-2:#A3B4C0; --ink-3:#7A8B97;
    --core:#7FB2E4; --core-soft:#16303F;
    --strong:#77CDB4; --strong-soft:#123028;
    --chal:#E0B267; --chal-soft:#33270F;
    --alert:#E8907F; --alert-soft:#3A1E19;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -14px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --paper:#0F161B; --surface:#18222A; --surface-2:#1D2830;
  --grid:#22303A; --line:#2E3E4A;
  --ink:#E8EFF4; --ink-2:#A3B4C0; --ink-3:#7A8B97;
  --core:#7FB2E4; --core-soft:#16303F;
  --strong:#77CDB4; --strong-soft:#123028;
  --chal:#E0B267; --chal-soft:#33270F;
  --alert:#E8907F; --alert-soft:#3A1E19;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -14px rgba(0,0,0,.7);
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:16px; line-height:1.62;
  background-image:
    linear-gradient(to right, var(--grid) 1px, transparent 1px),
    linear-gradient(to bottom, var(--grid) 1px, transparent 1px);
  background-size:26px 26px;
}
.wrap{max-width:760px; margin:0 auto; padding:28px 20px 90px}
h1,h2,h3,h4{font-family:"Familjen Grotesk","IBM Plex Sans",system-ui,sans-serif; text-wrap:balance}

/* header */
header.top{background:var(--surface); border:1px solid var(--line); border-radius:var(--r);
  box-shadow:var(--shadow); padding:22px 24px; display:flex; gap:18px; align-items:flex-start}
.badge{flex:0 0 auto; width:54px; height:54px; border-radius:9px; display:grid; place-items:center;
  background:var(--core-soft); border:1px solid var(--core); color:var(--core)}
.badge svg{width:28px; height:28px; fill:none; stroke:currentColor; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round}
.eyebrow{font-family:"IBM Plex Mono",monospace; font-size:11px; letter-spacing:.14em;
  text-transform:uppercase; color:var(--ink-3); margin:0 0 5px}
header.top h1{margin:0; font-size:30px; font-weight:700; letter-spacing:-.015em}
header.top p{margin:5px 0 0; color:var(--ink-2); font-size:15px}
.tags{display:flex; flex-wrap:wrap; gap:5px; margin-top:11px}
.tag{font-family:"IBM Plex Mono",monospace; font-size:10.5px; letter-spacing:.05em; padding:2px 7px;
  border-radius:4px; background:var(--surface-2); border:1px solid var(--line); color:var(--ink-3)}
.tag.core{background:var(--core-soft); border-color:var(--core); color:var(--core)}

/* teksti */
article{margin-top:26px}
article h2{font-size:21px; font-weight:600; margin:32px 0 10px; letter-spacing:-.01em}
article p{margin:0 0 14px; max-width:64ch}
.lead{font-size:17.5px; color:var(--ink); border-left:3px solid var(--core); padding-left:16px; margin:0 0 8px}

.box{background:var(--surface); border:1px solid var(--line); border-radius:var(--r);
  padding:18px 22px; box-shadow:var(--shadow); margin:22px 0}
.box h3{margin:0 0 12px; font-size:16.5px; font-weight:600}
.box.warn{border-left:3px solid var(--alert)}
.box.note{border-left:3px solid var(--chal)}

ol.steps{margin:0; padding-left:0; list-style:none; counter-reset:s; display:grid; gap:12px}
ol.steps li{counter-increment:s; display:grid; grid-template-columns:auto 1fr; gap:13px; align-items:start}
ol.steps li::before{content:counter(s); font-family:"Familjen Grotesk",sans-serif; font-weight:700; font-size:14px;
  width:26px; height:26px; border-radius:50%; background:var(--core); color:#fff; display:grid; place-items:center; margin-top:2px}

ul.notes{margin:0; padding-left:19px}
ul.notes li{margin-bottom:7px}
ul.notes li:last-child{margin-bottom:0}

.tablewrap{overflow-x:auto}
table{border-collapse:collapse; width:100%; font-size:14.5px; min-width:460px}
th,td{text-align:left; padding:9px 13px; border-bottom:1px solid var(--line)}
th{font-family:"IBM Plex Mono",monospace; font-size:10.5px; letter-spacing:.1em; text-transform:uppercase;
  color:var(--ink-3); font-weight:400; background:var(--surface-2)}
tr:last-child td{border-bottom:0}
td b{color:var(--core); font-weight:600}
td:last-child{font-variant-numeric:tabular-nums; font-weight:600}

/* lukusuora */
.nl svg{width:100%; height:118px; display:block}
.nl .rail{stroke:var(--line); stroke-width:2}
.nl .tick{stroke:var(--line); stroke-width:1.5}
.nl .stop{fill:var(--ink-3); font-family:"IBM Plex Mono",monospace; font-size:11px}
.nl .stop.near{fill:var(--core); font-weight:600}
.nl .dot{fill:var(--chal)}
.nl .val{fill:var(--ink); font-family:"Familjen Grotesk",sans-serif; font-size:15px; font-weight:700}
.nl .halfway{stroke:var(--chal); stroke-dasharray:3 3; stroke-width:1.5}
.nl-controls{display:flex; align-items:center; gap:14px; margin-top:6px}
.nl-controls input{flex:1; accent-color:var(--core)}
.nl-out{font-family:"Familjen Grotesk",sans-serif; font-size:15px; font-weight:600; min-width:12.5em; text-align:right}

/* paikka-arvotaulu */
.box .ohje{margin:0 0 14px; font-size:14.5px; color:var(--ink-2)}
.nt-valinta{display:flex; flex-wrap:wrap; gap:7px; margin-bottom:16px}
.nt-valinta button{font:inherit; font-size:12.5px; font-family:"IBM Plex Mono",monospace; padding:5px 11px;
  border-radius:6px; border:1px solid var(--line); background:var(--surface-2); color:var(--ink-2); cursor:pointer}
.nt-valinta button[aria-pressed="true"]{background:var(--ink); color:var(--paper); border-color:var(--ink)}
.nt-valinta button:focus-visible{outline:2px solid var(--core); outline-offset:2px}
.nt-taulu{display:flex; flex-direction:column; gap:4px; align-items:flex-start; overflow-x:auto; padding-bottom:4px}
.nt-rivi{display:flex; gap:6px; align-items:center}
.nt-rivi .otsa{font-family:"IBM Plex Mono",monospace; font-size:9.5px; letter-spacing:.08em;
  text-transform:uppercase; color:var(--ink-3); width:52px; text-align:center}
.nt-ruutu{width:52px; height:52px; display:grid; place-items:center; border:1.5px solid var(--line);
  border-radius:7px; background:var(--surface-2); font-family:"IBM Plex Mono",monospace; font-size:24px}
.nt-ruutu.kohta{border-color:var(--core); background:var(--core-soft); color:var(--core); font-weight:500}
.nt-ruutu.ratkaiseva{border-color:var(--chal); background:var(--chal-soft); color:var(--chal); font-weight:500}
.nt-ruutu.nolla{color:var(--ink-3)}
.nt-rivi .nimi{font-size:12.5px; color:var(--ink-3); margin-left:12px; white-space:nowrap}
.nt-nuoli{font-size:17px; color:var(--chal); margin-left:6px}
.nt-selite{margin:14px 0 0; font-size:14.5px}
.nt-selite b{color:var(--core)}

/* vahvuusportaat */
.vp-tasot{display:grid; gap:9px; margin-bottom:18px}
.vp-taso{display:flex; gap:11px; align-items:flex-start; font-size:13.5px}
.vp-taso .vp-pallo{width:13px; height:13px; border-radius:4px; margin-top:5px; flex:0 0 auto}
.vp-taso[data-taso="sulkeet"] .vp-pallo{background:var(--core)}
.vp-taso[data-taso="kertojako"] .vp-pallo{background:var(--strong)}
.vp-taso[data-taso="yhteenvahennys"] .vp-pallo{background:var(--chal)}
.vp-taso strong{display:block; font-family:"Familjen Grotesk",sans-serif; font-weight:600; font-size:14.5px}
.vp-taso span{color:var(--ink-2)}
.vp-lauseke{display:flex; flex-wrap:wrap; gap:7px; align-items:flex-end; font-family:"IBM Plex Mono",monospace;
  font-size:25px; padding:10px 2px; min-height:64px}
.vp-lauseke .t{padding:2px 3px}
.vp-lauseke .op{position:relative; padding:2px 9px; border-radius:6px; font-weight:500}
.vp-lauseke .op[data-taso="sulkeet"]{background:var(--core-soft); color:var(--core)}
.vp-lauseke .op[data-taso="kertojako"]{background:var(--strong-soft); color:var(--strong)}
.vp-lauseke .op[data-taso="yhteenvahennys"]{background:var(--chal-soft); color:var(--chal)}
.vp-lauseke .op i{position:absolute; top:-9px; right:-6px; font-style:normal; font-family:"Familjen Grotesk",sans-serif;
  font-size:11px; font-weight:700; width:18px; height:18px; border-radius:50%; display:grid; place-items:center;
  background:currentColor}
.vp-lauseke .op i span{color:var(--surface)}
.vp-rivi{display:flex; align-items:center; gap:16px; margin-top:8px}
.vp-vastaus{font-family:"Familjen Grotesk",sans-serif; font-size:16px; font-weight:600; color:var(--strong)}

/* laskujärjestys-widget */
.lj-exp{display:flex; flex-wrap:wrap; gap:7px; align-items:center; font-family:"IBM Plex Mono",monospace;
  font-size:23px; padding:14px 4px; min-height:62px}
.lj-exp .tok{padding:2px 4px; color:var(--ink)}
.lj-exp button.op{font-family:"IBM Plex Mono",monospace; font-size:23px; padding:3px 12px; border-radius:7px;
  border:1.5px solid var(--line); background:var(--surface-2); color:var(--ink); line-height:1.2}
.lj-exp button.op:hover{border-color:var(--core); color:var(--core)}
.lj-exp button.op:focus-visible{outline:2px solid var(--core); outline-offset:2px}
.lj-exp .valmis{font-family:"Familjen Grotesk",sans-serif; font-size:23px; font-weight:700; color:var(--strong)}
.lj-fb{font-size:14.5px; min-height:1.5em; color:var(--ink-2)}
.lj-fb.no{color:var(--alert)}
.lj-fb.ok{color:var(--strong)}
.lj-row{display:flex; align-items:center; gap:14px; margin-top:10px}
.lj-step{font-family:"IBM Plex Mono",monospace; font-size:11.5px; letter-spacing:.1em;
  text-transform:uppercase; color:var(--ink-3)}

/* harjoitukset */
.progress{position:sticky; top:0; z-index:5; background:var(--surface); border:1px solid var(--line);
  border-radius:var(--r); padding:12px 18px; box-shadow:var(--shadow); display:flex; align-items:center;
  gap:14px; margin:34px 0 18px}
.progress .lbl{font-family:"IBM Plex Mono",monospace; font-size:11px; letter-spacing:.12em;
  text-transform:uppercase; color:var(--ink-3); white-space:nowrap}
.progress .meter{flex:1; height:7px; border-radius:4px; background:var(--surface-2); border:1px solid var(--line); overflow:hidden}
.progress .meter i{display:block; height:100%; background:var(--core); transition:width .25s ease}
.progress .cnt{font-family:"Familjen Grotesk",sans-serif; font-weight:700; font-variant-numeric:tabular-nums; white-space:nowrap}

.grp{margin-top:26px}
.grp-head{display:flex; align-items:baseline; gap:10px; border-bottom:1.5px solid var(--ink); padding-bottom:7px; margin-bottom:14px}
.grp-head h3{margin:0; font-size:17px; font-weight:600}
.grp-head span{font-size:12.5px; color:var(--ink-2)}

.ex{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:14px 16px; margin-bottom:10px}
.ex[data-tila="oikein"]{border-color:var(--strong); box-shadow:inset 3px 0 0 var(--strong)}
.ex[data-tila="vaarin"]{border-color:var(--alert); box-shadow:inset 3px 0 0 var(--alert)}
.ex .q{display:flex; gap:11px; align-items:baseline; flex-wrap:wrap}
.ex .num{font-family:"IBM Plex Mono",monospace; font-size:11.5px; color:var(--ink-3); min-width:2.4em}
.ex .txt{flex:1; min-width:190px; font-size:15.5px}
.ex .txt .aineisto{display:block; margin-bottom:9px; padding-left:12px;
  border-left:2px solid var(--line); color:var(--ink-2); line-height:1.6;
  /* Aineisto voi olla pieni taulukko, jonka rivit on erotettu rivinvaihdoilla.
     Ilman pre-lineä ne valuisivat yhdeksi kappaleeksi ja taulukko katoaisi. */
  white-space:pre-line}
.ex .txt .kysymysrivi{display:block; font-weight:600}
.ex .row{display:flex; gap:8px; align-items:center; margin-top:11px; flex-wrap:wrap}
.ex input[type=text]{font:inherit; font-family:"IBM Plex Mono",monospace; font-size:15px; width:8.5em;
  padding:7px 11px; border:1px solid var(--line); border-radius:7px; background:var(--surface-2);
  color:var(--ink); text-align:right}
.ex input:focus-visible{outline:2px solid var(--core); outline-offset:1px}
button{font:inherit; cursor:pointer}
.btn{font-size:13.5px; padding:7px 15px; border-radius:7px; border:1px solid var(--core);
  background:var(--core); color:#fff}
.btn.ghost{background:transparent; color:var(--ink-2); border-color:var(--line)}
.btn:focus-visible{outline:2px solid var(--core); outline-offset:2px}
.btn.mv-valinta{text-align:left}
/* kuuntelutehtävä: selaimen puhesynteesi lukee englanninkielisen tekstin */
.kuuntele{display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin:2px 0 10px}
.kuuntele .btn{display:inline-flex; gap:7px; align-items:center}
.kuuntele svg{width:16px; height:16px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round}
.kuuntele .varateksti{flex-basis:100%; font-size:14px; color:var(--ink-2); background:var(--surface-2);
  border-radius:7px; padding:8px 12px; margin:0}
.btn.mv-valinta:disabled{cursor:default; opacity:.65}
.btn.mv-oikein{background:var(--strong-soft); border-color:var(--strong); color:var(--strong); opacity:1}
.btn.mv-vaarin{background:var(--alert-soft); border-color:var(--alert); color:var(--alert); opacity:1}
.row.mv{gap:8px 10px}
.fb{margin-top:11px; font-size:14.5px; padding:10px 13px; border-radius:8px; line-height:1.5}
.fb.ok{background:var(--strong-soft); color:var(--strong)}
.fb.no{background:var(--alert-soft); color:var(--alert)}
.fb.hint{background:var(--chal-soft); color:var(--chal)}

.done{background:var(--strong-soft); border:1px solid var(--strong); color:var(--strong);
  border-radius:var(--r); padding:16px 20px; margin-top:20px; font-size:15.5px}
.done h3{margin:0 0 4px; font-size:17px; color:var(--strong)}

details.teacher{margin-top:34px; background:var(--surface); border:1px solid var(--line);
  border-left:3px solid var(--chal); border-radius:var(--r); padding:15px 20px; box-shadow:var(--shadow)}
details.teacher summary{cursor:pointer; font-family:"Familjen Grotesk",sans-serif; font-weight:600; font-size:15px}
details.teacher summary:focus-visible{outline:2px solid var(--core); outline-offset:3px}
details.teacher ul{margin:12px 0 0; padding-left:19px; color:var(--ink-2); font-size:14.5px}
details.teacher li{margin-bottom:8px}
details.teacher p{margin:12px 0 0; color:var(--ink-2); font-size:14.5px}

.back{display:inline-block; margin-top:30px; font-size:13.5px; color:var(--ink-2)}
.back a{color:var(--core)}

@media (prefers-reduced-motion: reduce){*{transition:none !important}}
@media (max-width:560px){
  .wrap{padding:16px 13px 70px}
  header.top h1{font-size:25px}
  .progress{flex-wrap:wrap}
}
</style>

<div class="wrap">

  <header class="top">
    <span class="badge"><svg viewBox="0 0 24 24" aria-hidden="true" id="ikoni"></svg></span>
    <div>
      <p class="eyebrow" id="eyebrow"></p>
      <h1 id="otsikko"></h1>

</div>

<script>
const D = {"tavoite_id":"ET4-FIL-01","oppiaine":"ET","vuosiluokka":4,"taso":"ydin","otsikko":"Kahdenlaista kysymystä","kuvaus":"Osaan erottaa kysymyksen, johon löytyy yksi oikea vastaus, kysymyksestä, josta pitää keskustella.","versio":"0.2","paivitetty":"2026-09-26","ops":{"T":["T3"],"S":["S1"]},"eyebrow":"Elämänkatsomustieto · 4. luokka · Filosofinen kysyminen","ikoni":"ajattelu","teksti":[{"tyyppi":"johdanto","sisalto":"Ruokavälitunnilla Eetu ja Sara kiistelevät kahdesta asiasta. Ensin siitä, montako porrasta koulun pääovelle johtaa. Sitten siitä, onko reilua, että sama pelaaja saa aina aloittaa pelin. Ensimmäinen kiista loppuu heti, kun Sara käy laskemassa portaat. Toinen ei lopu laskemalla, mittaamalla eikä katsomalla mistään. Siitä täytyy keskustella: kertoa, miksi on tätä mieltä, ja kuunnella toisen syyt. Kysymyksiä on siis kahdenlaisia. Kun tunnistat, kumpi on kyseessä, tiedät, mitä kannattaa tehdä: tarkistaa vai perustella."},{"tyyppi":"kappale","otsikko":"Tosiasiakysymyksen vastauksen voi tarkistaa","sisalto":"Tosiasiakysymykseen on yksi oikea vastaus, ja sen voi tarkistaa jostakin: mittaamalla, laskemalla, katsomalla, kysymällä tai luotettavasta lähteestä, kuten tietokirjasta. ”Montako kuuta Marsilla on?” on tosiasiakysymys. Vastauksen voi katsoa tähtitieteen kirjasta: kuita on kaksi. Jos kaksi ihmistä on eri mieltä tosiasiakysymyksestä, kiista ratkeaa tarkistamalla, ja ainakin toinen heistä on väärässä."},{"tyyppi":"kappale","otsikko":"Keskustelukysymyksen vastaus perustellaan","sisalto":"”Onko valehteleminen joskus oikein?” on keskustelukysymys. Vastausta ei voi mitata, laskea eikä katsoa kirjasta. Kirjasta voi kyllä lukea, mitä joku on asiasta ajatellut, mutta se ei ratkaise, kuka on oikeassa. Siksi keskustelukysymyksestä puhutaan: jokainen kertoo kantansa ja syyn sille. Kaikki vastaukset eivät silti ole yhtä hyviä. Vastaus, jolla on hyvä perustelu, on parempi kuin vastaus ilman perustelua. Keskustelukysymyksissä on usein sanoja kuten oikein, väärin, reilu, pitäisi, hyvä tai tärkeä. Ne ovat vihjeitä, eivät sääntö: ratkaisevaa on vain se, voiko vastauksen tarkistaa."},{"tyyppi":"saanto","otsikko":"Näin lajittelet kysymyksen","askeleet":["Kysy: voisiko vastauksen tarkistaa mittaamalla, laskemalla, katsomalla, kysymällä tai lähteestä? Jos voisi, kysymys kuuluu tosiasiapinoon. Näin on silloinkin, kun kukaan ei vielä tiedä vastausta.","Jos mikään mittaus tai lähde ei ratkaise asiaa ja vastaus pitää perustella, kysymys kuuluu keskustelupinoon.","Älä katso, onko kysymys helppo vai vaikea, lyhyt vai pitkä, tai oletko itse varma vastauksesta. Ne eivät kerro, kumpaan pinoon kysymys kuuluu."]},{"tyyppi":"taulukko","otsikko":"Kaksi pinoa","otsikkorivi":["Kysymys","Pino","Mistä sen tietää"],"rivit":[["Kuinka korkea luokan ovi on?","Tosiasia","Voi mitata mittanauhalla."],["Montako pelaajaa jääkiekkojoukkueesta on kentällä yhtä aikaa?","Tosiasia","Voi katsoa pelin säännöistä."],["Montako hyttystä Suomessa on juuri nyt?","Tosiasia","Vastaus on olemassa, vaikka kukaan ei tiedä sitä."],["Montako luokan oppilasta pitää sadesäästä?","Tosiasia","Voi selvittää kysymällä jokaiselta ja laskemalla."],["Pitäisikö välitunnilla saada pelata puhelimella?","Keskustelu","Mikään mittaus ei ratkaise sitä. Vastaus perustellaan."],["Onko reilua jakaa karkit tasan?","Keskustelu","Helppo vastata, mutta vastaus perustellaan eikä tarkisteta."]]},{"tyyppi":"ansa","otsikko":"Ansa 1: vaikea ei tarkoita keskustelukysymystä","sisalto":"”Montako tähteä Linnunradassa on?” tuntuu mahdottomalta. Tähtiä on niin paljon, ettei kukaan ole laskenut niitä yksitellen, ja tutkijoillakin on vain arvio. Silti kysymykseen on yksi oikea vastaus: tähdet ovat olemassa, ja tutkijat voivat tarkentaa arviotaan uusilla havainnoilla. Samoin ”Onko Marsissa joskus elänyt pieneliöitä?” on tosiasiakysymys, johon kukaan ei vielä tiedä vastausta. Tutkijat etsivät vastausta Marsiin lähetettyjen laitteiden avulla. Keskustelu ei ratkaise sitä, tutkiminen ratkaisee. Kun kysymys on vaikea, kysy: jos meillä olisi tarpeeksi välineitä, voisiko vastauksen selvittää? Jos voisi, kysymys on tosiasiakysymys."},{"tyyppi":"ansa","otsikko":"Ansa 2: helppo ei tarkoita tosiasiakysymystä","sisalto":"”Onko reilua, että kaikki saavat vuoron?” Moni vastaa heti kyllä, ja melkein kaikki ovat samaa mieltä. Kysymys on silti keskustelukysymys, koska vastausta ei löydy mittaamalla eikä kirjasta. Se perustellaan: ”koska jokainen haluaa päästä leikkimään”. Se, että vastaus on helppo perustella, ei tee siitä tarkistettavaa. Toisaalta ”Montako jalkaa kissalla on?” on sekä helppo että tosiasiakysymys. Helppous ei siis kerro pinoa kumpaankaan suuntaan."},{"tyyppi":"ansa","otsikko":"Ansa 3: oma mielipide ei ratkaise pinoa","sisalto":"Jos olet varma, että valehteleminen on aina väärin, voi tuntua, että kysymykseen on yksi oikea vastaus. Joku toinen voi kuitenkin olla yhtä varma päinvastaisesta, eikä kumpikaan voi näyttää mittaria tai kirjaa, joka ratkaisee asian. Oma varmuus ei tee kysymyksestä tosiasiakysymystä. Sama pätee toisin päin: jos olet kaverisi kanssa eri mieltä siitä, kumpi teistä on pidempi, kysymys ei muutu keskustelukysymykseksi. Mittanauha ratkaisee sen."},{"tyyppi":"kappale","otsikko":"Vihjeet, jotka johtavat harhaan","sisalto":"Kolme vihjettä vie usein väärään pinoon. Ensimmäinen: kysymys voi koskea mielipiteitä ja olla silti tosiasiakysymys. ”Pitäisikö koulun pihalle rakentaa jalkapallokenttä?” on keskustelukysymys, mutta ”Montako luokan oppilasta haluaa pihalle jalkapallokentän?” on tosiasiakysymys: vastauksen saa selville kysymällä jokaiselta ja laskemalla. Se, mitä ihmiset ajattelevat, on tosiasia. Se, onko heidän ajatuksensa oikea, ei ole. Toinen: luku kysymyksessä ei tee siitä tosiasiakysymystä. ”Kuinka monta palaa kakusta on reilua antaa sille, joka leipoi sen?” kysyy lukua, mutta vastaus perustellaan. Kolmas: kova kiista ei tee kysymyksestä keskustelukysymystä. ”Onko valas kala?” voi herättää kiistan, mutta eläinkirjasta näkee, että valas on nisäkäs."},{"tyyppi":"muistilappu","otsikko":"Muista nämä","kohdat":["Tosiasiakysymyksen vastauksen voi tarkistaa: mittaamalla, laskemalla, katsomalla, kysymällä tai lähteestä.","Keskustelukysymyksen vastaus perustellaan, koska mikään mittaus tai lähde ei ratkaise sitä.","Vaikeakin kysymys on tosiasiakysymys, jos vastauksen voisi selvittää.","Helppokin kysymys on keskustelukysymys, jos vastaus perustellaan.","Oma varmuus tai kiista ei muuta kysymyksen pinoa.","Kysymys siitä, mitä ihmiset ajattelevat, on tosiasiakysymys."]}],"harjoitusryhmat":[{"id":"tarkista","nimi":"Voiko vastauksen tarkistaa?","info":"Kysy jokaisesta kysymyksestä: voiko vastauksen mitata, laskea, katsoa, kysyä tai etsiä lähteestä? Jos voi, se on tosiasiakysymys."},{"id":"ansat","nimi":"Vaikea, helppo ja oma varmuus","info":"Vaikea kysymys voi olla tosiasiakysymys, ja helppo kysymys voi olla keskustelukysymys. Ratkaisevaa on vain se, voiko vastauksen tarkistaa."},{"id":"vihjeet","nimi":"Harhaanjohtavat vihjeet","info":"Kysymys siitä, mitä ihmiset ajattelevat, on tosiasiakysymys. Luku ei tee kysymyksestä tosiasiakysymystä, eikä kiista tee siitä keskustelukysymystä."}],"harjoitukset":[{"id":"H01","ryhma":"tarkista","kysymys":"Kysymykset:\n1. Montako ikkunaa luokassa on?\n2. Mikä tekee ystävästä hyvän ystävän?\n3. Montako jalkaa hyönteisellä on?\n4. Onko tärkeämpää olla rehellinen vai kohtelias?\n5. Minä vuonna Suomi itsenäistyi?\n6. Voiko robotti olla ystävä?\n\nMontako näistä kuudesta kysymyksestä on tosiasiakysymyksiä?","vastaus":3,"vinkki":"Etsi kysymykset, joiden vastauksen voisi laskea, mitata tai katsoa kirjasta.","selitys":"Ikkunat voi laskea, hyönteisen jalat voi katsoa tietokirjasta ja itsenäistymisvuoden historian kirjasta. Kysymyksiin 2, 4 ja 6 ei löydy vastausta mittaamalla eikä lähteestä, vaan vastaus perustellaan. Tosiasiakysymyksiä on 3."},{"id":"H02","ryhma":"tarkista","kysymys":"Kysymykset:\n1. Onko reilua, että voittaja saa palkinnon?\n2. Kuinka pitkä opettajan pöytä on?\n3. Montako lamppua luokan katossa on?\n4. Onko hyvä teko hyvä, jos sen tekee vain kehujen takia?\n5. Mikä on Ruotsin pääkaupunki?\n\nMontako näistä viidestä kysymyksestä on keskustelukysymyksiä?","vastaus":2,"vinkki":"Keskustelukysymyksen vastausta ei voi mitata eikä katsoa lähteestä.","selitys":"Pöydän voi mitata, lamput laskea ja pääkaupungin katsoa kartasta. Kysymykset 1 ja 4 perustellaan: mikään mittaus ei kerro, onko palkinto reilu tai onko teko hyvä. Keskustelukysymyksiä on 2."},{"id":"H03","ryhma":"tarkista","tyyppi":"monivalinta","kysymys":"Kysymys: ”Kuinka paljon reppusi painaa?”\n\nMiten vastauksen voi tarkistaa?","vaihtoehdot":["Äänestämällä luokassa","Punnitsemalla repun vaa'alla","Kysymällä kaverin mielipidettä"],"vastaus":1,"vinkki":"Mieti, mikä kertoisi repun painon, vaikka kaikki olisivat eri mieltä.","selitys":"Paino selviää vaa'alla. Äänestys tai kaverin mielipide eivät muuta repun painoa. Koska vastauksen voi tarkistaa punnitsemalla, kysymys on tosiasiakysymys."},{"id":"H04","ryhma":"tarkista","kysymys":"Kysymykset:\n1. Montako tuolia koulun ruokalassa on?\n2. Mihin aikaan koulun ensimmäinen oppitunti alkaa?\n3. Mikä on maailman suurin valtameri?\n4. Onko reilua, että sama henkilö on aina kapteeni?\n\nMonesko kysymys on keskustelukysymys?","vastaus":4,"vinkki":"Kolmen kysymyksen vastaus löytyy laskemalla tai katsomalla. Mikä jää jäljelle?","selitys":"Tuolit voi laskea, tunnin alkamisajan voi katsoa lukujärjestyksestä ja valtameren karttakirjasta. Kysymyksessä 4 kysytään, onko jokin reilua, eikä sitä voi tarkistaa mistään. Se on keskustelukysymys."},{"id":"H05","ryhma":"tarkista","kysymys":"Kysymykset:\n1. Kumpi on pahempaa, valehdella vai rikkoa lupaus?\n2. Montako päivää tammikuussa on?\n3. Millainen on hyvä elämä?\n4. Onko väärin nauraa, kun joku kaatuu?\n5. Mikä lintu on Suomen kansallislintu?\n6. Pitäisikö koulussa olla enemmän leikkiä?\n\nMontako näistä kuudesta kysymyksestä on keskustelukysymyksiä?","vastaus":4,"vinkki":"Kaksi kysymystä voi tarkistaa kalenterista tai tietokirjasta. Loput perustellaan.","selitys":"Tammikuun päivät näkee kalenterista ja kansallislinnun tietokirjasta. Kysymykset 1, 3, 4 ja 6 perustellaan, koska mikään mittaus ei kerro, mikä on pahempaa, millainen elämä on hyvä, mikä on väärin tai mitä koulussa pitäisi olla. Keskustelukysymyksiä on 4."},{"id":"H06","ryhma":"tarkista","kysymys":"Kysymykset:\n1. Onko luonnolla arvoa, vaikka kukaan ei käyttäisi sitä?\n2. Onko pingviini lintu?\n3. Pitäisikö lapsilla olla oikeus äänestää?\n4. Mitä on rohkeus?\n\nMonesko kysymys on tosiasiakysymys?","vastaus":2,"vinkki":"Vain yhden kysymyksen vastauksen voi katsoa eläinkirjasta.","selitys":"Sen, onko pingviini lintu, voi tarkistaa eläinkirjasta. Luonnon arvo, lasten äänioikeus ja rohkeuden merkitys perustellaan. Tosiasiakysymys on kysymys 2."},{"id":"H07","ryhma":"tarkista","kysymys":"Kysymykset:\n1. Kuinka monta ihmistä Suomessa asuu?\n2. Pitäisikö ihmisten jakaa tavaroitaan enemmän?\n3. Minkä värinen on Suomen lipun risti?\n4. Montako tähteä EU:n lipussa on?\n5. Onko Aurinko tähti?\n\nMontako näistä viidestä kysymyksestä on tosiasiakysymyksiä?","vastaus":4,"vinkki":"Vain yksi kysymys kysyy, mitä pitäisi tehdä.","selitys":"Asukasluvun voi katsoa tilastosta, ristin värin ja tähdet lipusta ja sen, onko Aurinko tähti, tähtitieteen kirjasta. Kysymys 2 kysyy, mitä ihmisten pitäisi tehdä, ja se perustellaan. Tosiasiakysymyksiä on 4."},{"id":"H08","ryhma":"ansat","kysymys":"Kysymykset:\n1. Montako lintua Suomessa on juuri nyt?\n2. Onko hyvä auttaa kaveria?\n3. Montako muurahaista Suomessa on tällä hetkellä?\n4. Pitäisikö jonossa odottaa omaa vuoroa?\n5. Onko jonkin toisen tähden planeetalla elämää?\n\nMontako näistä viidestä kysymyksestä on tosiasiakysymyksiä?","vastaus":3,"vinkki":"Vaikeaan kysymykseen voi silti olla yksi oikea vastaus, jota kukaan ei vielä tiedä.","selitys":"Suomen linnut, muurahaiset ja elämä toisen tähden planeetalla ovat tosiasiakysymyksiä: vastaus on olemassa, ja sitä voi etsiä tutkimalla, vaikka kukaan ei vielä tiedä sitä. Kysymykset 2 ja 4 ovat helppoja, mutta niiden vastaus perustellaan eikä tarkisteta. Tosiasiakysymyksiä on 3."},{"id":"H09","ryhma":"ansat","tyyppi":"monivalinta","kysymys":"Kysymys: ”Montako eläinlajia maapallolla on?” Kukaan ei tiedä tarkkaa vastausta.\n\nKumpaan pinoon kysymys kuuluu ja miksi?","vaihtoehdot":["Keskustelupinoon, koska kukaan ei tiedä vastausta.","Tosiasiapinoon, koska vastaus on olemassa ja sitä voi etsiä tutkimalla, vaikka sitä ei vielä tiedetä.","Keskustelupinoon, koska kysymys on vaikea."],"vastaus":1,"vinkki":"Mieti, ratkeaako kysymys keskustelemalla vai tutkimalla.","selitys":"Kaikkia eläinlajeja ei ole vielä löydetty, mutta tutkijat löytävät uusia lajeja koko ajan ja pääsevät lähemmäs vastausta. Kysymys ratkeaa tutkimalla eikä keskustelemalla, joten se on tosiasiakysymys, oli se kuinka vaikea tahansa."},{"id":"H10","ryhma":"ansat","kysymys":"Kysymykset:\n1. Montako hiekanjyvää koulun hiekkalaatikossa on?\n2. Kuinka kaukana Kuu on maapallosta?\n3. Onko reilua, että kaikki pääsevät mukaan leikkiin?\n4. Montako lehteä koulun pihan suurimmassa puussa on?\n\nMonesko kysymys on keskustelukysymys?","vastaus":3,"vinkki":"Kolme kysymystä tuntuu vaikealta, mutta niiden vastauksen voisi laskea tai mitata.","selitys":"Hiekanjyvät ja lehdet voisi laskea, ja Kuun etäisyys on mitattu. Kysymys 3 on helppo, mutta sen vastaus perustellaan: mikään mittaus ei kerro, mikä on reilua. Keskustelukysymys on kysymys 3."},{"id":"H11","ryhma":"ansat","kysymys":"Kysymykset:\n1. Onko ystävällisyys hyvä asia?\n2. Montako pyörää polkupyörässä on?\n3. Pitäisikö toista lohduttaa, kun hän on surullinen?\n4. Montako kuukautta vuodessa on?\n5. Onko oikein kiittää lahjasta?\n\nMontako näistä viidestä kysymyksestä on keskustelukysymyksiä?","vastaus":3,"vinkki":"Kaikki viisi kysymystä ovat helppoja. Helppous ei kerro pinoa.","selitys":"Pyörät voi laskea ja kuukaudet katsoa kalenterista. Kysymyksiin 1, 3 ja 5 melkein kaikki vastaavat samoin, mutta vastaus perustellaan eikä tarkisteta. Keskustelukysymyksiä on 3."},{"id":"H12","ryhma":"ansat","kysymys":"Luokka lajitteli kysymyksiä kahteen pinoon. Puheenvuorot:\n1. Onni: Kysymys ”Montako kiveä koulun pihalla on?” kuuluu tosiasiapinoon, koska kivet voi laskea.\n2. Iida: Kysymys ”Montako solua ihmisen kehossa on tarkalleen?” kuuluu keskustelupinoon, koska se on tosi vaikea kysymys.\n3. Leo: Kysymys ”Montako jalkaa hevosella on?” kuuluu tosiasiapinoon, koska siihen on helppo vastata.\n4. Helmi: Kysymys ”Voiko eläin olla ystävä?” kuuluu keskustelupinoon, koska vastausta ei voi tarkistaa mittaamalla eikä lähteestä, vaan se pitää perustella.\n\nMontako puheenvuoroista perustelee pinon sillä, voiko vastauksen tarkistaa?","vastaus":2,"vinkki":"Älä katso, onko pino oikein. Katso vain sanaa koska ja sitä, mitä sen jälkeen tulee.","selitys":"Onni perustelee laskemisella ja Helmi sillä, ettei vastausta voi tarkistaa. Iida perustelee vaikeudella ja Leo helppoudella. Leon pino on oikea, mutta helppous ei kerro pinoa, joten perustelu ei kelpaa. Tarkistamiseen liittyviä perusteluja on 2."},{"id":"H13","ryhma":"ansat","tyyppi":"monivalinta","kysymys":"Veeti sanoo: ”Kysymys ’Onko tärkeämpää voittaa vai pitää hauskaa?’ on tosiasiakysymys, koska minä olen varma, että hauskanpito on tärkeämpää.”\n\nMikä Veetin perustelussa on vialla?","vaihtoehdot":["Ei mikään: kun joku on varma, kysymykseen on yksi oikea vastaus.","Varmuus ei tee vastauksesta tarkistettavaa. Toinen voi olla yhtä varma päinvastaisesta, eikä kumpaakaan voi mitata tai katsoa lähteestä.","Kysymys on liian lyhyt tosiasiakysymykseksi."],"vastaus":1,"vinkki":"Mieti, mitä tapahtuu, jos joku toinen on yhtä varma päinvastaisesta.","selitys":"Veeti saa olla varma kannastaan, mutta varmuus ei ratkaise pinoa. Jos kaksi yhtä varmaa ihmistä on eri mieltä, kumpikaan ei voi näyttää mittaria tai kirjaa, joka ratkaisee asian. Kysymys on keskustelukysymys."},{"id":"H14","ryhma":"ansat","kysymys":"Kysymykset:\n1. Onko hyvä olla rehellinen?\n2. Pitäisikö anteeksi pyytää, kun on tehnyt väärin?\n3. Onko hyvä pitää huolta luonnosta?\n4. Montako kalaa Päijänteessä on tällä hetkellä?\n\nMonesko kysymys on tosiasiakysymys?","vastaus":4,"vinkki":"Kolme kysymystä on helppoja vastata. Yksi on vaikea, mutta sen vastauksen voisi selvittää.","selitys":"Päijänteen kaloja ei ole kukaan laskenut, mutta niitä on tietty määrä, ja sitä voi yrittää selvittää tutkimalla. Kolme muuta kysymystä ovat helppoja, mutta ne perustellaan. Tosiasiakysymys on kysymys 4."},{"id":"H15","ryhma":"vihjeet","kysymys":"Kysymykset:\n1. Montako luokan oppilasta haluaa pidemmän välitunnin?\n2. Pitäisikö välitunnin olla pidempi?\n3. Kuinka pitkä koulun välitunti on?\n\nMonesko kysymys on keskustelukysymys?","vastaus":2,"vinkki":"Kaksi kysymystä voi tarkistaa: toisen lukujärjestyksestä, toisen kysymällä.","selitys":"Välitunnin pituuden näkee lukujärjestyksestä, ja sen, montako haluaa pidemmän välitunnin, saa selville kysymällä jokaiselta. Kysymys 2 kysyy, mitä pitäisi olla, ja se perustellaan. Keskustelukysymys on kysymys 2."},{"id":"H16","ryhma":"vihjeet","kysymys":"Kysymykset:\n1. Onko oikein pitää eläimiä eläintarhassa?\n2. Paljonko bussimatka eläintarhaan maksaa?\n3. Kumpaa useampi luokan oppilas toivoo retkikohteeksi, museota vai eläintarhaa?\n\nMontako näistä kolmesta kysymyksestä on tosiasiakysymyksiä?","vastaus":2,"vinkki":"Kysymys siitä, mitä ihmiset toivovat, on tosiasiakysymys: vastauksen saa kysymällä.","selitys":"Bussimatkan hinnan voi katsoa hinnastosta, ja retkitoiveet saa selville kysymällä jokaiselta. Kysymys 1 kysyy, onko jokin oikein, ja se perustellaan. Tosiasiakysymyksiä on 2."},{"id":"H17","ryhma":"vihjeet","kysymys":"Kysymykset:\n1. Onko delfiini kala?\n2. Kumpi on painavampi, kilo höyheniä vai kilo rautaa?\n3. Pitäisikö voittajan jakaa palkintonsa häviäjän kanssa?\n4. Montako siipeä perhosella on?\n5. Onko lepakko lintu?\n\nMontako näistä viidestä kysymyksestä on tosiasiakysymyksiä?","vastaus":4,"vinkki":"Vaikka ihmiset kiistelisivät vastauksesta, kysymys on tosiasiakysymys, jos vastauksen voi tarkistaa.","selitys":"Kysymyksissä 1, 2, 4 ja 5 moni arvaa väärin, ja niistä voi syntyä kiista. Vastaukset voi silti tarkistaa eläinkirjasta tai punnitsemalla: delfiini ja lepakko ovat nisäkkäitä, ja kilo on kilo. Kysymys 3 perustellaan. Tosiasiakysymyksiä on 4."},{"id":"H18","ryhma":"vihjeet","kysymys":"Kysymykset:\n1. Montako vuotta ystävyyden pitää kestää, jotta se on oikeaa ystävyyttä?\n2. Montako päivää karkausvuodessa on?\n3. Kuinka monta karkkia on reilua ottaa yhteisestä kulhosta?\n4. Kuinka monta minuuttia tunnissa on?\n5. Montako kertaa kaverille pitäisi antaa anteeksi?\n\nMontako näistä viidestä kysymyksestä on keskustelukysymyksiä?","vastaus":3,"vinkki":"Kaikki kysymykset kysyvät lukua. Luku ei kerro pinoa.","selitys":"Karkausvuoden päivät ja tunnin minuutit voi katsoa kalenterista ja kellosta. Kysymykset 1, 3 ja 5 kysyvät lukua, mutta vastaus perustellaan: mikään mittaus ei kerro, mikä on oikeaa ystävyyttä, reilua tai tarpeeksi. Keskustelukysymyksiä on 3."},{"id":"H19","ryhma":"vihjeet","kysymys":"Luokka lajitteli kysymyksiä kahteen pinoon. Puheenvuorot:\n1. Ella: Kysymys ”Kuinka syvä on maailman syvin meri?” kuuluu tosiasiapinoon, koska syvyyden voi mitata.\n2. Joel: Kysymys ”Montako luokan oppilasta pitää lukemisesta?” kuuluu tosiasiapinoon, koska vastauksen saa selville kysymällä jokaiselta ja laskemalla vastaukset.\n3. Siiri: Kysymys ”Onko metsän kaataminen joskus oikein?” kuuluu keskustelupinoon, koska olen siitä eri mieltä kuin sinä.\n4. Aaro: Kysymys ”Onko väärin jättää joku leikin ulkopuolelle?” kuuluu keskustelupinoon, koska vastausta ei voi tarkistaa mittaamalla eikä lähteestä, vaan se pitää perustella.\n\nMonennessako puheenvuorossa perustelu ei liity siihen, voiko vastauksen tarkistaa?","vastaus":3,"vinkki":"Kolme perustelua kertoo, miten vastauksen voi tai ei voi tarkistaa. Yksi kertoo vain puhujasta itsestään.","selitys":"Ella perustelee mittaamisella, Joel kysymisellä ja Aaro sillä, ettei vastausta voi tarkistaa. Siiri perustelee sillä, että on eri mieltä. Erimielisyys ei ratkaise pinoa, vaikka pino sattuu olemaan oikea. Vastaus on 3."},{"id":"H20","ryhma":"vihjeet","kysymys":"Kysymykset:\n1. Montako porrasta koulun pääovelle johtaa?\n2. Pitäisikö ihmisen aina sanoa, mitä ajattelee?\n3. Montako hirveä Suomessa on juuri nyt?\n4. Onko väärin olla kateellinen?\n5. Onko käärme matelija?\n6. Onko kärsivällisyys hyvä asia?\n7. Montako luokan oppilasta pitää pesäpallosta?\n8. Mitä ystävyys on?\n9. Kuinka monen ihmisen täytyy olla samaa mieltä, jotta jokin on oikein?\n10. Kuinka korkea Eiffel-torni on?\n\nMontako näistä kymmenestä kysymyksestä on keskustelukysymyksiä?","vastaus":5,"vinkki":"Lajittele kysymys kerrallaan ja kysy joka kerta: voiko vastauksen tarkistaa?","selitys":"Portaat voi laskea, hirvet voisi laskea, käärmeen voi katsoa eläinkirjasta, pesäpallosta pitävät saa selville kysymällä ja tornin korkeuden voi katsoa lähteestä. Kysymykset 2, 4, 6, 8 ja 9 perustellaan. Keskustelukysymyksiä on 5."}],"valmis_teksti":"Erotat kysymyksen, jonka vastauksen voi tarkistaa, kysymyksestä, jonka vastaus perustellaan. Et anna kysymyksen vaikeuden, helppouden tai oman varmuutesi ratkaista pinoa. Tämä taito on nyt näytetty."};

/* ---------- teksti ---------- */
const esc = s => s;
const osat = D.teksti.map(o=>{
  switch(o.tyyppi){
    case "johdanto":
      return `<p class="lead">${esc(o.sisalto)}</p>`;
    case "kappale":
      return `<h2>${esc(o.otsikko)}</h2><p>${esc(o.sisalto)}</p>`;
    case "saanto":
      return `<div class="box"><h3>${esc(o.otsikko)}</h3><ol class="steps">${
        o.askeleet.map(a=>`<li><span>${esc(a)}</span></li>`).join("")}</ol></div>`;
    case "taulukko":
      return `<div class="box"><h3>${esc(o.otsikko)}</h3><div class="tablewrap"><table><thead><tr>${
        o.otsikkorivi.map(h=>`<th>${h}</th>`).join("")}</tr></thead><tbody>${
        o.rivit.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join("")}</tr>`).join("")}</tbody></table></div></div>`;
    case "ansa":
      return `<div class="box warn"><h3>${esc(o.otsikko)}</h3><p style="margin:0">${esc(o.sisalto)}</p></div>`;
    case "muistilappu":
      return `<div class="box note"><h3>${esc(o.otsikko)}</h3><ul class="notes">${
        o.kohdat.map(k=>`<li>${esc(k)}</li>`).join("")}</ul></div>`;
    case "numerotaulu":
      return `<div class="box nt"><h3>${esc(o.otsikko)}</h3><p class="ohje">${esc(o.sisalto)}</p>
        <div class="nt-valinta" id="ntValinta"></div>
        <div class="nt-taulu" id="ntTaulu"></div>
        <p class="nt-selite" id="ntSelite"></p></div>`;
    case "vahvuusportaat":
      return `<div class="box vp"><h3>${esc(o.otsikko)}</h3><p class="ohje">${esc(o.sisalto)}</p>
        <div class="vp-tasot">${o.tasot.map(t=>
          `<div class="vp-taso" data-taso="${t.id}"><span class="vp-pallo"></span>
           <div><strong>${t.nimi}</strong><span>${t.selite}</span></div></div>`).join("")}</div>
        <div class="vp-lauseke" id="vpLauseke"></div>
        <div class="vp-rivi"><button type="button" class="btn ghost" id="vpSeuraava">Toinen lauseke</button>
        <span class="vp-vastaus" id="vpVastaus"></span></div></div>`;
    case "laskujarjestys":
      return `<div class="box lj"><h3>${esc(o.otsikko)}</h3><p style="margin:0 0 12px;font-size:14.5px;color:var(--ink-2)">${esc(o.sisalto)}</p>
        <div class="lj-exp" id="ljExp"></div>
        <div class="lj-fb" id="ljFb"></div>
        <div class="lj-row"><button type="button" class="btn ghost" id="ljSeuraava">Toinen lauseke</button>
        <span class="lj-step" id="ljStep"></span></div></div>`;
    case "lukusuora":
      return `<div class="box nl"><h3>${esc(o.otsikko)}</h3><p style="margin:0 0 8px;font-size:14.5px;color:var(--ink-2)">${esc(o.sisalto)}</p>
        <svg id="nlsvg" viewBox="0 0 640 118" role="img" aria-labelledby="nldesc"><desc id="nldesc">Lukusuora, jolla näkyy valittu luku ja lähin kymmenluku.</desc></svg>
        <div class="nl-controls">
          <label for="nlrange" style="font-size:13px;color:var(--ink-2)">Luku</label>
          <input type="range" id="nlrange" min="0" max="100" value="47" aria-describedby="nlout">
          <span class="nl-out" id="nlout"></span>
        </div></div>`;

/* ---------- lukusuora ---------- */
const svg=document.getElementById("nlsvg"), rng=document.getElementById("nlrange"), out=document.getElementById("nlout");
const X0=34, X1=606, Y=62;
function piirraNL(v){
  const ala=Math.floor(v/10)*10, yla=ala+10, puoli=ala+5;
  const pyor = (v%10)>=5 ? yla : ala;
  const x = n => X0 + (n/100)*(X1-X0);
  let s=`<line class="rail" x1="${X0}" y1="${Y}" x2="${X1}" y2="${Y}"/>`;
  for(let n=0;n<=100;n+=10){
    const near = (n===ala||n===yla);
    s+=`<line class="tick" x1="${x(n)}" y1="${Y-7}" x2="${x(n)}" y2="${Y+7}"/>`;
    s+=`<text class="stop${near?" near":""}" x="${x(n)}" y="${Y+24}" text-anchor="middle">${n}</text>`;
  }
  s+=`<line class="halfway" x1="${x(puoli)}" y1="${Y-16}" x2="${x(puoli)}" y2="${Y+12}"/>`;
  s+=`<text class="stop" x="${x(puoli)}" y="${Y-22}" text-anchor="middle">puoliväli ${puoli}</text>`;
  s+=`<circle class="dot" cx="${x(v)}" cy="${Y}" r="6"/>`;
  s+=`<text class="val" x="${x(v)}" y="${Y-32}" text-anchor="middle">${v}</text>`;
  s+=`<path d="M ${x(v)} ${Y+38} L ${x(pyor)} ${Y+38}" stroke="var(--core)" stroke-width="2" fill="none"/>`;
  s+=`<path d="M ${x(pyor)} ${Y+38} l ${x(pyor)>x(v)?-7:7} -4 l 0 8 z" fill="var(--core)"/>`;
  svg.innerHTML=s;
  out.textContent = `${v} pyöristyy → ${pyor}`;
}
if(svg){ piirraNL(+rng.value); rng.addEventListener("input",e=>piirraNL(+e.target.value)); }

/* ---------- laskujärjestys-widget ---------- */
const ljExp=document.getElementById("ljExp");
if(ljExp && D.kokeilu){
  let ljI=0, ljTokens=[], ljStep=0;
  const laske=(a,op,b)=>{a=+a;b=+b;return op==="×"?a*b:op==="÷"?a/b:op==="+"?a+b:a-b;};
  function ljAlku(){
    const l=D.kokeilu[ljI];
    ljTokens=l.lauseke.replace(/\(/g,"( ").replace(/\)/g," )").split(/\s+/).filter(Boolean);
    ljStep=0; ljPiirra(); ljViesti("","");
  }
  function ljViesti(t,lk){const f=document.getElementById("ljFb"); f.textContent=t; f.className="lj-fb "+(lk||"");}
  function ljPiirra(){
    const l=D.kokeilu[ljI];
    document.getElementById("ljStep").textContent =
      ljStep>=l.askeleet.length ? "valmis" : `askel ${ljStep+1} / ${l.askeleet.length}`;
    if(ljStep>=l.askeleet.length){
      ljExp.innerHTML=`<span class="valmis">${l.lauseke} = ${l.vastaus}</span>`;
      return;
    }
    ljExp.innerHTML=ljTokens.map((t,i)=>
      "×÷+−".includes(t) ? `<button type="button" class="op" data-i="${i}">${t}</button>`
                         : `<span class="tok">${t}</span>`).join("");
    ljExp.querySelectorAll("button.op").forEach(b=>b.addEventListener("click",()=>ljKlikkaa(+b.dataset.i)));
  }
  function ljKlikkaa(i){
    const l=D.kokeilu[ljI], odotettu=l.askeleet[ljStep];
    const ehdotus=[ljTokens[i-1],ljTokens[i],ljTokens[i+1]].join(" ");
    if(ehdotus!==odotettu){
      ljViesti(ljStep===0
        ? "Ei vielä. Sulkeet ovat vahvimmat, sitten kerto ja jako. Yhtä vahvat vasemmalta oikealle."
        : "Ei vielä. Kumpi jäljellä olevista on vahvempi?", "no");
      return;
    }
    const arvo=laske(ljTokens[i-1],ljTokens[i],ljTokens[i+1]);
    let alku=i-1, loppu=i+1;
    if(ljTokens[i-2]==="(" && ljTokens[i+2]===")"){ alku=i-2; loppu=i+2; }
    ljTokens.splice(alku, loppu-alku+1, String(arvo));
    ljStep++;
    ljViesti(ljStep>=l.askeleet.length ? "Valmis. Vastaus on "+l.vastaus+"." : "Oikein. Jatka seuraavaan.", "ok");
    ljPiirra();
  }
  document.getElementById("ljSeuraava").addEventListener("click",()=>{
    ljI=(ljI+1)%D.kokeilu.length; ljAlku();
  });
  ljAlku();
}

   Kaksi vastaustyyppiä: "numero" (oletus, tekstikenttä + Number()-vertailu) ja

   erotettuna tyhjällä rivillä. Viimeinen osa on kysymys, sitä edeltävät aineistoa. */

  const osat = String(t).split(/\n\s*\n/).map(x=>x.trim()).filter(Boolean);
  if(osat.length < 2) return osat[0] || "";
  const kysymys = osat.pop();
  return osat.map(p=>`<span class="aineisto">${p}</span>`).join("")
       + `<span class="kysymysrivi">${kysymys}</span>`;
};

/* Suomalainen lukumuoto: välilyönti on tuhaterotin, pilkku desimaalierotin.
   Piste voi olla kumpi tahansa. Se tulkitaan tuhaterottimeksi VAIN silloin, kun
   koko luku on aitoa tuhaterotinmuotoa: alkuosa 1–3 numeroa ilman etunollaa ja
   jokainen jatko-osa täsmälleen 3 numeroa (1.500, 12.345.678). Kaikissa muissa
   tapauksissa piste on desimaalipiste — myös 0.125, joka vanhalla säännöllä
   ("3 numeroa pisteen jäljessä = tuhaterotin") luettiin virheellisesti luvuksi 125. */
const TUHATEROTIN = /^[1-9]\d{0,2}(\.\d{3})+$/;
function lueLuku(teksti){
  // Murtoluku (3/4, -3/4) ja sekaluku (1 2/3, -1 2/3) hyväksytään sellaisinaan.
  const raaka = String(teksti).replace(/\u00a0/g, " ").trim();
  let m = raaka.match(/^(-?)(\d+)\s+(\d+)\s*\/\s*(\d+)$/);
  if(m){ const nim = Number(m[4]); if(nim === 0) return null;
    const v = Number(m[2]) + Number(m[3]) / nim; return m[1] ? -v : v; }
  m = raaka.match(/^(-?)\s*(\d+)\s*\/\s*(\d+)$/);
  if(m){ const nim = Number(m[3]); if(nim === 0) return null;
    const v = Number(m[2]) / nim; return m[1] ? -v : v; }
  let s = String(teksti).replace(/[\s\u00a0]/g, "");
  if(s === "") return null;
  if(s.indexOf(",") >= 0){
    s = s.replace(/\./g, "").replace(",", ".");
  } else if(TUHATEROTIN.test(s)){
    s = s.replace(/\./g, "");
  }
  const n = Number(s);
  return Number.isFinite(n) ? n : null;
}

function tarkista(id){
  const h=D.harjoitukset.find(x=>x.id===id);
  const kentta=document.getElementById("in-"+id);
  const fb=document.getElementById("fb-"+id);
  if(kentta.value.trim()===""){ fb.className="fb hint"; fb.textContent="Kirjoita vastaus ensin."; return; }
  const luku=lueLuku(kentta.value);
  if(luku===null){ fb.className="fb no"; fb.textContent="Vastauksen pitää olla luku tai murtoluku (esimerkiksi 3/4)."; return; }
  const oikein = Math.abs(luku - h.vastaus) < 1e-9;
  merkitseTulos(id, oikein, oikein ? "Oikein. "+h.selitys : `Ei vielä. ${h.vinkki} Kokeile uudelleen.`);
}

function tarkistaMonivalinta(id, valittuIndeksi, painike){
  const h=D.harjoitukset.find(x=>x.id===id);
  const rivi=painike.closest(".row");
  rivi.querySelectorAll(".mv-valinta").forEach(b=>b.disabled=true);
  const oikein = valittuIndeksi===h.vastaus;
  painike.classList.add(oikein?"mv-oikein":"mv-vaarin");
  if(!oikein){
    const oikeaBtn=rivi.querySelector(`[data-i="${h.vastaus}"]`);
    if(oikeaBtn) oikeaBtn.classList.add("mv-oikein");
  }
  merkitseTulos(id, oikein, oikein ? "Oikein. "+h.selitys : `Ei ihan. Oikea vastaus on korostettu. ${h.selitys||""}`);
}

/* Kuuntelu: selain lukee tekstin ääneen omalla puhesynteesillään (englanniksi, jos laitteessa on
   englanninkielinen ääni). Ei äänitiedostoja eikä verkkoyhteyttä. Jos laite ei osaa puhua,
   teksti näytetään luettavaksi — silloin tehtävä muuttuu luetun ymmärtämiseksi, mutta ei katkea. */
function puhu(id, nopeus){
  const h=D.harjoitukset.find(x=>x.id===id); if(!h || !h.kuuntele) return;
  const vara=document.getElementById("vara-"+id);
  const naytaTeksti=syy=>{ vara.hidden=false; vara.textContent=syy+" Teksti: "+h.kuuntele; };
  if(!("speechSynthesis" in window)){ naytaTeksti("Tämä laite ei osaa lukea ääneen."); return; }
  const s=window.speechSynthesis; s.cancel();
  const u=new SpeechSynthesisUtterance(h.kuuntele);
  u.lang=h.kieli||"en-GB"; u.rate=nopeus;
  const aanet=s.getVoices(), kieli=u.lang.slice(0,2);
  const aani=aanet.find(a=>a.lang===u.lang) || aanet.find(a=>a.lang && a.lang.startsWith(kieli));
  if(aani) u.voice=aani;
  else if(aanet.length) { naytaTeksti("Laitteessa ei ole englanninkielistä ääntä."); return; }
  u.onerror=()=>naytaTeksti("Ääneen lukeminen ei onnistunut.");
  s.speak(u);
}
