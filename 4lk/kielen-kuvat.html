<title>Kielen kuvat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">

<style>
:root{
  --paper:#EFF2F5; --surface:#FFFFFF; --surface-2:#F7F9FB;
  --grid:#DCE3EA; --line:#C9D3DC;
  --ink:#15222C; --ink-2:#4E626F; --ink-3:#7E8F9B;
  --core:#1B5A9E; --core-soft:#E4EDF6;
  --strong:#1F6E5C; --strong-soft:#E1F0EB;
  --chal:#9A6A16; --chal-soft:#F6EDDC;
  --alert:#A33A2B; --alert-soft:#F8E7E3;
  --shadow:0 1px 2px rgba(21,34,44,.06), 0 8px 24px -12px rgba(21,34,44,.18);
  --r:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0F161B; --surface:#18222A; --surface-2:#1D2830;
    --grid:#22303A; --line:#2E3E4A;
    --ink:#E8EFF4; --ink-2:#A3B4C0; --ink-3:#7A8B97;
    --core:#7FB2E4; --core-soft:#16303F;
    --strong:#77CDB4; --strong-soft:#123028;
    --chal:#E0B267; --chal-soft:#33270F;
    --alert:#E8907F; --alert-soft:#3A1E19;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -14px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --paper:#0F161B; --surface:#18222A; --surface-2:#1D2830;
  --grid:#22303A; --line:#2E3E4A;
  --ink:#E8EFF4; --ink-2:#A3B4C0; --ink-3:#7A8B97;
  --core:#7FB2E4; --core-soft:#16303F;
  --strong:#77CDB4; --strong-soft:#123028;
  --chal:#E0B267; --chal-soft:#33270F;
  --alert:#E8907F; --alert-soft:#3A1E19;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -14px rgba(0,0,0,.7);
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:16px; line-height:1.62;
  background-image:
    linear-gradient(to right, var(--grid) 1px, transparent 1px),
    linear-gradient(to bottom, var(--grid) 1px, transparent 1px);
  background-size:26px 26px;
}
.wrap{max-width:760px; margin:0 auto; padding:28px 20px 90px}
h1,h2,h3,h4{font-family:"Familjen Grotesk","IBM Plex Sans",system-ui,sans-serif; text-wrap:balance}

/* header */
header.top{background:var(--surface); border:1px solid var(--line); border-radius:var(--r);
  box-shadow:var(--shadow); padding:22px 24px; display:flex; gap:18px; align-items:flex-start}
.badge{flex:0 0 auto; width:54px; height:54px; border-radius:9px; display:grid; place-items:center;
  background:var(--core-soft); border:1px solid var(--core); color:var(--core)}
.badge svg{width:28px; height:28px; fill:none; stroke:currentColor; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round}
.eyebrow{font-family:"IBM Plex Mono",monospace; font-size:11px; letter-spacing:.14em;
  text-transform:uppercase; color:var(--ink-3); margin:0 0 5px}
header.top h1{margin:0; font-size:30px; font-weight:700; letter-spacing:-.015em}
header.top p{margin:5px 0 0; color:var(--ink-2); font-size:15px}
.tags{display:flex; flex-wrap:wrap; gap:5px; margin-top:11px}
.tag{font-family:"IBM Plex Mono",monospace; font-size:10.5px; letter-spacing:.05em; padding:2px 7px;
  border-radius:4px; background:var(--surface-2); border:1px solid var(--line); color:var(--ink-3)}
.tag.core{background:var(--core-soft); border-color:var(--core); color:var(--core)}

/* teksti */
article{margin-top:26px}
article h2{font-size:21px; font-weight:600; margin:32px 0 10px; letter-spacing:-.01em}
article p{margin:0 0 14px; max-width:64ch}
.lead{font-size:17.5px; color:var(--ink); border-left:3px solid var(--core); padding-left:16px; margin:0 0 8px}

.box{background:var(--surface); border:1px solid var(--line); border-radius:var(--r);
  padding:18px 22px; box-shadow:var(--shadow); margin:22px 0}
.box h3{margin:0 0 12px; font-size:16.5px; font-weight:600}
.box.warn{border-left:3px solid var(--alert)}
.box.note{border-left:3px solid var(--chal)}

ol.steps{margin:0; padding-left:0; list-style:none; counter-reset:s; display:grid; gap:12px}
ol.steps li{counter-increment:s; display:grid; grid-template-columns:auto 1fr; gap:13px; align-items:start}
ol.steps li::before{content:counter(s); font-family:"Familjen Grotesk",sans-serif; font-weight:700; font-size:14px;
  width:26px; height:26px; border-radius:50%; background:var(--core); color:#fff; display:grid; place-items:center; margin-top:2px}

ul.notes{margin:0; padding-left:19px}
ul.notes li{margin-bottom:7px}
ul.notes li:last-child{margin-bottom:0}

.tablewrap{overflow-x:auto}
table{border-collapse:collapse; width:100%; font-size:14.5px; min-width:460px}
th,td{text-align:left; padding:9px 13px; border-bottom:1px solid var(--line)}
th{font-family:"IBM Plex Mono",monospace; font-size:10.5px; letter-spacing:.1em; text-transform:uppercase;
  color:var(--ink-3); font-weight:400; background:var(--surface-2)}
tr:last-child td{border-bottom:0}
td b{color:var(--core); font-weight:600}
td:last-child{font-variant-numeric:tabular-nums; font-weight:600}

/* lukusuora */
.nl svg{width:100%; height:118px; display:block}
.nl .rail{stroke:var(--line); stroke-width:2}
.nl .tick{stroke:var(--line); stroke-width:1.5}
.nl .stop{fill:var(--ink-3); font-family:"IBM Plex Mono",monospace; font-size:11px}
.nl .stop.near{fill:var(--core); font-weight:600}
.nl .dot{fill:var(--chal)}
.nl .val{fill:var(--ink); font-family:"Familjen Grotesk",sans-serif; font-size:15px; font-weight:700}
.nl .halfway{stroke:var(--chal); stroke-dasharray:3 3; stroke-width:1.5}
.nl-controls{display:flex; align-items:center; gap:14px; margin-top:6px}
.nl-controls input{flex:1; accent-color:var(--core)}
.nl-out{font-family:"Familjen Grotesk",sans-serif; font-size:15px; font-weight:600; min-width:12.5em; text-align:right}

/* paikka-arvotaulu */
.box .ohje{margin:0 0 14px; font-size:14.5px; color:var(--ink-2)}
.nt-valinta{display:flex; flex-wrap:wrap; gap:7px; margin-bottom:16px}
.nt-valinta button{font:inherit; font-size:12.5px; font-family:"IBM Plex Mono",monospace; padding:5px 11px;
  border-radius:6px; border:1px solid var(--line); background:var(--surface-2); color:var(--ink-2); cursor:pointer}
.nt-valinta button[aria-pressed="true"]{background:var(--ink); color:var(--paper); border-color:var(--ink)}
.nt-valinta button:focus-visible{outline:2px solid var(--core); outline-offset:2px}
.nt-taulu{display:flex; flex-direction:column; gap:4px; align-items:flex-start; overflow-x:auto; padding-bottom:4px}
.nt-rivi{display:flex; gap:6px; align-items:center}
.nt-rivi .otsa{font-family:"IBM Plex Mono",monospace; font-size:9.5px; letter-spacing:.08em;
  text-transform:uppercase; color:var(--ink-3); width:52px; text-align:center}
.nt-ruutu{width:52px; height:52px; display:grid; place-items:center; border:1.5px solid var(--line);
  border-radius:7px; background:var(--surface-2); font-family:"IBM Plex Mono",monospace; font-size:24px}
.nt-ruutu.kohta{border-color:var(--core); background:var(--core-soft); color:var(--core); font-weight:500}
.nt-ruutu.ratkaiseva{border-color:var(--chal); background:var(--chal-soft); color:var(--chal); font-weight:500}
.nt-ruutu.nolla{color:var(--ink-3)}
.nt-rivi .nimi{font-size:12.5px; color:var(--ink-3); margin-left:12px; white-space:nowrap}
.nt-nuoli{font-size:17px; color:var(--chal); margin-left:6px}
.nt-selite{margin:14px 0 0; font-size:14.5px}
.nt-selite b{color:var(--core)}

/* vahvuusportaat */
.vp-tasot{display:grid; gap:9px; margin-bottom:18px}
.vp-taso{display:flex; gap:11px; align-items:flex-start; font-size:13.5px}
.vp-taso .vp-pallo{width:13px; height:13px; border-radius:4px; margin-top:5px; flex:0 0 auto}
.vp-taso[data-taso="sulkeet"] .vp-pallo{background:var(--core)}
.vp-taso[data-taso="kertojako"] .vp-pallo{background:var(--strong)}
.vp-taso[data-taso="yhteenvahennys"] .vp-pallo{background:var(--chal)}
.vp-taso strong{display:block; font-family:"Familjen Grotesk",sans-serif; font-weight:600; font-size:14.5px}
.vp-taso span{color:var(--ink-2)}
.vp-lauseke{display:flex; flex-wrap:wrap; gap:7px; align-items:flex-end; font-family:"IBM Plex Mono",monospace;
  font-size:25px; padding:10px 2px; min-height:64px}
.vp-lauseke .t{padding:2px 3px}
.vp-lauseke .op{position:relative; padding:2px 9px; border-radius:6px; font-weight:500}
.vp-lauseke .op[data-taso="sulkeet"]{background:var(--core-soft); color:var(--core)}
.vp-lauseke .op[data-taso="kertojako"]{background:var(--strong-soft); color:var(--strong)}
.vp-lauseke .op[data-taso="yhteenvahennys"]{background:var(--chal-soft); color:var(--chal)}
.vp-lauseke .op i{position:absolute; top:-9px; right:-6px; font-style:normal; font-family:"Familjen Grotesk",sans-serif;
  font-size:11px; font-weight:700; width:18px; height:18px; border-radius:50%; display:grid; place-items:center;
  background:currentColor}
.vp-lauseke .op i span{color:var(--surface)}
.vp-rivi{display:flex; align-items:center; gap:16px; margin-top:8px}
.vp-vastaus{font-family:"Familjen Grotesk",sans-serif; font-size:16px; font-weight:600; color:var(--strong)}

/* laskujärjestys-widget */
.lj-exp{display:flex; flex-wrap:wrap; gap:7px; align-items:center; font-family:"IBM Plex Mono",monospace;
  font-size:23px; padding:14px 4px; min-height:62px}
.lj-exp .tok{padding:2px 4px; color:var(--ink)}
.lj-exp button.op{font-family:"IBM Plex Mono",monospace; font-size:23px; padding:3px 12px; border-radius:7px;
  border:1.5px solid var(--line); background:var(--surface-2); color:var(--ink); line-height:1.2}
.lj-exp button.op:hover{border-color:var(--core); color:var(--core)}
.lj-exp button.op:focus-visible{outline:2px solid var(--core); outline-offset:2px}
.lj-exp .valmis{font-family:"Familjen Grotesk",sans-serif; font-size:23px; font-weight:700; color:var(--strong)}
.lj-fb{font-size:14.5px; min-height:1.5em; color:var(--ink-2)}
.lj-fb.no{color:var(--alert)}
.lj-fb.ok{color:var(--strong)}
.lj-row{display:flex; align-items:center; gap:14px; margin-top:10px}
.lj-step{font-family:"IBM Plex Mono",monospace; font-size:11.5px; letter-spacing:.1em;
  text-transform:uppercase; color:var(--ink-3)}

/* harjoitukset */
.progress{position:sticky; top:0; z-index:5; background:var(--surface); border:1px solid var(--line);
  border-radius:var(--r); padding:12px 18px; box-shadow:var(--shadow); display:flex; align-items:center;
  gap:14px; margin:34px 0 18px}
.progress .lbl{font-family:"IBM Plex Mono",monospace; font-size:11px; letter-spacing:.12em;
  text-transform:uppercase; color:var(--ink-3); white-space:nowrap}
.progress .meter{flex:1; height:7px; border-radius:4px; background:var(--surface-2); border:1px solid var(--line); overflow:hidden}
.progress .meter i{display:block; height:100%; background:var(--core); transition:width .25s ease}
.progress .cnt{font-family:"Familjen Grotesk",sans-serif; font-weight:700; font-variant-numeric:tabular-nums; white-space:nowrap}

.grp{margin-top:26px}
.grp-head{display:flex; align-items:baseline; gap:10px; border-bottom:1.5px solid var(--ink); padding-bottom:7px; margin-bottom:14px}
.grp-head h3{margin:0; font-size:17px; font-weight:600}
.grp-head span{font-size:12.5px; color:var(--ink-2)}

.ex{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:14px 16px; margin-bottom:10px}
.ex[data-tila="oikein"]{border-color:var(--strong); box-shadow:inset 3px 0 0 var(--strong)}
.ex[data-tila="vaarin"]{border-color:var(--alert); box-shadow:inset 3px 0 0 var(--alert)}
.ex .q{display:flex; gap:11px; align-items:baseline; flex-wrap:wrap}
.ex .num{font-family:"IBM Plex Mono",monospace; font-size:11.5px; color:var(--ink-3); min-width:2.4em}
.ex .txt{flex:1; min-width:190px; font-size:15.5px}
.ex .txt .aineisto{display:block; margin-bottom:9px; padding-left:12px;
  border-left:2px solid var(--line); color:var(--ink-2); line-height:1.6;
  /* Aineisto voi olla pieni taulukko, jonka rivit on erotettu rivinvaihdoilla.
     Ilman pre-lineä ne valuisivat yhdeksi kappaleeksi ja taulukko katoaisi. */
  white-space:pre-line}
.ex .txt .kysymysrivi{display:block; font-weight:600}
.ex .row{display:flex; gap:8px; align-items:center; margin-top:11px; flex-wrap:wrap}
.ex input[type=text]{font:inherit; font-family:"IBM Plex Mono",monospace; font-size:15px; width:8.5em;
  padding:7px 11px; border:1px solid var(--line); border-radius:7px; background:var(--surface-2);
  color:var(--ink); text-align:right}
.ex input:focus-visible{outline:2px solid var(--core); outline-offset:1px}
button{font:inherit; cursor:pointer}
.btn{font-size:13.5px; padding:7px 15px; border-radius:7px; border:1px solid var(--core);
  background:var(--core); color:#fff}
.btn.ghost{background:transparent; color:var(--ink-2); border-color:var(--line)}
.btn:focus-visible{outline:2px solid var(--core); outline-offset:2px}
.btn.mv-valinta{text-align:left}
/* kuuntelutehtävä: selaimen puhesynteesi lukee englanninkielisen tekstin */
.kuuntele{display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin:2px 0 10px}
.kuuntele .btn{display:inline-flex; gap:7px; align-items:center}
.kuuntele svg{width:16px; height:16px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round}
.kuuntele .varateksti{flex-basis:100%; font-size:14px; color:var(--ink-2); background:var(--surface-2);
  border-radius:7px; padding:8px 12px; margin:0}
.btn.mv-valinta:disabled{cursor:default; opacity:.65}
.btn.mv-oikein{background:var(--strong-soft); border-color:var(--strong); color:var(--strong); opacity:1}
.btn.mv-vaarin{background:var(--alert-soft); border-color:var(--alert); color:var(--alert); opacity:1}
.row.mv{gap:8px 10px}
.fb{margin-top:11px; font-size:14.5px; padding:10px 13px; border-radius:8px; line-height:1.5}
.fb.ok{background:var(--strong-soft); color:var(--strong)}
.fb.no{background:var(--alert-soft); color:var(--alert)}
.fb.hint{background:var(--chal-soft); color:var(--chal)}

.done{background:var(--strong-soft); border:1px solid var(--strong); color:var(--strong);
  border-radius:var(--r); padding:16px 20px; margin-top:20px; font-size:15.5px}
.done h3{margin:0 0 4px; font-size:17px; color:var(--strong)}

details.teacher{margin-top:34px; background:var(--surface); border:1px solid var(--line);
  border-left:3px solid var(--chal); border-radius:var(--r); padding:15px 20px; box-shadow:var(--shadow)}
details.teacher summary{cursor:pointer; font-family:"Familjen Grotesk",sans-serif; font-weight:600; font-size:15px}
details.teacher summary:focus-visible{outline:2px solid var(--core); outline-offset:3px}
details.teacher ul{margin:12px 0 0; padding-left:19px; color:var(--ink-2); font-size:14.5px}
details.teacher li{margin-bottom:8px}
details.teacher p{margin:12px 0 0; color:var(--ink-2); font-size:14.5px}

.back{display:inline-block; margin-top:30px; font-size:13.5px; color:var(--ink-2)}
.back a{color:var(--core)}

@media (prefers-reduced-motion: reduce){*{transition:none !important}}
@media (max-width:560px){
  .wrap{padding:16px 13px 70px}
  header.top h1{font-size:25px}
  .progress{flex-wrap:wrap}
}
</style>

<div class="wrap">

  <header class="top">
    <span class="badge"><svg viewBox="0 0 24 24" aria-hidden="true" id="ikoni"></svg></span>
    <div>
      <p class="eyebrow" id="eyebrow"></p>
      <h1 id="otsikko"></h1>
      <p id="kuvaus"></p>
      <div class="tags" id="tags"></div>
    </div>
  </header>

  <article id="teksti"></article>

  <div class="progress" aria-live="polite">
    <span class="lbl">Harjoitukset</span>
    <span class="meter"><i id="pbar" style="width:0%"></i></span>
    <span class="cnt" id="pcnt">0 / 20</span>
  </div>

  <div id="harjoitukset"></div>
  <div id="valmis"></div>

  <p class="back" id="back"></p>

</div>

<script>
const D = {"tavoite_id":"UE4-AJA-01","oppiaine":"UE","vuosiluokka":4,"taso":"vahvistava","otsikko":"Kielen kuvat","kuvaus":"Tunnistan uskonnollisessa kielessä käytettyjä vertauskuvia ja osaan selittää, mitä ne tarkoittavat.","versio":"0.2","paivitetty":"2026-09-26","ops":{"T":["T3"],"S":["S1"],"ET":["T3"]},"eyebrow":"Uskonto · 4. luokka · Ajattelun ja keskustelun taidot","ikoni":"ajattelu","teksti":[{"tyyppi":"johdanto","sisalto":"Mummo sanoo naapurista: \"Hänellä on kultainen sydän.\" Kukaan ei ala miettiä, onko naapurin rinnassa kultaa. Kaikki ymmärtävät, että naapuri on ystävällinen ja auttaa muita. Samanlaista kieltä on Raamatussa. Psalmissa sanotaan: \"Herra on minun paimeneni\" (Ps. 23:1). Kirjoittaja ei kerro, että hän olisi lammas laitumella. Hän kuvaa tutun asian avulla jotakin, mitä ei voi nähdä: sitä, että hän luottaa Jumalan huolenpitoon. Tässä taidossa opit erottamaan, milloin sana tarkoittaa tavallista asiaa ja milloin se on kuva jostakin muusta, ja perustelemaan tulkintasi sillä, mitä tekstissä lukee."},{"tyyppi":"kappale","otsikko":"Kirjaimellinen ja vertauskuvallinen merkitys","sisalto":"Kirjaimellinen merkitys on sanan tavallinen merkitys. Lauseessa \"Paimen ajoi lampaat aitaukseen\" paimen on oikea ihminen, joka hoitaa oikeita lampaita. Vertauskuvallinen merkitys syntyy, kun sana kuvaa jotakin muuta kuin tavallista asiaansa. Lauseessa \"Herra on minun paimeneni\" paimen kuvaa Jumalaa, joka pitää huolta. Äidinkielen tunneilla tällaisia ilmauksia kutsutaan kielikuviksi. Uskonnon tunnilla puhutaan usein vertauskuvasta, koska siinä yksi asia kuvaa toista. Tämän taidon tehtävissä lause on vertauskuva, jos jokin sen sana ei tarkoita tavallista asiaansa vaan kuvaa jotakin muuta."},{"tyyppi":"kappale","otsikko":"Miksi uskonnollisessa kielessä on paljon kuvia","sisalto":"Uskonnoissa puhutaan asioista, joita ei voi nähdä eikä koskea, kuten Jumalasta, luottamuksesta ja anteeksiannosta. Niistä on helpompi puhua tuttujen asioiden avulla. Raamatun kirjoittajat elivät kauan sitten maissa, joissa lampaita paimennettiin, leipää leivottiin kotona ja viinipuita kasvatettiin. Siksi kuvat ovat usein paimenia, leipää, valoa, kallioita ja viinipuita. Kuvan merkitys löytyy kysymällä, mitä tuttu asia tekee: paimen ohjaa ja suojelee, leipä pitää hengissä, valo näyttää tien. Moni Raamatun kuva on siirtynyt arkikieleen. Kun joku sanoo toisella olevan kivisydän, hän tarkoittaa, ettei tämä välitä muista. Sama kuva on Hesekielin kirjassa: Jumala lupaa ottaa pois kivisydämen ja antaa tilalle elävän sydämen (Hes. 36:26). Viite Hes. 36:26 tarkoittaa Hesekielin kirjan lukua 36 ja sen jaetta 26."},{"tyyppi":"taulukko","otsikko":"Raamatun vertauskuvia","otsikkorivi":["Kuva","Missä","Mitä tekstissä sanotaan","Miten kristityt ovat tulkinneet"],"rivit":[["Paimen","Ps. 23:1, Joh. 10:11","\"Herra on minun paimeneni.\" Jeesus sanoo: \"Minä olen hyvä paimen.\"","Jumala ja Jeesus pitävät huolta ihmisistä niin kuin hyvä paimen lampaistaan."],["Valo","Matt. 5:14–16","Jeesus sanoo kuulijoilleen: \"Te olette maailman valo.\" Valon pitää loistaa, jotta ihmiset näkevät heidän hyvät tekonsa.","Jeesuksen seuraajien hyvät teot näkyvät muille."],["Leipä","Joh. 6:35","Jeesus sanoo: \"Minä olen elämän leipä.\" Joka tulee hänen luokseen, ei ole koskaan nälissään.","Jeesus antaa sen, mitä ihminen tarvitsee elääkseen, niin kuin leipä ravitsee."],["Viinipuu ja oksat","Joh. 15:5","\"Minä olen viinipuu, te olette oksat.\" Oksa ei kanna hedelmää, jos se ei pysy puussa.","Jeesuksen seuraajat tarvitsevat yhteyttä Jeesukseen."],["Kallio","Ps. 18:3","Psalmin kirjoittaja kutsuu Herraa kalliokseen.","Jumalaan voi luottaa ja turvautua niin kuin lujaan kallioon."],["Kivisydän","Hes. 36:26","Jumala lupaa ottaa pois kivisydämen ja antaa tilalle elävän sydämen.","Kova ja välinpitämätön mieli vaihtuu mieleen, joka välittää."]]},{"tyyppi":"saanto","otsikko":"Näin tulkitset vertauskuvan","askeleet":["Lue koko lause tai teksti, älä vain yhtä sanaa.","Kysy: tarkoittaako sana tässä tavallista asiaansa? Onko psalmin kirjoittaja oikeasti lammas? Jos ei, sana on vertauskuva.","Mieti, mitä tuttu asia tekee tai millainen se on. Paimen ohjaa, suojelee ja etsii kadonneen.","Etsi tekstistä sanat, jotka kertovat, mihin kuva liittyy. Usein teksti kertoo sen itse: \"jotta ihmiset näkevät teidän hyvät tekonsa\".","Kirjoita tulkinta ja perustelu: \"Valo tarkoittaa hyviä tekoja, koska tekstissä sanotaan, että ihmiset näkevät ne.\""]},{"tyyppi":"kappale","otsikko":"Vertaus on kokonainen kertomus","sisalto":"Uskonnon tunnilla vertaus tarkoittaa kertomusta, jonka Raamatun mukaan Jeesus kertoi opettaakseen jotakin. Äidinkielessä sana vertaus tarkoittaa kuin-sanalla tehtyä kielikuvaa, joten sana on kahdessa oppiaineessa eri asia. Vertauskuva on yksi kuva, esimerkiksi \"Minä olen hyvä paimen\". Vertaus on kokonainen kertomus, jossa on henkilöitä ja tapahtumia. Useimmilla vertausten henkilöillä ei ole nimeä: kertomus alkaa \"eräällä miehellä oli kaksi poikaa\". Kaikki Raamatun kertomukset eivät ole vertauksia. Nooan arkki, Joosef ja hänen veljensä, Jeesuksen syntymä, Jeesuksen kaste, Jeesus siunaa lapsia, Jeesus tyynnyttää myrskyn ja Sakkeus kerrotaan Raamatussa tapahtumina, eivät Jeesuksen kertomina vertauksina. Osan vertauksista Jeesus selittää itse, kuten kylväjän vertauksen: \"siemen on Jumalan sana\" (Luuk. 8:11)."},{"tyyppi":"taulukko","otsikko":"Jeesuksen vertauksia","otsikkorivi":["Vertaus","Missä","Mitä kertomuksessa tapahtuu","Mitä se opettaa kristittyjen tulkinnan mukaan"],"rivit":[["Kadonnut lammas","Luuk. 15:3–7","Miehellä on sata lammasta. Yksi katoaa, ja mies etsii sitä, kunnes löytää.","Jokainen ihminen on Jumalalle tärkeä."],["Kadonnut kolikko","Luuk. 15:8–10","Nainen kadottaa yhden kymmenestä rahastaan ja etsii sitä koko talon läpi.","Jumala iloitsee jokaisesta, joka palaa hänen luokseen."],["Tuhlaajapoika","Luuk. 15:11–32","Nuorempi poika tuhlaa perintönsä ja palaa kotiin. Isä juoksee häntä vastaan ja järjestää juhlat.","Jumala antaa anteeksi ja ottaa palaavan ihmisen vastaan."],["Laupias samarialainen","Luuk. 10:30–37","Pappi ja leeviläinen kulkevat haavoittuneen ohi. Samarialainen auttaa häntä.","Lähimmäinen on jokainen, joka tarvitsee apua."],["Kylväjä","Luuk. 8:4–15","Siemeniä putoaa neljänlaiseen paikkaan, ja vain hyvässä maassa ne tuottavat sadon.","Jeesus selittää itse: siemen on Jumalan sana."],["Sinapinsiemen","Matt. 13:31–32","Pienestä siemenestä kasvaa suuri kasvi, jonka oksilla linnut pesivät.","Jumalan valtakunta alkaa pienestä ja kasvaa suureksi."],["Talo kalliolle","Matt. 7:24–27","Kalliolle rakennettu talo kestää myrskyn, hiekalle rakennettu sortuu.","Jeesuksen opetuksen mukaan eläminen on luja perusta."]]},{"tyyppi":"ansa","otsikko":"Ansa 1: sama sana ei ole joka kerta kuva","sisalto":"Raamatussakin moni paimen on oikea paimen. Luukkaan evankeliumin mukaan seudulla oli yöllä paimenia kedolla vartioimassa laumaansa (Luuk. 2:8), ja nuori Daavid oli paimentamassa isänsä lampaita (1. Sam. 16:11). Leipäkin voi olla oikeaa leipää: poikasella oli viisi ohraleipää ja kaksi kalaa (Joh. 6:9). Siksi et voi päätellä vertauskuvaa pelkästä sanasta. Lue koko lause ja kysy, tarkoittaako sana siinä tavallista asiaansa. Sama koskee arkikieltä: \"Naapurilla on kultainen sydän\" on vertauskuva, mutta \"Mummon kaulaketjussa roikkui kultainen sydän\" kertoo oikeasta korusta."},{"tyyppi":"ansa","otsikko":"Ansa 2: arvaus ei ole tulkinta","sisalto":"Kun kuva on tuttu, vastauksen voi yrittää arvata lukematta tekstiä. \"Valo tarkoittaa varmaan aurinkoa\" kuulostaa järkevältä, mutta Matteuksen evankeliumin tekstissä lukee muuta: valon pitää loistaa, jotta ihmiset näkevät hyvät teot (Matt. 5:16). Toinen ansa on lukea kuva kirjaimellisesti: Jeesuksen kuulijat eivät hehkuneet pimeässä. Hyvä tulkinta kertoo, mitä kuva tarkoittaa, ja näyttää, missä kohdassa tekstiä se sanotaan."},{"tyyppi":"muistilappu","otsikko":"Muista nämä","kohdat":["Kirjaimellinen: sana tarkoittaa tavallista asiaansa. Vertauskuva: sana kuvaa jotakin muuta.","Lue koko lause. Sama sana voi olla yhdessä lauseessa kuva ja toisessa oikea asia.","Kysy, mitä tuttu asia tekee: paimen suojelee, valo näyttää, leipä ravitsee.","Perustele tekstin sanoilla: \"koska tekstissä sanotaan…\"","Vertaus on Jeesuksen kertoma kokonainen kertomus. Vertauskuva on yksi kuva.","Kun kerrot tulkinnasta, sano kenen se on: \"kristityt ovat tulkinneet…\""]}],"harjoitusryhmat":[{"id":"tunnista","nimi":"Kirjaimellinen vai vertauskuva","info":"Tarkoittaako sana tässä lauseessa tavallista asiaansa? Jos ei, se kuvaa jotakin muuta, ja lause on vertauskuva. Lue koko lause, älä vain sanaa."},{"id":"merkitys","nimi":"Mitä kuva tarkoittaa","info":"Etsi tekstistä kohta, joka kertoo, mitä kuva tarkoittaa. Vastaa sen perusteella, mitä tekstissä lukee, älä arvaa."},{"id":"vertaus","nimi":"Vertaus on kertomus","info":"Vertaus on Jeesuksen kertoma kokonainen kertomus. Lue, mitä siinä tapahtuu, ja etsi kohta, jossa kerrotaan sen opetus."}],"harjoitukset":[{"id":"H01","ryhma":"tunnista","kysymys":"Lauseet:\n1. Kaupasta ostettiin kaksi leipää ja maitoa.\n2. Jeesus sanoi: \"Minä olen elämän leipä.\"\n3. Retkellä paistoimme leipää nuotiolla.\n\nMontako näistä lauseista käyttää sanaa leipä vertauskuvana?","vastaus":1,"vinkki":"Kysy jokaisesta lauseesta: voiko tämän leivän syödä?","selitys":"Lauseissa 1 ja 3 leipä on oikeaa leipää, jota leivotaan ja syödään. Lauseessa 2 Jeesus ei ole oikea leipä, vaan leipä kuvaa sitä, mitä ihminen tarvitsee elääkseen. Vertauskuvia on 1."},{"id":"H02","ryhma":"tunnista","kysymys":"Lauseet:\n1. Isoäidillä on kultainen sydän.\n2. Mummon kaulaketjussa roikkui pieni kultainen sydän.\n3. Sydän pumppaa verta ympäri kehoa.\n4. Tarinan kuninkaalla oli kivisydän, eikä hän auttanut köyhiä.\n\nMontako näistä lauseista on vertauskuvia?","vastaus":2,"vinkki":"Lauseissa 1 ja 2 on samat sanat. Lue, mistä kummassakin puhutaan.","selitys":"Lauseissa 1 ja 4 sydän kuvaa ihmisen mieltä: kultainen sydän on ystävällinen, kivisydän kova ja välinpitämätön. Lauseessa 2 kultainen sydän on oikea koru, ja lauseessa 3 sydän on oikea elin. Vertauskuvia on 2."},{"id":"H03","ryhma":"tunnista","tyyppi":"monivalinta","kysymys":"Lause: \"Herra on minun paimeneni.\" (Ps. 23:1)\n\nMiksi lause on vertauskuva?","vaihtoehdot":["Siinä on sana paimen.","Herra ei ole oikea lampaiden paimen, vaan sana paimen kuvaa huolenpitoa.","Se on Raamatussa."],"vastaus":1,"vinkki":"Mieti, hoitaako Herra tässä oikeita lampaita.","selitys":"Lauseessa ei kerrota oikeasta paimenesta eikä oikeista lampaista. Paimen kuvaa huolenpitoa. Pelkkä sana paimen ei tee lauseesta vertauskuvaa, sillä Raamatussa on myös oikeita paimenia, eikä kaikki Raamatussa ole vertauskuvaa."},{"id":"H04","ryhma":"tunnista","kysymys":"Lauseet:\n1. Psalmissa sanotaan, että Jumalan kansa on hänen laitumensa lampaita.\n2. Lammas määki aitauksen nurkassa.\n3. Pikkuveljeä sanotaan perheen mustaksi lampaaksi, koska hän tykkää eri asioista kuin muut.\n\nMonesko lause käyttää sanaa lammas kirjaimellisesti?","vastaus":2,"vinkki":"Kirjaimellinen lammas on oikea eläin, jolla on villaa.","selitys":"Lauseessa 2 lammas on oikea eläin. Lauseessa 1 lampaat kuvaavat ihmisiä, joista Jumala pitää huolta (Ps. 100:3), ja lauseessa 3 musta lammas kuvaa ihmistä, joka on erilainen kuin muut perheessä."},{"id":"H05","ryhma":"tunnista","kysymys":"Lauseet:\n1. Kasvit tarvitsevat valoa kasvaakseen.\n2. Jeesus sanoi: \"Minä olen maailman valo.\"\n3. Kellarissa ei ollut yhtään valoa.\n4. Isän vitsi toi valoa synkkään iltaan.\n\nMontako näistä lauseista käyttää sanaa valo vertauskuvana?","vastaus":2,"vinkki":"Oikea valo näkyy silmin ja sen voi sammuttaa. Kysy, onko tämä sellaista valoa.","selitys":"Lauseissa 1 ja 3 valo on oikeaa valoa. Lauseessa 2 Jeesus ei ole lamppu, ja lauseessa 4 vitsi ei loista, vaan valo kuvaa iloa. Vertauskuvia on 2."},{"id":"H06","ryhma":"tunnista","kysymys":"Lauseet:\n1. Kiipesimme kalliolle katsomaan järveä.\n2. Ukki on koko suvun kallio.\n3. Kallion kolossa oli sadevettä.\n\nMonesko lause on vertauskuva?","vastaus":2,"vinkki":"Kallioon voi kiivetä. Voiko ukkiin kiivetä samalla tavalla?","selitys":"Lauseessa 2 ukki ei ole kiveä, vaan kallio kuvaa ihmistä, johon voi luottaa ja nojata, kun on vaikeaa. Lauseissa 1 ja 3 kallio on oikea kallio."},{"id":"H07","ryhma":"tunnista","kysymys":"Lauseet:\n1. Pikkusisko on perheen aurinko.\n2. Aurinko nousi aamulla metsän takaa.\n3. Isoveli on tietokoneiden velho.\n4. Satukirjassa velho taikoi sammakosta prinssin.\n5. Opettajan kehu oli pieni lahja.\n\nMontako näistä lauseista on vertauskuvia?","vastaus":3,"vinkki":"Etsi lauseet, joissa jokin sana ei tarkoita tavallista asiaansa.","selitys":"Pikkusisko ei ole taivaalla paistava aurinko, isoveli ei osaa taikoa, eikä kehu ole paketti. Lauseet 2 ja 4 kertovat oikeasta auringosta ja sadun velhosta, joka on tarinassa oikea velho. Vertauskuvia on 3."},{"id":"H08","ryhma":"merkitys","tyyppi":"monivalinta","kysymys":"Teksti Matteuksen evankeliumista (Matt. 5:14–16) omin sanoin:\n1. Jeesus puhui vuorella suurelle ihmisjoukolle.\n2. Hän sanoi kuulijoilleen: \"Te olette maailman valo.\"\n3. Hän muistutti, että lamppua ei sytytetä ja piiloteta astian alle, vaan se nostetaan jalustalle valaisemaan koko taloa.\n4. Jeesus sanoi, että samalla tavalla kuulijoiden valon pitää loistaa, jotta ihmiset näkevät heidän hyvät tekonsa.\n\nMitä vertauskuva valo tarkoittaa tässä tekstissä?","vaihtoehdot":["Lamppua, jonka Jeesuksen kuulijat sytyttävät illalla.","Hyviä tekoja, jotka muut ihmiset näkevät.","Aurinkoa, joka paistaa vuorelle."],"vastaus":1,"vinkki":"Etsi virke, joka kertoo, mitä ihmiset näkevät, kun valo loistaa.","selitys":"Virkkeessä 4 sanotaan, että valon pitää loistaa, jotta ihmiset näkevät kuulijoiden hyvät teot. Teksti kertoo siis itse, mitä valo tarkoittaa. Lamppu virkkeessä 3 on vertailukohta, ja aurinko on arvaus, jota tekstissä ei ole."},{"id":"H09","ryhma":"merkitys","kysymys":"Teksti Psalmista 23 omin sanoin:\n1. Psalmin kirjoittaja sanoo: \"Herra on minun paimeneni, ei minulta mitään puutu.\"\n2. Paimen vie hänet vihreille niityille lepäämään.\n3. Paimen johdattaa hänet veden ääreen.\n4. Kirjoittaja ei pelkää, vaikka hän kulkee pimeässä laaksossa.\n5. Paimen suojelee häntä sauvallaan.\n\nMonesko virke kertoo, kuka tekstin paimen on?","vastaus":1,"vinkki":"Etsi virke, jossa paimen saa nimen.","selitys":"Virkkeessä 1 kirjoittaja sanoo: \"Herra on minun paimeneni.\" Herra tarkoittaa Jumalaa, joten paimen kuvaa Jumalaa. Muut virkkeet kertovat, mitä paimen tekee, mutta eivät sitä, kuka hän on."},{"id":"H10","ryhma":"merkitys","kysymys":"Teksti Psalmista 23 omin sanoin:\n1. Psalmin kirjoittaja sanoo: \"Herra on minun paimeneni, ei minulta mitään puutu.\"\n2. Paimen vie hänet vihreille niityille lepäämään.\n3. Paimen johdattaa hänet veden ääreen.\n4. Kirjoittaja ei pelkää, vaikka hän kulkee pimeässä laaksossa.\n5. Paimen suojelee häntä sauvallaan.\n\nMontako virkettä kertoo, mitä paimen tekee?","vastaus":3,"vinkki":"Etsi virkkeet, joissa paimen tekee jotakin. Yksi virke kertoo vain kirjoittajasta.","selitys":"Virkkeissä 2, 3 ja 5 paimen tekee jotakin: vie niitylle, johdattaa veden ääreen ja suojelee sauvallaan. Virke 1 kertoo, kuka paimen on, ja virke 4 kertoo kirjoittajasta. Nämä teot näyttävät, miksi kuvaksi on valittu juuri paimen: se huolehtii ja suojelee."},{"id":"H11","ryhma":"merkitys","kysymys":"Teksti Psalmista 119 (Ps. 119:105) ja selitys omin sanoin:\n1. Psalmin kirjoittaja puhuu Jumalalle.\n2. Hän sanoo: \"Sinun sanasi on lamppu, joka valaisee askeleeni.\"\n3. Pimeällä polulla lampun valo näyttää, mihin kannattaa astua.\n\nMonesko virke kertoo, mitä asiaa psalmissa kuvataan lampulla?","vastaus":2,"vinkki":"Lamppu on kuva. Etsi virke, jossa kerrotaan, mikä on lamppu.","selitys":"Virkkeessä 2 sanotaan: \"Sinun sanasi on lamppu.\" Lamppu kuvaa siis Jumalan sanaa. Virke 3 kertoo, mitä oikea lamppu tekee, ja siitä näkee, miksi kuva sopii: sana näyttää, mihin suuntaan kulkea."},{"id":"H12","ryhma":"merkitys","kysymys":"Teksti Psalmista 23 omin sanoin:\n1. Psalmin kirjoittaja sanoo: \"Herra on minun paimeneni, ei minulta mitään puutu.\"\n2. Paimen vie hänet vihreille niityille lepäämään.\n3. Paimen johdattaa hänet veden ääreen.\n4. Kirjoittaja ei pelkää, vaikka hän kulkee pimeässä laaksossa.\n5. Paimen suojelee häntä sauvallaan.\n\nKolme lasta selittää, mitä paimen tarkoittaa:\n1. Aapo: \"Psalmin kirjoittajalla oli oikea paimen, joka vei hänet niitylle.\"\n2. Bea: \"Paimen tarkoittaa Jumalaa, koska ensimmäisessä virkkeessä sanotaan: Herra on minun paimeneni.\"\n3. Cimo: \"Paimen tarkoittaa varmaan kuningasta, koska kuninkaat ovat tärkeitä.\"\n\nMonesko lapsi perustelee tulkintansa tekstin sanoilla?","vastaus":2,"vinkki":"Kuka lapsista viittaa johonkin, mitä tekstissä todella lukee?","selitys":"Bea näyttää tekstin kohdan: ensimmäisessä virkkeessä paimen on Herra. Cimon perustelu ei ole tekstistä, vaan omasta arvauksesta. Aapo lukee kuvan kirjaimellisesti."},{"id":"H13","ryhma":"merkitys","kysymys":"Teksti Psalmista 23 omin sanoin:\n1. Psalmin kirjoittaja sanoo: \"Herra on minun paimeneni, ei minulta mitään puutu.\"\n2. Paimen vie hänet vihreille niityille lepäämään.\n3. Paimen johdattaa hänet veden ääreen.\n4. Kirjoittaja ei pelkää, vaikka hän kulkee pimeässä laaksossa.\n5. Paimen suojelee häntä sauvallaan.\n\nKolme lasta selittää, mitä paimen tarkoittaa:\n1. Aapo: \"Psalmin kirjoittajalla oli oikea paimen, joka vei hänet niitylle.\"\n2. Bea: \"Paimen tarkoittaa Jumalaa, koska ensimmäisessä virkkeessä sanotaan: Herra on minun paimeneni.\"\n3. Cimo: \"Paimen tarkoittaa varmaan kuningasta, koska kuninkaat ovat tärkeitä.\"\n\nMonesko lapsi tulkitsee paimenen kirjaimellisesti?","vastaus":1,"vinkki":"Kirjaimellinen tulkinta pitää paimenta oikeana ihmisenä, joka hoitaa lampaita.","selitys":"Aapo sanoo, että kirjoittajalla oli oikea paimen. Hän ei huomaa ensimmäisen virkkeen sanaa Herra. Bea ja Cimo ymmärtävät, että paimen kuvaa jotakuta muuta, mutta vain Bea perustelee sen tekstillä."},{"id":"H14","ryhma":"merkitys","kysymys":"Teksti:\n1. Luokalle tuli syksyllä uusi tyttö, Kerttu.\n2. Opettaja sanoi eräänä päivänä: \"Kerttu on tämän luokan aurinko.\"\n3. Kerttu ei ollut keltainen eikä kuuma.\n4. Opettaja tarkoitti, että Kerttu tervehtii kaikkia iloisesti ja saa muutkin hyvälle tuulelle.\n\nMonesko virke kertoo tekstin omin sanoin, mitä vertauskuva tarkoittaa?","vastaus":4,"vinkki":"Yksi virke on itse kuva, yksi kertoo, mitä kuva ei tarkoita, ja yksi selittää sen.","selitys":"Virke 4 kertoo, mitä opettaja tarkoitti: Kerttu on iloinen ja saa muut hyvälle mielelle, niin kuin aurinko lämmittää. Virke 2 on itse vertauskuva, ja virke 3 näyttää, ettei sitä lueta kirjaimellisesti."},{"id":"H15","ryhma":"vertaus","kysymys":"Jeesuksen vertaus tuhlaajapojasta (Luuk. 15:11–32) omin sanoin:\n1. Eräällä miehellä oli kaksi poikaa.\n2. Nuorempi poika pyysi osuutensa isän omaisuudesta ja lähti kauas.\n3. Hän tuhlasi rahansa, ja kun ne loppuivat, hän joutui paimentamaan sikoja.\n4. Hän päätti palata kotiin ja pyytää isältä anteeksi.\n5. Isä näki hänet jo kaukaa, juoksi häntä vastaan ja halasi häntä.\n6. Isä järjesti juhlat, koska poika oli palannut.\n\nMonesko virke kertoo, miten isä otti pojan vastaan?","vastaus":5,"vinkki":"Etsi virke, jossa isä ja poika kohtaavat.","selitys":"Virkkeessä 5 isä näkee pojan kaukaa, juoksee vastaan ja halaa. Virke 6 kertoo juhlista, jotka tulivat vasta kohtaamisen jälkeen. Juuri virkkeen 5 perusteella kristityt ovat tulkinneet, että vertaus kertoo Jumalasta, joka ottaa palaavan ihmisen vastaan."},{"id":"H16","ryhma":"vertaus","tyyppi":"monivalinta","kysymys":"Jeesuksen vertaus tuhlaajapojasta (Luuk. 15:11–32) omin sanoin:\n1. Eräällä miehellä oli kaksi poikaa.\n2. Nuorempi poika pyysi osuutensa isän omaisuudesta ja lähti kauas.\n3. Hän tuhlasi rahansa, ja kun ne loppuivat, hän joutui paimentamaan sikoja.\n4. Hän päätti palata kotiin ja pyytää isältä anteeksi.\n5. Isä näki hänet jo kaukaa, juoksi häntä vastaan ja halasi häntä.\n6. Isä järjesti juhlat, koska poika oli palannut.\n\nKristityt ovat tulkinneet, että vertauksen isä kuvaa Jumalaa. Mikä kertomuksen kohta tukee tulkintaa, että Jumala ottaa palaavan ihmisen vastaan?","vaihtoehdot":["Isä juoksi poikaa vastaan ja halasi häntä.","Poika joutui paimentamaan sikoja.","Isä lähetti palvelijat etsimään poikaa."],"vastaus":0,"vinkki":"Tulkinta puhuu vastaanottamisesta. Mikä vaihtoehto kertoo siitä?","selitys":"Isä juoksee pojan luo ja halaa häntä, vaikka poika oli tuhlannut kaiken. Se on kertomuksen kohta, johon tulkinta nojaa. Sikojen paimentaminen kertoo pojan ahdingosta, ei isästä, eikä kolmas vaihtoehto ole tässä kertomuksessa lainkaan."},{"id":"H17","ryhma":"vertaus","kysymys":"Kertomukset:\n1. Tuhlaajapoika\n2. Nooan arkki\n3. Sinapinsiemen\n4. Jeesus siunaa lapsia\n\nMontako näistä kertomuksista on Jeesuksen kertomia vertauksia?","vastaus":2,"vinkki":"Vertaus on kertomus, jonka Jeesus kertoi opettaakseen. Kuka kertomuksen kertoo?","selitys":"Tuhlaajapoika ja sinapinsiemen ovat Jeesuksen kertomia vertauksia. Nooan arkki on Vanhan testamentin kertomus, ja Jeesus siunaa lapsia kerrotaan Raamatussa tapahtumana Jeesuksen elämästä. Vertauksia on 2."},{"id":"H18","ryhma":"vertaus","kysymys":"Jeesuksen vertaus sinapinsiemenestä (Matt. 13:31–32) omin sanoin:\n1. Jeesus esitti kuulijoilleen vertauksen.\n2. Hän sanoi, että taivasten valtakunta on kuin sinapinsiemen, jonka mies kylvi peltoonsa.\n3. Vertauksessa sanotaan, että sinapinsiemen on pienin kaikista siemenistä.\n4. Kun se kasvaa täyteen mittaansa, siitä tulee niin suuri, että linnut pesivät sen oksilla.\n\nMonesko virke kertoo, mitä vertauksen sinapinsiemen kuvaa?","vastaus":2,"vinkki":"Etsi virke, jossa sinapinsiemen verrataan johonkin.","selitys":"Virkkeessä 2 sanotaan, että taivasten valtakunta on kuin sinapinsiemen. Siemen kuvaa siis taivasten valtakuntaa, eli kristittyjen kielessä Jumalan valtakuntaa. Virkkeet 3 ja 4 kertovat, millainen siemen on, ja niistä näkee, mitä kuva opettaa: pienestä alusta kasvaa suuri."},{"id":"H19","ryhma":"vertaus","kysymys":"Raamatun kohdat:\n1. \"Minä olen elämän leipä\" (Joh. 6:35)\n2. Kertomus kadonneesta kolikosta (Luuk. 15:8–10)\n3. \"Te olette maailman valo\" (Matt. 5:14)\n4. Kertomus laupiaasta samarialaisesta (Luuk. 10:30–37)\n5. \"Minä olen hyvä paimen\" (Joh. 10:11)\n\nMontako näistä on vertauksia eli kokonaisia kertomuksia? Muut ovat yksittäisiä vertauskuvia.","vastaus":2,"vinkki":"Vertauksessa on henkilöitä ja tapahtumia. Vertauskuva on yksi lause.","selitys":"Kadonnut kolikko ja laupias samarialainen ovat kertomuksia, joissa on henkilöitä ja tapahtumia. Leipä, valo ja paimen ovat yksittäisiä vertauskuvia. Vertauksia on 2."},{"id":"H20","ryhma":"vertaus","kysymys":"Kertomukset:\n1. Joosef ja hänen veljensä\n2. Jeesuksen syntymä\n3. Kadonnut lammas\n4. Nooan arkki\n\nMonesko näistä on Jeesuksen kertoma vertaus?","vastaus":3,"vinkki":"Kolme kertomusta kerrotaan Raamatussa tapahtumina. Yhden kertoi Jeesus itse.","selitys":"Kadonnut lammas on Jeesuksen kertoma vertaus (Luuk. 15:3–7). Joosef ja Nooa ovat Vanhan testamentin kertomuksia, ja Jeesuksen syntymä kerrotaan tapahtumana. Kaikki Raamatun kertomukset eivät ole vertauksia."}],"valmis_teksti":"Erotat, milloin sana tarkoittaa tavallista asiaansa ja milloin se on vertauskuva, ja osaat kertoa tekstin sanoilla, mitä kuva tai Jeesuksen vertaus tarkoittaa. Tämä taito on nyt näytetty."};

const esc = s => s;
const osat = D.teksti.map(o=>{
  switch(o.tyyppi){
    case "johdanto":
      return `<p class="lead">${esc(o.sisalto)}</p>`;
    case "kappale":
      return `<h2>${esc(o.otsikko)}</h2><p>${esc(o.sisalto)}</p>`;
    case "saanto":
      return `<div class="box"><h3>${esc(o.otsikko)}</h3><ol class="steps">${
        o.askeleet.map(a=>`<li><span>${esc(a)}</span></li>`).join("")}</ol></div>`;
    case "taulukko":
      return `<div class="box"><h3>${esc(o.otsikko)}</h3><div class="tablewrap"><table><thead><tr>${
        o.otsikkorivi.map(h=>`<th>${h}</th>`).join("")}</tr></thead><tbody>${
        o.rivit.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join("")}</tr>`).join("")}</tbody></table></div></div>`;
    case "ansa":
      return `<div class="box warn"><h3>${esc(o.otsikko)}</h3><p style="margin:0">${esc(o.sisalto)}</p></div>`;

const svg=document.getElementById("nlsvg"), rng=document.getElementById("nlrange"), out=document.getElementById("nlout");
const X0=34, X1=606, Y=62;
function piirraNL(v){
  const ala=Math.floor(v/10)*10, yla=ala+10, puoli=ala+5;
  const pyor = (v%10)>=5 ? yla : ala;
  const x = n => X0 + (n/100)*(X1-X0);
  let s=`<line class="rail" x1="${X0}" y1="${Y}" x2="${X1}" y2="${Y}"/>`;
  for(let n=0;n<=100;n+=10){
    const near = (n===ala||n===yla);
    s+=`<line class="tick" x1="${x(n)}" y1="${Y-7}" x2="${x(n)}" y2="${Y+7}"/>`;
    s+=`<text class="stop${near?" near":""}" x="${x(n)}" y="${Y+24}" text-anchor="middle">${n}</text>`;
  }
  s+=`<line class="halfway" x1="${x(puoli)}" y1="${Y-16}" x2="${x(puoli)}" y2="${Y+12}"/>`;
  s+=`<text class="stop" x="${x(puoli)}" y="${Y-22}" text-anchor="middle">puoliväli ${puoli}</text>`;
  s+=`<circle class="dot" cx="${x(v)}" cy="${Y}" r="6"/>`;
  s+=`<text class="val" x="${x(v)}" y="${Y-32}" text-anchor="middle">${v}</text>`;
  s+=`<path d="M ${x(v)} ${Y+38} L ${x(pyor)} ${Y+38}" stroke="var(--core)" stroke-width="2" fill="none"/>`;
  s+=`<path d="M ${x(pyor)} ${Y+38} l ${x(pyor)>x(v)?-7:7} -4 l 0 8 z" fill="var(--core)"/>`;
  svg.innerHTML=s;
  out.textContent = `${v} pyöristyy → ${pyor}`;
}

/* ---------- laskujärjestys-widget ---------- */
const ljExp=document.getElementById("ljExp");
if(ljExp && D.kokeilu){
  let ljI=0, ljTokens=[], ljStep=0;
  const laske=(a,op,b)=>{a=+a;b=+b;return op==="×"?a*b:op==="÷"?a/b:op==="+"?a+b:a-b;};
  function ljAlku(){
    const l=D.kokeilu[ljI];
    ljTokens=l.lauseke.replace(/\(/g,"( ").replace(/\)/g," )").split(/\s+/).filter(Boolean);
    ljStep=0; ljPiirra(); ljViesti("","");
  }
  function ljViesti(t,lk){const f=document.getElementById("ljFb"); f.textContent=t; f.className="lj-fb "+(lk||"");}
  function ljPiirra(){
    const l=D.kokeilu[ljI];
    document.getElementById("ljStep").textContent =
      ljStep>=l.askeleet.length ? "valmis" : `askel ${ljStep+1} / ${l.askeleet.length}`;
    if(ljStep>=l.askeleet.length){
      ljExp.innerHTML=`<span class="valmis">${l.lauseke} = ${l.vastaus}</span>`;
      return;
    }
    ljExp.innerHTML=ljTokens.map((t,i)=>
      "×÷+−".includes(t) ? `<button type="button" class="op" data-i="${i}">${t}</button>`
                         : `<span class="tok">${t}</span>`).join("");
    ljExp.querySelectorAll("button.op").forEach(b=>b.addEventListener("click",()=>ljKlikkaa(+b.dataset.i)));
  }
  function ljKlikkaa(i){
    const l=D.kokeilu[ljI], odotettu=l.askeleet[ljStep];
    const ehdotus=[ljTokens[i-1],ljTokens[i],ljTokens[i+1]].join(" ");
    if(ehdotus!==odotettu){
      ljViesti(ljStep===0
        ? "Ei vielä. Sulkeet ovat vahvimmat, sitten kerto ja jako. Yhtä vahvat vasemmalta oikealle."
        : "Ei vielä. Kumpi jäljellä olevista on vahvempi?", "no");
      return;
    }
    const arvo=laske(ljTokens[i-1],ljTokens[i],ljTokens[i+1]);
    let alku=i-1, loppu=i+1;
    if(ljTokens[i-2]==="(" && ljTokens[i+2]===")"){ alku=i-2; loppu=i+2; }
    ljTokens.splice(alku, loppu-alku+1, String(arvo));
    ljStep++;
    ljViesti(ljStep>=l.askeleet.length ? "Valmis. Vastaus on "+l.vastaus+"." : "Oikein. Jatka seuraavaan.", "ok");
    ljPiirra();
  }
  document.getElementById("ljSeuraava").addEventListener("click",()=>{
    ljI=(ljI+1)%D.kokeilu.length; ljAlku();
  });
  ljAlku();
}

/* Suomalainen lukumuoto: välilyönti on tuhaterotin, pilkku desimaalierotin.
   Piste voi olla kumpi tahansa. Se tulkitaan tuhaterottimeksi VAIN silloin, kun
   koko luku on aitoa tuhaterotinmuotoa: alkuosa 1–3 numeroa ilman etunollaa ja
   jokainen jatko-osa täsmälleen 3 numeroa (1.500, 12.345.678). Kaikissa muissa
   tapauksissa piste on desimaalipiste — myös 0.125, joka vanhalla säännöllä
   ("3 numeroa pisteen jäljessä = tuhaterotin") luettiin virheellisesti luvuksi 125. */
const TUHATEROTIN = /^[1-9]\d{0,2}(\.\d{3})+$/;
function lueLuku(teksti){
  // Murtoluku (3/4, -3/4) ja sekaluku (1 2/3, -1 2/3) hyväksytään sellaisinaan.
  const raaka = String(teksti).replace(/\u00a0/g, " ").trim();
  let m = raaka.match(/^(-?)(\d+)\s+(\d+)\s*\/\s*(\d+)$/);
  if(m){ const nim = Number(m[4]); if(nim === 0) return null;
    const v = Number(m[2]) + Number(m[3]) / nim; return m[1] ? -v : v; }
  m = raaka.match(/^(-?)\s*(\d+)\s*\/\s*(\d+)$/);
  if(m){ const nim = Number(m[3]); if(nim === 0) return null;
    const v = Number(m[2]) / nim; return m[1] ? -v : v; }
  let s = String(teksti).replace(/[\s\u00a0]/g, "");
  if(s === "") return null;
  if(s.indexOf(",") >= 0){
    s = s.replace(/\./g, "").replace(",", ".");
  } else if(TUHATEROTIN.test(s)){
    s = s.replace(/\./g, "");
  }
  const n = Number(s);
  return Number.isFinite(n) ? n : null;
}

function tarkista(id){
  const h=D.harjoitukset.find(x=>x.id===id);
  const kentta=document.getElementById("in-"+id);
  const fb=document.getElementById("fb-"+id);
  if(kentta.value.trim()===""){ fb.className="fb hint"; fb.textContent="Kirjoita vastaus ensin."; return; }
  const luku=lueLuku(kentta.value);
  if(luku===null){ fb.className="fb no"; fb.textContent="Vastauksen pitää olla luku tai murtoluku (esimerkiksi 3/4)."; return; }
  const oikein = Math.abs(luku - h.vastaus) < 1e-9;
  merkitseTulos(id, oikein, oikein ? "Oikein. "+h.selitys : `Ei vielä. ${h.vinkki} Kokeile uudelleen.`);
}

function tarkistaMonivalinta(id, valittuIndeksi, painike){
  const h=D.harjoitukset.find(x=>x.id===id);
  const rivi=painike.closest(".row");
  rivi.querySelectorAll(".mv-valinta").forEach(b=>b.disabled=true);
  const oikein = valittuIndeksi===h.vastaus;
  painike.classList.add(oikein?"mv-oikein":"mv-vaarin");
  if(!oikein){
    const oikeaBtn=rivi.querySelector(`[data-i="${h.vastaus}"]`);
    if(oikeaBtn) oikeaBtn.classList.add("mv-oikein");
  }
  merkitseTulos(id, oikein, oikein ? "Oikein. "+h.selitys : `Ei ihan. Oikea vastaus on korostettu. ${h.selitys||""}`);
}

/* Kuuntelu: selain lukee tekstin ääneen omalla puhesynteesillään (englanniksi, jos laitteessa on
   englanninkielinen ääni). Ei äänitiedostoja eikä verkkoyhteyttä. Jos laite ei osaa puhua,
   teksti näytetään luettavaksi — silloin tehtävä muuttuu luetun ymmärtämiseksi, mutta ei katkea. */
function puhu(id, nopeus){
  const h=D.harjoitukset.find(x=>x.id===id); if(!h || !h.kuuntele) return;
  const vara=document.getElementById("vara-"+id);
  const naytaTeksti=syy=>{ vara.hidden=false; vara.textContent=syy+" Teksti: "+h.kuuntele; };
  if(!("speechSynthesis" in window)){ naytaTeksti("Tämä laite ei osaa lukea ääneen."); return; }
  const s=window.speechSynthesis; s.cancel();
  const u=new SpeechSynthesisUtterance(h.kuuntele);
  u.lang=h.kieli||"en-GB"; u.rate=nopeus;
  const aanet=s.getVoices(), kieli=u.lang.slice(0,2);
  const aani=aanet.find(a=>a.lang===u.lang) || aanet.find(a=>a.lang && a.lang.startsWith(kieli));
  if(aani) u.voice=aani;
  else if(aanet.length) { naytaTeksti("Laitteessa ei ole englanninkielistä ääntä."); return; }
  u.onerror=()=>naytaTeksti("Ääneen lukeminen ei onnistunut.");
  s.speak(u);
}
