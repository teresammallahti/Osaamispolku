<meta charset="utf-8">
<title>Peilikuva</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">

<style>
:root{
  --paper:#EFF2F5; --surface:#FFFFFF; --surface-2:#F7F9FB;
  --grid:#DCE3EA; --line:#C9D3DC;
  --ink:#15222C; --ink-2:#4E626F; --ink-3:#7E8F9B;
  --core:#1B5A9E; --core-soft:#E4EDF6;
  --strong:#1F6E5C; --strong-soft:#E1F0EB;
  --chal:#9A6A16; --chal-soft:#F6EDDC;
  --alert:#A33A2B; --alert-soft:#F8E7E3;
  --shadow:0 1px 2px rgba(21,34,44,.06), 0 8px 24px -12px rgba(21,34,44,.18);
  --r:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0F161B; --surface:#18222A; --surface-2:#1D2830;
    --grid:#22303A; --line:#2E3E4A;
    --ink:#E8EFF4; --ink-2:#A3B4C0; --ink-3:#7A8B97;
    --core:#7FB2E4; --core-soft:#16303F;
    --strong:#77CDB4; --strong-soft:#123028;
    --chal:#E0B267; --chal-soft:#33270F;
    --alert:#E8907F; --alert-soft:#3A1E19;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -14px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --paper:#0F161B; --surface:#18222A; --surface-2:#1D2830;
  --grid:#22303A; --line:#2E3E4A;
  --ink:#E8EFF4; --ink-2:#A3B4C0; --ink-3:#7A8B97;
  --core:#7FB2E4; --core-soft:#16303F;
  --strong:#77CDB4; --strong-soft:#123028;
  --chal:#E0B267; --chal-soft:#33270F;
  --alert:#E8907F; --alert-soft:#3A1E19;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -14px rgba(0,0,0,.7);
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:16px; line-height:1.62;
  background-image:
    linear-gradient(to right, var(--grid) 1px, transparent 1px),
    linear-gradient(to bottom, var(--grid) 1px, transparent 1px);
  background-size:26px 26px;
}
.wrap{max-width:760px; margin:0 auto; padding:28px 20px 90px}
h1,h2,h3,h4{font-family:"Familjen Grotesk","IBM Plex Sans",system-ui,sans-serif; text-wrap:balance}

/* header */
header.top{background:var(--surface); border:1px solid var(--line); border-radius:var(--r);
  box-shadow:var(--shadow); padding:22px 24px; display:flex; gap:18px; align-items:flex-start}
.badge{flex:0 0 auto; width:54px; height:54px; border-radius:9px; display:grid; place-items:center;
  background:var(--core-soft); border:1px solid var(--core); color:var(--core)}
.badge svg{width:28px; height:28px; fill:none; stroke:currentColor; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round}
.eyebrow{font-family:"IBM Plex Mono",monospace; font-size:11px; letter-spacing:.14em;
  text-transform:uppercase; color:var(--ink-3); margin:0 0 5px}
header.top h1{margin:0; font-size:30px; font-weight:700; letter-spacing:-.015em}
header.top p{margin:5px 0 0; color:var(--ink-2); font-size:15px}
.tags{display:flex; flex-wrap:wrap; gap:5px; margin-top:11px}
.tag{font-family:"IBM Plex Mono",monospace; font-size:10.5px; letter-spacing:.05em; padding:2px 7px;
  border-radius:4px; background:var(--surface-2); border:1px solid var(--line); color:var(--ink-3)}
.tag.core{background:var(--core-soft); border-color:var(--core); color:var(--core)}

/* teksti */
article{margin-top:26px}
article h2{font-size:21px; font-weight:600; margin:32px 0 10px; letter-spacing:-.01em}
article p{margin:0 0 14px; max-width:64ch}
.lead{font-size:17.5px; color:var(--ink); border-left:3px solid var(--core); padding-left:16px; margin:0 0 8px}

.box{background:var(--surface); border:1px solid var(--line); border-radius:var(--r);
  padding:18px 22px; box-shadow:var(--shadow); margin:22px 0}
.box h3{margin:0 0 12px; font-size:16.5px; font-weight:600}
.box.warn{border-left:3px solid var(--alert)}
.box.note{border-left:3px solid var(--chal)}

ol.steps{margin:0; padding-left:0; list-style:none; counter-reset:s; display:grid; gap:12px}
ol.steps li{counter-increment:s; display:grid; grid-template-columns:auto 1fr; gap:13px; align-items:start}
ol.steps li::before{content:counter(s); font-family:"Familjen Grotesk",sans-serif; font-weight:700; font-size:14px;
  width:26px; height:26px; border-radius:50%; background:var(--core); color:#fff; display:grid; place-items:center; margin-top:2px}

ul.notes{margin:0; padding-left:19px}
ul.notes li{margin-bottom:7px}
ul.notes li:last-child{margin-bottom:0}

.tablewrap{overflow-x:auto}
table{border-collapse:collapse; width:100%; font-size:14.5px; min-width:460px}
th,td{text-align:left; padding:9px 13px; border-bottom:1px solid var(--line)}
th{font-family:"IBM Plex Mono",monospace; font-size:10.5px; letter-spacing:.1em; text-transform:uppercase;
  color:var(--ink-3); font-weight:400; background:var(--surface-2)}
tr:last-child td{border-bottom:0}
td b{color:var(--core); font-weight:600}
td:last-child{font-variant-numeric:tabular-nums; font-weight:600}

/* lukusuora */
.nl svg{width:100%; height:118px; display:block}
.nl .rail{stroke:var(--line); stroke-width:2}
.nl .tick{stroke:var(--line); stroke-width:1.5}
.nl .stop{fill:var(--ink-3); font-family:"IBM Plex Mono",monospace; font-size:11px}
.nl .stop.near{fill:var(--core); font-weight:600}
.nl .dot{fill:var(--chal)}
.nl .val{fill:var(--ink); font-family:"Familjen Grotesk",sans-serif; font-size:15px; font-weight:700}
.nl .halfway{stroke:var(--chal); stroke-dasharray:3 3; stroke-width:1.5}
.nl-controls{display:flex; align-items:center; gap:14px; margin-top:6px}
.nl-controls input{flex:1; accent-color:var(--core)}
.nl-out{font-family:"Familjen Grotesk",sans-serif; font-size:15px; font-weight:600; min-width:12.5em; text-align:right}

/* paikka-arvotaulu */
.box .ohje{margin:0 0 14px; font-size:14.5px; color:var(--ink-2)}
.nt-valinta{display:flex; flex-wrap:wrap; gap:7px; margin-bottom:16px}
.nt-valinta button{font:inherit; font-size:12.5px; font-family:"IBM Plex Mono",monospace; padding:5px 11px;
  border-radius:6px; border:1px solid var(--line); background:var(--surface-2); color:var(--ink-2); cursor:pointer}
.nt-valinta button[aria-pressed="true"]{background:var(--ink); color:var(--paper); border-color:var(--ink)}
.nt-valinta button:focus-visible{outline:2px solid var(--core); outline-offset:2px}
.nt-taulu{display:flex; flex-direction:column; gap:4px; align-items:flex-start; overflow-x:auto; padding-bottom:4px}
.nt-rivi{display:flex; gap:6px; align-items:center}
.nt-rivi .otsa{font-family:"IBM Plex Mono",monospace; font-size:9.5px; letter-spacing:.08em;
  text-transform:uppercase; color:var(--ink-3); width:52px; text-align:center}
.nt-ruutu{width:52px; height:52px; display:grid; place-items:center; border:1.5px solid var(--line);
  border-radius:7px; background:var(--surface-2); font-family:"IBM Plex Mono",monospace; font-size:24px}
.nt-ruutu.kohta{border-color:var(--core); background:var(--core-soft); color:var(--core); font-weight:500}
.nt-ruutu.ratkaiseva{border-color:var(--chal); background:var(--chal-soft); color:var(--chal); font-weight:500}
.nt-ruutu.nolla{color:var(--ink-3)}
.nt-rivi .nimi{font-size:12.5px; color:var(--ink-3); margin-left:12px; white-space:nowrap}
.nt-nuoli{font-size:17px; color:var(--chal); margin-left:6px}
.nt-selite{margin:14px 0 0; font-size:14.5px}
.nt-selite b{color:var(--core)}

/* vahvuusportaat */
.vp-tasot{display:grid; gap:9px; margin-bottom:18px}
.vp-taso{display:flex; gap:11px; align-items:flex-start; font-size:13.5px}
.vp-taso .vp-pallo{width:13px; height:13px; border-radius:4px; margin-top:5px; flex:0 0 auto}
.vp-taso[data-taso="sulkeet"] .vp-pallo{background:var(--core)}
.vp-taso[data-taso="kertojako"] .vp-pallo{background:var(--strong)}
.vp-taso[data-taso="yhteenvahennys"] .vp-pallo{background:var(--chal)}
.vp-taso strong{display:block; font-family:"Familjen Grotesk",sans-serif; font-weight:600; font-size:14.5px}
.vp-taso span{color:var(--ink-2)}
.vp-lauseke{display:flex; flex-wrap:wrap; gap:7px; align-items:flex-end; font-family:"IBM Plex Mono",monospace;
  font-size:25px; padding:10px 2px; min-height:64px}
.vp-lauseke .t{padding:2px 3px}
.vp-lauseke .op{position:relative; padding:2px 9px; border-radius:6px; font-weight:500}
.vp-lauseke .op[data-taso="sulkeet"]{background:var(--core-soft); color:var(--core)}
.vp-lauseke .op[data-taso="kertojako"]{background:var(--strong-soft); color:var(--strong)}
.vp-lauseke .op[data-taso="yhteenvahennys"]{background:var(--chal-soft); color:var(--chal)}
.vp-lauseke .op i{position:absolute; top:-9px; right:-6px; font-style:normal; font-family:"Familjen Grotesk",sans-serif;
  font-size:11px; font-weight:700; width:18px; height:18px; border-radius:50%; display:grid; place-items:center;
  background:currentColor}
.vp-lauseke .op i span{color:var(--surface)}
.vp-rivi{display:flex; align-items:center; gap:16px; margin-top:8px}
.vp-vastaus{font-family:"Familjen Grotesk",sans-serif; font-size:16px; font-weight:600; color:var(--strong)}

/* laskujärjestys-widget */
.lj-exp{display:flex; flex-wrap:wrap; gap:7px; align-items:center; font-family:"IBM Plex Mono",monospace;
  font-size:23px; padding:14px 4px; min-height:62px}
.lj-exp .tok{padding:2px 4px; color:var(--ink)}
.lj-exp button.op{font-family:"IBM Plex Mono",monospace; font-size:23px; padding:3px 12px; border-radius:7px;
  border:1.5px solid var(--line); background:var(--surface-2); color:var(--ink); line-height:1.2}
.lj-exp button.op:hover{border-color:var(--core); color:var(--core)}
.lj-exp button.op:focus-visible{outline:2px solid var(--core); outline-offset:2px}
.lj-exp .valmis{font-family:"Familjen Grotesk",sans-serif; font-size:23px; font-weight:700; color:var(--strong)}
.lj-fb{font-size:14.5px; min-height:1.5em; color:var(--ink-2)}
.lj-fb.no{color:var(--alert)}
.lj-fb.ok{color:var(--strong)}
.lj-row{display:flex; align-items:center; gap:14px; margin-top:10px}
.lj-step{font-family:"IBM Plex Mono",monospace; font-size:11.5px; letter-spacing:.1em;
  text-transform:uppercase; color:var(--ink-3)}

/* rivinvaihdot tekstilohkoissa: pistekuvat ja aineistorivit (17.10.2026) */
article p, article li{white-space:pre-line}
/* toiminnalliset apuvälineet (murtokuvio, jakoleikki, kestokello) */
.tw [hidden]{display:none !important}
.tw .ohje{margin:0 0 14px; font-size:14.5px; color:var(--ink-2)}
.tw-tilat{display:inline-flex; border:1px solid var(--line); border-radius:8px; overflow:hidden; margin:0 0 14px}
.tw-tilat button{font-size:13.5px; padding:7px 15px; border:0; background:var(--surface-2); color:var(--ink-2)}
.tw-tilat button + button{border-left:1px solid var(--line)}
.tw-tilat button[aria-pressed="true"]{background:var(--ink); color:var(--paper)}
.tw-tehtava{margin:0 0 14px; padding:11px 14px; border-radius:8px; background:var(--core-soft);
  border-left:3px solid var(--core); font-size:15.5px; line-height:1.55}
.tw-tehtava small{display:block; margin-top:4px; font-size:13px; color:var(--ink-2)}
.tw-ohjaus{display:flex; flex-wrap:wrap; gap:10px 20px; align-items:center; margin-bottom:12px}
.tw-ryhma{display:flex; align-items:center; gap:8px; flex-wrap:wrap}
.tw-lbl{font-family:"IBM Plex Mono",monospace; font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-3)}
.tw-valinta{font-size:13.5px; padding:6px 13px; border-radius:7px; border:1px solid var(--line);
  background:var(--surface-2); color:var(--ink-2)}
.tw-valinta[aria-pressed="true"]{background:var(--core); border-color:var(--core); color:var(--paper)}
.tw-askel{display:inline-flex; align-items:center; border:1px solid var(--line); border-radius:8px; overflow:hidden; background:var(--surface-2)}
.tw-askel button{width:42px; height:42px; border:0; background:transparent; color:var(--ink); font-size:21px; line-height:1}
.tw-askel output{min-width:2.4em; text-align:center; font-family:"Familjen Grotesk",sans-serif; font-weight:700;
  font-size:19px; font-variant-numeric:tabular-nums; border-left:1px solid var(--line); border-right:1px solid var(--line); line-height:42px}
.tw-rivi{display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-top:12px}
.tw-rivi label{font-size:14.5px; display:flex; gap:8px; align-items:center; flex-wrap:wrap}
.tw input[type=text]{font:inherit; font-family:"IBM Plex Mono",monospace; font-size:16px; width:6.5em; padding:7px 10px;
  border:1px solid var(--line); border-radius:7px; background:var(--surface-2); color:var(--ink); text-align:right}
.tw .btn{color:var(--paper)}
.tw .btn.ghost{color:var(--ink-2)}
.tw button:disabled{opacity:.42; cursor:default}
.tw button:focus-visible, .tw input:focus-visible, .tw [tabindex]:focus-visible{outline:2px solid var(--core); outline-offset:2px}
.tw-palaute{margin:12px 0 0; font-size:14.5px; line-height:1.5}
.tw-palaute:empty{display:none}
.tw-palaute.ok, .tw-palaute.no, .tw-palaute.hint{padding:10px 13px; border-radius:8px}
.tw-palaute.ok{background:var(--strong-soft); color:var(--strong)}
.tw-palaute.no{background:var(--alert-soft); color:var(--alert)}
.tw-palaute.hint{background:var(--chal-soft); color:var(--chal)}
.mf{display:inline-flex; flex-direction:column; align-items:center; vertical-align:middle; line-height:1.08;
  font-family:"Familjen Grotesk",sans-serif; font-weight:700; margin:0 2px; font-size:.95em}
.mf span:first-child{border-bottom:1.5px solid currentColor; padding:0 3px}

/* murtokuvio */
.mk-runko{display:grid; grid-template-columns:minmax(0,250px) 1fr; gap:24px; align-items:center}
.mk-kuva svg{width:100%; max-width:250px; display:block; touch-action:manipulation}
.mk-osa{fill:var(--surface-2); stroke:var(--ink-2); stroke-width:1.6; cursor:pointer; transition:fill .12s ease}
.mk-osa:hover{fill:var(--core-soft)}
.mk-osa.on{fill:var(--core)}
.mk-osa.on:hover{fill:var(--core)}
.mk-osa.lukittu{cursor:default}
.mk-osa.lukittu:hover{fill:var(--surface-2)}
.mk-osa.lukittu.on:hover{fill:var(--core)}
.mk-osa:focus-visible{outline:none; stroke:var(--chal); stroke-width:4}
.mk-luku{display:flex; align-items:center; gap:18px}
.mk-mv{display:flex; flex-direction:column; align-items:center; font-family:"Familjen Grotesk",sans-serif;
  font-weight:700; font-size:46px; line-height:1; min-width:72px}
.mk-mv .mk-os{color:var(--core)}
.mk-mv .mk-viiva{width:70px; height:4px; background:var(--ink); border-radius:2px; margin:7px 0}
.mk-mv input[type=text]{width:2.1em; font-size:30px; text-align:center; padding:4px 2px; font-family:"Familjen Grotesk",sans-serif; font-weight:700}
.mk-mv.mk-piilo{color:var(--ink-3)}
.mk-mv.mk-piilo .mk-os{color:var(--ink-3)}
.mk-sel{display:grid; gap:22px; font-size:13.5px; color:var(--ink-2); line-height:1.35}
.mk-sel b{color:var(--ink); font-size:15px}
.mk-sanoin{margin:14px 0 0; font-size:15px}
.mk-sanoin:empty{display:none}

/* jakoleikki */
.jl-jono{margin-top:4px}
.jl-pisteet{display:flex; flex-wrap:wrap; gap:5px; min-height:22px; margin:7px 0 2px}
.jl-p{width:17px; height:17px; border-radius:50%; background:var(--chal)}
.jl-tyhja{font-size:13.5px; color:var(--ink-3)}
.jl-autot{display:flex; flex-wrap:wrap; gap:10px; margin-top:14px; min-height:10px}
.jl-auto{border:1.5px solid var(--core); border-radius:10px; padding:6px 9px 9px; background:var(--core-soft)}
.jl-auto.vajaa{border-style:dashed; border-color:var(--chal); background:var(--chal-soft)}
.jl-auto .nimi{font-family:"IBM Plex Mono",monospace; font-size:10px; letter-spacing:.08em; text-transform:uppercase;
  color:var(--ink-2); display:block; margin-bottom:5px; white-space:nowrap}
.jl-paikat{display:grid; gap:4px; justify-content:start}
.jl-paikka{width:17px; height:17px; border-radius:50%; border:1.5px dashed var(--ink-3)}
.jl-paikka.on{background:var(--core); border:0}
.jl-auto.vajaa .jl-paikka.on{background:var(--chal)}
.jl-yv{margin:14px 0 0; font-size:15px}
.jl-yv:empty{display:none}
.jl-lasku{display:block; font-family:"Familjen Grotesk",sans-serif; font-weight:700; font-size:20px}
.jl-tark{display:block; font-size:13.5px; color:var(--ink-2); margin-top:2px}
.jl-tulkinnat{margin:10px 0 0; padding-left:19px; font-size:14.5px}
.jl-tulkinnat li{margin-bottom:4px}
.jl-tulkinnat b{color:var(--core)}

/* kestokello */
.kk-runko{display:grid; grid-template-columns:minmax(0,240px) 1fr; gap:24px; align-items:center}
.kk svg.kk-kello{width:100%; max-width:240px; display:block; touch-action:none; cursor:grab; user-select:none; -webkit-user-select:none}
.kk svg.kk-kello:active{cursor:grabbing}
.kk-kehys{fill:var(--surface-2); stroke:var(--ink-2); stroke-width:2}
.kk-viiva{stroke:var(--ink-3); stroke-width:1.2}
.kk-viiva.iso{stroke:var(--ink); stroke-width:2.6}
.kk-nro{fill:var(--ink); font-family:"Familjen Grotesk",sans-serif; font-weight:600; font-size:17px}
.kk-tunti{stroke:var(--ink); stroke-width:7; stroke-linecap:round}
.kk-min{stroke:var(--core); stroke-width:4.5; stroke-linecap:round}
.kk-kahva{fill:var(--core-soft); stroke:var(--core); stroke-width:2.2}
.kk-keski{fill:var(--ink)}
.kk-digi{font-family:"IBM Plex Mono",monospace; font-size:42px; font-weight:500; line-height:1.1; font-variant-numeric:tabular-nums}
.kk-digi .mm{color:var(--core); border-radius:6px; padding:0 2px; transition:background .3s ease}
.kk-digi .mm.flash{background:var(--chal-soft); color:var(--chal)}
.kk-digi small{display:block; font-family:"IBM Plex Sans",sans-serif; font-size:12.5px; color:var(--ink-3); letter-spacing:.02em}
.kk-viesti{margin:10px 0 0; min-height:2.6em; font-size:14px; color:var(--chal); line-height:1.4}
.kk-palat{display:flex; height:36px; border-radius:7px; overflow:hidden; border:1px solid var(--line);
  background:var(--surface-2); margin-top:18px}
.kk-pala{display:grid; place-items:center; font-family:"IBM Plex Mono",monospace; font-size:11.5px; color:var(--paper);
  white-space:nowrap; overflow:hidden; min-width:0}
.kk-pala.alku{background:var(--chal)}
.kk-pala.tunti{background:var(--core)}
.kk-pala.loppu{background:var(--strong)}
.kk-pala + .kk-pala{border-left:2px solid var(--surface)}
.kk-selitys{margin:9px 0 0; font-size:14px; color:var(--ink-2)}
.kk-selitys b{color:var(--ink)}
.kk-selitys span{white-space:nowrap}
.kk-yht{margin:4px 0 0; font-size:15px}
.kk-yht:empty{display:none}

@media (max-width:560px){
  .mk-runko, .kk-runko{grid-template-columns:1fr; gap:14px}
  .mk-kuva svg, .kk svg.kk-kello{margin:0 auto; max-width:230px}
  .mk-luku{justify-content:center}
  .kk-puoli{text-align:center}
  .kk-puoli .tw-rivi{justify-content:center}
}

/*VIS{*/
/* visualisoinnit (vis.css) */
figure.vis{margin:22px 0}
.vis .ohje{margin:0 0 12px; font-size:14.5px; color:var(--ink-2)}
.vis-kuva{overflow-x:auto; -webkit-overflow-scrolling:touch}
.vis-svg{display:block; max-width:100%; height:auto; margin:4px 0}
.vis-teksti{margin:10px 0 0; font-size:14px; color:var(--ink-2); white-space:pre-line}
.vis-svg .v-t{font:500 13px "IBM Plex Sans",system-ui,sans-serif; fill:var(--ink)}
.vis-svg .v-t.pieni{font-size:11.5px; fill:var(--ink-2)}
.vis-svg .v-t.vahva{font-weight:600; fill:var(--core)}
.vis-svg .v-t.kello{font-size:11px; fill:var(--ink-2)}
.vis-svg .v-t.hyppy{font-size:12.5px; fill:var(--strong); font-weight:600}

-anchor=\"middle\">A′</text><text x=\"310.0\" y=\"210.0\" class=\"v-t vahva\" text-anchor=\"middle\">B′</text><text x=\"352.0\" y=\"74.0\" class=\"v-t vahva\" text-anchor=\"start\">C′</text><text x=\"250.0\" y=\"274.0\" class=\"v-t pieni\" text-anchor=\"middle\">symmetria-akseli</text></svg>","teksti":"Jokainen peilipiste on yhtä monen ruudun päässä akselista kuin alkuperäinen piste. Piste C on 3 ruutua akselin vasemmalla puolella, joten C′ on 3 ruutua oikealla puolella."},{"tyyppi":"taulukko","otsikko":"Montako symmetria-akselia tavallisilla kuvioilla on","otsikkorivi":["Kuvio","Symmetria-akseleita","Missä akselit kulkevat"],"rivit":[["Neliö","4","Kaksi sivujen keskipisteiden kautta ja kaksi lävistäjää"],["Suorakulmio, joka ei ole neliö","2","Vain sivujen keskipisteiden kautta"],["Tasasivuinen kolmio","3","Jokaisesta kärjestä vastakkaisen sivun keskelle"],["Tasakylkinen kolmio","1","Huipusta pohjan keskipisteeseen"],["Kolmio, jonka sivut ovat eri pituiset","0","Yhtään taittoviivaa ei löydy"],["Neljäkäs, joka ei ole neliö","2","Molemmat lävistäjät"],["Säännöllinen viisikulmio","5","Jokaisesta kärjestä vastakkaisen sivun keskelle"],["Säännöllinen kuusikulmio","6","Kolme kärkien kautta ja kolme sivujen keskipisteiden kautta"]]},{"tyyppi":"kappale","otsikko":"Säännöllisessä monikulmiossa akseleita on yhtä monta kuin sivuja","sisalto":"Säännöllinen monikulmio tarkoittaa kuviota, jonka kaikki sivut ovat yhtä pitkät ja kaikki kulmat yhtä suuret. Tällaisessa kuviossa symmetria-akseleita on aina täsmälleen yhtä monta kuin sivuja. Säännöllisellä viisikulmiolla on 5 akselia, kahdeksankulmiolla 8 ja kaksitoistakulmiolla 12. Neliö noudattaa samaa sääntöä: se on säännöllinen nelikulmio, joten akseleita on 4. Sääntö pätee vain säännöllisiin kuvioihin. Heti kun sivut ovat eri pituisia, akseleita on vähemmän tai ei yhtään."},{"tyyppi":"kappale","otsikko":"Kirjaimissa on symmetriaa","sisalto":"Isot kirjaimet ovat hyvä tapa harjoitella akselien etsimistä, koska ne ovat yksinkertaisia kuvioita. Kirjaimen A voi taittaa pystysuoraa viivaa pitkin, joten sillä on 1 symmetria-akseli. Kirjaimen E akseli on vaakasuora: taitto kulkee keskiviivan yli, ja ylä- ja alaosa osuvat päällekkäin. Kirjaimet H ja I voi taittaa molempiin suuntiin, joten niillä on 2 akselia. Kirjaimilla L, N, P, S ja Z ei ole yhtään akselia. Huomaa, ettei akseli ole aina pystysuora. Se voi olla vaakasuora tai vino, ja se pitää etsiä eikä olettaa."},{"tyyppi":"ansa","otsikko":"Ansa 1: peilikuva ei saa liukua lähemmäs tai kauemmas","sisalto":"Tämä on taidon yleisin virhe. Kuvio piirretään akselin toiselle puolelle oikean näköisenä, mutta pisteitä ei lasketa ruutu ruudulta. Silloin peilikuva päätyy liian lähelle akselia tai liian kauas siitä, ja kuvio on väärässä paikassa vaikka se näyttää oikealta. Ratkaiseva ehto on, että jokainen peilipiste on täsmälleen yhtä kaukana akselista kuin sitä vastaava alkuperäinen piste. Jos kulmapiste on 3 ruutua akselista, peilipiste on 3 ruutua akselista toiselle puolelle, ei 2 eikä 4. Laske ruudut aina, älä arvaa."},{"tyyppi":"ansa","otsikko":"Ansa 2: suorakulmion lävistäjä on symmetria-akseli vain neliössä","sisalto":"Neliöllä on 4 symmetria-akselia, ja kaksi niistä ovat lävistäjiä. Siitä syntyy houkutus päätellä, että myös suorakulmiolla olisi 4 akselia. Näin ei ole. Suorakulmiolla, joka ei ole neliö, on vain 2 symmetria-akselia, ja ne kulkevat sivujen keskipisteiden kautta. Kokeile taittamista: kun suorakulmainen paperi taitetaan lävistäjän kohdalta, pitkä sivu jää törröttämään lyhyen sivun yli eivätkä puoliskot osu päällekkäin. Lävistäjä jakaa kuvion kyllä kahteen yhtä suureen osaan, mutta yhtä suuri pinta-ala ei riitä: puoliskojen pitää myös asettua toistensa päälle."},{"tyyppi":"kuva","otsikko":"Neliön ja suorakulmion akselit","svg":"<svg class=\"vis-svg\" viewBox=\"0 0 640 196\" width=\"640\" role=\"img\" aria-label=\"Neliön neljä ja suorakulmion kaksi symmetria-akselia\"><polygon class=\"v-osa v1\" points=\"60.0,30.0 180.0,30.0 180.0,150.0 60.0,150.0\"/><line class=\"v-akseli\" x1=\"120.0\" y1=\"15.0\" x2=\"120.0\" y2=\"165.0\" stroke-dasharray=\"6 4\"/><line class=\"v-akseli\" x1=\"45.0\" y1=\"90.0\" x2=\"195.0\" y2=\"90.0\" stroke-dasharray=\"6 4\"/><line class=\"v-akseli\" x1=\"48.0\" y1=\"18.0\" x2=\"192.0\" y2=\"162.0\" stroke-dasharray=\"6 4\"/><line class=\"v-akseli\" x1=\"192.0\" y1=\"18.0\" x2=\"48.0\" y2=\"162.0\" stroke-dasharray=\"6 4\"/><text x=\"120.0\" y=\"186.0\" class=\"v-t vahva\" text-anchor=\"middle\">neliö: 4 akselia</text><polygon class=\"v-osa v1\" points=\"330.0,40.0 530.0,40.0 530.0,140.0 330.0,140.0\"/><line class=\"v-akseli\" x1=\"430.0\" y1=\"25.0\" x2=\"430.0\" y2=\"155.0\" stroke-dasharray=\"6 4\"/><line class=\"v-akseli\" x1=\"315.0\" y1=\"90.0\" x2=\"545.0\" y2=\"90.0\" stroke-dasharray=\"6 4\"/><line class=\"v-hyppy\" x1=\"330.0\" y1=\"40.0\" x2=\"530.0\" y2=\"140.0\" stroke-dasharray=\"3 4\"/><text x=\"430.0\" y=\"186.0\" class=\"v-t vahva\" text-anchor=\"middle\">suorakulmio: 2 akselia</text><text x=\"545.0\" y=\"132.0\" class=\"v-t hyppy\" text-anchor=\"start\">lävistäjä ei</text><text x=\"545.0\" y=\"148.0\" class=\"v-t hyppy\" text-anchor=\"start\">ole akseli</text></svg>","teksti":"Katkoviivat ovat symmetria-akseleita. Neliön lävistäjät ovat akseleita, mutta suorakulmion lävistäjä ei ole."},{"tyyppi":"muistilappu","otsikko":"Muista nämä","kohdat":["Symmetria-akseli on viiva, jonka kohdalta kuvion voi taittaa niin, että puoliskot osuvat päällekkäin.","Peilipiste on aina yhtä kaukana akselista kuin alkuperäinen piste.","Etäisyys lasketaan kohtisuoraan akselia vasten, ruutu kerrallaan.","Säännöllisellä monikulmiolla on yhtä monta akselia kuin sivuja.","Suorakulmiolla, joka ei ole neliö, on 2 akselia, neliöllä 4. Suorakulmion lävistäjä on akseli vain, kun suorakulmio on neliö.","Akseli voi olla pysty, vaaka tai vino. Etsi se, älä oleta."]}],"harjoitusryhmat":[{"id":"akselit","nimi":"Montako symmetria-akselia","info":"Mieti, montako eri taittoviivaa kuviosta löytyy."},{"id":"kirjaimet","nimi":"Kirjainten akselit","info":"Isot kirjaimet ovat yksinkertaisia kuvioita. Akseli voi olla pysty tai vaaka."},{"id":"peilipisteet","nimi":"Peilipiste ja etäisyys","info":"Peilipiste on yhtä kaukana akselista kuin alkuperäinen piste."}],"harjoitukset":[{"id":"H01","ryhma":"akselit","kysymys":"Montako symmetria-akselia on neliöllä?","vastaus":4,"vinkki":"Neliön voi taittaa sekä keskiviivoja että lävistäjiä pitkin.","selitys":"Neliössä on kaksi akselia sivujen keskipisteiden kautta ja kaksi lävistäjää, yhteensä 4. Neliö on säännöllinen nelikulmio, ja säännöllisessä kuviossa akseleita on yhtä monta kuin sivuja."},{"id":"H02","ryhma":"akselit","kysymys":"Montako symmetria-akselia on suorakulmiolla, jonka sivut ovat 6 cm ja 3 cm?","vastaus":2,"vinkki":"Kokeile ajatuksissasi taittaa suorakulmio lävistäjän kohdalta.","selitys":"Akseleita on 2, ja ne kulkevat sivujen keskipisteiden kautta. Lävistäjä ei ole akseli, koska sivut ovat eri pituiset eivätkä puoliskot osu päällekkäin."},{"id":"H03","ryhma":"akselit","kysymys":"Montako symmetria-akselia on tasakylkisellä kolmiolla, jonka kaksi sivua ovat yhtä pitkät ja kolmas on eri pituinen?","vastaus":1,"vinkki":"Vain yksi taitto saa yhtä pitkät sivut kohdakkain.","selitys":"Akseli kulkee huipusta pohjan keskipisteeseen, joten akseleita on 1. Muita taittoviivoja ei löydy, koska pohja on eri pituinen kuin kyljet."},{"id":"H04","ryhma":"akselit","kysymys":"Montako symmetria-akselia on tasasivuisella kolmiolla?","vastaus":3,"vinkki":"Jokainen kärki kelpaa taiton lähtökohdaksi.","selitys":"Tasasivuinen kolmio on säännöllinen kolmio, joten akseleita on yhtä monta kuin sivuja eli 3. Jokainen akseli kulkee yhdestä kärjestä vastakkaisen sivun keskelle."},{"id":"H05","ryhma":"akselit","kysymys":"Montako symmetria-akselia on säännöllisellä kuusikulmiolla?","vastaus":6,"vinkki":"Säännöllisessä kuviossa akseleita on yhtä monta kuin sivuja.","selitys":"Sivuja on 6, joten akseleita on 6. Kolme akselia kulkee vastakkaisten kärkien kautta ja kolme vastakkaisten sivujen keskipisteiden kautta."},{"id":"H06","ryhma":"akselit","tyyppi":"monivalinta","kysymys":"Suorakulmion lävistäjä on jana, joka yhdistää kaksi vastakkaista kärkeä. Onko lävistäjä symmetria-akseli, kun suorakulmio ei ole neliö?","vaihtoehdot":["Ei ole, koska taitettaessa puoliskot eivät osu päällekkäin","On, koska lävistäjä jakaa kuvion kahteen yhtä suureen osaan","On, koska lävistäjä kulkee kuvion keskipisteen kautta"],"vastaus":0,"vinkki":"Taita paperisuorakulmio lävistäjän kohdalta ja katso, jääkö reunoja yli.","selitys":"Yhtä suuri pinta-ala ei riitä symmetria-akseliksi. Kun suorakulmio taitetaan lävistäjän kohdalta, pitkä sivu jää törröttämään lyhyen yli. Suorakulmiolla, joka ei ole neliö, on vain 2 symmetria-akselia."},{"id":"H07","ryhma":"akselit","kysymys":"Montako symmetria-akselia on kolmiolla, jonka sivut ovat 4 cm, 6 cm ja 7 cm?","vastaus":0,"vinkki":"Etsi taittoviivaa, joka saisi kaksi yhtä pitkää sivua päällekkäin.","selitys":"Kaikki kolme sivua ovat eri pituiset, joten mikään taitto ei saa puoliskoja kohdakkain. Symmetria-akseleita on 0."},{"id":"H08","ryhma":"kirjaimet","kysymys":"Kirjaimella A on 1 symmetria-akseli. Montako symmetria-akselia on kirjaimella H?","vastaus":2,"vinkki":"Kokeile taittaa H sekä pystysuoraa että vaakasuoraa viivaa pitkin.","selitys":"H:n voi taittaa pystyviivaa pitkin ja myös vaakaviivaa pitkin poikkiviivan kohdalta. Akseleita on siis 2, kun A:lla niitä on vain 1."},{"id":"H09","ryhma":"kirjaimet","kysymys":"Montako symmetria-akselia on kirjaimella T?","vastaus":1,"vinkki":"Mieti, kumpaan suuntaan T taittuu itsensä päälle.","selitys":"T taittuu pystysuoraa viivaa pitkin: vasen ja oikea puoli osuvat päällekkäin. Vaakasuoraa taittoa ei ole, koska yläosa ja alaosa ovat erilaiset. Akseleita on 1."},{"id":"H10","ryhma":"kirjaimet","kysymys":"Montako symmetria-akselia on kirjaimella L?","vastaus":0,"vinkki":"Kokeile molempia suuntia ja katso, jääkö yli.","selitys":"L koostuu pystyviivasta ja alareunan vaakaviivasta. Kummassakaan suunnassa puoliskot eivät osu päällekkäin, joten akseleita on 0."},{"id":"H11","ryhma":"kirjaimet","kysymys":"Montako symmetria-akselia on kirjaimella I?","vastaus":2,"vinkki":"I on kapea mutta taittuu kahteen suuntaan.","selitys":"I taittuu pystysuoraa viivaa pitkin ja myös vaakasuoraa viivaa pitkin keskeltä, koska ylä- ja alapää ovat samanlaiset. Akseleita on 2."},{"id":"H12","ryhma":"kirjaimet","tyyppi":"monivalinta","kysymys":"Millä näistä isoista kirjaimista ei ole yhtään symmetria-akselia?","vaihtoehdot":["M","U","P"],"vastaus":2,"vinkki":"Kokeile jokaista kirjainta sekä pysty- että vaakataitolla.","selitys":"M ja U taittuvat pystysuoraa viivaa pitkin, joten kummallakin on 1 akseli. P ei taitu kumpaankaan suuntaan, joten sillä on 0 akselia."},{"id":"H13","ryhma":"peilipisteet","kysymys":"Piste on 7 ruutua peiliakselin vasemmalla puolella. Kuinka monen ruudun päässä akselista sen peilikuva on?","vastaus":7,"vinkki":"Peilikuva ei liu'u lähemmäs eikä kauemmas.","selitys":"Peilipiste on aina yhtä kaukana akselista kuin alkuperäinen piste. Etäisyys on siis 7 ruutua, mutta akselin oikealla puolella."},{"id":"H14","ryhma":"peilipisteet","kysymys":"Kuvion kulmapiste on 5 ruudun päässä peiliakselista. Kuinka monta ruutua on kulmapisteen ja sen peilikuvan välillä?","vastaus":10,"vinkki":"Molemmat pisteet ovat omalla puolellaan yhtä kaukana akselista.","selitys":"Alkuperäinen piste on 5 ruutua akselista ja peilipiste toiset 5 ruutua toiselle puolelle. Väliin jää 5 + 5 eli 10 ruutua."},{"id":"H15","ryhma":"peilipisteet","kysymys":"Piste on 3 ruutua pystysuoran peiliakselin oikealla puolella ja 5 ruutua paperin alareunasta ylöspäin. Kuinka monen ruudun päässä akselista sen peilikuva on?","vastaus":3,"vinkki":"Peilikuva syntyy akselin toiselle puolelle. Kumpi luvuista kertoo etäisyyden akselista?","selitys":"Piste on 3 ruutua akselin oikealla puolella, joten peilikuva on 3 ruutua akselin vasemmalla puolella. Etäisyys akselista on 3. Luku 5 kertoo korkeuden, ei etäisyyttä akselista."},{"id":"H16","ryhma":"peilipisteet","kysymys":"Piste on 3 ruutua pystysuoran peiliakselin oikealla puolella ja 5 ruutua paperin alareunasta ylöspäin. Kuinka monen ruudun päässä paperin alareunasta sen peilikuva on?","vastaus":5,"vinkki":"Pystysuora akseli siirtää pistettä vain vaakasuunnassa.","selitys":"Peilaus pystysuoran akselin suhteen siirtää pistettä vain vaakasuunnassa. Korkeus alareunasta pysyy samana eli 5 ruutua."},{"id":"H17","ryhma":"peilipisteet","kysymys":"Piste A on 2 ruutua pystysuoran peiliakselin vasemmalla puolella. Piste B on samalla vaakarivillä 6 ruutua akselin oikealla puolella. Montako ruutua on pisteen A peilikuvan ja pisteen B välillä?","vastaus":4,"vinkki":"Etsi ensin, kuinka monen ruudun päässä akselista pisteen A peilikuva on ja kummalla puolella.","selitys":"Pisteen A peilikuva on 2 ruutua akselin oikealla puolella. Piste B on 6 ruutua oikealla samalla rivillä, joten väliin jää 6 − 2 = 4 ruutua."},{"id":"H18","ryhma":"peilipisteet","kysymys":"Piste on 7 ruutua vaakasuoran peiliakselin alapuolella. Peilikuva on piirretty 5 ruutua akselin yläpuolelle. Montako ruutua peilikuvaa pitää siirtää, jotta se on oikeassa paikassa?","vastaus":2,"vinkki":"Peilikuvan pitää olla yhtä kaukana akselista kuin alkuperäinen piste.","selitys":"Oikea paikka on 7 ruutua akselin yläpuolella. Peilikuva on 5 ruudun päässä, joten sitä pitää siirtää 7 − 5 = 2 ruutua akselista poispäin."},{"id":"H19","ryhma":"peilipisteet","kysymys":"Piste on 6 ruutua peiliakselin yläpuolella, ja peiliakseli on vaakasuora. Kuinka monen ruudun päässä akselista peilikuva on?","vastaus":6,"vinkki":"Sama sääntö pätee myös vaakasuoraan akseliin.","selitys":"Etäisyys akselista säilyy aina, olipa akseli pysty tai vaaka. Peilikuva on 6 ruudun päässä akselista, mutta sen alapuolella."},{"id":"H20","ryhma":"peilipisteet","tyyppi":"monivalinta","kysymys":"Peilaat kolmion pystysuoran akselin suhteen. Mitä tapahtuu kulmapisteen etäisyydelle akselista?","vaihtoehdot":["Se puolittuu","Se pysyy täsmälleen samana","Se kaksinkertaistuu"],"vastaus":1,"vinkki":"Muistele peilin edessä seisomista.","selitys":"Peilaus säilyttää etäisyyden akselista. Kaksinkertaiseksi kasvaa vain pisteen ja sen peilikuvan välinen matka, ei kummankaan etäisyys akselista."}],"valmis_teksti":"Osaat etsiä kuvion symmetria-akselit ja tiedät, että säännöllisellä monikulmiolla niitä on yhtä monta kuin sivuja. Osaat myös piirtää kuvion peilikuvan akselin suhteen niin, että jokainen peilipiste on yhtä kaukana akselista kuin alkuperäinen piste. Tiedät, että suorakulmion lävistäjä on symmetria-akseli vain silloin, kun suorakulmio on neliö. Tämä taito on nyt näytetty."};

/* ---------- visualisoinnit: ruutulasku ja kuvat (vis.js) ----------
   Tietopohjaiset havainnollistukset oppilaan sivulle. Kaikki funktiot ovat
   funktiomäärittelyjä, jotta niitä voi kutsua tekstin piirrossa ennen tätä kohtaa.
   Lohkotyypit: ruutulasku, palikat, kymppikehys, ruudukko, lukusuorakuva, murtokuva,
   kello, koordinaatisto, pylvaat, kuva. */

function visEsc(s){ return String(s == null ? "" : s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function visNum(x){
  var s = (Math.round(x*1e6)/1e6).toString(), neg = s[0] === "-"; if (neg) s = s.slice(1);
  var o = s.split("."), k = o[0];
  if (k.length > 3) k = k.replace(/\B(?=(\d{3})+(?!\d))/g, "\u00a0");
  return (neg ? "−" : "") + k + (o[1] ? "," + o[1] : "");
}
function visKuva(o, sisalto){
  return '<figure class="box vis">' + (o.otsikko ? '<h3>'+visEsc(o.otsikko)+'</h3>' : '') +
    '<div class="vis-kuva">' + sisalto + '</div>' +
    (o.teksti ? '<figcaption class="vis-teksti">'+o.teksti+'</figcaption>' : '') + '</figure>';
}
/* Vapaan SVG:n juureen lisätään luokka vis-svg (tyylit, tumma tila) ja leveys viewBoxista. */
function visSvgLuokka(svg){
  return svg.replace(/<svg\b([^>]*)>/, function(m, attr){
    if (/class\s*=\s*"/.test(attr)){ if (!/vis-svg/.test(attr)) attr = attr.replace(/class\s*=\s*"/, 'class="vis-svg '); }
    else attr = ' class="vis-svg"' + attr;
    if (!/\swidth\s*=/.test(attr)){ var vb = attr.match(/viewBox\s*=\s*"([-\d.\s,]+)"/); if (vb){ var w = vb[1].trim().split(/[\s,]+/)[2]; if (w) attr += ' width="' + w + '"'; } }
    return '<svg' + attr + '>';
  });
}
function visHtml(o){
  try {
    switch(o.tyyppi){
      case "ruutulasku": return visRuutulasku(o);
      case "palikat": return visKuva(o, visPalikat(o));
      case "kymppikehys": return visKuva(o, visKymppikehys(o));
      case "ruudukko": return visKuva(o, visRuudukko(o));
      case "lukusuorakuva": return visKuva(o, visLukusuora(o));
      case "murtokuva": return visKuva(o, visMurto(o));
      case "kello": return visKuva(o, visKellot(o));
      case "koordinaatisto": return visKuva(o, visKoord(o));
      case "pylvaat": return visKuva(o, visPylvaat(o));
      case "kuva": return visKuva(o, visSvgLuokka(o.svg || ""));
    }
  } catch(e){ console.error("visualisointi", o, e); return ""; }
  return "";
}

/* ===== ruutulasku: allekkainlasku ruutupaperilla, vaihe vaiheelta ===== */
var VIS_RL = [];
var VIS_PAIKKA = {"-3":"Tuhannesosat","-2":"Sadasosat","-1":"Kymmenesosat","0":"Ykköset","1":"Kymmenet","2":"Sadat","3":"Tuhannet","4":"Kymmenettuhannet","5":"Sadattuhannet"};

var VIS_LYH = {"-3":"t","-2":"s","-1":"k","0":"Y","1":"K","2":"S","3":"T","4":"KT","5":"ST"};

function visLuku(s){
  s = String(s).replace(/\s/g,"").replace("−","-");
  var neg = s[0] === "-"; if (neg) s = s.slice(1);
  var osat = s.split(/[,.]/), ko = osat[0] || "0", de = osat[1] || "";
  var d = {}; // paikka -> numero
  for (var i = 0; i < ko.length; i++) d[ko.length-1-i] = +ko[i];
  for (var j = 0; j < de.length; j++) d[-(j+1)] = +de[j];
  return {d: d, max: ko.length-1, min: -de.length, des: de.length, arvo: parseFloat((neg?"-":"")+ko+"."+(de||"0")), teksti: s};
}
function visJasenna(lasku){
  var s = String(lasku).replace(/\*/g,"×").replace(/·/g,"×").replace(/÷/g,":").replace(/−/g,"-");
  var op = /×/.test(s) ? "×" : /:/.test(s) ? ":" : /\+/.test(s) ? "+" : "-";
  var osat = s.split(op === "-" ? /-(?=\s*\d)/ : op).map(function(x){ return x.trim(); }).filter(Boolean);
  return {op: op, luvut: osat};
}
/* Tila: rivit[r] = {p -> {ch, cl}}, viivat: rivin alla viiva, merkki: rivin vasen merkki */
function visRL(o){
  var j = visJasenna(o.lasku);
  if (j.op === "+") return visRLplus(j.luvut);
  if (j.op === "-") return visRLmiinus(j.luvut);
  if (j.op === "×") return visRLkerto(j.luvut);
  return visRLjako(j.luvut, o);
}
function visUusi(){ return {rivit: [], vaiheet: [], viivat: {}, merkit: {}, otsake: true, pilkku: 0}; }
function visKirj(v, r, p, ch, cl){ return {r: r, p: p, ch: String(ch), cl: cl || ""}; }

function visRLplus(luvut){
  var L = luvut.map(visLuku), T = visUusi();
  var maxP = Math.max.apply(null, L.map(function(x){return x.max;})), minP = Math.min.apply(null, L.map(function(x){return x.min;}));
  T.pilkku = -minP; var rM = 0, r0 = 1; // rivi 0 muistinumerot
  var alku = [];
  L.forEach(function(x, i){ for (var p = x.max; p >= x.min; p--) alku.push(visKirj(T, r0+i, p, x.d[p])); });
  // nollat desimaaliosan täytteeksi
  L.forEach(function(x, i){ for (var p = x.min-1; p >= minP; p--) alku.push(visKirj(T, r0+i, p, 0, "taytto")); });
  var rS = r0 + L.length; T.viivat[rS-1] = true; T.merkit[rS-1] = "+";
  T.vaiheet.push({kirj: alku, teksti: "Kirjoita luvut allekkain niin, että ykköset ovat ykkösten alla" + (minP < 0 ? " ja pilkku pilkun alla. Tyhjät desimaalipaikat voi täyttää nollilla." : ".") + " Vedä viiva. Aloita oikealta."});
  var muisti = 0;
  for (var p = minP; p <= maxP || muisti; p++){
    var nums = L.map(function(x){ return x.d[p] || 0; }), s = nums.reduce(function(a,b){return a+b;},0) + muisti;
    var lauseke = nums.join(" + ") + (muisti ? " + " + muisti : "");
    var kirj = [], nimi = VIS_PAIKKA[p] || "Seuraava sarake", t;
    if (p > maxP){ kirj.push(visKirj(T, rS, p, muisti)); t = "Muistinumero " + muisti + " kirjoitetaan sellaisenaan viivan alle " + (VIS_PAIKKA_GEN[p]||"") + " kohdalle."; muisti = 0; }
    else {
      kirj.push(visKirj(T, rS, p, s % 10));
      t = nimi + ": " + lauseke + " = " + s + ". ";
      if (s >= 10){ kirj.push(visKirj(T, rM, p+1, Math.floor(s/10), "muisti")); t += "Kirjoita " + (s%10) + " ja muistinumero " + Math.floor(s/10) + " " + (VIS_PAIKKA_GEN[p+1]||"seuraavan sarakkeen") + " päälle."; }
      else t += "Kirjoita " + s + ".";
      muisti = Math.floor(s/10);

    T.vaiheet.push({kirj: kirj, teksti: t});
  }
  T.vaiheet.push({kirj: [], teksti: "Valmis: " + L.map(function(x){return visNum(x.arvo);}).join(" + ") + " = " + visNum(L.reduce(function(a,x){return a+x.arvo;},0)) + ".", loppu: true});
  T.rivejä = rS + 1; return T;
}

function visRLmiinus(luvut){
  var A = visLuku(luvut[0]), B = visLuku(luvut[1]), T = visUusi();
  var minP = Math.min(A.min, B.min), maxP = Math.max(A.max, B.max);
  T.pilkku = -minP; var rL = 0, rA = 1, rB = 2, rE = 3;

  for (var q = B.max; q >= minP; q--) alku.push(visKirj(T, rB, q, B.d[q] != null ? B.d[q] : 0, B.d[q] != null ? "" : "taytto"));

  var cur = {}; for (var k = minP; k <= A.max; k++) cur[k] = A.d[k] || 0;

      t += "Lainaa yksi " + ({1:"kymmenen",2:"sata",3:"tuhat",0:"ykkönen","-1":"kymmenesosa"}[q2] || "") + ": " + (VIS_PAIKKA[q2]||"").toLowerCase() + " " + (cur[q2]+1) + " → " + cur[q2] + ". ";
      for (var m = q2 - 1; m > p2; m--){ kirj.push(visKirj(T, rA, m, "", "yli")); cur[m] = 9; kirj.push(visKirj(T, rL, m, 9, "laina")); }
      if (q2 - 1 > p2) t += "Välissä olevat nollat muuttuvat ensin kymmeneksi ja niistä lainataan edelleen, joten niiden tilalle tulee 9. ";
      kirj.push(visKirj(T, rA, p2, "", "yli")); cur[p2] += 10; kirj.push(visKirj(T, rL, p2, cur[p2], "laina"));
      t += nimi + " on nyt " + cur[p2] + ": " + cur[p2] + " − " + b + " = " + (cur[p2]-b) + ".";
    } else {

    }

  }

  T.rivejä = rE + 1; return T;
}

function visRLkerto(luvut){
  var A = visLuku(luvut[0]), B = visLuku(luvut[1]), T = visUusi();
  var des = A.des + B.des; // tuloksen desimaalit
  var a = A.teksti.replace(",","").replace(/^0+(?=\d)/,""), bb = B.teksti.replace(",","").replace(/^0+(?=\d)/,"");

      var tulo = m * aD[i] + muisti, kirj = [], viim = (i === aD.length - 1);
      var t = m + " × " + aD[i] + " = " + (m*aD[i]) + (muisti ? ", ja muistinumero " + muisti + ": " + (m*aD[i]) + " + " + muisti + " = " + tulo : "") + ". ";
      kirj.push(visKirj(T, rP(j), i + k, tulo % 10));

        muisti = 0;
      } else {
        if (tulo >= 10){ kirj.push(visKirj(T, rMu(j), i + 1, Math.floor(tulo/10), "muisti")); t += "Kirjoita " + (tulo%10) + " ja muistinumero " + Math.floor(tulo/10) + " seuraavan numeron päälle."; }
        else t += "Kirjoita " + tulo + ".";
        muisti = Math.floor(tulo/10);
      }
      T.vaiheet.push({kirj: kirj, teksti: (n > 1 ? (j+1) + ". rivi: " : "") + t});
    }
    osat.push(parseInt(a,10) * m * Math.pow(10,k));
  });
  var tulos = parseInt(a,10) * parseInt(bb,10);
  if (n > 1){
    T.viivat[rP(n-1)] = true; T.merkit[rP(n-1)] = "+";
    var ts = String(tulos).split("").reverse().map(Number), mu = 0;
    var osaD = osat.map(function(x){ return String(x).split("").reverse().map(Number); });
    T.vaiheet.push({kirj: [], teksti: "Laske välitulokset yhteen allekkain: " + osat.join(" + ") + ". Aloita ykkösistä."});
    for (var p = 0; p < ts.length; p++){
      var nums = osaD.map(function(d){ return d[p] || 0; }), s2 = nums.reduce(function(x,y){return x+y;},0) + mu, kirj2 = [];
      var t2 = (VIS_PAIKKA[p]||"Sarake") + ": " + nums.join(" + ") + (mu ? " + " + mu : "") + " = " + s2 + ". ";
      kirj2.push(visKirj(T, rT, p, s2 % 10));
      if (s2 >= 10){ kirj2.push(visKirj(T, rSM, p+1, Math.floor(s2/10), "muisti")); t2 += "Kirjoita " + (s2%10) + " ja muistinumero " + Math.floor(s2/10) + " seuraavan sarakkeen päälle."; }
      else t2 += "Kirjoita " + s2 + ".";

  var loppu = "Valmis: " + visNum(A.arvo) + " × " + visNum(B.arvo) + " = " + visNum(Math.round(A.arvo*B.arvo*1e6)/1e6) + ".";
  if (des) loppu = "Tuloon tulee yhtä monta desimaalia kuin tekijöissä yhteensä: " + A.des + " + " + B.des + " = " + des + ". Pilkun oikealle puolelle tulee " + des + (des === 1 ? " numero. " : " numeroa. ") + loppu;
  if (n > 1) loppu += " Tarkista arviolla, että vastaus on oikeaa suuruusluokkaa.";

  var tulosPit = String(tulos).length, nollat = [];
  for (var zp = tulosPit; zp <= des; zp++) nollat.push(visKirj(T, rT, zp, 0, "nolla"));
  if (nollat.length) loppu = "Tulossa on vähemmän numeroita kuin desimaaleja, joten eteen kirjoitetaan nollia. " + loppu;
  T.vaiheet.push({kirj: nollat, teksti: loppu, loppu: true, pilkut: true});
  T.otsake = !des;
  return T;
}

function visRLjako(luvut, o){
  // Jakokulma: jakaja vasemmalla, osamäärä kulman päällä. Jaettavassa voi olla desimaaleja,
  // ja o.desimaalit = n jatkaa laskua lisäämällä jaettavan perään nollia, kunnes osamäärässä on n desimaalia
  // (tai jako menee tasan). Sarake p = jaettavan numeron järjestysnumero vasemmalta.
  o = o || {};
  var jt = String(luvut[0]).replace(/\s/g,""), jakaja = parseInt(String(luvut[1]).replace(/\s/g,""),10);
  var osat = jt.split(/[,.]/), ko = osat[0], de = osat[1] || "";
  var c = ko.length, D = (ko + de).split("").map(Number), alkuL = D.length;
  var tavoite = o.desimaalit != null ? +o.desimaalit : 0, laske = tavoite ? tavoite + 1 : 0; // yksi ylimääräinen pyöristystä varten
  var T = visUusi(); T.otsake = false;
  var alku = D.map(function(d, i){ return {r: 1, p: i, ch: String(d), cl: ""}; });
  T.vaiheet.push({kirj: alku, teksti: "Kirjoita jaettava " + visNum(parseFloat(ko + "." + (de||"0"))) + " kulman sisään ja jakaja " + jakaja +
    " kulman vasemmalle puolelle. Osamäärä kirjoitetaan kulman päälle, kunkin numeron sen jaettavan numeron kohdalle, jota juuri jaetaan. Aloita vasemmalta, suurimmasta paikasta." +
    (de ? " Pilkku kirjoitetaan osamäärään samaan kohtaan kuin jaettavassa." : "")});
  var jaannos = 0, r = 1, aloitettu = false, q0 = [], lisatty = 0, i = 0;
  while (true){
    if (i >= D.length){
      if (jaannos === 0 || (D.length - c) >= Math.max(laske, de.length) ) break;
      // lisää nolla jaettavan perään
      D.push(0); lisatty++;
      var lk = [{r: 1, p: i, ch: "0", cl: "nolla"}];
      if (r > 1) lk.push({r: r, p: i, ch: "0", cl: "pudotus"});
      T.vaiheet.push({kirj: lk, teksti: "Jako ei mennyt vielä tasan. " + (D.length - 1 === c && !de ? "Lisää jaettavaan pilkku ja sen perään nolla" : "Lisää jaettavan perään nolla") +
        " (luvun arvo ei muutu) ja pudota se alas. Nyt jaettavana on " + (jaannos*10) + "."});
      i = D.length - 1;
      var luku0 = jaannos * 10, qx = Math.floor(luku0 / jakaja);
      i = D.length - 1; // käsitellään tämä numero alla
    }
    var luku = jaannos * 10 + D[i], q = Math.floor(luku / jakaja);
    if (!aloitettu && q === 0 && i < c - 1){
      jaannos = luku;
      T.vaiheet.push({kirj: [{r: 1, p: i, ch: String(D[i]), cl: ""}], teksti: luku + " ei riitä, koska " + jakaja + " ei mene siihen kertaakaan. Otetaan mukaan seuraava numero."});
      i++; continue;
    }
    var kirj = [{r: 0, p: i, ch: String(q), cl: "osam"}], t;
    q0[i] = q;
    if (q === 0){
      t = "Montako kertaa " + jakaja + " menee lukuun " + luku + "? Ei kertaakaan. Kirjoita 0 kulman päälle" + (i === c - 1 && !aloitettu ? " ykkösten kohdalle." : ".");
      T.vaiheet.push({kirj: kirj, teksti: t});
      jaannos = luku; aloitettu = true;
      if (i + 1 < D.length){
        if (r > 1){ T.vaiheet.push({kirj: [{r: r, p: i + 1, ch: String(D[i+1]), cl: "pudotus"}], teksti: "Pudota seuraava numero " + D[i+1] + " alas. Nyt jaettavana on " + (luku*10 + D[i+1]) + "."}); }
      }
      i++; continue;
    }
    var tulo = q * jakaja, erotus = luku - tulo, ts = String(tulo), es = String(erotus);
    t = "Montako kertaa " + jakaja + " menee lukuun " + luku + "? " + q + " kertaa. Kirjoita " + q + " kulman päälle. " +
      q + " × " + jakaja + " = " + tulo + ". Kirjoita se alle ja vähennä: " + luku + " − " + tulo + " = " + erotus + ".";
    var rT = r + 1;
    for (var a2 = 0; a2 < ts.length; a2++) kirj.push({r: rT, p: i - ts.length + 1 + a2, ch: ts[a2], cl: "tulo"});
    T.viivat[rT] = true;
    for (var b2 = 0; b2 < es.length; b2++) kirj.push({r: rT + 1, p: i - es.length + 1 + b2, ch: es[b2], cl: "erotus"});
    T.vaiheet.push({kirj: kirj, teksti: t});
    aloitettu = true; jaannos = erotus; r = rT + 1;
    if (i + 1 < D.length){
      T.vaiheet.push({kirj: [{r: r, p: i + 1, ch: String(D[i+1]), cl: "pudotus"}], teksti: "Pudota seuraava numero " + D[i+1] + " alas jäännöksen viereen. Nyt jaettavana on " + (erotus*10 + D[i+1]) + "."});
    }
    i++;
  }
  var dess = D.length - c;
  T.jako = {L: D.length, jakaja: String(jakaja), pilkku: dess > 0 ? c - 1 : null};
  var arvo = parseFloat(ko + "." + (de||"0")), osam = 0;
  for (var k = 0; k < D.length; k++) osam = osam*10 + (q0[k] || 0);
  osam = osam / Math.pow(10, dess);
  var jj = Math.round((arvo - osam*jakaja)*1e6)/1e6;
  var loppu = "Valmis: " + visNum(arvo) + " : " + jakaja + " = " + visNum(osam);
  if (jj > 1e-9 && !dess) loppu += ", ja jakojäännös on " + visNum(jj) + ". Tarkista: " + visNum(osam) + " × " + jakaja + " + " + visNum(jj) + " = " + visNum(arvo) + ".";
  else if (jj > 1e-9 && tavoite && dess > tavoite){
    var pyor = Math.round(osam * Math.pow(10, tavoite)) / Math.pow(10, tavoite);
    loppu = "Jako ei mene tasan. Laskettiin yksi desimaali enemmän kuin tarvitaan (" + visNum(osam) + ") ja pyöristettiin " +
      (tavoite === 1 ? "yhden desimaalin" : tavoite + " desimaalin") + " tarkkuuteen: " + visNum(arvo) + " : " + jakaja + " ≈ " + visNum(pyor) + ".";
  }
  else if (jj > 1e-9) loppu = "Lasku pysäytetään " + dess + " desimaaliin. " + loppu.replace(" = ", " ≈ ") + ".";
  else loppu += ". Tarkista kertomalla: " + visNum(osam) + " × " + jakaja + " = " + visNum(arvo) + ".";
  T.vaiheet.push({kirj: [], teksti: loppu, loppu: true});
  T.rivejä = r + 2; return T;
}

function visRLtila(T, vaihe){
  var cells = {};
  for (var s = 0; s <= vaihe; s++){
    T.vaiheet[s].kirj.forEach(function(w){
      var key = w.r + "|" + w.p;
      if (w.ch === null){ if (cells[key]) cells[key].cl = (cells[key].cl + " " + w.cl).trim(); return; }
      if (w.ch === "" ){ if (cells[key]) cells[key].cl = (cells[key].cl.replace(/\bnyt\b/,"") + " " + w.cl).trim(); return; }
      cells[key] = {ch: w.ch, cl: w.cl};
    });
  }
  var nyt = {}; T.vaiheet[vaihe].kirj.forEach(function(w){ nyt[w.r + "|" + w.p] = true; });
  return {cells: cells, nyt: nyt};
}
function visRLpiirra(id){
  var R = VIS_RL[id], T = R.T, tila = visRLtila(T, R.vaihe), html = "";
  if (T.jako){
    var L = T.jako.L, jw = T.jako.jakaja.length, cols = jw + L;
    html += '<div class="rl-ruudut" style="grid-template-columns:repeat('+cols+',var(--rl))">';
    for (var r = 0; r < T.rivejä; r++){
      // viivan ulottuvuus: vähennettävän tulon ja sen alle tulevan erotuksen sarakkeet
      var vA = 99, vL = -1;
      if (T.viivat[r]) for (var q = 0; q < L; q++){
        var kk = tila.cells[r+"|"+q], ke = tila.cells[(r+1)+"|"+q];
        if (kk || (ke && ke.cl.indexOf("pudotus") < 0)){ vA = Math.min(vA, q); vL = Math.max(vL, q); }
      }
      for (var c = 0; c < cols; c++){
        var cl = "rl-r", ch = "";
        if (r === 1 && c < jw){ ch = T.jako.jakaja[c]; cl += " jakaja"; if (c === jw - 1) cl += " kulma-v"; }
        var p = c - jw;
        if (p >= 0){
          var k = tila.cells[r+"|"+p];
          if (k){ ch = k.ch; cl += " " + k.cl; if (tila.nyt[r+"|"+p]) cl += " nyt"; }
          if (r === 1) cl += " kulma-y";
          if (T.viivat[r] && p >= vA && p <= vL) cl += " viiva";
          if (T.jako.pilkku != null && p === T.jako.pilkku && (r === 1 || (r === 0 && k))) cl += " pilkku";
        }
        html += '<span class="'+cl+'">'+visEsc(ch)+'</span>';
      }
    }
    html += '</div>';
  } else {
    var ps = []; Object.keys(tila.cells).forEach(function(k){ ps.push(+k.split("|")[1]); });
    T.vaiheet[T.vaiheet.length-1] && T.vaiheet.forEach(function(v){ v.kirj.forEach(function(w){ ps.push(w.p); }); });
    var maxP = Math.max.apply(null, ps.concat([0])), minP = Math.min.apply(null, ps.concat([0]));
    var cols = maxP - minP + 2; // +1 merkkisarake
    html += '<div class="rl-ruudut" style="grid-template-columns:repeat('+cols+',var(--rl))">';
    if (T.otsake && minP === 0){
      html += '<span class="rl-r ots"></span>';
      for (var p0 = maxP; p0 >= minP; p0--) html += '<span class="rl-r ots pv'+((p0%3+3)%3)+'">'+(VIS_LYH[p0]||"")+'</span>';
    }
    var kaytetyt = {}; T.vaiheet.forEach(function(v){ v.kirj.forEach(function(w){ if (w.ch !== null) kaytetyt[w.r] = true; }); });
    for (var r2 = 0; r2 < T.rivejä; r2++){
      if (!kaytetyt[r2]) continue;
      var merkki = T.merkit[r2] || "";
      html += '<span class="rl-r merkki'+(T.viivat[r2] ? " viiva" : "")+'">'+merkki+'</span>';
      for (var p1 = maxP; p1 >= minP; p1--){
        var key = r2+"|"+p1, k2 = tila.cells[key], cl2 = "rl-r pv"+((p1%3+3)%3);
        if (T.viivat[r2]) cl2 += " viiva";
        var ch2 = "";
        if (k2){ ch2 = k2.ch; cl2 += " " + k2.cl; if (tila.nyt[key]) cl2 += " nyt"; }
        // pilkku: yhteen- ja vähennyslaskussa kaikilla luku-riveillä, kertolaskussa rivikohtaisesti
        var pk = T.pilkkuRivit ? T.pilkkuRivit[r2] : T.pilkku;
        var nayta = T.pilkkuRivit ? (T.pilkkuRivit[r2] && (r2 !== T.rivejä-1 || T.vaiheet[R.vaihe].pilkut)) : (pk && k2 && !/muisti|laina/.test(k2.cl));
        if (nayta && p1 === (T.pilkkuRivit ? pk : 0) && k2) cl2 += " pilkku";
        html += '<span class="'+cl2+'">'+visEsc(ch2)+'</span>';
      }
    }
    html += '</div>';
  }
  document.getElementById("rlPaperi"+id).innerHTML = html;
  var sel = document.getElementById("rlSel"+id);
  if (sel) sel.textContent = T.vaiheet[R.vaihe].teksti;
  var lask = document.getElementById("rlLask"+id);
  if (lask) lask.textContent = "Vaihe " + (R.vaihe+1) + " / " + T.vaiheet.length;
  document.querySelectorAll('[data-rl="'+id+'"]').forEach(function(b){
    if (b.dataset.suunta === "-1") b.disabled = R.vaihe === 0;
    if (b.dataset.suunta === "1") b.disabled = R.vaihe === T.vaiheet.length - 1;
  });
}

/* ===== staattiset kuvat (SVG) ===== */
function visSvg(w, h, sis, nimi){ return '<svg class="vis-svg" viewBox="0 0 '+w+' '+h+'" width="'+w+'" role="img" aria-label="'+visEsc(nimi||"kuva")+'">'+sis+'</svg>'; }
function visT(x, y, s, cl, anchor){ return '<text x="'+x+'" y="'+y+'" class="'+(cl||"v-t")+'" text-anchor="'+(anchor||"middle")+'">'+visEsc(s)+'</text>'; }

function visPalikat(o){
  var s = o.sadat, k = o.kymmenet, y = o.ykkoset;
  if (o.luku != null){ var n = +o.luku; s = Math.floor(n/100); k = Math.floor(n/10)%10; y = n%10; if (n >= 1000) s = Math.floor(n/100); }
  s = s||0; k = k||0; y = y||0;
  var u = 13, g = "", x = 6, korkeus = 10*u + 34;
  for (var i = 0; i < s; i++){
    g += '<g class="v-sata">';
    for (var a = 0; a < 10; a++) for (var b = 0; b < 10; b++) g += '<rect x="'+(x+a*u)+'" y="'+(6+b*u)+'" width="'+u+'" height="'+u+'"/>';
    g += '</g>'; x += 10*u + 10;
  }
  if (s) x += 6;
  for (var j = 0; j < k; j++){
    g += '<g class="v-kymppi">';
    for (var c = 0; c < 10; c++) g += '<rect x="'+x+'" y="'+(6+c*u)+'" width="'+u+'" height="'+u+'"/>';
    g += '</g>'; x += u + 6;
  }
  if (k) x += 8;
  for (var m = 0; m < y; m++){ var rx = x + (m%5)*(u+4), ry = 6 + 10*u - u - Math.floor(m/5)*(u+4); g += '<rect class="v-ykkonen" x="'+rx+'" y="'+ry+'" width="'+u+'" height="'+u+'"/>'; }
  if (y) x += 5*(u+4);
  var ala = 10*u + 26;
  var tekstit = [];
  if (s) tekstit.push(s + (s === 1 ? " sata" : " sataa"));
  if (k) tekstit.push(k + (k === 1 ? " kymppi" : " kymppiä"));
  if (y) tekstit.push(y + (y === 1 ? " ykkönen" : " ykköstä"));
  g += visT(6, ala, tekstit.join(" · "), "v-t pieni", "start");
  return visSvg(Math.max(x, 200), korkeus, g, (o.luku != null ? o.luku : "") + " palikoina");
}

function visKymppikehys(o){
  var k = o.kehykset || [o.maara || 0], pois = o.pois || [], g = "", u = 26, x = 4;
  k.forEach(function(n, i){
    g += '<rect class="v-kehys" x="'+x+'" y="4" width="'+(5*u)+'" height="'+(2*u)+'" rx="3"/>';
    for (var c = 0; c < 10; c++){
      var cx = x + (c%5)*u + u/2, cy = 4 + Math.floor(c/5)*u + u/2;
      g += '<line class="v-apu" x1="'+(x+(c%5)*u)+'" y1="4" x2="'+(x+(c%5)*u)+'" y2="'+(4+2*u)+'"/>';
      if (c < n){
        var poistettu = pois[i] && c >= n - pois[i];
        g += '<circle class="'+(poistettu ? "v-piste pois" : "v-piste")+'" cx="'+cx+'" cy="'+cy+'" r="9"/>';
        if (poistettu) g += '<path class="v-rasti" d="M'+(cx-8)+' '+(cy-8)+'L'+(cx+8)+' '+(cy+8)+'M'+(cx+8)+' '+(cy-8)+'L'+(cx-8)+' '+(cy+8)+'"/>';
      } else g += '<circle class="v-tyhja" cx="'+cx+'" cy="'+cy+'" r="9"/>';
    }
    g += '<line class="v-apu" x1="'+x+'" y1="'+(4+u)+'" x2="'+(x+5*u)+'" y2="'+(4+u)+'"/>';
    x += 5*u + 16;
  });
  return visSvg(x, 2*u + 10, g, "kymppikehys");
}

function visRuudukko(o){
  var R = o.rivit || 10, S = o.sarakkeet || 10, u = o.koko || (S > 12 ? 16 : 22), g = "";
  var alueet = o.alueet || [{maara: o.varitetty || 0, vari: 1}];
  var vari = []; var kohta = 0;
  alueet.forEach(function(a){ for (var i = 0; i < a.maara; i++) vari[kohta++] = a.vari || 1; });
  for (var r = 0; r < R; r++) for (var c = 0; c < S; c++){
    var i2 = o.sarakkeittain ? c*R + r : r*S + c;
    g += '<rect class="v-ruutu'+(vari[i2] ? " v"+vari[i2] : "")+'" x="'+(2+c*u)+'" y="'+(2+r*u)+'" width="'+u+'" height="'+u+'"/>';
  }
  if (o.rivinimet !== false && o.nimet){ /* varalla */ }

const svg=document.getElementById("nlsvg"), rng=document.getElementById("nlrange"), out=document.getElementById("nlout");
const X0=34, X1=606, Y=62;
function piirraNL(v){
  const ala=Math.floor(v/10)*10, yla=ala+10, puoli=ala+5;
  const pyor = (v%10)>=5 ? yla : ala;
  const x = n => X0 + (n/100)*(X1-X0);
  let s=`<line class="rail" x1="${X0}" y1="${Y}" x2="${X1}" y2="${Y}"/>`;
  for(let n=0;n<=100;n+=10){
    const near = (n===ala||n===yla);
    s+=`<line class="tick" x1="${x(n)}" y1="${Y-7}" x2="${x(n)}" y2="${Y+7}"/>`;
    s+=`<text class="stop${near?" near":""}" x="${x(n)}" y="${Y+24}" text-anchor="middle">${n}</text>`;
  }
  s+=`<line class="halfway" x1="${x(puoli)}" y1="${Y-16}" x2="${x(puoli)}" y2="${Y+12}"/>`;
  s+=`<text class="stop" x="${x(puoli)}" y="${Y-22}" text-anchor="middle">puoliväli ${puoli}</text>`;
  s+=`<circle class="dot" cx="${x(v)}" cy="${Y}" r="6"/>`;
  s+=`<text class="val" x="${x(v)}" y="${Y-32}" text-anchor="middle">${v}</text>`;
  s+=`<path d="M ${x(v)} ${Y+38} L ${x(pyor)} ${Y+38}" stroke="var(--core)" stroke-width="2" fill="none"/>`;
  s+=`<path d="M ${x(pyor)} ${Y+38} l ${x(pyor)>x(v)?-7:7} -4 l 0 8 z" fill="var(--core)"/>`;
  svg.innerHTML=s;
  out.textContent = `${v} pyöristyy → ${pyor}`;
}
if(svg){ piirraNL(+rng.value); rng.addEventListener("input",e=>piirraNL(+e.target.value)); }

/* ---------- laskujärjestys-widget ---------- */
const ljExp=document.getElementById("ljExp");
if(ljExp && D.kokeilu){
  let ljI=0, ljTokens=[], ljStep=0;
  const laske=(a,op,b)=>{a=+a;b=+b;return op==="×"?a*b:op==="÷"?a/b:op==="+"?a+b:a-b;};
  function ljAlku(){
    const l=D.kokeilu[ljI];
    ljTokens=l.lauseke.replace(/\(/g,"( ").replace(/\)/g," )").split(/\s+/).filter(Boolean);
    ljStep=0; ljPiirra(); ljViesti("","");
  }
  function ljViesti(t,lk){const f=document.getElementById("ljFb"); f.textContent=t; f.className="lj-fb "+(lk||"");}
  function ljPiirra(){
    const l=D.kokeilu[ljI];
    document.getElementById("ljStep").textContent =
      ljStep>=l.askeleet.length ? "valmis" : `askel ${ljStep+1} / ${l.askeleet.length}`;
    if(ljStep>=l.askeleet.length){
      ljExp.innerHTML=`<span class="valmis">${l.lauseke} = ${l.vastaus}</span>`;
      return;
    }
    ljExp.innerHTML=ljTokens.map((t,i)=>
      "×÷+−".includes(t) ? `<button type="button" class="op" data-i="${i}">${t}</button>`
                         : `<span class="tok">${t}</span>`).join("");
    ljExp.querySelectorAll("button.op").forEach(b=>b.addEventListener("click",()=>ljKlikkaa(+b.dataset.i)));
  }
  function ljKlikkaa(i){
    const l=D.kokeilu[ljI], odotettu=l.askeleet[ljStep];
    const ehdotus=[ljTokens[i-1],ljTokens[i],ljTokens[i+1]].join(" ");
    if(ehdotus!==odotettu){
      ljViesti(ljStep===0
        ? "Ei vielä. Sulkeet ovat vahvimmat, sitten kerto ja jako. Yhtä vahvat vasemmalta oikealle."
        : "Ei vielä. Kumpi jäljellä olevista on vahvempi?", "no");
      return;
    }
    const arvo=laske(ljTokens[i-1],ljTokens[i],ljTokens[i+1]);
    let alku=i-1, loppu=i+1;
    if(ljTokens[i-2]==="(" && ljTokens[i+2]===")"){ alku=i-2; loppu=i+2; }
    ljTokens.splice(alku, loppu-alku+1, String(arvo));
    ljStep++;
    ljViesti(ljStep>=l.askeleet.length ? "Valmis. Vastaus on "+l.vastaus+"." : "Oikein. Jatka seuraavaan.", "ok");
    ljPiirra();
  }
  document.getElementById("ljSeuraava").addEventListener("click",()=>{
    ljI=(ljI+1)%D.kokeilu.length; ljAlku();
  });
  ljAlku();
}

/* ---------- murtokuvio: väritä osat, lue murtoluku ---------- */
const mkJuuri=document.getElementById("mk");
if(mkJuuri){
  const O=D.teksti.find(x=>x.tyyppi==="murtokuvio"), T=O.tehtavat||[];
  const $=id=>document.getElementById(id), svg=$("mkSvg");
  const S={tila:"tutki", muoto:"ympyra", n:4, varit:new Set(), ti:0, valmis:false};
  const osaa=k=>k===1?"1 osan":k+" osaa";
  function polut(muoto,n){
    const out=[];
    if(muoto==="ympyra"){
      const cx=130,cy=130,r=118;
      for(let i=0;i<n;i++){
        const a0=-Math.PI/2+2*Math.PI*i/n, a1=-Math.PI/2+2*Math.PI*(i+1)/n;
        const p=a=>`${(cx+r*Math.cos(a)).toFixed(2)},${(cy+r*Math.sin(a)).toFixed(2)}`;
        out.push(`M${cx},${cy} L${p(a0)} A${r},${r} 0 ${(a1-a0)>Math.PI?1:0} 1 ${p(a1)} Z`);
      }
    } else {
      const x=8,y=72,w=244,h=116;
      for(let i=0;i<n;i++){const a=(x+w*i/n).toFixed(2), b=(x+w*(i+1)/n).toFixed(2); out.push(`M${a},${y} H${b} V${y+h} H${a} Z`);}
    }
    return out;
  }
  const tehtava=()=>S.tila==="tehtava"?T[S.ti]:null;
  function piirra(fokus){
    const tt=tehtava(), lukittu=!!(tt&&tt.laji==="kirjoita");
    svg.innerHTML=polut(S.muoto,S.n).map((d,i)=>{
      const on=S.varit.has(i);
      return `<path class="mk-osa${on?" on":""}${lukittu?" lukittu":""}" d="${d}" data-i="${i}"`+
        (lukittu?` aria-hidden="true"`:` tabindex="0" role="button" aria-pressed="${on}" aria-label="Osa ${i+1}${on?", väritetty":""}"`)+`/>`;
    }).join("");
    if(fokus!=null){const el=svg.querySelector(`[data-i="${fokus}"]`); if(el) el.focus();}
    $("mkN").textContent=S.n;
    $("mkMiinus").disabled=S.n<=2; $("mkPlus").disabled=S.n>=12;
    mkJuuri.querySelectorAll("[data-muoto]").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.muoto===S.muoto)));
    $("mkOhjaus").hidden=lukittu;
    $("mkMuodot").hidden=!!tt;
    const o=S.varit.size;
    if(lukittu && !S.valmis){
      $("mkLuku").innerHTML=`<div class="mk-mv"><input type="text" id="mkOsIn" inputmode="numeric" autocomplete="off" aria-label="Osoittaja"><span class="mk-viiva"></span><input type="text" id="mkNiIn" inputmode="numeric" autocomplete="off" aria-label="Nimittäjä"></div>
        <div class="mk-sel"><span>ylös <b>osoittaja</b>: montako osaa on väritetty</span><span>alas <b>nimittäjä</b>: moneenko osaan kuvio on jaettu</span></div>`;
      $("mkSanoin").innerHTML="";
    } else if(S.tila==="tutki" || S.valmis){
      $("mkLuku").innerHTML=`<div class="mk-mv" aria-hidden="true"><span class="mk-os">${o}</span><span class="mk-viiva"></span><span class="mk-ni">${S.n}</span></div>
        <div class="mk-sel"><span><b>${o}</b> on osoittaja: väritettyjä osia</span><span><b>${S.n}</b> on nimittäjä: moneenko yhtä suureen osaan kokonainen on jaettu</span></div>`;
      $("mkSanoin").innerHTML=`Luetaan: <b>${murtoSanoin(o,S.n)}</b>.`+
        (o===S.n?" Kaikki osat on väritetty, joten väritetty osuus on yksi kokonainen.":"")+
        (S.tila==="tutki"?` Yksi osa on ${mfHtml(1,S.n)} eli ${OSANIMET[S.n]}. Mitä useampaan osaan saman kuvion jaat, sitä pienempi yksi osa on.`:"");
    } else {
      $("mkLuku").innerHTML=`<div class="mk-mv mk-piilo" aria-hidden="true"><span class="mk-os">?</span><span class="mk-viiva"></span><span class="mk-ni">?</span></div>
        <div class="mk-sel"><span>Väritettyjä osia: <b>${o}</b></span><span>Osia kuviossa: <b>${S.n}</b></span></div>`;
      $("mkSanoin").innerHTML="";
    }
  }
  function aloita(i){
    S.ti=i; S.valmis=false; const tt=T[i];
    S.muoto=tt.muoto;
    if(tt.laji==="kirjoita"){
      S.n=tt.nimittaja; S.varit=new Set([...Array(tt.osoittaja).keys()]);
      $("mkTehtava").innerHTML=`<b>Tehtävä ${i+1} / ${T.length}.</b> Osa kuviosta on väritetty. Kirjoita murtoluku, joka kertoo väritetyn osuuden.`;
    } else {
      S.n=2; S.varit=new Set();
      $("mkTehtava").innerHTML=`<b>Tehtävä ${i+1} / ${T.length}.</b> Väritä ${tt.muoto==="ympyra"?"ympyrästä":"suorakulmiosta"} ${mfHtml(tt.osoittaja,tt.nimittaja)} eli ${murtoSanoin(tt.osoittaja,tt.nimittaja)}.<small>Jaa kuvio ensin oikeaan määrään yhtä suuria osia ja väritä sitten osat.</small>`;
    }
    twPalaute($("mkPalaute"),"");
    piirra();
  }
  twTilat(mkJuuri,tila=>{
    S.tila=tila; twPalaute($("mkPalaute"),"");
    $("mkTehtava").hidden=$("mkToiminnot").hidden=(tila!=="tehtava");
    if(tila==="tehtava") aloita(S.ti);
    else { S.muoto="ympyra"; S.n=4; S.varit=new Set(); piirra(); }
  });
  function vaihda(i){
    const tt=tehtava(); if((tt&&tt.laji==="kirjoita")||S.valmis) return;
    S.varit.has(i)?S.varit.delete(i):S.varit.add(i);
    if(tt) twPalaute($("mkPalaute"),"");

  svg.addEventListener("click",e=>{const p=e.target.closest(".mk-osa"); if(p) vaihda(+p.dataset.i);});

    const p=e.target.closest(".mk-osa"); if(!p) return;
    if(e.key==="Enter"||e.key===" "){e.preventDefault(); vaihda(+p.dataset.i);}
  });

  const muutaN=d=>{ if(S.valmis) return; S.n=Math.max(2,Math.min(12,S.n+d)); S.varit=new Set(); if(tehtava()) twPalaute($("mkPalaute"),""); piirra(); };
  $("mkMiinus").addEventListener("click",()=>muutaN(-1));
  $("mkPlus").addEventListener("click",()=>muutaN(1));
  $("mkTarkista").addEventListener("click",()=>{
    const tt=tehtava(); if(!tt||S.valmis) return;
    const pal=$("mkPalaute"), on=tt.osoittaja, ni=tt.nimittaja;
    if(tt.laji==="kirjoita"){
      const a=twLuku($("mkOsIn").value), b=twLuku($("mkNiIn").value);
      if(a===null||b===null) return twPalaute(pal,"Kirjoita molemmat luvut: osoittaja ylös ja nimittäjä alas.","hint");
      if(a===ni && b===on && a!==b) return twPalaute(pal,"Luvut ovat päittäin. Alas tulee nimittäjä eli kaikkien osien määrä. Ylös tulee osoittaja eli väritettyjen osien määrä.","no");
      if(b!==ni) return twPalaute(pal,"Nimittäjä ei täsmää. Laske kaikki osat: moneenko yhtä suureen osaan kuvio on jaettu?","no");
      if(a!==on) return twPalaute(pal,"Osoittaja ei täsmää. Laske vain väritetyt osat.","no");
      S.valmis=true; piirra();
      return twPalaute(pal,`Oikein! Kuvio on jaettu ${ni} yhtä suureen osaan, ja niistä ${on} on väritetty: ${mfHtml(on,ni)} eli ${murtoSanoin(on,ni)}.`,"ok");

    if(S.n!==ni) return twPalaute(pal,`Kuvio on nyt jaettu ${S.n} osaan. Nimittäjä ${ni} kertoo, että osia pitää olla ${ni}. Muuta osien määrää.`,"no");
    if(k===0) return twPalaute(pal,`Osien määrä on oikein. Väritä nyt ${osaa(on)}: osoittaja ${on} kertoo, montako osaa väritetään.`,"hint");

    S.valmis=true; piirra();
    twPalaute(pal,`Oikein! Kuvio on jaettu ${ni} yhtä suureen osaan, ja niistä ${on} on väritetty.`,"ok");
  });
  $("mkSeuraava").addEventListener("click",()=>{
    const uusi=(S.ti+1)%T.length; aloita(uusi);
    if(uusi===0) twPalaute($("mkPalaute"),"Kävit kaikki tehtävät läpi. Ne alkavat nyt alusta.","hint");
  });
  piirra();
}

    S.ti=i; const tt=T[i]; S.luku=tt.luku; S.jakaja=tt.jakaja; nollaa();
    $("jlTehtava").innerHTML=`<b>Tilanne ${i+1} / ${T.length}.</b> ${tt.teksti}<small>Voit täyttää ${W.ryhmat} ennen kuin vastaat.</small>`;
    $("jlIn").value=""; twPalaute($("jlPalaute"),""); piirra();
  }
  twTilat(jlJuuri,tila=>{
    S.tila=tila; twPalaute($("jlPalaute"),"");
    const t=tila==="tehtava";
    $("jlTehtava").hidden=$("jlVastaus").hidden=!t; $("jlOhjaus").hidden=t;
    if(t) aloita(S.ti); else {S.luku=O.tutki.luku; S.jakaja=O.tutki.jakaja; nollaa(); piirra();}
  });
  const muuta=(k,d,a,b)=>{S[k]=Math.max(a,Math.min(b,S[k]+d)); nollaa(); piirra();};
  $("jlLukuM").addEventListener("click",()=>muuta("luku",-1,1,60));
  $("jlLukuP").addEventListener("click",()=>muuta("luku",1,1,60));
  $("jlJakM").addEventListener("click",()=>muuta("jakaja",-1,2,9));
  $("jlJakP").addEventListener("click",()=>muuta("jakaja",1,2,9));
  $("jlTayta").addEventListener("click",()=>{if(odottaa()>=S.jakaja){S.taydet++; piirra();}});
  $("jlKaikki").addEventListener("click",()=>{S.taydet=Math.floor(S.luku/S.jakaja); piirra();});
  $("jlVajaa").addEventListener("click",()=>{const w=odottaa(); if(w>0&&w<S.jakaja){S.vajaa=true; piirra();}});
  $("jlAlusta").addEventListener("click",()=>{nollaa(); piirra();});
  $("jlTarkista").addEventListener("click",()=>{
    const tt=T[S.ti], pal=$("jlPalaute"), a=twLuku($("jlIn").value);
    if(a===null) return twPalaute(pal,"Kirjoita vastaukseksi luku.","hint");
    const q=Math.floor(tt.luku/tt.jakaja), r=tt.luku%tt.jakaja;
    const oikea=tt.kysymys==="taydet"?q:tt.kysymys==="yli"?r:q+(r>0?1:0);
    if(a===oikea){
      const miksi=tt.kysymys==="taydet"?`${ryhmat(q)} täyttyy kokonaan${r?`, ja yli jää ${esineet(r)}, mikä ei riitä täyttämään vielä yhtä.`:". Ketään ei jää yli."}`:
        tt.kysymys==="yli"?`${ryhmat(q)} täyttyy, ja yli jää ${esineet(r)}.`:
        (r?`${ryhmat(q)} täyttyy, ja ${esineet(r)} jää vielä ilman paikkaa. Siksi tarvitaan yksi lisää, eli ${q+1}.`:`${ryhmat(q)} täyttyy tasan, eikä ketään jää yli. Lisää ei tarvita.`);
      return twPalaute(pal,"Oikein! "+miksi,"ok");
    }
    let v;
    if(tt.kysymys==="tarvitaan" && a===q && r>0) v=`Silloin ${esineet(r)} jää ilman paikkaa. Pääseekö jokainen mukaan?`;
    else if(tt.kysymys==="taydet" && a===q+1 && r>0) v=`Viimeisessä olisi vain ${esineet(r)}, joten se ei ole täynnä. Kysymys kysyy täysiä.`;
    else if(tt.kysymys!=="yli" && a===r) v=`${r} on jäännös eli yli jääneiden määrä. Kysymys kysyy ${W.ryhmia}.`;
    else if(tt.kysymys==="yli" && (a===q||a===q+1)) v=`${a} kertoo ${W.ryhmien} määrän. Kysymys kysyy, montako jää yli.`;
    else if(tt.kysymys==="yli" && a>=tt.jakaja) v=`Jäännös on aina pienempi kuin ${tt.jakaja}. Jos yli jää ${tt.jakaja} tai enemmän, niistä saadaan vielä yksi täysi.`;
    else v=`Ei aivan. Täytä ${W.ryhmat} yllä ja lue kysymys uudelleen.`;
    twPalaute(pal,v,"no");
  });
  $("jlIn").addEventListener("keydown",e=>{if(e.key==="Enter") $("jlTarkista").click();});
  $("jlSeuraava").addEventListener("click",()=>{
    const uusi=(S.ti+1)%T.length; aloita(uusi);
    if(uusi===0) twPalaute($("jlPalaute"),"Kävit kaikki tilanteet läpi. Ne alkavat nyt alusta.","hint");
  });
  piirra();
}

/* ---------- kestokello: kelaa kelloa, katso miten aika kertyy ---------- */
const kkJuuri=document.getElementById("kk");
if(kkJuuri){

  const $=id=>document.getElementById(id), svg=$("kkSvg");

  const klo=t=>{t=((t%1440)+1440)%1440; return Math.floor(t/60)+"."+pad(t%60);};
  const kesto=k=>{const h=Math.floor(k/60), m=k%60, ht=h===1?"1 tunti":h+" tuntia", mt=m===1?"1 minuutti":m+" minuuttia";
    return h&&m?ht+" "+mt:h?ht:mt;};

  for(let n=1;n<=12;n++){const a=n*Math.PI/6; s+=`<text class="kk-nro" x="${(120+79*Math.sin(a)).toFixed(2)}" y="${(120-79*Math.cos(a)+6).toFixed(2)}" text-anchor="middle">${n}</text>`;}
  s+=`<line class="kk-tunti" id="kkT" x1="120" y1="120" x2="120" y2="66"/><line class="kk-min" id="kkMi" x1="120" y1="120" x2="120" y2="34"/>

  function viesti(t){$("kkViesti").textContent=t||"";}
  let flashAjastin=null;

    // palat: alusta seuraavaan täyteen tuntiin, täydet tunnit, viimeiset minuutit

    if(S.kulunut<=ekat||ekat===0&&S.kulunut<60){ if(S.kulunut>0) palat.push({luokka:ekat?"alku":"loppu",min:S.kulunut,a:S.alku}); }
    else {
      let a=S.alku; if(ekat){palat.push({luokka:"alku",min:ekat,a}); a+=ekat;}
      const tunnit=Math.floor((S.kulunut-ekat)/60), loput=(S.kulunut-ekat)%60;
      for(let i=0;i<tunnit;i++){palat.push({luokka:"tunti",min:60,a}); a+=60;}

    }
    const asteikko=Math.max(120,S.kulunut);
    $("kkPalat").innerHTML=palat.map(p=>`<span class="kk-pala ${p.luokka}" style="flex:${p.min} 1 0">${p.min>=10?p.min+" min":""}</span>`).join("")+

    $("kkSelitys").innerHTML=palat.length?palat.map(p=>`<span>${klo(p.a)} → ${klo(p.a+p.min)}: <b>${p.min} min</b></span>`).join(" · "):"Vedä minuuttiviisaria myötäpäivään tai paina + 5 min.";
    const t2=tt(), naytaYht=!t2||t2.laji==="loppu"||S.valmis;
    $("kkYht").innerHTML=palat.length&&naytaYht?`Kulunut yhteensä: ${palat.length>1?palat.map(p=>p.min).join(" + ")+" = ":""}<b>${S.kulunut} minuuttia</b>${S.kulunut>=60?" eli "+kesto(S.kulunut):""}.`:

  function liiku(e){const m=kulmaMin(e); let d=m-edMin; if(d>30) d-=60; if(d<-30) d+=60; if(d){aseta(S.kulunut+d,"veto"); edMin=nyt()%60;}}
  svg.addEventListener("pointerdown",e=>{if(S.valmis) return; vetaa=true; svg.setPointerCapture(e.pointerId); edMin=nyt()%60; liiku(e); e.preventDefault();});

      if(a===perakkain && oikea>=60) return twPalaute(pal,`Kirjoitit tunnit ja minuutit peräkkäin (${kesto(oikea)}). Kysymys pyytää pelkkiä minuutteja: yksi tunti on 60 minuuttia.`,"no");

/* ---------- harjoitukset ----------
   Kaksi vastaustyyppiä: "numero" (oletus, tekstikenttä + Number()-vertailu) ja
   "monivalinta" (valintapainikkeet, h.vaihtoehdot[] + h.vastaus = oikean vaihtoehdon indeksi).
   Jos D.harjoitukset puuttuu tai on tyhjä, koko osio piilotetaan (näyttötaidot, ei kirjallista
   harjoitusta: liikunta, kuvataide). */
/* Kysymyksessä voi olla luettavaa aineistoa ja sen jälkeen varsinainen kysymys,
   erotettuna tyhjällä rivillä. Viimeinen osa on kysymys, sitä edeltävät aineistoa. */
const kysymysHtml = t => {
  const osat = String(t).split(/\n\s*\n/).map(x=>x.trim()).filter(Boolean);
  if(osat.length < 2) return osat[0] || "";
  const kysymys = osat.pop();
  return osat.map(p=>`<span class="aineisto">${p}</span>`).join("")
       + `<span class="kysymysrivi">${kysymys}</span>`;
};

/* Suomalainen lukumuoto: välilyönti on tuhaterotin, pilkku desimaalierotin.
   Piste voi olla kumpi tahansa. Se tulkitaan tuhaterottimeksi VAIN silloin, kun
   koko luku on aitoa tuhaterotinmuotoa: alkuosa 1–3 numeroa ilman etunollaa ja
   jokainen jatko-osa täsmälleen 3 numeroa (1.500, 12.345.678). Kaikissa muissa
   tapauksissa piste on desimaalipiste — myös 0.125, joka vanhalla säännöllä
   ("3 numeroa pisteen jäljessä = tuhaterotin") luettiin virheellisesti luvuksi 125. */
const TUHATEROTIN = /^[1-9]\d{0,2}(\.\d{3})+$/;
function lueLuku(teksti){
  // Murtoluku (3/4, -3/4) ja sekaluku (1 2/3, -1 2/3) hyväksytään sellaisinaan.
  const raaka = String(teksti).replace(/\u00a0/g, " ").trim();
  let m = raaka.match(/^(-?)(\d+)\s+(\d+)\s*\/\s*(\d+)$/);
  if(m){ const nim = Number(m[4]); if(nim === 0) return null;
    const v = Number(m[2]) + Number(m[3]) / nim; return m[1] ? -v : v; }
  m = raaka.match(/^(-?)\s*(\d+)\s*\/\s*(\d+)$/);
  if(m){ const nim = Number(m[3]); if(nim === 0) return null;
    const v = Number(m[2]) / nim; return m[1] ? -v : v; }
  let s = String(teksti).replace(/[\s\u00a0]/g, "");
  if(s === "") return null;
  if(s.indexOf(",") >= 0){
    s = s.replace(/\./g, "").replace(",", ".");
  } else if(TUHATEROTIN.test(s)){
    s = s.replace(/\./g, "");
  }
  const n = Number(s);
  return Number.isFinite(n) ? n : null;
}

function tarkista(id){
  const h=D.harjoitukset.find(x=>x.id===id);
  const kentta=document.getElementById("in-"+id);
  const fb=document.getElementById("fb-"+id);
  if(kentta.value.trim()===""){ fb.className="fb hint"; fb.textContent="Kirjoita vastaus ensin."; return; }
  const luku=lueLuku(kentta.value);
  if(luku===null){ fb.className="fb no"; fb.textContent="Vastauksen pitää olla luku tai murtoluku (esimerkiksi 3/4)."; return; }
  const oikein = Math.abs(luku - h.vastaus) < 1e-9;
  merkitseTulos(id, oikein, oikein ? "Oikein. "+h.selitys : `Ei vielä. ${h.vinkki} Kokeile uudelleen.`);
}

function tarkistaMonivalinta(id, valittuIndeksi, painike){
  const h=D.harjoitukset.find(x=>x.id===id);
  const rivi=painike.closest(".row");
  rivi.querySelectorAll(".mv-valinta").forEach(b=>b.disabled=true);
  const oikein = valittuIndeksi===h.vastaus;
  painike.classList.add(oikein?"mv-oikein":"mv-vaarin");
  if(!oikein){
    const oikeaBtn=rivi.querySelector(`[data-i="${h.vastaus}"]`);
    if(oikeaBtn) oikeaBtn.classList.add("mv-oikein");
  }
  merkitseTulos(id, oikein, oikein ? "Oikein. "+h.selitys : `Ei ihan. Oikea vastaus on korostettu. ${h.selitys||""}`);
}

/* Kuuntelu: selain lukee tekstin ääneen omalla puhesynteesillään (englanniksi, jos laitteessa on
   englanninkielinen ääni). Ei äänitiedostoja eikä verkkoyhteyttä. Jos laite ei osaa puhua,
   teksti näytetään luettavaksi — silloin tehtävä muuttuu luetun ymmärtämiseksi, mutta ei katkea. */
function puhu(id, nopeus){
  const h=D.harjoitukset.find(x=>x.id===id); if(!h || !h.kuuntele) return;
  const vara=document.getElementById("vara-"+id);
  const naytaTeksti=syy=>{ vara.hidden=false; vara.textContent=syy+" Teksti: "+h.kuuntele; };
  if(!("speechSynthesis" in window)){ naytaTeksti("Tämä laite ei osaa lukea ääneen."); return; }
  const s=window.speechSynthesis; s.cancel();
  const u=new SpeechSynthesisUtterance(h.kuuntele);
  u.lang=h.kieli||"en-GB"; u.rate=nopeus;
  const aanet=s.getVoices(), kieli=u.lang.slice(0,2);
  const aani=aanet.find(a=>a.lang===u.lang) || aanet.find(a=>a.lang && a.lang.startsWith(kieli));
  if(aani) u.voice=aani;
  else if(aanet.length) { naytaTeksti("Laitteessa ei ole englanninkielistä ääntä."); return; }
  u.onerror=()=>naytaTeksti("Ääneen lukeminen ei onnistunut.");
  s.speak(u);
}

document.getElementById("harjoitukset").addEventListener("click",e=>{
  const k=e.target.closest("[data-kuuntele]"), hk=e.target.closest("[data-hitaasti]");
  if(k) puhu(k.dataset.kuuntele, 0.9);
  if(hk) puhu(hk.dataset.hitaasti, 0.6);
  const t=e.target.closest("[data-tarkista]"), v=e.target.closest("[data-vinkki]"), mv=e.target.closest("[data-mv]");
  if(t) tarkista(t.dataset.tarkista);
  if(mv) tarkistaMonivalinta(mv.dataset.mv, Number(mv.dataset.i), mv);
  if(v){
    const h=D.harjoitukset.find(x=>x.id===v.dataset.vinkki);
    const fb=document.getElementById("fb-"+h.id);
    fb.className="fb hint"; fb.textContent=h.vinkki;
  }
});
document.getElementById("harjoitukset").addEventListener("keydown",e=>{
  if(e.key==="Enter" && e.target.id.startsWith("in-")){ e.preventDefault(); tarkista(e.target.id.slice(3)); }
});
