<title>Syystä seuraukseen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">

<style>
:root{
  --paper:#EFF2F5; --surface:#FFFFFF; --surface-2:#F7F9FB;
  --grid:#DCE3EA; --line:#C9D3DC;
  --ink:#15222C; --ink-2:#4E626F; --ink-3:#7E8F9B;
  --core:#1B5A9E; --core-soft:#E4EDF6;
  --strong:#1F6E5C; --strong-soft:#E1F0EB;
  --chal:#9A6A16; --chal-soft:#F6EDDC;
  --alert:#A33A2B; --alert-soft:#F8E7E3;
  --shadow:0 1px 2px rgba(21,34,44,.06), 0 8px 24px -12px rgba(21,34,44,.18);
  --r:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0F161B; --surface:#18222A; --surface-2:#1D2830;
    --grid:#22303A; --line:#2E3E4A;
    --ink:#E8EFF4; --ink-2:#A3B4C0; --ink-3:#7A8B97;
    --core:#7FB2E4; --core-soft:#16303F;
    --strong:#77CDB4; --strong-soft:#123028;
    --chal:#E0B267; --chal-soft:#33270F;
    --alert:#E8907F; --alert-soft:#3A1E19;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -14px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --paper:#0F161B; --surface:#18222A; --surface-2:#1D2830;
  --grid:#22303A; --line:#2E3E4A;
  --ink:#E8EFF4; --ink-2:#A3B4C0; --ink-3:#7A8B97;
  --core:#7FB2E4; --core-soft:#16303F;
  --strong:#77CDB4; --strong-soft:#123028;
  --chal:#E0B267; --chal-soft:#33270F;
  --alert:#E8907F; --alert-soft:#3A1E19;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -14px rgba(0,0,0,.7);
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:16px; line-height:1.62;
  background-image:
    linear-gradient(to right, var(--grid) 1px, transparent 1px),
    linear-gradient(to bottom, var(--grid) 1px, transparent 1px);
  background-size:26px 26px;
}
.wrap{max-width:760px; margin:0 auto; padding:28px 20px 90px}
h1,h2,h3,h4{font-family:"Familjen Grotesk","IBM Plex Sans",system-ui,sans-serif; text-wrap:balance}

/* header */
header.top{background:var(--surface); border:1px solid var(--line); border-radius:var(--r);
  box-shadow:var(--shadow); padding:22px 24px; display:flex; gap:18px; align-items:flex-start}
.badge{flex:0 0 auto; width:54px; height:54px; border-radius:9px; display:grid; place-items:center;
  background:var(--core-soft); border:1px solid var(--core); color:var(--core)}
.badge svg{width:28px; height:28px; fill:none; stroke:currentColor; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round}
.eyebrow{font-family:"IBM Plex Mono",monospace; font-size:11px; letter-spacing:.14em;
  text-transform:uppercase; color:var(--ink-3); margin:0 0 5px}
header.top h1{margin:0; font-size:30px; font-weight:700; letter-spacing:-.015em}
header.top p{margin:5px 0 0; color:var(--ink-2); font-size:15px}
.tags{display:flex; flex-wrap:wrap; gap:5px; margin-top:11px}
.tag{font-family:"IBM Plex Mono",monospace; font-size:10.5px; letter-spacing:.05em; padding:2px 7px;
  border-radius:4px; background:var(--surface-2); border:1px solid var(--line); color:var(--ink-3)}
.tag.core{background:var(--core-soft); border-color:var(--core); color:var(--core)}

/* teksti */
article{margin-top:26px}
article h2{font-size:21px; font-weight:600; margin:32px 0 10px; letter-spacing:-.01em}
article p{margin:0 0 14px; max-width:64ch}
.lead{font-size:17.5px; color:var(--ink); border-left:3px solid var(--core); padding-left:16px; margin:0 0 8px}

.box{background:var(--surface); border:1px solid var(--line); border-radius:var(--r);
  padding:18px 22px; box-shadow:var(--shadow); margin:22px 0}
.box h3{margin:0 0 12px; font-size:16.5px; font-weight:600}
.box.warn{border-left:3px solid var(--alert)}
.box.note{border-left:3px solid var(--chal)}

ol.steps{margin:0; padding-left:0; list-style:none; counter-reset:s; display:grid; gap:12px}
ol.steps li{counter-increment:s; display:grid; grid-template-columns:auto 1fr; gap:13px; align-items:start}
ol.steps li::before{content:counter(s); font-family:"Familjen Grotesk",sans-serif; font-weight:700; font-size:14px;
  width:26px; height:26px; border-radius:50%; background:var(--core); color:#fff; display:grid; place-items:center; margin-top:2px}

ul.notes{margin:0; padding-left:19px}
ul.notes li{margin-bottom:7px}
ul.notes li:last-child{margin-bottom:0}

.tablewrap{overflow-x:auto}
table{border-collapse:collapse; width:100%; font-size:14.5px; min-width:460px}
th,td{text-align:left; padding:9px 13px; border-bottom:1px solid var(--line)}
th{font-family:"IBM Plex Mono",monospace; font-size:10.5px; letter-spacing:.1em; text-transform:uppercase;
  color:var(--ink-3); font-weight:400; background:var(--surface-2)}
tr:last-child td{border-bottom:0}
td b{color:var(--core); font-weight:600}
td:last-child{font-variant-numeric:tabular-nums; font-weight:600}

/* lukusuora */
.nl svg{width:100%; height:118px; display:block}
.nl .rail{stroke:var(--line); stroke-width:2}
.nl .tick{stroke:var(--line); stroke-width:1.5}
.nl .stop{fill:var(--ink-3); font-family:"IBM Plex Mono",monospace; font-size:11px}
.nl .stop.near{fill:var(--core); font-weight:600}
.nl .dot{fill:var(--chal)}
.nl .val{fill:var(--ink); font-family:"Familjen Grotesk",sans-serif; font-size:15px; font-weight:700}
.nl .halfway{stroke:var(--chal); stroke-dasharray:3 3; stroke-width:1.5}
.nl-controls{display:flex; align-items:center; gap:14px; margin-top:6px}
.nl-controls input{flex:1; accent-color:var(--core)}
.nl-out{font-family:"Familjen Grotesk",sans-serif; font-size:15px; font-weight:600; min-width:12.5em; text-align:right}

/* paikka-arvotaulu */
.box .ohje{margin:0 0 14px; font-size:14.5px; color:var(--ink-2)}
.nt-valinta{display:flex; flex-wrap:wrap; gap:7px; margin-bottom:16px}
.nt-valinta button{font:inherit; font-size:12.5px; font-family:"IBM Plex Mono",monospace; padding:5px 11px;
  border-radius:6px; border:1px solid var(--line); background:var(--surface-2); color:var(--ink-2); cursor:pointer}
.nt-valinta button[aria-pressed="true"]{background:var(--ink); color:var(--paper); border-color:var(--ink)}
.nt-valinta button:focus-visible{outline:2px solid var(--core); outline-offset:2px}
.nt-taulu{display:flex; flex-direction:column; gap:4px; align-items:flex-start; overflow-x:auto; padding-bottom:4px}
.nt-rivi{display:flex; gap:6px; align-items:center}
.nt-rivi .otsa{font-family:"IBM Plex Mono",monospace; font-size:9.5px; letter-spacing:.08em;
  text-transform:uppercase; color:var(--ink-3); width:52px; text-align:center}
.nt-ruutu{width:52px; height:52px; display:grid; place-items:center; border:1.5px solid var(--line);
  border-radius:7px; background:var(--surface-2); font-family:"IBM Plex Mono",monospace; font-size:24px}
.nt-ruutu.kohta{border-color:var(--core); background:var(--core-soft); color:var(--core); font-weight:500}
.nt-ruutu.ratkaiseva{border-color:var(--chal); background:var(--chal-soft); color:var(--chal); font-weight:500}
.nt-ruutu.nolla{color:var(--ink-3)}
.nt-rivi .nimi{font-size:12.5px; color:var(--ink-3); margin-left:12px; white-space:nowrap}
.nt-nuoli{font-size:17px; color:var(--chal); margin-left:6px}
.nt-selite{margin:14px 0 0; font-size:14.5px}
.nt-selite b{color:var(--core)}

/* vahvuusportaat */
.vp-tasot{display:grid; gap:9px; margin-bottom:18px}
.vp-taso{display:flex; gap:11px; align-items:flex-start; font-size:13.5px}
.vp-taso .vp-pallo{width:13px; height:13px; border-radius:4px; margin-top:5px; flex:0 0 auto}
.vp-taso[data-taso="sulkeet"] .vp-pallo{background:var(--core)}
.vp-taso[data-taso="kertojako"] .vp-pallo{background:var(--strong)}
.vp-taso[data-taso="yhteenvahennys"] .vp-pallo{background:var(--chal)}
.vp-taso strong{display:block; font-family:"Familjen Grotesk",sans-serif; font-weight:600; font-size:14.5px}
.vp-taso span{color:var(--ink-2)}
.vp-lauseke{display:flex; flex-wrap:wrap; gap:7px; align-items:flex-end; font-family:"IBM Plex Mono",monospace;
  font-size:25px; padding:10px 2px; min-height:64px}
.vp-lauseke .t{padding:2px 3px}
.vp-lauseke .op{position:relative; padding:2px 9px; border-radius:6px; font-weight:500}
.vp-lauseke .op[data-taso="sulkeet"]{background:var(--core-soft); color:var(--core)}
.vp-lauseke .op[data-taso="kertojako"]{background:var(--strong-soft); color:var(--strong)}
.vp-lauseke .op[data-taso="yhteenvahennys"]{background:var(--chal-soft); color:var(--chal)}
.vp-lauseke .op i{position:absolute; top:-9px; right:-6px; font-style:normal; font-family:"Familjen Grotesk",sans-serif;
  font-size:11px; font-weight:700; width:18px; height:18px; border-radius:50%; display:grid; place-items:center;
  background:currentColor}
.vp-lauseke .op i span{color:var(--surface)}
.vp-rivi{display:flex; align-items:center; gap:16px; margin-top:8px}
.vp-vastaus{font-family:"Familjen Grotesk",sans-serif; font-size:16px; font-weight:600; color:var(--strong)}

/* laskujärjestys-widget */
.lj-exp{display:flex; flex-wrap:wrap; gap:7px; align-items:center; font-family:"IBM Plex Mono",monospace;
  font-size:23px; padding:14px 4px; min-height:62px}
.lj-exp .tok{padding:2px 4px; color:var(--ink)}
.lj-exp button.op{font-family:"IBM Plex Mono",monospace; font-size:23px; padding:3px 12px; border-radius:7px;
  border:1.5px solid var(--line); background:var(--surface-2); color:var(--ink); line-height:1.2}
.lj-exp button.op:hover{border-color:var(--core); color:var(--core)}
.lj-exp button.op:focus-visible{outline:2px solid var(--core); outline-offset:2px}
.lj-exp .valmis{font-family:"Familjen Grotesk",sans-serif; font-size:23px; font-weight:700; color:var(--strong)}
.lj-fb{font-size:14.5px; min-height:1.5em; color:var(--ink-2)}
.lj-fb.no{color:var(--alert)}
.lj-fb.ok{color:var(--strong)}
.lj-row{display:flex; align-items:center; gap:14px; margin-top:10px}
.lj-step{font-family:"IBM Plex Mono",monospace; font-size:11.5px; letter-spacing:.1em;
  text-transform:uppercase; color:var(--ink-3)}

/* harjoitukset */
.progress{position:sticky; top:0; z-index:5; background:var(--surface); border:1px solid var(--line);
  border-radius:var(--r); padding:12px 18px; box-shadow:var(--shadow); display:flex; align-items:center;
  gap:14px; margin:34px 0 18px}
.progress .lbl{font-family:"IBM Plex Mono",monospace; font-size:11px; letter-spacing:.12em;
  text-transform:uppercase; color:var(--ink-3); white-space:nowrap}
.progress .meter{flex:1; height:7px; border-radius:4px; background:var(--surface-2); border:1px solid var(--line); overflow:hidden}
.progress .meter i{display:block; height:100%; background:var(--core); transition:width .25s ease}
.progress .cnt{font-family:"Familjen Grotesk",sans-serif; font-weight:700; font-variant-numeric:tabular-nums; white-space:nowrap}

.grp{margin-top:26px}
.grp-head{display:flex; align-items:baseline; gap:10px; border-bottom:1.5px solid var(--ink); padding-bottom:7px; margin-bottom:14px}
.grp-head h3{margin:0; font-size:17px; font-weight:600}
.grp-head span{font-size:12.5px; color:var(--ink-2)}

.ex{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:14px 16px; margin-bottom:10px}
.ex[data-tila="oikein"]{border-color:var(--strong); box-shadow:inset 3px 0 0 var(--strong)}
.ex[data-tila="vaarin"]{border-color:var(--alert); box-shadow:inset 3px 0 0 var(--alert)}
.ex .q{display:flex; gap:11px; align-items:baseline; flex-wrap:wrap}
.ex .num{font-family:"IBM Plex Mono",monospace; font-size:11.5px; color:var(--ink-3); min-width:2.4em}
.ex .txt{flex:1; min-width:190px; font-size:15.5px}
.ex .txt .aineisto{display:block; margin-bottom:9px; padding-left:12px;
  border-left:2px solid var(--line); color:var(--ink-2); line-height:1.6;
  /* Aineisto voi olla pieni taulukko, jonka rivit on erotettu rivinvaihdoilla.
     Ilman pre-lineä ne valuisivat yhdeksi kappaleeksi ja taulukko katoaisi. */
  white-space:pre-line}
.ex .txt .kysymysrivi{display:block; font-weight:600}
.ex .row{display:flex; gap:8px; align-items:center; margin-top:11px; flex-wrap:wrap}
.ex input[type=text]{font:inherit; font-family:"IBM Plex Mono",monospace; font-size:15px; width:8.5em;
  padding:7px 11px; border:1px solid var(--line); border-radius:7px; background:var(--surface-2);
  color:var(--ink); text-align:right}
.ex input:focus-visible{outline:2px solid var(--core); outline-offset:1px}
button{font:inherit; cursor:pointer}
.btn{font-size:13.5px; padding:7px 15px; border-radius:7px; border:1px solid var(--core);
  background:var(--core); color:#fff}
.btn.ghost{background:transparent; color:var(--ink-2); border-color:var(--line)}
.btn:focus-visible{outline:2px solid var(--core); outline-offset:2px}
.btn.mv-valinta{text-align:left}
/* kuuntelutehtävä: selaimen puhesynteesi lukee englanninkielisen tekstin */
.kuuntele{display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin:2px 0 10px}
.kuuntele .btn{display:inline-flex; gap:7px; align-items:center}
.kuuntele svg{width:16px; height:16px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round}
.kuuntele .varateksti{flex-basis:100%; font-size:14px; color:var(--ink-2); background:var(--surface-2);
  border-radius:7px; padding:8px 12px; margin:0}
.btn.mv-valinta:disabled{cursor:default; opacity:.65}
.btn.mv-oikein{background:var(--strong-soft); border-color:var(--strong); color:var(--strong); opacity:1}
.btn.mv-vaarin{background:var(--alert-soft); border-color:var(--alert); color:var(--alert); opacity:1}
.row.mv{gap:8px 10px}
.fb{margin-top:11px; font-size:14.5px; padding:10px 13px; border-radius:8px; line-height:1.5}
.fb.ok{background:var(--strong-soft); color:var(--strong)}
.fb.no{background:var(--alert-soft); color:var(--alert)}
.fb.hint{background:var(--chal-soft); color:var(--chal)}

.done{background:var(--strong-soft); border:1px solid var(--strong); color:var(--strong);
  border-radius:var(--r); padding:16px 20px; margin-top:20px; font-size:15.5px}
.done h3{margin:0 0 4px; font-size:17px; color:var(--strong)}

details.teacher{margin-top:34px; background:var(--surface); border:1px solid var(--line);
  border-left:3px solid var(--chal); border-radius:var(--r); padding:15px 20px; box-shadow:var(--shadow)}
details.teacher summary{cursor:pointer; font-family:"Familjen Grotesk",sans-serif; font-weight:600; font-size:15px}
details.teacher summary:focus-visible{outline:2px solid var(--core); outline-offset:3px}
details.teacher ul{margin:12px 0 0; padding-left:19px; color:var(--ink-2); font-size:14.5px}
details.teacher li{margin-bottom:8px}
details.teacher p{margin:12px 0 0; color:var(--ink-2); font-size:14.5px}

.back{display:inline-block; margin-top:30px; font-size:13.5px; color:var(--ink-2)}
.back a{color:var(--core)}

@media (prefers-reduced-motion: reduce){*{transition:none !important}}
@media (max-width:560px){
  .wrap{padding:16px 13px 70px}
  header.top h1{font-size:25px}
  .progress{flex-wrap:wrap}
}
</style>

<div class="wrap">

  <header class="top">
    <span class="badge"><svg viewBox="0 0 24 24" aria-hidden="true" id="ikoni"></svg></span>
    <div>
      <p class="eyebrow" id="eyebrow"></p>
      <h1 id="otsikko"></h1>
      <p id="kuvaus"></p>
      <div class="tags" id="tags"></div>
    </div>
  </header>

  <article id="teksti"></article>

  <div class="progress" aria-live="polite">
    <span class="lbl">Harjoitukset</span>
    <span class="meter"><i id="pbar" style="width:0%"></i></span>
    <span class="cnt" id="pcnt">0 / 20</span>
  </div>

  <div id="harjoitukset"></div>
  <div id="valmis"></div>

  <p class="back" id="back"></p>

</div>

<script>
const D = {"tavoite_id":"YMP4-TUT-03","oppiaine":"YMP","vuosiluokka":4,"taso":"ydin","otsikko":"Syystä seuraukseen","kuvaus":"Osaan tehdä havainnoistani johtopäätöksen ja perustella sen.","versio":"0.2","paivitetty":"2026-09-26","ops":{"T":["T6"],"S":["S4"]},"eyebrow":"Ympäristöoppi · 4. luokka · Tutkijan taidot","ikoni":"tutkimus","teksti":[{"tyyppi":"johdanto","sisalto":"Aamulla pihan lätäkkö on jäässä. \"Lätäkkö on jäässä\" on havainto: sen näet omin silmin, ja kuka tahansa voi tulla katsomaan saman. \"Yöllä oli pakkasta\" on päätelmä: et ollut yöllä pihalla mittaamassa, vaan päättelit sen jäästä. Päätelmä on luultavasti oikea, mutta se on eri asia kuin havainto. Tutkija pitää nämä kaksi erillään, koska havainto pysyy totena silloinkin, kun päätelmä osoittautuu vääräksi."},{"tyyppi":"kappale","otsikko":"Havainto on se, minkä näit tai mittasit","sisalto":"Havainto kertoo, mitä tapahtui: minkä luvun mittari näytti, mitä näit, mitä laskit. \"Klo 8 lämpötila oli 2 astetta\" on havainto. \"Kannellisessa mukissa vesi oli lämpimämpää kuin kannettomassa\" on myös havainto, koska vertaat kahta mitattua lukua ja kumpikin näkyy taulukossa. Havainnon tunnistaa siitä, että voit osoittaa sen taulukosta sormella tai sanoa: tämän minä näin."},{"tyyppi":"kappale","otsikko":"Päätelmä on se, mitä havainnoista päättelet","sisalto":"Päätelmä kertoo, mitä havainnot tarkoittavat. Se tuo mukaan jotakin, mitä ei mitattu: syyn (\"kansi hidasti jäähtymistä\"), yleistyksen (\"kannellinen muki pysyy aina lämpimänä\") tai ennusteen (\"huomenna käy samoin\"). Päätelmää ei voi osoittaa taulukosta, vaan se on ajateltu taulukon luvuista. Hyvä päätelmä nojaa havaintoon ja sanoo, mihin havaintoon se nojaa: \"Kansi hidasti jäähtymistä, koska kannellinen muki pysyi lämpimämpänä.\""},{"tyyppi":"saanto","otsikko":"Kolme kysymystä jokaiselle virkkeelle","askeleet":["Voitko osoittaa virkkeen sisällön taulukosta tai sanoa \"tämän minä näin\"? Jos voit, se on havainto.","Lisääkö virke jotakin, mitä ei mitattu: syyn (mikä aiheutti mitä), yleistyksen (aina, kaikki, ei koskaan) tai ennusteen (huomenna, ensi viikolla)? Jos lisää, se on päätelmä. Sanat koska, siksi ja joten ovat vihje, eivät sääntö: \"Varjo oli lyhin klo 12, koska silloin mitattiin pienin lukema\" on havainto, sillä kumpikin osa löytyy taulukosta eikä virke kerro, mikä aiheutti mitä.","Jos samassa virkkeessä on sekä luku että syy, koko virke on päätelmä. Havainto ja päätelmä kannattaa kirjoittaa eri virkkeisiin, jotta näet itsekin, kumpi on kumpi."]},{"tyyppi":"taulukko","otsikko":"Havainto vai päätelmä","otsikkorivi":["Virke","Kumpi","Mistä sen tietää"],"rivit":[["Lämpimässä luokassa iti 8 siementä.","Havainto","Luku on taulukossa."],["Kylmässä iti vähemmän siemeniä kuin lämpimässä.","Havainto","Vertaa kahta mitattua lukua."],["Lämpö auttoi siemeniä itämään, koska lämpimässä iti enemmän.","Päätelmä","Kertoo syyn ja nojaa havaintoon."],["Kylmässä ei idä koskaan mikään.","Päätelmä","Yleistää yhdestä ruukusta kaikkiin."],["Kylmässä iti vain 3 siementä, koska siellä oli liian kylmä.","Päätelmä","Luvun lisäksi virkkeessä on syy."]]},{"tyyppi":"kappale","otsikko":"Päätelmän pitää nojata havaintoon","sisalto":"Päätelmä on hyvä silloin, kun voit näyttää, mihin havaintoon se perustuu. Kun kerrot päätelmäsi muille, sano se muodossa \"havainto, joten päätelmä\": \"Suolatussa kulhossa suli 6 palaa ja toisessa 2, joten suola nopeutti sulamista.\" Tällainen virke on päätelmä, jolla on perustelu — tutkimusvihkoon havainto ja päätelmä kirjataan silti eri riveille. Jos päätelmän alkuosa on ristiriidassa taulukon kanssa, koko päätelmä kaatuu. Tarkista aina ensin, pitääkö havainto paikkansa, ja vasta sitten, seuraako päätelmä siitä. Kun väite sanoo \"joka kerta\" tai \"jokaisessa\", laske taulukosta, montako mittausta väitettä todella tukee — jos yksikin jää ulkopuolelle, väite on liian suuri."},{"tyyppi":"ansa","otsikko":"Ansa 1: havainto ja tulkinta samassa virkkeessä","sisalto":"\"Kasvi B kuihtui, koska se ei saanut vettä.\" Tämä kuulostaa havainnolta, mutta siihen on piilotettu päätelmä. Havainto on vain se, että kasvi B oli lopussa 9 cm ja sen lehdet olivat veltot. Se, että syy oli veden puute, on päätelty — ja se voi olla oikein tai väärin. Kun kirjaat havaintoja tutkimusvihkoon, kirjoita vain se, minkä näit. Syyn ehdit lisätä myöhemmin omaan virkkeeseensä, ja silloin näet itsekin, mikä osa on varmaa ja mikä on ajateltua."},{"tyyppi":"ansa","otsikko":"Ansa 2: päätelmä menee pidemmälle kuin aineisto","sisalto":"Torilla mitattiin lämpötila yhden kerran, ja se oli kylmempi kuin koulun pihalla. Siitä ei voi sanoa, että torilla on aina kylmempää: yksi mittaus kertoo yhdestä hetkestä. Sama koskee paikkoja, joita ei mitattu lainkaan — jos mittasit oman pihan lumikasaa, et tiedä naapurin lumesta mitään. Kun päätelmässä on sana aina, kaikki, joka päivä tai huomenna, kysy: montako kertaa asia mitattiin, ja mitattiinko juuri sitä paikkaa ja päivää, josta päätelmä puhuu."},{"tyyppi":"kappale","otsikko":"Samaan aikaan ei tarkoita samaa kuin syy","sisalto":"Uimarannalla oli paljon uimareita samoina päivinä, kun kioski myi paljon jäätelöä. Siitä ei seuraa, että jäätelö saa ihmiset uimaan. Molemmat johtuvat samasta asiasta: lämpimästä säästä. Kun kaksi asiaa tapahtuu samaan aikaan, se on havainto. Se, että toinen aiheutti toisen, on päätelmä, ja usein väärä. Ennen kuin sanot \"tämä aiheutti tuon\", mieti, mikä kolmas asia voisi selittää molemmat — ja mittaa se."},{"tyyppi":"muistilappu","otsikko":"Muista nämä","kohdat":["Havainnon voit osoittaa taulukosta. Päätelmää et voi.","Syy, yleistys tai ennuste tekee virkkeestä päätelmän — myös silloin, kun virkkeessä on luku.","Koska on vihje, ei sääntö: jos virke ei lisää mitään mittaamatonta, se on havainto.","Sano päätelmä muodossa \"havainto, joten päätelmä\".","Yksi mittaus ei riitä sanaan aina.","Samaan aikaan tapahtuminen ei todista syytä."]}],"harjoitusryhmat":[{"id":"erota","nimi":"Havainto vai päätelmä","info":"Voitko osoittaa virkkeen taulukosta? Silloin se on havainto."},{"id":"tuki","nimi":"Tukevatko havainnot päätelmää","info":"Tarkista päätelmän alkuosa taulukosta ja laske, montako mittausta väitettä tukee."},{"id":"pidemmalle","nimi":"Liian pitkälle menevä päätelmä","info":"Montako kertaa mitattiin, ja mitattiinko sitä, mistä päätelmä puhuu?"}],"harjoitukset":[{"id":"H01","ryhma":"erota","kysymys":"Luokka tutki, hidastaako kansi veden jäähtymistä. Kahteen samanlaiseen mukiin kaadettiin yhtä kuumaa vettä, ja toisen päälle laitettiin kansi. Lämpötila mitattiin uudelleen välitunnin jälkeen.\nAlussa, molemmat mukit: 57 astetta\nVälitunnin jälkeen, kannellinen muki: 46 astetta\nVälitunnin jälkeen, kanneton muki: 38 astetta\n\nVirkkeet:\n1. Alussa vesi oli molemmissa mukeissa 57 astetta.\n2. Kansi hidasti jäähtymistä, koska kannellinen muki pysyi lämpimämpänä.\n3. Välitunnin jälkeen kannettomassa mukissa vesi oli 38 astetta.\n4. Kannellisessa mukissa vesi oli lämpimämpää kuin kannettomassa.\n\nMontako virkkeistä on havaintoja?","vastaus":3,"vinkki":"Havainnon voit osoittaa taulukosta sormella. Etsi virke, joka kertoo syyn — se ei ole havainto.","selitys":"Virkkeet 1, 3 ja 4 kertovat vain sen, mitä mitattiin: kaksi lukua ja niiden vertailun. Virke 2 kertoo syyn (koska), joten se on päätelmä. Havaintoja on 3."},{"id":"H02","ryhma":"erota","kysymys":"Luokka tutki, vaikuttaako lämpö siementen itämiseen. Kahteen ruukkuun kylvettiin 10 herneen siementä, toinen ruukku oli lämpimässä luokassa ja toinen kylmässä eteisessä. Viikon kuluttua laskettiin itäneet siemenet.\nLämmin luokka: 9 itänyttä siementä\nKylmä eteinen: 2 itänyttä siementä\n\nVirkkeet:\n1. Lämpö auttoi siemeniä itämään, koska lämpimässä iti enemmän siemeniä.\n2. Kylmässä eteisessä iti 2 siementä.\n3. Kylmässä ei idä koskaan yksikään siemen.\n4. Lämpimässä luokassa iti 9 siementä.\n5. Kylmässä eteisessä iti vain 2 siementä, koska siellä oli herneille liian kylmä.\n\nMontako virkkeistä on päätelmiä?","vastaus":3,"vinkki":"Päätelmässä on syy, yleistys tai ennuste. Jos virkkeessä on luku ja lisäksi syy, se on silti päätelmä.","selitys":"Virke 1 kertoo syyn, virke 3 yleistää sanalla koskaan, ja virke 5 kertoo luvun mutta lisää siihen syyn — koko virke on silloin päätelmä. Virkkeet 2 ja 4 ovat havaintoja. Päätelmiä on 3."},{"id":"H03","ryhma":"erota","tyyppi":"monivalinta","kysymys":"Virke: \"Lumi suli pihalta, koska aurinko paistoi.\"\n\nMikä tekee tästä virkkeestä päätelmän?","vaihtoehdot":["Se on menneessä aikamuodossa.","Siinä kerrotaan syy.","Siinä ei ole lukua."],"vastaus":1,"vinkki":"Katso, mitä virke sanoo sen lisäksi, että lumi suli.","selitys":"Se, että lumi suli, on havainto. Virke lisää siihen syyn: koska aurinko paistoi. Syy ei näy lumessa, se on päätelty. Aikamuoto tai luvut eivät ratkaise asiaa."},{"id":"H04","ryhma":"erota","kysymys":"Luokka mittasi lämpötilan koulun pihalla samasta paikasta kolme kertaa saman päivän aikana.\nKlo 8: 3 astetta\nKlo 12: 10 astetta\nKlo 15: 13 astetta\n\nVirkkeet:\n1. Klo 8 lämpötila oli 3 astetta.\n2. Klo 15 oli lämpimämpää kuin klo 8.\n3. Koulun pihalla on joka päivä iltapäivällä yli 12 astetta.\n4. Klo 12 lämpötila oli 10 astetta.\n5. Huomenna klo 15 on täsmälleen yhtä lämmintä.\n\nMontako virkkeistä on havaintoja?","vastaus":3,"vinkki":"Vertailu kahden mitatun luvun välillä on havainto. Yleistys ja ennuste eivät ole.","selitys":"Virkkeet 1 ja 4 ovat taulukon lukuja, ja virke 2 vertaa kahta mitattua lukua — senkin voi tarkistaa taulukosta. Virke 3 puhuu joka päivästä, vaikka mitattiin yksi päivä, ja virke 5 ennustaa huomista. Havaintoja on 3."},{"id":"H05","ryhma":"erota","kysymys":"Pihalle tehtiin kaksi yhtä korkeaa lumikasaa, toinen aurinkoiseen paikkaan ja toinen talon varjoon. Korkeus mitattiin aamulla ja iltapäivällä.\nAamulla, molemmat kasat: 24 cm\nIltapäivällä, aurinkoinen paikka: 8 cm\nIltapäivällä, varjo: 19 cm\n\nVirkkeet:\n1. Aamulla molemmat kasat olivat 24 cm korkeita.\n2. Iltapäivällä aurinkoisessa paikassa lunta oli jäljellä 8 cm.\n3. Varjossa ollut kasa oli iltapäivällä korkeampi kuin aurinkoisessa paikassa ollut.\n4. Aurinko sulatti lunta, koska aurinkoisessa paikassa kasa mataloitui enemmän.\n5. Iltapäivällä varjossa lunta oli jäljellä 19 cm.\n\nMonesko virke on ainoa päätelmä?","vastaus":4,"vinkki":"Neljä virkettä voi osoittaa taulukosta. Yksi kertoo, miksi luvut ovat sellaisia kuin ovat.","selitys":"Virke 4 kertoo syyn: aurinko sulatti. Sitä ei voi osoittaa taulukosta, vaan se on päätelty luvuista. Kaikki muut virkkeet ovat lukuja tai lukujen vertailua."},{"id":"H06","ryhma":"erota","kysymys":"Luokassa oli kaksi samanlaista kasvia samalla ikkunalaudalla. Kasvia A kasteltiin säännöllisesti, kasvia B ei kasteltu lainkaan. Kasvit mitattiin alussa ja kahden viikon kuluttua.\nAlussa, molemmat kasvit: 7 cm\nKahden viikon kuluttua, kasvi A: 15 cm\nKahden viikon kuluttua, kasvi B: 8 cm\n\nVirkkeet:\n1. Kasvi B oli lopussa vain 8 cm, koska se ei saanut vettä.\n2. Kahden viikon kuluttua kasvi A oli 15 cm pitkä.\n3. Kastelu auttoi kasvia kasvamaan, koska kasteltu kasvi A kasvoi enemmän.\n4. Kaikki kasvit kuolevat, jos niitä ei kastella joka päivä.\n5. Kasvi B oli lopussa lyhyempi kuin kasvi A.\n\nMontako virkkeistä on päätelmiä?","vastaus":3,"vinkki":"Virke 1 alkaa luvulla. Lue se loppuun asti ennen kuin päätät.","selitys":"Virke 1 sisältää havainnon (8 cm) ja päätelmän (koska se ei saanut vettä) — koko virke lasketaan päätelmäksi. Virke 3 kertoo syyn ja virke 4 yleistää kaikkiin kasveihin. Päätelmiä on 3; virkkeet 2 ja 5 ovat havaintoja."},{"id":"H07","ryhma":"erota","tyyppi":"monivalinta","kysymys":"Kahteen kulhoon laitettiin 8 jääpalaa. Toiseen ripoteltiin suolaa. Ruokavälitunnin jälkeen laskettiin, montako jääpalaa oli sulanut kokonaan.\nSuolattu kulho: 7 palaa sulanut\nKulho ilman suolaa: 3 palaa sulanut\n\nMikä näistä virkkeistä on havainto?","vaihtoehdot":["Suola sulattaa aina kaiken jään.","Suolatussa kulhossa suli 7 palaa.","Jää suli, koska suola teki siitä pehmeää."],"vastaus":1,"vinkki":"Havainnon voi osoittaa taulukosta. Yleistys (aina) ja syy paljastavat päätelmän.","selitys":"Vain virke \"Suolatussa kulhossa suli 7 palaa\" on suoraan taulukosta. Ensimmäinen vaihtoehto yleistää (aina, kaiken), ja kolmas kertoo syyn (koska)."},{"id":"H08","ryhma":"tuki","kysymys":"Kaksi samanlaista leipäpalaa laitettiin pusseihin. Toinen pussi pantiin jääkaappiin ja toinen jätettiin luokan pöydälle. Viikon kuluttua laskettiin hometäplät.\nJääkaappi: 0 hometäplää\nPöytä: 6 hometäplää\n\nVirkkeet:\n1. Jääkaapissa olleessa leivässä oli 0 hometäplää.\n2. Kylmä hidasti homeen kasvua, koska jääkaapissa leipä homehtui vähemmän.\n3. Jääkaapissa ruoka ei homehdu koskaan.\n4. Pöydällä olleessa leivässä oli enemmän hometta kuin jääkaapissa olleessa.\n\nMonesko virke on päätelmä, jota havainnot eivät tue?","vastaus":3,"vinkki":"Kaksi virkettä on päätelmiä. Kumpi niistä sanoo enemmän kuin yksi leipä viikossa voi kertoa?","selitys":"Virke 3 sanoo koskaan, vaikka mitattiin yksi leipä yhden viikon ajan. Sitä havainnot eivät tue. Virke 2 on myös päätelmä, mutta se pysyy siinä, mitä mitattiin: jääkaapissa homehtui vähemmän."},{"id":"H09","ryhma":"tuki","kysymys":"Sara mittasi pihalla pystyssä olevan kepin varjon pituuden kolme kertaa saman päivän aikana.\nKlo 9: 115 cm\nKlo 12: 42 cm\nKlo 15: 88 cm\n\nVirkkeet:\n1. Aurinko oli korkeimmalla keskipäivällä, koska varjo oli silloin lyhin.\n2. Klo 9 varjo oli 115 cm pitkä.\n3. Klo 12 varjo oli lyhyempi kuin klo 9.\n4. Huomenna varjo on klo 12 täsmälleen yhtä pitkä.\n\nMonesko virke on päätelmä, jota havainnot eivät tue?","vastaus":4,"vinkki":"Yhden päivän mittaukset kertovat siitä päivästä. Mikä virke puhuu jostakin muusta päivästä?","selitys":"Virke 4 ennustaa huomista, vaikka huomista ei mitattu. Virke 1 on päätelmä, jota havainnot tukevat: varjo oli todella lyhin klo 12. Virkkeet 2 ja 3 ovat havaintoja."},{"id":"H10","ryhma":"tuki","kysymys":"Luokka pudotti saman pallon pöydän korkeudelta kolme kertaa lattialle ja kolme kertaa matolle ja mittasi pompun korkeuden.\nLattia, pudotus 1: 57 cm\nLattia, pudotus 2: 61 cm\nLattia, pudotus 3: 59 cm\nMatto, pudotus 1: 33 cm\nMatto, pudotus 2: 36 cm\nMatto, pudotus 3: 34 cm\n\nVäite: Lattialla pallo pomppasi joka kerta yli 58 cm.\n\nMontako mittausta tukee väitettä?","vastaus":2,"vinkki":"Katso vain lattian kolme mittausta. Vertaa jokaista lukua rajaan 58.","selitys":"Lattian pomput olivat 57, 61 ja 59 cm. Yli 58 cm ovat 61 ja 59, eli kaksi mittausta. Koska yksi mittaus jää alle, väite joka kerta ei pidä paikkaansa — kaksi kolmesta ei ole joka kerta."},{"id":"H11","ryhma":"tuki","kysymys":"Luokka mittasi lämpötilan koulun neljässä tilassa samaan aikaan.\nLuokka: 22 astetta\nKäytävä: 19 astetta\nLiikuntasali: 18 astetta\nEteinen: 15 astetta\n\nVäite: Lämpötila oli jokaisessa tilassa vähintään 18 astetta.\n\nMontako mittausta tukee väitettä?","vastaus":3,"vinkki":"Vähintään 18 tarkoittaa 18 tai enemmän. Käy tilat läpi yksi kerrallaan.","selitys":"Luokka 22, käytävä 19 ja liikuntasali 18 ovat vähintään 18. Eteinen 15 ei ole. Väitettä tukee kolme mittausta neljästä, joten sana jokaisessa on väärin."},{"id":"H12","ryhma":"tuki","kysymys":"Luokka tutki, liukeneeko sokeri paremmin lämpimään vai kylmään veteen. Kahteen lasiin kaadettiin ruokalusikallinen vettä, toiseen lämmintä ja toiseen kylmää, ja sokeripaloja lisättiin yksi kerrallaan, kunnes sokeri ei enää liuennut.\nLämmin vesi: 10 palaa liukeni\nKylmä vesi: 7 palaa liukeni\n\nVirkkeet:\n1. Lämpimään veteen liukeni 10 sokeripalaa.\n2. Kylmään veteen liukeni enemmän sokeria, joten kylmä vesi liuottaa paremmin.\n3. Lämpimään veteen liukeni enemmän sokeria kuin kylmään.\n4. Lämpö auttoi sokeria liukenemaan, koska lämpimään veteen liukeni useampi pala.\n\nMonesko virke on päätelmä, jota havainnot eivät tue?","vastaus":2,"vinkki":"Tarkista päätelmän alkuosa taulukosta. Onko se totta?","selitys":"Virke 2 väittää, että kylmään liukeni enemmän. Taulukko sanoo päinvastoin: lämpimään 10, kylmään 7. Päätelmä, joka alkaa väärästä havainnosta, ei voi olla tuettu. Virke 4 on tuettu päätelmä."},{"id":"H13","ryhma":"tuki","kysymys":"Luokka mittasi lämpötilan koulun pihalla neljä kertaa päivän aikana.\nKoulun piha klo 8: 2 astetta\nKoulun piha klo 10: 4 astetta\nKoulun piha klo 12: 7 astetta\nKoulun piha klo 14: 8 astetta\nParkkipaikka klo 12: 9 astetta\n\nVäite: Parkkipaikalla on aina lämpimämpää kuin koulun pihalla.\n\nMontako parkkipaikan mittausta taulukossa on?","vastaus":1,"vinkki":"Laske taulukosta rivit, joilla lukee parkkipaikka.","selitys":"Parkkipaikalla mitattiin yhden kerran. Yhdestä mittauksesta ei voi sanoa aina — se sopi vain yhteen hetkeen yhtenä päivänä. Pihalla mitattiin neljä kertaa, mutta sekin on vain yksi päivä."},{"id":"H14","ryhma":"tuki","kysymys":"Eetu laski neljänä aamuna kastemadot pihatieltä ja kirjasi, oliko yöllä satanut.\nMaanantai: satoi, 11 matoa\nTiistai: ei satanut, 1 mato\nKeskiviikko: satoi, 6 matoa\nTorstai: ei satanut, 0 matoa\n\nVäite: Sateen jälkeen pihatiellä oli aina yli 10 matoa.\n\nMontako mittausta tukee väitettä?","vastaus":1,"vinkki":"Katso vain sadeaamut. Vertaa niiden lukuja rajaan 10.","selitys":"Sadeaamuja on kaksi: maanantai 11 matoa ja keskiviikko 6 matoa. Yli 10 on vain maanantai. Väitettä tukee yksi mittaus kahdesta, joten aina on liikaa sanottu — vaikka sateen jälkeen matoja olikin enemmän kuin kuivina aamuina."},{"id":"H15","ryhma":"pidemmalle","kysymys":"Luokka laski lintulaudalla käyneet linnut kolmena aamuna saman välitunnin aikana.\nMaanantai: 10 lintua\nTiistai: 5 lintua\nKeskiviikko: 14 lintua\n\nVirkkeet:\n1. Keskiviikkona lintuja kävi eniten.\n2. Tiistaina lintuja kävi vähemmän kuin maanantaina.\n3. Kaikilla Suomen lintulaudoilla käy keskiviikkoisin eniten lintuja.\n4. Tiistaina lintuja kävi 5.\n\nMonesko virke on päätelmä, jota havainnot eivät tue?","vastaus":3,"vinkki":"Mitattiin yhtä lintulautaa yhdellä pihalla. Mikä virke puhuu muista lintulaudoista?","selitys":"Virke 3 puhuu kaikista Suomen lintulaudoista, vaikka laskettiin yksi lauta kolmena aamuna. Päätelmä menee paljon pidemmälle kuin aineisto. Virkkeet 1, 2 ja 4 ovat havaintoja."},{"id":"H16","ryhma":"pidemmalle","kysymys":"Ville mittasi lumen syvyyden pihalla ja metsässä.\nPiha maanantai: 21 cm\nPiha tiistai: 20 cm\nPiha keskiviikko: 23 cm\nPiha torstai: 22 cm\nMetsä tiistai: 29 cm\n\nVäite: Metsässä on aina enemmän lunta kuin pihalla.\n\nMontako metsän mittausta taulukossa on?","vastaus":1,"vinkki":"Etsi rivit, joilla lukee metsä.","selitys":"Metsässä mitattiin kerran. Tiistaina metsässä oli todella enemmän lunta kuin pihalla — se on havainto. Mutta aina tarkoittaa jokaista päivää, ja siitä yksi mittaus ei kerro mitään."},{"id":"H17","ryhma":"pidemmalle","tyyppi":"monivalinta","kysymys":"Uimarannalla laskettiin kolmena päivänä uimarit ja kioskin myymät jäätelöt.\nMaanantai: 38 uimaria, 30 jäätelöä\nTiistai: 10 uimaria, 8 jäätelöä\nKeskiviikko: 52 uimaria, 45 jäätelöä\n\nJoku päätteli: \"Jäätelön syöminen saa ihmiset menemään uimaan.\" Mitä pitäisi tehdä, ennen kuin näin voi sanoa?","vaihtoehdot":["Laskea uimarit vielä useampana päivänä.","Kirjata myös päivän lämpötila ja katsoa, selittääkö se molemmat luvut.","Laskea jäätelöt tarkemmin."],"vastaus":1,"vinkki":"Kaksi asiaa tapahtui samaan aikaan. Mikä kolmas asia voisi selittää molemmat?","selitys":"Uimarit ja jäätelöt kasvavat samoina päivinä, mutta kumpikaan ei aiheuta toista: lämmin sää selittää molemmat. Ennen syy-päätelmää pitää sulkea pois yhteinen syy — esimerkiksi kirjaamalla lämpötila. Lisää laskentapäiviä samasta asiasta ei ratkaise tätä, eikä jäätelöiden laskeminen tarkemmin."},{"id":"H18","ryhma":"pidemmalle","kysymys":"Aino kirjasi neljänä aamuna pihan lämpötilan ja sen, oliko pihan lätäkkö jäässä.\nMaanantai: -4 astetta, lätäkkö jäässä\nTiistai: 2 astetta, lätäkkö ei jäässä\nKeskiviikko: -1 aste, lätäkkö jäässä\nTorstai: 3 astetta, lätäkkö ei jäässä\n\nVirkkeet:\n1. Maanantaina lätäkkö oli jäässä.\n2. Pakkanen jäädytti lätäkön, koska jäässä se oli vain niinä aamuina, kun lämpötila oli alle nollan.\n3. Torstaina lämpötila oli 3 astetta.\n4. Lätäkkö pysyy jäässä koko talven.\n\nMonesko virke on päätelmä, jota havainnot eivät tue?","vastaus":4,"vinkki":"Taulukossa on neljä aamua. Mikä virke puhuu paljon pidemmästä ajasta?","selitys":"Virke 4 puhuu koko talvesta, vaikka kirjattiin neljä aamua — ja niistä kahtena lätäkkö ei edes ollut jäässä. Virke 2 on päätelmä, jota havainnot tukevat: jäässä oli vain pakkasaamuina."},{"id":"H19","ryhma":"pidemmalle","kysymys":"Luokka tutki, lentääkö paperilennokki pidemmälle, kun sen nokkaan kiinnitetään paperiliitin. Sama lennokki heitettiin kolme kertaa ilman liitintä ja kolme kertaa liittimen kanssa.\nIlman liitintä, heitto 1: 4 m\nIlman liitintä, heitto 2: 3 m\nIlman liitintä, heitto 3: 5 m\nLiittimen kanssa, heitto 1: 8 m\nLiittimen kanssa, heitto 2: 6 m\nLiittimen kanssa, heitto 3: 9 m\n\nVäite: Liittimen kanssa lennokki lensi joka heitolla vähintään 7 metriä.\n\nMontako mittausta tukee väitettä?","vastaus":2,"vinkki":"Katso vain liittimen kanssa tehdyt heitot.","selitys":"Liittimen kanssa heitot olivat 8, 6 ja 9 m. Vähintään 7 m ovat 8 ja 9, eli kaksi heittoa. Liitin auttoi selvästi, mutta väite joka heitolla ei silti pidä paikkaansa — siksi kannattaa sanoa vain se, minkä mittaukset näyttävät."},{"id":"H20","ryhma":"pidemmalle","kysymys":"Kahteen kulhoon laitettiin 10 jääpalaa. Toiseen ripoteltiin suolaa. Ruokavälitunnin jälkeen laskettiin, montako jääpalaa oli sulanut kokonaan.\nSuolattu kulho: 8 palaa sulanut\nKulho ilman suolaa: 3 palaa sulanut\n\nVirkkeet:\n1. Suolatussa kulhossa oli sulanut 8 jääpalaa.\n2. Suola nopeutti jään sulamista, koska suolatussa kulhossa suli useampi pala.\n3. Kulhossa ilman suolaa oli sulanut 3 jääpalaa.\n4. Suolalla saa aina jään sulamaan kokonaan.\n\nMonesko virke on päätelmä, jota havainnot eivät tue?","vastaus":4,"vinkki":"Suolatussakin kulhossa jäi paloja sulamatta. Mikä virke ei sovi siihen?","selitys":"Virke 4 sanoo, että suola sulattaa aina kaiken. Taulukko näyttää, että suolatussa kulhossa kaksi palaa oli vielä sulamatta, ja lisäksi kokeita tehtiin vain yksi. Virke 2 on päätelmä, jota havainnot tukevat."}],"valmis_teksti":"Erotat sen, mitä havaitsit, siitä, mitä siitä päättelit, ja osaat perustella päätelmäsi havainnolla. Tämä taito on nyt näytetty."};

const esc = s => s;

      return `<div class="box"><h3>${esc(o.otsikko)}</h3><div class="tablewrap"><table><thead><tr>${

        o.rivit.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join("")}</tr>`).join("")}</tbody></table></div></div>`;
    case "ansa":
      return `<div class="box warn"><h3>${esc(o.otsikko)}</h3><p style="margin:0">${esc(o.sisalto)}</p></div>`;
    case "muistilappu":
      return `<div class="box note"><h3>${esc(o.otsikko)}</h3><ul class="notes">${
        o.kohdat.map(k=>`<li>${esc(k)}</li>`).join("")}</ul></div>`;
    case "numerotaulu":
      return `<div class="box nt"><h3>${esc(o.otsikko)}</h3><p class="ohje">${esc(o.sisalto)}</p>
        <div class="nt-valinta" id="ntValinta"></div>
        <div class="nt-taulu" id="ntTaulu"></div>
        <p class="nt-selite" id="ntSelite"></p></div>`;
    case "vahvuusportaat":
      return `<div class="box vp"><h3>${esc(o.otsikko)}</h3><p class="ohje">${esc(o.sisalto)}</p>
        <div class="vp-tasot">${o.tasot.map(t=>
          `<div class="vp-taso" data-taso="${t.id}"><span class="vp-pallo"></span>
           <div><strong>${t.nimi}</strong><span>${t.selite}</span></div></div>`).join("")}</div>
        <div class="vp-lauseke" id="vpLauseke"></div>
        <div class="vp-rivi"><button type="button" class="btn ghost" id="vpSeuraava">Toinen lauseke</button>

const svg=document.getElementById("nlsvg"), rng=document.getElementById("nlrange"), out=document.getElementById("nlout");
const X0=34, X1=606, Y=62;
function piirraNL(v){
  const ala=Math.floor(v/10)*10, yla=ala+10, puoli=ala+5;
  const pyor = (v%10)>=5 ? yla : ala;
  const x = n => X0 + (n/100)*(X1-X0);
  let s=`<line class="rail" x1="${X0}" y1="${Y}" x2="${X1}" y2="${Y}"/>`;
  for(let n=0;n<=100;n+=10){
    const near = (n===ala||n===yla);
    s+=`<line class="tick" x1="${x(n)}" y1="${Y-7}" x2="${x(n)}" y2="${Y+7}"/>`;
    s+=`<text class="stop${near?" near":""}" x="${x(n)}" y="${Y+24}" text-anchor="middle">${n}</text>`;
  }
  s+=`<line class="halfway" x1="${x(puoli)}" y1="${Y-16}" x2="${x(puoli)}" y2="${Y+12}"/>`;
  s+=`<text class="stop" x="${x(puoli)}" y="${Y-22}" text-anchor="middle">puoliväli ${puoli}</text>`;
  s+=`<circle class="dot" cx="${x(v)}" cy="${Y}" r="6"/>`;
  s+=`<text class="val" x="${x(v)}" y="${Y-32}" text-anchor="middle">${v}</text>`;
  s+=`<path d="M ${x(v)} ${Y+38} L ${x(pyor)} ${Y+38}" stroke="var(--core)" stroke-width="2" fill="none"/>`;
  s+=`<path d="M ${x(pyor)} ${Y+38} l ${x(pyor)>x(v)?-7:7} -4 l 0 8 z" fill="var(--core)"/>`;
  svg.innerHTML=s;
  out.textContent = `${v} pyöristyy → ${pyor}`;
}

/* ---------- laskujärjestys-widget ---------- */
const ljExp=document.getElementById("ljExp");
if(ljExp && D.kokeilu){
  let ljI=0, ljTokens=[], ljStep=0;
  const laske=(a,op,b)=>{a=+a;b=+b;return op==="×"?a*b:op==="÷"?a/b:op==="+"?a+b:a-b;};
  function ljAlku(){
    const l=D.kokeilu[ljI];
    ljTokens=l.lauseke.replace(/\(/g,"( ").replace(/\)/g," )").split(/\s+/).filter(Boolean);
    ljStep=0; ljPiirra(); ljViesti("","");
  }
  function ljViesti(t,lk){const f=document.getElementById("ljFb"); f.textContent=t; f.className="lj-fb "+(lk||"");}
  function ljPiirra(){
    const l=D.kokeilu[ljI];
    document.getElementById("ljStep").textContent =
      ljStep>=l.askeleet.length ? "valmis" : `askel ${ljStep+1} / ${l.askeleet.length}`;
    if(ljStep>=l.askeleet.length){
      ljExp.innerHTML=`<span class="valmis">${l.lauseke} = ${l.vastaus}</span>`;
      return;
    }
    ljExp.innerHTML=ljTokens.map((t,i)=>
      "×÷+−".includes(t) ? `<button type="button" class="op" data-i="${i}">${t}</button>`
                         : `<span class="tok">${t}</span>`).join("");
    ljExp.querySelectorAll("button.op").forEach(b=>b.addEventListener("click",()=>ljKlikkaa(+b.dataset.i)));
  }
  function ljKlikkaa(i){
    const l=D.kokeilu[ljI], odotettu=l.askeleet[ljStep];
    const ehdotus=[ljTokens[i-1],ljTokens[i],ljTokens[i+1]].join(" ");
    if(ehdotus!==odotettu){
      ljViesti(ljStep===0
        ? "Ei vielä. Sulkeet ovat vahvimmat, sitten kerto ja jako. Yhtä vahvat vasemmalta oikealle."
        : "Ei vielä. Kumpi jäljellä olevista on vahvempi?", "no");
      return;
    }
    const arvo=laske(ljTokens[i-1],ljTokens[i],ljTokens[i+1]);
    let alku=i-1, loppu=i+1;
    if(ljTokens[i-2]==="(" && ljTokens[i+2]===")"){ alku=i-2; loppu=i+2; }
    ljTokens.splice(alku, loppu-alku+1, String(arvo));
    ljStep++;
    ljViesti(ljStep>=l.askeleet.length ? "Valmis. Vastaus on "+l.vastaus+"." : "Oikein. Jatka seuraavaan.", "ok");
    ljPiirra();
  }
  document.getElementById("ljSeuraava").addEventListener("click",()=>{
    ljI=(ljI+1)%D.kokeilu.length; ljAlku();
  });
  ljAlku();
}

/* Suomalainen lukumuoto: välilyönti on tuhaterotin, pilkku desimaalierotin.
   Piste voi olla kumpi tahansa. Se tulkitaan tuhaterottimeksi VAIN silloin, kun
   koko luku on aitoa tuhaterotinmuotoa: alkuosa 1–3 numeroa ilman etunollaa ja
   jokainen jatko-osa täsmälleen 3 numeroa (1.500, 12.345.678). Kaikissa muissa
   tapauksissa piste on desimaalipiste — myös 0.125, joka vanhalla säännöllä
   ("3 numeroa pisteen jäljessä = tuhaterotin") luettiin virheellisesti luvuksi 125. */
const TUHATEROTIN = /^[1-9]\d{0,2}(\.\d{3})+$/;
function lueLuku(teksti){
  // Murtoluku (3/4, -3/4) ja sekaluku (1 2/3, -1 2/3) hyväksytään sellaisinaan.
  const raaka = String(teksti).replace(/\u00a0/g, " ").trim();
  let m = raaka.match(/^(-?)(\d+)\s+(\d+)\s*\/\s*(\d+)$/);
  if(m){ const nim = Number(m[4]); if(nim === 0) return null;
    const v = Number(m[2]) + Number(m[3]) / nim; return m[1] ? -v : v; }
  m = raaka.match(/^(-?)\s*(\d+)\s*\/\s*(\d+)$/);
  if(m){ const nim = Number(m[3]); if(nim === 0) return null;
    const v = Number(m[2]) / nim; return m[1] ? -v : v; }
  let s = String(teksti).replace(/[\s\u00a0]/g, "");
  if(s === "") return null;
  if(s.indexOf(",") >= 0){
    s = s.replace(/\./g, "").replace(",", ".");
  } else if(TUHATEROTIN.test(s)){
    s = s.replace(/\./g, "");
  }
  const n = Number(s);
  return Number.isFinite(n) ? n : null;
}

function tarkista(id){
  const h=D.harjoitukset.find(x=>x.id===id);
  const kentta=document.getElementById("in-"+id);
  const fb=document.getElementById("fb-"+id);
  if(kentta.value.trim()===""){ fb.className="fb hint"; fb.textContent="Kirjoita vastaus ensin."; return; }
  const luku=lueLuku(kentta.value);
  if(luku===null){ fb.className="fb no"; fb.textContent="Vastauksen pitää olla luku tai murtoluku (esimerkiksi 3/4)."; return; }
  const oikein = Math.abs(luku - h.vastaus) < 1e-9;
  merkitseTulos(id, oikein, oikein ? "Oikein. "+h.selitys : `Ei vielä. ${h.vinkki} Kokeile uudelleen.`);
}

function tarkistaMonivalinta(id, valittuIndeksi, painike){
  const h=D.harjoitukset.find(x=>x.id===id);
  const rivi=painike.closest(".row");
  rivi.querySelectorAll(".mv-valinta").forEach(b=>b.disabled=true);
  const oikein = valittuIndeksi===h.vastaus;
  painike.classList.add(oikein?"mv-oikein":"mv-vaarin");
  if(!oikein){
    const oikeaBtn=rivi.querySelector(`[data-i="${h.vastaus}"]`);
    if(oikeaBtn) oikeaBtn.classList.add("mv-oikein");
  }
  merkitseTulos(id, oikein, oikein ? "Oikein. "+h.selitys : `Ei ihan. Oikea vastaus on korostettu. ${h.selitys||""}`);
}

/* Kuuntelu: selain lukee tekstin ääneen omalla puhesynteesillään (englanniksi, jos laitteessa on
   englanninkielinen ääni). Ei äänitiedostoja eikä verkkoyhteyttä. Jos laite ei osaa puhua,
   teksti näytetään luettavaksi — silloin tehtävä muuttuu luetun ymmärtämiseksi, mutta ei katkea. */
function puhu(id, nopeus){
  const h=D.harjoitukset.find(x=>x.id===id); if(!h || !h.kuuntele) return;
  const vara=document.getElementById("vara-"+id);
  const naytaTeksti=syy=>{ vara.hidden=false; vara.textContent=syy+" Teksti: "+h.kuuntele; };
  if(!("speechSynthesis" in window)){ naytaTeksti("Tämä laite ei osaa lukea ääneen."); return; }
  const s=window.speechSynthesis; s.cancel();
  const u=new SpeechSynthesisUtterance(h.kuuntele);
  u.lang=h.kieli||"en-GB"; u.rate=nopeus;
  const aanet=s.getVoices(), kieli=u.lang.slice(0,2);
  const aani=aanet.find(a=>a.lang===u.lang) || aanet.find(a=>a.lang && a.lang.startsWith(kieli));
  if(aani) u.voice=aani;
  else if(aanet.length) { naytaTeksti("Laitteessa ei ole englanninkielistä ääntä."); return; }
  u.onerror=()=>naytaTeksti("Ääneen lukeminen ei onnistunut.");
  s.speak(u);
}
