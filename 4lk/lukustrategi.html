<title>Lukustrategi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">

<style>
:root{
  --paper:#EFF2F5; --surface:#FFFFFF; --surface-2:#F7F9FB;
  --grid:#DCE3EA; --line:#C9D3DC;
  --ink:#15222C; --ink-2:#4E626F; --ink-3:#7E8F9B;
  --core:#1B5A9E; --core-soft:#E4EDF6;
  --strong:#1F6E5C; --strong-soft:#E1F0EB;
  --chal:#9A6A16; --chal-soft:#F6EDDC;
  --alert:#A33A2B; --alert-soft:#F8E7E3;
  --shadow:0 1px 2px rgba(21,34,44,.06), 0 8px 24px -12px rgba(21,34,44,.18);
  --r:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0F161B; --surface:#18222A; --surface-2:#1D2830;
    --grid:#22303A; --line:#2E3E4A;
    --ink:#E8EFF4; --ink-2:#A3B4C0; --ink-3:#7A8B97;
    --core:#7FB2E4; --core-soft:#16303F;
    --strong:#77CDB4; --strong-soft:#123028;
    --chal:#E0B267; --chal-soft:#33270F;
    --alert:#E8907F; --alert-soft:#3A1E19;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -14px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --paper:#0F161B; --surface:#18222A; --surface-2:#1D2830;
  --grid:#22303A; --line:#2E3E4A;
  --ink:#E8EFF4; --ink-2:#A3B4C0; --ink-3:#7A8B97;
  --core:#7FB2E4; --core-soft:#16303F;
  --strong:#77CDB4; --strong-soft:#123028;
  --chal:#E0B267; --chal-soft:#33270F;
  --alert:#E8907F; --alert-soft:#3A1E19;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -14px rgba(0,0,0,.7);
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:16px; line-height:1.62;
  background-image:
    linear-gradient(to right, var(--grid) 1px, transparent 1px),
    linear-gradient(to bottom, var(--grid) 1px, transparent 1px);
  background-size:26px 26px;
}
.wrap{max-width:760px; margin:0 auto; padding:28px 20px 90px}
h1,h2,h3,h4{font-family:"Familjen Grotesk","IBM Plex Sans",system-ui,sans-serif; text-wrap:balance}

/* header */
header.top{background:var(--surface); border:1px solid var(--line); border-radius:var(--r);
  box-shadow:var(--shadow); padding:22px 24px; display:flex; gap:18px; align-items:flex-start}
.badge{flex:0 0 auto; width:54px; height:54px; border-radius:9px; display:grid; place-items:center;
  background:var(--core-soft); border:1px solid var(--core); color:var(--core)}
.badge svg{width:28px; height:28px; fill:none; stroke:currentColor; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round}
.eyebrow{font-family:"IBM Plex Mono",monospace; font-size:11px; letter-spacing:.14em;
  text-transform:uppercase; color:var(--ink-3); margin:0 0 5px}
header.top h1{margin:0; font-size:30px; font-weight:700; letter-spacing:-.015em}
header.top p{margin:5px 0 0; color:var(--ink-2); font-size:15px}
.tags{display:flex; flex-wrap:wrap; gap:5px; margin-top:11px}
.tag{font-family:"IBM Plex Mono",monospace; font-size:10.5px; letter-spacing:.05em; padding:2px 7px;
  border-radius:4px; background:var(--surface-2); border:1px solid var(--line); color:var(--ink-3)}
.tag.core{background:var(--core-soft); border-color:var(--core); color:var(--core)}

/* teksti */
article{margin-top:26px}
article h2{font-size:21px; font-weight:600; margin:32px 0 10px; letter-spacing:-.01em}
article p{margin:0 0 14px; max-width:64ch}
.lead{font-size:17.5px; color:var(--ink); border-left:3px solid var(--core); padding-left:16px; margin:0 0 8px}

.box{background:var(--surface); border:1px solid var(--line); border-radius:var(--r);
  padding:18px 22px; box-shadow:var(--shadow); margin:22px 0}
.box h3{margin:0 0 12px; font-size:16.5px; font-weight:600}
.box.warn{border-left:3px solid var(--alert)}
.box.note{border-left:3px solid var(--chal)}

ol.steps{margin:0; padding-left:0; list-style:none; counter-reset:s; display:grid; gap:12px}
ol.steps li{counter-increment:s; display:grid; grid-template-columns:auto 1fr; gap:13px; align-items:start}
ol.steps li::before{content:counter(s); font-family:"Familjen Grotesk",sans-serif; font-weight:700; font-size:14px;
  width:26px; height:26px; border-radius:50%; background:var(--core); color:#fff; display:grid; place-items:center; margin-top:2px}

ul.notes{margin:0; padding-left:19px}
ul.notes li{margin-bottom:7px}
ul.notes li:last-child{margin-bottom:0}

.tablewrap{overflow-x:auto}
table{border-collapse:collapse; width:100%; font-size:14.5px; min-width:460px}
th,td{text-align:left; padding:9px 13px; border-bottom:1px solid var(--line)}
th{font-family:"IBM Plex Mono",monospace; font-size:10.5px; letter-spacing:.1em; text-transform:uppercase;
  color:var(--ink-3); font-weight:400; background:var(--surface-2)}
tr:last-child td{border-bottom:0}
td b{color:var(--core); font-weight:600}
td:last-child{font-variant-numeric:tabular-nums; font-weight:600}

/* lukusuora */
.nl svg{width:100%; height:118px; display:block}
.nl .rail{stroke:var(--line); stroke-width:2}
.nl .tick{stroke:var(--line); stroke-width:1.5}
.nl .stop{fill:var(--ink-3); font-family:"IBM Plex Mono",monospace; font-size:11px}
.nl .stop.near{fill:var(--core); font-weight:600}
.nl .dot{fill:var(--chal)}
.nl .val{fill:var(--ink); font-family:"Familjen Grotesk",sans-serif; font-size:15px; font-weight:700}
.nl .halfway{stroke:var(--chal); stroke-dasharray:3 3; stroke-width:1.5}
.nl-controls{display:flex; align-items:center; gap:14px; margin-top:6px}
.nl-controls input{flex:1; accent-color:var(--core)}
.nl-out{font-family:"Familjen Grotesk",sans-serif; font-size:15px; font-weight:600; min-width:12.5em; text-align:right}

/* paikka-arvotaulu */
.box .ohje{margin:0 0 14px; font-size:14.5px; color:var(--ink-2)}
.nt-valinta{display:flex; flex-wrap:wrap; gap:7px; margin-bottom:16px}
.nt-valinta button{font:inherit; font-size:12.5px; font-family:"IBM Plex Mono",monospace; padding:5px 11px;
  border-radius:6px; border:1px solid var(--line); background:var(--surface-2); color:var(--ink-2); cursor:pointer}
.nt-valinta button[aria-pressed="true"]{background:var(--ink); color:var(--paper); border-color:var(--ink)}
.nt-valinta button:focus-visible{outline:2px solid var(--core); outline-offset:2px}
.nt-taulu{display:flex; flex-direction:column; gap:4px; align-items:flex-start; overflow-x:auto; padding-bottom:4px}
.nt-rivi{display:flex; gap:6px; align-items:center}
.nt-rivi .otsa{font-family:"IBM Plex Mono",monospace; font-size:9.5px; letter-spacing:.08em;
  text-transform:uppercase; color:var(--ink-3); width:52px; text-align:center}
.nt-ruutu{width:52px; height:52px; display:grid; place-items:center; border:1.5px solid var(--line);
  border-radius:7px; background:var(--surface-2); font-family:"IBM Plex Mono",monospace; font-size:24px}
.nt-ruutu.kohta{border-color:var(--core); background:var(--core-soft); color:var(--core); font-weight:500}
.nt-ruutu.ratkaiseva{border-color:var(--chal); background:var(--chal-soft); color:var(--chal); font-weight:500}
.nt-ruutu.nolla{color:var(--ink-3)}
.nt-rivi .nimi{font-size:12.5px; color:var(--ink-3); margin-left:12px; white-space:nowrap}
.nt-nuoli{font-size:17px; color:var(--chal); margin-left:6px}
.nt-selite{margin:14px 0 0; font-size:14.5px}
.nt-selite b{color:var(--core)}

/* vahvuusportaat */
.vp-tasot{display:grid; gap:9px; margin-bottom:18px}
.vp-taso{display:flex; gap:11px; align-items:flex-start; font-size:13.5px}
.vp-taso .vp-pallo{width:13px; height:13px; border-radius:4px; margin-top:5px; flex:0 0 auto}
.vp-taso[data-taso="sulkeet"] .vp-pallo{background:var(--core)}
.vp-taso[data-taso="kertojako"] .vp-pallo{background:var(--strong)}
.vp-taso[data-taso="yhteenvahennys"] .vp-pallo{background:var(--chal)}
.vp-taso strong{display:block; font-family:"Familjen Grotesk",sans-serif; font-weight:600; font-size:14.5px}
.vp-taso span{color:var(--ink-2)}
.vp-lauseke{display:flex; flex-wrap:wrap; gap:7px; align-items:flex-end; font-family:"IBM Plex Mono",monospace;
  font-size:25px; padding:10px 2px; min-height:64px}
.vp-lauseke .t{padding:2px 3px}
.vp-lauseke .op{position:relative; padding:2px 9px; border-radius:6px; font-weight:500}
.vp-lauseke .op[data-taso="sulkeet"]{background:var(--core-soft); color:var(--core)}
.vp-lauseke .op[data-taso="kertojako"]{background:var(--strong-soft); color:var(--strong)}
.vp-lauseke .op[data-taso="yhteenvahennys"]{background:var(--chal-soft); color:var(--chal)}
.vp-lauseke .op i{position:absolute; top:-9px; right:-6px; font-style:normal; font-family:"Familjen Grotesk",sans-serif;
  font-size:11px; font-weight:700; width:18px; height:18px; border-radius:50%; display:grid; place-items:center;
  background:currentColor}
.vp-lauseke .op i span{color:var(--surface)}
.vp-rivi{display:flex; align-items:center; gap:16px; margin-top:8px}
.vp-vastaus{font-family:"Familjen Grotesk",sans-serif; font-size:16px; font-weight:600; color:var(--strong)}

/* laskujärjestys-widget */
.lj-exp{display:flex; flex-wrap:wrap; gap:7px; align-items:center; font-family:"IBM Plex Mono",monospace;
  font-size:23px; padding:14px 4px; min-height:62px}
.lj-exp .tok{padding:2px 4px; color:var(--ink)}
.lj-exp button.op{font-family:"IBM Plex Mono",monospace; font-size:23px; padding:3px 12px; border-radius:7px;
  border:1.5px solid var(--line); background:var(--surface-2); color:var(--ink); line-height:1.2}
.lj-exp button.op:hover{border-color:var(--core); color:var(--core)}
.lj-exp button.op:focus-visible{outline:2px solid var(--core); outline-offset:2px}
.lj-exp .valmis{font-family:"Familjen Grotesk",sans-serif; font-size:23px; font-weight:700; color:var(--strong)}
.lj-fb{font-size:14.5px; min-height:1.5em; color:var(--ink-2)}
.lj-fb.no{color:var(--alert)}
.lj-fb.ok{color:var(--strong)}
.lj-row{display:flex; align-items:center; gap:14px; margin-top:10px}
.lj-step{font-family:"IBM Plex Mono",monospace; font-size:11.5px; letter-spacing:.1em;
  text-transform:uppercase; color:var(--ink-3)}

/* harjoitukset */
.progress{position:sticky; top:0; z-index:5; background:var(--surface); border:1px solid var(--line);
  border-radius:var(--r); padding:12px 18px; box-shadow:var(--shadow); display:flex; align-items:center;
  gap:14px; margin:34px 0 18px}
.progress .lbl{font-family:"IBM Plex Mono",monospace; font-size:11px; letter-spacing:.12em;
  text-transform:uppercase; color:var(--ink-3); white-space:nowrap}
.progress .meter{flex:1; height:7px; border-radius:4px; background:var(--surface-2); border:1px solid var(--line); overflow:hidden}
.progress .meter i{display:block; height:100%; background:var(--core); transition:width .25s ease}
.progress .cnt{font-family:"Familjen Grotesk",sans-serif; font-weight:700; font-variant-numeric:tabular-nums; white-space:nowrap}

.grp{margin-top:26px}
.grp-head{display:flex; align-items:baseline; gap:10px; border-bottom:1.5px solid var(--ink); padding-bottom:7px; margin-bottom:14px}
.grp-head h3{margin:0; font-size:17px; font-weight:600}
.grp-head span{font-size:12.5px; color:var(--ink-2)}

.ex{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:14px 16px; margin-bottom:10px}
.ex[data-tila="oikein"]{border-color:var(--strong); box-shadow:inset 3px 0 0 var(--strong)}
.ex[data-tila="vaarin"]{border-color:var(--alert); box-shadow:inset 3px 0 0 var(--alert)}
.ex .q{display:flex; gap:11px; align-items:baseline; flex-wrap:wrap}
.ex .num{font-family:"IBM Plex Mono",monospace; font-size:11.5px; color:var(--ink-3); min-width:2.4em}
.ex .txt{flex:1; min-width:190px; font-size:15.5px}
.ex .txt .aineisto{display:block; margin-bottom:9px; padding-left:12px;
  border-left:2px solid var(--line); color:var(--ink-2); line-height:1.6;
  /* Aineisto voi olla pieni taulukko, jonka rivit on erotettu rivinvaihdoilla.
     Ilman pre-lineä ne valuisivat yhdeksi kappaleeksi ja taulukko katoaisi. */
  white-space:pre-line}
.ex .txt .kysymysrivi{display:block; font-weight:600}
.ex .row{display:flex; gap:8px; align-items:center; margin-top:11px; flex-wrap:wrap}
.ex input[type=text]{font:inherit; font-family:"IBM Plex Mono",monospace; font-size:15px; width:8.5em;
  padding:7px 11px; border:1px solid var(--line); border-radius:7px; background:var(--surface-2);
  color:var(--ink); text-align:right}
.ex input:focus-visible{outline:2px solid var(--core); outline-offset:1px}
button{font:inherit; cursor:pointer}
.btn{font-size:13.5px; padding:7px 15px; border-radius:7px; border:1px solid var(--core);
  background:var(--core); color:#fff}
.btn.ghost{background:transparent; color:var(--ink-2); border-color:var(--line)}
.btn:focus-visible{outline:2px solid var(--core); outline-offset:2px}
.btn.mv-valinta{text-align:left}
/* kuuntelutehtävä: selaimen puhesynteesi lukee englanninkielisen tekstin */
.kuuntele{display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin:2px 0 10px}
.kuuntele .btn{display:inline-flex; gap:7px; align-items:center}
.kuuntele svg{width:16px; height:16px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round}
.kuuntele .varateksti{flex-basis:100%; font-size:14px; color:var(--ink-2); background:var(--surface-2);
  border-radius:7px; padding:8px 12px; margin:0}
.btn.mv-valinta:disabled{cursor:default; opacity:.65}
.btn.mv-oikein{background:var(--strong-soft); border-color:var(--strong); color:var(--strong); opacity:1}
.btn.mv-vaarin{background:var(--alert-soft); border-color:var(--alert); color:var(--alert); opacity:1}
.row.mv{gap:8px 10px}
.fb{margin-top:11px; font-size:14.5px; padding:10px 13px; border-radius:8px; line-height:1.5}
.fb.ok{background:var(--strong-soft); color:var(--strong)}
.fb.no{background:var(--alert-soft); color:var(--alert)}
.fb.hint{background:var(--chal-soft); color:var(--chal)}

.done{background:var(--strong-soft); border:1px solid var(--strong); color:var(--strong);
  border-radius:var(--r); padding:16px 20px; margin-top:20px; font-size:15.5px}
.done h3{margin:0 0 4px; font-size:17px; color:var(--strong)}

details.teacher{margin-top:34px; background:var(--surface); border:1px solid var(--line);
  border-left:3px solid var(--chal); border-radius:var(--r); padding:15px 20px; box-shadow:var(--shadow)}
details.teacher summary{cursor:pointer; font-family:"Familjen Grotesk",sans-serif; font-weight:600; font-size:15px}
details.teacher summary:focus-visible{outline:2px solid var(--core); outline-offset:3px}
details.teacher ul{margin:12px 0 0; padding-left:19px; color:var(--ink-2); font-size:14.5px}
details.teacher li{margin-bottom:8px}
details.teacher p{margin:12px 0 0; color:var(--ink-2); font-size:14.5px}

.back{display:inline-block; margin-top:30px; font-size:13.5px; color:var(--ink-2)}
.back a{color:var(--core)}

@media (prefers-reduced-motion: reduce){*{transition:none !important}}
@media (max-width:560px){
  .wrap{padding:16px 13px 70px}
  header.top h1{font-size:25px}
  .progress{flex-wrap:wrap}
}
</style>

<div class="wrap">

  <header class="top">
    <span class="badge"><svg viewBox="0 0 24 24" aria-hidden="true" id="ikoni"></svg></span>
    <div>
      <p class="eyebrow" id="eyebrow"></p>
      <h1 id="otsikko"></h1>
      <p id="kuvaus"></p>
      <div class="tags" id="tags"></div>
    </div>
  </header>

  <article id="teksti"></article>

  <div class="progress" aria-live="polite">
    <span class="lbl">Harjoitukset</span>
    <span class="meter"><i id="pbar" style="width:0%"></i></span>
    <span class="cnt" id="pcnt">0 / 20</span>
  </div>

  <div id="harjoitukset"></div>
  <div id="valmis"></div>

  <p class="back" id="back"></p>

</div>

<script>
const D = {"tavoite_id":"AI4-LUK-05","oppiaine":"AI","vuosiluokka":4,"taso":"ydin","otsikko":"Lukustrategi","kuvaus":"Osaan valita lukutavan sen mukaan, miksi luen.","versio":"0.2","paivitetty":"2026-09-24","ops":{"T":["T5"],"S":["S2"]},"eyebrow":"Äidinkieli · 4. luokka · Lukeminen ja tekstien tulkinta","ikoni":"lukeminen","teksti":[{"tyyppi":"johdanto","sisalto":"Seisot elokuvateatterin aulassa ja katsot ohjelmaa. Siinä on kahdenkymmenen elokuvan nimet, ikärajat, kestot ja alkamisajat. Sinä tarvitset niistä yhden ainoan luvun: kellonajan, jolloin oma elokuvasi alkaa. Jos aloitat ylhäältä ja luet kaiken, seisot aulassa pitkään. Jos katsot suoraan oikeaa riviä, olet valmis heti. Ero ei ole lukemisen nopeudessa vaan siinä, että tiedät jo ennen lukemista, mitä olet hakemassa."},{"tyyppi":"kappale","otsikko":"Kolme lukutapaa","sisalto":"Tekstiä ei lueta aina samalla tavalla. Etsivä lukeminen tarkoittaa, että etsit tekstistä yhtä tietoa etkä lue muuta. Silmäilevä lukeminen tarkoittaa, että haluat tietää, mistä teksti kertoo, etkä vielä kaikkia yksityiskohtia. Tarkka lukeminen tarkoittaa, että luet joka sanan, koska yksikin väärin ymmärretty kohta muuttaisi lopputuloksen. Kaikki kolme ovat oikeita tapoja lukea. Väärin menee vain, jos valitsee niistä tilanteeseen sopimattoman."},{"tyyppi":"saanto","otsikko":"Valitse lukutapa ennen kuin aloitat","askeleet":["Kysy ensin itseltäsi: mitä aion tehdä tällä tiedolla? Vastaus ratkaisee lukutavan. Tekstin pituus ei ratkaise sitä.","Jos etsit yhtä tietoa, lue etsien. Katso otsikot, numerot, lihavoinnit ja luettelot. Älä lue kokonaisia virkkeitä ennen kuin olet löytänyt oikean kohdan.","Jos haluat tietää, mistä teksti kertoo, lue silmäillen. Lue otsikko ja väliotsikot, sitten ensimmäinen kappale ja lopuksi viimeinen.","Jos teksti on ohje tai koeasia, lue tarkasti. Lue joka sana ja palaa heti taaksepäin, jos jokin kohta jäi epäselväksi."]},{"tyyppi":"kappale","otsikko":"Etsivä lukeminen: etsit yhtä tietoa","sisalto":"Etsivässä lukemisessa sinulla on kysymys valmiina ennen kuin katsot tekstiä. Etsit aikataulusta yhtä kellonaikaa, hinnastosta yhtä lukua tai sisällysluettelosta yhtä sivunumeroa. Katse hakee silloin muotoa, ei merkitystä: numeroita, isoja alkukirjaimia, lihavoituja sanoja, luettelon rivejä. Kun oikea rivi löytyy, luet siitä sen yhden asian ja lopetat. Kaikkea muuta tekstissä ei tarvitse ymmärtää, eikä sen lukemattomuus ole puute."},{"tyyppi":"kappale","otsikko":"Silmäilevä lukeminen: haluat tietää, mistä teksti kertoo","sisalto":"Silmäilevässä lukemisessa kysymys on toinen: mistä tämä teksti kertoo ja kannattaako se lukea kokonaan. Luet otsikon ja väliotsikot, sitten ensimmäisen kappaleen ja viimeisen kappaleen. Tietotekstissä alku kertoo, mistä on kyse, ja loppu kertoo, mihin asia johti. Väliin jäävät kappaleet ovat perusteluja ja esimerkkejä, ja ne voi jättää tässä vaiheessa lukematta. Silmäilevä lukeminen ei ole huolimatonta lukemista vaan tarkoituksellista valintaa. Kappale alkaa uudelta riviltä ja jatkuu, kunnes teksti taas vaihtaa riviä. Otsikko on lyhyt rivi ilman pistettä; kappaleessa on kokonaisia virkkeitä. Yhden väliotsikon alla voi olla useampi kappale, ja silloin siitä asiasta kerrotaan tekstissä enemmän."},{"tyyppi":"kappale","otsikko":"Tarkka lukeminen: teksti on ohje tai koeasia","sisalto":"Joskus yksityiskohta ratkaisee. Ohjeessa vaiheiden järjestys ja yksittäiset luvut määräävät, onnistuuko työ. Koealueessa asia pitää osata myöhemmin ilman tekstiä. Silloin luet joka sanan ja palaat taaksepäin heti, kun huomaat, ettet ymmärtänyt jotain kohtaa. Taaksepäin palaaminen kuuluu tarkkaan lukemiseen eikä ole merkki huonosta lukutaidosta. Tarkka lukeminen on hidasta, ja siksi sitä käytetään vain silloin, kun se on tarpeen."},{"tyyppi":"taulukko","otsikko":"Mitä aiot tehdä tiedolla","otsikkorivi":["Tilanne","Lukutapa","Mitä teet"],"rivit":[["Etsit bussin lähtöajan aikataulusta","Etsivä lukeminen","Etsit oman linjan rivin ja luet siitä yhden luvun"],["Tarkistat, montako euroa lippu maksaa","Etsivä lukeminen","Etsit hinnastosta oman rivisi ja luet sen vierestä luvun"],["Valitset kirjaa luettavaksi","Silmäilevä lukeminen","Luet otsikon, sisällysluettelon ja ensimmäisen kappaleen"],["Selvität, mistä oppikirjan luku kertoo","Silmäilevä lukeminen","Luet väliotsikot sekä ensimmäisen ja viimeisen kappaleen"],["Kokoat huonekalun ohjeen mukaan","Tarkka lukeminen","Luet jokaisen vaiheen kokonaan ja tarkistat järjestyksen"],["Luet koealuetta kirjasta","Tarkka lukeminen","Luet joka sanan ja palaat epäselvään kohtaan uudelleen"]]},{"tyyppi":"ansa","otsikko":"Ansa 1: kaiken lukeminen tarkasti, kun yksi luku riittäisi","sisalto":"Tavallisin virhe ei ole huolimattomuus vaan liika huolellisuus väärässä paikassa. Aikataulu, hinnasto ja sisällysluettelo luetaan alusta loppuun, vaikka niistä tarvitaan vain yksi rivi. Työ tuntuu ahkeralta, mutta se ei tuota parempaa vastausta kuin etsivä lukeminen. Pahempaa on, että aikaa ja tarkkaavaisuutta kuluu turhaan, eikä niitä ole jäljellä siinä kohdassa, jossa tarkkuutta oikeasti tarvitaan."},{"tyyppi":"ansa","otsikko":"Ansa 2: ohjeen silmäily ja etsiminen","sisalto":"Toinen virhe on päinvastainen. Ohje luetaan silmäillen tai siitä etsitään vain yksi kohta, koska se näyttää lyhyeltä ja tutulta. Silloin huomaamatta jää juuri se yksityiskohta, josta kaikki riippuu: odotusaika keskellä virkettä, vaiheiden järjestys tai sana ennen. Ohjeessa luvut ovat harvoin rivin alussa, ja etsivä katse hakee nimenomaan rivin alkuja ja numeroita. Ohjetta ei lueta silmäillen eikä etsien, vaikka se olisi lyhyt."},{"tyyppi":"muistilappu","otsikko":"Muista nämä","kohdat":["Valitse lukutapa ennen lukemista sen mukaan, mitä aiot tiedolla tehdä.","Yhden tiedon etsimiseen etsivä lukeminen: otsikot, numerot, lihavoinnit, luettelot.","Tekstin aiheen selvittämiseen silmäilevä lukeminen: otsikko, väliotsikot, ensimmäinen ja viimeinen kappale.","Ohjeeseen ja koeasiaan tarkka lukeminen: joka sana ja tarvittaessa taaksepäin.","Lukematta jättäminen on valinta, ei laiskuutta, kun se on tehty tarkoituksella."]}],"harjoitusryhmat":[{"id":"silmaily","nimi":"Etsi yksi tieto","info":"Etsit yhtä lukua. Katso otsikot ja numerot, älä lue kaikkea."},{"id":"yleissilmays","nimi":"Silmäile kokonaisuus","info":"Selvität, mistä teksti kertoo. Otsikot ja rakenne riittävät."},{"id":"tarkka","nimi":"Tarkka lukeminen ja lukutavan valinta","info":"Ohjeessa yksityiskohta ratkaisee. Lue joka sana."}],"harjoitukset":[{"id":"H01","ryhma":"silmaily","kysymys":"Sisällys\n1 Metsän puut .......... 4\n2 Sienet .......... 12\n3 Linnut .......... 24\n4 Nisäkkäät .......... 31\n5 Hyönteiset .......... 38\n6 Hakemisto .......... 44\n\nMiltä sivulta luku Linnut alkaa?","vastaus":24,"vinkki":"Etsi luettelosta sana Linnut ja lue sen riviltä numero. Muita rivejä ei tarvitse lukea.","selitys":"Etsivä lukeminen riittää: rivi löytyy sanan perusteella ja luku on sen vieressä. Koko luetteloa ei tarvitse käydä läpi ylhäältä alas."},{"id":"H02","ryhma":"silmaily","kysymys":"Sisällys\n1 Metsän puut .......... 4\n2 Sienet .......... 12\n3 Linnut .......... 24\n4 Nisäkkäät .......... 31\n5 Hyönteiset .......... 38\n6 Hakemisto .......... 44\n\nMontako sivua luvussa Sienet on? Luku päättyy sivua ennen seuraavan luvun alkua.","vastaus":12,"vinkki":"Tarvitset kaksi lukua: sen, mistä Sienet alkaa, ja sen, mistä seuraava luku alkaa.","selitys":"Sienet alkaa sivulta 12 ja Linnut sivulta 24. Erotus on luvun pituus. Tässäkin etsivä lukeminen riittää, mutta lukuja tarvitaan kaksi eikä yksi."},{"id":"H03","ryhma":"silmaily","kysymys":"Uimahallin hinnasto\nLapsi 4 €\nNuori 5 €\nAikuinen 8 €\nEläkeläinen 6 €\nPerhelippu 20 €\n\nMontako euroa maksavat yhteensä 2 lippua hintaryhmässä Aikuinen?","vastaus":16,"vinkki":"Etsi hinnastosta rivi Aikuinen. Muita rivejä ei tarvitse lukea.","selitys":"Aikuisen lippu maksaa 8 euroa, joten kaksi lippua maksaa 16 euroa. Hinnastossa oikea rivi löytyy sanan perusteella."},{"id":"H04","ryhma":"silmaily","kysymys":"Uimahallin hinnasto\nLapsi 4 €\nNuori 5 €\nAikuinen 8 €\nEläkeläinen 6 €\nPerhelippu 20 €\n\nMontako euroa säästyy, jos ostetaan yksi Perhelippu sen sijaan että ostettaisiin erikseen 2 lippua hintaryhmässä Aikuinen ja 2 lippua hintaryhmässä Lapsi?","vastaus":4,"vinkki":"Laske ensin erillisten lippujen hinta yhteen. Vertaa sitä sitten perhelipun hintaan.","selitys":"Erikseen ostettuna 2 aikuista ja 2 lasta maksavat 16 + 8 = 24 euroa. Perhelippu maksaa 20 euroa, joten erotus on 4 euroa. Tähän tarvitaan kolme riviä hinnastosta, ei koko taulukkoa."},{"id":"H05","ryhma":"silmaily","kysymys":"Linja-auto 12 lähtee koulun pysäkiltä\nLähdöt: 12.40, 13.55, 15.10, 16.25, 17.40, 18.55\n\nMontako lähtöä on kello 15 jälkeen?","vastaus":4,"vinkki":"Etsi listasta se kohta, jossa tunnit ylittävät 15. Sitä ennen olevia aikoja ei tarvitse lukea.","selitys":"Kello 15 jälkeen lähtevät vuorot 15.10, 16.25, 17.40 ja 18.55 eli neljä vuoroa. Aikataulusta kannattaa etsiä ensin oikea kohta ja laskea vasta siitä eteenpäin."},{"id":"H06","ryhma":"silmaily","kysymys":"Museon ohjelma lauantaina\n10.00 Ovet aukeavat\n11.15 Opastus kellarissa\n12.30 Ruokatauko\n13.10 Savityöpaja\n15.45 Opastus tornissa\n17.00 Ovet sulkeutuvat\n\nOhjelmassa on kohdat Ruokatauko ja Savityöpaja. Montako minuuttia niiden alkamisaikojen välillä on?","vastaus":40,"vinkki":"Etsi molemmat rivit nimen perusteella ja lue niistä vain kellonajat.","selitys":"Ruokatauko alkaa 12.30 ja savityöpaja 13.10. Väliin jää 40 minuuttia. Ohjelmakartasta luetaan kaksi lukua, ei kaikkia rivejä."},{"id":"H07","ryhma":"silmaily","kysymys":"Museon ohjelma lauantaina\n10.00 Ovet aukeavat\n11.15 Opastus kellarissa\n12.30 Ruokatauko\n13.10 Savityöpaja\n15.45 Opastus tornissa\n17.00 Ovet sulkeutuvat\n\nMontako ohjelman kohtaa alkaa ennen kello 13?","vastaus":3,"vinkki":"Katso pelkkää aikasaraketta. Kohtien nimiä ei tarvitse tähän lukea.","selitys":"Ennen kello 13 alkavat kohdat 10.00, 11.15 ja 12.30 eli kolme kohtaa. Kun etsit yhtä tietoa, riittää että luet yhden sarakkeen."},{"id":"H08","ryhma":"yleissilmays","kysymys":"Suomen suot\nMiten suo syntyy\nSuo syntyy hitaasti, kun matalan järven pohjalle kertyy kuollutta kasviainesta enemmän kuin ehtii hajota. Vähitellen vesi väistyy ja tilalle jää turvetta.\nTurvetta kertyy noin millimetri vuodessa, joten metrin paksuinen turvekerros on tuhat vuotta vanha.\nSuon kasvit\nSuolla kasvaa rahkasammalta, tupasvillaa ja karpaloa. Ne tulevat toimeen märässä ja hapettomassa maassa, jossa monen muun kasvin juuret mätänisivät.\nSuo ja ilmasto\nTurpeeseen on sitoutunut paljon hiiltä. Kun suo ojitetaan ja kuivuu, turve alkaa hajota ja hiili vapautuu ilmaan.\nSuon käyttö\nSoita on ojitettu metsän kasvatusta varten ja turvetta on nostettu poltettavaksi. Nykyään osa ojitetuista soista palautetaan takaisin märäksi.\n\nMontako väliotsikkoa tekstissä on? Pääotsikkoa ei lasketa.","vastaus":4,"vinkki":"Väliotsikot ovat lyhyitä rivejä, jotka eivät pääty pisteeseen. Ensimmäinen rivi on pääotsikko.","selitys":"Väliotsikoita on neljä. Silmäilevässä lukemisessa otsikot luetaan ensin, koska ne kertovat tekstin rakenteen ennen kuin yhtään kappaletta on luettu."},{"id":"H09","ryhma":"yleissilmays","kysymys":"Suomen suot\nMiten suo syntyy\nSuo syntyy hitaasti, kun matalan järven pohjalle kertyy kuollutta kasviainesta enemmän kuin ehtii hajota. Vähitellen vesi väistyy ja tilalle jää turvetta.\nTurvetta kertyy noin millimetri vuodessa, joten metrin paksuinen turvekerros on tuhat vuotta vanha.\nSuon kasvit\nSuolla kasvaa rahkasammalta, tupasvillaa ja karpaloa. Ne tulevat toimeen märässä ja hapettomassa maassa, jossa monen muun kasvin juuret mätänisivät.\nSuo ja ilmasto\nTurpeeseen on sitoutunut paljon hiiltä. Kun suo ojitetaan ja kuivuu, turve alkaa hajota ja hiili vapautuu ilmaan.\nSuon käyttö\nSoita on ojitettu metsän kasvatusta varten ja turvetta on nostettu poltettavaksi. Nykyään osa ojitetuista soista palautetaan takaisin märäksi.\n\nMontako kappaletta tekstissä on?","vastaus":5,"vinkki":"Kappale on tekstipätkä, jossa on virkkeitä. Otsikko ei ole kappale.","selitys":"Kappaleita on viisi, vaikka väliotsikoita on neljä. Yhden väliotsikon alla on kaksi kappaletta, ja juuri se kannattaa huomata ennen lukemista."},{"id":"H10","ryhma":"yleissilmays","kysymys":"Suomen suot\nMiten suo syntyy\nSuo syntyy hitaasti, kun matalan järven pohjalle kertyy kuollutta kasviainesta enemmän kuin ehtii hajota. Vähitellen vesi väistyy ja tilalle jää turvetta.\nTurvetta kertyy noin millimetri vuodessa, joten metrin paksuinen turvekerros on tuhat vuotta vanha.\nSuon kasvit\nSuolla kasvaa rahkasammalta, tupasvillaa ja karpaloa. Ne tulevat toimeen märässä ja hapettomassa maassa, jossa monen muun kasvin juuret mätänisivät.\nSuo ja ilmasto\nTurpeeseen on sitoutunut paljon hiiltä. Kun suo ojitetaan ja kuivuu, turve alkaa hajota ja hiili vapautuu ilmaan.\nSuon käyttö\nSoita on ojitettu metsän kasvatusta varten ja turvetta on nostettu poltettavaksi. Nykyään osa ojitetuista soista palautetaan takaisin märäksi.\n\nMonennessako kappaleessa esiintyy sana karpaloa? Laske kappaleet tekstin alusta.","vastaus":3,"vinkki":"Katso ensin väliotsikoista, minkä otsikon alle kasvit kuuluvat. Vasta sitten lue sen kohdan kappale.","selitys":"Sana on kolmannessa kappaleessa, väliotsikon Suon kasvit alla. Otsikot vievät oikeaan kohtaan, jolloin kahta ensimmäistä kappaletta ei tarvitse lukea lainkaan."},{"id":"H11","ryhma":"yleissilmays","kysymys":"Mistä hanavesi tulee\nVeden matka\nVesi otetaan pohjavedestä tai järvestä ja johdetaan putkea pitkin puhdistamolle. Matka voi olla monta kilometriä.\nPuhdistus\nPuhdistamolla vedestä poistetaan hiekka ja muut hiukkaset. Sen jälkeen veteen lisätään pieni määrä klooria, joka estää bakteerien kasvun putkistossa.\nPaine ja vesitorni\nVesitorni seisoo mäellä, ja sen korkeus antaa veteen paineen. Siksi vesi nousee hanaan myös talon ylimmässä kerroksessa.\nTakaisin luontoon\nKäytetty vesi menee viemäriin ja sieltä jätevedenpuhdistamolle. Puhdistettu vesi lasketaan lopulta takaisin vesistöön.\n\nSilmäilevässä lukemisessa luetaan otsikko, ensimmäinen kappale ja viimeinen kappale. Montako kappaletta jää tällöin lukematta?","vastaus":2,"vinkki":"Laske ensin kappaleiden määrä. Vähennä siitä ensimmäinen ja viimeinen.","selitys":"Kappaleita on neljä, joista luetaan kaksi. Lukematta jää kaksi. Silmäilevä lukeminen ei tarkoita nopeaa lukemista vaan sitä, että osa tekstistä jätetään tarkoituksella lukematta."},{"id":"H12","ryhma":"yleissilmays","kysymys":"Mistä hanavesi tulee\nVeden matka\nVesi otetaan pohjavedestä tai järvestä ja johdetaan putkea pitkin puhdistamolle. Matka voi olla monta kilometriä.\nPuhdistus\nPuhdistamolla vedestä poistetaan hiekka ja muut hiukkaset. Sen jälkeen veteen lisätään pieni määrä klooria, joka estää bakteerien kasvun putkistossa.\nPaine ja vesitorni\nVesitorni seisoo mäellä, ja sen korkeus antaa veteen paineen. Siksi vesi nousee hanaan myös talon ylimmässä kerroksessa.\nTakaisin luontoon\nKäytetty vesi menee viemäriin ja sieltä jätevedenpuhdistamolle. Puhdistettu vesi lasketaan lopulta takaisin vesistöön.\n\nMonennessako kappaleessa esiintyy sana vesitorni? Laske kappaleet tekstin alusta.","vastaus":3,"vinkki":"Väliotsikko kertoo, minkä kappaleen kohdalla asia käsitellään.","selitys":"Sana on kolmannessa kappaleessa. Väliotsikko Paine ja vesitorni näyttää kohdan suoraan, joten kappaleita ei tarvitse käydä läpi järjestyksessä."},{"id":"H13","ryhma":"yleissilmays","kysymys":"Mistä hanavesi tulee\nVeden matka\nVesi otetaan pohjavedestä tai järvestä ja johdetaan putkea pitkin puhdistamolle. Matka voi olla monta kilometriä.\nPuhdistus\nPuhdistamolla vedestä poistetaan hiekka ja muut hiukkaset. Sen jälkeen veteen lisätään pieni määrä klooria, joka estää bakteerien kasvun putkistossa.\nPaine ja vesitorni\nVesitorni seisoo mäellä, ja sen korkeus antaa veteen paineen. Siksi vesi nousee hanaan myös talon ylimmässä kerroksessa.\nTakaisin luontoon\nKäytetty vesi menee viemäriin ja sieltä jätevedenpuhdistamolle. Puhdistettu vesi lasketaan lopulta takaisin vesistöön.\n\nMontako kappaletta tekstissä on ennen väliotsikkoa Paine ja vesitorni?","vastaus":2,"vinkki":"Etsi kyseinen väliotsikko ja laske sitä edeltävät kappaleet. Otsikoita ei lasketa.","selitys":"Ennen väliotsikkoa on kaksi kappaletta. Rakenteen näkee otsikoista ilman että yhtäkään kappaletta luetaan."},{"id":"H14","ryhma":"tarkka","kysymys":"Ohje: Kaurapuuron keittäminen\n1. Mittaa 6 dl vettä kattilaan ja kuumenna se kiehuvaksi.\n2. Lisää 3 dl kaurahiutaleita ja puoli teelusikallista suolaa.\n3. Keitä hiljaisella lämmöllä 10 minuuttia ja sekoita välillä.\n4. Nosta kattila liedeltä ja anna puuron turvota kannen alla 5 minuuttia.\n5. Tarjoile puuro lämpimänä.\n\nVaiheessa 3 kerrotaan aika minuutteina. Montako minuuttia se on?","vastaus":10,"vinkki":"Etsi vaihe numero 3 ja lue se kokonaan. Luku on keskellä virkettä.","selitys":"Vaiheessa 3 keitetään 10 minuuttia. Ohjeessa luku on usein keskellä virkettä eikä rivin alussa, joten etsivä katse menee siitä helposti ohi."},{"id":"H15","ryhma":"tarkka","kysymys":"Ohje: Kaurapuuron keittäminen\n1. Mittaa 6 dl vettä kattilaan ja kuumenna se kiehuvaksi.\n2. Lisää 3 dl kaurahiutaleita ja puoli teelusikallista suolaa.\n3. Keitä hiljaisella lämmöllä 10 minuuttia ja sekoita välillä.\n4. Nosta kattila liedeltä ja anna puuron turvota kannen alla 5 minuuttia.\n5. Tarjoile puuro lämpimänä.\n\nMontako vaihetta ohjeessa on?","vastaus":5,"vinkki":"Vaiheet on numeroitu. Katso, mikä on suurin numero.","selitys":"Vaiheita on viisi. Ennen ohjeen noudattamista kannattaa katsoa, montako vaihetta edessä on: se kertoo, kuinka pitkä työ on."},{"id":"H16","ryhma":"tarkka","kysymys":"Ohje: Kaurapuuron keittäminen\n1. Mittaa 6 dl vettä kattilaan ja kuumenna se kiehuvaksi.\n2. Lisää 3 dl kaurahiutaleita ja puoli teelusikallista suolaa.\n3. Keitä hiljaisella lämmöllä 10 minuuttia ja sekoita välillä.\n4. Nosta kattila liedeltä ja anna puuron turvota kannen alla 5 minuuttia.\n5. Tarjoile puuro lämpimänä.\n\nMontako minuuttia ohjeessa mainitut ajat ovat yhteensä?","vastaus":15,"vinkki":"Ohjeessa on kaksi kohtaa, joissa mainitaan minuutteja. Etsi molemmat.","selitys":"Vaiheessa 3 keitetään 10 minuuttia ja vaiheessa 4 puuro turpoaa 5 minuuttia, yhteensä 15 minuuttia. Jos ohjeen vain silmäilee, jälkimmäinen aika jää helposti huomaamatta ja puuro jää jäykäksi."},{"id":"H17","ryhma":"tarkka","kysymys":"Ohje: Polkupyörän sisärenkaan paikkaus\n1. Irrota rengas vanteelta ja ota sisärengas ulos.\n2. Etsi reikä pumppaamalla rengas täyteen ja kuuntelemalla sihinää.\n3. Karhenna reiän ympärys hiekkapaperilla.\n4. Levitä ohut kerros liimaa ja odota 5 minuuttia.\n5. Paina paikka kiinni ja purista sitä 2 minuuttia.\n6. Kokoa rengas ja täytä se pumpulla.\n\nMonennessako vaiheessa esiintyy sana liimaa?","vastaus":4,"vinkki":"Käy vaiheet läpi järjestyksessä ja lue jokainen kokonaan.","selitys":"Liima mainitaan vaiheessa 4. Järjestys ratkaisee: jos liiman levittää ennen karhennusta, paikka ei tartu. Siksi tällaista ohjetta ei lueta silmäillen."},{"id":"H18","ryhma":"tarkka","tyyppi":"monivalinta","kysymys":"Elokuvateatterin aulassa on ohjelma, jossa on kahdenkymmenen elokuvan nimet, ikärajat, kestot ja alkamisajat. Haluat tietää, mihin aikaan yksi tietty elokuva alkaa.\n\nMikä lukutapa sopii tilanteeseen parhaiten?","vaihtoehdot":["Etsivä lukeminen: etsin elokuvan nimen ja luen sen vierestä kellonajan.","Silmäilevä lukeminen: luen ensimmäisen ja viimeisen elokuvan tiedot.","Tarkka lukeminen: luen jokaisen elokuvan tiedot sanasta sanaan."],"vastaus":0,"vinkki":"Kysy ensin, mitä aiot tehdä tiedolla. Tarvitsetko yhden luvun vai koko taulun?","selitys":"Etsit yhtä tietoa, joten etsivä lukeminen on oikea tapa. Tarkka lukeminen veisi paljon aikaa eikä tuottaisi sen parempaa vastausta, ja silmäilevä lukeminen antaisi vääriä elokuvia."},{"id":"H19","ryhma":"tarkka","tyyppi":"monivalinta","kysymys":"Saat ohjeen, jonka mukaan kokoat lentokonemallin. Osat ovat lähes samannäköisiä ja liimaus onnistuu vain kerran. Ohjeessa on kaksitoista vaihetta.\n\nMikä lukutapa sopii tilanteeseen parhaiten?","vaihtoehdot":["Etsivä lukeminen: etsin ohjeesta vain vaiheiden määrän ja aloitan kokoamisen.","Tarkka lukeminen: luen joka vaiheen kokonaan ja palaan taaksepäin, jos jokin jää epäselväksi.","Silmäilevä lukeminen: luen ensimmäisen ja viimeisen vaiheen."],"vastaus":1,"vinkki":"Mitä tapahtuu, jos yksi sana jää lukematta?","selitys":"Ohjeessa yksityiskohta ratkaisee ja virhettä ei voi perua. Silloin luetaan tarkasti. Etsivä lukeminen riittäisi vain, jos haluaisit tietää, montako vaihetta edessä on."},{"id":"H20","ryhma":"tarkka","tyyppi":"monivalinta","kysymys":"Kirjaston hyllyssä on neljä kirjaa samasta aiheesta. Sinun pitää valita niistä yksi luettavaksi ja haluat tietää, mistä kukin kirja kertoo.\n\nMikä lukutapa sopii tilanteeseen parhaiten?","vaihtoehdot":["Tarkka lukeminen: luen jokaisesta kirjasta ensimmäiset kymmenen sivua.","Etsivä lukeminen: etsin jokaisesta kirjasta yhden numeron.","Silmäilevä lukeminen: luen kunkin kirjan otsikon, sisällysluettelon ja ensimmäisen kappaleen."],"vastaus":2,"vinkki":"Haet käsitystä kokonaisuudesta, et yhtä tietoa etkä yksityiskohtia.","selitys":"Kun haluat tietää, mistä teksti kertoo, luet otsikon ja alun. Yhden tiedon etsiminen ei kerro sisällöstä mitään, ja neljän kirjan tarkka lukeminen olisi tehty vasta valinnan jälkeen."}],"valmis_teksti":"Osaat valita lukutavan sen mukaan, mitä aiot tiedolla tehdä: luet etsien, kun etsit yhtä tietoa, luet silmäillen, kun haluat tietää mistä teksti kertoo, ja luet tarkasti, kun teksti on ohje tai koeasia. Tämä taito on nyt näytetty."};

const esc = s => s;

      return `<div class="box warn"><h3>${esc(o.otsikko)}</h3><p style="margin:0">${esc(o.sisalto)}</p></div>`;

      return `<div class="box note"><h3>${esc(o.otsikko)}</h3><ul class="notes">${

/* ---------- lukusuora ---------- */
const svg=document.getElementById("nlsvg"), rng=document.getElementById("nlrange"), out=document.getElementById("nlout");
const X0=34, X1=606, Y=62;
function piirraNL(v){
  const ala=Math.floor(v/10)*10, yla=ala+10, puoli=ala+5;
  const pyor = (v%10)>=5 ? yla : ala;
  const x = n => X0 + (n/100)*(X1-X0);
  let s=`<line class="rail" x1="${X0}" y1="${Y}" x2="${X1}" y2="${Y}"/>`;
  for(let n=0;n<=100;n+=10){
    const near = (n===ala||n===yla);
    s+=`<line class="tick" x1="${x(n)}" y1="${Y-7}" x2="${x(n)}" y2="${Y+7}"/>`;
    s+=`<text class="stop${near?" near":""}" x="${x(n)}" y="${Y+24}" text-anchor="middle">${n}</text>`;
  }
  s+=`<line class="halfway" x1="${x(puoli)}" y1="${Y-16}" x2="${x(puoli)}" y2="${Y+12}"/>`;
  s+=`<text class="stop" x="${x(puoli)}" y="${Y-22}" text-anchor="middle">puoliväli ${puoli}</text>`;
  s+=`<circle class="dot" cx="${x(v)}" cy="${Y}" r="6"/>`;
  s+=`<text class="val" x="${x(v)}" y="${Y-32}" text-anchor="middle">${v}</text>`;
  s+=`<path d="M ${x(v)} ${Y+38} L ${x(pyor)} ${Y+38}" stroke="var(--core)" stroke-width="2" fill="none"/>`;
  s+=`<path d="M ${x(pyor)} ${Y+38} l ${x(pyor)>x(v)?-7:7} -4 l 0 8 z" fill="var(--core)"/>`;
  svg.innerHTML=s;
  out.textContent = `${v} pyöristyy → ${pyor}`;
}
if(svg){ piirraNL(+rng.value); rng.addEventListener("input",e=>piirraNL(+e.target.value)); }

/* ---------- laskujärjestys-widget ---------- */
const ljExp=document.getElementById("ljExp");
if(ljExp && D.kokeilu){
  let ljI=0, ljTokens=[], ljStep=0;
  const laske=(a,op,b)=>{a=+a;b=+b;return op==="×"?a*b:op==="÷"?a/b:op==="+"?a+b:a-b;};
  function ljAlku(){
    const l=D.kokeilu[ljI];
    ljTokens=l.lauseke.replace(/\(/g,"( ").replace(/\)/g," )").split(/\s+/).filter(Boolean);
    ljStep=0; ljPiirra(); ljViesti("","");
  }
  function ljViesti(t,lk){const f=document.getElementById("ljFb"); f.textContent=t; f.className="lj-fb "+(lk||"");}
  function ljPiirra(){
    const l=D.kokeilu[ljI];
    document.getElementById("ljStep").textContent =
      ljStep>=l.askeleet.length ? "valmis" : `askel ${ljStep+1} / ${l.askeleet.length}`;
    if(ljStep>=l.askeleet.length){
      ljExp.innerHTML=`<span class="valmis">${l.lauseke} = ${l.vastaus}</span>`;
      return;
    }
    ljExp.innerHTML=ljTokens.map((t,i)=>
      "×÷+−".includes(t) ? `<button type="button" class="op" data-i="${i}">${t}</button>`
                         : `<span class="tok">${t}</span>`).join("");
    ljExp.querySelectorAll("button.op").forEach(b=>b.addEventListener("click",()=>ljKlikkaa(+b.dataset.i)));
  }
  function ljKlikkaa(i){
    const l=D.kokeilu[ljI], odotettu=l.askeleet[ljStep];
    const ehdotus=[ljTokens[i-1],ljTokens[i],ljTokens[i+1]].join(" ");
    if(ehdotus!==odotettu){
      ljViesti(ljStep===0
        ? "Ei vielä. Sulkeet ovat vahvimmat, sitten kerto ja jako. Yhtä vahvat vasemmalta oikealle."
        : "Ei vielä. Kumpi jäljellä olevista on vahvempi?", "no");
      return;
    }
    const arvo=laske(ljTokens[i-1],ljTokens[i],ljTokens[i+1]);
    let alku=i-1, loppu=i+1;
    if(ljTokens[i-2]==="(" && ljTokens[i+2]===")"){ alku=i-2; loppu=i+2; }
    ljTokens.splice(alku, loppu-alku+1, String(arvo));
    ljStep++;
    ljViesti(ljStep>=l.askeleet.length ? "Valmis. Vastaus on "+l.vastaus+"." : "Oikein. Jatka seuraavaan.", "ok");
    ljPiirra();
  }
  document.getElementById("ljSeuraava").addEventListener("click",()=>{
    ljI=(ljI+1)%D.kokeilu.length; ljAlku();
  });
  ljAlku();
}

};

/* Suomalainen lukumuoto: välilyönti on tuhaterotin, pilkku desimaalierotin.
   Piste voi olla kumpi tahansa. Se tulkitaan tuhaterottimeksi VAIN silloin, kun
   koko luku on aitoa tuhaterotinmuotoa: alkuosa 1–3 numeroa ilman etunollaa ja
   jokainen jatko-osa täsmälleen 3 numeroa (1.500, 12.345.678). Kaikissa muissa
   tapauksissa piste on desimaalipiste — myös 0.125, joka vanhalla säännöllä
   ("3 numeroa pisteen jäljessä = tuhaterotin") luettiin virheellisesti luvuksi 125. */
const TUHATEROTIN = /^[1-9]\d{0,2}(\.\d{3})+$/;
function lueLuku(teksti){
  // Murtoluku (3/4, -3/4) ja sekaluku (1 2/3, -1 2/3) hyväksytään sellaisinaan.
  const raaka = String(teksti).replace(/\u00a0/g, " ").trim();
  let m = raaka.match(/^(-?)(\d+)\s+(\d+)\s*\/\s*(\d+)$/);
  if(m){ const nim = Number(m[4]); if(nim === 0) return null;
    const v = Number(m[2]) + Number(m[3]) / nim; return m[1] ? -v : v; }
  m = raaka.match(/^(-?)\s*(\d+)\s*\/\s*(\d+)$/);
  if(m){ const nim = Number(m[3]); if(nim === 0) return null;
    const v = Number(m[2]) / nim; return m[1] ? -v : v; }
  let s = String(teksti).replace(/[\s\u00a0]/g, "");
  if(s === "") return null;
  if(s.indexOf(",") >= 0){
    s = s.replace(/\./g, "").replace(",", ".");
  } else if(TUHATEROTIN.test(s)){
    s = s.replace(/\./g, "");
  }
  const n = Number(s);
  return Number.isFinite(n) ? n : null;
}

function tarkista(id){
  const h=D.harjoitukset.find(x=>x.id===id);
  const kentta=document.getElementById("in-"+id);
  const fb=document.getElementById("fb-"+id);
  if(kentta.value.trim()===""){ fb.className="fb hint"; fb.textContent="Kirjoita vastaus ensin."; return; }
  const luku=lueLuku(kentta.value);
  if(luku===null){ fb.className="fb no"; fb.textContent="Vastauksen pitää olla luku tai murtoluku (esimerkiksi 3/4)."; return; }
  const oikein = Math.abs(luku - h.vastaus) < 1e-9;
  merkitseTulos(id, oikein, oikein ? "Oikein. "+h.selitys : `Ei vielä. ${h.vinkki} Kokeile uudelleen.`);
}

function tarkistaMonivalinta(id, valittuIndeksi, painike){
  const h=D.harjoitukset.find(x=>x.id===id);
  const rivi=painike.closest(".row");
  rivi.querySelectorAll(".mv-valinta").forEach(b=>b.disabled=true);
  const oikein = valittuIndeksi===h.vastaus;
  painike.classList.add(oikein?"mv-oikein":"mv-vaarin");
  if(!oikein){
    const oikeaBtn=rivi.querySelector(`[data-i="${h.vastaus}"]`);
    if(oikeaBtn) oikeaBtn.classList.add("mv-oikein");
  }
  merkitseTulos(id, oikein, oikein ? "Oikein. "+h.selitys : `Ei ihan. Oikea vastaus on korostettu. ${h.selitys||""}`);
}

/* Kuuntelu: selain lukee tekstin ääneen omalla puhesynteesillään (englanniksi, jos laitteessa on
   englanninkielinen ääni). Ei äänitiedostoja eikä verkkoyhteyttä. Jos laite ei osaa puhua,
   teksti näytetään luettavaksi — silloin tehtävä muuttuu luetun ymmärtämiseksi, mutta ei katkea. */
function puhu(id, nopeus){
  const h=D.harjoitukset.find(x=>x.id===id); if(!h || !h.kuuntele) return;
  const vara=document.getElementById("vara-"+id);
  const naytaTeksti=syy=>{ vara.hidden=false; vara.textContent=syy+" Teksti: "+h.kuuntele; };
  if(!("speechSynthesis" in window)){ naytaTeksti("Tämä laite ei osaa lukea ääneen."); return; }
  const s=window.speechSynthesis; s.cancel();
  const u=new SpeechSynthesisUtterance(h.kuuntele);
  u.lang=h.kieli||"en-GB"; u.rate=nopeus;
  const aanet=s.getVoices(), kieli=u.lang.slice(0,2);
  const aani=aanet.find(a=>a.lang===u.lang) || aanet.find(a=>a.lang && a.lang.startsWith(kieli));
  if(aani) u.voice=aani;
  else if(aanet.length) { naytaTeksti("Laitteessa ei ole englanninkielistä ääntä."); return; }
  u.onerror=()=>naytaTeksti("Ääneen lukeminen ei onnistunut.");
  s.speak(u);
}
