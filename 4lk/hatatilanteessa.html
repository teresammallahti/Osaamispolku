<title>Hätätilanteessa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">

<style>
:root{
  --paper:#EFF2F5; --surface:#FFFFFF; --surface-2:#F7F9FB;
  --grid:#DCE3EA; --line:#C9D3DC;
  --ink:#15222C; --ink-2:#4E626F; --ink-3:#7E8F9B;
  --core:#1B5A9E; --core-soft:#E4EDF6;
  --strong:#1F6E5C; --strong-soft:#E1F0EB;
  --chal:#9A6A16; --chal-soft:#F6EDDC;
  --alert:#A33A2B; --alert-soft:#F8E7E3;
  --shadow:0 1px 2px rgba(21,34,44,.06), 0 8px 24px -12px rgba(21,34,44,.18);
  --r:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0F161B; --surface:#18222A; --surface-2:#1D2830;
    --grid:#22303A; --line:#2E3E4A;
    --ink:#E8EFF4; --ink-2:#A3B4C0; --ink-3:#7A8B97;
    --core:#7FB2E4; --core-soft:#16303F;
    --strong:#77CDB4; --strong-soft:#123028;
    --chal:#E0B267; --chal-soft:#33270F;
    --alert:#E8907F; --alert-soft:#3A1E19;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -14px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --paper:#0F161B; --surface:#18222A; --surface-2:#1D2830;
  --grid:#22303A; --line:#2E3E4A;
  --ink:#E8EFF4; --ink-2:#A3B4C0; --ink-3:#7A8B97;
  --core:#7FB2E4; --core-soft:#16303F;
  --strong:#77CDB4; --strong-soft:#123028;
  --chal:#E0B267; --chal-soft:#33270F;
  --alert:#E8907F; --alert-soft:#3A1E19;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -14px rgba(0,0,0,.7);
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:16px; line-height:1.62;
  background-image:
    linear-gradient(to right, var(--grid) 1px, transparent 1px),
    linear-gradient(to bottom, var(--grid) 1px, transparent 1px);
  background-size:26px 26px;
}
.wrap{max-width:760px; margin:0 auto; padding:28px 20px 90px}
h1,h2,h3,h4{font-family:"Familjen Grotesk","IBM Plex Sans",system-ui,sans-serif; text-wrap:balance}

/* header */
header.top{background:var(--surface); border:1px solid var(--line); border-radius:var(--r);
  box-shadow:var(--shadow); padding:22px 24px; display:flex; gap:18px; align-items:flex-start}
.badge{flex:0 0 auto; width:54px; height:54px; border-radius:9px; display:grid; place-items:center;
  background:var(--core-soft); border:1px solid var(--core); color:var(--core)}
.badge svg{width:28px; height:28px; fill:none; stroke:currentColor; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round}
.eyebrow{font-family:"IBM Plex Mono",monospace; font-size:11px; letter-spacing:.14em;
  text-transform:uppercase; color:var(--ink-3); margin:0 0 5px}
header.top h1{margin:0; font-size:30px; font-weight:700; letter-spacing:-.015em}
header.top p{margin:5px 0 0; color:var(--ink-2); font-size:15px}
.tags{display:flex; flex-wrap:wrap; gap:5px; margin-top:11px}
.tag{font-family:"IBM Plex Mono",monospace; font-size:10.5px; letter-spacing:.05em; padding:2px 7px;
  border-radius:4px; background:var(--surface-2); border:1px solid var(--line); color:var(--ink-3)}
.tag.core{background:var(--core-soft); border-color:var(--core); color:var(--core)}

/* teksti */
article{margin-top:26px}
article h2{font-size:21px; font-weight:600; margin:32px 0 10px; letter-spacing:-.01em}
article p{margin:0 0 14px; max-width:64ch}
.lead{font-size:17.5px; color:var(--ink); border-left:3px solid var(--core); padding-left:16px; margin:0 0 8px}

.box{background:var(--surface); border:1px solid var(--line); border-radius:var(--r);
  padding:18px 22px; box-shadow:var(--shadow); margin:22px 0}
.box h3{margin:0 0 12px; font-size:16.5px; font-weight:600}
.box.warn{border-left:3px solid var(--alert)}
.box.note{border-left:3px solid var(--chal)}

ol.steps{margin:0; padding-left:0; list-style:none; counter-reset:s; display:grid; gap:12px}
ol.steps li{counter-increment:s; display:grid; grid-template-columns:auto 1fr; gap:13px; align-items:start}
ol.steps li::before{content:counter(s); font-family:"Familjen Grotesk",sans-serif; font-weight:700; font-size:14px;
  width:26px; height:26px; border-radius:50%; background:var(--core); color:#fff; display:grid; place-items:center; margin-top:2px}

ul.notes{margin:0; padding-left:19px}
ul.notes li{margin-bottom:7px}
ul.notes li:last-child{margin-bottom:0}

.tablewrap{overflow-x:auto}
table{border-collapse:collapse; width:100%; font-size:14.5px; min-width:460px}
th,td{text-align:left; padding:9px 13px; border-bottom:1px solid var(--line)}
th{font-family:"IBM Plex Mono",monospace; font-size:10.5px; letter-spacing:.1em; text-transform:uppercase;
  color:var(--ink-3); font-weight:400; background:var(--surface-2)}
tr:last-child td{border-bottom:0}
td b{color:var(--core); font-weight:600}
td:last-child{font-variant-numeric:tabular-nums; font-weight:600}

/* lukusuora */
.nl svg{width:100%; height:118px; display:block}
.nl .rail{stroke:var(--line); stroke-width:2}
.nl .tick{stroke:var(--line); stroke-width:1.5}
.nl .stop{fill:var(--ink-3); font-family:"IBM Plex Mono",monospace; font-size:11px}
.nl .stop.near{fill:var(--core); font-weight:600}
.nl .dot{fill:var(--chal)}
.nl .val{fill:var(--ink); font-family:"Familjen Grotesk",sans-serif; font-size:15px; font-weight:700}
.nl .halfway{stroke:var(--chal); stroke-dasharray:3 3; stroke-width:1.5}
.nl-controls{display:flex; align-items:center; gap:14px; margin-top:6px}
.nl-controls input{flex:1; accent-color:var(--core)}
.nl-out{font-family:"Familjen Grotesk",sans-serif; font-size:15px; font-weight:600; min-width:12.5em; text-align:right}

/* paikka-arvotaulu */
.box .ohje{margin:0 0 14px; font-size:14.5px; color:var(--ink-2)}
.nt-valinta{display:flex; flex-wrap:wrap; gap:7px; margin-bottom:16px}
.nt-valinta button{font:inherit; font-size:12.5px; font-family:"IBM Plex Mono",monospace; padding:5px 11px;
  border-radius:6px; border:1px solid var(--line); background:var(--surface-2); color:var(--ink-2); cursor:pointer}
.nt-valinta button[aria-pressed="true"]{background:var(--ink); color:var(--paper); border-color:var(--ink)}
.nt-valinta button:focus-visible{outline:2px solid var(--core); outline-offset:2px}
.nt-taulu{display:flex; flex-direction:column; gap:4px; align-items:flex-start; overflow-x:auto; padding-bottom:4px}
.nt-rivi{display:flex; gap:6px; align-items:center}
.nt-rivi .otsa{font-family:"IBM Plex Mono",monospace; font-size:9.5px; letter-spacing:.08em;
  text-transform:uppercase; color:var(--ink-3); width:52px; text-align:center}
.nt-ruutu{width:52px; height:52px; display:grid; place-items:center; border:1.5px solid var(--line);
  border-radius:7px; background:var(--surface-2); font-family:"IBM Plex Mono",monospace; font-size:24px}
.nt-ruutu.kohta{border-color:var(--core); background:var(--core-soft); color:var(--core); font-weight:500}
.nt-ruutu.ratkaiseva{border-color:var(--chal); background:var(--chal-soft); color:var(--chal); font-weight:500}
.nt-ruutu.nolla{color:var(--ink-3)}
.nt-rivi .nimi{font-size:12.5px; color:var(--ink-3); margin-left:12px; white-space:nowrap}
.nt-nuoli{font-size:17px; color:var(--chal); margin-left:6px}
.nt-selite{margin:14px 0 0; font-size:14.5px}
.nt-selite b{color:var(--core)}

/* vahvuusportaat */
.vp-tasot{display:grid; gap:9px; margin-bottom:18px}
.vp-taso{display:flex; gap:11px; align-items:flex-start; font-size:13.5px}
.vp-taso .vp-pallo{width:13px; height:13px; border-radius:4px; margin-top:5px; flex:0 0 auto}
.vp-taso[data-taso="sulkeet"] .vp-pallo{background:var(--core)}
.vp-taso[data-taso="kertojako"] .vp-pallo{background:var(--strong)}
.vp-taso[data-taso="yhteenvahennys"] .vp-pallo{background:var(--chal)}
.vp-taso strong{display:block; font-family:"Familjen Grotesk",sans-serif; font-weight:600; font-size:14.5px}
.vp-taso span{color:var(--ink-2)}
.vp-lauseke{display:flex; flex-wrap:wrap; gap:7px; align-items:flex-end; font-family:"IBM Plex Mono",monospace;
  font-size:25px; padding:10px 2px; min-height:64px}
.vp-lauseke .t{padding:2px 3px}
.vp-lauseke .op{position:relative; padding:2px 9px; border-radius:6px; font-weight:500}
.vp-lauseke .op[data-taso="sulkeet"]{background:var(--core-soft); color:var(--core)}
.vp-lauseke .op[data-taso="kertojako"]{background:var(--strong-soft); color:var(--strong)}
.vp-lauseke .op[data-taso="yhteenvahennys"]{background:var(--chal-soft); color:var(--chal)}
.vp-lauseke .op i{position:absolute; top:-9px; right:-6px; font-style:normal; font-family:"Familjen Grotesk",sans-serif;
  font-size:11px; font-weight:700; width:18px; height:18px; border-radius:50%; display:grid; place-items:center;
  background:currentColor}
.vp-lauseke .op i span{color:var(--surface)}
.vp-rivi{display:flex; align-items:center; gap:16px; margin-top:8px}
.vp-vastaus{font-family:"Familjen Grotesk",sans-serif; font-size:16px; font-weight:600; color:var(--strong)}

/* laskujärjestys-widget */
.lj-exp{display:flex; flex-wrap:wrap; gap:7px; align-items:center; font-family:"IBM Plex Mono",monospace;
  font-size:23px; padding:14px 4px; min-height:62px}
.lj-exp .tok{padding:2px 4px; color:var(--ink)}
.lj-exp button.op{font-family:"IBM Plex Mono",monospace; font-size:23px; padding:3px 12px; border-radius:7px;
  border:1.5px solid var(--line); background:var(--surface-2); color:var(--ink); line-height:1.2}
.lj-exp button.op:hover{border-color:var(--core); color:var(--core)}
.lj-exp button.op:focus-visible{outline:2px solid var(--core); outline-offset:2px}
.lj-exp .valmis{font-family:"Familjen Grotesk",sans-serif; font-size:23px; font-weight:700; color:var(--strong)}
.lj-fb{font-size:14.5px; min-height:1.5em; color:var(--ink-2)}
.lj-fb.no{color:var(--alert)}
.lj-fb.ok{color:var(--strong)}
.lj-row{display:flex; align-items:center; gap:14px; margin-top:10px}
.lj-step{font-family:"IBM Plex Mono",monospace; font-size:11.5px; letter-spacing:.1em;
  text-transform:uppercase; color:var(--ink-3)}

/* toiminnalliset apuvälineet (murtokuvio, jakoleikki, kestokello) */
.tw [hidden]{display:none !important}
.tw .ohje{margin:0 0 14px; font-size:14.5px; color:var(--ink-2)}
.tw-tilat{display:inline-flex; border:1px solid var(--line); border-radius:8px; overflow:hidden; margin:0 0 14px}
.tw-tilat button{font-size:13.5px; padding:7px 15px; border:0; background:var(--surface-2); color:var(--ink-2)}
.tw-tilat button + button{border-left:1px solid var(--line)}
.tw-tilat button[aria-pressed="true"]{background:var(--ink); color:var(--paper)}
.tw-tehtava{margin:0 0 14px; padding:11px 14px; border-radius:8px; background:var(--core-soft);
  border-left:3px solid var(--core); font-size:15.5px; line-height:1.55}
.tw-tehtava small{display:block; margin-top:4px; font-size:13px; color:var(--ink-2)}
.tw-ohjaus{display:flex; flex-wrap:wrap; gap:10px 20px; align-items:center; margin-bottom:12px}
.tw-ryhma{display:flex; align-items:center; gap:8px; flex-wrap:wrap}
.tw-lbl{font-family:"IBM Plex Mono",monospace; font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-3)}
.tw-valinta{font-size:13.5px; padding:6px 13px; border-radius:7px; border:1px solid var(--line);
  background:var(--surface-2); color:var(--ink-2)}
.tw-valinta[aria-pressed="true"]{background:var(--core); border-color:var(--core); color:var(--paper)}
.tw-askel{display:inline-flex; align-items:center; border:1px solid var(--line); border-radius:8px; overflow:hidden; background:var(--surface-2)}
.tw-askel button{width:42px; height:42px; border:0; background:transparent; color:var(--ink); font-size:21px; line-height:1}
.tw-askel output{min-width:2.4em; text-align:center; font-family:"Familjen Grotesk",sans-serif; font-weight:700;
  font-size:19px; font-variant-numeric:tabular-nums; border-left:1px solid var(--line); border-right:1px solid var(--line); line-height:42px}
.tw-rivi{display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-top:12px}
.tw-rivi label{font-size:14.5px; display:flex; gap:8px; align-items:center; flex-wrap:wrap}
.tw input[type=text]{font:inherit; font-family:"IBM Plex Mono",monospace; font-size:16px; width:6.5em; padding:7px 10px;
  border:1px solid var(--line); border-radius:7px; background:var(--surface-2); color:var(--ink); text-align:right}
.tw .btn{color:var(--paper)}
.tw .btn.ghost{color:var(--ink-2)}
.tw button:disabled{opacity:.42; cursor:default}
.tw button:focus-visible, .tw input:focus-visible, .tw [tabindex]:focus-visible{outline:2px solid var(--core); outline-offset:2px}
.tw-palaute{margin:12px 0 0; font-size:14.5px; line-height:1.5}
.tw-palaute:empty{display:none}
.tw-palaute.ok, .tw-palaute.no, .tw-palaute.hint{padding:10px 13px; border-radius:8px}
.tw-palaute.ok{background:var(--strong-soft); color:var(--strong)}
.tw-palaute.no{background:var(--alert-soft); color:var(--alert)}
.tw-palaute.hint{background:var(--chal-soft); color:var(--chal)}
.mf{display:inline-flex; flex-direction:column; align-items:center; vertical-align:middle; line-height:1.08;
  font-family:"Familjen Grotesk",sans-serif; font-weight:700; margin:0 2px; font-size:.95em}
.mf span:first-child{border-bottom:1.5px solid currentColor; padding:0 3px}

/* murtokuvio */
.mk-runko{display:grid; grid-template-columns:minmax(0,250px) 1fr; gap:24px; align-items:center}
.mk-kuva svg{width:100%; max-width:250px; display:block; touch-action:manipulation}
.mk-osa{fill:var(--surface-2); stroke:var(--ink-2); stroke-width:1.6; cursor:pointer; transition:fill .12s ease}
.mk-osa:hover{fill:var(--core-soft)}
.mk-osa.on{fill:var(--core)}
.mk-osa.on:hover{fill:var(--core)}
.mk-osa.lukittu{cursor:default}
.mk-osa.lukittu:hover{fill:var(--surface-2)}
.mk-osa.lukittu.on:hover{fill:var(--core)}
.mk-osa:focus-visible{outline:none; stroke:var(--chal); stroke-width:4}
.mk-luku{display:flex; align-items:center; gap:18px}
.mk-mv{display:flex; flex-direction:column; align-items:center; font-family:"Familjen Grotesk",sans-serif;
  font-weight:700; font-size:46px; line-height:1; min-width:72px}
.mk-mv .mk-os{color:var(--core)}
.mk-mv .mk-viiva{width:70px; height:4px; background:var(--ink); border-radius:2px; margin:7px 0}
.mk-mv input[type=text]{width:2.1em; font-size:30px; text-align:center; padding:4px 2px; font-family:"Familjen Grotesk",sans-serif; font-weight:700}
.mk-mv.mk-piilo{color:var(--ink-3)}
.mk-mv.mk-piilo .mk-os{color:var(--ink-3)}
.mk-sel{display:grid; gap:22px; font-size:13.5px; color:var(--ink-2); line-height:1.35}
.mk-sel b{color:var(--ink); font-size:15px}
.mk-sanoin{margin:14px 0 0; font-size:15px}
.mk-sanoin:empty{display:none}

/* jakoleikki */
.jl-jono{margin-top:4px}
.jl-pisteet{display:flex; flex-wrap:wrap; gap:5px; min-height:22px; margin:7px 0 2px}
.jl-p{width:17px; height:17px; border-radius:50%; background:var(--chal)}
.jl-tyhja{font-size:13.5px; color:var(--ink-3)}
.jl-autot{display:flex; flex-wrap:wrap; gap:10px; margin-top:14px; min-height:10px}
.jl-auto{border:1.5px solid var(--core); border-radius:10px; padding:6px 9px 9px; background:var(--core-soft)}
.jl-auto.vajaa{border-style:dashed; border-color:var(--chal); background:var(--chal-soft)}
.jl-auto .nimi{font-family:"IBM Plex Mono",monospace; font-size:10px; letter-spacing:.08em; text-transform:uppercase;
  color:var(--ink-2); display:block; margin-bottom:5px; white-space:nowrap}
.jl-paikat{display:grid; gap:4px; justify-content:start}
.jl-paikka{width:17px; height:17px; border-radius:50%; border:1.5px dashed var(--ink-3)}
.jl-paikka.on{background:var(--core); border:0}
.jl-auto.vajaa .jl-paikka.on{background:var(--chal)}
.jl-yv{margin:14px 0 0; font-size:15px}
.jl-yv:empty{display:none}
.jl-lasku{display:block; font-family:"Familjen Grotesk",sans-serif; font-weight:700; font-size:20px}
.jl-tark{display:block; font-size:13.5px; color:var(--ink-2); margin-top:2px}
.jl-tulkinnat{margin:10px 0 0; padding-left:19px; font-size:14.5px}
.jl-tulkinnat li{margin-bottom:4px}
.jl-tulkinnat b{color:var(--core)}

/* kestokello */
.kk-runko{display:grid; grid-template-columns:minmax(0,240px) 1fr; gap:24px; align-items:center}
.kk svg.kk-kello{width:100%; max-width:240px; display:block; touch-action:none; cursor:grab; user-select:none; -webkit-user-select:none}
.kk svg.kk-kello:active{cursor:grabbing}
.kk-kehys{fill:var(--surface-2); stroke:var(--ink-2); stroke-width:2}
.kk-viiva{stroke:var(--ink-3); stroke-width:1.2}
.kk-viiva.iso{stroke:var(--ink); stroke-width:2.6}
.kk-nro{fill:var(--ink); font-family:"Familjen Grotesk",sans-serif; font-weight:600; font-size:17px}
.kk-tunti{stroke:var(--ink); stroke-width:7; stroke-linecap:round}
.kk-min{stroke:var(--core); stroke-width:4.5; stroke-linecap:round}
.kk-kahva{fill:var(--core-soft); stroke:var(--core); stroke-width:2.2}
.kk-keski{fill:var(--ink)}
.kk-digi{font-family:"IBM Plex Mono",monospace; font-size:42px; font-weight:500; line-height:1.1; font-variant-numeric:tabular-nums}
.kk-digi .mm{color:var(--core); border-radius:6px; padding:0 2px; transition:background .3s ease}
.kk-digi .mm.flash{background:var(--chal-soft); color:var(--chal)}
.kk-digi small{display:block; font-family:"IBM Plex Sans",sans-serif; font-size:12.5px; color:var(--ink-3); letter-spacing:.02em}
.kk-viesti{margin:10px 0 0; min-height:2.6em; font-size:14px; color:var(--chal); line-height:1.4}
.kk-palat{display:flex; height:36px; border-radius:7px; overflow:hidden; border:1px solid var(--line);
  background:var(--surface-2); margin-top:18px}
.kk-pala{display:grid; place-items:center; font-family:"IBM Plex Mono",monospace; font-size:11.5px; color:var(--paper);
  white-space:nowrap; overflow:hidden; min-width:0}
.kk-pala.alku{background:var(--chal)}
.kk-pala.tunti{background:var(--core)}
.kk-pala.loppu{background:var(--strong)}
.kk-pala + .kk-pala{border-left:2px solid var(--surface)}
.kk-selitys{margin:9px 0 0; font-size:14px; color:var(--ink-2)}
.kk-selitys b{color:var(--ink)}
.kk-selitys span{white-space:nowrap}
.kk-yht{margin:4px 0 0; font-size:15px}
.kk-yht:empty{display:none}

@media (max-width:560px){
  .mk-runko, .kk-runko{grid-template-columns:1fr; gap:14px}
  .mk-kuva svg, .kk svg.kk-kello{margin:0 auto; max-width:230px}
  .mk-luku{justify-content:center}
  .kk-puoli{text-align:center}
  .kk-puoli .tw-rivi{justify-content:center}
}

/* harjoitukset */
.progress{position:sticky; top:0; z-index:5; background:var(--surface); border:1px solid var(--line);
  border-radius:var(--r); padding:12px 18px; box-shadow:var(--shadow); display:flex; align-items:center;
  gap:14px; margin:34px 0 18px}
.progress .lbl{font-family:"IBM Plex Mono",monospace; font-size:11px; letter-spacing:.12em;
  text-transform:uppercase; color:var(--ink-3); white-space:nowrap}
.progress .meter{flex:1; height:7px; border-radius:4px; background:var(--surface-2); border:1px solid var(--line); overflow:hidden}
.progress .meter i{display:block; height:100%; background:var(--core); transition:width .25s ease}
.progress .cnt{font-family:"Familjen Grotesk",sans-serif; font-weight:700; font-variant-numeric:tabular-nums; white-space:nowrap}

.grp{margin-top:26px}
.grp-head{display:flex; align-items:baseline; gap:10px; border-bottom:1.5px solid var(--ink); padding-bottom:7px; margin-bottom:14px}
.grp-head h3{margin:0; font-size:17px; font-weight:600}
.grp-head span{font-size:12.5px; color:var(--ink-2)}

.ex{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:14px 16px; margin-bottom:10px}
.ex[data-tila="oikein"]{border-color:var(--strong); box-shadow:inset 3px 0 0 var(--strong)}
.ex[data-tila="vaarin"]{border-color:var(--alert); box-shadow:inset 3px 0 0 var(--alert)}
.ex .q{display:flex; gap:11px; align-items:baseline; flex-wrap:wrap}
.ex .num{font-family:"IBM Plex Mono",monospace; font-size:11.5px; color:var(--ink-3); min-width:2.4em}
.ex .txt{flex:1; min-width:190px; font-size:15.5px}
.ex .txt .aineisto{display:block; margin-bottom:9px; padding-left:12px;
  border-left:2px solid var(--line); color:var(--ink-2); line-height:1.6;
  /* Aineisto voi olla pieni taulukko, jonka rivit on erotettu rivinvaihdoilla.
     Ilman pre-lineä ne valuisivat yhdeksi kappaleeksi ja taulukko katoaisi. */
  white-space:pre-line}
.ex .txt .kysymysrivi{display:block; font-weight:600}
.ex .row{display:flex; gap:8px; align-items:center; margin-top:11px; flex-wrap:wrap}
.ex input[type=text]{font:inherit; font-family:"IBM Plex Mono",monospace; font-size:15px; width:8.5em;
  padding:7px 11px; border:1px solid var(--line); border-radius:7px; background:var(--surface-2);
  color:var(--ink); text-align:right}
.ex input:focus-visible{outline:2px solid var(--core); outline-offset:1px}
button{font:inherit; cursor:pointer}
.btn{font-size:13.5px; padding:7px 15px; border-radius:7px; border:1px solid var(--core);
  background:var(--core); color:#fff}
.btn.ghost{background:transparent; color:var(--ink-2); border-color:var(--line)}
.btn:focus-visible{outline:2px solid var(--core); outline-offset:2px}
.btn.mv-valinta{text-align:left}
/* kuuntelutehtävä: selaimen puhesynteesi lukee englanninkielisen tekstin */
.kuuntele{display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin:2px 0 10px}
.kuuntele .btn{display:inline-flex; gap:7px; align-items:center}
.kuuntele svg{width:16px; height:16px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round}
.kuuntele .varateksti{flex-basis:100%; font-size:14px; color:var(--ink-2); background:var(--surface-2);
  border-radius:7px; padding:8px 12px; margin:0}
.btn.mv-valinta:disabled{cursor:default; opacity:.65}
.btn.mv-oikein{background:var(--strong-soft); border-color:var(--strong); color:var(--strong); opacity:1}
.btn.mv-vaarin{background:var(--alert-soft); border-color:var(--alert); color:var(--alert); opacity:1}
.row.mv{gap:8px 10px}
.fb{margin-top:11px; font-size:14.5px; padding:10px 13px; border-radius:8px; line-height:1.5}
.fb.ok{background:var(--strong-soft); color:var(--strong)}
.fb.no{background:var(--alert-soft); color:var(--alert)}
.fb.hint{background:var(--chal-soft); color:var(--chal)}

.done{background:var(--strong-soft); border:1px solid var(--strong); color:var(--strong);
  border-radius:var(--r); padding:16px 20px; margin-top:20px; font-size:15.5px}
.done h3{margin:0 0 4px; font-size:17px; color:var(--strong)}

details.teacher{margin-top:34px; background:var(--surface); border:1px solid var(--line);
  border-left:3px solid var(--chal); border-radius:var(--r); padding:15px 20px; box-shadow:var(--shadow)}
details.teacher summary{cursor:pointer; font-family:"Familjen Grotesk",sans-serif; font-weight:600; font-size:15px}
details.teacher summary:focus-visible{outline:2px solid var(--core); outline-offset:3px}
details.teacher ul{margin:12px 0 0; padding-left:19px; color:var(--ink-2); font-size:14.5px}
details.teacher li{margin-bottom:8px}
details.teacher p{margin:12px 0 0; color:var(--ink-2); font-size:14.5px}

.back{display:inline-block; margin-top:30px; font-size:13.5px; color:var(--ink-2)}
.back a{color:var(--core)}

@media (prefers-reduced-motion: reduce){*{transition:none !important}}

<script>
const D = {"tavoite_id":"YMP4-TUR-02","oppiaine":"YMP","vuosiluokka":4,"taso":"ydin","otsikko":"Hätätilanteessa","kuvaus":"Tiedän, miten toimin hätätilanteessa ja miten ehkäisen tapaturmia kotona ja koulussa.","versio":"0.2","paivitetty":"2026-09-26","ops":{"T":["T8"],"S":["S2"]},"eyebrow":"Ympäristöoppi · 4. luokka · Turvallisuus","ikoni":"turva","teksti":[{"tyyppi":"johdanto","sisalto":"Olet kaverisi kanssa pihalla. Hän putoaa kiipeilytelineestä, jää makaamaan eikä vastaa, kun kutsut häntä nimeltä. Aikuisia ei näy. Tässä hetkessä ei riitä, että osaat asian suunnilleen: sinun pitää tietää numero, tietää mitä sanot ja tietää, ettet sulje puhelinta. Tämä taito on juuri sitä. Toinen puoli taidosta on vielä tärkeämpi, vaikka se kuulostaa tylsemmältä: miten estät, ettei kotona satu mitään, mistä pitäisi soittaa."},{"tyyppi":"kappale","otsikko":"Hätätilanne vai ei","sisalto":"Suomessa on yksi hätänumero, 112. Siihen soitetaan, kun henki, terveys, omaisuus tai ympäristö on vaarassa ja paikalle tarvitaan viranomainen: ambulanssi, paloauto tai poliisi. Tulipalo, ihminen joka ei herää, paha loukkaantuminen ja jäihin putoaminen ovat hätätilanteita. Sähkökatko, puuhun juuttunut kissa ja kysymys uimahallin aukioloajasta eivät ole, vaikka ne harmittaisivat. Rajalla on väliä siksi, että jokainen turha puhelu vie päivystäjän aikaa, ja samaan aikaan joku toinen odottaa apua. Hätänumeron tahallisesta väärinkäytöstä voi saada rangaistuksen. Yksi poikkeus on tärkeä muistaa: jos et ole varma, onko tilanne hätätilanne, soita. Päivystäjän työ on arvioida se, ja epävarma soitto ei ole turha soitto. Kiireettömässä sairausasiassa aikuinen soittaa päivystysapuun 116 117, ei hätänumeroon."},{"tyyppi":"saanto","otsikko":"Hätäpuhelun kuusi vaihetta","askeleet":["Soita itse, jos voit, ja soita turvallisesta paikasta. Sinä tiedät tilanteesta eniten, joten päivystäjä saa parhaan tiedon sinulta eikä välikäden kautta. Puhelu vastataan sanoilla \"Hätäkeskus – Nödcentralen\".","Kerro, mitä on tapahtunut. Yksi virke riittää: \"Kaveri putosi kiipeilytelineestä eikä herää.\"","Kerro, missä olet: tarkka osoite ja kunta. Jos et tiedä osoitetta, kerro mitä näet: koulun nimi, kaupan nimi, tien nimi tai bussipysäkin nimi.","Vastaa päivystäjän kysymyksiin. Hän kysyy juuri niitä asioita, joita avun lähettämiseen tarvitaan. Kysymykset eivät hidasta apua: apu lähtee liikkeelle jo puhelun aikana.","Toimi ohjeiden mukaan. Päivystäjä voi neuvoa esimerkiksi kääntämään kaverin kylkiasentoon tai menemään tien viereen näyttämään ambulanssille paikka.","Lopeta puhelu vasta, kun päivystäjä antaa siihen luvan. Jos tilanne muuttuu puhelun jälkeen, soita uudelleen."]},{"tyyppi":"kappale","otsikko":"112 Suomi -sovellus kertoo, missä olet","sisalto":"Puhelimeen voi asentaa etukäteen 112 Suomi -sovelluksen. Kun soitat hätänumeroon sovelluksen kautta, puhelimesi sijainti lähetetään hätäkeskukseen automaattisesti. Se on suuri apu metsässä, mökkitiellä tai vieraassa kaupungissa, kun et tiedä osoitetta. Kerro paikka silti myös omin sanoin, koska yhteys voi olla huono eikä sijainti aina välity. Sovellus asennetaan ja otetaan käyttöön yhdessä aikuisen kanssa rauhassa etukäteen, ei vasta hätätilanteessa. Monet uudet puhelimet lähettävät sijainnin myös tavallisessa hätäpuhelussa, mutta sovelluksesta löytyvät lisäksi muut päivystysnumerot, kuten päivystysapu 116 117."},{"tyyppi":"ansa","otsikko":"Ansa 1: puhelu loppuu vasta, kun päivystäjä sanoo niin","sisalto":"Moni sulkee puhelimen heti, kun on kertonut asiansa, koska tuntuu, että kaikki on jo sanottu. Päivystäjällä voi kuitenkin olla vielä kysymys tai ohje sinulle, ja hän saattaa haluta pitää yhteyden auki avun saapumiseen asti. Jos suljet puhelun itse, hän joutuu soittamaan sinulle takaisin, ja se vie aikaa avulta. Sama koskee tilannetta, jossa puheluun ei vastata heti: linja ei ole rikki, vaan hätäkeskuksessa on ruuhkaa. Puheluihin vastataan soittamisjärjestyksessä, joten odota linjalla. Jos suljet ja soitat uudelleen, siirryt jonon perälle."},{"tyyppi":"ansa","otsikko":"Ansa 2: ensin 112, vasta sitten vanhemmat","sisalto":"Kun jotain pahaa tapahtuu, ensimmäinen ajatus on soittaa äidille tai isälle. Todellisessa hätätilanteessa se on väärä järjestys. Vanhempi ei voi lähettää ambulanssia, hän voi vain soittaa 112:een, ja silloin apu lähtee vasta toisen puhelun jälkeen ja päivystäjä saa tiedon välikäden kautta. Soita ensin 112 ja vasta sen jälkeen vanhemmalle. Päivystäjä voi myös itse pyytää sinua ilmoittamaan kotiin. Jos taas tilanne ei ole hätätilanne, vanhemmalle soittaminen on juuri oikea ratkaisu: puhjennut rengas tai hukkunut avain hoidetaan sillä puhelulla."},{"tyyppi":"kappale","otsikko":"Poistumisharjoitus ja kokoontumispaikka","sisalto":"Koulussa harjoitellaan poistumista, jotta oikeassa tilanteessa kukaan ei jää miettimään reittiä. Kun hälytys soi, jätät tavarat, lähdet lähintä merkittyä poistumisreittiä pitkin, suljet oven perässäsi ja kävelet kokoontumispaikalle. Ovi suljetaan, koska se hidastaa savun ja palon leviämistä. Hissiä ei käytetä, koska se voi pysähtyä savun keskelle. Jos poistumisreitillä on savua, älä mene savuun: savun hengittäminen on vaarallista. Käytä toista merkittyä poistumisreittiä. Jos kaikki reitit ovat savussa, jää luokkaan, sulje ovi ja näytä ikkunasta, että olette sisällä. Älä hyppää ikkunasta, vaan odota apua. Jos savua pääsee luokkaan, pysy lähellä lattiaa, koska savu nousee ylös ja lattian lähellä on puhtaampaa ilmaa. Kokoontumispaikalla opettaja laskee, että kaikki ovat ulkona. Sieltä ei lähdetä ilman lupaa, koska jos yksikin puuttuu, pelastajien pitää tietää, etsitäänkö häntä rakennuksesta vai onko hän vain lähtenyt kotiin. Sisälle ei palata, ei edes reppua hakemaan."},{"tyyppi":"taulukko","otsikko":"Kolme ensiaputilannetta, jotka jokainen osaa","otsikkorivi":["Tilanne","Mitä teet","Miksi"],"rivit":[["Runsas verenvuoto","Paina haavaa tiukasti kämmenellä tai puhtaalla liinalla ja auta loukkaantunut istumaan tai makaamaan. Jos laitat haavalle siteen, jatka painamista siteen päältä. Älä vedä haavassa olevaa esinettä pois. Jos vuoto ei lakkaa painamalla, soita 112. Pidä loukkaantunut lämpimänä ja levossa avun tuloon asti.","Paine puristaa vuotavan suonen kiinni, ja veri ehtii hyytyä. Esineen poistaminen avaa vuodon uudelleen."],["Palovamma","Viilennä vammaa viileällä juoksevalla vedellä vähintään 20 minuuttia. Älä puhkaise rakkuloita. Älä laita vammalle jäätä, voita tai rasvaa. Suojaa vamma sen jälkeen kevyesti puhtaalla sidoksella. Kasvojen ja isot vammat näytetään lääkärille.","Iho pysyy kuumana vielä palon jälkeen, ja lämpö jatkaa vaurion syventämistä. Pitkä viilennys pysäyttää sen, lyhyt ei. Jää vaurioittaa ihoa lisää, ja rasva pitää lämmön sisällä. Ehjä rakkula suojaa haavaa tulehdukselta."],["Ihminen, joka ei herää mutta hengittää","Puhuttele äänekkäästi ja ravistele hartioista. Jos hän ei herää, soita 112. Avaa hengitystie nostamalla leukaa ja taivuttamalla päätä taaksepäin ja tarkista, hengittääkö hän. Jos hengittää, käännä hänet kylkiasentoon: nosta hänen lähempi kätensä yläviistoon, tartu hartiasta ja polvesta ja käännä itseesi päin, laita päällimmäinen käsi posken alle. Seuraa hengitystä avun tuloon asti. Jos hän ei hengitä, päivystäjä neuvoo puhelimessa, mitä teet.","Selällään tajuttoman kieli voi painua kurkkuun ja tukkia hengitystien. Kyljellään hengitystie pysyy auki ja mahdollinen oksennus valuu ulos suusta."]]},{"tyyppi":"kappale","otsikko":"Tapaturma ehkäistään ennen kuin se sattuu","sisalto":"Moni tapaturma sattuu kotona, ja moni niistä olisi estetty yhdellä katseella etukäteen. Palovaroitin on kodin tärkein turvalaite: sen pitää olla jokaisessa kerroksessa, vähintään yksi jokaista alkavaa 60 neliömetriä kohti. 50 neliön kerrokseen riittää yksi, 80 neliön kerros tarvitsee kaksi ja 130 neliön kerros kolme. Se kiinnitetään kattoon, koska savu nousee ylös, ja se testataan painikkeesta kerran kuukaudessa. Kun varoitin piippaa lyhyesti aina välillä, paristo on loppumassa: paristo vaihdetaan, sitä ei oteta pois. Muita tavallisia vaaranpaikkoja ovat kattilan kahva lieden reunan yli, lääkkeet ja pesuaineet pikkulasten ulottuvilla, kynttilä verhon vieressä, jatkojohto tai rullalla oleva matto kulkureitillä ja pyyhkeet kiukaan päällä. Yhteistä näille on, että vaaran näkee etukäteen, jos katsoo."},{"tyyppi":"muistilappu","otsikko":"Muista nämä","kohdat":["Yksi numero: 112. Soita itse, jos voit.","Ensin mitä tapahtui, sitten missä. Vastaa kysymyksiin ja toimi ohjeiden mukaan.","Puhelu loppuu vasta, kun päivystäjä antaa luvan.","Hätätilanteessa ensin 112, vasta sitten vanhemmille.","Palovamma: viileää vettä vähintään 20 minuuttia. Verenvuoto: paina. Ei herää mutta hengittää: kylkiasento.","Savuun ei mennä: käytä toista reittiä, tai jää luokkaan ovi kiinni ja näytä ikkunasta, että olet sisällä.","Kokoontumispaikalta ei lähdetä ilman lupaa, eikä sisälle palata."]}],"harjoitusryhmat":[{"id":"puhelu","nimi":"Hätäpuhelu","info":"Numero, järjestys ja se, kuka päättää puhelun loppumisesta."},{"id":"ensiapu","nimi":"Ensiapu ja poistuminen","info":"Kolme ensiaputilannetta ja palohälytys koulussa."},{"id":"ehkaisy","nimi":"Turvallinen koti","info":"Palovaroitin ja kodin vaaranpaikat."}],"harjoitukset":[{"id":"H01","ryhma":"puhelu","tyyppi":"luku","kysymys":"Kaverisi putoaa puusta, jää makaamaan eikä vastaa, kun kutsut häntä. Aikuisia ei ole lähellä.\n\nMihin numeroon soitat?","vastaus":112,"vinkki":"Suomessa on vain yksi hätänumero.","selitys":"Soitat numeroon 112. Ihminen, joka ei herää, on hätätilanne, ja paikalle tarvitaan ambulanssi. Vanhemmalle soitetaan vasta sen jälkeen."},{"id":"H02","ryhma":"puhelu","tyyppi":"luku","kysymys":"1. Kaverillasi on nuha ja yskä\n2. Kaverisi käsi vuotaa runsaasti verta, eikä vuoto lakkaa, vaikka painat haavaa\n3. Kotona ei toimi netti\n4. Naapuritalon ikkunasta tulee paksua mustaa savua\n5. Vieras ihminen rikkoo naapurin ikkunan ja kiipeää sisään asuntoon\n\nMontako näistä tilanteista on hätätilanne, jossa soitat 112?","vastaus":3,"vinkki":"Kysy jokaisesta: onko henki, terveys, omaisuus tai ympäristö vaarassa juuri nyt, ja tarvitaanko paikalle ambulanssi, paloauto tai poliisi.","selitys":"Hätätilanteita ovat ne, joissa joku on vaarassa ja paikalle tarvitaan viranomainen. Harmilliset mutta vaarattomat asiat hoidetaan muuten kuin hätänumerolla."},{"id":"H03","ryhma":"puhelu","tyyppi":"luku","kysymys":"Hätäpuhelun vaiheita on lueteltu sekaisin.\n1. Kerrot tarkan osoitteen ja kunnan\n2. Lopetat puhelun, kun päivystäjä antaa siihen luvan\n3. Toimit päivystäjän antamien ohjeiden mukaan\n4. Soitat itse turvallisesta paikasta\n\nMonesko luettelon kohta tehdään ensimmäisenä?","vastaus":4,"vinkki":"Mikä näistä tapahtuu, ennen kuin kukaan on vielä sanonut mitään?","selitys":"Virallinen järjestys on: soita itse turvallisesta paikasta, kerro mitä tapahtui, kerro missä, vastaa kysymyksiin, toimi ohjeiden mukaan ja lopeta vasta luvan saatuasi. Etsi luettelosta se kohta, joka on tässä järjestyksessä aikaisin."},{"id":"H04","ryhma":"puhelu","tyyppi":"luku","kysymys":"Hätäpuhelun vaiheita on lueteltu sekaisin.\n1. Toimit päivystäjän antamien ohjeiden mukaan\n2. Kerrot, mitä on tapahtunut\n3. Lopetat puhelun, kun päivystäjä antaa siihen luvan\n4. Kerrot tarkan osoitteen ja kunnan\n\nMonesko luettelon kohta tehdään viimeisenä?","vastaus":3,"vinkki":"Puhelussa on yksi asia, joka tehdään vasta kun kaikki muu on tehty.","selitys":"Puhelu lopetetaan viimeisenä, ja vasta kun päivystäjä antaa luvan. Kaikki muu — kertominen, vastaaminen ja ohjeiden noudattaminen — tapahtuu ennen sitä."},{"id":"H05","ryhma":"puhelu","tyyppi":"monivalinta","kysymys":"Soitit 112, kerroit mitä tapahtui ja missä, ja päivystäjä sanoi, että ambulanssi on lähtenyt.\n\nMilloin puhelu loppuu?","vastaus":1,"vinkki":"Kuka päättää puhelun lopettamisesta: sinä vai päivystäjä?","selitys":"Puhelu loppuu vasta, kun päivystäjä sanoo, että voit lopettaa. Hänellä voi olla vielä ohje sinulle, ja hän saattaa pitää yhteyden auki avun tuloon asti. Ambulanssin lähteminen ei tarkoita, että puhelu olisi ohi.","vaihtoehdot":["Kun olet kertonut kaiken, mitä tiedät","Kun päivystäjä sanoo, että voit lopettaa","Kun ambulanssi on lähtenyt liikkeelle"]},{"id":"H06","ryhma":"puhelu","tyyppi":"luku","kysymys":"1. Hätäpuheluihin vastataan soittamisjärjestyksessä, joten linjalla odotetaan\n2. Hätäkeskus palvelee sekä suomeksi että ruotsiksi\n3. Hätänumeron tahallisesta väärinkäytöstä voi saada rangaistuksen\n4. Sähkökatkosta soitetaan hätänumeroon\n5. Puhelun voi sulkea heti, kun on kertonut, mitä tapahtui\n\nMontako näistä väitteistä on totta?","vastaus":3,"vinkki":"Mieti jokaisen väitteen kohdalla, mitä tekstissä sanottiin turhista soitoista, puhelun lopettamisesta ja soittojärjestyksestä.","selitys":"Totta ovat 1 (puheluihin vastataan soittamisjärjestyksessä), 2 (hätäkeskus palvelee suomeksi ja ruotsiksi) ja 3 (hätänumeron tahallisesta väärinkäytöstä voi saada rangaistuksen). Väärin ovat 4 (sähkökatko ei ole hätätilanne) ja 5 (puhelu loppuu vasta, kun päivystäjä antaa luvan)."},{"id":"H07","ryhma":"puhelu","tyyppi":"luku","kysymys":"1. Mummo on kaatunut portaissa, hänen jalkansa on vääntynyt oudosti eikä hän pysty nousemaan\n2. Keittiössä paistinpannu on syttynyt palamaan ja liekit nousevat liesituulettimeen\n3. Pallo on lentänyt naapurin pihalle aidan yli\n4. Koulubussi on kymmenen minuuttia myöhässä\n5. Polvessasi on pieni naarmu, joka ei vuoda\n\nMontako näistä tilanteista on sellainen, että soitat 112?","vastaus":2,"vinkki":"Kysymys ei ole, kuinka harmillinen tilanne on, vaan onko joku vaarassa.","selitys":"Vain ne tilanteet, joissa henki, terveys tai omaisuus on vaarassa, kuuluvat hätänumeroon. Muut hoidetaan soittamalla vanhemmalle tai odottamalla."},{"id":"H08","ryhma":"ensiapu","tyyppi":"luku","kysymys":"Pikkusisaruksesi koskee kuumaan lieteen ja saa sormiinsa palovamman. Alat viilentää sormia viileällä juoksevalla vedellä.\n\nMontako minuuttia viilennät vähintään?","vastaus":20,"vinkki":"Iho pysyy kuumana ja vaurio syvenee vielä palon jälkeen, joten viilennys ei ole lyhyt.","selitys":"Palovammaa viilennetään viileällä juoksevalla vedellä vähintään 20 minuuttia. Parin minuutin huuhtelu tuntuu helpottavan kipua, mutta ei pysäytä vauriota ihon sisällä."},{"id":"H09","ryhma":"ensiapu","tyyppi":"luku","kysymys":"Kaverisi on saanut käteensä syvän haavan, josta vuotaa paljon verta.\n1. Odotat, että vuoto loppuu itsestään, ennen kuin teet mitään\n2. Soitat 112, jos vuoto ei lakkaa painamisesta huolimatta\n3. Jatkat painamista siteen päältä, kun side on paikallaan\n4. Autat loukkaantuneen istumaan tai makaamaan\n5. Sidot narun tiukasti käsivarren ympärille haavan yläpuolelle\n\nMontako näistä toimintatavoista on oikein?","vastaus":3,"vinkki":"Verenvuodon ensiapu on ennen kaikkea yksi asia: paine haavan päälle.","selitys":"Oikein ovat 2, 3 ja 4. Väärin ovat 1 (vuotoa ei jäädä odottamaan, vaan haavaa painetaan heti) ja 5 (narua ei kiristetä raajan ympärille)."},{"id":"H10","ryhma":"ensiapu","tyyppi":"monivalinta","kysymys":"Kaverisi on kaatunut, hän ei herää ravistelusta, mutta hän hengittää. Olet soittanut 112.\n\nMihin asentoon käännät hänet?","vastaus":1,"vinkki":"Mieti, mitä tapahtuu, jos tajuttoman kieli painuu kurkkuun.","selitys":"Kylkiasentoon. Selällään tajuttoman kieli voi tukkia hengitystien, ja kyljellään hengitystie pysyy auki. Istumaan nostettu tajuton kaatuu.","vaihtoehdot":["Selälleen, pää suorassa","Kylkiasentoon","Istumaan seinää vasten"]},{"id":"H11","ryhma":"ensiapu","tyyppi":"luku","kysymys":"Kaverisi makaa maassa eikä liiku. Auttamisen vaiheita on lueteltu sekaisin.\n1. Käännät hänet kylkiasentoon\n2. Soitat 112, kun hän ei herää\n3. Yrität herättää: puhuttelet äänekkäästi ja ravistelet hartioista\n4. Seuraat hengitystä, kunnes ambulanssi tulee\n\nMonesko luettelon kohta tehdään ensimmäisenä?","vastaus":3,"vinkki":"Ennen kuin soitat tai käännät ketään, selvität yhden asian.","selitys":"Ensimmäisenä yritetään herättää: puhutellaan äänekkäästi ja ravistellaan hartioista. Jos hän herää, kyse ei ole tajuttomuudesta. Vasta sitten soitetaan 112, avataan hengitystie, tarkistetaan hengitys ja käännetään kylkiasentoon."},{"id":"H12","ryhma":"ensiapu","tyyppi":"luku","kysymys":"Palohälytys soi. Luokassa 4A on 25 oppilasta, ja 3 heistä on tänään poissa koulusta. Kokoontumispaikalla opettaja laskee 21 oppilasta.\n\nMontako oppilasta puuttuu kokoontumispaikalta?","vastaus":1,"vinkki":"Laske ensin, montako oppilasta oli koulussa tänään.","selitys":"Koulussa oli 25 − 3 = 22 oppilasta. Kokoontumispaikalla on 21, joten yksi puuttuu. Juuri tämän takia kokoontumispaikalta ei lähdetä omin päin: yksi puuttuva tarkoittaa, että pelastajien pitää etsiä häntä."},{"id":"H13","ryhma":"ensiapu","tyyppi":"monivalinta","kysymys":"Olet koulun toisessa kerroksessa, kun palohälytys soi. Lähin poistumisreitti on täynnä savua, mutta toinen merkitty poistumisreitti on savuton.\n\nMitä teet?","vastaus":1,"vinkki":"Mikä on ensimmäinen sääntö, kun poistumisreitillä on savua?","selitys":"Savuun ei mennä, koska savun hengittäminen on vaarallista. Kun toinen merkitty reitti on savuton, käytät sitä. Hissiä ei käytetä, koska se voi pysähtyä savun keskelle. Jos kaikki reitit olisivat savussa, jäisit luokkaan, sulkisit oven ja näyttäisit ikkunasta, että olet sisällä.","vaihtoehdot":["Kuljet matalana savuisen reitin läpi, koska se on lähin","Käytät toista, savutonta poistumisreittiä ja menet kokoontumispaikalle","Otat hissin, koska se on nopein tie ulos"]},{"id":"H14","ryhma":"ensiapu","tyyppi":"luku","kysymys":"Palohälytys soi koulussa.\n1. Lähdet kokoontumispaikalta kotiin heti, kun hälytys lakkaa soimasta\n2. Avaat ikkunat, jotta savu pääsee ulos\n3. Poistut lähintä merkittyä poistumisreittiä pitkin\n4. Valitset toisen poistumisreitin, jos käytävässä on savua\n5. Menet suoraan kokoontumispaikalle\n\nMontako näistä toimintatavoista on oikein?","vastaus":3,"vinkki":"Muista: ulos merkittyä reittiä, savuun ei mennä, ja kokoontumispaikalla pysytään.","selitys":"Oikein ovat 3, 4 ja 5. Väärin ovat 1 (kokoontumispaikalta ei lähdetä ilman lupaa, koska opettajan pitää voida laskea, että kaikki ovat ulkona) ja 2 (ikkunoita ei avata, koska ne tuovat palolle lisää ilmaa)."},{"id":"H15","ryhma":"ehkaisy","tyyppi":"luku","kysymys":"Kerrostaloasunnossa on yksi kerros, jonka pinta-ala on 90 neliömetriä.\n\nMontako palovaroitinta asuntoon tarvitaan vähintään?","vastaus":2,"vinkki":"Yksi palovaroitin riittää 60 neliömetrille. Mitä jää yli?","selitys":"Yksi varoitin kattaa 60 neliömetriä, ja 90 neliömetrissä on ensimmäiset 60 ja sen päälle vielä 30. Jokaista alkavaa 60 neliömetriä kohti tarvitaan oma varoitin, joten niitä tarvitaan kaksi."},{"id":"H16","ryhma":"ehkaisy","tyyppi":"luku","kysymys":"1. Portaissa on kaide\n2. Kattiloiden kahvat on käännetty lieden keskelle päin\n3. Kattilan kahva osoittaa lieden reunan yli\n4. Jatkojohto kulkee lattian poikki oviaukossa\n5. Pyyhkeitä kuivataan saunan kiukaan päällä\n\nMontako näistä on vaaranpaikka, joka pitäisi korjata?","vastaus":3,"vinkki":"Kysy jokaisesta: voiko tästä syttyä tulipalo, voiko tähän kompastua tai voiko pikkulapsi saada tämän käsiinsä?","selitys":"Vaaranpaikkoja ovat 3 (kahvaan voi tarttua tai törmätä ja kaataa kuuman ruoan päälleen), 4 (jatkojohtoon voi kompastua) ja 5 (kiukaan päällä olevat pyyhkeet voivat syttyä palamaan). Kunnossa ovat 1 (kaide) ja 2 (kahvat lieden keskelle päin)."},{"id":"H17","ryhma":"ehkaisy","tyyppi":"luku","kysymys":"Omakotitalossa on kaksi kerrosta. Alakerta on 70 neliömetriä ja yläkerta 50 neliömetriä.\n\nMontako palovaroitinta taloon tarvitaan vähintään?","vastaus":3,"vinkki":"Laske kerrokset erikseen ja laske sitten yhteen.","selitys":"Alakerta: 70 neliömetriä on enemmän kuin 60, joten kaksi varoitinta. Yläkerta: 50 neliömetriä on alle 60, joten yksi. Yhteensä 2 + 1 = 3."},{"id":"H18","ryhma":"ehkaisy","tyyppi":"luku","kysymys":"Palovaroitin testataan painikkeesta kerran kuukaudessa.\n\nMontako kertaa se testataan vuoden aikana?","vastaus":12,"vinkki":"Montako kuukautta vuodessa on?","selitys":"Vuodessa on 12 kuukautta, joten kerran kuukaudessa tarkoittaa 12 testausta vuodessa. Testaus kestää sekunnin ja kertoo, että paristo ja hälytin toimivat."},{"id":"H19","ryhma":"ehkaisy","tyyppi":"luku","kysymys":"1. Palovaroitin sijoitetaan kattoon, koska savu nousee ylös\n2. Yksi palovaroitin riittää koko taloon, jos se on eteisessä\n3. Lääkkeet säilytetään pikkulasten ulottumattomissa\n4. Palovaroittimia tarvitaan jokaiseen kerrokseen\n5. Palovaroitin testataan kerran vuodessa\n\nMontako näistä väitteistä on totta?","vastaus":3,"vinkki":"Mieti, mitä tekstissä sanottiin palovaroittimen paikasta, määrästä ja testaamisesta.","selitys":"Totta ovat 1 (varoitin kattoon, koska savu nousee ylös), 3 (lääkkeet pikkulasten ulottumattomiin) ja 4 (varoitin jokaiseen kerrokseen). Väärin ovat 2 (yksi varoitin ei riitä koko taloon, vaan jokaiseen kerrokseen tarvitaan oma) ja 5 (varoitin testataan kerran kuukaudessa, ei kerran vuodessa)."},{"id":"H20","ryhma":"ehkaisy","tyyppi":"luku","kysymys":"1. Kuuma kahvikuppi on pöydän reunalla pikkusisaruksen ulottuvilla\n2. Matto on rullalla portaiden yläpäässä\n3. Lääkkeet ovat lukitussa laatikossa\n4. Palovaroittimesta on otettu paristo pois, koska se piippasi\n5. Lääkepurkki on keittiön pöydällä pikkusisaruksen ulottuvilla\n\nMontako näistä on vaaranpaikka, joka pitäisi korjata?","vastaus":4,"vinkki":"Katso jokainen kohta erikseen. Kunnossa olevia asioita voi olla vain vähän.","selitys":"Vaaranpaikka on jokainen kohta, josta voi syttyä palo, johon voi kompastua tai jonka pikkulapsi voi saada käsiinsä. Laske ne, äläkä kunnossa olevia."}],"valmis_teksti":"Osaat soittaa hätänumeroon 112 itse, kertoa ensin mitä tapahtui ja sitten missä, ja pitää puhelun auki, kunnes päivystäjä antaa luvan lopettaa. Osaat myös kolme ensiaputilannetta ja tunnistat kodin vaaranpaikat. Tämä taito on nyt näytetty."};

const svg=document.getElementById("nlsvg"), rng=document.getElementById("nlrange"), out=document.getElementById("nlout");
const X0=34, X1=606, Y=62;
function piirraNL(v){
  const ala=Math.floor(v/10)*10, yla=ala+10, puoli=ala+5;
  const pyor = (v%10)>=5 ? yla : ala;
  const x = n => X0 + (n/100)*(X1-X0);
  let s=`<line class="rail" x1="${X0}" y1="${Y}" x2="${X1}" y2="${Y}"/>`;
  for(let n=0;n<=100;n+=10){
    const near = (n===ala||n===yla);
    s+=`<line class="tick" x1="${x(n)}" y1="${Y-7}" x2="${x(n)}" y2="${Y+7}"/>`;
    s+=`<text class="stop${near?" near":""}" x="${x(n)}" y="${Y+24}" text-anchor="middle">${n}</text>`;
  }
  s+=`<line class="halfway" x1="${x(puoli)}" y1="${Y-16}" x2="${x(puoli)}" y2="${Y+12}"/>`;
  s+=`<text class="stop" x="${x(puoli)}" y="${Y-22}" text-anchor="middle">puoliväli ${puoli}</text>`;
  s+=`<circle class="dot" cx="${x(v)}" cy="${Y}" r="6"/>`;
  s+=`<text class="val" x="${x(v)}" y="${Y-32}" text-anchor="middle">${v}</text>`;
  s+=`<path d="M ${x(v)} ${Y+38} L ${x(pyor)} ${Y+38}" stroke="var(--core)" stroke-width="2" fill="none"/>`;
  s+=`<path d="M ${x(pyor)} ${Y+38} l ${x(pyor)>x(v)?-7:7} -4 l 0 8 z" fill="var(--core)"/>`;
  svg.innerHTML=s;
  out.textContent = `${v} pyöristyy → ${pyor}`;
}
if(svg){ piirraNL(+rng.value); rng.addEventListener("input",e=>piirraNL(+e.target.value)); }

  const PAIKAT=["ykköset","kymmenet","sadat","tuhannet","kymmenettuhannet"];
  const LYH=["Y","K","S","T","KT"];
  const IDX={kymmenet:1, sadat:2, tuhannet:3};
  let ntI=0;
  document.getElementById("ntValinta").innerHTML=O.esimerkit.map((e,i)=>
    `<button type="button" data-i="${i}" aria-pressed="${i===0}">${e.luku.toLocaleString("fi-FI",{maximumFractionDigits:10})} → ${e.tarkkuus}</button>`).join("");
  function ntPiirra(){
    const e=O.esimerkit[ntI], t=IDX[e.tarkkuus], kerroin=Math.pow(10,t);
    const tulos=Math.floor((e.luku+kerroin/2)/kerroin)*kerroin;
    const lev=Math.max(String(e.luku).length, String(tulos).length);
    const num=String(e.luku).padStart(lev,"0").split("");
    const res=String(tulos).padStart(lev,"0").split("");
    const luokka=(i,arr,vain0)=>{
      const p=arr.length-1-i;
      if(vain0) return p<t ? "nt-ruutu nolla" : "nt-ruutu";
      if(p===t) return "nt-ruutu kohta";
      if(p===t-1) return "nt-ruutu ratkaiseva";
      return "nt-ruutu";
    };
    const otsat=num.map((_,i)=>`<span class="otsa">${LYH[num.length-1-i]||""}</span>`).join("");

    const rivi2=res.map((n,i)=>`<span class="${luokka(i,res,true)}">${n}</span>`).join("");

      `Pyöristetään <b>${PAIKAT[t]}</b> (sininen ruutu). Ratkaiseva numero on <b>${ratk}</b> (keltainen ruutu). ` +
      (ylos ? `Se on 5 tai suurempi, joten sininen ruutu kasvaa yhdellä.` : `Se on pienempi kuin 5, joten sininen ruutu pysyy ennallaan.`) +
      ` Kaikki keltaisen oikealla puolella muuttuu nolliksi. Vastaus on <b>${tulos.toLocaleString("fi-FI",{maximumFractionDigits:10})}</b>.`;
    document.querySelectorAll("#ntValinta button").forEach((b,i)=>b.setAttribute("aria-pressed",String(i===ntI)));

/* ---------- laskujärjestys-widget ---------- */
const ljExp=document.getElementById("ljExp");
if(ljExp && D.kokeilu){
  let ljI=0, ljTokens=[], ljStep=0;
  const laske=(a,op,b)=>{a=+a;b=+b;return op==="×"?a*b:op==="÷"?a/b:op==="+"?a+b:a-b;};
  function ljAlku(){
    const l=D.kokeilu[ljI];
    ljTokens=l.lauseke.replace(/\(/g,"( ").replace(/\)/g," )").split(/\s+/).filter(Boolean);
    ljStep=0; ljPiirra(); ljViesti("","");
  }
  function ljViesti(t,lk){const f=document.getElementById("ljFb"); f.textContent=t; f.className="lj-fb "+(lk||"");}
  function ljPiirra(){
    const l=D.kokeilu[ljI];
    document.getElementById("ljStep").textContent =
      ljStep>=l.askeleet.length ? "valmis" : `askel ${ljStep+1} / ${l.askeleet.length}`;
    if(ljStep>=l.askeleet.length){
      ljExp.innerHTML=`<span class="valmis">${l.lauseke} = ${l.vastaus}</span>`;
      return;
    }
    ljExp.innerHTML=ljTokens.map((t,i)=>
      "×÷+−".includes(t) ? `<button type="button" class="op" data-i="${i}">${t}</button>`
                         : `<span class="tok">${t}</span>`).join("");
    ljExp.querySelectorAll("button.op").forEach(b=>b.addEventListener("click",()=>ljKlikkaa(+b.dataset.i)));
  }
  function ljKlikkaa(i){
    const l=D.kokeilu[ljI], odotettu=l.askeleet[ljStep];
    const ehdotus=[ljTokens[i-1],ljTokens[i],ljTokens[i+1]].join(" ");
    if(ehdotus!==odotettu){
      ljViesti(ljStep===0
        ? "Ei vielä. Sulkeet ovat vahvimmat, sitten kerto ja jako. Yhtä vahvat vasemmalta oikealle."
        : "Ei vielä. Kumpi jäljellä olevista on vahvempi?", "no");
      return;
    }
    const arvo=laske(ljTokens[i-1],ljTokens[i],ljTokens[i+1]);
    let alku=i-1, loppu=i+1;
    if(ljTokens[i-2]==="(" && ljTokens[i+2]===")"){ alku=i-2; loppu=i+2; }
    ljTokens.splice(alku, loppu-alku+1, String(arvo));
    ljStep++;
    ljViesti(ljStep>=l.askeleet.length ? "Valmis. Vastaus on "+l.vastaus+"." : "Oikein. Jatka seuraavaan.", "ok");
    ljPiirra();
  }
  document.getElementById("ljSeuraava").addEventListener("click",()=>{
    ljI=(ljI+1)%D.kokeilu.length; ljAlku();
  });
  ljAlku();
}

  const O=D.teksti.find(x=>x.tyyppi==="murtokuvio"), T=O.tehtavat||[];
  const $=id=>document.getElementById(id), svg=$("mkSvg");
  const S={tila:"tutki", muoto:"ympyra", n:4, varit:new Set(), ti:0, valmis:false};
  const osaa=k=>k===1?"1 osan":k+" osaa";
  function polut(muoto,n){
    const out=[];
    if(muoto==="ympyra"){
      const cx=130,cy=130,r=118;
      for(let i=0;i<n;i++){
        const a0=-Math.PI/2+2*Math.PI*i/n, a1=-Math.PI/2+2*Math.PI*(i+1)/n;
        const p=a=>`${(cx+r*Math.cos(a)).toFixed(2)},${(cy+r*Math.sin(a)).toFixed(2)}`;
        out.push(`M${cx},${cy} L${p(a0)} A${r},${r} 0 ${(a1-a0)>Math.PI?1:0} 1 ${p(a1)} Z`);
      }
    } else {
      const x=8,y=72,w=244,h=116;

  $("jlTarkista").addEventListener("click",()=>{
    const tt=T[S.ti], pal=$("jlPalaute"), a=twLuku($("jlIn").value);
    if(a===null) return twPalaute(pal,"Kirjoita vastaukseksi luku.","hint");

/* ---------- kestokello: kelaa kelloa, katso miten aika kertyy ---------- */
const kkJuuri=document.getElementById("kk");
if(kkJuuri){
  const O=D.teksti.find(x=>x.tyyppi==="kestokello"), T=O.tehtavat||[];
  const $=id=>document.getElementById(id), svg=$("kkSvg");
  const aika=s=>{const [h,m]=s.split(".").map(Number); return h*60+m;};
  const pad=m=>String(m).padStart(2,"0");
  const klo=t=>{t=((t%1440)+1440)%1440; return Math.floor(t/60)+"."+pad(t%60);};
  const kesto=k=>{const h=Math.floor(k/60), m=k%60, ht=h===1?"1 tunti":h+" tuntia", mt=m===1?"1 minuutti":m+" minuuttia";
    return h&&m?ht+" "+mt:h?ht:mt;};
  const MAX=720;
  const S={tila:"tutki", alku:aika(O.tutki.alku), kulunut:0, ti:0, valmis:false};
  // kellotaulu
  let s=`<circle class="kk-kehys" cx="120" cy="120" r="112"/>`;
  for(let i=0;i<60;i++){const a=i*Math.PI/30, iso=i%5===0, r1=iso?94:100;
    s+=`<line class="kk-viiva${iso?" iso":""}" x1="${(120+r1*Math.sin(a)).toFixed(2)}" y1="${(120-r1*Math.cos(a)).toFixed(2)}" x2="${(120+106*Math.sin(a)).toFixed(2)}" y2="${(120-106*Math.cos(a)).toFixed(2)}"/>`;}
  for(let n=1;n<=12;n++){const a=n*Math.PI/6; s+=`<text class="kk-nro" x="${(120+79*Math.sin(a)).toFixed(2)}" y="${(120-79*Math.cos(a)+6).toFixed(2)}" text-anchor="middle">${n}</text>`;}
  s+=`<line class="kk-tunti" id="kkT" x1="120" y1="120" x2="120" y2="66"/><line class="kk-min" id="kkMi" x1="120" y1="120" x2="120" y2="34"/>
      <circle class="kk-kahva" id="kkKahva" cx="120" cy="34" r="11"/><circle class="kk-keski" cx="120" cy="120" r="5"/>`;
  svg.innerHTML=s;
  const nyt=()=>S.alku+S.kulunut;
  const tt=()=>S.tila==="tehtava"?T[S.ti]:null;
  function viesti(t){$("kkViesti").textContent=t||"";}
  let flashAjastin=null;
  function aseta(uusi,lahde){
    if(S.valmis) return;
    uusi=Math.max(0,Math.min(MAX,uusi));
    if(uusi===S.kulunut){ if(uusi===0&&lahde!=="veto") viesti("Tämä on mittauksen alku. Taaksepäin ei voi kelata."); return; }
    const ennen=Math.floor(nyt()/60); S.kulunut=uusi; const jalkeen=Math.floor(nyt()/60);
    if(lahde==="tunti") viesti("Yksi tunti eteenpäin: tuntiluku kasvoi yhdellä, ja minuutit pysyivät samoina.");
    else if(jalkeen>ennen){ viesti("Minuutit täyttyivät 60:een. Tuntiluku kasvoi yhdellä, ja minuutit alkoivat taas nollasta."); flash(); }
    else if(jalkeen<ennen) viesti("Kelasit taaksepäin edellisen tunnin puolelle. Tuntiluku pieneni yhdellä.");
    else viesti("");
    piirra();
  }
  function flash(){ const mm=$("kkDigi").querySelector(".mm"); clearTimeout(flashAjastin);
    requestAnimationFrame(()=>{const e=$("kkDigi").querySelector(".mm"); if(e){e.classList.add("flash"); flashAjastin=setTimeout(()=>e.classList.remove("flash"),900);}}); }
  function piirra(){
    const t=nyt(), m=t%60, h=Math.floor(t/60)%12;
    const am=m*Math.PI/30, ah=(h*30+m*0.5)*Math.PI/180;
    const mx=(120+86*Math.sin(am)).toFixed(2), my=(120-86*Math.cos(am)).toFixed(2);
    $("kkMi").setAttribute("x2",mx); $("kkMi").setAttribute("y2",my);
    $("kkKahva").setAttribute("cx",mx); $("kkKahva").setAttribute("cy",my);
    $("kkT").setAttribute("x2",(120+54*Math.sin(ah)).toFixed(2)); $("kkT").setAttribute("y2",(120-54*Math.cos(ah)).toFixed(2));
    svg.setAttribute("aria-valuenow",S.kulunut); svg.setAttribute("aria-valuetext",`Kello on ${klo(t)}`);
    $("kkDigi").innerHTML=`${Math.floor((t%1440)/60)}.<span class="mm">${pad(m)}</span><small>${S.tila==="tutki"?"mittaus alkoi "+klo(S.alku):"alku "+klo(S.alku)}</small>`;
    // palat: alusta seuraavaan täyteen tuntiin, täydet tunnit, viimeiset minuutit
    const ekat=(60-S.alku%60)%60, palat=[];
    if(S.kulunut<=ekat||ekat===0&&S.kulunut<60){ if(S.kulunut>0) palat.push({luokka:ekat?"alku":"loppu",min:S.kulunut,a:S.alku}); }

      for(let i=0;i<tunnit;i++){palat.push({luokka:"tunti",min:60,a}); a+=60;}
      if(loput) palat.push({luokka:"loppu",min:loput,a});

    const asteikko=Math.max(120,S.kulunut);

    const t2=tt(), naytaYht=!t2||t2.laji==="loppu"||S.valmis;

      (palat.length?"Laske palat yhteen.":"");
    $("kkM5").disabled=S.kulunut<=0||S.valmis; $("kkP5").disabled=$("kkP60").disabled=S.kulunut>=MAX||S.valmis;
    if(t2&&t2.laji==="kesto"&&!S.valmis&&(t%1440)===aika(t2.loppu)) viesti(`Kello on nyt ${t2.loppu}. Perillä! Laske palat yhteen ja kirjoita vastaus.`);
  }
  // vetäminen
  let vetaa=false, edMin=0;
  function kulmaMin(e){const r=svg.getBoundingClientRect(), x=(e.clientX-r.left)/r.width*240-120, y=(e.clientY-r.top)/r.height*240-120;
    let a=Math.atan2(x,-y); if(a<0) a+=2*Math.PI; return (Math.round(a/(2*Math.PI)*12)*5)%60;}
  function liiku(e){const m=kulmaMin(e); let d=m-edMin; if(d>30) d-=60; if(d<-30) d+=60; if(d){aseta(S.kulunut+d,"veto"); edMin=nyt()%60;}}
  svg.addEventListener("pointerdown",e=>{if(S.valmis) return; vetaa=true; svg.setPointerCapture(e.pointerId); edMin=nyt()%60; liiku(e); e.preventDefault();});
  svg.addEventListener("pointermove",e=>{if(vetaa) liiku(e);});
  ["pointerup","pointercancel","lostpointercapture"].forEach(n=>svg.addEventListener(n,()=>{vetaa=false;}));
  svg.addEventListener("keydown",e=>{
    if(e.key==="ArrowRight"||e.key==="ArrowUp"){e.preventDefault(); aseta(S.kulunut+5,"nappi");}
    if(e.key==="ArrowLeft"||e.key==="ArrowDown"){e.preventDefault(); aseta(S.kulunut-5,"nappi");}
  });
  $("kkM5").addEventListener("click",()=>aseta(S.kulunut-5,"nappi"));
  $("kkP5").addEventListener("click",()=>aseta(S.kulunut+5,"nappi"));
  $("kkP60").addEventListener("click",()=>aseta(S.kulunut+60,"tunti"));
  $("kkAloita").addEventListener("click",()=>{S.alku=nyt()%1440; S.kulunut=0; viesti(`Mittaus alkaa nyt kellosta ${klo(S.alku)}.`); piirra();});
  $("kkNolla").addEventListener("click",()=>{S.kulunut=0; viesti(""); piirra();});
  function aloita(i){
    S.ti=i; S.valmis=false; const t=T[i]; S.alku=aika(t.alku); S.kulunut=0;
    $("kkTehtava").innerHTML=`<b>Tehtävä ${i+1} / ${T.length}.</b> ${t.teksti}<small>${t.laji==="kesto"?
      `Kelaa kello aikaan ${t.loppu} ja laske palkin palat yhteen.`:`Kelaa kello eteenpäin tehtävän keston verran ja lue kellonaika.`}</small>`;
    $("kkInLbl").textContent=t.laji==="kesto"?"Minuutteja:":"Päättymisaika (esim. 12.05):";
    $("kkIn").setAttribute("inputmode",t.laji==="kesto"?"numeric":"decimal");
    $("kkIn").value=""; twPalaute($("kkPalaute"),""); viesti(""); piirra();
  }
  twTilat(kkJuuri,tila=>{
    S.tila=tila; S.valmis=false; twPalaute($("kkPalaute"),""); viesti("");
    const t=tila==="tehtava";
    $("kkTehtava").hidden=$("kkVastaus").hidden=!t; $("kkTutkiNapit").hidden=t;
    if(t) aloita(S.ti); else {S.alku=aika(O.tutki.alku); S.kulunut=0; piirra();}
  });
  $("kkTarkista").addEventListener("click",()=>{
    const t=tt(); if(!t) return; const pal=$("kkPalaute"), syote=$("kkIn").value.trim();
    if(t.laji==="kesto"){
      const a=twLuku(syote); if(a===null) return twPalaute(pal,"Kirjoita vastaukseksi minuuttien määrä numeroina.","hint");
      const oikea=aika(t.loppu)-aika(t.alku), naivi=Number(t.loppu.replace(".",""))-Number(t.alku.replace(".","")),
            perakkain=Math.floor(oikea/60)*100+oikea%60;
      if(a===oikea){S.valmis=true; piirra(); return twPalaute(pal,`Oikein! ${t.alku} → ${t.loppu} kestää ${oikea} minuuttia${oikea>=60?" eli "+kesto(oikea):""}.`,"ok");}
      if(a===naivi) return twPalaute(pal,`${naivi} tulee, jos kellonajat vähennetään kuin tavalliset luvut. Tunnissa on kuitenkin 60 minuuttia, ei 100. Kelaa kello ja laske palat yhteen.`,"no");
      if(a===perakkain && oikea>=60) return twPalaute(pal,`Kirjoitit tunnit ja minuutit peräkkäin (${kesto(oikea)}). Kysymys pyytää pelkkiä minuutteja: yksi tunti on 60 minuuttia.`,"no");
      return twPalaute(pal,`Ei aivan. Kelaa kello aikaan ${t.loppu} ja laske palkin palat yhteen.`,"no");
    }
    const m=syote.match(/^(\d{1,2})[.:,](\d{2})$/);
    if(!m) return twPalaute(pal,"Kirjoita aika muodossa tunnit.minuutit, esimerkiksi 12.05.","hint");
    const hh=+m[1], mm=+m[2];
    if(mm>59) return twPalaute(pal,"Minuuttiluku voi olla korkeintaan 59. Kun minuutteja kertyy 60, niistä tulee yksi tunti lisää.","no");
    const oikea=(aika(t.alku)+t.kesto)%1440;
    if(hh*60+mm===oikea){S.valmis=true; piirra(); return twPalaute(pal,`Oikein! ${t.alku} + ${kesto(t.kesto)} = ${klo(oikea)}.`,"ok");}
    twPalaute(pal,`Ei aivan. Kelaa kello tasan ${kesto(t.kesto)} eteenpäin, niin näet päättymisajan.`,"no");
  });
  $("kkIn").addEventListener("keydown",e=>{if(e.key==="Enter") $("kkTarkista").click();});
  $("kkSeuraava").addEventListener("click",()=>{
    const uusi=(S.ti+1)%T.length; aloita(uusi);
    if(uusi===0) twPalaute($("kkPalaute"),"Kävit kaikki tehtävät läpi. Ne alkavat nyt alusta.","hint");
  });
  piirra();
}

/* ---------- harjoitukset ----------
   Kaksi vastaustyyppiä: "numero" (oletus, tekstikenttä + Number()-vertailu) ja
   "monivalinta" (valintapainikkeet, h.vaihtoehdot[] + h.vastaus = oikean vaihtoehdon indeksi).
   Jos D.harjoitukset puuttuu tai on tyhjä, koko osio piilotetaan (näyttötaidot, ei kirjallista
   harjoitusta: liikunta, kuvataide). */
/* Kysymyksessä voi olla luettavaa aineistoa ja sen jälkeen varsinainen kysymys,
   erotettuna tyhjällä rivillä. Viimeinen osa on kysymys, sitä edeltävät aineistoa. */
const kysymysHtml = t => {
  const osat = String(t).split(/\n\s*\n/).map(x=>x.trim()).filter(Boolean);
  if(osat.length < 2) return osat[0] || "";
  const kysymys = osat.pop();
  return osat.map(p=>`<span class="aineisto">${p}</span>`).join("")
       + `<span class="kysymysrivi">${kysymys}</span>`;
};

function merkitseTulos(id, oikein, viesti){

/* Suomalainen lukumuoto: välilyönti on tuhaterotin, pilkku desimaalierotin.
   Piste voi olla kumpi tahansa. Se tulkitaan tuhaterottimeksi VAIN silloin, kun
   koko luku on aitoa tuhaterotinmuotoa: alkuosa 1–3 numeroa ilman etunollaa ja
   jokainen jatko-osa täsmälleen 3 numeroa (1.500, 12.345.678). Kaikissa muissa
   tapauksissa piste on desimaalipiste — myös 0.125, joka vanhalla säännöllä
   ("3 numeroa pisteen jäljessä = tuhaterotin") luettiin virheellisesti luvuksi 125. */
const TUHATEROTIN = /^[1-9]\d{0,2}(\.\d{3})+$/;
function lueLuku(teksti){
  // Murtoluku (3/4, -3/4) ja sekaluku (1 2/3, -1 2/3) hyväksytään sellaisinaan.
  const raaka = String(teksti).replace(/\u00a0/g, " ").trim();
  let m = raaka.match(/^(-?)(\d+)\s+(\d+)\s*\/\s*(\d+)$/);
  if(m){ const nim = Number(m[4]); if(nim === 0) return null;
    const v = Number(m[2]) + Number(m[3]) / nim; return m[1] ? -v : v; }
  m = raaka.match(/^(-?)\s*(\d+)\s*\/\s*(\d+)$/);
  if(m){ const nim = Number(m[3]); if(nim === 0) return null;
    const v = Number(m[2]) / nim; return m[1] ? -v : v; }
  let s = String(teksti).replace(/[\s\u00a0]/g, "");
  if(s === "") return null;
  if(s.indexOf(",") >= 0){
    s = s.replace(/\./g, "").replace(",", ".");
  } else if(TUHATEROTIN.test(s)){
    s = s.replace(/\./g, "");
  }
  const n = Number(s);
  return Number.isFinite(n) ? n : null;
}

function tarkista(id){
  const h=D.harjoitukset.find(x=>x.id===id);
  const kentta=document.getElementById("in-"+id);
  const fb=document.getElementById("fb-"+id);
  if(kentta.value.trim()===""){ fb.className="fb hint"; fb.textContent="Kirjoita vastaus ensin."; return; }
  const luku=lueLuku(kentta.value);
  if(luku===null){ fb.className="fb no"; fb.textContent="Vastauksen pitää olla luku tai murtoluku (esimerkiksi 3/4)."; return; }
  const oikein = Math.abs(luku - h.vastaus) < 1e-9;
  merkitseTulos(id, oikein, oikein ? "Oikein. "+h.selitys : `Ei vielä. ${h.vinkki} Kokeile uudelleen.`);
}

function tarkistaMonivalinta(id, valittuIndeksi, painike){
  const h=D.harjoitukset.find(x=>x.id===id);
  const rivi=painike.closest(".row");
  rivi.querySelectorAll(".mv-valinta").forEach(b=>b.disabled=true);
  const oikein = valittuIndeksi===h.vastaus;
  painike.classList.add(oikein?"mv-oikein":"mv-vaarin");
  if(!oikein){
    const oikeaBtn=rivi.querySelector(`[data-i="${h.vastaus}"]`);
    if(oikeaBtn) oikeaBtn.classList.add("mv-oikein");
  }
  merkitseTulos(id, oikein, oikein ? "Oikein. "+h.selitys : `Ei ihan. Oikea vastaus on korostettu. ${h.selitys||""}`);
}

/* Kuuntelu: selain lukee tekstin ääneen omalla puhesynteesillään (englanniksi, jos laitteessa on
   englanninkielinen ääni). Ei äänitiedostoja eikä verkkoyhteyttä. Jos laite ei osaa puhua,
   teksti näytetään luettavaksi — silloin tehtävä muuttuu luetun ymmärtämiseksi, mutta ei katkea. */
function puhu(id, nopeus){
  const h=D.harjoitukset.find(x=>x.id===id); if(!h || !h.kuuntele) return;
  const vara=document.getElementById("vara-"+id);
  const naytaTeksti=syy=>{ vara.hidden=false; vara.textContent=syy+" Teksti: "+h.kuuntele; };
  if(!("speechSynthesis" in window)){ naytaTeksti("Tämä laite ei osaa lukea ääneen."); return; }
  const s=window.speechSynthesis; s.cancel();
  const u=new SpeechSynthesisUtterance(h.kuuntele);
  u.lang=h.kieli||"en-GB"; u.rate=nopeus;
  const aanet=s.getVoices(), kieli=u.lang.slice(0,2);
  const aani=aanet.find(a=>a.lang===u.lang) || aanet.find(a=>a.lang && a.lang.startsWith(kieli));
  if(aani) u.voice=aani;
  else if(aanet.length) { naytaTeksti("Laitteessa ei ole englanninkielistä ääntä."); return; }
  u.onerror=()=>naytaTeksti("Ääneen lukeminen ei onnistunut.");
  s.speak(u);
}

  if(k) puhu(k.dataset.kuuntele, 0.9);

  }
});
