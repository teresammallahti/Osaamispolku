<title>Merkit paperilla</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">

<style>
:root{
  --paper:#EFF2F5; --surface:#FFFFFF; --surface-2:#F7F9FB;
  --grid:#DCE3EA; --line:#C9D3DC;
  --ink:#15222C; --ink-2:#4E626F; --ink-3:#7E8F9B;
  --core:#1B5A9E; --core-soft:#E4EDF6;
  --strong:#1F6E5C; --strong-soft:#E1F0EB;
  --chal:#9A6A16; --chal-soft:#F6EDDC;
  --alert:#A33A2B; --alert-soft:#F8E7E3;
  --shadow:0 1px 2px rgba(21,34,44,.06), 0 8px 24px -12px rgba(21,34,44,.18);
  --r:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0F161B; --surface:#18222A; --surface-2:#1D2830;
    --grid:#22303A; --line:#2E3E4A;
    --ink:#E8EFF4; --ink-2:#A3B4C0; --ink-3:#7A8B97;
    --core:#7FB2E4; --core-soft:#16303F;
    --strong:#77CDB4; --strong-soft:#123028;
    --chal:#E0B267; --chal-soft:#33270F;
    --alert:#E8907F; --alert-soft:#3A1E19;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -14px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --paper:#0F161B; --surface:#18222A; --surface-2:#1D2830;
  --grid:#22303A; --line:#2E3E4A;
  --ink:#E8EFF4; --ink-2:#A3B4C0; --ink-3:#7A8B97;
  --core:#7FB2E4; --core-soft:#16303F;
  --strong:#77CDB4; --strong-soft:#123028;
  --chal:#E0B267; --chal-soft:#33270F;
  --alert:#E8907F; --alert-soft:#3A1E19;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -14px rgba(0,0,0,.7);
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:16px; line-height:1.62;
  background-image:
    linear-gradient(to right, var(--grid) 1px, transparent 1px),
    linear-gradient(to bottom, var(--grid) 1px, transparent 1px);
  background-size:26px 26px;
}
.wrap{max-width:760px; margin:0 auto; padding:28px 20px 90px}
h1,h2,h3,h4{font-family:"Familjen Grotesk","IBM Plex Sans",system-ui,sans-serif; text-wrap:balance}

/* header */
header.top{background:var(--surface); border:1px solid var(--line); border-radius:var(--r);
  box-shadow:var(--shadow); padding:22px 24px; display:flex; gap:18px; align-items:flex-start}
.badge{flex:0 0 auto; width:54px; height:54px; border-radius:9px; display:grid; place-items:center;
  background:var(--core-soft); border:1px solid var(--core); color:var(--core)}
.badge svg{width:28px; height:28px; fill:none; stroke:currentColor; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round}
.eyebrow{font-family:"IBM Plex Mono",monospace; font-size:11px; letter-spacing:.14em;
  text-transform:uppercase; color:var(--ink-3); margin:0 0 5px}
header.top h1{margin:0; font-size:30px; font-weight:700; letter-spacing:-.015em}
header.top p{margin:5px 0 0; color:var(--ink-2); font-size:15px}
.tags{display:flex; flex-wrap:wrap; gap:5px; margin-top:11px}
.tag{font-family:"IBM Plex Mono",monospace; font-size:10.5px; letter-spacing:.05em; padding:2px 7px;
  border-radius:4px; background:var(--surface-2); border:1px solid var(--line); color:var(--ink-3)}
.tag.core{background:var(--core-soft); border-color:var(--core); color:var(--core)}

/* teksti */
article{margin-top:26px}
article h2{font-size:21px; font-weight:600; margin:32px 0 10px; letter-spacing:-.01em}
article p{margin:0 0 14px; max-width:64ch}
.lead{font-size:17.5px; color:var(--ink); border-left:3px solid var(--core); padding-left:16px; margin:0 0 8px}

.box{background:var(--surface); border:1px solid var(--line); border-radius:var(--r);
  padding:18px 22px; box-shadow:var(--shadow); margin:22px 0}
.box h3{margin:0 0 12px; font-size:16.5px; font-weight:600}
.box.warn{border-left:3px solid var(--alert)}
.box.note{border-left:3px solid var(--chal)}

ol.steps{margin:0; padding-left:0; list-style:none; counter-reset:s; display:grid; gap:12px}
ol.steps li{counter-increment:s; display:grid; grid-template-columns:auto 1fr; gap:13px; align-items:start}
ol.steps li::before{content:counter(s); font-family:"Familjen Grotesk",sans-serif; font-weight:700; font-size:14px;
  width:26px; height:26px; border-radius:50%; background:var(--core); color:#fff; display:grid; place-items:center; margin-top:2px}

ul.notes{margin:0; padding-left:19px}
ul.notes li{margin-bottom:7px}
ul.notes li:last-child{margin-bottom:0}

.tablewrap{overflow-x:auto}
table{border-collapse:collapse; width:100%; font-size:14.5px; min-width:460px}
th,td{text-align:left; padding:9px 13px; border-bottom:1px solid var(--line)}
th{font-family:"IBM Plex Mono",monospace; font-size:10.5px; letter-spacing:.1em; text-transform:uppercase;
  color:var(--ink-3); font-weight:400; background:var(--surface-2)}
tr:last-child td{border-bottom:0}
td b{color:var(--core); font-weight:600}
td:last-child{font-variant-numeric:tabular-nums; font-weight:600}

/* lukusuora */
.nl svg{width:100%; height:118px; display:block}
.nl .rail{stroke:var(--line); stroke-width:2}
.nl .tick{stroke:var(--line); stroke-width:1.5}
.nl .stop{fill:var(--ink-3); font-family:"IBM Plex Mono",monospace; font-size:11px}
.nl .stop.near{fill:var(--core); font-weight:600}
.nl .dot{fill:var(--chal)}
.nl .val{fill:var(--ink); font-family:"Familjen Grotesk",sans-serif; font-size:15px; font-weight:700}
.nl .halfway{stroke:var(--chal); stroke-dasharray:3 3; stroke-width:1.5}
.nl-controls{display:flex; align-items:center; gap:14px; margin-top:6px}
.nl-controls input{flex:1; accent-color:var(--core)}
.nl-out{font-family:"Familjen Grotesk",sans-serif; font-size:15px; font-weight:600; min-width:12.5em; text-align:right}

/* paikka-arvotaulu */
.box .ohje{margin:0 0 14px; font-size:14.5px; color:var(--ink-2)}
.nt-valinta{display:flex; flex-wrap:wrap; gap:7px; margin-bottom:16px}
.nt-valinta button{font:inherit; font-size:12.5px; font-family:"IBM Plex Mono",monospace; padding:5px 11px;
  border-radius:6px; border:1px solid var(--line); background:var(--surface-2); color:var(--ink-2); cursor:pointer}
.nt-valinta button[aria-pressed="true"]{background:var(--ink); color:var(--paper); border-color:var(--ink)}
.nt-valinta button:focus-visible{outline:2px solid var(--core); outline-offset:2px}
.nt-taulu{display:flex; flex-direction:column; gap:4px; align-items:flex-start; overflow-x:auto; padding-bottom:4px}
.nt-rivi{display:flex; gap:6px; align-items:center}
.nt-rivi .otsa{font-family:"IBM Plex Mono",monospace; font-size:9.5px; letter-spacing:.08em;
  text-transform:uppercase; color:var(--ink-3); width:52px; text-align:center}
.nt-ruutu{width:52px; height:52px; display:grid; place-items:center; border:1.5px solid var(--line);
  border-radius:7px; background:var(--surface-2); font-family:"IBM Plex Mono",monospace; font-size:24px}
.nt-ruutu.kohta{border-color:var(--core); background:var(--core-soft); color:var(--core); font-weight:500}
.nt-ruutu.ratkaiseva{border-color:var(--chal); background:var(--chal-soft); color:var(--chal); font-weight:500}
.nt-ruutu.nolla{color:var(--ink-3)}
.nt-rivi .nimi{font-size:12.5px; color:var(--ink-3); margin-left:12px; white-space:nowrap}
.nt-nuoli{font-size:17px; color:var(--chal); margin-left:6px}
.nt-selite{margin:14px 0 0; font-size:14.5px}
.nt-selite b{color:var(--core)}

/* vahvuusportaat */
.vp-tasot{display:grid; gap:9px; margin-bottom:18px}
.vp-taso{display:flex; gap:11px; align-items:flex-start; font-size:13.5px}
.vp-taso .vp-pallo{width:13px; height:13px; border-radius:4px; margin-top:5px; flex:0 0 auto}
.vp-taso[data-taso="sulkeet"] .vp-pallo{background:var(--core)}
.vp-taso[data-taso="kertojako"] .vp-pallo{background:var(--strong)}
.vp-taso[data-taso="yhteenvahennys"] .vp-pallo{background:var(--chal)}
.vp-taso strong{display:block; font-family:"Familjen Grotesk",sans-serif; font-weight:600; font-size:14.5px}
.vp-taso span{color:var(--ink-2)}
.vp-lauseke{display:flex; flex-wrap:wrap; gap:7px; align-items:flex-end; font-family:"IBM Plex Mono",monospace;
  font-size:25px; padding:10px 2px; min-height:64px}
.vp-lauseke .t{padding:2px 3px}
.vp-lauseke .op{position:relative; padding:2px 9px; border-radius:6px; font-weight:500}
.vp-lauseke .op[data-taso="sulkeet"]{background:var(--core-soft); color:var(--core)}
.vp-lauseke .op[data-taso="kertojako"]{background:var(--strong-soft); color:var(--strong)}
.vp-lauseke .op[data-taso="yhteenvahennys"]{background:var(--chal-soft); color:var(--chal)}
.vp-lauseke .op i{position:absolute; top:-9px; right:-6px; font-style:normal; font-family:"Familjen Grotesk",sans-serif;
  font-size:11px; font-weight:700; width:18px; height:18px; border-radius:50%; display:grid; place-items:center;
  background:currentColor}
.vp-lauseke .op i span{color:var(--surface)}
.vp-rivi{display:flex; align-items:center; gap:16px; margin-top:8px}
.vp-vastaus{font-family:"Familjen Grotesk",sans-serif; font-size:16px; font-weight:600; color:var(--strong)}

/* laskujärjestys-widget */
.lj-exp{display:flex; flex-wrap:wrap; gap:7px; align-items:center; font-family:"IBM Plex Mono",monospace;
  font-size:23px; padding:14px 4px; min-height:62px}
.lj-exp .tok{padding:2px 4px; color:var(--ink)}
.lj-exp button.op{font-family:"IBM Plex Mono",monospace; font-size:23px; padding:3px 12px; border-radius:7px;
  border:1.5px solid var(--line); background:var(--surface-2); color:var(--ink); line-height:1.2}
.lj-exp button.op:hover{border-color:var(--core); color:var(--core)}
.lj-exp button.op:focus-visible{outline:2px solid var(--core); outline-offset:2px}
.lj-exp .valmis{font-family:"Familjen Grotesk",sans-serif; font-size:23px; font-weight:700; color:var(--strong)}
.lj-fb{font-size:14.5px; min-height:1.5em; color:var(--ink-2)}
.lj-fb.no{color:var(--alert)}
.lj-fb.ok{color:var(--strong)}
.lj-row{display:flex; align-items:center; gap:14px; margin-top:10px}
.lj-step{font-family:"IBM Plex Mono",monospace; font-size:11.5px; letter-spacing:.1em;
  text-transform:uppercase; color:var(--ink-3)}

/* harjoitukset */
.progress{position:sticky; top:0; z-index:5; background:var(--surface); border:1px solid var(--line);
  border-radius:var(--r); padding:12px 18px; box-shadow:var(--shadow); display:flex; align-items:center;
  gap:14px; margin:34px 0 18px}
.progress .lbl{font-family:"IBM Plex Mono",monospace; font-size:11px; letter-spacing:.12em;
  text-transform:uppercase; color:var(--ink-3); white-space:nowrap}
.progress .meter{flex:1; height:7px; border-radius:4px; background:var(--surface-2); border:1px solid var(--line); overflow:hidden}
.progress .meter i{display:block; height:100%; background:var(--core); transition:width .25s ease}
.progress .cnt{font-family:"Familjen Grotesk",sans-serif; font-weight:700; font-variant-numeric:tabular-nums; white-space:nowrap}

.grp{margin-top:26px}
.grp-head{display:flex; align-items:baseline; gap:10px; border-bottom:1.5px solid var(--ink); padding-bottom:7px; margin-bottom:14px}
.grp-head h3{margin:0; font-size:17px; font-weight:600}
.grp-head span{font-size:12.5px; color:var(--ink-2)}

.ex{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:14px 16px; margin-bottom:10px}
.ex[data-tila="oikein"]{border-color:var(--strong); box-shadow:inset 3px 0 0 var(--strong)}
.ex[data-tila="vaarin"]{border-color:var(--alert); box-shadow:inset 3px 0 0 var(--alert)}
.ex .q{display:flex; gap:11px; align-items:baseline; flex-wrap:wrap}
.ex .num{font-family:"IBM Plex Mono",monospace; font-size:11.5px; color:var(--ink-3); min-width:2.4em}
.ex .txt{flex:1; min-width:190px; font-size:15.5px}
.ex .txt .aineisto{display:block; margin-bottom:9px; padding-left:12px;
  border-left:2px solid var(--line); color:var(--ink-2); line-height:1.6;
  /* Aineisto voi olla pieni taulukko, jonka rivit on erotettu rivinvaihdoilla.
     Ilman pre-lineä ne valuisivat yhdeksi kappaleeksi ja taulukko katoaisi. */
  white-space:pre-line}
.ex .txt .kysymysrivi{display:block; font-weight:600}
.ex .row{display:flex; gap:8px; align-items:center; margin-top:11px; flex-wrap:wrap}
.ex input[type=text]{font:inherit; font-family:"IBM Plex Mono",monospace; font-size:15px; width:8.5em;
  padding:7px 11px; border:1px solid var(--line); border-radius:7px; background:var(--surface-2);
  color:var(--ink); text-align:right}
.ex input:focus-visible{outline:2px solid var(--core); outline-offset:1px}
button{font:inherit; cursor:pointer}
.btn{font-size:13.5px; padding:7px 15px; border-radius:7px; border:1px solid var(--core);
  background:var(--core); color:#fff}
.btn.ghost{background:transparent; color:var(--ink-2); border-color:var(--line)}
.btn:focus-visible{outline:2px solid var(--core); outline-offset:2px}
.btn.mv-valinta{text-align:left}
/* kuuntelutehtävä: selaimen puhesynteesi lukee englanninkielisen tekstin */
.kuuntele{display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin:2px 0 10px}
.kuuntele .btn{display:inline-flex; gap:7px; align-items:center}
.kuuntele svg{width:16px; height:16px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round}
.kuuntele .varateksti{flex-basis:100%; font-size:14px; color:var(--ink-2); background:var(--surface-2);
  border-radius:7px; padding:8px 12px; margin:0}
.btn.mv-valinta:disabled{cursor:default; opacity:.65}
.btn.mv-oikein{background:var(--strong-soft); border-color:var(--strong); color:var(--strong); opacity:1}
.btn.mv-vaarin{background:var(--alert-soft); border-color:var(--alert); color:var(--alert); opacity:1}
.row.mv{gap:8px 10px}
.fb{margin-top:11px; font-size:14.5px; padding:10px 13px; border-radius:8px; line-height:1.5}
.fb.ok{background:var(--strong-soft); color:var(--strong)}
.fb.no{background:var(--alert-soft); color:var(--alert)}
.fb.hint{background:var(--chal-soft); color:var(--chal)}

.done{background:var(--strong-soft); border:1px solid var(--strong); color:var(--strong);
  border-radius:var(--r); padding:16px 20px; margin-top:20px; font-size:15.5px}
.done h3{margin:0 0 4px; font-size:17px; color:var(--strong)}

details.teacher{margin-top:34px; background:var(--surface); border:1px solid var(--line);
  border-left:3px solid var(--chal); border-radius:var(--r); padding:15px 20px; box-shadow:var(--shadow)}
details.teacher summary{cursor:pointer; font-family:"Familjen Grotesk",sans-serif; font-weight:600; font-size:15px}
details.teacher summary:focus-visible{outline:2px solid var(--core); outline-offset:3px}
details.teacher ul{margin:12px 0 0; padding-left:19px; color:var(--ink-2); font-size:14.5px}
details.teacher li{margin-bottom:8px}
details.teacher p{margin:12px 0 0; color:var(--ink-2); font-size:14.5px}

.back{display:inline-block; margin-top:30px; font-size:13.5px; color:var(--ink-2)}
.back a{color:var(--core)}

@media (prefers-reduced-motion: reduce){*{transition:none !important}}
@media (max-width:560px){
  .wrap{padding:16px 13px 70px}
  header.top h1{font-size:25px}
  .progress{flex-wrap:wrap}
}
</style>

<div class="wrap">

  <header class="top">
    <span class="badge"><svg viewBox="0 0 24 24" aria-hidden="true" id="ikoni"></svg></span>
    <div>
      <p class="eyebrow" id="eyebrow"></p>
      <h1 id="otsikko"></h1>
      <p id="kuvaus"></p>
      <div class="tags" id="tags"></div>
    </div>
  </header>

  <article id="teksti"></article>

  <div class="progress" aria-live="polite">
    <span class="lbl">Harjoitukset</span>
    <span class="meter"><i id="pbar" style="width:0%"></i></span>
    <span class="cnt" id="pcnt">0 / 20</span>
  </div>

  <div id="harjoitukset"></div>
  <div id="valmis"></div>

  <p class="back" id="back"></p>

</div>

<script>
const D = {"tavoite_id":"HI4-ILM-02","oppiaine":"HI","vuosiluokka":4,"taso":"ydin","otsikko":"Merkit paperilla","kuvaus":"Ymmärrän, mitä kirjoitustaidon keksiminen muutti ihmisten elämässä.","versio":"0.2","paivitetty":"2026-09-26","ops":{"T":["T6","T8"],"S":["S2"]},"eyebrow":"Historia · 4. luokka · Ilmiöiden ymmärtäminen","ikoni":"kyna","teksti":[{"tyyppi":"johdanto","sisalto":"Jääkaapin ovessa on lappu: \"Osta maitoa ja ruisleipää. Tulen kotiin kuudelta.\" Lapun kirjoittaja on jo lähtenyt, mutta viesti on yhä siinä, sanasta sanaan. Kenenkään ei tarvinnut muistaa sitä. Kuvittele nyt aika, jolloin kukaan maailmassa ei osannut kirjoittaa. Jokainen sopimus, sääntö ja tarina oli jonkun muistissa, ja kun muistaja kuoli, tieto katosi tai muuttui kertojalta toiselle. Kirjoitus keksittiin runsaat 5 000 vuotta sitten. Se muutti sen, miten ihmiset pitivät kirjaa, tekivät sopimuksia ja säilyttivät tietoa. Siksi ihmisen menneisyys jaetaan kahteen osaan: esihistoriaan ennen kirjoitusta ja historiaan sen jälkeen."},{"tyyppi":"kappale","otsikko":"Miksi kirjoitus keksittiin","sisalto":"Kirjoitus keksittiin Mesopotamiassa, Eufrat- ja Tigris-jokien välisellä alueella, joka on suurimmaksi osaksi nykyisen Irakin alueella. Siellä oli noin 3200 eaa. suuria kaupunkeja, kuten Uruk. Kaupungin temppeliin tuotiin viljaa, lampaita ja muita tavaroita, ja sieltä jaettiin työläisille ruoka-annoksia. Kun ihmisiä ja tavaroita oli tuhansia, kukaan ei pystynyt muistamaan, kuka oli tuonut mitä ja kuka oli saanut mitä. Määriä oli merkitty jo pitkään pienillä savimerkeillä, mutta niistä ei voinut lukea, kenen vilja oli tai kenelle se oli luvattu. Siksi vanhimmat savitaulut ovat enimmäkseen kirjanpitoa. Kirjanpito tarkoittaa merkintöjä siitä, mitä tuotiin, annettiin, maksettiin tai lainattiin ja kuinka paljon. Kirjoitusta ei alun perin käytetty tarinoihin, vaan se syntyi, kun kirjanpito kasvoi liian suureksi muistettavaksi."},{"tyyppi":"kappale","otsikko":"Savitaulusta kirjaimiin","sisalto":"Mesopotamiassa kirjoitettiin kosteaan saveen kaislan tai puutikun kärjellä. Aluksi merkit olivat pieniä kuvia: viljantähkä tarkoitti viljaa ja härän pää härkää. Vähitellen kuvat yksinkertaistuivat merkeiksi, jotka painettiin saveen kiilan muotoisilla painalluksilla. Siksi tätä kirjoitusta sanotaan nuolenpääkirjoitukseksi. Kuivunut tai poltettu savitaulu voi säilyä tuhansia vuosia, ja siksi tutkijat voivat lukea niitä nykyään. Egyptissä syntyi suunnilleen samoihin aikoihin oma kirjoitus, hieroglyfit. Ne näyttävät kuvilta, mutta ne ovat kirjoitusta, koska merkit tarkoittavat kielen sanoja ja äänteitä. Hieroglyfejä kirjoitettiin kiveen ja papyrukselle. Tutkijat eivät ole varmoja, kummassa maassa kirjoitus syntyi ensin, ja todennäköisesti kirjoitustavat kehittyivät toisistaan erillään. Kirjaimet ovat paljon myöhempi keksintö: vanhimmat tunnetut kirjaimet tehtiin yli tuhat vuotta nuolenpääkirjoituksen jälkeen, ja ne muokattiin egyptiläisistä merkeistä. Niistä kehittyivät vähitellen kreikkalaiset ja latinalaiset kirjaimet, joilla sinäkin kirjoitat."},{"tyyppi":"taulukko","otsikko":"Mitä kirjoitus muutti","otsikkorivi":["Asia","Ennen kirjoitusta","Kirjoituksen jälkeen"],"rivit":[["Verot ja kirjanpito","Määrät muistettiin tai merkittiin savimerkeillä, mutta maksajan nimeä ei voinut merkitä.","Savitauluun kirjattiin, kuka maksoi, mitä ja kuinka paljon."],["Sopimukset","Sovittiin suullisesti, ja todisteena oli todistajien muisti.","Sopimuksen sanat voitiin tarkistaa vuosien päästä, vaikka sopijat olisivat kuolleet."],["Lait","Säännöt olivat ihmisten muistissa, ja ne saattoivat muuttua kertojalta toiselle.","Babylonin kuningas Hammurabi pani lakinsa kivipaaseen noin 1750 eaa. Jokainen lukutaitoinen luki samat sanat."],["Viestit kauas","Viestinviejän piti muistaa viesti ulkoa.","Savitaulun tai kirjeen sanat menivät perille samoina."],["Tarinat","Tarinat kerrottiin suusta suuhun, ja ne saattoivat muuttua kertojan mukana.","Kirjoitetun savitaulun sanat säilyivät samoina. Gilgamešin tarinat ovat vanhimpia säilyneitä kirjoitettuja kertomuksia."],["Menneisyyden tutkiminen","Menneisyydestä kertovat vain maasta löytyvät jäljet ja ihmisten muisti.","Ihmiset kirjoittivat muistiin nimiä ja tapahtumia, ja niistä voi lukea heidän omin sanoin kertomaansa."]]},{"tyyppi":"saanto","otsikko":"Tarvitaanko tähän kirjoitusta?","askeleet":["Kysy ensin: pitääkö sanojen tai nimien säilyä tarkkoina niin, ettei kenenkään tarvitse muistaa niitä? Jos pitää, tarvitaan kirjoitusta. Tämä on tämän taidon sopimus.","Kysy sitten: pitääkö viestin mennä perille samoina sanoina, vaikka viejä unohtaisi sen? Jos pitää, tarvitaan kirjoitusta.","Jos asian voi tehdä käsillä, puhumalla kasvokkain tai muistamalla, se onnistui jo ennen kirjoitusta. Myös pelkkien määrien merkitseminen onnistui, esimerkiksi savimerkeillä.","Kuva ei ole kirjoitusta, vaikka se kertoo jotakin. Kalliomaalauksen hirvestä jokainen katsoja kertoo omin sanoin. Kirjoitus on merkkejä, jotka tarkoittavat kielen sanoja tai äänteitä, ja siksi jokainen lukija lukee samat sanat. Siksi myöskään koristekuviot, lovet tai savimerkit eivät ole kirjoitusta."]},{"tyyppi":"kappale","otsikko":"Miksi raja on juuri kirjoituksessa","sisalto":"Historialla tarkoitetaan tässä aikaa, josta on kirjoitettuja lähteitä. Esihistoria on ihmisen menneisyyttä sitä ennen. Esihistoriaa tutkitaan arkeologisten löytöjen avulla: esineistä, asuinpaikoista ja haudoista voi päätellä, miten ihmiset elivät. Löydöt eivät kuitenkaan kerro nimiä eivätkä sanoja, eivätkä ne kerro, mitä joku sanoi tai lupasi. Kirjoitetussa lähteessä ihmiset kertovat itse, omin sanoin: kuka hallitsi, kuka maksoi veronsa ja mitä sovittiin. Siksi kirjoitus on raja. Raja ei tarkoita, että ihmiset olisivat muuttuneet toisenlaisiksi. Se tarkoittaa, että lähteet, joista menneisyyttä tutkitaan, muuttuvat."},{"tyyppi":"taulukko","otsikko":"Milloin historia alkoi eri paikoissa","otsikkorivi":["Paikka","Kirjoitettuja lähteitä alkaa olla","Huomio"],"rivit":[["Mesopotamia","noin 3200 eaa.","Vanhimpia tunnettuja kirjoituksia."],["Egypti","noin 3200 eaa.","Suunnilleen samaan aikaan kuin Mesopotamiassa."],["Kiina","noin 1250 eaa.","Vanhimmat löydetyt kirjoitukset ovat eläinten luissa ja kilpikonnien kuorissa."],["Suomi","noin 1150 jaa.","Lähteitä alkaa olla vähitellen 1100–1300-luvuilla. Tässä taidossa käytetään vuotta 1150."]]},{"tyyppi":"ansa","otsikko":"Ansa 1: raja on sama kaikkialla","sisalto":"Vuosi 2000 eaa. oli Egyptissä historiaa, sillä siellä oli kirjoitettu jo yli tuhat vuotta. Suomessa sama vuosi oli esihistoriaa: täällä elettiin kivikautta, eikä kukaan kirjoittanut. Suomessa esihistoria jatkui paljon myöhempään kuin Mesopotamiassa ja Egyptissä. Suomen esihistorian kaudet ovat kivikausi noin 9000–1500 eaa., pronssikausi noin 1500–500 eaa. ja rautakausi noin 500 eaa.–1150 jaa. Vuodet ovat likimääräisiä, ja muualla kaudet alkoivat eri aikaan. Kun Suomen esihistoria päättyi, Mesopotamiassa oli kirjoitettu jo yli 4 000 vuotta. Kysy siis aina ensin, missä, ja vasta sitten, oliko se esihistoriaa vai historiaa."},{"tyyppi":"ansa","otsikko":"Ansa 2: esihistorian ihmiset olivat tyhmempiä","sisalto":"Kivikauden ihmiset eivät osanneet kirjoittaa, mutta he eivät olleet tyhmempiä kuin me. He puhuivat, kertoivat tarinoita, tekivät työkaluja ja veneitä, rakensivat asumuksia ja tunsivat eläinten tavat ja kasvien käytön paremmin kuin useimmat meistä. Kirjoituksen keksivät ihmiset, jotka olivat samanlaisia kuin heidän esivanhempansa. Kirjoitusta ei tarvittu ennen kuin kaupungit ja kirjanpito kasvoivat niin suuriksi, ettei muisti enää riittänyt. Esihistoriasta tiedetään vähemmän siksi, että lähteitä on vähemmän, ei siksi, että ihmiset olisivat osanneet vähemmän."},{"tyyppi":"kappale","otsikko":"Kuinka kauan sitten","sisalto":"Merkintä eaa. tarkoittaa ennen ajanlaskun alkua ja jaa. jälkeen ajanlaskun alun. Eaa.-vuosissa suurempi luku on kauempana menneisyydessä: 3200 eaa. on vanhempi kuin 1750 eaa. Kun molemmat vuodet ovat eaa., niiden välinen aika saadaan vähentämällä pienempi luku suuremmasta. Kirjoitus keksittiin noin 3200 eaa. ja Hammurabin lait kaiverrettiin noin 1750 eaa., joten välissä on noin 1 450 vuotta. Kun molemmat vuodet ovat jaa., vähennetään samalla tavalla. Jos toinen vuosi on eaa. ja toinen jaa., tässä taidossa riittää arvio: kirjoitus keksittiin runsaat 5 000 vuotta sitten."}],"harjoitusryhmat":[{"id":"muutti","nimi":"Mitä kirjoitus muutti","info":"Pitääkö sanojen tai nimien säilyä ilman, että kenenkään tarvitsee muistaa niitä? Silloin tarvitaan kirjoitusta."},{"id":"raja","nimi":"Esihistoria ja historia","info":"Kysy ensin, missä. Historia alkaa, kun siitä paikasta on kirjoitettuja lähteitä."},{"id":"aika","nimi":"Kirjoitus aikajanalla","info":"Eaa.-vuosissa suurempi luku on vanhempi. Kahden eaa.-vuoden välinen aika on suurempi luku miinus pienempi."}],"harjoitukset":[{"id":"H01","ryhma":"muutti","kysymys":"Asiat:\n1. kertoa tarina nuotion ääressä\n2. tehdä saviastian\n3. vaihtaa kaloja nahkoihin naapurikylän kanssa kasvokkain\n4. lähettää viestin kaukaiseen kaupunkiin niin, ettei viestinviejän tarvitse muistaa sen sanoja\n5. rakentaa asumuksen\n\nMontako näistä asioista ihmiset pystyivät tekemään jo ennen kuin kirjoitus keksittiin?","vastaus":4,"vinkki":"Mikä asioista vaatii, että sanat säilyvät ilman kenenkään muistia?","selitys":"Tarinan kertominen, saviastian tekeminen, vaihtokauppa kasvokkain ja asumuksen rakentaminen onnistuvat käsillä, puhumalla ja muistamalla. Vain viesti, jonka sanoja viejän ei tarvitse muistaa, vaatii kirjoitusta. Ennen kirjoitusta onnistui 4."},{"id":"H02","ryhma":"muutti","kysymys":"Asiat:\n1. säilyttää lain sanat samoina satoja vuosia, vaikka kukaan ei muista niitä ulkoa\n2. merkitä lampaiden määrän pienillä savimerkeillä\n3. pitää luetteloa siitä, mitkä 40 perhettä ovat maksaneet veronsa, niin ettei kenenkään tarvitse muistaa sitä\n4. laulaa laulun, jonka on oppinut isoäidiltään\n5. maalata hirven kuvan kallioon\n\nMontako näistä asioista vaati kirjoitusta?","vastaus":2,"vinkki":"Savimerkeistä voi lukea määrän. Voiko niistä lukea nimen?","selitys":"Lain sanat ja veronmaksajien nimet pitää säilyttää ilman muistia, joten ne vaativat kirjoitusta. Lampaiden määrää merkittiin savimerkeillä jo ennen kirjoitusta, laulu opitaan ulkoa ja kalliomaalaus on kuva. Kirjoitusta vaati 2."},{"id":"H03","ryhma":"muutti","tyyppi":"monivalinta","vaihtoehdot":["Ihmiset halusivat kirjoittaa muistiin tarinoita.","Temppelien ja kuninkaiden piti pitää kirjaa viljasta, eläimistä ja veroista.","Ihmiset halusivat oppia lukemaan."],"kysymys":"Mesopotamiassa keksittiin kirjoitus noin 3200 eaa.\n\nMiksi kirjoitus keksittiin?","vastaus":1,"vinkki":"Mitä vanhimmissa savitauluissa enimmäkseen on?","selitys":"Vanhimmat savitaulut ovat enimmäkseen kirjanpitoa viljasta, eläimistä ja ruoka-annoksista. Temppelien ja kuninkaiden piti tietää, kuka oli tuonut mitä ja kuka oli saanut mitä, eikä muisti enää riittänyt. Tarinoita alettiin kirjoittaa vasta myöhemmin."},{"id":"H04","ryhma":"muutti","kysymys":"Merkit:\n1. nuolenpäämerkit savitaulussa\n2. kalliomaalaus, jossa on hirvi ja vene\n3. hieroglyfit egyptiläisen haudan seinässä\n4. pienet savimerkit, joilla laskettiin lampaita\n5. koristekuvio kivikautisen saviastian kyljessä\n\nMontako näistä on kirjoitusta?","vastaus":2,"vinkki":"Kirjoituksen merkit tarkoittavat kielen sanoja tai äänteitä. Hieroglyfit näyttävät kuvilta — ovatko ne silti kirjoitusta?","selitys":"Nuolenpäämerkit ja hieroglyfit tarkoittavat kielen sanoja ja äänteitä, joten ne ovat kirjoitusta. Kalliomaalaus on kuva, savimerkit kertovat vain määrän ja koristekuvio on koriste. Kirjoitusta on 2."},{"id":"H05","ryhma":"muutti","kysymys":"Ensimmäiset savitaulut olivat enimmäkseen kirjanpitoa.\n\nMerkinnät:\n1. 12 säkkiä ohraa tuotu temppelin varastoon\n2. tarina Gilgamešin seikkailuista\n3. 5 lammasta maksettu veroksi\n4. rukous jumalalle\n5. 40 leipää jaettu työläisille\n\nMontako merkinnöistä on kirjanpitoa?","vastaus":3,"vinkki":"Kirjanpito kertoo, mitä tuotiin, annettiin, maksettiin tai lainattiin ja kuinka paljon.","selitys":"Ohra varastoon, lampaat veroksi ja leivät työläisille ovat merkintöjä tavaroista ja määristä. Tarina ja rukous eivät ole kirjanpitoa. Kirjanpitoa on 3."},{"id":"H06","ryhma":"muutti","kysymys":"Kaksi kylää sopii, mistä kohdasta niiden välinen raja kulkee. Tavat pitää sopimus muistissa:\n1. Kylien päälliköt kättelevät ja muistavat sopimuksen.\n2. Rajalle kasataan kivikasa.\n3. Sopimuksesta tehdään laulu, jonka kylän lapset opettelevat ulkoa.\n4. Sopimus kirjoitetaan savitauluun molempien päälliköiden nimillä.\n5. Sopimus ja päälliköiden nimet hakataan kirjoituksena rajakiveen.\n\nMontako näistä tavoista kertoo vielä sadan vuoden päästä, mitä sovittiin ja ketkä sopivat, vaikka kukaan ei enää muista sitä?","vastaus":2,"vinkki":"Päälliköt eivät elä sataa vuotta, ja laulu pitää muistaa. Mistä tavoista sanat ja nimet voi lukea?","selitys":"Päälliköiden muisti katoaa heidän mukanaan, ja laulu säilyy vain niin kauan kuin joku muistaa sen. Kivikasa näyttää paikan, mutta siitä ei voi lukea, mitä sovittiin tai kuka sopi. Savitauluun ja rajakiveen kirjoitetut sanat ja nimet säilyvät. Tapoja on 2."},{"id":"H07","ryhma":"muutti","kysymys":"Asiat:\n1. lukea vanhan sopimuksen sanat sellaisina kuin ne sovittiin, vaikka kaikki sopijat ovat kuolleet\n2. sopia naapurin kanssa kasvokkain, kumpi kalastaa missäkin lahdessa\n3. kutsua naapurikylä juhlaan lähettämällä viestinviejä, joka kertoo kutsun ääneen\n4. kertoa tuleville sukupolville kuninkaan nimi ja hänen taistelunsa niin, ettei kenenkään tarvitse muistaa niitä\n5. kertoa lapsille esivanhempien nimet ulkomuistista\n6. tehdä kivikirveen\n\nMontako näistä asioista tuli mahdolliseksi vasta kirjoituksen myötä?","vastaus":2,"vinkki":"Viestinviejä ja ulkomuisti ovat muistamista. Missä kohdissa kenenkään ei tarvitse muistaa?","selitys":"Sopimuksen sanat kuolleiden sopijoiden jälkeen ja kuninkaan nimi ilman muistamista vaativat kirjoitusta. Kasvokkain sopiminen, ääneen kerrottu kutsu, ulkoa muistetut nimet ja kivikirves onnistuivat ennen kirjoitusta. Vasta kirjoituksen myötä mahdollisia on 2."},{"id":"H08","ryhma":"raja","kysymys":"Kirjoitettuja lähteitä alkaa olla Mesopotamiassa ja Egyptissä noin 3200 eaa., Kiinassa noin 1250 eaa. ja Suomessa noin 1150 jaa.\n\nAjat ja paikat:\n1. Egypti 1500 eaa.\n2. Suomi 2000 eaa.\n3. Mesopotamia 5000 eaa.\n4. Suomi 1700 jaa.\n5. Suomi 600 jaa.\n\nMontako näistä on esihistoriaa?","vastaus":3,"vinkki":"Katso jokaisesta ensin paikka ja sitten, alkoiko siellä jo olla kirjoitettuja lähteitä.","selitys":"Mesopotamia 5000 eaa. on ennen kirjoitusta. Suomi 2000 eaa. ja Suomi 600 jaa. ovat ennen vuotta 1150 jaa., joten Suomessa ne ovat esihistoriaa, vaikka 600 jaa. on ajanlaskun alun jälkeen. Egypti 1500 eaa. ja Suomi 1700 jaa. ovat historiaa. Esihistoriaa on 3."},{"id":"H09","ryhma":"raja","kysymys":"Kirjoitettuja lähteitä alkaa olla Mesopotamiassa ja Egyptissä noin 3200 eaa., Kiinassa noin 1250 eaa. ja Suomessa noin 1150 jaa.\n\nPaikat:\n1. Mesopotamia\n2. Egypti\n3. Kiina\n4. Suomi\n\nMonessako näistä paikoista vuosi 1000 eaa. oli jo historiaa?","vastaus":3,"vinkki":"Vertaa vuotta 1000 eaa. jokaisen paikan rajaan. Muista, että eaa.-vuosissa pienempi luku on myöhemmin.","selitys":"Mesopotamiassa ja Egyptissä kirjoitettiin jo 3200 eaa. ja Kiinassa 1250 eaa., ja vuosi 1000 eaa. on niiden jälkeen. Suomessa elettiin silloin pronssikautta ilman kirjoitusta. Historiaa se oli 3 paikassa."},{"id":"H10","ryhma":"raja","tyyppi":"monivalinta","vaihtoehdot":["Silloin ihmiset muuttuivat viisaammiksi.","Siitä lähtien on lähteitä, joissa ihmiset kertovat omin sanoin nimiä ja tapahtumia.","Silloin ihmiset alkoivat viljellä maata."],"kysymys":"Kirjoitustaidon keksimistä pidetään esihistorian ja historian rajana.\n\nMiksi?","vastaus":1,"vinkki":"Mieti, mistä tutkija tietää kivikaudesta ja mistä Hammurabin laeista.","selitys":"Kirjoituksen jälkeen on lähteitä, joissa ihmiset itse kertovat nimiä, tapahtumia ja sopimuksia. Ihmiset eivät muuttuneet viisaammiksi, ja maanviljely alkoi jo paljon ennen kirjoitusta. Raja koskee lähteitä."},{"id":"H11","ryhma":"raja","kysymys":"Arkeologi tutkii Suomesta löytynyttä hautaa noin vuodelta 800 jaa. Siltä ajalta Suomesta ei ole kirjoitettuja lähteitä.\n\nAsiat:\n1. millaisia esineitä hautaan oli pantu\n2. mikä vainajan nimi oli\n3. mistä aineesta korut oli tehty\n4. mitä vainaja oli luvannut naapurilleen\n5. minkä muotoinen hauta oli\n\nMontako näistä arkeologi voi selvittää pelkistä löydöistä?","vastaus":3,"vinkki":"Löydöt kertovat esineistä ja paikoista. Kertovatko ne nimiä tai sanoja?","selitys":"Esineet, korujen aine ja haudan muoto näkyvät löydöistä. Vainajan nimi ja hänen lupauksensa olisivat tiedossa vain kirjoitetusta lähteestä, eikä sellaista ole. Löydöistä voi selvittää 3."},{"id":"H12","ryhma":"raja","kysymys":"Väitteet:\n1. Esihistorian ihmiset osasivat puhua ja kertoa tarinoita.\n2. Esihistoria päättyi kaikkialla maailmassa samana vuonna.\n3. Esihistoriaa tutkitaan arkeologisten löytöjen avulla.\n4. Esihistorian ihmiset olivat tyhmempiä kuin ihmiset, jotka osasivat kirjoittaa.\n\nMontako väitteistä on totta?","vastaus":2,"vinkki":"Kaksi väitettä on tämän taidon ansoja.","selitys":"Esihistorian ihmiset puhuivat ja kertoivat tarinoita, ja esihistoriaa tutkitaan löytöjen avulla. Raja on eri aikaan eri paikoissa, eivätkä esihistorian ihmiset olleet tyhmempiä: heistä vain tiedetään vähemmän. Totta on 2."},{"id":"H13","ryhma":"raja","kysymys":"Kirjoitettuja lähteitä alkaa olla Mesopotamiassa ja Egyptissä noin 3200 eaa., Kiinassa noin 1250 eaa. ja Suomessa noin 1150 jaa.\n\nAjat ja paikat:\n1. Mesopotamia 2500 eaa.\n2. Egypti 1000 eaa.\n3. Suomi 1000 eaa.\n4. Kiina 500 jaa.\n5. Kiina 4000 eaa.\n\nMontako näistä on esihistoriaa?","vastaus":2,"vinkki":"Katso jokaisesta ensin paikka ja vertaa vuotta sen paikan rajaan. Kiinassa raja on eri kohdassa kuin Mesopotamiassa.","selitys":"Suomi 1000 eaa. on esihistoriaa, koska Suomessa kirjoitettuja lähteitä alkaa olla vasta noin 1150 jaa. Kiina 4000 eaa. on esihistoriaa, koska Kiinassa kirjoitettuja lähteitä alkaa olla vasta noin 1250 eaa. Mesopotamia 2500 eaa., Egypti 1000 eaa. ja Kiina 500 jaa. ovat historiaa. Esihistoriaa on 2."},{"id":"H14","ryhma":"raja","kysymys":"Suomessa kirjoitettuja lähteitä alkaa olla noin 1150 jaa. Suomen rautakausi kesti noin 500 eaa.–1150 jaa.\n\nKaudet:\n1. kivikausi\n2. pronssikausi\n3. rautakausi\n\nMontako näistä kolmesta kaudesta kuuluu Suomessa esihistoriaan?","vastaus":3,"vinkki":"Päättyykö rautakausi ennen vai jälkeen sen, kun Suomessa alkaa olla kirjoitettuja lähteitä?","selitys":"Kaikki kolme kautta ovat Suomessa ennen kirjoitettuja lähteitä. Rautakausi päättyy juuri siihen, kun lähteitä alkaa olla. Esihistoriaan kuuluvat kaikki 3."},{"id":"H15","ryhma":"aika","kysymys":"Tapahtumat:\n1. Hammurabin lait kaiverretaan kivipaaseen, noin 1750 eaa.\n2. Kirjoitus keksitään Mesopotamiassa, noin 3200 eaa.\n3. Suomen esihistoria päättyy, noin 1150 jaa.\n4. Gizan suuri pyramidi rakennetaan, noin 2500 eaa.\n\nJärjestä tapahtumat vanhimmasta uusimpaan. Monesko on Hammurabin lait?","vastaus":3,"vinkki":"Eaa.-vuosissa suurempi luku on vanhempi. Jaa.-vuosi on kaikkien eaa.-vuosien jälkeen.","selitys":"Järjestys on 3200 eaa., 2500 eaa., 1750 eaa. ja 1150 jaa. Hammurabin lait ovat kolmas."},{"id":"H16","ryhma":"aika","kysymys":"Kirjoitustavat:\n1. kirjaimet\n2. kuvamerkit savessa\n3. nuolenpäämerkit savessa\n\nJärjestä kirjoitustavat siihen järjestykseen, jossa ne syntyivät. Monesko on nuolenpäämerkit savessa?","vastaus":2,"vinkki":"Nuolenpäämerkit syntyivät, kun kuvat yksinkertaistuivat.","selitys":"Ensin saveen piirrettiin kuvamerkkejä, sitten ne yksinkertaistuivat nuolenpäämerkeiksi, ja kirjaimet tulivat yli tuhat vuotta myöhemmin. Nuolenpäämerkit ovat toinen."},{"id":"H17","ryhma":"aika","kysymys":"Kirjoitus keksittiin noin 3200 eaa. Gizan suuri pyramidi rakennettiin noin 2500 eaa.\n\nNoin montako vuotta kirjoitus oli ollut käytössä, kun pyramidi rakennettiin?","vastaus":700,"vinkki":"Molemmat vuodet ovat eaa. Vähennä pienempi luku suuremmasta.","selitys":"3200 − 2500 = 700. Kirjoitus oli ollut käytössä noin 700 vuotta."},{"id":"H18","ryhma":"aika","tyyppi":"monivalinta","vaihtoehdot":["kivikausi","pronssikausi","rautakausi"],"kysymys":"Suomen esihistorian kaudet ovat kivikausi noin 9000–1500 eaa., pronssikausi noin 1500–500 eaa. ja rautakausi noin 500 eaa.–1150 jaa.\n\nMikä kausi oli Suomessa menossa, kun Mesopotamiassa keksittiin kirjoitus noin 3200 eaa.?","vastaus":0,"vinkki":"Mihin kauteen vuosi 3200 eaa. osuu, kun kivikausi kesti noin vuoteen 1500 eaa.?","selitys":"Vuosi 3200 eaa. on kivikauden sisällä, sillä kivikausi kesti noin 9000–1500 eaa. Kun Mesopotamiassa kirjoitettiin ensimmäisiä savitauluja, Suomessa elettiin kivikautta."},{"id":"H19","ryhma":"aika","kysymys":"Suomen esihistoria päättyi noin 1150 jaa.\n\nNoin montako vuotta siitä on vuoteen 2000?","vastaus":850,"vinkki":"Molemmat vuodet ovat jaa. Vähennä pienempi suuremmasta.","selitys":"2000 − 1150 = 850. Vuoteen 2000 on noin 850 vuotta."},{"id":"H20","ryhma":"aika","kysymys":"Kirjoitus keksittiin Mesopotamiassa noin 3200 eaa. Suomen pronssikausi alkoi noin 1500 eaa.\n\nNoin montako vuotta Mesopotamiassa oli jo kirjoitettu, kun Suomessa alkoi pronssikausi?","vastaus":1700,"vinkki":"Molemmat vuodet ovat eaa. Kumpi on vanhempi?","selitys":"3200 − 1500 = 1700. Mesopotamiassa oli kirjoitettu noin 1700 vuotta, kun Suomessa alkoi pronssikausi."}],"valmis_teksti":"Osaat kertoa, mitä kirjoitustaidolla voitiin tehdä, mitä ennen sitä ei voitu, ja selittää, miksi kirjoituksen keksiminen erottaa esihistorian historiasta. Tämä taito on nyt näytetty."};

/* ---------- lukusuora ---------- */
const svg=document.getElementById("nlsvg"), rng=document.getElementById("nlrange"), out=document.getElementById("nlout");
const X0=34, X1=606, Y=62;
function piirraNL(v){
  const ala=Math.floor(v/10)*10, yla=ala+10, puoli=ala+5;
  const pyor = (v%10)>=5 ? yla : ala;
  const x = n => X0 + (n/100)*(X1-X0);
  let s=`<line class="rail" x1="${X0}" y1="${Y}" x2="${X1}" y2="${Y}"/>`;
  for(let n=0;n<=100;n+=10){
    const near = (n===ala||n===yla);
    s+=`<line class="tick" x1="${x(n)}" y1="${Y-7}" x2="${x(n)}" y2="${Y+7}"/>`;
    s+=`<text class="stop${near?" near":""}" x="${x(n)}" y="${Y+24}" text-anchor="middle">${n}</text>`;
  }
  s+=`<line class="halfway" x1="${x(puoli)}" y1="${Y-16}" x2="${x(puoli)}" y2="${Y+12}"/>`;
  s+=`<text class="stop" x="${x(puoli)}" y="${Y-22}" text-anchor="middle">puoliväli ${puoli}</text>`;
  s+=`<circle class="dot" cx="${x(v)}" cy="${Y}" r="6"/>`;
  s+=`<text class="val" x="${x(v)}" y="${Y-32}" text-anchor="middle">${v}</text>`;
  s+=`<path d="M ${x(v)} ${Y+38} L ${x(pyor)} ${Y+38}" stroke="var(--core)" stroke-width="2" fill="none"/>`;
  s+=`<path d="M ${x(pyor)} ${Y+38} l ${x(pyor)>x(v)?-7:7} -4 l 0 8 z" fill="var(--core)"/>`;
  svg.innerHTML=s;
  out.textContent = `${v} pyöristyy → ${pyor}`;
}
if(svg){ piirraNL(+rng.value); rng.addEventListener("input",e=>piirraNL(+e.target.value)); }

  const PAIKAT=["ykköset","kymmenet","sadat","tuhannet","kymmenettuhannet"];
  const LYH=["Y","K","S","T","KT"];
  const IDX={kymmenet:1, sadat:2, tuhannet:3};
  let ntI=0;
  document.getElementById("ntValinta").innerHTML=O.esimerkit.map((e,i)=>
    `<button type="button" data-i="${i}" aria-pressed="${i===0}">${e.luku.toLocaleString("fi-FI",{maximumFractionDigits:10})} → ${e.tarkkuus}</button>`).join("");
  function ntPiirra(){
    const e=O.esimerkit[ntI], t=IDX[e.tarkkuus], kerroin=Math.pow(10,t);
    const tulos=Math.floor((e.luku+kerroin/2)/kerroin)*kerroin;
    const lev=Math.max(String(e.luku).length, String(tulos).length);
    const num=String(e.luku).padStart(lev,"0").split("");
    const res=String(tulos).padStart(lev,"0").split("");
    const luokka=(i,arr,vain0)=>{
      const p=arr.length-1-i;
      if(vain0) return p<t ? "nt-ruutu nolla" : "nt-ruutu";
      if(p===t) return "nt-ruutu kohta";
      if(p===t-1) return "nt-ruutu ratkaiseva";
      return "nt-ruutu";
    };
    const otsat=num.map((_,i)=>`<span class="otsa">${LYH[num.length-1-i]||""}</span>`).join("");
    const rivi1=num.map((n,i)=>`<span class="${luokka(i,num,false)}">${n}</span>`).join("");
    const rivi2=res.map((n,i)=>`<span class="${luokka(i,res,true)}">${n}</span>`).join("");
    const ratk=+num[num.length-t];
    const ylos=ratk>=5;
    ntTaulu.innerHTML=
      `<div class="nt-rivi">${otsat}</div>
       <div class="nt-rivi">${rivi1}<span class="nimi">luku</span></div>
       <div class="nt-rivi"><span class="nt-nuoli" style="margin-left:${(num.length-1-t)*58+18}px">${ylos?"▲ ylös":"▼ alas"}</span></div>
       <div class="nt-rivi">${rivi2}<span class="nimi">pyöristettynä</span></div>`;
    document.getElementById("ntSelite").innerHTML =
      `Pyöristetään <b>${PAIKAT[t]}</b> (sininen ruutu). Ratkaiseva numero on <b>${ratk}</b> (keltainen ruutu). ` +
      (ylos ? `Se on 5 tai suurempi, joten sininen ruutu kasvaa yhdellä.` : `Se on pienempi kuin 5, joten sininen ruutu pysyy ennallaan.`) +
      ` Kaikki keltaisen oikealla puolella muuttuu nolliksi. Vastaus on <b>${tulos.toLocaleString("fi-FI",{maximumFractionDigits:10})}</b>.`;
    document.querySelectorAll("#ntValinta button").forEach((b,i)=>b.setAttribute("aria-pressed",String(i===ntI)));
  }
  document.getElementById("ntValinta").addEventListener("click",e=>{
    const b=e.target.closest("button"); if(!b) return; ntI=+b.dataset.i; ntPiirra();
  });
  ntPiirra();
}

/* ---------- laskujärjestys-widget ---------- */
const ljExp=document.getElementById("ljExp");
if(ljExp && D.kokeilu){
  let ljI=0, ljTokens=[], ljStep=0;
  const laske=(a,op,b)=>{a=+a;b=+b;return op==="×"?a*b:op==="÷"?a/b:op==="+"?a+b:a-b;};
  function ljAlku(){
    const l=D.kokeilu[ljI];
    ljTokens=l.lauseke.replace(/\(/g,"( ").replace(/\)/g," )").split(/\s+/).filter(Boolean);
    ljStep=0; ljPiirra(); ljViesti("","");
  }
  function ljViesti(t,lk){const f=document.getElementById("ljFb"); f.textContent=t; f.className="lj-fb "+(lk||"");}
  function ljPiirra(){
    const l=D.kokeilu[ljI];
    document.getElementById("ljStep").textContent =
      ljStep>=l.askeleet.length ? "valmis" : `askel ${ljStep+1} / ${l.askeleet.length}`;
    if(ljStep>=l.askeleet.length){
      ljExp.innerHTML=`<span class="valmis">${l.lauseke} = ${l.vastaus}</span>`;
      return;
    }
    ljExp.innerHTML=ljTokens.map((t,i)=>
      "×÷+−".includes(t) ? `<button type="button" class="op" data-i="${i}">${t}</button>`
                         : `<span class="tok">${t}</span>`).join("");
    ljExp.querySelectorAll("button.op").forEach(b=>b.addEventListener("click",()=>ljKlikkaa(+b.dataset.i)));
  }
  function ljKlikkaa(i){
    const l=D.kokeilu[ljI], odotettu=l.askeleet[ljStep];
    const ehdotus=[ljTokens[i-1],ljTokens[i],ljTokens[i+1]].join(" ");
    if(ehdotus!==odotettu){
      ljViesti(ljStep===0
        ? "Ei vielä. Sulkeet ovat vahvimmat, sitten kerto ja jako. Yhtä vahvat vasemmalta oikealle."
        : "Ei vielä. Kumpi jäljellä olevista on vahvempi?", "no");
      return;
    }
    const arvo=laske(ljTokens[i-1],ljTokens[i],ljTokens[i+1]);
    let alku=i-1, loppu=i+1;
    if(ljTokens[i-2]==="(" && ljTokens[i+2]===")"){ alku=i-2; loppu=i+2; }
    ljTokens.splice(alku, loppu-alku+1, String(arvo));
    ljStep++;
    ljViesti(ljStep>=l.askeleet.length ? "Valmis. Vastaus on "+l.vastaus+"." : "Oikein. Jatka seuraavaan.", "ok");
    ljPiirra();
  }
  document.getElementById("ljSeuraava").addEventListener("click",()=>{
    ljI=(ljI+1)%D.kokeilu.length; ljAlku();
  });
  ljAlku();
}

/* ---------- harjoitukset ----------
   Kaksi vastaustyyppiä: "numero" (oletus, tekstikenttä + Number()-vertailu) ja
   "monivalinta" (valintapainikkeet, h.vaihtoehdot[] + h.vastaus = oikean vaihtoehdon indeksi).
   Jos D.harjoitukset puuttuu tai on tyhjä, koko osio piilotetaan (näyttötaidot, ei kirjallista
   harjoitusta: liikunta, kuvataide). */
/* Kysymyksessä voi olla luettavaa aineistoa ja sen jälkeen varsinainen kysymys,
   erotettuna tyhjällä rivillä. Viimeinen osa on kysymys, sitä edeltävät aineistoa. */
const kysymysHtml = t => {
  const osat = String(t).split(/\n\s*\n/).map(x=>x.trim()).filter(Boolean);
  if(osat.length < 2) return osat[0] || "";
  const kysymys = osat.pop();
  return osat.map(p=>`<span class="aineisto">${p}</span>`).join("")
       + `<span class="kysymysrivi">${kysymys}</span>`;
};

           </div>`
        : `<div class="row">
             <input type="text" inputmode="numeric" id="in-${h.id}" aria-label="Vastaus tehtävään ${nro}" placeholder="vastaus">
             <button type="button" class="btn" data-tarkista="${h.id}">Tarkista</button>
             <button type="button" class="btn ghost" data-vinkki="${h.id}">Vinkki</button>
           </div>`;
      return `<div class="ex" id="ex-${h.id}">

          <button type="button" class="btn ghost" data-hitaasti="${h.id}">Kuuntele hitaasti</button>

function paivitaEdistyminen(){
  const n=Object.values(tila).filter(t=>t.ratkaistu).length, kaikki=D.harjoitukset.length;
  document.getElementById("pbar").style.width=Math.round(n/kaikki*100)+"%";
  document.getElementById("pcnt").textContent=`${n} / ${kaikki}`;
  document.getElementById("valmis").innerHTML = n===kaikki
    ? `<div class="done"><h3>Kaikki ${kaikki} oikein.</h3>${D.valmis_teksti || "Tämä taito on nyt näytetty."}</div>`
    : "";
}

function merkitseTulos(id, oikein, viesti){
  const fb=document.getElementById("fb-"+id), kortti=document.getElementById("ex-"+id);
  tila[id].yritetty=true;
  if(oikein){
    tila[id].ratkaistu=true;
    kortti.dataset.tila="oikein";
    fb.className="fb ok"; fb.textContent=viesti;
  } else {
    kortti.dataset.tila="vaarin";
    fb.className="fb no"; fb.textContent=viesti;
  }
  paivitaEdistyminen();
}

/* Suomalainen lukumuoto: välilyönti on tuhaterotin, pilkku desimaalierotin.
   Piste voi olla kumpi tahansa. Se tulkitaan tuhaterottimeksi VAIN silloin, kun
   koko luku on aitoa tuhaterotinmuotoa: alkuosa 1–3 numeroa ilman etunollaa ja
   jokainen jatko-osa täsmälleen 3 numeroa (1.500, 12.345.678). Kaikissa muissa
   tapauksissa piste on desimaalipiste — myös 0.125, joka vanhalla säännöllä
   ("3 numeroa pisteen jäljessä = tuhaterotin") luettiin virheellisesti luvuksi 125. */
const TUHATEROTIN = /^[1-9]\d{0,2}(\.\d{3})+$/;
function lueLuku(teksti){
  // Murtoluku (3/4, -3/4) ja sekaluku (1 2/3, -1 2/3) hyväksytään sellaisinaan.
  const raaka = String(teksti).replace(/\u00a0/g, " ").trim();
  let m = raaka.match(/^(-?)(\d+)\s+(\d+)\s*\/\s*(\d+)$/);
  if(m){ const nim = Number(m[4]); if(nim === 0) return null;
    const v = Number(m[2]) + Number(m[3]) / nim; return m[1] ? -v : v; }
  m = raaka.match(/^(-?)\s*(\d+)\s*\/\s*(\d+)$/);
  if(m){ const nim = Number(m[3]); if(nim === 0) return null;
    const v = Number(m[2]) / nim; return m[1] ? -v : v; }
  let s = String(teksti).replace(/[\s\u00a0]/g, "");
  if(s === "") return null;
  if(s.indexOf(",") >= 0){
    s = s.replace(/\./g, "").replace(",", ".");
  } else if(TUHATEROTIN.test(s)){
    s = s.replace(/\./g, "");
  }
  const n = Number(s);
  return Number.isFinite(n) ? n : null;
}

function tarkista(id){
  const h=D.harjoitukset.find(x=>x.id===id);
  const kentta=document.getElementById("in-"+id);
  const fb=document.getElementById("fb-"+id);
  if(kentta.value.trim()===""){ fb.className="fb hint"; fb.textContent="Kirjoita vastaus ensin."; return; }
  const luku=lueLuku(kentta.value);
  if(luku===null){ fb.className="fb no"; fb.textContent="Vastauksen pitää olla luku tai murtoluku (esimerkiksi 3/4)."; return; }
  const oikein = Math.abs(luku - h.vastaus) < 1e-9;
  merkitseTulos(id, oikein, oikein ? "Oikein. "+h.selitys : `Ei vielä. ${h.vinkki} Kokeile uudelleen.`);
}

function tarkistaMonivalinta(id, valittuIndeksi, painike){
  const h=D.harjoitukset.find(x=>x.id===id);
  const rivi=painike.closest(".row");
  rivi.querySelectorAll(".mv-valinta").forEach(b=>b.disabled=true);
  const oikein = valittuIndeksi===h.vastaus;
  painike.classList.add(oikein?"mv-oikein":"mv-vaarin");
  if(!oikein){
    const oikeaBtn=rivi.querySelector(`[data-i="${h.vastaus}"]`);
    if(oikeaBtn) oikeaBtn.classList.add("mv-oikein");
  }
  merkitseTulos(id, oikein, oikein ? "Oikein. "+h.selitys : `Ei ihan. Oikea vastaus on korostettu. ${h.selitys||""}`);
}

/* Kuuntelu: selain lukee tekstin ääneen omalla puhesynteesillään (englanniksi, jos laitteessa on
   englanninkielinen ääni). Ei äänitiedostoja eikä verkkoyhteyttä. Jos laite ei osaa puhua,
   teksti näytetään luettavaksi — silloin tehtävä muuttuu luetun ymmärtämiseksi, mutta ei katkea. */
function puhu(id, nopeus){
  const h=D.harjoitukset.find(x=>x.id===id); if(!h || !h.kuuntele) return;
  const vara=document.getElementById("vara-"+id);
  const naytaTeksti=syy=>{ vara.hidden=false; vara.textContent=syy+" Teksti: "+h.kuuntele; };
  if(!("speechSynthesis" in window)){ naytaTeksti("Tämä laite ei osaa lukea ääneen."); return; }
  const s=window.speechSynthesis; s.cancel();
  const u=new SpeechSynthesisUtterance(h.kuuntele);
  u.lang=h.kieli||"en-GB"; u.rate=nopeus;
  const aanet=s.getVoices(), kieli=u.lang.slice(0,2);
  const aani=aanet.find(a=>a.lang===u.lang) || aanet.find(a=>a.lang && a.lang.startsWith(kieli));
  if(aani) u.voice=aani;
  else if(aanet.length) { naytaTeksti("Laitteessa ei ole englanninkielistä ääntä."); return; }
  u.onerror=()=>naytaTeksti("Ääneen lukeminen ei onnistunut.");
  s.speak(u);
}

document.getElementById("harjoitukset").addEventListener("click",e=>{
  const k=e.target.closest("[data-kuuntele]"), hk=e.target.closest("[data-hitaasti]");
  if(k) puhu(k.dataset.kuuntele, 0.9);
  if(hk) puhu(hk.dataset.hitaasti, 0.6);
  const t=e.target.closest("[data-tarkista]"), v=e.target.closest("[data-vinkki]"), mv=e.target.closest("[data-mv]");
  if(t) tarkista(t.dataset.tarkista);
  if(mv) tarkistaMonivalinta(mv.dataset.mv, Number(mv.dataset.i), mv);
  if(v){
    const h=D.harjoitukset.find(x=>x.id===v.dataset.vinkki);
    const fb=document.getElementById("fb-"+h.id);
    fb.className="fb hint"; fb.textContent=h.vinkki;
  }
});
document.getElementById("harjoitukset").addEventListener("keydown",e=>{
  if(e.key==="Enter" && e.target.id.startsWith("in-")){ e.preventDefault(); tarkista(e.target.id.slice(3)); }
});
