<title>Voiman tunto</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">

<style>
:root{
  --paper:#EFF2F5; --surface:#FFFFFF; --surface-2:#F7F9FB;
  --grid:#DCE3EA; --line:#C9D3DC;
  --ink:#15222C; --ink-2:#4E626F; --ink-3:#7E8F9B;
  --core:#1B5A9E; --core-soft:#E4EDF6;
  --strong:#1F6E5C; --strong-soft:#E1F0EB;
  --chal:#9A6A16; --chal-soft:#F6EDDC;
  --alert:#A33A2B; --alert-soft:#F8E7E3;
  --shadow:0 1px 2px rgba(21,34,44,.06), 0 8px 24px -12px rgba(21,34,44,.18);
  --r:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0F161B; --surface:#18222A; --surface-2:#1D2830;
    --grid:#22303A; --line:#2E3E4A;
    --ink:#E8EFF4; --ink-2:#A3B4C0; --ink-3:#7A8B97;
    --core:#7FB2E4; --core-soft:#16303F;
    --strong:#77CDB4; --strong-soft:#123028;
    --chal:#E0B267; --chal-soft:#33270F;
    --alert:#E8907F; --alert-soft:#3A1E19;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -14px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --paper:#0F161B; --surface:#18222A; --surface-2:#1D2830;
  --grid:#22303A; --line:#2E3E4A;
  --ink:#E8EFF4; --ink-2:#A3B4C0; --ink-3:#7A8B97;
  --core:#7FB2E4; --core-soft:#16303F;
  --strong:#77CDB4; --strong-soft:#123028;
  --chal:#E0B267; --chal-soft:#33270F;
  --alert:#E8907F; --alert-soft:#3A1E19;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -14px rgba(0,0,0,.7);
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:16px; line-height:1.62;
  background-image:
    linear-gradient(to right, var(--grid) 1px, transparent 1px),
    linear-gradient(to bottom, var(--grid) 1px, transparent 1px);
  background-size:26px 26px;
}
.wrap{max-width:760px; margin:0 auto; padding:28px 20px 90px}
h1,h2,h3,h4{font-family:"Familjen Grotesk","IBM Plex Sans",system-ui,sans-serif; text-wrap:balance}

/* header */
header.top{background:var(--surface); border:1px solid var(--line); border-radius:var(--r);
  box-shadow:var(--shadow); padding:22px 24px; display:flex; gap:18px; align-items:flex-start}
.badge{flex:0 0 auto; width:54px; height:54px; border-radius:9px; display:grid; place-items:center;
  background:var(--core-soft); border:1px solid var(--core); color:var(--core)}
.badge svg{width:28px; height:28px; fill:none; stroke:currentColor; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round}
.eyebrow{font-family:"IBM Plex Mono",monospace; font-size:11px; letter-spacing:.14em;
  text-transform:uppercase; color:var(--ink-3); margin:0 0 5px}
header.top h1{margin:0; font-size:30px; font-weight:700; letter-spacing:-.015em}
header.top p{margin:5px 0 0; color:var(--ink-2); font-size:15px}
.tags{display:flex; flex-wrap:wrap; gap:5px; margin-top:11px}
.tag{font-family:"IBM Plex Mono",monospace; font-size:10.5px; letter-spacing:.05em; padding:2px 7px;
  border-radius:4px; background:var(--surface-2); border:1px solid var(--line); color:var(--ink-3)}
.tag.core{background:var(--core-soft); border-color:var(--core); color:var(--core)}

/* teksti */
article{margin-top:26px}
article h2{font-size:21px; font-weight:600; margin:32px 0 10px; letter-spacing:-.01em}
article p{margin:0 0 14px; max-width:64ch}
.lead{font-size:17.5px; color:var(--ink); border-left:3px solid var(--core); padding-left:16px; margin:0 0 8px}

.box{background:var(--surface); border:1px solid var(--line); border-radius:var(--r);
  padding:18px 22px; box-shadow:var(--shadow); margin:22px 0}
.box h3{margin:0 0 12px; font-size:16.5px; font-weight:600}
.box.warn{border-left:3px solid var(--alert)}
.box.note{border-left:3px solid var(--chal)}

ol.steps{margin:0; padding-left:0; list-style:none; counter-reset:s; display:grid; gap:12px}
ol.steps li{counter-increment:s; display:grid; grid-template-columns:auto 1fr; gap:13px; align-items:start}
ol.steps li::before{content:counter(s); font-family:"Familjen Grotesk",sans-serif; font-weight:700; font-size:14px;
  width:26px; height:26px; border-radius:50%; background:var(--core); color:#fff; display:grid; place-items:center; margin-top:2px}

ul.notes{margin:0; padding-left:19px}
ul.notes li{margin-bottom:7px}
ul.notes li:last-child{margin-bottom:0}

.tablewrap{overflow-x:auto}
table{border-collapse:collapse; width:100%; font-size:14.5px; min-width:460px}
th,td{text-align:left; padding:9px 13px; border-bottom:1px solid var(--line)}
th{font-family:"IBM Plex Mono",monospace; font-size:10.5px; letter-spacing:.1em; text-transform:uppercase;
  color:var(--ink-3); font-weight:400; background:var(--surface-2)}
tr:last-child td{border-bottom:0}
td b{color:var(--core); font-weight:600}
td:last-child{font-variant-numeric:tabular-nums; font-weight:600}

/* lukusuora */
.nl svg{width:100%; height:118px; display:block}
.nl .rail{stroke:var(--line); stroke-width:2}
.nl .tick{stroke:var(--line); stroke-width:1.5}
.nl .stop{fill:var(--ink-3); font-family:"IBM Plex Mono",monospace; font-size:11px}
.nl .stop.near{fill:var(--core); font-weight:600}
.nl .dot{fill:var(--chal)}
.nl .val{fill:var(--ink); font-family:"Familjen Grotesk",sans-serif; font-size:15px; font-weight:700}
.nl .halfway{stroke:var(--chal); stroke-dasharray:3 3; stroke-width:1.5}
.nl-controls{display:flex; align-items:center; gap:14px; margin-top:6px}
.nl-controls input{flex:1; accent-color:var(--core)}
.nl-out{font-family:"Familjen Grotesk",sans-serif; font-size:15px; font-weight:600; min-width:12.5em; text-align:right}

/* paikka-arvotaulu */
.box .ohje{margin:0 0 14px; font-size:14.5px; color:var(--ink-2)}
.nt-valinta{display:flex; flex-wrap:wrap; gap:7px; margin-bottom:16px}
.nt-valinta button{font:inherit; font-size:12.5px; font-family:"IBM Plex Mono",monospace; padding:5px 11px;
  border-radius:6px; border:1px solid var(--line); background:var(--surface-2); color:var(--ink-2); cursor:pointer}
.nt-valinta button[aria-pressed="true"]{background:var(--ink); color:var(--paper); border-color:var(--ink)}
.nt-valinta button:focus-visible{outline:2px solid var(--core); outline-offset:2px}
.nt-taulu{display:flex; flex-direction:column; gap:4px; align-items:flex-start; overflow-x:auto; padding-bottom:4px}
.nt-rivi{display:flex; gap:6px; align-items:center}
.nt-rivi .otsa{font-family:"IBM Plex Mono",monospace; font-size:9.5px; letter-spacing:.08em;
  text-transform:uppercase; color:var(--ink-3); width:52px; text-align:center}
.nt-ruutu{width:52px; height:52px; display:grid; place-items:center; border:1.5px solid var(--line);
  border-radius:7px; background:var(--surface-2); font-family:"IBM Plex Mono",monospace; font-size:24px}
.nt-ruutu.kohta{border-color:var(--core); background:var(--core-soft); color:var(--core); font-weight:500}
.nt-ruutu.ratkaiseva{border-color:var(--chal); background:var(--chal-soft); color:var(--chal); font-weight:500}
.nt-ruutu.nolla{color:var(--ink-3)}
.nt-rivi .nimi{font-size:12.5px; color:var(--ink-3); margin-left:12px; white-space:nowrap}
.nt-nuoli{font-size:17px; color:var(--chal); margin-left:6px}
.nt-selite{margin:14px 0 0; font-size:14.5px}
.nt-selite b{color:var(--core)}

/* vahvuusportaat */
.vp-tasot{display:grid; gap:9px; margin-bottom:18px}
.vp-taso{display:flex; gap:11px; align-items:flex-start; font-size:13.5px}
.vp-taso .vp-pallo{width:13px; height:13px; border-radius:4px; margin-top:5px; flex:0 0 auto}
.vp-taso[data-taso="sulkeet"] .vp-pallo{background:var(--core)}
.vp-taso[data-taso="kertojako"] .vp-pallo{background:var(--strong)}
.vp-taso[data-taso="yhteenvahennys"] .vp-pallo{background:var(--chal)}
.vp-taso strong{display:block; font-family:"Familjen Grotesk",sans-serif; font-weight:600; font-size:14.5px}
.vp-taso span{color:var(--ink-2)}
.vp-lauseke{display:flex; flex-wrap:wrap; gap:7px; align-items:flex-end; font-family:"IBM Plex Mono",monospace;
  font-size:25px; padding:10px 2px; min-height:64px}
.vp-lauseke .t{padding:2px 3px}
.vp-lauseke .op{position:relative; padding:2px 9px; border-radius:6px; font-weight:500}
.vp-lauseke .op[data-taso="sulkeet"]{background:var(--core-soft); color:var(--core)}
.vp-lauseke .op[data-taso="kertojako"]{background:var(--strong-soft); color:var(--strong)}
.vp-lauseke .op[data-taso="yhteenvahennys"]{background:var(--chal-soft); color:var(--chal)}
.vp-lauseke .op i{position:absolute; top:-9px; right:-6px; font-style:normal; font-family:"Familjen Grotesk",sans-serif;
  font-size:11px; font-weight:700; width:18px; height:18px; border-radius:50%; display:grid; place-items:center;
  background:currentColor}
.vp-lauseke .op i span{color:var(--surface)}
.vp-rivi{display:flex; align-items:center; gap:16px; margin-top:8px}
.vp-vastaus{font-family:"Familjen Grotesk",sans-serif; font-size:16px; font-weight:600; color:var(--strong)}

/* laskujärjestys-widget */
.lj-exp{display:flex; flex-wrap:wrap; gap:7px; align-items:center; font-family:"IBM Plex Mono",monospace;
  font-size:23px; padding:14px 4px; min-height:62px}
.lj-exp .tok{padding:2px 4px; color:var(--ink)}
.lj-exp button.op{font-family:"IBM Plex Mono",monospace; font-size:23px; padding:3px 12px; border-radius:7px;
  border:1.5px solid var(--line); background:var(--surface-2); color:var(--ink); line-height:1.2}
.lj-exp button.op:hover{border-color:var(--core); color:var(--core)}
.lj-exp button.op:focus-visible{outline:2px solid var(--core); outline-offset:2px}
.lj-exp .valmis{font-family:"Familjen Grotesk",sans-serif; font-size:23px; font-weight:700; color:var(--strong)}
.lj-fb{font-size:14.5px; min-height:1.5em; color:var(--ink-2)}
.lj-fb.no{color:var(--alert)}
.lj-fb.ok{color:var(--strong)}
.lj-row{display:flex; align-items:center; gap:14px; margin-top:10px}
.lj-step{font-family:"IBM Plex Mono",monospace; font-size:11.5px; letter-spacing:.1em;
  text-transform:uppercase; color:var(--ink-3)}

/* harjoitukset */
.progress{position:sticky; top:0; z-index:5; background:var(--surface); border:1px solid var(--line);
  border-radius:var(--r); padding:12px 18px; box-shadow:var(--shadow); display:flex; align-items:center;
  gap:14px; margin:34px 0 18px}
.progress .lbl{font-family:"IBM Plex Mono",monospace; font-size:11px; letter-spacing:.12em;
  text-transform:uppercase; color:var(--ink-3); white-space:nowrap}
.progress .meter{flex:1; height:7px; border-radius:4px; background:var(--surface-2); border:1px solid var(--line); overflow:hidden}
.progress .meter i{display:block; height:100%; background:var(--core); transition:width .25s ease}
.progress .cnt{font-family:"Familjen Grotesk",sans-serif; font-weight:700; font-variant-numeric:tabular-nums; white-space:nowrap}

.grp{margin-top:26px}
.grp-head{display:flex; align-items:baseline; gap:10px; border-bottom:1.5px solid var(--ink); padding-bottom:7px; margin-bottom:14px}
.grp-head h3{margin:0; font-size:17px; font-weight:600}
.grp-head span{font-size:12.5px; color:var(--ink-2)}

.ex{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:14px 16px; margin-bottom:10px}
.ex[data-tila="oikein"]{border-color:var(--strong); box-shadow:inset 3px 0 0 var(--strong)}
.ex[data-tila="vaarin"]{border-color:var(--alert); box-shadow:inset 3px 0 0 var(--alert)}
.ex .q{display:flex; gap:11px; align-items:baseline; flex-wrap:wrap}
.ex .num{font-family:"IBM Plex Mono",monospace; font-size:11.5px; color:var(--ink-3); min-width:2.4em}
.ex .txt{flex:1; min-width:190px; font-size:15.5px}
.ex .txt .aineisto{display:block; margin-bottom:9px; padding-left:12px;
  border-left:2px solid var(--line); color:var(--ink-2); line-height:1.6;
  /* Aineisto voi olla pieni taulukko, jonka rivit on erotettu rivinvaihdoilla.
     Ilman pre-lineä ne valuisivat yhdeksi kappaleeksi ja taulukko katoaisi. */
  white-space:pre-line}
.ex .txt .kysymysrivi{display:block; font-weight:600}
.ex .row{display:flex; gap:8px; align-items:center; margin-top:11px; flex-wrap:wrap}
.ex input[type=text]{font:inherit; font-family:"IBM Plex Mono",monospace; font-size:15px; width:8.5em;
  padding:7px 11px; border:1px solid var(--line); border-radius:7px; background:var(--surface-2);
  color:var(--ink); text-align:right}
.ex input:focus-visible{outline:2px solid var(--core); outline-offset:1px}
button{font:inherit; cursor:pointer}
.btn{font-size:13.5px; padding:7px 15px; border-radius:7px; border:1px solid var(--core);
  background:var(--core); color:#fff}
.btn.ghost{background:transparent; color:var(--ink-2); border-color:var(--line)}
.btn:focus-visible{outline:2px solid var(--core); outline-offset:2px}
.btn.mv-valinta{text-align:left}
/* kuuntelutehtävä: selaimen puhesynteesi lukee englanninkielisen tekstin */
.kuuntele{display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin:2px 0 10px}
.kuuntele .btn{display:inline-flex; gap:7px; align-items:center}
.kuuntele svg{width:16px; height:16px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round}
.kuuntele .varateksti{flex-basis:100%; font-size:14px; color:var(--ink-2); background:var(--surface-2);
  border-radius:7px; padding:8px 12px; margin:0}
.btn.mv-valinta:disabled{cursor:default; opacity:.65}
.btn.mv-oikein{background:var(--strong-soft); border-color:var(--strong); color:var(--strong); opacity:1}
.btn.mv-vaarin{background:var(--alert-soft); border-color:var(--alert); color:var(--alert); opacity:1}
.row.mv{gap:8px 10px}
.fb{margin-top:11px; font-size:14.5px; padding:10px 13px; border-radius:8px; line-height:1.5}
.fb.ok{background:var(--strong-soft); color:var(--strong)}
.fb.no{background:var(--alert-soft); color:var(--alert)}
.fb.hint{background:var(--chal-soft); color:var(--chal)}

.done{background:var(--strong-soft); border:1px solid var(--strong); color:var(--strong);
  border-radius:var(--r); padding:16px 20px; margin-top:20px; font-size:15.5px}
.done h3{margin:0 0 4px; font-size:17px; color:var(--strong)}

details.teacher{margin-top:34px; background:var(--surface); border:1px solid var(--line);
  border-left:3px solid var(--chal); border-radius:var(--r); padding:15px 20px; box-shadow:var(--shadow)}
details.teacher summary{cursor:pointer; font-family:"Familjen Grotesk",sans-serif; font-weight:600; font-size:15px}
details.teacher summary:focus-visible{outline:2px solid var(--core); outline-offset:3px}
details.teacher ul{margin:12px 0 0; padding-left:19px; color:var(--ink-2); font-size:14.5px}
details.teacher li{margin-bottom:8px}
details.teacher p{margin:12px 0 0; color:var(--ink-2); font-size:14.5px}

.back{display:inline-block; margin-top:30px; font-size:13.5px; color:var(--ink-2)}
.back a{color:var(--core)}

@media (prefers-reduced-motion: reduce){*{transition:none !important}}
@media (max-width:560px){
  .wrap{padding:16px 13px 70px}
  header.top h1{font-size:25px}
  .progress{flex-wrap:wrap}
}
</style>

<div class="wrap">

  <header class="top">
    <span class="badge"><svg viewBox="0 0 24 24" aria-hidden="true" id="ikoni"></svg></span>
    <div>
      <p class="eyebrow" id="eyebrow"></p>
      <h1 id="otsikko"></h1>
      <p id="kuvaus"></p>
      <div class="tags" id="tags"></div>
    </div>
  </header>

  <article id="teksti"></article>

  <div class="progress" aria-live="polite">
    <span class="lbl">Harjoitukset</span>
    <span class="meter"><i id="pbar" style="width:0%"></i></span>
    <span class="cnt" id="pcnt">0 / 20</span>
  </div>

  <div id="harjoitukset"></div>
  <div id="valmis"></div>

  <p class="back" id="back"></p>

</div>

<script>
const D = {"tavoite_id":"YMP4-AIN-06","oppiaine":"YMP","vuosiluokka":4,"taso":"ydin","otsikko":"Voiman tunto","kuvaus":"Tunnistan voiman vaikutukset: liikkeen muutoksen, kitkan ja painovoiman.","versio":"0.2","paivitetty":"2026-09-26","ops":{"T":["T12","T17"],"S":["S4"]},"eyebrow":"Ympäristöoppi · 4. luokka · Aineet, energia ja ilmiöt","ikoni":"liike","teksti":[{"tyyppi":"johdanto","sisalto":"Potkulauta kulkee pihalla, kunnes lopetat potkimisen. Sitten se hidastuu ja pysähtyy. Näyttää siltä kuin vauhti loppuisi itsestään, mutta niin ei ole: jokin hidasti sitä. Jokaisella liikkeen muutoksella on syy, ja sitä syytä sanotaan voimaksi. Tässä taidossa opit tunnistamaan kolme asiaa: mikä pani esineen liikkeelle, mikä pysäytti sen ja mihin suuntaan painovoima vetää. Kun ne osaa nimetä, pihan, mäen ja luokkahuoneen tapahtumista tulee ymmärrettäviä — ja leikkiauton vierimiskokeesta tulee oikea tutkimus."},{"tyyppi":"kappale","otsikko":"Voima on työntö tai veto","sisalto":"Voimaa ei näe. Sen vaikutuksen näkee: paikallaan oleva lähtee liikkeelle, liikkuva pysähtyy tai hidastuu, tai liikkeen suunta muuttuu. Kaikki nämä ovat liikkeen muutoksia, ja jokaisen takana on voima — työntö tai veto. Kun potkaiset palloa, jalka työntää. Kun vedät kelkkaa narusta, naru vetää. Kun otat kopin, käsi pysäyttää. Toisin päin sääntö pätee myös: paikallaan oleva kirja ei lähde pöydältä liikkeelle itsestään, eikä liikkuva esine pysähdy itsestään. Aina kun liike muuttuu, jokin voima teki sen. Tässä taidossa muutokset jaetaan kolmeen ryhmään: voima panee liikkeelle, voima pysäyttää ja voima muuttaa suuntaa. Jos esine jatkaa matkaa uuteen suuntaan, kuten seinästä kimpoava pallo, voima muutti suuntaa. Jos esine jää paikalleen, voima pysäytti."},{"tyyppi":"kappale","otsikko":"Kitka vastustaa liukumista ja vierimistä","sisalto":"Kun kaksi pintaa hankaavat toisiaan vasten, niiden välissä vaikuttaa kitka. Kitka vastustaa liukumista: se hidastaa liukuvaa esinettä ja pitää paikallaan olevan esineen paikallaan, kun sitä yritetään liu'uttaa. Kitkan suuruus riippuu pinnoista: jää on liukas, koska sen ja kengän välissä on hyvin vähän kitkaa. Pyörillä kulkevaa leikkiautoa ja vierivää palloa jarruttaa vierimiskitka: pehmeä matto painuu pyörien alla ja jarruttaa enemmän kuin kova, sileä parketti. Vierimiskitka on paljon pienempi kuin liukuvan esineen kitka, ja siksi raskas laatikko liikkuu helpommin pyörillä. Kitka ei ole pelkkä haitta. Kävely onnistuu, koska kengänpohjan ja maan välinen kitka estää jalkaa luisumasta, kun potkaiset vauhtia. Pyörän jarrut toimivat, koska jarrupala hankaa vannetta. Ilman kitkaa et pääsisi liikkeelle etkä saisi pysäytettyä itseäsi."},{"tyyppi":"taulukko","otsikko":"Missä kitkaa halutaan lisää, missä vähemmän","otsikkorivi":["Tilanne","Kitkaa halutaan","Miten se tehdään"],"rivit":[["Kengänpohja","lisää","kuvioitu pohja, talvella nastat"],["Jalkakäytävä talvella","lisää","hiekoitus"],["Polkupyörän jarru","lisää","jarrupala painetaan vannetta vasten"],["Kylpyhuoneen lattia","lisää","liukuestematto"],["Pulkka mäessä","vähemmän","sileä muovipohja"],["Suksien liukupinta","vähemmän","liukuvoitelu"],["Polkupyörän ketju","vähemmän","öljyäminen"],["Liukumäki","vähemmän","sileäksi kiillotettu pinta"]]},{"tyyppi":"saanto","otsikko":"Näin luet vierimiskokeen tuloksen","askeleet":["Tarkista ensin, että vain alusta vaihtui: sama auto, sama luiska ja sama lähtökohta luiskalla. Jos jokin muu muuttui, tuloksia ei voi verrata keskenään.","Etsi pisin vierimismatka. Sillä alustalla kitka jarrutti vähiten.","Etsi lyhin vierimismatka. Sillä alustalla kitka jarrutti eniten.","Jos sama mittaus toistettiin monta kertaa, katso kuinka paljon tulokset eroavat toisistaan. Pieni ero tarkoittaa, että mittaukseen voi luottaa."]},{"tyyppi":"kappale","otsikko":"Painovoima vetää kohti maata","sisalto":"Painovoima on maapallon veto. Se vetää jokaista esinettä kohti maan keskipistettä, siis alaspäin. Painovoima panee liikkeelle putoavan omenan ja mäkeä alas liukuvan pulkan, ja se hidastaa ylöspäin heitettyä palloa, kunnes pallo pysähtyy hetkeksi ja alkaa pudota. Painovoima vaikuttaa myös silloin, kun mikään ei liiku. Pöydällä olevaa kirjaa vetää sama voima kuin putoavaa omenaa; kirja pysyy paikallaan vain siksi, että pöytä tukee sitä. Kun tuki poistetaan, painovoima näkyy heti: työnnä kirja pöydän reunan yli, ja se putoaa."},{"tyyppi":"ansa","otsikko":"Ansa 1: liike ei lopu siksi, että voima loppuu","sisalto":"Moni ajattelee, että liikkuvassa esineessä on voimaa, joka kuluu loppuun, ja siksi esine pysähtyy. Näin ei ole. Potkaistu pallo ei kuljeta mukanaan jalan voimaa. Se pysähtyy, koska nurmikko ja ilma hidastavat sitä. Jos sama pallo potkaistaan samalla tavalla jäälle, se kulkee paljon pidemmälle, koska jäällä kitka on pieni. Jos hidastavia voimia ei olisi lainkaan, pallo jatkaisi matkaa samaa vauhtia loputtomiin — lähes niin käy avaruudessa kaukana planeetoista, missä ei ole ilmaa eikä alustaa. Arjessa tätä ei näe, koska jokin hidastava voima on melkein aina mukana. Kun jokin pysähtyy, älä kysy, mihin voima katosi. Kysy, mikä hidasti."},{"tyyppi":"ansa","otsikko":"Ansa 2: painava ei putoa nopeammin","sisalto":"Tuntuu itsestään selvältä, että painava kivi putoaa nopeammin kuin kevyt pyyhekumi. Kokeile: pudota ne samalta korkeudelta yhtä aikaa. Ne osuvat lattiaan käytännössä yhtä aikaa. Painovoima ei kiihdytä painavaa esinettä sen enempää kuin kevyttä. Sekaannuksen aiheuttaa ilmanvastus. Tasainen paperiarkki leijailee hitaasti alas, koska ilma vastustaa sen laajaa pintaa. Kun rutistat saman arkin tiukaksi palloksi, se putoaa lähes kiven mukana. Paperin paino ei muuttunut, vain ilman vastus muuttui. Hidas putoaminen johtuu siis ilmasta: ilma jarruttaa eniten esinettä, joka on kevyt kokoonsa nähden, kuten tasaista paperiarkkia, höyhentä tai ilmapalloa. Ilman ilmaa kaikki putoaisivat yhtä nopeasti."},{"tyyppi":"kappale","otsikko":"Kolme kysymystä jokaiseen tilanteeseen","sisalto":"Kun katsot mitä tahansa liikettä, kysy kolme asiaa. Ensimmäinen: mikä pani liikkeelle — työntö, veto vai painovoima? Toinen: mikä hidastaa tai pysäyttää — kitka, ilmanvastus, jokin este vai painovoima, kun liike on ylöspäin? Kolmas: mihin suuntaan painovoima vetää? Vastaus kolmanteen on sama joka kerta: alaspäin, riippumatta siitä, mihin suuntaan esine liikkuu. Pulkkamäessä vastaukset ovat nämä: painovoima pani liikkeelle, lumen kitka pysäytti tasaisella maalla, ja painovoima veti alaspäin koko ajan, myös silloin kun pulkka jo liukui tasaisella."},{"tyyppi":"muistilappu","otsikko":"Muista nämä","kohdat":["Voima on työntö tai veto. Sitä ei näe, mutta liikkeen muutoksen näkee.","Mikään ei lähde liikkeelle eikä pysähdy itsestään.","Kitka vastustaa liukumista ja vierimistä. Pisin vierimismatka tarkoittaa vähiten kitkaa.","Painovoima vetää alaspäin myös paikallaan olevaa esinettä.","Painava ei putoa nopeammin. Ilmanvastus hidastaa laajaa ja kevyttä esinettä."]}],"harjoitusryhmat":[{"id":"vaikutus","nimi":"Voima muuttaa liikettä","info":"Katso, mitä liikkeelle tapahtuu: alkaako se, loppuuko se vai vaihtuuko suunta."},{"id":"kitka","nimi":"Kitka ja alustat","info":"Pisin vierimismatka tarkoittaa vähiten kitkaa."},{"id":"painovoima","nimi":"Painovoima","info":"Painovoima vetää alaspäin myös silloin, kun mikään ei liiku."}],"harjoitukset":[{"id":"H01","ryhma":"vaikutus","tyyppi":"luku","kysymys":"Lue tilanteet.\n1. Potkaiset paikallaan olevaa jalkapalloa.\n2. Otat kopin lentävästä pallosta.\n3. Työnnät paikallaan olevan ostoskärryn liikkeelle.\n4. Pallo kimpoaa seinästä takaisin.\n5. Vedät paikallaan olevan kelkan liikkeelle narusta.\n\nMontako tilanteista on sellaisia, joissa voima panee paikallaan olevan esineen liikkeelle?","vastaus":3,"vinkki":"Etsi tilanteet, joissa esine on ensin paikallaan ja sitten liikkuu.","selitys":"Kolme: potku panee pallon liikkeelle, työntö kärryn ja veto kelkan. Kopin ottaminen pysäyttää, ja seinästä kimpoaminen muuttaa suuntaa."},{"id":"H02","ryhma":"vaikutus","tyyppi":"luku","kysymys":"Lue tilanteet.\n1. Jarrutat pyörällä ja pysähdyt.\n2. Lyöt tulevan pallon mailalla toiseen suuntaan.\n3. Maalivahti pysäyttää kiekon hanskaansa.\n4. Lyöt paikallaan olevaa kiekkoa mailalla.\n5. Pysäytät vierivän pallon jalallasi.\n6. Auto jarruttaa ja pysähtyy suojatien eteen.\n\nMontako tilanteista on sellaisia, joissa voima pysäyttää liikkuvan esineen?","vastaus":4,"vinkki":"Pysäyttäminen tarkoittaa, että esine jää paikalleen. Jos se jatkaa matkaa uuteen suuntaan, kyse on suunnan muutoksesta.","selitys":"Neljä: pyörän jarrutus, maalivahdin torjunta hanskaan, pallon pysäyttäminen jalalla ja auton jarrutus. Mailalla lyöty pallo jatkaa matkaa toiseen suuntaan, ja paikallaan olevan kiekon lyöminen panee liikkeelle."},{"id":"H03","ryhma":"vaikutus","tyyppi":"luku","kysymys":"Lue tilanteet.\n1. Käännät ohjaustankoa, ja pyörä kaartaa.\n2. Poljet pyörän liikkeelle pysähdyksistä.\n3. Kiekko osuu maalitolppaan ja kimpoaa sivulle.\n4. Juna jarruttaa ja pysähtyy asemalle.\n5. Heität pallon kädestäsi.\n\nMontako tilanteista on sellaisia, joissa voima muuttaa liikkeen suuntaa?","vastaus":2,"vinkki":"Suunta muuttuu, kun esine jatkaa liikettä mutta eri suuntaan kuin ennen.","selitys":"Kaksi: pyörä kaartaa ja kiekko kimpoaa tolpasta sivulle. Polkeminen liikkeelle ja pallon heittäminen ovat liikkeelle panemista, junan jarrutus pysäyttämistä."},{"id":"H04","ryhma":"vaikutus","tyyppi":"monivalinta","kysymys":"Pallo vierii nurmikolla ja pysähtyy vähitellen. Mikä pysäyttää sen?","vaihtoehdot":["Pallon oma voima loppuu","Nurmikon ja pallon välinen kitka","Painovoima vetää palloa taaksepäin"],"vastaus":1,"vinkki":"Mieti, kuljettaako pallo potkun voimaa mukanaan vai hidastaako sitä jokin ulkopuolinen.","selitys":"Nurmikon ja pallon välinen kitka hidastaa palloa, ja ilma auttaa hieman. Pallossa ei ole voimaa, joka loppuisi, eikä painovoima vedä taaksepäin vaan alaspäin."},{"id":"H05","ryhma":"vaikutus","tyyppi":"luku","kysymys":"Lue tilanteet.\n1. Työnnät suljetun oven auki.\n2. Otat kiinni putoavan avaimen.\n3. Koripallo osuu levyyn ja putoaa siitä koriin.\n4. Nostat repun lattialta.\n\nMissä tilanteessa (1, 2, 3 vai 4) voima muuttaa liikkeen suuntaa?","vastaus":3,"vinkki":"Etsi tilanne, jossa esine liikkuu sekä ennen että jälkeen, mutta eri suuntaan.","selitys":"Tilanne 3: koripallo lentää levyyn ja jatkaa siitä koriin, eli suunta muuttui. Oven avaaminen ja repun nostaminen panevat liikkeelle, avaimen kiinni ottaminen pysäyttää."},{"id":"H06","ryhma":"vaikutus","tyyppi":"luku","kysymys":"Lue tilanteet.\n1. Kirja on paikallaan pöydällä.\n2. Koira vetää paikallaan olevan kärryn liikkeelle.\n3. Juna kulkee suoraa rataa tasaista vauhtia.\n4. Tuuli kääntää purjeveneen kulkusuunnan.\n5. Kärry törmää seinään ja pysähtyy.\n6. Lamppu roikkuu katosta paikallaan.\n\nMontako tilanteista on sellaisia, joissa voima muuttaa liikettä (panee liikkeelle, pysäyttää tai muuttaa suuntaa)?","vastaus":3,"vinkki":"Jos esine on paikallaan koko ajan tai kulkee samaa vauhtia samaan suuntaan, liike ei muutu.","selitys":"Kolme: koira panee kärryn liikkeelle, tuuli muuttaa veneen suuntaa ja seinä pysäyttää kärryn. Pöydällä oleva kirja, tasaista vauhtia kulkeva juna ja paikallaan roikkuva lamppu eivät muuta liikettään."},{"id":"H07","ryhma":"vaikutus","tyyppi":"monivalinta","kysymys":"Työnnät kärryä tasaisella lattialla ja lopetat sitten työntämisen. Kärry hidastuu ja pysähtyy. Miksi?","vaihtoehdot":["Työnnön voima kului kärrystä loppuun","Painovoima vetää kärryä taaksepäin","Kitka ja ilma hidastavat kärryä"],"vastaus":2,"vinkki":"Kysy, mikä hidasti — älä sitä, mihin voima katosi.","selitys":"Pyörien ja lattian välinen kitka sekä ilma hidastavat kärryä. Ilman niitä kärry jatkaisi samaa vauhtia. Painovoima vetää alaspäin, ei taaksepäin."},{"id":"H08","ryhma":"kitka","tyyppi":"luku","kysymys":"Leikkiauto päästettiin vierimään samalta kohdalta luiskaa pitkin kolmelle eri alustalle. Vierimismatka mitattiin luiskan päästä siihen kohtaan, mihin auto pysähtyi.\nAlusta 1, matto: 35 cm\nAlusta 2, parketti: 120 cm\nAlusta 3, pahvi: 80 cm\n\nMillä alustalla (1, 2 vai 3) auto vieri pisimmälle?","vastaus":2,"vinkki":"Vertaa senttimetrilukuja. Suurin luku on pisin matka.","selitys":"Parketilla (alusta 2) auto vieri 120 cm, mikä on pisin matka. Sileällä parketilla kitka jarrutti vähiten."},{"id":"H09","ryhma":"kitka","tyyppi":"luku","kysymys":"Leikkiauto päästettiin vierimään samalta kohdalta luiskaa pitkin kolmelle eri alustalle. Vierimismatka mitattiin luiskan päästä siihen kohtaan, mihin auto pysähtyi.\nAlusta 1, matto: 35 cm\nAlusta 2, parketti: 120 cm\nAlusta 3, pahvi: 80 cm\n\nMillä alustalla (1, 2 vai 3) on eniten kitkaa?","vastaus":1,"vinkki":"Eniten kitkaa on siellä, missä auto pysähtyi lyhimmän matkan jälkeen.","selitys":"Matolla (alusta 1) auto vieri vain 35 cm. Lyhin matka tarkoittaa, että kitka jarrutti eniten."},{"id":"H10","ryhma":"kitka","tyyppi":"luku","kysymys":"Leikkiauto päästettiin vierimään samalta kohdalta luiskaa pitkin kolmelle eri alustalle. Vierimismatka mitattiin luiskan päästä siihen kohtaan, mihin auto pysähtyi.\nAlusta 1, matto: 35 cm\nAlusta 2, parketti: 120 cm\nAlusta 3, pahvi: 80 cm\n\nKuinka monta senttimetriä pidemmälle auto vieri alustalla 2 kuin alustalla 3?","vastaus":40,"vinkki":"Vähennä alustan 3 matka alustan 2 matkasta.","selitys":"120 cm − 80 cm = 40 cm. Parketilla auto vieri 40 cm pidemmälle kuin pahvilla."},{"id":"H11","ryhma":"kitka","tyyppi":"luku","kysymys":"Leikkiauto päästettiin vierimään samalta kohdalta luiskaa pitkin neljälle eri alustalle. Vierimismatka mitattiin luiskan päästä siihen kohtaan, mihin auto pysähtyi.\nAlusta 1, pyyhe: 25 cm\nAlusta 2, laminaatti: 105 cm\nAlusta 3, hiekkapaperi: 15 cm\nAlusta 4, muovilevy: 90 cm\n\nMontako alustaa on sellaista, joilla auto vieri yli 50 cm?","vastaus":2,"vinkki":"Käy alustat läpi yksi kerrallaan ja vertaa lukua 50:een.","selitys":"Laminaatti (105 cm) ja muovilevy (90 cm) ylittävät 50 cm. Pyyhe ja hiekkapaperi jäävät alle. Vastaus on 2."},{"id":"H12","ryhma":"kitka","tyyppi":"luku","kysymys":"Sama leikkiauto päästettiin samalta kohdalta luiskaa samalle alustalle (laminaatti) kolme kertaa. Vierimismatka mitattiin joka kerta.\nMittaus 1: 104 cm\nMittaus 2: 98 cm\nMittaus 3: 101 cm\n\nKuinka monta senttimetriä pisin ja lyhin mittaus eroavat toisistaan?","vastaus":6,"vinkki":"Etsi suurin ja pienin luku ja laske niiden erotus.","selitys":"104 cm − 98 cm = 6 cm. Ero on pieni, joten mittaukseen voi luottaa. Toistaminen tehdään juuri tämän takia."},{"id":"H13","ryhma":"kitka","tyyppi":"luku","kysymys":"Lue tilanteet.\n1. Kengänpohjaan tehdään kuvio.\n2. Pulkan pohja on sileää muovia.\n3. Jalkakäytävä hiekoitetaan talvella.\n4. Suksien liukupinnat voidellaan liukuvoiteella.\n5. Polkupyörän jarrupala painetaan vannetta vasten.\n6. Polkupyörän ketju öljytään.\n\nMontako tilanteista on sellaisia, joissa kitkaa halutaan lisää?","vastaus":3,"vinkki":"Kysy jokaisesta: halutaanko, että pinnat pitävät vai että ne liukuvat?","selitys":"Kolme: kengänpohjan kuvio, hiekoitus ja jarrupala lisäävät kitkaa. Pulkan sileä pohja, suksien liukuvoitelu ja ketjun öljyäminen vähentävät sitä."},{"id":"H14","ryhma":"kitka","tyyppi":"luku","kysymys":"Lue tilanteet.\n1. Narisevaan oven saranaan laitetaan öljyä.\n2. Autoon vaihdetaan nastarenkaat.\n3. Liukumäen pinta kiillotetaan sileäksi.\n4. Kylpyammeen pohjalle laitetaan liukuestematto.\n5. Jäähallin jää tasoitetaan sileäksi, jotta kiekko liukuu.\n6. Työkalun kahva päällystetään kumilla, jotta se ei luista kädestä.\n\nMontako tilanteista on sellaisia, joissa kitkaa halutaan vähemmän?","vastaus":3,"vinkki":"Öljy, vaha ja sileä pinta vähentävät kitkaa. Kuvio, karhea pinta ja kumi lisäävät sitä.","selitys":"Kolme: saranan öljyäminen, liukumäen kiillotus ja jään tasoitus vähentävät kitkaa. Nastarenkaat, liukuestematto ja kumikahva lisäävät sitä."},{"id":"H15","ryhma":"painovoima","tyyppi":"luku","kysymys":"Lue tilanteet.\n1. Omena irtoaa oksasta ja putoaa maahan.\n2. Heität pallon suoraan ylöspäin.\n3. Pulkka lähtee liukumaan mäkeä alas, kun päästät siitä irti.\n4. Poljet pyörällä tasaisella tiellä.\n5. Lumi liukuu katolta alas.\n\nMontako tilanteista on sellaisia, joissa painovoima panee liikkeen alulle?","vastaus":3,"vinkki":"Painovoima vetää alaspäin. Jos liike alkaa alaspäin ilman työntöä tai vetoa, painovoima pani sen alulle.","selitys":"Kolme: omena putoaa, pulkka lähtee mäkeä alas ja lumi liukuu katolta. Ylös heitetyn pallon panee liikkeelle käsi, ja pyörän liikkeelle panevat jalat."},{"id":"H16","ryhma":"painovoima","tyyppi":"luku","kysymys":"Lue luettelo.\n1. Pöydällä oleva kirja\n2. Ilmassa lentävä pallo\n3. Seinällä roikkuva taulu\n4. Lattialla oleva reppu\n\nMontako luettelon kohteista painovoima vetää kohti maata?","vastaus":4,"vinkki":"Painovoima vaikuttaa myös esineeseen, joka ei liiku. Mieti, mitä tapahtuisi, jos tuki poistettaisiin.","selitys":"Kaikkia neljää. Kirja, taulu ja reppu pysyvät paikallaan vain siksi, että pöytä, naula ja lattia tukevat niitä. Lentävää palloa painovoima vetää koko ajan alaspäin."},{"id":"H17","ryhma":"painovoima","tyyppi":"luku","kysymys":"Lue tilanteet.\n1. Pallo putoaa kädestäsi lattialle.\n2. Kärry vierii tasaisella lattialla ja pysähtyy.\n3. Heität pallon suoraan ylöspäin, ja se nousee.\n4. Pulkka liukuu mäkeä alas.\n\nMissä tilanteessa (1, 2, 3 vai 4) painovoima hidastaa liikettä?","vastaus":3,"vinkki":"Painovoima vetää alaspäin. Se hidastaa liikettä, joka suuntautuu ylöspäin.","selitys":"Tilanne 3: ylös heitetty pallo hidastuu, koska painovoima vetää sitä alaspäin. Putoavaa palloa ja pulkkaa painovoima kiihdyttää, ja kärryä hidastaa kitka."},{"id":"H18","ryhma":"painovoima","tyyppi":"monivalinta","kysymys":"Sinulla on kaksi samankokoista palloa. Toinen on painava, toinen kevyt. Pudotat ne samalta korkeudelta yhtä aikaa. Kumpi osuu lattiaan ensin?","vaihtoehdot":["Painava pallo osuu ensin","Kevyt pallo osuu ensin","Ne osuvat lähes yhtä aikaa"],"vastaus":2,"vinkki":"Muista Ansa 2. Painovoima ei kiihdytä painavaa palloa enempää kuin kevyttä. Ilma jarruttaa selvästi vain esinettä, joka on hyvin kevyt kokoonsa nähden, kuten ilmapalloa tai paperiarkkia.","selitys":"Ne osuvat lattiaan lähes yhtä aikaa. Painovoima ei kiihdytä painavaa palloa kevyttä enemmän. Vain esine, joka on hyvin kevyt kokoonsa nähden, kuten paperiarkki tai ilmapallo, putoaa selvästi hitaammin, ja syy on silloin ilma."},{"id":"H19","ryhma":"painovoima","tyyppi":"luku","kysymys":"Pudotat nämä esineet yksi kerrallaan samalta korkeudelta.\n1. kivi\n2. tasainen paperiarkki\n3. rutattu paperipallo\n4. höyhen\n5. avain\n\nMontako näistä esineistä putoaa selvästi hitaammin kuin muut ilmanvastuksen takia?","vastaus":2,"vinkki":"Ilmanvastus hidastaa laajaa ja kevyttä esinettä. Rutattu paperi ei ole enää laaja.","selitys":"Kaksi: tasainen paperiarkki ja höyhen leijailevat, koska ilma vastustaa niiden laajaa pintaa. Kivi, rutattu paperipallo ja avain putoavat suoraan."},{"id":"H20","ryhma":"painovoima","tyyppi":"luku","kysymys":"Heität pallon suoraan ylös. Se nousee, pysähtyy hetkeksi ja putoaa takaisin käteesi. Lue väitteet.\n1. Painovoima hidastaa palloa, kun se nousee.\n2. Painovoima vetää palloa alaspäin myös silloin, kun pallo on ylimmässä kohdassa.\n3. Painovoima loppuu hetkeksi, kun pallo pysähtyy ylhäällä.\n4. Painovoima kiihdyttää palloa, kun se putoaa.\n\nMontako väitteistä on totta?","vastaus":3,"vinkki":"Painovoima ei katkea koskaan. Mieti, mikä väitteistä sanoo toisin.","selitys":"Kolme väitettä on totta: painovoima hidastaa nousua, vetää ylimmässä kohdassa ja kiihdyttää putoamista. Väite 3 on väärä: painovoima ei lopu, vaan juuri se kääntää pallon liikkeen alaspäin."}],"valmis_teksti":"Osaat nimetä, mikä voima panee esineen liikkeelle, mikä pysäyttää sen ja mihin suuntaan painovoima vetää, ja osaat lukea vierimiskokeen tuloksen. Tämä taito on nyt näytetty."};

/* ---------- teksti ---------- */
const esc = s => s;
const osat = D.teksti.map(o=>{
  switch(o.tyyppi){
    case "johdanto":
      return `<p class="lead">${esc(o.sisalto)}</p>`;
    case "kappale":
      return `<h2>${esc(o.otsikko)}</h2><p>${esc(o.sisalto)}</p>`;
    case "saanto":
      return `<div class="box"><h3>${esc(o.otsikko)}</h3><ol class="steps">${
        o.askeleet.map(a=>`<li><span>${esc(a)}</span></li>`).join("")}</ol></div>`;
    case "taulukko":
      return `<div class="box"><h3>${esc(o.otsikko)}</h3><div class="tablewrap"><table><thead><tr>${
        o.otsikkorivi.map(h=>`<th>${h}</th>`).join("")}</tr></thead><tbody>${
        o.rivit.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join("")}</tr>`).join("")}</tbody></table></div></div>`;
    case "ansa":
      return `<div class="box warn"><h3>${esc(o.otsikko)}</h3><p style="margin:0">${esc(o.sisalto)}</p></div>`;
    case "muistilappu":
      return `<div class="box note"><h3>${esc(o.otsikko)}</h3><ul class="notes">${
        o.kohdat.map(k=>`<li>${esc(k)}</li>`).join("")}</ul></div>`;
    case "numerotaulu":
      return `<div class="box nt"><h3>${esc(o.otsikko)}</h3><p class="ohje">${esc(o.sisalto)}</p>
        <div class="nt-valinta" id="ntValinta"></div>
        <div class="nt-taulu" id="ntTaulu"></div>
        <p class="nt-selite" id="ntSelite"></p></div>`;
    case "vahvuusportaat":
      return `<div class="box vp"><h3>${esc(o.otsikko)}</h3><p class="ohje">${esc(o.sisalto)}</p>
        <div class="vp-tasot">${o.tasot.map(t=>
          `<div class="vp-taso" data-taso="${t.id}"><span class="vp-pallo"></span>
           <div><strong>${t.nimi}</strong><span>${t.selite}</span></div></div>`).join("")}</div>
        <div class="vp-lauseke" id="vpLauseke"></div>
        <div class="vp-rivi"><button type="button" class="btn ghost" id="vpSeuraava">Toinen lauseke</button>

    case "laskujarjestys":
      return `<div class="box lj"><h3>${esc(o.otsikko)}</h3><p style="margin:0 0 12px;font-size:14.5px;color:var(--ink-2)">${esc(o.sisalto)}</p>

        <div class="lj-row"><button type="button" class="btn ghost" id="ljSeuraava">Toinen lauseke</button>
        <span class="lj-step" id="ljStep"></span></div></div>`;
    case "lukusuora":
      return `<div class="box nl"><h3>${esc(o.otsikko)}</h3><p style="margin:0 0 8px;font-size:14.5px;color:var(--ink-2)">${esc(o.sisalto)}</p>

          <input type="range" id="nlrange" min="0" max="100" value="47" aria-describedby="nlout">
          <span class="nl-out" id="nlout"></span>
        </div></div>`;
    default: return "";
  }
}).join("");

/* ---------- lukusuora ---------- */
const svg=document.getElementById("nlsvg"), rng=document.getElementById("nlrange"), out=document.getElementById("nlout");
const X0=34, X1=606, Y=62;
function piirraNL(v){
  const ala=Math.floor(v/10)*10, yla=ala+10, puoli=ala+5;
  const pyor = (v%10)>=5 ? yla : ala;
  const x = n => X0 + (n/100)*(X1-X0);
  let s=`<line class="rail" x1="${X0}" y1="${Y}" x2="${X1}" y2="${Y}"/>`;
  for(let n=0;n<=100;n+=10){
    const near = (n===ala||n===yla);
    s+=`<line class="tick" x1="${x(n)}" y1="${Y-7}" x2="${x(n)}" y2="${Y+7}"/>`;
    s+=`<text class="stop${near?" near":""}" x="${x(n)}" y="${Y+24}" text-anchor="middle">${n}</text>`;
  }
  s+=`<line class="halfway" x1="${x(puoli)}" y1="${Y-16}" x2="${x(puoli)}" y2="${Y+12}"/>`;
  s+=`<text class="stop" x="${x(puoli)}" y="${Y-22}" text-anchor="middle">puoliväli ${puoli}</text>`;
  s+=`<circle class="dot" cx="${x(v)}" cy="${Y}" r="6"/>`;
  s+=`<text class="val" x="${x(v)}" y="${Y-32}" text-anchor="middle">${v}</text>`;
  s+=`<path d="M ${x(v)} ${Y+38} L ${x(pyor)} ${Y+38}" stroke="var(--core)" stroke-width="2" fill="none"/>`;
  s+=`<path d="M ${x(pyor)} ${Y+38} l ${x(pyor)>x(v)?-7:7} -4 l 0 8 z" fill="var(--core)"/>`;
  svg.innerHTML=s;
  out.textContent = `${v} pyöristyy → ${pyor}`;
}

/* ---------- laskujärjestys-widget ---------- */
const ljExp=document.getElementById("ljExp");
if(ljExp && D.kokeilu){
  let ljI=0, ljTokens=[], ljStep=0;
  const laske=(a,op,b)=>{a=+a;b=+b;return op==="×"?a*b:op==="÷"?a/b:op==="+"?a+b:a-b;};
  function ljAlku(){
    const l=D.kokeilu[ljI];
    ljTokens=l.lauseke.replace(/\(/g,"( ").replace(/\)/g," )").split(/\s+/).filter(Boolean);
    ljStep=0; ljPiirra(); ljViesti("","");
  }
  function ljViesti(t,lk){const f=document.getElementById("ljFb"); f.textContent=t; f.className="lj-fb "+(lk||"");}
  function ljPiirra(){
    const l=D.kokeilu[ljI];
    document.getElementById("ljStep").textContent =
      ljStep>=l.askeleet.length ? "valmis" : `askel ${ljStep+1} / ${l.askeleet.length}`;
    if(ljStep>=l.askeleet.length){
      ljExp.innerHTML=`<span class="valmis">${l.lauseke} = ${l.vastaus}</span>`;
      return;
    }
    ljExp.innerHTML=ljTokens.map((t,i)=>
      "×÷+−".includes(t) ? `<button type="button" class="op" data-i="${i}">${t}</button>`
                         : `<span class="tok">${t}</span>`).join("");
    ljExp.querySelectorAll("button.op").forEach(b=>b.addEventListener("click",()=>ljKlikkaa(+b.dataset.i)));
  }
  function ljKlikkaa(i){
    const l=D.kokeilu[ljI], odotettu=l.askeleet[ljStep];
    const ehdotus=[ljTokens[i-1],ljTokens[i],ljTokens[i+1]].join(" ");
    if(ehdotus!==odotettu){
      ljViesti(ljStep===0
        ? "Ei vielä. Sulkeet ovat vahvimmat, sitten kerto ja jako. Yhtä vahvat vasemmalta oikealle."
        : "Ei vielä. Kumpi jäljellä olevista on vahvempi?", "no");
      return;
    }
    const arvo=laske(ljTokens[i-1],ljTokens[i],ljTokens[i+1]);
    let alku=i-1, loppu=i+1;
    if(ljTokens[i-2]==="(" && ljTokens[i+2]===")"){ alku=i-2; loppu=i+2; }
    ljTokens.splice(alku, loppu-alku+1, String(arvo));
    ljStep++;
    ljViesti(ljStep>=l.askeleet.length ? "Valmis. Vastaus on "+l.vastaus+"." : "Oikein. Jatka seuraavaan.", "ok");
    ljPiirra();
  }
  document.getElementById("ljSeuraava").addEventListener("click",()=>{
    ljI=(ljI+1)%D.kokeilu.length; ljAlku();
  });
  ljAlku();
}

   Kaksi vastaustyyppiä: "numero" (oletus, tekstikenttä + Number()-vertailu) ja

   erotettuna tyhjällä rivillä. Viimeinen osa on kysymys, sitä edeltävät aineistoa. */
const kysymysHtml = t => {
  const osat = String(t).split(/\n\s*\n/).map(x=>x.trim()).filter(Boolean);
  if(osat.length < 2) return osat[0] || "";
  const kysymys = osat.pop();
  return osat.map(p=>`<span class="aineisto">${p}</span>`).join("")
       + `<span class="kysymysrivi">${kysymys}</span>`;
};

/* Suomalainen lukumuoto: välilyönti on tuhaterotin, pilkku desimaalierotin.
   Piste voi olla kumpi tahansa. Se tulkitaan tuhaterottimeksi VAIN silloin, kun
   koko luku on aitoa tuhaterotinmuotoa: alkuosa 1–3 numeroa ilman etunollaa ja
   jokainen jatko-osa täsmälleen 3 numeroa (1.500, 12.345.678). Kaikissa muissa
   tapauksissa piste on desimaalipiste — myös 0.125, joka vanhalla säännöllä
   ("3 numeroa pisteen jäljessä = tuhaterotin") luettiin virheellisesti luvuksi 125. */
const TUHATEROTIN = /^[1-9]\d{0,2}(\.\d{3})+$/;
function lueLuku(teksti){
  // Murtoluku (3/4, -3/4) ja sekaluku (1 2/3, -1 2/3) hyväksytään sellaisinaan.
  const raaka = String(teksti).replace(/\u00a0/g, " ").trim();
  let m = raaka.match(/^(-?)(\d+)\s+(\d+)\s*\/\s*(\d+)$/);
  if(m){ const nim = Number(m[4]); if(nim === 0) return null;
    const v = Number(m[2]) + Number(m[3]) / nim; return m[1] ? -v : v; }
  m = raaka.match(/^(-?)\s*(\d+)\s*\/\s*(\d+)$/);
  if(m){ const nim = Number(m[3]); if(nim === 0) return null;
    const v = Number(m[2]) / nim; return m[1] ? -v : v; }
  let s = String(teksti).replace(/[\s\u00a0]/g, "");
  if(s === "") return null;
  if(s.indexOf(",") >= 0){
    s = s.replace(/\./g, "").replace(",", ".");
  } else if(TUHATEROTIN.test(s)){
    s = s.replace(/\./g, "");
  }
  const n = Number(s);
  return Number.isFinite(n) ? n : null;
}

function tarkista(id){
  const h=D.harjoitukset.find(x=>x.id===id);
  const kentta=document.getElementById("in-"+id);
  const fb=document.getElementById("fb-"+id);
  if(kentta.value.trim()===""){ fb.className="fb hint"; fb.textContent="Kirjoita vastaus ensin."; return; }
  const luku=lueLuku(kentta.value);
  if(luku===null){ fb.className="fb no"; fb.textContent="Vastauksen pitää olla luku tai murtoluku (esimerkiksi 3/4)."; return; }
  const oikein = Math.abs(luku - h.vastaus) < 1e-9;
  merkitseTulos(id, oikein, oikein ? "Oikein. "+h.selitys : `Ei vielä. ${h.vinkki} Kokeile uudelleen.`);
}

function tarkistaMonivalinta(id, valittuIndeksi, painike){
  const h=D.harjoitukset.find(x=>x.id===id);
  const rivi=painike.closest(".row");
  rivi.querySelectorAll(".mv-valinta").forEach(b=>b.disabled=true);
  const oikein = valittuIndeksi===h.vastaus;
  painike.classList.add(oikein?"mv-oikein":"mv-vaarin");
  if(!oikein){
    const oikeaBtn=rivi.querySelector(`[data-i="${h.vastaus}"]`);
    if(oikeaBtn) oikeaBtn.classList.add("mv-oikein");
  }
  merkitseTulos(id, oikein, oikein ? "Oikein. "+h.selitys : `Ei ihan. Oikea vastaus on korostettu. ${h.selitys||""}`);
}

/* Kuuntelu: selain lukee tekstin ääneen omalla puhesynteesillään (englanniksi, jos laitteessa on
   englanninkielinen ääni). Ei äänitiedostoja eikä verkkoyhteyttä. Jos laite ei osaa puhua,
   teksti näytetään luettavaksi — silloin tehtävä muuttuu luetun ymmärtämiseksi, mutta ei katkea. */
function puhu(id, nopeus){
  const h=D.harjoitukset.find(x=>x.id===id); if(!h || !h.kuuntele) return;
  const vara=document.getElementById("vara-"+id);
  const naytaTeksti=syy=>{ vara.hidden=false; vara.textContent=syy+" Teksti: "+h.kuuntele; };
  if(!("speechSynthesis" in window)){ naytaTeksti("Tämä laite ei osaa lukea ääneen."); return; }
  const s=window.speechSynthesis; s.cancel();
  const u=new SpeechSynthesisUtterance(h.kuuntele);
  u.lang=h.kieli||"en-GB"; u.rate=nopeus;
  const aanet=s.getVoices(), kieli=u.lang.slice(0,2);
  const aani=aanet.find(a=>a.lang===u.lang) || aanet.find(a=>a.lang && a.lang.startsWith(kieli));
  if(aani) u.voice=aani;
  else if(aanet.length) { naytaTeksti("Laitteessa ei ole englanninkielistä ääntä."); return; }
  u.onerror=()=>naytaTeksti("Ääneen lukeminen ei onnistunut.");
  s.speak(u);
}
