<title>Tosi vai epätosi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">

<style>
:root{
  --paper:#EFF2F5; --surface:#FFFFFF; --surface-2:#F7F9FB;
  --grid:#DCE3EA; --line:#C9D3DC;
  --ink:#15222C; --ink-2:#4E626F; --ink-3:#7E8F9B;
  --core:#1B5A9E; --core-soft:#E4EDF6;
  --strong:#1F6E5C; --strong-soft:#E1F0EB;
  --chal:#9A6A16; --chal-soft:#F6EDDC;
  --alert:#A33A2B; --alert-soft:#F8E7E3;
  --shadow:0 1px 2px rgba(21,34,44,.06), 0 8px 24px -12px rgba(21,34,44,.18);
  --r:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0F161B; --surface:#18222A; --surface-2:#1D2830;
    --grid:#22303A; --line:#2E3E4A;
    --ink:#E8EFF4; --ink-2:#A3B4C0; --ink-3:#7A8B97;
    --core:#7FB2E4; --core-soft:#16303F;
    --strong:#77CDB4; --strong-soft:#123028;
    --chal:#E0B267; --chal-soft:#33270F;
    --alert:#E8907F; --alert-soft:#3A1E19;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -14px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --paper:#0F161B; --surface:#18222A; --surface-2:#1D2830;
  --grid:#22303A; --line:#2E3E4A;
  --ink:#E8EFF4; --ink-2:#A3B4C0; --ink-3:#7A8B97;
  --core:#7FB2E4; --core-soft:#16303F;
  --strong:#77CDB4; --strong-soft:#123028;
  --chal:#E0B267; --chal-soft:#33270F;
  --alert:#E8907F; --alert-soft:#3A1E19;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -14px rgba(0,0,0,.7);
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:16px; line-height:1.62;
  background-image:
    linear-gradient(to right, var(--grid) 1px, transparent 1px),
    linear-gradient(to bottom, var(--grid) 1px, transparent 1px);
  background-size:26px 26px;
}
.wrap{max-width:760px; margin:0 auto; padding:28px 20px 90px}
h1,h2,h3,h4{font-family:"Familjen Grotesk","IBM Plex Sans",system-ui,sans-serif; text-wrap:balance}

/* header */
header.top{background:var(--surface); border:1px solid var(--line); border-radius:var(--r);
  box-shadow:var(--shadow); padding:22px 24px; display:flex; gap:18px; align-items:flex-start}
.badge{flex:0 0 auto; width:54px; height:54px; border-radius:9px; display:grid; place-items:center;
  background:var(--core-soft); border:1px solid var(--core); color:var(--core)}
.badge svg{width:28px; height:28px; fill:none; stroke:currentColor; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round}
.eyebrow{font-family:"IBM Plex Mono",monospace; font-size:11px; letter-spacing:.14em;
  text-transform:uppercase; color:var(--ink-3); margin:0 0 5px}
header.top h1{margin:0; font-size:30px; font-weight:700; letter-spacing:-.015em}
header.top p{margin:5px 0 0; color:var(--ink-2); font-size:15px}
.tags{display:flex; flex-wrap:wrap; gap:5px; margin-top:11px}
.tag{font-family:"IBM Plex Mono",monospace; font-size:10.5px; letter-spacing:.05em; padding:2px 7px;
  border-radius:4px; background:var(--surface-2); border:1px solid var(--line); color:var(--ink-3)}
.tag.core{background:var(--core-soft); border-color:var(--core); color:var(--core)}

/* teksti */
article{margin-top:26px}
article h2{font-size:21px; font-weight:600; margin:32px 0 10px; letter-spacing:-.01em}
article p{margin:0 0 14px; max-width:64ch}
.lead{font-size:17.5px; color:var(--ink); border-left:3px solid var(--core); padding-left:16px; margin:0 0 8px}

.box{background:var(--surface); border:1px solid var(--line); border-radius:var(--r);
  padding:18px 22px; box-shadow:var(--shadow); margin:22px 0}
.box h3{margin:0 0 12px; font-size:16.5px; font-weight:600}
.box.warn{border-left:3px solid var(--alert)}
.box.note{border-left:3px solid var(--chal)}

ol.steps{margin:0; padding-left:0; list-style:none; counter-reset:s; display:grid; gap:12px}
ol.steps li{counter-increment:s; display:grid; grid-template-columns:auto 1fr; gap:13px; align-items:start}
ol.steps li::before{content:counter(s); font-family:"Familjen Grotesk",sans-serif; font-weight:700; font-size:14px;
  width:26px; height:26px; border-radius:50%; background:var(--core); color:#fff; display:grid; place-items:center; margin-top:2px}

ul.notes{margin:0; padding-left:19px}
ul.notes li{margin-bottom:7px}
ul.notes li:last-child{margin-bottom:0}

.tablewrap{overflow-x:auto}
table{border-collapse:collapse; width:100%; font-size:14.5px; min-width:460px}
th,td{text-align:left; padding:9px 13px; border-bottom:1px solid var(--line)}
th{font-family:"IBM Plex Mono",monospace; font-size:10.5px; letter-spacing:.1em; text-transform:uppercase;
  color:var(--ink-3); font-weight:400; background:var(--surface-2)}
tr:last-child td{border-bottom:0}
td b{color:var(--core); font-weight:600}
td:last-child{font-variant-numeric:tabular-nums; font-weight:600}

/* lukusuora */
.nl svg{width:100%; height:118px; display:block}
.nl .rail{stroke:var(--line); stroke-width:2}
.nl .tick{stroke:var(--line); stroke-width:1.5}
.nl .stop{fill:var(--ink-3); font-family:"IBM Plex Mono",monospace; font-size:11px}
.nl .stop.near{fill:var(--core); font-weight:600}
.nl .dot{fill:var(--chal)}
.nl .val{fill:var(--ink); font-family:"Familjen Grotesk",sans-serif; font-size:15px; font-weight:700}
.nl .halfway{stroke:var(--chal); stroke-dasharray:3 3; stroke-width:1.5}
.nl-controls{display:flex; align-items:center; gap:14px; margin-top:6px}
.nl-controls input{flex:1; accent-color:var(--core)}
.nl-out{font-family:"Familjen Grotesk",sans-serif; font-size:15px; font-weight:600; min-width:12.5em; text-align:right}

/* paikka-arvotaulu */
.box .ohje{margin:0 0 14px; font-size:14.5px; color:var(--ink-2)}
.nt-valinta{display:flex; flex-wrap:wrap; gap:7px; margin-bottom:16px}
.nt-valinta button{font:inherit; font-size:12.5px; font-family:"IBM Plex Mono",monospace; padding:5px 11px;
  border-radius:6px; border:1px solid var(--line); background:var(--surface-2); color:var(--ink-2); cursor:pointer}
.nt-valinta button[aria-pressed="true"]{background:var(--ink); color:var(--paper); border-color:var(--ink)}
.nt-valinta button:focus-visible{outline:2px solid var(--core); outline-offset:2px}
.nt-taulu{display:flex; flex-direction:column; gap:4px; align-items:flex-start; overflow-x:auto; padding-bottom:4px}
.nt-rivi{display:flex; gap:6px; align-items:center}
.nt-rivi .otsa{font-family:"IBM Plex Mono",monospace; font-size:9.5px; letter-spacing:.08em;
  text-transform:uppercase; color:var(--ink-3); width:52px; text-align:center}
.nt-ruutu{width:52px; height:52px; display:grid; place-items:center; border:1.5px solid var(--line);
  border-radius:7px; background:var(--surface-2); font-family:"IBM Plex Mono",monospace; font-size:24px}
.nt-ruutu.kohta{border-color:var(--core); background:var(--core-soft); color:var(--core); font-weight:500}
.nt-ruutu.ratkaiseva{border-color:var(--chal); background:var(--chal-soft); color:var(--chal); font-weight:500}
.nt-ruutu.nolla{color:var(--ink-3)}
.nt-rivi .nimi{font-size:12.5px; color:var(--ink-3); margin-left:12px; white-space:nowrap}
.nt-nuoli{font-size:17px; color:var(--chal); margin-left:6px}
.nt-selite{margin:14px 0 0; font-size:14.5px}
.nt-selite b{color:var(--core)}

/* vahvuusportaat */
.vp-tasot{display:grid; gap:9px; margin-bottom:18px}
.vp-taso{display:flex; gap:11px; align-items:flex-start; font-size:13.5px}
.vp-taso .vp-pallo{width:13px; height:13px; border-radius:4px; margin-top:5px; flex:0 0 auto}
.vp-taso[data-taso="sulkeet"] .vp-pallo{background:var(--core)}
.vp-taso[data-taso="kertojako"] .vp-pallo{background:var(--strong)}
.vp-taso[data-taso="yhteenvahennys"] .vp-pallo{background:var(--chal)}
.vp-taso strong{display:block; font-family:"Familjen Grotesk",sans-serif; font-weight:600; font-size:14.5px}
.vp-taso span{color:var(--ink-2)}
.vp-lauseke{display:flex; flex-wrap:wrap; gap:7px; align-items:flex-end; font-family:"IBM Plex Mono",monospace;
  font-size:25px; padding:10px 2px; min-height:64px}
.vp-lauseke .t{padding:2px 3px}
.vp-lauseke .op{position:relative; padding:2px 9px; border-radius:6px; font-weight:500}
.vp-lauseke .op[data-taso="sulkeet"]{background:var(--core-soft); color:var(--core)}
.vp-lauseke .op[data-taso="kertojako"]{background:var(--strong-soft); color:var(--strong)}
.vp-lauseke .op[data-taso="yhteenvahennys"]{background:var(--chal-soft); color:var(--chal)}
.vp-lauseke .op i{position:absolute; top:-9px; right:-6px; font-style:normal; font-family:"Familjen Grotesk",sans-serif;
  font-size:11px; font-weight:700; width:18px; height:18px; border-radius:50%; display:grid; place-items:center;
  background:currentColor}
.vp-lauseke .op i span{color:var(--surface)}
.vp-rivi{display:flex; align-items:center; gap:16px; margin-top:8px}
.vp-vastaus{font-family:"Familjen Grotesk",sans-serif; font-size:16px; font-weight:600; color:var(--strong)}

/* laskujärjestys-widget */
.lj-exp{display:flex; flex-wrap:wrap; gap:7px; align-items:center; font-family:"IBM Plex Mono",monospace;
  font-size:23px; padding:14px 4px; min-height:62px}
.lj-exp .tok{padding:2px 4px; color:var(--ink)}
.lj-exp button.op{font-family:"IBM Plex Mono",monospace; font-size:23px; padding:3px 12px; border-radius:7px;
  border:1.5px solid var(--line); background:var(--surface-2); color:var(--ink); line-height:1.2}
.lj-exp button.op:hover{border-color:var(--core); color:var(--core)}
.lj-exp button.op:focus-visible{outline:2px solid var(--core); outline-offset:2px}
.lj-exp .valmis{font-family:"Familjen Grotesk",sans-serif; font-size:23px; font-weight:700; color:var(--strong)}
.lj-fb{font-size:14.5px; min-height:1.5em; color:var(--ink-2)}
.lj-fb.no{color:var(--alert)}
.lj-fb.ok{color:var(--strong)}
.lj-row{display:flex; align-items:center; gap:14px; margin-top:10px}
.lj-step{font-family:"IBM Plex Mono",monospace; font-size:11.5px; letter-spacing:.1em;
  text-transform:uppercase; color:var(--ink-3)}

/* harjoitukset */
.progress{position:sticky; top:0; z-index:5; background:var(--surface); border:1px solid var(--line);
  border-radius:var(--r); padding:12px 18px; box-shadow:var(--shadow); display:flex; align-items:center;
  gap:14px; margin:34px 0 18px}
.progress .lbl{font-family:"IBM Plex Mono",monospace; font-size:11px; letter-spacing:.12em;
  text-transform:uppercase; color:var(--ink-3); white-space:nowrap}
.progress .meter{flex:1; height:7px; border-radius:4px; background:var(--surface-2); border:1px solid var(--line); overflow:hidden}
.progress .meter i{display:block; height:100%; background:var(--core); transition:width .25s ease}
.progress .cnt{font-family:"Familjen Grotesk",sans-serif; font-weight:700; font-variant-numeric:tabular-nums; white-space:nowrap}

.grp{margin-top:26px}
.grp-head{display:flex; align-items:baseline; gap:10px; border-bottom:1.5px solid var(--ink); padding-bottom:7px; margin-bottom:14px}
.grp-head h3{margin:0; font-size:17px; font-weight:600}
.grp-head span{font-size:12.5px; color:var(--ink-2)}

.ex{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:14px 16px; margin-bottom:10px}
.ex[data-tila="oikein"]{border-color:var(--strong); box-shadow:inset 3px 0 0 var(--strong)}
.ex[data-tila="vaarin"]{border-color:var(--alert); box-shadow:inset 3px 0 0 var(--alert)}
.ex .q{display:flex; gap:11px; align-items:baseline; flex-wrap:wrap}
.ex .num{font-family:"IBM Plex Mono",monospace; font-size:11.5px; color:var(--ink-3); min-width:2.4em}
.ex .txt{flex:1; min-width:190px; font-size:15.5px}
.ex .txt .aineisto{display:block; margin-bottom:9px; padding-left:12px;
  border-left:2px solid var(--line); color:var(--ink-2); line-height:1.6;
  /* Aineisto voi olla pieni taulukko, jonka rivit on erotettu rivinvaihdoilla.
     Ilman pre-lineä ne valuisivat yhdeksi kappaleeksi ja taulukko katoaisi. */
  white-space:pre-line}
.ex .txt .kysymysrivi{display:block; font-weight:600}
.ex .row{display:flex; gap:8px; align-items:center; margin-top:11px; flex-wrap:wrap}
.ex input[type=text]{font:inherit; font-family:"IBM Plex Mono",monospace; font-size:15px; width:8.5em;
  padding:7px 11px; border:1px solid var(--line); border-radius:7px; background:var(--surface-2);
  color:var(--ink); text-align:right}
.ex input:focus-visible{outline:2px solid var(--core); outline-offset:1px}
button{font:inherit; cursor:pointer}
.btn{font-size:13.5px; padding:7px 15px; border-radius:7px; border:1px solid var(--core);
  background:var(--core); color:#fff}
.btn.ghost{background:transparent; color:var(--ink-2); border-color:var(--line)}
.btn:focus-visible{outline:2px solid var(--core); outline-offset:2px}
.btn.mv-valinta{text-align:left}
/* kuuntelutehtävä: selaimen puhesynteesi lukee englanninkielisen tekstin */
.kuuntele{display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin:2px 0 10px}
.kuuntele .btn{display:inline-flex; gap:7px; align-items:center}
.kuuntele svg{width:16px; height:16px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round}
.kuuntele .varateksti{flex-basis:100%; font-size:14px; color:var(--ink-2); background:var(--surface-2);
  border-radius:7px; padding:8px 12px; margin:0}
.btn.mv-valinta:disabled{cursor:default; opacity:.65}
.btn.mv-oikein{background:var(--strong-soft); border-color:var(--strong); color:var(--strong); opacity:1}
.btn.mv-vaarin{background:var(--alert-soft); border-color:var(--alert); color:var(--alert); opacity:1}
.row.mv{gap:8px 10px}
.fb{margin-top:11px; font-size:14.5px; padding:10px 13px; border-radius:8px; line-height:1.5}
.fb.ok{background:var(--strong-soft); color:var(--strong)}
.fb.no{background:var(--alert-soft); color:var(--alert)}
.fb.hint{background:var(--chal-soft); color:var(--chal)}

.done{background:var(--strong-soft); border:1px solid var(--strong); color:var(--strong);
  border-radius:var(--r); padding:16px 20px; margin-top:20px; font-size:15.5px}
.done h3{margin:0 0 4px; font-size:17px; color:var(--strong)}

details.teacher{margin-top:34px; background:var(--surface); border:1px solid var(--line);
  border-left:3px solid var(--chal); border-radius:var(--r); padding:15px 20px; box-shadow:var(--shadow)}
details.teacher summary{cursor:pointer; font-family:"Familjen Grotesk",sans-serif; font-weight:600; font-size:15px}
details.teacher summary:focus-visible{outline:2px solid var(--core); outline-offset:3px}
details.teacher ul{margin:12px 0 0; padding-left:19px; color:var(--ink-2); font-size:14.5px}
details.teacher li{margin-bottom:8px}
details.teacher p{margin:12px 0 0; color:var(--ink-2); font-size:14.5px}

.back{display:inline-block; margin-top:30px; font-size:13.5px; color:var(--ink-2)}
.back a{color:var(--core)}

@media (prefers-reduced-motion: reduce){*{transition:none !important}}
@media (max-width:560px){
  .wrap{padding:16px 13px 70px}
  header.top h1{font-size:25px}
  .progress{flex-wrap:wrap}
}
</style>

<div class="wrap">

  <header class="top">
    <span class="badge"><svg viewBox="0 0 24 24" aria-hidden="true" id="ikoni"></svg></span>
    <div>
      <p class="eyebrow" id="eyebrow"></p>
      <h1 id="otsikko"></h1>

<script>
const D = {"tavoite_id":"MAT7-AJA-02","oppiaine":"MAT","vuosiluokka":7,"taso":"vahvistava","otsikko":"Tosi vai epätosi","kuvaus":"Osaan päätellä, onko matemaattinen väite tosi, ja perustella sen.","versio":"0.2","paivitetty":"2026-10-04","ops":{"T":["T4","T5","T10"],"S":["S1","S2"]},"ikoni":"ajattelu","eyebrow":"Matematiikka · 7. luokka · Ajattelun taidot","teksti":[{"tyyppi":"johdanto","sisalto":"Kaveri lähettää viestin: \"Kertolasku tekee luvusta aina isomman. Katso: 4 · 3 = 12, 6 · 5 = 30 ja 9 · 7 = 63.\" Kolme esimerkkiä, ja jokainen näyttää pitävän. Silti väite on väärä: 4 · 1 = 4 ei ole isompi kuin 4, ja 4 · 0 = 0 on pienempi. Somessa, mainoksissa ja väittelyissä kuulee jatkuvasti väitteitä, joita perustellaan muutamalla sopivalla esimerkillä. Matematiikassa on tarkka sääntö sille, milloin väite on todistettu ja milloin kumottu. Tässä taidossa opit päättelemään, onko väite tosi vai epätosi, ja kirjoittamaan perustelun, joka pitää paikkansa jokaisella luvulla, myös sellaisella, jota kukaan ei ole kokeillut."},{"tyyppi":"kappale","otsikko":"Väite ja totuusarvo","sisalto":"Väite on lause, joka on joko tosi tai epätosi. Esimerkiksi −3 < 0 on tosi väite ja |−6| = −6 on epätosi väite. Sitä, onko väite tosi vai epätosi, sanotaan väitteen totuusarvoksi. Kysymys \"Onko 7 pariton?\" ei ole väite, koska se ei väitä mitään. Lause x > 2 ei vielä ole tosi eikä epätosi, koska sen totuusarvo riippuu siitä, mikä luku x on: kun x = 5, lause on tosi, ja kun x = 2, se on epätosi. Merkit kannattaa lukea tarkasti. Merkki < tarkoittaa \"pienempi kuin\" ja ≤ \"pienempi tai yhtä suuri\". Siksi 5 ≤ 5 on tosi, mutta 5 < 5 on epätosi. Merkki ≠ tarkoittaa \"erisuuri kuin\", joten 4 ≠ −4 on tosi."},{"tyyppi":"kappale","otsikko":"Yleinen väite ja olemassaoloväite","sisalto":"Monet väitteet koskevat kokonaista lukujoukkoa. Yleinen väite sanoo, että jokin pätee jokaiselle joukon luvulle. Sen tunnistaa sanoista jokainen, kaikki ja aina: \"Jokainen luonnollinen luku on kokonaisluku.\" Myös jos-muotoinen väite on yleinen: \"Jos luku on jaollinen 10:llä, se on parillinen\" sanoo saman asian jokaisesta 10:llä jaollisesta luvusta. Samoin \"Mikään luonnollinen luku ei ole negatiivinen\" on yleinen väite, koska se sanoo jokaisesta luonnollisesta luvusta, ettei se ole negatiivinen. Olemassaoloväite sanoo, että joukossa on ainakin yksi luku, jolla on jokin ominaisuus. Sen tunnistaa sanoista on olemassa, jokin ja ainakin yksi: \"On olemassa kokonaisluku, joka on pienempi kuin −100.\" Olemassaoloväite ei kerro, montako tällaista lukua on, vaan ainoastaan sen, että niitä on vähintään yksi. Tässä taidossa luonnollisiin lukuihin kuuluu myös 0, kuten oppikirjassa ja MAOL-taulukoissa."},{"tyyppi":"taulukko","otsikko":"Miten väite todistetaan tai kumotaan","otsikkorivi":["Väite","Kun väite on tosi","Kun väite on epätosi"],"rivit":[["<b>Yleinen väite</b> (jokainen, kaikki, aina, jos, mikään … ei)","Yleinen perustelu, joka koskee jokaista joukon lukua","Yksi vastaesimerkki riittää"],["<b>Olemassaoloväite</b> (on olemassa, jokin, ainakin yksi)","Yksi esimerkki riittää","Yleinen perustelu sille, ettei yksikään joukon luku kelpaa"]]},{"tyyppi":"kappale","otsikko":"Vastaesimerkki","sisalto":"Vastaesimerkki on luku, joka täyttää väitteen ehdon mutta jolla väite ei päde. Tarkastellaan väitettä \"Jokainen kokonaisluku, joka on pienempi kuin 4, on positiivinen.\" Luku −2 on vastaesimerkki: se on kokonaisluku, se on pienempi kuin 4, mutta se ei ole positiivinen. Myös 0 on vastaesimerkki, koska nolla ei ole positiivinen eikä negatiivinen. Luku 7 ei kelpaa vastaesimerkiksi, koska se ei ole pienempi kuin 4, eikä väite siis koske sitä. Luku 2 ei kelpaa, koska väite pätee sillä. Yksi vastaesimerkki riittää kumoamaan yleisen väitteen. Yleinen väite lupaa, että asia pätee jokaisella luvulla, ja yksikin luku, jolla se ei päde, rikkoo lupauksen. Väite on silloin epätosi, vaikka se pätisi monella muulla luvulla. Jos väite koskee kahta lukua, esimerkiksi niiden summaa tai kahden murtoluvun vertailua, vastaesimerkki on lukupari, joka täyttää ehdon mutta rikkoo väitteen. Väitteen \"kahden luonnollisen luvun summa on suurempi kuin niiden tulo\" kumoaa pari 3 ja 4, koska 3 + 4 = 7 ja 3 · 4 = 12, eikä 7 ole suurempi kuin 12. Vastaesimerkistä tarkistetaan siis kaksi asiaa: täyttääkö luku tai lukupari väitteen ehdon, ja rikkooko se väitteen."},{"tyyppi":"kappale","otsikko":"Yleinen perustelu","sisalto":"Toden yleisen väitteen perustelemiseen esimerkit eivät riitä. Kokonaislukuja on loputtomasti, joten vaikka kokeilisit tuhat lukua, et tiedä, mitä tapahtuu tuhannen ja ensimmäisen kohdalla. Yleinen perustelu nojaa siihen, mitä käsitteet tarkoittavat, ja koskee siksi jokaista lukua kerralla. Esimerkki: \"Jokaisen luvun itseisarvo on suurempi tai yhtä suuri kuin 0.\" Perustelu: itseisarvo on luvun etäisyys nollasta lukusuoralla, eikä etäisyys voi olla negatiivinen. Perustelu ei riipu siitä, mikä luku on kyseessä, joten se pätee kaikille luvuille. Toinen esimerkki: \"Jokainen kokonaisluku on rationaaliluku.\" Perustelu: jokaisen kokonaisluvun voi kirjoittaa murtolukuna, jonka nimittäjä on 1, esimerkiksi −6 = −6/1, ja rationaaliluku on kahden kokonaisluvun osamäärä, jossa nimittäjä ei ole nolla. Lukusuora on hyvä perustelun apuväline, koska se näyttää kaikki luvut kerralla: negatiiviset vasemmalla, positiiviset oikealla ja nollan niiden välissä. Poikkeus: jos väite koskee vain muutamaa lukua, esimerkiksi kokonaislukuja −2, −1, 0, 1 ja 2, sen voi todistaa käymällä jokaisen luvun läpi. Silloin esimerkit kattavat koko joukon, ja tarkistus on yleinen perustelu."},{"tyyppi":"saanto","otsikko":"Näin päättelet, onko väite tosi","askeleet":["Selvitä, mitä lukuja väite koskee (luonnolliset luvut, kokonaisluvut vai rationaaliluvut) ja onko siinä lisäehto, kuten \"joka on pienempi kuin 4\".","Tunnista, onko väite yleinen väite vai olemassaoloväite.","Kokeile ensin hankalia lukuja: 0, 1, negatiivinen luku, ehdon rajalla oleva luku ja murtoluku, jos väite koskee niitä. Väärät väitteet kaatuvat usein juuri näihin.","Jos löydät luvun, joka täyttää ehdon mutta rikkoo yleisen väitteen, väite on epätosi. Kirjoita vastaesimerkki ja näytä, että se täyttää ehdon ja rikkoo väitteen.","Jos vastaesimerkkiä ei löydy, etsi syy, miksi väite pätee jokaisella luvulla: käsitteen merkitys, lukusuora tai pareiksi jakaminen. Kirjoita perustelu sanoin.","Kirjoita lopuksi johtopäätös: \"Väite on tosi, koska …\" tai \"Väite on epätosi. Vastaesimerkki: …\""]},{"tyyppi":"ansa","otsikko":"Ansa 1: esimerkit eivät todista yleistä väitettä","sisalto":"\"3 + 5 = 8 on parillinen, joten kahden parittoman luonnollisen luvun summa on aina parillinen.\" Väite on tosi, mutta perustelu ei ole kelvollinen. Yksi esimerkki, tai kymmenen, näyttää vain, että väite pätee juuri niillä luvuilla. Yleinen perustelu kertoo, miksi väite pätee jokaisella parittomalla luonnollisella luvulla. Ajattele luonnollista lukua kasana tikkuja, jotka jaetaan pareiksi. Parittomasta luvusta jää yksi tikku ilman paria. Kun kaksi paritonta kasaa yhdistetään, kummankin yksinäinen tikku saa parin toisesta kasasta, ja kaikki tikut ovat pareissa. Summa on siis parillinen, olivatpa parittomat luonnolliset luvut mitä tahansa. Kokeessa pelkät esimerkit toden yleisen väitteen perusteluna ovat väärä vastaus, vaikka totuusarvo olisi oikein."},{"tyyppi":"ansa","otsikko":"Ansa 2: vastaesimerkki, joka ei täytä ehtoa","sisalto":"Väite: \"Jokainen luonnollinen luku on suurempi tai yhtä suuri kuin vastalukunsa.\" Joku yrittää kumota sen luvulla −2, koska −2 ei ole suurempi kuin vastalukunsa 2. Luku −2 ei kuitenkaan ole luonnollinen luku, joten väite ei koske sitä lainkaan. Vastaesimerkin pitää kuulua siihen joukkoon, josta väite puhuu, ja täyttää väitteen ehdot. Tämä väite on itse asiassa tosi: luonnollinen luku on 0 tai positiivinen, joten se on lukusuoralla nollassa tai sen oikealla puolella, ja sen vastaluku on nollassa tai sen vasemmalla puolella. Tarkista vastaesimerkistä ensin, kuuluuko se väitteen joukkoon."},{"tyyppi":"ansa","otsikko":"Ansa 3: nolla ja rajat unohtuvat","sisalto":"Väite \"Luku on aina suurempi kuin vastalukunsa\" näyttää todelta, jos kokeilee vain lukuja 3, 8 ja 1/2. Väite on silti epätosi, kun se koskee kaikkia rationaalilukuja. Vastaesimerkkejä ovat 0, koska 0 ei ole suurempi kuin vastalukunsa 0, ja jokainen negatiivinen luku, esimerkiksi −5, jonka vastaluku 5 on suurempi. Samanlainen ansa piilee merkeissä: −4 ≤ −4 on tosi, koska merkki ≤ sallii yhtäsuuruuden, mutta −4 < −4 on epätosi. Kun väitteessä on raja, kokeile myös rajalla olevaa lukua. Väitteen \"Jokaisella luonnollisella luvulla n pätee 2 · n > n + 3\" kumoaa esimerkiksi luku 3, koska 2 · 3 = 6 ja 3 + 3 = 6, eikä 6 ole suurempi kuin 6."}],"harjoitusryhmat":[{"id":"vaite","nimi":"Väitteet ja totuusarvot","info":"Väite on joko tosi tai epätosi. Yleisen väitteen kumoaa yksi luku, joka täyttää väitteen ehdon mutta rikkoo väitteen. Lue merkit tarkasti: ≤ ja ≥ sallivat yhtäsuuruuden, < ja > eivät."},{"id":"kumoa","nimi":"Vastaesimerkki","info":"Vastaesimerkki täyttää väitteen ehdon mutta rikkoo väitteen. Kokeile nollaa, negatiivisia lukuja ja rajalla olevaa lukua. Luonnollisiin lukuihin kuuluu myös 0."},{"id":"perustele","nimi":"Yleinen perustelu ja olemassaolo","info":"Toden yleisen väitteen perustelu koskee jokaista lukua. Olemassaoloväitteen todistaa yksi esimerkki."}],"harjoitukset":[{"id":"H01","ryhma":"vaite","kysymys":"1. Jokainen kokonaisluku, joka on suurempi kuin −5, on suurempi kuin −4.\n2. On olemassa kokonaisluku, joka on suurempi kuin 5 ja pienempi kuin 6.\n3. Jokin murtoluku on lukujen 1/4 ja 1/3 välissä.\n4. Mikään kokonaisluku ei ole oma vastalukunsa.\n5. Jokaisen negatiivisen kokonaisluvun vastaluku on luonnollinen luku.\n\nMontako väitteistä on tosia?","vastaus":2,"vinkki":"Tunnista ensin, onko väite yleinen vai olemassaoloväite. Etsi yleiselle väitteelle vastaesimerkkiä nollasta ja rajalla olevasta luvusta, ja olemassaoloväitteelle yhtä sopivaa esimerkkiä.","selitys":"1 on epätosi: −4 on suurempi kuin −5, mutta −4 ei ole suurempi kuin −4. 2 on epätosi: lukujen 5 ja 6 välissä ei ole kokonaislukua. 3 on tosi: esimerkiksi 3/10 = 0,3 on lukujen 1/4 = 0,25 ja 1/3 = 0,333... välissä, ja yksi esimerkki todistaa olemassaoloväitteen. 4 on epätosi, koska 0 on oma vastalukunsa. 5 on tosi: negatiivisen kokonaisluvun vastaluku on positiivinen kokonaisluku, ja ne ovat luonnollisia lukuja. Tosia on 2."},{"id":"H02","ryhma":"vaite","kysymys":"1. Jokaisen luonnollisen luvun itseisarvo on positiivinen.\n2. Jokainen kokonaisluku, joka on suurempi kuin −3, on suurempi kuin vastalukunsa.\n3. Jokainen positiivinen kokonaisluku on suurempi tai yhtä suuri kuin 1.\n4. Jokaisella luonnollisella luvulla n pätee n + n > n.\n5. Jokainen kokonaisluku on pienempi kuin 5.\n\nMontako väitteistä luku 0 kumoaa? (Tässä 0 on luonnollinen luku.)","vastaus":3,"vinkki":"Luku 0 kumoaa väitteen vain, jos se täyttää väitteen ehdon ja väite ei päde sillä. Tarkista molemmat jokaisesta väitteestä.","selitys":"Väitteen 1 luku 0 kumoaa, koska 0 on luonnollinen luku ja |0| = 0 ei ole positiivinen. Väitteen 2 kumoaa, koska 0 on suurempi kuin −3, mutta 0 ei ole suurempi kuin vastalukunsa 0. Väitteen 4 kumoaa, koska 0 + 0 = 0 ei ole suurempi kuin 0. Väitettä 3 luku 0 ei kumoa, koska 0 ei ole positiivinen, eikä väite koske sitä. Väite 5 on epätosi (vastaesimerkki 5), mutta 0 on pienempi kuin 5, joten 0 ei kumoa sitä. Vastaus on 3."},{"id":"H03","ryhma":"vaite","kysymys":"Kun kirjaimen a paikalle kirjoitetaan kokonaisluku, lauseesta \"Jokainen kokonaisluku x, jolle x > a, on luonnollinen luku\" tulee väite. Mikä on pienin kokonaisluku a, jolla väite on tosi? (Tässä 0 on luonnollinen luku.)","vastaus":-1,"vinkki":"Kokeile a = −2 ja a = −1. Mitkä kokonaisluvut ovat kummallakin kerralla suurempia kuin a?","selitys":"Kun a = −1, ehdon x > −1 täyttävät kokonaisluvut 0, 1, 2 ja niin edelleen. Ne ovat kaikki luonnollisia lukuja, joten väite on tosi. Kun a = −2, ehdon täyttää myös −1, joka ei ole luonnollinen luku, joten −1 kumoaa väitteen. Sama vastaesimerkki kumoaa väitteen kaikilla pienemmillä a:n arvoilla. Pienin a on siis −1. Myös a = 0 tekee väitteestä toden, mutta 0 ei ole pienin."},{"id":"H04","ryhma":"vaite","tyyppi":"monivalinta","vaihtoehdot":["Väite on tosi. Luku 0 todistaa sen, koska nollan vastaluku on 0.","Väite on epätosi, koska positiivisen luvun vastaluku on negatiivinen ja negatiivisen luvun vastaluku positiivinen.","Väitteen totuusarvoa ei voi päätellä, koska kokonaislukuja on loputtomasti."],"kysymys":"Väite: \"On olemassa kokonaisluku, joka on yhtä suuri kuin vastalukunsa.\" Mikä arvio pitää paikkansa?","vastaus":0,"vinkki":"Olemassaoloväitteen todistaa yksi esimerkki. Oletko kokeillut nollaa?","selitys":"Väite on olemassaoloväite, joten yksi sopiva luku riittää. Nollan vastaluku on 0, joten väite on tosi. Toisen vaihtoehdon perustelu pitää paikkansa positiivisille ja negatiivisille luvuille, mutta se unohtaa nollan."},{"id":"H05","ryhma":"vaite","kysymys":"1. Jokainen luonnollinen luku on kokonaisluku.\n2. On olemassa luonnollinen luku, joka on pienempi kuin 1.\n3. Kahden parittoman luonnollisen luvun summa on aina parillinen.\n4. Jokin murtoluku on suurempi kuin 5.\n5. Mikään luonnollinen luku ei ole negatiivinen.\n\nMontako väitteistä on olemassaoloväitteitä?","vastaus":2,"vinkki":"Etsi sanoja on olemassa, jokin ja ainakin yksi. Muoto \"mikään … ei\" sanoo jotain jokaisesta luvusta.","selitys":"Olemassaoloväitteitä ovat 2 (on olemassa) ja 4 (jokin). Väitteet 1 ja 3 ovat yleisiä (jokainen, aina), ja myös 5 on yleinen, koska se sanoo jokaisesta luonnollisesta luvusta, ettei se ole negatiivinen. Jos vastasit 3, tarkista väite 5: \"mikään … ei\" on yleinen väite."},{"id":"H06","ryhma":"vaite","kysymys":"Lause x/12 > 3/4 on tosi joillakin luonnollisilla luvuilla x. Mikä on pienin luonnollinen luku x, jolla lause on tosi?","vastaus":10,"vinkki":"Kirjoita 3/4 murtolukuna, jonka nimittäjä on 12.","selitys":"3/4 = 9/12. Murtoluku x/12 on suurempi kuin 9/12, kun x on suurempi kuin 9. Pienin tällainen luonnollinen luku on 10. Vastaus 9 ei kelpaa, koska 9/12 on yhtä suuri kuin 3/4 eikä suurempi."},{"id":"H07","ryhma":"vaite","kysymys":"Lause 3/x > 1/4 on tosi joillakin positiivisilla kokonaisluvuilla x. Mikä on suurin positiivinen kokonaisluku x, jolla lause on tosi?","vastaus":11,"vinkki":"Kirjoita 1/4 murtolukuna, jonka osoittaja on 3. Kun osoittajat ovat samat, kumpi murtoluku on suurempi?","selitys":"1/4 = 3/12. Kun positiivisten murtolukujen osoittaja on sama, murtoluku on sitä suurempi, mitä pienempi nimittäjä on. Siksi 3/x > 3/12, kun x on pienempi kuin 12. Suurin tällainen kokonaisluku on 11. Luku 12 ei kelpaa, koska 3/12 on yhtä suuri kuin 1/4."},{"id":"H08","ryhma":"kumoa","kysymys":"Väite: jokaiselle kokonaisluvulle x, jolle |x| ≤ 5, pätee x > −5. Väitteen kumoaa täsmälleen yksi kokonaisluku. Mikä?","vastaus":-5,"vinkki":"Luettele ensin luvut, joille |x| ≤ 5. Mikä niistä ei ole suurempi kuin −5?","selitys":"Ehdon |x| ≤ 5 täyttävät kokonaisluvut −5, −4, …, 4, 5. Niistä vain −5 ei ole suurempi kuin −5, koska −5 > −5 on epätosi. Vastaesimerkki on −5. Luku −6 ei kelpaa, koska |−6| = 6, joten se ei täytä ehtoa."},{"id":"H09","ryhma":"kumoa","kysymys":"Väite: jokaiselle luonnolliselle luvulle n pätee 3 · n > n + 6. Montako luonnollista lukua kumoaa väitteen? (Tässä 0 on luonnollinen luku.)","vastaus":4,"vinkki":"Kokeile luvut 0, 1, 2, 3 ja 4 yksi kerrallaan. Muista, että yhtä suuri ei ole suurempi.","selitys":"n = 0: 0 > 6 on epätosi. n = 1: 3 > 7 on epätosi. n = 2: 6 > 8 on epätosi. n = 3: 9 > 9 on epätosi. n = 4: 12 > 10 on tosi, ja kun n kasvaa yhdellä, vasen puoli kasvaa kolmella ja oikea yhdellä, joten väite pysyy totena. Vastaesimerkkejä ovat 0, 1, 2 ja 3, eli niitä on 4."},{"id":"H10","ryhma":"kumoa","kysymys":"Väite: jos kahden luonnollisen luvun summa on jaollinen 5:llä, molemmat luvut ovat jaollisia 5:llä. Montako lukuparia luvuista 1–6 kumoaa väitteen? Parin luvut ovat eri lukuja, eikä järjestystä lasketa (1 ja 4 on sama pari kuin 4 ja 1).","vastaus":3,"vinkki":"Vastaesimerkki on lukupari. Etsi ensin parit, joiden summa on jaollinen 5:llä, eli summa on 5 tai 10. Tarkista sitten, ovatko molemmat luvut jaollisia 5:llä.","selitys":"Lukujen 1–6 parien summa on vähintään 3 ja enintään 11, joten ehdon täyttävien parien summa on 5 tai 10. Summa 5: parit 1 ja 4 sekä 2 ja 3. Summa 10: pari 4 ja 6. Missään näistä pareista kumpikaan luku ei ole jaollinen 5:llä, joten jokainen kumoaa väitteen. Esimerkiksi pari 2 ja 5 ei kelpaa, koska summa 7 ei ole jaollinen 5:llä, eikä väite koske sitä. Vastaesimerkkejä on 3."},{"id":"H11","ryhma":"kumoa","tyyppi":"monivalinta","vaihtoehdot":["Aadan vastaesimerkki ei kelpaa, koska −4 ei ole luonnollinen luku. Väite on tosi.","Aada on oikeassa, koska yksi vastaesimerkki riittää kumoamaan yleisen väitteen.","Väite on epätosi, mutta parempi vastaesimerkki on 0, koska |0| = 0."],"kysymys":"Väite: \"Jokaisen luonnollisen luvun itseisarvo on luku itse.\" Aada kumoaa väitteen luvulla −4, koska |−4| = 4 eikä −4. Mikä arvio pitää paikkansa?","vastaus":0,"vinkki":"Kuuluuko −4 siihen joukkoon, josta väite puhuu?","selitys":"Vastaesimerkin pitää täyttää väitteen ehto, eli tässä olla luonnollinen luku. Luku −4 ei ole. Väite on tosi: luonnollinen luku on 0 tai positiivinen, ja sen etäisyys nollasta on luku itse. Luku 0 ei ole vastaesimerkki, koska |0| = 0 eli väite pätee sillä."},{"id":"H12","ryhma":"kumoa","kysymys":"Väite: jokaiselle kokonaisluvulle x, jolle x < 3, pätee |x| < 3. Mikä on suurin kokonaisluku, joka kumoaa väitteen?","vastaus":-3,"vinkki":"Vastaesimerkin pitää olla pienempi kuin 3, mutta sen itseisarvo ei saa olla pienempi kuin 3. Etsi negatiivisista luvuista.","selitys":"Luvut 2, 1, 0, −1 ja −2 täyttävät väitteen, koska niiden itseisarvo on pienempi kuin 3. Luku −3 on pienempi kuin 3, mutta |−3| = 3, eikä 3 ole pienempi kuin 3. Siksi −3 kumoaa väitteen, ja samoin kaikki sitä pienemmät luvut. Suurin vastaesimerkki on −3. Luku 3 ei kelpaa, koska se ei ole pienempi kuin 3."},{"id":"H13","ryhma":"kumoa","kysymys":"Väite: jokainen kokonaisluku on suurempi kuin vastalukunsa. Montako kokonaislukua väliltä −6…6 kumoaa väitteen? (Väliin kuuluvat myös −6 ja 6.)","vastaus":7,"vinkki":"Kokeile positiivista lukua, nollaa ja negatiivista lukua erikseen.","selitys":"Positiivinen luku on suurempi kuin vastalukunsa, koska vastaluku on negatiivinen. Nolla ei ole suurempi kuin vastalukunsa 0. Negatiivinen luku on pienempi kuin vastalukunsa. Vastaesimerkkejä ovat siis −6, −5, −4, −3, −2, −1 ja 0, eli niitä on 7. Vastaus 6 kertoo, että nolla unohtui."},{"id":"H14","ryhma":"kumoa","kysymys":"Väite: jokaiselle luonnolliselle luvulle n pätee n + 8 > 2 · n. Mikä on pienin luonnollinen luku, joka kumoaa väitteen?","vastaus":8,"vinkki":"Etsi luku, jolla molemmat puolet ovat yhtä suuret.","selitys":"Kun n = 7, vasen puoli on 15 ja oikea 14, joten väite pätee, ja pienemmillä luvuilla ero on vielä suurempi. Kun n = 8, molemmat puolet ovat 16, eikä 16 ole suurempi kuin 16. Pienin vastaesimerkki on 8. Vastaus 9 syntyy, jos yhtäsuuruutta ei huomaa."},{"id":"H15","ryhma":"perustele","tyyppi":"monivalinta","vaihtoehdot":["Luvut 10, 20, 30 ja 40 ovat kaikki parillisia, joten väite on tosi.","10:llä jaollinen luku on jokin määrä kymppejä, ja jokainen kymppi on viisi kakkosta. Siksi luku on jokin määrä kakkosia eli jaollinen 2:lla.","Väitettä ei voi todistaa, koska 10:llä jaollisia lukuja on loputtomasti."],"kysymys":"Väite: \"Jokainen 10:llä jaollinen luonnollinen luku on jaollinen 2:lla.\" Mikä perustelu todistaa väitteen?","vastaus":1,"vinkki":"Perustelun pitää koskea jokaista 10:llä jaollista lukua, myös sellaista, jota kukaan ei ole kokeillut.","selitys":"Toinen vaihtoehto kertoo, miksi väite pätee jokaisella 10:llä jaollisella luvulla, joten se on yleinen perustelu. Ensimmäinen vaihtoehto näyttää vain neljä esimerkkiä. Kolmas on väärin, koska yleinen perustelu kattaa loputtoman monta lukua kerralla."},{"id":"H16","ryhma":"perustele","kysymys":"Väite: Jokainen kokonaisluku on rationaaliluku.\na) −3 = −3/1, 0 = 0/1 ja 8 = 8/1, joten väite on tosi.\nb) Mikä tahansa kokonaisluku jaettuna luvulla 1 on luku itse. Siksi jokaisen kokonaisluvun voi kirjoittaa murtolukuna, jonka nimittäjä on 1.\nc) Tarkistin kaikki kokonaisluvut −100:sta 100:aan, ja jokainen onnistui.\nd) Rationaaliluku on kahden kokonaisluvun osamäärä (nimittäjä ei nolla), ja jokainen kokonaisluku on itsensä ja luvun 1 osamäärä.\n\nMontako perusteluista todistaa väitteen?","vastaus":2,"vinkki":"Perustelu todistaa yleisen väitteen vain, jos se koskee jokaista kokonaislukua.","selitys":"Perustelut b ja d koskevat jokaista kokonaislukua, joten ne todistavat väitteen. Perustelut a ja c ovat esimerkkejä: c:ssä niitä on paljon, mutta luku 101 ja kaikki sitä suuremmat jäävät tarkistamatta. Jos vastasit 3, tarkista perustelu c: monen esimerkin kokeilu ei ole todiste, kun lukuja on loputtomasti."},{"id":"H17","ryhma":"perustele","kysymys":"Väite: on olemassa luku väliltä 1–50, joka on jaollinen sekä 2:lla että 5:llä mutta ei 10:llä. Montako tällaista lukua väliltä löytyy?","vastaus":0,"vinkki":"Luettele välin luvut, jotka ovat jaollisia sekä 2:lla että 5:llä. Ovatko ne jaollisia 10:llä?","selitys":"5:llä jaolliset luvut päättyvät numeroon 0 tai 5. Niistä parillisia ovat ne, jotka päättyvät numeroon 0, ja ne ovat jaollisia 10:llä. Siksi tällaisia lukuja ei ole yhtään, ja olemassaoloväite on epätosi. Epätosi olemassaoloväite perustellaan yleisellä päättelyllä, ei yksittäisellä esimerkillä."},{"id":"H18","ryhma":"perustele","kysymys":"1. Jokainen kokonaisluku on rationaaliluku.\n2. Jokainen rationaaliluku on kokonaisluku.\n3. Jokaisen luvun itseisarvo on suurempi tai yhtä suuri kuin 0.\n4. Jokainen negatiivinen luku on pienempi kuin vastalukunsa.\n5. Jokainen pariton luku on jaollinen 5:llä.\n\nMontako väitteistä on tosia?","vastaus":3,"vinkki":"Etsi jokaiselle väitteelle ensin vastaesimerkkiä. Jos sitä ei löydy, mieti, miksi väite pätee.","selitys":"Väitteet 1, 3 ja 4 ovat tosia. Väitteen 2 kumoaa esimerkiksi 1/2, joka on rationaaliluku mutta ei kokonaisluku. Väitteen 5 kumoaa esimerkiksi 3, joka on pariton mutta ei jaollinen 5:llä. Väite 4 on tosi, koska negatiivinen luku on nollan vasemmalla puolella ja sen vastaluku oikealla. Tosia on 3."},{"id":"H19","ryhma":"perustele","kysymys":"Kun kirjaimen a paikalle kirjoitetaan kokonaisluku, lauseesta \"Jokaisen kokonaisluvun x, jolle x ≥ a, itseisarvo on suurempi kuin 3\" tulee väite. Mikä on pienin kokonaisluku a, jolla väite on tosi?","vastaus":4,"vinkki":"Väite koskee lukua a ja kaikkia sitä suurempia kokonaislukuja. Etsi suurin kokonaisluku, jonka itseisarvo ei ole suurempi kuin 3.","selitys":"Kokonaisluvut, joiden itseisarvo ei ole suurempi kuin 3, ovat −3, −2, −1, 0, 1, 2 ja 3. Jos a on 3 tai pienempi, ehdon x ≥ a täyttää myös luku 3, ja |3| = 3 kumoaa sen. Kun a = 4, väite koskee lukuja 4, 5, 6 ja niin edelleen, ja niiden itseisarvo on vähintään 4. Pienin a on siis 4."},{"id":"H20","ryhma":"perustele","kysymys":"Väite: on olemassa luonnollinen luku, joka on pienempi kuin jokainen muu luonnollinen luku. Mikä luku todistaa väitteen? (Tässä 0 on luonnollinen luku.)","vastaus":0,"vinkki":"Mikä luonnollisista luvuista on lukusuoralla vasemmanpuoleisin?","selitys":"Luonnolliset luvut ovat 0, 1, 2, 3 ja niin edelleen. Luku 0 on pienempi kuin jokainen muu luonnollinen luku, joten se todistaa olemassaoloväitteen. Yksi esimerkki riittää."}],"valmis_teksti":"Osaat päätellä, onko väite tosi vai epätosi. Kumoat epätoden yleisen väitteen yhdellä vastaesimerkillä, joka täyttää väitteen ehdon, ja perustelet toden väitteen niin, että perustelu koskee jokaista lukua eikä vain kokeiltuja esimerkkejä. Tämä taito on nyt näytetty."};

const svg=document.getElementById("nlsvg"), rng=document.getElementById("nlrange"), out=document.getElementById("nlout");
const X0=34, X1=606, Y=62;
function piirraNL(v){
  const ala=Math.floor(v/10)*10, yla=ala+10, puoli=ala+5;
  const pyor = (v%10)>=5 ? yla : ala;
  const x = n => X0 + (n/100)*(X1-X0);
  let s=`<line class="rail" x1="${X0}" y1="${Y}" x2="${X1}" y2="${Y}"/>`;
  for(let n=0;n<=100;n+=10){
    const near = (n===ala||n===yla);
    s+=`<line class="tick" x1="${x(n)}" y1="${Y-7}" x2="${x(n)}" y2="${Y+7}"/>`;
    s+=`<text class="stop${near?" near":""}" x="${x(n)}" y="${Y+24}" text-anchor="middle">${n}</text>`;
  }
  s+=`<line class="halfway" x1="${x(puoli)}" y1="${Y-16}" x2="${x(puoli)}" y2="${Y+12}"/>`;
  s+=`<text class="stop" x="${x(puoli)}" y="${Y-22}" text-anchor="middle">puoliväli ${puoli}</text>`;
  s+=`<circle class="dot" cx="${x(v)}" cy="${Y}" r="6"/>`;
  s+=`<text class="val" x="${x(v)}" y="${Y-32}" text-anchor="middle">${v}</text>`;
  s+=`<path d="M ${x(v)} ${Y+38} L ${x(pyor)} ${Y+38}" stroke="var(--core)" stroke-width="2" fill="none"/>`;
  s+=`<path d="M ${x(pyor)} ${Y+38} l ${x(pyor)>x(v)?-7:7} -4 l 0 8 z" fill="var(--core)"/>`;
  svg.innerHTML=s;
  out.textContent = `${v} pyöristyy → ${pyor}`;
}

/* ---------- laskujärjestys-widget ---------- */
const ljExp=document.getElementById("ljExp");
if(ljExp && D.kokeilu){
  let ljI=0, ljTokens=[], ljStep=0;
  const laske=(a,op,b)=>{a=+a;b=+b;return op==="×"?a*b:op==="÷"?a/b:op==="+"?a+b:a-b;};
  function ljAlku(){
    const l=D.kokeilu[ljI];
    ljTokens=l.lauseke.replace(/\(/g,"( ").replace(/\)/g," )").split(/\s+/).filter(Boolean);
    ljStep=0; ljPiirra(); ljViesti("","");
  }
  function ljViesti(t,lk){const f=document.getElementById("ljFb"); f.textContent=t; f.className="lj-fb "+(lk||"");}
  function ljPiirra(){
    const l=D.kokeilu[ljI];
    document.getElementById("ljStep").textContent =
      ljStep>=l.askeleet.length ? "valmis" : `askel ${ljStep+1} / ${l.askeleet.length}`;
    if(ljStep>=l.askeleet.length){
      ljExp.innerHTML=`<span class="valmis">${l.lauseke} = ${l.vastaus}</span>`;
      return;
    }
    ljExp.innerHTML=ljTokens.map((t,i)=>
      "×÷+−".includes(t) ? `<button type="button" class="op" data-i="${i}">${t}</button>`
                         : `<span class="tok">${t}</span>`).join("");
    ljExp.querySelectorAll("button.op").forEach(b=>b.addEventListener("click",()=>ljKlikkaa(+b.dataset.i)));
  }
  function ljKlikkaa(i){
    const l=D.kokeilu[ljI], odotettu=l.askeleet[ljStep];
    const ehdotus=[ljTokens[i-1],ljTokens[i],ljTokens[i+1]].join(" ");
    if(ehdotus!==odotettu){
      ljViesti(ljStep===0
        ? "Ei vielä. Sulkeet ovat vahvimmat, sitten kerto ja jako. Yhtä vahvat vasemmalta oikealle."
        : "Ei vielä. Kumpi jäljellä olevista on vahvempi?", "no");
      return;
    }
    const arvo=laske(ljTokens[i-1],ljTokens[i],ljTokens[i+1]);
    let alku=i-1, loppu=i+1;
    if(ljTokens[i-2]==="(" && ljTokens[i+2]===")"){ alku=i-2; loppu=i+2; }
    ljTokens.splice(alku, loppu-alku+1, String(arvo));
    ljStep++;
    ljViesti(ljStep>=l.askeleet.length ? "Valmis. Vastaus on "+l.vastaus+"." : "Oikein. Jatka seuraavaan.", "ok");
    ljPiirra();
  }
  document.getElementById("ljSeuraava").addEventListener("click",()=>{
    ljI=(ljI+1)%D.kokeilu.length; ljAlku();
  });
  ljAlku();
}

/* Suomalainen lukumuoto: välilyönti on tuhaterotin, pilkku desimaalierotin.
   Piste voi olla kumpi tahansa. Se tulkitaan tuhaterottimeksi VAIN silloin, kun
   koko luku on aitoa tuhaterotinmuotoa: alkuosa 1–3 numeroa ilman etunollaa ja
   jokainen jatko-osa täsmälleen 3 numeroa (1.500, 12.345.678). Kaikissa muissa
   tapauksissa piste on desimaalipiste — myös 0.125, joka vanhalla säännöllä
   ("3 numeroa pisteen jäljessä = tuhaterotin") luettiin virheellisesti luvuksi 125. */
const TUHATEROTIN = /^[1-9]\d{0,2}(\.\d{3})+$/;
function lueLuku(teksti){
  // Murtoluku (3/4, -3/4) ja sekaluku (1 2/3, -1 2/3) hyväksytään sellaisinaan.
  const raaka = String(teksti).replace(/\u00a0/g, " ").trim();
  let m = raaka.match(/^(-?)(\d+)\s+(\d+)\s*\/\s*(\d+)$/);
  if(m){ const nim = Number(m[4]); if(nim === 0) return null;
    const v = Number(m[2]) + Number(m[3]) / nim; return m[1] ? -v : v; }
  m = raaka.match(/^(-?)\s*(\d+)\s*\/\s*(\d+)$/);
  if(m){ const nim = Number(m[3]); if(nim === 0) return null;
    const v = Number(m[2]) / nim; return m[1] ? -v : v; }
  let s = String(teksti).replace(/[\s\u00a0]/g, "");
  if(s === "") return null;
  if(s.indexOf(",") >= 0){
    s = s.replace(/\./g, "").replace(",", ".");
  } else if(TUHATEROTIN.test(s)){
    s = s.replace(/\./g, "");
  }
  const n = Number(s);
  return Number.isFinite(n) ? n : null;
}

function tarkista(id){
  const h=D.harjoitukset.find(x=>x.id===id);
  const kentta=document.getElementById("in-"+id);
  const fb=document.getElementById("fb-"+id);
  if(kentta.value.trim()===""){ fb.className="fb hint"; fb.textContent="Kirjoita vastaus ensin."; return; }
  const luku=lueLuku(kentta.value);
  if(luku===null){ fb.className="fb no"; fb.textContent="Vastauksen pitää olla luku tai murtoluku (esimerkiksi 3/4)."; return; }
  const oikein = Math.abs(luku - h.vastaus) < 1e-9;
  merkitseTulos(id, oikein, oikein ? "Oikein. "+h.selitys : `Ei vielä. ${h.vinkki} Kokeile uudelleen.`);
}

function tarkistaMonivalinta(id, valittuIndeksi, painike){
  const h=D.harjoitukset.find(x=>x.id===id);
  const rivi=painike.closest(".row");
  rivi.querySelectorAll(".mv-valinta").forEach(b=>b.disabled=true);
  const oikein = valittuIndeksi===h.vastaus;
  painike.classList.add(oikein?"mv-oikein":"mv-vaarin");
  if(!oikein){
    const oikeaBtn=rivi.querySelector(`[data-i="${h.vastaus}"]`);
    if(oikeaBtn) oikeaBtn.classList.add("mv-oikein");
  }
  merkitseTulos(id, oikein, oikein ? "Oikein. "+h.selitys : `Ei ihan. Oikea vastaus on korostettu. ${h.selitys||""}`);
}

/* Kuuntelu: selain lukee tekstin ääneen omalla puhesynteesillään (englanniksi, jos laitteessa on
   englanninkielinen ääni). Ei äänitiedostoja eikä verkkoyhteyttä. Jos laite ei osaa puhua,
   teksti näytetään luettavaksi — silloin tehtävä muuttuu luetun ymmärtämiseksi, mutta ei katkea. */
function puhu(id, nopeus){
  const h=D.harjoitukset.find(x=>x.id===id); if(!h || !h.kuuntele) return;
  const vara=document.getElementById("vara-"+id);
  const naytaTeksti=syy=>{ vara.hidden=false; vara.textContent=syy+" Teksti: "+h.kuuntele; };
  if(!("speechSynthesis" in window)){ naytaTeksti("Tämä laite ei osaa lukea ääneen."); return; }
  const s=window.speechSynthesis; s.cancel();
  const u=new SpeechSynthesisUtterance(h.kuuntele);
  u.lang=h.kieli||"en-GB"; u.rate=nopeus;
  const aanet=s.getVoices(), kieli=u.lang.slice(0,2);
  const aani=aanet.find(a=>a.lang===u.lang) || aanet.find(a=>a.lang && a.lang.startsWith(kieli));
  if(aani) u.voice=aani;
  else if(aanet.length) { naytaTeksti("Laitteessa ei ole englanninkielistä ääntä."); return; }
  u.onerror=()=>naytaTeksti("Ääneen lukeminen ei onnistunut.");
  s.speak(u);
}
