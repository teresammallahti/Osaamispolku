<title>Pala palalta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">

<style>
:root{
  --paper:#EFF2F5; --surface:#FFFFFF; --surface-2:#F7F9FB;
  --grid:#DCE3EA; --line:#C9D3DC;
  --ink:#15222C; --ink-2:#4E626F; --ink-3:#7E8F9B;
  --core:#1B5A9E; --core-soft:#E4EDF6;
  --strong:#1F6E5C; --strong-soft:#E1F0EB;
  --chal:#9A6A16; --chal-soft:#F6EDDC;
  --alert:#A33A2B; --alert-soft:#F8E7E3;
  --shadow:0 1px 2px rgba(21,34,44,.06), 0 8px 24px -12px rgba(21,34,44,.18);
  --r:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0F161B; --surface:#18222A; --surface-2:#1D2830;
    --grid:#22303A; --line:#2E3E4A;
    --ink:#E8EFF4; --ink-2:#A3B4C0; --ink-3:#7A8B97;
    --core:#7FB2E4; --core-soft:#16303F;
    --strong:#77CDB4; --strong-soft:#123028;
    --chal:#E0B267; --chal-soft:#33270F;
    --alert:#E8907F; --alert-soft:#3A1E19;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -14px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --paper:#0F161B; --surface:#18222A; --surface-2:#1D2830;
  --grid:#22303A; --line:#2E3E4A;
  --ink:#E8EFF4; --ink-2:#A3B4C0; --ink-3:#7A8B97;
  --core:#7FB2E4; --core-soft:#16303F;
  --strong:#77CDB4; --strong-soft:#123028;
  --chal:#E0B267; --chal-soft:#33270F;
  --alert:#E8907F; --alert-soft:#3A1E19;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -14px rgba(0,0,0,.7);
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:16px; line-height:1.62;
  background-image:
    linear-gradient(to right, var(--grid) 1px, transparent 1px),
    linear-gradient(to bottom, var(--grid) 1px, transparent 1px);
  background-size:26px 26px;
}
.wrap{max-width:760px; margin:0 auto; padding:28px 20px 90px}
h1,h2,h3,h4{font-family:"Familjen Grotesk","IBM Plex Sans",system-ui,sans-serif; text-wrap:balance}

/* header */
header.top{background:var(--surface); border:1px solid var(--line); border-radius:var(--r);
  box-shadow:var(--shadow); padding:22px 24px; display:flex; gap:18px; align-items:flex-start}
.badge{flex:0 0 auto; width:54px; height:54px; border-radius:9px; display:grid; place-items:center;
  background:var(--core-soft); border:1px solid var(--core); color:var(--core)}
.badge svg{width:28px; height:28px; fill:none; stroke:currentColor; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round}
.eyebrow{font-family:"IBM Plex Mono",monospace; font-size:11px; letter-spacing:.14em;
  text-transform:uppercase; color:var(--ink-3); margin:0 0 5px}
header.top h1{margin:0; font-size:30px; font-weight:700; letter-spacing:-.015em}
header.top p{margin:5px 0 0; color:var(--ink-2); font-size:15px}
.tags{display:flex; flex-wrap:wrap; gap:5px; margin-top:11px}
.tag{font-family:"IBM Plex Mono",monospace; font-size:10.5px; letter-spacing:.05em; padding:2px 7px;
  border-radius:4px; background:var(--surface-2); border:1px solid var(--line); color:var(--ink-3)}
.tag.core{background:var(--core-soft); border-color:var(--core); color:var(--core)}

/* teksti */
article{margin-top:26px}
article h2{font-size:21px; font-weight:600; margin:32px 0 10px; letter-spacing:-.01em}
article p{margin:0 0 14px; max-width:64ch}
.lead{font-size:17.5px; color:var(--ink); border-left:3px solid var(--core); padding-left:16px; margin:0 0 8px}

.box{background:var(--surface); border:1px solid var(--line); border-radius:var(--r);
  padding:18px 22px; box-shadow:var(--shadow); margin:22px 0}
.box h3{margin:0 0 12px; font-size:16.5px; font-weight:600}
.box.warn{border-left:3px solid var(--alert)}
.box.note{border-left:3px solid var(--chal)}

ol.steps{margin:0; padding-left:0; list-style:none; counter-reset:s; display:grid; gap:12px}
ol.steps li{counter-increment:s; display:grid; grid-template-columns:auto 1fr; gap:13px; align-items:start}
ol.steps li::before{content:counter(s); font-family:"Familjen Grotesk",sans-serif; font-weight:700; font-size:14px;
  width:26px; height:26px; border-radius:50%; background:var(--core); color:#fff; display:grid; place-items:center; margin-top:2px}

ul.notes{margin:0; padding-left:19px}
ul.notes li{margin-bottom:7px}
ul.notes li:last-child{margin-bottom:0}

.tablewrap{overflow-x:auto}
table{border-collapse:collapse; width:100%; font-size:14.5px; min-width:460px}
th,td{text-align:left; padding:9px 13px; border-bottom:1px solid var(--line)}
th{font-family:"IBM Plex Mono",monospace; font-size:10.5px; letter-spacing:.1em; text-transform:uppercase;
  color:var(--ink-3); font-weight:400; background:var(--surface-2)}
tr:last-child td{border-bottom:0}
td b{color:var(--core); font-weight:600}
td:last-child{font-variant-numeric:tabular-nums; font-weight:600}

/* lukusuora */
.nl svg{width:100%; height:118px; display:block}
.nl .rail{stroke:var(--line); stroke-width:2}
.nl .tick{stroke:var(--line); stroke-width:1.5}
.nl .stop{fill:var(--ink-3); font-family:"IBM Plex Mono",monospace; font-size:11px}
.nl .stop.near{fill:var(--core); font-weight:600}
.nl .dot{fill:var(--chal)}
.nl .val{fill:var(--ink); font-family:"Familjen Grotesk",sans-serif; font-size:15px; font-weight:700}
.nl .halfway{stroke:var(--chal); stroke-dasharray:3 3; stroke-width:1.5}
.nl-controls{display:flex; align-items:center; gap:14px; margin-top:6px}
.nl-controls input{flex:1; accent-color:var(--core)}
.nl-out{font-family:"Familjen Grotesk",sans-serif; font-size:15px; font-weight:600; min-width:12.5em; text-align:right}

/* paikka-arvotaulu */
.box .ohje{margin:0 0 14px; font-size:14.5px; color:var(--ink-2)}
.nt-valinta{display:flex; flex-wrap:wrap; gap:7px; margin-bottom:16px}
.nt-valinta button{font:inherit; font-size:12.5px; font-family:"IBM Plex Mono",monospace; padding:5px 11px;
  border-radius:6px; border:1px solid var(--line); background:var(--surface-2); color:var(--ink-2); cursor:pointer}
.nt-valinta button[aria-pressed="true"]{background:var(--ink); color:var(--paper); border-color:var(--ink)}
.nt-valinta button:focus-visible{outline:2px solid var(--core); outline-offset:2px}
.nt-taulu{display:flex; flex-direction:column; gap:4px; align-items:flex-start; overflow-x:auto; padding-bottom:4px}
.nt-rivi{display:flex; gap:6px; align-items:center}
.nt-rivi .otsa{font-family:"IBM Plex Mono",monospace; font-size:9.5px; letter-spacing:.08em;
  text-transform:uppercase; color:var(--ink-3); width:52px; text-align:center}
.nt-ruutu{width:52px; height:52px; display:grid; place-items:center; border:1.5px solid var(--line);
  border-radius:7px; background:var(--surface-2); font-family:"IBM Plex Mono",monospace; font-size:24px}
.nt-ruutu.kohta{border-color:var(--core); background:var(--core-soft); color:var(--core); font-weight:500}
.nt-ruutu.ratkaiseva{border-color:var(--chal); background:var(--chal-soft); color:var(--chal); font-weight:500}
.nt-ruutu.nolla{color:var(--ink-3)}
.nt-rivi .nimi{font-size:12.5px; color:var(--ink-3); margin-left:12px; white-space:nowrap}
.nt-nuoli{font-size:17px; color:var(--chal); margin-left:6px}
.nt-selite{margin:14px 0 0; font-size:14.5px}
.nt-selite b{color:var(--core)}

/* vahvuusportaat */
.vp-tasot{display:grid; gap:9px; margin-bottom:18px}
.vp-taso{display:flex; gap:11px; align-items:flex-start; font-size:13.5px}
.vp-taso .vp-pallo{width:13px; height:13px; border-radius:4px; margin-top:5px; flex:0 0 auto}
.vp-taso[data-taso="sulkeet"] .vp-pallo{background:var(--core)}
.vp-taso[data-taso="kertojako"] .vp-pallo{background:var(--strong)}
.vp-taso[data-taso="yhteenvahennys"] .vp-pallo{background:var(--chal)}
.vp-taso strong{display:block; font-family:"Familjen Grotesk",sans-serif; font-weight:600; font-size:14.5px}
.vp-taso span{color:var(--ink-2)}
.vp-lauseke{display:flex; flex-wrap:wrap; gap:7px; align-items:flex-end; font-family:"IBM Plex Mono",monospace;
  font-size:25px; padding:10px 2px; min-height:64px}
.vp-lauseke .t{padding:2px 3px}
.vp-lauseke .op{position:relative; padding:2px 9px; border-radius:6px; font-weight:500}
.vp-lauseke .op[data-taso="sulkeet"]{background:var(--core-soft); color:var(--core)}
.vp-lauseke .op[data-taso="kertojako"]{background:var(--strong-soft); color:var(--strong)}
.vp-lauseke .op[data-taso="yhteenvahennys"]{background:var(--chal-soft); color:var(--chal)}
.vp-lauseke .op i{position:absolute; top:-9px; right:-6px; font-style:normal; font-family:"Familjen Grotesk",sans-serif;
  font-size:11px; font-weight:700; width:18px; height:18px; border-radius:50%; display:grid; place-items:center;
  background:currentColor}
.vp-lauseke .op i span{color:var(--surface)}
.vp-rivi{display:flex; align-items:center; gap:16px; margin-top:8px}
.vp-vastaus{font-family:"Familjen Grotesk",sans-serif; font-size:16px; font-weight:600; color:var(--strong)}

/* laskujärjestys-widget */
.lj-exp{display:flex; flex-wrap:wrap; gap:7px; align-items:center; font-family:"IBM Plex Mono",monospace;
  font-size:23px; padding:14px 4px; min-height:62px}
.lj-exp .tok{padding:2px 4px; color:var(--ink)}
.lj-exp button.op{font-family:"IBM Plex Mono",monospace; font-size:23px; padding:3px 12px; border-radius:7px;
  border:1.5px solid var(--line); background:var(--surface-2); color:var(--ink); line-height:1.2}
.lj-exp button.op:hover{border-color:var(--core); color:var(--core)}
.lj-exp button.op:focus-visible{outline:2px solid var(--core); outline-offset:2px}
.lj-exp .valmis{font-family:"Familjen Grotesk",sans-serif; font-size:23px; font-weight:700; color:var(--strong)}
.lj-fb{font-size:14.5px; min-height:1.5em; color:var(--ink-2)}
.lj-fb.no{color:var(--alert)}
.lj-fb.ok{color:var(--strong)}
.lj-row{display:flex; align-items:center; gap:14px; margin-top:10px}
.lj-step{font-family:"IBM Plex Mono",monospace; font-size:11.5px; letter-spacing:.1em;
  text-transform:uppercase; color:var(--ink-3)}

/* harjoitukset */
.progress{position:sticky; top:0; z-index:5; background:var(--surface); border:1px solid var(--line);
  border-radius:var(--r); padding:12px 18px; box-shadow:var(--shadow); display:flex; align-items:center;
  gap:14px; margin:34px 0 18px}
.progress .lbl{font-family:"IBM Plex Mono",monospace; font-size:11px; letter-spacing:.12em;
  text-transform:uppercase; color:var(--ink-3); white-space:nowrap}
.progress .meter{flex:1; height:7px; border-radius:4px; background:var(--surface-2); border:1px solid var(--line); overflow:hidden}
.progress .meter i{display:block; height:100%; background:var(--core); transition:width .25s ease}
.progress .cnt{font-family:"Familjen Grotesk",sans-serif; font-weight:700; font-variant-numeric:tabular-nums; white-space:nowrap}

.grp{margin-top:26px}
.grp-head{display:flex; align-items:baseline; gap:10px; border-bottom:1.5px solid var(--ink); padding-bottom:7px; margin-bottom:14px}
.grp-head h3{margin:0; font-size:17px; font-weight:600}
.grp-head span{font-size:12.5px; color:var(--ink-2)}

.ex{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:14px 16px; margin-bottom:10px}
.ex[data-tila="oikein"]{border-color:var(--strong); box-shadow:inset 3px 0 0 var(--strong)}
.ex[data-tila="vaarin"]{border-color:var(--alert); box-shadow:inset 3px 0 0 var(--alert)}
.ex .q{display:flex; gap:11px; align-items:baseline; flex-wrap:wrap}
.ex .num{font-family:"IBM Plex Mono",monospace; font-size:11.5px; color:var(--ink-3); min-width:2.4em}
.ex .txt{flex:1; min-width:190px; font-size:15.5px}
.ex .txt .aineisto{display:block; margin-bottom:9px; padding-left:12px;
  border-left:2px solid var(--line); color:var(--ink-2); line-height:1.6;
  /* Aineisto voi olla pieni taulukko, jonka rivit on erotettu rivinvaihdoilla.
     Ilman pre-lineä ne valuisivat yhdeksi kappaleeksi ja taulukko katoaisi. */
  white-space:pre-line}
.ex .txt .kysymysrivi{display:block; font-weight:600}
.ex .row{display:flex; gap:8px; align-items:center; margin-top:11px; flex-wrap:wrap}
.ex input[type=text]{font:inherit; font-family:"IBM Plex Mono",monospace; font-size:15px; width:8.5em;
  padding:7px 11px; border:1px solid var(--line); border-radius:7px; background:var(--surface-2);
  color:var(--ink); text-align:right}
.ex input:focus-visible{outline:2px solid var(--core); outline-offset:1px}
button{font:inherit; cursor:pointer}
.btn{font-size:13.5px; padding:7px 15px; border-radius:7px; border:1px solid var(--core);
  background:var(--core); color:#fff}
.btn.ghost{background:transparent; color:var(--ink-2); border-color:var(--line)}
.btn:focus-visible{outline:2px solid var(--core); outline-offset:2px}
.btn.mv-valinta{text-align:left}
/* kuuntelutehtävä: selaimen puhesynteesi lukee englanninkielisen tekstin */
.kuuntele{display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin:2px 0 10px}
.kuuntele .btn{display:inline-flex; gap:7px; align-items:center}
.kuuntele svg{width:16px; height:16px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round}
.kuuntele .varateksti{flex-basis:100%; font-size:14px; color:var(--ink-2); background:var(--surface-2);
  border-radius:7px; padding:8px 12px; margin:0}
.btn.mv-valinta:disabled{cursor:default; opacity:.65}
.btn.mv-oikein{background:var(--strong-soft); border-color:var(--strong); color:var(--strong); opacity:1}
.btn.mv-vaarin{background:var(--alert-soft); border-color:var(--alert); color:var(--alert); opacity:1}
.row.mv{gap:8px 10px}
.fb{margin-top:11px; font-size:14.5px; padding:10px 13px; border-radius:8px; line-height:1.5}
.fb.ok{background:var(--strong-soft); color:var(--strong)}
.fb.no{background:var(--alert-soft); color:var(--alert)}
.fb.hint{background:var(--chal-soft); color:var(--chal)}

.done{background:var(--strong-soft); border:1px solid var(--strong); color:var(--strong);
  border-radius:var(--r); padding:16px 20px; margin-top:20px; font-size:15.5px}
.done h3{margin:0 0 4px; font-size:17px; color:var(--strong)}

details.teacher{margin-top:34px; background:var(--surface); border:1px solid var(--line);
  border-left:3px solid var(--chal); border-radius:var(--r); padding:15px 20px; box-shadow:var(--shadow)}
details.teacher summary{cursor:pointer; font-family:"Familjen Grotesk",sans-serif; font-weight:600; font-size:15px}
details.teacher summary:focus-visible{outline:2px solid var(--core); outline-offset:3px}
details.teacher ul{margin:12px 0 0; padding-left:19px; color:var(--ink-2); font-size:14.5px}
details.teacher li{margin-bottom:8px}
details.teacher p{margin:12px 0 0; color:var(--ink-2); font-size:14.5px}

.back{display:inline-block; margin-top:30px; font-size:13.5px; color:var(--ink-2)}
.back a{color:var(--core)}

@media (prefers-reduced-motion: reduce){*{transition:none !important}}
@media (max-width:560px){
  .wrap{padding:16px 13px 70px}
  header.top h1{font-size:25px}
  .progress{flex-wrap:wrap}
}
</style>

<div class="wrap">

  <header class="top">
    <span class="badge"><svg viewBox="0 0 24 24" aria-hidden="true" id="ikoni"></svg></span>
    <div>
      <p class="eyebrow" id="eyebrow"></p>
      <h1 id="otsikko"></h1>
      <p id="kuvaus"></p>
      <div class="tags" id="tags"></div>
    </div>
  </header>

  <article id="teksti"></article>

  <div class="progress" aria-live="polite">
    <span class="lbl">Harjoitukset</span>
    <span class="meter"><i id="pbar" style="width:0%"></i></span>
    <span class="cnt" id="pcnt">0 / 20</span>
  </div>

  <div id="harjoitukset"></div>
  <div id="valmis"></div>

  <p class="back" id="back"></p>

</div>

<script>
const D = {"tavoite_id":"MAT7-MIT-03","oppiaine":"MAT","vuosiluokka":7,"taso":"vahvistava","otsikko":"Pala palalta","kuvaus":"Osaan laskea yhdistetyn monikulmion pinta-alan jakamalla sen osiin.","versio":"0.2","paivitetty":"2026-10-04","ops":{"T":["T7","T18"],"S":["S5"]},"ikoni":"kartta","eyebrow":"Matematiikka · 7. luokka · Mittaaminen","teksti":[{"tyyppi":"johdanto","sisalto":"Perheesi uusii olohuoneen lattian. Olohuone on L:n muotoinen: sen ulkomitat ovat 8 m idästä länteen ja 6 m pohjoisesta etelään, mutta koillisnurkasta puuttuu eteisen kohdalta suorakulmio, joka on 3 m idästä länteen ja 2 m pohjoisesta etelään. Laminaatti myydään neliömetreittäin. Jos kerrot pelkät ulkomitat, saat 48 m² ja ostat kuusi neliömetriä liikaa. Oikea ala löytyy, kun jaat huoneen kahdeksi suorakulmioksi tai vähennät puuttuvan nurkan suuresta suorakulmiosta: 48 m² − 6 m² = 42 m². Tontit, pihat, seinät ja pohjapiirrokset ovat harvoin pelkkiä suorakulmioita, mutta lähes aina ne voi koota tutuista paloista. Tässä taidossa opit jakamaan kuvion osiin, päättelemään puuttuvat mitat, vähentämään puuttuvan osan ja tarkistamaan, onko vastaus oikeaa suuruusluokkaa."},{"tyyppi":"kappale","otsikko":"Jaa kuvio tuttuihin osiin","sisalto":"Kun kuviolle ei ole valmista kaavaa, piirrä se ensin itse ruutupaperille. Sopiva mittakaava on esimerkiksi yksi ruutu = 1 m. Kirjoita jokaisen sivun viereen sen pituus. Vedä sitten jakoviivat niin, että jokainen osa on suorakulmio, neliö, kolmio, suunnikas tai puolisuunnikas, ja numeroi osat. Johdannon olohuoneen voi jakaa pohjois–etelä-suuntaisella viivalla: länsiosa on 5 m × 6 m = 30 m² ja itäosa 3 m × 4 m = 12 m², yhteensä 42 m². Itä–länsi-suuntaisella viivalla eteläosa on 8 m × 4 m = 32 m² ja pohjoisosa 5 m × 2 m = 10 m², yhteensä taas 42 m². Eri jaot antavat saman alan, koska pinta-ala kertoo, montako yksikköneliötä kuvion peittämiseen tarvitaan, osat ruuduista mukaan lukien. Jakoviiva ei lisää eikä poista yhtään neliötä, vaan ryhmittelee ne eri tavalla. Ehto on, että osat peittävät koko kuvion eivätkä mene päällekkäin, jolloin jokainen neliö lasketaan täsmälleen kerran. Valitse siis jako, jossa osien mitat on helpointa päätellä. Merkitse jako aina kuvaan: pelkästä vastausluvusta ei näe, mitkä osat laskit."},{"tyyppi":"kappale","otsikko":"Puuttuvat mitat ja kulkureitti","sisalto":"Tehtävässä ei yleensä anneta jokaisen osan kaikkia mittoja, vaan ne päätellään muista sivuista. Kun kuvion jokainen sivu kulkee joko itä–länsi- tai pohjois–etelä-suunnassa ja kierrät reunan kerran ympäri, itään kuljet yhteensä yhtä pitkän matkan kuin länteen ja pohjoiseen yhtä pitkän kuin etelään. Muuten et palaisi lähtöpisteeseen. Johdannon olohuoneen pohjoisin seinä on siis 8 m − 3 m = 5 m eikä 3 m. Kuvion voi kertoa myös kulkureittinä: Tontin raja kulkee kulmasta A 40 m itään, 15 m pohjoiseen, 16 m länteen, 10 m pohjoiseen, 24 m länteen ja takaisin kulmaan A. Piirrä reitti ruudukolle pala kerrallaan. Länteen on kuljettu 16 m + 24 m = 40 m, joten viimeinen osuus kulkee suoraan etelään, ja sen pituus on 15 m + 10 m = 25 m. Itä–länsi-suuntainen jakoviiva tekee tontista kaksi suorakulmiota: 40 m × 15 m = 600 m² ja 24 m × 10 m = 240 m², yhteensä 840 m². Tontin ympärille tarvittavan aidan pituus olisi piiri, joka on eri asia kuin ala."},{"tyyppi":"kappale","otsikko":"Vähennä puuttuva osa","sisalto":"Joskus on helpompaa täydentää kuvio suuremmaksi tutuksi kuvioksi ja vähentää lisätty osa. Johdannon olohuone on suorakulmio 8 m × 6 m, josta puuttuu 3 m × 2 m: 48 m² − 6 m² = 42 m². Vähentäminen kannattaa, kun puuttuva osa on yksi selvä palanen. Esimerkiksi U-muotoisessa kuviossa vähennetään yksi lovi, kun jakamalla tarvittaisiin kolme osaa. Sama ajatus toimii seinissä. Seinä on 5 m leveä ja 2,6 m korkea, ja siinä on ikkuna 1,8 m × 1,5 m. Maalattava ala on 5 m · 2,6 m − 1,8 m · 1,5 m = 13 m² − 2,7 m² = 10,3 m². Ikkuna vähennetään, koska sitä ei maalata. Kehys ja reunus lasketaan samoin. Valokuva on 30 cm × 20 cm, ja sen ympärillä on joka puolella 5 cm leveä kehys. Kehyksen ulkomitat ovat 30 cm + 2 · 5 cm = 40 cm ja 20 cm + 2 · 5 cm = 30 cm, joten kehyksen ala on 40 cm · 30 cm − 30 cm · 20 cm = 1 200 cm² − 600 cm² = 600 cm². Leveys lisätään kahdesti, koska kehys on kuvan kummallakin puolella."},{"tyyppi":"kappale","otsikko":"Kolmiot, puolisuunnikkaat ja maa-alueet","sisalto":"Osien ei tarvitse olla suorakulmioita. Talon päätyseinä on suorakulmio, jonka leveys on 6 m ja korkeus 3 m, ja sen päällä on kolmio, jonka kanta on 6 m ja korkeus 2 m. Seinän ala on 6 m · 3 m + 6 m · 2 m : 2 = 18 m² + 6 m² = 24 m². Kolmion ja puolisuunnikkaan kaavoissa tarvitaan kantaa vastaan kohtisuora korkeus eikä vino sivu, aivan kuten taidossa Kanta kertaa korkeus. Maa-alueet ilmoitetaan usein aareina ja hehtaareina. Aari on sellaisen neliön ala, jonka sivu on 10 m, joten 1 a = 100 m². Hehtaari on sellaisen neliön ala, jonka sivu on 100 m, joten 1 ha = 10 000 m² = 100 a. Aarin tai hehtaarin kokoinen alue voi olla minkä muotoinen tahansa. Kulkureitillä kuvattu 840 m²:n tontti on siis 8,4 a eli 0,084 ha. Laattojen määrän saat, kun lasket, montako laattaa mahtuu riviin ja montako rivejä on. Jos laatat sopivat lattiaan tasan ilman leikkaamista, saat saman tuloksen jakamalla lattian alan yhden laatan alalla samassa yksikössä. Jos laattoja pitää leikata, alojen osamäärä on vain alaraja. Lattia 2 m × 1,6 m on 200 cm × 160 cm, ja laatta on 20 cm × 20 cm. Riviin mahtuu 200 : 20 = 10 laattaa, ja rivejä on 160 : 20 = 8, joten laattoja tarvitaan 80. Sama tulos tulee aloista: 32 000 cm² : 400 cm² = 80."},{"tyyppi":"saanto","otsikko":"Näin lasket yhdistetyn kuvion alan","askeleet":["Piirrä kuvio ruutupaperille ja kirjoita annetut mitat sivujen viereen. Kulkureitti piirretään pala kerrallaan lähtökulmasta alkaen.","Päättele puuttuvat mitat vastakkaisista sivuista: itään kuljettu matka on yhtä pitkä kuin länteen kuljettu ja pohjoiseen kuljettu yhtä pitkä kuin etelään kuljettu. Kirjoita päätellyt mitat kuvaan.","Valitse jako tai vähennys. Merkitse jakoviivat kuvaan ja numeroi osat. Tarkista, että osat peittävät koko kuvion eivätkä mene päällekkäin.","Muunna mitat samaan yksikköön ja laske jokaisen osan ala erikseen omalla rivillään.","Laske osien alat yhteen. Vähennysmenetelmässä vähennä puuttuvat osat, kuten lovi tai ikkuna, suuren kuvion alasta.","Tarkista suuruusluokka. Ajattele kuvion ympärille pienin suorakulmio, jonka sivut ovat kuvion pääreunojen suuntaiset. Koska kuvio mahtuu sen sisään, kuvion ala ei voi olla suurempi kuin suorakulmion ala. Ala ei voi myöskään olla pienempi kuin suurimman osan ala. Karkean arvion saat pyöristämällä mitat: suorakulmio 7,8 m × 5,9 m on vähän alle 8 m × 6 m = 48 m².","Muunna lopuksi kysyttyyn yksikköön ja kirjoita yksikkö vastaukseen: 1 m² = 10 000 cm², 1 a = 100 m² ja 1 ha = 10 000 m². Tämän taidon tehtävissä mitat ovat tarkkoja, joten vastausta ei pyöristetä."]},{"tyyppi":"ansa","otsikko":"Ansa 1: näkyvä luku puuttuvan sivun tilalla","sisalto":"L-huoneen ulkomitat ovat 9 m idästä länteen ja 7 m pohjoisesta etelään, ja koillisnurkasta puuttuu suorakulmio, joka on 4 m idästä länteen ja 3 m pohjoisesta etelään. Kun huone jaetaan pohjois–etelä-suuntaisella viivalla, länsiosan leveydeksi houkuttelee luku 4 m, koska se näkyy tehtävässä. Se on kuitenkin puuttuvan nurkan leveys. Länsiosa on 9 m − 4 m = 5 m leveä ja itäosa 7 m − 3 m = 4 m korkea. Väärä lasku 4 m · 7 m + 4 m · 4 m = 44 m² jättää osan huoneesta laskematta. Oikein: 5 m · 7 m + 4 m · 4 m = 35 m² + 16 m² = 51 m². Tarkista vähentämällä: 9 m · 7 m − 4 m · 3 m = 63 m² − 12 m² = 51 m². Kirjoita päätelty mitta kuvaan ennen laskemista, niin näet, mistä se tuli."},{"tyyppi":"ansa","otsikko":"Ansa 2: sama osa kahteen kertaan","sisalto":"Kaksi 12 cm × 4 cm:n paperiliuskaa liimataan ristiin keskikohdistaan niin, että ne ovat kohtisuorassa toisiaan vastaan ja menevät päällekkäin 4 cm × 4 cm:n neliön verran. Lasku 48 cm² + 48 cm² = 96 cm² laskee keskineliön kahdesti, vaikka pöydältä se peittää vain kerran. Oikea ala on 96 cm² − 16 cm² = 80 cm². Toinen tapa välttää virhe on jakaa kuvio osiin, jotka eivät mene päällekkäin: yksi kokonainen liuska 48 cm² ja toisen liuskan kaksi päätä, yhteensä (12 cm − 4 cm) · 4 cm = 32 cm², eli 48 cm² + 32 cm² = 80 cm². Sama virhe syntyy L-kuviossa, jos kumpikin osa ulotetaan nurkkaan asti: yhteinen nurkkapala tulee mukaan kahdesti."},{"tyyppi":"ansa","otsikko":"Ansa 3: ikkuna lisätään tai unohtuu","sisalto":"Seinä on 4 m leveä ja 2,5 m korkea, ja siinä on ikkuna 1,2 m × 1,5 m. Seinän ala on 10 m² ja ikkunan 1,8 m². Maalattava ala on 10 m² − 1,8 m² = 8,2 m². Vastaus 11,8 m² syntyy, jos ikkuna lisätään, ja 10 m², jos se unohdetaan kokonaan. Kysy itseltäsi, kuuluuko osa siihen, mitä lasketaan. Maalattava ala pienenee ikkunan verran, joten vastauksen on oltava pienempi kuin koko seinän ala."},{"tyyppi":"ansa","otsikko":"Ansa 4: yksiköt sekaisin","sisalto":"Lattia on 3,5 m leveä ja 280 cm pitkä. Lasku 3,5 · 280 = 980 sekoittaa metrit ja senttimetrit, eikä tuloksella ole järkevää yksikköä. Muunna ensin: 280 cm = 2,8 m, joten ala on 3,5 m · 2,8 m = 9,8 m². Aareissa on toinen ansa: 1 a = 100 m², ei 10 m², koska aari on 10 m × 10 m:n neliön ala. Tontti, jonka ala on 1 250 m², on 12,5 a eikä 125 a. Hehtaarissa on 10 000 m², joten sama tontti on 0,125 ha. Suuruusluokan voi tarkistaa: tavallinen omakotitontti on muutamasta aarista parikymmeneen aariin, ei satoja aareja."}],"harjoitusryhmat":[{"id":"jako","nimi":"Jaa osiin","info":"Piirrä kuvio ruutupaperille, päättele puuttuvat mitat ja merkitse jako. Osat eivät saa mennä päällekkäin."},{"id":"vahennys","nimi":"Vähennä ja tarkista","info":"Täydennä kuvio suorakulmioksi ja vähennä puuttuva osa. Ympäröivän suorakulmion ala on yläraja vastaukselle."},{"id":"arki","nimi":"Tontit, seinät ja lattiat","info":"Muunna mitat samaan yksikköön ennen laskemista. 1 a = 100 m² ja 1 ha = 10 000 m²."}],"harjoitukset":[{"id":"H01","ryhma":"jako","kysymys":"L-muotoisen huoneen ulkomitat ovat 6,5 m idästä länteen ja 5 m pohjoisesta etelään. Huoneen koillisnurkasta puuttuu suorakulmio, jonka mitat ovat 2,5 m idästä länteen ja 2 m pohjoisesta etelään. Montako metriä pitkä on huoneen pohjoisin seinä?","vastaus":4,"vinkki":"Pohjoisin seinä kulkee huoneen länsiosan yläreunassa. Koko leveydestä puuttuu nurkan leveys.","selitys":"Huone on koko leveydeltään 6,5 m, ja koillisnurkasta puuttuu 2,5 m. Pohjoisin seinä on siis 6,5 m − 2,5 m = 4 m. Vastaus 2,5 on puuttuvan nurkan leveys, ei seinän pituus."},{"id":"H02","ryhma":"jako","kysymys":"L-muotoisen olohuoneen ulkomitat ovat 7 m × 5,5 m, ja yhdestä nurkasta puuttuu suorakulmio 3 m × 2,5 m. Montako neliömetriä on olohuoneen pinta-ala?","vastaus":31,"vinkki":"Laske ulkomittojen suorakulmio ja vähennä puuttuva nurkka, tai jaa huone kahdeksi suorakulmioksi.","selitys":"Vähentämällä: 7 m · 5,5 m − 3 m · 2,5 m = 38,5 m² − 7,5 m² = 31 m². Jakamalla tulee sama: jos nurkka puuttuu itäreunasta, länsiosa on 4 m × 5,5 m = 22 m² ja itäosa 3 m × 3 m = 9 m², yhteensä 31 m². Vastaus 38,5 on koko suorakulmio, ja 46 syntyy, jos nurkka lisätään."},{"id":"H03","ryhma":"jako","kysymys":"Tontin raja kulkee kulmasta A 36 m itään, 20 m pohjoiseen, 14 m länteen, 12 m pohjoiseen, 22 m länteen ja takaisin kulmaan A. Montako neliömetriä on tontin pinta-ala?","vastaus":984,"vinkki":"Piirrä reitti ruudukolle. Itä–länsi-suuntainen jakoviiva 20 m:n kohdalla tekee tontista kaksi suorakulmiota.","selitys":"Länteen kuljetaan 14 m + 22 m = 36 m, joten viimeinen osuus kulkee etelään 20 m + 12 m = 32 m. Eteläosa on 36 m × 20 m = 720 m² ja pohjoisosa 22 m × 12 m = 264 m², yhteensä 984 m². Vastaus 1 152 on ympäröivä suorakulmio 36 m × 32 m, ei tontti."},{"id":"H04","ryhma":"jako","kysymys":"Pihan aita kulkee kulmasta A 18 m itään, 9 m pohjoiseen, 7 m länteen, 6 m pohjoiseen, sitten suoraan länteen ja lopuksi suoraan etelään takaisin kulmaan A. Montako metriä pitkä on aidan pohjoisin osa?","vastaus":11,"vinkki":"Itään on kuljettu yhteensä yhtä pitkä matka kuin länteen.","selitys":"Itään kuljetaan 18 m ja länteen ensin 7 m. Pohjoisin osa kulkee länteen loput 18 m − 7 m = 11 m. Vastaus 7 on ensimmäinen länteen kulkeva osa, ei pohjoisin."},{"id":"H05","ryhma":"jako","kysymys":"Kuvio koostuu suorakulmiosta, jonka sivut ovat 9 cm ja 4 cm, ja kolmiosta, jonka kanta on suorakulmion 9 cm:n sivu ja korkeus 6 cm. Kolmio on suorakulmion ulkopuolella. Montako neliösenttimetriä on kuvion pinta-ala?","vastaus":63,"vinkki":"Laske suorakulmion ja kolmion alat erikseen. Kolmion kaavassa jaetaan kahdella.","selitys":"Suorakulmio on 9 cm · 4 cm = 36 cm² ja kolmio 9 cm · 6 cm : 2 = 27 cm², yhteensä 63 cm². Vastaus 90 syntyy, jos kolmion alaa ei jaeta kahdella."},{"id":"H06","ryhma":"jako","kysymys":"Aino jakoi L-muotoisen kuvion pohjois–etelä-suuntaisella viivalla ja Leo itä–länsi-suuntaisella viivalla. Kumpikin laski osien alat oikein, ja he saivat saman kokonaisalan. Miksi tulos on sama?","vastaus":1,"vinkki":"Mieti, mitä pinta-ala tarkoittaa ruutupaperilla.","selitys":"Pinta-ala kertoo, montako yksikköneliötä kuvion peittämiseen tarvitaan, osat ruuduista mukaan lukien. Jakoviiva ei lisää eikä poista neliöitä, vaan ryhmittelee ne eri tavalla. Kun osat eivät mene päällekkäin eikä väliin jää aukkoa, jokainen neliö lasketaan kerran, ja summa on sama. Osien määrä tai jakoviivan pituus ei vaikuta alaan.","tyyppi":"monivalinta","vaihtoehdot":["Koska kumpikin jako tuottaa kaksi osaa, ja osien määrä ratkaisee alan.","Koska ala kertoo, montako yksikköneliötä kuvion peittämiseen tarvitaan, osat ruuduista mukaan lukien. Jakoviiva vain ryhmittelee samat neliöt eri tavalla, ja kun osat eivät mene päällekkäin, jokainen neliö lasketaan kerran.","Koska pohjois–etelä- ja itä–länsi-suuntaiset jakoviivat ovat yhtä pitkiä."]},{"id":"H07","ryhma":"jako","kysymys":"Kaksi suorakulmion muotoista paperiliuskaa, kumpikin 15 cm × 3 cm, liimataan ristiin niin, että ne ovat kohtisuorassa toisiaan vastaan ja menevät päällekkäin yhden 3 cm × 3 cm:n neliön verran. Montako neliösenttimetriä pöydästä liuskat peittävät yhteensä?","vastaus":81,"vinkki":"Keskineliö kuuluu kumpaankin liuskaan, mutta pöydältä se peittää vain kerran.","selitys":"Kumpikin liuska on 15 cm · 3 cm = 45 cm². Päällekkäinen neliö 3 cm × 3 cm = 9 cm² on mukana kahdesti, joten ala on 45 cm² + 45 cm² − 9 cm² = 81 cm². Toinen tapa: yksi kokonainen liuska 45 cm² ja toisen liuskan kaksi päätä yhteensä (15 cm − 3 cm) · 3 cm = 36 cm², eli 81 cm². Vastaus 90 laskee keskineliön kahdesti."},{"id":"H08","ryhma":"vahennys","kysymys":"Seinä on 3,5 m leveä ja 2,4 m korkea. Seinässä on ikkuna, joka on 1,5 m leveä ja 1,2 m korkea. Ikkunaa ei maalata. Montako neliömetriä seinästä maalataan?","vastaus":6.6,"vinkki":"Laske koko seinän ala ja vähennä ikkunan ala.","selitys":"Seinä on 3,5 m · 2,4 m = 8,4 m² ja ikkuna 1,5 m · 1,2 m = 1,8 m². Maalattava ala on 8,4 m² − 1,8 m² = 6,6 m². Vastaus 10,2 syntyy, jos ikkuna lisätään, ja 8,4, jos se unohtuu."},{"id":"H09","ryhma":"vahennys","kysymys":"Kuvion raja kulkee kulmasta A 10 m itään, 8 m pohjoiseen, 3 m länteen, 5 m etelään, 4 m länteen, 5 m pohjoiseen, 3 m länteen ja takaisin kulmaan A. Kuvion ala lasketaan vähentämällä: kuvio täydennetään pienimmäksi suorakulmioksi, jonka sisään se mahtuu. Montako neliömetriä on poistettavan osan pinta-ala?","vastaus":20,"vinkki":"Piirrä reitti. Pohjoisreunassa on lovi. Kuinka leveä ja syvä se on?","selitys":"Ympäröivä suorakulmio on 10 m × 8 m. Pohjoisreunan lovi on 4 m leveä ja 5 m syvä, joten poistettava osa on 4 m · 5 m = 20 m². Kuvion ala on 80 m² − 20 m² = 60 m². Vastaus 60 on kuvion ala, ei poistettava osa."},{"id":"H10","ryhma":"vahennys","kysymys":"Kuvion raja kulkee kulmasta A 12 m itään, 9 m pohjoiseen, 4 m länteen, 6 m etelään, 3 m länteen, 6 m pohjoiseen, 5 m länteen ja takaisin kulmaan A. Montako neliömetriä on kuvion pinta-ala?","vastaus":90,"vinkki":"Kuvio on U:n muotoinen. Vähentämällä tarvitset kaksi suorakulmiota, jakamalla kolme.","selitys":"Ympäröivä suorakulmio on 12 m · 9 m = 108 m², ja lovi on 3 m leveä ja 6 m syvä eli 18 m². Ala on 108 m² − 18 m² = 90 m². Jakamalla: alaosa 12 m · 3 m = 36 m², länsipylväs 5 m · 6 m = 30 m² ja itäpylväs 4 m · 6 m = 24 m², yhteensä 90 m²."},{"id":"H11","ryhma":"vahennys","kysymys":"Suorakulmion muotoisen uima-altaan mitat ovat 8 m × 4 m. Altaan ympärillä on joka puolella 1,5 m leveä laattareunus. Montako neliömetriä on reunuksen pinta-ala?","vastaus":45,"vinkki":"Reunus on altaan kummallakin puolella, joten leveys lisätään kumpaankin ulkomittaan kahdesti.","selitys":"Ulkomitat ovat 8 m + 2 · 1,5 m = 11 m ja 4 m + 2 · 1,5 m = 7 m. Reunuksen ala on 11 m · 7 m − 8 m · 4 m = 77 m² − 32 m² = 45 m². Vastaus 20,25 syntyy, jos leveys lisätään vain kerran (9,5 m · 5,5 m − 32 m²), ja 77, jos allasta ei vähennetä."},{"id":"H12","ryhma":"vahennys","kysymys":"Suorakulmion muotoisen vanerilevyn mitat ovat 80 cm × 50 cm. Levyn yhdestä nurkasta sahataan pois suorakulmainen kolmio, jonka suoran kulman viereiset sivut kulkevat levyn reunoja pitkin ja ovat 30 cm ja 20 cm. Montako neliösenttimetriä levyä jää jäljelle?","vastaus":3700,"vinkki":"Kolmio on puolet suorakulmiosta, jonka sivut ovat 30 cm ja 20 cm.","selitys":"Levy on 80 cm · 50 cm = 4 000 cm² ja kolmio 30 cm · 20 cm : 2 = 300 cm². Jäljelle jää 4 000 cm² − 300 cm² = 3 700 cm². Vastaus 3 400 syntyy, jos kolmion alaa ei jaeta kahdella."},{"id":"H13","ryhma":"vahennys","kysymys":"Kuvion raja kulkee kulmasta A 4 m itään, 5 m pohjoiseen, 3 m itään, 3 m pohjoiseen, 10 m länteen, 3 m etelään, 3 m itään ja takaisin kulmaan A. Kuvion ympärille piirretään pienin suorakulmio, jonka sivut kulkevat itä–länsi- ja pohjois–etelä-suunnassa. Montako neliömetriä on suorakulmion pinta-ala?","vastaus":80,"vinkki":"Etsi, kuinka kauas itään ja länteen kuvio ulottuu lähtökulmasta.","selitys":"Itään kuvio ulottuu 4 m + 3 m = 7 m. Pohjoisreuna kulkee 10 m länteen, joten se päättyy 3 m lähtökulmasta länteen. Suorakulmion leveys on 10 m ja korkeus 5 m + 3 m = 8 m, joten ala on 80 m². Kuvion oma ala on 4 m · 5 m + 10 m · 3 m = 50 m², ja se on pienempi kuin 80 m², kuten pitääkin."},{"id":"H14","ryhma":"vahennys","kysymys":"Kuvion ympärille piirretty pienin suorakulmio on 12 m × 7 m. Saga laski kuvion alaksi 96 m². Mitä tästä voi päätellä?","vastaus":2,"vinkki":"Mahtuuko kuvio suorakulmion sisään?","selitys":"Ympäröivä suorakulmio on 12 m · 7 m = 84 m². Kuvio mahtuu sen sisään, joten kuvion ala on enintään 84 m². Vastaus 96 m² on liian suuri, ja laskussa on virhe, esimerkiksi jokin osa on laskettu kahdesti. Osien määrä ei kerro alasta mitään.","tyyppi":"monivalinta","vaihtoehdot":["Laskun täytyy olla oikein, koska kuviossa on monta osaa.","Lasku voi olla oikein, koska yhdistetyn kuvion ala on yleensä suurempi kuin ympäröivän suorakulmion ala.","Laskussa on virhe, koska kuvio mahtuu suorakulmioon, jonka ala on 84 m², eikä kuvion ala voi olla sitä suurempi."]},{"id":"H15","ryhma":"arki","kysymys":"Tontin raja kulkee kulmasta A 45 m itään, 20 m pohjoiseen, 25 m länteen, 16 m pohjoiseen, 20 m länteen ja takaisin kulmaan A. Montako aaria on tontin pinta-ala?","vastaus":12.2,"vinkki":"Laske ensin ala neliömetreinä ja muunna sitten aareiksi: 1 a = 100 m².","selitys":"Eteläosa on 45 m · 20 m = 900 m² ja pohjoisosa 20 m · 16 m = 320 m², yhteensä 1 220 m². Koska 1 a = 100 m², ala on 1 220 : 100 = 12,2 a. Vastaus 122 syntyy, jos neliömetrit jaetaan kymmenellä."},{"id":"H16","ryhma":"arki","kysymys":"Pellon raja kulkee kulmasta A 300 m itään, 150 m pohjoiseen, 100 m länteen, 50 m pohjoiseen, 200 m länteen ja takaisin kulmaan A. Montako hehtaaria on pellon pinta-ala?","vastaus":5.5,"vinkki":"1 ha = 10 000 m². Laske ensin neliömetrit.","selitys":"Eteläosa on 300 m · 150 m = 45 000 m² ja pohjoisosa 200 m · 50 m = 10 000 m², yhteensä 55 000 m². Koska 1 ha = 10 000 m², ala on 5,5 ha. Vastaus 550 on aareina, ja 55 syntyy, jos neliömetrit jaetaan tuhannella."},{"id":"H17","ryhma":"arki","kysymys":"Pohjapiirroksessa makuuhuone on L-muotoinen. Sen ulkomitat ovat 400 cm × 350 cm, ja yhdestä nurkasta puuttuu suorakulmio 120 cm × 150 cm. Montako neliömetriä on huoneen pinta-ala?","vastaus":12.2,"vinkki":"Muunna senttimetrit metreiksi ennen laskemista.","selitys":"Ulkomitat ovat 4 m × 3,5 m = 14 m², ja puuttuva osa on 1,2 m × 1,5 m = 1,8 m². Huoneen ala on 14 m² − 1,8 m² = 12,2 m². Vastaus 1 220 syntyy, jos 122 000 cm² muunnetaan neliömetreiksi jakamalla sadalla, vaikka kerroin on 10 000."},{"id":"H18","ryhma":"arki","kysymys":"Kylpyhuoneen lattia on L-muotoinen: ulkomitat ovat 210 cm × 180 cm, ja yhdestä nurkasta puuttuu suorakulmio 60 cm × 90 cm. Lattia laatoitetaan neliön muotoisilla laatoilla, joiden sivu on 30 cm. Laatat sopivat lattiaan tasan, eikä niitä tarvitse leikata. Montako laattaa tarvitaan?","vastaus":36,"vinkki":"Laske, montako laattaa mahtuisi ulkomittojen suorakulmioon ja montako puuttuvaan nurkkaan.","selitys":"Ulkomittojen suorakulmioon mahtuu 210 : 30 = 7 laattaa riviin ja 180 : 30 = 6 riviä, eli 42 laattaa. Puuttuvaan nurkkaan mahtuisi 60 : 30 = 2 kertaa 90 : 30 = 3 eli 6 laattaa. Laattoja tarvitaan 42 − 6 = 36. Vastaus 42 unohtaa puuttuvan nurkan."},{"id":"H19","ryhma":"arki","kysymys":"Talon päätyseinä koostuu suorakulmiosta, joka on 8 m leveä ja 3 m korkea, ja sen päällä olevasta kolmiosta, jonka kanta on 8 m ja korkeus 2,5 m. Seinässä on kaksi ikkunaa, kumpikin 1 m leveä ja 1,5 m korkea. Montako neliömetriä seinästä maalataan?","vastaus":31,"vinkki":"Laske suorakulmio ja kolmio yhteen ja vähennä sitten molemmat ikkunat.","selitys":"Suorakulmio on 8 m · 3 m = 24 m² ja kolmio 8 m · 2,5 m : 2 = 10 m². Ikkunat ovat yhteensä 2 · 1 m · 1,5 m = 3 m². Maalattava ala on 24 m² + 10 m² − 3 m² = 31 m². Vastaus 41 syntyy, jos kolmiota ei jaeta kahdella, ja 37, jos ikkunat lisätään."},{"id":"H20","ryhma":"arki","kysymys":"Tontti koostuu suorakulmiosta, jonka sivut ovat 35 m ja 20 m, ja puolisuunnikkaasta, jonka pidempi yhdensuuntainen sivu on suorakulmion 35 m:n sivu. Puolisuunnikkaan lyhyempi yhdensuuntainen sivu on 25 m, ja yhdensuuntaisten sivujen välinen etäisyys on 12 m. Montako aaria on tontin pinta-ala?","vastaus":10.6,"vinkki":"Puolisuunnikkaan ala on (a + b) · h : 2. Muunna lopuksi aareiksi.","selitys":"Suorakulmio on 35 m · 20 m = 700 m² ja puolisuunnikas (35 m + 25 m) · 12 m : 2 = 360 m², yhteensä 1 060 m² = 10,6 a. Vastaus 14,2 syntyy, jos puolisuunnikkaan alaa ei jaeta kahdella."}],"valmis_teksti":"Osaat laskea yhdistetyn monikulmion pinta-alan jakamalla sen tuttuihin osiin tai vähentämällä puuttuvan osan suuremmasta kuviosta. Päättelet puuttuvat mitat vastakkaisista sivuista, merkitset jaon kuvaan ja lasket osien alat. Tarkistat suuruusluokan ympäröivän suorakulmion avulla ja annat vastauksen pyydetyssä yksikössä, myös aareina ja hehtaareina. Tämä taito on nyt näytetty."};

const esc = s => s;
const osat = D.teksti.map(o=>{
  switch(o.tyyppi){
    case "johdanto":
      return `<p class="lead">${esc(o.sisalto)}</p>`;
    case "kappale":
      return `<h2>${esc(o.otsikko)}</h2><p>${esc(o.sisalto)}</p>`;
    case "saanto":
      return `<div class="box"><h3>${esc(o.otsikko)}</h3><ol class="steps">${
        o.askeleet.map(a=>`<li><span>${esc(a)}</span></li>`).join("")}</ol></div>`;
    case "taulukko":
      return `<div class="box"><h3>${esc(o.otsikko)}</h3><div class="tablewrap"><table><thead><tr>${
        o.otsikkorivi.map(h=>`<th>${h}</th>`).join("")}</tr></thead><tbody>${
        o.rivit.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join("")}</tr>`).join("")}</tbody></table></div></div>`;
    case "ansa":
      return `<div class="box warn"><h3>${esc(o.otsikko)}</h3><p style="margin:0">${esc(o.sisalto)}</p></div>`;
    case "muistilappu":
      return `<div class="box note"><h3>${esc(o.otsikko)}</h3><ul class="notes">${
        o.kohdat.map(k=>`<li>${esc(k)}</li>`).join("")}</ul></div>`;
    case "numerotaulu":

const svg=document.getElementById("nlsvg"), rng=document.getElementById("nlrange"), out=document.getElementById("nlout");
const X0=34, X1=606, Y=62;
function piirraNL(v){
  const ala=Math.floor(v/10)*10, yla=ala+10, puoli=ala+5;
  const pyor = (v%10)>=5 ? yla : ala;
  const x = n => X0 + (n/100)*(X1-X0);
  let s=`<line class="rail" x1="${X0}" y1="${Y}" x2="${X1}" y2="${Y}"/>`;
  for(let n=0;n<=100;n+=10){
    const near = (n===ala||n===yla);
    s+=`<line class="tick" x1="${x(n)}" y1="${Y-7}" x2="${x(n)}" y2="${Y+7}"/>`;
    s+=`<text class="stop${near?" near":""}" x="${x(n)}" y="${Y+24}" text-anchor="middle">${n}</text>`;
  }
  s+=`<line class="halfway" x1="${x(puoli)}" y1="${Y-16}" x2="${x(puoli)}" y2="${Y+12}"/>`;
  s+=`<text class="stop" x="${x(puoli)}" y="${Y-22}" text-anchor="middle">puoliväli ${puoli}</text>`;
  s+=`<circle class="dot" cx="${x(v)}" cy="${Y}" r="6"/>`;
  s+=`<text class="val" x="${x(v)}" y="${Y-32}" text-anchor="middle">${v}</text>`;
  s+=`<path d="M ${x(v)} ${Y+38} L ${x(pyor)} ${Y+38}" stroke="var(--core)" stroke-width="2" fill="none"/>`;
  s+=`<path d="M ${x(pyor)} ${Y+38} l ${x(pyor)>x(v)?-7:7} -4 l 0 8 z" fill="var(--core)"/>`;
  svg.innerHTML=s;
  out.textContent = `${v} pyöristyy → ${pyor}`;
}

/* ---------- laskujärjestys-widget ---------- */
const ljExp=document.getElementById("ljExp");
if(ljExp && D.kokeilu){
  let ljI=0, ljTokens=[], ljStep=0;
  const laske=(a,op,b)=>{a=+a;b=+b;return op==="×"?a*b:op==="÷"?a/b:op==="+"?a+b:a-b;};
  function ljAlku(){
    const l=D.kokeilu[ljI];
    ljTokens=l.lauseke.replace(/\(/g,"( ").replace(/\)/g," )").split(/\s+/).filter(Boolean);
    ljStep=0; ljPiirra(); ljViesti("","");
  }
  function ljViesti(t,lk){const f=document.getElementById("ljFb"); f.textContent=t; f.className="lj-fb "+(lk||"");}
  function ljPiirra(){
    const l=D.kokeilu[ljI];
    document.getElementById("ljStep").textContent =
      ljStep>=l.askeleet.length ? "valmis" : `askel ${ljStep+1} / ${l.askeleet.length}`;
    if(ljStep>=l.askeleet.length){
      ljExp.innerHTML=`<span class="valmis">${l.lauseke} = ${l.vastaus}</span>`;
      return;
    }
    ljExp.innerHTML=ljTokens.map((t,i)=>
      "×÷+−".includes(t) ? `<button type="button" class="op" data-i="${i}">${t}</button>`
                         : `<span class="tok">${t}</span>`).join("");
    ljExp.querySelectorAll("button.op").forEach(b=>b.addEventListener("click",()=>ljKlikkaa(+b.dataset.i)));
  }
  function ljKlikkaa(i){
    const l=D.kokeilu[ljI], odotettu=l.askeleet[ljStep];
    const ehdotus=[ljTokens[i-1],ljTokens[i],ljTokens[i+1]].join(" ");
    if(ehdotus!==odotettu){
      ljViesti(ljStep===0
        ? "Ei vielä. Sulkeet ovat vahvimmat, sitten kerto ja jako. Yhtä vahvat vasemmalta oikealle."
        : "Ei vielä. Kumpi jäljellä olevista on vahvempi?", "no");
      return;
    }
    const arvo=laske(ljTokens[i-1],ljTokens[i],ljTokens[i+1]);
    let alku=i-1, loppu=i+1;
    if(ljTokens[i-2]==="(" && ljTokens[i+2]===")"){ alku=i-2; loppu=i+2; }
    ljTokens.splice(alku, loppu-alku+1, String(arvo));
    ljStep++;
    ljViesti(ljStep>=l.askeleet.length ? "Valmis. Vastaus on "+l.vastaus+"." : "Oikein. Jatka seuraavaan.", "ok");
    ljPiirra();
  }
  document.getElementById("ljSeuraava").addEventListener("click",()=>{
    ljI=(ljI+1)%D.kokeilu.length; ljAlku();
  });
  ljAlku();
}

/* Suomalainen lukumuoto: välilyönti on tuhaterotin, pilkku desimaalierotin.
   Piste voi olla kumpi tahansa. Se tulkitaan tuhaterottimeksi VAIN silloin, kun
   koko luku on aitoa tuhaterotinmuotoa: alkuosa 1–3 numeroa ilman etunollaa ja
   jokainen jatko-osa täsmälleen 3 numeroa (1.500, 12.345.678). Kaikissa muissa
   tapauksissa piste on desimaalipiste — myös 0.125, joka vanhalla säännöllä
   ("3 numeroa pisteen jäljessä = tuhaterotin") luettiin virheellisesti luvuksi 125. */
const TUHATEROTIN = /^[1-9]\d{0,2}(\.\d{3})+$/;
function lueLuku(teksti){
  // Murtoluku (3/4, -3/4) ja sekaluku (1 2/3, -1 2/3) hyväksytään sellaisinaan.
  const raaka = String(teksti).replace(/\u00a0/g, " ").trim();
  let m = raaka.match(/^(-?)(\d+)\s+(\d+)\s*\/\s*(\d+)$/);
  if(m){ const nim = Number(m[4]); if(nim === 0) return null;
    const v = Number(m[2]) + Number(m[3]) / nim; return m[1] ? -v : v; }
  m = raaka.match(/^(-?)\s*(\d+)\s*\/\s*(\d+)$/);
  if(m){ const nim = Number(m[3]); if(nim === 0) return null;
    const v = Number(m[2]) / nim; return m[1] ? -v : v; }
  let s = String(teksti).replace(/[\s\u00a0]/g, "");
  if(s === "") return null;
  if(s.indexOf(",") >= 0){
    s = s.replace(/\./g, "").replace(",", ".");
  } else if(TUHATEROTIN.test(s)){
    s = s.replace(/\./g, "");
  }
  const n = Number(s);
  return Number.isFinite(n) ? n : null;
}

function tarkista(id){
  const h=D.harjoitukset.find(x=>x.id===id);
  const kentta=document.getElementById("in-"+id);
  const fb=document.getElementById("fb-"+id);
  if(kentta.value.trim()===""){ fb.className="fb hint"; fb.textContent="Kirjoita vastaus ensin."; return; }
  const luku=lueLuku(kentta.value);
  if(luku===null){ fb.className="fb no"; fb.textContent="Vastauksen pitää olla luku tai murtoluku (esimerkiksi 3/4)."; return; }
  const oikein = Math.abs(luku - h.vastaus) < 1e-9;
  merkitseTulos(id, oikein, oikein ? "Oikein. "+h.selitys : `Ei vielä. ${h.vinkki} Kokeile uudelleen.`);
}

function tarkistaMonivalinta(id, valittuIndeksi, painike){
  const h=D.harjoitukset.find(x=>x.id===id);
  const rivi=painike.closest(".row");
  rivi.querySelectorAll(".mv-valinta").forEach(b=>b.disabled=true);
  const oikein = valittuIndeksi===h.vastaus;
  painike.classList.add(oikein?"mv-oikein":"mv-vaarin");
  if(!oikein){
    const oikeaBtn=rivi.querySelector(`[data-i="${h.vastaus}"]`);
    if(oikeaBtn) oikeaBtn.classList.add("mv-oikein");
  }
  merkitseTulos(id, oikein, oikein ? "Oikein. "+h.selitys : `Ei ihan. Oikea vastaus on korostettu. ${h.selitys||""}`);
}

/* Kuuntelu: selain lukee tekstin ääneen omalla puhesynteesillään (englanniksi, jos laitteessa on
   englanninkielinen ääni). Ei äänitiedostoja eikä verkkoyhteyttä. Jos laite ei osaa puhua,
   teksti näytetään luettavaksi — silloin tehtävä muuttuu luetun ymmärtämiseksi, mutta ei katkea. */
function puhu(id, nopeus){
  const h=D.harjoitukset.find(x=>x.id===id); if(!h || !h.kuuntele) return;
  const vara=document.getElementById("vara-"+id);
  const naytaTeksti=syy=>{ vara.hidden=false; vara.textContent=syy+" Teksti: "+h.kuuntele; };
  if(!("speechSynthesis" in window)){ naytaTeksti("Tämä laite ei osaa lukea ääneen."); return; }
  const s=window.speechSynthesis; s.cancel();
  const u=new SpeechSynthesisUtterance(h.kuuntele);
  u.lang=h.kieli||"en-GB"; u.rate=nopeus;
  const aanet=s.getVoices(), kieli=u.lang.slice(0,2);
  const aani=aanet.find(a=>a.lang===u.lang) || aanet.find(a=>a.lang && a.lang.startsWith(kieli));
  if(aani) u.voice=aani;
  else if(aanet.length) { naytaTeksti("Laitteessa ei ole englanninkielistä ääntä."); return; }
  u.onerror=()=>naytaTeksti("Ääneen lukeminen ei onnistunut.");
  s.speak(u);
}
