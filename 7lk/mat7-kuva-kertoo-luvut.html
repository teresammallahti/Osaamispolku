<title>Kuva kertoo luvut</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">

<style>
:root{
  --paper:#EFF2F5; --surface:#FFFFFF; --surface-2:#F7F9FB;
  --grid:#DCE3EA; --line:#C9D3DC;
  --ink:#15222C; --ink-2:#4E626F; --ink-3:#7E8F9B;
  --core:#1B5A9E; --core-soft:#E4EDF6;
  --strong:#1F6E5C; --strong-soft:#E1F0EB;
  --chal:#9A6A16; --chal-soft:#F6EDDC;
  --alert:#A33A2B; --alert-soft:#F8E7E3;
  --shadow:0 1px 2px rgba(21,34,44,.06), 0 8px 24px -12px rgba(21,34,44,.18);
  --r:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0F161B; --surface:#18222A; --surface-2:#1D2830;
    --grid:#22303A; --line:#2E3E4A;
    --ink:#E8EFF4; --ink-2:#A3B4C0; --ink-3:#7A8B97;
    --core:#7FB2E4; --core-soft:#16303F;
    --strong:#77CDB4; --strong-soft:#123028;
    --chal:#E0B267; --chal-soft:#33270F;
    --alert:#E8907F; --alert-soft:#3A1E19;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -14px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --paper:#0F161B; --surface:#18222A; --surface-2:#1D2830;
  --grid:#22303A; --line:#2E3E4A;
  --ink:#E8EFF4; --ink-2:#A3B4C0; --ink-3:#7A8B97;
  --core:#7FB2E4; --core-soft:#16303F;
  --strong:#77CDB4; --strong-soft:#123028;
  --chal:#E0B267; --chal-soft:#33270F;
  --alert:#E8907F; --alert-soft:#3A1E19;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -14px rgba(0,0,0,.7);
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:16px; line-height:1.62;
  background-image:
    linear-gradient(to right, var(--grid) 1px, transparent 1px),
    linear-gradient(to bottom, var(--grid) 1px, transparent 1px);
  background-size:26px 26px;
}
.wrap{max-width:760px; margin:0 auto; padding:28px 20px 90px}
h1,h2,h3,h4{font-family:"Familjen Grotesk","IBM Plex Sans",system-ui,sans-serif; text-wrap:balance}

/* header */
header.top{background:var(--surface); border:1px solid var(--line); border-radius:var(--r);
  box-shadow:var(--shadow); padding:22px 24px; display:flex; gap:18px; align-items:flex-start}
.badge{flex:0 0 auto; width:54px; height:54px; border-radius:9px; display:grid; place-items:center;
  background:var(--core-soft); border:1px solid var(--core); color:var(--core)}
.badge svg{width:28px; height:28px; fill:none; stroke:currentColor; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round}
.eyebrow{font-family:"IBM Plex Mono",monospace; font-size:11px; letter-spacing:.14em;
  text-transform:uppercase; color:var(--ink-3); margin:0 0 5px}
header.top h1{margin:0; font-size:30px; font-weight:700; letter-spacing:-.015em}
header.top p{margin:5px 0 0; color:var(--ink-2); font-size:15px}
.tags{display:flex; flex-wrap:wrap; gap:5px; margin-top:11px}
.tag{font-family:"IBM Plex Mono",monospace; font-size:10.5px; letter-spacing:.05em; padding:2px 7px;
  border-radius:4px; background:var(--surface-2); border:1px solid var(--line); color:var(--ink-3)}
.tag.core{background:var(--core-soft); border-color:var(--core); color:var(--core)}

/* teksti */
article{margin-top:26px}
article h2{font-size:21px; font-weight:600; margin:32px 0 10px; letter-spacing:-.01em}
article p{margin:0 0 14px; max-width:64ch}
.lead{font-size:17.5px; color:var(--ink); border-left:3px solid var(--core); padding-left:16px; margin:0 0 8px}

.box{background:var(--surface); border:1px solid var(--line); border-radius:var(--r);
  padding:18px 22px; box-shadow:var(--shadow); margin:22px 0}
.box h3{margin:0 0 12px; font-size:16.5px; font-weight:600}
.box.warn{border-left:3px solid var(--alert)}
.box.note{border-left:3px solid var(--chal)}

ol.steps{margin:0; padding-left:0; list-style:none; counter-reset:s; display:grid; gap:12px}
ol.steps li{counter-increment:s; display:grid; grid-template-columns:auto 1fr; gap:13px; align-items:start}
ol.steps li::before{content:counter(s); font-family:"Familjen Grotesk",sans-serif; font-weight:700; font-size:14px;
  width:26px; height:26px; border-radius:50%; background:var(--core); color:#fff; display:grid; place-items:center; margin-top:2px}

ul.notes{margin:0; padding-left:19px}
ul.notes li{margin-bottom:7px}
ul.notes li:last-child{margin-bottom:0}

.tablewrap{overflow-x:auto}
table{border-collapse:collapse; width:100%; font-size:14.5px; min-width:460px}
th,td{text-align:left; padding:9px 13px; border-bottom:1px solid var(--line)}
th{font-family:"IBM Plex Mono",monospace; font-size:10.5px; letter-spacing:.1em; text-transform:uppercase;
  color:var(--ink-3); font-weight:400; background:var(--surface-2)}
tr:last-child td{border-bottom:0}
td b{color:var(--core); font-weight:600}
td:last-child{font-variant-numeric:tabular-nums; font-weight:600}

/* lukusuora */
.nl svg{width:100%; height:118px; display:block}
.nl .rail{stroke:var(--line); stroke-width:2}
.nl .tick{stroke:var(--line); stroke-width:1.5}
.nl .stop{fill:var(--ink-3); font-family:"IBM Plex Mono",monospace; font-size:11px}
.nl .stop.near{fill:var(--core); font-weight:600}
.nl .dot{fill:var(--chal)}
.nl .val{fill:var(--ink); font-family:"Familjen Grotesk",sans-serif; font-size:15px; font-weight:700}
.nl .halfway{stroke:var(--chal); stroke-dasharray:3 3; stroke-width:1.5}
.nl-controls{display:flex; align-items:center; gap:14px; margin-top:6px}
.nl-controls input{flex:1; accent-color:var(--core)}
.nl-out{font-family:"Familjen Grotesk",sans-serif; font-size:15px; font-weight:600; min-width:12.5em; text-align:right}

/* paikka-arvotaulu */
.box .ohje{margin:0 0 14px; font-size:14.5px; color:var(--ink-2)}
.nt-valinta{display:flex; flex-wrap:wrap; gap:7px; margin-bottom:16px}
.nt-valinta button{font:inherit; font-size:12.5px; font-family:"IBM Plex Mono",monospace; padding:5px 11px;
  border-radius:6px; border:1px solid var(--line); background:var(--surface-2); color:var(--ink-2); cursor:pointer}
.nt-valinta button[aria-pressed="true"]{background:var(--ink); color:var(--paper); border-color:var(--ink)}
.nt-valinta button:focus-visible{outline:2px solid var(--core); outline-offset:2px}
.nt-taulu{display:flex; flex-direction:column; gap:4px; align-items:flex-start; overflow-x:auto; padding-bottom:4px}
.nt-rivi{display:flex; gap:6px; align-items:center}
.nt-rivi .otsa{font-family:"IBM Plex Mono",monospace; font-size:9.5px; letter-spacing:.08em;
  text-transform:uppercase; color:var(--ink-3); width:52px; text-align:center}
.nt-ruutu{width:52px; height:52px; display:grid; place-items:center; border:1.5px solid var(--line);
  border-radius:7px; background:var(--surface-2); font-family:"IBM Plex Mono",monospace; font-size:24px}
.nt-ruutu.kohta{border-color:var(--core); background:var(--core-soft); color:var(--core); font-weight:500}
.nt-ruutu.ratkaiseva{border-color:var(--chal); background:var(--chal-soft); color:var(--chal); font-weight:500}
.nt-ruutu.nolla{color:var(--ink-3)}
.nt-rivi .nimi{font-size:12.5px; color:var(--ink-3); margin-left:12px; white-space:nowrap}
.nt-nuoli{font-size:17px; color:var(--chal); margin-left:6px}
.nt-selite{margin:14px 0 0; font-size:14.5px}
.nt-selite b{color:var(--core)}

/* vahvuusportaat */
.vp-tasot{display:grid; gap:9px; margin-bottom:18px}
.vp-taso{display:flex; gap:11px; align-items:flex-start; font-size:13.5px}
.vp-taso .vp-pallo{width:13px; height:13px; border-radius:4px; margin-top:5px; flex:0 0 auto}
.vp-taso[data-taso="sulkeet"] .vp-pallo{background:var(--core)}
.vp-taso[data-taso="kertojako"] .vp-pallo{background:var(--strong)}
.vp-taso[data-taso="yhteenvahennys"] .vp-pallo{background:var(--chal)}
.vp-taso strong{display:block; font-family:"Familjen Grotesk",sans-serif; font-weight:600; font-size:14.5px}
.vp-taso span{color:var(--ink-2)}
.vp-lauseke{display:flex; flex-wrap:wrap; gap:7px; align-items:flex-end; font-family:"IBM Plex Mono",monospace;
  font-size:25px; padding:10px 2px; min-height:64px}
.vp-lauseke .t{padding:2px 3px}
.vp-lauseke .op{position:relative; padding:2px 9px; border-radius:6px; font-weight:500}
.vp-lauseke .op[data-taso="sulkeet"]{background:var(--core-soft); color:var(--core)}
.vp-lauseke .op[data-taso="kertojako"]{background:var(--strong-soft); color:var(--strong)}
.vp-lauseke .op[data-taso="yhteenvahennys"]{background:var(--chal-soft); color:var(--chal)}
.vp-lauseke .op i{position:absolute; top:-9px; right:-6px; font-style:normal; font-family:"Familjen Grotesk",sans-serif;
  font-size:11px; font-weight:700; width:18px; height:18px; border-radius:50%; display:grid; place-items:center;
  background:currentColor}
.vp-lauseke .op i span{color:var(--surface)}
.vp-rivi{display:flex; align-items:center; gap:16px; margin-top:8px}
.vp-vastaus{font-family:"Familjen Grotesk",sans-serif; font-size:16px; font-weight:600; color:var(--strong)}

/* laskujärjestys-widget */
.lj-exp{display:flex; flex-wrap:wrap; gap:7px; align-items:center; font-family:"IBM Plex Mono",monospace;
  font-size:23px; padding:14px 4px; min-height:62px}
.lj-exp .tok{padding:2px 4px; color:var(--ink)}
.lj-exp button.op{font-family:"IBM Plex Mono",monospace; font-size:23px; padding:3px 12px; border-radius:7px;
  border:1.5px solid var(--line); background:var(--surface-2); color:var(--ink); line-height:1.2}
.lj-exp button.op:hover{border-color:var(--core); color:var(--core)}
.lj-exp button.op:focus-visible{outline:2px solid var(--core); outline-offset:2px}
.lj-exp .valmis{font-family:"Familjen Grotesk",sans-serif; font-size:23px; font-weight:700; color:var(--strong)}
.lj-fb{font-size:14.5px; min-height:1.5em; color:var(--ink-2)}
.lj-fb.no{color:var(--alert)}
.lj-fb.ok{color:var(--strong)}
.lj-row{display:flex; align-items:center; gap:14px; margin-top:10px}
.lj-step{font-family:"IBM Plex Mono",monospace; font-size:11.5px; letter-spacing:.1em;
  text-transform:uppercase; color:var(--ink-3)}

/* harjoitukset */
.progress{position:sticky; top:0; z-index:5; background:var(--surface); border:1px solid var(--line);
  border-radius:var(--r); padding:12px 18px; box-shadow:var(--shadow); display:flex; align-items:center;
  gap:14px; margin:34px 0 18px}
.progress .lbl{font-family:"IBM Plex Mono",monospace; font-size:11px; letter-spacing:.12em;
  text-transform:uppercase; color:var(--ink-3); white-space:nowrap}
.progress .meter{flex:1; height:7px; border-radius:4px; background:var(--surface-2); border:1px solid var(--line); overflow:hidden}
.progress .meter i{display:block; height:100%; background:var(--core); transition:width .25s ease}
.progress .cnt{font-family:"Familjen Grotesk",sans-serif; font-weight:700; font-variant-numeric:tabular-nums; white-space:nowrap}

.grp{margin-top:26px}
.grp-head{display:flex; align-items:baseline; gap:10px; border-bottom:1.5px solid var(--ink); padding-bottom:7px; margin-bottom:14px}
.grp-head h3{margin:0; font-size:17px; font-weight:600}
.grp-head span{font-size:12.5px; color:var(--ink-2)}

.ex{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:14px 16px; margin-bottom:10px}
.ex[data-tila="oikein"]{border-color:var(--strong); box-shadow:inset 3px 0 0 var(--strong)}
.ex[data-tila="vaarin"]{border-color:var(--alert); box-shadow:inset 3px 0 0 var(--alert)}
.ex .q{display:flex; gap:11px; align-items:baseline; flex-wrap:wrap}
.ex .num{font-family:"IBM Plex Mono",monospace; font-size:11.5px; color:var(--ink-3); min-width:2.4em}
.ex .txt{flex:1; min-width:190px; font-size:15.5px}
.ex .txt .aineisto{display:block; margin-bottom:9px; padding-left:12px;
  border-left:2px solid var(--line); color:var(--ink-2); line-height:1.6;
  /* Aineisto voi olla pieni taulukko, jonka rivit on erotettu rivinvaihdoilla.
     Ilman pre-lineä ne valuisivat yhdeksi kappaleeksi ja taulukko katoaisi. */
  white-space:pre-line}
.ex .txt .kysymysrivi{display:block; font-weight:600}
.ex .row{display:flex; gap:8px; align-items:center; margin-top:11px; flex-wrap:wrap}
.ex input[type=text]{font:inherit; font-family:"IBM Plex Mono",monospace; font-size:15px; width:8.5em;
  padding:7px 11px; border:1px solid var(--line); border-radius:7px; background:var(--surface-2);
  color:var(--ink); text-align:right}
.ex input:focus-visible{outline:2px solid var(--core); outline-offset:1px}
button{font:inherit; cursor:pointer}
.btn{font-size:13.5px; padding:7px 15px; border-radius:7px; border:1px solid var(--core);
  background:var(--core); color:#fff}
.btn.ghost{background:transparent; color:var(--ink-2); border-color:var(--line)}
.btn:focus-visible{outline:2px solid var(--core); outline-offset:2px}
.btn.mv-valinta{text-align:left}
/* kuuntelutehtävä: selaimen puhesynteesi lukee englanninkielisen tekstin */
.kuuntele{display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin:2px 0 10px}
.kuuntele .btn{display:inline-flex; gap:7px; align-items:center}
.kuuntele svg{width:16px; height:16px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round}
.kuuntele .varateksti{flex-basis:100%; font-size:14px; color:var(--ink-2); background:var(--surface-2);
  border-radius:7px; padding:8px 12px; margin:0}
.btn.mv-valinta:disabled{cursor:default; opacity:.65}
.btn.mv-oikein{background:var(--strong-soft); border-color:var(--strong); color:var(--strong); opacity:1}
.btn.mv-vaarin{background:var(--alert-soft); border-color:var(--alert); color:var(--alert); opacity:1}
.row.mv{gap:8px 10px}
.fb{margin-top:11px; font-size:14.5px; padding:10px 13px; border-radius:8px; line-height:1.5}
.fb.ok{background:var(--strong-soft); color:var(--strong)}
.fb.no{background:var(--alert-soft); color:var(--alert)}
.fb.hint{background:var(--chal-soft); color:var(--chal)}

.done{background:var(--strong-soft); border:1px solid var(--strong); color:var(--strong);
  border-radius:var(--r); padding:16px 20px; margin-top:20px; font-size:15.5px}
.done h3{margin:0 0 4px; font-size:17px; color:var(--strong)}

details.teacher{margin-top:34px; background:var(--surface); border:1px solid var(--line);
  border-left:3px solid var(--chal); border-radius:var(--r); padding:15px 20px; box-shadow:var(--shadow)}
details.teacher summary{cursor:pointer; font-family:"Familjen Grotesk",sans-serif; font-weight:600; font-size:15px}
details.teacher summary:focus-visible{outline:2px solid var(--core); outline-offset:3px}
details.teacher ul{margin:12px 0 0; padding-left:19px; color:var(--ink-2); font-size:14.5px}
details.teacher li{margin-bottom:8px}
details.teacher p{margin:12px 0 0; color:var(--ink-2); font-size:14.5px}

.back{display:inline-block; margin-top:30px; font-size:13.5px; color:var(--ink-2)}
.back a{color:var(--core)}

@media (prefers-reduced-motion: reduce){*{transition:none !important}}
@media (max-width:560px){
  .wrap{padding:16px 13px 70px}
  header.top h1{font-size:25px}
  .progress{flex-wrap:wrap}
}
</style>

<div class="wrap">

  <header class="top">
    <span class="badge"><svg viewBox="0 0 24 24" aria-hidden="true" id="ikoni"></svg></span>
    <div>
      <p class="eyebrow" id="eyebrow"></p>
      <h1 id="otsikko"></h1>
      <p id="kuvaus"></p>
      <div class="tags" id="tags"></div>
    </div>
  </header>

  <article id="teksti"></article>

  <div class="progress" aria-live="polite">
    <span class="lbl">Harjoitukset</span>
    <span class="meter"><i id="pbar" style="width:0%"></i></span>
    <span class="cnt" id="pcnt">0 / 20</span>
  </div>

  <div id="harjoitukset"></div>
  <div id="valmis"></div>

  <p class="back" id="back"></p>

</div>

<script>
const D = {"tavoite_id":"MAT7-TIL-01","oppiaine":"MAT","vuosiluokka":7,"taso":"ydin","otsikko":"Kuva kertoo luvut","kuvaus":"Osaan lukea ja piirtää pylväs-, viiva- ja sektoridiagrammeja ja valita tilanteeseen sopivan diagrammin.","versio":"0.2","paivitetty":"2026-10-04","ops":{"T":["T8","T19"],"S":["S6"]},"ikoni":"tutkimus","eyebrow":"Matematiikka · 7. luokka · Tilastot ja todennäköisyys","teksti":[{"tyyppi":"johdanto","sisalto":"Puhelimesi viikkoraportti näyttää ruutuajan kolmella eri kuvalla. Pylväät kertovat, montako minuuttia käytit puhelinta kunakin päivänä. Ympyrä on jaettu sovellusten kesken, ja siitä näkee yhdellä silmäyksellä, minkä osan ajasta vei pelaaminen ja minkä viestit. Kuukauden käyrä nousee ja laskee viikosta toiseen. Kaikki kolme kuvaavat samaa ruutuaikaa, mutta jokainen vastaa eri kysymykseen: pylväät vertailevat, ympyrä näyttää osuudet ja viiva muutoksen ajan kuluessa. Tässä taidossa opit lukemaan pylväs-, viiva- ja sektoridiagrammeja, piirtämään niitä itse otsikoineen, akseleineen ja yksiköineen, laskemaan sektoridiagrammin keskuskulmat ja perustelemaan, mikä diagrammi sopii mihinkin aineistoon. Tällä sivulla ei ole kuvia, joten diagrammit kuvataan tehtävissä sanoin: kerrotaan akselin merkit ja se, mihin kohtaan pylväs päättyy tai mikä kulma sektorilla on."},{"tyyppi":"kappale","otsikko":"Pylväsdiagrammi ja asteikon lukeminen","sisalto":"Pylväsdiagrammissa jokaisella kohteella on oma pylväs, ja pylvään korkeus esittää lukua. Kohteet ovat vaaka-akselilla ja luvut pystyakselilla. Jos pylväät piirretään vaakasuoraan, puhutaan palkkidiagrammista. Pystyakselin merkit ovat tasavälein, mutta merkkiväli on harvoin 1: se voi olla 20, 50 tai 100. Merkkien välissä on usein ohuempia apuviivoja. Selvitä ensin, paljonko yksi merkkiväli on, ja jaa se niiden osien määrällä, joihin apuviivat sen jakavat. Jos merkit ovat 0, 20, 40, 60 ja 80 ja jokainen merkkiväli on jaettu neljään yhtä suureen osaan, yksi osa on 20 : 4 = 5. Neljään osaan jakamiseen tarvitaan kolme apuviivaa. Pylväs, joka päättyy kolmanteen apuviivaan merkin 40 yläpuolella, esittää siis lukua 40 + 3 · 5 = 55. Jos pylväs päättyy kahden merkin puoliväliin, se esittää merkkien keskiarvoa: merkkien 100 ja 150 puolivälissä on 125. Pylväsdiagrammissa pylväs lähtee nollatasosta, koska lukija vertaa pylväiden pituuksia: kaksi kertaa niin pitkä pylväs tarkoittaa kaksi kertaa niin suurta lukua. Negatiivinen luku, kuten pakkaslukema, piirretään nollatasolta alaspäin."},{"tyyppi":"kappale","otsikko":"Viivadiagrammi näyttää muutoksen","sisalto":"Viivadiagrammissa havainnot merkitään pisteinä, ja peräkkäiset pisteet yhdistetään viivalla. Vaaka-akselilla on tavallisesti aika: kellonajat, päivät, kuukaudet tai vuodet järjestyksessä. Viiva sopii aikaan, koska aika jatkuu mittausten välilläkin ja viiva näyttää suunnan mittauksesta seuraavaan. Viivan välikohdat ovat silti vain arvio, sillä mittaus on tehty vain merkityillä hetkillä. Muutos kahden peräkkäisen mittauksen välillä on myöhemmän ja aiemman arvon erotus. Positiivinen erotus on nousu ja negatiivinen lasku. Lämpötiloista −6, −2, 3 ja 1 nousut ovat −2 − (−6) = 4 astetta ja 3 − (−2) = 5 astetta, ja viimeisellä välillä lämpötila laskee 2 astetta. Kun mittausten väli on aina sama, se piirretään vaaka-akselille aina yhtä pitkäksi, ja silloin jyrkin viivan osa on suurin muutos. Jos mittauksia on tehty epätasaisin välein, välit piirretään ajan mukaan, muuten viivan jyrkkyys antaa väärän kuvan. Viivadiagrammissa pystyakselin saa aloittaa muualtakin kuin nollasta, kun halutaan näyttää pienet muutokset tarkemmin. Silloin akseliin piirretään katkos, pieni siksak-viiva alimman merkin alle, jotta lukija huomaa sen."},{"tyyppi":"kappale","otsikko":"Sektoridiagrammi ja keskuskulma","sisalto":"Sektoridiagrammi eli piirakkakuvio on ympyrä, joka on jaettu sektoreihin. Koko ympyrä on koko aineisto, esimerkiksi kaikki kyselyyn vastanneet, ja jokainen sektori on yksi sen osa. Sektorin koon ratkaisee sen keskuskulma eli kulma, jonka kärki on ympyrän keskipisteessä. Täysi kierros on 360°, joten koko aineisto vastaa 360°:ta, ja jokainen osa saa kulmasta saman osuuden kuin sillä on aineistosta: keskuskulma = osuus · 360°. Neljäsosa vastaajista saa sektorin 1/4 · 360° = 90° eli suoran kulman. Osuus 3/8 saa 3/8 · 360° = 3 · 45° = 135°. Kun tiedät lukumäärät, osuus on osan määrä jaettuna kaikkien määrällä. Jos 30 vastaajasta 7 valitsee uinnin, osuus on 7/30 ja keskuskulma 7/30 · 360° = 7 · 12° = 84°. Saman tuloksen saat laskemalla ensin yhden vastaajan kulman: 360° : 30 = 12°. Laskun voi tehdä myös toiseen suuntaan. Sektori, jonka keskuskulma on 120°, on 120/360 = 1/3 koko ympyrästä, ja jos vastaajia on 24, sektorissa on 1/3 · 24 = 8 vastaajaa. Kun jokainen havainto kuuluu täsmälleen yhteen sektoriin, keskuskulmien summa on 360°. Jos kulmat jouduttaisiin pyöristämään, summa voisi heittää hieman. Tämän taidon tehtävissä kulmat ovat kokonaislukuja, joten summan pitää olla tasan 360°."},{"tyyppi":"saanto","otsikko":"Näin piirrät diagrammin","askeleet":["Kirjoita otsikko, joka kertoo, mistä aineistosta on kyse, ja tarvittaessa milloin tai missä se on kerätty, esimerkiksi ”Kerhojen osallistujat syksyllä”.","Pylväs- ja viivadiagrammissa nimeä molemmat akselit ja kirjoita pystyakselin nimeen yksikkö, esimerkiksi ”lämpötila (°C)” tai ”myynti (kpl)”. Ilman yksikköä luku 40 voi tarkoittaa mitä tahansa.","Valitse asteikko: katso aineiston suurin luku ja valitse merkkiväli, esimerkiksi 5, 10, 20, 50 tai 100, niin että suurin luku mahtuu akselille. Merkit tulevat tasavälein, ja pylväsdiagrammissa asteikko alkaa nollasta tai jatkuu nollan alle, jos aineistossa on negatiivisia lukuja.","Pylväät piirretään yhtä leveiksi, niiden väliin jätetään yhtä suuret raot, ja jokainen pylväs lähtee nollatasosta. Viivadiagrammissa merkitse pisteet ja yhdistä peräkkäiset pisteet viivalla.","Sektoridiagrammissa laske ensin jokaisen osan keskuskulma osuus · 360° ja tarkista, että kulmien summa on 360°. Jos summa on jotain muuta, jokin kulma on laskettu väärin, ja virhe korjataan ennen piirtämistä.","Piirrä harpilla ympyrä ja siihen yksi säde. Mittaa astelevyllä ensimmäinen keskuskulma säteestä alkaen ja piirrä uusi säde. Mittaa seuraava kulma tästä uudesta säteestä. Viimeinen sektori jää jäljelle, ja sen kulman mittaaminen on hyvä tarkistus.","Kirjoita jokaiseen sektoriin tai sen viereen osan nimi. Taulukkolaskentaohjelma piirtää diagrammin puolestasi, mutta diagrammityypin, otsikon ja akselien nimet valitset silloinkin itse."]},{"tyyppi":"taulukko","otsikko":"Mikä diagrammi vastaa mihinkin kysymykseen","otsikkorivi":["Mitä lukijan pitää nähdä","Diagrammi","Miksi","Esimerkki"],"rivit":[["Kuinka suuri osa kokonaisuudesta kukin osa on (osuudet)","Sektoridiagrammi","Koko ympyrä on kokonaisuus, joten osuuden näkee suoraan sektorin koosta.","Mihin kuukauden taskuraha kuluu"],["Mikä on suurin ja kuinka paljon kohteet eroavat (vertailu)","Pylväsdiagrammi","Nollasta lähtevien pylväiden pituuksia on helppo verrata keskenään.","Viiden kaupungin asukasluvut"],["Miten asia kehittyy ajan kuluessa (muutos)","Viivadiagrammi","Viiva näyttää suunnan mittauksesta toiseen: nousut, laskut ja niiden jyrkkyyden.","Kuntosalin jäsenmäärä kuukausittain"],["Osat eivät muodosta yhdessä kokonaisuutta","Ei sektoridiagrammia","Ympyrän jakaminen ei tarkoita mitään, jos lukuja ei voi laskea yhteen yhdeksi kokonaisuudeksi.","Viiden kaupungin keskilämpötilat"]]},{"tyyppi":"kappale","otsikko":"Valinnan perustelu","sisalto":"Kun valitset diagrammia, kysy ensin, mitä lukijan pitää aineistosta nähdä: osuudet, vertailu vai muutos ajan kuluessa. Perustelu on yksi virke, joka nimeää tämän: ”Valitsen sektoridiagrammin, koska haluan näyttää, kuinka suuri osa kaikista vastaajista valitsi kunkin vaihtoehdon.” Sektoridiagrammilla on lisäksi ehto: osien on muodostettava yhdessä kokonaisuus, eli jokainen havainto kuuluu täsmälleen yhteen osaan. Jos kyselyssä sai valita useamman vaihtoehdon, vastauksia on enemmän kuin vastaajia, ja osuuksien summa olisi yli yhden. Silloin sektoridiagrammia ei voi piirtää, mutta pylväsdiagrammin voi. Myös ajallista aineistoa voi esittää pylväinä, ja pylväät sopivat, kun halutaan vertailla yksittäisiä vuosia keskenään. Kun lukijan pitää nähdä kehityksen suunta, viiva näyttää sen selvimmin. Siksi tehtävissä kerrotaan aina, mitä diagrammin halutaan näyttävän, ja perustelusi nojaa siihen."},{"tyyppi":"ansa","otsikko":"Ansa 1: pystyakseli ei ala nollasta","sisalto":"Mainoskuvassa kahden kaupan myynnit ovat 320 ja 380, ja pystyakseli alkaa luvusta 300. Kuvassa ensimmäisen pylvään korkeus vastaa 20 yksikköä ja toisen 80 yksikköä, joten toinen pylväs on neljä kertaa niin pitkä. Todellinen ero on 60, ja 380 on alle 1,2 kertaa 320. Lue siksi aina ensin pystyakselin alin luku. Kun piirrät pylväsdiagrammin itse, aloita asteikko nollasta. Viivadiagrammissa akselin saa aloittaa muualta, mutta katkos merkitään näkyviin."},{"tyyppi":"ansa","otsikko":"Ansa 2: kulma lasketaan sadasta","sisalto":"Osuus 3/10 ei ole 30°. Luku 30 syntyy, jos osuus 3/10 = 30/100 luetaan ”30 sadasta” ja ympyrän kooksi ajatellaan 100. Ympyrä on kuitenkin 360°, joten 3/10 · 360° = 108°. Virheen paljastaa summa: jos osuuksien 1/2, 1/5 ja 3/10 kulmiksi saa 50°, 20° ja 30°, summa on 100° eikä 360°, ja piirretty diagrammi täyttäisi vain vähän yli neljäsosan ympyrästä. Laske kulmien summa aina ennen kuin piirrät."},{"tyyppi":"ansa","otsikko":"Ansa 3: viiva erillisten luokkien välillä","sisalto":"Jos piirrät viivan jäätelömakujen suklaa, vanilja ja mansikka äänimäärien välille, viiva väittää, että äänet ”nousevat” tai ”laskevat” mausta toiseen ja että suklaan ja vaniljan välissä olisi jotain. Makujen järjestys vaaka-akselilla on kuitenkin sattumanvarainen. Vaihda järjestystä, niin viivan muoto muuttuu kokonaan, vaikka aineisto on täsmälleen sama. Viiva kuuluu aineistoon, jossa vaaka-akselin järjestys on luonnollinen ja välissäkin on jotain, kuten ajassa. Erillisille luokille piirretään pylväät, tai sektorit, jos kysytään osuuksia kokonaisuudesta."}],"harjoitusryhmat":[{"id":"lue","nimi":"Diagrammin lukeminen","info":"Selvitä ensin, paljonko yksi merkkiväli ja yksi apuviivaväli ovat. Sektoridiagrammissa koko ympyrä on kaikki vastaajat."},{"id":"sektori","nimi":"Sektorin keskuskulmat","info":"Keskuskulma = osuus · 360°. Tarkista lopuksi, että kulmien summa on 360°."},{"id":"piirra","nimi":"Piirtäminen, tarkistus ja valinta","info":"Asteikko tasavälein ja pylväät nollasta. Valinta riippuu siitä, kuvataanko osuuksia, vertailua vai muutosta ajan kuluessa."}],"harjoitukset":[{"id":"H01","ryhma":"lue","kysymys":"Pylväsdiagrammi: Koulun kirjaston lainat viikolla (kpl)\nPystyakselin merkit: 0, 60, 120, 180, 240\nJokainen merkkiväli on jaettu kolmeen yhtä suureen osaan apuviivoilla.\nMaanantain pylväs päättyy merkkiin 120.\nTiistain pylväs päättyy toiseen apuviivaan merkin 120 yläpuolella.\nKeskiviikon pylväs päättyy ensimmäiseen apuviivaan merkin 180 yläpuolella.\n\nMontako kirjaa lainattiin keskiviikkona?","vastaus":200,"vinkki":"Paljonko on yksi merkkiväli? Montako osaa siihen tulee?","selitys":"Merkkiväli on 60, ja se on jaettu kolmeen osaan, joten yksi osa on 60 : 3 = 20. Keskiviikon pylväs päättyy ensimmäiseen apuviivaan merkin 180 yläpuolella: 180 + 20 = 200. Vastaus 181 syntyisi, jos apuviivan arvoksi oletettaisiin 1.","tyyppi":"luku"},{"id":"H02","ryhma":"lue","kysymys":"Pylväsdiagrammi: Liikuntahallin kävijät viikonloppuna\nPystyakselin merkit: 0, 200, 400, 600, 800\nPerjantain pylväs päättyy merkkien 400 ja 600 puoliväliin.\nLauantain pylväs päättyy merkkiin 600.\nSunnuntain pylväs päättyy merkkien 200 ja 400 puoliväliin.\n\nKuinka monta kävijää enemmän oli lauantaina kuin sunnuntaina?","vastaus":300,"vinkki":"Lue ensin molemmat pylväät luvuiksi. Mikä luku on merkkien 200 ja 400 puolivälissä?","selitys":"Lauantain pylväs esittää lukua 600. Sunnuntain pylväs päättyy merkkien 200 ja 400 puoliväliin, eli lukuun 300. Erotus on 600 − 300 = 300 kävijää.","tyyppi":"luku"},{"id":"H03","ryhma":"lue","kysymys":"Viivadiagrammi: Ulkolämpötila kolmen tunnin välein (°C)\nklo 3: 4\nklo 6: 3\nklo 9: 8\nklo 12: 14\nklo 15: 16\nklo 18: 9\n\nKuinka monta astetta oli suurin nousu kahden peräkkäisen mittauksen välillä?","vastaus":6,"vinkki":"Laske jokaisen välin muutos: myöhempi miinus aiempi. Etsi suurin positiivinen.","selitys":"Muutokset ovat −1, +5, +6, +2 ja −7. Suurin nousu on 6 astetta (klo 9:stä klo 12:een). Klo 15:n ja 18:n välillä muutos on suurempi, 7 astetta, mutta se on lasku, ei nousu.","tyyppi":"luku"},{"id":"H04","ryhma":"lue","kysymys":"Viivadiagrammi: Aamun lämpötila viikolla (°C)\nmaanantai: −12\ntiistai: −7\nkeskiviikko: −15\ntorstai: −6\nperjantai: −2\n\nKuinka monta astetta lämpötila nousi keskiviikosta perjantaihin?","vastaus":13,"vinkki":"Nousu on myöhempi lukema miinus aiempi lukema. Muista, että negatiivisen luvun vähentäminen on sama kuin vastaluvun lisääminen.","selitys":"Nousu on −2 − (−15) = −2 + 15 = 13 astetta. Lukusuoralla luvusta −15 lukuun −2 on 13 askelta. Vastaus 17 syntyisi, jos lukemat laskettaisiin yhteen ilman etumerkkejä.","tyyppi":"luku"},{"id":"H05","ryhma":"lue","kysymys":"Sektoridiagrammi: Lempiruoka kouluruokalassa (36 vastaajaa)\npasta: 120°\npizza: 110°\nkeitto: 60°\nsalaatti: 70°\n\nMontako vastaajaa valitsi vaihtoehdon ”pizza”?","vastaus":11,"vinkki":"Koko ympyrä 360° on kaikki 36 vastaajaa. Montako astetta on yksi vastaaja?","selitys":"Yksi vastaaja vastaa kulmaa 360° : 36 = 10°. Pizzan sektori on 110°, joten pizzan valitsi 110 : 10 = 11 vastaajaa. Saman saa osuutena: 110/360 · 36 = 11.","tyyppi":"luku"},{"id":"H06","ryhma":"lue","kysymys":"Sektoridiagrammi: Mieluisin laite vapaa-ajalla (40 vastaajaa)\npuhelin: 171°\nkonsoli: 99°\ntietokone: 63°\ntabletti: 27°\n\nMontako vastaajaa enemmän valitsi vaihtoehdon ”puhelin” kuin vaihtoehdon ”konsoli”?","vastaus":8,"vinkki":"Selvitä yhden vastaajan kulma. Voit laskea kummankin sektorin vastaajat tai suoraan kulmien erotuksen vastaajat.","selitys":"Yksi vastaaja on 360° : 40 = 9°. Puhelimen valitsi 171 : 9 = 19 ja konsolin 99 : 9 = 11 vastaajaa. Erotus on 19 − 11 = 8. Suoraan kulmista: (171° − 99°) : 9° = 72 : 9 = 8.","tyyppi":"luku"},{"id":"H07","ryhma":"lue","kysymys":"Pylväsdiagrammin pystyakseli alkaa luvusta 600 eikä nollasta. Kaupan A pylväs esittää lukua 620 ja kaupan B pylväs lukua 700.\n\nKuinka monta kertaa niin pitkä kaupan B pylväs on kuvassa kuin kaupan A pylväs?","vastaus":5,"vinkki":"Kuvassa pylväs alkaa luvusta 600. Kuinka paljon kumpikin pylväs nousee sen yläpuolelle?","selitys":"Kuvassa A:n pylväs on 620 − 600 = 20 yksikköä ja B:n pylväs 700 − 600 = 100 yksikköä pitkä. B näyttää 100 : 20 = 5 kertaa niin suurelta, vaikka 700 on vain vähän yli 1,1 kertaa 620. Tästä syystä pylväsdiagrammin asteikko aloitetaan nollasta.","tyyppi":"luku"},{"id":"H08","ryhma":"sektori","kysymys":"Kyselyyn vastanneista 5/8 kulkee kouluun pyörällä.\n\nKuinka suuri on pyöräilijöiden sektorin keskuskulma asteina?","vastaus":225,"vinkki":"Keskuskulma = osuus · 360°. Laske ensin 1/8 · 360°.","selitys":"1/8 · 360° = 45°, joten 5/8 · 360° = 5 · 45° = 225°. Sektori on yli puolet ympyrästä, kuten pitääkin, koska 5/8 on yli 1/2.","tyyppi":"luku"},{"id":"H09","ryhma":"sektori","kysymys":"Kyselyyn vastasi 30 oppilasta, ja heistä 13 valitsi lempilajikseen koripallon.\n\nKuinka suuri on koripallon sektorin keskuskulma asteina?","vastaus":156,"vinkki":"Osuus on 13/30. Voit myös laskea ensin, montako astetta yksi vastaaja on.","selitys":"Yksi vastaaja on 360° : 30 = 12°, joten 13 vastaajaa on 13 · 12° = 156°. Osuutena sama lasku: 13/30 · 360° = 156°.","tyyppi":"luku"},{"id":"H10","ryhma":"sektori","kysymys":"Sektoridiagrammi tehdään kyselystä, johon vastasi 120 henkilöä.\n\nKuinka suuri keskuskulma vastaa yhtä vastaajaa? Anna vastaus asteina.","vastaus":3,"vinkki":"Koko ympyrä jaetaan tasan kaikkien vastaajien kesken.","selitys":"Koko ympyrä on 360°, ja se jaetaan 120 vastaajan kesken: 360° : 120 = 3°. Esimerkiksi 25 vastaajan sektori olisi silloin 25 · 3° = 75°.","tyyppi":"luku"},{"id":"H11","ryhma":"sektori","kysymys":"Sektorin keskuskulma on 100°.\n\nKuinka suuren osan kokonaisuudesta sektori esittää? Anna vastaus supistettuna murtolukuna.","vastaus":0.2777777777777778,"vinkki":"Osuus on sektorin kulma jaettuna koko ympyrän kulmalla 360°. Supista sitten.","selitys":"Osuus on 100/360. Supistetaan 20:llä: 100/360 = 5/18. Jos vastasit 100/360, arvo on oikea, mutta supista se aina loppuun: 5/18.","tyyppi":"luku"},{"id":"H12","ryhma":"sektori","kysymys":"Sektoridiagrammissa on neljä sektoria. Kolmen sektorin keskuskulmat ovat 145°, 78° ja 62°.\n\nKuinka suuri on neljännen sektorin keskuskulma asteina?","vastaus":75,"vinkki":"Kaikkien neljän kulman summa on 360°.","selitys":"Kolmen kulman summa on 145° + 78° + 62° = 285°. Neljäs kulma on 360° − 285° = 75°. Tarkistus: 285° + 75° = 360°.","tyyppi":"luku"},{"id":"H13","ryhma":"sektori","kysymys":"Kyselyssä jokainen valitsi yhden kolmesta vaihtoehdosta. Vastaajista 1/4 valitsi ensimmäisen ja 1/6 toisen vaihtoehdon, ja loput valitsivat kolmannen.\n\nKuinka suuri on kolmannen vaihtoehdon sektorin keskuskulma asteina?","vastaus":210,"vinkki":"Laske kahden ensimmäisen sektorin kulmat ja vähennä ne 360°:sta.","selitys":"1/4 · 360° = 90° ja 1/6 · 360° = 60°. Kolmas sektori on 360° − 90° − 60° = 210°. Murtoluvuilla sama: loput ovat 1 − 1/4 − 1/6 = 7/12, ja 7/12 · 360° = 210°.","tyyppi":"luku"},{"id":"H14","ryhma":"sektori","kysymys":"Mikko laski, että osuuden 9/20 sektorin keskuskulma on 45°.\n\nMikä on oikea keskuskulma asteina?","vastaus":162,"vinkki":"Mistä Mikon 45 tulee? Mikä on koko ympyrän kulma?","selitys":"Mikko laski osuuden sadasta: 9/20 = 45/100. Ympyrä on kuitenkin 360°: 1/20 · 360° = 18°, joten 9/20 · 360° = 9 · 18° = 162°.","tyyppi":"luku"},{"id":"H15","ryhma":"piirra","kysymys":"Piirrät pylväsdiagrammin ruutupaperille niin, että pystysuunnassa yksi ruutu vastaa 20 kiloa.\n\nMontako ruutua korkea on pylväs, joka esittää 150 kiloa?","vastaus":7.5,"vinkki":"Montako kertaa 20 menee lukuun 150?","selitys":"150 : 20 = 7,5, joten pylväs on seitsemän ja puoli ruutua korkea. Puolikas ruutu on täysin käypä pylvään korkeus.","tyyppi":"luku"},{"id":"H16","ryhma":"piirra","kysymys":"Piirrät pylväsdiagrammin ruutupaperille. Aineiston suurin luku on 460, ja pystyakselille mahtuu 12 ruutua. Yksi ruutu vastaa yhtä asteikon askelta, ja askel valitaan luvuista 10, 20, 50 ja 100.\n\nMikä on pienin askel, jolla suurin luku mahtuu akselille?","vastaus":50,"vinkki":"Kokeile askelia pienimmästä alkaen: montako ruutua luku 460 vaatii kullakin askeleella?","selitys":"Askeleella 10 tarvittaisiin 46 ruutua ja askeleella 20 tarvittaisiin 23 ruutua, eikä kumpikaan mahdu. Askeleella 50 luku 460 on 9,2 ruudun korkeudella, ja akselille mahtuu 12 ruutua eli luvut 600:aan asti. Pienin sopiva askel on 50.","tyyppi":"luku"},{"id":"H17","ryhma":"piirra","kysymys":"Joku laski osuuksien 1/3, 1/4 ja 5/12 keskuskulmiksi 120°, 90° ja 140°. Yksi kulmista on laskettu väärin.\n\nMikä on väärin lasketun kulman oikea suuruus asteina?","vastaus":150,"vinkki":"Laske ensin kulmien summa. Tarkista sitten jokainen kulma erikseen.","selitys":"Summa on 120° + 90° + 140° = 350°, ei 360°, joten jokin on väärin. 1/3 · 360° = 120° ja 1/4 · 360° = 90° ovat oikein. 5/12 · 360° = 5 · 30° = 150°, joten 140° on väärin. Korjattuna summa on 360°.","tyyppi":"luku"},{"id":"H18","ryhma":"piirra","kysymys":"Haluat näyttää, miten kuntosalisi jäsenmäärä on kehittynyt kuukaudesta toiseen vuoden aikana ja onko suunta nouseva vai laskeva.\n\nMikä diagrammi näyttää tämän selvimmin?","vastaus":1,"vinkki":"Kuvataanko osuuksia, vertailua vai muutosta ajan kuluessa?","selitys":"Aineisto kuvaa muutosta ajan kuluessa, ja viiva näyttää kehityksen suunnan selvimmin. Sektoridiagrammi ei sovi, koska eri kuukausien jäsenmäärät eivät ole saman kokonaisuuden osia.","tyyppi":"monivalinta","vaihtoehdot":["Pylväsdiagrammi","Viivadiagrammi","Sektoridiagrammi"]},{"id":"H19","ryhma":"piirra","kysymys":"Haluat näyttää, kuinka suuren osan viikkorahastasi käytät ruokaan, vaatteisiin, peleihin ja säästöön, kun koko viikkoraha jakautuu näihin neljään.\n\nMikä diagrammi näyttää tämän selvimmin?","vastaus":2,"vinkki":"Muodostavatko osat yhdessä kokonaisuuden?","selitys":"Kysymys on osuuksista: kuinka suuri osa koko viikkorahasta menee kuhunkin. Neljä osaa muodostavat yhdessä koko viikkorahan, joten sektoridiagrammi näyttää osuudet suoraan.","tyyppi":"monivalinta","vaihtoehdot":["Pylväsdiagrammi","Viivadiagrammi","Sektoridiagrammi"]},{"id":"H20","ryhma":"piirra","kysymys":"Haluat vertailla Suomen viiden suurimman järven pinta-aloja.\n\nMikä diagrammi sopii tähän?","vastaus":0,"vinkki":"Onko järvien järjestyksessä aikaa? Muodostavatko järvet yhdessä kokonaisuuden, jonka osuuksia halutaan näyttää?","selitys":"Kysymys on vertailusta, ja järvet ovat erillisiä kohteita, joten pylväät sopivat. Viiva järvien välillä väittäisi järjestykselle merkityksen, jota sillä ei ole. Sektoridiagrammi näyttäisi osuudet viiden järven yhteispinta-alasta, mutta sitä ei kysytty.","tyyppi":"monivalinta","vaihtoehdot":["Pylväsdiagrammi","Viivadiagrammi","Sektoridiagrammi"]}],"valmis_teksti":"Osaat lukea pylväs-, viiva- ja sektoridiagrammeja, myös asteikolta, jonka merkkien välissä on apuviivoja, ja tunnistat pystyakselin, joka ei ala nollasta. Lasket sektorin keskuskulman osuudesta tai lukumääristä, tarkistat että kulmien summa on 360°, ja piirrät diagrammin otsikoineen, akseleineen, yksiköineen ja asteikkoineen. Perustelet diagrammin valinnan sillä, kuvataanko osuuksia, vertailua vai muutosta ajan kuluessa. Tämä taito on nyt näytetty."};

const esc = s => s;
const osat = D.teksti.map(o=>{
  switch(o.tyyppi){
    case "johdanto":
      return `<p class="lead">${esc(o.sisalto)}</p>`;
    case "kappale":
      return `<h2>${esc(o.otsikko)}</h2><p>${esc(o.sisalto)}</p>`;
    case "saanto":
      return `<div class="box"><h3>${esc(o.otsikko)}</h3><ol class="steps">${
        o.askeleet.map(a=>`<li><span>${esc(a)}</span></li>`).join("")}</ol></div>`;
    case "taulukko":
      return `<div class="box"><h3>${esc(o.otsikko)}</h3><div class="tablewrap"><table><thead><tr>${
        o.otsikkorivi.map(h=>`<th>${h}</th>`).join("")}</tr></thead><tbody>${
        o.rivit.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join("")}</tr>`).join("")}</tbody></table></div></div>`;
    case "ansa":
      return `<div class="box warn"><h3>${esc(o.otsikko)}</h3><p style="margin:0">${esc(o.sisalto)}</p></div>`;
    case "muistilappu":
      return `<div class="box note"><h3>${esc(o.otsikko)}</h3><ul class="notes">${
        o.kohdat.map(k=>`<li>${esc(k)}</li>`).join("")}</ul></div>`;
    case "numerotaulu":
      return `<div class="box nt"><h3>${esc(o.otsikko)}</h3><p class="ohje">${esc(o.sisalto)}</p>
        <div class="nt-valinta" id="ntValinta"></div>
        <div class="nt-taulu" id="ntTaulu"></div>
        <p class="nt-selite" id="ntSelite"></p></div>`;
    case "vahvuusportaat":
      return `<div class="box vp"><h3>${esc(o.otsikko)}</h3><p class="ohje">${esc(o.sisalto)}</p>
        <div class="vp-tasot">${o.tasot.map(t=>
          `<div class="vp-taso" data-taso="${t.id}"><span class="vp-pallo"></span>
           <div><strong>${t.nimi}</strong><span>${t.selite}</span></div></div>`).join("")}</div>
        <div class="vp-lauseke" id="vpLauseke"></div>
        <div class="vp-rivi"><button type="button" class="btn ghost" id="vpSeuraava">Toinen lauseke</button>
        <span class="vp-vastaus" id="vpVastaus"></span></div></div>`;
    case "laskujarjestys":
      return `<div class="box lj"><h3>${esc(o.otsikko)}</h3><p style="margin:0 0 12px;font-size:14.5px;color:var(--ink-2)">${esc(o.sisalto)}</p>
        <div class="lj-exp" id="ljExp"></div>
        <div class="lj-fb" id="ljFb"></div>
        <div class="lj-row"><button type="button" class="btn ghost" id="ljSeuraava">Toinen lauseke</button>
        <span class="lj-step" id="ljStep"></span></div></div>`;
    case "lukusuora":
      return `<div class="box nl"><h3>${esc(o.otsikko)}</h3><p style="margin:0 0 8px;font-size:14.5px;color:var(--ink-2)">${esc(o.sisalto)}</p>

/* ---------- lukusuora ---------- */
const svg=document.getElementById("nlsvg"), rng=document.getElementById("nlrange"), out=document.getElementById("nlout");
const X0=34, X1=606, Y=62;
function piirraNL(v){
  const ala=Math.floor(v/10)*10, yla=ala+10, puoli=ala+5;
  const pyor = (v%10)>=5 ? yla : ala;
  const x = n => X0 + (n/100)*(X1-X0);
  let s=`<line class="rail" x1="${X0}" y1="${Y}" x2="${X1}" y2="${Y}"/>`;
  for(let n=0;n<=100;n+=10){
    const near = (n===ala||n===yla);
    s+=`<line class="tick" x1="${x(n)}" y1="${Y-7}" x2="${x(n)}" y2="${Y+7}"/>`;
    s+=`<text class="stop${near?" near":""}" x="${x(n)}" y="${Y+24}" text-anchor="middle">${n}</text>`;
  }
  s+=`<line class="halfway" x1="${x(puoli)}" y1="${Y-16}" x2="${x(puoli)}" y2="${Y+12}"/>`;
  s+=`<text class="stop" x="${x(puoli)}" y="${Y-22}" text-anchor="middle">puoliväli ${puoli}</text>`;
  s+=`<circle class="dot" cx="${x(v)}" cy="${Y}" r="6"/>`;
  s+=`<text class="val" x="${x(v)}" y="${Y-32}" text-anchor="middle">${v}</text>`;
  s+=`<path d="M ${x(v)} ${Y+38} L ${x(pyor)} ${Y+38}" stroke="var(--core)" stroke-width="2" fill="none"/>`;
  s+=`<path d="M ${x(pyor)} ${Y+38} l ${x(pyor)>x(v)?-7:7} -4 l 0 8 z" fill="var(--core)"/>`;
  svg.innerHTML=s;
  out.textContent = `${v} pyöristyy → ${pyor}`;
}
if(svg){ piirraNL(+rng.value); rng.addEventListener("input",e=>piirraNL(+e.target.value)); }

/* ---------- laskujärjestys-widget ---------- */
const ljExp=document.getElementById("ljExp");
if(ljExp && D.kokeilu){
  let ljI=0, ljTokens=[], ljStep=0;
  const laske=(a,op,b)=>{a=+a;b=+b;return op==="×"?a*b:op==="÷"?a/b:op==="+"?a+b:a-b;};
  function ljAlku(){
    const l=D.kokeilu[ljI];
    ljTokens=l.lauseke.replace(/\(/g,"( ").replace(/\)/g," )").split(/\s+/).filter(Boolean);
    ljStep=0; ljPiirra(); ljViesti("","");
  }
  function ljViesti(t,lk){const f=document.getElementById("ljFb"); f.textContent=t; f.className="lj-fb "+(lk||"");}
  function ljPiirra(){
    const l=D.kokeilu[ljI];
    document.getElementById("ljStep").textContent =
      ljStep>=l.askeleet.length ? "valmis" : `askel ${ljStep+1} / ${l.askeleet.length}`;
    if(ljStep>=l.askeleet.length){
      ljExp.innerHTML=`<span class="valmis">${l.lauseke} = ${l.vastaus}</span>`;
      return;
    }
    ljExp.innerHTML=ljTokens.map((t,i)=>
      "×÷+−".includes(t) ? `<button type="button" class="op" data-i="${i}">${t}</button>`
                         : `<span class="tok">${t}</span>`).join("");
    ljExp.querySelectorAll("button.op").forEach(b=>b.addEventListener("click",()=>ljKlikkaa(+b.dataset.i)));
  }
  function ljKlikkaa(i){
    const l=D.kokeilu[ljI], odotettu=l.askeleet[ljStep];
    const ehdotus=[ljTokens[i-1],ljTokens[i],ljTokens[i+1]].join(" ");
    if(ehdotus!==odotettu){
      ljViesti(ljStep===0
        ? "Ei vielä. Sulkeet ovat vahvimmat, sitten kerto ja jako. Yhtä vahvat vasemmalta oikealle."
        : "Ei vielä. Kumpi jäljellä olevista on vahvempi?", "no");
      return;
    }
    const arvo=laske(ljTokens[i-1],ljTokens[i],ljTokens[i+1]);
    let alku=i-1, loppu=i+1;
    if(ljTokens[i-2]==="(" && ljTokens[i+2]===")"){ alku=i-2; loppu=i+2; }
    ljTokens.splice(alku, loppu-alku+1, String(arvo));
    ljStep++;
    ljViesti(ljStep>=l.askeleet.length ? "Valmis. Vastaus on "+l.vastaus+"." : "Oikein. Jatka seuraavaan.", "ok");
    ljPiirra();
  }
  document.getElementById("ljSeuraava").addEventListener("click",()=>{
    ljI=(ljI+1)%D.kokeilu.length; ljAlku();
  });
  ljAlku();
}

};

/* Suomalainen lukumuoto: välilyönti on tuhaterotin, pilkku desimaalierotin.
   Piste voi olla kumpi tahansa. Se tulkitaan tuhaterottimeksi VAIN silloin, kun
   koko luku on aitoa tuhaterotinmuotoa: alkuosa 1–3 numeroa ilman etunollaa ja
   jokainen jatko-osa täsmälleen 3 numeroa (1.500, 12.345.678). Kaikissa muissa
   tapauksissa piste on desimaalipiste — myös 0.125, joka vanhalla säännöllä
   ("3 numeroa pisteen jäljessä = tuhaterotin") luettiin virheellisesti luvuksi 125. */
const TUHATEROTIN = /^[1-9]\d{0,2}(\.\d{3})+$/;
function lueLuku(teksti){
  // Murtoluku (3/4, -3/4) ja sekaluku (1 2/3, -1 2/3) hyväksytään sellaisinaan.
  const raaka = String(teksti).replace(/\u00a0/g, " ").trim();
  let m = raaka.match(/^(-?)(\d+)\s+(\d+)\s*\/\s*(\d+)$/);
  if(m){ const nim = Number(m[4]); if(nim === 0) return null;
    const v = Number(m[2]) + Number(m[3]) / nim; return m[1] ? -v : v; }
  m = raaka.match(/^(-?)\s*(\d+)\s*\/\s*(\d+)$/);
  if(m){ const nim = Number(m[3]); if(nim === 0) return null;
    const v = Number(m[2]) / nim; return m[1] ? -v : v; }
  let s = String(teksti).replace(/[\s\u00a0]/g, "");
  if(s === "") return null;
  if(s.indexOf(",") >= 0){
    s = s.replace(/\./g, "").replace(",", ".");
  } else if(TUHATEROTIN.test(s)){
    s = s.replace(/\./g, "");
  }
  const n = Number(s);
  return Number.isFinite(n) ? n : null;
}

function tarkista(id){
  const h=D.harjoitukset.find(x=>x.id===id);
  const kentta=document.getElementById("in-"+id);
  const fb=document.getElementById("fb-"+id);
  if(kentta.value.trim()===""){ fb.className="fb hint"; fb.textContent="Kirjoita vastaus ensin."; return; }
  const luku=lueLuku(kentta.value);
  if(luku===null){ fb.className="fb no"; fb.textContent="Vastauksen pitää olla luku tai murtoluku (esimerkiksi 3/4)."; return; }
  const oikein = Math.abs(luku - h.vastaus) < 1e-9;
  merkitseTulos(id, oikein, oikein ? "Oikein. "+h.selitys : `Ei vielä. ${h.vinkki} Kokeile uudelleen.`);
}

function tarkistaMonivalinta(id, valittuIndeksi, painike){
  const h=D.harjoitukset.find(x=>x.id===id);
  const rivi=painike.closest(".row");
  rivi.querySelectorAll(".mv-valinta").forEach(b=>b.disabled=true);
  const oikein = valittuIndeksi===h.vastaus;
  painike.classList.add(oikein?"mv-oikein":"mv-vaarin");
  if(!oikein){
    const oikeaBtn=rivi.querySelector(`[data-i="${h.vastaus}"]`);
    if(oikeaBtn) oikeaBtn.classList.add("mv-oikein");
  }
  merkitseTulos(id, oikein, oikein ? "Oikein. "+h.selitys : `Ei ihan. Oikea vastaus on korostettu. ${h.selitys||""}`);
}

/* Kuuntelu: selain lukee tekstin ääneen omalla puhesynteesillään (englanniksi, jos laitteessa on
   englanninkielinen ääni). Ei äänitiedostoja eikä verkkoyhteyttä. Jos laite ei osaa puhua,
   teksti näytetään luettavaksi — silloin tehtävä muuttuu luetun ymmärtämiseksi, mutta ei katkea. */
function puhu(id, nopeus){
  const h=D.harjoitukset.find(x=>x.id===id); if(!h || !h.kuuntele) return;
  const vara=document.getElementById("vara-"+id);
  const naytaTeksti=syy=>{ vara.hidden=false; vara.textContent=syy+" Teksti: "+h.kuuntele; };
  if(!("speechSynthesis" in window)){ naytaTeksti("Tämä laite ei osaa lukea ääneen."); return; }
  const s=window.speechSynthesis; s.cancel();
  const u=new SpeechSynthesisUtterance(h.kuuntele);
  u.lang=h.kieli||"en-GB"; u.rate=nopeus;
  const aanet=s.getVoices(), kieli=u.lang.slice(0,2);
  const aani=aanet.find(a=>a.lang===u.lang) || aanet.find(a=>a.lang && a.lang.startsWith(kieli));
  if(aani) u.voice=aani;
  else if(aanet.length) { naytaTeksti("Laitteessa ei ole englanninkielistä ääntä."); return; }
  u.onerror=()=>naytaTeksti("Ääneen lukeminen ei onnistunut.");
  s.speak(u);
}
