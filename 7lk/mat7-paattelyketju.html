<title>Päättelyketju</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">

<style>
:root{
  --paper:#EFF2F5; --surface:#FFFFFF; --surface-2:#F7F9FB;
  --grid:#DCE3EA; --line:#C9D3DC;
  --ink:#15222C; --ink-2:#4E626F; --ink-3:#7E8F9B;
  --core:#1B5A9E; --core-soft:#E4EDF6;
  --strong:#1F6E5C; --strong-soft:#E1F0EB;
  --chal:#9A6A16; --chal-soft:#F6EDDC;
  --alert:#A33A2B; --alert-soft:#F8E7E3;
  --shadow:0 1px 2px rgba(21,34,44,.06), 0 8px 24px -12px rgba(21,34,44,.18);
  --r:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0F161B; --surface:#18222A; --surface-2:#1D2830;
    --grid:#22303A; --line:#2E3E4A;
    --ink:#E8EFF4; --ink-2:#A3B4C0; --ink-3:#7A8B97;
    --core:#7FB2E4; --core-soft:#16303F;
    --strong:#77CDB4; --strong-soft:#123028;
    --chal:#E0B267; --chal-soft:#33270F;
    --alert:#E8907F; --alert-soft:#3A1E19;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -14px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --paper:#0F161B; --surface:#18222A; --surface-2:#1D2830;
  --grid:#22303A; --line:#2E3E4A;
  --ink:#E8EFF4; --ink-2:#A3B4C0; --ink-3:#7A8B97;
  --core:#7FB2E4; --core-soft:#16303F;
  --strong:#77CDB4; --strong-soft:#123028;
  --chal:#E0B267; --chal-soft:#33270F;
  --alert:#E8907F; --alert-soft:#3A1E19;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -14px rgba(0,0,0,.7);
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:16px; line-height:1.62;
  background-image:
    linear-gradient(to right, var(--grid) 1px, transparent 1px),
    linear-gradient(to bottom, var(--grid) 1px, transparent 1px);
  background-size:26px 26px;
}
.wrap{max-width:760px; margin:0 auto; padding:28px 20px 90px}
h1,h2,h3,h4{font-family:"Familjen Grotesk","IBM Plex Sans",system-ui,sans-serif; text-wrap:balance}

/* header */
header.top{background:var(--surface); border:1px solid var(--line); border-radius:var(--r);
  box-shadow:var(--shadow); padding:22px 24px; display:flex; gap:18px; align-items:flex-start}
.badge{flex:0 0 auto; width:54px; height:54px; border-radius:9px; display:grid; place-items:center;
  background:var(--core-soft); border:1px solid var(--core); color:var(--core)}
.badge svg{width:28px; height:28px; fill:none; stroke:currentColor; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round}
.eyebrow{font-family:"IBM Plex Mono",monospace; font-size:11px; letter-spacing:.14em;
  text-transform:uppercase; color:var(--ink-3); margin:0 0 5px}
header.top h1{margin:0; font-size:30px; font-weight:700; letter-spacing:-.015em}
header.top p{margin:5px 0 0; color:var(--ink-2); font-size:15px}
.tags{display:flex; flex-wrap:wrap; gap:5px; margin-top:11px}
.tag{font-family:"IBM Plex Mono",monospace; font-size:10.5px; letter-spacing:.05em; padding:2px 7px;
  border-radius:4px; background:var(--surface-2); border:1px solid var(--line); color:var(--ink-3)}
.tag.core{background:var(--core-soft); border-color:var(--core); color:var(--core)}

/* teksti */
article{margin-top:26px}
article h2{font-size:21px; font-weight:600; margin:32px 0 10px; letter-spacing:-.01em}
article p{margin:0 0 14px; max-width:64ch}
.lead{font-size:17.5px; color:var(--ink); border-left:3px solid var(--core); padding-left:16px; margin:0 0 8px}

.box{background:var(--surface); border:1px solid var(--line); border-radius:var(--r);
  padding:18px 22px; box-shadow:var(--shadow); margin:22px 0}
.box h3{margin:0 0 12px; font-size:16.5px; font-weight:600}
.box.warn{border-left:3px solid var(--alert)}
.box.note{border-left:3px solid var(--chal)}

ol.steps{margin:0; padding-left:0; list-style:none; counter-reset:s; display:grid; gap:12px}
ol.steps li{counter-increment:s; display:grid; grid-template-columns:auto 1fr; gap:13px; align-items:start}
ol.steps li::before{content:counter(s); font-family:"Familjen Grotesk",sans-serif; font-weight:700; font-size:14px;
  width:26px; height:26px; border-radius:50%; background:var(--core); color:#fff; display:grid; place-items:center; margin-top:2px}

ul.notes{margin:0; padding-left:19px}
ul.notes li{margin-bottom:7px}
ul.notes li:last-child{margin-bottom:0}

.tablewrap{overflow-x:auto}
table{border-collapse:collapse; width:100%; font-size:14.5px; min-width:460px}
th,td{text-align:left; padding:9px 13px; border-bottom:1px solid var(--line)}
th{font-family:"IBM Plex Mono",monospace; font-size:10.5px; letter-spacing:.1em; text-transform:uppercase;
  color:var(--ink-3); font-weight:400; background:var(--surface-2)}
tr:last-child td{border-bottom:0}
td b{color:var(--core); font-weight:600}
td:last-child{font-variant-numeric:tabular-nums; font-weight:600}

/* lukusuora */
.nl svg{width:100%; height:118px; display:block}
.nl .rail{stroke:var(--line); stroke-width:2}
.nl .tick{stroke:var(--line); stroke-width:1.5}
.nl .stop{fill:var(--ink-3); font-family:"IBM Plex Mono",monospace; font-size:11px}
.nl .stop.near{fill:var(--core); font-weight:600}
.nl .dot{fill:var(--chal)}
.nl .val{fill:var(--ink); font-family:"Familjen Grotesk",sans-serif; font-size:15px; font-weight:700}
.nl .halfway{stroke:var(--chal); stroke-dasharray:3 3; stroke-width:1.5}
.nl-controls{display:flex; align-items:center; gap:14px; margin-top:6px}
.nl-controls input{flex:1; accent-color:var(--core)}
.nl-out{font-family:"Familjen Grotesk",sans-serif; font-size:15px; font-weight:600; min-width:12.5em; text-align:right}

/* paikka-arvotaulu */
.box .ohje{margin:0 0 14px; font-size:14.5px; color:var(--ink-2)}
.nt-valinta{display:flex; flex-wrap:wrap; gap:7px; margin-bottom:16px}
.nt-valinta button{font:inherit; font-size:12.5px; font-family:"IBM Plex Mono",monospace; padding:5px 11px;
  border-radius:6px; border:1px solid var(--line); background:var(--surface-2); color:var(--ink-2); cursor:pointer}
.nt-valinta button[aria-pressed="true"]{background:var(--ink); color:var(--paper); border-color:var(--ink)}
.nt-valinta button:focus-visible{outline:2px solid var(--core); outline-offset:2px}
.nt-taulu{display:flex; flex-direction:column; gap:4px; align-items:flex-start; overflow-x:auto; padding-bottom:4px}
.nt-rivi{display:flex; gap:6px; align-items:center}
.nt-rivi .otsa{font-family:"IBM Plex Mono",monospace; font-size:9.5px; letter-spacing:.08em;
  text-transform:uppercase; color:var(--ink-3); width:52px; text-align:center}
.nt-ruutu{width:52px; height:52px; display:grid; place-items:center; border:1.5px solid var(--line);
  border-radius:7px; background:var(--surface-2); font-family:"IBM Plex Mono",monospace; font-size:24px}
.nt-ruutu.kohta{border-color:var(--core); background:var(--core-soft); color:var(--core); font-weight:500}
.nt-ruutu.ratkaiseva{border-color:var(--chal); background:var(--chal-soft); color:var(--chal); font-weight:500}
.nt-ruutu.nolla{color:var(--ink-3)}
.nt-rivi .nimi{font-size:12.5px; color:var(--ink-3); margin-left:12px; white-space:nowrap}
.nt-nuoli{font-size:17px; color:var(--chal); margin-left:6px}
.nt-selite{margin:14px 0 0; font-size:14.5px}
.nt-selite b{color:var(--core)}

/* vahvuusportaat */
.vp-tasot{display:grid; gap:9px; margin-bottom:18px}
.vp-taso{display:flex; gap:11px; align-items:flex-start; font-size:13.5px}
.vp-taso .vp-pallo{width:13px; height:13px; border-radius:4px; margin-top:5px; flex:0 0 auto}
.vp-taso[data-taso="sulkeet"] .vp-pallo{background:var(--core)}
.vp-taso[data-taso="kertojako"] .vp-pallo{background:var(--strong)}
.vp-taso[data-taso="yhteenvahennys"] .vp-pallo{background:var(--chal)}
.vp-taso strong{display:block; font-family:"Familjen Grotesk",sans-serif; font-weight:600; font-size:14.5px}
.vp-taso span{color:var(--ink-2)}
.vp-lauseke{display:flex; flex-wrap:wrap; gap:7px; align-items:flex-end; font-family:"IBM Plex Mono",monospace;
  font-size:25px; padding:10px 2px; min-height:64px}
.vp-lauseke .t{padding:2px 3px}
.vp-lauseke .op{position:relative; padding:2px 9px; border-radius:6px; font-weight:500}
.vp-lauseke .op[data-taso="sulkeet"]{background:var(--core-soft); color:var(--core)}
.vp-lauseke .op[data-taso="kertojako"]{background:var(--strong-soft); color:var(--strong)}
.vp-lauseke .op[data-taso="yhteenvahennys"]{background:var(--chal-soft); color:var(--chal)}
.vp-lauseke .op i{position:absolute; top:-9px; right:-6px; font-style:normal; font-family:"Familjen Grotesk",sans-serif;
  font-size:11px; font-weight:700; width:18px; height:18px; border-radius:50%; display:grid; place-items:center;
  background:currentColor}
.vp-lauseke .op i span{color:var(--surface)}
.vp-rivi{display:flex; align-items:center; gap:16px; margin-top:8px}
.vp-vastaus{font-family:"Familjen Grotesk",sans-serif; font-size:16px; font-weight:600; color:var(--strong)}

/* laskujärjestys-widget */
.lj-exp{display:flex; flex-wrap:wrap; gap:7px; align-items:center; font-family:"IBM Plex Mono",monospace;
  font-size:23px; padding:14px 4px; min-height:62px}
.lj-exp .tok{padding:2px 4px; color:var(--ink)}
.lj-exp button.op{font-family:"IBM Plex Mono",monospace; font-size:23px; padding:3px 12px; border-radius:7px;
  border:1.5px solid var(--line); background:var(--surface-2); color:var(--ink); line-height:1.2}
.lj-exp button.op:hover{border-color:var(--core); color:var(--core)}
.lj-exp button.op:focus-visible{outline:2px solid var(--core); outline-offset:2px}
.lj-exp .valmis{font-family:"Familjen Grotesk",sans-serif; font-size:23px; font-weight:700; color:var(--strong)}
.lj-fb{font-size:14.5px; min-height:1.5em; color:var(--ink-2)}
.lj-fb.no{color:var(--alert)}
.lj-fb.ok{color:var(--strong)}
.lj-row{display:flex; align-items:center; gap:14px; margin-top:10px}
.lj-step{font-family:"IBM Plex Mono",monospace; font-size:11.5px; letter-spacing:.1em;
  text-transform:uppercase; color:var(--ink-3)}

/* harjoitukset */
.progress{position:sticky; top:0; z-index:5; background:var(--surface); border:1px solid var(--line);
  border-radius:var(--r); padding:12px 18px; box-shadow:var(--shadow); display:flex; align-items:center;
  gap:14px; margin:34px 0 18px}
.progress .lbl{font-family:"IBM Plex Mono",monospace; font-size:11px; letter-spacing:.12em;
  text-transform:uppercase; color:var(--ink-3); white-space:nowrap}
.progress .meter{flex:1; height:7px; border-radius:4px; background:var(--surface-2); border:1px solid var(--line); overflow:hidden}
.progress .meter i{display:block; height:100%; background:var(--core); transition:width .25s ease}
.progress .cnt{font-family:"Familjen Grotesk",sans-serif; font-weight:700; font-variant-numeric:tabular-nums; white-space:nowrap}

.grp{margin-top:26px}
.grp-head{display:flex; align-items:baseline; gap:10px; border-bottom:1.5px solid var(--ink); padding-bottom:7px; margin-bottom:14px}
.grp-head h3{margin:0; font-size:17px; font-weight:600}
.grp-head span{font-size:12.5px; color:var(--ink-2)}

.ex{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:14px 16px; margin-bottom:10px}
.ex[data-tila="oikein"]{border-color:var(--strong); box-shadow:inset 3px 0 0 var(--strong)}
.ex[data-tila="vaarin"]{border-color:var(--alert); box-shadow:inset 3px 0 0 var(--alert)}
.ex .q{display:flex; gap:11px; align-items:baseline; flex-wrap:wrap}
.ex .num{font-family:"IBM Plex Mono",monospace; font-size:11.5px; color:var(--ink-3); min-width:2.4em}
.ex .txt{flex:1; min-width:190px; font-size:15.5px}
.ex .txt .aineisto{display:block; margin-bottom:9px; padding-left:12px;
  border-left:2px solid var(--line); color:var(--ink-2); line-height:1.6;
  /* Aineisto voi olla pieni taulukko, jonka rivit on erotettu rivinvaihdoilla.
     Ilman pre-lineä ne valuisivat yhdeksi kappaleeksi ja taulukko katoaisi. */
  white-space:pre-line}
.ex .txt .kysymysrivi{display:block; font-weight:600}
.ex .row{display:flex; gap:8px; align-items:center; margin-top:11px; flex-wrap:wrap}
.ex input[type=text]{font:inherit; font-family:"IBM Plex Mono",monospace; font-size:15px; width:8.5em;
  padding:7px 11px; border:1px solid var(--line); border-radius:7px; background:var(--surface-2);
  color:var(--ink); text-align:right}
.ex input:focus-visible{outline:2px solid var(--core); outline-offset:1px}
button{font:inherit; cursor:pointer}
.btn{font-size:13.5px; padding:7px 15px; border-radius:7px; border:1px solid var(--core);
  background:var(--core); color:#fff}
.btn.ghost{background:transparent; color:var(--ink-2); border-color:var(--line)}
.btn:focus-visible{outline:2px solid var(--core); outline-offset:2px}
.btn.mv-valinta{text-align:left}
/* kuuntelutehtävä: selaimen puhesynteesi lukee englanninkielisen tekstin */
.kuuntele{display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin:2px 0 10px}
.kuuntele .btn{display:inline-flex; gap:7px; align-items:center}
.kuuntele svg{width:16px; height:16px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round}
.kuuntele .varateksti{flex-basis:100%; font-size:14px; color:var(--ink-2); background:var(--surface-2);
  border-radius:7px; padding:8px 12px; margin:0}
.btn.mv-valinta:disabled{cursor:default; opacity:.65}
.btn.mv-oikein{background:var(--strong-soft); border-color:var(--strong); color:var(--strong); opacity:1}
.btn.mv-vaarin{background:var(--alert-soft); border-color:var(--alert); color:var(--alert); opacity:1}
.row.mv{gap:8px 10px}
.fb{margin-top:11px; font-size:14.5px; padding:10px 13px; border-radius:8px; line-height:1.5}
.fb.ok{background:var(--strong-soft); color:var(--strong)}
.fb.no{background:var(--alert-soft); color:var(--alert)}
.fb.hint{background:var(--chal-soft); color:var(--chal)}

.done{background:var(--strong-soft); border:1px solid var(--strong); color:var(--strong);
  border-radius:var(--r); padding:16px 20px; margin-top:20px; font-size:15.5px}
.done h3{margin:0 0 4px; font-size:17px; color:var(--strong)}

details.teacher{margin-top:34px; background:var(--surface); border:1px solid var(--line);
  border-left:3px solid var(--chal); border-radius:var(--r); padding:15px 20px; box-shadow:var(--shadow)}
details.teacher summary{cursor:pointer; font-family:"Familjen Grotesk",sans-serif; font-weight:600; font-size:15px}
details.teacher summary:focus-visible{outline:2px solid var(--core); outline-offset:3px}
details.teacher ul{margin:12px 0 0; padding-left:19px; color:var(--ink-2); font-size:14.5px}
details.teacher li{margin-bottom:8px}
details.teacher p{margin:12px 0 0; color:var(--ink-2); font-size:14.5px}

.back{display:inline-block; margin-top:30px; font-size:13.5px; color:var(--ink-2)}
.back a{color:var(--core)}

@media (prefers-reduced-motion: reduce){*{transition:none !important}}
@media (max-width:560px){
  .wrap{padding:16px 13px 70px}
  header.top h1{font-size:25px}
  .progress{flex-wrap:wrap}
}
</style>

<div class="wrap">

  <header class="top">
    <span class="badge"><svg viewBox="0 0 24 24" aria-hidden="true" id="ikoni"></svg></span>
    <div>
      <p class="eyebrow" id="eyebrow"></p>
      <h1 id="otsikko"></h1>
      <p id="kuvaus"></p>
      <div class="tags" id="tags"></div>
    </div>
  </header>

  <article id="teksti"></article>

  <div class="progress" aria-live="polite">
    <span class="lbl">Harjoitukset</span>
    <span class="meter"><i id="pbar" style="width:0%"></i></span>
    <span class="cnt" id="pcnt">0 / 20</span>
  </div>

  <div id="harjoitukset"></div>
  <div id="valmis"></div>

  <p class="back" id="back"></p>

</div>

<script>
const D = {"tavoite_id":"MAT7-GEO-09","oppiaine":"MAT","vuosiluokka":7,"taso":"haaste","otsikko":"Päättelyketju","kuvaus":"Osaan perustella monivaiheisen kulmapäättelyn aukottomasti.","versio":"0.2","paivitetty":"2026-10-04","ops":{"T":["T4","T5","T10","T17"],"S":["S1","S5"]},"ikoni":"jarjestys","eyebrow":"Matematiikka · 7. luokka · Geometria","teksti":[{"tyyppi":"johdanto","sisalto":"Pakohuonepelissä laserin säteen pitää osua lukon anturiin kahden peilin kautta. Peilit ovat kiinni seinässä, joten kokeilemalla ei pääse eteenpäin: pitää päätellä, mihin suuntaan säde lähtee jälkimmäisestä peilistä. Tunnetusta kulmasta saadaan seuraava ja siitä taas seuraava, kunnes kysytty kulma on selvillä. Tällaista päättelyä kutsutaan päättelyketjuksi. Olet jo oppinut yksittäiset tiedot: vieruskulmat, ristikulmat, samankohtaiset kulmat, kulmien summan ja kehäkulman. Tässä taidossa yhdistät niitä usean vaiheen ketjuiksi ja kirjoitat ketjun niin, että kuka tahansa voi lukea sen alusta loppuun ja tarkistaa jokaisen askeleen."},{"tyyppi":"kappale","otsikko":"Ketju: väite ja perustelu","sisalto":"Päättelyketjussa jokainen rivi on väite ja sen perustelu. Väite kertoo, kuinka suuri jokin kulma on. Perustelu kertoo, mihin väite nojaa: annettuun tietoon, aiemman rivin tulokseen ja nimettyyn tietoon, kuten ”ristikulmat”. Monessa tehtävässä käytetään vakiokuviota: Suorat l ja s kulkevat vasemmalta oikealle, l ylempänä. Suoralla l ovat vasemmalta oikealle pisteet P, A ja Q, suoralla s pisteet R, B ja T. Vino suora k kulkee pisteiden A ja B kautta; pisteen A yläpuolella suoralla k on piste C ja pisteen B alapuolella piste D. Tehtävä kertoo erikseen, ovatko l ja s yhdensuuntaiset (l ∥ s). Esimerkki: l ∥ s, pisteet A ja T on yhdistetty janalla, ∠PAC = 110° ja ∠ATB = 35°. Kysytään kulmaa BAT. 1) ∠RBA = 110°, koska ∠PAC ja ∠RBA ovat samankohtaiset kulmat ja l ∥ s. 2) ∠ABT = 180° − 110° = 70°, koska ∠RBA ja ∠ABT ovat vieruskulmat. 3) ∠BAT = 180° − 70° − 35° = 75°, koska kolmion ABT kulmien summa on 180°. Jokainen luku on joko annettu tai laskettu aiemmalla rivillä, joten ketju on luettavissa alusta loppuun. Ensimmäinen sallittu lyhenne on vuorokulmat: vakiokuviossa ∠QAB = ∠TBD (samankohtaiset kulmat, l ∥ s) ja ∠TBD = ∠ABR (ristikulmat), joten ∠QAB = ∠ABR. Tällaiset kulmat ovat leikkaavan suoran eri puolilla ja yhdensuuntaisten suorien välissä, ja niitä kutsutaan vuorokulmiksi. Kun l ∥ s, voit kirjoittaa perusteluksi ”vuorokulmat, l ∥ s”, koska se on lyhenne kahdesta tiedosta, jotka jo osaat."},{"tyyppi":"taulukko","otsikko":"Tiedot, joihin perustelet","otsikkorivi":["Tieto","Mitä se sanoo","Kirjoita perusteluksi esimerkiksi"],"rivit":[["Vieruskulmat","Vieruskulmien summa on 180°. Myös kolme vierekkäistä kulmaa, jotka täyttävät suoran toisen puolen, ovat yhteensä 180°.","vieruskulmat; C, A ja B ovat samalla suoralla"],["Ristikulmat","Kahden suoran leikkauspisteen vastakkaiset kulmat ovat yhtä suuret.","ristikulmat"],["Samankohtaiset kulmat","Jos l ∥ s, samankohtaiset kulmat ovat yhtä suuret. Ilman tietoa l ∥ s tätä ei saa käyttää.","samankohtaiset kulmat, l ∥ s"],["Kolmion kulmien summa","Kolmion kulmat ovat yhteensä 180°.","kolmion ABT kulmien summa"],["Monikulmion kulmien summa","n-kulmion kulmat ovat yhteensä (n − 2) · 180°.","viisikulmion kulmien summa 540°"],["Tasakylkisen kolmion kantakulmat","Jos kolmion kaksi sivua ovat yhtä pitkät, niiden vastaiset kulmat ovat yhtä suuret.","kolmio ABD on tasakylkinen, koska AD = BD"],["Ympyrän säteet","Janat keskipisteestä kehälle ovat säteitä ja yhtä pitkiä, joten kolmio, jonka kaksi sivua ovat säteitä, on tasakylkinen.","OA ja OB ovat säteitä"],["Kehäkulma ja keskuskulma","Kehäkulma on puolet samaa kaarta vastaavasta keskuskulmasta. Siksi samaa kaarta vastaavat kehäkulmat ovat yhtä suuret.","kehäkulma on puolet keskuskulmasta; samaa kaarta vastaavat kehäkulmat"],["Thaleen lause","Halkaisijaa vastaava kehäkulma on 90°.","Thaleen lause, AB on halkaisija"]]},{"tyyppi":"kappale","otsikko":"Ympyrä ketjussa","sisalto":"Ympyrätehtävissä silta kysyttyyn kulmaan on usein keskuskulma tai säteistä syntyvä tasakylkinen kolmio. Kun kuviossa on keskipiste O ja kehän pisteet A ja B, janat OA ja OB ovat säteitä, joten kolmio AOB on tasakylkinen. Kun kuviossa on kaksi kehäkulmaa, jotka vastaavat samaa kaarta, ne ovat yhtä suuret, koska kumpikin on puolet samasta keskuskulmasta. Sama keino ratkaisee nelikulmion, jonka kaikki kärjet ovat kehällä. Sitä kutsutaan jännenelikulmioksi. Olkoot nelikulmion ABCD kärjet kehällä tässä järjestyksessä ja ∠ABC = 70°. Kulma ABC vastaa kaarta ADC, joten sitä vastaava keskuskulma on 140°. Kaaret ABC ja ADC kiertävät yhdessä koko kehän, joten kaaren ABC keskuskulma on 360° − 140° = 220°. Kulma ADC vastaa kaarta ABC, joten ∠ADC = 220° : 2 = 110°. Huomaa, että 70° + 110° = 180°. Näin käy jokaisessa jännenelikulmiossa: vastakkaiset kulmat ovat yhteensä 180°, koska niitä vastaavat keskuskulmat ovat yhteensä 360°. Tämä on toinen sallittu lyhenne: kun olet ymmärtänyt tämän, voit kirjoittaa perusteluksi ”jännenelikulmion vastakkaiset kulmat ovat yhteensä 180°”."},{"tyyppi":"kappale","otsikko":"Peilit ja normaali","sisalto":"Peilitehtävissä tarvitaan yksi fysiikan tieto, heijastuslaki. Se annetaan tehtävässä: tuleva ja heijastunut säde muodostavat peilin kanssa yhtä suuret kulmat osumiskohdan eri puolilla. Fysiikassa kulma mitataan usein normaalista eli suorasta, joka on osumiskohdassa kohtisuorassa peiliä vastaan. Jos säde on normaalin HN ja peilin osan HX välissä, ∠SHN + ∠SHX = 90°. Lue siis tarkkaan, kummasta kulma on mitattu. Kahden peilin tehtävässä peilit ja säteen osa peililtä toiselle muodostavat kolmion. Esimerkki: peilit ovat puolisuorilla OX ja OY, ∠XOY = 80°, ja säde tulee pisteestä S ja osuu peiliin OX pisteessä H niin, että ∠SHX = 35°. Heijastuslain mukaan heijastunut säde HK muodostaa peilin kanssa kulman ∠KHO = 35°. Kolmion OHK kulmien summasta ∠OKH = 180° − 80° − 35° = 65°, ja heijastuslain mukaan säde lähtee peilistä OY kohti pistettä U niin, että ∠UKY = 65°. Piste Y on peilillä OY kauempana O:sta kuin K."},{"tyyppi":"saanto","otsikko":"Näin rakennat ketjun","askeleet":["Piirrä mallikuvio sanallisesta kuvauksesta. Sijoita pisteet oikeaan järjestykseen ja oikealle puolelle suoraa.","Merkitse kuvioon annetut kulmat ja annetut tiedot (l ∥ s, AB = AD, O on keskipiste, AB on halkaisija). Älä merkitse mitään, mitä ei ole annettu.","Katso kysyttyä kulmaa. Missä kolmiossa, millä suoralla tai missä ympyrässä se on? Mikä kulma sen vieressä tai samassa kolmiossa olisi silta, josta kysytty kulma ratkeaa yhdellä tiedolla?","Etsi silta annetuista kulmista. Jos se ei ratkea yhdellä tiedolla, etsi silta sillalle.","Kirjoita ketju: yksi väite riviä kohti ja jokaisen rivin perään tieto, johon se perustuu.","Tarkista, että jokainen luku on annettu tai laskettu aiemmalla rivillä. Laske tulos toista reittiä, tai tarkista lopuksi, että kolmion kulmat ovat yhteensä 180°."]},{"tyyppi":"ansa","otsikko":"Ansa 1: oletus, jota ei ole annettu","sisalto":"Samankohtaiset kulmat ovat yhtä suuret vain, jos l ∥ s on annettu. Kantakulmat ovat yhtä suuret vain, jos tiedetään, että kolmion kaksi sivua ovat yhtä pitkät. Mallikuviossa suorat voivat näyttää yhdensuuntaisilta ja kolmio tasakylkiseltä, vaikka ne eivät ole. Esimerkki: vakiokuviossa ei ole kerrottu, onko l ∥ s, pisteet A ja T on yhdistetty janalla, ∠CAQ = 76°, ∠ABT = 72° ja ∠ATB = 50°. Väärä ketju: ”Suorat ovat yhdensuuntaiset, joten ∠QAT = ∠ATB = 50°.” Oikea ketju: ∠BAT = 180° − 72° − 50° = 58° (kolmion ABT kulmien summa), ja koska C, A ja B ovat samalla suoralla, ∠QAT = 180° − 76° − 58° = 46°. Samankohtaiset kulmat ∠CAQ = 76° ja ∠ABT = 72° eivät ole yhtä suuret, joten suorat eivät edes ole yhdensuuntaiset."},{"tyyppi":"ansa","otsikko":"Ansa 2: väärä kaari tai kahdennus väärin päin","sisalto":"Keskuskulma on kaksi kertaa samaa kaarta vastaava kehäkulma, ei päinvastoin: keskuskulmasta 140° saat kehäkulman 70°, et 280°. Tarkista myös, mitä kaarta kehäkulma vastaa. Se on kaari, joka jää kulman kylkien väliin ja jolla kärki ei ole. Jos kovera ∠AOB = 140° ja piste C on lyhyemmällä kaarella AB, ∠ACB vastaa pidempää kaarta, jonka keskuskulma on 360° − 140° = 220°. Silloin ∠ACB = 110°, ei 70°."},{"tyyppi":"ansa","otsikko":"Ansa 3: kulma peiliin vai normaaliin","sisalto":"Jos tehtävä antaa kulman normaalista, muuta se ensin kulmaksi peiliin: 90° miinus annettu kulma. Kun säde muodostaa normaalin kanssa 25° kulman, se muodostaa peilin kanssa 65° kulman. Jos käytät kolmiossa lukua 25° peilin kulman paikalla, koko ketju menee väärin. Sama toisin päin: valo kulkee lampusta L peilin pisteeseen H ja siitä anturiin K, ja ∠LHK = 80°. Säteet muodostavat peilin kanssa kulmat (180° − 80°) : 2 = 50° ja normaalin kanssa 90° − 50° = 40°."},{"tyyppi":"ansa","otsikko":"Ansa 4: hyppy ketjussa","sisalto":"Oikea loppuluku ei riitä, jos yksi välivaihe on ilman perustelua. Esimerkki: pisteet A, B, C ja D ovat ympyrän kehällä tässä järjestyksessä, jänteet AC ja BD leikkaavat pisteessä E, ∠BAC = 35° ja ∠ACD = 40°. Ketju ”∠ABD = 40°, joten ∠AEB = 180° − 35° − 40° = 105°.” ei kerro, mistä 40° tuli. Jos se on samaa kaarta vastaava kehäkulma kuin ∠ACD, se pitää kirjoittaa: ”∠ABD = ∠ACD = 40°, koska ne vastaavat samaa kaarta AD.” Lukijan ei pidä joutua arvaamaan. Kokeen perustelutehtävissä ketju, josta puuttuu yksikin perustelu, on väärin, vaikka luku olisi oikein."}],"harjoitusryhmat":[{"id":"suorat","nimi":"Yhdensuuntaiset suorat ja kolmiot","info":"Vakiokuvio: Suorat l ja s kulkevat vasemmalta oikealle, l ylempänä. Suoralla l ovat vasemmalta oikealle pisteet P, A ja Q, suoralla s pisteet R, B ja T. Vino suora k kulkee pisteiden A ja B kautta; pisteen A yläpuolella suoralla k on piste C ja pisteen B alapuolella piste D. Tehtävä kertoo erikseen, ovatko l ja s yhdensuuntaiset (l ∥ s). Piirrä kuvio vihkoon ennen kuin ratkaiset."},{"id":"ympyra","nimi":"Ympyrä ja kolmiot","info":"O on ympyrän keskipiste. Etsi silta: keskuskulma, säteistä syntyvä tasakylkinen kolmio tai samaa kaarta vastaava kehäkulma."},{"id":"peilit","nimi":"Peilit ja ketjun tarkistus","info":"Heijastuslaki on annettu tehtävässä. Normaali on kohtisuorassa peiliä vastaan, joten kulma normaaliin ja kulma peiliin ovat yhteensä 90°."}],"harjoitukset":[{"id":"H01","ryhma":"suorat","kysymys":"Vakiokuviossa l ∥ s. Pisteet A ja T on yhdistetty janalla, ja suoralla s on piste E pisteen T oikealla puolella. ∠CAQ = 64° ja ∠BAT = 50°. Ennen kulmaa ATE laske ∠ABT. Kuinka suuri se on?","vastaus":64,"vinkki":"Mikä pisteen B kulma on samassa kohdassa kuin ∠CAQ pisteessä A?","selitys":"∠CAQ ja ∠ABT ovat samankohtaiset kulmat: leikkaava suora k on kummankin kylki suoran yläpuolella, ja toinen kylki osoittaa oikealle. Koska l ∥ s, ∠ABT = ∠CAQ = 64°."},{"id":"H02","ryhma":"suorat","kysymys":"Vakiokuviossa l ∥ s. Pisteet A ja T on yhdistetty janalla, ja suoralla s on piste E pisteen T oikealla puolella. ∠CAQ = 64° ja ∠BAT = 50°. Kuinka suuri on ∠ATE?","vastaus":114,"vinkki":"Laske ensin ∠ABT ja sitten kolmion ABT kolmas kulma. Kysytty kulma on sen vieruskulma.","selitys":"1) ∠ABT = 64° (samankohtaiset kulmat, l ∥ s). 2) ∠ATB = 180° − 64° − 50° = 66° (kolmion ABT kulmien summa). 3) ∠ATE = 180° − 66° = 114° (vieruskulmat, koska B, T ja E ovat samalla suoralla). Vastaus 66 on kolmion kulma eikä kysytty kulma."},{"id":"H03","ryhma":"suorat","kysymys":"Vakiokuviossa l ∥ s. Piste T on valittu niin, että janat BA ja BT ovat yhtä pitkät, ja pisteet A ja T on yhdistetty janalla. ∠PAC = 76°. Kuinka suuri on ∠BTA?","vastaus":38,"vinkki":"Kolmio ABT on tasakylkinen, koska BA = BT. Laske ensin sen huippukulma ABT.","selitys":"1) ∠RBA = ∠PAC = 76° (samankohtaiset kulmat, l ∥ s). 2) ∠ABT = 180° − 76° = 104° (vieruskulmat). 3) Kolmio ABT on tasakylkinen, joten kantakulmat ∠BAT ja ∠BTA ovat yhtä suuret: (180° − 104°) : 2 = 38° (kolmion kulmien summa). Jos sait 52, käytit kulmaa ABT = 76°, eli valitsit väärän kulmaparin."},{"id":"H04","ryhma":"suorat","tyyppi":"monivalinta","vaihtoehdot":["Samankohtaiset kulmat ovat yhtä suuret, koska l ∥ s.","Vieruskulmien summa on 180°.","Kolmion kulmien summa on 180°."],"kysymys":"Vakiokuviossa l ∥ s. Pisteet A ja T on yhdistetty janalla. ∠CAQ = 68° ja ∠BAT = 40°. Ketju kulmaan ATB:\nVaihe 1: ∠ABT = 68°, koska ∠CAQ ja ∠ABT ovat samankohtaiset kulmat ja l ∥ s.\nVaihe 2: ∠ATB = 180° − 68° − 40° = 72°.\n\nMihin tietoon vaihe 2 perustuu?","vastaus":2,"vinkki":"Missä kuviossa kolme kulmaa 68°, 40° ja 72° ovat?","selitys":"Kulmat ABT, BAT ja ATB ovat kolmion ABT kulmat, ja kolmion kulmien summa on 180°. Vieruskulmat olisivat saman kärjen kaksi kulmaa, ja samankohtaiset kulmat käytettiin jo vaiheessa 1."},{"id":"H05","ryhma":"suorat","kysymys":"Vakiokuviossa l ∥ s, ja pisteet A ja T on yhdistetty janalla. ∠CAQ = 54°. Kolmion ABT kulma ATB on kaksi kertaa niin suuri kuin kulma BAT. Kuinka suuri on ∠ATB?","vastaus":84,"vinkki":"Ajattele kulmaa BAT yhtenä osana. Kulma ATB on kaksi samanlaista osaa. Montako astetta osille jää?","selitys":"1) ∠ABT = ∠CAQ = 54° (samankohtaiset kulmat, l ∥ s). 2) Kulmille BAT ja ATB jää 180° − 54° = 126° (kolmion ABT kulmien summa). 3) Osia on 1 + 2 = 3, joten yksi osa on 126° : 3 = 42°. ∠BAT = 42° ja ∠ATB = 2 · 42° = 84°. Tarkistus: 54° + 42° + 84° = 180°."},{"id":"H06","ryhma":"suorat","kysymys":"Suorat l ja s ovat yhdensuuntaiset, l ylempänä. Suoralla l ovat vasemmalta oikealle pisteet A ja Q, ja suoralla s pisteet B ja T. Piste M on suorien l ja s välissä samalla puolella suoraa AB kuin pisteet Q ja T. Kun janaa AM jatketaan pisteen M yli, se leikkaa suoran s pisteessä E. ∠QAM = 34° ja ∠TBM = 41°. Kuinka suuri on ∠AMB?","vastaus":75,"vinkki":"Katso kolmiota BME. Mikä sen kulma pisteessä E on, kun l ∥ s?","selitys":"1) ∠MEB = ∠QAM = 34°, koska ne ovat vuorokulmat ja l ∥ s (lyhenne samankohtaisista kulmista ja ristikulmista). 2) ∠BME = 180° − 41° − 34° = 105° (kolmion BME kulmien summa). 3) ∠AMB = 180° − 105° = 75° (vieruskulmat, koska A, M ja E ovat samalla suoralla). Tulos on sama kuin 34° + 41°."},{"id":"H07","ryhma":"suorat","kysymys":"Viisikulmion ABCDE kaikki kulmat ovat alle 180°. Kulma B on 96°, kulma C on 124° ja kulma D on 112°. Kulmat A ja E ovat yhtä suuret. Sivua DE jatketaan pisteen E yli pisteeseen F. Kuinka suuri on ∠AEF?","vastaus":76,"vinkki":"Laske ensin viisikulmion kulmien summa. Kulmat A ja E jakavat loput tasan.","selitys":"1) Viisikulmion kulmien summa on (5 − 2) · 180° = 540°. 2) Kulmille A ja E jää 540° − 96° − 124° − 112° = 208°, joten kumpikin on 104°. 3) ∠AEF = 180° − 104° = 76° (vieruskulmat, koska D, E ja F ovat samalla suoralla)."},{"id":"H08","ryhma":"suorat","kysymys":"Kolmiossa ABC sivut AB ja AC ovat yhtä pitkät, ja ∠BAC = 96°. Sivulla BC on piste D niin, että janat AD ja BD ovat yhtä pitkät. Kuinka suuri on ∠DAC?","vastaus":54,"vinkki":"Kuviossa on kaksi tasakylkistä kolmiota: ABC ja ABD. Kummankin kantakulmat ovat yhtä suuret.","selitys":"1) ∠ABC = ∠ACB = (180° − 96°) : 2 = 42° (kolmio ABC on tasakylkinen, kulmien summa). 2) ∠BAD = ∠ABD = 42°, koska kolmio ABD on tasakylkinen (AD = BD) ja ∠ABD on sama kulma kuin ∠ABC. 3) ∠DAC = 96° − 42° = 54°."},{"id":"H09","ryhma":"suorat","kysymys":"Vakiokuviossa ei ole kerrottu, ovatko suorat l ja s yhdensuuntaiset. Pisteet A ja T on yhdistetty janalla. ∠CAQ = 70°, ∠ABT = 66° ja ∠ATB = 48°. Kuinka suuri on ∠QAT?","vastaus":44,"vinkki":"Yhdensuuntaisuutta ei ole annettu. Käytä kolmion ABT kulmien summaa ja suoraa k.","selitys":"1) ∠BAT = 180° − 66° − 48° = 66° (kolmion ABT kulmien summa). 2) Pisteet C, A ja B ovat samalla suoralla, joten ∠CAQ + ∠QAT + ∠TAB = 180° ja ∠QAT = 180° − 70° − 66° = 44°. Vastaus 48 syntyy, jos olettaa l ∥ s. Suorat eivät ole yhdensuuntaiset, koska samankohtaiset kulmat ∠CAQ = 70° ja ∠ABT = 66° ovat erisuuret."},{"id":"H10","ryhma":"ympyra","kysymys":"Pisteet A, B ja C ovat ympyrän kehällä, ja O on ympyrän keskipiste. Piste C on lyhyemmällä kaarella AB. ∠ACB = 112°. Ennen kulmaa OAB laske kovera kulma AOB. Kuinka suuri se on?","vastaus":136,"vinkki":"Kärki C on lyhyemmällä kaarella, joten ∠ACB vastaa pidempää kaarta. Sen keskuskulma on kupera.","selitys":"∠ACB vastaa pidempää kaarta AB, jonka keskuskulma on 2 · 112° = 224° (kupera). Kovera kulma AOB on 360° − 224° = 136°."},{"id":"H11","ryhma":"ympyra","kysymys":"Pisteet A, B ja C ovat ympyrän kehällä, ja O on ympyrän keskipiste. Piste C on lyhyemmällä kaarella AB. ∠ACB = 112°. Kuinka suuri on ∠OAB?","vastaus":22,"vinkki":"OA ja OB ovat säteitä. Laske ensin kovera kulma AOB.","selitys":"1) Kupera keskuskulma on 2 · 112° = 224° (kehäkulma on puolet keskuskulmasta). 2) Kovera ∠AOB = 360° − 224° = 136°. 3) Kolmio AOB on tasakylkinen (OA ja OB ovat säteitä), joten ∠OAB = (180° − 136°) : 2 = 22°."},{"id":"H12","ryhma":"ympyra","kysymys":"Jana AB on ympyrän halkaisija. Pisteet C ja D ovat ympyrän kehällä halkaisijan AB eri puolilla. ∠CAB = 34°. Kuinka suuri on ∠ADC?","vastaus":56,"vinkki":"AC ei ole halkaisija, joten ∠ADC ei ole suora. Mikä toinen kehäkulma vastaa samaa kaarta AC?","selitys":"1) ∠ACB = 90° (Thaleen lause, AB on halkaisija). 2) ∠ABC = 180° − 90° − 34° = 56° (kolmion ABC kulmien summa). 3) ∠ADC = ∠ABC = 56°, koska ne vastaavat samaa kaarta AC (kumpikin on puolet samasta keskuskulmasta AOC)."},{"id":"H13","ryhma":"ympyra","kysymys":"Pisteet A, B, C ja D ovat ympyrän kehällä tässä järjestyksessä kehää kierrettäessä. Jänteet AC ja BD leikkaavat pisteessä E. ∠BAC = 38° ja ∠ACD = 47°. Kuinka suuri on ∠AED?","vastaus":85,"vinkki":"∠ABD ja ∠ACD vastaavat samaa kaarta AD. Laske kolmion ABE kulma pisteessä E.","selitys":"1) ∠ABD = ∠ACD = 47° (samaa kaarta AD vastaavat kehäkulmat). 2) ∠AEB = 180° − 38° − 47° = 95° (kolmion ABE kulmien summa). 3) ∠AED = 180° − 95° = 85° (vieruskulmat, koska B, E ja D ovat samalla suoralla)."},{"id":"H14","ryhma":"ympyra","kysymys":"Jana AB on ympyrän halkaisija, O on ympyrän keskipiste ja C on ympyrän kehällä. ∠AOC = 128°. Kuinka suuri on ∠OCB?","vastaus":64,"vinkki":"Pisteet A, O ja B ovat samalla suoralla. Kolmio OBC on tasakylkinen.","selitys":"1) ∠COB = 180° − 128° = 52° (vieruskulmat). 2) OB ja OC ovat säteitä, joten kolmio OBC on tasakylkinen ja ∠OCB = (180° − 52°) : 2 = 64°. Toinen reitti: ∠ABC on kehäkulma, joka vastaa samaa kaarta kuin keskuskulma AOC, joten ∠OBC = 64° ja ∠OCB = ∠OBC = 64°."},{"id":"H15","ryhma":"ympyra","kysymys":"Nelikulmion ABCD kärjet ovat ympyrän kehällä tässä järjestyksessä kehää kierrettäessä. Sivut AB ja AD ovat yhtä pitkät. ∠BCD = 116°. Kuinka suuri on ∠ABD?","vastaus":58,"vinkki":"Laske ensin ∠BAD: se ja ∠BCD vastaavat yhdessä koko kehää. Kolmio ABD on tasakylkinen.","selitys":"1) ∠BCD vastaa kaarta BAD, jonka keskuskulma on 2 · 116° = 232°. 2) Kaaren BCD keskuskulma on 360° − 232° = 128°. 3) ∠BAD = 128° : 2 = 64°. 4) Kolmio ABD on tasakylkinen (AB = AD), joten ∠ABD = (180° − 64°) : 2 = 58°."},{"id":"H16","ryhma":"peilit","kysymys":"Tasopeili on suoralla, jolla ovat pisteet P, H ja Q tässä järjestyksessä. Valonsäde lähtee lampusta L, osuu peiliin pisteessä H ja heijastuu anturiin K. Piste N on pisteen H kautta kulkevalla peilin normaalilla samalla puolella peiliä kuin L ja K. L on samalla puolella normaalia HN kuin P, ja K samalla puolella kuin Q. Heijastuslaki: tuleva ja heijastunut säde muodostavat peilin kanssa yhtä suuret kulmat osumiskohdan eri puolilla. ∠LHK = 104°. Kuinka suuri on ∠KHN?","vastaus":52,"vinkki":"Säteet LH ja HK muodostavat peilin kanssa yhtä suuret kulmat. Normaali on 90° kulmassa peiliin.","selitys":"1) ∠LHP = ∠KHQ heijastuslain mukaan, ja ∠LHP + ∠LHK + ∠KHQ = 180°, joten kumpikin on (180° − 104°) : 2 = 38°. 2) ∠QHN = 90°, joten ∠KHN = 90° − 38° = 52°. Vastaus 38 on kulma peiliin eikä normaaliin."},{"id":"H17","ryhma":"peilit","kysymys":"Kaksi tasopeiliä on puolisuorilla OX ja OY, ja ∠XOY = 70°. Valonsäde tulee pisteestä S peilien väliin ja osuu peiliin OX pisteessä H. Siitä se heijastuu peiliin OY pisteeseen K ja edelleen kohti pistettä U. Piste X on peilillä OX kauempana O:sta kuin H, ja piste Y on peilillä OY kauempana O:sta kuin K. Heijastuslaki: tuleva ja heijastunut säde muodostavat peilin kanssa yhtä suuret kulmat osumiskohdan eri puolilla. ∠SHX = 50°. Kuinka suuri on ∠UKY?","vastaus":60,"vinkki":"Peilit ja säteen osa HK muodostavat kolmion OHK.","selitys":"1) ∠KHO = ∠SHX = 50° (heijastuslaki). 2) ∠OKH = 180° − 70° − 50° = 60° (kolmion OHK kulmien summa). 3) ∠UKY = ∠OKH = 60° (heijastuslaki)."},{"id":"H18","ryhma":"peilit","kysymys":"Kaksi tasopeiliä on puolisuorilla OX ja OY, ja ∠XOY = 90°. Valonsäde tulee pisteestä S peilien väliin ja osuu peiliin OX pisteessä H. Siitä se heijastuu peiliin OY pisteeseen K ja edelleen kohti pistettä U. Piste X on peilillä OX kauempana O:sta kuin H, ja piste Y on peilillä OY kauempana O:sta kuin K. Heijastuslaki: tuleva ja heijastunut säde muodostavat peilin kanssa yhtä suuret kulmat osumiskohdan eri puolilla. Piste N on pisteen H kautta kulkevalla peilin OX normaalilla peilien puolella, ja piste S on samalla puolella normaalia HN kuin X. Tuleva säde muodostaa normaalin kanssa kulman ∠SHN = 28°. Kuinka suuri on ∠HKU?","vastaus":124,"vinkki":"Muuta ensin kulma normaalista kulmaksi peiliin. Laske sitten kolmio OHK.","selitys":"1) ∠SHX = 90° − 28° = 62°, koska normaali on kohtisuorassa peiliä vastaan. 2) ∠KHO = 62° (heijastuslaki). 3) ∠OKH = 180° − 90° − 62° = 28° (kolmion OHK kulmien summa). 4) ∠UKY = 28° (heijastuslaki). 5) ∠HKU = 180° − 28° − 28° = 124°, koska kulmat OKH, HKU ja UKY täyttävät oikokulman. Jos sait 56, käytit 28° kulmana peiliin."},{"id":"H19","ryhma":"peilit","kysymys":"Kaksi tasopeiliä on puolisuorilla OX ja OY. Valonsäde tulee pisteestä S peilien väliin ja osuu peiliin OX pisteessä H. Siitä se heijastuu peiliin OY pisteeseen K ja edelleen kohti pistettä U. Piste X on peilillä OX kauempana O:sta kuin H, ja piste Y on peilillä OY kauempana O:sta kuin K. Heijastuslaki: tuleva ja heijastunut säde muodostavat peilin kanssa yhtä suuret kulmat osumiskohdan eri puolilla. ∠SHX = 40° ja ∠UKY = 75°. Kuinka suuri on peilien välinen kulma XOY?","vastaus":65,"vinkki":"Laske kolmion OHK kulmat pisteissä H ja K heijastuslain avulla.","selitys":"1) ∠KHO = 40° ja ∠OKH = 75° (heijastuslaki kummassakin peilissä). 2) ∠XOY = 180° − 40° − 75° = 65° (kolmion OHK kulmien summa)."},{"id":"H20","ryhma":"peilit","tyyppi":"monivalinta","vaihtoehdot":["Heijastuslaki.","Kolmion OHK kulmien summa on 180°.","Ristikulmat ovat yhtä suuret."],"kysymys":"Kaksi tasopeiliä on puolisuorilla OX ja OY, ja ∠XOY = 64°. Valonsäde tulee pisteestä S peilien väliin ja osuu peiliin OX pisteessä H. Siitä se heijastuu peiliin OY pisteeseen K ja edelleen kohti pistettä U. Piste X on peilillä OX kauempana O:sta kuin H, ja piste Y on peilillä OY kauempana O:sta kuin K. Heijastuslaki: tuleva ja heijastunut säde muodostavat peilin kanssa yhtä suuret kulmat osumiskohdan eri puolilla. ∠SHX = 48°. Ketju kulmaan UKY:\nVaihe 1: ∠KHO = 48° heijastuslain mukaan.\nVaihe 2: ∠OKH = 180° − 64° − 48° = 68°.\nVaihe 3: ∠UKY = 68° heijastuslain mukaan.\n\nMihin tietoon vaihe 2 perustuu?","vastaus":1,"vinkki":"Missä kuviossa kulmat 64°, 48° ja 68° ovat yhdessä?","selitys":"Kulmat XOY, KHO ja OKH ovat kolmion OHK kulmat, ja kolmion kulmien summa on 180°. Heijastuslakia käytetään vaiheissa 1 ja 3."}],"valmis_teksti":"Ratkaiset vaativan kulmatehtävän usean välivaiheen kautta ja kirjoitat ketjun, jossa jokainen vaihe on perusteltu nimetyllä tiedolla. Yhdistät yhdensuuntaisten suorien, kolmioiden, ympyrän ja peilien tiedot, huomaat, kun jotain ei ole annettu, ja tarkistat tuloksen toista reittiä. Tämä taito on nyt näytetty."};

const svg=document.getElementById("nlsvg"), rng=document.getElementById("nlrange"), out=document.getElementById("nlout");
const X0=34, X1=606, Y=62;
function piirraNL(v){
  const ala=Math.floor(v/10)*10, yla=ala+10, puoli=ala+5;
  const pyor = (v%10)>=5 ? yla : ala;
  const x = n => X0 + (n/100)*(X1-X0);
  let s=`<line class="rail" x1="${X0}" y1="${Y}" x2="${X1}" y2="${Y}"/>`;
  for(let n=0;n<=100;n+=10){
    const near = (n===ala||n===yla);
    s+=`<line class="tick" x1="${x(n)}" y1="${Y-7}" x2="${x(n)}" y2="${Y+7}"/>`;
    s+=`<text class="stop${near?" near":""}" x="${x(n)}" y="${Y+24}" text-anchor="middle">${n}</text>`;
  }
  s+=`<line class="halfway" x1="${x(puoli)}" y1="${Y-16}" x2="${x(puoli)}" y2="${Y+12}"/>`;
  s+=`<text class="stop" x="${x(puoli)}" y="${Y-22}" text-anchor="middle">puoliväli ${puoli}</text>`;
  s+=`<circle class="dot" cx="${x(v)}" cy="${Y}" r="6"/>`;
  s+=`<text class="val" x="${x(v)}" y="${Y-32}" text-anchor="middle">${v}</text>`;
  s+=`<path d="M ${x(v)} ${Y+38} L ${x(pyor)} ${Y+38}" stroke="var(--core)" stroke-width="2" fill="none"/>`;
  s+=`<path d="M ${x(pyor)} ${Y+38} l ${x(pyor)>x(v)?-7:7} -4 l 0 8 z" fill="var(--core)"/>`;
  svg.innerHTML=s;
  out.textContent = `${v} pyöristyy → ${pyor}`;
}

/* ---------- laskujärjestys-widget ---------- */
const ljExp=document.getElementById("ljExp");
if(ljExp && D.kokeilu){
  let ljI=0, ljTokens=[], ljStep=0;
  const laske=(a,op,b)=>{a=+a;b=+b;return op==="×"?a*b:op==="÷"?a/b:op==="+"?a+b:a-b;};
  function ljAlku(){
    const l=D.kokeilu[ljI];
    ljTokens=l.lauseke.replace(/\(/g,"( ").replace(/\)/g," )").split(/\s+/).filter(Boolean);
    ljStep=0; ljPiirra(); ljViesti("","");
  }
  function ljViesti(t,lk){const f=document.getElementById("ljFb"); f.textContent=t; f.className="lj-fb "+(lk||"");}
  function ljPiirra(){
    const l=D.kokeilu[ljI];
    document.getElementById("ljStep").textContent =
      ljStep>=l.askeleet.length ? "valmis" : `askel ${ljStep+1} / ${l.askeleet.length}`;
    if(ljStep>=l.askeleet.length){
      ljExp.innerHTML=`<span class="valmis">${l.lauseke} = ${l.vastaus}</span>`;
      return;
    }
    ljExp.innerHTML=ljTokens.map((t,i)=>
      "×÷+−".includes(t) ? `<button type="button" class="op" data-i="${i}">${t}</button>`
                         : `<span class="tok">${t}</span>`).join("");
    ljExp.querySelectorAll("button.op").forEach(b=>b.addEventListener("click",()=>ljKlikkaa(+b.dataset.i)));
  }
  function ljKlikkaa(i){
    const l=D.kokeilu[ljI], odotettu=l.askeleet[ljStep];
    const ehdotus=[ljTokens[i-1],ljTokens[i],ljTokens[i+1]].join(" ");
    if(ehdotus!==odotettu){
      ljViesti(ljStep===0
        ? "Ei vielä. Sulkeet ovat vahvimmat, sitten kerto ja jako. Yhtä vahvat vasemmalta oikealle."
        : "Ei vielä. Kumpi jäljellä olevista on vahvempi?", "no");
      return;
    }
    const arvo=laske(ljTokens[i-1],ljTokens[i],ljTokens[i+1]);
    let alku=i-1, loppu=i+1;
    if(ljTokens[i-2]==="(" && ljTokens[i+2]===")"){ alku=i-2; loppu=i+2; }
    ljTokens.splice(alku, loppu-alku+1, String(arvo));
    ljStep++;
    ljViesti(ljStep>=l.askeleet.length ? "Valmis. Vastaus on "+l.vastaus+"." : "Oikein. Jatka seuraavaan.", "ok");
    ljPiirra();
  }
  document.getElementById("ljSeuraava").addEventListener("click",()=>{
    ljI=(ljI+1)%D.kokeilu.length; ljAlku();
  });
  ljAlku();
}

/* Suomalainen lukumuoto: välilyönti on tuhaterotin, pilkku desimaalierotin.
   Piste voi olla kumpi tahansa. Se tulkitaan tuhaterottimeksi VAIN silloin, kun
   koko luku on aitoa tuhaterotinmuotoa: alkuosa 1–3 numeroa ilman etunollaa ja
   jokainen jatko-osa täsmälleen 3 numeroa (1.500, 12.345.678). Kaikissa muissa
   tapauksissa piste on desimaalipiste — myös 0.125, joka vanhalla säännöllä
   ("3 numeroa pisteen jäljessä = tuhaterotin") luettiin virheellisesti luvuksi 125. */
const TUHATEROTIN = /^[1-9]\d{0,2}(\.\d{3})+$/;
function lueLuku(teksti){
  // Murtoluku (3/4, -3/4) ja sekaluku (1 2/3, -1 2/3) hyväksytään sellaisinaan.
  const raaka = String(teksti).replace(/\u00a0/g, " ").trim();
  let m = raaka.match(/^(-?)(\d+)\s+(\d+)\s*\/\s*(\d+)$/);
  if(m){ const nim = Number(m[4]); if(nim === 0) return null;
    const v = Number(m[2]) + Number(m[3]) / nim; return m[1] ? -v : v; }
  m = raaka.match(/^(-?)\s*(\d+)\s*\/\s*(\d+)$/);
  if(m){ const nim = Number(m[3]); if(nim === 0) return null;
    const v = Number(m[2]) / nim; return m[1] ? -v : v; }
  let s = String(teksti).replace(/[\s\u00a0]/g, "");
  if(s === "") return null;
  if(s.indexOf(",") >= 0){
    s = s.replace(/\./g, "").replace(",", ".");
  } else if(TUHATEROTIN.test(s)){
    s = s.replace(/\./g, "");
  }
  const n = Number(s);
  return Number.isFinite(n) ? n : null;
}

function tarkista(id){
  const h=D.harjoitukset.find(x=>x.id===id);
  const kentta=document.getElementById("in-"+id);
  const fb=document.getElementById("fb-"+id);
  if(kentta.value.trim()===""){ fb.className="fb hint"; fb.textContent="Kirjoita vastaus ensin."; return; }
  const luku=lueLuku(kentta.value);
  if(luku===null){ fb.className="fb no"; fb.textContent="Vastauksen pitää olla luku tai murtoluku (esimerkiksi 3/4)."; return; }
  const oikein = Math.abs(luku - h.vastaus) < 1e-9;
  merkitseTulos(id, oikein, oikein ? "Oikein. "+h.selitys : `Ei vielä. ${h.vinkki} Kokeile uudelleen.`);
}

function tarkistaMonivalinta(id, valittuIndeksi, painike){
  const h=D.harjoitukset.find(x=>x.id===id);
  const rivi=painike.closest(".row");
  rivi.querySelectorAll(".mv-valinta").forEach(b=>b.disabled=true);
  const oikein = valittuIndeksi===h.vastaus;
  painike.classList.add(oikein?"mv-oikein":"mv-vaarin");
  if(!oikein){
    const oikeaBtn=rivi.querySelector(`[data-i="${h.vastaus}"]`);
    if(oikeaBtn) oikeaBtn.classList.add("mv-oikein");
  }
  merkitseTulos(id, oikein, oikein ? "Oikein. "+h.selitys : `Ei ihan. Oikea vastaus on korostettu. ${h.selitys||""}`);
}

/* Kuuntelu: selain lukee tekstin ääneen omalla puhesynteesillään (englanniksi, jos laitteessa on
   englanninkielinen ääni). Ei äänitiedostoja eikä verkkoyhteyttä. Jos laite ei osaa puhua,
   teksti näytetään luettavaksi — silloin tehtävä muuttuu luetun ymmärtämiseksi, mutta ei katkea. */
function puhu(id, nopeus){
  const h=D.harjoitukset.find(x=>x.id===id); if(!h || !h.kuuntele) return;
  const vara=document.getElementById("vara-"+id);
  const naytaTeksti=syy=>{ vara.hidden=false; vara.textContent=syy+" Teksti: "+h.kuuntele; };
  if(!("speechSynthesis" in window)){ naytaTeksti("Tämä laite ei osaa lukea ääneen."); return; }
  const s=window.speechSynthesis; s.cancel();
  const u=new SpeechSynthesisUtterance(h.kuuntele);
  u.lang=h.kieli||"en-GB"; u.rate=nopeus;
  const aanet=s.getVoices(), kieli=u.lang.slice(0,2);
  const aani=aanet.find(a=>a.lang===u.lang) || aanet.find(a=>a.lang && a.lang.startsWith(kieli));
  if(aani) u.voice=aani;
  else if(aanet.length) { naytaTeksti("Laitteessa ei ole englanninkielistä ääntä."); return; }
  u.onerror=()=>naytaTeksti("Ääneen lukeminen ei onnistunut.");
  s.speak(u);
}
