<title>Origon kautta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">

<style>
:root{
  --paper:#EFF2F5; --surface:#FFFFFF; --surface-2:#F7F9FB;
  --grid:#DCE3EA; --line:#C9D3DC;
  --ink:#15222C; --ink-2:#4E626F; --ink-3:#7E8F9B;
  --core:#1B5A9E; --core-soft:#E4EDF6;
  --strong:#1F6E5C; --strong-soft:#E1F0EB;
  --chal:#9A6A16; --chal-soft:#F6EDDC;
  --alert:#A33A2B; --alert-soft:#F8E7E3;
  --shadow:0 1px 2px rgba(21,34,44,.06), 0 8px 24px -12px rgba(21,34,44,.18);
  --r:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0F161B; --surface:#18222A; --surface-2:#1D2830;
    --grid:#22303A; --line:#2E3E4A;
    --ink:#E8EFF4; --ink-2:#A3B4C0; --ink-3:#7A8B97;
    --core:#7FB2E4; --core-soft:#16303F;
    --strong:#77CDB4; --strong-soft:#123028;
    --chal:#E0B267; --chal-soft:#33270F;
    --alert:#E8907F; --alert-soft:#3A1E19;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -14px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --paper:#0F161B; --surface:#18222A; --surface-2:#1D2830;
  --grid:#22303A; --line:#2E3E4A;
  --ink:#E8EFF4; --ink-2:#A3B4C0; --ink-3:#7A8B97;
  --core:#7FB2E4; --core-soft:#16303F;
  --strong:#77CDB4; --strong-soft:#123028;
  --chal:#E0B267; --chal-soft:#33270F;
  --alert:#E8907F; --alert-soft:#3A1E19;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -14px rgba(0,0,0,.7);
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:16px; line-height:1.62;
  background-image:
    linear-gradient(to right, var(--grid) 1px, transparent 1px),
    linear-gradient(to bottom, var(--grid) 1px, transparent 1px);
  background-size:26px 26px;
}
.wrap{max-width:760px; margin:0 auto; padding:28px 20px 90px}
h1,h2,h3,h4{font-family:"Familjen Grotesk","IBM Plex Sans",system-ui,sans-serif; text-wrap:balance}

/* header */
header.top{background:var(--surface); border:1px solid var(--line); border-radius:var(--r);
  box-shadow:var(--shadow); padding:22px 24px; display:flex; gap:18px; align-items:flex-start}
.badge{flex:0 0 auto; width:54px; height:54px; border-radius:9px; display:grid; place-items:center;
  background:var(--core-soft); border:1px solid var(--core); color:var(--core)}
.badge svg{width:28px; height:28px; fill:none; stroke:currentColor; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round}
.eyebrow{font-family:"IBM Plex Mono",monospace; font-size:11px; letter-spacing:.14em;
  text-transform:uppercase; color:var(--ink-3); margin:0 0 5px}
header.top h1{margin:0; font-size:30px; font-weight:700; letter-spacing:-.015em}
header.top p{margin:5px 0 0; color:var(--ink-2); font-size:15px}
.tags{display:flex; flex-wrap:wrap; gap:5px; margin-top:11px}
.tag{font-family:"IBM Plex Mono",monospace; font-size:10.5px; letter-spacing:.05em; padding:2px 7px;
  border-radius:4px; background:var(--surface-2); border:1px solid var(--line); color:var(--ink-3)}
.tag.core{background:var(--core-soft); border-color:var(--core); color:var(--core)}

/* teksti */
article{margin-top:26px}
article h2{font-size:21px; font-weight:600; margin:32px 0 10px; letter-spacing:-.01em}
article p{margin:0 0 14px; max-width:64ch}
.lead{font-size:17.5px; color:var(--ink); border-left:3px solid var(--core); padding-left:16px; margin:0 0 8px}

.box{background:var(--surface); border:1px solid var(--line); border-radius:var(--r);
  padding:18px 22px; box-shadow:var(--shadow); margin:22px 0}
.box h3{margin:0 0 12px; font-size:16.5px; font-weight:600}
.box.warn{border-left:3px solid var(--alert)}
.box.note{border-left:3px solid var(--chal)}

ol.steps{margin:0; padding-left:0; list-style:none; counter-reset:s; display:grid; gap:12px}
ol.steps li{counter-increment:s; display:grid; grid-template-columns:auto 1fr; gap:13px; align-items:start}
ol.steps li::before{content:counter(s); font-family:"Familjen Grotesk",sans-serif; font-weight:700; font-size:14px;
  width:26px; height:26px; border-radius:50%; background:var(--core); color:#fff; display:grid; place-items:center; margin-top:2px}

ul.notes{margin:0; padding-left:19px}
ul.notes li{margin-bottom:7px}
ul.notes li:last-child{margin-bottom:0}

.tablewrap{overflow-x:auto}
table{border-collapse:collapse; width:100%; font-size:14.5px; min-width:460px}
th,td{text-align:left; padding:9px 13px; border-bottom:1px solid var(--line)}
th{font-family:"IBM Plex Mono",monospace; font-size:10.5px; letter-spacing:.1em; text-transform:uppercase;
  color:var(--ink-3); font-weight:400; background:var(--surface-2)}
tr:last-child td{border-bottom:0}
td b{color:var(--core); font-weight:600}
td:last-child{font-variant-numeric:tabular-nums; font-weight:600}

/* lukusuora */
.nl svg{width:100%; height:118px; display:block}
.nl .rail{stroke:var(--line); stroke-width:2}
.nl .tick{stroke:var(--line); stroke-width:1.5}
.nl .stop{fill:var(--ink-3); font-family:"IBM Plex Mono",monospace; font-size:11px}
.nl .stop.near{fill:var(--core); font-weight:600}
.nl .dot{fill:var(--chal)}
.nl .val{fill:var(--ink); font-family:"Familjen Grotesk",sans-serif; font-size:15px; font-weight:700}
.nl .halfway{stroke:var(--chal); stroke-dasharray:3 3; stroke-width:1.5}
.nl-controls{display:flex; align-items:center; gap:14px; margin-top:6px}
.nl-controls input{flex:1; accent-color:var(--core)}
.nl-out{font-family:"Familjen Grotesk",sans-serif; font-size:15px; font-weight:600; min-width:12.5em; text-align:right}

/* paikka-arvotaulu */
.box .ohje{margin:0 0 14px; font-size:14.5px; color:var(--ink-2)}
.nt-valinta{display:flex; flex-wrap:wrap; gap:7px; margin-bottom:16px}
.nt-valinta button{font:inherit; font-size:12.5px; font-family:"IBM Plex Mono",monospace; padding:5px 11px;
  border-radius:6px; border:1px solid var(--line); background:var(--surface-2); color:var(--ink-2); cursor:pointer}
.nt-valinta button[aria-pressed="true"]{background:var(--ink); color:var(--paper); border-color:var(--ink)}
.nt-valinta button:focus-visible{outline:2px solid var(--core); outline-offset:2px}
.nt-taulu{display:flex; flex-direction:column; gap:4px; align-items:flex-start; overflow-x:auto; padding-bottom:4px}
.nt-rivi{display:flex; gap:6px; align-items:center}
.nt-rivi .otsa{font-family:"IBM Plex Mono",monospace; font-size:9.5px; letter-spacing:.08em;
  text-transform:uppercase; color:var(--ink-3); width:52px; text-align:center}
.nt-ruutu{width:52px; height:52px; display:grid; place-items:center; border:1.5px solid var(--line);
  border-radius:7px; background:var(--surface-2); font-family:"IBM Plex Mono",monospace; font-size:24px}
.nt-ruutu.kohta{border-color:var(--core); background:var(--core-soft); color:var(--core); font-weight:500}
.nt-ruutu.ratkaiseva{border-color:var(--chal); background:var(--chal-soft); color:var(--chal); font-weight:500}
.nt-ruutu.nolla{color:var(--ink-3)}
.nt-rivi .nimi{font-size:12.5px; color:var(--ink-3); margin-left:12px; white-space:nowrap}
.nt-nuoli{font-size:17px; color:var(--chal); margin-left:6px}
.nt-selite{margin:14px 0 0; font-size:14.5px}
.nt-selite b{color:var(--core)}

/* vahvuusportaat */
.vp-tasot{display:grid; gap:9px; margin-bottom:18px}
.vp-taso{display:flex; gap:11px; align-items:flex-start; font-size:13.5px}
.vp-taso .vp-pallo{width:13px; height:13px; border-radius:4px; margin-top:5px; flex:0 0 auto}
.vp-taso[data-taso="sulkeet"] .vp-pallo{background:var(--core)}
.vp-taso[data-taso="kertojako"] .vp-pallo{background:var(--strong)}
.vp-taso[data-taso="yhteenvahennys"] .vp-pallo{background:var(--chal)}
.vp-taso strong{display:block; font-family:"Familjen Grotesk",sans-serif; font-weight:600; font-size:14.5px}
.vp-taso span{color:var(--ink-2)}
.vp-lauseke{display:flex; flex-wrap:wrap; gap:7px; align-items:flex-end; font-family:"IBM Plex Mono",monospace;
  font-size:25px; padding:10px 2px; min-height:64px}
.vp-lauseke .t{padding:2px 3px}
.vp-lauseke .op{position:relative; padding:2px 9px; border-radius:6px; font-weight:500}
.vp-lauseke .op[data-taso="sulkeet"]{background:var(--core-soft); color:var(--core)}
.vp-lauseke .op[data-taso="kertojako"]{background:var(--strong-soft); color:var(--strong)}
.vp-lauseke .op[data-taso="yhteenvahennys"]{background:var(--chal-soft); color:var(--chal)}
.vp-lauseke .op i{position:absolute; top:-9px; right:-6px; font-style:normal; font-family:"Familjen Grotesk",sans-serif;
  font-size:11px; font-weight:700; width:18px; height:18px; border-radius:50%; display:grid; place-items:center;
  background:currentColor}
.vp-lauseke .op i span{color:var(--surface)}
.vp-rivi{display:flex; align-items:center; gap:16px; margin-top:8px}
.vp-vastaus{font-family:"Familjen Grotesk",sans-serif; font-size:16px; font-weight:600; color:var(--strong)}

/* laskujärjestys-widget */
.lj-exp{display:flex; flex-wrap:wrap; gap:7px; align-items:center; font-family:"IBM Plex Mono",monospace;
  font-size:23px; padding:14px 4px; min-height:62px}
.lj-exp .tok{padding:2px 4px; color:var(--ink)}
.lj-exp button.op{font-family:"IBM Plex Mono",monospace; font-size:23px; padding:3px 12px; border-radius:7px;
  border:1.5px solid var(--line); background:var(--surface-2); color:var(--ink); line-height:1.2}
.lj-exp button.op:hover{border-color:var(--core); color:var(--core)}
.lj-exp button.op:focus-visible{outline:2px solid var(--core); outline-offset:2px}
.lj-exp .valmis{font-family:"Familjen Grotesk",sans-serif; font-size:23px; font-weight:700; color:var(--strong)}
.lj-fb{font-size:14.5px; min-height:1.5em; color:var(--ink-2)}
.lj-fb.no{color:var(--alert)}
.lj-fb.ok{color:var(--strong)}
.lj-row{display:flex; align-items:center; gap:14px; margin-top:10px}
.lj-step{font-family:"IBM Plex Mono",monospace; font-size:11.5px; letter-spacing:.1em;
  text-transform:uppercase; color:var(--ink-3)}

/* harjoitukset */
.progress{position:sticky; top:0; z-index:5; background:var(--surface); border:1px solid var(--line);
  border-radius:var(--r); padding:12px 18px; box-shadow:var(--shadow); display:flex; align-items:center;
  gap:14px; margin:34px 0 18px}
.progress .lbl{font-family:"IBM Plex Mono",monospace; font-size:11px; letter-spacing:.12em;
  text-transform:uppercase; color:var(--ink-3); white-space:nowrap}
.progress .meter{flex:1; height:7px; border-radius:4px; background:var(--surface-2); border:1px solid var(--line); overflow:hidden}
.progress .meter i{display:block; height:100%; background:var(--core); transition:width .25s ease}
.progress .cnt{font-family:"Familjen Grotesk",sans-serif; font-weight:700; font-variant-numeric:tabular-nums; white-space:nowrap}

.grp{margin-top:26px}
.grp-head{display:flex; align-items:baseline; gap:10px; border-bottom:1.5px solid var(--ink); padding-bottom:7px; margin-bottom:14px}
.grp-head h3{margin:0; font-size:17px; font-weight:600}
.grp-head span{font-size:12.5px; color:var(--ink-2)}

.ex{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:14px 16px; margin-bottom:10px}
.ex[data-tila="oikein"]{border-color:var(--strong); box-shadow:inset 3px 0 0 var(--strong)}
.ex[data-tila="vaarin"]{border-color:var(--alert); box-shadow:inset 3px 0 0 var(--alert)}
.ex .q{display:flex; gap:11px; align-items:baseline; flex-wrap:wrap}
.ex .num{font-family:"IBM Plex Mono",monospace; font-size:11.5px; color:var(--ink-3); min-width:2.4em}
.ex .txt{flex:1; min-width:190px; font-size:15.5px}
.ex .txt .aineisto{display:block; margin-bottom:9px; padding-left:12px;
  border-left:2px solid var(--line); color:var(--ink-2); line-height:1.6;
  /* Aineisto voi olla pieni taulukko, jonka rivit on erotettu rivinvaihdoilla.
     Ilman pre-lineä ne valuisivat yhdeksi kappaleeksi ja taulukko katoaisi. */
  white-space:pre-line}
.ex .txt .kysymysrivi{display:block; font-weight:600}
.ex .row{display:flex; gap:8px; align-items:center; margin-top:11px; flex-wrap:wrap}
.ex input[type=text]{font:inherit; font-family:"IBM Plex Mono",monospace; font-size:15px; width:8.5em;
  padding:7px 11px; border:1px solid var(--line); border-radius:7px; background:var(--surface-2);
  color:var(--ink); text-align:right}
.ex input:focus-visible{outline:2px solid var(--core); outline-offset:1px}
button{font:inherit; cursor:pointer}
.btn{font-size:13.5px; padding:7px 15px; border-radius:7px; border:1px solid var(--core);
  background:var(--core); color:#fff}
.btn.ghost{background:transparent; color:var(--ink-2); border-color:var(--line)}
.btn:focus-visible{outline:2px solid var(--core); outline-offset:2px}
.btn.mv-valinta{text-align:left}
/* kuuntelutehtävä: selaimen puhesynteesi lukee englanninkielisen tekstin */
.kuuntele{display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin:2px 0 10px}
.kuuntele .btn{display:inline-flex; gap:7px; align-items:center}
.kuuntele svg{width:16px; height:16px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round}
.kuuntele .varateksti{flex-basis:100%; font-size:14px; color:var(--ink-2); background:var(--surface-2);
  border-radius:7px; padding:8px 12px; margin:0}
.btn.mv-valinta:disabled{cursor:default; opacity:.65}
.btn.mv-oikein{background:var(--strong-soft); border-color:var(--strong); color:var(--strong); opacity:1}
.btn.mv-vaarin{background:var(--alert-soft); border-color:var(--alert); color:var(--alert); opacity:1}
.row.mv{gap:8px 10px}
.fb{margin-top:11px; font-size:14.5px; padding:10px 13px; border-radius:8px; line-height:1.5}
.fb.ok{background:var(--strong-soft); color:var(--strong)}
.fb.no{background:var(--alert-soft); color:var(--alert)}
.fb.hint{background:var(--chal-soft); color:var(--chal)}

.done{background:var(--strong-soft); border:1px solid var(--strong); color:var(--strong);
  border-radius:var(--r); padding:16px 20px; margin-top:20px; font-size:15.5px}
.done h3{margin:0 0 4px; font-size:17px; color:var(--strong)}

details.teacher{margin-top:34px; background:var(--surface); border:1px solid var(--line);
  border-left:3px solid var(--chal); border-radius:var(--r); padding:15px 20px; box-shadow:var(--shadow)}
details.teacher summary{cursor:pointer; font-family:"Familjen Grotesk",sans-serif; font-weight:600; font-size:15px}
details.teacher summary:focus-visible{outline:2px solid var(--core); outline-offset:3px}
details.teacher ul{margin:12px 0 0; padding-left:19px; color:var(--ink-2); font-size:14.5px}
details.teacher li{margin-bottom:8px}
details.teacher p{margin:12px 0 0; color:var(--ink-2); font-size:14.5px}

.back{display:inline-block; margin-top:30px; font-size:13.5px; color:var(--ink-2)}
.back a{color:var(--core)}

@media (prefers-reduced-motion: reduce){*{transition:none !important}}
@media (max-width:560px){
  .wrap{padding:16px 13px 70px}
  header.top h1{font-size:25px}
  .progress{flex-wrap:wrap}
}
</style>

<div class="wrap">

  <header class="top">
    <span class="badge"><svg viewBox="0 0 24 24" aria-hidden="true" id="ikoni"></svg></span>
    <div>
      <p class="eyebrow" id="eyebrow"></p>
      <h1 id="otsikko"></h1>
      <p id="kuvaus"></p>
      <div class="tags" id="tags"></div>
    </div>
  </header>

  <article id="teksti"></article>

  <div class="progress" aria-live="polite">
    <span class="lbl">Harjoitukset</span>
    <span class="meter"><i id="pbar" style="width:0%"></i></span>
    <span class="cnt" id="pcnt">0 / 20</span>
  </div>

  <div id="harjoitukset"></div>
  <div id="valmis"></div>

  <p class="back" id="back"></p>

</div>

<script>
const D = {"tavoite_id":"MAT8-FUN-02","oppiaine":"MAT","vuosiluokka":8,"otsikko":"Origon kautta","kuvaus":"Osaan piirtää ja tulkita suoraan ja kääntäen verrannollisten suureiden kuvaajia.","versio":"0.2","paivitetty":"2026-10-04","ops":{"T":["T15"],"S":["S4"]},"taso":"ydin","ikoni":"tutkimus","eyebrow":"Matematiikka · 8. luokka · Funktiot ja lukujonot","teksti":[{"tyyppi":"johdanto","sisalto":"Irtokarkkihyllyllä vaaka näyttää pussin hinnan: kaksi kertaa niin paljon karkkia maksaa kaksi kertaa niin paljon, ja tyhjä pussi ei maksa mitään. Kun tästä tilanteesta piirtää kuvaajan, siitä tulee suora, joka lähtee origosta. Aivan toisenlainen kuvaaja syntyy, kun täytät akvaariota letkulla: jos virtaama on puolet pienempi, täyttö kestää kaksi kertaa niin kauan. Sen kuvaaja on käyrä, joka ei osu kumpaankaan akseliin. Tässä taidossa opit piirtämään kuvaajan taulukosta käsin, lukemaan kuvaajasta kilohinnan kaltaisen kertoimen ja päättelemään kuvaajan muodosta, millaisesta riippuvuudesta on kyse. Kuvaajia piirretään usein matematiikkaohjelmalla, mutta niiden tulkitseminen on taito, joka tarvitaan myös paperilla."},{"tyyppi":"kappale","otsikko":"Miksi suora ja miksi origon kautta","sisalto":"Suureet ovat suoraan verrannolliset, kun niiden suhde pysyy samana. Jos irtokarkkien kilohinta on 8 €, jokaisen pussin hinta jaettuna sen massalla on 8 €/kg. Merkitään massaa x:llä ja hintaa y:llä. Silloin y = 8x, ja yleisesti suoraan verrannollisille suureille pätee y = kx, jossa k on verrannollisuuskerroin. Hintatilanteessa k on kilohinta. Kuvaaja on suora, koska jokainen lisäkilo kasvattaa hintaa saman verran: kun x kasvaa yhdellä, y kasvaa k:lla, olipa x pieni tai suuri. Pisteet nousevat siksi tasaisesti samaa linjaa pitkin. Kuvaaja kulkee origon kautta, koska kun x = 0, myös y = k · 0 = 0: nolla kiloa maksaa nolla euroa. Suora piirretään origosta asti, vaikka taulukossa ei olisi nollaa. Tämän taidon suureet (massa, hinta, aika, pinta-ala, tilavuus) eivät voi olla negatiivisia, joten kerroin k on positiivinen ja suora nousee vasemmalta oikealle. Kuvaaja piirretään silloin vain koordinaatiston oikeaan yläneljännekseen ja sitä rajaaville akseleille."},{"tyyppi":"saanto","otsikko":"Näin piirrät kuvaajan taulukosta","askeleet":["Päätä, kumpi suure tulee vaaka-akselille. Yleensä vaaka-akselille tulee suure, jonka arvon valitset (esimerkiksi massa), ja pystyakselille suure, joka määräytyy siitä (esimerkiksi hinta). Kokeessa tehtävä kertoo, kumpi suure on kummallakin akselilla.","Kirjoita kummankin akselin päähän suure ja yksikkö, esimerkiksi massa (kg) ja hinta (€). Pelkät x ja y eivät kerro lukijalle, mitä kuvaaja esittää, ja kuvaaja ilman suureita ja yksiköitä on kokeessa väärin.","Valitse kummallekin akselille tasavälinen asteikko, johon taulukon suurin arvo mahtuu. Jos massat ovat 1, 2, 3 ja 4 kg ja hinnat 8, 16, 24 ja 32 €, sopiva valinta on esimerkiksi 1 ruutu = 1 kg vaaka-akselilla ja 1 ruutu = 4 € pystyakselilla. Akseleilla saa olla eri asteikot, mutta saman akselin välien on oltava yhtä suuret.","Merkitse taulukon lukuparit pisteiksi (massa, hinta).","Kun suureet ovat suoraan verrannolliset, piirrä viivaimella suora origosta kaikkien pisteiden kautta. Jos pisteet eivät osu samalle origon kautta kulkevalle suoralle, tarkista merkinnät: joko piste on väärässä kohdassa tai suureet eivät ole suoraan verrannolliset.","Kun suureet ovat kääntäen verrannolliset, yhdistä pisteet vapaalla kädellä yhdeksi sileäksi kaareksi äläkä vie käyrää akseleihin asti."]},{"tyyppi":"kappale","otsikko":"Kerroin ja arvot yhdestä pisteestä","sisalto":"Kun tiedät, että kuvaaja on origon kautta kulkeva suora, yksi muu piste riittää. Jos hinnan kuvaaja kulkee pisteen (5 kg, 14 €) kautta, kilohinta on 14 € : 5 kg = 2,80 €/kg. Kun pystyakselilla on y ja vaaka-akselilla x, verrannollisuuskerroin on k = y : x. Kertoimen avulla saat minkä tahansa muun arvon: 3 kg maksaa 3 · 2,80 € = 8,40 €. Toiseen suuntaan jaetaan: 21 eurolla saa 21 : 2,8 = 7,5 kg. Saman voi päätellä myös ilman kerrointa, koska suureet muuttuvat samassa suhteessa: 21 € on 1,5 kertaa 14 €, joten massa on 1,5 · 5 kg = 7,5 kg. Kun luet pisteen valmiista kuvaajasta, valitse kohta, jossa suora kulkee ruudukon viivojen risteyksen kautta. Silloin lukema on tarkka eikä arvio."},{"tyyppi":"ansa","otsikko":"Ansa 1: kilohinta väärin päin","sisalto":"Kuvaaja kulkee pisteen (5 kg, 20 €) kautta. Jos lasket 5 : 20 = 0,25, sait selville, montako kiloa yhdellä eurolla saa, et kilohintaa. Kilohinta on euroa kilolta, joten euromäärä jaetaan kilomäärällä: 20 € : 5 kg = 4 €/kg. Kirjoita yksiköt laskuun, niin suunta näkyy: € : kg = €/kg. Tarkista lopuksi järkevyys: jos 5 kg maksaa 20 €, yksi kilo maksaa enemmän kuin euron. Sama sääntö pätee, vaikka akselit olisivat toisin päin: jos vaaka-akselilla on hinta ja pystyakselilla massa, kilohinta on silti hinta jaettuna massalla."},{"tyyppi":"kappale","otsikko":"Kääntäen verrannollisuuden kuvaaja on hyperbeli","sisalto":"Suureet ovat kääntäen verrannolliset, kun niiden tulo pysyy samana. Jos suorakulmion pinta-ala on 24 cm², leveyden ja pituuden tulo on 24 jokaisessa tapauksessa: leveys 1 cm ja pituus 24 cm, 2 cm ja 12 cm, 3 cm ja 8 cm, 4 cm ja 6 cm, 6 cm ja 4 cm, 8 cm ja 3 cm. Kun nämä pisteet merkitään koordinaatistoon, ne eivät ole samalla suoralla. Syy näkyy luvuista: kun leveys kasvaa senttimetrin kerrallaan, pituus lyhenee ensin 12 cm, sitten 4 cm ja sitten 2 cm. Lasku hidastuu koko ajan, joten pisteet kaartuvat. Tätä käyrää sanotaan hyperbeliksi. Kääntäen verrannollisuuden kuvaaja ei leikkaa kumpaakaan akselia: jos leveys olisi 0, tulo olisi 0 eikä 24, eikä pituuskaan voi olla 0. Kun leveys kasvaa hyvin suureksi, pituus lähestyy nollaa mutta ei saavuta sitä: leveydellä 2 400 cm pituus on 0,01 cm. Arvon luet käyrältä tulon avulla: jos käyrä kulkee pisteen (4, 6) kautta, tulo on 24, ja kohdassa x = 12 on y = 24 : 12 = 2. Tehtävissä matematiikkaohjelmalla piirretty kuvaaja kuvataan sanoin: kerrotaan, onko se suora vai käyrä, ja luetellaan pisteitä, joiden kautta se kulkee. Käyrä esittää kääntäen verrannollisuutta, kun jokaisen luetellun pisteen koordinaattien tulo on sama ja käyrä ei leikkaa akseleita. Jos yksikin tulo poikkeaa muista, kyse ei ole kääntäen verrannollisuudesta, vaikka käyrä laskisi yhä loivemmin eikä leikkaisi akseleita."},{"tyyppi":"ansa","otsikko":"Ansa 2: kääntäen verrannollisuuden käyrä ei ole murtoviiva eikä osu akseliin","sisalto":"Jos pisteet (2, 12) ja (4, 6) yhdistetään viivaimella, janan keskikohdassa x = 3 olisi y = 9. Oikea arvo on 24 : 3 = 8, eli käyrä kulkee janan alapuolella. Siksi kääntäen verrannollisuuden pisteitä ei yhdistetä janoilla, vaan niiden kautta piirretään yksi sileä kaari. Toinen yleinen virhe on jatkaa käyrää niin, että se osuu x- tai y-akseliin. Käyrä lähestyy akseleita mutta ei kosketa niitä, koska tulo ei voi pysyä samana, jos toinen suure on nolla. Jos kaaren muoto on epäselvä, laske tulon avulla lisää pisteitä pisteiden väliin, esimerkiksi (3, 8)."},{"tyyppi":"taulukko","otsikko":"Kuvaajan muodosta päätelmään","otsikkorivi":["Kuvaajan muoto","Mitä se esittää","Miten tarkistat"],"rivit":[["Origon kautta kulkeva suora (tämän taidon suureilla nouseva)","suoraan verrannollisuutta","y : x on sama jokaisessa pisteessä"],["Käyrä, joka laskee yhä loivemmin eikä leikkaa akseleita","kääntäen verrannollisuutta, jos tarkistus pitää","x · y on sama jokaisessa pisteessä; pelkkä muoto ei riitä"],["Nouseva suora, joka ei kulje origon kautta","ei kumpaakaan","kohdassa x = 0 y ei ole 0, joten y : x vaihtelee"],["Laskeva suora, joka leikkaa molemmat akselit","ei kumpaakaan","akseliin osuva kuvaaja ei esitä kääntäen verrannollisuutta, ja x · y vaihtelee"],["Vaakasuora suora","ei kumpaakaan","y pysyy samana, vaikka x muuttuu"],["Origon kautta kulkeva käyrä","ei kumpaakaan","y : x vaihtelee, esimerkiksi neliön pinta-ala ja sivun pituus"]]},{"tyyppi":"ansa","otsikko":"Ansa 3: kaksi harhaanjohtavaa suoraa","sisalto":"Taksimatkan hinnan kuvaaja on nouseva suora, mutta se ei kulje origon kautta. Jos perusmaksu on 6 € ja kilometri maksaa 2 €, hinta on 6 € jo ennen kuin auto liikkuu. Hinta kasvaa matkan kasvaessa, mutta suhde ei pysy samana: 2 km maksaa 10 € eli 5 €/km ja 4 km maksaa 14 € eli 3,50 €/km. Nouseva suora esittää suoraan verrannollisuutta vain, jos se kulkee origon kautta. Toinen ansa on laskeva suora. Kynttilä on aluksi 20 cm pitkä ja lyhenee 2 cm tunnissa: tunnin kuluttua se on 18 cm ja neljän tunnin kuluttua 12 cm. Pituus pienenee ajan kasvaessa, mutta tulo ei pysy samana: 1 · 18 = 18 ja 4 · 12 = 48. Kuvaaja leikkaa lisäksi molemmat akselit, sillä kynttilä on alussa 20 cm ja palaa loppuun 10 tunnissa. Kääntäen verrannollisuuden kuvaaja ei leikkaa akseleita koskaan. Se, että toinen suure pienenee toisen kasvaessa, ei siis yksin tee suureista kääntäen verrannollisia."},{"tyyppi":"muistilappu","otsikko":"Muista nämä","kohdat":["Suoraan verrannollisuus: y = kx. Kuvaaja on origon kautta kulkeva suora. Kun suureet eivät voi olla negatiivisia, se nousee.","Verrannollisuuskerroin yhdestä pisteestä: k = y : x. Kilohinta = hinta : massa (€ : kg).","Kääntäen verrannollisuus: x · y pysyy samana. Kuvaaja on hyperbeli, joka ei leikkaa akseleita. Käyrä, jonka tulot vaihtelevat, ei esitä kääntäen verrannollisuutta.","Kääntäen verrannollisuuden pisteet yhdistetään yhdeksi sileäksi kaareksi, ei janoilla.","Suora, joka ei kulje origon kautta, ei esitä kumpaakaan verrannollisuutta. Tämän taidon suureilla (massa, hinta, aika) laskeva suora ei voi kulkea origon kautta, joten sekään ei esitä kumpaakaan.","Kummallekin akselille suure ja yksikkö, esimerkiksi massa (kg) ja hinta (€).","Kun kuvaaja on kuvattu pisteinä, tarkista luetelluista pisteistä suhde y : x ja tulo x · y."]}],"harjoitusryhmat":[{"id":"suora","nimi":"Suoraan verrannollisuuden kuvaaja","info":"Laske ilman laskinta. Verrannollisuuskerroin on k = y : x. Kilohinta on euroa kilolta eli € : kg."},{"id":"kaanteinen","nimi":"Kääntäen verrannollisuuden kuvaaja","info":"Laske ilman laskinta. Kääntäen verrannollisuudessa x · y pysyy samana. Kääntäen verrannollisuuden kuvaaja ei leikkaa akseleita."},{"id":"tunnista","nimi":"Tunnista kuvaaja","info":"Laske ilman laskinta. Suoraan: origon kautta kulkeva suora (tämän taidon suureilla se nousee). Kääntäen: käyrä, jonka pisteissä x · y on sama ja joka ei leikkaa akseleita. Muut eivät esitä kumpaakaan."}],"harjoitukset":[{"id":"H01","ryhma":"suora","kysymys":"Banaanien hinnan kuvaaja on origon kautta kulkeva suora, joka kulkee pisteen (3 kg, 6 €) kautta. Mikä on kilohinta euroina?","vastaus":2,"vinkki":"Kilohinta on euroa kilolta: jaa hinta massalla.","selitys":"6 € : 3 kg = 2 €/kg. Lasku 3 : 6 = 0,5 antaisi kilot yhtä euroa kohden."},{"id":"H02","ryhma":"suora","kysymys":"Kahvipapujen hinnan kuvaaja on origon kautta kulkeva suora, joka kulkee pisteen (4 kg, 54 €) kautta. Mikä on kilohinta euroina?","vastaus":13.5,"vinkki":"Jaa euromäärä kilomäärällä.","selitys":"54 € : 4 kg = 13,50 €/kg."},{"id":"H03","ryhma":"suora","kysymys":"Tomaattien hinnan kuvaaja on origon kautta kulkeva suora, joka kulkee pisteen (2 kg, 7 €) kautta. Paljonko maksaa 5 kg? Anna vastaus euroina.","vastaus":17.5,"vinkki":"Laske ensin kilohinta ja kerro se sitten massalla.","selitys":"Kilohinta on 7 € : 2 kg = 3,50 €/kg, joten 5 kg maksaa 5 · 3,50 € = 17,50 €."},{"id":"H04","ryhma":"suora","kysymys":"Palkan kuvaaja työajan mukaan on origon kautta kulkeva suora, joka kulkee pisteen (5 h, 60 €) kautta. Montako tuntia pitää tehdä töitä, jotta palkka on 84 €?","vastaus":7,"vinkki":"Laske tuntipalkka ja jaa haluttu palkka sillä.","selitys":"Tuntipalkka on 60 € : 5 h = 12 €/h. 84 € : 12 €/h = 7 h."},{"id":"H05","ryhma":"suora","kysymys":"Kuvaajan vaaka-akselilla on hinta (€) ja pystyakselilla massa (kg). Kuvaaja on origon kautta kulkeva suora, joka kulkee pisteen (12 €, 3 kg) kautta. Mikä on kilohinta euroina?","vastaus":4,"vinkki":"Akselit ovat toisin päin kuin tavallisesti, mutta kilohinta on silti euroa kilolta.","selitys":"Pisteessä 3 kg maksaa 12 €. Kilohinta on 12 € : 3 kg = 4 €/kg. Lasku 3 : 12 = 0,25 antaisi kilot yhtä euroa kohden."},{"id":"H06","ryhma":"suora","kysymys":"Suora kulkee origon ja pisteen (3, 4) kautta. Montako seuraavista pisteistä on samalla suoralla: (6, 8), (4, 3), (9, 12), (5, 6), (12, 16)?","vastaus":3,"vinkki":"Suhteen y : x pitää olla sama kuin pisteessä (3, 4) eli 4 : 3.","selitys":"Suoralla ovat (6, 8), (9, 12) ja (12, 16), koska niissä molemmat koordinaatit on kerrottu samalla luvulla (2, 3 ja 4). Pisteessä (5, 6) molempiin on lisätty 2, ja pisteessä (4, 3) koordinaatit ovat vaihtaneet paikkaa, joten ne eivät ole suoralla."},{"id":"H07","ryhma":"suora","tyyppi":"monivalinta","kysymys":"Miksi kurkkujen hinnan kuvaaja kulkee origon kautta?","vastaus":1,"vinkki":"Mitä maksaa nolla kiloa kurkkuja?","selitys":"Kun massa on 0 kg, hinta on kilohinta · 0 = 0 €, joten kuvaaja kulkee pisteen (0, 0) kautta. Se, että hinta kasvaa massan kasvaessa tai että kuvaaja on suora, pätee myös taksimatkan hintaan, jonka kuvaaja ei kulje origon kautta.","vaihtoehdot":["Koska hinta kasvaa, kun massa kasvaa.","Koska nolla kiloa maksaa nolla euroa.","Koska kuvaaja on suora.","Koska kilohinta on pieni."]},{"id":"H08","ryhma":"kaanteinen","kysymys":"Kääntäen verrannollisuuden kuvaaja kulkee pisteiden (1, 30), (2, 15) ja (3, 10) kautta. Mikä on y, kun x = 5?","vastaus":6,"vinkki":"Laske jonkin pisteen koordinaattien tulo. Se on sama koko käyrällä.","selitys":"Tulo on 1 · 30 = 30. Kun x = 5, y = 30 : 5 = 6."},{"id":"H09","ryhma":"kaanteinen","kysymys":"Säiliön täyttöaika ja virtaama ovat kääntäen verrannolliset. Täyttöajan kuvaaja virtaaman mukaan kulkee pisteen (5 l/min, 12 min) kautta. Kuinka monta minuuttia täyttö kestää, kun virtaama on 10 l/min?","vastaus":6,"vinkki":"Kaksinkertainen virtaama täyttää säiliön puolessa ajassa.","selitys":"Tulo 5 · 12 = 60 on säiliön tilavuus litroina. 60 : 10 = 6 min."},{"id":"H10","ryhma":"kaanteinen","kysymys":"Käytettävissä on aina sama rahamäärä. Ostettavan määrän (kg) kuvaaja kilohinnan (€/kg) mukaan on hyperbeli, joka kulkee pisteen (3 €/kg, 4 kg) kautta. Montako kiloa saa, kun kilohinta on 2 €/kg?","vastaus":6,"vinkki":"Rahamäärä on kilohinnan ja määrän tulo.","selitys":"Rahaa on 3 €/kg · 4 kg = 12 €. Kilohinnalla 2 €/kg saa 12 : 2 = 6 kg."},{"id":"H11","ryhma":"kaanteinen","kysymys":"Kääntäen verrannollisuuden kuvaaja kulkee pisteiden (2, 6) ja (4, 3) kautta. Mikä on kuvaajan y, kun x = 3?","vastaus":4,"vinkki":"Laske tulo x · y. Älä lue arvoa pisteiden väliin vedetyltä janalta.","selitys":"Tulo on 2 · 6 = 12, joten kohdassa x = 3 on y = 12 : 3 = 4. Janalla keskikohdan arvo olisi 4,5, mutta käyrä kulkee janan alapuolella."},{"id":"H12","ryhma":"kaanteinen","kysymys":"Kääntäen verrannollisuuden kuvaaja kulkee pisteen (3, 4) kautta. Montako seuraavista pisteistä on samalla kuvaajalla: (2, 6), (6, 2), (4, 4), (1, 12), (5, 3)?","vastaus":3,"vinkki":"Pisteen koordinaattien tulon pitää olla 3 · 4 = 12.","selitys":"Tulot ovat 12, 12, 16, 12 ja 15. Kuvaajalla ovat (2, 6), (6, 2) ja (1, 12)."},{"id":"H13","ryhma":"kaanteinen","kysymys":"Kääntäen verrannollisuuden kuvaaja kulkee pisteen (2, 8) kautta. Mikä on y, kun x = 1 600? Anna vastaus desimaalilukuna.","vastaus":0.01,"vinkki":"Tulo on 16. Jaa se luvulla 1 600.","selitys":"y = 16 : 1 600 = 0,01. Kun x kasvaa, y lähestyy nollaa mutta ei saavuta sitä, joten käyrä ei osu x-akseliin."},{"id":"H14","ryhma":"tunnista","kysymys":"Kuvaaja 1: suora, joka kulkee pisteiden (0, 0) ja (2, 5) kautta.\nKuvaaja 2: suora, joka kulkee pisteiden (0, 2) ja (3, 8) kautta.\nKuvaaja 3: käyrä, joka kulkee pisteiden (1, 6), (2, 3), (3, 2) ja (6, 1) kautta eikä leikkaa kumpaakaan akselia.\nKuvaaja 4: suora, joka kulkee pisteiden (0, 8) ja (4, 0) kautta.\nKuvaaja 5: suora, joka kulkee pisteiden (0, 0) ja (5, 2) kautta.\n\nMontako näistä viidestä kuvaajasta esittää suoraan verrannollisuutta?","vastaus":2,"vinkki":"Suoraan verrannollisuuden kuvaaja on suora, joka kulkee origon (0, 0) kautta.","selitys":"Kuvaajat 1 ja 5 ovat origon kautta kulkevia suoria. Kuvaaja 2 on nouseva suora, mutta kohdassa x = 0 sen y on 2, joten se ei kulje origon kautta."},{"id":"H15","ryhma":"tunnista","kysymys":"Kuvaaja 1: suora, joka kulkee pisteiden (0, 0) ja (2, 5) kautta.\nKuvaaja 2: suora, joka kulkee pisteiden (0, 2) ja (3, 8) kautta.\nKuvaaja 3: käyrä, joka kulkee pisteiden (1, 6), (2, 3), (3, 2) ja (6, 1) kautta eikä leikkaa kumpaakaan akselia.\nKuvaaja 4: suora, joka kulkee pisteiden (0, 8) ja (4, 0) kautta.\nKuvaaja 5: suora, joka kulkee pisteiden (0, 0) ja (5, 2) kautta.\n\nMontako näistä viidestä kuvaajasta esittää kääntäen verrannollisuutta?","vastaus":1,"vinkki":"Laske käyrien pisteistä tulo x · y. Laskeva suora ei ole hyperbeli.","selitys":"Vain kuvaajassa 3 tulo on joka pisteessä 6 eikä käyrä leikkaa akseleita. Kuvaaja 4 on laskeva suora, joka leikkaa molemmat akselit, joten se ei esitä kääntäen verrannollisuutta."},{"id":"H16","ryhma":"tunnista","kysymys":"Kuvaaja 1: käyrä, joka kulkee pisteiden (0, 0), (1, 2), (2, 8) ja (3, 18) kautta.\nKuvaaja 2: käyrä, joka kulkee pisteiden (1, 8), (2, 4), (4, 2) ja (8, 1) kautta eikä leikkaa kumpaakaan akselia.\nKuvaaja 3: vaakasuora suora, joka kulkee pisteen (0, 4) kautta.\nKuvaaja 4: käyrä, joka kulkee pisteiden (1, 9), (2, 5), (3, 3) ja (4, 2) kautta.\nKuvaaja 5: suora, joka kulkee pisteiden (0, 0) ja (3, 4) kautta.\n\nMontako näistä viidestä kuvaajasta ei esitä suoraan eikä kääntäen verrannollisuutta?","vastaus":3,"vinkki":"Tarkista jokaisesta kuvaajasta sekä suhde y : x että tulo x · y.","selitys":"Kuvaaja 5 esittää suoraan ja kuvaaja 2 kääntäen verrannollisuutta. Kuvaaja 1 kulkee origon kautta, mutta se on käyrä: y : x on 2, 4 ja 6. Kuvaajan 3 y ei muutu. Kuvaajan 4 tulot ovat 9, 10, 9 ja 8, eli ne eivät ole samat. Kumpaakaan eivät esitä kuvaajat 1, 3 ja 4."},{"id":"H17","ryhma":"tunnista","kysymys":"a) neliön piiri ja sivun pituus\nb) taksimatkan hinta ja matkan pituus, kun hintaan kuuluu 5 € perusmaksu\nc) tankatun bensan hinta ja litramäärä, kun litrahinta on 1,80 €\nd) suorakulmion leveys ja pituus, kun pinta-ala on 30 cm²\ne) neliön pinta-ala ja sivun pituus\n\nMontako tilanteista on sellaisia, joiden kuvaaja on origon kautta kulkeva suora?","vastaus":2,"vinkki":"Etsi tilanteet, joissa suureiden suhde pysyy samana ja nolla vastaa nollaa.","selitys":"Neliön piiri on 4 kertaa sivu ja bensan hinta 1,80 kertaa litramäärä, joten a ja c ovat suoraan verrannollisia. Taksin kuvaaja alkaa 5 eurosta, suorakulmion sivut ovat kääntäen verrannolliset ja neliön pinta-alan kuvaaja on käyrä."},{"id":"H18","ryhma":"tunnista","kysymys":"a) säiliön täyttöaika ja virtaama, kun säiliö on aina sama\nb) kynttilän pituus ja kulunut aika, kun kynttilä palaa tasaisesti\nc) suorakulmion leveys ja pituus, kun piiri on 20 cm\nd) ostettavan juuston määrä ja kilohinta, kun käytettävissä on aina 15 €\ne) kankaan hinta ja ostettu metrimäärä, kun metrihinta on 10 €\n\nMontako tilanteista on kääntäen verrannollisia?","vastaus":2,"vinkki":"Kääntäen verrannollisissa suureissa tulo pysyy samana. Pelkkä pieneneminen ei riitä.","selitys":"Täyttöajan ja virtaaman tulo on säiliön tilavuus, ja juuston määrän ja kilohinnan tulo on 15 €. Kynttilän pituus ja suorakulmion pituus (kun piiri on 20 cm) pienenevät tasaisesti, joten niiden kuvaaja on laskeva suora. Kankaan hinta on suoraan verrannollinen metrimäärään."},{"id":"H19","ryhma":"tunnista","tyyppi":"monivalinta","kysymys":"Matematiikkaohjelmalla piirretty kuvaaja on nouseva suora, joka kulkee pisteiden (0, 3) ja (2, 7) kautta. Mitä se esittää?","vastaus":2,"vinkki":"Kulkeeko suora origon kautta?","selitys":"Kohdassa x = 0 kuvaajan y on 3, joten suora ei kulje origon kautta. Suhde y : x ei pysy samana, eikä suora ole hyperbeli, joten se ei esitä kumpaakaan.","vaihtoehdot":["suoraan verrannollisuutta","kääntäen verrannollisuutta","ei kumpaakaan"]},{"id":"H20","ryhma":"tunnista","tyyppi":"monivalinta","kysymys":"Piirrät kuvaajan, joka esittää kankaan hintaa ostetun metrimäärän mukaan. Mikä on paras merkintä pystyakselille?","vastaus":2,"vinkki":"Akselille kuuluu sekä suure että yksikkö.","selitys":"Merkintä hinta (€) kertoo sekä suureen että yksikön. Pelkkä y tai pelkkä € jättää lukijan arvaamaan, ja metrit kuuluvat vaaka-akselille.","vaihtoehdot":["y","€","hinta (€)","metrimäärä (m)"]}],"valmis_teksti":"Piirrät suoraan verrannollisten suureiden kuvaajan taulukosta käsin ja merkitset akseleille suureet ja yksiköt, luet kuvaajasta verrannollisuuskertoimen, kuten kilohinnan, ja tunnistat valmiista kuvaajista suoraan ja kääntäen verrannollisuuden. Perustelet, miksi suoraan verrannollisuuden kuvaaja on origon kautta kulkeva suora ja kääntäen verrannollisuuden kuvaaja hyperbeli. Tämä taito on nyt näytetty."};

  const pyor = (v%10)>=5 ? yla : ala;
  const x = n => X0 + (n/100)*(X1-X0);
  let s=`<line class="rail" x1="${X0}" y1="${Y}" x2="${X1}" y2="${Y}"/>`;
  for(let n=0;n<=100;n+=10){
    const near = (n===ala||n===yla);
    s+=`<line class="tick" x1="${x(n)}" y1="${Y-7}" x2="${x(n)}" y2="${Y+7}"/>`;
    s+=`<text class="stop${near?" near":""}" x="${x(n)}" y="${Y+24}" text-anchor="middle">${n}</text>`;
  }
  s+=`<line class="halfway" x1="${x(puoli)}" y1="${Y-16}" x2="${x(puoli)}" y2="${Y+12}"/>`;
  s+=`<text class="stop" x="${x(puoli)}" y="${Y-22}" text-anchor="middle">puoliväli ${puoli}</text>`;
  s+=`<circle class="dot" cx="${x(v)}" cy="${Y}" r="6"/>`;
  s+=`<text class="val" x="${x(v)}" y="${Y-32}" text-anchor="middle">${v}</text>`;
  s+=`<path d="M ${x(v)} ${Y+38} L ${x(pyor)} ${Y+38}" stroke="var(--core)" stroke-width="2" fill="none"/>`;
  s+=`<path d="M ${x(pyor)} ${Y+38} l ${x(pyor)>x(v)?-7:7} -4 l 0 8 z" fill="var(--core)"/>`;
  svg.innerHTML=s;
  out.textContent = `${v} pyöristyy → ${pyor}`;
}

/* ---------- laskujärjestys-widget ---------- */
const ljExp=document.getElementById("ljExp");
if(ljExp && D.kokeilu){
  let ljI=0, ljTokens=[], ljStep=0;
  const laske=(a,op,b)=>{a=+a;b=+b;return op==="×"?a*b:op==="÷"?a/b:op==="+"?a+b:a-b;};
  function ljAlku(){
    const l=D.kokeilu[ljI];
    ljTokens=l.lauseke.replace(/\(/g,"( ").replace(/\)/g," )").split(/\s+/).filter(Boolean);
    ljStep=0; ljPiirra(); ljViesti("","");
  }
  function ljViesti(t,lk){const f=document.getElementById("ljFb"); f.textContent=t; f.className="lj-fb "+(lk||"");}
  function ljPiirra(){
    const l=D.kokeilu[ljI];
    document.getElementById("ljStep").textContent =
      ljStep>=l.askeleet.length ? "valmis" : `askel ${ljStep+1} / ${l.askeleet.length}`;
    if(ljStep>=l.askeleet.length){
      ljExp.innerHTML=`<span class="valmis">${l.lauseke} = ${l.vastaus}</span>`;
      return;
    }
    ljExp.innerHTML=ljTokens.map((t,i)=>
      "×÷+−".includes(t) ? `<button type="button" class="op" data-i="${i}">${t}</button>`
                         : `<span class="tok">${t}</span>`).join("");
    ljExp.querySelectorAll("button.op").forEach(b=>b.addEventListener("click",()=>ljKlikkaa(+b.dataset.i)));
  }
  function ljKlikkaa(i){
    const l=D.kokeilu[ljI], odotettu=l.askeleet[ljStep];
    const ehdotus=[ljTokens[i-1],ljTokens[i],ljTokens[i+1]].join(" ");
    if(ehdotus!==odotettu){
      ljViesti(ljStep===0
        ? "Ei vielä. Sulkeet ovat vahvimmat, sitten kerto ja jako. Yhtä vahvat vasemmalta oikealle."
        : "Ei vielä. Kumpi jäljellä olevista on vahvempi?", "no");
      return;
    }
    const arvo=laske(ljTokens[i-1],ljTokens[i],ljTokens[i+1]);
    let alku=i-1, loppu=i+1;
    if(ljTokens[i-2]==="(" && ljTokens[i+2]===")"){ alku=i-2; loppu=i+2; }
    ljTokens.splice(alku, loppu-alku+1, String(arvo));
    ljStep++;
    ljViesti(ljStep>=l.askeleet.length ? "Valmis. Vastaus on "+l.vastaus+"." : "Oikein. Jatka seuraavaan.", "ok");
    ljPiirra();
  }
  document.getElementById("ljSeuraava").addEventListener("click",()=>{
    ljI=(ljI+1)%D.kokeilu.length; ljAlku();
  });
  ljAlku();
}

};

/* Suomalainen lukumuoto: välilyönti on tuhaterotin, pilkku desimaalierotin.
   Piste voi olla kumpi tahansa. Se tulkitaan tuhaterottimeksi VAIN silloin, kun
   koko luku on aitoa tuhaterotinmuotoa: alkuosa 1–3 numeroa ilman etunollaa ja
   jokainen jatko-osa täsmälleen 3 numeroa (1.500, 12.345.678). Kaikissa muissa
   tapauksissa piste on desimaalipiste — myös 0.125, joka vanhalla säännöllä
   ("3 numeroa pisteen jäljessä = tuhaterotin") luettiin virheellisesti luvuksi 125. */
const TUHATEROTIN = /^[1-9]\d{0,2}(\.\d{3})+$/;
function lueLuku(teksti){
  // Murtoluku (3/4, -3/4) ja sekaluku (1 2/3, -1 2/3) hyväksytään sellaisinaan.
  const raaka = String(teksti).replace(/\u00a0/g, " ").trim();
  let m = raaka.match(/^(-?)(\d+)\s+(\d+)\s*\/\s*(\d+)$/);
  if(m){ const nim = Number(m[4]); if(nim === 0) return null;
    const v = Number(m[2]) + Number(m[3]) / nim; return m[1] ? -v : v; }
  m = raaka.match(/^(-?)\s*(\d+)\s*\/\s*(\d+)$/);
  if(m){ const nim = Number(m[3]); if(nim === 0) return null;
    const v = Number(m[2]) / nim; return m[1] ? -v : v; }
  let s = String(teksti).replace(/[\s\u00a0]/g, "");
  if(s === "") return null;
  if(s.indexOf(",") >= 0){
    s = s.replace(/\./g, "").replace(",", ".");
  } else if(TUHATEROTIN.test(s)){
    s = s.replace(/\./g, "");
  }
  const n = Number(s);
  return Number.isFinite(n) ? n : null;
}

function tarkista(id){
  const h=D.harjoitukset.find(x=>x.id===id);
  const kentta=document.getElementById("in-"+id);
  const fb=document.getElementById("fb-"+id);
  if(kentta.value.trim()===""){ fb.className="fb hint"; fb.textContent="Kirjoita vastaus ensin."; return; }
  const luku=lueLuku(kentta.value);
  if(luku===null){ fb.className="fb no"; fb.textContent="Vastauksen pitää olla luku tai murtoluku (esimerkiksi 3/4)."; return; }
  const oikein = Math.abs(luku - h.vastaus) < 1e-9;
  merkitseTulos(id, oikein, oikein ? "Oikein. "+h.selitys : `Ei vielä. ${h.vinkki} Kokeile uudelleen.`);
}

function tarkistaMonivalinta(id, valittuIndeksi, painike){
  const h=D.harjoitukset.find(x=>x.id===id);
  const rivi=painike.closest(".row");
  rivi.querySelectorAll(".mv-valinta").forEach(b=>b.disabled=true);
  const oikein = valittuIndeksi===h.vastaus;
  painike.classList.add(oikein?"mv-oikein":"mv-vaarin");
  if(!oikein){
    const oikeaBtn=rivi.querySelector(`[data-i="${h.vastaus}"]`);
    if(oikeaBtn) oikeaBtn.classList.add("mv-oikein");
  }
  merkitseTulos(id, oikein, oikein ? "Oikein. "+h.selitys : `Ei ihan. Oikea vastaus on korostettu. ${h.selitys||""}`);
}

/* Kuuntelu: selain lukee tekstin ääneen omalla puhesynteesillään (englanniksi, jos laitteessa on
   englanninkielinen ääni). Ei äänitiedostoja eikä verkkoyhteyttä. Jos laite ei osaa puhua,
   teksti näytetään luettavaksi — silloin tehtävä muuttuu luetun ymmärtämiseksi, mutta ei katkea. */
function puhu(id, nopeus){
  const h=D.harjoitukset.find(x=>x.id===id); if(!h || !h.kuuntele) return;
  const vara=document.getElementById("vara-"+id);
  const naytaTeksti=syy=>{ vara.hidden=false; vara.textContent=syy+" Teksti: "+h.kuuntele; };
  if(!("speechSynthesis" in window)){ naytaTeksti("Tämä laite ei osaa lukea ääneen."); return; }
  const s=window.speechSynthesis; s.cancel();
  const u=new SpeechSynthesisUtterance(h.kuuntele);
  u.lang=h.kieli||"en-GB"; u.rate=nopeus;
  const aanet=s.getVoices(), kieli=u.lang.slice(0,2);
  const aani=aanet.find(a=>a.lang===u.lang) || aanet.find(a=>a.lang && a.lang.startsWith(kieli));
  if(aani) u.voice=aani;
  else if(aanet.length) { naytaTeksti("Laitteessa ei ole englanninkielistä ääntä."); return; }
  u.onerror=()=>naytaTeksti("Ääneen lukeminen ei onnistunut.");
  s.speak(u);
}
