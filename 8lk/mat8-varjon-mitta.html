<title>Varjon mitta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">

<style>
:root{
  --paper:#EFF2F5; --surface:#FFFFFF; --surface-2:#F7F9FB;
  --grid:#DCE3EA; --line:#C9D3DC;
  --ink:#15222C; --ink-2:#4E626F; --ink-3:#7E8F9B;
  --core:#1B5A9E; --core-soft:#E4EDF6;
  --strong:#1F6E5C; --strong-soft:#E1F0EB;
  --chal:#9A6A16; --chal-soft:#F6EDDC;
  --alert:#A33A2B; --alert-soft:#F8E7E3;
  --shadow:0 1px 2px rgba(21,34,44,.06), 0 8px 24px -12px rgba(21,34,44,.18);
  --r:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0F161B; --surface:#18222A; --surface-2:#1D2830;
    --grid:#22303A; --line:#2E3E4A;
    --ink:#E8EFF4; --ink-2:#A3B4C0; --ink-3:#7A8B97;
    --core:#7FB2E4; --core-soft:#16303F;
    --strong:#77CDB4; --strong-soft:#123028;
    --chal:#E0B267; --chal-soft:#33270F;
    --alert:#E8907F; --alert-soft:#3A1E19;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -14px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --paper:#0F161B; --surface:#18222A; --surface-2:#1D2830;
  --grid:#22303A; --line:#2E3E4A;
  --ink:#E8EFF4; --ink-2:#A3B4C0; --ink-3:#7A8B97;
  --core:#7FB2E4; --core-soft:#16303F;
  --strong:#77CDB4; --strong-soft:#123028;
  --chal:#E0B267; --chal-soft:#33270F;
  --alert:#E8907F; --alert-soft:#3A1E19;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -14px rgba(0,0,0,.7);
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:16px; line-height:1.62;
  background-image:
    linear-gradient(to right, var(--grid) 1px, transparent 1px),
    linear-gradient(to bottom, var(--grid) 1px, transparent 1px);
  background-size:26px 26px;
}
.wrap{max-width:760px; margin:0 auto; padding:28px 20px 90px}
h1,h2,h3,h4{font-family:"Familjen Grotesk","IBM Plex Sans",system-ui,sans-serif; text-wrap:balance}

/* header */
header.top{background:var(--surface); border:1px solid var(--line); border-radius:var(--r);
  box-shadow:var(--shadow); padding:22px 24px; display:flex; gap:18px; align-items:flex-start}
.badge{flex:0 0 auto; width:54px; height:54px; border-radius:9px; display:grid; place-items:center;
  background:var(--core-soft); border:1px solid var(--core); color:var(--core)}
.badge svg{width:28px; height:28px; fill:none; stroke:currentColor; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round}
.eyebrow{font-family:"IBM Plex Mono",monospace; font-size:11px; letter-spacing:.14em;
  text-transform:uppercase; color:var(--ink-3); margin:0 0 5px}
header.top h1{margin:0; font-size:30px; font-weight:700; letter-spacing:-.015em}
header.top p{margin:5px 0 0; color:var(--ink-2); font-size:15px}
.tags{display:flex; flex-wrap:wrap; gap:5px; margin-top:11px}
.tag{font-family:"IBM Plex Mono",monospace; font-size:10.5px; letter-spacing:.05em; padding:2px 7px;
  border-radius:4px; background:var(--surface-2); border:1px solid var(--line); color:var(--ink-3)}
.tag.core{background:var(--core-soft); border-color:var(--core); color:var(--core)}

/* teksti */
article{margin-top:26px}
article h2{font-size:21px; font-weight:600; margin:32px 0 10px; letter-spacing:-.01em}
article p{margin:0 0 14px; max-width:64ch}
.lead{font-size:17.5px; color:var(--ink); border-left:3px solid var(--core); padding-left:16px; margin:0 0 8px}

.box{background:var(--surface); border:1px solid var(--line); border-radius:var(--r);
  padding:18px 22px; box-shadow:var(--shadow); margin:22px 0}
.box h3{margin:0 0 12px; font-size:16.5px; font-weight:600}
.box.warn{border-left:3px solid var(--alert)}
.box.note{border-left:3px solid var(--chal)}

ol.steps{margin:0; padding-left:0; list-style:none; counter-reset:s; display:grid; gap:12px}
ol.steps li{counter-increment:s; display:grid; grid-template-columns:auto 1fr; gap:13px; align-items:start}
ol.steps li::before{content:counter(s); font-family:"Familjen Grotesk",sans-serif; font-weight:700; font-size:14px;
  width:26px; height:26px; border-radius:50%; background:var(--core); color:#fff; display:grid; place-items:center; margin-top:2px}

ul.notes{margin:0; padding-left:19px}
ul.notes li{margin-bottom:7px}
ul.notes li:last-child{margin-bottom:0}

.tablewrap{overflow-x:auto}
table{border-collapse:collapse; width:100%; font-size:14.5px; min-width:460px}
th,td{text-align:left; padding:9px 13px; border-bottom:1px solid var(--line)}
th{font-family:"IBM Plex Mono",monospace; font-size:10.5px; letter-spacing:.1em; text-transform:uppercase;
  color:var(--ink-3); font-weight:400; background:var(--surface-2)}
tr:last-child td{border-bottom:0}
td b{color:var(--core); font-weight:600}
td:last-child{font-variant-numeric:tabular-nums; font-weight:600}

/* lukusuora */
.nl svg{width:100%; height:118px; display:block}
.nl .rail{stroke:var(--line); stroke-width:2}
.nl .tick{stroke:var(--line); stroke-width:1.5}
.nl .stop{fill:var(--ink-3); font-family:"IBM Plex Mono",monospace; font-size:11px}
.nl .stop.near{fill:var(--core); font-weight:600}
.nl .dot{fill:var(--chal)}
.nl .val{fill:var(--ink); font-family:"Familjen Grotesk",sans-serif; font-size:15px; font-weight:700}
.nl .halfway{stroke:var(--chal); stroke-dasharray:3 3; stroke-width:1.5}
.nl-controls{display:flex; align-items:center; gap:14px; margin-top:6px}
.nl-controls input{flex:1; accent-color:var(--core)}
.nl-out{font-family:"Familjen Grotesk",sans-serif; font-size:15px; font-weight:600; min-width:12.5em; text-align:right}

/* paikka-arvotaulu */
.box .ohje{margin:0 0 14px; font-size:14.5px; color:var(--ink-2)}
.nt-valinta{display:flex; flex-wrap:wrap; gap:7px; margin-bottom:16px}
.nt-valinta button{font:inherit; font-size:12.5px; font-family:"IBM Plex Mono",monospace; padding:5px 11px;
  border-radius:6px; border:1px solid var(--line); background:var(--surface-2); color:var(--ink-2); cursor:pointer}
.nt-valinta button[aria-pressed="true"]{background:var(--ink); color:var(--paper); border-color:var(--ink)}
.nt-valinta button:focus-visible{outline:2px solid var(--core); outline-offset:2px}
.nt-taulu{display:flex; flex-direction:column; gap:4px; align-items:flex-start; overflow-x:auto; padding-bottom:4px}
.nt-rivi{display:flex; gap:6px; align-items:center}
.nt-rivi .otsa{font-family:"IBM Plex Mono",monospace; font-size:9.5px; letter-spacing:.08em;
  text-transform:uppercase; color:var(--ink-3); width:52px; text-align:center}
.nt-ruutu{width:52px; height:52px; display:grid; place-items:center; border:1.5px solid var(--line);
  border-radius:7px; background:var(--surface-2); font-family:"IBM Plex Mono",monospace; font-size:24px}
.nt-ruutu.kohta{border-color:var(--core); background:var(--core-soft); color:var(--core); font-weight:500}
.nt-ruutu.ratkaiseva{border-color:var(--chal); background:var(--chal-soft); color:var(--chal); font-weight:500}
.nt-ruutu.nolla{color:var(--ink-3)}
.nt-rivi .nimi{font-size:12.5px; color:var(--ink-3); margin-left:12px; white-space:nowrap}
.nt-nuoli{font-size:17px; color:var(--chal); margin-left:6px}
.nt-selite{margin:14px 0 0; font-size:14.5px}
.nt-selite b{color:var(--core)}

/* vahvuusportaat */
.vp-tasot{display:grid; gap:9px; margin-bottom:18px}
.vp-taso{display:flex; gap:11px; align-items:flex-start; font-size:13.5px}
.vp-taso .vp-pallo{width:13px; height:13px; border-radius:4px; margin-top:5px; flex:0 0 auto}
.vp-taso[data-taso="sulkeet"] .vp-pallo{background:var(--core)}
.vp-taso[data-taso="kertojako"] .vp-pallo{background:var(--strong)}
.vp-taso[data-taso="yhteenvahennys"] .vp-pallo{background:var(--chal)}
.vp-taso strong{display:block; font-family:"Familjen Grotesk",sans-serif; font-weight:600; font-size:14.5px}
.vp-taso span{color:var(--ink-2)}
.vp-lauseke{display:flex; flex-wrap:wrap; gap:7px; align-items:flex-end; font-family:"IBM Plex Mono",monospace;
  font-size:25px; padding:10px 2px; min-height:64px}
.vp-lauseke .t{padding:2px 3px}
.vp-lauseke .op{position:relative; padding:2px 9px; border-radius:6px; font-weight:500}
.vp-lauseke .op[data-taso="sulkeet"]{background:var(--core-soft); color:var(--core)}
.vp-lauseke .op[data-taso="kertojako"]{background:var(--strong-soft); color:var(--strong)}
.vp-lauseke .op[data-taso="yhteenvahennys"]{background:var(--chal-soft); color:var(--chal)}
.vp-lauseke .op i{position:absolute; top:-9px; right:-6px; font-style:normal; font-family:"Familjen Grotesk",sans-serif;
  font-size:11px; font-weight:700; width:18px; height:18px; border-radius:50%; display:grid; place-items:center;
  background:currentColor}
.vp-lauseke .op i span{color:var(--surface)}
.vp-rivi{display:flex; align-items:center; gap:16px; margin-top:8px}
.vp-vastaus{font-family:"Familjen Grotesk",sans-serif; font-size:16px; font-weight:600; color:var(--strong)}

/* laskujärjestys-widget */
.lj-exp{display:flex; flex-wrap:wrap; gap:7px; align-items:center; font-family:"IBM Plex Mono",monospace;
  font-size:23px; padding:14px 4px; min-height:62px}
.lj-exp .tok{padding:2px 4px; color:var(--ink)}
.lj-exp button.op{font-family:"IBM Plex Mono",monospace; font-size:23px; padding:3px 12px; border-radius:7px;
  border:1.5px solid var(--line); background:var(--surface-2); color:var(--ink); line-height:1.2}
.lj-exp button.op:hover{border-color:var(--core); color:var(--core)}
.lj-exp button.op:focus-visible{outline:2px solid var(--core); outline-offset:2px}
.lj-exp .valmis{font-family:"Familjen Grotesk",sans-serif; font-size:23px; font-weight:700; color:var(--strong)}
.lj-fb{font-size:14.5px; min-height:1.5em; color:var(--ink-2)}
.lj-fb.no{color:var(--alert)}
.lj-fb.ok{color:var(--strong)}
.lj-row{display:flex; align-items:center; gap:14px; margin-top:10px}
.lj-step{font-family:"IBM Plex Mono",monospace; font-size:11.5px; letter-spacing:.1em;
  text-transform:uppercase; color:var(--ink-3)}

/* harjoitukset */
.progress{position:sticky; top:0; z-index:5; background:var(--surface); border:1px solid var(--line);
  border-radius:var(--r); padding:12px 18px; box-shadow:var(--shadow); display:flex; align-items:center;
  gap:14px; margin:34px 0 18px}
.progress .lbl{font-family:"IBM Plex Mono",monospace; font-size:11px; letter-spacing:.12em;
  text-transform:uppercase; color:var(--ink-3); white-space:nowrap}
.progress .meter{flex:1; height:7px; border-radius:4px; background:var(--surface-2); border:1px solid var(--line); overflow:hidden}
.progress .meter i{display:block; height:100%; background:var(--core); transition:width .25s ease}
.progress .cnt{font-family:"Familjen Grotesk",sans-serif; font-weight:700; font-variant-numeric:tabular-nums; white-space:nowrap}

.grp{margin-top:26px}
.grp-head{display:flex; align-items:baseline; gap:10px; border-bottom:1.5px solid var(--ink); padding-bottom:7px; margin-bottom:14px}
.grp-head h3{margin:0; font-size:17px; font-weight:600}
.grp-head span{font-size:12.5px; color:var(--ink-2)}

.ex{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:14px 16px; margin-bottom:10px}
.ex[data-tila="oikein"]{border-color:var(--strong); box-shadow:inset 3px 0 0 var(--strong)}
.ex[data-tila="vaarin"]{border-color:var(--alert); box-shadow:inset 3px 0 0 var(--alert)}
.ex .q{display:flex; gap:11px; align-items:baseline; flex-wrap:wrap}
.ex .num{font-family:"IBM Plex Mono",monospace; font-size:11.5px; color:var(--ink-3); min-width:2.4em}
.ex .txt{flex:1; min-width:190px; font-size:15.5px}
.ex .txt .aineisto{display:block; margin-bottom:9px; padding-left:12px;
  border-left:2px solid var(--line); color:var(--ink-2); line-height:1.6;
  /* Aineisto voi olla pieni taulukko, jonka rivit on erotettu rivinvaihdoilla.
     Ilman pre-lineä ne valuisivat yhdeksi kappaleeksi ja taulukko katoaisi. */
  white-space:pre-line}
.ex .txt .kysymysrivi{display:block; font-weight:600}
.ex .row{display:flex; gap:8px; align-items:center; margin-top:11px; flex-wrap:wrap}
.ex input[type=text]{font:inherit; font-family:"IBM Plex Mono",monospace; font-size:15px; width:8.5em;
  padding:7px 11px; border:1px solid var(--line); border-radius:7px; background:var(--surface-2);
  color:var(--ink); text-align:right}
.ex input:focus-visible{outline:2px solid var(--core); outline-offset:1px}
button{font:inherit; cursor:pointer}
.btn{font-size:13.5px; padding:7px 15px; border-radius:7px; border:1px solid var(--core);
  background:var(--core); color:#fff}
.btn.ghost{background:transparent; color:var(--ink-2); border-color:var(--line)}
.btn:focus-visible{outline:2px solid var(--core); outline-offset:2px}
.btn.mv-valinta{text-align:left}
/* kuuntelutehtävä: selaimen puhesynteesi lukee englanninkielisen tekstin */
.kuuntele{display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin:2px 0 10px}
.kuuntele .btn{display:inline-flex; gap:7px; align-items:center}
.kuuntele svg{width:16px; height:16px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round}
.kuuntele .varateksti{flex-basis:100%; font-size:14px; color:var(--ink-2); background:var(--surface-2);
  border-radius:7px; padding:8px 12px; margin:0}
.btn.mv-valinta:disabled{cursor:default; opacity:.65}
.btn.mv-oikein{background:var(--strong-soft); border-color:var(--strong); color:var(--strong); opacity:1}
.btn.mv-vaarin{background:var(--alert-soft); border-color:var(--alert); color:var(--alert); opacity:1}
.row.mv{gap:8px 10px}
.fb{margin-top:11px; font-size:14.5px; padding:10px 13px; border-radius:8px; line-height:1.5}
.fb.ok{background:var(--strong-soft); color:var(--strong)}
.fb.no{background:var(--alert-soft); color:var(--alert)}
.fb.hint{background:var(--chal-soft); color:var(--chal)}

.done{background:var(--strong-soft); border:1px solid var(--strong); color:var(--strong);
  border-radius:var(--r); padding:16px 20px; margin-top:20px; font-size:15.5px}
.done h3{margin:0 0 4px; font-size:17px; color:var(--strong)}

details.teacher{margin-top:34px; background:var(--surface); border:1px solid var(--line);
  border-left:3px solid var(--chal); border-radius:var(--r); padding:15px 20px; box-shadow:var(--shadow)}
details.teacher summary{cursor:pointer; font-family:"Familjen Grotesk",sans-serif; font-weight:600; font-size:15px}
details.teacher summary:focus-visible{outline:2px solid var(--core); outline-offset:3px}
details.teacher ul{margin:12px 0 0; padding-left:19px; color:var(--ink-2); font-size:14.5px}
details.teacher li{margin-bottom:8px}
details.teacher p{margin:12px 0 0; color:var(--ink-2); font-size:14.5px}

.back{display:inline-block; margin-top:30px; font-size:13.5px; color:var(--ink-2)}
.back a{color:var(--core)}

@media (prefers-reduced-motion: reduce){*{transition:none !important}}
@media (max-width:560px){
  .wrap{padding:16px 13px 70px}
  header.top h1{font-size:25px}
  .progress{flex-wrap:wrap}
}
</style>

<div class="wrap">

  <header class="top">
    <span class="badge"><svg viewBox="0 0 24 24" aria-hidden="true" id="ikoni"></svg></span>
    <div>
      <p class="eyebrow" id="eyebrow"></p>
      <h1 id="otsikko"></h1>
      <p id="kuvaus"></p>
      <div class="tags" id="tags"></div>
    </div>
  </header>

  <article id="teksti"></article>

  <div class="progress" aria-live="polite">
    <span class="lbl">Harjoitukset</span>
    <span class="meter"><i id="pbar" style="width:0%"></i></span>
    <span class="cnt" id="pcnt">0 / 20</span>
  </div>

  <div id="harjoitukset"></div>
  <div id="valmis"></div>

  <p class="back" id="back"></p>

</div>

<script>
const D = {"tavoite_id":"MAT8-GEO-08","oppiaine":"MAT","vuosiluokka":8,"taso":"vahvistava","otsikko":"Varjon mitta","kuvaus":"Osaan todeta kolmiot yhdenmuotoisiksi kulmien avulla ja laskea niistä pituuksia.","versio":"0.2","paivitetty":"2026-10-11","ops":{"T":["T7","T10","T16"],"S":["S5"]},"ikoni":"puu","eyebrow":"Matematiikka · 8. luokka · Geometria","teksti":[{"tyyppi":"johdanto","sisalto":"Koulun pihan männyn korkeutta ei voi mitata mittanauhalla, ellei joku kiipeä latvaan. Aurinkoisena päivänä riittää kuitenkin suora keppi ja mittanauha, jolla mitataan maata pitkin. Pystytä keppi maahan ja mittaa kepin pituus ja sen varjon pituus. Mittaa samaan aikaan männyn varjo. Keppi, sen varjo ja auringonsäde muodostavat pienen kolmion, ja mänty, sen varjo ja auringonsäde suuren kolmion. Kolmiot ovat yhdenmuotoiset, vaikka männyn korkeutta ei tiedetä, ja syy löytyy kulmista: kummassakin kolmiossa on suora kulma maan kohdalla, ja auringonsäde osuu maahan samassa kulmassa. Tässä taidossa opit toteamaan kolmiot yhdenmuotoisiksi kahden yhtä suuren kulman avulla ja laskemaan niistä pituuksia: puun korkeuden varjosta, kolmion sisällä olevan pienemmän kolmion sivun ja kolmion sisään piirretyn neliön sivun. Tärkein työtapa on tämä: perustele yhdenmuotoisuus nimeämällä kaksi yhtä suurta kulmaa ja syy (yhteinen kulma, ristikulmat, samankohtaiset kulmat) ennen verrantoa. Vastinsivut ja verranto ovat sinulle tuttuja edellisestä taidosta."},{"tyyppi":"kappale","otsikko":"Kolmiossa kaksi kulmaa riittää","sisalto":"Edellisessä taidossa kuviot todettiin yhdenmuotoisiksi kahdella ehdolla: vastinkulmat ovat yhtä suuret ja vastinsivut verrannolliset. Kolmioissa ensimmäinen ehto riittää yksinään. Kokeile vihkoon: piirrä 4 cm:n jana ja sen päihin kulmat 40° ja 70°. Kulmien kyljet kohtaavat yhdessä pisteessä, joten kolmio on näillä tiedoilla määrätty. Piirrä sitten 8 cm:n jana ja samat kulmat. Syntyy kolmio, jonka jokainen sivu on kaksi kertaa niin pitkä kuin ensimmäisessä, koska koko piirros on sama kuva kaksinkertaisena. Kun kolmioiden kulmat ovat samat, muoto on sama ja vain koko voi vaihdella. Lisäksi riittää tietää kaksi kulmaparia. Kolmion kulmien summa on 180°, joten jos ∠A = ∠D ja ∠B = ∠E, myös kolmannet kulmat ovat yhtä suuret: ∠C = 180° − ∠A − ∠B = 180° − ∠D − ∠E = ∠F. Yksi kulmapari ei riitä. Kolmioissa, joiden kulmat ovat 50°, 60° ja 70° sekä 50°, 30° ja 100°, on kummassakin 50°:n kulma, mutta muut kulmat eroavat, joten muoto on eri. Sääntö koskee vain kolmioita. Neliön ja pitkän suorakulmion kaikki kulmat ovat suoria, mutta ne eivät ole yhdenmuotoiset, koska sivujen suhteet eroavat. Nelikulmioissa tarvitaan edelleen molemmat ehdot."},{"tyyppi":"kappale","otsikko":"Mistä tiedät, että kulmat ovat yhtä suuret","sisalto":"Kulmia ei mitata piirroksesta, vaan niiden yhtäsuuruus päätellään annetuista tiedoista. Tavallisimmat syyt ovat nämä. Yhteinen kulma: kun pieni kolmio on ison sisällä ja niillä on sama kärki, kuten kolmioilla ADE ja ABC kärjessä A, sama kulma kuuluu kumpaankin kolmioon. Ristikulmat: kun kaksi janaa leikkaa toisensa, vastakkaiset kulmat ovat yhtä suuret. Samankohtaiset kulmat: kun DE ∥ BC ja suora AB leikkaa ne, kulmat ∠ADE ja ∠ABC ovat samankohtaiset ja siksi yhtä suuret. Yhdensuuntaisuuden pitää olla annettu tai seurata jostakin tiedosta; jos sitä ei ole kerrottu, kulmaa ei saa siirtää. Vuorokulmat: yhdensuuntaisten suorien välissä, leikkaavan suoran eri puolilla olevat kulmat ovat yhtä suuret, koska vuorokulma on samankohtaisen kulman ristikulma. Suorat kulmat: pystysuora keppi ja pystysuora puu ovat kohtisuorassa tasaista maata vastaan, joten kumpaankin kolmioon tulee 90°:n kulma. Varjotehtävissä toinen kulmapari tulee auringosta. Aurinko on niin kaukana, että sen säteet ovat käytännössä yhdensuuntaiset. Ne osuvat siksi samaan aikaan tasaiseen maahan samassa kulmassa: säteet ovat yhdensuuntaiset suorat ja maa niitä leikkaava suora, joten kulmat ovat samankohtaiset. Kirjoita peruste jokaisen kulmaparin perään, esimerkiksi \"∠A = ∠A (yhteinen kulma)\" ja \"∠ADE = ∠ABC (samankohtaiset kulmat, DE ∥ BC)\". \"Kolmiot näyttävät samanmuotoisilta\" ei ole peruste."},{"tyyppi":"saanto","otsikko":"Näin ratkaiset","askeleet":["Piirrä luonnos ja merkitse siihen annetut tiedot. Etsi kaksi kolmiota: toisessa on kysytty pituus ja toisessa sen vastinsivu.","Nimeä kaksi yhtä suurta kulmaparia ja kirjoita kummankin syy.","Kirjoita vastinkärjet pareiksi: yhtä suurten kulmien kärjet vastaavat toisiaan, ja jäljelle jääneet kärjet vastaavat toisiaan. Kirjoita yhdenmuotoisuus kärkien järjestyksessä, esimerkiksi ADE ~ ABC.","Valitse vastinsivut vastinkärjistä: sivun päätepisteiden vastinkärjet ovat vastinsivun päätepisteet. Vastinsivu on yhtä suurta kulmaa vastapäätä oleva sivu, ei sivu, joka on piirroksessa samassa kohdassa.","Kirjoita verranto niin, että saman kolmion sivut ovat samassa kohdassa. Kun pieni kolmio on ison sisällä, käytä ison kolmion koko sivua.","Ratkaise verranto. Tuloksen sijoittaminen takaisin verrantoon paljastaa vain laskuvirheen, ei väärin valittuja sivuja, koska väärästäkin verrannosta laskettu tulos toteuttaa sen verrannon. Tarkista siksi sivujen valinta vaiheista 2–4: tulevatko sivuparit vastinkärjistä, ja onko verrannossa ison kolmion koko sivu eikä osajana?"]},{"tyyppi":"taulukko","otsikko":"Esimerkki: kolmiossa ABC piste D on sivulla AB ja piste E sivulla AC, DE ∥ BC, AD = 8 cm, DB = 4 cm ja DE = 6 cm","otsikkorivi":["Vaihe","Merkintä","Selitys"],"rivit":[["Kuvio","pieni kolmio ADE ja iso kolmio ABC","pieni kolmio on ison sisällä kärjessä A"],["Kulmapari 1","∠A = ∠A","yhteinen kulma"],["Kulmapari 2","∠ADE = ∠ABC","samankohtaiset kulmat, koska DE ∥ BC"],["Vastinkärjet","A–A, D–B, E–C eli ADE ~ ABC","yhtä suurten kulmien kärjet pareiksi"],["Vastinsivut","AD ja AB, DE ja BC","AB = AD + DB = 8 cm + 4 cm = 12 cm"],["Verranto","BC/6 = 12/8","ison kolmion sivut osoittajissa, pienen nimittäjissä"],["Ratkaisu","8 · BC = 72, BC = 9","BC = 9 cm"],["Tarkistus","AB = 12 cm on ison kolmion sivu ja AD = 8 cm pienen; DE ja BC ovat vastinsivut, koska D vastaa B:tä ja E C:tä","sivujen valinta tarkistetaan vastinkärjistä; tuloksen sijoittaminen verrantoon paljastaa vain laskuvirheen"]]},{"tyyppi":"kappale","otsikko":"Ristikkäiset kolmiot, varjot ja neliö kolmion sisällä","sisalto":"Ristikkäiset kolmiot. Janat AE ja BD leikkaavat pisteessä P, ja AB ∥ DE. Piirrä A ylös vasemmalle, B ylös oikealle, D alas vasemmalle ja E alas oikealle. Syntyy kaksi kolmiota, joilla on yhteinen kärki P, mutta alempi kolmio on ylempään nähden käännetty. Kulmat ∠APB ja ∠EPD ovat ristikulmat. Kulmat ∠PAB ja ∠PED ovat vuorokulmat, koska AB ∥ DE ja suora AE leikkaa ne. Siis A vastaa E:tä, B vastaa D:tä ja P vastaa P:tä eli ABP ~ EDP. Saman janan päätepisteet vastaavat toisiaan: A ja E ovat kumpikin janalla AE. Vastinsivut ovat PA ja PE, PB ja PD sekä AB ja ED. Ristikkäisten kolmioiden toinen kulmapari voi olla myös suorat kulmat. Kun joen leveyttä mitataan rannalta, kummassakin kolmiossa on suora kulma rantaviivan kohdalla ja janojen leikkauspisteessä ristikulmat. Varjo. Pystysuoran 1,2 m pitkän kepin varjo on 1,5 m, ja samaan aikaan puun varjo on 9,0 m. Kepin ja puun kohdalla on suora kulma (pystysuora keppi ja puu tasaisella maalla), ja auringonsäde osuu maahan samassa kulmassa (yhdensuuntaiset säteet, samankohtaiset kulmat). Puu vastaa keppiä ja puun varjo kepin varjoa: x/1,2 = 9,0/1,5, joten x = 7,2 m. Katulampun valo leviää lampusta joka suuntaan, joten sen säteet eivät ole yhdensuuntaiset. Kun ihminen seisoo lampun ja oman varjonsa välissä, kulmaparit ovat suorat kulmat (ihminen ja pylväs) ja yhteinen kulma varjon kärjessä. Ihmistä vastaa pylväs, ja ihmisen varjoa vastaa koko matka pylväästä varjon kärkeen. Neliö kolmion sisällä. Suorakulmaisen kolmion ABC suora kulma on kärjessä C, AC = 9 cm ja BC = 6 cm. Neliö CDEF on piirretty niin, että D on sivulla AC, E sivulla AB ja F sivulla BC. Merkitään neliön sivua x:llä. Kolmiot ADE ja ACB ovat yhdenmuotoiset: ∠A on yhteinen, ja ∠ADE = ∠ACB = 90°. Siis DE vastaa sivua CB ja AD sivua AC, ja AD = 9 − x. Verranto x/6 = (9 − x)/9 on yhtälö, jossa x on molemmilla puolilla. Kerro se puolittain 18:lla: 3x = 2(9 − x), 5x = 18 ja x = 3,6. Neliön sivu on 3,6 cm. Tarkistus: AD = 5,4 cm, ja 5,4 : 9 = 0,6 = 3,6 : 6."},{"tyyppi":"ansa","otsikko":"Ansa 1: osajana koko sivun sijaan","sisalto":"Kolmiossa ABC on DE ∥ BC, AD = 6 cm, DB = 9 cm ja DE = 4 cm. Väärä verranto AD/DB = DE/BC eli 6/9 = 4/BC antaa BC = 6 cm. DB ei ole kummankaan kolmion sivu: pieni kolmio on ADE ja iso ABC, ja ison kolmion sivu on koko AB = 6 cm + 9 cm = 15 cm. Oikein: BC/4 = 15/6, joten BC = 10 cm. Suuruustarkistus ei paljasta tätä virhettä, koska väärä tulos 6 cm on suurempi kuin DE = 4 cm, kuten oikeankin pitää olla. Kun verrannossa ovat janat DE ja BC, tarkista siksi, että sen toisella puolella on kummankin kolmion koko sivu (AD ja AB tai AE ja AC), ei osajana DB tai EC. Osajanojen verranto AD/DB = AE/EC on sekin oikein, mutta siinä ei ole janoja DE ja BC. Sama virhe syntyy katulampputehtävässä, jos pylvästä verrataan ihmisen ja pylvään väliseen matkaan eikä koko matkaan pylväästä varjon kärkeen."},{"tyyppi":"ansa","otsikko":"Ansa 2: kulmaa ei perustella","sisalto":"Kolmiossa ABC piste D on sivulla AB ja piste E sivulla AC, ja jana DE näyttää piirroksessa yhdensuuntaiselta sivun BC kanssa. Tehtävässä ei kuitenkaan sanota, että DE ∥ BC, vaan annetaan ∠ADE = 62° ja ∠ABC = 64°. Nämä samankohtaiset kulmat eivät ole yhtä suuret, joten DE ei ole yhdensuuntainen BC:n kanssa, eikä D vastaa B:tä. Verranto AD/AB = DE/BC olisi väärä, vaikka kuva näyttää siltä. Yksi yhteinen kulma A ei riitä, eikä piirroksen ulkonäkö ole peruste. Kirjoita kaksi kulmaparia ja kummankin syy näkyviin ennen kuin kirjoitat verrannon."},{"tyyppi":"ansa","otsikko":"Ansa 3: vastinsivut paikan mukaan ristikkäisissä kolmioissa","sisalto":"Janat AE ja BD leikkaavat pisteessä P, ja AB ∥ DE. PA = 2 cm, PB = 3 cm, PD = 6 cm ja AB = 4 cm, ja kysytään DE. Piirroksessa D on A:n alapuolella, joten on houkuttelevaa parittaa D ja A ja kirjoittaa DE/AB = PD/PA = 6/2. Tulos DE = 12 cm on väärä. Kulmista: ∠PAB = ∠PED (vuorokulmat, AB ∥ DE), joten A vastaa E:tä ja B vastaa D:tä. PD on siis sivun PB vastinsivu, ja yhdenmuotoisuussuhde on PD : PB = 6 : 3 = 2. DE on sivun BA vastinsivu, joten DE = 2 · 4 cm = 8 cm. Toinen kolmio on käännetty, joten paikka piirroksessa ei kerro vastinkärkiä. Lue ne kulmista."},{"tyyppi":"ansa","otsikko":"Ansa 4: varjotehtävän suhde väärin päin","sisalto":"Pystysuoran 1,5 m pitkän kepin varjo on 2,0 m, ja samaan aikaan majakan varjo on 24 m. Väärä lasku 24 · 2,0 : 1,5 = 32 m vertaa majakkaa kepin varjoon. Majakka vastaa keppiä ja majakan varjo kepin varjoa, joten x/1,5 = 24/2,0 ja x = 18 m. Tarkistus: keppi on lyhyempi kuin varjonsa, joten myös majakan pitää olla lyhyempi kuin varjonsa. 32 m on pidempi kuin 24 m:n varjo, joten tulos on väärä. Tämä tarkistus paljastaa väärin päin käännetyn suhteen aina, kun keppi ja sen varjo ovat eri pitkät, koska kolmion jokainen sivu kerrotaan samalla luvulla eikä pidempi ja lyhyempi voi vaihtaa paikkaa."}],"harjoitusryhmat":[{"id":"kulmat","nimi":"Yhtä suuret kulmat ja vastinkärjet","info":"Kolmioissa kaksi yhtä suurta kulmaparia riittää yhdenmuotoisuuteen. Laske kolmas kulma kulmien summasta 180° ja lue vastinkärjet yhtä suurista kulmista. Laskin on sallittu."},{"id":"sisakkaiset","nimi":"Sisäkkäiset ja ristikkäiset kolmiot","info":"Piirrä luonnos, nimeä kaksi yhtä suurta kulmaparia ja kirjoita verranto vihkoon. Sisäkkäisissä kolmioissa käytä ison kolmion koko sivua. Laskin on sallittu."},{"id":"sovellukset","nimi":"Varjot ja kuviot kolmion sisällä","info":"Etsi tilanteesta kaksi yhdenmuotoista kolmiota ja perustele kulmat ennen verrantoa. Maa on tasainen ja pystysuorat esineet ovat kohtisuorassa maata vastaan. Laskin on sallittu."}],"harjoitukset":[{"id":"H01","ryhma":"kulmat","kysymys":"Kolmioissa ABC ja DEF on ∠A = 52°, ∠B = 61°, ∠E = 52° ja ∠F = 67°. Kuinka suuri on ∠D? Anna vastaus asteina ilman yksikköä.","vastaus":61,"vinkki":"Laske ensin ∠C ja vertaa sitä kulmaan F.","selitys":"∠C = 180° − 52° − 61° = 67°. Siis ∠A = ∠E ja ∠C = ∠F, joten kolmiot ovat yhdenmuotoiset ja D vastaa B:tä. ∠D = 180° − 52° − 67° = 61°."},{"id":"H02","ryhma":"kulmat","kysymys":"Kustakin kolmiosta on annettu kaksi kulmaa. Pystyviivan vasemmalla puolella on yhden kolmion kulmat ja oikealla toisen.\nPari 1: 52° ja 63° | 65° ja 52°\nPari 2: 90° ja 31° | 90° ja 59°\nPari 3: 48° ja 72° | 48° ja 70°\nPari 4: 100° ja 45° | 35° ja 100°\nPari 5: 75° ja 75° | 30° ja 75°\n\nMontako pareista on yhdenmuotoisia?","vastaus":4,"vinkki":"Laske jokaisesta kolmiosta kolmas kulma ja vertaa kulmien kolmikkoja.","selitys":"Kolmannet kulmat: pari 1: 65° ja 63°, pari 2: 59° ja 31°, pari 3: 60° ja 62°, pari 4: 35° ja 45°, pari 5: 30° ja 75°. Kulmat ovat samat pareissa 1, 2, 4 ja 5. Parissa 3 on yhteinen 48°:n kulma, mutta muut kulmat eroavat."},{"id":"H03","ryhma":"kulmat","kysymys":"Kolmioissa ABC ja KLM on ∠A = ∠M ja ∠B = ∠K.\n\nMikä on sivun AC vastinsivu?","vastaus":1,"vinkki":"Mikä kärki vastaa kärkeä C, kun A ja B on jo paritettu?","selitys":"A vastaa M:ää ja B vastaa K:ta, joten C vastaa jäljelle jäävää kärkeä L. Sivun AC vastinsivu on ML.","tyyppi":"monivalinta","vaihtoehdot":["MK","ML","KL"]},{"id":"H04","ryhma":"kulmat","kysymys":"Kolmiossa ABC piste D on sivulla AB ja piste E sivulla AC, ja DE ∥ BC. ∠A = 44° ja ∠C = 73°. Kuinka suuri on ∠ADE? Anna vastaus asteina ilman yksikköä.","vastaus":63,"vinkki":"∠ADE ja ∠ABC ovat samankohtaiset kulmat.","selitys":"∠ABC = 180° − 44° − 73° = 63°. ∠ADE = ∠ABC, koska ne ovat samankohtaiset kulmat ja DE ∥ BC. Siis ∠ADE = 63°."},{"id":"H05","ryhma":"kulmat","kysymys":"Janat AE ja BD leikkaavat pisteessä P, ja AB ∥ DE. ∠APB = 80° ja ∠PBA = 40°. Kuinka suuri on ∠PED? Anna vastaus asteina ilman yksikköä.","vastaus":60,"vinkki":"Kumpi kärjistä A ja B vastaa kärkeä E? Ajattele vuorokulmia.","selitys":"∠PED ja ∠PAB ovat vuorokulmat, koska AB ∥ DE, joten E vastaa A:ta. ∠PAB = 180° − 80° − 40° = 60°, joten ∠PED = 60°."},{"id":"H06","ryhma":"kulmat","kysymys":"Kolmiossa ABC piste D on sivulla AB ja piste E sivulla AC, ja DE ∥ BC.\n\nMillä perusteella ∠ADE = ∠ABC?","vastaus":1,"vinkki":"Mitkä kaksi suoraa ovat yhdensuuntaiset, ja mikä suora leikkaa ne?","selitys":"Suora AB leikkaa yhdensuuntaiset suorat DE ja BC. Kulmat ∠ADE ja ∠ABC ovat samassa kohdassa kumpaakin leikkauspistettä, joten ne ovat samankohtaiset kulmat ja yhtä suuret. Ristikulmat syntyvät kahden suoran leikkauspisteeseen, eikä piirroksen ulkonäkö ole peruste.","tyyppi":"monivalinta","vaihtoehdot":["Ne ovat ristikulmat.","Ne ovat samankohtaiset kulmat, ja DE ∥ BC.","Ne näyttävät piirroksessa yhtä suurilta."]},{"id":"H07","ryhma":"kulmat","kysymys":"Kolmion ABC kulmat ovat 40°, 65° ja 75°. Viidestä muusta kolmiosta tiedetään kaksi kulmaa:\n1) 65° ja 75°\n2) 40° ja 80°\n3) 75° ja 40°\n4) 40° ja 70°\n5) 65° ja 40°\n\nMontako näistä viidestä kolmiosta on yhdenmuotoisia kolmion ABC kanssa?","vastaus":3,"vinkki":"Yksi yhteinen kulma ei riitä. Laske jokaisen kolmion kolmas kulma.","selitys":"Kolmannet kulmat: 1) 40°, 2) 60°, 3) 65°, 4) 70°, 5) 75°. Kolmioiden 1, 3 ja 5 kulmat ovat 40°, 65° ja 75°. Kolmioissa 2 ja 4 on 40°:n kulma, mutta muut kulmat eroavat."},{"id":"H08","ryhma":"sisakkaiset","kysymys":"Kolmiossa ABC piste D on sivulla AB ja piste E sivulla AC, ja DE ∥ BC. AD = 5 cm, AB = 8 cm ja DE = 4 cm. Laske BC. Anna vastaus senttimetreinä ilman yksikköä.","vastaus":6.4,"vinkki":"Kolmiot ADE ja ABC ovat yhdenmuotoiset: yhteinen kulma A ja samankohtaiset kulmat.","selitys":"∠A on yhteinen ja ∠ADE = ∠ABC (samankohtaiset kulmat, DE ∥ BC), joten ADE ~ ABC. BC/4 = 8/5, joten 5 · BC = 32 ja BC = 6,4."},{"id":"H09","ryhma":"sisakkaiset","kysymys":"Kolmiossa ABC piste D on sivulla AB ja piste E sivulla AC, ja DE ∥ BC. AD = 3 cm, DB = 6 cm ja DE = 2,5 cm. Laske BC. Anna vastaus senttimetreinä ilman yksikköä.","vastaus":7.5,"vinkki":"Ison kolmion sivu on koko AB, ei DB.","selitys":"ADE ~ ABC (yhteinen kulma A, samankohtaiset kulmat ∠ADE ja ∠ABC). AB = 3 + 6 = 9. BC/2,5 = 9/3, joten BC = 7,5. Vastaus 5 syntyy, jos verrantoon otetaan DB koko sivun AB sijaan."},{"id":"H10","ryhma":"sisakkaiset","kysymys":"Kolmiossa ABC piste D on sivulla AB ja piste E sivulla AC, ja DE ∥ BC. DE = 4 cm, BC = 10 cm ja AD = 6 cm. Laske DB. Anna vastaus senttimetreinä ilman yksikköä.","vastaus":9,"vinkki":"Laske ensin koko sivu AB ja vähennä siitä AD.","selitys":"ADE ~ ABC, joten AB/6 = 10/4 ja AB = 15. DB = AB − AD = 15 − 6 = 9."},{"id":"H11","ryhma":"sisakkaiset","kysymys":"Kolmiossa ABC piste D on sivulla AB ja piste E sivulla AC, ja DE ∥ BC. AD = 4 cm, DB = 2 cm ja AE = 5 cm. Laske EC. Anna vastaus senttimetreinä ilman yksikköä.","vastaus":2.5,"vinkki":"Laske ensin koko sivu AC. AE vastaa sivua AC.","selitys":"ADE ~ ABC. AB = 6, joten AC/5 = 6/4 ja AC = 7,5. EC = 7,5 − 5 = 2,5."},{"id":"H12","ryhma":"sisakkaiset","kysymys":"Janat AE ja BD leikkaavat pisteessä P, ja AB ∥ DE. PA = 4 cm, PB = 5 cm, PD = 7,5 cm ja AB = 6 cm. Laske DE. Anna vastaus senttimetreinä ilman yksikköä.","vastaus":9,"vinkki":"Kumpaa sivua, PA vai PB, PD vastaa? Saman janan päätepisteet vastaavat toisiaan.","selitys":"∠APB = ∠EPD (ristikulmat) ja ∠PBA = ∠PDE (vuorokulmat, AB ∥ DE), joten B vastaa D:tä ja A vastaa E:tä. Suhde PD : PB = 7,5 : 5 = 1,5, ja DE vastaa sivua BA: DE = 1,5 · 6 = 9."},{"id":"H13","ryhma":"sisakkaiset","kysymys":"Janat AF ja BE leikkaavat pisteessä O, ja AB ∥ EF. OA = 3 cm, OB = 5 cm, OF = 4,5 cm ja AB = 4 cm. Aino laski sivun EF näin:\n1) ∠AOB = ∠FOE, koska ne ovat ristikulmat.\n2) ∠OAB = ∠OFE, koska ne ovat vuorokulmat ja AB ∥ EF.\n3) Siis A vastaa E:tä ja B vastaa F:ää.\n4) EF/AB = OF/OB eli EF/4 = 4,5/5, joten EF = 3,6 cm.\n\nMonennessako vaiheessa on ensimmäinen virhe?","vastaus":3,"vinkki":"Mitä vaihe 2 kertoo kärjen A vastinkärjestä?","selitys":"Vaiheet 1 ja 2 ovat oikein. Vaiheen 2 mukaan kulma A on yhtä suuri kuin kulma F, joten A vastaa F:ää eikä E:tä. Vaihe 3 on ensimmäinen virhe. Oikein: OF vastaa OA:ta, joten suhde on 4,5 : 3 = 1,5 ja EF = 1,5 · 4 = 6 cm."},{"id":"H14","ryhma":"sisakkaiset","kysymys":"Kolmioissa ABC ja PQR on ∠A = ∠R ja ∠B = ∠P. AB = 10 cm, BC = 8 cm ja CA = 6 cm, ja QR = 9 cm. Laske PR. Anna vastaus senttimetreinä ilman yksikköä.","vastaus":15,"vinkki":"Kirjoita ensin kaikki kolme vastinkärkiparia.","selitys":"A vastaa R:ää, B vastaa P:tä ja C vastaa Q:ta. QR vastaa sivua CA, joten suhde on 9 : 6 = 1,5. PR vastaa sivua BA: PR = 1,5 · 10 = 15."},{"id":"H15","ryhma":"sovellukset","kysymys":"Pystysuoran 1,0 m pitkän kepin varjo on 0,8 m. Samaan aikaan pystysuoran maston varjo on 18,4 m. Maa on tasainen. Kuinka korkea masto on? Anna vastaus metreinä ilman yksikköä.","vastaus":23,"vinkki":"Masto vastaa keppiä ja maston varjo kepin varjoa.","selitys":"Suorat kulmat maan kohdalla ja auringonsäteiden sama kulma maahan, joten kolmiot ovat yhdenmuotoiset. x/1,0 = 18,4/0,8, joten x = 23. Tarkistus: keppi on pidempi kuin varjonsa, ja niin on mastokin."},{"id":"H16","ryhma":"sovellukset","kysymys":"Henkilön pituus on 1,7 m, ja hänen varjonsa on 2,55 m pitkä. Samaan aikaan läheinen torni on 30 m korkea. Maa on tasainen. Kuinka pitkä on tornin varjo? Anna vastaus metreinä ilman yksikköä.","vastaus":45,"vinkki":"Tornin varjo vastaa henkilön varjoa ja torni henkilöä.","selitys":"x/2,55 = 30/1,7, joten x = 2,55 · 30 : 1,7 = 45. Tarkistus: henkilön varjo on pidempi kuin henkilö, ja tornin varjo on pidempi kuin torni."},{"id":"H17","ryhma":"sovellukset","kysymys":"Katulampun lamppu on pystysuoran pylvään huipussa. 1,5 m pitkä henkilö seisoo tasaisella maalla 4,5 m:n päässä pylväästä, ja hänen varjonsa on 1,8 m pitkä. Varjo osoittaa suoraan poispäin pylväästä. Kuinka korkealla maasta lamppu on? Anna vastaus metreinä ilman yksikköä.","vastaus":5.25,"vinkki":"Pylvästä vastaa henkilö, ja pylvään juuresta varjon kärkeen ulottuvaa matkaa vastaa henkilön varjo.","selitys":"Suorat kulmat (henkilö ja pylväs) ja yhteinen kulma varjon kärjessä. Matka pylväästä varjon kärkeen on 4,5 + 1,8 = 6,3 m. x/1,5 = 6,3/1,8, joten x = 5,25."},{"id":"H18","ryhma":"sovellukset","kysymys":"Suorakulmaisen kolmion ABC suora kulma on kärjessä C, AC = 15 cm ja BC = 10 cm. Kolmion sisään piirretään neliö CDEF niin, että D on sivulla AC, E on sivulla AB ja F on sivulla BC. Laske neliön sivun pituus. Anna vastaus senttimetreinä ilman yksikköä.","vastaus":6,"vinkki":"Kolmiot ADE ja ACB ovat yhdenmuotoiset. Merkitse neliön sivua x:llä, jolloin AD = 15 − x.","selitys":"∠A on yhteinen ja ∠ADE = ∠ACB = 90°. x/10 = (15 − x)/15. Kerrotaan puolittain 30:llä: 3x = 2(15 − x), 5x = 30 ja x = 6."},{"id":"H19","ryhma":"sovellukset","kysymys":"Suorakulmaisen kolmion ABC suora kulma on kärjessä C, AC = 16 cm ja BC = 12 cm. Kolmion sisään piirretään suorakulmio CDEF niin, että D on sivulla AC, E on sivulla AB ja F on sivulla BC. Suorakulmion sivu DE on 3 cm. Laske sivu CD. Anna vastaus senttimetreinä ilman yksikköä.","vastaus":12,"vinkki":"Laske ensin AD kolmioista ADE ja ACB ja vähennä se sivusta AC.","selitys":"∠A on yhteinen ja ∠ADE = ∠ACB = 90°, joten ADE ~ ACB. AD/16 = 3/12, joten AD = 4. CD = 16 − 4 = 12."},{"id":"H20","ryhma":"sovellukset","kysymys":"Joen leveyttä mitataan rannalta. Piste A on vastarannalla ja piste B tällä rannalla niin, että AB on kohtisuorassa rantaviivaa vastaan. B:stä kävellään suoraa rantaviivaa pitkin pisteeseen C, BC = 30 m, ja samaan suuntaan edelleen pisteeseen D, CD = 10 m. D:stä kävellään kohtisuoraan poispäin joesta pisteeseen E, josta katsottuna C ja A ovat samalla suoralla. DE = 8 m. Kuinka leveä joki on eli kuinka pitkä on AB? Anna vastaus metreinä ilman yksikköä.","vastaus":24,"vinkki":"Kolmiot ABC ja EDC: suorat kulmat kärjissä B ja D ja ristikulmat kärjessä C.","selitys":"∠ABC = ∠EDC = 90° ja ∠ACB = ∠ECD (ristikulmat), joten ABC ~ EDC. AB/8 = 30/10, joten AB = 24."}],"valmis_teksti":"Osaat perustella kahden kolmion yhdenmuotoisuuden kahdella yhtä suurella kulmaparilla ja nimetä kummankin syyn: yhteinen kulma, ristikulmat, samankohtaiset kulmat, vuorokulmat tai suorat kulmat. Luet vastinkärjet ja vastinsivut kulmista myös silloin, kun toinen kolmio on käännetty, ja käytät sisäkkäisissä kolmioissa koko sivua. Lasket varjosta puun korkeuden, kolmion sisällä olevan kolmion sivun ja kolmion sisään piirretyn neliön sivun. Tämä taito on nyt näytetty."};

const esc = s => s;
const osat = D.teksti.map(o=>{
  switch(o.tyyppi){
    case "johdanto":
      return `<p class="lead">${esc(o.sisalto)}</p>`;
    case "kappale":
      return `<h2>${esc(o.otsikko)}</h2><p>${esc(o.sisalto)}</p>`;
    case "saanto":
      return `<div class="box"><h3>${esc(o.otsikko)}</h3><ol class="steps">${
        o.askeleet.map(a=>`<li><span>${esc(a)}</span></li>`).join("")}</ol></div>`;
    case "taulukko":
      return `<div class="box"><h3>${esc(o.otsikko)}</h3><div class="tablewrap"><table><thead><tr>${
        o.otsikkorivi.map(h=>`<th>${h}</th>`).join("")}</tr></thead><tbody>${
        o.rivit.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join("")}</tr>`).join("")}</tbody></table></div></div>`;
    case "ansa":
      return `<div class="box warn"><h3>${esc(o.otsikko)}</h3><p style="margin:0">${esc(o.sisalto)}</p></div>`;
    case "muistilappu":
      return `<div class="box note"><h3>${esc(o.otsikko)}</h3><ul class="notes">${
        o.kohdat.map(k=>`<li>${esc(k)}</li>`).join("")}</ul></div>`;
    case "numerotaulu":
      return `<div class="box nt"><h3>${esc(o.otsikko)}</h3><p class="ohje">${esc(o.sisalto)}</p>
        <div class="nt-valinta" id="ntValinta"></div>
        <div class="nt-taulu" id="ntTaulu"></div>
        <p class="nt-selite" id="ntSelite"></p></div>`;
    case "vahvuusportaat":
      return `<div class="box vp"><h3>${esc(o.otsikko)}</h3><p class="ohje">${esc(o.sisalto)}</p>
        <div class="vp-tasot">${o.tasot.map(t=>
          `<div class="vp-taso" data-taso="${t.id}"><span class="vp-pallo"></span>

const svg=document.getElementById("nlsvg"), rng=document.getElementById("nlrange"), out=document.getElementById("nlout");
const X0=34, X1=606, Y=62;
function piirraNL(v){
  const ala=Math.floor(v/10)*10, yla=ala+10, puoli=ala+5;
  const pyor = (v%10)>=5 ? yla : ala;
  const x = n => X0 + (n/100)*(X1-X0);
  let s=`<line class="rail" x1="${X0}" y1="${Y}" x2="${X1}" y2="${Y}"/>`;
  for(let n=0;n<=100;n+=10){
    const near = (n===ala||n===yla);
    s+=`<line class="tick" x1="${x(n)}" y1="${Y-7}" x2="${x(n)}" y2="${Y+7}"/>`;
    s+=`<text class="stop${near?" near":""}" x="${x(n)}" y="${Y+24}" text-anchor="middle">${n}</text>`;
  }
  s+=`<line class="halfway" x1="${x(puoli)}" y1="${Y-16}" x2="${x(puoli)}" y2="${Y+12}"/>`;
  s+=`<text class="stop" x="${x(puoli)}" y="${Y-22}" text-anchor="middle">puoliväli ${puoli}</text>`;
  s+=`<circle class="dot" cx="${x(v)}" cy="${Y}" r="6"/>`;
  s+=`<text class="val" x="${x(v)}" y="${Y-32}" text-anchor="middle">${v}</text>`;
  s+=`<path d="M ${x(v)} ${Y+38} L ${x(pyor)} ${Y+38}" stroke="var(--core)" stroke-width="2" fill="none"/>`;
  s+=`<path d="M ${x(pyor)} ${Y+38} l ${x(pyor)>x(v)?-7:7} -4 l 0 8 z" fill="var(--core)"/>`;
  svg.innerHTML=s;
  out.textContent = `${v} pyöristyy → ${pyor}`;
}

/* ---------- laskujärjestys-widget ---------- */
const ljExp=document.getElementById("ljExp");
if(ljExp && D.kokeilu){
  let ljI=0, ljTokens=[], ljStep=0;
  const laske=(a,op,b)=>{a=+a;b=+b;return op==="×"?a*b:op==="÷"?a/b:op==="+"?a+b:a-b;};
  function ljAlku(){
    const l=D.kokeilu[ljI];
    ljTokens=l.lauseke.replace(/\(/g,"( ").replace(/\)/g," )").split(/\s+/).filter(Boolean);
    ljStep=0; ljPiirra(); ljViesti("","");
  }
  function ljViesti(t,lk){const f=document.getElementById("ljFb"); f.textContent=t; f.className="lj-fb "+(lk||"");}
  function ljPiirra(){
    const l=D.kokeilu[ljI];
    document.getElementById("ljStep").textContent =
      ljStep>=l.askeleet.length ? "valmis" : `askel ${ljStep+1} / ${l.askeleet.length}`;
    if(ljStep>=l.askeleet.length){
      ljExp.innerHTML=`<span class="valmis">${l.lauseke} = ${l.vastaus}</span>`;
      return;
    }
    ljExp.innerHTML=ljTokens.map((t,i)=>
      "×÷+−".includes(t) ? `<button type="button" class="op" data-i="${i}">${t}</button>`
                         : `<span class="tok">${t}</span>`).join("");
    ljExp.querySelectorAll("button.op").forEach(b=>b.addEventListener("click",()=>ljKlikkaa(+b.dataset.i)));
  }
  function ljKlikkaa(i){
    const l=D.kokeilu[ljI], odotettu=l.askeleet[ljStep];
    const ehdotus=[ljTokens[i-1],ljTokens[i],ljTokens[i+1]].join(" ");
    if(ehdotus!==odotettu){
      ljViesti(ljStep===0
        ? "Ei vielä. Sulkeet ovat vahvimmat, sitten kerto ja jako. Yhtä vahvat vasemmalta oikealle."
        : "Ei vielä. Kumpi jäljellä olevista on vahvempi?", "no");
      return;
    }
    const arvo=laske(ljTokens[i-1],ljTokens[i],ljTokens[i+1]);
    let alku=i-1, loppu=i+1;
    if(ljTokens[i-2]==="(" && ljTokens[i+2]===")"){ alku=i-2; loppu=i+2; }
    ljTokens.splice(alku, loppu-alku+1, String(arvo));
    ljStep++;
    ljViesti(ljStep>=l.askeleet.length ? "Valmis. Vastaus on "+l.vastaus+"." : "Oikein. Jatka seuraavaan.", "ok");
    ljPiirra();
  }
  document.getElementById("ljSeuraava").addEventListener("click",()=>{
    ljI=(ljI+1)%D.kokeilu.length; ljAlku();
  });
  ljAlku();
}

/* Suomalainen lukumuoto: välilyönti on tuhaterotin, pilkku desimaalierotin.
   Piste voi olla kumpi tahansa. Se tulkitaan tuhaterottimeksi VAIN silloin, kun
   koko luku on aitoa tuhaterotinmuotoa: alkuosa 1–3 numeroa ilman etunollaa ja
   jokainen jatko-osa täsmälleen 3 numeroa (1.500, 12.345.678). Kaikissa muissa
   tapauksissa piste on desimaalipiste — myös 0.125, joka vanhalla säännöllä
   ("3 numeroa pisteen jäljessä = tuhaterotin") luettiin virheellisesti luvuksi 125. */
const TUHATEROTIN = /^[1-9]\d{0,2}(\.\d{3})+$/;
function lueLuku(teksti){
  // Murtoluku (3/4, -3/4) ja sekaluku (1 2/3, -1 2/3) hyväksytään sellaisinaan.
  const raaka = String(teksti).replace(/\u00a0/g, " ").trim();
  let m = raaka.match(/^(-?)(\d+)\s+(\d+)\s*\/\s*(\d+)$/);
  if(m){ const nim = Number(m[4]); if(nim === 0) return null;
    const v = Number(m[2]) + Number(m[3]) / nim; return m[1] ? -v : v; }
  m = raaka.match(/^(-?)\s*(\d+)\s*\/\s*(\d+)$/);
  if(m){ const nim = Number(m[3]); if(nim === 0) return null;
    const v = Number(m[2]) / nim; return m[1] ? -v : v; }
  let s = String(teksti).replace(/[\s\u00a0]/g, "");
  if(s === "") return null;
  if(s.indexOf(",") >= 0){
    s = s.replace(/\./g, "").replace(",", ".");
  } else if(TUHATEROTIN.test(s)){
    s = s.replace(/\./g, "");
  }
  const n = Number(s);
  return Number.isFinite(n) ? n : null;
}

function tarkista(id){
  const h=D.harjoitukset.find(x=>x.id===id);
  const kentta=document.getElementById("in-"+id);
  const fb=document.getElementById("fb-"+id);
  if(kentta.value.trim()===""){ fb.className="fb hint"; fb.textContent="Kirjoita vastaus ensin."; return; }
  const luku=lueLuku(kentta.value);
  if(luku===null){ fb.className="fb no"; fb.textContent="Vastauksen pitää olla luku tai murtoluku (esimerkiksi 3/4)."; return; }
  const oikein = Math.abs(luku - h.vastaus) < 1e-9;
  merkitseTulos(id, oikein, oikein ? "Oikein. "+h.selitys : `Ei vielä. ${h.vinkki} Kokeile uudelleen.`);
}

function tarkistaMonivalinta(id, valittuIndeksi, painike){
  const h=D.harjoitukset.find(x=>x.id===id);
  const rivi=painike.closest(".row");
  rivi.querySelectorAll(".mv-valinta").forEach(b=>b.disabled=true);
  const oikein = valittuIndeksi===h.vastaus;
  painike.classList.add(oikein?"mv-oikein":"mv-vaarin");
  if(!oikein){
    const oikeaBtn=rivi.querySelector(`[data-i="${h.vastaus}"]`);
    if(oikeaBtn) oikeaBtn.classList.add("mv-oikein");
  }
  merkitseTulos(id, oikein, oikein ? "Oikein. "+h.selitys : `Ei ihan. Oikea vastaus on korostettu. ${h.selitys||""}`);
}

/* Kuuntelu: selain lukee tekstin ääneen omalla puhesynteesillään (englanniksi, jos laitteessa on
   englanninkielinen ääni). Ei äänitiedostoja eikä verkkoyhteyttä. Jos laite ei osaa puhua,
   teksti näytetään luettavaksi — silloin tehtävä muuttuu luetun ymmärtämiseksi, mutta ei katkea. */
function puhu(id, nopeus){
  const h=D.harjoitukset.find(x=>x.id===id); if(!h || !h.kuuntele) return;
  const vara=document.getElementById("vara-"+id);
  const naytaTeksti=syy=>{ vara.hidden=false; vara.textContent=syy+" Teksti: "+h.kuuntele; };
  if(!("speechSynthesis" in window)){ naytaTeksti("Tämä laite ei osaa lukea ääneen."); return; }
  const s=window.speechSynthesis; s.cancel();
  const u=new SpeechSynthesisUtterance(h.kuuntele);
  u.lang=h.kieli||"en-GB"; u.rate=nopeus;
  const aanet=s.getVoices(), kieli=u.lang.slice(0,2);
  const aani=aanet.find(a=>a.lang===u.lang) || aanet.find(a=>a.lang && a.lang.startsWith(kieli));
  if(aani) u.voice=aani;
  else if(aanet.length) { naytaTeksti("Laitteessa ei ole englanninkielistä ääntä."); return; }
  u.onerror=()=>naytaTeksti("Ääneen lukeminen ei onnistunut.");
  s.speak(u);
}
