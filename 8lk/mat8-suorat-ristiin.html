<title>Suorat ristiin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">

<style>
:root{
  --paper:#EFF2F5; --surface:#FFFFFF; --surface-2:#F7F9FB;
  --grid:#DCE3EA; --line:#C9D3DC;
  --ink:#15222C; --ink-2:#4E626F; --ink-3:#7E8F9B;
  --core:#1B5A9E; --core-soft:#E4EDF6;
  --strong:#1F6E5C; --strong-soft:#E1F0EB;
  --chal:#9A6A16; --chal-soft:#F6EDDC;
  --alert:#A33A2B; --alert-soft:#F8E7E3;
  --shadow:0 1px 2px rgba(21,34,44,.06), 0 8px 24px -12px rgba(21,34,44,.18);
  --r:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0F161B; --surface:#18222A; --surface-2:#1D2830;
    --grid:#22303A; --line:#2E3E4A;
    --ink:#E8EFF4; --ink-2:#A3B4C0; --ink-3:#7A8B97;
    --core:#7FB2E4; --core-soft:#16303F;
    --strong:#77CDB4; --strong-soft:#123028;
    --chal:#E0B267; --chal-soft:#33270F;
    --alert:#E8907F; --alert-soft:#3A1E19;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -14px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --paper:#0F161B; --surface:#18222A; --surface-2:#1D2830;
  --grid:#22303A; --line:#2E3E4A;
  --ink:#E8EFF4; --ink-2:#A3B4C0; --ink-3:#7A8B97;
  --core:#7FB2E4; --core-soft:#16303F;
  --strong:#77CDB4; --strong-soft:#123028;
  --chal:#E0B267; --chal-soft:#33270F;
  --alert:#E8907F; --alert-soft:#3A1E19;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -14px rgba(0,0,0,.7);
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:16px; line-height:1.62;
  background-image:
    linear-gradient(to right, var(--grid) 1px, transparent 1px),
    linear-gradient(to bottom, var(--grid) 1px, transparent 1px);
  background-size:26px 26px;
}
.wrap{max-width:760px; margin:0 auto; padding:28px 20px 90px}
h1,h2,h3,h4{font-family:"Familjen Grotesk","IBM Plex Sans",system-ui,sans-serif; text-wrap:balance}

/* header */
header.top{background:var(--surface); border:1px solid var(--line); border-radius:var(--r);
  box-shadow:var(--shadow); padding:22px 24px; display:flex; gap:18px; align-items:flex-start}
.badge{flex:0 0 auto; width:54px; height:54px; border-radius:9px; display:grid; place-items:center;
  background:var(--core-soft); border:1px solid var(--core); color:var(--core)}
.badge svg{width:28px; height:28px; fill:none; stroke:currentColor; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round}
.eyebrow{font-family:"IBM Plex Mono",monospace; font-size:11px; letter-spacing:.14em;
  text-transform:uppercase; color:var(--ink-3); margin:0 0 5px}
header.top h1{margin:0; font-size:30px; font-weight:700; letter-spacing:-.015em}
header.top p{margin:5px 0 0; color:var(--ink-2); font-size:15px}
.tags{display:flex; flex-wrap:wrap; gap:5px; margin-top:11px}
.tag{font-family:"IBM Plex Mono",monospace; font-size:10.5px; letter-spacing:.05em; padding:2px 7px;
  border-radius:4px; background:var(--surface-2); border:1px solid var(--line); color:var(--ink-3)}
.tag.core{background:var(--core-soft); border-color:var(--core); color:var(--core)}

/* teksti */
article{margin-top:26px}
article h2{font-size:21px; font-weight:600; margin:32px 0 10px; letter-spacing:-.01em}
article p{margin:0 0 14px; max-width:64ch}
.lead{font-size:17.5px; color:var(--ink); border-left:3px solid var(--core); padding-left:16px; margin:0 0 8px}

.box{background:var(--surface); border:1px solid var(--line); border-radius:var(--r);
  padding:18px 22px; box-shadow:var(--shadow); margin:22px 0}
.box h3{margin:0 0 12px; font-size:16.5px; font-weight:600}
.box.warn{border-left:3px solid var(--alert)}
.box.note{border-left:3px solid var(--chal)}

ol.steps{margin:0; padding-left:0; list-style:none; counter-reset:s; display:grid; gap:12px}
ol.steps li{counter-increment:s; display:grid; grid-template-columns:auto 1fr; gap:13px; align-items:start}
ol.steps li::before{content:counter(s); font-family:"Familjen Grotesk",sans-serif; font-weight:700; font-size:14px;
  width:26px; height:26px; border-radius:50%; background:var(--core); color:#fff; display:grid; place-items:center; margin-top:2px}

ul.notes{margin:0; padding-left:19px}
ul.notes li{margin-bottom:7px}
ul.notes li:last-child{margin-bottom:0}

.tablewrap{overflow-x:auto}
table{border-collapse:collapse; width:100%; font-size:14.5px; min-width:460px}
th,td{text-align:left; padding:9px 13px; border-bottom:1px solid var(--line)}
th{font-family:"IBM Plex Mono",monospace; font-size:10.5px; letter-spacing:.1em; text-transform:uppercase;
  color:var(--ink-3); font-weight:400; background:var(--surface-2)}
tr:last-child td{border-bottom:0}
td b{color:var(--core); font-weight:600}
td:last-child{font-variant-numeric:tabular-nums; font-weight:600}

/* lukusuora */
.nl svg{width:100%; height:118px; display:block}
.nl .rail{stroke:var(--line); stroke-width:2}
.nl .tick{stroke:var(--line); stroke-width:1.5}
.nl .stop{fill:var(--ink-3); font-family:"IBM Plex Mono",monospace; font-size:11px}
.nl .stop.near{fill:var(--core); font-weight:600}
.nl .dot{fill:var(--chal)}
.nl .val{fill:var(--ink); font-family:"Familjen Grotesk",sans-serif; font-size:15px; font-weight:700}
.nl .halfway{stroke:var(--chal); stroke-dasharray:3 3; stroke-width:1.5}
.nl-controls{display:flex; align-items:center; gap:14px; margin-top:6px}
.nl-controls input{flex:1; accent-color:var(--core)}
.nl-out{font-family:"Familjen Grotesk",sans-serif; font-size:15px; font-weight:600; min-width:12.5em; text-align:right}

/* paikka-arvotaulu */
.box .ohje{margin:0 0 14px; font-size:14.5px; color:var(--ink-2)}
.nt-valinta{display:flex; flex-wrap:wrap; gap:7px; margin-bottom:16px}
.nt-valinta button{font:inherit; font-size:12.5px; font-family:"IBM Plex Mono",monospace; padding:5px 11px;
  border-radius:6px; border:1px solid var(--line); background:var(--surface-2); color:var(--ink-2); cursor:pointer}
.nt-valinta button[aria-pressed="true"]{background:var(--ink); color:var(--paper); border-color:var(--ink)}
.nt-valinta button:focus-visible{outline:2px solid var(--core); outline-offset:2px}
.nt-taulu{display:flex; flex-direction:column; gap:4px; align-items:flex-start; overflow-x:auto; padding-bottom:4px}
.nt-rivi{display:flex; gap:6px; align-items:center}
.nt-rivi .otsa{font-family:"IBM Plex Mono",monospace; font-size:9.5px; letter-spacing:.08em;
  text-transform:uppercase; color:var(--ink-3); width:52px; text-align:center}
.nt-ruutu{width:52px; height:52px; display:grid; place-items:center; border:1.5px solid var(--line);
  border-radius:7px; background:var(--surface-2); font-family:"IBM Plex Mono",monospace; font-size:24px}
.nt-ruutu.kohta{border-color:var(--core); background:var(--core-soft); color:var(--core); font-weight:500}
.nt-ruutu.ratkaiseva{border-color:var(--chal); background:var(--chal-soft); color:var(--chal); font-weight:500}
.nt-ruutu.nolla{color:var(--ink-3)}
.nt-rivi .nimi{font-size:12.5px; color:var(--ink-3); margin-left:12px; white-space:nowrap}
.nt-nuoli{font-size:17px; color:var(--chal); margin-left:6px}
.nt-selite{margin:14px 0 0; font-size:14.5px}
.nt-selite b{color:var(--core)}

/* vahvuusportaat */
.vp-tasot{display:grid; gap:9px; margin-bottom:18px}
.vp-taso{display:flex; gap:11px; align-items:flex-start; font-size:13.5px}
.vp-taso .vp-pallo{width:13px; height:13px; border-radius:4px; margin-top:5px; flex:0 0 auto}
.vp-taso[data-taso="sulkeet"] .vp-pallo{background:var(--core)}
.vp-taso[data-taso="kertojako"] .vp-pallo{background:var(--strong)}
.vp-taso[data-taso="yhteenvahennys"] .vp-pallo{background:var(--chal)}
.vp-taso strong{display:block; font-family:"Familjen Grotesk",sans-serif; font-weight:600; font-size:14.5px}
.vp-taso span{color:var(--ink-2)}
.vp-lauseke{display:flex; flex-wrap:wrap; gap:7px; align-items:flex-end; font-family:"IBM Plex Mono",monospace;
  font-size:25px; padding:10px 2px; min-height:64px}
.vp-lauseke .t{padding:2px 3px}
.vp-lauseke .op{position:relative; padding:2px 9px; border-radius:6px; font-weight:500}
.vp-lauseke .op[data-taso="sulkeet"]{background:var(--core-soft); color:var(--core)}
.vp-lauseke .op[data-taso="kertojako"]{background:var(--strong-soft); color:var(--strong)}
.vp-lauseke .op[data-taso="yhteenvahennys"]{background:var(--chal-soft); color:var(--chal)}
.vp-lauseke .op i{position:absolute; top:-9px; right:-6px; font-style:normal; font-family:"Familjen Grotesk",sans-serif;
  font-size:11px; font-weight:700; width:18px; height:18px; border-radius:50%; display:grid; place-items:center;
  background:currentColor}
.vp-lauseke .op i span{color:var(--surface)}
.vp-rivi{display:flex; align-items:center; gap:16px; margin-top:8px}
.vp-vastaus{font-family:"Familjen Grotesk",sans-serif; font-size:16px; font-weight:600; color:var(--strong)}

/* laskujärjestys-widget */
.lj-exp{display:flex; flex-wrap:wrap; gap:7px; align-items:center; font-family:"IBM Plex Mono",monospace;
  font-size:23px; padding:14px 4px; min-height:62px}
.lj-exp .tok{padding:2px 4px; color:var(--ink)}
.lj-exp button.op{font-family:"IBM Plex Mono",monospace; font-size:23px; padding:3px 12px; border-radius:7px;
  border:1.5px solid var(--line); background:var(--surface-2); color:var(--ink); line-height:1.2}
.lj-exp button.op:hover{border-color:var(--core); color:var(--core)}
.lj-exp button.op:focus-visible{outline:2px solid var(--core); outline-offset:2px}
.lj-exp .valmis{font-family:"Familjen Grotesk",sans-serif; font-size:23px; font-weight:700; color:var(--strong)}
.lj-fb{font-size:14.5px; min-height:1.5em; color:var(--ink-2)}
.lj-fb.no{color:var(--alert)}
.lj-fb.ok{color:var(--strong)}
.lj-row{display:flex; align-items:center; gap:14px; margin-top:10px}
.lj-step{font-family:"IBM Plex Mono",monospace; font-size:11.5px; letter-spacing:.1em;
  text-transform:uppercase; color:var(--ink-3)}

/* harjoitukset */
.progress{position:sticky; top:0; z-index:5; background:var(--surface); border:1px solid var(--line);
  border-radius:var(--r); padding:12px 18px; box-shadow:var(--shadow); display:flex; align-items:center;
  gap:14px; margin:34px 0 18px}
.progress .lbl{font-family:"IBM Plex Mono",monospace; font-size:11px; letter-spacing:.12em;
  text-transform:uppercase; color:var(--ink-3); white-space:nowrap}
.progress .meter{flex:1; height:7px; border-radius:4px; background:var(--surface-2); border:1px solid var(--line); overflow:hidden}
.progress .meter i{display:block; height:100%; background:var(--core); transition:width .25s ease}
.progress .cnt{font-family:"Familjen Grotesk",sans-serif; font-weight:700; font-variant-numeric:tabular-nums; white-space:nowrap}

.grp{margin-top:26px}
.grp-head{display:flex; align-items:baseline; gap:10px; border-bottom:1.5px solid var(--ink); padding-bottom:7px; margin-bottom:14px}
.grp-head h3{margin:0; font-size:17px; font-weight:600}
.grp-head span{font-size:12.5px; color:var(--ink-2)}

.ex{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:14px 16px; margin-bottom:10px}
.ex[data-tila="oikein"]{border-color:var(--strong); box-shadow:inset 3px 0 0 var(--strong)}
.ex[data-tila="vaarin"]{border-color:var(--alert); box-shadow:inset 3px 0 0 var(--alert)}
.ex .q{display:flex; gap:11px; align-items:baseline; flex-wrap:wrap}
.ex .num{font-family:"IBM Plex Mono",monospace; font-size:11.5px; color:var(--ink-3); min-width:2.4em}
.ex .txt{flex:1; min-width:190px; font-size:15.5px}
.ex .txt .aineisto{display:block; margin-bottom:9px; padding-left:12px;
  border-left:2px solid var(--line); color:var(--ink-2); line-height:1.6;
  /* Aineisto voi olla pieni taulukko, jonka rivit on erotettu rivinvaihdoilla.
     Ilman pre-lineä ne valuisivat yhdeksi kappaleeksi ja taulukko katoaisi. */
  white-space:pre-line}
.ex .txt .kysymysrivi{display:block; font-weight:600}
.ex .row{display:flex; gap:8px; align-items:center; margin-top:11px; flex-wrap:wrap}
.ex input[type=text]{font:inherit; font-family:"IBM Plex Mono",monospace; font-size:15px; width:8.5em;
  padding:7px 11px; border:1px solid var(--line); border-radius:7px; background:var(--surface-2);
  color:var(--ink); text-align:right}
.ex input:focus-visible{outline:2px solid var(--core); outline-offset:1px}
button{font:inherit; cursor:pointer}
.btn{font-size:13.5px; padding:7px 15px; border-radius:7px; border:1px solid var(--core);
  background:var(--core); color:#fff}
.btn.ghost{background:transparent; color:var(--ink-2); border-color:var(--line)}
.btn:focus-visible{outline:2px solid var(--core); outline-offset:2px}
.btn.mv-valinta{text-align:left}
/* kuuntelutehtävä: selaimen puhesynteesi lukee englanninkielisen tekstin */
.kuuntele{display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin:2px 0 10px}
.kuuntele .btn{display:inline-flex; gap:7px; align-items:center}
.kuuntele svg{width:16px; height:16px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round}
.kuuntele .varateksti{flex-basis:100%; font-size:14px; color:var(--ink-2); background:var(--surface-2);
  border-radius:7px; padding:8px 12px; margin:0}
.btn.mv-valinta:disabled{cursor:default; opacity:.65}
.btn.mv-oikein{background:var(--strong-soft); border-color:var(--strong); color:var(--strong); opacity:1}
.btn.mv-vaarin{background:var(--alert-soft); border-color:var(--alert); color:var(--alert); opacity:1}
.row.mv{gap:8px 10px}
.fb{margin-top:11px; font-size:14.5px; padding:10px 13px; border-radius:8px; line-height:1.5}
.fb.ok{background:var(--strong-soft); color:var(--strong)}
.fb.no{background:var(--alert-soft); color:var(--alert)}
.fb.hint{background:var(--chal-soft); color:var(--chal)}

.done{background:var(--strong-soft); border:1px solid var(--strong); color:var(--strong);
  border-radius:var(--r); padding:16px 20px; margin-top:20px; font-size:15.5px}
.done h3{margin:0 0 4px; font-size:17px; color:var(--strong)}

details.teacher{margin-top:34px; background:var(--surface); border:1px solid var(--line);
  border-left:3px solid var(--chal); border-radius:var(--r); padding:15px 20px; box-shadow:var(--shadow)}
details.teacher summary{cursor:pointer; font-family:"Familjen Grotesk",sans-serif; font-weight:600; font-size:15px}
details.teacher summary:focus-visible{outline:2px solid var(--core); outline-offset:3px}
details.teacher ul{margin:12px 0 0; padding-left:19px; color:var(--ink-2); font-size:14.5px}
details.teacher li{margin-bottom:8px}
details.teacher p{margin:12px 0 0; color:var(--ink-2); font-size:14.5px}

.back{display:inline-block; margin-top:30px; font-size:13.5px; color:var(--ink-2)}
.back a{color:var(--core)}

@media (prefers-reduced-motion: reduce){*{transition:none !important}}
@media (max-width:560px){
  .wrap{padding:16px 13px 70px}
  header.top h1{font-size:25px}
  .progress{flex-wrap:wrap}
}
</style>

<div class="wrap">

  <header class="top">
    <span class="badge"><svg viewBox="0 0 24 24" aria-hidden="true" id="ikoni"></svg></span>
    <div>
      <p class="eyebrow" id="eyebrow"></p>
      <h1 id="otsikko"></h1>
      <p id="kuvaus"></p>
      <div class="tags" id="tags"></div>
    </div>
  </header>

  <article id="teksti"></article>

  <div class="progress" aria-live="polite">
    <span class="lbl">Harjoitukset</span>
    <span class="meter"><i id="pbar" style="width:0%"></i></span>
    <span class="cnt" id="pcnt">0 / 20</span>
  </div>

  <div id="harjoitukset"></div>
  <div id="valmis"></div>

  <p class="back" id="back"></p>

</div>

<script>
const D = {"tavoite_id":"MAT8-FUN-04","oppiaine":"MAT","vuosiluokka":8,"otsikko":"Suorat ristiin","kuvaus":"Osaan muodostaa suoran yhtälön ja tutkia suorien leikkauspistettä, yhdensuuntaisuutta ja kohtisuoruutta.","versio":"0.2","paivitetty":"2026-10-11","ops":{"T":["T5","T15"],"S":["S4"]},"taso":"haaste","ikoni":"kartta","eyebrow":"Matematiikka · 8. luokka · Funktiot ja lukujonot","teksti":[{"tyyppi":"johdanto","sisalto":"Kaupunginrakennuspelissä kartta on ruudukko, ja jokaisella ruudulla on koordinaatit. Rautatieasema on ruudussa (−5, −1) ja satama ruudussa (7, 3), ja niiden välille on vedetty suora katu. Haluat rakentaa toisen kadun, joka kulkee torin (1, 9) kautta ja leikkaa ensimmäisen kadun suorassa kulmassa, ja kolmannen, joka kulkee ensimmäisen rinnalla. Peli kysyy jokaisesta kadusta yhtälön. Tässä taidossa opit muodostamaan suoran yhtälön kahdesta pisteestä, kirjoittamaan sen kahdessa eri muodossa, tunnistamaan kulmakertoimista yhdensuuntaiset ja kohtisuorat suorat ja etsimään piirtämällä pisteen, jossa kaksi suoraa leikkaavat. Samoja työkaluja tarvitaan vanhoissa ylioppilastehtävissä, joita tämän taidon lopussa ratkaistaan. Taito on haastetaso, ja teet sen pääosin itsenäisesti: lue esimerkit huolella, sillä niissä suunnitelma kirjoitetaan näkyviin ennen laskua."},{"tyyppi":"kappale","otsikko":"Esimerkki 1: yhtälö kahdesta pisteestä","sisalto":"Suora kulkee pisteiden (−1, 4) ja (3, −4) kautta. Muodostetaan sen yhtälö muodossa y = kx + b.\nSuunnitelma: (1) lasken kulmakertoimen k pisteistä, (2) sijoitan toisen pisteen yhtälöön y = kx + b ja ratkaisen b:n, (3) tarkistan sijoittamalla molemmat pisteet.\n(1) k = (−4 − 4) : (3 − (−1)) = −8 : 4 = −2. Koordinaatit vähennetään samassa järjestyksessä: ensin toisen pisteen, sitten ensimmäisen.\n(2) Yhtälö on muotoa y = −2x + b. Piste (−1, 4) on suoralla, joten sen koordinaatit toteuttavat yhtälön: x:n paikalle −1 ja y:n paikalle 4. Saadaan 4 = −2 · (−1) + b eli 4 = 2 + b, joten b = 2. Yhtälö on y = −2x + 2.\n(3) Tarkistus: piste (−1, 4): −2 · (−1) + 2 = 4, oikein. Piste (3, −4): −2 · 3 + 2 = −4, oikein.\nMiksi tarkistukseen tarvitaan molemmat pisteet? Kahden eri pisteen kautta kulkee vain yksi suora. Jos kumpikin piste toteuttaa yhtälön, yhtälö on juuri tämän suoran yhtälö. Pelkkä b:n laskemiseen käytetty piste ei riitä, koska se toteuttaa yhtälön, vaikka k olisi laskettu väärin. Kahden pisteen tarkistus paljastaa väärän k:n, väärin päin sijoitetut koordinaatit ja väärän b:n. Jos jompikumpi piste ei toteuta yhtälöä, etsi virhe ennen kuin jatkat.\nKun kulmakerroin ja yksi piste on annettu valmiina, vaihe (1) jää pois. Saman yhtälön voi kirjoittaa myös suoraan muotoon y − 4 = −2(x − (−1)), jossa piste (−1, 4) näkyy, ja sieventää siitä muodon y = −2x + 2."},{"tyyppi":"saanto","otsikko":"Näin muodostat suoran yhtälön kahdesta pisteestä","askeleet":["Kirjoita suunnitelma: kulmakerroin, vakiotermi, tarkistus.","Laske kulmakerroin k = y:n muutos : x:n muutos. Vähennä molempien koordinaattien kohdalla samassa järjestyksessä.","Jos pisteillä on sama x-koordinaatti, x:n muutos on 0, eikä nollalla voi jakaa. Suora on pystysuora ja sen yhtälö on x = luku. Jos pisteillä on sama y-koordinaatti, k = 0 ja yhtälö on y = luku.","Kirjoita y = kx + b, jossa k on laskemasi luku. Sijoita toisen pisteen x-koordinaatti x:n paikalle ja y-koordinaatti y:n paikalle. Kirjoita negatiivinen luku sulkeisiin.","Ratkaise b ja kirjoita valmis yhtälö.","Tarkista sijoittamalla molemmat pisteet. Kumpikin antaa tosi yhtälön, jos ratkaisu on oikein.","Jos tehtävä pyytää yleistä muotoa, muunna yhtälö vasta tarkistuksen jälkeen."]},{"tyyppi":"kappale","otsikko":"Ratkaistu ja yleinen muoto","sisalto":"Muoto y = kx + b on suoran yhtälön ratkaistu muoto: y on ratkaistu yksin vasemmalle puolelle, ja siitä näet heti kulmakertoimen ja vakiotermin. Yleisessä muodossa ax + by + c = 0 kaikki termit ovat vasemmalla puolella, oikealla on 0, ja kertoimet a, b ja c kirjoitetaan kokonaislukuina. Tavaksi on vakiintunut, että x:n kerroin a on positiivinen. Huomaa, että yleisen muodon kirjain b on y:n kerroin eikä sama luku kuin ratkaistun muodon vakiotermi b.\nYleisestä ratkaistuun: ratkaise yhtälö y:n suhteen samoilla säännöillä kuin kaava. Suora 3x − 2y + 4 = 0: siirrä muut termit oikealle, jolloin −2y = −3x − 4. Jaa molemmat puolet luvulla −2, ja jaa jokainen oikean puolen termi: y = 3/2 x + 2. Kulmakerroin on 3/2 ja vakiotermi 2.\nRatkaistusta yleiseen: suora y = −1/4 x + 2. Kerro molemmat puolet nimittäjällä 4, jotta murtoluku häviää: 4y = −x + 8. Siirrä kaikki termit vasemmalle: x + 4y − 8 = 0.\nMiksi yhtälön saa kertoa tai jakaa nollasta poikkeavalla luvulla? Kerrottu yhtälö on tosi täsmälleen samoilla x:n ja y:n arvoilla kuin alkuperäinen, joten se kuvaa samaa suoraa. Siksi x + 4y − 8 = 0 ja −2x − 8y + 16 = 0 ovat saman suoran yhtälöitä. Nollalla kertominen ei käy, koska silloin jäljelle jää 0 = 0, joka on tosi kaikissa pisteissä.\nPysty- ja vaakasuoralla suoralla on myös yleinen muoto. Pystysuora suora x = 5 on yleisessä muodossa x − 5 = 0: y:n kerroin on 0. Sitä ei voi kirjoittaa ratkaistuun muotoon, koska yhtälössä ei ole y:tä, eikä sillä ole kulmakerrointa. Vaakasuora suora y = −3 on yleisessä muodossa y + 3 = 0, ja sen kulmakerroin on 0."},{"tyyppi":"kappale","otsikko":"Yhdensuuntainen ja kohtisuora: miksi tulo on −1","sisalto":"Yhdensuuntaisilla suorilla on sama kulmakerroin (pystysuorilla suorilla kulmakerrointa ei ole, mutta ne ovat kaikki keskenään yhdensuuntaisia): kun x kasvaa yhdellä, kummankin suoran y muuttuu yhtä paljon, joten suorat nousevat tai laskevat yhtä jyrkästi eivätkä koskaan kohtaa. Jos kulmakertoimen lisäksi myös vakiotermi on sama, kyse on samasta suorasta.\nKohtisuoruuden näet ruutupaperilla. Piirrä suoran y = 2x kulmakerroinkolmio: 1 ruutu oikealle ja 2 ruutua ylös. Käännä kolmiota 90° myötäpäivään. Oikealle osoittanut sivu osoittaa nyt alas ja ylös osoittanut sivu oikealle, joten käännetty kolmio on 2 ruutua oikealle ja 1 ruutu alas. Kääntynyt suora on kohtisuorassa alkuperäistä vastaan, ja sen kulmakerroin on y:n muutos : x:n muutos = −1 : 2 = −1/2.\nSama toimii jokaiselle kulmakertoimelle k: kolmio ”1 oikealle, k ylös” kääntyy kolmioksi ”k oikealle, 1 alas”, joten kohtisuoran suoran kulmakerroin on −1/k. Luku kääntyy ylösalaisin, koska kolmion sivut vaihtavat paikkaa, ja etumerkki vaihtuu, koska ylös muuttuu alas. Kun k = 2/3, kolmio on 3 oikealle ja 2 ylös. Käännettynä se on 2 oikealle ja 3 alas, joten kohtisuoran kulmakerroin on −3/2. Myös negatiivisella k:lla etumerkki vaihtuu: suoraa y = −4x + 1 vastaan kohtisuoran suoran kulmakerroin on 1/4.\nKulmakertoimien tulo on aina k · (−1/k) = −1. Kaksi suoraa on siis kohtisuorassa, kun niiden kulmakertoimien tulo on −1. Esimerkiksi 2/3 · (−3/2) = −1. Sääntö koskee suoria, joilla molemmilla on kulmakerroin. Vaakasuora ja pystysuora suora ovat myös kohtisuorassa, mutta pystysuoralla suoralla ei ole kulmakerrointa, joten tuloa ei voi laskea. Vaakasuoraa suoraa vastaan kohtisuora suora on siis aina pystysuora, ja pystysuoraa vastaan kohtisuora vaakasuora."},{"tyyppi":"kappale","otsikko":"Esimerkki 2: kohtisuora suora ja koordinaattiakselit","sisalto":"Muodostetaan sen suoran yhtälö, joka kulkee pisteen (3, 4) kautta ja on kohtisuorassa suoraa 3x + 2y − 4 = 0 vastaan. Kirjoitetaan vastaus yleisessä muodossa ja lasketaan, kuinka suuren kolmion suora rajaa koordinaattiakselien kanssa.\nSuunnitelma: (1) annetun suoran kulmakerroin ratkaistusta muodosta, (2) kohtisuoran kulmakerroin, (3) vakiotermi pisteestä, (4) tarkistus, (5) yleinen muoto, (6) akselien leikkauspisteet ja kolmion ala.\n(1) 2y = −3x + 4, joten y = −3/2 x + 2 ja k₁ = −3/2.\n(2) Kohtisuoran kulmakerroin on −1/k₁ = 2/3. Tarkistus: −3/2 · 2/3 = −1.\n(3) y = 2/3 x + b ja piste (3, 4): 4 = 2/3 · 3 + b = 2 + b, joten b = 2. Yhtälö on y = 2/3 x + 2.\n(4) Pisteessä (3, 4): 2/3 · 3 + 2 = 4, oikein.\n(5) Kerrotaan luvulla 3: 3y = 2x + 6, joten 2x − 3y + 6 = 0.\n(6) Suora leikkaa y-akselin pisteessä (0, 2), koska vakiotermi on 2. x-akselilla y = 0: 0 = 2/3 x + 2, josta 2/3 x = −2 ja x = −3. Leikkauspiste on (−3, 0). Kolmion kärjet ovat (0, 0), (−3, 0) ja (0, 2). Sen kateetit ovat akseleilla, ja niiden pituudet ovat 3 ja 2, joten ala on 3 · 2 : 2 = 3.\nHuomaa vaiheessa (6), että pituus on aina positiivinen, vaikka leikkauspiste on negatiivisella puolella."},{"tyyppi":"kappale","otsikko":"Leikkauspiste piirtämällä ja tarkistus sijoittamalla","sisalto":"Kaksi suoraa, jotka eivät ole yhdensuuntaisia, leikkaavat täsmälleen yhdessä pisteessä. Leikkauspiste on molemmilla suorilla, joten sen koordinaatit toteuttavat kummankin suoran yhtälön.\nEtsi leikkauspiste piirtämällä: laske kummallekin suoralle kolme pistettä (tai piirrä se kulmakertoimen ja vakiotermin avulla), piirrä suorat samaan koordinaatistoon viivoittimella ja lue leikkauspisteen koordinaatit. Suorat y = 2x − 4 ja y = −x + 5 näyttävät leikkaavan pisteessä (3, 2).\nPiirros on aina hieman epätarkka, joten tarkista luettu piste sijoittamalla se molempiin yhtälöihin: 2 · 3 − 4 = 2 ja −3 + 5 = 2. Molemmat antavat y = 2, joten (3, 2) on leikkauspiste. Jos luit pisteeksi (3, 1), tarkistus paljastaa sen: 2 · 3 − 4 = 2 eikä 1. Jos piste toteuttaa vain toisen yhtälön, se on vain toisella suoralla. Piirrä silloin tarkemmin tai kokeile viereisiä ruudukon pisteitä. Tämän taidon tehtävissä leikkauspisteen koordinaatit ovat kokonaislukuja.\nLeikkauspiste on piste, joten vastaukseen kuuluvat molemmat koordinaatit: (3, 2), ei pelkkä 3. Yhdensuuntaiset eri suorat, kuten y = 2x + 1 ja y = 2x − 3, eivät leikkaa lainkaan. Kun suora on yleisessä muodossa, muunna se ensin ratkaistuun muotoon, niin piirtäminen on helpompaa."},{"tyyppi":"ansa","otsikko":"Vakiotermi ei ole pisteen y-koordinaatti","sisalto":"Suoran kulmakerroin on −3, ja se kulkee pisteen (2, 4) kautta. Houkutteleva vastaus on y = −3x + 4, mutta pisteen y-koordinaatti on vakiotermi vain silloin, kun pisteen x-koordinaatti on 0. Sijoita piste: 4 = −3 · 2 + b = −6 + b, joten b = 10 ja yhtälö on y = −3x + 10.\nToinen tavallinen virhe on sijoittaa koordinaatit väärin päin: 2 = −3 · 4 + b, josta b = 14. Muista, että pisteessä (x, y) ensimmäinen luku menee x:n paikalle.\nMolemmat virheet paljastuvat tarkistuksessa: yhtälö y = −3x + 4 antaa pisteessä x = 2 arvon −2 eikä 4, ja yhtälö y = −3x + 14 arvon 8."},{"tyyppi":"ansa","otsikko":"Puolet muunnoksesta unohtuu","sisalto":"Kohtisuoran suoran kulmakertoimessa tarvitaan kaksi muutosta: luku käännetään ylösalaisin ja etumerkki vaihdetaan. Kun k = 4, kohtisuora kulmakerroin on −1/4. Pelkkä vastaluku −4 tai pelkkä käänteisluku 1/4 on väärin. Tarkista tulolla: 4 · (−1/4) = −1, mutta 4 · (−4) = −16 ja 4 · 1/4 = 1.\nYleisestä muodosta ratkaistaessa jaetaan y:n kertoimella jokainen termi etumerkkeineen. Suora 6x + 3y − 9 = 0: 3y = −6x + 9, joten y = −2x + 3. Jos jako unohtuu, saadaan väärä y = −6x + 9, ja jos etumerkki unohtuu siirrossa, väärä y = 2x + 3. Tarkista sijoittamalla piste, jonka x ei ole 0, esimerkiksi x = 1: yhtälöstä y = −2x + 3 saadaan piste (1, 1), ja 6 · 1 + 3 · 1 − 9 = 0, oikein. Väärästä yhtälöstä y = 2x + 3 saataisiin piste (1, 5), ja 6 · 1 + 3 · 5 − 9 = 12 eikä 0. Kohta x = 0 ei paljasta etumerkkivirhettä, koska se testaa vain vakiotermin, ja vakiotermi on tässä virheessä oikein."},{"tyyppi":"muistilappu","otsikko":"Muistilappu: suorat ristiin","kohdat":["Yhtälö kahdesta pisteestä: k pisteistä, b sijoittamalla piste muotoon y = kx + b, tarkistus molemmilla pisteillä.","Vakiotermi on pisteen y-koordinaatti vain, kun pisteen x on 0.","Ratkaistu muoto y = kx + b, yleinen muoto ax + by + c = 0 kokonaislukukertoimin. Nollasta poikkeavalla luvulla kerrottu yhtälö kuvaa samaa suoraa.","Yleisestä ratkaistuun: jaa y:n kertoimella jokainen termi.","Sama x-koordinaatti: x = luku. Sama y-koordinaatti: y = luku.","Yhdensuuntaiset: sama k. Kohtisuorat: k₁ · k₂ = −1 eli kohtisuora kulmakerroin −1/k.","Leikkauspiste: piirrä, lue, tarkista molempiin yhtälöihin, vastaa molemmat koordinaatit."]}],"harjoitusryhmat":[{"id":"tyokalut","nimi":"Työkalut: yhtälö, kaksi muotoa ja kohtisuora kulmakerroin","info":"Ilman laskinta. Kirjoita välivaiheet vihkoon. Murtoluvun voit antaa muodossa 3/4 tai -3/4."},{"id":"kaksi","nimi":"Kaksi vaihetta: suunta, piste ja leikkauspiste","info":"Ilman laskinta. Leikkauspistetehtävissä piirrä suorat ruutupaperille ja tarkista piste sijoittamalla se molempiin yhtälöihin."},{"id":"ylikurssi","nimi":"Ylikurssi: vanhojen koetehtävien tyyppejä","info":"Ilman laskinta. Kirjoita ensin suunnitelma ja tarkista lopuksi sijoittamalla."}],"harjoitukset":[{"id":"H01","ryhma":"tyokalut","kysymys":"Suoran kulmakerroin on −2, ja suora kulkee pisteen (3, 1) kautta. Suoran yhtälö on y = kx + b. Mikä on b?","vastaus":7,"vinkki":"Sijoita yhtälöön y = −2x + b x:n paikalle 3 ja y:n paikalle 1.","selitys":"1 = −2 · 3 + b = −6 + b, joten b = 7. Yhtälö on y = −2x + 7. Vastaus 1 syntyy, jos pisteen y-koordinaatti luetaan suoraan vakiotermiksi."},{"id":"H02","ryhma":"tyokalut","kysymys":"Suora kulkee pisteiden (1, 5) ja (3, 11) kautta. Muodosta suoran yhtälö muodossa y = kx + b. Mikä on b?","vastaus":2,"vinkki":"Laske ensin k = (11 − 5) : (3 − 1). Sijoita sitten toinen piste.","selitys":"k = 6 : 2 = 3. Pisteestä (1, 5): 5 = 3 · 1 + b, joten b = 2. Tarkistus pisteellä (3, 11): 3 · 3 + 2 = 11, oikein."},{"id":"H03","ryhma":"tyokalut","kysymys":"Kirjoita suora 2x + 7y − 14 = 0 muotoon y = kx + b. Mikä on k? Anna vastaus murtolukuna.","vastaus":-0.2857142857142857,"vinkki":"Siirrä 2x ja −14 oikealle puolelle ja jaa jokainen termi y:n kertoimella 7.","selitys":"7y = −2x + 14, joten y = −2/7 x + 2. Kulmakerroin on −2/7. Vastaus −2 syntyy, jos jako luvulla 7 unohtuu."},{"id":"H04","ryhma":"tyokalut","kysymys":"Suoran kulmakerroinkolmio on ruutupaperilla 5 ruutua oikealle ja 2 ruutua ylös. Käännä kolmiota 90° myötäpäivään. Mikä on käännetyn kolmion suoran kulmakerroin? Anna vastaus murtolukuna.","vastaus":-2.5,"vinkki":"Oikealle osoittava sivu kääntyy osoittamaan alas ja ylös osoittava sivu oikealle.","selitys":"Käännetty kolmio on 2 ruutua oikealle ja 5 ruutua alas, joten kulmakerroin on −5 : 2 = −5/2. Alkuperäinen kulmakerroin on 2/5, ja tulo 2/5 · (−5/2) = −1."},{"id":"H05","ryhma":"tyokalut","kysymys":"Suoran kulmakerroin on 5. Mikä on sitä vastaan kohtisuoran suoran kulmakerroin? Anna vastaus murtolukuna.","vastaus":-0.2,"vinkki":"Kohtisuora kulmakerroin on −1/k: käännä luku ylösalaisin ja vaihda etumerkki.","selitys":"−1/5. Tarkistus: 5 · (−1/5) = −1. Vastaus −5 on pelkkä vastaluku ja 1/5 pelkkä käänteisluku."},{"id":"H06","ryhma":"tyokalut","kysymys":"Suora kulkee pisteiden (2, −1) ja (2, 4) kautta. Mikä on suoran yhtälö?","vastaus":2,"vinkki":"Kumpi koordinaatti on molemmissa pisteissä sama?","selitys":"Molempien pisteiden x-koordinaatti on 2, joten suora on pystysuora ja sen yhtälö on x = 2. Kulmakerrointa ei voi laskea, koska x:n muutos on 0.","tyyppi":"monivalinta","vaihtoehdot":["y = 2","y = 5x − 11","x = 2","y = −1"]},{"id":"H07","ryhma":"tyokalut","kysymys":"Kirjoita suora y = 5/3 x − 2 yleisessä muodossa ax + by + c = 0 niin, että a = 5 ja b ja c ovat kokonaislukuja. Mikä on c?","vastaus":-6,"vinkki":"Kerro molemmat puolet nimittäjällä 3 ja siirrä kaikki termit vasemmalle.","selitys":"3y = 5x − 6, joten 5x − 3y − 6 = 0 ja c = −6. Vastaus −2 syntyy, jos vain y ja x-termi kerrotaan luvulla 3."},{"id":"H08","ryhma":"kaksi","kysymys":"Suora kulkee pisteiden (−2, 1) ja (2, 3) kautta. Kirjoita suoran yhtälö yleisessä muodossa ax + by + c = 0 niin, että a = 1 ja b ja c ovat kokonaislukuja. Mikä on c?","vastaus":4,"vinkki":"Muodosta ensin y = kx + b ja tarkista se. Kerro sitten nimittäjällä.","selitys":"k = 2 : 4 = 1/2. Pisteestä (2, 3): 3 = 1 + b, joten b = 2 ja y = 1/2 x + 2. Tarkistus pisteellä (−2, 1): −1 + 2 = 1, oikein. Kerrotaan luvulla 2: 2y = x + 4, joten x − 2y + 4 = 0 ja c = 4."},{"id":"H09","ryhma":"kaksi","kysymys":"Suora on yhdensuuntainen suoran 3x + y − 4 = 0 kanssa ja kulkee pisteen (−1, 5) kautta. Mikä on sen vakiotermi?","vastaus":2,"vinkki":"Ratkaise annetusta suorasta y, niin näet kulmakertoimen. Yhdensuuntaisella suoralla on sama kulmakerroin.","selitys":"y = −3x + 4, joten k = −3. Pisteestä (−1, 5): 5 = −3 · (−1) + b = 3 + b, joten b = 2. Suora on y = −3x + 2."},{"id":"H10","ryhma":"kaksi","kysymys":"Suora on kohtisuorassa suoraa y = −2x + 1 vastaan ja kulkee pisteen (4, 6) kautta. Mikä on sen vakiotermi?","vastaus":4,"vinkki":"Kohtisuora kulmakerroin on −1/(−2). Sijoita sitten piste.","selitys":"Kohtisuora kulmakerroin on 1/2. Pisteestä (4, 6): 6 = 1/2 · 4 + b = 2 + b, joten b = 4. Jos käytät kulmakerrointa 2 (pelkkä vastaluku), saat väärän b = −2."},{"id":"H11","ryhma":"kaksi","kysymys":"Suora s on kohtisuorassa suoraa x + 3y − 6 = 0 vastaan. Mikä on suoran s kulmakerroin?","vastaus":3,"vinkki":"Ratkaise annetusta suorasta y ja katso kulmakerroin. Kohtisuora on −1/k.","selitys":"3y = −x + 6, joten y = −1/3 x + 2 ja k₁ = −1/3. Kohtisuora kulmakerroin on −1 : (−1/3) = 3. Tarkistus: −1/3 · 3 = −1."},{"id":"H12","ryhma":"kaksi","kysymys":"Suora kulkee pisteen (−2, 3) kautta ja on kohtisuorassa suoraa x = 5 vastaan. Mikä on suoran yhtälö?","vastaus":0,"vinkki":"x = 5 on pystysuora suora. Millainen suora on kohtisuorassa pystysuoraa vastaan?","selitys":"Pystysuoraa vastaan kohtisuora suora on vaakasuora, joten sen kaikilla pisteillä on sama y-koordinaatti kuin pisteellä (−2, 3). Yhtälö on y = 3.","tyyppi":"monivalinta","vaihtoehdot":["y = 3","x = −2","y = −1/5 x + 3","x = 5"]},{"id":"H13","ryhma":"kaksi","kysymys":"Piirrä suorat y = x + 2 ja y = −3x + 6 samaan koordinaatistoon ruutupaperille. Mikä on leikkauspisteen y-koordinaatti? Tarkista piste sijoittamalla se kumpaankin yhtälöön.","vastaus":3,"vinkki":"Laske kummallekin suoralle pisteet, kun x on 0, 1 ja 2.","selitys":"Suorat leikkaavat pisteessä (1, 3). Tarkistus: 1 + 2 = 3 ja −3 · 1 + 6 = 3. Kysytty y-koordinaatti on 3."},{"id":"H14","ryhma":"kaksi","kysymys":"Pisteet:\n1) (2, 1)\n2) (4, −1)\n3) (2, 3)\n4) (3, 2)\n\nMonesko pisteistä on suorien y = x − 1 ja y = −3x + 11 leikkauspiste?","vastaus":4,"vinkki":"Sijoita jokainen piste kumpaankin yhtälöön. Leikkauspiste toteuttaa molemmat.","selitys":"Piste (2, 1) on vain suoralla y = x − 1, piste (4, −1) vain suoralla y = −3x + 11, ja piste (2, 3) ei ole kummallakaan. Piste (3, 2): 3 − 1 = 2 ja −9 + 11 = 2, joten se on leikkauspiste."},{"id":"H15","ryhma":"ylikurssi","kysymys":"Pisteiden (−4, 1) ja (2, 5) kautta kulkevalla suoralla on piste (5, c). Mikä on c?","vastaus":7,"vinkki":"Muodosta ensin suoran yhtälö ja tarkista se. Sijoita sitten x = 5.","selitys":"k = 4 : 6 = 2/3. Pisteestä (2, 5): 5 = 4/3 + b, joten b = 11/3. Kun x = 5: y = 10/3 + 11/3 = 21/3 = 7."},{"id":"H16","ryhma":"ylikurssi","kysymys":"Suora kulkee pisteiden (−1, 7) ja (2, 1) kautta. Missä kohdassa suora leikkaa x-akselin? Anna leikkauspisteen x-koordinaatti murtolukuna tai desimaalilukuna.","vastaus":2.5,"vinkki":"Muodosta yhtälö. x-akselilla y = 0.","selitys":"k = −6 : 3 = −2, ja pisteestä (2, 1): 1 = −4 + b, joten b = 5. x-akselilla 0 = −2x + 5, joten x = 5/2 = 2,5. Vakiotermi 5 kertoo y-akselin leikkauspisteen, ei x-akselin."},{"id":"H17","ryhma":"ylikurssi","kysymys":"Pisteiden (−2, 8) ja (3, −2) kautta kulkeva suora rajaa koordinaattiakselien kanssa kolmion. Mikä on kolmion pinta-ala?","vastaus":4,"vinkki":"Suunnitelma: yhtälö, tarkistus, leikkauspisteet akseleilla, kolmion ala.","selitys":"k = −10 : 5 = −2, ja pisteestä (3, −2): −2 = −6 + b, joten b = 4. Suora y = −2x + 4 leikkaa y-akselin pisteessä (0, 4) ja x-akselin pisteessä (2, 0). Kolmion ala on 2 · 4 : 2 = 4."},{"id":"H18","ryhma":"ylikurssi","kysymys":"Janan AB päätepisteet ovat A = (−3, 2) ja B = (1, 4), ja janan keskipiste on (−1, 3). Janan keskinormaali on suora, joka kulkee keskipisteen kautta ja on kohtisuorassa janaa AB vastaan. Mikä on keskinormaalin vakiotermi?","vastaus":1,"vinkki":"Laske janan AB kulmakerroin, sitten kohtisuora kulmakerroin, ja sijoita keskipiste.","selitys":"Janan kulmakerroin on 2 : 4 = 1/2, joten keskinormaalin kulmakerroin on −2. Keskipisteestä: 3 = −2 · (−1) + b = 2 + b, joten b = 1. Keskinormaali on y = −2x + 1."},{"id":"H19","ryhma":"ylikurssi","kysymys":"Nelikulmion kärjet ovat A = (0, 0), B = (4, 2), C = (3, 4) ja D = (1, 3). Montako nelikulmion ABCD neljästä kulmasta on suoria?","vastaus":2,"vinkki":"Laske sivujen AB, BC, CD ja DA kulmakertoimet. Kulma on suora, kun sen sivujen kulmakertoimien tulo on −1.","selitys":"AB: 2/4 = 1/2, BC: 2 : (−1) = −2, CD: (−1) : (−2) = 1/2, DA: (−3) : (−1) = 3. Kulmissa B ja C tulo on 1/2 · (−2) = −1. Kulmissa A ja D tulo on 3/2. Suoria kulmia on kaksi."},{"id":"H20","ryhma":"ylikurssi","kysymys":"Joni muodosti pisteiden (2, 5) ja (4, 9) kautta kulkevan suoran yhtälöksi y = 2x + 5. Tarkista Jonin yhtälö sijoittamalla siihen molemmat pisteet. Mikä on oikea vakiotermi?","vastaus":1,"vinkki":"Antaako yhtälö pisteessä x = 2 arvon 5?","selitys":"Kulmakerroin 4 : 2 = 2 on oikein, mutta y = 2x + 5 antaa pisteessä x = 2 arvon 9 eikä 5. Joni on lukenut pisteen y-koordinaatin vakiotermiksi. Oikein: 5 = 4 + b, joten b = 1. Tarkistus: 2 · 2 + 1 = 5 ja 2 · 4 + 1 = 9."}],"valmis_teksti":"Muodostat suoran yhtälön kahdesta pisteestä ja tarkistat sen sijoittamalla molemmat pisteet. Kirjoitat yhtälön sekä ratkaistussa että yleisessä muodossa, tunnistat yhdensuuntaiset suorat samasta kulmakertoimesta ja perustelet kohtisuoruuden kulmakertoimien tulolla −1. Etsit kahden suoran leikkauspisteen piirtämällä ja tarkistat sen molempiin yhtälöihin, ja ratkaiset vanhan ylioppilastehtävän tyyppisiä ongelmia suorista. Tämä taito on nyt näytetty."};

const esc = s => s;
const osat = D.teksti.map(o=>{

    case "johdanto":
      return `<p class="lead">${esc(o.sisalto)}</p>`;
    case "kappale":
      return `<h2>${esc(o.otsikko)}</h2><p>${esc(o.sisalto)}</p>`;
    case "saanto":
      return `<div class="box"><h3>${esc(o.otsikko)}</h3><ol class="steps">${
        o.askeleet.map(a=>`<li><span>${esc(a)}</span></li>`).join("")}</ol></div>`;
    case "taulukko":
      return `<div class="box"><h3>${esc(o.otsikko)}</h3><div class="tablewrap"><table><thead><tr>${
        o.otsikkorivi.map(h=>`<th>${h}</th>`).join("")}</tr></thead><tbody>${
        o.rivit.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join("")}</tr>`).join("")}</tbody></table></div></div>`;
    case "ansa":
      return `<div class="box warn"><h3>${esc(o.otsikko)}</h3><p style="margin:0">${esc(o.sisalto)}</p></div>`;
    case "muistilappu":
      return `<div class="box note"><h3>${esc(o.otsikko)}</h3><ul class="notes">${
        o.kohdat.map(k=>`<li>${esc(k)}</li>`).join("")}</ul></div>`;
    case "numerotaulu":
      return `<div class="box nt"><h3>${esc(o.otsikko)}</h3><p class="ohje">${esc(o.sisalto)}</p>
        <div class="nt-valinta" id="ntValinta"></div>
        <div class="nt-taulu" id="ntTaulu"></div>
        <p class="nt-selite" id="ntSelite"></p></div>`;
    case "vahvuusportaat":
      return `<div class="box vp"><h3>${esc(o.otsikko)}</h3><p class="ohje">${esc(o.sisalto)}</p>
        <div class="vp-tasot">${o.tasot.map(t=>
          `<div class="vp-taso" data-taso="${t.id}"><span class="vp-pallo"></span>

        <div class="vp-rivi"><button type="button" class="btn ghost" id="vpSeuraava">Toinen lauseke</button>
        <span class="vp-vastaus" id="vpVastaus"></span></div></div>`;
    case "laskujarjestys":
      return `<div class="box lj"><h3>${esc(o.otsikko)}</h3><p style="margin:0 0 12px;font-size:14.5px;color:var(--ink-2)">${esc(o.sisalto)}</p>

const svg=document.getElementById("nlsvg"), rng=document.getElementById("nlrange"), out=document.getElementById("nlout");
const X0=34, X1=606, Y=62;
function piirraNL(v){
  const ala=Math.floor(v/10)*10, yla=ala+10, puoli=ala+5;
  const pyor = (v%10)>=5 ? yla : ala;
  const x = n => X0 + (n/100)*(X1-X0);
  let s=`<line class="rail" x1="${X0}" y1="${Y}" x2="${X1}" y2="${Y}"/>`;
  for(let n=0;n<=100;n+=10){
    const near = (n===ala||n===yla);
    s+=`<line class="tick" x1="${x(n)}" y1="${Y-7}" x2="${x(n)}" y2="${Y+7}"/>`;
    s+=`<text class="stop${near?" near":""}" x="${x(n)}" y="${Y+24}" text-anchor="middle">${n}</text>`;
  }
  s+=`<line class="halfway" x1="${x(puoli)}" y1="${Y-16}" x2="${x(puoli)}" y2="${Y+12}"/>`;
  s+=`<text class="stop" x="${x(puoli)}" y="${Y-22}" text-anchor="middle">puoliväli ${puoli}</text>`;
  s+=`<circle class="dot" cx="${x(v)}" cy="${Y}" r="6"/>`;
  s+=`<text class="val" x="${x(v)}" y="${Y-32}" text-anchor="middle">${v}</text>`;
  s+=`<path d="M ${x(v)} ${Y+38} L ${x(pyor)} ${Y+38}" stroke="var(--core)" stroke-width="2" fill="none"/>`;
  s+=`<path d="M ${x(pyor)} ${Y+38} l ${x(pyor)>x(v)?-7:7} -4 l 0 8 z" fill="var(--core)"/>`;
  svg.innerHTML=s;
  out.textContent = `${v} pyöristyy → ${pyor}`;
}

/* ---------- laskujärjestys-widget ---------- */
const ljExp=document.getElementById("ljExp");
if(ljExp && D.kokeilu){
  let ljI=0, ljTokens=[], ljStep=0;
  const laske=(a,op,b)=>{a=+a;b=+b;return op==="×"?a*b:op==="÷"?a/b:op==="+"?a+b:a-b;};
  function ljAlku(){
    const l=D.kokeilu[ljI];
    ljTokens=l.lauseke.replace(/\(/g,"( ").replace(/\)/g," )").split(/\s+/).filter(Boolean);
    ljStep=0; ljPiirra(); ljViesti("","");
  }
  function ljViesti(t,lk){const f=document.getElementById("ljFb"); f.textContent=t; f.className="lj-fb "+(lk||"");}
  function ljPiirra(){
    const l=D.kokeilu[ljI];
    document.getElementById("ljStep").textContent =
      ljStep>=l.askeleet.length ? "valmis" : `askel ${ljStep+1} / ${l.askeleet.length}`;
    if(ljStep>=l.askeleet.length){
      ljExp.innerHTML=`<span class="valmis">${l.lauseke} = ${l.vastaus}</span>`;
      return;
    }
    ljExp.innerHTML=ljTokens.map((t,i)=>
      "×÷+−".includes(t) ? `<button type="button" class="op" data-i="${i}">${t}</button>`
                         : `<span class="tok">${t}</span>`).join("");
    ljExp.querySelectorAll("button.op").forEach(b=>b.addEventListener("click",()=>ljKlikkaa(+b.dataset.i)));
  }
  function ljKlikkaa(i){
    const l=D.kokeilu[ljI], odotettu=l.askeleet[ljStep];
    const ehdotus=[ljTokens[i-1],ljTokens[i],ljTokens[i+1]].join(" ");
    if(ehdotus!==odotettu){
      ljViesti(ljStep===0
        ? "Ei vielä. Sulkeet ovat vahvimmat, sitten kerto ja jako. Yhtä vahvat vasemmalta oikealle."
        : "Ei vielä. Kumpi jäljellä olevista on vahvempi?", "no");
      return;
    }
    const arvo=laske(ljTokens[i-1],ljTokens[i],ljTokens[i+1]);
    let alku=i-1, loppu=i+1;
    if(ljTokens[i-2]==="(" && ljTokens[i+2]===")"){ alku=i-2; loppu=i+2; }
    ljTokens.splice(alku, loppu-alku+1, String(arvo));
    ljStep++;
    ljViesti(ljStep>=l.askeleet.length ? "Valmis. Vastaus on "+l.vastaus+"." : "Oikein. Jatka seuraavaan.", "ok");
    ljPiirra();
  }
  document.getElementById("ljSeuraava").addEventListener("click",()=>{
    ljI=(ljI+1)%D.kokeilu.length; ljAlku();
  });
  ljAlku();
}

/* Suomalainen lukumuoto: välilyönti on tuhaterotin, pilkku desimaalierotin.
   Piste voi olla kumpi tahansa. Se tulkitaan tuhaterottimeksi VAIN silloin, kun
   koko luku on aitoa tuhaterotinmuotoa: alkuosa 1–3 numeroa ilman etunollaa ja
   jokainen jatko-osa täsmälleen 3 numeroa (1.500, 12.345.678). Kaikissa muissa
   tapauksissa piste on desimaalipiste — myös 0.125, joka vanhalla säännöllä
   ("3 numeroa pisteen jäljessä = tuhaterotin") luettiin virheellisesti luvuksi 125. */
const TUHATEROTIN = /^[1-9]\d{0,2}(\.\d{3})+$/;
function lueLuku(teksti){
  // Murtoluku (3/4, -3/4) ja sekaluku (1 2/3, -1 2/3) hyväksytään sellaisinaan.
  const raaka = String(teksti).replace(/\u00a0/g, " ").trim();
  let m = raaka.match(/^(-?)(\d+)\s+(\d+)\s*\/\s*(\d+)$/);
  if(m){ const nim = Number(m[4]); if(nim === 0) return null;
    const v = Number(m[2]) + Number(m[3]) / nim; return m[1] ? -v : v; }
  m = raaka.match(/^(-?)\s*(\d+)\s*\/\s*(\d+)$/);
  if(m){ const nim = Number(m[3]); if(nim === 0) return null;
    const v = Number(m[2]) / nim; return m[1] ? -v : v; }
  let s = String(teksti).replace(/[\s\u00a0]/g, "");
  if(s === "") return null;
  if(s.indexOf(",") >= 0){
    s = s.replace(/\./g, "").replace(",", ".");
  } else if(TUHATEROTIN.test(s)){
    s = s.replace(/\./g, "");
  }
  const n = Number(s);
  return Number.isFinite(n) ? n : null;
}

function tarkista(id){
  const h=D.harjoitukset.find(x=>x.id===id);
  const kentta=document.getElementById("in-"+id);
  const fb=document.getElementById("fb-"+id);
  if(kentta.value.trim()===""){ fb.className="fb hint"; fb.textContent="Kirjoita vastaus ensin."; return; }
  const luku=lueLuku(kentta.value);
  if(luku===null){ fb.className="fb no"; fb.textContent="Vastauksen pitää olla luku tai murtoluku (esimerkiksi 3/4)."; return; }
  const oikein = Math.abs(luku - h.vastaus) < 1e-9;
  merkitseTulos(id, oikein, oikein ? "Oikein. "+h.selitys : `Ei vielä. ${h.vinkki} Kokeile uudelleen.`);
}

function tarkistaMonivalinta(id, valittuIndeksi, painike){
  const h=D.harjoitukset.find(x=>x.id===id);
  const rivi=painike.closest(".row");
  rivi.querySelectorAll(".mv-valinta").forEach(b=>b.disabled=true);
  const oikein = valittuIndeksi===h.vastaus;
  painike.classList.add(oikein?"mv-oikein":"mv-vaarin");
  if(!oikein){
    const oikeaBtn=rivi.querySelector(`[data-i="${h.vastaus}"]`);
    if(oikeaBtn) oikeaBtn.classList.add("mv-oikein");
  }
  merkitseTulos(id, oikein, oikein ? "Oikein. "+h.selitys : `Ei ihan. Oikea vastaus on korostettu. ${h.selitys||""}`);
}

/* Kuuntelu: selain lukee tekstin ääneen omalla puhesynteesillään (englanniksi, jos laitteessa on
   englanninkielinen ääni). Ei äänitiedostoja eikä verkkoyhteyttä. Jos laite ei osaa puhua,
   teksti näytetään luettavaksi — silloin tehtävä muuttuu luetun ymmärtämiseksi, mutta ei katkea. */
function puhu(id, nopeus){
  const h=D.harjoitukset.find(x=>x.id===id); if(!h || !h.kuuntele) return;
  const vara=document.getElementById("vara-"+id);
  const naytaTeksti=syy=>{ vara.hidden=false; vara.textContent=syy+" Teksti: "+h.kuuntele; };
  if(!("speechSynthesis" in window)){ naytaTeksti("Tämä laite ei osaa lukea ääneen."); return; }
  const s=window.speechSynthesis; s.cancel();
  const u=new SpeechSynthesisUtterance(h.kuuntele);
  u.lang=h.kieli||"en-GB"; u.rate=nopeus;
  const aanet=s.getVoices(), kieli=u.lang.slice(0,2);
  const aani=aanet.find(a=>a.lang===u.lang) || aanet.find(a=>a.lang && a.lang.startsWith(kieli));
  if(aani) u.voice=aani;
  else if(aanet.length) { naytaTeksti("Laitteessa ei ole englanninkielistä ääntä."); return; }
  u.onerror=()=>naytaTeksti("Ääneen lukeminen ei onnistunut.");
  s.speak(u);
}
