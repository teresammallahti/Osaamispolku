<title>Arvoitus yhtälöksi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">

<style>
:root{
  --paper:#EFF2F5; --surface:#FFFFFF; --surface-2:#F7F9FB;
  --grid:#DCE3EA; --line:#C9D3DC;
  --ink:#15222C; --ink-2:#4E626F; --ink-3:#7E8F9B;
  --core:#1B5A9E; --core-soft:#E4EDF6;
  --strong:#1F6E5C; --strong-soft:#E1F0EB;
  --chal:#9A6A16; --chal-soft:#F6EDDC;
  --alert:#A33A2B; --alert-soft:#F8E7E3;
  --shadow:0 1px 2px rgba(21,34,44,.06), 0 8px 24px -12px rgba(21,34,44,.18);
  --r:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0F161B; --surface:#18222A; --surface-2:#1D2830;
    --grid:#22303A; --line:#2E3E4A;
    --ink:#E8EFF4; --ink-2:#A3B4C0; --ink-3:#7A8B97;
    --core:#7FB2E4; --core-soft:#16303F;
    --strong:#77CDB4; --strong-soft:#123028;
    --chal:#E0B267; --chal-soft:#33270F;
    --alert:#E8907F; --alert-soft:#3A1E19;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -14px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --paper:#0F161B; --surface:#18222A; --surface-2:#1D2830;
  --grid:#22303A; --line:#2E3E4A;
  --ink:#E8EFF4; --ink-2:#A3B4C0; --ink-3:#7A8B97;
  --core:#7FB2E4; --core-soft:#16303F;
  --strong:#77CDB4; --strong-soft:#123028;
  --chal:#E0B267; --chal-soft:#33270F;
  --alert:#E8907F; --alert-soft:#3A1E19;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -14px rgba(0,0,0,.7);
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:16px; line-height:1.62;
  background-image:
    linear-gradient(to right, var(--grid) 1px, transparent 1px),
    linear-gradient(to bottom, var(--grid) 1px, transparent 1px);
  background-size:26px 26px;
}
.wrap{max-width:760px; margin:0 auto; padding:28px 20px 90px}
h1,h2,h3,h4{font-family:"Familjen Grotesk","IBM Plex Sans",system-ui,sans-serif; text-wrap:balance}

/* header */
header.top{background:var(--surface); border:1px solid var(--line); border-radius:var(--r);
  box-shadow:var(--shadow); padding:22px 24px; display:flex; gap:18px; align-items:flex-start}
.badge{flex:0 0 auto; width:54px; height:54px; border-radius:9px; display:grid; place-items:center;
  background:var(--core-soft); border:1px solid var(--core); color:var(--core)}
.badge svg{width:28px; height:28px; fill:none; stroke:currentColor; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round}
.eyebrow{font-family:"IBM Plex Mono",monospace; font-size:11px; letter-spacing:.14em;
  text-transform:uppercase; color:var(--ink-3); margin:0 0 5px}
header.top h1{margin:0; font-size:30px; font-weight:700; letter-spacing:-.015em}
header.top p{margin:5px 0 0; color:var(--ink-2); font-size:15px}
.tags{display:flex; flex-wrap:wrap; gap:5px; margin-top:11px}
.tag{font-family:"IBM Plex Mono",monospace; font-size:10.5px; letter-spacing:.05em; padding:2px 7px;
  border-radius:4px; background:var(--surface-2); border:1px solid var(--line); color:var(--ink-3)}
.tag.core{background:var(--core-soft); border-color:var(--core); color:var(--core)}

/* teksti */
article{margin-top:26px}
article h2{font-size:21px; font-weight:600; margin:32px 0 10px; letter-spacing:-.01em}
article p{margin:0 0 14px; max-width:64ch}
.lead{font-size:17.5px; color:var(--ink); border-left:3px solid var(--core); padding-left:16px; margin:0 0 8px}

.box{background:var(--surface); border:1px solid var(--line); border-radius:var(--r);
  padding:18px 22px; box-shadow:var(--shadow); margin:22px 0}
.box h3{margin:0 0 12px; font-size:16.5px; font-weight:600}
.box.warn{border-left:3px solid var(--alert)}
.box.note{border-left:3px solid var(--chal)}

ol.steps{margin:0; padding-left:0; list-style:none; counter-reset:s; display:grid; gap:12px}
ol.steps li{counter-increment:s; display:grid; grid-template-columns:auto 1fr; gap:13px; align-items:start}
ol.steps li::before{content:counter(s); font-family:"Familjen Grotesk",sans-serif; font-weight:700; font-size:14px;
  width:26px; height:26px; border-radius:50%; background:var(--core); color:#fff; display:grid; place-items:center; margin-top:2px}

ul.notes{margin:0; padding-left:19px}
ul.notes li{margin-bottom:7px}
ul.notes li:last-child{margin-bottom:0}

.tablewrap{overflow-x:auto}
table{border-collapse:collapse; width:100%; font-size:14.5px; min-width:460px}
th,td{text-align:left; padding:9px 13px; border-bottom:1px solid var(--line)}
th{font-family:"IBM Plex Mono",monospace; font-size:10.5px; letter-spacing:.1em; text-transform:uppercase;
  color:var(--ink-3); font-weight:400; background:var(--surface-2)}
tr:last-child td{border-bottom:0}
td b{color:var(--core); font-weight:600}
td:last-child{font-variant-numeric:tabular-nums; font-weight:600}

/* lukusuora */
.nl svg{width:100%; height:118px; display:block}
.nl .rail{stroke:var(--line); stroke-width:2}
.nl .tick{stroke:var(--line); stroke-width:1.5}
.nl .stop{fill:var(--ink-3); font-family:"IBM Plex Mono",monospace; font-size:11px}
.nl .stop.near{fill:var(--core); font-weight:600}
.nl .dot{fill:var(--chal)}
.nl .val{fill:var(--ink); font-family:"Familjen Grotesk",sans-serif; font-size:15px; font-weight:700}
.nl .halfway{stroke:var(--chal); stroke-dasharray:3 3; stroke-width:1.5}
.nl-controls{display:flex; align-items:center; gap:14px; margin-top:6px}
.nl-controls input{flex:1; accent-color:var(--core)}
.nl-out{font-family:"Familjen Grotesk",sans-serif; font-size:15px; font-weight:600; min-width:12.5em; text-align:right}

/* paikka-arvotaulu */
.box .ohje{margin:0 0 14px; font-size:14.5px; color:var(--ink-2)}
.nt-valinta{display:flex; flex-wrap:wrap; gap:7px; margin-bottom:16px}
.nt-valinta button{font:inherit; font-size:12.5px; font-family:"IBM Plex Mono",monospace; padding:5px 11px;
  border-radius:6px; border:1px solid var(--line); background:var(--surface-2); color:var(--ink-2); cursor:pointer}
.nt-valinta button[aria-pressed="true"]{background:var(--ink); color:var(--paper); border-color:var(--ink)}
.nt-valinta button:focus-visible{outline:2px solid var(--core); outline-offset:2px}
.nt-taulu{display:flex; flex-direction:column; gap:4px; align-items:flex-start; overflow-x:auto; padding-bottom:4px}
.nt-rivi{display:flex; gap:6px; align-items:center}
.nt-rivi .otsa{font-family:"IBM Plex Mono",monospace; font-size:9.5px; letter-spacing:.08em;
  text-transform:uppercase; color:var(--ink-3); width:52px; text-align:center}
.nt-ruutu{width:52px; height:52px; display:grid; place-items:center; border:1.5px solid var(--line);
  border-radius:7px; background:var(--surface-2); font-family:"IBM Plex Mono",monospace; font-size:24px}
.nt-ruutu.kohta{border-color:var(--core); background:var(--core-soft); color:var(--core); font-weight:500}
.nt-ruutu.ratkaiseva{border-color:var(--chal); background:var(--chal-soft); color:var(--chal); font-weight:500}
.nt-ruutu.nolla{color:var(--ink-3)}
.nt-rivi .nimi{font-size:12.5px; color:var(--ink-3); margin-left:12px; white-space:nowrap}
.nt-nuoli{font-size:17px; color:var(--chal); margin-left:6px}
.nt-selite{margin:14px 0 0; font-size:14.5px}
.nt-selite b{color:var(--core)}

/* vahvuusportaat */
.vp-tasot{display:grid; gap:9px; margin-bottom:18px}
.vp-taso{display:flex; gap:11px; align-items:flex-start; font-size:13.5px}
.vp-taso .vp-pallo{width:13px; height:13px; border-radius:4px; margin-top:5px; flex:0 0 auto}
.vp-taso[data-taso="sulkeet"] .vp-pallo{background:var(--core)}
.vp-taso[data-taso="kertojako"] .vp-pallo{background:var(--strong)}
.vp-taso[data-taso="yhteenvahennys"] .vp-pallo{background:var(--chal)}
.vp-taso strong{display:block; font-family:"Familjen Grotesk",sans-serif; font-weight:600; font-size:14.5px}
.vp-taso span{color:var(--ink-2)}
.vp-lauseke{display:flex; flex-wrap:wrap; gap:7px; align-items:flex-end; font-family:"IBM Plex Mono",monospace;
  font-size:25px; padding:10px 2px; min-height:64px}
.vp-lauseke .t{padding:2px 3px}
.vp-lauseke .op{position:relative; padding:2px 9px; border-radius:6px; font-weight:500}
.vp-lauseke .op[data-taso="sulkeet"]{background:var(--core-soft); color:var(--core)}
.vp-lauseke .op[data-taso="kertojako"]{background:var(--strong-soft); color:var(--strong)}
.vp-lauseke .op[data-taso="yhteenvahennys"]{background:var(--chal-soft); color:var(--chal)}
.vp-lauseke .op i{position:absolute; top:-9px; right:-6px; font-style:normal; font-family:"Familjen Grotesk",sans-serif;
  font-size:11px; font-weight:700; width:18px; height:18px; border-radius:50%; display:grid; place-items:center;
  background:currentColor}
.vp-lauseke .op i span{color:var(--surface)}
.vp-rivi{display:flex; align-items:center; gap:16px; margin-top:8px}
.vp-vastaus{font-family:"Familjen Grotesk",sans-serif; font-size:16px; font-weight:600; color:var(--strong)}

/* laskujärjestys-widget */
.lj-exp{display:flex; flex-wrap:wrap; gap:7px; align-items:center; font-family:"IBM Plex Mono",monospace;
  font-size:23px; padding:14px 4px; min-height:62px}
.lj-exp .tok{padding:2px 4px; color:var(--ink)}
.lj-exp button.op{font-family:"IBM Plex Mono",monospace; font-size:23px; padding:3px 12px; border-radius:7px;
  border:1.5px solid var(--line); background:var(--surface-2); color:var(--ink); line-height:1.2}
.lj-exp button.op:hover{border-color:var(--core); color:var(--core)}
.lj-exp button.op:focus-visible{outline:2px solid var(--core); outline-offset:2px}
.lj-exp .valmis{font-family:"Familjen Grotesk",sans-serif; font-size:23px; font-weight:700; color:var(--strong)}
.lj-fb{font-size:14.5px; min-height:1.5em; color:var(--ink-2)}
.lj-fb.no{color:var(--alert)}
.lj-fb.ok{color:var(--strong)}
.lj-row{display:flex; align-items:center; gap:14px; margin-top:10px}
.lj-step{font-family:"IBM Plex Mono",monospace; font-size:11.5px; letter-spacing:.1em;
  text-transform:uppercase; color:var(--ink-3)}

/* harjoitukset */
.progress{position:sticky; top:0; z-index:5; background:var(--surface); border:1px solid var(--line);
  border-radius:var(--r); padding:12px 18px; box-shadow:var(--shadow); display:flex; align-items:center;
  gap:14px; margin:34px 0 18px}
.progress .lbl{font-family:"IBM Plex Mono",monospace; font-size:11px; letter-spacing:.12em;
  text-transform:uppercase; color:var(--ink-3); white-space:nowrap}
.progress .meter{flex:1; height:7px; border-radius:4px; background:var(--surface-2); border:1px solid var(--line); overflow:hidden}
.progress .meter i{display:block; height:100%; background:var(--core); transition:width .25s ease}
.progress .cnt{font-family:"Familjen Grotesk",sans-serif; font-weight:700; font-variant-numeric:tabular-nums; white-space:nowrap}

.grp{margin-top:26px}
.grp-head{display:flex; align-items:baseline; gap:10px; border-bottom:1.5px solid var(--ink); padding-bottom:7px; margin-bottom:14px}
.grp-head h3{margin:0; font-size:17px; font-weight:600}
.grp-head span{font-size:12.5px; color:var(--ink-2)}

.ex{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:14px 16px; margin-bottom:10px}
.ex[data-tila="oikein"]{border-color:var(--strong); box-shadow:inset 3px 0 0 var(--strong)}
.ex[data-tila="vaarin"]{border-color:var(--alert); box-shadow:inset 3px 0 0 var(--alert)}
.ex .q{display:flex; gap:11px; align-items:baseline; flex-wrap:wrap}
.ex .num{font-family:"IBM Plex Mono",monospace; font-size:11.5px; color:var(--ink-3); min-width:2.4em}
.ex .txt{flex:1; min-width:190px; font-size:15.5px}
.ex .txt .aineisto{display:block; margin-bottom:9px; padding-left:12px;
  border-left:2px solid var(--line); color:var(--ink-2); line-height:1.6;
  /* Aineisto voi olla pieni taulukko, jonka rivit on erotettu rivinvaihdoilla.
     Ilman pre-lineä ne valuisivat yhdeksi kappaleeksi ja taulukko katoaisi. */
  white-space:pre-line}
.ex .txt .kysymysrivi{display:block; font-weight:600}
.ex .row{display:flex; gap:8px; align-items:center; margin-top:11px; flex-wrap:wrap}
.ex input[type=text]{font:inherit; font-family:"IBM Plex Mono",monospace; font-size:15px; width:8.5em;
  padding:7px 11px; border:1px solid var(--line); border-radius:7px; background:var(--surface-2);
  color:var(--ink); text-align:right}
.ex input:focus-visible{outline:2px solid var(--core); outline-offset:1px}
button{font:inherit; cursor:pointer}
.btn{font-size:13.5px; padding:7px 15px; border-radius:7px; border:1px solid var(--core);
  background:var(--core); color:#fff}
.btn.ghost{background:transparent; color:var(--ink-2); border-color:var(--line)}
.btn:focus-visible{outline:2px solid var(--core); outline-offset:2px}
.btn.mv-valinta{text-align:left}
/* kuuntelutehtävä: selaimen puhesynteesi lukee englanninkielisen tekstin */
.kuuntele{display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin:2px 0 10px}
.kuuntele .btn{display:inline-flex; gap:7px; align-items:center}
.kuuntele svg{width:16px; height:16px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round}
.kuuntele .varateksti{flex-basis:100%; font-size:14px; color:var(--ink-2); background:var(--surface-2);
  border-radius:7px; padding:8px 12px; margin:0}
.btn.mv-valinta:disabled{cursor:default; opacity:.65}
.btn.mv-oikein{background:var(--strong-soft); border-color:var(--strong); color:var(--strong); opacity:1}
.btn.mv-vaarin{background:var(--alert-soft); border-color:var(--alert); color:var(--alert); opacity:1}
.row.mv{gap:8px 10px}
.fb{margin-top:11px; font-size:14.5px; padding:10px 13px; border-radius:8px; line-height:1.5}
.fb.ok{background:var(--strong-soft); color:var(--strong)}
.fb.no{background:var(--alert-soft); color:var(--alert)}
.fb.hint{background:var(--chal-soft); color:var(--chal)}

.done{background:var(--strong-soft); border:1px solid var(--strong); color:var(--strong);
  border-radius:var(--r); padding:16px 20px; margin-top:20px; font-size:15.5px}
.done h3{margin:0 0 4px; font-size:17px; color:var(--strong)}

details.teacher{margin-top:34px; background:var(--surface); border:1px solid var(--line);
  border-left:3px solid var(--chal); border-radius:var(--r); padding:15px 20px; box-shadow:var(--shadow)}
details.teacher summary{cursor:pointer; font-family:"Familjen Grotesk",sans-serif; font-weight:600; font-size:15px}
details.teacher summary:focus-visible{outline:2px solid var(--core); outline-offset:3px}
details.teacher ul{margin:12px 0 0; padding-left:19px; color:var(--ink-2); font-size:14.5px}
details.teacher li{margin-bottom:8px}
details.teacher p{margin:12px 0 0; color:var(--ink-2); font-size:14.5px}

.back{display:inline-block; margin-top:30px; font-size:13.5px; color:var(--ink-2)}
.back a{color:var(--core)}

@media (prefers-reduced-motion: reduce){*{transition:none !important}}
@media (max-width:560px){
  .wrap{padding:16px 13px 70px}
  header.top h1{font-size:25px}
  .progress{flex-wrap:wrap}
}
</style>

<div class="wrap">

  <header class="top">
    <span class="badge"><svg viewBox="0 0 24 24" aria-hidden="true" id="ikoni"></svg></span>
    <div>
      <p class="eyebrow" id="eyebrow"></p>
      <h1 id="otsikko"></h1>
      <p id="kuvaus"></p>
      <div class="tags" id="tags"></div>
    </div>
  </header>

  <article id="teksti"></article>

  <div class="progress" aria-live="polite">
    <span class="lbl">Harjoitukset</span>
    <span class="meter"><i id="pbar" style="width:0%"></i></span>
    <span class="cnt" id="pcnt">0 / 20</span>
  </div>

  <div id="harjoitukset"></div>
  <div id="valmis"></div>

  <p class="back" id="back"></p>

</div>

<script>
const D = {"tavoite_id":"MAT8-YHT-05","oppiaine":"MAT","vuosiluokka":8,"otsikko":"Arvoitus yhtälöksi","kuvaus":"Osaan muodostaa monivaiheisesta sanallisesta ongelmasta yhtälön ja ratkaista sen.","versio":"0.2","paivitetty":"2026-10-04","ops":{"T":["T5","T6","T7","T14"],"S":["S1","S3"]},"taso":"ydin","ikoni":"ajattelu","eyebrow":"Matematiikka · 8. luokka · Yhtälöt ja epäyhtälöt","teksti":[{"tyyppi":"johdanto","sisalto":"Kaverisi heittää arvoituksen: \"Äitini on nyt kolme kertaa niin vanha kuin minä. 12 vuoden päästä hän on enää kaksi kertaa niin vanha kuin minä. Kuinka vanha olen?\" Pelkkä päässälasku ei tässä auta, koska tilannetta katsotaan kahdelta suunnalta: nyt ja 12 vuoden päästä. Kun kaverin ikää nyt merkitään x:llä, äiti on 3x-vuotias. 12 vuoden päästä kumpikin on 12 vuotta vanhempi: kaveri x + 12 ja äiti 3x + 12. Arvoituksen toinen lause sanoo, että äidin ikä on silloin kaksi kertaa kaverin ikä, joten 3x + 12 = 2(x + 12). Kun sulkeet poistetaan, saadaan 3x + 12 = 2x + 24, ja siitä x = 12. Kaveri on 12-vuotias ja äiti 36-vuotias. Tässä taidossa opit kääntämään tällaisen monivaiheisen tarinan yhtälöksi, ratkaisemaan sen ja vastaamaan juuri siihen, mitä kysyttiin."},{"tyyppi":"kappale","otsikko":"Kaksi tapaa ilmaista sama määrä","sisalto":"Arvoituksen voisi yrittää ratkaista kokeilemalla. Jos kaveri olisi 10-vuotias, äiti olisi 30-vuotias, ja 12 vuoden päästä he olisivat 22 ja 42 vuotta. Luku 42 ei ole kaksi kertaa 22, joten 10 ei käy. Kokeilu onnistuu vain, kun vastaus sattuu olemaan helppo arvata. Yhtälö toimii myös silloin, kun vastaus on 47 tai 3,5. Yhtälöä tarvitaan erityisesti silloin, kun tuntematon esiintyy tarinassa kahdessa paikassa. Tehtävässä \"Kun luku kerrotaan neljällä ja tulosta vähennetään 8, saadaan sama tulos kuin kun lukuun lisätään 6 ja summa kerrotaan kahdella\" samaa lukua käsitellään kahdella tavalla, ja tulokset ovat yhtä suuret. Siitä saadaan yhtälö 4x - 8 = 2(x + 6). Sulkeet tarvitaan, koska kahdella kerrotaan koko summa x + 6 eikä pelkkää x:ää. Ratkaisu: 4x - 8 = 2x + 12, 2x = 20 ja x = 10. Tarkistus tekstistä: 4 · 10 - 8 = 32 ja 2 · (10 + 6) = 32. Yhtälön ydin on aina sama: tarinasta löytyy kaksi tapaa ilmaista sama määrä, ja yhtäsuuruusmerkki tulee niiden väliin."},{"tyyppi":"saanto","otsikko":"Näin teet sanallisesta ongelmasta yhtälön","askeleet":["Lue tehtävä loppuun ja kirjoita ylös, mitä kysytään.","Valitse yksi tuntematon muuttujaksi ja kirjoita sen merkitys sanoin yksikköineen, esimerkiksi x = kaverin ikä nyt vuosina. Muuttuja tarkoittaa lukua, ei ihmistä tai esinettä: x = kaveri on väärin. Pelkkä x = ikä ei myöskään riitä, kun tarinassa on monta ikää, koska siitä ei näe, kenen ikä on kyse. Valitse yleensä se suure, johon muita verrataan. Silloin muut suureet saa kirjoitettua ilman murtolukuja.","Ilmaise muut suureet x:n avulla: kolme kertaa niin vanha on 3x ja 12 vuoden päästä x + 12. Kun koko lauseke kerrotaan, kirjoita sulkeet: kaksi kertaa ikä 12 vuoden päästä on 2(x + 12).","Etsi tarinasta kaksi tapaa ilmaista sama määrä ja kirjoita ne yhtäsuuruusmerkin eri puolille.","Ratkaise yhtälö: poista sulkeet, kokoa x-termit yhdelle puolelle ja vakiotermit toiselle ja jaa x:n kertoimella.","Laske kysytty suure. Jos kysytään muuta kuin x:ää, sijoita x:n arvo kysytyn suureen lausekkeeseen.","Tarkista vastaus alkuperäisestä tekstistä, älä omasta yhtälöstäsi: toteutuvatko tarinan kaikki ehdot?","Kirjoita vastaus, jossa on kysytty suure ja yksikkö."]},{"tyyppi":"taulukko","otsikko":"Esimerkki: äidin ja kaverin arvoitus","otsikkorivi":["Vaihe","Merkintä","Miksi"],"rivit":[["Mitä kysytään","kaverin ikä nyt","Kysymys on arvoituksen lopussa."],["Muuttuja","x = kaverin ikä nyt vuosina","Äidin ikää verrataan kaverin ikään."],["Iät nyt","kaveri x, äiti 3x","Kolme kertaa niin vanha on 3 · x."],["Iät 12 vuoden päästä","kaveri x + 12, äiti 3x + 12","Aika kuluu molemmille yhtä paljon."],["Yhtälö","3x + 12 = 2(x + 12)","Äidin silloinen ikä on kaksi kertaa kaverin silloinen ikä."],["Ratkaisu","3x + 12 = 2x + 24, x = 12","Sulkeet pois, x-termit vasemmalle ja vakiot oikealle."],["Tarkistus tekstistä","nyt 12 ja 36, 12 vuoden päästä 24 ja 48","36 = 3 · 12 ja 48 = 2 · 24, joten kumpikin ehto toteutuu."],["Vastaus","Kaveri on 12-vuotias.","Kysytty suure ja yksikkö."]]},{"tyyppi":"ansa","otsikko":"Ansa 1: aika kuluu vain toiselle","sisalto":"Arvoituksesta on helppo kirjoittaa 3x + 12 = 2x. Vasemmalla äiti on vanhentunut 12 vuotta, mutta oikealla kaveri on yhä x-vuotias. Yhtälöstä tulisi x = -12, eikä ikä voi olla negatiivinen. Toinen tavallinen virhe on 3x + 12 = 2x + 12. Siinä kaverin 12 vuotta on lisätty mutta ei kerrottu kahdella, vaikka äidin ikä on kaksi kertaa koko silloinen ikä x + 12. Silloin x = 0. Kun aika kuluu, se kuluu kaikille tarinan henkilöille yhtä paljon. Kirjoita siksi kummankin ikä uudella ajankohdalla omalle rivilleen ennen yhtälöä ja käytä sulkeita, kun ikää kerrotaan. Sama pätee menneeseen aikaan. Jos äiti on nyt neljä kertaa niin vanha kuin tytär ja neljä vuotta sitten hän oli seitsemän kertaa niin vanha, tyttären ikä nyt on x ja äidin 4x, neljä vuotta sitten x - 4 ja 4x - 4. Yhtälö on 4x - 4 = 7(x - 4), josta 4x - 4 = 7x - 28, 24 = 3x ja x = 8. Tytär on 8-vuotias ja äiti 32-vuotias. Tarkistus: neljä vuotta sitten he olivat 4 ja 28 vuotta, ja 28 = 7 · 4."},{"tyyppi":"kappale","otsikko":"Peräkkäiset luvut ja suorakulmion piiri","sisalto":"Peräkkäiset kokonaisluvut, kuten 17, 18 ja 19, eroavat toisistaan yhdellä. Kun pienin on x, seuraavat ovat x + 1 ja x + 2. Peräkkäiset parilliset luvut, kuten 34, 36 ja 38, eroavat toisistaan kahdella, koska joka toinen kokonaisluku on parillinen. Kun pienin on x, seuraavat ovat x + 2 ja x + 4. Sama merkintä käy peräkkäisille parittomille luvuille, kuten 15, 17 ja 19, koska nekin eroavat toisistaan kahdella. Se, onko x parillinen vai pariton, näkyy vasta ratkaisusta. Kun kolmen peräkkäisen parillisen luvun summa on 108, yhtälö on x + (x + 2) + (x + 4) = 108 eli 3x + 6 = 108, josta 3x = 102 ja x = 34. Luvut ovat 34, 36 ja 38. Suorakulmion piiri on kaikkien neljän sivun pituuksien summa. Suorakulmiossa on kaksi yhtä pitkää sivua kumpaakin pituutta, joten piiri on 2 · pituus + 2 · leveys. Jos pituus on 5 cm suurempi kuin leveys ja piiri on 46 cm, merkitään x = leveys senttimetreinä. Pituus on x + 5, ja yhtälö on 2x + 2(x + 5) = 46. Sulkeet tarvitaan, koska kahdella kerrotaan koko pituus. Ratkaisu: 2x + 2x + 10 = 46, 4x = 36 ja x = 9. Leveys on 9 cm ja pituus 14 cm. Tarkistus: 2 · 9 + 2 · 14 = 18 + 28 = 46."},{"tyyppi":"ansa","otsikko":"Ansa 2: parilliset yhden välein ja piirin puolikas","sisalto":"Kolmen peräkkäisen parillisen luvun summasta 108 on houkuttelevaa kirjoittaa x + (x + 1) + (x + 2) = 108. Silloin 3x + 3 = 108 ja x = 35, ja luvut olisivat 35, 36 ja 37. Tarkistus tekstistä paljastaa virheen: 35 ja 37 ovat parittomia. Parilliset luvut ovat kahden välein, joten lausekkeisiin tulee + 2 ja + 4. Piirissä tavallinen virhe on laskea vain kaksi sivua: x + (x + 5) = 46. Siitä x = 20,5, jolloin leveys olisi 20,5 cm ja pituus 25,5 cm. Tällaisen suorakulmion piiri on 2 · 20,5 + 2 · 25,5 = 92 cm eli kaksi kertaa liian paljon. Pituus + leveys on vain puolet piiristä. Piirrä suorakulmio vihkoon ja kirjoita jokaisen sivun viereen sen pituus. Silloin näet, että x esiintyy piirissä kahdesti ja x + 5 kahdesti."},{"tyyppi":"kappale","otsikko":"Hinnat, erotukset ja jakaminen","sisalto":"Kun kahdesta hinnasta tiedetään erotus, muuttujaksi kannattaa yleensä valita halvempi. Elokuvalippu maksaa 7 € enemmän kuin popcorn, ja kolme lippua ja kaksi popcornia maksavat yhteensä 51 €. Kun x = popcornin hinta euroina, lipun hinta on x + 7. Kolme lippua maksaa 3(x + 7), koska jokaisen lipun hinnassa on popcornin hinta ja 7 euroa lisää. Yhtälö on 3(x + 7) + 2x = 51, josta 3x + 21 + 2x = 51, 5x = 30 ja x = 6. Popcorn maksaa 6 € ja lippu 13 €. Tarkistus: 3 · 13 + 2 · 6 = 39 + 12 = 51. Kun jaetaan niin, että toinen saa enemmän, ero näkyy lausekkeessa samalla tavalla. Kun 90 € jaetaan kahden kesken niin, että toinen saa 14 € enemmän, osuudet ovat x ja x + 14, ja yhtälöstä x + x + 14 = 90 saadaan x = 38. Osuudet ovat 38 € ja 52 €. Kun rahaa siirtyy, toisen määrä pienenee ja toisen kasvaa saman verran. Sallalla on kaksi kertaa niin paljon rahaa kuin Tuukalla. Kun Salla antaa Tuukalle 12 €, heillä on yhtä paljon. Kun x = Tuukan rahat alussa euroina, Sallalla on siirron jälkeen 2x - 12 ja Tuukalla x + 12. Yhtälöstä 2x - 12 = x + 12 saadaan x = 24. Sallalla oli alussa 48 € ja Tuukalla 24 €, ja siirron jälkeen kummallakin on 36 €."},{"tyyppi":"ansa","otsikko":"Ansa 3: erotus väärin päin ja vastaus x:llä","sisalto":"Lause \"lippu maksaa 7 € enemmän kuin popcorn\" houkuttelee kirjoittamaan x = lipun hinta ja popcornin hinnaksi x + 7, koska 7 ja popcorn ovat lauseessa vierekkäin. Silloin popcorn olisi kalliimpi, vaikka tarina sanoo päinvastoin. Kokeile luvulla: jos lippu maksaa 10 €, popcorn maksaa 10 - 7 = 3 €, ei 17 €. Kun x on lipun hinta, popcornin hinta on x - 7. Väärästä yhtälöstä 3x + 2(x + 7) = 51 saadaan 5x = 37 ja x = 7,4. Tarkistus omaan yhtälöön menee läpi, koska 3 · 7,4 + 2 · 14,4 = 22,2 + 28,8 = 51. Tekstistä tarkistus paljastaa virheen: popcorn maksaisi 14,40 € ja lippu 7,40 €, joten lippu olisi halvempi. Siksi vastaus tarkistetaan alkuperäisestä tekstistä eikä omasta yhtälöstä, sillä yhtälön ratkaisu toteuttaa aina sen yhtälön, josta se on ratkaistu. Toinen ansa on lopettaa yhtälön ratkaisuun. Jos kysytään lipun hintaa ja x on popcornin hinta, ratkaisu x = 6 ei ole vastaus. Lue kysymys uudelleen ratkaisun jälkeen ja laske kysytty suure: lippu maksaa x + 7 = 13 €."},{"tyyppi":"muistilappu","otsikko":"Muista nämä","kohdat":["Kirjoita ensin, mitä kysytään, ja sitten x:n merkitys sanoin yksikköineen: x = Tuukan rahat alussa euroina.","Aika kuluu kaikille: 12 vuoden päästä x + 12 ja 3x + 12, ja kaksi kertaa silloinen ikä on 2(x + 12).","Peräkkäiset kokonaisluvut x, x + 1, x + 2. Peräkkäiset parilliset tai parittomat luvut x, x + 2, x + 4.","Suorakulmion piiri on 2 · pituus + 2 · leveys, esimerkiksi 2x + 2(x + 5).","7 € enemmän kuin popcorn: kun x on popcornin hinta, lippu maksaa x + 7. Kokeile luvulla, jos epäilet.","Yhtälön ratkaisu on x:n arvo. Laske siitä kysytty suure ja tarkista se alkuperäisestä tekstistä."]}],"harjoitusryhmat":[{"id":"lausekkeet","nimi":"Muuttuja ja lausekkeet","info":"Laske ilman laskinta. Päätä, mitä x tarkoittaa, ja ilmaise muut suureet sen avulla."},{"id":"luvut","nimi":"Luvut, piirit ja rahat","info":"Laske ilman laskinta. Kirjoita yhtälö vihkoon ja vastaa siihen, mitä kysytään. Se ei aina ole x."},{"id":"ika","nimi":"Ikäongelmat ja tarkistus","info":"Laske ilman laskinta. Aika kuluu kaikille. Tarkista vastaus alkuperäisestä tekstistä."}],"harjoitukset":[{"id":"H01","ryhma":"lausekkeet","kysymys":"Suorakulmion pituus on 6 cm suurempi kuin sen leveys, ja piiri on 52 cm. Merkitse leveyttä senttimetreinä x:llä. Mikä on x:n kerroin, kun kirjoitat piirin yhtälöksi 2x + 2(x + 6) = 52 ja sievennät vasemman puolen?","vastaus":4,"vinkki":"Poista sulkeet: 2(x + 6) = 2x + 12. Montako x:ää vasemmalla puolella on yhteensä?","selitys":"2x + 2x + 12 = 4x + 12, joten kerroin on 4. Suorakulmiossa on kaksi leveyttä ja kaksi pituutta, ja jokaisessa niistä on yksi x. Yhtälöstä 4x + 12 = 52 saadaan x = 10, joten leveys on 10 cm ja pituus 16 cm."},{"id":"H02","ryhma":"lausekkeet","kysymys":"Ville on nyt x-vuotias, ja hänen isänsä on neljä kertaa niin vanha. Kuuden vuoden kuluttua isä on kolme kertaa niin vanha kuin Ville. Isän ikä kuuden vuoden kuluttua on 4x + 6. Kirjoita ilman sulkeita lauseke, joka on kolme kertaa Villen ikä kuuden vuoden kuluttua. Mikä on lausekkeen vakiotermi?","vastaus":18,"vinkki":"Villen ikä kuuden vuoden kuluttua on x + 6. Kerro koko summa kolmella.","selitys":"3(x + 6) = 3x + 18, joten vakiotermi on 18. Yhtälö on 4x + 6 = 3x + 18, josta x = 12: Ville on 12-vuotias ja isä 48-vuotias. Kuuden vuoden kuluttua he ovat 18 ja 54 vuotta, ja 54 = 3 · 18."},{"id":"H03","ryhma":"lausekkeet","kysymys":"Merkitse kolmesta peräkkäisestä parillisesta luvusta pienintä x:llä. Suurin luku on silloin x + k. Mikä on k?","vastaus":4,"vinkki":"Kokeile esimerkillä: 20, 22 ja 24.","selitys":"Parilliset luvut ovat kahden välein: x, x + 2 ja x + 4. Siksi k = 4. Vastaus 2 sopisi peräkkäisille kokonaisluvuille x, x + 1 ja x + 2."},{"id":"H04","ryhma":"lausekkeet","kysymys":"Lippu maksaa 5 € enemmän kuin ohjelmalehti. Merkitse lipun hintaa euroina x:llä. Ohjelmalehden hinta on silloin x + k, jossa k voi olla negatiivinen. Mikä on k?","vastaus":-5,"vinkki":"Kumpi on halvempi? Kokeile: jos lippu maksaa 12 €, paljonko ohjelmalehti maksaa?","selitys":"Ohjelmalehti on 5 € halvempi kuin lippu, joten sen hinta on x - 5 eli x + (-5). Jos lippu maksaa 12 €, ohjelmalehti maksaa 7 €. Vastaus 5 tekisi ohjelmalehdestä lippua kalliimman."},{"id":"H05","ryhma":"lausekkeet","kysymys":"Äiti on 26 vuotta vanhempi kuin Oona. Neljän vuoden kuluttua äiti on kolme kertaa niin vanha kuin Oona. Eetu kirjoitti tilanteesta yhtälön x + 30 = 3(x + 4). Mitä x tarkoittaa Eetun yhtälössä?","vastaus":0,"vinkki":"Oikealla puolella on 3(x + 4). Kenen ikä on x + 4?","selitys":"Kun x on Oonan ikä nyt, Oona on neljän vuoden kuluttua x + 4 ja äiti x + 26 + 4 = x + 30. Äidin ikä on silloin kolme kertaa Oonan ikä: x + 30 = 3(x + 4). Ratkaisu on x = 9, joten Oona on 9-vuotias ja äiti 35-vuotias.","tyyppi":"monivalinta","vaihtoehdot":["Oonan ikää nyt vuosina","äidin ikää nyt vuosina","Oonan ikää neljän vuoden kuluttua vuosina","äidin ikää neljän vuoden kuluttua vuosina"]},{"id":"H06","ryhma":"lausekkeet","kysymys":"Kun luvusta vähennetään 3 ja erotus kerrotaan viidellä, saadaan sama tulos kuin kun lukuun lisätään 9 ja summa kerrotaan kahdella. Mikä luku on?","vastaus":11,"vinkki":"Kirjoita kumpikin laskutoimitus lausekkeena: 5(x - 3) ja 2(x + 9). Ne ovat yhtä suuret.","selitys":"5(x - 3) = 2(x + 9), joten 5x - 15 = 2x + 18, 3x = 33 ja x = 11. Tarkistus: 5 · 8 = 40 ja 2 · 20 = 40."},{"id":"H07","ryhma":"luvut","kysymys":"Merkitse pienintä lukua x:llä. Kolme peräkkäistä kokonaislukua ovat x, x + 1 ja x + 2. Niiden summa on 114. Mikä on suurin luvuista?","vastaus":39,"vinkki":"Ratkaise ensin x yhtälöstä x + (x + 1) + (x + 2) = 114. Kysytään suurinta lukua.","selitys":"3x + 3 = 114, 3x = 111 ja x = 37. Suurin luku on x + 2 = 39. Tarkistus: 37 + 38 + 39 = 114. Vastaus 37 on pienin luku."},{"id":"H08","ryhma":"luvut","kysymys":"Kolmen peräkkäisen parillisen luvun summa on 138. Mikä on suurin luvuista?","vastaus":48,"vinkki":"Parilliset luvut ovat x, x + 2 ja x + 4.","selitys":"3x + 6 = 138, 3x = 132 ja x = 44. Luvut ovat 44, 46 ja 48, ja suurin on 48. Merkinnällä x, x + 1 ja x + 2 saisit luvut 45, 46 ja 47, joista kaksi on parittomia."},{"id":"H09","ryhma":"luvut","kysymys":"Kahdesta peräkkäisestä parillisesta luvusta suuremman kolminkertainen on 40 suurempi kuin pienemmän kaksinkertainen. Mikä on pienempi luku?","vastaus":34,"vinkki":"Kun pienempi on x, suurempi on x + 2. Suuremman kolminkertainen on 3(x + 2).","selitys":"3(x + 2) = 2x + 40, joten 3x + 6 = 2x + 40 ja x = 34. Luvut ovat 34 ja 36. Tarkistus: 3 · 36 = 108 ja 2 · 34 + 40 = 108."},{"id":"H10","ryhma":"luvut","kysymys":"Suorakulmion pituus on 7 cm suurempi kuin sen leveys. Suorakulmion piiri on 62 cm. Kuinka pitkä suorakulmio on? Anna vastaus senttimetreinä ilman yksikköä.","vastaus":19,"vinkki":"x = leveys senttimetreinä. Piirissä on kaksi leveyttä ja kaksi pituutta.","selitys":"2x + 2(x + 7) = 62, joten 4x + 14 = 62, 4x = 48 ja x = 12. Leveys on 12 cm ja pituus 19 cm. Tarkistus: 2 · 12 + 2 · 19 = 62. Vastaus 12 on leveys."},{"id":"H11","ryhma":"luvut","kysymys":"Suorakulmion pituus on 4 cm lyhyempi kuin kaksi kertaa sen leveys. Suorakulmion piiri on 64 cm. Kuinka pitkä suorakulmio on? Anna vastaus senttimetreinä ilman yksikköä.","vastaus":20,"vinkki":"Kun leveys on x, pituus on 2x - 4. Piiri on 2x + 2(2x - 4).","selitys":"2x + 4x - 8 = 64, 6x = 72 ja x = 12. Pituus on 2 · 12 - 4 = 20 cm. Tarkistus: 2 · 12 + 2 · 20 = 64."},{"id":"H12","ryhma":"luvut","kysymys":"Pizza maksaa 9 € enemmän kuin juoma. Neljä pizzaa ja kolme juomaa maksavat yhteensä 53,50 €. Paljonko yksi pizza maksaa? Anna vastaus euroina ilman yksikköä.","vastaus":11.5,"vinkki":"x = juoman hinta euroina. Neljä pizzaa maksaa 4(x + 9).","selitys":"4(x + 9) + 3x = 53,5, joten 7x + 36 = 53,5, 7x = 17,5 ja x = 2,5. Juoma maksaa 2,50 € ja pizza 11,50 €. Tarkistus: 4 · 11,5 + 3 · 2,5 = 46 + 7,5 = 53,5."},{"id":"H13","ryhma":"luvut","kysymys":"Kolme kaverusta jakaa 120 euron palkinnon. Toinen saa 8 € enemmän kuin ensimmäinen, ja kolmas saa kaksi kertaa niin paljon kuin toinen. Paljonko kolmas saa? Anna vastaus euroina ilman yksikköä.","vastaus":64,"vinkki":"x = ensimmäisen osuus euroina. Toinen saa x + 8 ja kolmas 2(x + 8).","selitys":"x + (x + 8) + 2(x + 8) = 120, joten 4x + 24 = 120, 4x = 96 ja x = 24. Osuudet ovat 24 €, 32 € ja 64 €, yhteensä 120 €."},{"id":"H14","ryhma":"ika","kysymys":"Isä on nyt neljä kertaa niin vanha kuin Leo, ja 18 vuoden kuluttua isä on kaksi kertaa niin vanha kuin Leo. Kuinka vanha isä on nyt? Anna vastaus vuosina ilman yksikköä.","vastaus":36,"vinkki":"x = Leon ikä nyt. 18 vuoden kuluttua Leo on x + 18 ja isä 4x + 18.","selitys":"4x + 18 = 2(x + 18), joten 4x + 18 = 2x + 36, 2x = 18 ja x = 9. Leo on 9-vuotias ja isä 36-vuotias. Tarkistus: 18 vuoden kuluttua he ovat 27 ja 54 vuotta, ja 54 = 2 · 27."},{"id":"H15","ryhma":"ika","kysymys":"Viisi vuotta sitten Emma oli kolme kertaa niin vanha kuin hänen pikkuveljensä. Nyt Emma on 8 vuotta vanhempi kuin veli. Kuinka vanha Emma on nyt? Anna vastaus vuosina ilman yksikköä.","vastaus":17,"vinkki":"x = veljen ikä nyt. Emma on nyt x + 8. Viisi vuotta sitten kumpikin oli 5 vuotta nuorempi.","selitys":"Viisi vuotta sitten veli oli x - 5 ja Emma x + 3. Yhtälöstä x + 3 = 3(x - 5) saadaan x + 3 = 3x - 15, 18 = 2x ja x = 9. Emma on 17-vuotias. Tarkistus: viisi vuotta sitten he olivat 4 ja 12 vuotta, ja 12 = 3 · 4."},{"id":"H16","ryhma":"ika","kysymys":"Isoäiti on 52 vuotta vanhempi kuin Onni, ja 8 vuoden kuluttua heidän yhteisikänsä on 90 vuotta. Kuinka vanha isoäiti on nyt? Anna vastaus vuosina ilman yksikköä.","vastaus":63,"vinkki":"Kahdeksan vuotta lisätään kummallekin, joten yhteisikä kasvaa 16 vuotta.","selitys":"(x + 8) + (x + 52 + 8) = 90, joten 2x + 68 = 90 ja x = 11. Onni on 11-vuotias ja isoäiti 63-vuotias. Tarkistus: 8 vuoden kuluttua 19 + 71 = 90."},{"id":"H17","ryhma":"ika","kysymys":"Liisa on nyt x-vuotias ja hänen äitinsä 5x-vuotias. Kahdeksan vuoden kuluttua äiti on kolme kertaa niin vanha kuin Liisa. Mikä yhtälö kuvaa tilannetta?","vastaus":2,"vinkki":"Kirjoita ensin kummankin ikä kahdeksan vuoden kuluttua.","selitys":"Kahdeksan vuoden kuluttua Liisa on x + 8 ja äiti 5x + 8. Äidin ikä on silloin kolme kertaa Liisan ikä: 5x + 8 = 3(x + 8). Siitä 2x = 16 ja x = 8, joten Liisa on 8-vuotias ja äiti 40-vuotias.","tyyppi":"monivalinta","vaihtoehdot":["5x + 8 = 3x","5x = 3(x + 8)","5x + 8 = 3(x + 8)","5x + 8 = 3x + 8"]},{"id":"H18","ryhma":"ika","kysymys":"Tehtävä kuului: \"Lippu maksaa 6 € enemmän kuin ohjelma. Kaksi lippua ja kolme ohjelmaa maksavat yhteensä 37 €. Paljonko yksi lippu maksaa?\"\nJoona merkitsi x = lipun hinta euroina ja ohjelman hinnaksi x + 6. Hän sai yhtälöstä 2x + 3(x + 6) = 37 ratkaisun x = 3,8 ja tarkisti, että 2 · 3,8 + 3 · 9,8 = 37.\n\nMikä Joonan ratkaisussa on vialla?","vastaus":1,"vinkki":"Tarkista Joonan hinnat tehtävän tekstistä: kumpi on kalliimpi, lippu vai ohjelma?","selitys":"Lippu on kalliimpi, joten kun x on lipun hinta, ohjelma maksaa x - 6. Joonan hinnoilla ohjelma maksaisi 9,80 € ja lippu 3,80 €, mikä on ristiriidassa tekstin kanssa. Tarkistus omaan yhtälöön täsmää aina, koska x on ratkaistu juuri siitä yhtälöstä.","tyyppi":"monivalinta","vaihtoehdot":["Sulkeet on poistettu väärin.","Ohjelman hinta on merkitty väärin päin: kun lippu maksaa x euroa, ohjelma maksaa x - 6 euroa.","Yhtälö on ratkaistu väärin.","Ratkaisussa ei ole virhettä, koska tarkistus täsmää."]},{"id":"H19","ryhma":"ika","kysymys":"Lippu maksaa 6 € enemmän kuin ohjelma. Kaksi lippua ja kolme ohjelmaa maksavat yhteensä 37 €. Paljonko yksi lippu maksaa? Anna vastaus euroina ilman yksikköä.","vastaus":11,"vinkki":"Valitse x = ohjelman hinta euroina. Lippu maksaa x + 6.","selitys":"2(x + 6) + 3x = 37, joten 5x + 12 = 37 ja x = 5. Ohjelma maksaa 5 € ja lippu 11 €. Tarkistus tekstistä: 11 - 5 = 6 ja 2 · 11 + 3 · 5 = 37."},{"id":"H20","ryhma":"ika","kysymys":"Eliaksella on kaksi kertaa niin paljon pelirahaa kuin Mikaelilla. Kun Elias antaa Mikaelille 30 pelirahaa, Mikaelilla on 10 pelirahaa enemmän kuin Eliaksella. Montako pelirahaa Eliaksella oli alussa?","vastaus":100,"vinkki":"x = Mikaelin pelirahat alussa. Siirron jälkeen Eliaksella on 2x - 30 ja Mikaelilla x + 30.","selitys":"Mikaelilla on 10 enemmän: x + 30 = 2x - 30 + 10, joten x + 30 = 2x - 20 ja x = 50. Eliaksella oli alussa 100 pelirahaa. Tarkistus: siirron jälkeen Eliaksella on 70 ja Mikaelilla 80."}],"valmis_teksti":"Osaat muodostaa monivaiheisesta sanallisesta ongelmasta yhtälön: kerrot, mitä x tarkoittaa, ilmaiset muut suureet sen avulla, ratkaiset yhtälön ja vastaat siihen, mitä kysyttiin. Muistat, että aika kuluu kaikille, ja tarkistat vastauksen alkuperäisestä tekstistä. Tämä taito on nyt näytetty."};

/* ---------- teksti ---------- */
const esc = s => s;
const osat = D.teksti.map(o=>{
  switch(o.tyyppi){
    case "johdanto":
      return `<p class="lead">${esc(o.sisalto)}</p>`;
    case "kappale":
      return `<h2>${esc(o.otsikko)}</h2><p>${esc(o.sisalto)}</p>`;
    case "saanto":
      return `<div class="box"><h3>${esc(o.otsikko)}</h3><ol class="steps">${
        o.askeleet.map(a=>`<li><span>${esc(a)}</span></li>`).join("")}</ol></div>`;
    case "taulukko":
      return `<div class="box"><h3>${esc(o.otsikko)}</h3><div class="tablewrap"><table><thead><tr>${
        o.otsikkorivi.map(h=>`<th>${h}</th>`).join("")}</tr></thead><tbody>${
        o.rivit.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join("")}</tr>`).join("")}</tbody></table></div></div>`;
    case "ansa":
      return `<div class="box warn"><h3>${esc(o.otsikko)}</h3><p style="margin:0">${esc(o.sisalto)}</p></div>`;
    case "muistilappu":
      return `<div class="box note"><h3>${esc(o.otsikko)}</h3><ul class="notes">${
        o.kohdat.map(k=>`<li>${esc(k)}</li>`).join("")}</ul></div>`;
    case "numerotaulu":
      return `<div class="box nt"><h3>${esc(o.otsikko)}</h3><p class="ohje">${esc(o.sisalto)}</p>
        <div class="nt-valinta" id="ntValinta"></div>
        <div class="nt-taulu" id="ntTaulu"></div>
        <p class="nt-selite" id="ntSelite"></p></div>`;
    case "vahvuusportaat":
      return `<div class="box vp"><h3>${esc(o.otsikko)}</h3><p class="ohje">${esc(o.sisalto)}</p>
        <div class="vp-tasot">${o.tasot.map(t=>
          `<div class="vp-taso" data-taso="${t.id}"><span class="vp-pallo"></span>
           <div><strong>${t.nimi}</strong><span>${t.selite}</span></div></div>`).join("")}</div>
        <div class="vp-lauseke" id="vpLauseke"></div>
        <div class="vp-rivi"><button type="button" class="btn ghost" id="vpSeuraava">Toinen lauseke</button>
        <span class="vp-vastaus" id="vpVastaus"></span></div></div>`;
    case "laskujarjestys":
      return `<div class="box lj"><h3>${esc(o.otsikko)}</h3><p style="margin:0 0 12px;font-size:14.5px;color:var(--ink-2)">${esc(o.sisalto)}</p>
        <div class="lj-exp" id="ljExp"></div>
        <div class="lj-fb" id="ljFb"></div>
        <div class="lj-row"><button type="button" class="btn ghost" id="ljSeuraava">Toinen lauseke</button>
        <span class="lj-step" id="ljStep"></span></div></div>`;
    case "lukusuora":
      return `<div class="box nl"><h3>${esc(o.otsikko)}</h3><p style="margin:0 0 8px;font-size:14.5px;color:var(--ink-2)">${esc(o.sisalto)}</p>
        <svg id="nlsvg" viewBox="0 0 640 118" role="img" aria-labelledby="nldesc"><desc id="nldesc">Lukusuora, jolla näkyy valittu luku ja lähin kymmenluku.</desc></svg>
        <div class="nl-controls">
          <label for="nlrange" style="font-size:13px;color:var(--ink-2)">Luku</label>
          <input type="range" id="nlrange" min="0" max="100" value="47" aria-describedby="nlout">
          <span class="nl-out" id="nlout"></span>
        </div></div>`;
    default: return "";
  }

/* ---------- lukusuora ---------- */
const svg=document.getElementById("nlsvg"), rng=document.getElementById("nlrange"), out=document.getElementById("nlout");
const X0=34, X1=606, Y=62;
function piirraNL(v){
  const ala=Math.floor(v/10)*10, yla=ala+10, puoli=ala+5;
  const pyor = (v%10)>=5 ? yla : ala;
  const x = n => X0 + (n/100)*(X1-X0);
  let s=`<line class="rail" x1="${X0}" y1="${Y}" x2="${X1}" y2="${Y}"/>`;
  for(let n=0;n<=100;n+=10){
    const near = (n===ala||n===yla);
    s+=`<line class="tick" x1="${x(n)}" y1="${Y-7}" x2="${x(n)}" y2="${Y+7}"/>`;
    s+=`<text class="stop${near?" near":""}" x="${x(n)}" y="${Y+24}" text-anchor="middle">${n}</text>`;
  }
  s+=`<line class="halfway" x1="${x(puoli)}" y1="${Y-16}" x2="${x(puoli)}" y2="${Y+12}"/>`;
  s+=`<text class="stop" x="${x(puoli)}" y="${Y-22}" text-anchor="middle">puoliväli ${puoli}</text>`;
  s+=`<circle class="dot" cx="${x(v)}" cy="${Y}" r="6"/>`;
  s+=`<text class="val" x="${x(v)}" y="${Y-32}" text-anchor="middle">${v}</text>`;
  s+=`<path d="M ${x(v)} ${Y+38} L ${x(pyor)} ${Y+38}" stroke="var(--core)" stroke-width="2" fill="none"/>`;
  s+=`<path d="M ${x(pyor)} ${Y+38} l ${x(pyor)>x(v)?-7:7} -4 l 0 8 z" fill="var(--core)"/>`;
  svg.innerHTML=s;
  out.textContent = `${v} pyöristyy → ${pyor}`;
}
if(svg){ piirraNL(+rng.value); rng.addEventListener("input",e=>piirraNL(+e.target.value)); }

/* ---------- laskujärjestys-widget ---------- */
const ljExp=document.getElementById("ljExp");
if(ljExp && D.kokeilu){
  let ljI=0, ljTokens=[], ljStep=0;
  const laske=(a,op,b)=>{a=+a;b=+b;return op==="×"?a*b:op==="÷"?a/b:op==="+"?a+b:a-b;};
  function ljAlku(){
    const l=D.kokeilu[ljI];
    ljTokens=l.lauseke.replace(/\(/g,"( ").replace(/\)/g," )").split(/\s+/).filter(Boolean);
    ljStep=0; ljPiirra(); ljViesti("","");
  }
  function ljViesti(t,lk){const f=document.getElementById("ljFb"); f.textContent=t; f.className="lj-fb "+(lk||"");}
  function ljPiirra(){
    const l=D.kokeilu[ljI];
    document.getElementById("ljStep").textContent =
      ljStep>=l.askeleet.length ? "valmis" : `askel ${ljStep+1} / ${l.askeleet.length}`;
    if(ljStep>=l.askeleet.length){
      ljExp.innerHTML=`<span class="valmis">${l.lauseke} = ${l.vastaus}</span>`;
      return;
    }
    ljExp.innerHTML=ljTokens.map((t,i)=>
      "×÷+−".includes(t) ? `<button type="button" class="op" data-i="${i}">${t}</button>`
                         : `<span class="tok">${t}</span>`).join("");
    ljExp.querySelectorAll("button.op").forEach(b=>b.addEventListener("click",()=>ljKlikkaa(+b.dataset.i)));
  }
  function ljKlikkaa(i){
    const l=D.kokeilu[ljI], odotettu=l.askeleet[ljStep];
    const ehdotus=[ljTokens[i-1],ljTokens[i],ljTokens[i+1]].join(" ");
    if(ehdotus!==odotettu){
      ljViesti(ljStep===0
        ? "Ei vielä. Sulkeet ovat vahvimmat, sitten kerto ja jako. Yhtä vahvat vasemmalta oikealle."
        : "Ei vielä. Kumpi jäljellä olevista on vahvempi?", "no");
      return;
    }
    const arvo=laske(ljTokens[i-1],ljTokens[i],ljTokens[i+1]);
    let alku=i-1, loppu=i+1;
    if(ljTokens[i-2]==="(" && ljTokens[i+2]===")"){ alku=i-2; loppu=i+2; }
    ljTokens.splice(alku, loppu-alku+1, String(arvo));
    ljStep++;
    ljViesti(ljStep>=l.askeleet.length ? "Valmis. Vastaus on "+l.vastaus+"." : "Oikein. Jatka seuraavaan.", "ok");
    ljPiirra();
  }
  document.getElementById("ljSeuraava").addEventListener("click",()=>{
    ljI=(ljI+1)%D.kokeilu.length; ljAlku();
  });
  ljAlku();
}

  const osat = String(t).split(/\n\s*\n/).map(x=>x.trim()).filter(Boolean);

  const kysymys = osat.pop();
  return osat.map(p=>`<span class="aineisto">${p}</span>`).join("")
       + `<span class="kysymysrivi">${kysymys}</span>`;
};

/* Suomalainen lukumuoto: välilyönti on tuhaterotin, pilkku desimaalierotin.
   Piste voi olla kumpi tahansa. Se tulkitaan tuhaterottimeksi VAIN silloin, kun
   koko luku on aitoa tuhaterotinmuotoa: alkuosa 1–3 numeroa ilman etunollaa ja
   jokainen jatko-osa täsmälleen 3 numeroa (1.500, 12.345.678). Kaikissa muissa
   tapauksissa piste on desimaalipiste — myös 0.125, joka vanhalla säännöllä
   ("3 numeroa pisteen jäljessä = tuhaterotin") luettiin virheellisesti luvuksi 125. */
const TUHATEROTIN = /^[1-9]\d{0,2}(\.\d{3})+$/;
function lueLuku(teksti){
  // Murtoluku (3/4, -3/4) ja sekaluku (1 2/3, -1 2/3) hyväksytään sellaisinaan.
  const raaka = String(teksti).replace(/\u00a0/g, " ").trim();
  let m = raaka.match(/^(-?)(\d+)\s+(\d+)\s*\/\s*(\d+)$/);
  if(m){ const nim = Number(m[4]); if(nim === 0) return null;
    const v = Number(m[2]) + Number(m[3]) / nim; return m[1] ? -v : v; }
  m = raaka.match(/^(-?)\s*(\d+)\s*\/\s*(\d+)$/);
  if(m){ const nim = Number(m[3]); if(nim === 0) return null;
    const v = Number(m[2]) / nim; return m[1] ? -v : v; }
  let s = String(teksti).replace(/[\s\u00a0]/g, "");
  if(s === "") return null;
  if(s.indexOf(",") >= 0){
    s = s.replace(/\./g, "").replace(",", ".");
  } else if(TUHATEROTIN.test(s)){
    s = s.replace(/\./g, "");
  }
  const n = Number(s);
  return Number.isFinite(n) ? n : null;
}

function tarkista(id){
  const h=D.harjoitukset.find(x=>x.id===id);
  const kentta=document.getElementById("in-"+id);
  const fb=document.getElementById("fb-"+id);
  if(kentta.value.trim()===""){ fb.className="fb hint"; fb.textContent="Kirjoita vastaus ensin."; return; }
  const luku=lueLuku(kentta.value);
  if(luku===null){ fb.className="fb no"; fb.textContent="Vastauksen pitää olla luku tai murtoluku (esimerkiksi 3/4)."; return; }
  const oikein = Math.abs(luku - h.vastaus) < 1e-9;
  merkitseTulos(id, oikein, oikein ? "Oikein. "+h.selitys : `Ei vielä. ${h.vinkki} Kokeile uudelleen.`);
}

function tarkistaMonivalinta(id, valittuIndeksi, painike){
  const h=D.harjoitukset.find(x=>x.id===id);
  const rivi=painike.closest(".row");
  rivi.querySelectorAll(".mv-valinta").forEach(b=>b.disabled=true);
  const oikein = valittuIndeksi===h.vastaus;
  painike.classList.add(oikein?"mv-oikein":"mv-vaarin");
  if(!oikein){
    const oikeaBtn=rivi.querySelector(`[data-i="${h.vastaus}"]`);
    if(oikeaBtn) oikeaBtn.classList.add("mv-oikein");
  }
  merkitseTulos(id, oikein, oikein ? "Oikein. "+h.selitys : `Ei ihan. Oikea vastaus on korostettu. ${h.selitys||""}`);
}

/* Kuuntelu: selain lukee tekstin ääneen omalla puhesynteesillään (englanniksi, jos laitteessa on
   englanninkielinen ääni). Ei äänitiedostoja eikä verkkoyhteyttä. Jos laite ei osaa puhua,
   teksti näytetään luettavaksi — silloin tehtävä muuttuu luetun ymmärtämiseksi, mutta ei katkea. */
function puhu(id, nopeus){
  const h=D.harjoitukset.find(x=>x.id===id); if(!h || !h.kuuntele) return;
  const vara=document.getElementById("vara-"+id);
  const naytaTeksti=syy=>{ vara.hidden=false; vara.textContent=syy+" Teksti: "+h.kuuntele; };
  if(!("speechSynthesis" in window)){ naytaTeksti("Tämä laite ei osaa lukea ääneen."); return; }
  const s=window.speechSynthesis; s.cancel();
  const u=new SpeechSynthesisUtterance(h.kuuntele);
  u.lang=h.kieli||"en-GB"; u.rate=nopeus;
  const aanet=s.getVoices(), kieli=u.lang.slice(0,2);
  const aani=aanet.find(a=>a.lang===u.lang) || aanet.find(a=>a.lang && a.lang.startsWith(kieli));
  if(aani) u.voice=aani;
  else if(aanet.length) { naytaTeksti("Laitteessa ei ole englanninkielistä ääntä."); return; }
  u.onerror=()=>naytaTeksti("Ääneen lukeminen ei onnistunut.");
  s.speak(u);
}
