<title>Maapallon ympäri</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">

<style>
:root{
  --paper:#EFF2F5; --surface:#FFFFFF; --surface-2:#F7F9FB;
  --grid:#DCE3EA; --line:#C9D3DC;
  --ink:#15222C; --ink-2:#4E626F; --ink-3:#7E8F9B;
  --core:#1B5A9E; --core-soft:#E4EDF6;
  --strong:#1F6E5C; --strong-soft:#E1F0EB;
  --chal:#9A6A16; --chal-soft:#F6EDDC;
  --alert:#A33A2B; --alert-soft:#F8E7E3;
  --shadow:0 1px 2px rgba(21,34,44,.06), 0 8px 24px -12px rgba(21,34,44,.18);
  --r:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0F161B; --surface:#18222A; --surface-2:#1D2830;
    --grid:#22303A; --line:#2E3E4A;
    --ink:#E8EFF4; --ink-2:#A3B4C0; --ink-3:#7A8B97;
    --core:#7FB2E4; --core-soft:#16303F;
    --strong:#77CDB4; --strong-soft:#123028;
    --chal:#E0B267; --chal-soft:#33270F;
    --alert:#E8907F; --alert-soft:#3A1E19;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -14px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --paper:#0F161B; --surface:#18222A; --surface-2:#1D2830;
  --grid:#22303A; --line:#2E3E4A;
  --ink:#E8EFF4; --ink-2:#A3B4C0; --ink-3:#7A8B97;
  --core:#7FB2E4; --core-soft:#16303F;
  --strong:#77CDB4; --strong-soft:#123028;
  --chal:#E0B267; --chal-soft:#33270F;
  --alert:#E8907F; --alert-soft:#3A1E19;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -14px rgba(0,0,0,.7);
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:16px; line-height:1.62;
  background-image:
    linear-gradient(to right, var(--grid) 1px, transparent 1px),
    linear-gradient(to bottom, var(--grid) 1px, transparent 1px);
  background-size:26px 26px;
}
.wrap{max-width:760px; margin:0 auto; padding:28px 20px 90px}
h1,h2,h3,h4{font-family:"Familjen Grotesk","IBM Plex Sans",system-ui,sans-serif; text-wrap:balance}

/* header */
header.top{background:var(--surface); border:1px solid var(--line); border-radius:var(--r);
  box-shadow:var(--shadow); padding:22px 24px; display:flex; gap:18px; align-items:flex-start}
.badge{flex:0 0 auto; width:54px; height:54px; border-radius:9px; display:grid; place-items:center;
  background:var(--core-soft); border:1px solid var(--core); color:var(--core)}
.badge svg{width:28px; height:28px; fill:none; stroke:currentColor; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round}
.eyebrow{font-family:"IBM Plex Mono",monospace; font-size:11px; letter-spacing:.14em;
  text-transform:uppercase; color:var(--ink-3); margin:0 0 5px}
header.top h1{margin:0; font-size:30px; font-weight:700; letter-spacing:-.015em}
header.top p{margin:5px 0 0; color:var(--ink-2); font-size:15px}
.tags{display:flex; flex-wrap:wrap; gap:5px; margin-top:11px}
.tag{font-family:"IBM Plex Mono",monospace; font-size:10.5px; letter-spacing:.05em; padding:2px 7px;
  border-radius:4px; background:var(--surface-2); border:1px solid var(--line); color:var(--ink-3)}
.tag.core{background:var(--core-soft); border-color:var(--core); color:var(--core)}

/* teksti */
article{margin-top:26px}
article h2{font-size:21px; font-weight:600; margin:32px 0 10px; letter-spacing:-.01em}
article p{margin:0 0 14px; max-width:64ch}
.lead{font-size:17.5px; color:var(--ink); border-left:3px solid var(--core); padding-left:16px; margin:0 0 8px}

.box{background:var(--surface); border:1px solid var(--line); border-radius:var(--r);
  padding:18px 22px; box-shadow:var(--shadow); margin:22px 0}
.box h3{margin:0 0 12px; font-size:16.5px; font-weight:600}
.box.warn{border-left:3px solid var(--alert)}
.box.note{border-left:3px solid var(--chal)}

ol.steps{margin:0; padding-left:0; list-style:none; counter-reset:s; display:grid; gap:12px}
ol.steps li{counter-increment:s; display:grid; grid-template-columns:auto 1fr; gap:13px; align-items:start}
ol.steps li::before{content:counter(s); font-family:"Familjen Grotesk",sans-serif; font-weight:700; font-size:14px;
  width:26px; height:26px; border-radius:50%; background:var(--core); color:#fff; display:grid; place-items:center; margin-top:2px}

ul.notes{margin:0; padding-left:19px}
ul.notes li{margin-bottom:7px}
ul.notes li:last-child{margin-bottom:0}

.tablewrap{overflow-x:auto}
table{border-collapse:collapse; width:100%; font-size:14.5px; min-width:460px}
th,td{text-align:left; padding:9px 13px; border-bottom:1px solid var(--line)}
th{font-family:"IBM Plex Mono",monospace; font-size:10.5px; letter-spacing:.1em; text-transform:uppercase;
  color:var(--ink-3); font-weight:400; background:var(--surface-2)}
tr:last-child td{border-bottom:0}
td b{color:var(--core); font-weight:600}
td:last-child{font-variant-numeric:tabular-nums; font-weight:600}

/* lukusuora */
.nl svg{width:100%; height:118px; display:block}
.nl .rail{stroke:var(--line); stroke-width:2}
.nl .tick{stroke:var(--line); stroke-width:1.5}
.nl .stop{fill:var(--ink-3); font-family:"IBM Plex Mono",monospace; font-size:11px}
.nl .stop.near{fill:var(--core); font-weight:600}
.nl .dot{fill:var(--chal)}
.nl .val{fill:var(--ink); font-family:"Familjen Grotesk",sans-serif; font-size:15px; font-weight:700}
.nl .halfway{stroke:var(--chal); stroke-dasharray:3 3; stroke-width:1.5}
.nl-controls{display:flex; align-items:center; gap:14px; margin-top:6px}
.nl-controls input{flex:1; accent-color:var(--core)}
.nl-out{font-family:"Familjen Grotesk",sans-serif; font-size:15px; font-weight:600; min-width:12.5em; text-align:right}

/* paikka-arvotaulu */
.box .ohje{margin:0 0 14px; font-size:14.5px; color:var(--ink-2)}
.nt-valinta{display:flex; flex-wrap:wrap; gap:7px; margin-bottom:16px}
.nt-valinta button{font:inherit; font-size:12.5px; font-family:"IBM Plex Mono",monospace; padding:5px 11px;
  border-radius:6px; border:1px solid var(--line); background:var(--surface-2); color:var(--ink-2); cursor:pointer}
.nt-valinta button[aria-pressed="true"]{background:var(--ink); color:var(--paper); border-color:var(--ink)}
.nt-valinta button:focus-visible{outline:2px solid var(--core); outline-offset:2px}
.nt-taulu{display:flex; flex-direction:column; gap:4px; align-items:flex-start; overflow-x:auto; padding-bottom:4px}
.nt-rivi{display:flex; gap:6px; align-items:center}
.nt-rivi .otsa{font-family:"IBM Plex Mono",monospace; font-size:9.5px; letter-spacing:.08em;
  text-transform:uppercase; color:var(--ink-3); width:52px; text-align:center}
.nt-ruutu{width:52px; height:52px; display:grid; place-items:center; border:1.5px solid var(--line);
  border-radius:7px; background:var(--surface-2); font-family:"IBM Plex Mono",monospace; font-size:24px}
.nt-ruutu.kohta{border-color:var(--core); background:var(--core-soft); color:var(--core); font-weight:500}
.nt-ruutu.ratkaiseva{border-color:var(--chal); background:var(--chal-soft); color:var(--chal); font-weight:500}
.nt-ruutu.nolla{color:var(--ink-3)}
.nt-rivi .nimi{font-size:12.5px; color:var(--ink-3); margin-left:12px; white-space:nowrap}
.nt-nuoli{font-size:17px; color:var(--chal); margin-left:6px}
.nt-selite{margin:14px 0 0; font-size:14.5px}
.nt-selite b{color:var(--core)}

/* vahvuusportaat */
.vp-tasot{display:grid; gap:9px; margin-bottom:18px}
.vp-taso{display:flex; gap:11px; align-items:flex-start; font-size:13.5px}
.vp-taso .vp-pallo{width:13px; height:13px; border-radius:4px; margin-top:5px; flex:0 0 auto}
.vp-taso[data-taso="sulkeet"] .vp-pallo{background:var(--core)}
.vp-taso[data-taso="kertojako"] .vp-pallo{background:var(--strong)}
.vp-taso[data-taso="yhteenvahennys"] .vp-pallo{background:var(--chal)}
.vp-taso strong{display:block; font-family:"Familjen Grotesk",sans-serif; font-weight:600; font-size:14.5px}
.vp-taso span{color:var(--ink-2)}
.vp-lauseke{display:flex; flex-wrap:wrap; gap:7px; align-items:flex-end; font-family:"IBM Plex Mono",monospace;
  font-size:25px; padding:10px 2px; min-height:64px}
.vp-lauseke .t{padding:2px 3px}
.vp-lauseke .op{position:relative; padding:2px 9px; border-radius:6px; font-weight:500}
.vp-lauseke .op[data-taso="sulkeet"]{background:var(--core-soft); color:var(--core)}
.vp-lauseke .op[data-taso="kertojako"]{background:var(--strong-soft); color:var(--strong)}
.vp-lauseke .op[data-taso="yhteenvahennys"]{background:var(--chal-soft); color:var(--chal)}
.vp-lauseke .op i{position:absolute; top:-9px; right:-6px; font-style:normal; font-family:"Familjen Grotesk",sans-serif;
  font-size:11px; font-weight:700; width:18px; height:18px; border-radius:50%; display:grid; place-items:center;
  background:currentColor}
.vp-lauseke .op i span{color:var(--surface)}
.vp-rivi{display:flex; align-items:center; gap:16px; margin-top:8px}
.vp-vastaus{font-family:"Familjen Grotesk",sans-serif; font-size:16px; font-weight:600; color:var(--strong)}

/* laskujärjestys-widget */
.lj-exp{display:flex; flex-wrap:wrap; gap:7px; align-items:center; font-family:"IBM Plex Mono",monospace;
  font-size:23px; padding:14px 4px; min-height:62px}
.lj-exp .tok{padding:2px 4px; color:var(--ink)}
.lj-exp button.op{font-family:"IBM Plex Mono",monospace; font-size:23px; padding:3px 12px; border-radius:7px;
  border:1.5px solid var(--line); background:var(--surface-2); color:var(--ink); line-height:1.2}
.lj-exp button.op:hover{border-color:var(--core); color:var(--core)}
.lj-exp button.op:focus-visible{outline:2px solid var(--core); outline-offset:2px}
.lj-exp .valmis{font-family:"Familjen Grotesk",sans-serif; font-size:23px; font-weight:700; color:var(--strong)}
.lj-fb{font-size:14.5px; min-height:1.5em; color:var(--ink-2)}
.lj-fb.no{color:var(--alert)}
.lj-fb.ok{color:var(--strong)}
.lj-row{display:flex; align-items:center; gap:14px; margin-top:10px}
.lj-step{font-family:"IBM Plex Mono",monospace; font-size:11.5px; letter-spacing:.1em;
  text-transform:uppercase; color:var(--ink-3)}

/* harjoitukset */
.progress{position:sticky; top:0; z-index:5; background:var(--surface); border:1px solid var(--line);
  border-radius:var(--r); padding:12px 18px; box-shadow:var(--shadow); display:flex; align-items:center;
  gap:14px; margin:34px 0 18px}
.progress .lbl{font-family:"IBM Plex Mono",monospace; font-size:11px; letter-spacing:.12em;
  text-transform:uppercase; color:var(--ink-3); white-space:nowrap}
.progress .meter{flex:1; height:7px; border-radius:4px; background:var(--surface-2); border:1px solid var(--line); overflow:hidden}
.progress .meter i{display:block; height:100%; background:var(--core); transition:width .25s ease}
.progress .cnt{font-family:"Familjen Grotesk",sans-serif; font-weight:700; font-variant-numeric:tabular-nums; white-space:nowrap}

.grp{margin-top:26px}
.grp-head{display:flex; align-items:baseline; gap:10px; border-bottom:1.5px solid var(--ink); padding-bottom:7px; margin-bottom:14px}
.grp-head h3{margin:0; font-size:17px; font-weight:600}
.grp-head span{font-size:12.5px; color:var(--ink-2)}

.ex{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:14px 16px; margin-bottom:10px}
.ex[data-tila="oikein"]{border-color:var(--strong); box-shadow:inset 3px 0 0 var(--strong)}
.ex[data-tila="vaarin"]{border-color:var(--alert); box-shadow:inset 3px 0 0 var(--alert)}
.ex .q{display:flex; gap:11px; align-items:baseline; flex-wrap:wrap}
.ex .num{font-family:"IBM Plex Mono",monospace; font-size:11.5px; color:var(--ink-3); min-width:2.4em}
.ex .txt{flex:1; min-width:190px; font-size:15.5px}
.ex .txt .aineisto{display:block; margin-bottom:9px; padding-left:12px;
  border-left:2px solid var(--line); color:var(--ink-2); line-height:1.6;
  /* Aineisto voi olla pieni taulukko, jonka rivit on erotettu rivinvaihdoilla.
     Ilman pre-lineä ne valuisivat yhdeksi kappaleeksi ja taulukko katoaisi. */
  white-space:pre-line}
.ex .txt .kysymysrivi{display:block; font-weight:600}
.ex .row{display:flex; gap:8px; align-items:center; margin-top:11px; flex-wrap:wrap}
.ex input[type=text]{font:inherit; font-family:"IBM Plex Mono",monospace; font-size:15px; width:8.5em;
  padding:7px 11px; border:1px solid var(--line); border-radius:7px; background:var(--surface-2);
  color:var(--ink); text-align:right}
.ex input:focus-visible{outline:2px solid var(--core); outline-offset:1px}
button{font:inherit; cursor:pointer}
.btn{font-size:13.5px; padding:7px 15px; border-radius:7px; border:1px solid var(--core);
  background:var(--core); color:#fff}
.btn.ghost{background:transparent; color:var(--ink-2); border-color:var(--line)}
.btn:focus-visible{outline:2px solid var(--core); outline-offset:2px}
.btn.mv-valinta{text-align:left}
/* kuuntelutehtävä: selaimen puhesynteesi lukee englanninkielisen tekstin */
.kuuntele{display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin:2px 0 10px}
.kuuntele .btn{display:inline-flex; gap:7px; align-items:center}
.kuuntele svg{width:16px; height:16px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round}
.kuuntele .varateksti{flex-basis:100%; font-size:14px; color:var(--ink-2); background:var(--surface-2);
  border-radius:7px; padding:8px 12px; margin:0}
.btn.mv-valinta:disabled{cursor:default; opacity:.65}
.btn.mv-oikein{background:var(--strong-soft); border-color:var(--strong); color:var(--strong); opacity:1}
.btn.mv-vaarin{background:var(--alert-soft); border-color:var(--alert); color:var(--alert); opacity:1}
.row.mv{gap:8px 10px}
.fb{margin-top:11px; font-size:14.5px; padding:10px 13px; border-radius:8px; line-height:1.5}
.fb.ok{background:var(--strong-soft); color:var(--strong)}
.fb.no{background:var(--alert-soft); color:var(--alert)}
.fb.hint{background:var(--chal-soft); color:var(--chal)}

.done{background:var(--strong-soft); border:1px solid var(--strong); color:var(--strong);
  border-radius:var(--r); padding:16px 20px; margin-top:20px; font-size:15.5px}
.done h3{margin:0 0 4px; font-size:17px; color:var(--strong)}

details.teacher{margin-top:34px; background:var(--surface); border:1px solid var(--line);
  border-left:3px solid var(--chal); border-radius:var(--r); padding:15px 20px; box-shadow:var(--shadow)}
details.teacher summary{cursor:pointer; font-family:"Familjen Grotesk",sans-serif; font-weight:600; font-size:15px}
details.teacher summary:focus-visible{outline:2px solid var(--core); outline-offset:3px}
details.teacher ul{margin:12px 0 0; padding-left:19px; color:var(--ink-2); font-size:14.5px}
details.teacher li{margin-bottom:8px}
details.teacher p{margin:12px 0 0; color:var(--ink-2); font-size:14.5px}

.back{display:inline-block; margin-top:30px; font-size:13.5px; color:var(--ink-2)}
.back a{color:var(--core)}

@media (prefers-reduced-motion: reduce){*{transition:none !important}}
@media (max-width:560px){
  .wrap{padding:16px 13px 70px}
  header.top h1{font-size:25px}
  .progress{flex-wrap:wrap}
}
</style>

<div class="wrap">

  <header class="top">
    <span class="badge"><svg viewBox="0 0 24 24" aria-hidden="true" id="ikoni"></svg></span>
    <div>
      <p class="eyebrow" id="eyebrow"></p>
      <h1 id="otsikko"></h1>
      <p id="kuvaus"></p>
      <div class="tags" id="tags"></div>
    </div>
  </header>

  <article id="teksti"></article>

  <div class="progress" aria-live="polite">
    <span class="lbl">Harjoitukset</span>
    <span class="meter"><i id="pbar" style="width:0%"></i></span>
    <span class="cnt" id="pcnt">0 / 20</span>
  </div>

  <div id="harjoitukset"></div>
  <div id="valmis"></div>

  <p class="back" id="back"></p>

</div>

<script>
const D = {"tavoite_id":"MAT8-MIT-05","oppiaine":"MAT","vuosiluokka":8,"taso":"haaste","otsikko":"Maapallon ympäri","kuvaus":"Osaan ratkaista ympyrän kehää, kaarta ja sektoria koskevia ylikurssitehtäviä.","versio":"0.2","paivitetty":"2026-10-11","ops":{"T":["T5","T7","T17","T18"],"S":["S1","S5"]},"ikoni":"maapallo","eyebrow":"Matematiikka · 8. luokka · Mittaaminen","teksti":[{"tyyppi":"johdanto","sisalto":"Yli 2 200 vuotta sitten kreikkalainen Eratosthenes mittasi maapallon ympärysmitan ilman satelliitteja ja lentokoneita. Hän tiesi, että keskipäivällä aurinko paistoi yhdessä kaupungissa suoraan ylhäältä, kun toisessa, noin 800 km pohjoisempana, pystysuora keppi heitti varjon. Varjosta hän sai kulman, noin 7,2°. Koska auringonsäteet ovat käytännössä yhdensuuntaisia, tämä kulma on sama kuin kaupunkien välinen keskuskulma maapallon keskipisteessä. Loppu on sektorilaskua: 7,2° on 7,2/360 = 1/50 täysikulmasta, joten 800 km on 1/50 koko kehästä, ja ympärysmitta on 50 · 800 km = 40 000 km. Sama ajatus ratkaisee monta vanhaa ylioppilastehtävää: kuinka kaukana kaksi kaupunkia ovat toisistaan, kuinka pitkä hihna tarvitaan kahden pyörän ympäri ja kuinka paljon kangasta kuluu kellohameeseen. Näissä tehtävissä vaikeinta ei ole lasku vaan sen huomaaminen, missä on ympyrä, missä kaari ja mikä kulma on keskuskulma. Tässä taidossa opit tunnistamaan kaaren, keskuskulman ja tangentin tehtävän tekstistä, piirtämään mallikuvion ja perustelemaan jokaisen välivaiheen. Laskin on sallittu, ja π:n arvona käytetään laskimen π-näppäintä."},{"tyyppi":"saanto","otsikko":"Näin ratkaiset ylikurssitehtävän","askeleet":["Piirrä mallikuvio. Merkitse ympyrän keskipiste, säteet ja tehtävän pisteet. Kuvion ei tarvitse olla mittakaavassa, mutta suorien kulmien ja yhtä pitkien janojen pitää näkyä merkintöinä.","Etsi kuvasta ympyrän osat: mikä matka on kaari, mikä kulma on keskuskulma (kärki keskipisteessä) ja mikä suora on tangentti. Kun suora sivuaa ympyrää, piirrä sivuamispisteeseen säde ja merkitse suora kulma.","Kirjoita suunnitelma ennen laskua: mitä lasket ensin ja mitä sen jälkeen. Esimerkiksi: keskuskulma leveysasteista, sitten kaari kehästä.","Laske. Muunna kaikki mitat samaan yksikköön ennen sijoittamista. Kun tehtävä antaa halkaisijan, laske säde ennen kaavaa tai käytä kaavaa πd.","Pyöristä vasta lopuksi ja vain tehtävän pyytämään tarkkuuteen. Täysien kierrosten määrä pyöristetään aina alaspäin, koska kesken jäänyt kierros ei ole täysi.","Tarkista suuruusluokka: kaari on lyhyempi kuin koko kehä, ja maapallon ympärysmitta on noin 40 000 km, joten yksi aste on noin 111 km."]},{"tyyppi":"kappale","otsikko":"Leveysasteet ovat keskuskulmia","sisalto":"Leveysaste kertoo, kuinka suuren kulman paikkaan piirretty maapallon säde muodostaa päiväntasaajan tason kanssa. Päiväntasaaja on 0°, pohjoisnapa 90° pohjoista leveyttä ja etelänapa 90° eteläistä leveyttä. Pituuspiiri kulkee navalta navalle, ja se on puolikas ympyrästä, jonka keskipiste on maapallon keskipiste ja säde maapallon säde. Kun kaksi paikkaa on samalla pituuspiirillä, niiden välinen matka pitkin maanpintaa on tämän ympyrän kaari, ja kaarta vastaava keskuskulma on paikkoihin piirrettyjen säteiden välinen kulma. Kun paikat ovat samalla pallonpuoliskolla, molemmat leveysasteet mitataan päiväntasaajalta samaan suuntaan, joten keskuskulma on leveysasteiden erotus. Kun toinen on pohjoisella ja toinen eteläisellä pallonpuoliskolla, kulmat ovat päiväntasaajan eri puolilla, ja keskuskulma on leveysasteiden summa: 5° pohjoista ja 3° eteläistä leveyttä ovat 8°:n päässä toisistaan. Pohjoisella pallonpuoliskolla olevasta paikasta keskuskulma pohjoisnavalle on 90° miinus leveysaste. Eteläiseltä pallonpuoliskolta se on 90° plus leveysaste.\n\nEsimerkki 1. Kaksi kaupunkia on samalla pituuspiirillä, toinen 56,9° ja toinen 61,0° pohjoista leveyttä. Maapallon säde on 6 370 km. Kuinka kaukana kaupungit ovat toisistaan pitkin maanpintaa kilometrin tarkkuudella?\nMallikuvio: ympyrä, jonka keskipiste on O. Vaakasuora halkaisija kuvaa päiväntasaajan tasoa. Kehällä ovat kaupungit A ja B, ja säteet OA ja OB muodostavat päiväntasaajan tason kanssa kulmat 56,9° ja 61,0°. Kulma AOB on merkitty, ja kaari AB on korostettu.\nSuunnitelma: (1) keskuskulma leveysasteista, (2) kaari keskuskulman osuutena koko kehästä.\n(1) Kaupungit ovat samalla pallonpuoliskolla, joten kulma AOB on 61,0° − 56,9° = 4,1°.\n(2) Kaari on 4,1/360 · 2π · 6 370 km ≈ 455,8 km ≈ 456 km.\nTarkistus: yksi aste on noin 111 km, ja 4 · 111 km = 444 km, joten tulos on oikeaa suuruusluokkaa.\n\nSama osuusajatus toimii toiseenkin suuntaan. Jos tiedät matkan ja keskuskulman, saat koko kehän, kuten Eratosthenes. Jos tiedät matkan ja maapallon säteen, saat keskuskulman: osuus on matka jaettuna koko kehällä, ja keskuskulma on osuus kertaa 360°. Tässä taidossa liikutaan vain pituuspiiriä pitkin. Matka leveyspiiriä pitkin itään tai länteen vaatii trigonometriaa, jota opiskellaan 9. luokalla."},{"tyyppi":"kappale","otsikko":"Hihna, putkinippu ja tangentti","sisalto":"Kun kireä hihna kulkee pyörältä toiselle, sen suora osa vain hipaisee kumpaakin pyörää. Suora osa on siis kummankin pyörän tangentti, ja horisonttitaidosta (MAT8-GEO-05) tiedät, että tangentti on kohtisuorassa sivuamispisteeseen piirrettyä sädettä vastaan. Tästä yhdestä tiedosta seuraa koko hihnan rakenne.\n\nEsimerkki 2. Kahden samankokoisen hihnapyörän säde on 6 cm ja keskipisteiden etäisyys 35 cm. Kireä hihna kiertää pyörät ulkopuolitse. Kuinka pitkä hihna on senttimetrin tarkkuudella?\nMallikuvio: pyörien keskipisteet O₁ ja O₂ vaakasuoralla janalla. Hihnan yläosa sivuaa pyöriä pisteissä A ja B ja alaosa pisteissä C ja D. Säteet O₁A, O₂B, O₁C ja O₂D on piirretty, ja niiden ja hihnan väliin on merkitty suora kulma.\nSuunnitelma: (1) suorien osien pituus tangentin ja säteen avulla, (2) kaarevien osien keskuskulmat, (3) yhteenlasku.\n(1) Säteet O₁A ja O₂B ovat kohtisuorassa samaa suoraa AB vastaan ja yhtä pitkät, joten nelikulmio O₁ABO₂ on suorakulmio. Suorakulmion vastakkaiset sivut ovat yhtä pitkät, joten AB = O₁O₂ = 35 cm. Samoin CD = 35 cm.\n(2) Suorat osat ovat yhdensuuntaiset janan O₁O₂ kanssa, joten säteet O₁A ja O₁C ovat molemmat kohtisuorassa janaa O₁O₂ vastaan ja ovat samalla suoralla. Hihna kiertää siis pyörästä puoliympyrän, keskuskulma 180°, ja samoin toisesta pyörästä. Kaksi puoliympyrää on yhteensä yksi kehä.\n(3) Hihnan pituus on 2 · 35 cm + 2π · 6 cm ≈ 70 cm + 37,70 cm ≈ 108 cm.\n\nSama päättely toimii useammalle samankokoiselle pyörälle tai putkelle. Kun kolme putkea koskettaa toisiaan, keskipisteiden etäisyys on kaksi sädettä, ja keskipisteet ovat tasasivuisen kolmion kärjissä. Vanteen kaari kunkin putken kohdalla vastaa keskuskulmaa 360° − 90° − 90° − 60° = 120°, ja kolme kaarta ovat yhteensä 360° eli yksi kehä. Vanteen pituus on kolmen keskipisteiden välisen janan summa plus yksi kehä. Jos pyörät ovat eri kokoisia, kaaret eivät ole puoliympyröitä. Silloin kaarien keskuskulmat pitää tietää, ja tässä taidossa tehtävä antaa ne, koska niiden laskeminen sivujen pituuksista vaatii trigonometriaa."},{"tyyppi":"kappale","otsikko":"Kierrokset, renkaat ja yllättävä köysi","sisalto":"Kun pyörä pyörii liukumatta, se kulkee yhdellä kierroksella kehänsä pituuden πd. Kierrosten määrä on matka jaettuna kehällä, kun molemmat ovat samassa yksikössä. Jos renkaan halkaisija on 59 cm ja matka 0,8 km = 80 000 cm, kierroksia on 80 000 : (π · 59) ≈ 431,6. Täysiä kierroksia on 431, sillä 432. kierros jää kesken. Kun hihna yhdistää kaksi eri kokoista pyörää, hihna kulkee kummankin kohdalla saman matkan. Pyörä, jonka kehä on kaksi kertaa pidempi, pyörähtää siksi puolet harvemmin.\n\nEsimerkki 3. Kellohame leikataan ympyrärenkaan muotoisesta kankaasta: sisäreuna on vyötärö ja ulkoreuna helma. Vyötärön ympärysmitta on 72 cm ja hameen pituus 45 cm. Kuinka monta neliömetriä kangasta rengas vie 0,01 m²:n tarkkuudella?\nMallikuvio: kaksi samankeskistä ympyrää, keskipiste O. Sisäsäde r on piirretty sisäympyrälle, ja samalla säteellä jatkuu renkaan leveys 45 cm ulkoympyrälle asti, joten ulkosäde on R = r + 45 cm.\nSuunnitelma: (1) sisäsäde vyötärön ympärysmitasta, (2) ulkosäde, (3) renkaan ala suuren ja pienen ympyrän alan erotuksena, (4) yksikkömuunnos.\n(1) Vyötärö on sisäympyrän kehä: 2πr = 72 cm, joten r = 72 cm : (2π) ≈ 11,459 cm.\n(2) R = r + 45 cm ≈ 56,459 cm.\n(3) Ala on πR² − πr² ≈ 10 014,3 cm² − 412,5 cm² ≈ 9 601,7 cm².\n(4) 1 m² = 100 cm · 100 cm = 10 000 cm², joten ala on noin 0,96 m².\nPidä välitulokset laskimen muistissa. Kun r pyöristetään liikaa kesken laskun, viimeinen numero voi muuttua.\n\nKehä on suoraan verrannollinen säteeseen, ja siitä seuraa tulos, joka yllättää lähes kaikki. Jos köysi kiertää ympyrää, jonka säde on R, ja köyttä pidennetään niin, että se kiertää h:n verran ulompana, uusi pituus on 2π(R + h) = 2πR + 2πh. Lisäys on 2πh riippumatta siitä, onko ympyrä jalkapallo vai maapallo: 10 cm ulommas tarvitaan aina noin 62,8 cm lisää köyttä. Samasta syystä puoliympyrän muotoisessa kaarteessa ulompi rata on sisempää pidempi π kertaa ratojen säteiden erotus, oli kaarteen säde kuinka suuri tahansa."},{"tyyppi":"taulukko","otsikko":"Mikä on keskuskulma?","otsikkorivi":["Tilanne","Keskuskulma","Mitä lasket"],"rivit":[["Kaksi paikkaa samalla pituuspiirillä ja samalla pallonpuoliskolla","leveysasteiden erotus","kaari: α/360° · 2πR"],["Toinen paikka pohjoisella, toinen eteläisellä pallonpuoliskolla","leveysasteiden summa","kaari: α/360° · 2πR"],["Pohjoisen pallonpuoliskon paikasta pohjoisnavalle","90° − leveysaste","kaari: α/360° · 2πR"],["Matka tunnetaan, leveysasteen muutos kysytään","matka : kehä · 360°","keskuskulma"],["Hihna kahden samankokoisen pyörän ympäri","180° kummassakin pyörässä","2 · keskipisteiden etäisyys + 2πr"],["Vanne kolmen toisiaan koskettavan putken ympäri","120° kussakin putkessa","3 · 2r + 2πr"],["Pyyhkimen tai tuulettimen siiven pyyhkimä alue","kääntymiskulma","α/360° · π(R² − r²)"]]},{"tyyppi":"ansa","otsikko":"Ansa 1: leveysasteiden summa samalla pallonpuoliskolla","sisalto":"Kaksi kaupunkia on samalla pituuspiirillä, 60,3° ja 63,5° pohjoista leveyttä. Jos keskuskulmaksi otetaan summa 123,8°, matkaksi tulee noin 13 764 km, yli kolmasosa maapallon ympärysmitasta, vaikka kaupungit ovat lähes samalla kohdalla. Jos keskuskulmaksi otetaan toinen leveysaste, esimerkiksi 63,5°, saadaan matka päiväntasaajalle eikä toiseen kaupunkiin. Molemmat leveysasteet mitataan päiväntasaajalta samaan suuntaan, joten kaupunkien välinen kulma on erotus 3,2°, ja matka on noin 356 km. Summa on oikein vain silloin, kun kaupungit ovat päiväntasaajan eri puolilla. Piirrä mallikuvio, niin näet, kumpi tilanne on kyseessä."},{"tyyppi":"ansa","otsikko":"Ansa 2: hihnan kaaret väärin","sisalto":"Kahden samankokoisen pyörän säde on 10 cm ja keskipisteiden etäisyys 60 cm. Jos lasket kaarista vain yhden puoliympyrän, saat 2 · 60 cm + π · 10 cm ≈ 151 cm, ja hihna jää liian lyhyeksi. Jos lasket kummastakin pyörästä koko kehän, saat 2 · 60 cm + 2 · 2π · 10 cm ≈ 246 cm, vaikka hihna kulkee kummankin pyörän ympäri vain puoliksi. Oikein on kaksi puoliympyrää eli yksi kehä: 120 cm + 2π · 10 cm ≈ 183 cm. Perustelu tulee tangentista: säteet sivuamispisteisiin ovat kohtisuorassa hihnaa vastaan, joten yläosan ja alaosan säteet ovat samalla suoralla ja rajaavat puoliympyrän."},{"tyyppi":"ansa","otsikko":"Ansa 3: säde ja halkaisija sekaisin","sisalto":"Pyörän halkaisija on 50 cm. Jos sijoitat luvun 50 kaavaan 2πr säteen paikalle, saat kierroksen pituudeksi noin 314 cm, kaksinkertaisen oikeaan verrattuna. Oikea kehä on π · 50 cm ≈ 157 cm tai 2π · 25 cm. Sama virhe toisin päin syntyy hameessa: vyötärön ympärysmitta on sisäympyrän kehä, joten säde saadaan jakamalla luvulla 2π. Jos jaat vain π:llä, saat halkaisijan ja kankaan ala kasvaa liian suureksi. Kirjoita aina ensin r = … ja tarkista, kumpi luku tehtävässä on annettu."},{"tyyppi":"ansa","otsikko":"Ansa 4: yksiköt ja täysien kierrosten pyöristys","sisalto":"Pyörän halkaisija on 54 cm, ja matka on 0,7 km. Jos jaat luvun 0,7 kehällä π · 54 ≈ 169,6, saat 0,004 kierrosta, koska matka on kilometreinä ja kehä senttimetreinä. Muunna ensin: 0,7 km = 70 000 cm. Silloin 70 000 : 169,6 ≈ 412,6. Täysiä kierroksia on 412, ei 413, koska 413. kierros jää kesken: pyöristä alaspäin, vaikka desimaali olisi yli puolen. Sama koskee pinta-alaa: 1 m² on 10 000 cm², ei 100 cm², koska neliömetri on 100 cm kertaa 100 cm."}],"harjoitusryhmat":[{"id":"tyokalut","nimi":"Työkalut","info":"Kaari maapallolla, keskuskulma leveysasteista, kierroksen pituus ja hihnan kaaret. Laskin on sallittu, ja π:n arvona käytetään laskimen π-näppäintä."},{"id":"monivaihe","nimi":"Monivaiheiset ongelmat","info":"Kaksi tai kolme vaihetta: piirrä mallikuvio ja kirjoita suunnitelma ennen laskua. Laskin on sallittu, ja π:n arvona käytetään π-näppäintä. Pyöristä vasta lopuksi."},{"id":"ylikurssi","nimi":"Ylikurssi","info":"Vanhojen ylioppilastehtävien kaltaisia ongelmia. Piirrä mallikuvio, merkitse kaaret, keskuskulmat ja suorat kulmat ja perustele jokainen vaihe. Laskin on sallittu, ja π:n arvona käytetään π-näppäintä."}],"harjoitukset":[{"id":"H01","ryhma":"tyokalut","kysymys":"Maapallon säde on 6 370 km. Kahden paikan välinen keskuskulma maapallon keskipisteessä on 2,4°. Kuinka kaukana paikat ovat toisistaan pitkin maanpintaa? Anna vastaus kilometreinä kilometrin tarkkuudella ilman yksikköä.","vastaus":267,"vinkki":"Etäisyys pitkin maanpintaa on kaari. Kerro koko kehä osuudella α/360°.","selitys":"Kaari on 2,4/360 · 2π · 6 370 km ≈ 266,8 km ≈ 267 km. Vastaus 133 syntyisi, jos kehänä käytettäisiin πR eli säde luettaisiin halkaisijaksi."},{"id":"H02","ryhma":"tyokalut","kysymys":"Kaksi kaupunkia on samalla pituuspiirillä. Toinen on 52,4° ja toinen 56,7° pohjoista leveyttä. Kuinka suuri on kaupunkien välinen keskuskulma maapallon keskipisteessä? Anna vastaus asteina ilman yksikköä.","vastaus":4.3,"vinkki":"Leveysaste on kulma, jonka säde muodostaa päiväntasaajan tason kanssa. Molemmat kulmat lasketaan päiväntasaajalta samaan suuntaan.","selitys":"Kumpikin leveysaste mitataan päiväntasaajalta pohjoiseen, joten kaupunkien välinen keskuskulma on erotus 56,7° − 52,4° = 4,3°. Summa 109,1° olisi oikein vain, jos kaupungit olisivat päiväntasaajan eri puolilla."},{"id":"H03","ryhma":"tyokalut","kysymys":"Potkulaudan pyörän halkaisija on 56 cm. Kuinka pitkän matkan potkulauta kulkee, kun pyörä pyörähtää kerran? Anna vastaus senttimetreinä senttimetrin tarkkuudella ilman yksikköä.","vastaus":176,"vinkki":"Yhdellä kierroksella pyörä kulkee kehänsä pituuden.","selitys":"Kehä on π · 56 cm ≈ 175,9 cm ≈ 176 cm. Vastaus 352 syntyisi, jos halkaisija 56 cm sijoitettaisiin kaavaan 2πr säteen paikalle."},{"id":"H04","ryhma":"tyokalut","kysymys":"Kahden samankokoisen hihnapyörän säde on 7 cm, ja niiden keskipisteiden etäisyys on 30 cm. Kireä hihna kiertää pyörät ulkopuolitse. Hihnan kaarevien osien yhteispituus on kπ cm. Mikä on k?","vastaus":14,"vinkki":"Kuinka suuren kaaren hihna kiertää kummastakin pyörästä?","selitys":"Hihna kiertää kummastakin pyörästä puoliympyrän, ja kaksi puoliympyrää on yhteensä yksi kehä 2π · 7 cm = 14π cm, joten k = 14. Vastaus 7 syntyisi, jos laskettaisiin vain yksi puoliympyrä, ja vastaus 28, jos kummastakin pyörästä laskettaisiin koko kehä. Keskipisteiden etäisyyttä ei tarvita."},{"id":"H05","ryhma":"tyokalut","kysymys":"Kahden kaupungin välinen keskuskulma maapallon keskipisteessä on 3,6°, ja kaupunkien etäisyys pitkin maanpintaa on 400 km. Laske näiden tietojen avulla maapallon ympärysmitta. Anna vastaus kilometreinä ilman yksikköä.","vastaus":40000,"vinkki":"Mikä osa täysikulmasta 3,6° on? Kaari on yhtä suuri osa koko kehästä.","selitys":"3,6° on 3,6/360 = 1/100 täysikulmasta, joten 400 km on sadasosa ympärysmitasta. Ympärysmitta on 100 · 400 km = 40 000 km."},{"id":"H06","ryhma":"tyokalut","kysymys":"Kireä hihna kiertää ulkopuolitse kaksi samankokoista hihnapyörää. Miksi hihnan suora osa on yhtä pitkä kuin pyörien keskipisteiden välinen jana?","vastaus":1,"vinkki":"Mikä hihnan suora osa on pyörän kannalta? Mitä tiedät tangentin ja säteen välisestä kulmasta?","selitys":"Hihnan suora osa on kummankin pyörän tangentti, ja tangentti on kohtisuorassa sivuamispisteeseen piirrettyä sädettä vastaan. Kaksi yhtä pitkää sädettä, jotka ovat kohtisuorassa samaa suoraa vastaan, muodostavat suoran osan ja keskipisteiden välisen janan kanssa suorakulmion, ja suorakulmion vastakkaiset sivut ovat yhtä pitkät. Hihna ei kulje keskipisteiden kautta, eikä suoran osan pituus riipu kehästä.","tyyppi":"monivalinta","vaihtoehdot":["Hihna kiertää kummastakin pyörästä puoliympyrän, joten suoran osan pituus on puolet kehästä.","Hihna on kummankin pyörän tangentti, joten sivuamispisteisiin piirretyt säteet ovat kohtisuorassa hihnaa vastaan. Säteet ovat yhtä pitkät, joten säteet, hihnan suora osa ja keskipisteiden välinen jana muodostavat suorakulmion.","Hihnan suora osa kulkee pyörien keskipisteiden kautta, joten se on keskipisteiden välinen jana."]},{"id":"H07","ryhma":"monivaihe","kysymys":"Kaksi kaupunkia on samalla pituuspiirillä. Toinen on 61,4° ja toinen 64,1° pohjoista leveyttä. Maapallon säde on 6 370 km. Laske kaupunkien etäisyys pitkin maanpintaa kilometreinä kilometrin tarkkuudella. Anna vastaus ilman yksikköä.","vastaus":300,"vinkki":"Keskuskulma ensin: kaupungit ovat samalla pallonpuoliskolla.","selitys":"Keskuskulma on 64,1° − 61,4° = 2,7°. Kaari on 2,7/360 · 2π · 6 370 km ≈ 300,2 km ≈ 300 km. Summalla 125,5° saisi noin 13 953 km, mikä on kolmannes maapallon ympärysmitasta."},{"id":"H08","ryhma":"monivaihe","kysymys":"Kaksi kaupunkia on samalla pituuspiirillä. Toinen on 3,1° pohjoista leveyttä ja toinen 2,8° eteläistä leveyttä. Maapallon säde on 6 370 km. Laske kaupunkien etäisyys pitkin maanpintaa kilometreinä kilometrin tarkkuudella. Anna vastaus ilman yksikköä.","vastaus":656,"vinkki":"Kaupungit ovat päiväntasaajan eri puolilla. Kulkeeko lyhin reitti päiväntasaajan yli?","selitys":"Päiväntasaajalta on pohjoiseen 3,1° ja etelään 2,8°, joten keskuskulma on 3,1° + 2,8° = 5,9°. Kaari on 5,9/360 · 2π · 6 370 km ≈ 655,9 km ≈ 656 km. Erotus 0,3° antaisi vain 33 km."},{"id":"H09","ryhma":"monivaihe","kysymys":"Polkupyörän renkaan halkaisija on 49 cm. Montako täyttä kierrosta rengas pyörähtää 1 km:n matkalla? Anna vastaus kokonaislukuna.","vastaus":649,"vinkki":"Muunna matka senttimetreiksi. Viimeinen kierros ei ehkä ole täysi.","selitys":"1 km = 100 000 cm. Kierroksen pituus on π · 49 cm ≈ 153,94 cm. 100 000 : 153,94 ≈ 649,61, joten täysiä kierroksia on 649. Ylöspäin pyöristetty 650 on väärin, koska 650. kierros jää kesken."},{"id":"H10","ryhma":"monivaihe","kysymys":"Kottikärryn pyörä pyörähtää 400 kertaa, kun kärryä työnnetään 900 m. Pyörä ei luista. Laske pyörän halkaisija senttimetreinä senttimetrin tarkkuudella. Anna vastaus ilman yksikköä.","vastaus":72,"vinkki":"Laske ensin yhden kierroksen pituus. Se on kehä πd.","selitys":"Yksi kierros on 90 000 cm : 400 = 225 cm. Kehä on πd, joten d = 225 cm : π ≈ 71,62 cm ≈ 72 cm. Vastaus 36 on säde, jos kehä on jaettu luvulla 2π."},{"id":"H11","ryhma":"monivaihe","kysymys":"Kireä hihna kiertää ulkopuolitse kaksi samankokoista hihnapyörää, joiden säde on 14 cm. Hihnan pituus on 220 cm. Kuinka kaukana pyörien keskipisteet ovat toisistaan? Anna vastaus senttimetreinä senttimetrin tarkkuudella ilman yksikköä.","vastaus":66,"vinkki":"Hihnan pituus on kaksi suoraa osaa ja yksi kokonainen kehä.","selitys":"Kaarevat osat ovat yhteensä 2π · 14 cm ≈ 87,96 cm. Suorille osille jää 220 cm − 87,96 cm ≈ 132,04 cm, ja yksi suora osa on keskipisteiden etäisyys: 132,04 cm : 2 ≈ 66 cm."},{"id":"H12","ryhma":"monivaihe","kysymys":"Hihna yhdistää kaksi hihnapyörää. Pienemmän pyörän halkaisija on 8 cm ja suuremman 20 cm. Hihna ei luista. Kun pienempi pyörä pyörähtää 45 kierrosta, montako kierrosta suurempi pyörä pyörähtää? Anna vastaus kokonaislukuna.","vastaus":18,"vinkki":"Hihna kulkee kummankin pyörän kohdalla yhtä pitkän matkan.","selitys":"Hihna kulkee 45 · π · 8 cm = 360π cm. Suuremman pyörän kierros on 20π cm, joten se pyörähtää 360π : 20π = 18 kierrosta. Suurempi pyörä pyörii vähemmän; 112,5 syntyisi, jos suhde käännettäisiin."},{"id":"H13","ryhma":"monivaihe","kysymys":"Takalasinpyyhkimen sulka alkaa 15 cm:n päästä pyyhkimen kääntöakselista ja ulottuu 30 cm:n päähän siitä. Pyyhin kääntyy 110° ja puhdistaa sulan kulkeman alueen. Kuinka suuri alue puhdistuu? Anna vastaus neliösenttimetreinä neliösenttimetrin tarkkuudella ilman yksikköä.","vastaus":648,"vinkki":"Puhdistuva alue on suuren sektorin ja pienen sektorin erotus.","selitys":"Suuren sektorin ala on 110/360 · π · 30² cm² ja pienen 110/360 · π · 15² cm². Erotus on 110/360 · π · (900 − 225) cm² ≈ 647,95 cm² ≈ 648 cm². Vastaus 216 syntyisi, jos säteeksi otettaisiin sulan pituus 15 cm."},{"id":"H14","ryhma":"monivaihe","kysymys":"Laiva purjehtii pituuspiiriä pitkin suoraan pohjoiseen 260 km. Maapallon säde on 6 370 km. Kuinka monta astetta laivan leveysaste muuttuu? Anna vastaus asteina asteen kymmenesosan tarkkuudella ilman yksikköä.","vastaus":2.3,"vinkki":"Kuinka suuri osa koko kehästä 260 km on? Sama osa täysikulmasta on keskuskulma.","selitys":"Kehä on 2π · 6 370 km ≈ 40 024 km. Osuus on 260 : 40 024 ≈ 0,00650, ja keskuskulma on 0,00650 · 360° ≈ 2,3°."},{"id":"H15","ryhma":"ylikurssi","kysymys":"Juoksuradan kaarre on puoliympyrä. Sisemmän radan juoksulinjan säde kaarteessa on 41,30 m ja viereisen ulomman radan 42,58 m. Kuinka paljon pidempi on ulomman radan kaarre kuin sisemmän? Anna vastaus senttimetreinä senttimetrin tarkkuudella ilman yksikköä.","vastaus":402,"vinkki":"Kaarteiden pituudet ovat πr. Vähennä ne toisistaan tai kerro säteiden erotus π:llä.","selitys":"Ero on π · 42,58 m − π · 41,30 m = π · 1,28 m ≈ 4,0212 m ≈ 402 cm. Ero riippuu vain säteiden erotuksesta, ei siitä, kuinka suuri kaarre on."},{"id":"H16","ryhma":"ylikurssi","kysymys":"Kaupunki on 59,5° pohjoista leveyttä. Maapallon säde on 6 370 km. Kuinka kaukana kaupunki on pohjoisnavasta pitkin maanpintaa mitattuna? Anna vastaus kilometreinä kymmenen kilometrin tarkkuudella ilman yksikköä.","vastaus":3390,"vinkki":"Pohjoisnapa on 90° pohjoista leveyttä.","selitys":"Keskuskulma on 90° − 59,5° = 30,5°. Kaari on 30,5/360 · 2π · 6 370 km ≈ 3 391 km ≈ 3 390 km. Vastaus noin 6 615 km syntyisi, jos keskuskulmana käytettäisiin leveysastetta 59,5°: se on matka päiväntasaajalle."},{"id":"H17","ryhma":"ylikurssi","kysymys":"Kahden samankokoisen hihnapyörän säde on 11 cm, ja niiden keskipisteiden etäisyys on 30 cm. Kireä hihna kiertää pyörät ulkopuolitse. Laske hihnan pituus senttimetreinä senttimetrin tarkkuudella. Anna vastaus ilman yksikköä.","vastaus":129,"vinkki":"Piirrä mallikuvio: kaksi suoraa osaa ja kaksi puoliympyrää.","selitys":"Suorat osat ovat tangentteja, joten säteet ovat kohtisuorassa niitä vastaan ja kumpikin suora osa on 30 cm. Kaksi puoliympyrää on yksi kehä 2π · 11 cm ≈ 69,12 cm. Hihna on 60 cm + 69,12 cm ≈ 129 cm. Vastaus 95 syntyisi yhdellä puoliympyrällä ja 198 kahdella kokonaisella kehällä."},{"id":"H18","ryhma":"ylikurssi","kysymys":"Kellohame leikataan kankaasta ympyrärenkaan muotoisena kappaleena: renkaan sisäreuna on vyötärö ja ulkoreuna helma. Vyötärön ympärysmitta on 56 cm ja hameen pituus eli renkaan leveys 65 cm. Laske renkaan pinta-ala neliömetreinä 0,01 m²:n tarkkuudella. Anna vastaus ilman yksikköä.","vastaus":1.69,"vinkki":"Vyötärön ympärysmitta on sisäympyrän kehä. Ratkaise siitä sisäsäde, ja ulkosäde on sisäsäde plus hameen pituus.","selitys":"Sisäsäde r = 56 cm : (2π) ≈ 8,91 cm ja ulkosäde R = r + 65 cm ≈ 73,91 cm. Renkaan ala on π(R² − r²) ≈ 16 913 cm² ≈ 1,69 m², koska 1 m² = 10 000 cm². Vastaus 1,33 syntyisi, jos renkaan alaksi otettaisiin π · 65² cm²."},{"id":"H19","ryhma":"ylikurssi","kysymys":"Kolme samankokoista putkea, joiden säde on 15 cm, on niputettu niin, että jokainen putki koskettaa kahta muuta. Nipun ympärille kiristetään vanne. Laske vanteen pituus senttimetreinä senttimetrin tarkkuudella. Anna vastaus ilman yksikköä.","vastaus":184,"vinkki":"Keskipisteet ovat tasasivuisen kolmion kärjissä. Kuinka suuret kaaret vanne kiertää kunkin putken kohdalla?","selitys":"Keskipisteiden etäisyys on 2 · 15 cm = 30 cm, ja suoria osia on kolme, yhteensä 90 cm. Kunkin putken kohdalla kaaren keskuskulma on 360° − 90° − 90° − 60° = 120°, ja kolme kaarta ovat yhteensä 360° eli kehä 2π · 15 cm ≈ 94,25 cm. Vanne on 90 cm + 94,25 cm ≈ 184 cm."},{"id":"H20","ryhma":"ylikurssi","kysymys":"Köysi kiristetään maapallon ympäri päiväntasaajaa pitkin. Sitten köyttä pidennetään niin, että se kiertää maapallon kaikkialla 0,4 m:n korkeudella maanpinnasta. Kuinka paljon köyttä tarvitaan lisää? Anna vastaus senttimetreinä senttimetrin tarkkuudella ilman yksikköä.","vastaus":251,"vinkki":"Kirjoita kehät 2πR ja 2π(R + 0,4 m) ja vähennä.","selitys":"Lisäys on 2π(R + 0,4 m) − 2πR = 2π · 0,4 m ≈ 2,5133 m ≈ 251 cm. Maapallon sädettä ei tarvita, koska se häviää vähennyslaskussa."}],"valmis_teksti":"Osaat ratkaista ympyrän kehää, kaarta ja sektoria koskevia ylikurssitehtäviä: laskea kahden samalla pituuspiirillä olevan paikan etäisyyden leveysasteista, hihnan pituuden kahden samankokoisen pyörän ympäri, täysien kierrosten määrän ja ympyrärenkaan muotoisen kappaleen pinta-alan. Tunnistat tehtävästä kaaren, keskuskulman ja tangentin, piirrät mallikuvion ja perustelet jokaisen välivaiheen. Tämä taito on nyt näytetty."};

const svg=document.getElementById("nlsvg"), rng=document.getElementById("nlrange"), out=document.getElementById("nlout");
const X0=34, X1=606, Y=62;
function piirraNL(v){
  const ala=Math.floor(v/10)*10, yla=ala+10, puoli=ala+5;
  const pyor = (v%10)>=5 ? yla : ala;
  const x = n => X0 + (n/100)*(X1-X0);
  let s=`<line class="rail" x1="${X0}" y1="${Y}" x2="${X1}" y2="${Y}"/>`;
  for(let n=0;n<=100;n+=10){
    const near = (n===ala||n===yla);
    s+=`<line class="tick" x1="${x(n)}" y1="${Y-7}" x2="${x(n)}" y2="${Y+7}"/>`;
    s+=`<text class="stop${near?" near":""}" x="${x(n)}" y="${Y+24}" text-anchor="middle">${n}</text>`;
  }
  s+=`<line class="halfway" x1="${x(puoli)}" y1="${Y-16}" x2="${x(puoli)}" y2="${Y+12}"/>`;
  s+=`<text class="stop" x="${x(puoli)}" y="${Y-22}" text-anchor="middle">puoliväli ${puoli}</text>`;
  s+=`<circle class="dot" cx="${x(v)}" cy="${Y}" r="6"/>`;
  s+=`<text class="val" x="${x(v)}" y="${Y-32}" text-anchor="middle">${v}</text>`;
  s+=`<path d="M ${x(v)} ${Y+38} L ${x(pyor)} ${Y+38}" stroke="var(--core)" stroke-width="2" fill="none"/>`;
  s+=`<path d="M ${x(pyor)} ${Y+38} l ${x(pyor)>x(v)?-7:7} -4 l 0 8 z" fill="var(--core)"/>`;
  svg.innerHTML=s;
  out.textContent = `${v} pyöristyy → ${pyor}`;
}

const ljExp=document.getElementById("ljExp");

  let ljI=0, ljTokens=[], ljStep=0;
  const laske=(a,op,b)=>{a=+a;b=+b;return op==="×"?a*b:op==="÷"?a/b:op==="+"?a+b:a-b;};
  function ljAlku(){
    const l=D.kokeilu[ljI];
    ljTokens=l.lauseke.replace(/\(/g,"( ").replace(/\)/g," )").split(/\s+/).filter(Boolean);

  }
  function ljViesti(t,lk){const f=document.getElementById("ljFb"); f.textContent=t; f.className="lj-fb "+(lk||"");}
  function ljPiirra(){
    const l=D.kokeilu[ljI];
    document.getElementById("ljStep").textContent =
      ljStep>=l.askeleet.length ? "valmis" : `askel ${ljStep+1} / ${l.askeleet.length}`;
    if(ljStep>=l.askeleet.length){
      ljExp.innerHTML=`<span class="valmis">${l.lauseke} = ${l.vastaus}</span>`;
      return;
    }
    ljExp.innerHTML=ljTokens.map((t,i)=>
      "×÷+−".includes(t) ? `<button type="button" class="op" data-i="${i}">${t}</button>`
                         : `<span class="tok">${t}</span>`).join("");
    ljExp.querySelectorAll("button.op").forEach(b=>b.addEventListener("click",()=>ljKlikkaa(+b.dataset.i)));
  }
  function ljKlikkaa(i){
    const l=D.kokeilu[ljI], odotettu=l.askeleet[ljStep];
    const ehdotus=[ljTokens[i-1],ljTokens[i],ljTokens[i+1]].join(" ");
    if(ehdotus!==odotettu){
      ljViesti(ljStep===0
        ? "Ei vielä. Sulkeet ovat vahvimmat, sitten kerto ja jako. Yhtä vahvat vasemmalta oikealle."
        : "Ei vielä. Kumpi jäljellä olevista on vahvempi?", "no");
      return;
    }
    const arvo=laske(ljTokens[i-1],ljTokens[i],ljTokens[i+1]);
    let alku=i-1, loppu=i+1;
    if(ljTokens[i-2]==="(" && ljTokens[i+2]===")"){ alku=i-2; loppu=i+2; }
    ljTokens.splice(alku, loppu-alku+1, String(arvo));
    ljStep++;
    ljViesti(ljStep>=l.askeleet.length ? "Valmis. Vastaus on "+l.vastaus+"." : "Oikein. Jatka seuraavaan.", "ok");
    ljPiirra();
  }

    ljI=(ljI+1)%D.kokeilu.length; ljAlku();

}

/* Suomalainen lukumuoto: välilyönti on tuhaterotin, pilkku desimaalierotin.
   Piste voi olla kumpi tahansa. Se tulkitaan tuhaterottimeksi VAIN silloin, kun
   koko luku on aitoa tuhaterotinmuotoa: alkuosa 1–3 numeroa ilman etunollaa ja
   jokainen jatko-osa täsmälleen 3 numeroa (1.500, 12.345.678). Kaikissa muissa
   tapauksissa piste on desimaalipiste — myös 0.125, joka vanhalla säännöllä
   ("3 numeroa pisteen jäljessä = tuhaterotin") luettiin virheellisesti luvuksi 125. */
const TUHATEROTIN = /^[1-9]\d{0,2}(\.\d{3})+$/;
function lueLuku(teksti){
  // Murtoluku (3/4, -3/4) ja sekaluku (1 2/3, -1 2/3) hyväksytään sellaisinaan.
  const raaka = String(teksti).replace(/\u00a0/g, " ").trim();
  let m = raaka.match(/^(-?)(\d+)\s+(\d+)\s*\/\s*(\d+)$/);
  if(m){ const nim = Number(m[4]); if(nim === 0) return null;
    const v = Number(m[2]) + Number(m[3]) / nim; return m[1] ? -v : v; }
  m = raaka.match(/^(-?)\s*(\d+)\s*\/\s*(\d+)$/);
  if(m){ const nim = Number(m[3]); if(nim === 0) return null;
    const v = Number(m[2]) / nim; return m[1] ? -v : v; }
  let s = String(teksti).replace(/[\s\u00a0]/g, "");
  if(s === "") return null;
  if(s.indexOf(",") >= 0){
    s = s.replace(/\./g, "").replace(",", ".");
  } else if(TUHATEROTIN.test(s)){
    s = s.replace(/\./g, "");
  }
  const n = Number(s);
  return Number.isFinite(n) ? n : null;
}

function tarkista(id){
  const h=D.harjoitukset.find(x=>x.id===id);
  const kentta=document.getElementById("in-"+id);
  const fb=document.getElementById("fb-"+id);
  if(kentta.value.trim()===""){ fb.className="fb hint"; fb.textContent="Kirjoita vastaus ensin."; return; }
  const luku=lueLuku(kentta.value);
  if(luku===null){ fb.className="fb no"; fb.textContent="Vastauksen pitää olla luku tai murtoluku (esimerkiksi 3/4)."; return; }
  const oikein = Math.abs(luku - h.vastaus) < 1e-9;
  merkitseTulos(id, oikein, oikein ? "Oikein. "+h.selitys : `Ei vielä. ${h.vinkki} Kokeile uudelleen.`);
}

}

/* Kuuntelu: selain lukee tekstin ääneen omalla puhesynteesillään (englanniksi, jos laitteessa on
   englanninkielinen ääni). Ei äänitiedostoja eikä verkkoyhteyttä. Jos laite ei osaa puhua,
   teksti näytetään luettavaksi — silloin tehtävä muuttuu luetun ymmärtämiseksi, mutta ei katkea. */
function puhu(id, nopeus){
  const h=D.harjoitukset.find(x=>x.id===id); if(!h || !h.kuuntele) return;
  const vara=document.getElementById("vara-"+id);
  const naytaTeksti=syy=>{ vara.hidden=false; vara.textContent=syy+" Teksti: "+h.kuuntele; };
  if(!("speechSynthesis" in window)){ naytaTeksti("Tämä laite ei osaa lukea ääneen."); return; }
  const s=window.speechSynthesis; s.cancel();
  const u=new SpeechSynthesisUtterance(h.kuuntele);
  u.lang=h.kieli||"en-GB"; u.rate=nopeus;
  const aanet=s.getVoices(), kieli=u.lang.slice(0,2);
  const aani=aanet.find(a=>a.lang===u.lang) || aanet.find(a=>a.lang && a.lang.startsWith(kieli));
  if(aani) u.voice=aani;
  else if(aanet.length) { naytaTeksti("Laitteessa ei ole englanninkielistä ääntä."); return; }
  u.onerror=()=>naytaTeksti("Ääneen lukeminen ei onnistunut.");
  s.speak(u);
}

document.getElementById("harjoitukset").addEventListener("click",e=>{
  const k=e.target.closest("[data-kuuntele]"), hk=e.target.closest("[data-hitaasti]");
  if(k) puhu(k.dataset.kuuntele, 0.9);
  if(hk) puhu(hk.dataset.hitaasti, 0.6);
  const t=e.target.closest("[data-tarkista]"), v=e.target.closest("[data-vinkki]"), mv=e.target.closest("[data-mv]");
  if(t) tarkista(t.dataset.tarkista);
  if(mv) tarkistaMonivalinta(mv.dataset.mv, Number(mv.dataset.i), mv);
  if(v){
    const h=D.harjoitukset.find(x=>x.id===v.dataset.vinkki);
    const fb=document.getElementById("fb-"+h.id);
    fb.className="fb hint"; fb.textContent=h.vinkki;
  }
});
document.getElementById("harjoitukset").addEventListener("keydown",e=>{
  if(e.key==="Enter" && e.target.id.startsWith("in-")){ e.preventDefault(); tarkista(e.target.id.slice(3)); }
});

} // ONKO_HARJOITUKSIA

if(ONKO_HARJOITUKSIA) paivitaEdistyminen();
