<title>Vauhdin mittari</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">

<style>
:root{
  --paper:#EFF2F5; --surface:#FFFFFF; --surface-2:#F7F9FB;
  --grid:#DCE3EA; --line:#C9D3DC;
  --ink:#15222C; --ink-2:#4E626F; --ink-3:#7E8F9B;
  --core:#1B5A9E; --core-soft:#E4EDF6;
  --strong:#1F6E5C; --strong-soft:#E1F0EB;
  --chal:#9A6A16; --chal-soft:#F6EDDC;
  --alert:#A33A2B; --alert-soft:#F8E7E3;
  --shadow:0 1px 2px rgba(21,34,44,.06), 0 8px 24px -12px rgba(21,34,44,.18);
  --r:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0F161B; --surface:#18222A; --surface-2:#1D2830;
    --grid:#22303A; --line:#2E3E4A;
    --ink:#E8EFF4; --ink-2:#A3B4C0; --ink-3:#7A8B97;
    --core:#7FB2E4; --core-soft:#16303F;
    --strong:#77CDB4; --strong-soft:#123028;
    --chal:#E0B267; --chal-soft:#33270F;
    --alert:#E8907F; --alert-soft:#3A1E19;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -14px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --paper:#0F161B; --surface:#18222A; --surface-2:#1D2830;
  --grid:#22303A; --line:#2E3E4A;
  --ink:#E8EFF4; --ink-2:#A3B4C0; --ink-3:#7A8B97;
  --core:#7FB2E4; --core-soft:#16303F;
  --strong:#77CDB4; --strong-soft:#123028;
  --chal:#E0B267; --chal-soft:#33270F;
  --alert:#E8907F; --alert-soft:#3A1E19;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -14px rgba(0,0,0,.7);
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:16px; line-height:1.62;
  background-image:
    linear-gradient(to right, var(--grid) 1px, transparent 1px),
    linear-gradient(to bottom, var(--grid) 1px, transparent 1px);
  background-size:26px 26px;
}
.wrap{max-width:760px; margin:0 auto; padding:28px 20px 90px}
h1,h2,h3,h4{font-family:"Familjen Grotesk","IBM Plex Sans",system-ui,sans-serif; text-wrap:balance}

/* header */
header.top{background:var(--surface); border:1px solid var(--line); border-radius:var(--r);
  box-shadow:var(--shadow); padding:22px 24px; display:flex; gap:18px; align-items:flex-start}
.badge{flex:0 0 auto; width:54px; height:54px; border-radius:9px; display:grid; place-items:center;
  background:var(--core-soft); border:1px solid var(--core); color:var(--core)}
.badge svg{width:28px; height:28px; fill:none; stroke:currentColor; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round}
.eyebrow{font-family:"IBM Plex Mono",monospace; font-size:11px; letter-spacing:.14em;
  text-transform:uppercase; color:var(--ink-3); margin:0 0 5px}
header.top h1{margin:0; font-size:30px; font-weight:700; letter-spacing:-.015em}
header.top p{margin:5px 0 0; color:var(--ink-2); font-size:15px}
.tags{display:flex; flex-wrap:wrap; gap:5px; margin-top:11px}
.tag{font-family:"IBM Plex Mono",monospace; font-size:10.5px; letter-spacing:.05em; padding:2px 7px;
  border-radius:4px; background:var(--surface-2); border:1px solid var(--line); color:var(--ink-3)}
.tag.core{background:var(--core-soft); border-color:var(--core); color:var(--core)}

/* teksti */
article{margin-top:26px}
article h2{font-size:21px; font-weight:600; margin:32px 0 10px; letter-spacing:-.01em}
article p{margin:0 0 14px; max-width:64ch}
.lead{font-size:17.5px; color:var(--ink); border-left:3px solid var(--core); padding-left:16px; margin:0 0 8px}

.box{background:var(--surface); border:1px solid var(--line); border-radius:var(--r);
  padding:18px 22px; box-shadow:var(--shadow); margin:22px 0}
.box h3{margin:0 0 12px; font-size:16.5px; font-weight:600}
.box.warn{border-left:3px solid var(--alert)}
.box.note{border-left:3px solid var(--chal)}

ol.steps{margin:0; padding-left:0; list-style:none; counter-reset:s; display:grid; gap:12px}
ol.steps li{counter-increment:s; display:grid; grid-template-columns:auto 1fr; gap:13px; align-items:start}
ol.steps li::before{content:counter(s); font-family:"Familjen Grotesk",sans-serif; font-weight:700; font-size:14px;
  width:26px; height:26px; border-radius:50%; background:var(--core); color:#fff; display:grid; place-items:center; margin-top:2px}

ul.notes{margin:0; padding-left:19px}
ul.notes li{margin-bottom:7px}
ul.notes li:last-child{margin-bottom:0}

.tablewrap{overflow-x:auto}
table{border-collapse:collapse; width:100%; font-size:14.5px; min-width:460px}
th,td{text-align:left; padding:9px 13px; border-bottom:1px solid var(--line)}
th{font-family:"IBM Plex Mono",monospace; font-size:10.5px; letter-spacing:.1em; text-transform:uppercase;
  color:var(--ink-3); font-weight:400; background:var(--surface-2)}
tr:last-child td{border-bottom:0}
td b{color:var(--core); font-weight:600}
td:last-child{font-variant-numeric:tabular-nums; font-weight:600}

/* lukusuora */
.nl svg{width:100%; height:118px; display:block}
.nl .rail{stroke:var(--line); stroke-width:2}
.nl .tick{stroke:var(--line); stroke-width:1.5}
.nl .stop{fill:var(--ink-3); font-family:"IBM Plex Mono",monospace; font-size:11px}
.nl .stop.near{fill:var(--core); font-weight:600}
.nl .dot{fill:var(--chal)}
.nl .val{fill:var(--ink); font-family:"Familjen Grotesk",sans-serif; font-size:15px; font-weight:700}
.nl .halfway{stroke:var(--chal); stroke-dasharray:3 3; stroke-width:1.5}
.nl-controls{display:flex; align-items:center; gap:14px; margin-top:6px}
.nl-controls input{flex:1; accent-color:var(--core)}
.nl-out{font-family:"Familjen Grotesk",sans-serif; font-size:15px; font-weight:600; min-width:12.5em; text-align:right}

/* paikka-arvotaulu */
.box .ohje{margin:0 0 14px; font-size:14.5px; color:var(--ink-2)}
.nt-valinta{display:flex; flex-wrap:wrap; gap:7px; margin-bottom:16px}
.nt-valinta button{font:inherit; font-size:12.5px; font-family:"IBM Plex Mono",monospace; padding:5px 11px;
  border-radius:6px; border:1px solid var(--line); background:var(--surface-2); color:var(--ink-2); cursor:pointer}
.nt-valinta button[aria-pressed="true"]{background:var(--ink); color:var(--paper); border-color:var(--ink)}
.nt-valinta button:focus-visible{outline:2px solid var(--core); outline-offset:2px}
.nt-taulu{display:flex; flex-direction:column; gap:4px; align-items:flex-start; overflow-x:auto; padding-bottom:4px}
.nt-rivi{display:flex; gap:6px; align-items:center}
.nt-rivi .otsa{font-family:"IBM Plex Mono",monospace; font-size:9.5px; letter-spacing:.08em;
  text-transform:uppercase; color:var(--ink-3); width:52px; text-align:center}
.nt-ruutu{width:52px; height:52px; display:grid; place-items:center; border:1.5px solid var(--line);
  border-radius:7px; background:var(--surface-2); font-family:"IBM Plex Mono",monospace; font-size:24px}
.nt-ruutu.kohta{border-color:var(--core); background:var(--core-soft); color:var(--core); font-weight:500}
.nt-ruutu.ratkaiseva{border-color:var(--chal); background:var(--chal-soft); color:var(--chal); font-weight:500}
.nt-ruutu.nolla{color:var(--ink-3)}
.nt-rivi .nimi{font-size:12.5px; color:var(--ink-3); margin-left:12px; white-space:nowrap}
.nt-nuoli{font-size:17px; color:var(--chal); margin-left:6px}
.nt-selite{margin:14px 0 0; font-size:14.5px}
.nt-selite b{color:var(--core)}

/* vahvuusportaat */
.vp-tasot{display:grid; gap:9px; margin-bottom:18px}
.vp-taso{display:flex; gap:11px; align-items:flex-start; font-size:13.5px}
.vp-taso .vp-pallo{width:13px; height:13px; border-radius:4px; margin-top:5px; flex:0 0 auto}
.vp-taso[data-taso="sulkeet"] .vp-pallo{background:var(--core)}
.vp-taso[data-taso="kertojako"] .vp-pallo{background:var(--strong)}
.vp-taso[data-taso="yhteenvahennys"] .vp-pallo{background:var(--chal)}
.vp-taso strong{display:block; font-family:"Familjen Grotesk",sans-serif; font-weight:600; font-size:14.5px}
.vp-taso span{color:var(--ink-2)}
.vp-lauseke{display:flex; flex-wrap:wrap; gap:7px; align-items:flex-end; font-family:"IBM Plex Mono",monospace;
  font-size:25px; padding:10px 2px; min-height:64px}
.vp-lauseke .t{padding:2px 3px}
.vp-lauseke .op{position:relative; padding:2px 9px; border-radius:6px; font-weight:500}
.vp-lauseke .op[data-taso="sulkeet"]{background:var(--core-soft); color:var(--core)}
.vp-lauseke .op[data-taso="kertojako"]{background:var(--strong-soft); color:var(--strong)}
.vp-lauseke .op[data-taso="yhteenvahennys"]{background:var(--chal-soft); color:var(--chal)}
.vp-lauseke .op i{position:absolute; top:-9px; right:-6px; font-style:normal; font-family:"Familjen Grotesk",sans-serif;
  font-size:11px; font-weight:700; width:18px; height:18px; border-radius:50%; display:grid; place-items:center;
  background:currentColor}
.vp-lauseke .op i span{color:var(--surface)}
.vp-rivi{display:flex; align-items:center; gap:16px; margin-top:8px}
.vp-vastaus{font-family:"Familjen Grotesk",sans-serif; font-size:16px; font-weight:600; color:var(--strong)}

/* laskujärjestys-widget */
.lj-exp{display:flex; flex-wrap:wrap; gap:7px; align-items:center; font-family:"IBM Plex Mono",monospace;
  font-size:23px; padding:14px 4px; min-height:62px}
.lj-exp .tok{padding:2px 4px; color:var(--ink)}
.lj-exp button.op{font-family:"IBM Plex Mono",monospace; font-size:23px; padding:3px 12px; border-radius:7px;
  border:1.5px solid var(--line); background:var(--surface-2); color:var(--ink); line-height:1.2}
.lj-exp button.op:hover{border-color:var(--core); color:var(--core)}
.lj-exp button.op:focus-visible{outline:2px solid var(--core); outline-offset:2px}
.lj-exp .valmis{font-family:"Familjen Grotesk",sans-serif; font-size:23px; font-weight:700; color:var(--strong)}
.lj-fb{font-size:14.5px; min-height:1.5em; color:var(--ink-2)}
.lj-fb.no{color:var(--alert)}
.lj-fb.ok{color:var(--strong)}
.lj-row{display:flex; align-items:center; gap:14px; margin-top:10px}
.lj-step{font-family:"IBM Plex Mono",monospace; font-size:11.5px; letter-spacing:.1em;
  text-transform:uppercase; color:var(--ink-3)}

/* harjoitukset */
.progress{position:sticky; top:0; z-index:5; background:var(--surface); border:1px solid var(--line);
  border-radius:var(--r); padding:12px 18px; box-shadow:var(--shadow); display:flex; align-items:center;
  gap:14px; margin:34px 0 18px}
.progress .lbl{font-family:"IBM Plex Mono",monospace; font-size:11px; letter-spacing:.12em;
  text-transform:uppercase; color:var(--ink-3); white-space:nowrap}
.progress .meter{flex:1; height:7px; border-radius:4px; background:var(--surface-2); border:1px solid var(--line); overflow:hidden}
.progress .meter i{display:block; height:100%; background:var(--core); transition:width .25s ease}
.progress .cnt{font-family:"Familjen Grotesk",sans-serif; font-weight:700; font-variant-numeric:tabular-nums; white-space:nowrap}

.grp{margin-top:26px}
.grp-head{display:flex; align-items:baseline; gap:10px; border-bottom:1.5px solid var(--ink); padding-bottom:7px; margin-bottom:14px}
.grp-head h3{margin:0; font-size:17px; font-weight:600}
.grp-head span{font-size:12.5px; color:var(--ink-2)}

.ex{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:14px 16px; margin-bottom:10px}
.ex[data-tila="oikein"]{border-color:var(--strong); box-shadow:inset 3px 0 0 var(--strong)}
.ex[data-tila="vaarin"]{border-color:var(--alert); box-shadow:inset 3px 0 0 var(--alert)}
.ex .q{display:flex; gap:11px; align-items:baseline; flex-wrap:wrap}
.ex .num{font-family:"IBM Plex Mono",monospace; font-size:11.5px; color:var(--ink-3); min-width:2.4em}
.ex .txt{flex:1; min-width:190px; font-size:15.5px}
.ex .txt .aineisto{display:block; margin-bottom:9px; padding-left:12px;
  border-left:2px solid var(--line); color:var(--ink-2); line-height:1.6;
  /* Aineisto voi olla pieni taulukko, jonka rivit on erotettu rivinvaihdoilla.
     Ilman pre-lineä ne valuisivat yhdeksi kappaleeksi ja taulukko katoaisi. */
  white-space:pre-line}
.ex .txt .kysymysrivi{display:block; font-weight:600}
.ex .row{display:flex; gap:8px; align-items:center; margin-top:11px; flex-wrap:wrap}
.ex input[type=text]{font:inherit; font-family:"IBM Plex Mono",monospace; font-size:15px; width:8.5em;
  padding:7px 11px; border:1px solid var(--line); border-radius:7px; background:var(--surface-2);
  color:var(--ink); text-align:right}
.ex input:focus-visible{outline:2px solid var(--core); outline-offset:1px}
button{font:inherit; cursor:pointer}
.btn{font-size:13.5px; padding:7px 15px; border-radius:7px; border:1px solid var(--core);
  background:var(--core); color:#fff}
.btn.ghost{background:transparent; color:var(--ink-2); border-color:var(--line)}
.btn:focus-visible{outline:2px solid var(--core); outline-offset:2px}
.btn.mv-valinta{text-align:left}
/* kuuntelutehtävä: selaimen puhesynteesi lukee englanninkielisen tekstin */
.kuuntele{display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin:2px 0 10px}
.kuuntele .btn{display:inline-flex; gap:7px; align-items:center}
.kuuntele svg{width:16px; height:16px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round}
.kuuntele .varateksti{flex-basis:100%; font-size:14px; color:var(--ink-2); background:var(--surface-2);
  border-radius:7px; padding:8px 12px; margin:0}
.btn.mv-valinta:disabled{cursor:default; opacity:.65}
.btn.mv-oikein{background:var(--strong-soft); border-color:var(--strong); color:var(--strong); opacity:1}
.btn.mv-vaarin{background:var(--alert-soft); border-color:var(--alert); color:var(--alert); opacity:1}
.row.mv{gap:8px 10px}
.fb{margin-top:11px; font-size:14.5px; padding:10px 13px; border-radius:8px; line-height:1.5}
.fb.ok{background:var(--strong-soft); color:var(--strong)}
.fb.no{background:var(--alert-soft); color:var(--alert)}
.fb.hint{background:var(--chal-soft); color:var(--chal)}

.done{background:var(--strong-soft); border:1px solid var(--strong); color:var(--strong);
  border-radius:var(--r); padding:16px 20px; margin-top:20px; font-size:15.5px}
.done h3{margin:0 0 4px; font-size:17px; color:var(--strong)}

details.teacher{margin-top:34px; background:var(--surface); border:1px solid var(--line);
  border-left:3px solid var(--chal); border-radius:var(--r); padding:15px 20px; box-shadow:var(--shadow)}
details.teacher summary{cursor:pointer; font-family:"Familjen Grotesk",sans-serif; font-weight:600; font-size:15px}
details.teacher summary:focus-visible{outline:2px solid var(--core); outline-offset:3px}
details.teacher ul{margin:12px 0 0; padding-left:19px; color:var(--ink-2); font-size:14.5px}
details.teacher li{margin-bottom:8px}
details.teacher p{margin:12px 0 0; color:var(--ink-2); font-size:14.5px}

.back{display:inline-block; margin-top:30px; font-size:13.5px; color:var(--ink-2)}
.back a{color:var(--core)}

@media (prefers-reduced-motion: reduce){*{transition:none !important}}
@media (max-width:560px){
  .wrap{padding:16px 13px 70px}
  header.top h1{font-size:25px}
  .progress{flex-wrap:wrap}
}
</style>

<div class="wrap">

  <header class="top">
    <span class="badge"><svg viewBox="0 0 24 24" aria-hidden="true" id="ikoni"></svg></span>
    <div>
      <p class="eyebrow" id="eyebrow"></p>
      <h1 id="otsikko"></h1>
      <p id="kuvaus"></p>
      <div class="tags" id="tags"></div>
    </div>
  </header>

  <article id="teksti"></article>

  <div class="progress" aria-live="polite">
    <span class="lbl">Harjoitukset</span>
    <span class="meter"><i id="pbar" style="width:0%"></i></span>
    <span class="cnt" id="pcnt">0 / 20</span>
  </div>

  <div id="harjoitukset"></div>
  <div id="valmis"></div>

  <p class="back" id="back"></p>

</div>

<script>
const D = {"tavoite_id":"MAT8-VER-05","oppiaine":"MAT","vuosiluokka":8,"otsikko":"Vauhdin mittari","kuvaus":"Osaan ratkaista nopeutta, matkaa ja aikaa koskevia tehtäviä laskemalla ja kuvaajan avulla.","versio":"0.2","paivitetty":"2026-10-11","ops":{"T":["T5","T7","T15"],"S":["S3","S4"]},"taso":"haaste","ikoni":"liike","eyebrow":"Matematiikka · 8. luokka · Suhde ja verrannollisuus","teksti":[{"tyyppi":"johdanto","sisalto":"Koulun kohdalla nopeusrajoitus on 30 km/h. Se kuulostaa hitaalta, mutta muunna se metreiksi sekuntia kohden: 30 km/h on noin 8,3 m/s. Jos kuljettaja vilkaisee puhelinta kolmen sekunnin ajan, auto kulkee sinä aikana noin 25 metriä eli suunnilleen kahden linja-auton mitan ilman, että kukaan katsoo tietä. Nopeus, matka ja aika liittyvät toisiinsa yhdellä kaavalla, mutta tehtävät muuttuvat vaikeiksi, kun yksiköt ovat sekaisin, kun liikkujia on kaksi tai kun nopeus vaihtelee matkan aikana. Tässä taidossa opit muuntamaan nopeuksia yksiköiden km/h ja m/s välillä ja perustelemaan muuntokertoimen 3,6, lukemaan nopeuden aika–matka-kuvaajasta, ratkaisemaan kohtaamis- ja kiinniottotehtäviä laskemalla ja piirtämällä sekä laskemaan keskinopeuden oikein. Mukana on vanhoja ylioppilastehtäviä mukailevia ongelmia. Laskin on sallittu, mutta kertoimen 3,6 perustelet ilman laskinta."},{"tyyppi":"kappale","otsikko":"Nopeus, matka ja aika","sisalto":"Nopeus kertoo, kuinka pitkä matka kuljetaan aikayksikköä kohden. Kaava on v = s/t, jossa v on nopeus, s matka ja t aika. Kaavan olet jo ratkaissut muihin muotoihin: matka on s = vt ja aika t = s/v. Keskinopeus tarkoittaa, että koko matka jaetaan koko ajalla, vaikka nopeus olisi välillä vaihdellut. Yksiköt kulkevat laskussa mukana: kun matka on kilometreinä ja aika tunteina, nopeus on yksikössä km/h, ja kun matka on metreinä ja aika sekunteina, nopeus on yksikössä m/s. Ennen kuin sijoitat luvut kaavaan, tee yksiköt yhteensopiviksi. Jos nopeus on yksikössä km/h ja aika on annettu minuutteina, muunna aika tunneiksi: 48 min = 48/60 h = 0,8 h. Silloin 0,8 h nopeudella 65 km/h kuljetaan 65 km/h · 0,8 h = 52 km. Jos lasket aikaa ja saat tunnit desimaalilukuna, muunna desimaaliosa minuuteiksi kertomalla se luvulla 60: 1,4 h = 1 h + 0,4 · 60 min = 1 h 24 min. Samalla matkalla nopeus ja aika ovat kääntäen verrannollisia, koska niiden tulo on matka: kaksinkertainen nopeus puolittaa ajan. Prosenttimuutokset lasketaan kertoimilla. Kun nopeus kasvaa 60 %, aika kerrotaan luvulla 1 : 1,6 = 0,625, joten aika lyhenee 37,5 % eikä 60 %. Jos nopeusmittari näyttää 5 % liikaa, mittarin lukema on 105 % todellisesta nopeudesta. Kun mittari näyttää 84 km/h, todellinen nopeus on 84 km/h : 1,05 = 80 km/h, ei 84 km/h · 0,95 = 79,8 km/h. Tarkista lopuksi, onko vastaus järkevä. Kävelijä etenee noin 5 km/h, pyöräilijä yleensä 15–25 km/h ja auto maantiellä 80–100 km/h. Jos pyöräilijän nopeudeksi tulee 400 km/h tai koulumatkaan kuluu 30 tuntia, laskussa on lähes varmasti yksikkövirhe."},{"tyyppi":"kappale","otsikko":"Miksi kerroin on 3,6","sisalto":"Nopeus 1 m/s tarkoittaa, että joka sekunti kuljetaan yksi metri. Tunnissa on 60 · 60 = 3 600 sekuntia, joten tunnissa kuljetaan 3 600 metriä eli 3,6 kilometriä. Siis 1 m/s = 3 600 m/h = 3,6 km/h. Kun nopeus on yksikössä m/s, kerro se luvulla 3,6, niin saat sen yksikössä km/h: 25 m/s = 25 · 3,6 km/h = 90 km/h. Toiseen suuntaan jaa luvulla 3,6: 108 km/h = 108 : 3,6 m/s = 30 m/s. Ilman laskinta jakolasku helpottuu, kun kerrot molemmat luvut kymmenellä: 108 : 3,6 = 1 080 : 36 = 30. Samaan tulokseen pääset myös toista reittiä: 1 km/h = 1 000 m : 3 600 s = 1/3,6 m/s. Suunnan voi perustella ilman kaavaa. Kun yksikkö m/s vaihdetaan yksikköön km/h, aikayksikkö kasvaa 3 600-kertaiseksi, jolloin lukema kasvaa 3 600-kertaiseksi, ja pituusyksikkö kasvaa 1 000-kertaiseksi, jolloin lukema pienenee tuhannesosaan. Yhteensä lukema kerrotaan luvulla 3 600 : 1 000 = 3,6. Siksi sama nopeus on km/h-lukuna aina suurempi luku kuin m/s-lukuna, kun nopeus ei ole nolla."},{"tyyppi":"kappale","otsikko":"Aika–matka-kuvaaja","sisalto":"Aika–matka-kuvaajassa vaaka-akselilla on aika tai kellonaika ja pystyakselilla etäisyys lähtöpaikasta. Kun aika mitataan liikkujan lähtöhetkestä ja liikkuja etenee lähtöpaikasta tasaisella nopeudella, kuvaaja on origosta lähtevä nouseva suora tai jana: matka on suoraan verrannollinen aikaan, ja nopeus on verrannollisuuskerroin. Jos vaaka-akselilla on kellonaika, myöhemmin lähtevän kuvaaja alkaa vaaka-akselilta lähtöhetken kohdalta. Nopeuden saat kuvaajan suoran osan mistä tahansa kahdesta pisteestä: jaa matkan muutos ajan muutoksella. Esimerkiksi kuvaajan suora osa kulkee pisteiden (10 min, 2 km) ja (25 min, 8 km) kautta. Matka kasvaa 8 km − 2 km = 6 km, ja aikaa kuluu 25 min − 10 min = 15 min = 0,25 h. Nopeus on 6 km : 0,25 h = 24 km/h. Jos jakaisit suoraan 6 : 15, saisit 0,4, mutta sen yksikkö on km/min eikä km/h. Kuvaajan muodosta näet liikkeen vaiheet. Samassa koordinaatistossa jyrkemmin nouseva osa tarkoittaa suurempaa nopeutta. Vaakasuora osa tarkoittaa, että etäisyys ei muutu: liikkuja on pysähtynyt. Laskeva osa tarkoittaa, että liikkuja lähestyy pistettä, josta etäisyys mitataan (esimerkiksi palaa kohti lähtöpaikkaa). Keskinopeus lasketaan koko ajalta pysähdykset mukaan lukien: kokonaismatka jaetaan kokonaisajalla. Kun kahden liikkujan kuvaajat piirretään samaan koordinaatistoon, niiden leikkauspiste kertoo, milloin ja missä liikkujat ovat samassa paikassa."},{"tyyppi":"saanto","otsikko":"Esimerkki 1: kohtaaminen laskemalla","askeleet":["Tehtävä: Kaupunkien P ja Q välimatka on 175 km. Auto A lähtee P:stä kello 9.00 kohti Q:ta nopeudella 80 km/h. Auto B lähtee Q:sta kello 9.30 kohti P:tä nopeudella 70 km/h. Milloin ja kuinka kaukana P:stä autot kohtaavat?","Suunnitelma ennen laskua: (1) Lasken, kuinka pitkälle A ehtii ennen kuin B lähtee. (2) Sen jälkeen autot ajavat toisiaan kohti, joten niiden välimatka lyhenee nopeuksien summalla. Lasken ajan, joka jäljellä olevaan välimatkaan kuluu. (3) Muutan ajan kellonajaksi ja lasken A:n etäisyyden P:stä. (4) Tarkistan B:n matkalla.","Vaihe 1. Puolessa tunnissa A ajaa 80 km/h · 0,5 h = 40 km. Kello 9.30 autojen välimatka on 175 km − 40 km = 135 km.","Vaihe 2. Kello 9.30 alkaen välimatka lyhenee joka tunti 80 km + 70 km = 150 km. Merkitään t:llä aikaa tunteina kello 9.30:stä kohtaamiseen. Silloin 150t = 135, josta t = 0,9. Tuntemattomaksi kannattaa valita aika, koska se ei joudu nimittäjään.","Vaihe 3. 0,9 h = 0,9 · 60 min = 54 min, joten autot kohtaavat kello 10.24. A on ajanut yhteensä 1 h 24 min = 1,4 h, joten etäisyys P:stä on 80 km/h · 1,4 h = 112 km.","Vaihe 4. Tarkistus: B on ajanut 0,9 h ja kulkenut 70 km/h · 0,9 h = 63 km. Yhteensä 112 km + 63 km = 175 km, mikä on koko välimatka. Tulos on järkevä: kohtaaminen on lähempänä Q:ta, koska B lähti myöhemmin ja ajaa hitaammin.","Saman voi ratkaista yhdellä yhtälöllä: kun B on ajanut t tuntia, A on ajanut t + 0,5 tuntia, joten 80(t + 0,5) + 70t = 175. Siitä 150t + 40 = 175 ja t = 0,9."]},{"tyyppi":"saanto","otsikko":"Esimerkki 2: kiinniotto piirtämällä ja laskemalla","askeleet":["Tehtävä: Kävelijä lähtee kello 8.00 nopeudella 6 km/h. Pyöräilijä lähtee samasta paikasta samaa reittiä kello 8.40 nopeudella 18 km/h. Milloin ja kuinka kaukana lähtöpaikasta pyöräilijä saavuttaa kävelijän?","Suunnitelma ennen piirtämistä: (1) Valitsen akselit ja asteikot. (2) Lasken kummallekin kuvaajalle kaksi pistettä ja piirrän suorat. (3) Luen leikkauspisteen. (4) Tarkistan laskemalla.","Vaihe 1. Vaaka-akselille kellonaika 8.00–9.20 niin, että yksi ruutu on 10 min, ja pystyakselille etäisyys lähtöpaikasta 0–12 km niin, että yksi ruutu on 1 km. Akselien nimet ovat kellonaika ja etäisyys lähtöpaikasta (km).","Vaihe 2. Kävelijä: alkupiste (8.00, 0 km), ja 1 h 20 min = 4/3 h myöhemmin hän on kohdassa 6 km/h · 4/3 h = 8 km, joten toinen piste on (9.20, 8 km). Pyöräilijä: alkupiste (8.40, 0 km), ja 40 min = 2/3 h myöhemmin hän on kohdassa 18 km/h · 2/3 h = 12 km, joten toinen piste on (9.20, 12 km). Piirrä kummankin pisteparin kautta suora viivaimella.","Vaihe 3. Suorat leikkaavat pisteessä (9.00, 6 km). Pyöräilijä saavuttaa kävelijän kello 9.00, 6 km:n päässä lähtöpaikasta. Kuvaajasta luettu arvo on likiarvo, jos leikkauspiste ei osu ruudukon viivoille. Siksi tarkistus laskemalla kuuluu ratkaisuun.","Vaihe 4. Tarkistus: kello 8.40 kävelijällä on etumatkaa 6 km/h · 2/3 h = 4 km. Kiinniotossa etumatka kuroutuu nopeuksien erotuksella 18 km/h − 6 km/h = 12 km/h, joten aikaa kuluu 4 km : 12 km/h = 1/3 h = 20 min. Kello on 9.00, ja pyöräilijä on ajanut 18 km/h · 1/3 h = 6 km. Kävelijä on kulkenut tunnin ja siis myös 6 km. Tulos on järkevä: kiinniotto tapahtuu pyöräilijän lähdön jälkeen, ja molemmat ovat samassa paikassa samaan aikaan."]},{"tyyppi":"ansa","otsikko":"Ansa 1: muunnos väärään suuntaan","sisalto":"Laskussa 90 km/h · 3,6 = 324 m/s kerroin on oikea, mutta suunta on väärä. Tulos on lähes äänen nopeus ilmassa (noin 340 m/s), joten se ei voi olla auton nopeus. Oikein: 90 km/h = 90 : 3,6 m/s = 25 m/s. Virhe syntyy, kun kerroin 3,6 muistetaan ilman perustelua. Tarkista suunta säännöllä, jonka perustelit: sama nopeus on km/h-lukuna suurempi luku kuin m/s-lukuna. Kun muutat yksiköstä km/h yksikköön m/s, lukeman pitää siis pienentyä, joten jaat luvulla 3,6. Toiseen suuntaan lukeman pitää kasvaa, joten kerrot."},{"tyyppi":"ansa","otsikko":"Ansa 2: desimaalitunnit eivät ole minuutteja","sisalto":"Juna kulkee 280 km keskinopeudella 80 km/h. Lasku 280 : 80 = 3,5 antaa ajan tunteina. Vastaus 3 h 50 min on väärin, koska 0,5 h on puoli tuntia eli 30 min. Oikein: 3,5 h = 3 h + 0,5 · 60 min = 3 h 30 min. Sama virhe tehdään toiseen suuntaan: 1 h 45 min ei ole 1,45 h vaan 1 h + 45/60 h = 1,75 h. Jos sijoitat ajan 1,45 h kaavaan s = vt, saat väärän matkan. Tunti jakautuu 60 minuuttiin eikä sataan osaan, joten tuntien desimaaliosa kerrotaan luvulla 60 ja minuutit jaetaan luvulla 60. Tarkista vertailukohdilla 0,25 h = 15 min, 0,5 h = 30 min ja 0,75 h = 45 min: desimaaliosa ja minuutit ovat samalla kohdalla näiden välissä. Esimerkiksi 0,45 h on vähän alle puoli tuntia eli vähän alle 30 min (27 min), ei 45 min."},{"tyyppi":"ansa","otsikko":"Ansa 3: keskinopeus ei ole nopeuksien keskiarvo","sisalto":"Ajat mökille 60 km nopeudella 30 km/h ja takaisin saman 60 km nopeudella 60 km/h. Houkutteleva vastaus on (30 + 60) : 2 = 45 km/h, mutta se on väärin. Keskinopeus on kokonaismatka jaettuna kokonaisajalla. Menomatkaan kuluu 60 km : 30 km/h = 2 h ja paluumatkaan 60 km : 60 km/h = 1 h. Keskinopeus on 120 km : 3 h = 40 km/h. Keskiarvo antaa väärän tuloksen, koska hitaammalla nopeudella ajetaan pidempään: kaksi tuntia hitaammin ja vain tunti nopeammin. Kun osuudet ovat yhtä pitkiä ja nopeudet eri suuret, keskinopeus on aina pienempi kuin nopeuksien keskiarvo. Laske siksi ensin jokaisen osuuden aika ja matka, sitten kokonaismatka ja kokonaisaika. Tarkista lopuksi: jos matkalla ei pysähdytä, keskinopeus on hitaimman ja nopeimman osuuden nopeuden välissä. Tämä tarkistus ei paljasta nopeuksien keskiarvoa, koska sekin on välissä. Keskiarvovirheen paljastaa edellinen sääntö: kun osuudet ovat yhtä pitkiä, oikea keskinopeus on keskiarvoa pienempi. Samalla ajatuksella ratkaiset, millä nopeudella loppumatka pitää ajaa. Matka on 30 km, ja ensimmäiset 10 km ajat nopeudella 20 km/h. Jotta keskinopeus olisi 30 km/h, koko matkaan saa kulua 30 km : 30 km/h = 1 h. Ensimmäiseen osuuteen kuluu 10 km : 20 km/h = 0,5 h, joten loput 20 km on ajettava puolessa tunnissa eli nopeudella 20 km : 0,5 h = 40 km/h. Jos tavoite olisi 60 km/h, koko matkaan saisi kulua vain 30 km : 60 km/h = 0,5 h, ja se kuluu jo ensimmäiseen osuuteen. Kun ensimmäiseen osuuteen kuluu jo koko sallittu aika tai enemmän, tavoitekeskinopeus on mahdoton, ajoipa loppumatkan kuinka nopeasti tahansa."},{"tyyppi":"ansa","otsikko":"Ansa 4: nopeudet väärin yhteen tai erotukseksi","sisalto":"Kun kaksi liikkujaa kulkee toisiaan kohti, niiden välimatka lyhenee joka tunti molempien kulkemien matkojen verran, joten nopeudet lasketaan yhteen. Kun nopeampi ajaa hitaamman perässä samaan suuntaan, välimatka lyhenee joka tunti vain nopeuksien erotuksen verran. Esimerkin 1 autoilla erotus 80 km/h − 70 km/h = 10 km/h antaisi kohtaamiseen 135 km : 10 km/h = 13,5 h, vaikka autot ajavat toisiaan kohti. Esimerkin 2 pyöräilijällä summa 18 km/h + 6 km/h = 24 km/h antaisi kiinniottoon 4 km : 24 km/h = 1/6 h = 10 min, mutta silloin pyöräilijä olisi 3 km:n ja kävelijä 5 km:n päässä lähtöpaikasta. Toinen yleinen virhe on sekoittaa minuutit ja km/h. Jos juoksija on kulkenut 25 min nopeudella 12 km/h, hänen etumatkansa ei ole 12 · 25 = 300 km vaan 12 km/h · 25/60 h = 5 km. Kirjoita yksiköt jokaiseen välivaiheeseen ja muuta minuutit tunneiksi ennen kuin kerrot nopeudella."}],"harjoitusryhmat":[{"id":"tyokalut","nimi":"Työkalut","info":"Laskin on sallittu. Muuta yksiköt yhteensopiviksi ennen kuin sijoitat luvut kaavaan. Anna vastaus ilman yksikköä siinä yksikössä, jota kysytään."},{"id":"vaiheet","nimi":"Kaksi vaihetta tai useampi","info":"Laskin on sallittu. Kirjoita vihkoon ensin suunnitelma: mitä lasket ensin ja missä yksikössä. Anna vastaus ilman yksikköä."},{"id":"ylikurssi","nimi":"Ylikurssi","info":"Laskin on sallittu. Tehtävät mukailevat vanhoja ylioppilastehtäviä. Laske jokaisen osuuden aika ja matka erikseen ja tarkista lopuksi, onko vastaus järkevä. Anna vastaus ilman yksikköä."}],"harjoitukset":[{"id":"H01","ryhma":"tyokalut","kysymys":"Muunna 63 km/h yksikköön m/s. Anna vastaus ilman yksikköä.","vastaus":17.5,"vinkki":"Lukeman pitää pienentyä, joten jaa luvulla 3,6.","selitys":"63 : 3,6 = 17,5, joten 63 km/h = 17,5 m/s. Vastaus 226,8 syntyy, jos kerrot luvulla 3,6: lukema kasvaisi, vaikka sen pitää pienentyä."},{"id":"H02","ryhma":"tyokalut","kysymys":"Muunna 12 m/s yksikköön km/h. Anna vastaus ilman yksikköä.","vastaus":43.2,"vinkki":"Sama nopeus on km/h-lukuna suurempi luku, joten kerro luvulla 3,6.","selitys":"12 · 3,6 = 43,2, joten 12 m/s = 43,2 km/h. Tarkistus: 1 m/s = 3,6 km/h, joten 12 m/s on 12 kertaa 3,6 km/h."},{"id":"H03","ryhma":"tyokalut","kysymys":"Nopeus 1 m/s tarkoittaa, että joka sekunti kuljetaan 1 metri. Montako metriä kuljetaan tällä nopeudella yhdessä tunnissa?","vastaus":3600,"vinkki":"Montako sekuntia on tunnissa?","selitys":"Tunnissa on 60 · 60 = 3 600 sekuntia, joten tunnissa kuljetaan 3 600 m eli 3,6 km. Siksi 1 m/s = 3,6 km/h."},{"id":"H04","ryhma":"tyokalut","kysymys":"Pyöräretken pituus on 51 km, ja keskinopeus on 20 km/h. Retki kestää 2 h ja montako minuuttia?","vastaus":33,"vinkki":"Laske aika t = s/v tunteina ja kerro desimaaliosa luvulla 60.","selitys":"51 : 20 = 2,55 h. Desimaaliosa 0,55 h = 0,55 · 60 min = 33 min, joten retki kestää 2 h 33 min. Vastaus 55 syntyy, jos desimaaliosa luetaan minuutteina."},{"id":"H05","ryhma":"tyokalut","kysymys":"Aika–matka-kuvaaja on jana origosta pisteeseen (25 min, 15 km). Mikä on nopeus? Anna vastaus yksikössä km/h ilman yksikköä.","vastaus":36,"vinkki":"Muuta 25 min tunneiksi ennen kuin jaat.","selitys":"25 min = 25/60 h. Nopeus on 15 km : 25/60 h = 15 · 60/25 km/h = 36 km/h. Lasku 15 : 25 = 0,6 antaa nopeuden yksikössä km/min."},{"id":"H06","ryhma":"tyokalut","kysymys":"Ajat 40 min keskinopeudella 72 km/h. Kuinka pitkän matkan ajat? Anna vastaus kilometreinä ilman yksikköä.","vastaus":48,"vinkki":"40 min on 40/60 tuntia.","selitys":"s = vt = 72 km/h · 40/60 h = 48 km. Vastaus 28,8 syntyy, jos 40 min kirjoitetaan 0,40 tunniksi."},{"id":"H07","ryhma":"vaiheet","kysymys":"Juna kulkee keskinopeudella 35 m/s. Kauanko 189 km:n matka kestää? Anna vastaus tunteina desimaalilukuna ilman yksikköä.","vastaus":1.5,"vinkki":"Muunna ensin nopeus yksikköön km/h.","selitys":"35 m/s = 35 · 3,6 km/h = 126 km/h. Aika t = 189 km : 126 km/h = 1,5 h eli 1 h 30 min."},{"id":"H08","ryhma":"vaiheet","kysymys":"Aika–matka-kuvaaja koostuu kolmesta janasta. Ensimmäinen jana kulkee pisteestä (0 min, 0 km) pisteeseen (15 min, 4 km), toinen on vaakasuora jana pisteeseen (25 min, 4 km), ja kolmas kulkee pisteeseen (40 min, 10 km).\n\nMikä on keskinopeus koko 40 minuutin ajalta? Anna vastaus yksikössä km/h ilman yksikköä.","vastaus":15,"vinkki":"Vaakasuora jana on pysähdys. Keskinopeus lasketaan koko ajalta, pysähdys mukaan lukien.","selitys":"Kokonaismatka on 10 km ja kokonaisaika 40 min = 2/3 h. Keskinopeus on 10 km : 2/3 h = 15 km/h. Vastaus 20 syntyy, jos pysähdyksen 10 min jätetään pois."},{"id":"H09","ryhma":"vaiheet","kysymys":"Ajat ensin 45 min nopeudella 80 km/h ja sitten 20 km nopeudella 40 km/h. Mikä on koko matkan keskinopeus? Anna vastaus yksikössä km/h ilman yksikköä.","vastaus":64,"vinkki":"Laske ensimmäisen osuuden matka ja toisen osuuden aika.","selitys":"Ensimmäinen osuus: 80 km/h · 0,75 h = 60 km. Toinen osuus: 20 km : 40 km/h = 0,5 h. Kokonaismatka 80 km, kokonaisaika 1,25 h, keskinopeus 80 km : 1,25 h = 64 km/h. Nopeuksien keskiarvo 60 km/h on väärin."},{"id":"H10","ryhma":"vaiheet","kysymys":"Kaksi kaverusta lähtee samaan aikaan toisiaan kohti 9 km:n päästä toisistaan. Toinen juoksee nopeudella 10 km/h ja toinen pyöräilee nopeudella 26 km/h. Montako minuuttia kuluu kohtaamiseen?","vastaus":15,"vinkki":"Kun liikkujat kulkevat toisiaan kohti, välimatka lyhenee nopeuksien summalla.","selitys":"Välimatka lyhenee 10 + 26 = 36 km joka tunti. Aika on 9 km : 36 km/h = 0,25 h = 15 min. Tarkistus: 2,5 km + 6,5 km = 9 km."},{"id":"H11","ryhma":"vaiheet","kysymys":"Aika–matka-kuvaajien pystyakselilla on etäisyys kylästä P.\nKuvaaja 1: jana pisteestä (0 min, 0 km) pisteeseen (60 min, 15 km).\nKuvaaja 2: jana pisteestä (0 min, 15 km) pisteeseen (30 min, 0 km).\n\nMonenko minuutin kohdalla kuvaajat leikkaavat?","vastaus":20,"vinkki":"Laske kummankin nopeus kuvaajasta. Toinen liikkuu P:stä poispäin ja toinen kohti P:tä.","selitys":"Kuvaaja 1: 15 km tunnissa eli 15 km/h. Kuvaaja 2: 15 km puolessa tunnissa eli 30 km/h kohti P:tä. Alussa välimatka on 15 km, ja se lyhenee 45 km joka tunti, joten aikaa kuluu 15 : 45 = 1/3 h = 20 min. Silloin molemmat ovat 5 km:n päässä P:stä."},{"id":"H12","ryhma":"vaiheet","kysymys":"Kävelijä lähtee liikkeelle nopeudella 5 km/h. Pyöräilijä lähtee samasta paikasta samaa reittiä 30 min myöhemmin nopeudella 20 km/h. Montako minuuttia pyöräilijän lähdöstä kuluu, kunnes hän saavuttaa kävelijän?","vastaus":10,"vinkki":"Laske ensin kävelijän etumatka. Kiinniotossa etumatka kuroutuu nopeuksien erotuksella.","selitys":"Etumatka 5 km/h · 0,5 h = 2,5 km. Erotus 20 − 5 = 15 km/h. Aika 2,5 km : 15 km/h = 1/6 h = 10 min. Tarkistus: pyöräilijä 20 · 1/6 ≈ 3,33 km, kävelijä 5 · 2/3 ≈ 3,33 km."},{"id":"H13","ryhma":"vaiheet","kysymys":"Matka pysyy samana, mutta nopeus kasvaa 20 %. Montako prosenttia matka-aika lyhenee? Anna vastaus prosentteina kymmenesosan tarkkuudella ilman %-merkkiä.","vastaus":16.7,"vinkki":"Samalla matkalla aika kerrotaan luvulla 1 : 1,2.","selitys":"Nopeuden kerroin on 1,2, joten ajan kerroin on 1 : 1,2 = 0,8333… Aika on noin 83,3 % alkuperäisestä, joten se lyhenee noin 16,7 %. Vastaus 20 on väärin."},{"id":"H14","ryhma":"vaiheet","kysymys":"Mopon nopeusmittari näyttää 6 % liikaa. Mittari näyttää 53 km/h. Mikä on todellinen nopeus? Anna vastaus yksikössä km/h ilman yksikköä.","vastaus":50,"vinkki":"Mittarin lukema on 106 % todellisesta nopeudesta.","selitys":"Lukema = 1,06 · todellinen nopeus, joten todellinen nopeus on 53 : 1,06 = 50 km/h. Lasku 53 · 0,94 = 49,82 on väärin, koska prosentit lasketaan todellisesta nopeudesta."},{"id":"H15","ryhma":"ylikurssi","kysymys":"Kylien P ja Q välimatka on 100 km. Auto lähtee P:stä kohti Q:ta nopeudella 60 km/h. Toinen auto lähtee Q:sta kohti P:tä 20 min myöhemmin nopeudella 90 km/h. Kuinka kaukana P:stä autot kohtaavat? Anna vastaus kilometreinä ilman yksikköä.","vastaus":52,"vinkki":"Laske ensin, kuinka pitkälle ensimmäinen auto ehtii 20 minuutin aikana.","selitys":"20 min = 1/3 h, joten ensimmäinen auto ajaa 20 km. Jäljellä on 80 km, ja se lyhenee 150 km joka tunti: 80 : 150 h = 32 min. Ensimmäinen auto ajaa yhteensä 52 min eli 52 km. Tarkistus: toinen auto ajaa 90 km/h · 32/60 h = 48 km, ja 52 + 48 = 100."},{"id":"H16","ryhma":"ylikurssi","kysymys":"Tien varressa on pylväitä 40 metrin välein. Pyöräilijä ohittaa ensimmäisen pylvään, ja kun hän ohittaa kuudennen pylvään, on kulunut 16 s. Mikä on pyöräilijän nopeus? Anna vastaus yksikössä km/h ilman yksikköä.","vastaus":45,"vinkki":"Ensimmäisen ja kuudennen pylvään välissä on viisi väliä.","selitys":"Matka on 5 · 40 m = 200 m. Nopeus 200 m : 16 s = 12,5 m/s = 12,5 · 3,6 km/h = 45 km/h. Vastaus 54 syntyy, jos välejä lasketaan kuusi. (Mukaillen yo kevät 1996.)"},{"id":"H17","ryhma":"ylikurssi","kysymys":"Pyöräilijä ajaa 1,5 km:n ylämäen nopeudella 6 km/h ja laskee saman mäen alas nopeudella 5 m/s. Mikä on keskinopeus koko 3 km:n matkalla? Anna vastaus yksikössä km/h ilman yksikköä.","vastaus":9,"vinkki":"Muunna ensin alamäen nopeus yksikköön km/h. Laske sitten kummankin osuuden aika. Keskinopeus ei ole nopeuksien keskiarvo.","selitys":"5 m/s = 18 km/h. Ylämäkeen kuluu 1,5 : 6 = 0,25 h ja alamäkeen 1,5 : 18 = 1/12 h. Yhteensä 1/3 h eli 20 min. Keskinopeus 3 km : 1/3 h = 9 km/h. Keskiarvo 12 km/h on väärin, samoin tulos noin 5,45, joka syntyy, jos alamäen nopeus 5 jätetään muuntamatta."},{"id":"H18","ryhma":"ylikurssi","kysymys":"Kun Eeva on vielä 40 km:n päässä määränpäästä, hän laskee myöhästyvänsä 10 min, jos hän ajaa loppumatkan nopeudella 80 km/h. Millä keskinopeudella hänen pitäisi ajaa loppumatka, jotta hän olisi perillä ajoissa? Anna vastaus yksikössä km/h ilman yksikköä.","vastaus":120,"vinkki":"Laske, kauanko loppumatka kestää nopeudella 80 km/h, ja vähennä myöhästyminen.","selitys":"40 km : 80 km/h = 0,5 h = 30 min. Aikaa on 10 min vähemmän eli 20 min = 1/3 h. Nopeus 40 km : 1/3 h = 120 km/h. (Mukaillen yo kevät 1994.)"},{"id":"H19","ryhma":"ylikurssi","kysymys":"Ajat 24 km:n matkan. Ensimmäiset 12 km ajat nopeudella 36 km/h. Koko matkan keskinopeuden pitäisi olla 72 km/h. Montako minuuttia loppumatkalle jää aikaa? Anna vastaus ilman yksikköä.","vastaus":0,"vinkki":"Laske, paljonko aikaa koko matkaan saa kulua ja paljonko siitä kuluu ensimmäiseen osuuteen.","selitys":"Koko matkaan saa kulua 24 km : 72 km/h = 1/3 h = 20 min. Ensimmäiseen osuuteen kuluu 12 km : 36 km/h = 1/3 h = 20 min. Loppumatkalle jää 0 min, joten keskinopeus 72 km/h on mahdoton, ajoipa loput 12 km kuinka nopeasti tahansa. Vastaus 20 syntyy, jos ensimmäiseen osuuteen kulunutta aikaa ei vähennetä."},{"id":"H20","ryhma":"ylikurssi","kysymys":"Kävellen kuljet matkan nopeudella 6 km/h ja pyöräillen nopeudella 18 km/h. Pyöräillen matkaan kuluu 10 min vähemmän kuin kävellen. Kuinka pitkä matka on? Anna vastaus kilometreinä ilman yksikköä.","vastaus":1.5,"vinkki":"Merkitse kävelyaikaa t:llä tunteina. Matka on sama: 6t = 18(t − 1/6).","selitys":"6t = 18t − 3, joten 12t = 3 ja t = 0,25 h. Matka 6 km/h · 0,25 h = 1,5 km. Tarkistus: kävellen 15 min, pyöräillen 5 min, ero 10 min. (Mukaillen yo kevät 1998.)"}],"valmis_teksti":"Osaat muuntaa nopeuksia yksiköiden km/h ja m/s välillä ja perustella kertoimen 3,6, luet nopeuden aika–matka-kuvaajasta, ratkaiset kohtaamis- ja kiinniottotehtäviä laskemalla ja piirtämällä ja lasket keskinopeuden kokonaismatkasta ja kokonaisajasta. Pidät yksiköt yhteensopivina ja tarkistat, onko vastaus järkevä. Tämä haastetaito on nyt näytetty."};

const esc = s => s;
const osat = D.teksti.map(o=>{
  switch(o.tyyppi){
    case "johdanto":
      return `<p class="lead">${esc(o.sisalto)}</p>`;

      return `<h2>${esc(o.otsikko)}</h2><p>${esc(o.sisalto)}</p>`;
    case "saanto":
      return `<div class="box"><h3>${esc(o.otsikko)}</h3><ol class="steps">${
        o.askeleet.map(a=>`<li><span>${esc(a)}</span></li>`).join("")}</ol></div>`;
    case "taulukko":
      return `<div class="box"><h3>${esc(o.otsikko)}</h3><div class="tablewrap"><table><thead><tr>${
        o.otsikkorivi.map(h=>`<th>${h}</th>`).join("")}</tr></thead><tbody>${
        o.rivit.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join("")}</tr>`).join("")}</tbody></table></div></div>`;
    case "ansa":

const svg=document.getElementById("nlsvg"), rng=document.getElementById("nlrange"), out=document.getElementById("nlout");
const X0=34, X1=606, Y=62;
function piirraNL(v){
  const ala=Math.floor(v/10)*10, yla=ala+10, puoli=ala+5;
  const pyor = (v%10)>=5 ? yla : ala;
  const x = n => X0 + (n/100)*(X1-X0);
  let s=`<line class="rail" x1="${X0}" y1="${Y}" x2="${X1}" y2="${Y}"/>`;
  for(let n=0;n<=100;n+=10){
    const near = (n===ala||n===yla);
    s+=`<line class="tick" x1="${x(n)}" y1="${Y-7}" x2="${x(n)}" y2="${Y+7}"/>`;
    s+=`<text class="stop${near?" near":""}" x="${x(n)}" y="${Y+24}" text-anchor="middle">${n}</text>`;
  }
  s+=`<line class="halfway" x1="${x(puoli)}" y1="${Y-16}" x2="${x(puoli)}" y2="${Y+12}"/>`;
  s+=`<text class="stop" x="${x(puoli)}" y="${Y-22}" text-anchor="middle">puoliväli ${puoli}</text>`;
  s+=`<circle class="dot" cx="${x(v)}" cy="${Y}" r="6"/>`;
  s+=`<text class="val" x="${x(v)}" y="${Y-32}" text-anchor="middle">${v}</text>`;
  s+=`<path d="M ${x(v)} ${Y+38} L ${x(pyor)} ${Y+38}" stroke="var(--core)" stroke-width="2" fill="none"/>`;
  s+=`<path d="M ${x(pyor)} ${Y+38} l ${x(pyor)>x(v)?-7:7} -4 l 0 8 z" fill="var(--core)"/>`;
  svg.innerHTML=s;
  out.textContent = `${v} pyöristyy → ${pyor}`;
}

/* ---------- laskujärjestys-widget ---------- */
const ljExp=document.getElementById("ljExp");
if(ljExp && D.kokeilu){
  let ljI=0, ljTokens=[], ljStep=0;
  const laske=(a,op,b)=>{a=+a;b=+b;return op==="×"?a*b:op==="÷"?a/b:op==="+"?a+b:a-b;};
  function ljAlku(){
    const l=D.kokeilu[ljI];
    ljTokens=l.lauseke.replace(/\(/g,"( ").replace(/\)/g," )").split(/\s+/).filter(Boolean);
    ljStep=0; ljPiirra(); ljViesti("","");
  }
  function ljViesti(t,lk){const f=document.getElementById("ljFb"); f.textContent=t; f.className="lj-fb "+(lk||"");}
  function ljPiirra(){
    const l=D.kokeilu[ljI];
    document.getElementById("ljStep").textContent =
      ljStep>=l.askeleet.length ? "valmis" : `askel ${ljStep+1} / ${l.askeleet.length}`;
    if(ljStep>=l.askeleet.length){
      ljExp.innerHTML=`<span class="valmis">${l.lauseke} = ${l.vastaus}</span>`;
      return;
    }
    ljExp.innerHTML=ljTokens.map((t,i)=>
      "×÷+−".includes(t) ? `<button type="button" class="op" data-i="${i}">${t}</button>`
                         : `<span class="tok">${t}</span>`).join("");
    ljExp.querySelectorAll("button.op").forEach(b=>b.addEventListener("click",()=>ljKlikkaa(+b.dataset.i)));
  }
  function ljKlikkaa(i){
    const l=D.kokeilu[ljI], odotettu=l.askeleet[ljStep];
    const ehdotus=[ljTokens[i-1],ljTokens[i],ljTokens[i+1]].join(" ");
    if(ehdotus!==odotettu){
      ljViesti(ljStep===0
        ? "Ei vielä. Sulkeet ovat vahvimmat, sitten kerto ja jako. Yhtä vahvat vasemmalta oikealle."
        : "Ei vielä. Kumpi jäljellä olevista on vahvempi?", "no");
      return;
    }
    const arvo=laske(ljTokens[i-1],ljTokens[i],ljTokens[i+1]);
    let alku=i-1, loppu=i+1;
    if(ljTokens[i-2]==="(" && ljTokens[i+2]===")"){ alku=i-2; loppu=i+2; }
    ljTokens.splice(alku, loppu-alku+1, String(arvo));
    ljStep++;
    ljViesti(ljStep>=l.askeleet.length ? "Valmis. Vastaus on "+l.vastaus+"." : "Oikein. Jatka seuraavaan.", "ok");
    ljPiirra();
  }
  document.getElementById("ljSeuraava").addEventListener("click",()=>{
    ljI=(ljI+1)%D.kokeilu.length; ljAlku();
  });
  ljAlku();
}

/* Suomalainen lukumuoto: välilyönti on tuhaterotin, pilkku desimaalierotin.
   Piste voi olla kumpi tahansa. Se tulkitaan tuhaterottimeksi VAIN silloin, kun
   koko luku on aitoa tuhaterotinmuotoa: alkuosa 1–3 numeroa ilman etunollaa ja
   jokainen jatko-osa täsmälleen 3 numeroa (1.500, 12.345.678). Kaikissa muissa
   tapauksissa piste on desimaalipiste — myös 0.125, joka vanhalla säännöllä
   ("3 numeroa pisteen jäljessä = tuhaterotin") luettiin virheellisesti luvuksi 125. */
const TUHATEROTIN = /^[1-9]\d{0,2}(\.\d{3})+$/;
function lueLuku(teksti){
  // Murtoluku (3/4, -3/4) ja sekaluku (1 2/3, -1 2/3) hyväksytään sellaisinaan.
  const raaka = String(teksti).replace(/\u00a0/g, " ").trim();
  let m = raaka.match(/^(-?)(\d+)\s+(\d+)\s*\/\s*(\d+)$/);
  if(m){ const nim = Number(m[4]); if(nim === 0) return null;
    const v = Number(m[2]) + Number(m[3]) / nim; return m[1] ? -v : v; }
  m = raaka.match(/^(-?)\s*(\d+)\s*\/\s*(\d+)$/);
  if(m){ const nim = Number(m[3]); if(nim === 0) return null;
    const v = Number(m[2]) / nim; return m[1] ? -v : v; }
  let s = String(teksti).replace(/[\s\u00a0]/g, "");
  if(s === "") return null;
  if(s.indexOf(",") >= 0){
    s = s.replace(/\./g, "").replace(",", ".");
  } else if(TUHATEROTIN.test(s)){
    s = s.replace(/\./g, "");
  }
  const n = Number(s);
  return Number.isFinite(n) ? n : null;
}

function tarkista(id){
  const h=D.harjoitukset.find(x=>x.id===id);
  const kentta=document.getElementById("in-"+id);
  const fb=document.getElementById("fb-"+id);
  if(kentta.value.trim()===""){ fb.className="fb hint"; fb.textContent="Kirjoita vastaus ensin."; return; }
  const luku=lueLuku(kentta.value);
  if(luku===null){ fb.className="fb no"; fb.textContent="Vastauksen pitää olla luku tai murtoluku (esimerkiksi 3/4)."; return; }
  const oikein = Math.abs(luku - h.vastaus) < 1e-9;
  merkitseTulos(id, oikein, oikein ? "Oikein. "+h.selitys : `Ei vielä. ${h.vinkki} Kokeile uudelleen.`);
}

function tarkistaMonivalinta(id, valittuIndeksi, painike){
  const h=D.harjoitukset.find(x=>x.id===id);
  const rivi=painike.closest(".row");
  rivi.querySelectorAll(".mv-valinta").forEach(b=>b.disabled=true);
  const oikein = valittuIndeksi===h.vastaus;
  painike.classList.add(oikein?"mv-oikein":"mv-vaarin");
  if(!oikein){
    const oikeaBtn=rivi.querySelector(`[data-i="${h.vastaus}"]`);
    if(oikeaBtn) oikeaBtn.classList.add("mv-oikein");
  }
  merkitseTulos(id, oikein, oikein ? "Oikein. "+h.selitys : `Ei ihan. Oikea vastaus on korostettu. ${h.selitys||""}`);
}

/* Kuuntelu: selain lukee tekstin ääneen omalla puhesynteesillään (englanniksi, jos laitteessa on
   englanninkielinen ääni). Ei äänitiedostoja eikä verkkoyhteyttä. Jos laite ei osaa puhua,
   teksti näytetään luettavaksi — silloin tehtävä muuttuu luetun ymmärtämiseksi, mutta ei katkea. */
function puhu(id, nopeus){
  const h=D.harjoitukset.find(x=>x.id===id); if(!h || !h.kuuntele) return;
  const vara=document.getElementById("vara-"+id);
  const naytaTeksti=syy=>{ vara.hidden=false; vara.textContent=syy+" Teksti: "+h.kuuntele; };
  if(!("speechSynthesis" in window)){ naytaTeksti("Tämä laite ei osaa lukea ääneen."); return; }
  const s=window.speechSynthesis; s.cancel();
  const u=new SpeechSynthesisUtterance(h.kuuntele);
  u.lang=h.kieli||"en-GB"; u.rate=nopeus;
  const aanet=s.getVoices(), kieli=u.lang.slice(0,2);
  const aani=aanet.find(a=>a.lang===u.lang) || aanet.find(a=>a.lang && a.lang.startsWith(kieli));
  if(aani) u.voice=aani;
  else if(aanet.length) { naytaTeksti("Laitteessa ei ole englanninkielistä ääntä."); return; }
  u.onerror=()=>naytaTeksti("Ääneen lukeminen ei onnistunut.");
  s.speak(u);
}
