<title>Kateetit ja hypotenuusa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">

<style>
:root{
  --paper:#EFF2F5; --surface:#FFFFFF; --surface-2:#F7F9FB;
  --grid:#DCE3EA; --line:#C9D3DC;
  --ink:#15222C; --ink-2:#4E626F; --ink-3:#7E8F9B;
  --core:#1B5A9E; --core-soft:#E4EDF6;
  --strong:#1F6E5C; --strong-soft:#E1F0EB;
  --chal:#9A6A16; --chal-soft:#F6EDDC;
  --alert:#A33A2B; --alert-soft:#F8E7E3;
  --shadow:0 1px 2px rgba(21,34,44,.06), 0 8px 24px -12px rgba(21,34,44,.18);
  --r:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0F161B; --surface:#18222A; --surface-2:#1D2830;
    --grid:#22303A; --line:#2E3E4A;
    --ink:#E8EFF4; --ink-2:#A3B4C0; --ink-3:#7A8B97;
    --core:#7FB2E4; --core-soft:#16303F;
    --strong:#77CDB4; --strong-soft:#123028;
    --chal:#E0B267; --chal-soft:#33270F;
    --alert:#E8907F; --alert-soft:#3A1E19;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -14px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --paper:#0F161B; --surface:#18222A; --surface-2:#1D2830;
  --grid:#22303A; --line:#2E3E4A;
  --ink:#E8EFF4; --ink-2:#A3B4C0; --ink-3:#7A8B97;
  --core:#7FB2E4; --core-soft:#16303F;
  --strong:#77CDB4; --strong-soft:#123028;
  --chal:#E0B267; --chal-soft:#33270F;
  --alert:#E8907F; --alert-soft:#3A1E19;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -14px rgba(0,0,0,.7);
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:16px; line-height:1.62;
  background-image:
    linear-gradient(to right, var(--grid) 1px, transparent 1px),
    linear-gradient(to bottom, var(--grid) 1px, transparent 1px);
  background-size:26px 26px;
}
.wrap{max-width:760px; margin:0 auto; padding:28px 20px 90px}
h1,h2,h3,h4{font-family:"Familjen Grotesk","IBM Plex Sans",system-ui,sans-serif; text-wrap:balance}

/* header */
header.top{background:var(--surface); border:1px solid var(--line); border-radius:var(--r);
  box-shadow:var(--shadow); padding:22px 24px; display:flex; gap:18px; align-items:flex-start}
.badge{flex:0 0 auto; width:54px; height:54px; border-radius:9px; display:grid; place-items:center;
  background:var(--core-soft); border:1px solid var(--core); color:var(--core)}
.badge svg{width:28px; height:28px; fill:none; stroke:currentColor; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round}
.eyebrow{font-family:"IBM Plex Mono",monospace; font-size:11px; letter-spacing:.14em;
  text-transform:uppercase; color:var(--ink-3); margin:0 0 5px}
header.top h1{margin:0; font-size:30px; font-weight:700; letter-spacing:-.015em}
header.top p{margin:5px 0 0; color:var(--ink-2); font-size:15px}
.tags{display:flex; flex-wrap:wrap; gap:5px; margin-top:11px}
.tag{font-family:"IBM Plex Mono",monospace; font-size:10.5px; letter-spacing:.05em; padding:2px 7px;
  border-radius:4px; background:var(--surface-2); border:1px solid var(--line); color:var(--ink-3)}
.tag.core{background:var(--core-soft); border-color:var(--core); color:var(--core)}

/* teksti */
article{margin-top:26px}
article h2{font-size:21px; font-weight:600; margin:32px 0 10px; letter-spacing:-.01em}
article p{margin:0 0 14px; max-width:64ch}
.lead{font-size:17.5px; color:var(--ink); border-left:3px solid var(--core); padding-left:16px; margin:0 0 8px}

.box{background:var(--surface); border:1px solid var(--line); border-radius:var(--r);
  padding:18px 22px; box-shadow:var(--shadow); margin:22px 0}
.box h3{margin:0 0 12px; font-size:16.5px; font-weight:600}
.box.warn{border-left:3px solid var(--alert)}
.box.note{border-left:3px solid var(--chal)}

ol.steps{margin:0; padding-left:0; list-style:none; counter-reset:s; display:grid; gap:12px}
ol.steps li{counter-increment:s; display:grid; grid-template-columns:auto 1fr; gap:13px; align-items:start}
ol.steps li::before{content:counter(s); font-family:"Familjen Grotesk",sans-serif; font-weight:700; font-size:14px;
  width:26px; height:26px; border-radius:50%; background:var(--core); color:#fff; display:grid; place-items:center; margin-top:2px}

ul.notes{margin:0; padding-left:19px}
ul.notes li{margin-bottom:7px}
ul.notes li:last-child{margin-bottom:0}

.tablewrap{overflow-x:auto}
table{border-collapse:collapse; width:100%; font-size:14.5px; min-width:460px}
th,td{text-align:left; padding:9px 13px; border-bottom:1px solid var(--line)}
th{font-family:"IBM Plex Mono",monospace; font-size:10.5px; letter-spacing:.1em; text-transform:uppercase;
  color:var(--ink-3); font-weight:400; background:var(--surface-2)}
tr:last-child td{border-bottom:0}
td b{color:var(--core); font-weight:600}
td:last-child{font-variant-numeric:tabular-nums; font-weight:600}

/* lukusuora */
.nl svg{width:100%; height:118px; display:block}
.nl .rail{stroke:var(--line); stroke-width:2}
.nl .tick{stroke:var(--line); stroke-width:1.5}
.nl .stop{fill:var(--ink-3); font-family:"IBM Plex Mono",monospace; font-size:11px}
.nl .stop.near{fill:var(--core); font-weight:600}
.nl .dot{fill:var(--chal)}
.nl .val{fill:var(--ink); font-family:"Familjen Grotesk",sans-serif; font-size:15px; font-weight:700}
.nl .halfway{stroke:var(--chal); stroke-dasharray:3 3; stroke-width:1.5}
.nl-controls{display:flex; align-items:center; gap:14px; margin-top:6px}
.nl-controls input{flex:1; accent-color:var(--core)}
.nl-out{font-family:"Familjen Grotesk",sans-serif; font-size:15px; font-weight:600; min-width:12.5em; text-align:right}

/* paikka-arvotaulu */
.box .ohje{margin:0 0 14px; font-size:14.5px; color:var(--ink-2)}
.nt-valinta{display:flex; flex-wrap:wrap; gap:7px; margin-bottom:16px}
.nt-valinta button{font:inherit; font-size:12.5px; font-family:"IBM Plex Mono",monospace; padding:5px 11px;
  border-radius:6px; border:1px solid var(--line); background:var(--surface-2); color:var(--ink-2); cursor:pointer}
.nt-valinta button[aria-pressed="true"]{background:var(--ink); color:var(--paper); border-color:var(--ink)}
.nt-valinta button:focus-visible{outline:2px solid var(--core); outline-offset:2px}
.nt-taulu{display:flex; flex-direction:column; gap:4px; align-items:flex-start; overflow-x:auto; padding-bottom:4px}
.nt-rivi{display:flex; gap:6px; align-items:center}
.nt-rivi .otsa{font-family:"IBM Plex Mono",monospace; font-size:9.5px; letter-spacing:.08em;
  text-transform:uppercase; color:var(--ink-3); width:52px; text-align:center}
.nt-ruutu{width:52px; height:52px; display:grid; place-items:center; border:1.5px solid var(--line);
  border-radius:7px; background:var(--surface-2); font-family:"IBM Plex Mono",monospace; font-size:24px}
.nt-ruutu.kohta{border-color:var(--core); background:var(--core-soft); color:var(--core); font-weight:500}
.nt-ruutu.ratkaiseva{border-color:var(--chal); background:var(--chal-soft); color:var(--chal); font-weight:500}
.nt-ruutu.nolla{color:var(--ink-3)}
.nt-rivi .nimi{font-size:12.5px; color:var(--ink-3); margin-left:12px; white-space:nowrap}
.nt-nuoli{font-size:17px; color:var(--chal); margin-left:6px}
.nt-selite{margin:14px 0 0; font-size:14.5px}
.nt-selite b{color:var(--core)}

/* vahvuusportaat */
.vp-tasot{display:grid; gap:9px; margin-bottom:18px}
.vp-taso{display:flex; gap:11px; align-items:flex-start; font-size:13.5px}
.vp-taso .vp-pallo{width:13px; height:13px; border-radius:4px; margin-top:5px; flex:0 0 auto}
.vp-taso[data-taso="sulkeet"] .vp-pallo{background:var(--core)}
.vp-taso[data-taso="kertojako"] .vp-pallo{background:var(--strong)}
.vp-taso[data-taso="yhteenvahennys"] .vp-pallo{background:var(--chal)}
.vp-taso strong{display:block; font-family:"Familjen Grotesk",sans-serif; font-weight:600; font-size:14.5px}
.vp-taso span{color:var(--ink-2)}
.vp-lauseke{display:flex; flex-wrap:wrap; gap:7px; align-items:flex-end; font-family:"IBM Plex Mono",monospace;
  font-size:25px; padding:10px 2px; min-height:64px}
.vp-lauseke .t{padding:2px 3px}
.vp-lauseke .op{position:relative; padding:2px 9px; border-radius:6px; font-weight:500}
.vp-lauseke .op[data-taso="sulkeet"]{background:var(--core-soft); color:var(--core)}
.vp-lauseke .op[data-taso="kertojako"]{background:var(--strong-soft); color:var(--strong)}
.vp-lauseke .op[data-taso="yhteenvahennys"]{background:var(--chal-soft); color:var(--chal)}
.vp-lauseke .op i{position:absolute; top:-9px; right:-6px; font-style:normal; font-family:"Familjen Grotesk",sans-serif;
  font-size:11px; font-weight:700; width:18px; height:18px; border-radius:50%; display:grid; place-items:center;
  background:currentColor}
.vp-lauseke .op i span{color:var(--surface)}
.vp-rivi{display:flex; align-items:center; gap:16px; margin-top:8px}
.vp-vastaus{font-family:"Familjen Grotesk",sans-serif; font-size:16px; font-weight:600; color:var(--strong)}

/* laskujärjestys-widget */
.lj-exp{display:flex; flex-wrap:wrap; gap:7px; align-items:center; font-family:"IBM Plex Mono",monospace;
  font-size:23px; padding:14px 4px; min-height:62px}
.lj-exp .tok{padding:2px 4px; color:var(--ink)}
.lj-exp button.op{font-family:"IBM Plex Mono",monospace; font-size:23px; padding:3px 12px; border-radius:7px;
  border:1.5px solid var(--line); background:var(--surface-2); color:var(--ink); line-height:1.2}
.lj-exp button.op:hover{border-color:var(--core); color:var(--core)}
.lj-exp button.op:focus-visible{outline:2px solid var(--core); outline-offset:2px}
.lj-exp .valmis{font-family:"Familjen Grotesk",sans-serif; font-size:23px; font-weight:700; color:var(--strong)}
.lj-fb{font-size:14.5px; min-height:1.5em; color:var(--ink-2)}
.lj-fb.no{color:var(--alert)}
.lj-fb.ok{color:var(--strong)}
.lj-row{display:flex; align-items:center; gap:14px; margin-top:10px}
.lj-step{font-family:"IBM Plex Mono",monospace; font-size:11.5px; letter-spacing:.1em;
  text-transform:uppercase; color:var(--ink-3)}

/* harjoitukset */
.progress{position:sticky; top:0; z-index:5; background:var(--surface); border:1px solid var(--line);
  border-radius:var(--r); padding:12px 18px; box-shadow:var(--shadow); display:flex; align-items:center;
  gap:14px; margin:34px 0 18px}
.progress .lbl{font-family:"IBM Plex Mono",monospace; font-size:11px; letter-spacing:.12em;
  text-transform:uppercase; color:var(--ink-3); white-space:nowrap}
.progress .meter{flex:1; height:7px; border-radius:4px; background:var(--surface-2); border:1px solid var(--line); overflow:hidden}
.progress .meter i{display:block; height:100%; background:var(--core); transition:width .25s ease}
.progress .cnt{font-family:"Familjen Grotesk",sans-serif; font-weight:700; font-variant-numeric:tabular-nums; white-space:nowrap}

.grp{margin-top:26px}
.grp-head{display:flex; align-items:baseline; gap:10px; border-bottom:1.5px solid var(--ink); padding-bottom:7px; margin-bottom:14px}
.grp-head h3{margin:0; font-size:17px; font-weight:600}
.grp-head span{font-size:12.5px; color:var(--ink-2)}

.ex{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:14px 16px; margin-bottom:10px}
.ex[data-tila="oikein"]{border-color:var(--strong); box-shadow:inset 3px 0 0 var(--strong)}
.ex[data-tila="vaarin"]{border-color:var(--alert); box-shadow:inset 3px 0 0 var(--alert)}
.ex .q{display:flex; gap:11px; align-items:baseline; flex-wrap:wrap}
.ex .num{font-family:"IBM Plex Mono",monospace; font-size:11.5px; color:var(--ink-3); min-width:2.4em}
.ex .txt{flex:1; min-width:190px; font-size:15.5px}
.ex .txt .aineisto{display:block; margin-bottom:9px; padding-left:12px;
  border-left:2px solid var(--line); color:var(--ink-2); line-height:1.6;
  /* Aineisto voi olla pieni taulukko, jonka rivit on erotettu rivinvaihdoilla.
     Ilman pre-lineä ne valuisivat yhdeksi kappaleeksi ja taulukko katoaisi. */
  white-space:pre-line}
.ex .txt .kysymysrivi{display:block; font-weight:600}
.ex .row{display:flex; gap:8px; align-items:center; margin-top:11px; flex-wrap:wrap}
.ex input[type=text]{font:inherit; font-family:"IBM Plex Mono",monospace; font-size:15px; width:8.5em;
  padding:7px 11px; border:1px solid var(--line); border-radius:7px; background:var(--surface-2);
  color:var(--ink); text-align:right}
.ex input:focus-visible{outline:2px solid var(--core); outline-offset:1px}
button{font:inherit; cursor:pointer}
.btn{font-size:13.5px; padding:7px 15px; border-radius:7px; border:1px solid var(--core);
  background:var(--core); color:#fff}
.btn.ghost{background:transparent; color:var(--ink-2); border-color:var(--line)}
.btn:focus-visible{outline:2px solid var(--core); outline-offset:2px}
.btn.mv-valinta{text-align:left}
/* kuuntelutehtävä: selaimen puhesynteesi lukee englanninkielisen tekstin */
.kuuntele{display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin:2px 0 10px}
.kuuntele .btn{display:inline-flex; gap:7px; align-items:center}
.kuuntele svg{width:16px; height:16px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round}
.kuuntele .varateksti{flex-basis:100%; font-size:14px; color:var(--ink-2); background:var(--surface-2);
  border-radius:7px; padding:8px 12px; margin:0}
.btn.mv-valinta:disabled{cursor:default; opacity:.65}
.btn.mv-oikein{background:var(--strong-soft); border-color:var(--strong); color:var(--strong); opacity:1}
.btn.mv-vaarin{background:var(--alert-soft); border-color:var(--alert); color:var(--alert); opacity:1}
.row.mv{gap:8px 10px}
.fb{margin-top:11px; font-size:14.5px; padding:10px 13px; border-radius:8px; line-height:1.5}
.fb.ok{background:var(--strong-soft); color:var(--strong)}
.fb.no{background:var(--alert-soft); color:var(--alert)}
.fb.hint{background:var(--chal-soft); color:var(--chal)}

.done{background:var(--strong-soft); border:1px solid var(--strong); color:var(--strong);
  border-radius:var(--r); padding:16px 20px; margin-top:20px; font-size:15.5px}
.done h3{margin:0 0 4px; font-size:17px; color:var(--strong)}

details.teacher{margin-top:34px; background:var(--surface); border:1px solid var(--line);
  border-left:3px solid var(--chal); border-radius:var(--r); padding:15px 20px; box-shadow:var(--shadow)}
details.teacher summary{cursor:pointer; font-family:"Familjen Grotesk",sans-serif; font-weight:600; font-size:15px}
details.teacher summary:focus-visible{outline:2px solid var(--core); outline-offset:3px}
details.teacher ul{margin:12px 0 0; padding-left:19px; color:var(--ink-2); font-size:14.5px}
details.teacher li{margin-bottom:8px}
details.teacher p{margin:12px 0 0; color:var(--ink-2); font-size:14.5px}

.back{display:inline-block; margin-top:30px; font-size:13.5px; color:var(--ink-2)}
.back a{color:var(--core)}

@media (prefers-reduced-motion: reduce){*{transition:none !important}}
@media (max-width:560px){
  .wrap{padding:16px 13px 70px}
  header.top h1{font-size:25px}
  .progress{flex-wrap:wrap}
}
</style>

  <header class="top">
    <span class="badge"><svg viewBox="0 0 24 24" aria-hidden="true" id="ikoni"></svg></span>

</div>

<script>
const D = {"tavoite_id":"MAT8-GEO-01","oppiaine":"MAT","vuosiluokka":8,"otsikko":"Kateetit ja hypotenuusa","kuvaus":"Osaan laskea suorakulmaisen kolmion puuttuvan sivun Pythagoraan lauseella ja tutkia käänteislauseella, onko kolmio suorakulmainen.","versio":"0.2","paivitetty":"2026-10-04","ops":{"T":["T12","T17"],"S":["S5"]},"taso":"ydin","ikoni":"mitta","eyebrow":"Matematiikka · 8. luokka · Geometria","teksti":[{"tyyppi":"johdanto","sisalto":"Kun rakennetaan terassia, vajaa tai skeittirampin runkoa, nurkkien pitää olla suoria. Isoa kulmaa on kuitenkin hankala mitata kulmaviivaimella, joten rakentajat käyttävät mittanauhaa. Nurkasta mitataan toisen laudan reunaan merkki 90 cm:n päähän ja toisen laudan reunaan merkki 120 cm:n päähän. Sitten mitataan merkkien välinen matka. Jos se on täsmälleen 150 cm, kulma on suora. Jos matka on pidempi, kulma on liian avara, ja jos lyhyempi, liian ahdas. Temppu toimii, koska suorakulmaisen kolmion sivujen pituudet sitovat toisiaan: kun kaksi sivua tunnetaan, kolmas voidaan laskea. Tätä yhteyttä sanotaan Pythagoraan lauseeksi. Tässä taidossa opit laskemaan suorakulmaisen kolmion puuttuvan sivun ja päättelemään kolmen sivun pituuksista, onko kolmio suorakulmainen."},{"tyyppi":"kappale","otsikko":"Kateetit ja hypotenuusa","sisalto":"Suorakulmaisen kolmion sivuilla on omat nimensä. Kateetit ovat ne kaksi sivua, jotka muodostavat suoran kulman. Hypotenuusa on suoran kulman vastainen sivu eli se sivu, joka ei kosketa suoran kulman kärkeä. Kun kolmio annetaan kirjaimin, nimet löytyvät kärjistä. Jos kolmiossa ABC kulma C on suora, kateetit ovat ne sivut, joiden päätepiste on C, eli AC ja BC. Hypotenuusa on sivu, jonka nimessä ei ole kirjainta C, eli AB. Hypotenuusa on aina suorakulmaisen kolmion pisin sivu. Perustelu tulee seuraavan kappaleen lauseesta: hypotenuusan neliö on kateettien neliöiden summa, joten se on suurempi kuin kumpikaan kateetin neliö yksinään, ja siksi hypotenuusa on pidempi kuin kumpikaan kateetti. Nimet koskevat vain suorakulmaista kolmiota. Teräväkulmaisella ja tylppäkulmaisella kolmiolla ei ole kateetteja eikä hypotenuusaa."},{"tyyppi":"kappale","otsikko":"Pythagoraan lause neliöiden pinta-aloina","sisalto":"Piirrä ruutupaperille suorakulmainen kolmio, jonka kateetit ovat 3 ja 4 ruudun pituiset. Hypotenuusasta tulee 5 ruudun pituinen. Piirrä jokaiselle sivulle kolmion ulkopuolelle neliö, jonka sivu on yhtä pitkä kuin kolmion sivu. Kateettien neliöissä on 3 · 3 = 9 ja 4 · 4 = 16 ruutua. Hypotenuusan neliö on vinossa, joten sen ruutuja ei voi laskea suoraan, mutta sen pinta-ala on 5 · 5 = 25 ruutua. Kateettien neliöiden pinta-alat yhteensä, 9 + 16 = 25, ovat yhtä suuret kuin hypotenuusan neliön pinta-ala. Tämä ei ole sattumaa, vaan se pätee jokaisessa suorakulmaisessa kolmiossa. Merkitään kateetteja a ja b ja hypotenuusaa c. Ota neljä samanlaista kolmiota ja neliön muotoinen kehys, jonka sivu on a + b. Asettele kolmiot ensin kehyksen nurkkiin niin, että jokaisen kolmion suora kulma on eri nurkassa ja kolmioiden hypotenuusat rajaavat keskelle vinon nelikulmion. Sen sivut ovat kaikki c, ja sen kulmat ovat suoria: kehyksen sivulla kahden kolmion terävät kulmat ja nelikulmion kulma ovat yhteensä 180°, ja suorakulmaisen kolmion terävät kulmat ovat yhteensä 90°. Vapaaksi jää siis neliö, jonka pinta-ala on c². Siirrä sitten kolmiot pareittain kahdeksi suorakulmioksi, joiden sivut ovat a ja b, kehyksen kahteen vastakkaiseen nurkkaan. Nyt vapaaksi jää kaksi neliötä, joiden pinta-alat ovat a² ja b². Kehys ja neljä kolmiota ovat samat molemmilla kerroilla, joten vapaata pintaa on yhtä paljon: a² + b² = c². Tämä on Pythagoraan lause: suorakulmaisessa kolmiossa kateettien neliöiden summa on hypotenuusan neliö."},{"tyyppi":"saanto","otsikko":"Näin lasket puuttuvan hypotenuusan","askeleet":["Etsi suora kulma ja nimeä sivut. Hypotenuusa on suoran kulman vastainen sivu. Kirjoita lause muotoon a² + b² = c² niin, että hypotenuusa c on yksin yhtälön toisella puolella.","Sijoita kateetit. Kun kateetit ovat 5 cm ja 6 cm, saat 5² + 6² = c².","Laske neliöt ja niiden summa: 25 + 36 = c² eli c² = 61. Neliö on luku kerrottuna itsellään: 6² = 6 · 6 = 36, ei 6 · 2.","Ratkaise c. Yhtälöllä c² = 61 on kaksi ratkaisua, √61 ja −√61, mutta pituus ei voi olla negatiivinen, joten c = √61 cm. Tämä on tarkka arvo.","Laske laskimella likiarvo pyydetyllä tarkkuudella. √61 = 7,81…, joten millimetrin tarkkuudella c ≈ 7,8 cm. Millimetrin tarkkuus senttimetreinä tarkoittaa yhtä desimaalia. Kun pyydetään molempia, kirjoita c = √61 cm ≈ 7,8 cm.","Tarkista, että hypotenuusa on pisin sivu: 7,8 cm on pidempi kuin 5 cm ja 6 cm."]},{"tyyppi":"kappale","otsikko":"Puuttuva kateetti ratkeaa yhtälöstä","sisalto":"Kun hypotenuusa ja toinen kateetti tunnetaan, kirjoita lause samaan muotoon ja merkitse tuntematonta kateettia kirjaimella. Esimerkiksi kun hypotenuusa on 17 cm ja toinen kateetti 8 cm, saat x² + 8² = 17². Hypotenuusa pysyy yksin yhtälön oikealla puolella. Ratkaise yhtälö kuten muutkin yhtälöt, joissa on x²: x² + 64 = 289. Vähennä molemmilta puolilta 64, jolloin x² = 225. Yhtälöllä on kaksi ratkaisua, x = 15 ja x = −15, mutta kateetin pituus ei voi olla negatiivinen, joten negatiivinen ratkaisu hylätään. Toinen kateetti on 15 cm. Lyhyesti: kateetin neliö saadaan vähentämällä hypotenuusan neliöstä toisen kateetin neliö. Tarkista lopuksi, että kateetti on lyhyempi kuin hypotenuusa: 15 cm on alle 17 cm. Jos kateetit ovat yhtä pitkät, merkitse molempia x:llä. Kun hypotenuusa on 8 cm, saat x² + x² = 8² eli 2x² = 64. Jaa kahdella: x² = 32, joten x = √32 cm ≈ 5,7 cm."},{"tyyppi":"ansa","otsikko":"Ansa 1: kateettia laskiessa vähennetään","sisalto":"Kun hypotenuusa on 10 cm ja toinen kateetti 6 cm, houkutteleva lasku on √(10² + 6²) = √136 ≈ 11,7 cm. Tulos on pidempi kuin hypotenuusa, joten se ei voi olla kateetti. Virhe syntyy, kun neliöt lasketaan yhteen tottumuksesta. Kirjoita lause aina samaan muotoon, x² + 6² = 10², niin näet, että tuntematon on summan osa ja toinen kateetti pitää vähentää: x² = 100 − 36 = 64, joten x = 8 cm."},{"tyyppi":"ansa","otsikko":"Ansa 2: juuri summasta ja neliö oikein","sisalto":"Kun kateetit ovat 5 cm ja 12 cm, hypotenuusa ei ole 5 + 12 = 17 cm. Juurta ei voi ottaa summasta termi kerrallaan. Merkintä √(5² + 12²) tarkoittaa, että juuren alla oleva lasketaan ensin, 25 + 144 = 169, ja vasta sitten otetaan juuri: √169 = 13. Kateettien summa on aina pidempi kuin hypotenuusa, koska suora reitti kärjestä toiseen on lyhyempi kuin kierros kolmannen kärjen kautta. Toinen tavallinen virhe on neliöidä kertomalla kahdella: 5² ei ole 10, vaan 5 · 5 = 25. Jos laskisit 10 + 24 = 34 ja √34 ≈ 5,8, hypotenuusa olisi lyhyempi kuin 12 cm:n kateetti, mikä on mahdotonta."},{"tyyppi":"kappale","otsikko":"Käänteislause: onko kolmio suorakulmainen?","sisalto":"Pythagoraan lause toimii myös toiseen suuntaan. Jos kolmion pisimmän sivun neliö on yhtä suuri kuin kahden muun sivun neliöiden summa, kolmio on suorakulmainen, ja suora kulma on pisimmän sivun vastainen kulma. Tätä sanotaan Pythagoraan lauseen käänteislauseeksi. Miksi se pätee? Ajattele kolmiota, jonka sivut ovat a, b ja c, pisimpänä c, ja jossa a² + b² = c². Rakenna toinen kolmio, jossa sivut a ja b ovat suorassa kulmassa. Sen hypotenuusan neliö on Pythagoraan lauseen mukaan a² + b² eli c², joten sen hypotenuusa on c. Molemmilla kolmioilla on samat kolme sivua, ja kolmen sivun pituudet määräävät kolmion muodon: kolmesta kepistä saa koottua vain yhden muotoisen kolmion. Siksi alkuperäinenkin kolmio on suorakulmainen. Jos taas pisimmän sivun neliö ja kahden muun sivun neliöiden summa eivät ole yhtä suuret, kolmio ei voi olla suorakulmainen, sillä suorakulmaisessa kolmiossa pisin sivu on hypotenuusa ja yhtäsuuruuden pitäisi päteä. Laske molemmat puolet erikseen ja vertaa. Esimerkiksi kun sivut ovat 20 cm, 21 cm ja 29 cm, 29² = 841 ja 20² + 21² = 400 + 441 = 841. Luvut ovat samat, joten kolmio on suorakulmainen. Kun sivut ovat 7 cm, 9 cm ja 12 cm, 12² = 144 ja 7² + 9² = 49 + 81 = 130. Luvut eroavat, joten kolmio ei ole suorakulmainen. Älä pyöristä äläkä tyydy melkein samaan: käänteislauseessa ratkaisee tarkka yhtäsuuruus."},{"tyyppi":"ansa","otsikko":"Ansa 3: hypotenuusa valitaan kulman ja pituuden perusteella","sisalto":"Kaksi virhettä syntyy samasta syystä: hypotenuusaksi valitaan sivu sen paikan perusteella eikä sen perusteella, mikä sivu on suoran kulman vastainen tai pisin. Ensimmäinen: kolmiossa KLM kulma K on suora, KL = 20 cm ja LM = 25 cm, ja kysytään sivua KM. Jos LM käsitellään kateettina, saadaan √(20² + 25²) ≈ 32,0 cm. Sivun LM nimessä ei ole kirjainta K, joten se on hypotenuusa: KM² + 20² = 25², KM² = 625 − 400 = 225 ja KM = 15 cm. Toinen: kolmion sivut ovat 25 cm, 7 cm ja 24 cm. Jos viimeiseksi kirjoitettua sivua 24 cm verrataan kahteen muuhun, 24² = 576 ja 25² + 7² = 674, ja päätelmäksi tulee väärin, ettei kolmio ole suorakulmainen. Pisin sivu on kuitenkin 25 cm: 25² = 625 ja 7² + 24² = 49 + 576 = 625, joten kolmio on suorakulmainen. Etsi aina ensin pisin sivu, oli se luettelossa missä kohdassa tahansa."},{"tyyppi":"muistilappu","otsikko":"Muista nämä","kohdat":["Kateetit muodostavat suoran kulman. Hypotenuusa on suoran kulman vastainen sivu ja aina pisin.","Kolmiossa ABC, jossa kulma C on suora, hypotenuusa on AB: sivu, jonka nimessä ei ole suoran kulman kirjainta.","a² + b² = c²: hypotenuusa yksin toisella puolella, kateetit toisella.","Hypotenuusa: kateettien neliöt yhteen ja sitten juuri. Kateetti: hypotenuusan neliöstä vähennetään toisen kateetin neliö ja sitten juuri.","Juuren alla oleva lasketaan ensin: √(5² + 12²) = √169 = 13, ei 5 + 12. Ja 5² = 25, ei 10.","Tarkka arvo on esimerkiksi √61 cm ja likiarvo ≈ 7,8 cm. Negatiivinen ratkaisu hylätään, koska pituus ei ole negatiivinen.","Käänteislause: laske pisimmän sivun neliö ja kahden muun sivun neliöiden summa erikseen. Samat luvut: kolmio on suorakulmainen. Eri luvut: ei ole."]}],"harjoitusryhmat":[{"id":"hypotenuusa","nimi":"Kateetit ja hypotenuusa","info":"Laskin on sallittu. Hypotenuusa on suoran kulman vastainen sivu. Kirjoita a² + b² = c² ja laske juuren alla oleva ensin. Anna vastaus ilman yksikköä."},{"id":"kateetti","nimi":"Puuttuva kateetti","info":"Laskin on sallittu. Kirjoita x² + b² = c², jossa c on hypotenuusa, ja ratkaise x². Kateetti on lyhyempi kuin hypotenuusa."},{"id":"kaanteis","nimi":"Onko kolmio suorakulmainen?","info":"Laskin on sallittu. Etsi pisin sivu. Laske sen neliö ja kahden muun sivun neliöiden summa erikseen ja vertaa niitä."}],"harjoitukset":[{"id":"H01","ryhma":"hypotenuusa","kysymys":"Kolmiossa ABC kulma B on suora. Mikä sivu on hypotenuusa?","vastaus":2,"vinkki":"Hypotenuusa ei kosketa suoran kulman kärkeä B.","selitys":"Hypotenuusa on suoran kulman vastainen sivu. Sivun AC nimessä ei ole kirjainta B. Sivut AB ja BC lähtevät kärjestä B, joten ne ovat kateetit.","tyyppi":"monivalinta","vaihtoehdot":["AB","BC","AC"]},{"id":"H02","ryhma":"hypotenuusa","kysymys":"Suorakulmaisen kolmion sivut ovat 4,0 m, 4,1 m ja 0,9 m. Kuinka pitkä on hypotenuusa? Anna vastaus metreinä ilman yksikköä.","vastaus":4.1,"vinkki":"Hypotenuusa on suorakulmaisen kolmion pisin sivu.","selitys":"Pisin sivu on 4,1 m, joten se on hypotenuusa. Tarkistus: 0,9² + 4,0² = 0,81 + 16 = 16,81 ja 4,1² = 16,81."},{"id":"H03","ryhma":"hypotenuusa","kysymys":"Suorakulmaisen kolmion kateetit ovat 9 cm ja 12 cm. Laske hypotenuusan pituus. Anna vastaus senttimetreinä ilman yksikköä.","vastaus":15,"vinkki":"Laske ensin 9² + 12² ja ota juuri vasta summasta.","selitys":"9² + 12² = c², 81 + 144 = 225, c = √225 = 15. Hypotenuusa on 15 cm. Vastaus 21 syntyy, jos juuri otetaan termi kerrallaan."},{"id":"H04","ryhma":"hypotenuusa","kysymys":"Suorakulmaisen kolmion kateetit ovat 1,1 m ja 6,0 m. Laske hypotenuusan pituus. Anna vastaus metreinä ilman yksikköä.","vastaus":6.1,"vinkki":"1,1² = 1,1 · 1,1 = 1,21.","selitys":"1,1² + 6,0² = c², 1,21 + 36 = 37,21, c = √37,21 = 6,1. Hypotenuusa on 6,1 m."},{"id":"H05","ryhma":"hypotenuusa","kysymys":"Suorakulmaisen kolmion kateetit ovat 5 cm ja 7 cm. Hypotenuusan tarkka pituus on √n cm. Mikä on n?","vastaus":74,"vinkki":"Tarkka arvo on juuri, jonka alla on kateettien neliöiden summa.","selitys":"5² + 7² = c², 25 + 49 = 74, joten c = √74 cm. Siis n = 74."},{"id":"H06","ryhma":"hypotenuusa","kysymys":"Suorakulmaisen kolmion kateetit ovat 5 cm ja 7 cm. Laske hypotenuusan pituus millimetrin tarkkuudella. Anna vastaus senttimetreinä ilman yksikköä.","vastaus":8.6,"vinkki":"Millimetrin tarkkuus senttimetreinä on yksi desimaali.","selitys":"c = √74 = 8,602…, joten c ≈ 8,6 cm. Hypotenuusa on pidempi kuin kumpikin kateetti, kuten pitääkin."},{"id":"H07","ryhma":"hypotenuusa","kysymys":"Kolmiossa PQR kulma R on suora, PR = 24 cm ja QR = 10 cm. Laske sivun PQ pituus. Anna vastaus senttimetreinä ilman yksikköä.","vastaus":26,"vinkki":"Kumman sivun nimessä ei ole kirjainta R?","selitys":"Kulma R on suora, joten PR ja QR ovat kateetit ja PQ on hypotenuusa. 24² + 10² = PQ², 576 + 100 = 676, PQ = √676 = 26 cm."},{"id":"H08","ryhma":"kateetti","kysymys":"Suorakulmaisen kolmion hypotenuusa on 20 cm ja toinen kateetti 12 cm. Laske toinen kateetti. Anna vastaus senttimetreinä ilman yksikköä.","vastaus":16,"vinkki":"Kirjoita x² + 12² = 20² ja vähennä 12² molemmilta puolilta.","selitys":"x² + 144 = 400, x² = 256, x = 16 (negatiivinen ratkaisu hylätään). Kateetti on 16 cm. Vastaus 23,3 syntyy, jos neliöt lasketaan yhteen, ja se on pidempi kuin hypotenuusa."},{"id":"H09","ryhma":"kateetti","kysymys":"Suorakulmaisen kolmion hypotenuusa on 1,3 m ja toinen kateetti 0,5 m. Laske toinen kateetti. Anna vastaus metreinä ilman yksikköä.","vastaus":1.2,"vinkki":"0,5² = 0,25 ja 1,3² = 1,69.","selitys":"x² + 0,5² = 1,3², x² = 1,69 − 0,25 = 1,44, x = √1,44 = 1,2. Kateetti on 1,2 m."},{"id":"H10","ryhma":"kateetti","kysymys":"Suorakulmaisen kolmion hypotenuusa on 9 cm ja toinen kateetti 5 cm. Toisen kateetin tarkka pituus on √n cm. Mikä on n?","vastaus":56,"vinkki":"Kateetin neliö on hypotenuusan neliö miinus toisen kateetin neliö.","selitys":"x² + 5² = 9², x² = 81 − 25 = 56, joten x = √56 cm ja n = 56. Vastaus 106 syntyy, jos neliöt lasketaan yhteen."},{"id":"H11","ryhma":"kateetti","kysymys":"Suorakulmaisen kolmion hypotenuusa on 9 cm ja toinen kateetti 5 cm. Laske toinen kateetti millimetrin tarkkuudella. Anna vastaus senttimetreinä ilman yksikköä.","vastaus":7.5,"vinkki":"Laske ensin tarkka arvo ja sitten likiarvo laskimella.","selitys":"x = √56 = 7,48…, joten x ≈ 7,5 cm. Tarkistus: 7,5 cm on lyhyempi kuin hypotenuusa 9 cm."},{"id":"H12","ryhma":"kateetti","kysymys":"Kolmiossa ABC kulma A on suora, BC = 50 cm ja AB = 14 cm. Laske sivun AC pituus. Anna vastaus senttimetreinä ilman yksikköä.","vastaus":48,"vinkki":"Kulma A on suora. Kumman annetun sivun nimessä ei ole kirjainta A?","selitys":"BC on hypotenuusa, koska sen nimessä ei ole kirjainta A. AC² + 14² = 50², AC² = 2 500 − 196 = 2 304, AC = 48 cm. Vastaus 51,9 syntyy, jos BC käsitellään kateettina."},{"id":"H13","ryhma":"kateetti","kysymys":"Suorakulmaisen kolmion kateetit ovat yhtä pitkät ja hypotenuusa on 6 cm. Laske kateetin pituus millimetrin tarkkuudella. Anna vastaus senttimetreinä ilman yksikköä.","vastaus":4.2,"vinkki":"Merkitse molempia kateetteja x:llä: x² + x² = 6².","selitys":"2x² = 36, x² = 18, x = √18 = 4,24…, joten kateetti on noin 4,2 cm. Vastaus 3 syntyy, jos hypotenuusa jaetaan kahdella, mutta silloin kateetit olisivat yhteensä vain hypotenuusan pituiset."},{"id":"H14","ryhma":"kateetti","kysymys":"Joel laski suorakulmaisen kolmion kateetin, kun hypotenuusa on 53 cm ja toinen kateetti 45 cm. Hän sai tulokseksi √(53² + 45²) ≈ 69,5 cm. Laske kateetin oikea pituus. Anna vastaus senttimetreinä ilman yksikköä.","vastaus":28,"vinkki":"Joelin tulos on pidempi kuin hypotenuusa. Vähennä neliöt.","selitys":"x² + 45² = 53², x² = 2 809 − 2 025 = 784, x = 28. Kateetti on 28 cm. Joel laski neliöt yhteen, vaikka kateetin neliö saadaan vähentämällä."},{"id":"H15","ryhma":"kaanteis","kysymys":"Kolmion sivut ovat 6 cm, 9 cm ja 11 cm. Vähennä pisimmän sivun neliöstä kahden lyhyemmän sivun neliöiden summa. Anna vastaus lukuna.","vastaus":4,"vinkki":"Pisin sivu on 11 cm. Laske 11² ja 6² + 9² erikseen.","selitys":"11² = 121 ja 6² + 9² = 36 + 81 = 117. Erotus on 121 − 117 = 4. Koska erotus ei ole 0, kolmio ei ole suorakulmainen."},{"id":"H16","ryhma":"kaanteis","kysymys":"Kolmion sivut ovat 85 cm, 13 cm ja 84 cm. Vähennä pisimmän sivun neliöstä kahden lyhyemmän sivun neliöiden summa. Anna vastaus lukuna.","vastaus":0,"vinkki":"Pisin sivu on ensimmäisenä, ei viimeisenä.","selitys":"85² = 7 225 ja 13² + 84² = 169 + 7 056 = 7 225. Erotus on 0, joten kolmio on suorakulmainen ja suora kulma on 85 cm:n sivun vastainen."},{"id":"H17","ryhma":"kaanteis","kysymys":"Onko kolmio, jonka sivut ovat 36 cm, 39 cm ja 15 cm, suorakulmainen?","vastaus":0,"vinkki":"Pisin sivu on 39 cm. Vertaa sen neliötä kahden muun sivun neliöiden summaan.","selitys":"39² = 1 521 ja 15² + 36² = 225 + 1 296 = 1 521. Luvut ovat samat, joten kolmio on suorakulmainen. Toinen vaihtoehto vertaa lyhintä sivua, ja kulmamittaria ei tarvita, koska käänteislause ratkaisee asian.","tyyppi":"monivalinta","vaihtoehdot":["On, koska 39² = 15² + 36².","Ei ole, koska 15² ei ole yhtä suuri kuin 36² + 39².","Sitä ei voi tietää ilman kulmamittaria."]},{"id":"H18","ryhma":"kaanteis","kysymys":"Neljän kolmion sivujen pituudet ovat:\nKolmio 1: 18 cm, 24 cm ja 30 cm\nKolmio 2: 8 cm, 10 cm ja 13 cm\nKolmio 3: 65 cm, 25 cm ja 60 cm\nKolmio 4: 21 cm, 75 cm ja 72 cm\n\nMontako näistä neljästä kolmiosta on suorakulmaisia?","vastaus":3,"vinkki":"Etsi jokaisesta kolmiosta pisin sivu, vaikka se ei olisi viimeisenä.","selitys":"Kolmio 1: 900 = 324 + 576. Kolmio 2: 169 ja 64 + 100 = 164, ei. Kolmio 3: 65² = 4 225 = 625 + 3 600. Kolmio 4: 75² = 5 625 = 441 + 5 184. Suorakulmaisia on kolme. Vastaus 1 syntyy, jos verrataan aina viimeistä sivua."},{"id":"H19","ryhma":"kaanteis","kysymys":"Kolmion DEF sivut ovat DE = 35 cm, EF = 12 cm ja DF = 37 cm. Kolmio on suorakulmainen. Minkä kärjen kulma on suora?","vastaus":1,"vinkki":"Suora kulma on pisimmän sivun vastainen kulma.","selitys":"Pisin sivu on DF = 37 cm, ja sen vastainen kärki on E, koska sivun DF nimessä ei ole kirjainta E. Tarkistus: 12² + 35² = 144 + 1 225 = 1 369 = 37².","tyyppi":"monivalinta","vaihtoehdot":["D","E","F"]},{"id":"H20","ryhma":"kaanteis","kysymys":"Kolmion kaksi lyhyintä sivua ovat 33 cm ja 56 cm. Kuinka pitkä kolmion pisimmän sivun pitää olla, jotta kolmio on suorakulmainen? Anna vastaus senttimetreinä ilman yksikköä.","vastaus":65,"vinkki":"Pisimmän sivun neliön pitää olla yhtä suuri kuin kahden muun sivun neliöiden summa.","selitys":"c² = 33² + 56² = 1 089 + 3 136 = 4 225, c = √4 225 = 65 cm."}],"valmis_teksti":"Nimeät suorakulmaisen kolmion kateetit ja hypotenuusan myös silloin, kun kolmio annetaan kirjaimin. Lasket puuttuvan hypotenuusan tai kateetin Pythagoraan lauseella, kirjoitat lauseen niin, että hypotenuusa on yksin yhtälön toisella puolella, annat tuloksen tarkkana arvona ja likiarvona ja tarkistat, että hypotenuusa on pisin sivu. Käänteislauseella päättelet sivujen pituuksista, onko kolmio suorakulmainen, vertaamalla pisimmän sivun neliötä kahden muun sivun neliöiden summaan. Tämä taito on nyt näytetty."};

      return `<div class="box warn"><h3>${esc(o.otsikko)}</h3><p style="margin:0">${esc(o.sisalto)}</p></div>`;

/* ---------- lukusuora ---------- */
const svg=document.getElementById("nlsvg"), rng=document.getElementById("nlrange"), out=document.getElementById("nlout");
const X0=34, X1=606, Y=62;
function piirraNL(v){
  const ala=Math.floor(v/10)*10, yla=ala+10, puoli=ala+5;
  const pyor = (v%10)>=5 ? yla : ala;
  const x = n => X0 + (n/100)*(X1-X0);
  let s=`<line class="rail" x1="${X0}" y1="${Y}" x2="${X1}" y2="${Y}"/>`;
  for(let n=0;n<=100;n+=10){
    const near = (n===ala||n===yla);
    s+=`<line class="tick" x1="${x(n)}" y1="${Y-7}" x2="${x(n)}" y2="${Y+7}"/>`;
    s+=`<text class="stop${near?" near":""}" x="${x(n)}" y="${Y+24}" text-anchor="middle">${n}</text>`;
  }
  s+=`<line class="halfway" x1="${x(puoli)}" y1="${Y-16}" x2="${x(puoli)}" y2="${Y+12}"/>`;
  s+=`<text class="stop" x="${x(puoli)}" y="${Y-22}" text-anchor="middle">puoliväli ${puoli}</text>`;
  s+=`<circle class="dot" cx="${x(v)}" cy="${Y}" r="6"/>`;
  s+=`<text class="val" x="${x(v)}" y="${Y-32}" text-anchor="middle">${v}</text>`;
  s+=`<path d="M ${x(v)} ${Y+38} L ${x(pyor)} ${Y+38}" stroke="var(--core)" stroke-width="2" fill="none"/>`;
  s+=`<path d="M ${x(pyor)} ${Y+38} l ${x(pyor)>x(v)?-7:7} -4 l 0 8 z" fill="var(--core)"/>`;
  svg.innerHTML=s;
  out.textContent = `${v} pyöristyy → ${pyor}`;
}
if(svg){ piirraNL(+rng.value); rng.addEventListener("input",e=>piirraNL(+e.target.value)); }

/* ---------- paikka-arvotaulu ---------- */
const ntTaulu=document.getElementById("ntTaulu");
if(ntTaulu){
  const O=D.teksti.find(x=>x.tyyppi==="numerotaulu");
  const PAIKAT=["ykköset","kymmenet","sadat","tuhannet","kymmenettuhannet"];
  const LYH=["Y","K","S","T","KT"];
  const IDX={kymmenet:1, sadat:2, tuhannet:3};
  let ntI=0;
  document.getElementById("ntValinta").innerHTML=O.esimerkit.map((e,i)=>
    `<button type="button" data-i="${i}" aria-pressed="${i===0}">${e.luku.toLocaleString("fi-FI",{maximumFractionDigits:10})} → ${e.tarkkuus}</button>`).join("");
  function ntPiirra(){
    const e=O.esimerkit[ntI], t=IDX[e.tarkkuus], kerroin=Math.pow(10,t);
    const tulos=Math.floor((e.luku+kerroin/2)/kerroin)*kerroin;
    const lev=Math.max(String(e.luku).length, String(tulos).length);
    const num=String(e.luku).padStart(lev,"0").split("");
    const res=String(tulos).padStart(lev,"0").split("");
    const luokka=(i,arr,vain0)=>{
      const p=arr.length-1-i;
      if(vain0) return p<t ? "nt-ruutu nolla" : "nt-ruutu";
      if(p===t) return "nt-ruutu kohta";
      if(p===t-1) return "nt-ruutu ratkaiseva";
      return "nt-ruutu";
    };
    const otsat=num.map((_,i)=>`<span class="otsa">${LYH[num.length-1-i]||""}</span>`).join("");
    const rivi1=num.map((n,i)=>`<span class="${luokka(i,num,false)}">${n}</span>`).join("");
    const rivi2=res.map((n,i)=>`<span class="${luokka(i,res,true)}">${n}</span>`).join("");
    const ratk=+num[num.length-t];
    const ylos=ratk>=5;
    ntTaulu.innerHTML=
      `<div class="nt-rivi">${otsat}</div>
       <div class="nt-rivi">${rivi1}<span class="nimi">luku</span></div>
       <div class="nt-rivi"><span class="nt-nuoli" style="margin-left:${(num.length-1-t)*58+18}px">${ylos?"▲ ylös":"▼ alas"}</span></div>
       <div class="nt-rivi">${rivi2}<span class="nimi">pyöristettynä</span></div>`;
    document.getElementById("ntSelite").innerHTML =
      `Pyöristetään <b>${PAIKAT[t]}</b> (sininen ruutu). Ratkaiseva numero on <b>${ratk}</b> (keltainen ruutu). ` +
      (ylos ? `Se on 5 tai suurempi, joten sininen ruutu kasvaa yhdellä.` : `Se on pienempi kuin 5, joten sininen ruutu pysyy ennallaan.`) +
      ` Kaikki keltaisen oikealla puolella muuttuu nolliksi. Vastaus on <b>${tulos.toLocaleString("fi-FI",{maximumFractionDigits:10})}</b>.`;
    document.querySelectorAll("#ntValinta button").forEach((b,i)=>b.setAttribute("aria-pressed",String(i===ntI)));
  }
  document.getElementById("ntValinta").addEventListener("click",e=>{
    const b=e.target.closest("button"); if(!b) return; ntI=+b.dataset.i; ntPiirra();
  });
  ntPiirra();
}

/* ---------- laskujärjestys-widget ---------- */
const ljExp=document.getElementById("ljExp");
if(ljExp && D.kokeilu){
  let ljI=0, ljTokens=[], ljStep=0;
  const laske=(a,op,b)=>{a=+a;b=+b;return op==="×"?a*b:op==="÷"?a/b:op==="+"?a+b:a-b;};
  function ljAlku(){
    const l=D.kokeilu[ljI];
    ljTokens=l.lauseke.replace(/\(/g,"( ").replace(/\)/g," )").split(/\s+/).filter(Boolean);
    ljStep=0; ljPiirra(); ljViesti("","");
  }
  function ljViesti(t,lk){const f=document.getElementById("ljFb"); f.textContent=t; f.className="lj-fb "+(lk||"");}
  function ljPiirra(){
    const l=D.kokeilu[ljI];
    document.getElementById("ljStep").textContent =
      ljStep>=l.askeleet.length ? "valmis" : `askel ${ljStep+1} / ${l.askeleet.length}`;
    if(ljStep>=l.askeleet.length){
      ljExp.innerHTML=`<span class="valmis">${l.lauseke} = ${l.vastaus}</span>`;
      return;
    }
    ljExp.innerHTML=ljTokens.map((t,i)=>
      "×÷+−".includes(t) ? `<button type="button" class="op" data-i="${i}">${t}</button>`
                         : `<span class="tok">${t}</span>`).join("");
    ljExp.querySelectorAll("button.op").forEach(b=>b.addEventListener("click",()=>ljKlikkaa(+b.dataset.i)));
  }
  function ljKlikkaa(i){
    const l=D.kokeilu[ljI], odotettu=l.askeleet[ljStep];
    const ehdotus=[ljTokens[i-1],ljTokens[i],ljTokens[i+1]].join(" ");
    if(ehdotus!==odotettu){
      ljViesti(ljStep===0
        ? "Ei vielä. Sulkeet ovat vahvimmat, sitten kerto ja jako. Yhtä vahvat vasemmalta oikealle."
        : "Ei vielä. Kumpi jäljellä olevista on vahvempi?", "no");
      return;
    }
    const arvo=laske(ljTokens[i-1],ljTokens[i],ljTokens[i+1]);
    let alku=i-1, loppu=i+1;
    if(ljTokens[i-2]==="(" && ljTokens[i+2]===")"){ alku=i-2; loppu=i+2; }
    ljTokens.splice(alku, loppu-alku+1, String(arvo));
    ljStep++;
    ljViesti(ljStep>=l.askeleet.length ? "Valmis. Vastaus on "+l.vastaus+"." : "Oikein. Jatka seuraavaan.", "ok");
    ljPiirra();
  }
  document.getElementById("ljSeuraava").addEventListener("click",()=>{
    ljI=(ljI+1)%D.kokeilu.length; ljAlku();
  });
  ljAlku();
}

/* ---------- harjoitukset ----------
   Kaksi vastaustyyppiä: "numero" (oletus, tekstikenttä + Number()-vertailu) ja
   "monivalinta" (valintapainikkeet, h.vaihtoehdot[] + h.vastaus = oikean vaihtoehdon indeksi).
   Jos D.harjoitukset puuttuu tai on tyhjä, koko osio piilotetaan (näyttötaidot, ei kirjallista
   harjoitusta: liikunta, kuvataide). */
/* Kysymyksessä voi olla luettavaa aineistoa ja sen jälkeen varsinainen kysymys,
   erotettuna tyhjällä rivillä. Viimeinen osa on kysymys, sitä edeltävät aineistoa. */
const kysymysHtml = t => {
  const osat = String(t).split(/\n\s*\n/).map(x=>x.trim()).filter(Boolean);
  if(osat.length < 2) return osat[0] || "";
  const kysymys = osat.pop();
  return osat.map(p=>`<span class="aineisto">${p}</span>`).join("")
       + `<span class="kysymysrivi">${kysymys}</span>`;
};

const ONKO_HARJOITUKSIA = Array.isArray(D.harjoitukset) && D.harjoitukset.length > 0;
const RYHMAT = ONKO_HARJOITUKSIA ? D.harjoitusryhmat : [];
const tila={};
if(ONKO_HARJOITUKSIA) D.harjoitukset.forEach(h=>tila[h.id]={ratkaistu:false, yritetty:false});
const muotoile = n => (typeof n==="number") ? n.toLocaleString("fi-FI",{maximumFractionDigits:10}) : n;

if(!ONKO_HARJOITUKSIA){
  document.getElementById("harjoitukset").style.display = "none";
  const prog = document.querySelector(".progress");
  if(prog) prog.style.display = "none";
} else {

document.getElementById("harjoitukset").innerHTML = RYHMAT.map(r=>{
  const items=D.harjoitukset.filter(h=>h.ryhma===r.id);
  return `<section class="grp"><div class="grp-head"><h3>${r.nimi}</h3><span>${r.info}</span></div>${

      const nro=D.harjoitukset.indexOf(h)+1;
      const vastausUi = h.tyyppi==="monivalinta"
        ? `<div class="row mv" role="group" aria-label="Vaihtoehdot tehtävään ${nro}">
             ${h.vaihtoehdot.map((v,vi)=>`<button type="button" class="btn ghost mv-valinta" data-mv="${h.id}" data-i="${vi}">${v}</button>`).join("")}
           </div>`
        : `<div class="row">
             <input type="text" inputmode="numeric" id="in-${h.id}" aria-label="Vastaus tehtävään ${nro}" placeholder="vastaus">
             <button type="button" class="btn" data-tarkista="${h.id}">Tarkista</button>
             <button type="button" class="btn ghost" data-vinkki="${h.id}">Vinkki</button>
           </div>`;
      return `<div class="ex" id="ex-${h.id}">
        <div class="q"><span class="num">${nro}.</span><span class="txt">${kysymysHtml(h.kysymys)}</span></div>
        ${h.kuuntele ? `<div class="kuuntele">
          <button type="button" class="btn ghost" data-kuuntele="${h.id}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16.5 8.5a5 5 0 010 7"/></svg>Kuuntele</button>
          <button type="button" class="btn ghost" data-hitaasti="${h.id}">Kuuntele hitaasti</button>
          <p class="varateksti" id="vara-${h.id}" hidden></p></div>` : ""}

}).join("");

function paivitaEdistyminen(){
  const n=Object.values(tila).filter(t=>t.ratkaistu).length, kaikki=D.harjoitukset.length;
  document.getElementById("pbar").style.width=Math.round(n/kaikki*100)+"%";
  document.getElementById("pcnt").textContent=`${n} / ${kaikki}`;
  document.getElementById("valmis").innerHTML = n===kaikki
    ? `<div class="done"><h3>Kaikki ${kaikki} oikein.</h3>${D.valmis_teksti || "Tämä taito on nyt näytetty."}</div>`
    : "";
}

function merkitseTulos(id, oikein, viesti){
  const fb=document.getElementById("fb-"+id), kortti=document.getElementById("ex-"+id);
  tila[id].yritetty=true;
  if(oikein){
    tila[id].ratkaistu=true;
    kortti.dataset.tila="oikein";
    fb.className="fb ok"; fb.textContent=viesti;
  } else {
    kortti.dataset.tila="vaarin";
    fb.className="fb no"; fb.textContent=viesti;
  }
  paivitaEdistyminen();
}

/* Suomalainen lukumuoto: välilyönti on tuhaterotin, pilkku desimaalierotin.
   Piste voi olla kumpi tahansa. Se tulkitaan tuhaterottimeksi VAIN silloin, kun
   koko luku on aitoa tuhaterotinmuotoa: alkuosa 1–3 numeroa ilman etunollaa ja
   jokainen jatko-osa täsmälleen 3 numeroa (1.500, 12.345.678). Kaikissa muissa
   tapauksissa piste on desimaalipiste — myös 0.125, joka vanhalla säännöllä
   ("3 numeroa pisteen jäljessä = tuhaterotin") luettiin virheellisesti luvuksi 125. */
const TUHATEROTIN = /^[1-9]\d{0,2}(\.\d{3})+$/;
function lueLuku(teksti){
  // Murtoluku (3/4, -3/4) ja sekaluku (1 2/3, -1 2/3) hyväksytään sellaisinaan.
  const raaka = String(teksti).replace(/\u00a0/g, " ").trim();
  let m = raaka.match(/^(-?)(\d+)\s+(\d+)\s*\/\s*(\d+)$/);
  if(m){ const nim = Number(m[4]); if(nim === 0) return null;
    const v = Number(m[2]) + Number(m[3]) / nim; return m[1] ? -v : v; }
  m = raaka.match(/^(-?)\s*(\d+)\s*\/\s*(\d+)$/);
  if(m){ const nim = Number(m[3]); if(nim === 0) return null;
    const v = Number(m[2]) / nim; return m[1] ? -v : v; }
  let s = String(teksti).replace(/[\s\u00a0]/g, "");
  if(s === "") return null;
  if(s.indexOf(",") >= 0){
    s = s.replace(/\./g, "").replace(",", ".");
  } else if(TUHATEROTIN.test(s)){
    s = s.replace(/\./g, "");
  }
  const n = Number(s);
  return Number.isFinite(n) ? n : null;
}

function tarkista(id){
  const h=D.harjoitukset.find(x=>x.id===id);
  const kentta=document.getElementById("in-"+id);
  const fb=document.getElementById("fb-"+id);
  if(kentta.value.trim()===""){ fb.className="fb hint"; fb.textContent="Kirjoita vastaus ensin."; return; }
  const luku=lueLuku(kentta.value);
  if(luku===null){ fb.className="fb no"; fb.textContent="Vastauksen pitää olla luku tai murtoluku (esimerkiksi 3/4)."; return; }
  const oikein = Math.abs(luku - h.vastaus) < 1e-9;
  merkitseTulos(id, oikein, oikein ? "Oikein. "+h.selitys : `Ei vielä. ${h.vinkki} Kokeile uudelleen.`);
}

function tarkistaMonivalinta(id, valittuIndeksi, painike){
  const h=D.harjoitukset.find(x=>x.id===id);
  const rivi=painike.closest(".row");
  rivi.querySelectorAll(".mv-valinta").forEach(b=>b.disabled=true);
  const oikein = valittuIndeksi===h.vastaus;
  painike.classList.add(oikein?"mv-oikein":"mv-vaarin");
  if(!oikein){
    const oikeaBtn=rivi.querySelector(`[data-i="${h.vastaus}"]`);
    if(oikeaBtn) oikeaBtn.classList.add("mv-oikein");
  }
  merkitseTulos(id, oikein, oikein ? "Oikein. "+h.selitys : `Ei ihan. Oikea vastaus on korostettu. ${h.selitys||""}`);
}

/* Kuuntelu: selain lukee tekstin ääneen omalla puhesynteesillään (englanniksi, jos laitteessa on
   englanninkielinen ääni). Ei äänitiedostoja eikä verkkoyhteyttä. Jos laite ei osaa puhua,
   teksti näytetään luettavaksi — silloin tehtävä muuttuu luetun ymmärtämiseksi, mutta ei katkea. */
function puhu(id, nopeus){
  const h=D.harjoitukset.find(x=>x.id===id); if(!h || !h.kuuntele) return;
  const vara=document.getElementById("vara-"+id);
  const naytaTeksti=syy=>{ vara.hidden=false; vara.textContent=syy+" Teksti: "+h.kuuntele; };
  if(!("speechSynthesis" in window)){ naytaTeksti("Tämä laite ei osaa lukea ääneen."); return; }
  const s=window.speechSynthesis; s.cancel();
  const u=new SpeechSynthesisUtterance(h.kuuntele);
  u.lang=h.kieli||"en-GB"; u.rate=nopeus;
  const aanet=s.getVoices(), kieli=u.lang.slice(0,2);
  const aani=aanet.find(a=>a.lang===u.lang) || aanet.find(a=>a.lang && a.lang.startsWith(kieli));
  if(aani) u.voice=aani;
  else if(aanet.length) { naytaTeksti("Laitteessa ei ole englanninkielistä ääntä."); return; }
  u.onerror=()=>naytaTeksti("Ääneen lukeminen ei onnistunut.");
  s.speak(u);
}

document.getElementById("harjoitukset").addEventListener("click",e=>{
  const k=e.target.closest("[data-kuuntele]"), hk=e.target.closest("[data-hitaasti]");
  if(k) puhu(k.dataset.kuuntele, 0.9);
  if(hk) puhu(hk.dataset.hitaasti, 0.6);
  const t=e.target.closest("[data-tarkista]"), v=e.target.closest("[data-vinkki]"), mv=e.target.closest("[data-mv]");
  if(t) tarkista(t.dataset.tarkista);
  if(mv) tarkistaMonivalinta(mv.dataset.mv, Number(mv.dataset.i), mv);
  if(v){
    const h=D.harjoitukset.find(x=>x.id===v.dataset.vinkki);
    const fb=document.getElementById("fb-"+h.id);
    fb.className="fb hint"; fb.textContent=h.vinkki;
  }
});
document.getElementById("harjoitukset").addEventListener("keydown",e=>{
  if(e.key==="Enter" && e.target.id.startsWith("in-")){ e.preventDefault(); tarkista(e.target.id.slice(3)); }
});
