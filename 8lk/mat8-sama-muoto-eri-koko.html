<title>Sama muoto, eri koko</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">

<style>
:root{
  --paper:#EFF2F5; --surface:#FFFFFF; --surface-2:#F7F9FB;
  --grid:#DCE3EA; --line:#C9D3DC;
  --ink:#15222C; --ink-2:#4E626F; --ink-3:#7E8F9B;
  --core:#1B5A9E; --core-soft:#E4EDF6;
  --strong:#1F6E5C; --strong-soft:#E1F0EB;
  --chal:#9A6A16; --chal-soft:#F6EDDC;
  --alert:#A33A2B; --alert-soft:#F8E7E3;
  --shadow:0 1px 2px rgba(21,34,44,.06), 0 8px 24px -12px rgba(21,34,44,.18);
  --r:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0F161B; --surface:#18222A; --surface-2:#1D2830;
    --grid:#22303A; --line:#2E3E4A;
    --ink:#E8EFF4; --ink-2:#A3B4C0; --ink-3:#7A8B97;
    --core:#7FB2E4; --core-soft:#16303F;
    --strong:#77CDB4; --strong-soft:#123028;
    --chal:#E0B267; --chal-soft:#33270F;
    --alert:#E8907F; --alert-soft:#3A1E19;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -14px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --paper:#0F161B; --surface:#18222A; --surface-2:#1D2830;
  --grid:#22303A; --line:#2E3E4A;
  --ink:#E8EFF4; --ink-2:#A3B4C0; --ink-3:#7A8B97;
  --core:#7FB2E4; --core-soft:#16303F;
  --strong:#77CDB4; --strong-soft:#123028;
  --chal:#E0B267; --chal-soft:#33270F;
  --alert:#E8907F; --alert-soft:#3A1E19;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -14px rgba(0,0,0,.7);
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:16px; line-height:1.62;
  background-image:
    linear-gradient(to right, var(--grid) 1px, transparent 1px),
    linear-gradient(to bottom, var(--grid) 1px, transparent 1px);
  background-size:26px 26px;
}
.wrap{max-width:760px; margin:0 auto; padding:28px 20px 90px}
h1,h2,h3,h4{font-family:"Familjen Grotesk","IBM Plex Sans",system-ui,sans-serif; text-wrap:balance}

/* header */
header.top{background:var(--surface); border:1px solid var(--line); border-radius:var(--r);
  box-shadow:var(--shadow); padding:22px 24px; display:flex; gap:18px; align-items:flex-start}
.badge{flex:0 0 auto; width:54px; height:54px; border-radius:9px; display:grid; place-items:center;
  background:var(--core-soft); border:1px solid var(--core); color:var(--core)}
.badge svg{width:28px; height:28px; fill:none; stroke:currentColor; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round}
.eyebrow{font-family:"IBM Plex Mono",monospace; font-size:11px; letter-spacing:.14em;
  text-transform:uppercase; color:var(--ink-3); margin:0 0 5px}
header.top h1{margin:0; font-size:30px; font-weight:700; letter-spacing:-.015em}
header.top p{margin:5px 0 0; color:var(--ink-2); font-size:15px}
.tags{display:flex; flex-wrap:wrap; gap:5px; margin-top:11px}
.tag{font-family:"IBM Plex Mono",monospace; font-size:10.5px; letter-spacing:.05em; padding:2px 7px;
  border-radius:4px; background:var(--surface-2); border:1px solid var(--line); color:var(--ink-3)}
.tag.core{background:var(--core-soft); border-color:var(--core); color:var(--core)}

/* teksti */
article{margin-top:26px}
article h2{font-size:21px; font-weight:600; margin:32px 0 10px; letter-spacing:-.01em}
article p{margin:0 0 14px; max-width:64ch}
.lead{font-size:17.5px; color:var(--ink); border-left:3px solid var(--core); padding-left:16px; margin:0 0 8px}

.box{background:var(--surface); border:1px solid var(--line); border-radius:var(--r);
  padding:18px 22px; box-shadow:var(--shadow); margin:22px 0}
.box h3{margin:0 0 12px; font-size:16.5px; font-weight:600}
.box.warn{border-left:3px solid var(--alert)}
.box.note{border-left:3px solid var(--chal)}

ol.steps{margin:0; padding-left:0; list-style:none; counter-reset:s; display:grid; gap:12px}
ol.steps li{counter-increment:s; display:grid; grid-template-columns:auto 1fr; gap:13px; align-items:start}
ol.steps li::before{content:counter(s); font-family:"Familjen Grotesk",sans-serif; font-weight:700; font-size:14px;
  width:26px; height:26px; border-radius:50%; background:var(--core); color:#fff; display:grid; place-items:center; margin-top:2px}

ul.notes{margin:0; padding-left:19px}
ul.notes li{margin-bottom:7px}
ul.notes li:last-child{margin-bottom:0}

.tablewrap{overflow-x:auto}
table{border-collapse:collapse; width:100%; font-size:14.5px; min-width:460px}
th,td{text-align:left; padding:9px 13px; border-bottom:1px solid var(--line)}
th{font-family:"IBM Plex Mono",monospace; font-size:10.5px; letter-spacing:.1em; text-transform:uppercase;
  color:var(--ink-3); font-weight:400; background:var(--surface-2)}
tr:last-child td{border-bottom:0}
td b{color:var(--core); font-weight:600}
td:last-child{font-variant-numeric:tabular-nums; font-weight:600}

/* lukusuora */
.nl svg{width:100%; height:118px; display:block}
.nl .rail{stroke:var(--line); stroke-width:2}
.nl .tick{stroke:var(--line); stroke-width:1.5}
.nl .stop{fill:var(--ink-3); font-family:"IBM Plex Mono",monospace; font-size:11px}
.nl .stop.near{fill:var(--core); font-weight:600}
.nl .dot{fill:var(--chal)}
.nl .val{fill:var(--ink); font-family:"Familjen Grotesk",sans-serif; font-size:15px; font-weight:700}
.nl .halfway{stroke:var(--chal); stroke-dasharray:3 3; stroke-width:1.5}
.nl-controls{display:flex; align-items:center; gap:14px; margin-top:6px}
.nl-controls input{flex:1; accent-color:var(--core)}
.nl-out{font-family:"Familjen Grotesk",sans-serif; font-size:15px; font-weight:600; min-width:12.5em; text-align:right}

/* paikka-arvotaulu */
.box .ohje{margin:0 0 14px; font-size:14.5px; color:var(--ink-2)}
.nt-valinta{display:flex; flex-wrap:wrap; gap:7px; margin-bottom:16px}
.nt-valinta button{font:inherit; font-size:12.5px; font-family:"IBM Plex Mono",monospace; padding:5px 11px;
  border-radius:6px; border:1px solid var(--line); background:var(--surface-2); color:var(--ink-2); cursor:pointer}
.nt-valinta button[aria-pressed="true"]{background:var(--ink); color:var(--paper); border-color:var(--ink)}
.nt-valinta button:focus-visible{outline:2px solid var(--core); outline-offset:2px}
.nt-taulu{display:flex; flex-direction:column; gap:4px; align-items:flex-start; overflow-x:auto; padding-bottom:4px}
.nt-rivi{display:flex; gap:6px; align-items:center}
.nt-rivi .otsa{font-family:"IBM Plex Mono",monospace; font-size:9.5px; letter-spacing:.08em;
  text-transform:uppercase; color:var(--ink-3); width:52px; text-align:center}
.nt-ruutu{width:52px; height:52px; display:grid; place-items:center; border:1.5px solid var(--line);
  border-radius:7px; background:var(--surface-2); font-family:"IBM Plex Mono",monospace; font-size:24px}
.nt-ruutu.kohta{border-color:var(--core); background:var(--core-soft); color:var(--core); font-weight:500}
.nt-ruutu.ratkaiseva{border-color:var(--chal); background:var(--chal-soft); color:var(--chal); font-weight:500}
.nt-ruutu.nolla{color:var(--ink-3)}
.nt-rivi .nimi{font-size:12.5px; color:var(--ink-3); margin-left:12px; white-space:nowrap}
.nt-nuoli{font-size:17px; color:var(--chal); margin-left:6px}
.nt-selite{margin:14px 0 0; font-size:14.5px}
.nt-selite b{color:var(--core)}

/* vahvuusportaat */
.vp-tasot{display:grid; gap:9px; margin-bottom:18px}
.vp-taso{display:flex; gap:11px; align-items:flex-start; font-size:13.5px}
.vp-taso .vp-pallo{width:13px; height:13px; border-radius:4px; margin-top:5px; flex:0 0 auto}
.vp-taso[data-taso="sulkeet"] .vp-pallo{background:var(--core)}
.vp-taso[data-taso="kertojako"] .vp-pallo{background:var(--strong)}
.vp-taso[data-taso="yhteenvahennys"] .vp-pallo{background:var(--chal)}
.vp-taso strong{display:block; font-family:"Familjen Grotesk",sans-serif; font-weight:600; font-size:14.5px}
.vp-taso span{color:var(--ink-2)}
.vp-lauseke{display:flex; flex-wrap:wrap; gap:7px; align-items:flex-end; font-family:"IBM Plex Mono",monospace;
  font-size:25px; padding:10px 2px; min-height:64px}
.vp-lauseke .t{padding:2px 3px}
.vp-lauseke .op{position:relative; padding:2px 9px; border-radius:6px; font-weight:500}
.vp-lauseke .op[data-taso="sulkeet"]{background:var(--core-soft); color:var(--core)}
.vp-lauseke .op[data-taso="kertojako"]{background:var(--strong-soft); color:var(--strong)}
.vp-lauseke .op[data-taso="yhteenvahennys"]{background:var(--chal-soft); color:var(--chal)}
.vp-lauseke .op i{position:absolute; top:-9px; right:-6px; font-style:normal; font-family:"Familjen Grotesk",sans-serif;
  font-size:11px; font-weight:700; width:18px; height:18px; border-radius:50%; display:grid; place-items:center;
  background:currentColor}
.vp-lauseke .op i span{color:var(--surface)}
.vp-rivi{display:flex; align-items:center; gap:16px; margin-top:8px}
.vp-vastaus{font-family:"Familjen Grotesk",sans-serif; font-size:16px; font-weight:600; color:var(--strong)}

/* laskujärjestys-widget */
.lj-exp{display:flex; flex-wrap:wrap; gap:7px; align-items:center; font-family:"IBM Plex Mono",monospace;
  font-size:23px; padding:14px 4px; min-height:62px}
.lj-exp .tok{padding:2px 4px; color:var(--ink)}
.lj-exp button.op{font-family:"IBM Plex Mono",monospace; font-size:23px; padding:3px 12px; border-radius:7px;
  border:1.5px solid var(--line); background:var(--surface-2); color:var(--ink); line-height:1.2}
.lj-exp button.op:hover{border-color:var(--core); color:var(--core)}
.lj-exp button.op:focus-visible{outline:2px solid var(--core); outline-offset:2px}
.lj-exp .valmis{font-family:"Familjen Grotesk",sans-serif; font-size:23px; font-weight:700; color:var(--strong)}
.lj-fb{font-size:14.5px; min-height:1.5em; color:var(--ink-2)}
.lj-fb.no{color:var(--alert)}
.lj-fb.ok{color:var(--strong)}
.lj-row{display:flex; align-items:center; gap:14px; margin-top:10px}
.lj-step{font-family:"IBM Plex Mono",monospace; font-size:11.5px; letter-spacing:.1em;
  text-transform:uppercase; color:var(--ink-3)}

/* harjoitukset */
.progress{position:sticky; top:0; z-index:5; background:var(--surface); border:1px solid var(--line);
  border-radius:var(--r); padding:12px 18px; box-shadow:var(--shadow); display:flex; align-items:center;
  gap:14px; margin:34px 0 18px}
.progress .lbl{font-family:"IBM Plex Mono",monospace; font-size:11px; letter-spacing:.12em;
  text-transform:uppercase; color:var(--ink-3); white-space:nowrap}
.progress .meter{flex:1; height:7px; border-radius:4px; background:var(--surface-2); border:1px solid var(--line); overflow:hidden}
.progress .meter i{display:block; height:100%; background:var(--core); transition:width .25s ease}
.progress .cnt{font-family:"Familjen Grotesk",sans-serif; font-weight:700; font-variant-numeric:tabular-nums; white-space:nowrap}

.grp{margin-top:26px}
.grp-head{display:flex; align-items:baseline; gap:10px; border-bottom:1.5px solid var(--ink); padding-bottom:7px; margin-bottom:14px}
.grp-head h3{margin:0; font-size:17px; font-weight:600}
.grp-head span{font-size:12.5px; color:var(--ink-2)}

.ex{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:14px 16px; margin-bottom:10px}
.ex[data-tila="oikein"]{border-color:var(--strong); box-shadow:inset 3px 0 0 var(--strong)}
.ex[data-tila="vaarin"]{border-color:var(--alert); box-shadow:inset 3px 0 0 var(--alert)}
.ex .q{display:flex; gap:11px; align-items:baseline; flex-wrap:wrap}
.ex .num{font-family:"IBM Plex Mono",monospace; font-size:11.5px; color:var(--ink-3); min-width:2.4em}
.ex .txt{flex:1; min-width:190px; font-size:15.5px}
.ex .txt .aineisto{display:block; margin-bottom:9px; padding-left:12px;
  border-left:2px solid var(--line); color:var(--ink-2); line-height:1.6;
  /* Aineisto voi olla pieni taulukko, jonka rivit on erotettu rivinvaihdoilla.
     Ilman pre-lineä ne valuisivat yhdeksi kappaleeksi ja taulukko katoaisi. */
  white-space:pre-line}
.ex .txt .kysymysrivi{display:block; font-weight:600}
.ex .row{display:flex; gap:8px; align-items:center; margin-top:11px; flex-wrap:wrap}
.ex input[type=text]{font:inherit; font-family:"IBM Plex Mono",monospace; font-size:15px; width:8.5em;
  padding:7px 11px; border:1px solid var(--line); border-radius:7px; background:var(--surface-2);
  color:var(--ink); text-align:right}
.ex input:focus-visible{outline:2px solid var(--core); outline-offset:1px}
button{font:inherit; cursor:pointer}
.btn{font-size:13.5px; padding:7px 15px; border-radius:7px; border:1px solid var(--core);
  background:var(--core); color:#fff}
.btn.ghost{background:transparent; color:var(--ink-2); border-color:var(--line)}
.btn:focus-visible{outline:2px solid var(--core); outline-offset:2px}
.btn.mv-valinta{text-align:left}
/* kuuntelutehtävä: selaimen puhesynteesi lukee englanninkielisen tekstin */
.kuuntele{display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin:2px 0 10px}
.kuuntele .btn{display:inline-flex; gap:7px; align-items:center}
.kuuntele svg{width:16px; height:16px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round}
.kuuntele .varateksti{flex-basis:100%; font-size:14px; color:var(--ink-2); background:var(--surface-2);
  border-radius:7px; padding:8px 12px; margin:0}
.btn.mv-valinta:disabled{cursor:default; opacity:.65}
.btn.mv-oikein{background:var(--strong-soft); border-color:var(--strong); color:var(--strong); opacity:1}
.btn.mv-vaarin{background:var(--alert-soft); border-color:var(--alert); color:var(--alert); opacity:1}
.row.mv{gap:8px 10px}
.fb{margin-top:11px; font-size:14.5px; padding:10px 13px; border-radius:8px; line-height:1.5}
.fb.ok{background:var(--strong-soft); color:var(--strong)}
.fb.no{background:var(--alert-soft); color:var(--alert)}
.fb.hint{background:var(--chal-soft); color:var(--chal)}

.done{background:var(--strong-soft); border:1px solid var(--strong); color:var(--strong);
  border-radius:var(--r); padding:16px 20px; margin-top:20px; font-size:15.5px}
.done h3{margin:0 0 4px; font-size:17px; color:var(--strong)}

details.teacher{margin-top:34px; background:var(--surface); border:1px solid var(--line);
  border-left:3px solid var(--chal); border-radius:var(--r); padding:15px 20px; box-shadow:var(--shadow)}
details.teacher summary{cursor:pointer; font-family:"Familjen Grotesk",sans-serif; font-weight:600; font-size:15px}
details.teacher summary:focus-visible{outline:2px solid var(--core); outline-offset:3px}
details.teacher ul{margin:12px 0 0; padding-left:19px; color:var(--ink-2); font-size:14.5px}
details.teacher li{margin-bottom:8px}
details.teacher p{margin:12px 0 0; color:var(--ink-2); font-size:14.5px}

.back{display:inline-block; margin-top:30px; font-size:13.5px; color:var(--ink-2)}
.back a{color:var(--core)}

@media (prefers-reduced-motion: reduce){*{transition:none !important}}
@media (max-width:560px){
  .wrap{padding:16px 13px 70px}
  header.top h1{font-size:25px}
  .progress{flex-wrap:wrap}
}
</style>

<div class="wrap">

  <header class="top">
    <span class="badge"><svg viewBox="0 0 24 24" aria-hidden="true" id="ikoni"></svg></span>
    <div>
      <p class="eyebrow" id="eyebrow"></p>
      <h1 id="otsikko"></h1>
      <p id="kuvaus"></p>
      <div class="tags" id="tags"></div>
    </div>
  </header>

  <article id="teksti"></article>

  <div class="progress" aria-live="polite">
    <span class="lbl">Harjoitukset</span>
    <span class="meter"><i id="pbar" style="width:0%"></i></span>
    <span class="cnt" id="pcnt">0 / 20</span>
  </div>

  <div id="harjoitukset"></div>
  <div id="valmis"></div>

  <p class="back" id="back"></p>

</div>

<script>
const D = {"tavoite_id":"MAT8-GEO-06","oppiaine":"MAT","vuosiluokka":8,"taso":"ydin","otsikko":"Sama muoto, eri koko","kuvaus":"Osaan tunnistaa yhtenevät ja yhdenmuotoiset kuviot ja laskea yhdenmuotoisen kuvion puuttuvan sivun verrannolla.","versio":"0.2","paivitetty":"2026-10-04","ops":{"T":["T4","T16"],"S":["S5"]},"ikoni":"sivellin","eyebrow":"Matematiikka · 8. luokka · Geometria","teksti":[{"tyyppi":"johdanto","sisalto":"Kun suurennat kuvaa puhelimessa kahdella sormella, kaverin kasvot pysyvät saman näköisinä, vaikka kuva kasvaa. Jos taas venytät kuvaa kuvankäsittelyohjelmassa pelkästään sivusuunnassa, kasvot levenevät ja näyttävät vääristyneiltä. Ensimmäisessä tapauksessa kuvan muoto säilyy, toisessa ei. Ero syntyy siitä, miten pituudet muuttuvat: kahden sormen suurennus kertoo jokaisen pituuden samalla luvulla, sivusuuntainen venytys vain leveydet. Matematiikassa samanmuotoisia kuvioita sanotaan yhdenmuotoisiksi. Tässä taidossa opit tunnistamaan yhtenevät ja yhdenmuotoiset kuviot, löytämään niistä toisiaan vastaavat sivut ja kulmat ja laskemaan puuttuvan sivun verrannolla. Verrannon ratkaiseminen ristiin kertomalla on sinulle jo tuttua."},{"tyyppi":"kappale","otsikko":"Yhtenevät kuviot ja vastinosat","sisalto":"Kaksi kuviota ovat yhtenevät, jos ne ovat samanmuotoiset ja samankokoiset. Silloin ne voi asettaa päällekkäin niin, että ne peittävät toisensa täsmälleen. Kuviota saa siirtää ja kiertää, ja paperista leikatun kuvion saa myös kääntää nurin päin. Päällekkäin osuvat sivut ovat toistensa vastinsivuja ja päällekkäin osuvat kulmat toistensa vastinkulmia. Yhteinen nimi niille on vastinosat. Yhtenevien kuvioiden vastinsivut ovat yhtä pitkät ja vastinkulmat yhtä suuret. Kuvion asento paperilla ei kerro, mitkä osat vastaavat toisiaan, koska toinen kuvio voi olla kierretty tai käännetty. Siksi vastaavuus kerrotaan kärkien avulla: \"kolmiot ABC ja DEF ovat yhtenevät niin, että A vastaa D:tä, B E:tä ja C F:ää\". Lyhyesti kirjoitetaan ABC ≅ DEF, ja kärjet vastaavat toisiaan siinä järjestyksessä, jossa ne on kirjoitettu. Merkki ≅ yhdistää merkit ~ (sama muoto) ja = (sama koko). Kun vastinkärjet tiedetään, vastinsivut saadaan niistä: sivun päätepisteiden vastinkärjet ovat vastinsivun päätepisteet. Jos A vastaa E:tä ja C vastaa D:tä, sivun AC vastinsivu on ED eli DE, ja kulman A vastinkulma on kulma E."},{"tyyppi":"kappale","otsikko":"Yhdenmuotoinen kuvio: jokainen sivu samalla luvulla","sisalto":"Kaksi kuviota ovat yhdenmuotoiset, jos niiden vastinkulmat ovat yhtä suuret ja vastinsivut ovat verrannolliset. Verrannollisuus tarkoittaa, että toisen kuvion jokainen sivu saadaan kertomalla vastinsivu samalla luvulla. Tätä lukua sanotaan yhdenmuotoisuussuhteeksi, ja se saadaan jakamalla vastinsivut keskenään. Merkintä ABC ~ DEF tarkoittaa, että kolmiot ovat yhdenmuotoiset ja kärjet vastaavat toisiaan kirjoitusjärjestyksessä. Jos DE : AB = 1,5, kolmion DEF jokainen sivu on 1,5 kertaa kolmion ABC vastinsivu. Suhde AB : DE on silloin 1 : 1,5 eli noin 0,67, joten suhteesta kerrotaan aina, kumman kuvion sivu jaetaan kumman sivulla. Suhde voi olla suurempi kuin 1 (suurennos) tai pienempi kuin 1 (pienennös). Kun suhde on tasan 1, kuviot ovat yhtenevät, joten yhtenevät kuviot ovat myös yhdenmuotoisia. Miksi kertominen säilyttää muodon mutta saman pituuden lisääminen ei? Muoto riippuu kuvion sivujen keskinäisistä suhteista. Suorakulmiossa 2 cm × 3 cm pidempi sivu on 1,5-kertainen lyhyempään sivuun verrattuna (3 : 2 = 1,5). Kun molemmat sivut kerrotaan kahdella, saadaan 4 cm × 6 cm, ja suhde on yhä 6 : 4 = 1,5. Jos kumpaankin sivuun lisätään 2 cm, saadaan 4 cm × 5 cm, jossa suhde on vain 5 : 4 = 1,25: suorakulmio on lähempänä neliötä, eli muoto muuttui. Kulmat eivät muutu suurennoksessa, koska suurennos pidentää sivuja mutta ei käännä niitä: puhelimen näytön nurkka on suora kulma, oli kuva miten suuri tahansa."},{"tyyppi":"kappale","otsikko":"Yhtenevä, yhdenmuotoinen vai ei kumpikaan","sisalto":"Kun kahdesta kuviosta tunnetaan kaikki sivut ja kulmat, päättele näin. Etsi ensin vastinsivut. Jos vastinkärkiä ei kerrota, pari sivut pituusjärjestyksessä: yhdenmuotoisissa kuvioissa lyhin sivu vastaa lyhintä ja pisin pisintä, koska kaikki sivut kerrotaan samalla positiivisella luvulla eikä niiden järjestys siksi muutu. Tämän taidon nelikulmiot ovat suorakulmioita, suunnikkaita, neljäkkäitä ja neliöitä, joissa riittää parittaa lyhyempi sivu lyhyempään ja pidempi pidempään. Muissa monikulmioissa pitää lisäksi katsoa, missä järjestyksessä sivut ovat kuvion ympäri. Laske jokaisen vastinsivuparin suhde. Jos suhteet ovat samat ja vastinkulmat yhtä suuret, kuviot ovat yhdenmuotoiset, ja jos suhde on lisäksi 1, ne ovat yhtenevät. Jos yksikin suhde poikkeaa muista tai jokin vastinkulma on eri suuri, kuviot eivät ole yhdenmuotoisia eivätkä yhteneviä. Nelikulmioissa tarvitaan molemmat ehdot. Suorakulmioiden 2 cm × 3 cm ja 2 cm × 5 cm kaikki kulmat ovat suoria, mutta vastinsivujen suhteet 1 ja noin 1,67 eroavat, joten suorakulmiot eivät ole yhdenmuotoiset. Neliön, jonka sivu on 4 cm, ja neljäkkään, jonka sivu on 8 cm, kaikkien vastinsivujen suhde on 2. Jos neljäkkään kulmat ovat 60° ja 120°, kuviot eivät silti ole yhdenmuotoiset, koska vastinkulmat eroavat. Kaksi neliötä sen sijaan ovat aina yhdenmuotoiset: kaikki kulmat ovat suoria, ja jokaisen sivuparin suhde on sama. Suorakulmiot ovat yhdenmuotoiset, kun pidempien sivujen suhde on sama kuin lyhyempien sivujen suhde. Esimerkiksi 4 cm × 10 cm ja 15 cm × 6 cm ovat yhdenmuotoiset (15 : 10 = 1,5 ja 6 : 4 = 1,5), vaikka mitat on kirjoitettu eri järjestyksessä. Kolmioiden yhdenmuotoisuuden voi todeta vähemmilläkin tiedoilla, mutta se kuuluu myöhempään taitoon. Tässä taidossa kerrotaan tehtävässä, että kolmiot ovat yhdenmuotoiset."},{"tyyppi":"saanto","otsikko":"Näin lasket puuttuvan sivun","askeleet":["Kirjoita vastinkärjet pareiksi tehtävän tekstistä, esimerkiksi A–E, B–D ja C–F. Älä päättele niitä kuvion asennosta tai aakkosjärjestyksestä.","Etsi tuntemattoman sivun vastinsivu ja lisäksi yksi vastinsivupari, jonka molemmat pituudet tunnetaan.","Kirjoita verranto niin, että saman kuvion sivut ovat samassa kohdassa: toisen kuvion sivu jaettuna ensimmäisen kuvion vastinsivulla on yhtä suuri kuin toisen kuvion toinen sivu jaettuna ensimmäisen kuvion vastinsivulla.","Kerro ristiin ja ratkaise tuntematon.","Tarkista, että molemmat vastinsivuparit antavat saman suhteen. Jos toinen kuvio on suurempi, myös puuttuvan sivun pitää olla vastinsivuaan pidempi."]},{"tyyppi":"taulukko","otsikko":"Esimerkki: kolmiot ABC ja DEF, joissa A vastaa E:tä, B D:tä ja C F:ää","otsikkorivi":["Vaihe","Merkintä","Selitys"],"rivit":[["Tiedot","AB = 6 cm, AC = 14 cm, ED = 9 cm, EF = x","kysytään sivua EF"],["Vastinkärjet","A–E, B–D, C–F","luetaan tehtävän tekstistä"],["Vastinsivut","AB ja ED, AC ja EF","A–E ja B–D antavat ED, A–E ja C–F antavat EF"],["Verranto","x/14 = 9/6","kolmion DEF sivut osoittajissa, kolmion ABC sivut nimittäjissä"],["Ristiin kertominen","6x = 14 · 9 = 126","kerrotaan puolittain nimittäjillä"],["Ratkaisu","x = 21","EF = 21 cm"],["Tarkistus","9 : 6 = 1,5 ja 21 : 14 = 1,5","suhteet ovat samat, ja DEF on suurempi kolmio"]]},{"tyyppi":"ansa","otsikko":"Ansa 1: sivuihin ei lisätä samaa pituutta","sisalto":"Kolmion sivu 10 cm vastaa toisen kolmion sivua 15 cm, ja kysytään sivun 12 cm vastinsivua. Väärä päättely kuuluu: 10 cm kasvoi 5 cm, joten 12 cm kasvaa myös 5 cm, ja vastaus on 17 cm. Yhdenmuotoisessa kuviossa sivut kerrotaan samalla luvulla. Koska 15 : 10 = 1,5, oikea vastaus on 12 cm · 1,5 = 18 cm. Saman pituuden lisääminen muuttaa sivujen keskinäisiä suhteita, kuten suorakulmio 2 cm × 3 cm muuttui muotoon 4 cm × 5 cm. Tarkista siksi aina suhteella: 17 : 12 on noin 1,42 eikä 1,5."},{"tyyppi":"ansa","otsikko":"Ansa 2: vastinsivut sekaisin verrannossa","sisalto":"Kolmiot ABC ja DEF ovat yhdenmuotoiset niin, että A vastaa D:tä, B E:tä ja C F:ää. AB = 8 cm, BC = 6 cm ja DE = 12 cm, ja kysytään sivua EF. Verranto 8/12 = x/6 näyttää järkevältä, mutta sen vasemmalla puolella on kolmion ABC sivu jaettuna kolmion DEF sivulla ja oikealla puolella toisin päin. Ristiin kertominen antaa 12x = 48 ja x = 4, vaikka DEF on suurempi kolmio ja EF:n pitäisi olla pidempi kuin 6 cm. Oikea verranto on x/6 = 12/8, josta 8x = 72 ja x = 9. Myös x/12 = 6/8 on oikein, koska siinä kummallakin puolella on saman kolmion kaksi sivua samassa järjestyksessä. Toinen tapa sotkea vastinsivut on valita ne sen mukaan, missä kohdassa kärki on paperilla tai mikä kirjain on aakkosissa samalla kohdalla. Jos tehtävässä sanotaan, että A vastaa F:ää, sivun AB vastinsivu alkaa F:stä, vaikka kärki D olisi piirretty samaan kohtaan kuin A. Lue vastinkärjet aina tehtävän tekstistä."},{"tyyppi":"ansa","otsikko":"Ansa 3: kulmaa ei kerrota suhteella","sisalto":"Jos kolmio suurennetaan niin, että yhdenmuotoisuussuhde on 3, ja sen yksi kulma on 40°, suurennoksen vastinkulma on edelleen 40° eikä 3 · 40° = 120°. Suurennos pidentää sivuja mutta ei muuta niiden välistä kulmaa. Kertominen ei voisi edes toimia: kolmion kulmat ovat yhteensä 180°, ja kolminkertaisina ne olisivat 540°. Puuttuvan kulman saat siis suoraan vastinkulmasta tai kolmion kulmien summasta 180°."},{"tyyppi":"muistilappu","otsikko":"Muista nämä","kohdat":["Yhtenevät kuviot: vastinsivut yhtä pitkät ja vastinkulmat yhtä suuret. Ne ovat myös yhdenmuotoisia.","Yhdenmuotoiset kuviot: vastinkulmat yhtä suuret ja vastinsivut kerrottu samalla luvulla.","Vastinosat luetaan kärkien järjestyksestä, ei kuvion asennosta eikä aakkosista.","Yhdenmuotoisuussuhde DE : AB on kuvion DEF sivu jaettuna kuvion ABC vastinsivulla.","Verrannossa saman kuvion sivut ovat samassa kohdassa: EF/BC = DE/AB.","Kulmat eivät muutu suurennoksessa eivätkä pienennöksessä."]}],"harjoitusryhmat":[{"id":"vastinosat","nimi":"Vastinsivut ja vastinkulmat","info":"Lue vastinkärjet tehtävän tekstistä. Yhtenevien kuvioiden vastinosat ovat yhtä suuret, ja yhdenmuotoisten kuvioiden vastinkulmat ovat yhtä suuret. Laskin on sallittu."},{"id":"tunnistus","nimi":"Yhtenevä, yhdenmuotoinen vai ei kumpikaan","info":"Yhdenmuotoisissa kuvioissa vastinkulmat ovat yhtä suuret ja vastinsivujen suhteet samat. Jos vastinkärkiä ei kerrota, pari sivut pituusjärjestyksessä. Laskin on sallittu."},{"id":"verranto","nimi":"Puuttuva sivu verrannolla","info":"Kirjoita verranto vihkoon niin, että saman kuvion sivut ovat samassa kohdassa, ja tarkista suhteella. Laskin on sallittu."}],"harjoitukset":[{"id":"H01","ryhma":"vastinosat","kysymys":"Kolmiot KLM ja PQR ovat yhtenevät niin, että K vastaa P:tä, L Q:ta ja M R:ää. KL = 4,6 cm, LM = 3,9 cm ja MK = 5,2 cm. Kuinka pitkä on sivu QR? Anna vastaus senttimetreinä ilman yksikköä.","vastaus":3.9,"vinkki":"Sivun QR päätepisteet Q ja R vastaavat kärkiä L ja M.","selitys":"Q vastaa L:ää ja R vastaa M:ää, joten QR on sivun LM vastinsivu. Yhtenevien kuvioiden vastinsivut ovat yhtä pitkät: QR = LM = 3,9 cm."},{"id":"H02","ryhma":"vastinosat","kysymys":"Kolmiot ABC ja DEF ovat yhtenevät niin, että A vastaa F:ää, B E:tä ja C D:tä. AB = 8 cm, BC = 11 cm ja CA = 6 cm. Kuinka pitkä on sivu DE? Anna vastaus senttimetreinä ilman yksikköä.","vastaus":11,"vinkki":"Etsi kärkien D ja E vastinkärjet. Aakkosjärjestys ei ratkaise.","selitys":"D vastaa C:tä ja E vastaa B:tä, joten DE on sivun CB eli BC vastinsivu: DE = 11 cm. Vastaus 8 syntyy, jos sivut paritetaan aakkosjärjestyksessä (AB ja DE)."},{"id":"H03","ryhma":"vastinosat","kysymys":"Kolmiot ABC ja DEF ovat yhdenmuotoiset niin, että A vastaa F:ää, B D:tä ja C E:tä.\n\nMikä on sivun AC vastinsivu?","vastaus":1,"vinkki":"Etsi erikseen kärjen A ja kärjen C vastinkärki.","selitys":"A vastaa F:ää ja C vastaa E:tä, joten sivun AC vastinsivu on FE. Sivu DF on sivun BA vastinsivu ja sivu DE sivun BC vastinsivu.","tyyppi":"monivalinta","vaihtoehdot":["DF","FE","DE"]},{"id":"H04","ryhma":"vastinosat","kysymys":"Kolmiot GHJ ja KLM ovat yhtenevät niin, että G vastaa L:ää, H M:ää ja J K:ta. Kulma G on 41° ja kulma H on 76°. Kuinka suuri on kulma K? Anna vastaus asteina ilman yksikköä.","vastaus":63,"vinkki":"Minkä kärjen vastinkärki K on? Laske sen kulma kulmien summan avulla.","selitys":"K vastaa J:tä. Kulma J on 180° − 41° − 76° = 63°. Yhtenevien kuvioiden vastinkulmat ovat yhtä suuret, joten kulma K on 63°."},{"id":"H05","ryhma":"vastinosat","kysymys":"Kolmiot ABC ja DEF ovat yhdenmuotoiset niin, että A vastaa D:tä, B E:tä ja C F:ää, ja yhdenmuotoisuussuhde DE : AB on 2,5. Kulma B on 48°. Kuinka suuri on kulma E? Anna vastaus asteina ilman yksikköä.","vastaus":48,"vinkki":"Muuttaako suurennos kulmia?","selitys":"Yhdenmuotoisten kuvioiden vastinkulmat ovat yhtä suuret, joten kulma E on 48°. Vastaus 120 syntyy, jos kulma kerrotaan suhteella 2,5."},{"id":"H06","ryhma":"vastinosat","kysymys":"Kolmiot ABC ja DEF ovat yhdenmuotoiset niin, että A vastaa D:tä, B E:tä ja C F:ää. AB = 12 cm ja DE = 15 cm. Mikä on yhdenmuotoisuussuhde DE : AB? Anna vastaus desimaalilukuna.","vastaus":1.25,"vinkki":"Jaa kolmion DEF sivu kolmion ABC vastinsivulla.","selitys":"DE : AB = 15 : 12 = 1,25. Kolmion DEF jokainen sivu on 1,25 kertaa kolmion ABC vastinsivu. Väärin päin jaettuna saisit 0,8."},{"id":"H07","ryhma":"tunnistus","kysymys":"Suorakulmion sivut ovat 7 cm ja 10 cm. Se suurennetaan yhdenmuotoiseksi suorakulmioksi, jonka lyhyempi sivu on 10,5 cm. Kuinka pitkä on suurennoksen pidempi sivu? Anna vastaus senttimetreinä ilman yksikköä.","vastaus":15,"vinkki":"Millä luvulla lyhyempi sivu kerrottiin? Kerro pidempi sivu samalla luvulla.","selitys":"10,5 : 7 = 1,5, joten pidempi sivu on 10 cm · 1,5 = 15 cm. Vastaus 13,5 syntyy, jos pidempään sivuun lisätään sama 3,5 cm."},{"id":"H08","ryhma":"tunnistus","kysymys":"Pari 1: 6 cm × 8 cm ja 9 cm × 12 cm\nPari 2: 5 cm × 7 cm ja 8 cm × 10 cm\nPari 3: 3 cm × 8 cm ja 12 cm × 4,5 cm\nPari 4: 5 cm × 11 cm ja 11 cm × 5 cm\n\nMontako suorakulmiopareista on yhdenmuotoisia?","vastaus":3,"vinkki":"Laske pidempien sivujen suhde ja lyhyempien sivujen suhde. Kirjoitusjärjestys voi vaihdella.","selitys":"Pari 1: 12 : 8 = 1,5 ja 9 : 6 = 1,5, yhdenmuotoiset. Pari 2: 10 : 7 ≈ 1,43 ja 8 : 5 = 1,6, eivät ole (sivuihin on lisätty 3 cm). Pari 3: 12 : 8 = 1,5 ja 4,5 : 3 = 1,5, yhdenmuotoiset. Pari 4: mitat ovat samat eri järjestyksessä, joten suorakulmiot ovat yhtenevät (suhde 1). Yhtenevät kuviot ovat myös yhdenmuotoisia, joten yhdenmuotoisia pareja on kolme."},{"id":"H09","ryhma":"tunnistus","kysymys":"Pari 1: suorakulmio 5 cm × 12 cm ja suorakulmio 12 cm × 5 cm\nPari 2: neliö, jonka sivu on 6 cm, ja neljäkäs, jonka sivu on 6 cm ja kulmat 80° ja 100°\nPari 3: suorakulmio 3 cm × 4 cm ja suorakulmio 6 cm × 8 cm\nPari 4: suunnikas, jonka sivut ovat 5 cm ja 9 cm ja kulmat 50° ja 130°, ja suunnikas, jonka sivut ovat 9 cm ja 5 cm ja kulmat 130° ja 50°\n\nMontako pareista on yhteneviä?","vastaus":2,"vinkki":"Yhtenevien kuvioiden kaikki vastinsivut ovat yhtä pitkät ja kaikki vastinkulmat yhtä suuret. Asento ei ratkaise.","selitys":"Parit 1 ja 4 ovat yhtenevät: mitat ovat samat, vain eri järjestyksessä kirjoitettuina. Parissa 2 sivut ovat yhtä pitkät, mutta kulmat eroavat. Parissa 3 suorakulmiot ovat yhdenmuotoiset (suhde 2), mutta eivät yhtä suuret."},{"id":"H10","ryhma":"tunnistus","kysymys":"Nelikulmio 1 on neliö, jonka sivu on 3 cm. Nelikulmio 2 on neljäkäs, jonka sivu on 6 cm ja kulmat 50° ja 130°.\n\nMitä nelikulmiot ovat?","vastaus":2,"vinkki":"Tarkista erikseen sivujen suhteet ja vastinkulmat.","selitys":"Kaikkien sivujen suhde on 2, mutta neliön kulmat ovat 90° ja neljäkkään 50° ja 130°. Vastinkulmat eivät ole yhtä suuret, joten kuviot eivät ole yhdenmuotoisia eivätkä yhteneviä.","tyyppi":"monivalinta","vaihtoehdot":["yhtenevät","yhdenmuotoiset mutta eivät yhtenevät","ei kumpaakaan"]},{"id":"H11","ryhma":"tunnistus","kysymys":"Suunnikkaan 1 sivut ovat 4 cm ja 10 cm, ja sen kulmat ovat 70° ja 110°. Suunnikkaan 2 sivut ovat 6 cm ja 15 cm, ja sen kulmat ovat 70° ja 110°.\n\nMitä suunnikkaat ovat?","vastaus":1,"vinkki":"Laske lyhyempien sivujen suhde ja pidempien sivujen suhde ja vertaa kulmia.","selitys":"6 : 4 = 1,5 ja 15 : 10 = 1,5, ja kulmat ovat samat, joten suunnikkaat ovat yhdenmuotoiset. Ne eivät ole yhtenevät, koska suhde ei ole 1.","tyyppi":"monivalinta","vaihtoehdot":["yhtenevät","yhdenmuotoiset mutta eivät yhtenevät","ei kumpaakaan"]},{"id":"H12","ryhma":"tunnistus","kysymys":"Suorakulmion sivut ovat 4 cm ja 10 cm. Sen kumpaakin sivua pidennetään 2 cm. Mikä on uuden suorakulmion pidemmän sivun ja lyhyemmän sivun suhde? Anna vastaus desimaalilukuna.","vastaus":2,"vinkki":"Kirjoita ensin uuden suorakulmion mitat.","selitys":"Uusi suorakulmio on 6 cm × 12 cm, ja 12 : 6 = 2. Alkuperäisessä suhde on 10 : 4 = 2,5. Suhteet eroavat, joten pidennetty suorakulmio ei ole yhdenmuotoinen alkuperäisen kanssa."},{"id":"H13","ryhma":"tunnistus","kysymys":"Lue väitteet.\n1) Kaikki neliöt ovat yhdenmuotoisia keskenään.\n2) Kaikki suorakulmiot ovat yhdenmuotoisia keskenään.\n3) Yhtenevät kuviot ovat aina myös yhdenmuotoisia.\n4) Yhdenmuotoiset kuviot ovat aina myös yhteneviä.\n5) Kaikki tasasivuiset kolmiot ovat yhdenmuotoisia keskenään.\n\nMontako väitteistä on tosi?","vastaus":3,"vinkki":"Etsi jokaiselle väitteelle vastaesimerkki. Jos sellaista ei löydy, väite on tosi.","selitys":"Tosia ovat 1, 3 ja 5. Neliöiden ja tasasivuisten kolmioiden kulmat ovat aina samat ja sivujen suhde sama jokaisella sivulla. Väite 2 on epätosi (2 cm × 3 cm ja 2 cm × 5 cm), samoin väite 4 (neliöt, joiden sivut ovat 1 cm ja 2 cm)."},{"id":"H14","ryhma":"verranto","kysymys":"Kolmiot ABC ja DEF ovat yhdenmuotoiset niin, että A vastaa D:tä, B E:tä ja C F:ää. AB = 4 cm, BC = 6 cm ja DE = 7 cm. Kuinka pitkä on sivu EF? Anna vastaus senttimetreinä ilman yksikköä.","vastaus":10.5,"vinkki":"EF on sivun BC vastinsivu. Kirjoita verranto EF/BC = DE/AB.","selitys":"x/6 = 7/4, joten 4x = 42 ja x = 10,5. Tarkistus: 7 : 4 = 1,75 ja 10,5 : 6 = 1,75."},{"id":"H15","ryhma":"verranto","kysymys":"Kolmiot ABC ja PQR ovat yhdenmuotoiset niin, että A vastaa R:ää, B P:tä ja C Q:ta. Paperilla kolmio PQR on piirretty niin, että sen kärki P on samassa kohdassa kuin kolmion ABC kärki A. AB = 4 cm, BC = 9 cm ja RP = 6 cm. Kuinka pitkä on sivu PQ? Anna vastaus senttimetreinä ilman yksikköä.","vastaus":13.5,"vinkki":"Kärkien paikka paperilla ei ratkaise. Mitkä kärjet vastaavat P:tä ja Q:ta?","selitys":"P vastaa B:tä ja Q vastaa C:tä, joten PQ on sivun BC vastinsivu. RP on sivun AB vastinsivu. x/9 = 6/4, joten 4x = 54 ja x = 13,5."},{"id":"H16","ryhma":"verranto","kysymys":"Kolmio KLM on kolmion ABC pienennös: kolmiot ovat yhdenmuotoiset niin, että A vastaa K:ta, B L:ää ja C M:ää. AB = 20 cm, AC = 32 cm ja KL = 15 cm. Kuinka pitkä on sivu KM? Anna vastaus senttimetreinä ilman yksikköä.","vastaus":24,"vinkki":"KM on sivun AC vastinsivu. Pienennöksessä vastauksen pitää olla pienempi kuin 32.","selitys":"x/32 = 15/20, joten 20x = 480 ja x = 24. Tarkistus: 15 : 20 = 0,75 ja 24 : 32 = 0,75."},{"id":"H17","ryhma":"verranto","kysymys":"Nelikulmiot ABCD ja EFGH ovat yhdenmuotoiset niin, että A vastaa E:tä, B F:ää, C G:tä ja D H:ta. AB = 4 cm, CD = 10 cm ja EF = 3 cm. Kuinka pitkä on sivu GH? Anna vastaus senttimetreinä ilman yksikköä.","vastaus":7.5,"vinkki":"GH on sivun CD vastinsivu.","selitys":"x/10 = 3/4, joten 4x = 30 ja x = 7,5. Tarkistus: 3 : 4 = 0,75 ja 7,5 : 10 = 0,75."},{"id":"H18","ryhma":"verranto","kysymys":"Kolmiot ABC ja DEF ovat yhdenmuotoiset niin, että A vastaa D:tä, B E:tä ja C F:ää. Kolmion ABC sivut ovat AB = 4 cm, BC = 7 cm ja CA = 9 cm, ja DE = 6 cm. Kuinka pitkä on kolmion DEF piiri? Anna vastaus senttimetreinä ilman yksikköä.","vastaus":30,"vinkki":"Laske yhdenmuotoisuussuhde DE : AB. Kolmion DEF jokainen sivu on vastinsivu kerrottuna sillä.","selitys":"DE : AB = 6 : 4 = 1,5. Kolmion DEF sivut ovat 6 cm, 10,5 cm ja 13,5 cm, joten piiri on 30 cm. Saman saa kertomalla kolmion ABC piirin 20 cm luvulla 1,5."},{"id":"H19","ryhma":"verranto","kysymys":"Kolmiot ABC ja DEF ovat yhdenmuotoiset niin, että A vastaa D:tä, B E:tä ja C F:ää. AB = 8 cm, BC = 12 cm ja DE = 10 cm. Jaakko laski sivun EF näin:\n1) Vastinsivut ovat AB ja DE sekä BC ja EF.\n2) Verranto: x/12 = 8/10\n3) 10x = 96\n4) x = 9,6\n\nMonennessako vaiheessa on ensimmäinen virhe?","vastaus":2,"vinkki":"Onko verrannon kummallakin puolella saman kolmion sivu osoittajassa?","selitys":"Vaihe 1 on oikein. Vaiheessa 2 vasemmalla on DEF:n sivu jaettuna ABC:n sivulla, oikealla ABC:n sivu jaettuna DEF:n sivulla. Oikea verranto on x/12 = 10/8, josta x = 15. Jaakon tulos 9,6 on pienempi kuin 12, vaikka DEF on suurempi kolmio."},{"id":"H20","ryhma":"verranto","kysymys":"Kaksi kolmion muotoista purjetta ovat yhdenmuotoiset. Pienemmän purjeen sivut ovat 2,4 m, 3,2 m ja 4,0 m. Suuremman purjeen lyhin sivu on 3,0 m. Kuinka pitkä on suuremman purjeen pisin sivu? Anna vastaus metreinä ilman yksikköä.","vastaus":5,"vinkki":"Lyhin sivu vastaa lyhintä ja pisin pisintä.","selitys":"Suhde on 3,0 : 2,4 = 1,25, joten pisin sivu on 4,0 m · 1,25 = 5,0 m."}],"valmis_teksti":"Osaat nimetä yhtenevien ja yhdenmuotoisten kuvioiden vastinsivut ja vastinkulmat kärkien järjestyksestä, vaikka kuvio olisi eri asennossa. Päättelet, ovatko kuviot yhteneviä, yhdenmuotoisia vai ei kumpaakaan, ja perustelet sen vastinkulmilla ja vastinsivujen suhteilla. Tiedät, että yhdenmuotoisessa kuviossa jokainen sivu kerrotaan samalla luvulla ja kulmat pysyvät samoina, ja ratkaiset puuttuvan sivun verrannolla, jossa vastinsivut ovat samassa järjestyksessä. Tämä taito on nyt näytetty."};

const esc = s => s;
const osat = D.teksti.map(o=>{
  switch(o.tyyppi){
    case "johdanto":
      return `<p class="lead">${esc(o.sisalto)}</p>`;
    case "kappale":
      return `<h2>${esc(o.otsikko)}</h2><p>${esc(o.sisalto)}</p>`;
    case "saanto":
      return `<div class="box"><h3>${esc(o.otsikko)}</h3><ol class="steps">${
        o.askeleet.map(a=>`<li><span>${esc(a)}</span></li>`).join("")}</ol></div>`;
    case "taulukko":
      return `<div class="box"><h3>${esc(o.otsikko)}</h3><div class="tablewrap"><table><thead><tr>${
        o.otsikkorivi.map(h=>`<th>${h}</th>`).join("")}</tr></thead><tbody>${
        o.rivit.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join("")}</tr>`).join("")}</tbody></table></div></div>`;
    case "ansa":
      return `<div class="box warn"><h3>${esc(o.otsikko)}</h3><p style="margin:0">${esc(o.sisalto)}</p></div>`;
    case "muistilappu":
      return `<div class="box note"><h3>${esc(o.otsikko)}</h3><ul class="notes">${
        o.kohdat.map(k=>`<li>${esc(k)}</li>`).join("")}</ul></div>`;
    case "numerotaulu":
      return `<div class="box nt"><h3>${esc(o.otsikko)}</h3><p class="ohje">${esc(o.sisalto)}</p>
        <div class="nt-valinta" id="ntValinta"></div>
        <div class="nt-taulu" id="ntTaulu"></div>
        <p class="nt-selite" id="ntSelite"></p></div>`;
    case "vahvuusportaat":
      return `<div class="box vp"><h3>${esc(o.otsikko)}</h3><p class="ohje">${esc(o.sisalto)}</p>
        <div class="vp-tasot">${o.tasot.map(t=>
          `<div class="vp-taso" data-taso="${t.id}"><span class="vp-pallo"></span>
           <div><strong>${t.nimi}</strong><span>${t.selite}</span></div></div>`).join("")}</div>
        <div class="vp-lauseke" id="vpLauseke"></div>
        <div class="vp-rivi"><button type="button" class="btn ghost" id="vpSeuraava">Toinen lauseke</button>
        <span class="vp-vastaus" id="vpVastaus"></span></div></div>`;
    case "laskujarjestys":
      return `<div class="box lj"><h3>${esc(o.otsikko)}</h3><p style="margin:0 0 12px;font-size:14.5px;color:var(--ink-2)">${esc(o.sisalto)}</p>
        <div class="lj-exp" id="ljExp"></div>
        <div class="lj-fb" id="ljFb"></div>
        <div class="lj-row"><button type="button" class="btn ghost" id="ljSeuraava">Toinen lauseke</button>
        <span class="lj-step" id="ljStep"></span></div></div>`;
    case "lukusuora":

const svg=document.getElementById("nlsvg"), rng=document.getElementById("nlrange"), out=document.getElementById("nlout");
const X0=34, X1=606, Y=62;
function piirraNL(v){
  const ala=Math.floor(v/10)*10, yla=ala+10, puoli=ala+5;
  const pyor = (v%10)>=5 ? yla : ala;
  const x = n => X0 + (n/100)*(X1-X0);
  let s=`<line class="rail" x1="${X0}" y1="${Y}" x2="${X1}" y2="${Y}"/>`;
  for(let n=0;n<=100;n+=10){
    const near = (n===ala||n===yla);
    s+=`<line class="tick" x1="${x(n)}" y1="${Y-7}" x2="${x(n)}" y2="${Y+7}"/>`;
    s+=`<text class="stop${near?" near":""}" x="${x(n)}" y="${Y+24}" text-anchor="middle">${n}</text>`;
  }
  s+=`<line class="halfway" x1="${x(puoli)}" y1="${Y-16}" x2="${x(puoli)}" y2="${Y+12}"/>`;
  s+=`<text class="stop" x="${x(puoli)}" y="${Y-22}" text-anchor="middle">puoliväli ${puoli}</text>`;
  s+=`<circle class="dot" cx="${x(v)}" cy="${Y}" r="6"/>`;
  s+=`<text class="val" x="${x(v)}" y="${Y-32}" text-anchor="middle">${v}</text>`;
  s+=`<path d="M ${x(v)} ${Y+38} L ${x(pyor)} ${Y+38}" stroke="var(--core)" stroke-width="2" fill="none"/>`;
  s+=`<path d="M ${x(pyor)} ${Y+38} l ${x(pyor)>x(v)?-7:7} -4 l 0 8 z" fill="var(--core)"/>`;
  svg.innerHTML=s;
  out.textContent = `${v} pyöristyy → ${pyor}`;
}

/* ---------- laskujärjestys-widget ---------- */
const ljExp=document.getElementById("ljExp");
if(ljExp && D.kokeilu){
  let ljI=0, ljTokens=[], ljStep=0;
  const laske=(a,op,b)=>{a=+a;b=+b;return op==="×"?a*b:op==="÷"?a/b:op==="+"?a+b:a-b;};
  function ljAlku(){
    const l=D.kokeilu[ljI];
    ljTokens=l.lauseke.replace(/\(/g,"( ").replace(/\)/g," )").split(/\s+/).filter(Boolean);
    ljStep=0; ljPiirra(); ljViesti("","");
  }
  function ljViesti(t,lk){const f=document.getElementById("ljFb"); f.textContent=t; f.className="lj-fb "+(lk||"");}
  function ljPiirra(){
    const l=D.kokeilu[ljI];
    document.getElementById("ljStep").textContent =
      ljStep>=l.askeleet.length ? "valmis" : `askel ${ljStep+1} / ${l.askeleet.length}`;
    if(ljStep>=l.askeleet.length){
      ljExp.innerHTML=`<span class="valmis">${l.lauseke} = ${l.vastaus}</span>`;
      return;
    }
    ljExp.innerHTML=ljTokens.map((t,i)=>
      "×÷+−".includes(t) ? `<button type="button" class="op" data-i="${i}">${t}</button>`
                         : `<span class="tok">${t}</span>`).join("");
    ljExp.querySelectorAll("button.op").forEach(b=>b.addEventListener("click",()=>ljKlikkaa(+b.dataset.i)));
  }
  function ljKlikkaa(i){
    const l=D.kokeilu[ljI], odotettu=l.askeleet[ljStep];
    const ehdotus=[ljTokens[i-1],ljTokens[i],ljTokens[i+1]].join(" ");
    if(ehdotus!==odotettu){
      ljViesti(ljStep===0
        ? "Ei vielä. Sulkeet ovat vahvimmat, sitten kerto ja jako. Yhtä vahvat vasemmalta oikealle."
        : "Ei vielä. Kumpi jäljellä olevista on vahvempi?", "no");
      return;
    }
    const arvo=laske(ljTokens[i-1],ljTokens[i],ljTokens[i+1]);
    let alku=i-1, loppu=i+1;
    if(ljTokens[i-2]==="(" && ljTokens[i+2]===")"){ alku=i-2; loppu=i+2; }
    ljTokens.splice(alku, loppu-alku+1, String(arvo));
    ljStep++;
    ljViesti(ljStep>=l.askeleet.length ? "Valmis. Vastaus on "+l.vastaus+"." : "Oikein. Jatka seuraavaan.", "ok");
    ljPiirra();
  }
  document.getElementById("ljSeuraava").addEventListener("click",()=>{
    ljI=(ljI+1)%D.kokeilu.length; ljAlku();
  });
  ljAlku();
}

/* Suomalainen lukumuoto: välilyönti on tuhaterotin, pilkku desimaalierotin.
   Piste voi olla kumpi tahansa. Se tulkitaan tuhaterottimeksi VAIN silloin, kun
   koko luku on aitoa tuhaterotinmuotoa: alkuosa 1–3 numeroa ilman etunollaa ja
   jokainen jatko-osa täsmälleen 3 numeroa (1.500, 12.345.678). Kaikissa muissa
   tapauksissa piste on desimaalipiste — myös 0.125, joka vanhalla säännöllä
   ("3 numeroa pisteen jäljessä = tuhaterotin") luettiin virheellisesti luvuksi 125. */
const TUHATEROTIN = /^[1-9]\d{0,2}(\.\d{3})+$/;
function lueLuku(teksti){
  // Murtoluku (3/4, -3/4) ja sekaluku (1 2/3, -1 2/3) hyväksytään sellaisinaan.
  const raaka = String(teksti).replace(/\u00a0/g, " ").trim();
  let m = raaka.match(/^(-?)(\d+)\s+(\d+)\s*\/\s*(\d+)$/);
  if(m){ const nim = Number(m[4]); if(nim === 0) return null;
    const v = Number(m[2]) + Number(m[3]) / nim; return m[1] ? -v : v; }
  m = raaka.match(/^(-?)\s*(\d+)\s*\/\s*(\d+)$/);
  if(m){ const nim = Number(m[3]); if(nim === 0) return null;
    const v = Number(m[2]) / nim; return m[1] ? -v : v; }
  let s = String(teksti).replace(/[\s\u00a0]/g, "");
  if(s === "") return null;
  if(s.indexOf(",") >= 0){
    s = s.replace(/\./g, "").replace(",", ".");
  } else if(TUHATEROTIN.test(s)){
    s = s.replace(/\./g, "");
  }
  const n = Number(s);
  return Number.isFinite(n) ? n : null;
}

function tarkista(id){
  const h=D.harjoitukset.find(x=>x.id===id);
  const kentta=document.getElementById("in-"+id);
  const fb=document.getElementById("fb-"+id);
  if(kentta.value.trim()===""){ fb.className="fb hint"; fb.textContent="Kirjoita vastaus ensin."; return; }
  const luku=lueLuku(kentta.value);
  if(luku===null){ fb.className="fb no"; fb.textContent="Vastauksen pitää olla luku tai murtoluku (esimerkiksi 3/4)."; return; }
  const oikein = Math.abs(luku - h.vastaus) < 1e-9;
  merkitseTulos(id, oikein, oikein ? "Oikein. "+h.selitys : `Ei vielä. ${h.vinkki} Kokeile uudelleen.`);
}

function tarkistaMonivalinta(id, valittuIndeksi, painike){
  const h=D.harjoitukset.find(x=>x.id===id);
  const rivi=painike.closest(".row");
  rivi.querySelectorAll(".mv-valinta").forEach(b=>b.disabled=true);
  const oikein = valittuIndeksi===h.vastaus;
  painike.classList.add(oikein?"mv-oikein":"mv-vaarin");
  if(!oikein){
    const oikeaBtn=rivi.querySelector(`[data-i="${h.vastaus}"]`);
    if(oikeaBtn) oikeaBtn.classList.add("mv-oikein");
  }
  merkitseTulos(id, oikein, oikein ? "Oikein. "+h.selitys : `Ei ihan. Oikea vastaus on korostettu. ${h.selitys||""}`);
}

/* Kuuntelu: selain lukee tekstin ääneen omalla puhesynteesillään (englanniksi, jos laitteessa on
   englanninkielinen ääni). Ei äänitiedostoja eikä verkkoyhteyttä. Jos laite ei osaa puhua,
   teksti näytetään luettavaksi — silloin tehtävä muuttuu luetun ymmärtämiseksi, mutta ei katkea. */
function puhu(id, nopeus){
  const h=D.harjoitukset.find(x=>x.id===id); if(!h || !h.kuuntele) return;
  const vara=document.getElementById("vara-"+id);
  const naytaTeksti=syy=>{ vara.hidden=false; vara.textContent=syy+" Teksti: "+h.kuuntele; };
  if(!("speechSynthesis" in window)){ naytaTeksti("Tämä laite ei osaa lukea ääneen."); return; }
  const s=window.speechSynthesis; s.cancel();
  const u=new SpeechSynthesisUtterance(h.kuuntele);
  u.lang=h.kieli||"en-GB"; u.rate=nopeus;
  const aanet=s.getVoices(), kieli=u.lang.slice(0,2);
  const aani=aanet.find(a=>a.lang===u.lang) || aanet.find(a=>a.lang && a.lang.startsWith(kieli));
  if(aani) u.voice=aani;
  else if(aanet.length) { naytaTeksti("Laitteessa ei ole englanninkielistä ääntä."); return; }
  u.onerror=()=>naytaTeksti("Ääneen lukeminen ei onnistunut.");
  s.speak(u);
}
