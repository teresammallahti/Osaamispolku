<title>Pythagoraan pääsykoe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">

<style>
:root{
  --paper:#EFF2F5; --surface:#FFFFFF; --surface-2:#F7F9FB;
  --grid:#DCE3EA; --line:#C9D3DC;
  --ink:#15222C; --ink-2:#4E626F; --ink-3:#7E8F9B;
  --core:#1B5A9E; --core-soft:#E4EDF6;
  --strong:#1F6E5C; --strong-soft:#E1F0EB;
  --chal:#9A6A16; --chal-soft:#F6EDDC;
  --alert:#A33A2B; --alert-soft:#F8E7E3;
  --shadow:0 1px 2px rgba(21,34,44,.06), 0 8px 24px -12px rgba(21,34,44,.18);
  --r:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0F161B; --surface:#18222A; --surface-2:#1D2830;
    --grid:#22303A; --line:#2E3E4A;
    --ink:#E8EFF4; --ink-2:#A3B4C0; --ink-3:#7A8B97;
    --core:#7FB2E4; --core-soft:#16303F;
    --strong:#77CDB4; --strong-soft:#123028;
    --chal:#E0B267; --chal-soft:#33270F;
    --alert:#E8907F; --alert-soft:#3A1E19;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -14px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --paper:#0F161B; --surface:#18222A; --surface-2:#1D2830;
  --grid:#22303A; --line:#2E3E4A;
  --ink:#E8EFF4; --ink-2:#A3B4C0; --ink-3:#7A8B97;
  --core:#7FB2E4; --core-soft:#16303F;
  --strong:#77CDB4; --strong-soft:#123028;
  --chal:#E0B267; --chal-soft:#33270F;
  --alert:#E8907F; --alert-soft:#3A1E19;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -14px rgba(0,0,0,.7);
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:16px; line-height:1.62;
  background-image:
    linear-gradient(to right, var(--grid) 1px, transparent 1px),
    linear-gradient(to bottom, var(--grid) 1px, transparent 1px);
  background-size:26px 26px;
}
.wrap{max-width:760px; margin:0 auto; padding:28px 20px 90px}
h1,h2,h3,h4{font-family:"Familjen Grotesk","IBM Plex Sans",system-ui,sans-serif; text-wrap:balance}

/* header */
header.top{background:var(--surface); border:1px solid var(--line); border-radius:var(--r);
  box-shadow:var(--shadow); padding:22px 24px; display:flex; gap:18px; align-items:flex-start}
.badge{flex:0 0 auto; width:54px; height:54px; border-radius:9px; display:grid; place-items:center;
  background:var(--core-soft); border:1px solid var(--core); color:var(--core)}
.badge svg{width:28px; height:28px; fill:none; stroke:currentColor; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round}
.eyebrow{font-family:"IBM Plex Mono",monospace; font-size:11px; letter-spacing:.14em;
  text-transform:uppercase; color:var(--ink-3); margin:0 0 5px}
header.top h1{margin:0; font-size:30px; font-weight:700; letter-spacing:-.015em}
header.top p{margin:5px 0 0; color:var(--ink-2); font-size:15px}
.tags{display:flex; flex-wrap:wrap; gap:5px; margin-top:11px}
.tag{font-family:"IBM Plex Mono",monospace; font-size:10.5px; letter-spacing:.05em; padding:2px 7px;
  border-radius:4px; background:var(--surface-2); border:1px solid var(--line); color:var(--ink-3)}
.tag.core{background:var(--core-soft); border-color:var(--core); color:var(--core)}

/* teksti */
article{margin-top:26px}
article h2{font-size:21px; font-weight:600; margin:32px 0 10px; letter-spacing:-.01em}
article p{margin:0 0 14px; max-width:64ch}
.lead{font-size:17.5px; color:var(--ink); border-left:3px solid var(--core); padding-left:16px; margin:0 0 8px}

.box{background:var(--surface); border:1px solid var(--line); border-radius:var(--r);
  padding:18px 22px; box-shadow:var(--shadow); margin:22px 0}
.box h3{margin:0 0 12px; font-size:16.5px; font-weight:600}
.box.warn{border-left:3px solid var(--alert)}
.box.note{border-left:3px solid var(--chal)}

ol.steps{margin:0; padding-left:0; list-style:none; counter-reset:s; display:grid; gap:12px}
ol.steps li{counter-increment:s; display:grid; grid-template-columns:auto 1fr; gap:13px; align-items:start}
ol.steps li::before{content:counter(s); font-family:"Familjen Grotesk",sans-serif; font-weight:700; font-size:14px;
  width:26px; height:26px; border-radius:50%; background:var(--core); color:#fff; display:grid; place-items:center; margin-top:2px}

ul.notes{margin:0; padding-left:19px}
ul.notes li{margin-bottom:7px}
ul.notes li:last-child{margin-bottom:0}

.tablewrap{overflow-x:auto}
table{border-collapse:collapse; width:100%; font-size:14.5px; min-width:460px}
th,td{text-align:left; padding:9px 13px; border-bottom:1px solid var(--line)}
th{font-family:"IBM Plex Mono",monospace; font-size:10.5px; letter-spacing:.1em; text-transform:uppercase;
  color:var(--ink-3); font-weight:400; background:var(--surface-2)}
tr:last-child td{border-bottom:0}
td b{color:var(--core); font-weight:600}
td:last-child{font-variant-numeric:tabular-nums; font-weight:600}

/* lukusuora */
.nl svg{width:100%; height:118px; display:block}
.nl .rail{stroke:var(--line); stroke-width:2}
.nl .tick{stroke:var(--line); stroke-width:1.5}
.nl .stop{fill:var(--ink-3); font-family:"IBM Plex Mono",monospace; font-size:11px}
.nl .stop.near{fill:var(--core); font-weight:600}
.nl .dot{fill:var(--chal)}
.nl .val{fill:var(--ink); font-family:"Familjen Grotesk",sans-serif; font-size:15px; font-weight:700}
.nl .halfway{stroke:var(--chal); stroke-dasharray:3 3; stroke-width:1.5}
.nl-controls{display:flex; align-items:center; gap:14px; margin-top:6px}
.nl-controls input{flex:1; accent-color:var(--core)}
.nl-out{font-family:"Familjen Grotesk",sans-serif; font-size:15px; font-weight:600; min-width:12.5em; text-align:right}

/* paikka-arvotaulu */
.box .ohje{margin:0 0 14px; font-size:14.5px; color:var(--ink-2)}
.nt-valinta{display:flex; flex-wrap:wrap; gap:7px; margin-bottom:16px}
.nt-valinta button{font:inherit; font-size:12.5px; font-family:"IBM Plex Mono",monospace; padding:5px 11px;
  border-radius:6px; border:1px solid var(--line); background:var(--surface-2); color:var(--ink-2); cursor:pointer}
.nt-valinta button[aria-pressed="true"]{background:var(--ink); color:var(--paper); border-color:var(--ink)}
.nt-valinta button:focus-visible{outline:2px solid var(--core); outline-offset:2px}
.nt-taulu{display:flex; flex-direction:column; gap:4px; align-items:flex-start; overflow-x:auto; padding-bottom:4px}
.nt-rivi{display:flex; gap:6px; align-items:center}
.nt-rivi .otsa{font-family:"IBM Plex Mono",monospace; font-size:9.5px; letter-spacing:.08em;
  text-transform:uppercase; color:var(--ink-3); width:52px; text-align:center}
.nt-ruutu{width:52px; height:52px; display:grid; place-items:center; border:1.5px solid var(--line);
  border-radius:7px; background:var(--surface-2); font-family:"IBM Plex Mono",monospace; font-size:24px}
.nt-ruutu.kohta{border-color:var(--core); background:var(--core-soft); color:var(--core); font-weight:500}
.nt-ruutu.ratkaiseva{border-color:var(--chal); background:var(--chal-soft); color:var(--chal); font-weight:500}
.nt-ruutu.nolla{color:var(--ink-3)}
.nt-rivi .nimi{font-size:12.5px; color:var(--ink-3); margin-left:12px; white-space:nowrap}
.nt-nuoli{font-size:17px; color:var(--chal); margin-left:6px}
.nt-selite{margin:14px 0 0; font-size:14.5px}
.nt-selite b{color:var(--core)}

/* vahvuusportaat */
.vp-tasot{display:grid; gap:9px; margin-bottom:18px}
.vp-taso{display:flex; gap:11px; align-items:flex-start; font-size:13.5px}
.vp-taso .vp-pallo{width:13px; height:13px; border-radius:4px; margin-top:5px; flex:0 0 auto}
.vp-taso[data-taso="sulkeet"] .vp-pallo{background:var(--core)}
.vp-taso[data-taso="kertojako"] .vp-pallo{background:var(--strong)}
.vp-taso[data-taso="yhteenvahennys"] .vp-pallo{background:var(--chal)}
.vp-taso strong{display:block; font-family:"Familjen Grotesk",sans-serif; font-weight:600; font-size:14.5px}
.vp-taso span{color:var(--ink-2)}
.vp-lauseke{display:flex; flex-wrap:wrap; gap:7px; align-items:flex-end; font-family:"IBM Plex Mono",monospace;
  font-size:25px; padding:10px 2px; min-height:64px}
.vp-lauseke .t{padding:2px 3px}
.vp-lauseke .op{position:relative; padding:2px 9px; border-radius:6px; font-weight:500}
.vp-lauseke .op[data-taso="sulkeet"]{background:var(--core-soft); color:var(--core)}
.vp-lauseke .op[data-taso="kertojako"]{background:var(--strong-soft); color:var(--strong)}
.vp-lauseke .op[data-taso="yhteenvahennys"]{background:var(--chal-soft); color:var(--chal)}
.vp-lauseke .op i{position:absolute; top:-9px; right:-6px; font-style:normal; font-family:"Familjen Grotesk",sans-serif;
  font-size:11px; font-weight:700; width:18px; height:18px; border-radius:50%; display:grid; place-items:center;
  background:currentColor}
.vp-lauseke .op i span{color:var(--surface)}
.vp-rivi{display:flex; align-items:center; gap:16px; margin-top:8px}
.vp-vastaus{font-family:"Familjen Grotesk",sans-serif; font-size:16px; font-weight:600; color:var(--strong)}

/* laskujärjestys-widget */
.lj-exp{display:flex; flex-wrap:wrap; gap:7px; align-items:center; font-family:"IBM Plex Mono",monospace;
  font-size:23px; padding:14px 4px; min-height:62px}
.lj-exp .tok{padding:2px 4px; color:var(--ink)}
.lj-exp button.op{font-family:"IBM Plex Mono",monospace; font-size:23px; padding:3px 12px; border-radius:7px;
  border:1.5px solid var(--line); background:var(--surface-2); color:var(--ink); line-height:1.2}
.lj-exp button.op:hover{border-color:var(--core); color:var(--core)}
.lj-exp button.op:focus-visible{outline:2px solid var(--core); outline-offset:2px}
.lj-exp .valmis{font-family:"Familjen Grotesk",sans-serif; font-size:23px; font-weight:700; color:var(--strong)}
.lj-fb{font-size:14.5px; min-height:1.5em; color:var(--ink-2)}
.lj-fb.no{color:var(--alert)}
.lj-fb.ok{color:var(--strong)}
.lj-row{display:flex; align-items:center; gap:14px; margin-top:10px}
.lj-step{font-family:"IBM Plex Mono",monospace; font-size:11.5px; letter-spacing:.1em;
  text-transform:uppercase; color:var(--ink-3)}

/* harjoitukset */
.progress{position:sticky; top:0; z-index:5; background:var(--surface); border:1px solid var(--line);
  border-radius:var(--r); padding:12px 18px; box-shadow:var(--shadow); display:flex; align-items:center;
  gap:14px; margin:34px 0 18px}
.progress .lbl{font-family:"IBM Plex Mono",monospace; font-size:11px; letter-spacing:.12em;
  text-transform:uppercase; color:var(--ink-3); white-space:nowrap}
.progress .meter{flex:1; height:7px; border-radius:4px; background:var(--surface-2); border:1px solid var(--line); overflow:hidden}
.progress .meter i{display:block; height:100%; background:var(--core); transition:width .25s ease}
.progress .cnt{font-family:"Familjen Grotesk",sans-serif; font-weight:700; font-variant-numeric:tabular-nums; white-space:nowrap}

.grp{margin-top:26px}
.grp-head{display:flex; align-items:baseline; gap:10px; border-bottom:1.5px solid var(--ink); padding-bottom:7px; margin-bottom:14px}
.grp-head h3{margin:0; font-size:17px; font-weight:600}
.grp-head span{font-size:12.5px; color:var(--ink-2)}

.ex{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:14px 16px; margin-bottom:10px}
.ex[data-tila="oikein"]{border-color:var(--strong); box-shadow:inset 3px 0 0 var(--strong)}
.ex[data-tila="vaarin"]{border-color:var(--alert); box-shadow:inset 3px 0 0 var(--alert)}
.ex .q{display:flex; gap:11px; align-items:baseline; flex-wrap:wrap}
.ex .num{font-family:"IBM Plex Mono",monospace; font-size:11.5px; color:var(--ink-3); min-width:2.4em}
.ex .txt{flex:1; min-width:190px; font-size:15.5px}
.ex .txt .aineisto{display:block; margin-bottom:9px; padding-left:12px;
  border-left:2px solid var(--line); color:var(--ink-2); line-height:1.6;
  /* Aineisto voi olla pieni taulukko, jonka rivit on erotettu rivinvaihdoilla.
     Ilman pre-lineä ne valuisivat yhdeksi kappaleeksi ja taulukko katoaisi. */
  white-space:pre-line}
.ex .txt .kysymysrivi{display:block; font-weight:600}
.ex .row{display:flex; gap:8px; align-items:center; margin-top:11px; flex-wrap:wrap}
.ex input[type=text]{font:inherit; font-family:"IBM Plex Mono",monospace; font-size:15px; width:8.5em;
  padding:7px 11px; border:1px solid var(--line); border-radius:7px; background:var(--surface-2);
  color:var(--ink); text-align:right}
.ex input:focus-visible{outline:2px solid var(--core); outline-offset:1px}
button{font:inherit; cursor:pointer}
.btn{font-size:13.5px; padding:7px 15px; border-radius:7px; border:1px solid var(--core);
  background:var(--core); color:#fff}
.btn.ghost{background:transparent; color:var(--ink-2); border-color:var(--line)}
.btn:focus-visible{outline:2px solid var(--core); outline-offset:2px}
.btn.mv-valinta{text-align:left}
/* kuuntelutehtävä: selaimen puhesynteesi lukee englanninkielisen tekstin */
.kuuntele{display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin:2px 0 10px}
.kuuntele .btn{display:inline-flex; gap:7px; align-items:center}
.kuuntele svg{width:16px; height:16px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round}
.kuuntele .varateksti{flex-basis:100%; font-size:14px; color:var(--ink-2); background:var(--surface-2);
  border-radius:7px; padding:8px 12px; margin:0}
.btn.mv-valinta:disabled{cursor:default; opacity:.65}
.btn.mv-oikein{background:var(--strong-soft); border-color:var(--strong); color:var(--strong); opacity:1}
.btn.mv-vaarin{background:var(--alert-soft); border-color:var(--alert); color:var(--alert); opacity:1}
.row.mv{gap:8px 10px}
.fb{margin-top:11px; font-size:14.5px; padding:10px 13px; border-radius:8px; line-height:1.5}
.fb.ok{background:var(--strong-soft); color:var(--strong)}
.fb.no{background:var(--alert-soft); color:var(--alert)}
.fb.hint{background:var(--chal-soft); color:var(--chal)}

.done{background:var(--strong-soft); border:1px solid var(--strong); color:var(--strong);
  border-radius:var(--r); padding:16px 20px; margin-top:20px; font-size:15.5px}
.done h3{margin:0 0 4px; font-size:17px; color:var(--strong)}

details.teacher{margin-top:34px; background:var(--surface); border:1px solid var(--line);
  border-left:3px solid var(--chal); border-radius:var(--r); padding:15px 20px; box-shadow:var(--shadow)}
details.teacher summary{cursor:pointer; font-family:"Familjen Grotesk",sans-serif; font-weight:600; font-size:15px}
details.teacher summary:focus-visible{outline:2px solid var(--core); outline-offset:3px}
details.teacher ul{margin:12px 0 0; padding-left:19px; color:var(--ink-2); font-size:14.5px}
details.teacher li{margin-bottom:8px}
details.teacher p{margin:12px 0 0; color:var(--ink-2); font-size:14.5px}

.back{display:inline-block; margin-top:30px; font-size:13.5px; color:var(--ink-2)}
.back a{color:var(--core)}

@media (prefers-reduced-motion: reduce){*{transition:none !important}}
@media (max-width:560px){
  .wrap{padding:16px 13px 70px}
  header.top h1{font-size:25px}
  .progress{flex-wrap:wrap}
}
</style>

<div class="wrap">

  <header class="top">
    <span class="badge"><svg viewBox="0 0 24 24" aria-hidden="true" id="ikoni"></svg></span>
    <div>
      <p class="eyebrow" id="eyebrow"></p>
      <h1 id="otsikko"></h1>
      <p id="kuvaus"></p>
      <div class="tags" id="tags"></div>
    </div>
  </header>

  <article id="teksti"></article>

  <div class="progress" aria-live="polite">
    <span class="lbl">Harjoitukset</span>
    <span class="meter"><i id="pbar" style="width:0%"></i></span>
    <span class="cnt" id="pcnt">0 / 20</span>
  </div>

  <div id="harjoitukset"></div>
  <div id="valmis"></div>

  <p class="back" id="back"></p>

</div>

<script>
const D = {"tavoite_id":"MAT8-GEO-04","oppiaine":"MAT","vuosiluokka":8,"taso":"haaste","otsikko":"Pythagoraan pääsykoe","kuvaus":"Osaan ratkaista monivaiheisia Pythagoraan lauseen ylikurssitehtäviä.","versio":"0.2","paivitetty":"2026-10-11","ops":{"T":["T5","T17","T18"],"S":["S1","S5"]},"ikoni":"tyokalu","eyebrow":"Matematiikka · 8. luokka · Geometria","teksti":[{"tyyppi":"johdanto","sisalto":"Kaverisi isoveli on rakentanut minirampin, jonka ajopinta on yksi ohut, jäykkä vanerilevy. Levyn sivut ovat 260 cm ja 230 cm, ja se pitäisi saada sisälle oviaukosta, joka on 0,92 m leveä ja 2,10 m korkea. Pystyyn levy ei mahdu, koska kumpikin sivu on pidempi kuin aukon korkeus. Ainoa mahdollisuus on kallistaa levyä: pidempi sivu menee aukon läpi kulkusuuntaan, ja lyhyemmän sivun on mahduttava oviaukon tasoon vinottain. Pisin jana, joka mahtuu suorakulmion muotoiseen aukkoon, on aukon lävistäjä. Leveys, korkeus ja lävistäjä muodostavat suorakulmaisen kolmion, jonka hypotenuusa on lävistäjä: d² = 0,92² + 2,10² = 0,8464 + 4,41 = 5,2564, joten d ≈ 2,293 m ≈ 229 cm. Levyn lyhyempi sivu on 230 cm, joten levy ei mahdu. Se jää vajaan sentin verran liian isoksi. Jos olisit pyöristänyt lävistäjän heti 2,3 metriin, olisit päätellyt väärin, että levy mahtuu juuri ja juuri. Tällaisia tehtäviä on ollut vanhoissa ylioppilaskokeissa ja teknikkokoulutuksen pääsykokeissa. Niissä ei ole valmista kolmiota, vaan ratkaisu syntyy suunnitelmasta. Tässä taidossa opit jakamaan tehtävän osiin, löytämään tarvittavat suorakulmaiset kolmiot ja perustelemaan jokaisen välivaiheen."},{"tyyppi":"saanto","otsikko":"Suunnitelma ennen laskua","askeleet":["Piirrä mallikuvio ja merkitse siihen annetut mitat ja kysytty suure.","Etsi suorat kulmat. Jos valmista suorakulmaista kolmiota ei ole, piirrä apujana: korkeus, lävistäjä tai kohtisuora jana. Tavallisia apukolmioita ovat tasakylkisen puolisuunnikkaan kylki, korkeus ja reunapala (pidempi sivu − lyhyempi sivu) : 2, vinoneliön tai leijan lävistäjien puolikkaat, neliön sisään piirretyn neliön kulmakolmio ja koordinaatiston vaaka- ja pystysuora jana.","Kirjoita suunnitelma sanoin: mitkä kolmiot, missä järjestyksessä ja mikä sivu ratkaistaan kustakin kolmiosta. Merkitse tuntematonta kirjaimella.","Valitse työkalu. Kun kaksi sivua tunnetaan, käytä Pythagoraan lausetta. Kun sivut riippuvat toisistaan (hypotenuusa on x + 3), muodosta yhtälö. Kun kysytään suorakulmaisen kolmion korkeutta hypotenuusaa vastaan tai suorakulmion kärjen etäisyyttä lävistäjästä, laske kolmion pinta-ala kahdella tavalla. Kun kolmiot ovat yhdenmuotoiset, kerro jokainen pituus, myös piiri, samalla luvulla. Kun et tiedä, onko kulma suora, käytä käänteislausetta.","Laske vaihe kerrallaan ja kirjoita jokaisen vaiheen perustelu: miksi kulma on suora, miksi jana on puolet toisesta ja mikä sivu on hypotenuusa.","Pidä välitulokset tarkkoina tai laskimen muistissa. Pyöristä vasta lopputulos.","Tarkista: hypotenuusa on kolmion pisin sivu, korkeus on lyhyempi kuin ne kaksi kolmion sivua, jotka lähtevät samasta kärjestä kuin korkeus (suorakulmaisessa kolmiossa hypotenuusaa vastaan piirretty korkeus on lyhyempi kuin kumpikin kateetti), ja yhtälön ratkaisu toteuttaa Pythagoraan lauseen. Vastaa siihen, mitä kysyttiin, yksikön kanssa."]},{"tyyppi":"kappale","otsikko":"Esimerkki 1: yhtälö, jossa x² supistuu","sisalto":"Suorakulmaisen kolmion toinen kateetti on 9 cm, ja hypotenuusa on 3 cm pidempi kuin toinen kateetti. Laske toinen kateetti. Suunnitelma: kolmio on valmiina, mutta kaksi sivua on tuntemattomia. Ne riippuvat toisistaan, joten merkitsen toista kateettia x:llä ja hypotenuusaa x + 3:lla. Kirjoitan Pythagoraan lauseen niin, että hypotenuusa on yksin, avaan neliön kertomalla, ratkaisen yhtälön ja tarkistan. Lasku: x² + 9² = (x + 3)². Neliö tarkoittaa tuloa: (x + 3)(x + 3) = x · x + x · 3 + 3 · x + 3 · 3 = x² + 6x + 9. Yhtälö on siis x² + 81 = x² + 6x + 9. Kun x² vähennetään molemmilta puolilta, jää 81 = 6x + 9, joten 6x = 72 ja x = 12. Toinen kateetti on 12 cm ja hypotenuusa 15 cm. Tarkistus: 12² + 9² = 144 + 81 = 225 = 15². Miksi x² supistui? Kun hypotenuusa on muotoa x + luku, termi x² on yhtälön kummallakin puolella kertoimella 1, ja jäljelle jää ensimmäisen asteen yhtälö. Sama rakenne on katkenneessa puussa: 16 m korkea puu katkeaa x metrin korkeudelta, ja latva osuu maahan 8 m:n päähän tyvestä. Tyviosa x, maa 8 m ja latvaosa 16 − x muodostavat suorakulmaisen kolmion, jonka hypotenuusa on latvaosa: x² + 8² = (16 − x)². Kertomalla (16 − x)(16 − x) = 256 − 16x − 16x + x² = 256 − 32x + x², joten x² + 64 = 256 − 32x + x², 32x = 192 ja x = 6. Puu katkesi 6 m:n korkeudelta. Joskus yhtälö on muotoa ax² = c. Kun neliön lävistäjä on 10 cm, sivulle s pätee s² + s² = 10², joten 2s² = 100, s² = 50 ja s = √50 cm, koska pituus ei voi olla negatiivinen. Kun tasasivuisen kolmion korkeus on 6 cm, korkeus jakaa sivun s puoliksi: (s/2)² + 6² = s², eli s²/4 + 36 = s², josta 3s²/4 = 36, s² = 48 ja s = √48 cm ≈ 6,9 cm."},{"tyyppi":"ansa","otsikko":"Ansa 1: hypotenuusa väärällä paikalla","sisalto":"Esimerkin 1 kolmiossa joku kirjoittaa x² = 9² + (x + 3)². Silloin x² = 81 + x² + 6x + 9, eli 0 = 6x + 90 ja x = −15. Pituus ei voi olla negatiivinen, joten jotain on mennyt pieleen: yhtälöön on kirjoitettu hypotenuusaksi kateetti. Hypotenuusa on suoran kulman vastainen sivu ja kolmion pisin sivu, ja tehtävä kertoo, että se on x + 3. Kirjoita yhtälö aina samaan muotoon: kateetti² + kateetti² = hypotenuusa². Jos ratkaisu on negatiivinen tai nolla, palaa tarkistamaan, kumpi sivu on yksin."},{"tyyppi":"ansa","otsikko":"Ansa 2: (x + 3)² ei ole x² + 9","sisalto":"Jos avaat neliön muotoon (x + 3)² = x² + 9, esimerkin 1 yhtälöstä tulee x² + 81 = x² + 9 eli 81 = 9, joka ei ole totta. Virhe on neliön avaamisessa. Neliö on tulo (x + 3)(x + 3), ja jokainen termi kerrotaan jokaisella termillä, joten tuloja on neljä: x², 3x, 3x ja 9. Suorakulmiomalli näyttää saman: neliö, jonka sivu on x + 3, jakautuu neljään osaan, joiden alat ovat x², 3x, 3x ja 9. Kaksi suorakulmiota 3x unohtuvat, jos lasket vain kulmien neliöt. Tarkista avaus sijoittamalla jokin muu luku kuin nolla: kun x = 1, (1 + 3)² = 16, mutta 1² + 9 = 10. Sama koskee erotusta: (16 − x)² ei ole 256 − x²."},{"tyyppi":"kappale","otsikko":"Esimerkki 2: leija jakautuu suorakulmaisiksi kolmioiksi","sisalto":"Leijassa ABCD sivut AB ja AD ovat 10 cm ja sivut CB ja CD 17 cm. Lävistäjät AC ja BD leikkaavat pisteessä O ja ovat kohtisuorassa toisiaan vastaan, ja AC puolittaa lävistäjän BD = 16 cm. Laske leijan pinta-ala. Tämä on mukailtu teknikkokoulutuksen pääsykoetehtävästä vuodelta 1992. Suunnitelma: lävistäjät jakavat leijan neljäksi suorakulmaiseksi kolmioksi, joiden suora kulma on pisteessä O. Kolmiot ABO ja ADO ovat yhtenevät (AB = AD, BO = DO ja AO on yhteinen), samoin CBO ja CDO. Kolmiosta ABO lasken janan AO ja kolmiosta CBO janan CO. Silloin tunnen koko lävistäjän AC ja voin laskea alan kolmioista ABD ja CBD. Lasku: BO = 16 cm : 2 = 8 cm, koska AC puolittaa lävistäjän BD. Kolmiossa ABO hypotenuusa on sivu AB: AO² + 8² = 10², joten AO² = 36 ja AO = 6 cm. Kolmiossa CBO hypotenuusa on sivu CB: CO² + 8² = 17², joten CO² = 225 ja CO = 15 cm. AC = 6 cm + 15 cm = 21 cm. Kolmion ABD kanta on BD ja korkeus AO, joten sen ala on 16 · 6 : 2 = 48 cm². Kolmion CBD ala on 16 · 15 : 2 = 120 cm². Leijan ala on 48 cm² + 120 cm² = 168 cm². Tarkistus: sama tulos saadaan, kun lävistäjien tulo jaetaan kahdella, 16 · 21 : 2 = 168. Tämä johtuu siitä, että kolmioilla ABD ja CBD on yhteinen kanta BD ja niiden korkeudet AO ja CO ovat yhteensä AC."},{"tyyppi":"ansa","otsikko":"Ansa 3: leijan sivu tai koko lävistäjä puolikkaan paikalla","sisalto":"Esimerkin 2 leijassa suorakulmaisen kolmion kateetti on lävistäjän BD puolikas 8 cm, ei koko lävistäjä 16 cm. Jos käytät koko lävistäjää, saat AO² = 10² − 16² = −156, eikä laskin anna neliöjuurta. Toisessa kolmiossa saat CO² = 17² − 16² = 33 ja CO ≈ 5,7 cm, mikä näyttää luvulta mutta on väärin. Toinen tavallinen virhe on käyttää leijan sivua ikään kuin se olisi lävistäjän osa: AC ei ole 10 cm + 17 cm, koska sivut eivät ole lävistäjän päällä. Kolmas on unohtaa kolmion alasta jakaminen kahdella, jolloin leijan alaksi tulee 16 · 21 = 336 cm², kaksi kertaa liikaa. Merkitse kuvioon ennen laskua jokaisen suorakulmaisen kolmion kolme sivua ja suora kulma pisteeseen O."},{"tyyppi":"kappale","otsikko":"Esimerkki 3: pinta-ala kahdella tavalla","sisalto":"Suorakulmion ABCD sivut ovat AB = 12 cm ja BC = 9 cm. Kuinka kaukana kärki B on lävistäjästä AC? Etäisyys on kärjestä B lävistäjälle piirretyn kohtisuoran janan BE pituus, koska kohtisuora jana on lyhin matka pisteestä suoralle. Suunnitelma: lävistäjä AC erottaa suorakulmiosta kolmion ABC, jonka suora kulma on kärjessä B. Kolmion alan voi laskea kahdella tavalla: kantana AB ja korkeutena BC tai kantana AC ja korkeutena BE. Kumpikin on saman kolmion ala, joten ne ovat yhtä suuret. Lasku: AC² = 12² + 9² = 225, joten AC = 15 cm. Ala on 12 · 9 : 2 = 54 cm². Toisaalta ala on 15 · BE : 2, joten 15 · BE : 2 = 54 ja BE = 108 : 15 = 7,2 cm. Tarkistus: BE on kateetti kolmioissa ABE ja CBE, joissa suorakulmion sivut ovat hypotenuusia, joten BE:n on oltava lyhyempi kuin kumpikin sivu, ja 7,2 cm < 9 cm. Kolmio ABC on suorakulmainen ja BE on sen korkeus hypotenuusaa vastaan, joten sama keino antaa minkä tahansa suorakulmaisen kolmion korkeuden: korkeus = kateettien tulo : hypotenuusa. Kun korkeus tunnetaan, hypotenuusan osat saadaan Pythagoraan lauseella: AE² = 12² − 7,2² = 92,16, joten AE = 9,6 cm ja CE = 15 cm − 9,6 cm = 5,4 cm. Teknikkokoulutuksen pääsykokeessa vuonna 1993 kysyttiin juuri kärjen etäisyyttä lävistäjästä. Oppikirja ratkaisee sen yhdenmuotoisilla kolmioilla ABC ja AEB, ja sekin reitti on oikea."},{"tyyppi":"ansa","otsikko":"Ansa 4: kärjen etäisyys sivun tai lävistäjän puolikkaana","sisalto":"Esimerkin 3 suorakulmiossa (12 cm ja 9 cm) houkuttelevia vääriä vastauksia ovat 4,5 cm, puolet lyhyemmästä sivusta, ja 7,5 cm, puolet lävistäjästä. Kumpikaan ei ole kohtisuoran janan pituus. Puolet lävistäjästä on kärjen etäisyys suorakulmion keskipisteestä, ja se on pidempi kuin kohtisuora etäisyys, koska kohtisuora jana on lyhin. Kohtisuoran janan kantapiste on lävistäjän keskipiste vain, jos suorakulmio on neliö. Samasta syystä suorakulmaisen kolmion korkeus ei osu hypotenuusan keskipisteeseen, ellei kolmio ole tasakylkinen. Jos lasket h² = 12² − 7,5², saat h ≈ 9,4 cm. Tulos on pidempi kuin lyhyempi kateetti 9 cm, mikä on mahdotonta. Laske etäisyys pinta-alan avulla."},{"tyyppi":"ansa","otsikko":"Ansa 5: välipyöristys muuttaa lopputuloksen","sisalto":"4,5 m pitkät tikkaat nojaavat seinään, ja yläpää on 3,6 m:n korkeudella. Yläpää liukuu 0,5 m alemmas. Alapää on aluksi √(4,5² − 3,6²) = √7,29 = 2,7 m seinästä ja liukumisen jälkeen √(4,5² − 3,1²) = √10,64 ≈ 3,2619 m. Alapää siirtyy 3,2619 m − 2,7 m ≈ 0,562 m ≈ 56 cm. Jos pyöristät välituloksen 3,3 metriin, saat 60 cm, joka on väärin. Kun kaksi melkein yhtä suurta lukua vähennetään toisistaan, välipyöristyksen virhe on suuri verrattuna erotukseen. Päätöstehtävässä pyöristys voi kääntää koko vastauksen: johdannon oviaukon lävistäjä 2,293 m pyöristyy 2,3 metriin, ja 2,3 m eli 230 cm näyttää riittävän 230 cm:n levylle. Pidä välitulokset laskimen muistissa ja vertaa lukuja tarkkuudella, joka erottaa ne toisistaan. Päätöksen voi tehdä myös ilman neliöjuurta vertaamalla neliöitä: 0,92² + 2,10² = 5,2564 < 2,3² = 5,29."}],"harjoitusryhmat":[{"id":"tyokalut","nimi":"Työkalut","info":"Laskin on sallittu. Yksi tai kaksi vaihetta: neliön avaaminen kertomalla, yhtälö, jossa x² supistuu, pinta-ala kahdella tavalla, käänteislause ja yhtälö muotoa ax² = c. Anna vastaus pyydetyssä muodossa ilman yksikköä."},{"id":"kaksi","nimi":"Kaksi tai kolme vaihetta","info":"Laskin on sallittu. Piirrä mallikuvio ja etsi apukolmio ennen laskua. Pyöristä vasta lopputulos ja anna vastaus ilman yksikköä."},{"id":"ylikurssi","nimi":"Ylikurssi","info":"Laskin on sallittu. Kirjoita ensin suunnitelma: mitkä suorakulmaiset kolmiot ja missä järjestyksessä. Pidä välitulokset laskimen muistissa ja anna vastaus pyydetyllä tarkkuudella ilman yksikköä."}],"harjoitukset":[{"id":"H01","ryhma":"tyokalut","kysymys":"Laske tulo (x + 5)(x + 5) kertomalla jokainen termi jokaisella termillä. Kirjoita tulos muodossa x² + bx + c. Mikä on b?","vastaus":10,"vinkki":"Kirjoita näkyviin kaikki neljä tuloa: x · x, x · 5, 5 · x ja 5 · 5.","selitys":"(x + 5)(x + 5) = x · x + x · 5 + 5 · x + 5 · 5 = x² + 5x + 5x + 25 = x² + 10x + 25, joten b = 10. Vastaus 0 syntyy, jos neliö avataan muotoon x² + 25. Silloin kaksi keskimmäistä tuloa ovat unohtuneet."},{"id":"H02","ryhma":"tyokalut","kysymys":"Ratkaise yhtälö x² + 10² = (x + 2)².","vastaus":24,"vinkki":"Avaa ensin (x + 2)(x + 2) kertomalla. Sen jälkeen x² supistuu.","selitys":"(x + 2)(x + 2) = x² + 4x + 4, joten x² + 100 = x² + 4x + 4. Kun x² vähennetään molemmilta puolilta, jää 100 = 4x + 4, eli 4x = 96 ja x = 24. Tarkistus: 24² + 10² = 576 + 100 = 676 = 26²."},{"id":"H03","ryhma":"tyokalut","kysymys":"Suorakulmaisen kolmion kateetit ovat 12 cm ja 16 cm. Laske kolmion korkeus hypotenuusaa vastaan. Anna vastaus senttimetreinä ilman yksikköä.","vastaus":9.6,"vinkki":"Laske ensin hypotenuusa. Kirjoita sitten kolmion pinta-ala kahdella tavalla.","selitys":"Hypotenuusa: √(12² + 16²) = √400 = 20 cm. Pinta-ala kateettien avulla on 12 · 16 : 2 = 96 cm². Hypotenuusan ja sitä vastaan piirretyn korkeuden avulla ala on 20 · h : 2. Siis 20 · h : 2 = 96, joten h = 192 : 20 = 9,6 cm. Korkeus on lyhyempi kuin kumpikin kateetti, kuten pitääkin."},{"id":"H04","ryhma":"tyokalut","kysymys":"Kolmion sivut ovat 37 cm, 12 cm ja 35 cm. Tutki ensin, onko kolmio suorakulmainen, ja laske sitten kolmion pinta-ala. Anna vastaus neliösenttimetreinä ilman yksikköä.","vastaus":210,"vinkki":"Vertaa pisimmän sivun neliötä kahden lyhyemmän sivun neliöiden summaan. Jos kolmio on suorakulmainen, kateetit ovat kanta ja korkeus.","selitys":"Pisin sivu on 37 cm: 37² = 1 369 ja 12² + 35² = 144 + 1 225 = 1 369. Neliöt ovat yhtä suuret, joten käänteislauseen mukaan kolmio on suorakulmainen ja suora kulma on sivujen 12 cm ja 35 cm välissä. Pinta-ala on 12 · 35 : 2 = 210 cm²."},{"id":"H05","ryhma":"tyokalut","kysymys":"Neliön lävistäjä on 8 cm. Neliön sivun tarkka pituus on √n cm. Mikä on n?","vastaus":32,"vinkki":"Merkitse sivua kirjaimella s. Lävistäjä on suorakulmaisen kolmion hypotenuusa, ja kateetit ovat kaksi sivua.","selitys":"s² + s² = 8², joten 2s² = 64 ja s² = 32. Sivu on √32 cm, koska pituus ei voi olla negatiivinen. Siis n = 32. Vastaus 64 syntyy, jos unohdat, että kateetteja on kaksi."},{"id":"H06","ryhma":"tyokalut","kysymys":"Suorakulmion ABCD lävistäjä on AC. Mikä jana on kärjen B etäisyys lävistäjästä AC?","vastaus":1,"vinkki":"Etäisyys pisteestä suoraan on lyhin matka pisteestä suoralle.","selitys":"Etäisyys on kärjestä B lävistäjälle AC piirretty kohtisuora jana, koska se on lyhin matka kärjestä lävistäjälle. Jana lävistäjän keskipisteeseen on pidempi, ellei suorakulmio ole neliö. Puolet lyhyemmästä sivusta ei ole tämän kuvion jana lainkaan.","tyyppi":"monivalinta","vaihtoehdot":["jana kärjestä B lävistäjän AC keskipisteeseen","kärjestä B lävistäjälle AC piirretty kohtisuora jana","puolet suorakulmion lyhyemmästä sivusta"]},{"id":"H07","ryhma":"kaksi","kysymys":"Tasakylkisen puolisuunnikkaan yhdensuuntaiset sivut ovat 18 cm ja 8 cm, ja kumpikin kylki on 13 cm. Laske puolisuunnikkaan pinta-ala. Anna vastaus neliösenttimetreinä ilman yksikköä.","vastaus":156,"vinkki":"Piirrä lyhyemmän yhdensuuntaisen sivun päistä korkeudet. Kummallekin puolelle jää pala, jonka pituus on (18 − 8) : 2.","selitys":"Korkeudet jakavat pidemmän sivun osiin 5 cm, 8 cm ja 5 cm, koska (18 cm − 8 cm) : 2 = 5 cm. Reunoille syntyy suorakulmainen kolmio, jonka hypotenuusa on kylki 13 cm: h² + 5² = 13², joten h² = 144 ja h = 12 cm. Pinta-ala on (18 + 8) · 12 : 2 = 156 cm². Jos käytät kateettina koko erotusta 10 cm, saat väärän korkeuden √69 ≈ 8,3 cm."},{"id":"H08","ryhma":"kaksi","kysymys":"Vinoneliön lävistäjät ovat 10 cm ja 24 cm. Vinoneliön lävistäjät puolittavat toisensa ja ovat kohtisuorassa toisiaan vastaan. Laske vinoneliön piiri. Anna vastaus senttimetreinä ilman yksikköä.","vastaus":52,"vinkki":"Lävistäjät jakavat vinoneliön neljäksi suorakulmaiseksi kolmioksi. Kateetit ovat lävistäjien puolikkaat.","selitys":"Kateetit ovat 5 cm ja 12 cm, ja hypotenuusa on vinoneliön sivu: √(5² + 12²) = √169 = 13 cm. Piiri on 4 · 13 cm = 52 cm. Jos käytät kokonaisia lävistäjiä, saat sivuksi 26 cm ja piiriksi 104 cm, kaksi kertaa liikaa."},{"id":"H09","ryhma":"kaksi","kysymys":"Suorakulmion sivut ovat 12 cm ja 5 cm. Laske suorakulmion kärjen etäisyys sellaisesta lävistäjästä, joka ei kulje kyseisen kärjen kautta. Anna vastaus senttimetreinä millimetrin tarkkuudella ilman yksikköä.","vastaus":4.6,"vinkki":"Laske lävistäjä. Kirjoita sitten lävistäjän erottaman kolmion pinta-ala kahdella tavalla.","selitys":"Lävistäjä on √(12² + 5²) = 13 cm. Lävistäjä jakaa suorakulmion kahdeksi suorakulmaiseksi kolmioksi, joiden ala on 12 · 5 : 2 = 30 cm². Kun kantana on lävistäjä, korkeus on kysytty etäisyys d: 13 · d : 2 = 30, joten d = 60 : 13 ≈ 4,615 cm ≈ 4,6 cm. Vastaukset 2,5 ja 6,5 ovat sivun ja lävistäjän puolikkaita, eivät etäisyyksiä."},{"id":"H10","ryhma":"kaksi","kysymys":"Tasasivuisen kolmion korkeus on 9 cm. Kolmion sivun tarkka pituus on √n cm. Mikä on n?","vastaus":108,"vinkki":"Merkitse sivua kirjaimella s. Korkeus jakaa sivun puoliksi, joten suorakulmaisen kolmion kateetit ovat 9 cm ja s/2.","selitys":"(s/2)² + 9² = s², eli s²/4 + 81 = s². Vähennetään s²/4: 81 = 3s²/4, joten s² = 81 · 4 : 3 = 108. Sivu on √108 cm, joten n = 108."},{"id":"H11","ryhma":"kaksi","kysymys":"Kolmion kärjet ovat koordinaatistossa A(1, −2), B(4, 4) ja C(−2, 7). Koordinaatiston yksikkö on 1 cm. Laske kolmion pinta-ala. Anna vastaus neliösenttimetreinä ilman yksikköä.","vastaus":22.5,"vinkki":"Laske kaikkien kolmen sivun neliöt koordinaattien erotuksista. Onko kolmio suorakulmainen?","selitys":"AB² = 3² + 6² = 45, BC² = 6² + 3² = 45 ja AC² = 3² + 9² = 90. Koska 45 + 45 = 90, kolmio on käänteislauseen mukaan suorakulmainen ja suora kulma on kärjessä B. Kateetit ovat √45 cm, joten pinta-ala on √45 · √45 : 2 = 45 : 2 = 22,5 cm²."},{"id":"H12","ryhma":"kaksi","kysymys":"Tasakylkisen kolmion piiri on 36 cm ja kanta 10 cm. Laske kolmion pinta-ala. Anna vastaus neliösenttimetreinä ilman yksikköä.","vastaus":60,"vinkki":"Kyljet ovat yhtä pitkät, joten kumpikin on (36 − 10) : 2.","selitys":"Kylki on (36 cm − 10 cm) : 2 = 13 cm. Korkeus jakaa kannan puoliksi: h² + 5² = 13², joten h = 12 cm. Pinta-ala on 10 · 12 : 2 = 60 cm²."},{"id":"H13","ryhma":"kaksi","kysymys":"Neliön ABCD sivu on 7 cm. Sivuille AB, BC, CD ja DA merkitään pisteet P, Q, R ja S niin, että AP = BQ = CR = DS = 3 cm. Nelikulmio PQRS on neliö. Laske neliön PQRS pinta-ala. Anna vastaus neliösenttimetreinä ilman yksikköä.","vastaus":25,"vinkki":"Katso kolmiota PBQ. Kulma B on suora, PB = 7 − 3 cm ja BQ = 3 cm.","selitys":"Kolmiossa PBQ kulma B on neliön kulma eli suora, PB = 4 cm ja BQ = 3 cm. PQ² = 4² + 3² = 25. Neliön PQRS pinta-ala on PQ² = 25 cm², joten neliöjuurta ei tarvitse edes ottaa. Toinen reitti: iso neliö 49 cm² miinus neljä kulmakolmiota, 4 · (4 · 3 : 2) = 24 cm², antaa saman tuloksen."},{"id":"H14","ryhma":"kaksi","kysymys":"Suorakulmaisen kolmion kateetit ovat 9 cm ja 40 cm. Toinen kolmio on yhdenmuotoinen tämän kolmion kanssa, ja sen hypotenuusa on 82 cm. Laske toisen kolmion piiri. Anna vastaus senttimetreinä ilman yksikköä.","vastaus":180,"vinkki":"Laske ensin ensimmäisen kolmion hypotenuusa. Yhdenmuotoisessa kolmiossa jokainen sivu on kerrottu samalla luvulla.","selitys":"Hypotenuusa: √(9² + 40²) = √1 681 = 41 cm. Mittakaava on 82 : 41 = 2, joten jokainen sivu ja siksi myös piiri kaksinkertaistuu. Ensimmäisen kolmion piiri on 9 + 40 + 41 = 90 cm, ja toisen 2 · 90 cm = 180 cm."},{"id":"H15","ryhma":"ylikurssi","kysymys":"Leijassa ABCD sivut AB ja AD ovat kumpikin 15 cm ja sivut CB ja CD kumpikin 41 cm. Lävistäjät AC ja BD ovat kohtisuorassa toisiaan vastaan, ja lävistäjä AC puolittaa lävistäjän BD. Lävistäjä BD on 18 cm. Laske leijan pinta-ala. Anna vastaus neliösenttimetreinä ilman yksikköä.","vastaus":468,"vinkki":"Lävistäjät jakavat leijan neljäksi suorakulmaiseksi kolmioksi. Lävistäjän BD puolikas on 9 cm.","selitys":"Olkoon O lävistäjien leikkauspiste. BO = 9 cm. Kolmiossa ABO: AO² = 15² − 9² = 144, joten AO = 12 cm. Kolmiossa CBO: CO² = 41² − 9² = 1 600, joten CO = 40 cm. AC = 52 cm. Leija koostuu kolmioista ABD ja CBD: 18 · 12 : 2 + 18 · 40 : 2 = 108 + 360 = 468 cm². Jos käytät koko lävistäjää 18 cm kateettina, laskin antaa virheen tai väärän luvun."},{"id":"H16","ryhma":"ylikurssi","kysymys":"Suorakulmaisen kolmion toinen kateetti on 20 cm, ja hypotenuusa on 4 cm pidempi kuin toinen kateetti. Laske toinen kateetti. Anna vastaus senttimetreinä ilman yksikköä.","vastaus":48,"vinkki":"Merkitse toista kateettia x:llä. Hypotenuusa on x + 4, ja se on yksin yhtälön toisella puolella.","selitys":"x² + 20² = (x + 4)², eli x² + 400 = x² + 8x + 16. Kun x² supistuu, 384 = 8x ja x = 48. Hypotenuusa on 52 cm. Tarkistus: 48² + 20² = 2 304 + 400 = 2 704 = 52²."},{"id":"H17","ryhma":"ylikurssi","kysymys":"Pystysuora puu on 9,0 m korkea. Myrsky katkaisee sen niin, että latvaosa jää kiinni tyviosaan ja latva osuu maahan 3,0 m:n päähän tyvestä. Maa on vaakasuora ja tyviosa jää pystysuoraksi. Kuinka korkealta puu katkesi? Anna vastaus metreinä ilman yksikköä.","vastaus":4,"vinkki":"Merkitse katkeamiskorkeutta x:llä. Latvaosan pituus on 9,0 − x, ja se on hypotenuusa.","selitys":"x² + 3,0² = (9,0 − x)². (9 − x)(9 − x) = 81 − 9x − 9x + x² = 81 − 18x + x², joten x² + 9 = 81 − 18x + x². Kun x² supistuu, 18x = 72 ja x = 4,0 m. Tarkistus: latvaosa on 5,0 m ja 4,0² + 3,0² = 25 = 5,0²."},{"id":"H18","ryhma":"ylikurssi","kysymys":"Ohuen, jäykän levyn sivut ovat 260 cm ja 240 cm. Oviaukko on 0,90 m leveä ja 2,20 m korkea. Kumpikin levyn sivu on pidempi kuin oviaukon korkeus, joten levy pitää viedä aukosta vinossa asennossa. Laske oviaukon lävistäjä senttimetrin tarkkuudella. Anna vastaus senttimetreinä ilman yksikköä.","vastaus":238,"vinkki":"Leveys, korkeus ja lävistäjä muodostavat suorakulmaisen kolmion. Vertaa lopuksi lävistäjää levyn lyhyempään sivuun.","selitys":"d² = 0,90² + 2,20² = 0,81 + 4,84 = 5,65, joten d ≈ 2,377 m ≈ 238 cm. Levyn lyhyempi sivu on 240 cm, joten levy ei mahdu, vaikka puuttuu vain 2 cm. Jos olisit pyöristänyt lävistäjän 2,4 metriin, olisit päätellyt väärin, että levy mahtuu juuri ja juuri."},{"id":"H19","ryhma":"ylikurssi","kysymys":"Suorakulmaisen kolmion kateetit ovat 15 cm ja 20 cm. Suoran kulman kärjestä piirretty korkeus jakaa hypotenuusan kahteen osaan. Laske lyhyemmän osan pituus. Anna vastaus senttimetreinä ilman yksikköä.","vastaus":9,"vinkki":"Laske hypotenuusa ja korkeus pinta-alan avulla. Lyhyempi osa on lyhyemmän kateetin vieressä.","selitys":"Hypotenuusa on √(15² + 20²) = 25 cm. Korkeus: 25 · h : 2 = 15 · 20 : 2, joten h = 12 cm. Korkeus, lyhyempi osa ja lyhyempi kateetti muodostavat suorakulmaisen kolmion: osa² = 15² − 12² = 81, joten osa = 9 cm. Pidempi osa on 25 − 9 = 16 cm. Osa ei ole puolet hypotenuusasta, koska kolmio ei ole tasakylkinen."},{"id":"H20","ryhma":"ylikurssi","kysymys":"6,0 m pitkät tikkaat nojaavat pystysuoraan seinään, ja niiden yläpää on 3,1 m:n korkeudella vaakasuorasta maasta. Yläpää liukuu seinää pitkin 0,7 m alemmas. Montako senttimetriä tikkaiden alapää siirtyy kauemmas seinästä? Anna vastaus senttimetrin tarkkuudella ilman yksikköä.","vastaus":36,"vinkki":"Laske alapään etäisyys seinästä ennen ja jälkeen liukumisen. Älä pyöristä välituloksia.","selitys":"Ennen: √(6,0² − 3,1²) = √26,39 ≈ 5,1371 m. Jälkeen yläpää on 2,4 m:n korkeudella: √(6,0² − 2,4²) = √30,24 ≈ 5,4991 m. Siirtymä on 5,4991 m − 5,1371 m ≈ 0,362 m ≈ 36 cm. Jos pyöristät välitulokset 5,1 m ja 5,5 m, saat 40 cm, joka on väärin."}],"valmis_teksti":"Osaat ratkaista monivaiheisia Pythagoraan lauseen tehtäviä vanhojen ylioppilas- ja pääsykokeiden tapaan. Jaat tehtävän osiin, löydät kuviosta tarvittavat suorakulmaiset kolmiot, muodostat yhtälön, jossa x² supistuu, lasket korkeuden pinta-alan avulla ja perustelet jokaisen välivaiheen. Pidät välitulokset tarkkoina ja teet päätöksen, kuten mahtuuko levy oviaukosta, laskemalla. Tämä haastetaito on nyt näytetty."};

/* ---------- lukusuora ---------- */
const svg=document.getElementById("nlsvg"), rng=document.getElementById("nlrange"), out=document.getElementById("nlout");
const X0=34, X1=606, Y=62;
function piirraNL(v){
  const ala=Math.floor(v/10)*10, yla=ala+10, puoli=ala+5;
  const pyor = (v%10)>=5 ? yla : ala;
  const x = n => X0 + (n/100)*(X1-X0);
  let s=`<line class="rail" x1="${X0}" y1="${Y}" x2="${X1}" y2="${Y}"/>`;
  for(let n=0;n<=100;n+=10){
    const near = (n===ala||n===yla);
    s+=`<line class="tick" x1="${x(n)}" y1="${Y-7}" x2="${x(n)}" y2="${Y+7}"/>`;
    s+=`<text class="stop${near?" near":""}" x="${x(n)}" y="${Y+24}" text-anchor="middle">${n}</text>`;
  }
  s+=`<line class="halfway" x1="${x(puoli)}" y1="${Y-16}" x2="${x(puoli)}" y2="${Y+12}"/>`;
  s+=`<text class="stop" x="${x(puoli)}" y="${Y-22}" text-anchor="middle">puoliväli ${puoli}</text>`;
  s+=`<circle class="dot" cx="${x(v)}" cy="${Y}" r="6"/>`;
  s+=`<text class="val" x="${x(v)}" y="${Y-32}" text-anchor="middle">${v}</text>`;
  s+=`<path d="M ${x(v)} ${Y+38} L ${x(pyor)} ${Y+38}" stroke="var(--core)" stroke-width="2" fill="none"/>`;
  s+=`<path d="M ${x(pyor)} ${Y+38} l ${x(pyor)>x(v)?-7:7} -4 l 0 8 z" fill="var(--core)"/>`;
  svg.innerHTML=s;
  out.textContent = `${v} pyöristyy → ${pyor}`;
}

/* ---------- laskujärjestys-widget ---------- */
const ljExp=document.getElementById("ljExp");
if(ljExp && D.kokeilu){
  let ljI=0, ljTokens=[], ljStep=0;
  const laske=(a,op,b)=>{a=+a;b=+b;return op==="×"?a*b:op==="÷"?a/b:op==="+"?a+b:a-b;};
  function ljAlku(){
    const l=D.kokeilu[ljI];
    ljTokens=l.lauseke.replace(/\(/g,"( ").replace(/\)/g," )").split(/\s+/).filter(Boolean);
    ljStep=0; ljPiirra(); ljViesti("","");
  }
  function ljViesti(t,lk){const f=document.getElementById("ljFb"); f.textContent=t; f.className="lj-fb "+(lk||"");}
  function ljPiirra(){
    const l=D.kokeilu[ljI];
    document.getElementById("ljStep").textContent =
      ljStep>=l.askeleet.length ? "valmis" : `askel ${ljStep+1} / ${l.askeleet.length}`;
    if(ljStep>=l.askeleet.length){
      ljExp.innerHTML=`<span class="valmis">${l.lauseke} = ${l.vastaus}</span>`;
      return;
    }
    ljExp.innerHTML=ljTokens.map((t,i)=>
      "×÷+−".includes(t) ? `<button type="button" class="op" data-i="${i}">${t}</button>`
                         : `<span class="tok">${t}</span>`).join("");
    ljExp.querySelectorAll("button.op").forEach(b=>b.addEventListener("click",()=>ljKlikkaa(+b.dataset.i)));
  }
  function ljKlikkaa(i){
    const l=D.kokeilu[ljI], odotettu=l.askeleet[ljStep];
    const ehdotus=[ljTokens[i-1],ljTokens[i],ljTokens[i+1]].join(" ");
    if(ehdotus!==odotettu){
      ljViesti(ljStep===0
        ? "Ei vielä. Sulkeet ovat vahvimmat, sitten kerto ja jako. Yhtä vahvat vasemmalta oikealle."
        : "Ei vielä. Kumpi jäljellä olevista on vahvempi?", "no");
      return;
    }
    const arvo=laske(ljTokens[i-1],ljTokens[i],ljTokens[i+1]);
    let alku=i-1, loppu=i+1;
    if(ljTokens[i-2]==="(" && ljTokens[i+2]===")"){ alku=i-2; loppu=i+2; }
    ljTokens.splice(alku, loppu-alku+1, String(arvo));
    ljStep++;
    ljViesti(ljStep>=l.askeleet.length ? "Valmis. Vastaus on "+l.vastaus+"." : "Oikein. Jatka seuraavaan.", "ok");
    ljPiirra();
  }
  document.getElementById("ljSeuraava").addEventListener("click",()=>{
    ljI=(ljI+1)%D.kokeilu.length; ljAlku();
  });
  ljAlku();
}

};

/* Suomalainen lukumuoto: välilyönti on tuhaterotin, pilkku desimaalierotin.
   Piste voi olla kumpi tahansa. Se tulkitaan tuhaterottimeksi VAIN silloin, kun
   koko luku on aitoa tuhaterotinmuotoa: alkuosa 1–3 numeroa ilman etunollaa ja
   jokainen jatko-osa täsmälleen 3 numeroa (1.500, 12.345.678). Kaikissa muissa
   tapauksissa piste on desimaalipiste — myös 0.125, joka vanhalla säännöllä
   ("3 numeroa pisteen jäljessä = tuhaterotin") luettiin virheellisesti luvuksi 125. */
const TUHATEROTIN = /^[1-9]\d{0,2}(\.\d{3})+$/;
function lueLuku(teksti){
  // Murtoluku (3/4, -3/4) ja sekaluku (1 2/3, -1 2/3) hyväksytään sellaisinaan.
  const raaka = String(teksti).replace(/\u00a0/g, " ").trim();
  let m = raaka.match(/^(-?)(\d+)\s+(\d+)\s*\/\s*(\d+)$/);
  if(m){ const nim = Number(m[4]); if(nim === 0) return null;
    const v = Number(m[2]) + Number(m[3]) / nim; return m[1] ? -v : v; }
  m = raaka.match(/^(-?)\s*(\d+)\s*\/\s*(\d+)$/);
  if(m){ const nim = Number(m[3]); if(nim === 0) return null;
    const v = Number(m[2]) / nim; return m[1] ? -v : v; }
  let s = String(teksti).replace(/[\s\u00a0]/g, "");
  if(s === "") return null;
  if(s.indexOf(",") >= 0){
    s = s.replace(/\./g, "").replace(",", ".");
  } else if(TUHATEROTIN.test(s)){
    s = s.replace(/\./g, "");
  }
  const n = Number(s);
  return Number.isFinite(n) ? n : null;
}

function tarkista(id){
  const h=D.harjoitukset.find(x=>x.id===id);
  const kentta=document.getElementById("in-"+id);
  const fb=document.getElementById("fb-"+id);
  if(kentta.value.trim()===""){ fb.className="fb hint"; fb.textContent="Kirjoita vastaus ensin."; return; }
  const luku=lueLuku(kentta.value);
  if(luku===null){ fb.className="fb no"; fb.textContent="Vastauksen pitää olla luku tai murtoluku (esimerkiksi 3/4)."; return; }
  const oikein = Math.abs(luku - h.vastaus) < 1e-9;
  merkitseTulos(id, oikein, oikein ? "Oikein. "+h.selitys : `Ei vielä. ${h.vinkki} Kokeile uudelleen.`);
}

function tarkistaMonivalinta(id, valittuIndeksi, painike){
  const h=D.harjoitukset.find(x=>x.id===id);
  const rivi=painike.closest(".row");
  rivi.querySelectorAll(".mv-valinta").forEach(b=>b.disabled=true);
  const oikein = valittuIndeksi===h.vastaus;
  painike.classList.add(oikein?"mv-oikein":"mv-vaarin");
  if(!oikein){
    const oikeaBtn=rivi.querySelector(`[data-i="${h.vastaus}"]`);
    if(oikeaBtn) oikeaBtn.classList.add("mv-oikein");
  }
  merkitseTulos(id, oikein, oikein ? "Oikein. "+h.selitys : `Ei ihan. Oikea vastaus on korostettu. ${h.selitys||""}`);
}

/* Kuuntelu: selain lukee tekstin ääneen omalla puhesynteesillään (englanniksi, jos laitteessa on
   englanninkielinen ääni). Ei äänitiedostoja eikä verkkoyhteyttä. Jos laite ei osaa puhua,
   teksti näytetään luettavaksi — silloin tehtävä muuttuu luetun ymmärtämiseksi, mutta ei katkea. */
function puhu(id, nopeus){
  const h=D.harjoitukset.find(x=>x.id===id); if(!h || !h.kuuntele) return;
  const vara=document.getElementById("vara-"+id);
  const naytaTeksti=syy=>{ vara.hidden=false; vara.textContent=syy+" Teksti: "+h.kuuntele; };
  if(!("speechSynthesis" in window)){ naytaTeksti("Tämä laite ei osaa lukea ääneen."); return; }
  const s=window.speechSynthesis; s.cancel();
  const u=new SpeechSynthesisUtterance(h.kuuntele);
  u.lang=h.kieli||"en-GB"; u.rate=nopeus;
  const aanet=s.getVoices(), kieli=u.lang.slice(0,2);
  const aani=aanet.find(a=>a.lang===u.lang) || aanet.find(a=>a.lang && a.lang.startsWith(kieli));
  if(aani) u.voice=aani;
  else if(aanet.length) { naytaTeksti("Laitteessa ei ole englanninkielistä ääntä."); return; }
  u.onerror=()=>naytaTeksti("Ääneen lukeminen ei onnistunut.");
  s.speak(u);
}
