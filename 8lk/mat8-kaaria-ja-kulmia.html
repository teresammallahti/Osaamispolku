<title>Kaaria ja kulmia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">

<style>
:root{
  --paper:#EFF2F5; --surface:#FFFFFF; --surface-2:#F7F9FB;
  --grid:#DCE3EA; --line:#C9D3DC;
  --ink:#15222C; --ink-2:#4E626F; --ink-3:#7E8F9B;
  --core:#1B5A9E; --core-soft:#E4EDF6;
  --strong:#1F6E5C; --strong-soft:#E1F0EB;
  --chal:#9A6A16; --chal-soft:#F6EDDC;
  --alert:#A33A2B; --alert-soft:#F8E7E3;
  --shadow:0 1px 2px rgba(21,34,44,.06), 0 8px 24px -12px rgba(21,34,44,.18);
  --r:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0F161B; --surface:#18222A; --surface-2:#1D2830;
    --grid:#22303A; --line:#2E3E4A;
    --ink:#E8EFF4; --ink-2:#A3B4C0; --ink-3:#7A8B97;
    --core:#7FB2E4; --core-soft:#16303F;
    --strong:#77CDB4; --strong-soft:#123028;
    --chal:#E0B267; --chal-soft:#33270F;
    --alert:#E8907F; --alert-soft:#3A1E19;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -14px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --paper:#0F161B; --surface:#18222A; --surface-2:#1D2830;
  --grid:#22303A; --line:#2E3E4A;
  --ink:#E8EFF4; --ink-2:#A3B4C0; --ink-3:#7A8B97;
  --core:#7FB2E4; --core-soft:#16303F;
  --strong:#77CDB4; --strong-soft:#123028;
  --chal:#E0B267; --chal-soft:#33270F;
  --alert:#E8907F; --alert-soft:#3A1E19;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -14px rgba(0,0,0,.7);
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:16px; line-height:1.62;
  background-image:
    linear-gradient(to right, var(--grid) 1px, transparent 1px),
    linear-gradient(to bottom, var(--grid) 1px, transparent 1px);
  background-size:26px 26px;
}
.wrap{max-width:760px; margin:0 auto; padding:28px 20px 90px}
h1,h2,h3,h4{font-family:"Familjen Grotesk","IBM Plex Sans",system-ui,sans-serif; text-wrap:balance}

/* header */
header.top{background:var(--surface); border:1px solid var(--line); border-radius:var(--r);
  box-shadow:var(--shadow); padding:22px 24px; display:flex; gap:18px; align-items:flex-start}
.badge{flex:0 0 auto; width:54px; height:54px; border-radius:9px; display:grid; place-items:center;
  background:var(--core-soft); border:1px solid var(--core); color:var(--core)}
.badge svg{width:28px; height:28px; fill:none; stroke:currentColor; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round}
.eyebrow{font-family:"IBM Plex Mono",monospace; font-size:11px; letter-spacing:.14em;
  text-transform:uppercase; color:var(--ink-3); margin:0 0 5px}
header.top h1{margin:0; font-size:30px; font-weight:700; letter-spacing:-.015em}
header.top p{margin:5px 0 0; color:var(--ink-2); font-size:15px}
.tags{display:flex; flex-wrap:wrap; gap:5px; margin-top:11px}
.tag{font-family:"IBM Plex Mono",monospace; font-size:10.5px; letter-spacing:.05em; padding:2px 7px;
  border-radius:4px; background:var(--surface-2); border:1px solid var(--line); color:var(--ink-3)}
.tag.core{background:var(--core-soft); border-color:var(--core); color:var(--core)}

/* teksti */
article{margin-top:26px}
article h2{font-size:21px; font-weight:600; margin:32px 0 10px; letter-spacing:-.01em}
article p{margin:0 0 14px; max-width:64ch}
.lead{font-size:17.5px; color:var(--ink); border-left:3px solid var(--core); padding-left:16px; margin:0 0 8px}

.box{background:var(--surface); border:1px solid var(--line); border-radius:var(--r);
  padding:18px 22px; box-shadow:var(--shadow); margin:22px 0}
.box h3{margin:0 0 12px; font-size:16.5px; font-weight:600}
.box.warn{border-left:3px solid var(--alert)}
.box.note{border-left:3px solid var(--chal)}

ol.steps{margin:0; padding-left:0; list-style:none; counter-reset:s; display:grid; gap:12px}
ol.steps li{counter-increment:s; display:grid; grid-template-columns:auto 1fr; gap:13px; align-items:start}
ol.steps li::before{content:counter(s); font-family:"Familjen Grotesk",sans-serif; font-weight:700; font-size:14px;
  width:26px; height:26px; border-radius:50%; background:var(--core); color:#fff; display:grid; place-items:center; margin-top:2px}

ul.notes{margin:0; padding-left:19px}
ul.notes li{margin-bottom:7px}
ul.notes li:last-child{margin-bottom:0}

.tablewrap{overflow-x:auto}
table{border-collapse:collapse; width:100%; font-size:14.5px; min-width:460px}
th,td{text-align:left; padding:9px 13px; border-bottom:1px solid var(--line)}
th{font-family:"IBM Plex Mono",monospace; font-size:10.5px; letter-spacing:.1em; text-transform:uppercase;
  color:var(--ink-3); font-weight:400; background:var(--surface-2)}
tr:last-child td{border-bottom:0}
td b{color:var(--core); font-weight:600}
td:last-child{font-variant-numeric:tabular-nums; font-weight:600}

/* lukusuora */
.nl svg{width:100%; height:118px; display:block}
.nl .rail{stroke:var(--line); stroke-width:2}
.nl .tick{stroke:var(--line); stroke-width:1.5}
.nl .stop{fill:var(--ink-3); font-family:"IBM Plex Mono",monospace; font-size:11px}
.nl .stop.near{fill:var(--core); font-weight:600}
.nl .dot{fill:var(--chal)}
.nl .val{fill:var(--ink); font-family:"Familjen Grotesk",sans-serif; font-size:15px; font-weight:700}
.nl .halfway{stroke:var(--chal); stroke-dasharray:3 3; stroke-width:1.5}
.nl-controls{display:flex; align-items:center; gap:14px; margin-top:6px}
.nl-controls input{flex:1; accent-color:var(--core)}
.nl-out{font-family:"Familjen Grotesk",sans-serif; font-size:15px; font-weight:600; min-width:12.5em; text-align:right}

/* paikka-arvotaulu */
.box .ohje{margin:0 0 14px; font-size:14.5px; color:var(--ink-2)}
.nt-valinta{display:flex; flex-wrap:wrap; gap:7px; margin-bottom:16px}
.nt-valinta button{font:inherit; font-size:12.5px; font-family:"IBM Plex Mono",monospace; padding:5px 11px;
  border-radius:6px; border:1px solid var(--line); background:var(--surface-2); color:var(--ink-2); cursor:pointer}
.nt-valinta button[aria-pressed="true"]{background:var(--ink); color:var(--paper); border-color:var(--ink)}
.nt-valinta button:focus-visible{outline:2px solid var(--core); outline-offset:2px}
.nt-taulu{display:flex; flex-direction:column; gap:4px; align-items:flex-start; overflow-x:auto; padding-bottom:4px}
.nt-rivi{display:flex; gap:6px; align-items:center}
.nt-rivi .otsa{font-family:"IBM Plex Mono",monospace; font-size:9.5px; letter-spacing:.08em;
  text-transform:uppercase; color:var(--ink-3); width:52px; text-align:center}
.nt-ruutu{width:52px; height:52px; display:grid; place-items:center; border:1.5px solid var(--line);
  border-radius:7px; background:var(--surface-2); font-family:"IBM Plex Mono",monospace; font-size:24px}
.nt-ruutu.kohta{border-color:var(--core); background:var(--core-soft); color:var(--core); font-weight:500}
.nt-ruutu.ratkaiseva{border-color:var(--chal); background:var(--chal-soft); color:var(--chal); font-weight:500}
.nt-ruutu.nolla{color:var(--ink-3)}
.nt-rivi .nimi{font-size:12.5px; color:var(--ink-3); margin-left:12px; white-space:nowrap}
.nt-nuoli{font-size:17px; color:var(--chal); margin-left:6px}
.nt-selite{margin:14px 0 0; font-size:14.5px}
.nt-selite b{color:var(--core)}

/* vahvuusportaat */
.vp-tasot{display:grid; gap:9px; margin-bottom:18px}
.vp-taso{display:flex; gap:11px; align-items:flex-start; font-size:13.5px}
.vp-taso .vp-pallo{width:13px; height:13px; border-radius:4px; margin-top:5px; flex:0 0 auto}
.vp-taso[data-taso="sulkeet"] .vp-pallo{background:var(--core)}
.vp-taso[data-taso="kertojako"] .vp-pallo{background:var(--strong)}
.vp-taso[data-taso="yhteenvahennys"] .vp-pallo{background:var(--chal)}
.vp-taso strong{display:block; font-family:"Familjen Grotesk",sans-serif; font-weight:600; font-size:14.5px}
.vp-taso span{color:var(--ink-2)}
.vp-lauseke{display:flex; flex-wrap:wrap; gap:7px; align-items:flex-end; font-family:"IBM Plex Mono",monospace;
  font-size:25px; padding:10px 2px; min-height:64px}
.vp-lauseke .t{padding:2px 3px}
.vp-lauseke .op{position:relative; padding:2px 9px; border-radius:6px; font-weight:500}
.vp-lauseke .op[data-taso="sulkeet"]{background:var(--core-soft); color:var(--core)}
.vp-lauseke .op[data-taso="kertojako"]{background:var(--strong-soft); color:var(--strong)}
.vp-lauseke .op[data-taso="yhteenvahennys"]{background:var(--chal-soft); color:var(--chal)}
.vp-lauseke .op i{position:absolute; top:-9px; right:-6px; font-style:normal; font-family:"Familjen Grotesk",sans-serif;
  font-size:11px; font-weight:700; width:18px; height:18px; border-radius:50%; display:grid; place-items:center;
  background:currentColor}
.vp-lauseke .op i span{color:var(--surface)}
.vp-rivi{display:flex; align-items:center; gap:16px; margin-top:8px}
.vp-vastaus{font-family:"Familjen Grotesk",sans-serif; font-size:16px; font-weight:600; color:var(--strong)}

/* laskujärjestys-widget */
.lj-exp{display:flex; flex-wrap:wrap; gap:7px; align-items:center; font-family:"IBM Plex Mono",monospace;
  font-size:23px; padding:14px 4px; min-height:62px}
.lj-exp .tok{padding:2px 4px; color:var(--ink)}
.lj-exp button.op{font-family:"IBM Plex Mono",monospace; font-size:23px; padding:3px 12px; border-radius:7px;
  border:1.5px solid var(--line); background:var(--surface-2); color:var(--ink); line-height:1.2}
.lj-exp button.op:hover{border-color:var(--core); color:var(--core)}
.lj-exp button.op:focus-visible{outline:2px solid var(--core); outline-offset:2px}
.lj-exp .valmis{font-family:"Familjen Grotesk",sans-serif; font-size:23px; font-weight:700; color:var(--strong)}
.lj-fb{font-size:14.5px; min-height:1.5em; color:var(--ink-2)}
.lj-fb.no{color:var(--alert)}
.lj-fb.ok{color:var(--strong)}
.lj-row{display:flex; align-items:center; gap:14px; margin-top:10px}
.lj-step{font-family:"IBM Plex Mono",monospace; font-size:11.5px; letter-spacing:.1em;
  text-transform:uppercase; color:var(--ink-3)}

/* harjoitukset */
.progress{position:sticky; top:0; z-index:5; background:var(--surface); border:1px solid var(--line);
  border-radius:var(--r); padding:12px 18px; box-shadow:var(--shadow); display:flex; align-items:center;
  gap:14px; margin:34px 0 18px}
.progress .lbl{font-family:"IBM Plex Mono",monospace; font-size:11px; letter-spacing:.12em;
  text-transform:uppercase; color:var(--ink-3); white-space:nowrap}
.progress .meter{flex:1; height:7px; border-radius:4px; background:var(--surface-2); border:1px solid var(--line); overflow:hidden}
.progress .meter i{display:block; height:100%; background:var(--core); transition:width .25s ease}
.progress .cnt{font-family:"Familjen Grotesk",sans-serif; font-weight:700; font-variant-numeric:tabular-nums; white-space:nowrap}

.grp{margin-top:26px}
.grp-head{display:flex; align-items:baseline; gap:10px; border-bottom:1.5px solid var(--ink); padding-bottom:7px; margin-bottom:14px}
.grp-head h3{margin:0; font-size:17px; font-weight:600}
.grp-head span{font-size:12.5px; color:var(--ink-2)}

.ex{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:14px 16px; margin-bottom:10px}
.ex[data-tila="oikein"]{border-color:var(--strong); box-shadow:inset 3px 0 0 var(--strong)}
.ex[data-tila="vaarin"]{border-color:var(--alert); box-shadow:inset 3px 0 0 var(--alert)}
.ex .q{display:flex; gap:11px; align-items:baseline; flex-wrap:wrap}
.ex .num{font-family:"IBM Plex Mono",monospace; font-size:11.5px; color:var(--ink-3); min-width:2.4em}
.ex .txt{flex:1; min-width:190px; font-size:15.5px}
.ex .txt .aineisto{display:block; margin-bottom:9px; padding-left:12px;
  border-left:2px solid var(--line); color:var(--ink-2); line-height:1.6;
  /* Aineisto voi olla pieni taulukko, jonka rivit on erotettu rivinvaihdoilla.
     Ilman pre-lineä ne valuisivat yhdeksi kappaleeksi ja taulukko katoaisi. */
  white-space:pre-line}
.ex .txt .kysymysrivi{display:block; font-weight:600}
.ex .row{display:flex; gap:8px; align-items:center; margin-top:11px; flex-wrap:wrap}
.ex input[type=text]{font:inherit; font-family:"IBM Plex Mono",monospace; font-size:15px; width:8.5em;
  padding:7px 11px; border:1px solid var(--line); border-radius:7px; background:var(--surface-2);
  color:var(--ink); text-align:right}
.ex input:focus-visible{outline:2px solid var(--core); outline-offset:1px}
button{font:inherit; cursor:pointer}
.btn{font-size:13.5px; padding:7px 15px; border-radius:7px; border:1px solid var(--core);
  background:var(--core); color:#fff}
.btn.ghost{background:transparent; color:var(--ink-2); border-color:var(--line)}
.btn:focus-visible{outline:2px solid var(--core); outline-offset:2px}
.btn.mv-valinta{text-align:left}
/* kuuntelutehtävä: selaimen puhesynteesi lukee englanninkielisen tekstin */
.kuuntele{display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin:2px 0 10px}
.kuuntele .btn{display:inline-flex; gap:7px; align-items:center}
.kuuntele svg{width:16px; height:16px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round}
.kuuntele .varateksti{flex-basis:100%; font-size:14px; color:var(--ink-2); background:var(--surface-2);
  border-radius:7px; padding:8px 12px; margin:0}
.btn.mv-valinta:disabled{cursor:default; opacity:.65}
.btn.mv-oikein{background:var(--strong-soft); border-color:var(--strong); color:var(--strong); opacity:1}
.btn.mv-vaarin{background:var(--alert-soft); border-color:var(--alert); color:var(--alert); opacity:1}
.row.mv{gap:8px 10px}
.fb{margin-top:11px; font-size:14.5px; padding:10px 13px; border-radius:8px; line-height:1.5}
.fb.ok{background:var(--strong-soft); color:var(--strong)}
.fb.no{background:var(--alert-soft); color:var(--alert)}
.fb.hint{background:var(--chal-soft); color:var(--chal)}

.done{background:var(--strong-soft); border:1px solid var(--strong); color:var(--strong);
  border-radius:var(--r); padding:16px 20px; margin-top:20px; font-size:15.5px}
.done h3{margin:0 0 4px; font-size:17px; color:var(--strong)}

details.teacher{margin-top:34px; background:var(--surface); border:1px solid var(--line);
  border-left:3px solid var(--chal); border-radius:var(--r); padding:15px 20px; box-shadow:var(--shadow)}
details.teacher summary{cursor:pointer; font-family:"Familjen Grotesk",sans-serif; font-weight:600; font-size:15px}
details.teacher summary:focus-visible{outline:2px solid var(--core); outline-offset:3px}
details.teacher ul{margin:12px 0 0; padding-left:19px; color:var(--ink-2); font-size:14.5px}
details.teacher li{margin-bottom:8px}
details.teacher p{margin:12px 0 0; color:var(--ink-2); font-size:14.5px}

.back{display:inline-block; margin-top:30px; font-size:13.5px; color:var(--ink-2)}
.back a{color:var(--core)}

@media (prefers-reduced-motion: reduce){*{transition:none !important}}
@media (max-width:560px){
  .wrap{padding:16px 13px 70px}
  header.top h1{font-size:25px}
  .progress{flex-wrap:wrap}
}
</style>

<div class="wrap">

  <header class="top">
    <span class="badge"><svg viewBox="0 0 24 24" aria-hidden="true" id="ikoni"></svg></span>
    <div>
      <p class="eyebrow" id="eyebrow"></p>
      <h1 id="otsikko"></h1>
      <p id="kuvaus"></p>
      <div class="tags" id="tags"></div>
    </div>
  </header>

  <article id="teksti"></article>

  <div class="progress" aria-live="polite">
    <span class="lbl">Harjoitukset</span>
    <span class="meter"><i id="pbar" style="width:0%"></i></span>
    <span class="cnt" id="pcnt">0 / 20</span>
  </div>

  <div id="harjoitukset"></div>
  <div id="valmis"></div>

  <p class="back" id="back"></p>

</div>

<script>
const D = {"tavoite_id":"MAT8-MIT-03","oppiaine":"MAT","vuosiluokka":8,"taso":"vahvistava","otsikko":"Kaaria ja kulmia","kuvaus":"Osaan laskea sellaisen kuvion piirin ja pinta-alan, joka koostuu monikulmioista ja ympyrän osista.","versio":"0.2","paivitetty":"2026-10-11","ops":{"T":["T7","T18"],"S":["S5"]},"ikoni":"murtoyhteen","eyebrow":"Matematiikka · 8. luokka · Mittaaminen","teksti":[{"tyyppi":"johdanto","sisalto":"Kun juoksijat lähtevät kokonaisen kierroksen kisaan, ulkoradan juoksija lähtee selvästi muita edempää. Se ei ole etu vaan korjaus. Rata koostuu kahdesta suorasta osuudesta ja kahdesta puoliympyrän muotoisesta kaarteesta. Suorat ovat kaikilla radoilla yhtä pitkiä, mutta ulompana kulkevan radan kaarteiden halkaisija on suurempi. Oletetaan, että sisimmän radan suorat ovat 85 m pitkiä ja kaarteiden halkaisija on 70 m. Kaksi puoliympyrää muodostavat yhdessä yhden kokonaisen ympyrän, joten kierros on 2 · 85 m + π · 70 m ≈ 390 m. Viereisen radan kaarteiden halkaisija on 2,4 m suurempi, joten sen kierros on π · 2,4 m ≈ 7,5 m pidempi, ja sen verran sen lähtöviiva siirretään eteenpäin. Juoksurata on yhdistetty kuvio: se koostuu suorakulmiosta ja ympyrän osista. Tässä taidossa opit laskemaan tällaisten kuvioiden piirin ja pinta-alan jakamalla kuvion osiin tai vähentämällä osan kokonaisuudesta. Opit myös laskemaan piiriin vain kuvion ulkoreunan ja tarkistamaan tuloksen suuruusluokan kuvion ympäri piirretyn suorakulmion avulla."},{"tyyppi":"kappale","otsikko":"Jaa osiin, merkitse jako ja laske piiriin vain ulkoreuna","sisalto":"Yhdistetylle kuviolle ei ole omaa kaavaa, mutta sen osille on. Piirrä ensin mallikuvio ja kirjoita siihen mitat. Vedä sitten katkoviiva kohtaan, jossa osat kohtaavat, ja nimeä osat. Jakoviiva näyttää, mitkä kaavat tarvitset, ja se estää laskemasta samaa aluetta kahteen kertaan. Esimerkki: kuvio koostuu neliöstä, jonka sivu on 6 cm, ja puoliympyrästä, joka on liitetty neliön yhden sivun päälle niin, että puoliympyrän halkaisija on tämä sivu. Jakoviiva on neliön ja puoliympyrän yhteinen sivu. Neliön ala on 6 cm · 6 cm = 36 cm². Puoliympyrän säde on puolet halkaisijasta eli 3 cm, ja sen ala on puolet ympyrän alasta: π · (3 cm)² : 2 = 4,5π cm² ≈ 14,1 cm². Kuvion ala on noin 36 cm² + 14,1 cm² = 50,1 cm². Piiri on kuvion reunan pituus eli matka, jonka kuljet, kun kierrät kuvion ympäri kerran. Jakoviiva on kuvion sisällä, joten sitä pitkin ei kuljeta, eikä se kuulu piiriin. Esimerkin kuvion reunassa ovat neliön kolme sivua ja puoliympyrän kaari. Kaari on puolet koko kehästä: π · 6 cm : 2 = 3π cm ≈ 9,4 cm. Piiri on noin 3 · 6 cm + 9,4 cm = 27,4 cm. Puoliympyrän kaari on siis πd : 2 eli πr. Yksinään olevan puoliympyrän piiriin kuuluu kaaren lisäksi halkaisija, koska se on silloin kuvion reunaa. Kun puoliympyrä liitetään toiseen kuvioon, halkaisijasta tulee jakoviiva, ja se jää piiristä pois. Kun kuviosta leikataan pala pois, leikkauksen reuna tulee kuvion reunaksi ja leikatun palan muut sivut jäävät pois."},{"tyyppi":"kappale","otsikko":"Vähennä osa kokonaisuudesta: leikattu neljännesympyrä ja rengas","sisalto":"Kun kuviosta puuttuu ympyrän osa, laske ensin kokonainen kuvio ja vähennä puuttuva osa. Suorakulmion sivut ovat 12 cm ja 8 cm, ja sen yhdestä kulmasta leikataan pois neljännesympyrä, jonka keskipiste on suorakulmion kärjessä ja säde 4 cm. Merkitse mallikuvioon leikattava osa esimerkiksi varjostamalla. Ala on 12 cm · 8 cm − π · (4 cm)² : 4 = 96 cm² − 4π cm² ≈ 83,4 cm². Piiri lasketaan reunasta: kaksi kokonaista sivua 12 cm ja 8 cm, kaksi lyhentynyttä sivua 12 cm − 4 cm = 8 cm ja 8 cm − 4 cm = 4 cm sekä neljännesympyrän kaari 2π · 4 cm : 4 = 2π cm ≈ 6,3 cm. Piiri on noin 12 cm + 8 cm + 8 cm + 4 cm + 6,3 cm = 38,3 cm. Ympyrärengas on kahden samankeskisen ympyrän väliin jäävä alue, esimerkiksi aluslaatta tai pyöreän altaan ympäri kiertävä laatoitus. Sen ala on ulomman ympyrän ala miinus sisemmän ympyrän ala. Jos ulkosäde on R ja sisäsäde r, ala on πR² − πr² = π(R² − r²). Kun R = 9 cm ja r = 5 cm, ala on 81π cm² − 25π cm² = 56π cm² ≈ 176 cm². Jos tehtävä antaa sisemmän ympyrän halkaisijan ja renkaan leveyden, laske säteet ensin: sisäsäde on puolet halkaisijasta, ja ulkosäde on sisäsäde plus renkaan leveys."},{"tyyppi":"kappale","otsikko":"Segmentti on sektori miinus kolmio","sisalto":"Segmenttiä rajaavat jänne ja kaari. Tässä taidossa segmentin keskuskulma on alle 180°. Silloin segmentti saadaan, kun samaa kaarta vastaavasta sektorista vähennetään kolmio, jonka kärjet ovat ympyrän keskipiste ja jänteen päätepisteet. Kolmion kaksi sivua ovat säteitä. Kun keskuskulma on 90°, kolmio on suorakulmainen ja säteet ovat sen kateetit, joten ne ovat kolmion kanta ja korkeus. Jos säde on 4 cm, sektorin ala on π · (4 cm)² : 4 = 4π cm² ≈ 12,57 cm², kolmion ala on 4 cm · 4 cm : 2 = 8 cm², ja segmentin ala on 12,57 cm² − 8 cm² ≈ 4,6 cm². Segmentin piiriin kuuluvat kaari ja jänne, mutta eivät säteet, koska ne ovat sektorin reunaa eivätkä segmentin. Jänne on kolmion hypotenuusa, joten Pythagoraan lauseella se on √(4² + 4²) cm = √32 cm ≈ 5,66 cm. Kaari on 2π · 4 cm : 4 ≈ 6,28 cm, ja piiri on noin 11,9 cm. Kun keskuskulma on 60°, kolmio on tasakylkinen, koska kaksi sivua ovat säteitä. Sen kantakulmat ovat (180° − 60°) : 2 = 60°, joten kolmio on tasasivuinen ja jänne on yhtä pitkä kuin säde. Tasakylkisessä kolmiossa huipusta piirretty korkeus puolittaa kannan. Kun säde on 6 cm, korkeus h saadaan Pythagoraan lauseella: h² + 3² = 6², joten h = √27 cm ≈ 5,196 cm. Kolmion ala on 6 cm · 5,196 cm : 2 ≈ 15,59 cm², sektorin ala π · (6 cm)² : 6 = 6π cm² ≈ 18,85 cm² ja segmentin ala noin 3,3 cm². Muilla keskuskulmilla kolmion korkeus tarvitsee tietoja, joita tässä taidossa ei käytetä, joten tehtävissä keskuskulma on 90° tai 60°."},{"tyyppi":"kappale","otsikko":"Tarkista ympäröivällä suorakulmiolla","sisalto":"Kuvion ympäri piirretty suorakulmio on pienin suorakulmio, jonka sisään kuvio mahtuu ja jonka sivut ovat kuvion suorien sivujen suuntaiset. Koska kuvio on suorakulmion sisällä, kuvion ala ei voi olla suorakulmion alaa suurempi. Esimerkin neliö ja puoliympyrä mahtuvat suorakulmioon, jonka sivut ovat 6 cm ja 6 cm + 3 cm = 9 cm. Sen ala on 54 cm², ja kuvion ala 50,1 cm² on sitä vähän pienempi, koska vain puoliympyrän viereiset kulmat jäävät tyhjiksi. Hyvä vertailuluku: ympyrä, puoliympyrä ja neljännesympyrä täyttävät kukin noin 79 % omasta ympäröivästä suorakulmiostaan, koska π : 4 ≈ 0,785. Vertailu paljastaa liian suuren tuloksen, esimerkiksi sen, että halkaisijaa on käytetty säteenä. Liian pientä tulosta se ei paljasta: jos puoliympyrä unohtuu, 36 cm² on myös alle 54 cm². Katso siksi myös alaraja: kuvio sisältää koko neliön, joten sen ala on yli 36 cm². Piirille sama vertailu toimii, kun kuvion reuna ei missään kohdassa kaarru tai taitu sisäänpäin. Silloin piiri on enintään ympäröivän suorakulmion piiri: esimerkissä 27,4 cm on alle 2 · (6 cm + 9 cm) = 30 cm. Jos kuviossa on sisäänpäin kaartuva kolo, piiri voi olla suorakulmion piiriä suurempi, eikä vertailu silloin kerro piiristä mitään."},{"tyyppi":"saanto","otsikko":"Näin lasket yhdistetyn kuvion piirin ja alan","askeleet":["Piirrä mallikuvio ja kirjoita siihen mitat. Merkitse jako katkoviivalla tai vähennettävä osa varjostamalla, ja kirjoita, mistä osista kuvio koostuu.","Etsi jokaisen ympyrän osan säde. Jos tehtävä antaa halkaisijan, säde on puolet siitä.","Ala: laske osien alat (puoliympyrä πr² : 2, neljännesympyrä πr² : 4, sektori α/360° · πr²) ja lisää ne yhteen tai vähennä puuttuva osa. Rengas on πR² − πr², ja segmentti on sektori miinus kolmio.","Piiri: kulje kuvion reuna ajatuksissasi kerran ympäri ja laske mukaan vain viivat, joita pitkin kuljet. Jakoviivat eivät kuulu piiriin. Puoliympyrän kaari on πd : 2 ja neljännesympyrän kaari 2πr : 4.","Laske laskimella π-näppäintä käyttäen ja pyöristä vasta lopuksi pyydettyyn tarkkuuteen. Anna ala neliöyksikköinä ja piiri pituusyksikköinä.","Tarkista: ala on enintään ympäröivän suorakulmion ala ja vähintään kuvion sisään mahtuvan tutun osan ala."]},{"tyyppi":"ansa","otsikko":"Ansa 1: jakoviiva piiriin","sisalto":"Suorakulmion sivut ovat 10 cm ja 4 cm, ja kummankin 4 cm:n sivun päälle on liitetty puoliympyrä. Kuvion reunassa ovat suorakulmion pitkät sivut ja kaksi kaarta, jotka ovat yhdessä kokonainen kehä: 2 · 10 cm + π · 4 cm ≈ 32,6 cm. Jos lyhyet sivut lasketaan mukaan, tulos on 40,6 cm, vaikka ne ovat kuvion sisällä jakoviivoina. Vertailu paljastaa virheen: kuvio mahtuu suorakulmioon, jonka sivut ovat 14 cm ja 4 cm ja piiri 36 cm, eikä tämän kuvion reuna kaarru missään sisäänpäin. Sama virhe syntyy, kun kuviosta leikataan pala ja leikatun palan sivut lasketaan piiriin."},{"tyyppi":"ansa","otsikko":"Ansa 2: puoliympyrän kaari kokonaisena tai halkaisija säteenä","sisalto":"Juoksuradalla on kaksi 100 m:n suoraa osuutta, ja päissä on puoliympyrät, joiden halkaisija on 64 m. Kumpikin kaari on puolet kehästä, ja yhdessä ne ovat yksi kehä: 2 · 100 m + π · 64 m ≈ 401 m. Jos kumpikin kaari lasketaan kokonaisena kehänä π · 64 m, radan pituudeksi tulee noin 602 m. Sama 602 m tulee, jos halkaisija 64 m sijoitetaan säteeksi kaavaan 2πr ja kumpaankin päähän otetaan siitä puolet. Lue siis tehtävästä, onko annettu luku säde vai halkaisija, ja vertaa ympäröivään suorakulmioon: sen sivut ovat 164 m ja 64 m ja piiri 456 m, joten 602 m on liian pitkä."},{"tyyppi":"ansa","otsikko":"Ansa 3: renkaan ala π(R − r)²","sisalto":"Renkaan ulkosäde on 9 cm ja sisäsäde 5 cm. Lasku π · (9 cm − 5 cm)² = 16π cm² ≈ 50 cm² on väärin. Luku 9 − 5 = 4 on renkaan leveys, ja π · 4² on sellaisen ympyrän ala, jonka säde on renkaan leveys. Rengas kiertää koko sisemmän ympyrän ympäri, joten se on paljon suurempi. Oikea ala on 81π cm² − 25π cm² = 56π cm² ≈ 176 cm². Neliöiden erotus ei ole erotuksen neliö: 81 − 25 = 56, mutta (9 − 5)² = 16. Laske siksi molempien ympyröiden alat erikseen ja vähennä vasta sitten. Ympäröivä neliö (18 cm · 18 cm = 324 cm²) ei paljasta tätä virhettä, koska väärä tulos on liian pieni eikä liian suuri."},{"tyyppi":"ansa","otsikko":"Ansa 4: segmentti väärin päin tai kolmion alana r²","sisalto":"Segmentti on sektori miinus kolmio, ei kolmio miinus sektori. Kun säde on 4 cm ja keskuskulma 90°, lasku 8 cm² − 12,57 cm² antaa negatiivisen luvun, eikä pinta-ala voi olla negatiivinen. Toinen virhe on unohtaa kolmion alasta jakaminen kahdella: 12,57 cm² − 16 cm² on myös negatiivinen. Kolmion ala on kanta kertaa korkeus jaettuna kahdella, ja 90°:n keskuskulmalla kanta ja korkeus ovat säteet: 4 cm · 4 cm : 2 = 8 cm². 60°:n keskuskulmalla kolmio ei ole suorakulmainen, joten lasku r · r : 2 on väärin, ja korkeus lasketaan Pythagoraan lauseella. Tarkista, että segmentti on pienempi kuin sektori mutta suurempi kuin nolla. Tämä tarkistus paljastaa väärin päin vähentämisen ja kolmion alan r², mutta ei sitä, että 60°:n keskuskulman kolmio on laskettu suorakulmaisena: kun säde on 6 cm, 18,85 cm² − 18 cm² on positiivinen ja sektoria pienempi. Tarkista siksi myös, että kolmion korkeus on lyhyempi kuin säde."}],"harjoitusryhmat":[{"id":"piiri","nimi":"Piiri: vain ulkoreuna","info":"Piirrä jokaisesta kuviosta mallikuvio, merkitse jakoviivat katkoviivalla ja laske piiriin vain ne viivat, joita pitkin kierrät kuvion reunan. Puoliympyrän kaari on πd : 2. Laskin on sallittu: käytä π:n arvona laskimen π-näppäintä ja pyöristä vasta lopuksi."},{"id":"ala","nimi":"Pinta-ala osista ja vähentämällä","info":"Jaa kuvio osiin ja laske osien alat yhteen, tai laske suurempi kuvio ja vähennä puuttuva osa. Renkaan ala on πR² − πr². Tarkista ensin, onko annettu luku säde vai halkaisija. Laskin on sallittu, ja π:n arvona käytetään π-näppäintä."},{"id":"segmentti","nimi":"Segmentti ja tuloksen tarkistus","info":"Segmentti on sektori miinus kolmio, ja sen piiriin kuuluvat kaari ja jänne. Tarkista tulokset vertaamalla kuvion ympäri piirretyn suorakulmion alaan. Laskin on sallittu, ja π:n arvona käytetään π-näppäintä."}],"harjoitukset":[{"id":"H01","ryhma":"piiri","kysymys":"Puoliympyrän halkaisija on 10 cm. Laske puoliympyrän piiri 0,1 cm:n tarkkuudella. Anna vastaus senttimetreinä ilman yksikköä.","vastaus":25.7,"vinkki":"Puoliympyrän reunalla on kaari ja halkaisija.","selitys":"Kaari on puolet kehästä: π · 10 cm : 2 ≈ 15,71 cm. Piiri on 15,71 cm + 10 cm ≈ 25,7 cm. Vastaus 15,7 unohtaa halkaisijan, ja vastaus 41,4 laskee kaaren koko kehänä."},{"id":"H02","ryhma":"piiri","kysymys":"Neliön sivu on 16 cm, ja sen yhden sivun päälle on liitetty puoliympyrä, jonka halkaisija on tämä sivu. Laske kuvion piiri 0,1 cm:n tarkkuudella. Anna vastaus senttimetreinä ilman yksikköä.","vastaus":73.1,"vinkki":"Neliön ja puoliympyrän yhteinen sivu on jakoviiva. Kuuluuko se reunaan?","selitys":"Reunassa on neliön kolme sivua ja puoliympyrän kaari: 3 · 16 cm + π · 16 cm : 2 = 48 cm + 8π cm ≈ 73,1 cm. Vastaus 89,1 laskee jakoviivan mukaan."},{"id":"H03","ryhma":"piiri","kysymys":"Juoksuradalla on kaksi 120 m:n suoraa osuutta, ja radan päissä on puoliympyrät, joiden halkaisija on 50 m. Laske radan pituus metrin tarkkuudella. Anna vastaus metreinä ilman yksikköä.","vastaus":397,"vinkki":"Kaksi puoliympyrää ovat yhdessä yksi kokonainen ympyrä.","selitys":"Suorat ovat 2 · 120 m = 240 m ja kaaret yhdessä yksi kehä π · 50 m ≈ 157,1 m. Rata on noin 397 m pitkä. Vastaus 554 laskee kumpikin kaari kokonaisena kehänä."},{"id":"H04","ryhma":"piiri","kysymys":"Sektorin säde on 12 cm ja keskuskulma 50°. Laske sektorin piiri 0,1 cm:n tarkkuudella. Anna vastaus senttimetreinä ilman yksikköä.","vastaus":34.5,"vinkki":"Sektorin reunalla ovat kaari ja kaksi sädettä.","selitys":"Kaari on 50/360 = 5/36 kehästä: 5/36 · 2π · 12 cm ≈ 10,47 cm. Piiri on 2 · 12 cm + 10,47 cm ≈ 34,5 cm. Vastaus 10,5 on pelkkä kaari."},{"id":"H05","ryhma":"piiri","kysymys":"Suorakulmion sivut ovat 20 cm ja 15 cm. Suorakulmion yhdestä kulmasta leikataan pois neljännesympyrä, jonka keskipiste on suorakulmion kärjessä ja säde 10 cm. Laske jäljelle jäävän kuvion piiri 0,1 cm:n tarkkuudella. Anna vastaus senttimetreinä ilman yksikköä.","vastaus":65.7,"vinkki":"Kaksi sivua lyhenee säteen verran, ja tilalle tulee neljännesympyrän kaari.","selitys":"Reunassa ovat sivut 20 cm ja 15 cm, lyhentyneet sivut 20 cm − 10 cm = 10 cm ja 15 cm − 10 cm = 5 cm sekä kaari 2π · 10 cm : 4 = 5π cm ≈ 15,71 cm. Piiri on 50 cm + 15,71 cm ≈ 65,7 cm. Vastaus 85,7 laskee leikatut sivut kokonaisina."},{"id":"H06","ryhma":"piiri","kysymys":"Ikkuna koostuu suorakulmiosta, jonka leveys on 110 cm ja korkeus 150 cm, ja suorakulmion yläsivun päälle liitetystä puoliympyrästä, jonka halkaisija on 110 cm. Ikkunan koko ulkoreunan ympäri asennetaan tiiviste. Laske tiivisteen pituus senttimetrin tarkkuudella. Anna vastaus senttimetreinä ilman yksikköä.","vastaus":583,"vinkki":"Suorakulmion yläsivu on jakoviiva. Alasivu on reunaa.","selitys":"Reunassa ovat alasivu 110 cm, kaksi pystysivua 2 · 150 cm ja kaari π · 110 cm : 2 ≈ 172,8 cm. Tiiviste on noin 583 cm. Vastaus 693 laskee myös yläsivun."},{"id":"H07","ryhma":"piiri","kysymys":"Suorakulmion sivut ovat 20 cm ja 9 cm. Suorakulmion toisen 9 cm:n sivun päälle on liitetty puoliympyrä, ja toisesta 9 cm:n sivusta on leikattu pois samankokoinen puoliympyrä. Kummankin puoliympyrän halkaisija on 9 cm. Laske kuvion piiri 0,1 cm:n tarkkuudella. Anna vastaus senttimetreinä ilman yksikköä.","vastaus":68.3,"vinkki":"Kumpikaan 9 cm:n sivu ei ole enää kuvion reunaa. Molemmat kaaret ovat.","selitys":"Reunassa ovat pitkät sivut 2 · 20 cm ja kaksi puoliympyrän kaarta, yhteensä yksi kehä π · 9 cm ≈ 28,27 cm. Piiri on 68,3 cm. Vastaus 86,3 laskee lyhyet sivut mukaan."},{"id":"H08","ryhma":"ala","kysymys":"Neliön sivu on 8 cm, ja sen yhden sivun päälle on liitetty puoliympyrä, jonka halkaisija on tämä sivu. Laske kuvion pinta-ala 0,1 cm²:n tarkkuudella. Anna vastaus neliösenttimetreinä ilman yksikköä.","vastaus":89.1,"vinkki":"Puoliympyrän säde on 4 cm.","selitys":"Neliö on 64 cm² ja puoliympyrä π · (4 cm)² : 2 = 8π cm² ≈ 25,13 cm². Ala on noin 89,1 cm². Vastaus 164,5 käyttää halkaisijaa säteenä."},{"id":"H09","ryhma":"ala","kysymys":"Ympyrärenkaan ulkosäde on 6 cm ja sisäsäde 2 cm. Renkaan pinta-ala on kπ cm². Mikä on k?","vastaus":32,"vinkki":"Laske ulomman ja sisemmän ympyrän alat erikseen.","selitys":"Ala on π · 6² − π · 2² = 36π − 4π = 32π cm², joten k = 32. Vastaus 16 tulee laskusta (6 − 2)², joka ei ole renkaan ala."},{"id":"H10","ryhma":"ala","kysymys":"Pyöreän kukkapenkin halkaisija on 10 m. Penkin ympäri tehdään 1,5 m leveä polku. Laske polun pinta-ala 0,1 m²:n tarkkuudella. Anna vastaus neliömetreinä ilman yksikköä.","vastaus":54.2,"vinkki":"Penkin säde on 5 m, ja polun ulkosäde on 5 m + 1,5 m.","selitys":"Polun ulkosäde on 6,5 m ja sisäsäde 5 m. Ala on π · 6,5² − π · 5² = π · (42,25 − 25) m² ≈ 54,2 m². Vastaus 7,1 tulee laskusta π · 1,5²."},{"id":"H11","ryhma":"ala","kysymys":"Suorakulmion sivut ovat 12 cm ja 10 cm. Suorakulmion yhdestä kulmasta leikataan pois neljännesympyrä, jonka keskipiste on suorakulmion kärjessä ja säde 10 cm. Laske jäljelle jäävän osan pinta-ala 0,1 cm²:n tarkkuudella. Anna vastaus neliösenttimetreinä ilman yksikköä.","vastaus":41.5,"vinkki":"Suorakulmion ala miinus neljännesympyrän ala.","selitys":"Suorakulmio on 120 cm² ja neljännesympyrä π · (10 cm)² : 4 = 25π cm² ≈ 78,54 cm². Jäljelle jää 41,5 cm²."},{"id":"H12","ryhma":"ala","kysymys":"Suorakulmaisen kolmion kateetit ovat 15 cm ja 20 cm. Kolmion hypotenuusan päälle on liitetty puoliympyrä, jonka halkaisija on hypotenuusa. Laske kuvion pinta-ala neliösenttimetrin tarkkuudella. Anna vastaus neliösenttimetreinä ilman yksikköä.","vastaus":395,"vinkki":"Laske hypotenuusa Pythagoraan lauseella. Puoliympyrän säde on puolet hypotenuusasta.","selitys":"Kolmion ala on 15 cm · 20 cm : 2 = 150 cm². Hypotenuusa on √(15² + 20²) cm = √625 cm = 25 cm, joten säde on 12,5 cm. Puoliympyrän ala on π · 12,5² : 2 cm² ≈ 245,4 cm². Kuvion ala on noin 395 cm²."},{"id":"H13","ryhma":"ala","kysymys":"Suorakulmion muotoisen levyn sivut ovat 60 cm ja 40 cm. Levyyn porataan kuusi pyöreää reikää, joiden halkaisija on 4 cm. Laske jäljelle jäävän levyn pinta-ala 0,1 cm²:n tarkkuudella. Anna vastaus neliösenttimetreinä ilman yksikköä.","vastaus":2324.6,"vinkki":"Yhden reiän säde on 2 cm.","selitys":"Levy on 2 400 cm². Yksi reikä on π · 2² cm² ≈ 12,57 cm², kuusi reikää noin 75,40 cm². Jäljelle jää 2 324,6 cm². Vastaus 2 098,4 käyttää halkaisijaa säteenä."},{"id":"H14","ryhma":"ala","kysymys":"Pöytälevy on suorakulmio, jonka sivut ovat 100 cm ja 60 cm. Levyn toisesta pitkästä sivusta on sahattu keskeltä pois puoliympyrän muotoinen kolo. Kolon halkaisija on 30 cm pitkä osa levyn sivua. Laske levyn pinta-ala neliösenttimetrin tarkkuudella. Anna vastaus neliösenttimetreinä ilman yksikköä.","vastaus":5647,"vinkki":"Piirrä mallikuvio ja varjosta kolo. Kolon säde on 15 cm.","selitys":"Suorakulmio on 6 000 cm² ja kolo π · (15 cm)² : 2 ≈ 353,4 cm². Levyn ala on noin 5 647 cm². Vastaus 4 586 käyttää halkaisijaa säteenä."},{"id":"H15","ryhma":"segmentti","kysymys":"Ympyrän säde on 5 cm. Laske 90°:n keskuskulmaa vastaavan segmentin pinta-ala 0,1 cm²:n tarkkuudella. Anna vastaus neliösenttimetreinä ilman yksikköä.","vastaus":7.1,"vinkki":"Sektori miinus kolmio. Kolmion kateetit ovat säteet.","selitys":"Sektori on π · 5² : 4 cm² ≈ 19,63 cm² ja kolmio 5 cm · 5 cm : 2 = 12,5 cm². Segmentti on noin 7,1 cm². Jos kolmion alaksi otetaan 25 cm², tulos on negatiivinen."},{"id":"H16","ryhma":"segmentti","kysymys":"Ympyrän säde on 8 cm. Laske 60°:n keskuskulmaa vastaavan segmentin pinta-ala 0,1 cm²:n tarkkuudella. Anna vastaus neliösenttimetreinä ilman yksikköä.","vastaus":5.8,"vinkki":"Kolmio on tasasivuinen. Laske sen korkeus Pythagoraan lauseella.","selitys":"Sektori on π · 8² : 6 cm² ≈ 33,51 cm². Kolmion sivu on 8 cm ja korkeus √(8² − 4²) cm = √48 cm ≈ 6,928 cm, joten kolmion ala on 8 cm · 6,928 cm : 2 ≈ 27,71 cm². Segmentti on noin 5,8 cm²."},{"id":"H17","ryhma":"segmentti","kysymys":"Ympyrän säde on 12 cm. Laske 90°:n keskuskulmaa vastaavan segmentin piiri 0,1 cm:n tarkkuudella. Anna vastaus senttimetreinä ilman yksikköä.","vastaus":35.8,"vinkki":"Segmentin reunalla ovat kaari ja jänne. Jänne on suorakulmaisen kolmion hypotenuusa.","selitys":"Kaari on 2π · 12 cm : 4 = 6π cm ≈ 18,85 cm ja jänne √(12² + 12²) cm = √288 cm ≈ 16,97 cm. Piiri on noin 35,8 cm. Vastaus 42,8 laskee säteet piiriin."},{"id":"H18","ryhma":"segmentti","kysymys":"Neliön ABCD sivu on 7 cm. Neliön sisään piirretään kaksi neljännesympyrän kaarta: toisen keskipiste on A ja toisen C, ja kummankin säde on 7 cm. Kaaret kulkevat pisteestä B pisteeseen D, ja niiden väliin jää lehden muotoinen alue. Laske lehden pinta-ala neliösenttimetrin tarkkuudella. Anna vastaus neliösenttimetreinä ilman yksikköä.","vastaus":28,"vinkki":"Lävistäjä BD jakaa lehden kahdeksi 90°:n segmentiksi.","selitys":"Yksi segmentti on π · 7² : 4 cm² − 7 cm · 7 cm : 2 ≈ 38,48 cm² − 24,5 cm² ≈ 13,98 cm². Lehti on kaksi segmenttiä, noin 28 cm²."},{"id":"H19","ryhma":"segmentti","kysymys":"Kuvio koostuu neliöstä, jonka sivu on 12 cm, ja neliön yhden sivun päälle liitetystä puoliympyrästä, jonka halkaisija on tämä sivu. Neljä oppilasta laski kuvion pinta-alan ja sai tulokset 200,5 cm², 257,1 cm², 144,0 cm² ja 370,2 cm².\n\nMontako tuloksista voit hylätä heti vertaamalla niitä kuvion ympäri piirretyn suorakulmion pinta-alaan?","vastaus":2,"vinkki":"Ympäröivän suorakulmion sivut ovat 12 cm ja 12 cm + 6 cm.","selitys":"Ympäröivän suorakulmion ala on 12 cm · 18 cm = 216 cm². Tulokset 257,1 cm² ja 370,2 cm² ovat suurempia, joten ne voi hylätä. Myös 144,0 cm² on väärin (puoliympyrä unohtunut), mutta sitä vertailu ei paljasta, koska se on alle 216 cm². Oikea ala on 144 cm² + 18π cm² ≈ 200,5 cm²."},{"id":"H20","ryhma":"segmentti","kysymys":"Kuvio on suorakulmio, jonka sivut ovat 40 m ja 20 m, ja sen kummankin 20 m:n sivun päälle on liitetty puoliympyrä. Saaga laski kuvion alaksi 40 m · 20 m + π · (20 m)² ≈ 2 057 m². Ympäröivän suorakulmion ala on 60 m · 20 m = 1 200 m², joten tulos on liian suuri.\n\nLaske kuvion oikea pinta-ala neliömetrin tarkkuudella. Anna vastaus neliömetreinä ilman yksikköä.","vastaus":1114,"vinkki":"Kaksi puoliympyrää ovat yhdessä ympyrä. Mikä on sen säde?","selitys":"Puoliympyrät muodostavat ympyrän, jonka halkaisija on 20 m ja säde 10 m. Ala on 800 m² + π · (10 m)² ≈ 1 114 m², mikä on alle 1 200 m²."}],"valmis_teksti":"Osaat laskea monikulmioista ja ympyrän osista koostuvan kuvion piirin ja pinta-alan jakamalla kuvion osiin tai vähentämällä osan kokonaisuudesta. Lasket ympyrärenkaan ja segmentin alan, merkitset jaon mallikuvioon, lasket piiriin vain kuvion ulkoreunan ja tarkistat tuloksen suuruusluokan vertaamalla ympäröivään suorakulmioon. Tämä taito on nyt näytetty."};

const esc = s => s;
const osat = D.teksti.map(o=>{
  switch(o.tyyppi){
    case "johdanto":
      return `<p class="lead">${esc(o.sisalto)}</p>`;
    case "kappale":
      return `<h2>${esc(o.otsikko)}</h2><p>${esc(o.sisalto)}</p>`;
    case "saanto":
      return `<div class="box"><h3>${esc(o.otsikko)}</h3><ol class="steps">${
        o.askeleet.map(a=>`<li><span>${esc(a)}</span></li>`).join("")}</ol></div>`;
    case "taulukko":
      return `<div class="box"><h3>${esc(o.otsikko)}</h3><div class="tablewrap"><table><thead><tr>${
        o.otsikkorivi.map(h=>`<th>${h}</th>`).join("")}</tr></thead><tbody>${
        o.rivit.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join("")}</tr>`).join("")}</tbody></table></div></div>`;
    case "ansa":
      return `<div class="box warn"><h3>${esc(o.otsikko)}</h3><p style="margin:0">${esc(o.sisalto)}</p></div>`;
    case "muistilappu":
      return `<div class="box note"><h3>${esc(o.otsikko)}</h3><ul class="notes">${
        o.kohdat.map(k=>`<li>${esc(k)}</li>`).join("")}</ul></div>`;
    case "numerotaulu":
      return `<div class="box nt"><h3>${esc(o.otsikko)}</h3><p class="ohje">${esc(o.sisalto)}</p>
        <div class="nt-valinta" id="ntValinta"></div>
        <div class="nt-taulu" id="ntTaulu"></div>
        <p class="nt-selite" id="ntSelite"></p></div>`;

const svg=document.getElementById("nlsvg"), rng=document.getElementById("nlrange"), out=document.getElementById("nlout");
const X0=34, X1=606, Y=62;
function piirraNL(v){
  const ala=Math.floor(v/10)*10, yla=ala+10, puoli=ala+5;
  const pyor = (v%10)>=5 ? yla : ala;
  const x = n => X0 + (n/100)*(X1-X0);
  let s=`<line class="rail" x1="${X0}" y1="${Y}" x2="${X1}" y2="${Y}"/>`;
  for(let n=0;n<=100;n+=10){
    const near = (n===ala||n===yla);
    s+=`<line class="tick" x1="${x(n)}" y1="${Y-7}" x2="${x(n)}" y2="${Y+7}"/>`;
    s+=`<text class="stop${near?" near":""}" x="${x(n)}" y="${Y+24}" text-anchor="middle">${n}</text>`;
  }
  s+=`<line class="halfway" x1="${x(puoli)}" y1="${Y-16}" x2="${x(puoli)}" y2="${Y+12}"/>`;
  s+=`<text class="stop" x="${x(puoli)}" y="${Y-22}" text-anchor="middle">puoliväli ${puoli}</text>`;
  s+=`<circle class="dot" cx="${x(v)}" cy="${Y}" r="6"/>`;
  s+=`<text class="val" x="${x(v)}" y="${Y-32}" text-anchor="middle">${v}</text>`;
  s+=`<path d="M ${x(v)} ${Y+38} L ${x(pyor)} ${Y+38}" stroke="var(--core)" stroke-width="2" fill="none"/>`;
  s+=`<path d="M ${x(pyor)} ${Y+38} l ${x(pyor)>x(v)?-7:7} -4 l 0 8 z" fill="var(--core)"/>`;
  svg.innerHTML=s;
  out.textContent = `${v} pyöristyy → ${pyor}`;
}

/* ---------- laskujärjestys-widget ---------- */
const ljExp=document.getElementById("ljExp");
if(ljExp && D.kokeilu){
  let ljI=0, ljTokens=[], ljStep=0;
  const laske=(a,op,b)=>{a=+a;b=+b;return op==="×"?a*b:op==="÷"?a/b:op==="+"?a+b:a-b;};
  function ljAlku(){
    const l=D.kokeilu[ljI];
    ljTokens=l.lauseke.replace(/\(/g,"( ").replace(/\)/g," )").split(/\s+/).filter(Boolean);
    ljStep=0; ljPiirra(); ljViesti("","");
  }
  function ljViesti(t,lk){const f=document.getElementById("ljFb"); f.textContent=t; f.className="lj-fb "+(lk||"");}
  function ljPiirra(){
    const l=D.kokeilu[ljI];
    document.getElementById("ljStep").textContent =
      ljStep>=l.askeleet.length ? "valmis" : `askel ${ljStep+1} / ${l.askeleet.length}`;
    if(ljStep>=l.askeleet.length){
      ljExp.innerHTML=`<span class="valmis">${l.lauseke} = ${l.vastaus}</span>`;
      return;
    }
    ljExp.innerHTML=ljTokens.map((t,i)=>
      "×÷+−".includes(t) ? `<button type="button" class="op" data-i="${i}">${t}</button>`
                         : `<span class="tok">${t}</span>`).join("");
    ljExp.querySelectorAll("button.op").forEach(b=>b.addEventListener("click",()=>ljKlikkaa(+b.dataset.i)));
  }
  function ljKlikkaa(i){
    const l=D.kokeilu[ljI], odotettu=l.askeleet[ljStep];
    const ehdotus=[ljTokens[i-1],ljTokens[i],ljTokens[i+1]].join(" ");
    if(ehdotus!==odotettu){
      ljViesti(ljStep===0
        ? "Ei vielä. Sulkeet ovat vahvimmat, sitten kerto ja jako. Yhtä vahvat vasemmalta oikealle."
        : "Ei vielä. Kumpi jäljellä olevista on vahvempi?", "no");
      return;
    }
    const arvo=laske(ljTokens[i-1],ljTokens[i],ljTokens[i+1]);
    let alku=i-1, loppu=i+1;
    if(ljTokens[i-2]==="(" && ljTokens[i+2]===")"){ alku=i-2; loppu=i+2; }
    ljTokens.splice(alku, loppu-alku+1, String(arvo));
    ljStep++;
    ljViesti(ljStep>=l.askeleet.length ? "Valmis. Vastaus on "+l.vastaus+"." : "Oikein. Jatka seuraavaan.", "ok");
    ljPiirra();
  }
  document.getElementById("ljSeuraava").addEventListener("click",()=>{
    ljI=(ljI+1)%D.kokeilu.length; ljAlku();
  });
  ljAlku();
}

/* Suomalainen lukumuoto: välilyönti on tuhaterotin, pilkku desimaalierotin.
   Piste voi olla kumpi tahansa. Se tulkitaan tuhaterottimeksi VAIN silloin, kun
   koko luku on aitoa tuhaterotinmuotoa: alkuosa 1–3 numeroa ilman etunollaa ja
   jokainen jatko-osa täsmälleen 3 numeroa (1.500, 12.345.678). Kaikissa muissa
   tapauksissa piste on desimaalipiste — myös 0.125, joka vanhalla säännöllä
   ("3 numeroa pisteen jäljessä = tuhaterotin") luettiin virheellisesti luvuksi 125. */
const TUHATEROTIN = /^[1-9]\d{0,2}(\.\d{3})+$/;
function lueLuku(teksti){
  // Murtoluku (3/4, -3/4) ja sekaluku (1 2/3, -1 2/3) hyväksytään sellaisinaan.
  const raaka = String(teksti).replace(/\u00a0/g, " ").trim();
  let m = raaka.match(/^(-?)(\d+)\s+(\d+)\s*\/\s*(\d+)$/);
  if(m){ const nim = Number(m[4]); if(nim === 0) return null;
    const v = Number(m[2]) + Number(m[3]) / nim; return m[1] ? -v : v; }
  m = raaka.match(/^(-?)\s*(\d+)\s*\/\s*(\d+)$/);
  if(m){ const nim = Number(m[3]); if(nim === 0) return null;
    const v = Number(m[2]) / nim; return m[1] ? -v : v; }
  let s = String(teksti).replace(/[\s\u00a0]/g, "");
  if(s === "") return null;
  if(s.indexOf(",") >= 0){
    s = s.replace(/\./g, "").replace(",", ".");
  } else if(TUHATEROTIN.test(s)){
    s = s.replace(/\./g, "");
  }
  const n = Number(s);
  return Number.isFinite(n) ? n : null;
}

function tarkista(id){
  const h=D.harjoitukset.find(x=>x.id===id);
  const kentta=document.getElementById("in-"+id);
  const fb=document.getElementById("fb-"+id);
  if(kentta.value.trim()===""){ fb.className="fb hint"; fb.textContent="Kirjoita vastaus ensin."; return; }
  const luku=lueLuku(kentta.value);
  if(luku===null){ fb.className="fb no"; fb.textContent="Vastauksen pitää olla luku tai murtoluku (esimerkiksi 3/4)."; return; }
  const oikein = Math.abs(luku - h.vastaus) < 1e-9;
  merkitseTulos(id, oikein, oikein ? "Oikein. "+h.selitys : `Ei vielä. ${h.vinkki} Kokeile uudelleen.`);
}

function tarkistaMonivalinta(id, valittuIndeksi, painike){
  const h=D.harjoitukset.find(x=>x.id===id);
  const rivi=painike.closest(".row");
  rivi.querySelectorAll(".mv-valinta").forEach(b=>b.disabled=true);
  const oikein = valittuIndeksi===h.vastaus;
  painike.classList.add(oikein?"mv-oikein":"mv-vaarin");
  if(!oikein){
    const oikeaBtn=rivi.querySelector(`[data-i="${h.vastaus}"]`);
    if(oikeaBtn) oikeaBtn.classList.add("mv-oikein");
  }
  merkitseTulos(id, oikein, oikein ? "Oikein. "+h.selitys : `Ei ihan. Oikea vastaus on korostettu. ${h.selitys||""}`);
}

/* Kuuntelu: selain lukee tekstin ääneen omalla puhesynteesillään (englanniksi, jos laitteessa on
   englanninkielinen ääni). Ei äänitiedostoja eikä verkkoyhteyttä. Jos laite ei osaa puhua,
   teksti näytetään luettavaksi — silloin tehtävä muuttuu luetun ymmärtämiseksi, mutta ei katkea. */
function puhu(id, nopeus){
  const h=D.harjoitukset.find(x=>x.id===id); if(!h || !h.kuuntele) return;
  const vara=document.getElementById("vara-"+id);
  const naytaTeksti=syy=>{ vara.hidden=false; vara.textContent=syy+" Teksti: "+h.kuuntele; };
  if(!("speechSynthesis" in window)){ naytaTeksti("Tämä laite ei osaa lukea ääneen."); return; }
  const s=window.speechSynthesis; s.cancel();
  const u=new SpeechSynthesisUtterance(h.kuuntele);
  u.lang=h.kieli||"en-GB"; u.rate=nopeus;
  const aanet=s.getVoices(), kieli=u.lang.slice(0,2);
  const aani=aanet.find(a=>a.lang===u.lang) || aanet.find(a=>a.lang && a.lang.startsWith(kieli));
  if(aani) u.voice=aani;
  else if(aanet.length) { naytaTeksti("Laitteessa ei ole englanninkielistä ääntä."); return; }
  u.onerror=()=>naytaTeksti("Ääneen lukeminen ei onnistunut.");
  s.speak(u);
}
