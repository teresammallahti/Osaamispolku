<title>Kierrä ja siirrä</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">

<style>
:root{
  --paper:#EFF2F5; --surface:#FFFFFF; --surface-2:#F7F9FB;
  --grid:#DCE3EA; --line:#C9D3DC;
  --ink:#15222C; --ink-2:#4E626F; --ink-3:#7E8F9B;
  --core:#1B5A9E; --core-soft:#E4EDF6;
  --strong:#1F6E5C; --strong-soft:#E1F0EB;
  --chal:#9A6A16; --chal-soft:#F6EDDC;
  --alert:#A33A2B; --alert-soft:#F8E7E3;
  --shadow:0 1px 2px rgba(21,34,44,.06), 0 8px 24px -12px rgba(21,34,44,.18);
  --r:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0F161B; --surface:#18222A; --surface-2:#1D2830;
    --grid:#22303A; --line:#2E3E4A;
    --ink:#E8EFF4; --ink-2:#A3B4C0; --ink-3:#7A8B97;
    --core:#7FB2E4; --core-soft:#16303F;
    --strong:#77CDB4; --strong-soft:#123028;
    --chal:#E0B267; --chal-soft:#33270F;
    --alert:#E8907F; --alert-soft:#3A1E19;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -14px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --paper:#0F161B; --surface:#18222A; --surface-2:#1D2830;
  --grid:#22303A; --line:#2E3E4A;
  --ink:#E8EFF4; --ink-2:#A3B4C0; --ink-3:#7A8B97;
  --core:#7FB2E4; --core-soft:#16303F;
  --strong:#77CDB4; --strong-soft:#123028;
  --chal:#E0B267; --chal-soft:#33270F;
  --alert:#E8907F; --alert-soft:#3A1E19;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -14px rgba(0,0,0,.7);
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:16px; line-height:1.62;
  background-image:
    linear-gradient(to right, var(--grid) 1px, transparent 1px),
    linear-gradient(to bottom, var(--grid) 1px, transparent 1px);
  background-size:26px 26px;
}
.wrap{max-width:760px; margin:0 auto; padding:28px 20px 90px}
h1,h2,h3,h4{font-family:"Familjen Grotesk","IBM Plex Sans",system-ui,sans-serif; text-wrap:balance}

/* header */
header.top{background:var(--surface); border:1px solid var(--line); border-radius:var(--r);
  box-shadow:var(--shadow); padding:22px 24px; display:flex; gap:18px; align-items:flex-start}
.badge{flex:0 0 auto; width:54px; height:54px; border-radius:9px; display:grid; place-items:center;
  background:var(--core-soft); border:1px solid var(--core); color:var(--core)}
.badge svg{width:28px; height:28px; fill:none; stroke:currentColor; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round}
.eyebrow{font-family:"IBM Plex Mono",monospace; font-size:11px; letter-spacing:.14em;
  text-transform:uppercase; color:var(--ink-3); margin:0 0 5px}
header.top h1{margin:0; font-size:30px; font-weight:700; letter-spacing:-.015em}
header.top p{margin:5px 0 0; color:var(--ink-2); font-size:15px}
.tags{display:flex; flex-wrap:wrap; gap:5px; margin-top:11px}
.tag{font-family:"IBM Plex Mono",monospace; font-size:10.5px; letter-spacing:.05em; padding:2px 7px;
  border-radius:4px; background:var(--surface-2); border:1px solid var(--line); color:var(--ink-3)}
.tag.core{background:var(--core-soft); border-color:var(--core); color:var(--core)}

/* teksti */
article{margin-top:26px}
article h2{font-size:21px; font-weight:600; margin:32px 0 10px; letter-spacing:-.01em}
article p{margin:0 0 14px; max-width:64ch}
.lead{font-size:17.5px; color:var(--ink); border-left:3px solid var(--core); padding-left:16px; margin:0 0 8px}

.box{background:var(--surface); border:1px solid var(--line); border-radius:var(--r);
  padding:18px 22px; box-shadow:var(--shadow); margin:22px 0}
.box h3{margin:0 0 12px; font-size:16.5px; font-weight:600}
.box.warn{border-left:3px solid var(--alert)}
.box.note{border-left:3px solid var(--chal)}

ol.steps{margin:0; padding-left:0; list-style:none; counter-reset:s; display:grid; gap:12px}
ol.steps li{counter-increment:s; display:grid; grid-template-columns:auto 1fr; gap:13px; align-items:start}
ol.steps li::before{content:counter(s); font-family:"Familjen Grotesk",sans-serif; font-weight:700; font-size:14px;
  width:26px; height:26px; border-radius:50%; background:var(--core); color:#fff; display:grid; place-items:center; margin-top:2px}

ul.notes{margin:0; padding-left:19px}
ul.notes li{margin-bottom:7px}
ul.notes li:last-child{margin-bottom:0}

.tablewrap{overflow-x:auto}
table{border-collapse:collapse; width:100%; font-size:14.5px; min-width:460px}
th,td{text-align:left; padding:9px 13px; border-bottom:1px solid var(--line)}
th{font-family:"IBM Plex Mono",monospace; font-size:10.5px; letter-spacing:.1em; text-transform:uppercase;
  color:var(--ink-3); font-weight:400; background:var(--surface-2)}
tr:last-child td{border-bottom:0}
td b{color:var(--core); font-weight:600}
td:last-child{font-variant-numeric:tabular-nums; font-weight:600}

/* lukusuora */
.nl svg{width:100%; height:118px; display:block}
.nl .rail{stroke:var(--line); stroke-width:2}
.nl .tick{stroke:var(--line); stroke-width:1.5}
.nl .stop{fill:var(--ink-3); font-family:"IBM Plex Mono",monospace; font-size:11px}
.nl .stop.near{fill:var(--core); font-weight:600}
.nl .dot{fill:var(--chal)}
.nl .val{fill:var(--ink); font-family:"Familjen Grotesk",sans-serif; font-size:15px; font-weight:700}
.nl .halfway{stroke:var(--chal); stroke-dasharray:3 3; stroke-width:1.5}
.nl-controls{display:flex; align-items:center; gap:14px; margin-top:6px}
.nl-controls input{flex:1; accent-color:var(--core)}
.nl-out{font-family:"Familjen Grotesk",sans-serif; font-size:15px; font-weight:600; min-width:12.5em; text-align:right}

/* paikka-arvotaulu */
.box .ohje{margin:0 0 14px; font-size:14.5px; color:var(--ink-2)}
.nt-valinta{display:flex; flex-wrap:wrap; gap:7px; margin-bottom:16px}
.nt-valinta button{font:inherit; font-size:12.5px; font-family:"IBM Plex Mono",monospace; padding:5px 11px;
  border-radius:6px; border:1px solid var(--line); background:var(--surface-2); color:var(--ink-2); cursor:pointer}
.nt-valinta button[aria-pressed="true"]{background:var(--ink); color:var(--paper); border-color:var(--ink)}
.nt-valinta button:focus-visible{outline:2px solid var(--core); outline-offset:2px}
.nt-taulu{display:flex; flex-direction:column; gap:4px; align-items:flex-start; overflow-x:auto; padding-bottom:4px}
.nt-rivi{display:flex; gap:6px; align-items:center}
.nt-rivi .otsa{font-family:"IBM Plex Mono",monospace; font-size:9.5px; letter-spacing:.08em;
  text-transform:uppercase; color:var(--ink-3); width:52px; text-align:center}
.nt-ruutu{width:52px; height:52px; display:grid; place-items:center; border:1.5px solid var(--line);
  border-radius:7px; background:var(--surface-2); font-family:"IBM Plex Mono",monospace; font-size:24px}
.nt-ruutu.kohta{border-color:var(--core); background:var(--core-soft); color:var(--core); font-weight:500}
.nt-ruutu.ratkaiseva{border-color:var(--chal); background:var(--chal-soft); color:var(--chal); font-weight:500}
.nt-ruutu.nolla{color:var(--ink-3)}
.nt-rivi .nimi{font-size:12.5px; color:var(--ink-3); margin-left:12px; white-space:nowrap}
.nt-nuoli{font-size:17px; color:var(--chal); margin-left:6px}
.nt-selite{margin:14px 0 0; font-size:14.5px}
.nt-selite b{color:var(--core)}

/* vahvuusportaat */
.vp-tasot{display:grid; gap:9px; margin-bottom:18px}
.vp-taso{display:flex; gap:11px; align-items:flex-start; font-size:13.5px}
.vp-taso .vp-pallo{width:13px; height:13px; border-radius:4px; margin-top:5px; flex:0 0 auto}
.vp-taso[data-taso="sulkeet"] .vp-pallo{background:var(--core)}
.vp-taso[data-taso="kertojako"] .vp-pallo{background:var(--strong)}
.vp-taso[data-taso="yhteenvahennys"] .vp-pallo{background:var(--chal)}
.vp-taso strong{display:block; font-family:"Familjen Grotesk",sans-serif; font-weight:600; font-size:14.5px}
.vp-taso span{color:var(--ink-2)}
.vp-lauseke{display:flex; flex-wrap:wrap; gap:7px; align-items:flex-end; font-family:"IBM Plex Mono",monospace;
  font-size:25px; padding:10px 2px; min-height:64px}
.vp-lauseke .t{padding:2px 3px}
.vp-lauseke .op{position:relative; padding:2px 9px; border-radius:6px; font-weight:500}
.vp-lauseke .op[data-taso="sulkeet"]{background:var(--core-soft); color:var(--core)}
.vp-lauseke .op[data-taso="kertojako"]{background:var(--strong-soft); color:var(--strong)}
.vp-lauseke .op[data-taso="yhteenvahennys"]{background:var(--chal-soft); color:var(--chal)}
.vp-lauseke .op i{position:absolute; top:-9px; right:-6px; font-style:normal; font-family:"Familjen Grotesk",sans-serif;
  font-size:11px; font-weight:700; width:18px; height:18px; border-radius:50%; display:grid; place-items:center;
  background:currentColor}
.vp-lauseke .op i span{color:var(--surface)}
.vp-rivi{display:flex; align-items:center; gap:16px; margin-top:8px}
.vp-vastaus{font-family:"Familjen Grotesk",sans-serif; font-size:16px; font-weight:600; color:var(--strong)}

/* laskujärjestys-widget */
.lj-exp{display:flex; flex-wrap:wrap; gap:7px; align-items:center; font-family:"IBM Plex Mono",monospace;
  font-size:23px; padding:14px 4px; min-height:62px}
.lj-exp .tok{padding:2px 4px; color:var(--ink)}
.lj-exp button.op{font-family:"IBM Plex Mono",monospace; font-size:23px; padding:3px 12px; border-radius:7px;
  border:1.5px solid var(--line); background:var(--surface-2); color:var(--ink); line-height:1.2}
.lj-exp button.op:hover{border-color:var(--core); color:var(--core)}
.lj-exp button.op:focus-visible{outline:2px solid var(--core); outline-offset:2px}
.lj-exp .valmis{font-family:"Familjen Grotesk",sans-serif; font-size:23px; font-weight:700; color:var(--strong)}
.lj-fb{font-size:14.5px; min-height:1.5em; color:var(--ink-2)}
.lj-fb.no{color:var(--alert)}
.lj-fb.ok{color:var(--strong)}
.lj-row{display:flex; align-items:center; gap:14px; margin-top:10px}
.lj-step{font-family:"IBM Plex Mono",monospace; font-size:11.5px; letter-spacing:.1em;
  text-transform:uppercase; color:var(--ink-3)}

/* harjoitukset */
.progress{position:sticky; top:0; z-index:5; background:var(--surface); border:1px solid var(--line);
  border-radius:var(--r); padding:12px 18px; box-shadow:var(--shadow); display:flex; align-items:center;
  gap:14px; margin:34px 0 18px}
.progress .lbl{font-family:"IBM Plex Mono",monospace; font-size:11px; letter-spacing:.12em;
  text-transform:uppercase; color:var(--ink-3); white-space:nowrap}
.progress .meter{flex:1; height:7px; border-radius:4px; background:var(--surface-2); border:1px solid var(--line); overflow:hidden}
.progress .meter i{display:block; height:100%; background:var(--core); transition:width .25s ease}
.progress .cnt{font-family:"Familjen Grotesk",sans-serif; font-weight:700; font-variant-numeric:tabular-nums; white-space:nowrap}

.grp{margin-top:26px}
.grp-head{display:flex; align-items:baseline; gap:10px; border-bottom:1.5px solid var(--ink); padding-bottom:7px; margin-bottom:14px}
.grp-head h3{margin:0; font-size:17px; font-weight:600}
.grp-head span{font-size:12.5px; color:var(--ink-2)}

.ex{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:14px 16px; margin-bottom:10px}
.ex[data-tila="oikein"]{border-color:var(--strong); box-shadow:inset 3px 0 0 var(--strong)}
.ex[data-tila="vaarin"]{border-color:var(--alert); box-shadow:inset 3px 0 0 var(--alert)}
.ex .q{display:flex; gap:11px; align-items:baseline; flex-wrap:wrap}
.ex .num{font-family:"IBM Plex Mono",monospace; font-size:11.5px; color:var(--ink-3); min-width:2.4em}
.ex .txt{flex:1; min-width:190px; font-size:15.5px}
.ex .txt .aineisto{display:block; margin-bottom:9px; padding-left:12px;
  border-left:2px solid var(--line); color:var(--ink-2); line-height:1.6;
  /* Aineisto voi olla pieni taulukko, jonka rivit on erotettu rivinvaihdoilla.
     Ilman pre-lineä ne valuisivat yhdeksi kappaleeksi ja taulukko katoaisi. */
  white-space:pre-line}
.ex .txt .kysymysrivi{display:block; font-weight:600}
.ex .row{display:flex; gap:8px; align-items:center; margin-top:11px; flex-wrap:wrap}
.ex input[type=text]{font:inherit; font-family:"IBM Plex Mono",monospace; font-size:15px; width:8.5em;
  padding:7px 11px; border:1px solid var(--line); border-radius:7px; background:var(--surface-2);
  color:var(--ink); text-align:right}
.ex input:focus-visible{outline:2px solid var(--core); outline-offset:1px}
button{font:inherit; cursor:pointer}
.btn{font-size:13.5px; padding:7px 15px; border-radius:7px; border:1px solid var(--core);
  background:var(--core); color:#fff}
.btn.ghost{background:transparent; color:var(--ink-2); border-color:var(--line)}
.btn:focus-visible{outline:2px solid var(--core); outline-offset:2px}
.btn.mv-valinta{text-align:left}
/* kuuntelutehtävä: selaimen puhesynteesi lukee englanninkielisen tekstin */
.kuuntele{display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin:2px 0 10px}
.kuuntele .btn{display:inline-flex; gap:7px; align-items:center}
.kuuntele svg{width:16px; height:16px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round}
.kuuntele .varateksti{flex-basis:100%; font-size:14px; color:var(--ink-2); background:var(--surface-2);
  border-radius:7px; padding:8px 12px; margin:0}
.btn.mv-valinta:disabled{cursor:default; opacity:.65}
.btn.mv-oikein{background:var(--strong-soft); border-color:var(--strong); color:var(--strong); opacity:1}
.btn.mv-vaarin{background:var(--alert-soft); border-color:var(--alert); color:var(--alert); opacity:1}
.row.mv{gap:8px 10px}
.fb{margin-top:11px; font-size:14.5px; padding:10px 13px; border-radius:8px; line-height:1.5}
.fb.ok{background:var(--strong-soft); color:var(--strong)}
.fb.no{background:var(--alert-soft); color:var(--alert)}
.fb.hint{background:var(--chal-soft); color:var(--chal)}

.done{background:var(--strong-soft); border:1px solid var(--strong); color:var(--strong);
  border-radius:var(--r); padding:16px 20px; margin-top:20px; font-size:15.5px}
.done h3{margin:0 0 4px; font-size:17px; color:var(--strong)}

details.teacher{margin-top:34px; background:var(--surface); border:1px solid var(--line);
  border-left:3px solid var(--chal); border-radius:var(--r); padding:15px 20px; box-shadow:var(--shadow)}
details.teacher summary{cursor:pointer; font-family:"Familjen Grotesk",sans-serif; font-weight:600; font-size:15px}
details.teacher summary:focus-visible{outline:2px solid var(--core); outline-offset:3px}
details.teacher ul{margin:12px 0 0; padding-left:19px; color:var(--ink-2); font-size:14.5px}
details.teacher li{margin-bottom:8px}
details.teacher p{margin:12px 0 0; color:var(--ink-2); font-size:14.5px}

.back{display:inline-block; margin-top:30px; font-size:13.5px; color:var(--ink-2)}
.back a{color:var(--core)}

@media (prefers-reduced-motion: reduce){*{transition:none !important}}
@media (max-width:560px){
  .wrap{padding:16px 13px 70px}
  header.top h1{font-size:25px}
  .progress{flex-wrap:wrap}
}
</style>

<div class="wrap">

  <header class="top">
    <span class="badge"><svg viewBox="0 0 24 24" aria-hidden="true" id="ikoni"></svg></span>
    <div>
      <p class="eyebrow" id="eyebrow"></p>
      <h1 id="otsikko"></h1>
      <p id="kuvaus"></p>
      <div class="tags" id="tags"></div>
    </div>
  </header>

  <article id="teksti"></article>

  <div class="progress" aria-live="polite">
    <span class="lbl">Harjoitukset</span>
    <span class="meter"><i id="pbar" style="width:0%"></i></span>
    <span class="cnt" id="pcnt">0 / 20</span>
  </div>

  <div id="harjoitukset"></div>
  <div id="valmis"></div>

  <p class="back" id="back"></p>

</div>

<script>
const D = {"tavoite_id":"MAT8-GEO-11","oppiaine":"MAT","vuosiluokka":8,"taso":"vahvistava","otsikko":"Kierrä ja siirrä","kuvaus":"Osaan kiertää ja siirtää kuvion tasossa ja tunnistaa, mikä yhtenevyyskuvaus muuttaa kuvion toiseksi.","versio":"0.2","paivitetty":"2026-10-11","ops":{"T":["T16"],"S":["S5"]},"ikoni":"neula","eyebrow":"Matematiikka · 8. luokka · Geometria","teksti":[{"tyyppi":"johdanto","sisalto":"Putoavien palikoiden pelissä palikkaa voi liikuttaa sivulle ja alas ja kääntää neljänneskierroksen kerrallaan, mutta sitä ei voi kääntää nurin. Siksi S:n ja Z:n muotoiset palikat pysyvät eri palikoina: kumpikaan ei muutu toiseksi, vaikka sitä kääntäisi kuinka monta kertaa. Peli tekee kahta yhtenevyyskuvausta, siirtoa ja kiertoa. Tietokone ei piirrä palikkaa uudelleen silmämääräisesti, vaan laskee jokaisen ruudun uudet koordinaatit. Tässä taidossa opit tekemään saman: siirrät ja käännät kuvion koordinaatistossa, lasket kuvapisteiden koordinaatit, määrität kuvion kiertosymmetriat ja päättelet, mikä kuvaus vie kuvion toiseen asentoon."},{"tyyppi":"kappale","otsikko":"Siirto suuntajanan verran","sisalto":"Siirto, kierto ja peilaus ovat yhtenevyyskuvauksia: ne muuttavat kuvion paikkaa tai asentoa mutta eivät sen kokoa eivätkä muotoa. Sivujen pituudet, kulmat ja pinta-ala pysyvät samoina, joten kuva on yhtenevä alkuperäisen kanssa. Peilaus kääntää kuvion nurin, siirto ja kierto eivät. Kun pitää päätellä, mikä kuvaus vie kuvion toiseen asentoon, vertaa kärkien koordinaatteja tämän osion lopun taulukon sääntöihin ja tarkista, että sama sääntö pätee jokaiseen kärkeen. Siirrossa kuvion jokainen piste liikkuu yhtä paljon samaan suuntaan. Siirron kertoo suuntajana: nuoli, jolla on suunta ja pituus. Kun suuntajana on a yksikköä oikealle ja b yksikköä ylös, piste (x, y) kuvautuu pisteeksi (x + a, y + b). Vasemmalle ja alas siirrettäessä a tai b on negatiivinen. Esimerkiksi siirrossa 6 yksikköä oikealle ja 2 yksikköä alas piste (−3, 1) kuvautuu pisteeksi (−3 + 6, 1 − 2) = (3, −1). Jos suuntajana vie pisteen P(2, 5) pisteeseen Q(−1, 7), siirtymä saadaan vähentämällä loppupisteen koordinaateista alkupisteen koordinaatit: x-suunnassa −1 − 2 = −3 ja y-suunnassa 7 − 5 = 2, eli 3 vasemmalle ja 2 ylös. Silloin piste (4, −2) kuvautuu pisteeksi (1, 0). Siirrossa kuvio ei käänny lainkaan, joten jokainen sivu pysyy alkuperäisen sivun suuntaisena."},{"tyyppi":"ansa","otsikko":"Ansa 1: suuntajana väärin päin","sisalto":"Siirrossa piste A(1, 4) kuvautuu pisteeksi A′(6, 2), ja kysytään pisteen B(−2, 3) kuvapistettä. Jos siirtymä lasketaan väärin päin eli alkupisteestä vähennetään loppupiste, saadaan 1 − 6 = −5 ja 4 − 2 = 2, ja B siirtyy väärään suuntaan pisteeksi (−7, 5). Siirtymä on aina loppupiste miinus alkupiste: 6 − 1 = 5 ja 2 − 4 = −2, eli 5 oikealle ja 2 alas. Oikea kuvapiste on B′(3, 1). Tarkista suunnalla: A siirtyi oikealle ja alas, joten B:nkin pitää siirtyä oikealle ja alas. Väärä piste (−7, 5) on B:stä vasemmalla ja ylempänä."},{"tyyppi":"kappale","otsikko":"Kierto: keskus, kulma ja suunta","sisalto":"Kierrossa kuvio käännetään kiertokeskuksen ympäri kiertokulman verran. Jokainen piste pysyy yhtä kaukana kiertokeskuksesta ja kääntyy saman kulman. Kierto ilmoitetaan kolmella tiedolla: keskus, kulma ja suunta. Vain 180°:n kierrossa suuntaa ei tarvita, koska myötä- ja vastapäivään päädytään samaan pisteeseen. Suunta on vastapäivään tai myötäpäivään, ja matematiikassa vastapäivään on positiivinen kiertosuunta. Kierto 270° vastapäivään päätyy samaan kuin kierto 90° myötäpäivään. Kun 270° vastapäivään jatketaan vielä 90° vastapäivään, tulee täysi kierros ja piste palaa alkuun. Kierto 270° vastapäivään jää siis 90° vajaaksi täydestä kierroksesta, ja se on sama kuin kääntyä alkuasennosta 90° takaisin eli myötäpäivään. Kierto 180° origon ympäri vie pisteen origon toiselle puolelle yhtä kauas: (x, y) kuvautuu pisteeksi (−x, −y), esimerkiksi (−6, 2) pisteeksi (6, −2). Tämä on sama kuin peilaus origon suhteen. 90°:n kierron säännön näet ruutupaperilla kääntämällä suorakulmaista kolmiota. Piste P(5, 2) on origosta 5 oikealle ja 2 ylös, joten kolmion kärjet ovat O(0, 0), R(5, 0) ja P(5, 2). Kolmiota kierretään 90° vastapäivään origon ympäri. Kateetti OR, joka osoitti 5 ruutua oikealle, osoittaa nyt 5 ruutua ylös, joten R′ = (0, 5). Kateetti RP, joka osoitti 2 ruutua ylös, kääntyy samoin neljänneskierroksen ja osoittaa nyt 2 ruutua vasemmalle. Siksi P′ = (−2, 5). Sama päättely toimii jokaiselle pisteelle, myös negatiivisille koordinaateille: 90°:n kierrossa vastapäivään oikealle kääntyy ylös, ylös vasemmalle, vasemmalle alas ja alas oikealle. Koordinaateilla piste (x, y) kuvautuu pisteeksi (−y, x). Esimerkiksi piste (−3, −4) on 3 vasemmalle ja 4 alas, joten kuvapiste on 3 alas ja 4 oikealle eli (4, −3). Myötäpäivään käännökset menevät toisin päin, ja piste (x, y) kuvautuu pisteeksi (y, −x): P(5, 2) kuvautuu pisteeksi (2, −5). Kun kuvauksia tehdään kaksi peräkkäin, tee ne annetussa järjestyksessä: kierto ensin ja sitten siirto antaa yleensä eri pisteen kuin siirto ensin ja sitten kierto."},{"tyyppi":"ansa","otsikko":"Ansa 2: kiertosuunta sekaisin","sisalto":"Piste (6, 1) kierretään origon ympäri 90° myötäpäivään. Jos käytät vastapäivään kierron sääntöä, saat (−1, 6), vaikka oikea kuvapiste on (1, −6). Kiertosuunnan näet siitä, mihin neljännekseen piste siirtyy. Piste (6, 1) on ensimmäisessä neljänneksessä. Kierto 90° vastapäivään vie sen toiseen neljännekseen ja kierto 90° myötäpäivään neljänteen. Piste (1, −6) on neljännessä neljänneksessä, joten suunta on oikein. Neljännestarkistus toimii, kun piste ei ole akselilla. Kun kiertokeskus on muu piste kuin origo, katso neljännekset keskuksen kautta kulkevien vaaka- ja pystysuoran suoran suhteen."},{"tyyppi":"ansa","otsikko":"Ansa 3: koordinaatit eivät vain vaihda paikkaa","sisalto":"Piste (3, 6) kierretään origon ympäri 90° vastapäivään. Houkutteleva vastaus on (6, 3): luvut vaihtavat paikkaa, eikä muuta tehdä. Piste (6, 3) on kuitenkin yhä ensimmäisessä neljänneksessä, vaikka 90°:n kierto vastapäivään vie ensimmäisestä neljänneksestä toiseen. Pelkkä paikanvaihto ei ole kierto vaan peilaus vinon suoran suhteen, joka kulkee origon ja pisteen (1, 1) kautta, ja peilaus kääntäisi kuvion nurin. Oikea kuvapiste on (−6, 3). Tarkista 90°:n kierto kahdella asialla: luvut 3 ja 6 vaihtavat paikkaa etumerkkejä lukuun ottamatta, ja kuvapiste on oikeassa neljänneksessä. Kun piste ei ole akselilla ja molemmat ehdot täyttyvät, kuvapiste on oikea."},{"tyyppi":"saanto","otsikko":"Kierto muun pisteen kuin origon ympäri","askeleet":["Laske, kuinka paljon piste on kiertokeskuksesta oikealle ja ylös: vähennä pisteen koordinaateista keskuksen koordinaatit. Esimerkissä piste A(4, 3) kierretään 90° vastapäivään pisteen K(1, 1) ympäri. A on K:sta 3 oikealle ja 2 ylös.","Käännä tämä siirtymä samalla säännöllä kuin origon ympäri: 90° vastapäivään (a, b) → (−b, a), 90° myötäpäivään (a, b) → (b, −a) ja 180° (a, b) → (−a, −b). Esimerkissä 3 oikealle ja 2 ylös kääntyy muotoon 3 ylös ja 2 vasemmalle eli (−2, 3).","Lisää käännettyyn siirtymään keskuksen koordinaatit: A′ = (1 − 2, 1 + 3) = (−1, 4).","Tarkista: A′ on K:sta 2 vasemmalle ja 3 ylös, eli luvut ovat samat 3 ja 2 kuin A:lla, ja piste on kääntynyt K:n oikealta puolelta sen yläpuolelle, mikä on neljänneskierros vastapäivään.","Kuviota kierrettäessä tee sama jokaiselle kärjelle ja piirrä kuvakuvio. Sen sivut ovat yhtä pitkät kuin alkuperäisen, joten jos jokin sivu venyy tai lyhenee, jokin kärki on väärin."]},{"tyyppi":"ansa","otsikko":"Ansa 4: kiertokeskus ei ole origo","sisalto":"Piste (5, 2) kierretään 180° pisteen K(3, 4) ympäri. Jos kierrät origon ympäri, saat (−5, −2), mutta kierto tehdään K:n ympäri. Piste on K:sta 2 oikealle ja 2 alas, joten kuvapiste on K:sta 2 vasemmalle ja 2 ylös: (3 − 2, 4 + 2) = (1, 6). Tarkista peilauksen tavoin: 180°:n kierto on sama kuin peilaus pisteen K suhteen, joten K on pisteiden (5, 2) ja (1, 6) puolivälissä. Lue siksi aina ensin, minkä pisteen ympäri kierretään. Säännöt (−x, −y), (−y, x) ja (y, −x) pätevät sellaisinaan vain, kun keskus on origo."},{"tyyppi":"kappale","otsikko":"Kiertosymmetria","sisalto":"Kuvio on kiertosymmetrinen, jos jokin täyttä kierrosta pienempi kierto vie sen täsmälleen itsensä päälle. Säännöllinen kuusikulmio näyttää samalta, kun sitä kierretään keskipisteensä ympäri 60°, 120°, 180°, 240°, 300° tai 360°. Se osuu täyden kierroksen aikana itsensä päälle kuusi kertaa, kun täysi kierros lasketaan mukaan. Tätä lukua sanotaan kiertosymmetrian kertaluvuksi. Sama asia sanotaan myös niin, että kuusikulmion keskipiste on kuusinkertainen kiertokeskus. Kertaluku n ja pienin kiertokulma α liittyvät toisiinsa. Kun α vie kuvion itselleen, myös 2α, 3α ja niin edelleen vievät, eikä niiden väliin jää muita kiertokulmia, koska α on pienin. Täysi kierros on viimeinen niistä, joten n · α = 360° eli α = 360° : n. Säännöllisen n-kulmion kertaluku on n. Suorakulmio, joka ei ole neliö, osuu itsensä päälle vain kierroissa 180° ja 360°, joten sen kertaluku on 2. Jos mikään täyttä kierrosta pienempi kierto ei vie kuviota itselleen, kertaluku on 1, eikä kuvio ole kiertosymmetrinen. Ympyrä osuu itsensä päälle millä tahansa kiertokulmalla, joten sille ei ole kertalukua. Kiertosymmetria ja symmetria-akselit ovat eri asioita. Suunnikkaalla, joka ei ole suorakulmio eikä neljäkäs, ei ole yhtään symmetria-akselia, mutta 180°:n kierto keskipisteen ympäri vie sen itselleen, joten sen kertaluku on 2. Tasakylkisellä kolmiolla, joka ei ole tasasivuinen, on symmetria-akseli, mutta se ei ole kiertosymmetrinen."},{"tyyppi":"taulukko","otsikko":"Kuvaukset koordinaateissa","otsikkorivi":["Kuvaus","Piste (x, y) kuvautuu pisteeksi","Esimerkki: piste (5, −1)"],"rivit":[["Siirto a yksikköä oikealle ja b yksikköä ylös","(x + a, y + b)","2 oikealle ja 4 alas: (7, −5)"],["Peilaus x-akselin suhteen","(x, −y)","(5, 1)"],["Peilaus y-akselin suhteen","(−x, y)","(−5, −1)"],["Kierto 180° origon ympäri eli peilaus origon suhteen","(−x, −y)","(−5, 1)"],["Kierto 90° vastapäivään origon ympäri","(−y, x)","(1, 5)"],["Kierto 90° myötäpäivään eli 270° vastapäivään origon ympäri","(y, −x)","(−1, −5)"],["Peilaus ensin x-akselin ja sitten y-akselin suhteen","(−x, −y) eli sama kuin kierto 180° origon ympäri","(−5, 1)"],["Kaksi siirtoa peräkkäin","yksi siirto, jonka siirtymät ovat kahden siirron siirtymien summat","3 oikealle ja sitten 1 vasemmalle ja 2 ylös: sama kuin 2 oikealle ja 2 ylös, (7, 1)"],["Kaksi 90°:n kiertoa samaan suuntaan saman keskuksen ympäri","kierto 180° saman keskuksen ympäri","origon ympäri: (−5, 1)"]]}],"harjoitusryhmat":[{"id":"siirto","nimi":"Siirto suuntajanalla","info":"Siirrossa jokainen piste liikkuu yhtä paljon samaan suuntaan: (x, y) → (x + a, y + b). Siirtymä on loppupiste miinus alkupiste. Ei laskinta. Piirrä tarvittaessa ruutupaperille."},{"id":"kierto","nimi":"Kierto pisteen ympäri","info":"Lue ensin kiertokeskus, kulma ja suunta. Origon ympäri: 90° vastapäivään (x, y) → (−y, x), 90° myötäpäivään (x, y) → (y, −x), 180° (x, y) → (−x, −y). Muun keskuksen ympäri käännä siirtymä keskuksesta. Tarkista neljänneksestä. Ei laskinta."},{"id":"symmetria","nimi":"Kiertosymmetria ja kuvauksen tunnistaminen","info":"Kertaluku n kertoo, montako kertaa kuvio osuu itsensä päälle täyden kierroksen aikana, ja pienin kiertokulma on 360° : n. Kuvauksen tunnistat vertaamalla kärkien koordinaatteja: sama sääntö pätee jokaiseen kärkeen. Ei laskinta."}],"harjoitukset":[{"id":"H01","ryhma":"siirto","kysymys":"Piste (−4, 3) siirretään 7 yksikköä oikealle ja 5 yksikköä alas. Mikä on kuvapisteen y-koordinaatti?","vastaus":-2,"vinkki":"Alas siirtäminen pienentää y-koordinaattia.","selitys":"Siirto 5 alas tarkoittaa, että y-koordinaatista vähennetään 5: 3 − 5 = −2. Kuvapiste on (3, −2)."},{"id":"H02","ryhma":"siirto","kysymys":"Siirto vie pisteen (0, 0) pisteeseen (−6, 4). Mikä on pisteen (2, −3) kuvapisteen x-koordinaatti?","vastaus":-4,"vinkki":"Origosta lähtevä suuntajana kertoo siirtymän suoraan: 6 vasemmalle ja 4 ylös.","selitys":"Siirtymä on 6 vasemmalle ja 4 ylös, joten x-koordinaatti on 2 − 6 = −4. Kuvapiste on (−4, 1)."},{"id":"H03","ryhma":"siirto","kysymys":"Siirrossa piste A(3, −1) kuvautuu pisteeksi A′(−2, 4). Piste B(5, 2) siirretään samalla siirrolla. Mikä on kuvapisteen B′ y-koordinaatti?","vastaus":7,"vinkki":"Laske siirtymä loppupiste miinus alkupiste: A′:n koordinaateista vähennetään A:n koordinaatit.","selitys":"Siirtymä y-suunnassa on 4 − (−1) = 5 eli 5 ylös. B′:n y-koordinaatti on 2 + 5 = 7. Kuvapiste on B′(0, 7). Vastaus −3 syntyy, jos siirtymä lasketaan väärin päin."},{"id":"H04","ryhma":"siirto","kysymys":"Siirrossa piste P(−1, 6) kuvautuu pisteeksi P′(4, 1). Mikä piste kuvautuu samassa siirrossa origoksi (0, 0)? Anna tämän pisteen x-koordinaatti.","vastaus":-5,"vinkki":"Siirto vie 5 oikealle ja 5 alas. Etsittävä piste on se, joka 5 oikealle ja 5 alas siirrettynä on origo.","selitys":"Siirtymä on 5 oikealle ja 5 alas. Origoon päätyvä piste on origosta 5 vasemmalla ja 5 ylempänä: (−5, 5). Tarkistus: −5 + 5 = 0 ja 5 − 5 = 0."},{"id":"H05","ryhma":"siirto","kysymys":"Piste (1, 1) siirretään ensin 4 yksikköä oikealle ja 6 yksikköä ylös ja sitten 8 yksikköä vasemmalle ja 2 yksikköä alas. Mikä on lopullisen kuvapisteen x-koordinaatti?","vastaus":-3,"vinkki":"Kaksi siirtoa voi yhdistää yhdeksi: laske x-suunnan siirtymät yhteen.","selitys":"x-suunnassa 4 oikealle ja 8 vasemmalle on yhteensä 4 vasemmalle: 1 − 4 = −3. Lopullinen piste on (−3, 5)."},{"id":"H06","ryhma":"siirto","kysymys":"Suorakulmion kärjet ovat (−2, −1), (4, −1), (4, 3) ja (−2, 3). Suorakulmio siirretään 5 yksikköä vasemmalle ja 2 yksikköä ylös. Montako koordinaatiston ruutua on kuvasuorakulmion pinta-ala?","vastaus":24,"vinkki":"Siirto ei muuta kuvion kokoa. Laske alkuperäisen suorakulmion sivut.","selitys":"Sivut ovat 4 − (−2) = 6 ja 3 − (−1) = 4 ruutua, joten pinta-ala on 6 · 4 = 24 ruutua. Siirto säilyttää koon, joten kuvasuorakulmion ala on sama."},{"id":"H07","ryhma":"kierto","kysymys":"Piste (−7, 3) kierretään origon ympäri 180°. Mikä on kuvapisteen x-koordinaatti?","vastaus":7,"vinkki":"Kierrossa 180° origon ympäri (x, y) kuvautuu pisteeksi (−x, −y).","selitys":"Molemmat koordinaatit vaihtavat merkkiä: kuvapiste on (7, −3), joten x-koordinaatti on 7."},{"id":"H08","ryhma":"kierto","kysymys":"Piste (3, 8) kierretään origon ympäri 90° vastapäivään. Kuvapiste on (a, b). Mikä on a?","vastaus":-8,"vinkki":"Vastapäivään oikealle kääntyy ylös ja ylös vasemmalle.","selitys":"Piste on 3 oikealle ja 8 ylös. Kierrossa 90° vastapäivään 3 oikealle kääntyy 3 ylös ja 8 ylös kääntyy 8 vasemmalle, joten kuvapiste on (−8, 3) ja a = −8. Vastaus 8 syntyy, jos koordinaatit vain vaihtavat paikkaa tai kierretään myötäpäivään."},{"id":"H09","ryhma":"kierto","kysymys":"Piste (−2, 5) kierretään origon ympäri 90° myötäpäivään. Mikä on kuvapisteen y-koordinaatti?","vastaus":2,"vinkki":"Myötäpäivään ylös kääntyy oikealle ja vasemmalle kääntyy ylös.","selitys":"Piste on 2 vasemmalle ja 5 ylös. Myötäpäivään 2 vasemmalle kääntyy 2 ylös ja 5 ylös kääntyy 5 oikealle, joten kuvapiste on (5, 2). Sääntö (y, −x) antaa saman. Piste siirtyi toisesta neljänneksestä ensimmäiseen, kuten myötäpäivään kuuluu."},{"id":"H10","ryhma":"kierto","kysymys":"Piste (4, −6) kierretään origon ympäri 270° vastapäivään. Mikä on kuvapisteen y-koordinaatti?","vastaus":-4,"vinkki":"Kierto 270° vastapäivään on sama kuin kierto 90° myötäpäivään.","selitys":"270° vastapäivään on sama kuin 90° myötäpäivään, joten (x, y) kuvautuu pisteeksi (y, −x): (−6, −4). y-koordinaatti on −4. Piste siirtyi neljännestä neljänneksestä kolmanteen."},{"id":"H11","ryhma":"kierto","kysymys":"Aino kiersi pisteen (2, 7) origon ympäri 90° vastapäivään ja sai kuvapisteeksi (7, 2). Mikä hänen virheensä oli?","vastaus":0,"vinkki":"Mihin neljännekseen ensimmäisen neljänneksen pisteen pitää siirtyä, kun sitä kierretään 90° vastapäivään?","selitys":"Oikea kuvapiste on (−7, 2), joka on toisessa neljänneksessä. Ainon piste (7, 2) jäi ensimmäiseen neljännekseen, koska hän vaihtoi vain koordinaattien paikkaa. Myötäpäivään kierretty piste olisi ollut (7, −2).","tyyppi":"monivalinta","vaihtoehdot":["Hän vaihtoi vain koordinaattien paikkaa ja unohti etumerkin.","Hän kiersi myötäpäivään.","Hän kiersi 180°."]},{"id":"H12","ryhma":"kierto","kysymys":"Piste (7, 2) kierretään 180° pisteen K(3, 5) ympäri. Mikä on kuvapisteen x-koordinaatti?","vastaus":-1,"vinkki":"Laske ensin, kuinka paljon piste on K:sta oikealle ja ylös. Kierto ei tapahdu origon ympäri.","selitys":"Piste on K:sta 4 oikealle ja 3 alas. Kierrossa 180° siirtymä vaihtaa suuntaa: 4 vasemmalle ja 3 ylös. Kuvapiste on (3 − 4, 5 + 3) = (−1, 8), joten x-koordinaatti on −1. Vastaus −7 syntyy, jos kierretään origon ympäri."},{"id":"H13","ryhma":"kierto","kysymys":"Piste A(5, 3) kierretään 90° vastapäivään pisteen K(2, −1) ympäri. Mikä on kuvapisteen A′ x-koordinaatti?","vastaus":-2,"vinkki":"A on K:sta 3 oikealle ja 4 ylös. Käännä tämä siirtymä vastapäivään ja lisää se K:hon.","selitys":"Siirtymä 3 oikealle ja 4 ylös kääntyy muotoon 3 ylös ja 4 vasemmalle eli (−4, 3). A′ = (2 − 4, −1 + 3) = (−2, 2), joten x-koordinaatti on −2."},{"id":"H14","ryhma":"kierto","kysymys":"Piste B(−1, 4) kierretään 90° myötäpäivään pisteen K(1, 1) ympäri. Mikä on kuvapisteen B′ y-koordinaatti?","vastaus":3,"vinkki":"B on K:sta 2 vasemmalle ja 3 ylös. Myötäpäivään vasemmalle kääntyy ylös ja ylös oikealle.","selitys":"Siirtymä 2 vasemmalle ja 3 ylös kääntyy muotoon 2 ylös ja 3 oikealle eli (3, 2). B′ = (1 + 3, 1 + 2) = (4, 3), joten y-koordinaatti on 3."},{"id":"H15","ryhma":"symmetria","kysymys":"Montako astetta on pienin kiertokulma, jolla säännöllinen kymmenkulmio kuvautuu itselleen?","vastaus":36,"vinkki":"Säännöllisen n-kulmion kertaluku on n, ja pienin kiertokulma on 360° : n.","selitys":"Kymmenkulmio osuu täyden kierroksen aikana itsensä päälle 10 kertaa, joten pienin kiertokulma on 360° : 10 = 36°. Vastaus 144 on kymmenkulmion kulma, ei kiertokulma."},{"id":"H16","ryhma":"symmetria","kysymys":"Kuvio kuvautuu itselleen, kun sitä kierretään keskipisteensä ympäri 40°, eikä millään pienemmällä kiertokulmalla. Mikä on kuvion kiertosymmetrian kertaluku?","vastaus":9,"vinkki":"Kertaluku n ja pienin kiertokulma α toteuttavat yhtälön n · α = 360°.","selitys":"Kierrot 40°, 80°, 120° ja niin edelleen 360°:een asti vievät kuvion itselleen. Niitä on 360° : 40° = 9, joten kertaluku on 9."},{"id":"H17","ryhma":"symmetria","kysymys":"1) tasakylkinen kolmio, joka ei ole tasasivuinen\n2) suunnikas, joka ei ole suorakulmio eikä neljäkäs\n3) suorakulmainen kolmio\n4) tasakylkinen puolisuunnikas, jonka yhdensuuntaiset sivut ovat eri pitkät\n5) kolmio, jonka kaikki sivut ovat eri pitkät\n\nMontako näistä viidestä kuviosta on kiertosymmetrisiä?","vastaus":1,"vinkki":"Symmetria-akseli ei tee kuviosta kiertosymmetristä. Kokeile kunkin kuvion kohdalla kiertoa 180°.","selitys":"Vain suunnikas on kiertosymmetrinen: kierto 180° keskipisteen ympäri vie sen itselleen. Tasakylkisellä kolmiolla ja tasakylkisellä puolisuunnikkaalla on symmetria-akseli, mutta mikään täyttä kierrosta pienempi kierto ei vie niitä itselleen."},{"id":"H18","ryhma":"symmetria","kysymys":"Kolmion kärjet ovat A(1, 2), B(4, 2) ja C(1, 6). Kolmio kuvautuu kolmioksi, jonka kärjet ovat A′(−2, 1), B′(−2, 4) ja C′(−6, 1).\n\nMikä kuvaus vie kolmion ABC kolmioksi A′B′C′?","vastaus":0,"vinkki":"Kokeile jokaista vaihtoehtoa kaikkiin kolmeen kärkeen.","selitys":"Sääntö (−y, x) pätee jokaiseen kärkeen: (1, 2) → (−2, 1), (4, 2) → (−2, 4) ja (1, 6) → (−6, 1). Kuvaus on kierto 90° vastapäivään origon ympäri. Peilaus y-akselin suhteen veisi A:n pisteeseen (−1, 2).","tyyppi":"monivalinta","vaihtoehdot":["kierto 90° vastapäivään origon ympäri","kierto 90° myötäpäivään origon ympäri","peilaus y-akselin suhteen"]},{"id":"H19","ryhma":"symmetria","kysymys":"Piste (2, 7) kierretään ensin origon ympäri 90° vastapäivään, ja kuvapiste siirretään sitten 3 yksikköä oikealle ja 4 yksikköä alas. Mikä on lopullisen pisteen x-koordinaatti?","vastaus":-4,"vinkki":"Tee kuvaukset annetussa järjestyksessä: ensin kierto, sitten siirto.","selitys":"Kierto antaa pisteen (−7, 2), ja siirto vie sen pisteeseen (−7 + 3, 2 − 4) = (−4, −2). x-koordinaatti on −4."},{"id":"H20","ryhma":"symmetria","kysymys":"Kolmion kärjet ovat A(2, 1), B(5, 1) ja C(5, 3). Kierto origon ympäri vie ne pisteisiin A′(1, −2), B′(1, −5) ja C′(3, −5). Montako astetta vastapäivään kierto on? Anna vastaus lukuna 90, 180 tai 270.","vastaus":270,"vinkki":"Vertaa kärkiä taulukon sääntöihin. Mihin neljännekseen kärjet siirtyivät?","selitys":"Sääntö (y, −x) pätee kaikkiin kärkiin: (2, 1) → (1, −2), (5, 1) → (1, −5) ja (5, 3) → (3, −5). Se on kierto 90° myötäpäivään eli 270° vastapäivään. Kärjet siirtyivät ensimmäisestä neljänneksestä neljänteen."}],"valmis_teksti":"Osaat siirtää kuvion suuntajanan verran ja kääntää sen 90°, 180° tai 270° origon tai muun pisteen ympäri koordinaatistossa. Ilmoitat kierron keskuksen, kulman ja suunnan, tarkistat kärkipisteen koordinaatit laskemalla ja tiedät, että siirto ja kierto säilyttävät kuvion koon ja muodon. Määrität kuvion kiertosymmetrian kertaluvun ja pienimmän kiertokulman ja nimeät kuvauksen, joka vie kuvion toiseen asentoon. Tämä taito on nyt näytetty."};

const esc = s => s;

/* ---------- lukusuora ---------- */
const svg=document.getElementById("nlsvg"), rng=document.getElementById("nlrange"), out=document.getElementById("nlout");
const X0=34, X1=606, Y=62;
function piirraNL(v){
  const ala=Math.floor(v/10)*10, yla=ala+10, puoli=ala+5;
  const pyor = (v%10)>=5 ? yla : ala;
  const x = n => X0 + (n/100)*(X1-X0);
  let s=`<line class="rail" x1="${X0}" y1="${Y}" x2="${X1}" y2="${Y}"/>`;
  for(let n=0;n<=100;n+=10){
    const near = (n===ala||n===yla);
    s+=`<line class="tick" x1="${x(n)}" y1="${Y-7}" x2="${x(n)}" y2="${Y+7}"/>`;
    s+=`<text class="stop${near?" near":""}" x="${x(n)}" y="${Y+24}" text-anchor="middle">${n}</text>`;
  }
  s+=`<line class="halfway" x1="${x(puoli)}" y1="${Y-16}" x2="${x(puoli)}" y2="${Y+12}"/>`;
  s+=`<text class="stop" x="${x(puoli)}" y="${Y-22}" text-anchor="middle">puoliväli ${puoli}</text>`;
  s+=`<circle class="dot" cx="${x(v)}" cy="${Y}" r="6"/>`;
  s+=`<text class="val" x="${x(v)}" y="${Y-32}" text-anchor="middle">${v}</text>`;
  s+=`<path d="M ${x(v)} ${Y+38} L ${x(pyor)} ${Y+38}" stroke="var(--core)" stroke-width="2" fill="none"/>`;
  s+=`<path d="M ${x(pyor)} ${Y+38} l ${x(pyor)>x(v)?-7:7} -4 l 0 8 z" fill="var(--core)"/>`;
  svg.innerHTML=s;
  out.textContent = `${v} pyöristyy → ${pyor}`;
}
if(svg){ piirraNL(+rng.value); rng.addEventListener("input",e=>piirraNL(+e.target.value)); }

/* ---------- laskujärjestys-widget ---------- */
const ljExp=document.getElementById("ljExp");
if(ljExp && D.kokeilu){
  let ljI=0, ljTokens=[], ljStep=0;
  const laske=(a,op,b)=>{a=+a;b=+b;return op==="×"?a*b:op==="÷"?a/b:op==="+"?a+b:a-b;};
  function ljAlku(){
    const l=D.kokeilu[ljI];
    ljTokens=l.lauseke.replace(/\(/g,"( ").replace(/\)/g," )").split(/\s+/).filter(Boolean);
    ljStep=0; ljPiirra(); ljViesti("","");
  }
  function ljViesti(t,lk){const f=document.getElementById("ljFb"); f.textContent=t; f.className="lj-fb "+(lk||"");}
  function ljPiirra(){
    const l=D.kokeilu[ljI];
    document.getElementById("ljStep").textContent =
      ljStep>=l.askeleet.length ? "valmis" : `askel ${ljStep+1} / ${l.askeleet.length}`;
    if(ljStep>=l.askeleet.length){
      ljExp.innerHTML=`<span class="valmis">${l.lauseke} = ${l.vastaus}</span>`;
      return;
    }
    ljExp.innerHTML=ljTokens.map((t,i)=>
      "×÷+−".includes(t) ? `<button type="button" class="op" data-i="${i}">${t}</button>`
                         : `<span class="tok">${t}</span>`).join("");
    ljExp.querySelectorAll("button.op").forEach(b=>b.addEventListener("click",()=>ljKlikkaa(+b.dataset.i)));
  }
  function ljKlikkaa(i){
    const l=D.kokeilu[ljI], odotettu=l.askeleet[ljStep];
    const ehdotus=[ljTokens[i-1],ljTokens[i],ljTokens[i+1]].join(" ");
    if(ehdotus!==odotettu){
      ljViesti(ljStep===0
        ? "Ei vielä. Sulkeet ovat vahvimmat, sitten kerto ja jako. Yhtä vahvat vasemmalta oikealle."
        : "Ei vielä. Kumpi jäljellä olevista on vahvempi?", "no");
      return;
    }
    const arvo=laske(ljTokens[i-1],ljTokens[i],ljTokens[i+1]);
    let alku=i-1, loppu=i+1;
    if(ljTokens[i-2]==="(" && ljTokens[i+2]===")"){ alku=i-2; loppu=i+2; }
    ljTokens.splice(alku, loppu-alku+1, String(arvo));
    ljStep++;
    ljViesti(ljStep>=l.askeleet.length ? "Valmis. Vastaus on "+l.vastaus+"." : "Oikein. Jatka seuraavaan.", "ok");
    ljPiirra();
  }
  document.getElementById("ljSeuraava").addEventListener("click",()=>{
    ljI=(ljI+1)%D.kokeilu.length; ljAlku();
  });
  ljAlku();
}

};

/* Suomalainen lukumuoto: välilyönti on tuhaterotin, pilkku desimaalierotin.
   Piste voi olla kumpi tahansa. Se tulkitaan tuhaterottimeksi VAIN silloin, kun
   koko luku on aitoa tuhaterotinmuotoa: alkuosa 1–3 numeroa ilman etunollaa ja
   jokainen jatko-osa täsmälleen 3 numeroa (1.500, 12.345.678). Kaikissa muissa
   tapauksissa piste on desimaalipiste — myös 0.125, joka vanhalla säännöllä
   ("3 numeroa pisteen jäljessä = tuhaterotin") luettiin virheellisesti luvuksi 125. */
const TUHATEROTIN = /^[1-9]\d{0,2}(\.\d{3})+$/;
function lueLuku(teksti){
  // Murtoluku (3/4, -3/4) ja sekaluku (1 2/3, -1 2/3) hyväksytään sellaisinaan.
  const raaka = String(teksti).replace(/\u00a0/g, " ").trim();
  let m = raaka.match(/^(-?)(\d+)\s+(\d+)\s*\/\s*(\d+)$/);
  if(m){ const nim = Number(m[4]); if(nim === 0) return null;
    const v = Number(m[2]) + Number(m[3]) / nim; return m[1] ? -v : v; }
  m = raaka.match(/^(-?)\s*(\d+)\s*\/\s*(\d+)$/);
  if(m){ const nim = Number(m[3]); if(nim === 0) return null;
    const v = Number(m[2]) / nim; return m[1] ? -v : v; }
  let s = String(teksti).replace(/[\s\u00a0]/g, "");
  if(s === "") return null;
  if(s.indexOf(",") >= 0){
    s = s.replace(/\./g, "").replace(",", ".");
  } else if(TUHATEROTIN.test(s)){
    s = s.replace(/\./g, "");
  }
  const n = Number(s);
  return Number.isFinite(n) ? n : null;
}

function tarkista(id){
  const h=D.harjoitukset.find(x=>x.id===id);
  const kentta=document.getElementById("in-"+id);
  const fb=document.getElementById("fb-"+id);
  if(kentta.value.trim()===""){ fb.className="fb hint"; fb.textContent="Kirjoita vastaus ensin."; return; }
  const luku=lueLuku(kentta.value);
  if(luku===null){ fb.className="fb no"; fb.textContent="Vastauksen pitää olla luku tai murtoluku (esimerkiksi 3/4)."; return; }
  const oikein = Math.abs(luku - h.vastaus) < 1e-9;
  merkitseTulos(id, oikein, oikein ? "Oikein. "+h.selitys : `Ei vielä. ${h.vinkki} Kokeile uudelleen.`);
}

function tarkistaMonivalinta(id, valittuIndeksi, painike){
  const h=D.harjoitukset.find(x=>x.id===id);
  const rivi=painike.closest(".row");
  rivi.querySelectorAll(".mv-valinta").forEach(b=>b.disabled=true);
  const oikein = valittuIndeksi===h.vastaus;
  painike.classList.add(oikein?"mv-oikein":"mv-vaarin");
  if(!oikein){
    const oikeaBtn=rivi.querySelector(`[data-i="${h.vastaus}"]`);
    if(oikeaBtn) oikeaBtn.classList.add("mv-oikein");
  }
  merkitseTulos(id, oikein, oikein ? "Oikein. "+h.selitys : `Ei ihan. Oikea vastaus on korostettu. ${h.selitys||""}`);
}

/* Kuuntelu: selain lukee tekstin ääneen omalla puhesynteesillään (englanniksi, jos laitteessa on
   englanninkielinen ääni). Ei äänitiedostoja eikä verkkoyhteyttä. Jos laite ei osaa puhua,
   teksti näytetään luettavaksi — silloin tehtävä muuttuu luetun ymmärtämiseksi, mutta ei katkea. */
function puhu(id, nopeus){
  const h=D.harjoitukset.find(x=>x.id===id); if(!h || !h.kuuntele) return;
  const vara=document.getElementById("vara-"+id);
  const naytaTeksti=syy=>{ vara.hidden=false; vara.textContent=syy+" Teksti: "+h.kuuntele; };
  if(!("speechSynthesis" in window)){ naytaTeksti("Tämä laite ei osaa lukea ääneen."); return; }
  const s=window.speechSynthesis; s.cancel();
  const u=new SpeechSynthesisUtterance(h.kuuntele);
  u.lang=h.kieli||"en-GB"; u.rate=nopeus;
  const aanet=s.getVoices(), kieli=u.lang.slice(0,2);
  const aani=aanet.find(a=>a.lang===u.lang) || aanet.find(a=>a.lang && a.lang.startsWith(kieli));
  if(aani) u.voice=aani;
  else if(aanet.length) { naytaTeksti("Laitteessa ei ole englanninkielistä ääntä."); return; }
  u.onerror=()=>naytaTeksti("Ääneen lukeminen ei onnistunut.");
  s.speak(u);
}
