<title>Prosenttien ansat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">

<style>
:root{
  --paper:#EFF2F5; --surface:#FFFFFF; --surface-2:#F7F9FB;
  --grid:#DCE3EA; --line:#C9D3DC;
  --ink:#15222C; --ink-2:#4E626F; --ink-3:#7E8F9B;
  --core:#1B5A9E; --core-soft:#E4EDF6;
  --strong:#1F6E5C; --strong-soft:#E1F0EB;
  --chal:#9A6A16; --chal-soft:#F6EDDC;
  --alert:#A33A2B; --alert-soft:#F8E7E3;
  --shadow:0 1px 2px rgba(21,34,44,.06), 0 8px 24px -12px rgba(21,34,44,.18);
  --r:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0F161B; --surface:#18222A; --surface-2:#1D2830;
    --grid:#22303A; --line:#2E3E4A;
    --ink:#E8EFF4; --ink-2:#A3B4C0; --ink-3:#7A8B97;
    --core:#7FB2E4; --core-soft:#16303F;
    --strong:#77CDB4; --strong-soft:#123028;
    --chal:#E0B267; --chal-soft:#33270F;
    --alert:#E8907F; --alert-soft:#3A1E19;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -14px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --paper:#0F161B; --surface:#18222A; --surface-2:#1D2830;
  --grid:#22303A; --line:#2E3E4A;
  --ink:#E8EFF4; --ink-2:#A3B4C0; --ink-3:#7A8B97;
  --core:#7FB2E4; --core-soft:#16303F;
  --strong:#77CDB4; --strong-soft:#123028;
  --chal:#E0B267; --chal-soft:#33270F;
  --alert:#E8907F; --alert-soft:#3A1E19;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -14px rgba(0,0,0,.7);
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:16px; line-height:1.62;
  background-image:
    linear-gradient(to right, var(--grid) 1px, transparent 1px),
    linear-gradient(to bottom, var(--grid) 1px, transparent 1px);
  background-size:26px 26px;
}
.wrap{max-width:760px; margin:0 auto; padding:28px 20px 90px}
h1,h2,h3,h4{font-family:"Familjen Grotesk","IBM Plex Sans",system-ui,sans-serif; text-wrap:balance}

/* header */
header.top{background:var(--surface); border:1px solid var(--line); border-radius:var(--r);
  box-shadow:var(--shadow); padding:22px 24px; display:flex; gap:18px; align-items:flex-start}
.badge{flex:0 0 auto; width:54px; height:54px; border-radius:9px; display:grid; place-items:center;
  background:var(--core-soft); border:1px solid var(--core); color:var(--core)}
.badge svg{width:28px; height:28px; fill:none; stroke:currentColor; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round}
.eyebrow{font-family:"IBM Plex Mono",monospace; font-size:11px; letter-spacing:.14em;
  text-transform:uppercase; color:var(--ink-3); margin:0 0 5px}
header.top h1{margin:0; font-size:30px; font-weight:700; letter-spacing:-.015em}
header.top p{margin:5px 0 0; color:var(--ink-2); font-size:15px}
.tags{display:flex; flex-wrap:wrap; gap:5px; margin-top:11px}
.tag{font-family:"IBM Plex Mono",monospace; font-size:10.5px; letter-spacing:.05em; padding:2px 7px;
  border-radius:4px; background:var(--surface-2); border:1px solid var(--line); color:var(--ink-3)}
.tag.core{background:var(--core-soft); border-color:var(--core); color:var(--core)}

/* teksti */
article{margin-top:26px}
article h2{font-size:21px; font-weight:600; margin:32px 0 10px; letter-spacing:-.01em}
article p{margin:0 0 14px; max-width:64ch}
.lead{font-size:17.5px; color:var(--ink); border-left:3px solid var(--core); padding-left:16px; margin:0 0 8px}

.box{background:var(--surface); border:1px solid var(--line); border-radius:var(--r);
  padding:18px 22px; box-shadow:var(--shadow); margin:22px 0}
.box h3{margin:0 0 12px; font-size:16.5px; font-weight:600}
.box.warn{border-left:3px solid var(--alert)}
.box.note{border-left:3px solid var(--chal)}

ol.steps{margin:0; padding-left:0; list-style:none; counter-reset:s; display:grid; gap:12px}
ol.steps li{counter-increment:s; display:grid; grid-template-columns:auto 1fr; gap:13px; align-items:start}
ol.steps li::before{content:counter(s); font-family:"Familjen Grotesk",sans-serif; font-weight:700; font-size:14px;
  width:26px; height:26px; border-radius:50%; background:var(--core); color:#fff; display:grid; place-items:center; margin-top:2px}

ul.notes{margin:0; padding-left:19px}
ul.notes li{margin-bottom:7px}
ul.notes li:last-child{margin-bottom:0}

.tablewrap{overflow-x:auto}
table{border-collapse:collapse; width:100%; font-size:14.5px; min-width:460px}
th,td{text-align:left; padding:9px 13px; border-bottom:1px solid var(--line)}
th{font-family:"IBM Plex Mono",monospace; font-size:10.5px; letter-spacing:.1em; text-transform:uppercase;
  color:var(--ink-3); font-weight:400; background:var(--surface-2)}
tr:last-child td{border-bottom:0}
td b{color:var(--core); font-weight:600}
td:last-child{font-variant-numeric:tabular-nums; font-weight:600}

/* lukusuora */
.nl svg{width:100%; height:118px; display:block}
.nl .rail{stroke:var(--line); stroke-width:2}
.nl .tick{stroke:var(--line); stroke-width:1.5}
.nl .stop{fill:var(--ink-3); font-family:"IBM Plex Mono",monospace; font-size:11px}
.nl .stop.near{fill:var(--core); font-weight:600}
.nl .dot{fill:var(--chal)}
.nl .val{fill:var(--ink); font-family:"Familjen Grotesk",sans-serif; font-size:15px; font-weight:700}
.nl .halfway{stroke:var(--chal); stroke-dasharray:3 3; stroke-width:1.5}
.nl-controls{display:flex; align-items:center; gap:14px; margin-top:6px}
.nl-controls input{flex:1; accent-color:var(--core)}
.nl-out{font-family:"Familjen Grotesk",sans-serif; font-size:15px; font-weight:600; min-width:12.5em; text-align:right}

/* paikka-arvotaulu */
.box .ohje{margin:0 0 14px; font-size:14.5px; color:var(--ink-2)}
.nt-valinta{display:flex; flex-wrap:wrap; gap:7px; margin-bottom:16px}
.nt-valinta button{font:inherit; font-size:12.5px; font-family:"IBM Plex Mono",monospace; padding:5px 11px;
  border-radius:6px; border:1px solid var(--line); background:var(--surface-2); color:var(--ink-2); cursor:pointer}
.nt-valinta button[aria-pressed="true"]{background:var(--ink); color:var(--paper); border-color:var(--ink)}
.nt-valinta button:focus-visible{outline:2px solid var(--core); outline-offset:2px}
.nt-taulu{display:flex; flex-direction:column; gap:4px; align-items:flex-start; overflow-x:auto; padding-bottom:4px}
.nt-rivi{display:flex; gap:6px; align-items:center}
.nt-rivi .otsa{font-family:"IBM Plex Mono",monospace; font-size:9.5px; letter-spacing:.08em;
  text-transform:uppercase; color:var(--ink-3); width:52px; text-align:center}
.nt-ruutu{width:52px; height:52px; display:grid; place-items:center; border:1.5px solid var(--line);
  border-radius:7px; background:var(--surface-2); font-family:"IBM Plex Mono",monospace; font-size:24px}
.nt-ruutu.kohta{border-color:var(--core); background:var(--core-soft); color:var(--core); font-weight:500}
.nt-ruutu.ratkaiseva{border-color:var(--chal); background:var(--chal-soft); color:var(--chal); font-weight:500}
.nt-ruutu.nolla{color:var(--ink-3)}
.nt-rivi .nimi{font-size:12.5px; color:var(--ink-3); margin-left:12px; white-space:nowrap}
.nt-nuoli{font-size:17px; color:var(--chal); margin-left:6px}
.nt-selite{margin:14px 0 0; font-size:14.5px}
.nt-selite b{color:var(--core)}

/* vahvuusportaat */
.vp-tasot{display:grid; gap:9px; margin-bottom:18px}
.vp-taso{display:flex; gap:11px; align-items:flex-start; font-size:13.5px}
.vp-taso .vp-pallo{width:13px; height:13px; border-radius:4px; margin-top:5px; flex:0 0 auto}
.vp-taso[data-taso="sulkeet"] .vp-pallo{background:var(--core)}
.vp-taso[data-taso="kertojako"] .vp-pallo{background:var(--strong)}
.vp-taso[data-taso="yhteenvahennys"] .vp-pallo{background:var(--chal)}
.vp-taso strong{display:block; font-family:"Familjen Grotesk",sans-serif; font-weight:600; font-size:14.5px}
.vp-taso span{color:var(--ink-2)}
.vp-lauseke{display:flex; flex-wrap:wrap; gap:7px; align-items:flex-end; font-family:"IBM Plex Mono",monospace;
  font-size:25px; padding:10px 2px; min-height:64px}
.vp-lauseke .t{padding:2px 3px}
.vp-lauseke .op{position:relative; padding:2px 9px; border-radius:6px; font-weight:500}
.vp-lauseke .op[data-taso="sulkeet"]{background:var(--core-soft); color:var(--core)}
.vp-lauseke .op[data-taso="kertojako"]{background:var(--strong-soft); color:var(--strong)}
.vp-lauseke .op[data-taso="yhteenvahennys"]{background:var(--chal-soft); color:var(--chal)}
.vp-lauseke .op i{position:absolute; top:-9px; right:-6px; font-style:normal; font-family:"Familjen Grotesk",sans-serif;
  font-size:11px; font-weight:700; width:18px; height:18px; border-radius:50%; display:grid; place-items:center;
  background:currentColor}
.vp-lauseke .op i span{color:var(--surface)}
.vp-rivi{display:flex; align-items:center; gap:16px; margin-top:8px}
.vp-vastaus{font-family:"Familjen Grotesk",sans-serif; font-size:16px; font-weight:600; color:var(--strong)}

/* laskujärjestys-widget */
.lj-exp{display:flex; flex-wrap:wrap; gap:7px; align-items:center; font-family:"IBM Plex Mono",monospace;
  font-size:23px; padding:14px 4px; min-height:62px}
.lj-exp .tok{padding:2px 4px; color:var(--ink)}
.lj-exp button.op{font-family:"IBM Plex Mono",monospace; font-size:23px; padding:3px 12px; border-radius:7px;
  border:1.5px solid var(--line); background:var(--surface-2); color:var(--ink); line-height:1.2}
.lj-exp button.op:hover{border-color:var(--core); color:var(--core)}
.lj-exp button.op:focus-visible{outline:2px solid var(--core); outline-offset:2px}
.lj-exp .valmis{font-family:"Familjen Grotesk",sans-serif; font-size:23px; font-weight:700; color:var(--strong)}
.lj-fb{font-size:14.5px; min-height:1.5em; color:var(--ink-2)}
.lj-fb.no{color:var(--alert)}
.lj-fb.ok{color:var(--strong)}
.lj-row{display:flex; align-items:center; gap:14px; margin-top:10px}
.lj-step{font-family:"IBM Plex Mono",monospace; font-size:11.5px; letter-spacing:.1em;
  text-transform:uppercase; color:var(--ink-3)}

/* harjoitukset */
.progress{position:sticky; top:0; z-index:5; background:var(--surface); border:1px solid var(--line);
  border-radius:var(--r); padding:12px 18px; box-shadow:var(--shadow); display:flex; align-items:center;
  gap:14px; margin:34px 0 18px}
.progress .lbl{font-family:"IBM Plex Mono",monospace; font-size:11px; letter-spacing:.12em;
  text-transform:uppercase; color:var(--ink-3); white-space:nowrap}
.progress .meter{flex:1; height:7px; border-radius:4px; background:var(--surface-2); border:1px solid var(--line); overflow:hidden}
.progress .meter i{display:block; height:100%; background:var(--core); transition:width .25s ease}
.progress .cnt{font-family:"Familjen Grotesk",sans-serif; font-weight:700; font-variant-numeric:tabular-nums; white-space:nowrap}

.grp{margin-top:26px}
.grp-head{display:flex; align-items:baseline; gap:10px; border-bottom:1.5px solid var(--ink); padding-bottom:7px; margin-bottom:14px}
.grp-head h3{margin:0; font-size:17px; font-weight:600}
.grp-head span{font-size:12.5px; color:var(--ink-2)}

.ex{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:14px 16px; margin-bottom:10px}
.ex[data-tila="oikein"]{border-color:var(--strong); box-shadow:inset 3px 0 0 var(--strong)}
.ex[data-tila="vaarin"]{border-color:var(--alert); box-shadow:inset 3px 0 0 var(--alert)}
.ex .q{display:flex; gap:11px; align-items:baseline; flex-wrap:wrap}
.ex .num{font-family:"IBM Plex Mono",monospace; font-size:11.5px; color:var(--ink-3); min-width:2.4em}
.ex .txt{flex:1; min-width:190px; font-size:15.5px}
.ex .txt .aineisto{display:block; margin-bottom:9px; padding-left:12px;
  border-left:2px solid var(--line); color:var(--ink-2); line-height:1.6;
  /* Aineisto voi olla pieni taulukko, jonka rivit on erotettu rivinvaihdoilla.
     Ilman pre-lineä ne valuisivat yhdeksi kappaleeksi ja taulukko katoaisi. */
  white-space:pre-line}
.ex .txt .kysymysrivi{display:block; font-weight:600}
.ex .row{display:flex; gap:8px; align-items:center; margin-top:11px; flex-wrap:wrap}
.ex input[type=text]{font:inherit; font-family:"IBM Plex Mono",monospace; font-size:15px; width:8.5em;
  padding:7px 11px; border:1px solid var(--line); border-radius:7px; background:var(--surface-2);
  color:var(--ink); text-align:right}
.ex input:focus-visible{outline:2px solid var(--core); outline-offset:1px}
button{font:inherit; cursor:pointer}
.btn{font-size:13.5px; padding:7px 15px; border-radius:7px; border:1px solid var(--core);
  background:var(--core); color:#fff}
.btn.ghost{background:transparent; color:var(--ink-2); border-color:var(--line)}
.btn:focus-visible{outline:2px solid var(--core); outline-offset:2px}
.btn.mv-valinta{text-align:left}
/* kuuntelutehtävä: selaimen puhesynteesi lukee englanninkielisen tekstin */
.kuuntele{display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin:2px 0 10px}
.kuuntele .btn{display:inline-flex; gap:7px; align-items:center}
.kuuntele svg{width:16px; height:16px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round}
.kuuntele .varateksti{flex-basis:100%; font-size:14px; color:var(--ink-2); background:var(--surface-2);
  border-radius:7px; padding:8px 12px; margin:0}
.btn.mv-valinta:disabled{cursor:default; opacity:.65}
.btn.mv-oikein{background:var(--strong-soft); border-color:var(--strong); color:var(--strong); opacity:1}
.btn.mv-vaarin{background:var(--alert-soft); border-color:var(--alert); color:var(--alert); opacity:1}
.row.mv{gap:8px 10px}
.fb{margin-top:11px; font-size:14.5px; padding:10px 13px; border-radius:8px; line-height:1.5}
.fb.ok{background:var(--strong-soft); color:var(--strong)}
.fb.no{background:var(--alert-soft); color:var(--alert)}
.fb.hint{background:var(--chal-soft); color:var(--chal)}

.done{background:var(--strong-soft); border:1px solid var(--strong); color:var(--strong);
  border-radius:var(--r); padding:16px 20px; margin-top:20px; font-size:15.5px}
.done h3{margin:0 0 4px; font-size:17px; color:var(--strong)}

details.teacher{margin-top:34px; background:var(--surface); border:1px solid var(--line);
  border-left:3px solid var(--chal); border-radius:var(--r); padding:15px 20px; box-shadow:var(--shadow)}
details.teacher summary{cursor:pointer; font-family:"Familjen Grotesk",sans-serif; font-weight:600; font-size:15px}
details.teacher summary:focus-visible{outline:2px solid var(--core); outline-offset:3px}
details.teacher ul{margin:12px 0 0; padding-left:19px; color:var(--ink-2); font-size:14.5px}
details.teacher li{margin-bottom:8px}
details.teacher p{margin:12px 0 0; color:var(--ink-2); font-size:14.5px}

.back{display:inline-block; margin-top:30px; font-size:13.5px; color:var(--ink-2)}
.back a{color:var(--core)}

@media (prefers-reduced-motion: reduce){*{transition:none !important}}
@media (max-width:560px){
  .wrap{padding:16px 13px 70px}
  header.top h1{font-size:25px}
  .progress{flex-wrap:wrap}
}
</style>

<div class="wrap">

  <header class="top">
    <span class="badge"><svg viewBox="0 0 24 24" aria-hidden="true" id="ikoni"></svg></span>
    <div>
      <p class="eyebrow" id="eyebrow"></p>
      <h1 id="otsikko"></h1>
      <p id="kuvaus"></p>
      <div class="tags" id="tags"></div>
    </div>
  </header>

  <article id="teksti"></article>

  <div class="progress" aria-live="polite">
    <span class="lbl">Harjoitukset</span>
    <span class="meter"><i id="pbar" style="width:0%"></i></span>
    <span class="cnt" id="pcnt">0 / 20</span>
  </div>

  <div id="harjoitukset"></div>
  <div id="valmis"></div>

  <p class="back" id="back"></p>

</div>

<script>
const D = {"tavoite_id":"MAT8-PRO-10","oppiaine":"MAT","vuosiluokka":8,"otsikko":"Prosenttien ansat","kuvaus":"Osaan ratkaista ylikurssitason prosenttitehtäviä, joissa perusarvo vaihtuu kesken tehtävän.","versio":"0.2","paivitetty":"2026-10-11","ops":{"T":["T5","T8","T13"],"S":["S1","S2"]},"taso":"haaste","ikoni":"tutkimus","eyebrow":"Matematiikka · 8. luokka · Prosentit","teksti":[{"tyyppi":"johdanto","sisalto":"Suosikkistriimaajasi kanavalla oli keväällä keskimäärin 5 000 katsojaa. Kesällä katsojamäärä väheni 40 %. Syksyllä striimaaja kirjoittaa: \"Kun katsojamäärä kasvaa 40 %, olemme taas kevään lukemissa.\" Laske itse. 40 % 5 000 katsojasta on 2 000, joten kesällä katsojia oli 3 000. Kasvu 40 % lasketaan nyt 3 000 katsojasta: 0,40 · 3 000 = 1 200, ja katsojia olisi 4 200 eikä 5 000. Prosenttiluku on sama, mutta perusarvo vaihtui kesken tehtävän: vähennys laskettiin 5 000 katsojasta, kasvu lasketaan 3 000 katsojasta. Kevään lukemiin tarvitaan 2 000 katsojaa lisää, ja 2 000 on 3 000:sta noin 66,7 %. Tässä taidossa ratkaiset vanhojen ylioppilastehtävien kaltaisia ongelmia, joissa sana prosentti viittaa eri vaiheissa eri kokonaisuuteen: palautusta ennalleen, osuuden osuutta, markkinaosuutta, palkkiota uudesta hinnasta ja sitä, miksi osien prosentit eivät yhdisty kokonaisuuden prosentiksi. Keino on joka kerta sama: kirjoita jokaiseen vaiheeseen, mihin verrataan. Laskin on sallittu."},{"tyyppi":"kappale","otsikko":"Palautus ennalleen","sisalto":"Kun arvo pienenee 40 %, jäljelle jää 60 %, eli kerroin on 0,60. Jotta päästään takaisin alkuperäiseen, uusi arvo pitää kertoa luvulla, joka kumoaa kertoimen 0,60. Kertolaskun kumoaa jakolasku, joten paluukerroin on 1 : 0,60 = 1,666… Kasvu on 1,666… − 1 = 0,666… eli noin 66,7 %. Tarkistus: 0,60 · 1,666… = 1. Kun vähennys on alle 100 %, paluuseen tarvittava kasvu on prosentteina suurempi kuin vähennys, koska kasvu lasketaan pienemmästä arvosta. Sama toimii toiseen suuntaan. Jos hinta nousee 20 %, kerroin on 1,20 ja paluukerroin 1 : 1,20 = 0,833… Hinnan pitää laskea 1 − 0,833… = 0,166… eli noin 16,7 %. Nyt alennus lasketaan suuremmasta hinnasta, joten 16,7 % riittää kumoamaan 20 %:n korotuksen. Jos alkuperäistä arvoa ei kerrota, voit valita sen itse, esimerkiksi 100. Hinta 100 € nousee 120 euroon, ja paluuseen tarvitaan 20 euron alennus. Alennuksen perusarvo on 120 €, joten 20 : 120 = 0,166… ≈ 16,7 %. Valinta toimii, koska tehtävä kysyy vain prosenttia: kaikki määrät muuttuvat samassa suhteessa, valitsitpa alkuarvoksi 100 tai 5 000."},{"tyyppi":"kappale","otsikko":"Osuuden osuus","sisalto":"Oppilaskunnan hallituksen vaalissa äänestysprosentti oli 64 %, ja ehdokas Mira sai 25 % annetuista äänistä. Montako prosenttia kaikista äänioikeutetuista äänesti Miraa? Prosenteilla on eri perusarvot: äänestysprosentin 64 % perusarvo on äänioikeutetut, Miran 25 %:n perusarvo annetut äänet. Valitse äänioikeutettuja olevan 100. Heistä 64 äänesti, ja näistä 64 äänestä Mira sai 25 % eli 0,25 · 64 = 16. Miraa äänesti 16 äänioikeutettua sadasta eli 16 %. Sama saadaan suoraan kertoimilla: 0,25 · 0,64 = 0,16. Kun prosentti otetaan toisesta prosenttiosuudesta, kertoimet kerrotaan. Kun kumpikin prosentti on alle 100 %, tulos on pienempi kuin kumpikaan, koska se on osa osasta. Laskun voi kääntää: jos tiedät, että Miraa äänesti 16 % äänioikeutetuista ja äänestysprosentti oli 64 %, Miran osuus annetuista äänistä on 16 : 64 = 0,25 = 25 %. Nyt kysytyn prosentin perusarvo on annetut äänet, joten jaetaan niiden osuudella. Kun kokonaismäärä tunnetaan, saat myös lukumäärän: jos äänioikeutettuja on 450, Miraa äänesti 0,16 · 450 = 72."},{"tyyppi":"kappale","otsikko":"Ratkaistu esimerkki 1: markkinaosuus","sisalto":"Tehtävä: Urheilujuoman markkinaosuus oli 20 %. Seuraavana vuonna juoman myynti kasvoi 30 % ja kaikkien urheilujuomien myynti 4 %. Mikä oli juoman uusi markkinaosuus? Markkinaosuus kertoo, montako prosenttia tuotteen myynti on koko markkinan myynnistä, eli sen perusarvo on kaikkien saman alan tuotteiden yhteenlaskettu myynti. Tässä muuttuvat sekä osa että perusarvo. Suunnitelma: (1) valitaan koko markkinan myynniksi aluksi 100; (2) lasketaan juoman myynti ennen ja jälkeen; (3) lasketaan koko markkinan myynti jälkeen; (4) jaetaan juoman uusi myynti koko markkinan uudella myynnillä. Lasku: (1) Koko markkina aluksi 100. (2) Juoman myynti aluksi 20 % sadasta eli 20 (perusarvo: koko markkina aluksi), kasvun jälkeen 1,30 · 20 = 26 (perusarvo: juoman vanha myynti). (3) Koko markkina kasvun jälkeen 1,04 · 100 = 104 (perusarvo: koko markkinan vanha myynti). (4) Uusi markkinaosuus on 26 : 104 = 0,25 = 25 % (perusarvo: koko markkinan uusi myynti). Tarkistus: juoman myynti kasvoi prosentteina enemmän kuin koko markkina, joten osuuden pitikin kasvaa, mutta vähemmän kuin 30 %. Kertoimilla sama lasku on 20 % · 1,30 : 1,04 = 25 %."},{"tyyppi":"kappale","otsikko":"Ratkaistu esimerkki 2: palkkio uudesta hinnasta","sisalto":"Tehtävä: Sähköpotkulaudan hinta laski 20 %. Myyjän palkkio oli ollut 10 % myyntihinnasta, ja samalla se nostettiin 13 %:iin uudesta myyntihinnasta. Montako prosenttia palkkio euroina muuttui, ja nousiko se vai laskiko? Suunnitelma: (1) valitaan vanhaksi hinnaksi 100 €; (2) lasketaan vanha palkkio; (3) lasketaan uusi hinta ja uusi palkkio; (4) lasketaan palkkion muutos prosentteina vanhasta palkkiosta. Lasku: (1) Vanha hinta 100 €. (2) Vanha palkkio 0,10 · 100 € = 10 € (perusarvo: vanha hinta). (3) Uusi hinta 0,80 · 100 € = 80 € (perusarvo: vanha hinta), uusi palkkio 0,13 · 80 € = 10,40 € (perusarvo: uusi hinta). (4) Palkkio nousi 0,40 €, ja 0,40 : 10 = 0,04 = 4 % (perusarvo: vanha palkkio). Palkkio nousi 4 %. Huomaa, että palkkioprosentti nousi 3 prosenttiyksikköä mutta 30 %, koska 3 : 10 = 0,30. Pikalasku \"3 − 20 = −17, eli palkkio laski 17 %\" sekoittaa prosenttiyksiköt ja prosentit ja vähentää toisistaan prosentteja, joilla on eri perusarvo. Se antaa jopa väärän suunnan. Kertoimilla oikea lasku on 0,80 · 1,30 = 1,04. Samalla tavalla lasketaan käteen jäävän palkan muutos, kun veroprosentti muuttuu. Veroprosentti kertoo, montako prosenttia palkasta menee veroihin, ja käteen jää loput (taulukko alempana)."},{"tyyppi":"kappale","otsikko":"Osat ja kokonaisuus","sisalto":"Koulun kahdelle osastolle haettiin näin. Osastolle A haki 160 tyttöä, joista hyväksyttiin 24, ja 50 poikaa, joista hyväksyttiin 6. Osastolle B haki 30 tyttöä, joista hyväksyttiin 18, ja 300 poikaa, joista hyväksyttiin 165. Osastolla A tyttöjen hyväksymisprosentti on 24 : 160 = 15 % ja poikien 6 : 50 = 12 %. Osastolla B tyttöjen prosentti on 18 : 30 = 60 % ja poikien 165 : 300 = 55 %. Tytöillä prosentti on kummallakin osastolla suurempi. Koko koulussa tyttöjä haki 190 ja hyväksyttiin 42, joten prosentti on 42 : 190 ≈ 22,1 %. Poikia haki 350 ja hyväksyttiin 171, joten prosentti on 171 : 350 ≈ 48,9 %. Koko koulussa poikien prosentti on yli kaksinkertainen. Miten tämä on mahdollista? Osien prosenteilla on eri perusarvot: tyttöjen 15 %:n perusarvo on 160 hakijaa, 60 %:n perusarvo 30 hakijaa. Koko koulun prosentti lasketaan kaikista hakijoista, joten se on lähempänä sen osaston prosenttia, jolle haki enemmän. Useimmat tytöt hakivat osastolle A, jonne hyväksyttiin pieni osa, ja useimmat pojat osastolle B, jonne hyväksyttiin suuri osa. Kahden osan kokonaisprosentti on osien prosenttien välissä, mutta sen paikka välissä riippuu siitä, kuinka monta kumpaankin osaan kuuluu. Siksi osien prosentteja ei lasketa yhteen eikä niistä oteta tavallista keskiarvoa. Kun osien koot tiedetään prosentteina, kokonaisuuden prosentti saadaan osuuden osuuksista: jos seuran jäsenistä 60 % on junioreita ja junioreista 50 % ja aikuisista 20 % osallistuu talkoisiin, osallistujia on 0,60 · 50 % + 0,40 · 20 % = 30 % + 8 % = 38 % kaikista jäsenistä. Tässä yhteenlasku on sallittu, koska molempien lukujen 30 % ja 8 % perusarvo on sama, kaikki jäsenet."},{"tyyppi":"saanto","otsikko":"Näin ratkaiset, kun perusarvo vaihtuu","askeleet":["Lue jokaisesta prosentista, mihin se verrataan, ja kirjoita perusarvo näkyviin, esimerkiksi \"25 % annetuista äänistä, perusarvo: annetut äänet\".","Jos tehtävässä on pelkkiä prosentteja eikä yhtään euromäärää tai lukumäärää, valitse alkuarvo itse, esimerkiksi 100. Valinta toimii, koska kaikki määrät muuttuvat samassa suhteessa. Kun tehtävä antaa määriä (kuten perusmaksun euroina), laske niillä.","Laske jokaisen vaiheen määrä (euroa, katsojia, ääniä) kertoimella. Älä laske yhteen äläkä vähennä prosentteja, joilla on eri perusarvo.","Laske kysytty prosentti jakamalla muutos tai osa sillä arvolla, johon tehtävä käskee verrata. Pyöristä vasta lopputulos.","Tarkista suunta ja suuruus: vähennyksen kumoaa suurempi ja korotuksen pienempi prosentti; osuuden osuus on pienempi kuin kumpikaan osuus, kun molemmat ovat alle 100 %; kahden osan kokonaisprosentti on osien prosenttien välissä. Nämä tarkistukset eivät paljasta prosenttien vähentämistä eivätkä tavallista keskiarvoa, koska niidenkin tulos voi täyttää ehdot. Varmista siksi myös, että laskit määrät (esimerkiksi ääniä tai hakijoita) ja jaoit oikealla perusarvolla."]},{"tyyppi":"taulukko","otsikko":"Sama keino, eri tilanteet","otsikkorivi":["Tilanne","Valitse alkuarvot","Laske määrät","Vastaus"],"rivit":[["Hinnat nousevat 5 % ja viikkoraha 15 %. Montako prosenttia enemmän tavaraa viikkorahalla saa?","Hinta 1 €, viikkoraha 100 €: ennen saa 100 kpl.","Hinta 1,05 €, viikkoraha 115 €: nyt saa 115 : 1,05 ≈ 109,52 kpl.","9,52 : 100 ≈ 9,5 % enemmän (perusarvo: ennen saatu määrä)."],["Palkka nousee 10 % ja veroprosentti 20 %:sta 25 %:iin. Montako prosenttia käteen jäävä palkka muuttuu?","Palkka 100 €: käteen 0,80 · 100 € = 80 € (perusarvo: vanha palkka).","Palkka 110 €: käteen 0,75 · 110 € = 82,50 € (perusarvo: uusi palkka).","2,50 : 80 ≈ 3,1 % enemmän (perusarvo: vanha käteen jäävä palkka)."],["Sähkön perusmaksu 20 € kuukaudessa ja energiamaksu 0,10 €/kWh nousevat 10 %. Kulutus on 800 kWh. Montako prosenttia kulutusta pitää vähentää, jotta lasku pysyy samana?","Lasku nyt 20 € + 800 · 0,10 € = 100 €.","Uusi perusmaksu 22 € ja energiamaksu 0,11 €/kWh. Energiaan jää 100 € − 22 € = 78 €, eli 78 : 0,11 ≈ 709,1 kWh.","800 − 709,1 = 90,9 kWh ja 90,9 : 800 ≈ 11,4 % (perusarvo: nykyinen kulutus)."],["Seuran jäsenistä 60 % on junioreita. Kaikista jäsenistä 38 % ja junioreista 50 % osallistui talkoisiin. Montako prosenttia aikuisista osallistui?","100 jäsentä: 60 junioria ja 40 aikuista.","Osallistujia 38, heistä junioreita 0,50 · 60 = 30 ja aikuisia 38 − 30 = 8.","8 : 40 = 0,20 = 20 % (perusarvo: aikuiset)."]]},{"tyyppi":"ansa","otsikko":"Ansat 1 ja 2: perusarvo vaihtui, mutta lasku ei","sisalto":"Ansa 1: palautus samalla prosentilla. Katsojamäärä väheni 40 %, ja houkutteleva vastaus on, että sen pitää kasvaa 40 %. Kasvu lasketaan kuitenkin pienemmästä, 3 000 katsojan määrästä, joten 40 % tuo vain 1 200 katsojaa eikä 2 000. Oikea vastaus on 2 000 : 3 000 ≈ 66,7 %. Sama virhe toiseen suuntaan: 20 %:n korotusta ei kumoa 20 %:n alennus vaan noin 16,7 %:n alennus. Ansa 2: markkinaosuudessa koko markkinan kasvu unohtuu. Urheilujuoman markkinaosuus oli 20 %, juoman myynti kasvoi 30 % ja koko markkina 4 %. Houkutteleva lasku on 20 % · 1,30 = 26 %. Se olettaa, että markkinaosuuden perusarvo eli koko markkinan myynti pysyi ennallaan. Kun perusarvokin kasvaa, osuus on 26 : 104 = 25 %. Jos koko markkina kasvaa prosentteina enemmän kuin tuotteen myynti, osuus pienenee, vaikka myynti kasvaa. Myynnin kasvu yksin ei siis kerro, mitä markkinaosuudelle tapahtuu."},{"tyyppi":"ansa","otsikko":"Ansat 3 ja 4: eri perusarvon prosentteja yhdistetään suoraan","sisalto":"Ansa 3: osien prosenteista otetaan keskiarvo tai ne lasketaan yhteen. Osastoesimerkissä tyttöjen prosentit olivat 15 % ja 60 %. Keskiarvo (15 % + 60 %) : 2 = 37,5 % on väärin, koska osastoille haki eri määrä tyttöjä. Oikea koko koulun prosentti on 42 : 190 ≈ 22,1 %. Summa 15 % + 60 % = 75 % on vielä kauempana. Tavallinen keskiarvo antaa oikean tuloksen, jos kummassakin osassa on yhtä monta (tai jos osien prosentit ovat samat), mutta tätä ei voi olettaa. Laske siksi lukumäärät yhteen ja jaa kokonaismäärällä. Ansa 4: osuuden osuus vähennetään tai lasketaan yhteen. Äänestysprosentti oli 64 %, ja Mira sai 25 % annetuista äänistä. Lasku 64 % − 25 % = 39 % tai 64 % + 25 % = 89 % ei tarkoita mitään, koska 64 %:n perusarvo on äänioikeutetut ja 25 %:n annetut äänet. Prosentti prosenttiosuudesta lasketaan kertomalla: 0,25 · 0,64 = 0,16 = 16 %. Tarkistus: tuloksen pitää olla pienempi kuin 25 %, koska kaikki äänioikeutetut eivät äänestäneet. Tämä tarkistus ei yksin riitä, koska vähennyslaskun tulos voi toisilla luvuilla olla pienempi kuin kumpikin prosentti. Varmista siksi laskemalla sadalla äänioikeutetulla: äänestäjiä on 64, ja Mira saa niistä 25 % eli 16 ääntä, joten hän sai 16 % äänioikeutettujen äänistä."}],"harjoitusryhmat":[{"id":"tyokalut","nimi":"Työkalut","info":"Laskin on sallittu. Kirjoita vihkoon jokaisen prosentin perusarvo. Anna vastaus pyydetyllä tarkkuudella ilman %-merkkiä."},{"id":"vaiheet","nimi":"Kaksi tai kolme vaihetta","info":"Laskin on sallittu. Jos alkuarvoa ei anneta, valitse se itse (esimerkiksi 100) ja laske määrät vaihe kerrallaan. Pyöristä vasta lopputulos."},{"id":"ylikurssi","nimi":"Ylikurssi","info":"Laskin on sallittu. Osa tehtävistä on mukailtu vanhoista ylioppilastehtävistä. Kirjoita ensin suunnitelma vihkoon ja nimeä jokaisen vaiheen perusarvo."}],"harjoitukset":[{"id":"H01","ryhma":"tyokalut","kysymys":"Kirjaston lainamäärä väheni 25 %. Montako prosenttia lainamäärän pitää kasvaa, jotta päästään entiseen määrään? Anna vastaus prosentteina kymmenesosan tarkkuudella ilman %-merkkiä.","vastaus":33.3,"vinkki":"Valitse lainamääräksi aluksi 100. Kasvu lasketaan vähentyneestä määrästä.","selitys":"Lainoja 100 → 75 (perusarvo: alkuperäinen määrä). Entiseen tarvitaan 25 lainaa lisää, ja kasvun perusarvo on 75: 25 : 75 = 0,333… ≈ 33,3 %. Kertoimilla 1 : 0,75 = 1,333… Vastaus 25 on ansa 1: kasvu laskettaisiin silloin alkuperäisestä määrästä."},{"id":"H02","ryhma":"tyokalut","kysymys":"Bussilipun hinta nousi 25 %. Montako prosenttia uutta hintaa pitää alentaa, jotta päästään entiseen hintaan? Anna vastaus prosentteina ilman %-merkkiä.","vastaus":20,"vinkki":"Valitse vanhaksi hinnaksi 100 €. Alennuksen perusarvo on uusi, suurempi hinta.","selitys":"Hinta 100 € → 125 €. Paluuseen tarvitaan 25 euron alennus, jonka perusarvo on 125 €: 25 : 125 = 0,20 = 20 %. Kertoimilla 1 : 1,25 = 0,80. Vastaus 25 on ansa 1."},{"id":"H03","ryhma":"tyokalut","kysymys":"Nuorisovaltuuston vaalissa äänestysprosentti oli 75 %, ja ehdokas sai 48 % annetuista äänistä. Montako prosenttia äänioikeutetuista äänesti ehdokasta? Anna vastaus prosentteina ilman %-merkkiä.","vastaus":36,"vinkki":"48 % lasketaan annetuista äänistä, jotka ovat 75 % äänioikeutetuista. Kerro kertoimet.","selitys":"0,48 · 0,75 = 0,36 = 36 %. Sadasta äänioikeutetusta äänesti 75, ja heistä 48 % eli 36 äänesti ehdokasta. Vastaus 27 (75 − 48) tai 123 (75 + 48) on ansa 4."},{"id":"H04","ryhma":"tyokalut","kysymys":"Vaalissa ehdokasta äänesti 15 % äänioikeutetuista, ja äänestysprosentti oli 60 %. Montako prosenttia annetuista äänistä ehdokas sai? Anna vastaus prosentteina ilman %-merkkiä.","vastaus":25,"vinkki":"Kysytyn prosentin perusarvo on annetut äänet. Jaa ehdokkaan osuus äänestäneiden osuudella.","selitys":"Sadasta äänioikeutetusta 60 äänesti ja 15 äänesti ehdokasta. Annetuista äänistä ehdokas sai 15 : 60 = 0,25 = 25 %. Vastaus 9 (0,15 · 60) syntyy, jos kerrotaan eikä jaeta."},{"id":"H05","ryhma":"tyokalut","kysymys":"Kahteen kahvilaan haettiin kesätöihin.\nKahvila 1: hakijoita 150, valittiin 30.\nKahvila 2: hakijoita 50, valittiin 20.\n\nMontako prosenttia kaikista hakijoista valittiin? Anna vastaus prosentteina ilman %-merkkiä.","vastaus":25,"vinkki":"Laske valitut yhteen ja hakijat yhteen. Älä ota kahviloiden prosenteista keskiarvoa.","selitys":"Valittuja 30 + 20 = 50 ja hakijoita 150 + 50 = 200, joten 50 : 200 = 0,25 = 25 %. Kahviloiden prosentit ovat 20 % ja 40 %, ja niiden keskiarvo 30 % on ansa 3: kahvilaan 1 haki kolme kertaa enemmän."},{"id":"H06","ryhma":"tyokalut","kysymys":"Tuotteen markkinaosuus on 20 %. Mistä luvusta 20 % on laskettu?","vastaus":0,"vinkki":"Markkinaosuus vertaa tuotteen myyntiä koko markkinaan.","selitys":"Markkinaosuuden perusarvo on koko markkinan myynti eli kaikkien saman alan tuotteiden yhteenlaskettu myynti, tuote itse mukaan lukien. Jos osuutta verrattaisiin kilpailijoiden myyntiin, 20 %:n osuus olisi 20 : 80 = 25 %.","tyyppi":"monivalinta","vaihtoehdot":["Koko markkinan myynnistä eli kaikkien saman alan tuotteiden yhteenlasketusta myynnistä.","Tuotteen omasta myynnistä edellisenä vuonna.","Kilpailijoiden yhteenlasketusta myynnistä ilman tätä tuotetta."]},{"id":"H07","ryhma":"tyokalut","kysymys":"Koulussa on 800 oppilasta. Kyselyyn vastasi 85 % oppilaista, ja vastanneista 40 % kulkee kouluun pyörällä. Montako kyselyyn vastannutta kulkee kouluun pyörällä?","vastaus":272,"vinkki":"Laske ensin vastanneiden määrä (perusarvo: kaikki oppilaat), sitten pyöräilijät (perusarvo: vastanneet).","selitys":"Vastanneita 0,85 · 800 = 680. Pyöräilijöitä 0,40 · 680 = 272. Kertoimilla 0,40 · 0,85 · 800 = 272. Vastaus 320 syntyy, jos 40 % lasketaan kaikista oppilaista."},{"id":"H08","ryhma":"vaiheet","kysymys":"Kaurajuoman markkinaosuus oli 16 %. Seuraavana vuonna kaurajuoman myynti kasvoi 35 % ja kaikkien kasvijuomien myynti 8 %. Mikä oli kaurajuoman uusi markkinaosuus? Anna vastaus prosentteina ilman %-merkkiä.","vastaus":20,"vinkki":"Valitse koko markkinaksi aluksi 100. Laske kaurajuoman ja koko markkinan myynti kasvun jälkeen.","selitys":"Koko markkina 100, kaurajuoma 16. Kasvun jälkeen kaurajuoma 1,35 · 16 = 21,6 ja koko markkina 1,08 · 100 = 108. Uusi osuus 21,6 : 108 = 0,20 = 20 %. Vastaus 21,6 on ansa 2: koko markkinan kasvu unohtui."},{"id":"H09","ryhma":"vaiheet","kysymys":"Pelikonsolin markkinaosuus oli 22 %. Konsolin myynti kasvoi 18 % ja kaikkien konsolien myynti 6 %. Mikä oli konsolin uusi markkinaosuus? Anna vastaus prosentteina kymmenesosan tarkkuudella ilman %-merkkiä.","vastaus":24.5,"vinkki":"Osuus · myynnin kerroin : koko markkinan kerroin.","selitys":"22 · 1,18 = 25,96 ja 25,96 : 1,06 = 24,49… ≈ 24,5 %. Vastaus 26,0 on ansa 2."},{"id":"H10","ryhma":"vaiheet","kysymys":"Pyöräkypärämerkin markkinaosuus nousi 12 %:sta 15 %:iin, ja samaan aikaan kaikkien pyöräkypärien myynti kasvoi 8 %. Montako prosenttia merkin myynti kasvoi? Anna vastaus prosentteina ilman %-merkkiä.","vastaus":35,"vinkki":"Valitse koko markkinaksi aluksi 100. Laske merkin myynti ennen ja jälkeen.","selitys":"Koko markkina 100 → 108. Merkin myynti ennen 12 (perusarvo: vanha markkina) ja jälkeen 0,15 · 108 = 16,2 (perusarvo: uusi markkina). Kasvu 4,2 : 12 = 0,35 = 35 %. Vastaus 25 (osuuden muutos 3 : 12) unohtaa koko markkinan kasvun."},{"id":"H11","ryhma":"vaiheet","kysymys":"Urheiluseuran jäsenistä 70 % on junioreita. Junioreista 30 % ja aikuisista 60 % osallistui talkoisiin. Montako prosenttia kaikista jäsenistä osallistui talkoisiin? Anna vastaus prosentteina ilman %-merkkiä.","vastaus":39,"vinkki":"Valitse jäseniä olevan 100. Montako junioria ja montako aikuista osallistui?","selitys":"100 jäsentä: 70 junioria ja 30 aikuista. Osallistujia 0,30 · 70 + 0,60 · 30 = 21 + 18 = 39, eli 39 %. Keskiarvo 45 % on ansa 3: junioreita on enemmän kuin aikuisia."},{"id":"H12","ryhma":"vaiheet","kysymys":"Sähköpyörän myyntihinta laski 10 %. Myyjän palkkio oli ollut 5 % myyntihinnasta, ja samalla se nostettiin 6 %:iin uudesta myyntihinnasta. Montako prosenttia palkkio euroina nousi? Anna vastaus prosentteina ilman %-merkkiä.","vastaus":8,"vinkki":"Valitse vanhaksi hinnaksi 100 €. Laske vanha ja uusi palkkio euroina.","selitys":"Vanha palkkio 0,05 · 100 € = 5 €. Uusi hinta 90 €, uusi palkkio 0,06 · 90 € = 5,40 €. Muutos 0,40 : 5 = 0,08 = 8 %. Kertoimilla 0,90 · 1,20 = 1,08. Pikalasku 1 − 10 = −9 sekoittaa prosenttiyksiköt ja prosentit."},{"id":"H13","ryhma":"vaiheet","kysymys":"Kesätyöntekijän palkka nousi 15 %, ja samalla veroprosentti nousi 20 %:sta 22 %:iin. Montako prosenttia käteen jäävä palkka nousi? Anna vastaus prosentteina kymmenesosan tarkkuudella ilman %-merkkiä.","vastaus":12.1,"vinkki":"Valitse vanhaksi palkaksi 100 €. Käteen jää 100 % − veroprosentti.","selitys":"Vanha palkka 100 €, käteen 80 €. Uusi palkka 115 €, käteen 0,78 · 115 € = 89,70 €. Muutos 9,70 : 80 = 0,121… ≈ 12,1 %. Vastaus 13 (15 − 2) vähentää prosenttiyksiköt prosenteista."},{"id":"H14","ryhma":"vaiheet","kysymys":"Elokuvalipun hinta nousi 12 %, ja Veeran viikkoraha nousi 20 %. Montako prosenttia enemmän elokuvalippuja Veera voi ostaa viikkorahallaan kuin ennen? Anna vastaus prosentteina kymmenesosan tarkkuudella ilman %-merkkiä.","vastaus":7.1,"vinkki":"Valitse lipun hinnaksi 1 € ja viikkorahaksi 100 €. Montako lippua saa ennen ja nyt?","selitys":"Ennen 100 lippua, nyt 120 : 1,12 = 107,14… lippua. Muutos 7,14… : 100 ≈ 7,1 %. Vastaus 8 (20 − 12) on väärin, koska viikkorahan ja hinnan prosenteilla on eri perusarvot."},{"id":"H15","ryhma":"ylikurssi","kysymys":"Pelin pelaajamäärä väheni 30 %, ja seuraavana kuukautena se kasvoi 25 %. Montako prosenttia pelaajamäärän pitää vielä kasvaa, jotta päästään alkuperäiseen määrään? Anna vastaus prosentteina kymmenesosan tarkkuudella ilman %-merkkiä.","vastaus":14.3,"vinkki":"Valitse pelaajia aluksi 100. Laske määrä kummankin muutoksen jälkeen.","selitys":"100 → 70 (perusarvo: alkuperäinen) → 1,25 · 70 = 87,5 (perusarvo: 70). Puuttuu 12,5, ja kasvun perusarvo on 87,5: 12,5 : 87,5 = 0,142… ≈ 14,3 %. Vastaus 5 (30 − 25) on ansa 1."},{"id":"H16","ryhma":"ylikurssi","kysymys":"Urheiluseuran jäsenistä 40 % on junioreita. Kaikista jäsenistä 33 % ja junioreista 45 % kävi seuran kesäleirillä. Montako prosenttia aikuisista kävi seuran kesäleirillä? Anna vastaus prosentteina ilman %-merkkiä.","vastaus":25,"vinkki":"Valitse jäseniä olevan 100. Montako leiriläistä oli junioreita, montako aikuisia?","selitys":"100 jäsentä: 40 junioria ja 60 aikuista. Leiriläisiä 33, heistä junioreita 0,45 · 40 = 18 ja aikuisia 15. Aikuisista 15 : 60 = 0,25 = 25 %. Vastaus 21 (2 · 33 − 45) olettaa, että junioreita ja aikuisia on yhtä monta."},{"id":"H17","ryhma":"ylikurssi","kysymys":"Asunnon sähkölasku koostuu perusmaksusta 20 € kuukaudessa ja energiamaksusta 0,12 € kilowattitunnilta. Kulutus on 1 000 kWh kuukaudessa. Molemmat maksut nousevat 10 %. Montako prosenttia kulutusta on vähennettävä, jotta kuukausilasku pysyy ennallaan? Anna vastaus prosentteina kymmenesosan tarkkuudella ilman %-merkkiä.","vastaus":10.6,"vinkki":"Laske nykyinen lasku. Paljonko siitä jää energiaan uuden perusmaksun jälkeen?","selitys":"Lasku nyt 20 € + 1 000 · 0,12 € = 140 €. Uusi perusmaksu 22 €, energiamaksu 0,132 €/kWh. Energiaan jää 140 € − 22 € = 118 €, eli 118 : 0,132 ≈ 893,9 kWh. Vähennys 106,1 : 1 000 ≈ 10,6 %. Vastaus 10 tai 9,1 unohtaa, että perusmaksu nousee, vaikka kulutus pienenee."},{"id":"H18","ryhma":"ylikurssi","kysymys":"Koulun kahdelle osastolle haettiin näin.\nOsasto A: tyttöjä haki 240, hyväksyttiin 36; poikia haki 40, hyväksyttiin 4.\nOsasto B: tyttöjä haki 20, hyväksyttiin 9; poikia haki 300, hyväksyttiin 120.\n\nMikä on tyttöjen hyväksymisprosentti koko koulussa? Anna vastaus prosentteina kymmenesosan tarkkuudella ilman %-merkkiä.","vastaus":17.3,"vinkki":"Laske hyväksytyt tytöt yhteen ja hakeneet tytöt yhteen.","selitys":"Tyttöjä hyväksyttiin 36 + 9 = 45 ja haki 240 + 20 = 260, joten 45 : 260 ≈ 17,3 %. Osastoilla tyttöjen prosentit ovat 15 % ja 45 % (poikien 10 % ja 40 %), mutta koko koulussa poikien prosentti on 124 : 340 ≈ 36,5 %. Keskiarvo 30 % on ansa 3."},{"id":"H19","ryhma":"ylikurssi","kysymys":"Tyttöjen hyväksymisprosentti oli osastolla A suurempi kuin poikien ja osastolla B suurempi kuin poikien, mutta koko koulussa pienempi kuin poikien. Mikä selittää tämän?","vastaus":0,"vinkki":"Mieti, kummalle osastolle useimmat tytöt ja useimmat pojat hakivat.","selitys":"Koko koulun prosentti lasketaan kaikista hakijoista, joten se painottuu sen osaston prosenttiin, jolle haki enemmän. Kun useimmat tytöt hakevat osastolle, jonne pääsee harva, tyttöjen kokonaisprosentti jää pieneksi. Kokonaisprosentti ei ole osastojen prosenttien tavallinen keskiarvo, eikä kyse ole pyöristyksestä.","tyyppi":"monivalinta","vaihtoehdot":["Useimmat tytöt hakivat osastolle, jonne hyväksyttiin pieni osa hakijoista, ja useimmat pojat osastolle, jonne hyväksyttiin suuri osa.","Koko koulun prosentti on osastojen prosenttien tavallinen keskiarvo, ja keskiarvo voi kääntää järjestyksen.","Laskuissa on pyöristysvirhe, koska järjestys ei voi oikeasti kääntyä."]},{"id":"H20","ryhma":"ylikurssi","kysymys":"Älykellomerkin myynti kasvoi 10 %, mutta sen markkinaosuus laski 33 %:sta 30 %:iin. Montako prosenttia kaikkien älykellojen myynti kasvoi? Anna vastaus prosentteina ilman %-merkkiä.","vastaus":21,"vinkki":"Valitse koko markkinaksi aluksi 100. Merkin myynti oli 33. Mikä koko markkina antaa uudeksi osuudeksi 30 %?","selitys":"Merkin myynti 33 → 1,10 · 33 = 36,3. Uusi koko markkina x toteuttaa 0,30x = 36,3, joten x = 121. Koko markkina kasvoi 21 : 100 = 21 %. Myynti kasvoi, mutta koko markkina kasvoi enemmän, joten osuus pieneni."}],"valmis_teksti":"Osaat ratkaista prosenttitehtäviä, joissa perusarvo vaihtuu kesken tehtävän: palautuksen ennalleen, osuuden osuuden, markkinaosuuden muutoksen ja palkkion uudesta hinnasta. Nimeät jokaisessa vaiheessa, mihin verrataan, perustelet tuloksen laskemalla ja osaat selittää, miksi osien prosentit eivät yhdisty suoraan kokonaisuuden prosentiksi. Tämä taito on nyt näytetty."};

const svg=document.getElementById("nlsvg"), rng=document.getElementById("nlrange"), out=document.getElementById("nlout");
const X0=34, X1=606, Y=62;
function piirraNL(v){
  const ala=Math.floor(v/10)*10, yla=ala+10, puoli=ala+5;
  const pyor = (v%10)>=5 ? yla : ala;
  const x = n => X0 + (n/100)*(X1-X0);
  let s=`<line class="rail" x1="${X0}" y1="${Y}" x2="${X1}" y2="${Y}"/>`;
  for(let n=0;n<=100;n+=10){
    const near = (n===ala||n===yla);
    s+=`<line class="tick" x1="${x(n)}" y1="${Y-7}" x2="${x(n)}" y2="${Y+7}"/>`;
    s+=`<text class="stop${near?" near":""}" x="${x(n)}" y="${Y+24}" text-anchor="middle">${n}</text>`;
  }
  s+=`<line class="halfway" x1="${x(puoli)}" y1="${Y-16}" x2="${x(puoli)}" y2="${Y+12}"/>`;
  s+=`<text class="stop" x="${x(puoli)}" y="${Y-22}" text-anchor="middle">puoliväli ${puoli}</text>`;
  s+=`<circle class="dot" cx="${x(v)}" cy="${Y}" r="6"/>`;
  s+=`<text class="val" x="${x(v)}" y="${Y-32}" text-anchor="middle">${v}</text>`;
  s+=`<path d="M ${x(v)} ${Y+38} L ${x(pyor)} ${Y+38}" stroke="var(--core)" stroke-width="2" fill="none"/>`;
  s+=`<path d="M ${x(pyor)} ${Y+38} l ${x(pyor)>x(v)?-7:7} -4 l 0 8 z" fill="var(--core)"/>`;
  svg.innerHTML=s;
  out.textContent = `${v} pyöristyy → ${pyor}`;
}

const ljExp=document.getElementById("ljExp");

  let ljI=0, ljTokens=[], ljStep=0;
  const laske=(a,op,b)=>{a=+a;b=+b;return op==="×"?a*b:op==="÷"?a/b:op==="+"?a+b:a-b;};
  function ljAlku(){
    const l=D.kokeilu[ljI];
    ljTokens=l.lauseke.replace(/\(/g,"( ").replace(/\)/g," )").split(/\s+/).filter(Boolean);

  }
  function ljViesti(t,lk){const f=document.getElementById("ljFb"); f.textContent=t; f.className="lj-fb "+(lk||"");}
  function ljPiirra(){
    const l=D.kokeilu[ljI];
    document.getElementById("ljStep").textContent =
      ljStep>=l.askeleet.length ? "valmis" : `askel ${ljStep+1} / ${l.askeleet.length}`;
    if(ljStep>=l.askeleet.length){
      ljExp.innerHTML=`<span class="valmis">${l.lauseke} = ${l.vastaus}</span>`;
      return;
    }
    ljExp.innerHTML=ljTokens.map((t,i)=>
      "×÷+−".includes(t) ? `<button type="button" class="op" data-i="${i}">${t}</button>`
                         : `<span class="tok">${t}</span>`).join("");
    ljExp.querySelectorAll("button.op").forEach(b=>b.addEventListener("click",()=>ljKlikkaa(+b.dataset.i)));
  }
  function ljKlikkaa(i){
    const l=D.kokeilu[ljI], odotettu=l.askeleet[ljStep];
    const ehdotus=[ljTokens[i-1],ljTokens[i],ljTokens[i+1]].join(" ");
    if(ehdotus!==odotettu){
      ljViesti(ljStep===0
        ? "Ei vielä. Sulkeet ovat vahvimmat, sitten kerto ja jako. Yhtä vahvat vasemmalta oikealle."
        : "Ei vielä. Kumpi jäljellä olevista on vahvempi?", "no");
      return;
    }
    const arvo=laske(ljTokens[i-1],ljTokens[i],ljTokens[i+1]);
    let alku=i-1, loppu=i+1;
    if(ljTokens[i-2]==="(" && ljTokens[i+2]===")"){ alku=i-2; loppu=i+2; }
    ljTokens.splice(alku, loppu-alku+1, String(arvo));
    ljStep++;
    ljViesti(ljStep>=l.askeleet.length ? "Valmis. Vastaus on "+l.vastaus+"." : "Oikein. Jatka seuraavaan.", "ok");
    ljPiirra();
  }

    ljI=(ljI+1)%D.kokeilu.length; ljAlku();

}

/* Suomalainen lukumuoto: välilyönti on tuhaterotin, pilkku desimaalierotin.
   Piste voi olla kumpi tahansa. Se tulkitaan tuhaterottimeksi VAIN silloin, kun
   koko luku on aitoa tuhaterotinmuotoa: alkuosa 1–3 numeroa ilman etunollaa ja
   jokainen jatko-osa täsmälleen 3 numeroa (1.500, 12.345.678). Kaikissa muissa
   tapauksissa piste on desimaalipiste — myös 0.125, joka vanhalla säännöllä
   ("3 numeroa pisteen jäljessä = tuhaterotin") luettiin virheellisesti luvuksi 125. */
const TUHATEROTIN = /^[1-9]\d{0,2}(\.\d{3})+$/;
function lueLuku(teksti){
  // Murtoluku (3/4, -3/4) ja sekaluku (1 2/3, -1 2/3) hyväksytään sellaisinaan.
  const raaka = String(teksti).replace(/\u00a0/g, " ").trim();
  let m = raaka.match(/^(-?)(\d+)\s+(\d+)\s*\/\s*(\d+)$/);
  if(m){ const nim = Number(m[4]); if(nim === 0) return null;
    const v = Number(m[2]) + Number(m[3]) / nim; return m[1] ? -v : v; }
  m = raaka.match(/^(-?)\s*(\d+)\s*\/\s*(\d+)$/);
  if(m){ const nim = Number(m[3]); if(nim === 0) return null;
    const v = Number(m[2]) / nim; return m[1] ? -v : v; }
  let s = String(teksti).replace(/[\s\u00a0]/g, "");
  if(s === "") return null;
  if(s.indexOf(",") >= 0){
    s = s.replace(/\./g, "").replace(",", ".");
  } else if(TUHATEROTIN.test(s)){
    s = s.replace(/\./g, "");
  }
  const n = Number(s);
  return Number.isFinite(n) ? n : null;
}

function tarkista(id){
  const h=D.harjoitukset.find(x=>x.id===id);
  const kentta=document.getElementById("in-"+id);
  const fb=document.getElementById("fb-"+id);
  if(kentta.value.trim()===""){ fb.className="fb hint"; fb.textContent="Kirjoita vastaus ensin."; return; }
  const luku=lueLuku(kentta.value);
  if(luku===null){ fb.className="fb no"; fb.textContent="Vastauksen pitää olla luku tai murtoluku (esimerkiksi 3/4)."; return; }
  const oikein = Math.abs(luku - h.vastaus) < 1e-9;
  merkitseTulos(id, oikein, oikein ? "Oikein. "+h.selitys : `Ei vielä. ${h.vinkki} Kokeile uudelleen.`);
}

}

/* Kuuntelu: selain lukee tekstin ääneen omalla puhesynteesillään (englanniksi, jos laitteessa on
   englanninkielinen ääni). Ei äänitiedostoja eikä verkkoyhteyttä. Jos laite ei osaa puhua,
   teksti näytetään luettavaksi — silloin tehtävä muuttuu luetun ymmärtämiseksi, mutta ei katkea. */
function puhu(id, nopeus){
  const h=D.harjoitukset.find(x=>x.id===id); if(!h || !h.kuuntele) return;
  const vara=document.getElementById("vara-"+id);
  const naytaTeksti=syy=>{ vara.hidden=false; vara.textContent=syy+" Teksti: "+h.kuuntele; };
  if(!("speechSynthesis" in window)){ naytaTeksti("Tämä laite ei osaa lukea ääneen."); return; }
  const s=window.speechSynthesis; s.cancel();
  const u=new SpeechSynthesisUtterance(h.kuuntele);
  u.lang=h.kieli||"en-GB"; u.rate=nopeus;
  const aanet=s.getVoices(), kieli=u.lang.slice(0,2);
  const aani=aanet.find(a=>a.lang===u.lang) || aanet.find(a=>a.lang && a.lang.startsWith(kieli));
  if(aani) u.voice=aani;
  else if(aanet.length) { naytaTeksti("Laitteessa ei ole englanninkielistä ääntä."); return; }
  u.onerror=()=>naytaTeksti("Ääneen lukeminen ei onnistunut.");
  s.speak(u);
}

document.getElementById("harjoitukset").addEventListener("click",e=>{
  const k=e.target.closest("[data-kuuntele]"), hk=e.target.closest("[data-hitaasti]");
  if(k) puhu(k.dataset.kuuntele, 0.9);
  if(hk) puhu(hk.dataset.hitaasti, 0.6);
  const t=e.target.closest("[data-tarkista]"), v=e.target.closest("[data-vinkki]"), mv=e.target.closest("[data-mv]");
  if(t) tarkista(t.dataset.tarkista);
  if(mv) tarkistaMonivalinta(mv.dataset.mv, Number(mv.dataset.i), mv);
  if(v){
    const h=D.harjoitukset.find(x=>x.id===v.dataset.vinkki);
    const fb=document.getElementById("fb-"+h.id);
    fb.className="fb hint"; fb.textContent=h.vinkki;
  }
});
document.getElementById("harjoitukset").addEventListener("keydown",e=>{
  if(e.key==="Enter" && e.target.id.startsWith("in-")){ e.preventDefault(); tarkista(e.target.id.slice(3)); }
});

} // ONKO_HARJOITUKSIA

if(ONKO_HARJOITUKSIA) paivitaEdistyminen();
